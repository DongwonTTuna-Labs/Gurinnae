name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Reject forbidden production constructs and leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'todo!\(|unimplemented!\(|panic!\(|unsafe[[:space:]]*\{' -- crates services xtask; then
            exit 1
          fi
          if git grep -nEI \
            '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,})' \
            -- . ':(exclude)specs/**' ':(exclude)tests/**' ':(exclude)docs/**' \
            ':(exclude)services/oidc-test-provider/src/runner.rs'; then
            exit 1
          fi
          test "$(git grep -h -c 'BEGIN[[:space:]]RSA[[:space:]]PRIVATE[[:space:]]KEY' -- services/oidc-test-provider/src/runner.rs)" -eq 1
      - name: Validate Compose isolation and immutable image pins
        run: |
          docker compose --profile test --file compose.production.yaml config --quiet
          test "$(grep -c '@sha256:' infra/images.lock)" -eq 8
          test "$(docker compose --profile test --file compose.production.yaml config --services | wc -l)" -eq 20
      - name: Run assertion, IDOR, replay, and negative runtime gates
        run: |
          bash scripts/test-submission-flow.sh
          bash scripts/test-analysis-negative-runtime.sh
          bash scripts/test-worker-failure-runtime.sh
