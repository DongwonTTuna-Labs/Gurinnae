forbidden:
- domain -> Actix/SQLx/provider SDK/environment
- public-api -> editorial write repository
- browser bundle -> control/submission generated client or secret
- service -> another service database role
- first-party unsafe Rust or direct FFI
- cyclic crate dependencies
