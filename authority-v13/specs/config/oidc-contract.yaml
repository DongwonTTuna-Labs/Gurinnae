schema_version: 3
specification_version: 13.0.0
status: FINAL
protocol: OpenID Connect Authorization Code with PKCE
authority: Review Console SvelteKit BFF owns browser-facing redirects and cookie emission; private Rust Identity API owns transaction/session
  creation, protocol validation, persistence and action-bound proof issuance.
cookies:
  login_transaction:
    name: gurine_oidc_transaction
    httpOnly: true
    secure_in_production: true
    sameSite: Lax
    max_age_seconds: 600
    path: /auth/callback
    domain: absent-host-only
    clear_with_exact_path: true
  step_up_transaction:
    name: gurine_step_up_transaction
    httpOnly: true
    secure_in_production: true
    sameSite: Lax
    max_age_seconds: 600
    path: /auth/step-up/callback
    domain: absent-host-only
    clear_with_exact_path: true
    container: authenticated-encrypted BFF cookie envelope
    sealed_payload:
    - transactionCookieValue
    - idempotencyKey
    - actionDigest
    - issuedAt
    - expiresAt
    cryptography_contract: specs/cryptography/step-up-transaction-envelope.yaml
  internal_session:
    name: gurine_internal_session
    httpOnly: true
    secure_in_production: true
    sameSite: Lax
    idle_timeout_minutes: 30
    absolute_timeout_hours: 12
    path: /
    domain: absent-host-only
    clear_with_exact_path: true
    container: authenticated-encrypted BFF cookie envelope
    sealed_payload:
    - v
    - typ
    - opaqueIdentitySessionToken
    - csrfToken
    - issuedAt
    - absoluteExpiresAt
    - csrfRotatedAt
    plaintext_identity_session_token_in_browser: false
    canonical_payload_schema: specs/cryptography/session-cookie-payload.schema.json
    authority_note: sessionId/userId are not authoritative cookie fields; Identity API resolves the opaque token on every authenticated
      BFF request
    payload_schema: specs/cryptography/session-cookie-payload.schema.json
    authority: opaqueIdentitySessionToken is the only browser-carried proof of the Identity API session; sessionId/userId are never
      authoritative cookie claims.
  step_up_authorization:
    name: gurine_step_up_authorization
    httpOnly: true
    secure_in_production: true
    sameSite: Strict
    max_age_seconds: 300
    maximum_actor_assertion_issues: 3
    path: /internal
    domain: absent-host-only
    clear_with_exact_path: true
    container: authenticated-encrypted BFF cookie envelope
    cryptography_contract: specs/cryptography/step-up-authorization-envelope.yaml
    sealed_payload:
    - authorizationId
    - authorizationToken
    - actionDigest
    - idempotencyKey
    - idempotencyKeySha256
    - issuedAt
    - expiresAt
    - maxAssertionIssues
flows:
  login_start:
    operation_id: startOidcLogin
    route: /auth/login
    method: GET
    authentication: anonymous
    inputs:
    - name: returnTo
      required: false
      validation: same-origin allowlisted internal path
    effects:
    - generate state, nonce and PKCE verifier
    - persist LOGIN transaction with encrypted verifier and safe return target
    - set login transaction cookie
    - redirect to issuer authorization endpoint
    negative_tests:
    - external return target
    - scheme-relative target
    - missing discovery
    - cookie replay
  login_callback:
    operation_id: completeOidcCallback
    route: /auth/callback
    method: GET
    authentication: login transaction cookie
    inputs:
    - code
    - state
    - optional iss
    effects:
    - lock and consume LOGIN transaction once
    - verify state, issuer, nonce and PKCE
    - exchange authorization code through OIDC egress
    - map verified subject to active user
    - create opaque internal session
    - clear transaction cookie
    - redirect to stored safe return target
    - generate a 256-bit synchronizer CSRF token and persist only its hash in ops.sessions
    - seal the opaque identity session token and plaintext CSRF token into gurine_internal_session with Path=/
    negative_tests:
    - state mismatch
    - issuer mismatch
    - nonce mismatch
    - expired transaction
    - consumed transaction
    - disabled user
  step_up_start:
    operation_id: startStepUpAuthentication
    route: /auth/step-up/start
    method: POST
    authentication: active internal session + CSRF
    inputs:
    - returnTo
    - actionDescriptor
    - csrfToken
    effects:
    - lock active session and validate synchronizer CSRF
    - generate a cryptographically random Idempotency-Key before redirect
    - construct ActionAuthorizationContext from the typed action descriptor and Idempotency-Key hash
    - compute the canonical action digest in the BFF and revalidate it in Identity API
    - generate state, nonce and PKCE
    - persist STEP_UP transaction bound to session, action context, action digest and Idempotency-Key hash
    - seal the private transaction token, raw Idempotency-Key and action digest into gurine_step_up_transaction
    - redirect with max_age/acr request
    negative_tests:
    - session mismatch
    - unsafe return target
    - invalid action descriptor
    - CSRF failure
    - noncanonical action digest
    - Idempotency-Key hash mismatch
  step_up_callback:
    operation_id: completeStepUpAuthentication
    route: /auth/step-up/callback
    method: GET
    authentication: active internal session + step-up transaction cookie
    inputs:
    - code
    - state
    - optional iss
    effects:
    - lock and consume STEP_UP transaction once
    - verify session binding, state, issuer, nonce, PKCE and canonical action context
    - record step-up time
    - create a five-minute bounded step-up authorization with at most three Actor Assertion issues
    - clear step-up transaction cookie
    - redirect to stored safe return target
    - rotate the session CSRF token through ops.rotate_session_csrf
    - return the new plaintext CSRF token only to the Review Console BFF
    - verify the returned Idempotency-Key hash against the sealed transaction cookie
    - reseal gurine_internal_session and set gurine_step_up_authorization with Path=/internal
    negative_tests:
    - different session
    - different action digest
    - Idempotency-Key hash mismatch
    - expired transaction
    - replay
    - insufficient acr
  logout:
    operation_id: logoutInternalSession
    route: /auth/logout
    method: POST
    authentication: active session + CSRF
    effects:
    - revoke current session
    - clear session and step-up authorization cookies
    - clear gurine_internal_session with Path=/
    - clear gurine_step_up_authorization with Path=/internal
    - clear any outstanding transaction cookies with their exact callback paths
return_target_policy:
  allowed: relative path beginning with /internal or configured review-console route
  forbidden:
  - absolute URL
  - scheme-relative URL
  - userinfo
  - fragment-only target
  - encoded path escape
  default: /internal
csrf:
  strategy: SYNCHRONIZER_TOKEN_IN_SEALED_BFF_SESSION
  generation:
    owner: Private Rust Identity API
    entropy_bits: 256
    encoding: base64url-without-padding
  persistence:
    database: only SHA-256 hash in ops.sessions.csrf_token_hash
    browser: plaintext token only inside authenticated-encrypted HttpOnly gurine_internal_session envelope
    forbidden:
    - readable CSRF cookie
    - localStorage
    - sessionStorage
    - URL
    - logs
    - analytics
  presentation:
    ssr_forms: Review Console BFF injects the token into a hidden csrfToken field
    non_form_requests: X-Gurine-CSRF header populated by first-party BFF code from the sealed session envelope
  validation:
  - BFF compares submitted token with the sealed session token using constant-time comparison
  - Identity API compares SHA-256(token) with ops.sessions.csrf_token_hash for session-sensitive internal operations
  - Control API is not browser-addressable and trusts only a short-lived signed actor assertion from the BFF
  rotation:
    on_login: generate and store a new token/hash
    on_successful_step_up: rotate the token/hash and reseal gurine_internal_session
    on_explicit_session_renewal: rotate the token/hash and reseal gurine_internal_session
    on_logout: revoke the session and clear session/proof/transaction cookies
  multi_tab_behavior: A rotation invalidates stale forms in other tabs; the BFF returns CSRF_TOKEN_STALE and those tabs reload
    before resubmission.
  failure: Reject before any domain command, do not consume idempotency or step-up authorization, and return a typed 403 problem.
session_storage:
  table: ops.sessions
  identity_session_token: store SHA-256 hash only
  csrf_token: store SHA-256 hash only
  absolute_expiry: ops.sessions.expires_at
  idle_expiry: enforced by Identity API using last successful resolution/activity evidence
  revocation: ops.sessions.revoked_at
  bff_cookie_payload: v, typ, opaqueIdentitySessionToken, csrfToken, issuedAt, absoluteExpiresAt, csrfRotatedAt
internal_assertions:
  authority: specs/auth/assertion-contract.yaml
  review_console_to_identity_api: X-Gurine-Service-Assertion
  identity_api_to_control_api: X-Gurine-Actor-Assertion
  control_api_browser_cookie_access: false
  control_api_csrf_validation: false
  bff_sequence:
  - validate synchronizer CSRF against the sealed BFF session
  - build exact downstream method/path/query/body request binding
  - call Identity API with a single-use service assertion
  - receive a single-use request-bound actor assertion
  - call Control API with X-Gurine-Actor-Assertion
  actor_assertion_operation: issueActorAssertion
  session_resolution_issues_assertion: false
authorization_claiming:
  owner: identity-api only
  raw_authorization_to_control_api: false
  callback_result: bounded stepUpAuthorizationToken bound to session/actionDigest/idempotencyKeySha256
  actor_assertion_issuance: issueActorAssertion atomically claims one of three issue slots
  retry: same exact Idempotency-Key and request bytes; fresh assertion JTI; maximum three issues in five minutes
  close: closeStepUpAuthorization after terminal receipt or automatic expiry
