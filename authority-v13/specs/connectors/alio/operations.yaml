schema_version: 2
specification_version: 13.0.0
connector_id: alio
operations:
- id: alio-manifest
  kind: manifest
  method: GET
  url_env: ALIO_OFFICIAL_MANIFEST_URL
  request_parameters: []
  pagination:
    strategy: manifest-documents-array
  remote_identity:
    strategy: manifest-field
    primary_fields:
    - external_id
  remote_revision:
    strategy: manifest-field
    fields:
    - revision
    - sha256
  response_contract: ../official-manifest.schema.json
  checkpoint:
    strategy: manifest-generated-at-and-sha256
    partition: alio-manifest
  deletion_semantics: manifest deleted=true or two-pass reconciliation
  retry: &id001
    quota_or_429: honor Retry-After; otherwise bounded exponential backoff with jitter
    transient_5xx: bounded exponential backoff then source incident
    auth_or_permission: disable connector and open incident
    malformed_payload: store raw bytes, quarantine record, open schema-drift incident
- id: alio-document
  kind: document
  method: GET
  url_source: manifest.documents[].url
  request_parameters: []
  pagination:
    strategy: manifest-order
  remote_identity:
    strategy: manifest-field
    primary_fields:
    - external_id
  remote_revision:
    strategy: manifest-field-or-content-hash
    fields:
    - revision
    - sha256
  response_contract: raw bytes matching manifest content_type and optional sha256
  checkpoint:
    strategy: document-id-revision
    partition: alio-document
  deletion_semantics: manifest deleted=true creates tombstone; absence alone requires two successful reconciliations
  retry: *id001
