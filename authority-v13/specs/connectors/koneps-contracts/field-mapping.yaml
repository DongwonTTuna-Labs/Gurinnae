schema_version: 2
specification_version: 13.0.0
connector_id: koneps-contracts
mapping_mode: alias-list-validated-by-preflight
canonical_fields:
- canonical: source.external_id
  paths:
  - untyCntrctNo
  - cntrctNo
  required: true
- canonical: source.revision
  paths:
  - cntrctChgOrd
  - chgDt
  - rgstDt
  fallback: canonical-content-sha256
  required: true
- canonical: contract.title
  paths:
  - cntrctNm
  required: true
- canonical: contract.contract_number
  paths:
  - untyCntrctNo
  - cntrctNo
  required: true
- canonical: contract.amount
  paths:
  - thtmCntrctAmt
  - totCntrctAmt
  - cntrctAmt
  required: false
- canonical: contract.signed_at
  paths:
  - cntrctCnclsDate
  - cntrctDt
  required: false
- canonical: agency.name
  paths:
  - cntrctInsttNm
  - dminsttNm
  required: true
- canonical: agency.identifier
  paths:
  - cntrctInsttCd
  - dminsttCd
  required: false
- canonical: supplier.name
  paths:
  - corpNm
  - cntrctCorpNm
  required: false
- canonical: supplier.identifier
  paths:
  - bizno
  - corpBizno
  sensitive: hash-or-mask
  required: false
- canonical: notice.external_id
  paths:
  - bidNtceNo
  required: false
unknown_field_policy: preserve raw payload and provenance
missing_required_policy: quarantine record and open data-quality incident
preflight: A live recorded sample must resolve every required canonical field for every enabled operation.
