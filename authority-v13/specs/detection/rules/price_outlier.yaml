schema_version: 1
specification_version: 13.0.0
status: FINAL
rule_id: PRICE_OUTLIER
name: 가격 이상치
version: 1.0.0
required:
- target.id
- target.unit_price
- target.unit
- target.category
- target.vat_included
- target.bundle_known
- target.observed_at
- comparables
thresholds:
  minimum_comparables: 8
  ratio_gte: '3.0000'
  date_window_days: 365
formula: ratio = target.unit_price / median(compatible comparable.unit_price)
blockers:
- REQUIRED_FIELD_MISSING
- INSUFFICIENT_COMPARABLES
- TARGET_BUNDLE_UNKNOWN
- TARGET_VAT_UNKNOWN
metamorphic:
- input order does not change result
- duplicate source_key does not change cohort
- incompatible unit never enters cohort
output:
  outcomes:
  - SIGNAL
  - NO_SIGNAL
  - BLOCKED
  ratio_precision: 4
  money_unit: KRW integer
  publication_claim_allowed: false
implementation: crates/detection/src/rules/price_outlier.rs
reference_evaluator: specs/detection/reference_evaluator.py
