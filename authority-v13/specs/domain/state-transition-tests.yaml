schema_version: 1
specification_version: 13.0.0
status: FINAL
rules:
- Every declared transition has an executable positive case.
- Every declared transition has capability and guard denial cases.
- Cross-axis invariants are executable and cannot be inferred from UI state.
positive_transition_cases:
- id: allow-detect-signal-signal_detected
  from: SIGNAL_DETECTED
  to: TRIAGE
  capability: signals.triage
  guards:
    at_least_one_signal: true
  expected: ALLOW
  audit_action: case.triage.started
  domain_events:
  - case.state_transitioned.v1
- id: allow-begin-investigation-triage
  from: TRIAGE
  to: INVESTIGATING
  capability: cases.investigate
  guards:
    triage_decision_investigate: true
    assigned_investigator: true
  expected: ALLOW
  audit_action: case.investigation.started
  domain_events:
  - case.state_transitioned.v1
- id: allow-request-response-investigating
  from: INVESTIGATING
  to: AWAITING_RESPONSE
  capability: responses.request
  guards:
    validated_response_request: true
    due_at_in_future: true
  expected: ALLOW
  audit_action: case.response.awaited
  domain_events:
  - case.state_transitioned.v1
- id: allow-resume-investigation-awaiting_response
  from: AWAITING_RESPONSE
  to: INVESTIGATING
  capability: cases.investigate
  guards:
    response_received_or_deadline_handled: true
  expected: ALLOW
  audit_action: case.investigation.resumed
  domain_events:
  - case.state_transitioned.v1
- id: allow-submit-editorial-review-investigating
  from: INVESTIGATING
  to: EDITORIAL_REVIEW
  capability: review.editorial
  guards:
    claims_valid: true
    evidence_verified: true
    response_policy_satisfied: true
  expected: ALLOW
  audit_action: case.editorial_review.started
