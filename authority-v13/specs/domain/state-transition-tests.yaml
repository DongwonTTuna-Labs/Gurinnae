cross_axis_cases:
- id: deny-published-before-ready
  investigation_state: INVESTIGATING
  publication_state: PUBLISHED_ANOMALY
  resolution_code: NONE
  expected: DENY
  violates: publication-needs-ready-or-closed
- id: allow-ready-unpublished
  investigation_state: READY_TO_PUBLISH
  publication_state: NEVER_PUBLISHED
  resolution_code: NONE
  expected: ALLOW
- id: allow-closed-explained
  investigation_state: CLOSED
