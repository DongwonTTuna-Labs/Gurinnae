separation_of_duties:
- id: SOD-001
  rule: A material claim author cannot be the independent editorial approver of the same review snapshot.
  roles:
  - INVESTIGATOR
  - EDITOR
- id: SOD-002
  rule: An investigator or editor cannot publish without a valid independent review.
  roles:
  - INVESTIGATOR
  - EDITOR
  - PUBLISHER
- id: SOD-003
  rule: A rule version proposer cannot be the sole production activation approver.
  roles:
  - RULE_ANALYST
  - EXECUTIVE_APPROVER
- id: SOD-004
  rule: A user cannot approve a grant that changes their own roles.
  roles:
  - ACCESS_ADMIN
  - SECURITY_ADMIN
- id: SOD-005
  rule: Broad kill switches require two distinct approvers.
  roles:
  - SECURITY_ADMIN
  - OPERATIONS
  - EXECUTIVE_APPROVER
critical_command_requirements:
- exact target and immutable version/snapshot
- impact summary
- structured reason code and note
- recent step-up authentication
- expected_version
- Idempotency-Key
- server-side policy re-evaluation
- immutable audit event and receipt
break_glass:
  allowed: true
  requirements:
  - incident_id
  - minimum_scope
  - short_expiry
  - strong_reauth
  - security_notification
  - full_audit
  - post_incident_review
screen_action_validation: Every non-none action capability in screen-catalog.yaml must exist in this file.
