schema_version: 1
specification_version: 13.0.0
principles:
- Server authorization is authoritative; UI visibility is only a hint.
- Role grants should be scoped and expiring where possible.
- Commands whose assurance level is STEP_UP require recent reauthentication, reason, expected version where applicable, idempotency and audit receipt. Destructive confirmation is a separate UI concern.
- Separation of duties is evaluated for each target snapshot or change, not only by static role names.
