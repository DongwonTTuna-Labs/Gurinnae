schema_version: 1
specification_version: 13.0.0
principles:
- Audit logs and product analytics are separate systems.
- No third-party analytics on Response Portal.
- Public interest in a case is not a long-term personal profile.
- Core tasks work when analytics is unavailable.
common_forbidden:
- request/response body
- tokens
- credentials
- file names
- private evidence locators
- personal email
- unredacted search query
event_count: 233
events:
- name: internal.access_request.created
  consumers:
  - ACC-001
  sensitivity: internal-operational
  purpose: Measure task progression, quality or recovery for the listed screens.
  allowed_properties:
  - screen_id
  - surface
  - app_version
  - specification_version
  - viewport_class
  - success
  - error_code
  - internal_object_type
  - workflow_stage
  - result_code
  - duration_bucket
  - role_category
  forbidden_properties:
  - email
  - response_token
  - access_token
  - answer_body
  - correction_body
  - filename
  - private_case_title
  - raw_search_query
  - full_ip
  retention: Product analytics retention must be approved; response events use the shortest retention.
