  - ready
  - no-access
  - conflict
  - reauth-required
  - receipt
  accessibility:
  - role matrix has row and column headers
  - changes summarized before submit
  - focus moves to receipt
  rules:
  - Role visibility is not authorization.
  - High-risk role changes require step-up and reason.
  - Break-glass is visually distinct and time-bounded.
  status: FINAL
  implementation_requirements:
  - Uses semantic design tokens only.
  - Has Storybook-or-equivalent isolated examples for every declared state.
  - Has unit/component tests for keyboard and state behavior.
  - Does not accept raw internal DTOs on public surfaces.
