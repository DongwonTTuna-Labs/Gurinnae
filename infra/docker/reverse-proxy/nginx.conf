events {}
http {
  server_tokens off;
  log_format gurine_safe '$request_id $remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /var/log/nginx/access.log gurine_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'" always;
  server {
    listen 8080;
    location / {
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://public-web:3000;
    }
  }
}
