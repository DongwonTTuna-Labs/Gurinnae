specification_version = "13.0.0"
status = "FINAL"
rust = "1.97.0"
edition = "2024"

[workspace]
resolver = "3"
unsafe_code = "forbid"

[dependencies]
actix-web = "=4.14.0"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs", "process"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "rust_decimal", "migrate", "macros"] }
utoipa = { version = "=5.5.0", features = ["actix_extras", "uuid", "time", "decimal", "openapi_extensions"] }
utoipa-actix-web = "=0.1.2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
thiserror = "=2.0.16"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
time = { version = "=0.3.41", features = ["serde", "formatting", "parsing"] }
rust_decimal = { version = "=1.37.2", features = ["serde-with-str"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
secrecy = { version = "=0.10.3", features = ["serde"] }
url = "=2.5.7"
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls", "http2", "json", "stream", "gzip", "brotli"] }

openidconnect = "=4.0.1"
chacha20poly1305 = "=0.11.0"
base64 = "=0.22.1"
zeroize = "=1.9.0"
subtle = "=2.6.0"
getrandom = "=0.4.3"
object_store = "=0.14.0"
lettre = "=0.11.22"
opentelemetry = "=0.32.0"
opentelemetry_sdk = "=0.32.0"
opentelemetry-otlp = "=0.32.0"
calamine = "=0.35.0"
quick-xml = "=0.41.0"
zip = "=8.6.0"
csv = "=1.4.0"
lopdf = "=0.43.0"
pdf-extract = "=0.10.0"
clamd-client = "=0.1.2"

[dev-dependencies]
proptest = "=1.7.0"
insta = { version = "=1.43.1", features = ["json", "yaml"] }
wiremock = "=0.6.5"

[policy]
cargo_lock_required = true
cargo_deny_required = true
cargo_audit_required = true
cargo_geiger_first_party_zero_required = true
clean_resolution_evidence_required = true
