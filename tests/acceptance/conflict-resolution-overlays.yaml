rules:
  - Base feature and scenario bytes are immutable; an overlay changes only the effective executable oracle.
  - Every overlay is addressed by one existing base scenario ID and one recorded SPEC-CONFLICT.
  - An overlay cannot delete, rename, skip, weaken, or double-count a base scenario.
  - The effective registry must execute every overlaid scenario exactly once and retain both the base text digest and overlay digest in its receipt.

