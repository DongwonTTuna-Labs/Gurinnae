schema_version: 2
owner_addendum: specs/product/owner-addendum-2026-07-14.yaml
status: REVIEW_REQUIRED
binding_count: derived as len(bindings)
aggregate_alias_count: 23
rules:
  - Each noun has one canonical type and owner; prose cannot create runtime state.
  - Existing v13 state machines and guards are imported without reinterpretation.
  - Every persisted mutation uses expected version, idempotency scope, audit and declared events.
  - No serde_json::Value, string dispatch or response materializer substitutes for a typed contract.

