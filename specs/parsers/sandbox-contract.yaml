schema_version: 1
specification_version: 13.0.0
status: FINAL
network: none
filesystem: read-only input and empty writable tmpfs; parent service alone accesses object storage
process:
  uid: non-root
  no_new_privileges: true
  seccomp: deny socket, mount and ptrace
  max_children: 4
limits:
  input_bytes: 104857600
  pages: 1000
  pixels_per_page: 250000000
  zip_entries: 10000
  zip_uncompressed_bytes: 536870912
  zip_ratio: 100
  xml_depth: 64
  extracted_text_bytes: 52428800
  wall_seconds: 60
  cpu_seconds: 45
  memory_bytes: 1073741824
  file_descriptors: 64
rejections:
- ENCRYPTED_DOCUMENT
- BINARY_HWP_UNSUPPORTED_REQUIRES_TRUSTED_CONVERSION
- OOXML_EXTERNAL_RELATIONSHIP
- PDF_TRUNCATED_OR_INVALID
- PIXEL_LIMIT
- SIZE_LIMIT
- TIMEOUT
- TOO_MANY_PAGES
- UNSUPPORTED_MEDIA_TYPE
- XML_DTD_OR_ENTITY
- ZIP_BOMB
- ZIP_DUPLICATE_ENTRY
- ZIP_PATH_TRAVERSAL
- ZIP_SYMLINK_ENTRY
archive_rules:
  duplicate_entry: reject
  symlink_or_hardlink: reject
  external_relationship: reject
  path_normalization: PurePosixPath; absolute and .. rejected
ocr:
  languages:
  - kor
  - eng
  image_format: PNG
  dpi: 300
  tsv_required: true
  confidence_range: 0..100; negative means non-word and is discarded
