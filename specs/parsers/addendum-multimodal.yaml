runtime_acceptance:
- All seven embedded byte payloads pass base64, byte length, SHA-256, magic/structure, real decoder, extraction, closed output
  decode, and expected oracle comparison; WAV/WebM cannot pass until every OPEN_IMPLEMENTATION artifact is bound to and verified against the exact final OCI digest.
- Before any WAV/WebM test is counted, image preflight verifies the FFmpeg 8.0.1 source and binary hashes, exact configure flags and enabled component inventory, LGPL-2.1-or-later license-only result, SPDX SBOM, and network protocol count zero.
- The same immutable WAV/WebM bytes are probed and decoded only through bounded pipe stdin; seccomp or network-namespace evidence records zero socket/connect/DNS activity, and timeout/cancellation tests prove complete child-group kill and reap.
- Each image format is decoded independently; transcoding one fixture into another before parser selection is forbidden.
- Every negative_fixture_manifest entry runs against the production adapter. Corrupt/truncated/unsupported/limit media fails with
  the exact typed rejection and zero partial segments, shots, tables, links, source uses, or Evidence.
- HTML script in the golden fixture is not executed, no subresource is requested, the active content warning is present, and
  the table/link locators reopen the exact source bytes.
- PNG/JPEG/WebP/TIFF normalized text is exact; word and line locators are in bounds; confidence below the oracle floor fails
  rather than being replaced.
- WAV silence yields exact metadata, SILENCE_CONFIRMED and zero transcript/speaker. Every supported non-silent WAV/WebM
  invokes the pinned whisper.cpp path and yields either timestamped ko/en transcript segments or one typed abstention with zero
  fabricated text. WebM without audio still yields deterministic visual shots, representative-keyframe OCR and explicit
  AUDIO_STREAM_ABSENT.
- VLM and future diarization run only after their separate activation gates. VLM output remains proposal-only and every result
  carries region/time locators, confidence, source/parser/model/config/rights/source-use/provider receipt digests. Speaker stays
  null until positive diarization evidence exists.
- The document-extractor repository stores the exact input, extraction, segment, locator, parser, traineddata, rights, and
  scan digests; deleting any required field makes the round-trip test fail.
semantic_acceptance_fixtures:
  source_rule: Fixtures are generated from checked-in lossless source specifications by a hash-pinned offline fixture builder, then exact media bytes and expected semantic manifests are checked into the source tree; production code cannot read fixture IDs or expected output.
  required:
    - id: multimodal-wav-ko-en-speech
      content: one Korean sentence followed by one English sentence with 500 ms digital silence between them; no names or real entities
      oracle: TRANSCRIBED, both language spans searchable, half-open timestamps in decoded bounds, confidence >= 5500, model/config/input/output digest parity, speaker null, identical rerun bytes
    - id: multimodal-wav-two-voices
      content: two synthetic voices alternate short non-identifying Korean and English sentences without overlapping speech
      oracle: both utterances are timestamped and searchable; while diarization is NOT_ACTIVATED every speaker label/confidence is null and no voice identity is inferred; a future activated diarization adapter must use this same source with a separately pinned speaker-segment oracle
    - id: multimodal-wav-nonspeech-low-confidence
      content: deterministic tones and bounded noise without speech
      oracle: NON_SPEECH or LOW_CONFIDENCE, zero transcript text/segments, one ASR receipt, zero Evidence/proposal
    - id: multimodal-webm-three-shots-narrated
      content: three >= 700 ms synthetic scenes with distinct colors/shapes, visible Korean/English labels and non-silent narration
      oracle: exactly three deterministic shot ranges, one representative frame and OCR set per shot, timestamped transcript, region/time locators, structural and ASR digest stability; VLM is PROPOSED only when activated and otherwise explicit NOT_ACTIVATED/POLICY_BLOCKED
    - id: multimodal-media-rights-denied
      content: the same three-shot bytes with model_use denied
      oracle: structural shots/OCR/ASR follow their own allowed rights, VLM provider calls zero, state POLICY_BLOCKED, VLM proposal/Evidence zero
    - id: multimodal-media-provider-ambiguous
      content: activated VLM request whose provider accepts then the connection closes
      oracle: no fallback, one reservation, RECONCILIATION_REQUIRED, zero duplicated request or proposal until authenticated reconciliation
  executable_ids: [AC-AI_MULTIMODAL_ADDENDUM-021,AC-AI_MULTIMODAL_ADDENDUM-022,AC-AI_MULTIMODAL_ADDENDUM-023,AC-AI_MULTIMODAL_ADDENDUM-024,AC-AI_MULTIMODAL_ADDENDUM-025,AC-AI_MULTIMODAL_ADDENDUM-026]
integration_updates_required:
- Add exactly the seven locked format IDs to parser-catalog.yaml; copy existing exact HTML/image pins and the design-complete FFmpeg adapter contract, while retaining OPEN_IMPLEMENTATION until binary/SBOM/license/build/preflight receipts and the final OCI digest are real and verified.
- Extend extraction-result.schema.json and Rust/SQLx types with the closed v2 metadata, segment, locator, warning, and digest
  fields.
- Extend reference_harness.py or replace it with an equivalent non-production harness that materializes and validates these
  embedded fixtures while still invoking production binaries.
- Register seven additive fixture/scenario IDs and fourteen negative fixture IDs in acceptance catalog, executable mapping, traceability, MANIFEST, and the aggregate
  hard gate.
