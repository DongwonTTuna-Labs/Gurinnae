negative_fixture_manifest:
  execution_rule: Each mutation is applied byte-for-byte to its named embedded positive source in a fresh directory, its mutated SHA-256 is recorded by the harness, and the production parser must return the exact outcome with zero partial segment/shot/table/link/evidence rows.
  fixtures:
  - {fixture_id: negative-html-active-fetch, source_fixture_id: multimodal-html-contract-42, mutation: retain embedded script and absolute HTTPS link while network namespace has no route, expected_status: EXTRACTED, expected_warning: ACTIVE_CONTENT_IGNORED, expected_external_requests: 0}
  - {fixture_id: negative-html-depth-limit, source_fixture_id: multimodal-html-contract-42, mutation: replace body with 257 deterministic nested div elements, expected_status: REJECTED, expected_rejection: HTML_DEPTH_LIMIT}
  - {fixture_id: negative-png-truncated, source_fixture_id: multimodal-png-contract-42, mutation: remove final 13 bytes, expected_status: REJECTED, expected_rejection: MALFORMED_IMAGE}
  - {fixture_id: negative-png-pixel-limit, source_fixture_id: multimodal-png-contract-42, mutation: rewrite IHDR width/height beyond image_total_pixels and recompute only IHDR CRC, expected_status: REJECTED, expected_rejection: IMAGE_PIXEL_LIMIT}
  - {fixture_id: negative-jpeg-truncated, source_fixture_id: multimodal-jpeg-contract-42, mutation: remove final EOI marker, expected_status: REJECTED, expected_rejection: MALFORMED_IMAGE}
  - {fixture_id: negative-jpeg-dimension-limit, source_fixture_id: multimodal-jpeg-contract-42, mutation: rewrite SOF dimensions to 30001x100 without adding scan bytes, expected_status: REJECTED, expected_rejection: IMAGE_DIMENSION_LIMIT}
