normalization:
  unicode: NFC
  newlines: LF
  html_whitespace: collapse horizontal runs outside pre/code/table cells; preserve semantic block boundaries
  ocr_text: TSV word order by page, line, word; join words with one space and lines with LF; negative-confidence nonwords
    discarded
  stable_segment_id: first 24 hex of SHA-256(documentSha256 + NUL + locatorKind + NUL + locatorValue + NUL + normalizedText)
  confidence: integer basis points 0..10000; missing confidence is null and never synthesized
  orientation: apply only format-declared orientation before dimensions, OCR, and bbox; persist applied transform
  audio_time: integer milliseconds, half-open, monotonic, in decoded stream bounds; no wall-clock inference
  video_time: integer milliseconds, half-open, monotonic, in decoded container bounds; shot boundaries are deterministic for a pinned adapter/config
  speaker_label: null unless the pinned parser records positive diarization evidence and confidence; channel number alone is not a person label
golden_oracle:
  fixture_count: 7
  transport: Each source embeds exact bytes as base64. Verification strips ASCII whitespace, decodes into a fresh empty directory,
    verifies byte_length and sha256, then invokes the production parser.
  expected_rule: Compare every exact field and declared bounded field. Undeclared output fields, extra warnings, missing locators,
    name/digest shortcuts, or fixture-specific branches fail.
  production_rule: No production code may import this YAML, fixture IDs, expected text, or fixture hashes. Only the test harness
    materializes the embedded bytes.
