schema_version: 1
specification_version: 13.0.0+agent-multimodal.2
status: REVIEW_REQUIRED
decision_state: DECISION_COMPLETE_AWAITING_INDEPENDENT_REVIEW
title: HTML, image, WAV audio, and WebM video parser additive contract
scope:
  authority: DESIGN.md section 8.4
  additive_format_ids:
  - html
  - png
  - jpeg
  - webp
  - tiff
  - wav
  - webm
  additive_format_count: 7
  additive_format_registry_gate:
    exact_ordered_ids:
    - html
    - png
    - jpeg
    - webp
    - tiff
    - wav
    - webm
    count_must_equal: 7
    missing_duplicate_or_unknown_id: HARD_FAIL
  base_v13_formats_remain_required: true
  effective_format_count: 15
  audio_and_video: DESIGN_COMPLETE_OPEN_IMPLEMENTATION_SUPPORT_CLAIM_BLOCKED
global_rules:
- Magic bytes and decoded structure are authority; filename extension and declared Content-Type are hints only.
- Every input is immutable, hash-pinned, scanned, rights-bound, and processed with network disabled in the document-extractor
  sandbox.
- HTML scripts, styles, forms, active elements, event handlers, external entities, and subresources are never executed or
  fetched.
- Image decoding applies dimensions, frame, total-pixel, allocation, wall-time, CPU, and memory limits before OCR.
- OCR output is untrusted derived text. It retains exact asset revision/hash, pixel locator, engine/traineddata versions,
  confidence, and warnings.
- WAV decoding preserves container/sample/channel/duration metadata; silence is recorded as silence and never fabricated as speech.
- WebM decoding preserves container/stream metadata and executes the visual path even without a usable audio stream; absent audio is explicit and never synthesized.
- Audio transcript, speaker label, video caption, visual observation, and table observation are untrusted derived proposals. Speaker labels require parser evidence; VLM observations additionally require current model-use rights and provider/classification activation.
- A fixture is an input and expected oracle only. Production and acceptance invoke the same Rust parser/OCR runtime and persistence
  path; returning fixture output by name or digest is forbidden.
runtime_bom_additive:
  rust_crates:
  - name: html5ever
    version: 0.39.0
    package_sha256: 46a1761807faccc9a19e86944bbf40610014066306f96edcdedc2fb714bcb7b8
    rust_version_minimum: 1.71.0
    features: []
    purpose: standards-conforming nonexecuting HTML tokenizer/tree builder
  - name: image
    version: 0.25.10
    package_sha256: 85ab80394333c02fe689eaf900ab500fbd0c2213da414687ebf995a65d5a6104
    rust_version_minimum: 1.88.0
    default_features: false
    features:
    - png
    - jpeg
    - webp
    - tiff
    purpose: bounded safe image decode and pixel normalization
  external_tools:
  - name: tesseract
    version: 5.5.0
    invocation: tokio::process child; TSV output; no first-party FFI
    languages:
    - kor
    - eng
    traineddata_authority: specs/parsers/runtime-bom.yaml
  - name: ffmpeg
    version: 8.0.1
    adapter_id: gurinnae-ffmpeg-subprocess-media-v1
    purpose: bounded local WAV and WebM probe/decode through ffprobe and ffmpeg child processes
    official_source:
      url: https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz
      sha256: 05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41
      signature_or_hash_policy: HTTPS is transport only; the exact lowercase SHA-256 is the source identity and mismatch is a build hard failure.
    license_policy:
      effective_license: LGPL-2.1-or-later
      gpl_components: FORBIDDEN
      version3_components: FORBIDDEN
      nonfree_components: FORBIDDEN
      external_codec_libraries: FORBIDDEN
      acceptance_evidence:
      - exact configure command and ffmpeg -buildconf output
      - ffmpeg -L output and SPDX license identifiers for every shipped component
      - SBOM showing no package or component with GPL, AGPL, LGPL-3.0-only, LGPL-3.0-or-later, or nonfree effective terms
    build_contract:
      configure_flags_exact_order:
      - --disable-everything
      - --disable-autodetect
      - --disable-network
      - --disable-gpl
      - --disable-version3
      - --disable-nonfree
      - --disable-doc
      - --disable-debug
      - --disable-devices
      - --disable-avdevice
      - --enable-small
      - --enable-static
      - --disable-shared
      - --enable-ffmpeg
      - --enable-ffprobe
      - --enable-protocol=pipe
      - --enable-demuxer=matroska,wav
      - --enable-decoder=opus,pcm_s16le,vorbis,vp8
      - --enable-parser=opus,vorbis,vp8
      - --enable-encoder=pcm_s16le,rawvideo
      - --enable-muxer=rawvideo,s16le
      - --enable-swresample
      - --enable-swscale
      enabled_component_inventory_exact:
        programs: [ffmpeg, ffprobe]
        protocols: [pipe]
        demuxers: [matroska, wav]
        decoders: [opus, pcm_s16le, vorbis, vp8]
        parsers: [opus, vorbis, vp8]
        output_only_encoders: [pcm_s16le, rawvideo]
        output_only_muxers: [rawvideo, s16le]
        conversion_libraries: [swresample, swscale]
      extra_protocol_demuxer_decoder_parser_encoder_muxer_or_external_library: ACTIVATION_HARD_FAIL
      native_codec_only: true
      network_protocol_count: 0
    codec_matrix_exact:
    - input_format_id: wav
      container: RIFF_WAVE
      demuxer: wav
      stream_cardinality: exactly one audio stream and zero video, subtitle, data, or attachment streams
      accepted_input_codecs:
      - codec: PCM_S16LE
        ffmpeg_decoder: pcm_s16le
        wave_format_tag: '0x0001'
        bits_per_sample: 16
        sample_format: signed little-endian integer
      canonical_decode_output: interleaved PCM_S16LE at the source sample rate and source channel count
    - input_format_id: webm
      container: WEBM
      demuxer: matroska
      stream_cardinality: exactly one VP8 video stream, zero or one supported audio stream, and zero subtitle, data, or attachment streams
      accepted_video_codecs:
      - codec: VP8
        codec_id: V_VP8
        ffmpeg_decoder: vp8
        canonical_decode_output: packed RGB24 in coded presentation order
      accepted_audio_codecs:
      - codec: OPUS
        codec_id: A_OPUS
        ffmpeg_decoder: opus
        canonical_decode_output: interleaved PCM_S16LE at the decoded source sample rate and channel count
      - codec: VORBIS
        codec_id: A_VORBIS
        ffmpeg_decoder: vorbis
        canonical_decode_output: interleaved PCM_S16LE at the decoded source sample rate and channel count
    invocation_contract:
      executable_resolution: absolute paths baked into the hash-pinned document-extractor image; PATH lookup is forbidden
      probe_argv_exact: [ffprobe, -v, error, -nostdin, -protocol_whitelist, pipe, -show_error, -show_format, -show_streams, -show_frames, -of, 'json=compact=1', 'pipe:0']
      wav_decode_argv_exact: [ffmpeg, -v, error, -nostdin, -threads, '1', -protocol_whitelist, pipe, -i, 'pipe:0', -map, '0:a:0', -c:a, pcm_s16le, -f, s16le, 'pipe:1']
      webm_video_decode_argv_exact: [ffmpeg, -v, error, -nostdin, -threads, '1', -protocol_whitelist, pipe, -i, 'pipe:0', -map, '0:v:0', -fps_mode, passthrough, -pix_fmt, rgb24, -f, rawvideo, 'pipe:1']
      webm_audio_decode_argv_exact: [ffmpeg, -v, error, -nostdin, -threads, '1', -protocol_whitelist, pipe, -i, 'pipe:0', -map, '0:a:0', -c:a, pcm_s16le, -f, s16le, 'pipe:1']
      immutable_input_rule: The already SHA-256-verified bytes are replayed from bounded memory to each stdin; URLs, filenames, concat manifests, playlists, devices, and child-opened input paths are forbidden.
      environment_allowlist: {LC_ALL: C, TZ: UTC}
      stdin_stdout_stderr: stdin closes after exact input bytes; stdout and stderr have precomputed byte ceilings; any extra byte, truncation, nonzero exit, signal, timeout, cancellation, or malformed probe JSON fails closed.
      process_lifecycle: Spawn in a new process group, close inherited descriptors, and kill plus reap the complete group on timeout, cancellation, or output-limit breach.
  - name: whisper.cpp
    version: 1.9.1
    commit: f049fff95a089aa9969deb009cdd4892b3e74916
    adapter_id: gurinnae-whisper-cpp-subprocess-asr-v1
    purpose: mandatory local Korean/English transcription for every supported non-silent WAV or WebM audio stream
    source:
      url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.1.tar.gz
      sha256: 147267177eef7b22ec3d2476dd514d1b12e160e176230b740e3d1bd600118447
      release_binary_reference_sha256: f3bf3b4369a99b54665b0f19b88483b30de27f25963b0414235dea03198515c5
      rule: Build from the pinned source commit in the document-extractor image; the upstream release binary hash is an independent provenance reference and is not copied into production.
    license: MIT
    model:
      model_id: whisper-large-v3-turbo-multilingual
      format: ggml
      url: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-large-v3-turbo.bin
      byte_length: 1624555275
      sha256: 1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69
      license: MIT
      languages: [ko, en]
      redistribution_and_model_card_receipt: mandatory before image admission
    build_contract:
      cpu_only: true
      network: disabled
      shared_library_install: forbidden
      gpu_and_accelerator_backends: forbidden
      first_party_ffi: forbidden
      executable: /opt/gurinnae/bin/whisper-cli
      executable_sha256: mandatory final-image evidence
      dynamic_dependency_inventory: exact final-image evidence; unlisted shared object is a hard failure
    input_contract:
      source: canonical FFmpeg decoded PCM_S16LE
      conversion: one channel is preserved; multi-channel audio is mixed to mono with checked signed integer sum divided toward zero by channel count, then encoded as 16 kHz PCM_S16LE RIFF/WAVE with exact generated-byte digest
      path: /work/asr/input.wav inside a fresh per-job tmpfs owned only by the non-root child UID
      model_path: /opt/gurinnae/models/ggml-large-v3-turbo.bin read-only
      forbidden: [source URL, original filename, prompt, prior transcript, speaker identity, network, ambient environment, writable model]
    invocation_argv_exact:
      - /opt/gurinnae/bin/whisper-cli
      - --model
      - /opt/gurinnae/models/ggml-large-v3-turbo.bin
      - --file
      - /work/asr/input.wav
      - --threads
      - '1'
      - --processors
      - '1'
      - --best-of
      - '1'
      - --beam-size
      - '1'
      - --temperature
      - '0.00'
      - --temperature-inc
      - '0.00'
      - --no-fallback
      - --output-json-full
      - --output-file
      - /work/asr/output
      - --no-prints
      - --language
      - auto
      - --no-gpu
      - --no-flash-attn
      - --suppress-nst
    output_contract:
      path: /work/asr/output.json
      max_bytes: 16777216
      language_rule: detected language must be ko or en; any other language returns UNSUPPORTED_LANGUAGE with zero transcript segment
      timestamp_rule: token and segment time is converted to half-open integer milliseconds with checked arithmetic and clipped only when it exactly equals decoded duration
      text_rule: UTF-8, NFC, LF, no translation, no prompt completion, no special-token text; empty normalized text on non-silent input is LOW_CONFIDENCE
      confidence_rule: Parse the exact JSON numeric lexemes as bounded decimal rationals; segment confidence basis points is round-half-even of the duration-weighted mean token probability times 10000. A segment below 5500 is withheld as LOW_CONFIDENCE and cannot become searchable text.
      speaker_rule: speakerLabel and speakerConfidence remain null; channel position and model text are not diarization evidence
      digest_rule: ASR receipt binds input asset/revision/content digest, generated WAV digest, executable/model/config digests, exact argv, language, ordered segment locator/text/confidence digests, start/end times and terminal state
    process_lifecycle: same new-process-group, descriptor closure, environment allowlist, bounded stdout/stderr, timeout, cancellation, kill and complete reap contract as FFmpeg; zero network/syscall capability and zero inherited credentials
  media_runtime_activation:
    decision_id: AI-R3-MULTIMODAL-FFMPEG-ADAPTER
    state: DESIGN_COMPLETE_OPEN_IMPLEMENTATION
    selected_adapter: gurinnae-ffmpeg-subprocess-media-v1 using FFmpeg 8.0.1 ffprobe and ffmpeg child processes
    runtime_support_state: NOT_IMPLEMENTED_NOT_CLAIMED
    reason: The adapter, source pin, license boundary, build surface, codec matrix, invocation, metadata, locator, and failure behavior are decision-complete; built artifacts and production-path evidence remain absent.
    implementation_boundary: Existing Rust document-extractor adapter and sandbox boundary only; production Python, first-party unsafe or FFI, network-capable child processes, path or URL input, dynamic codec discovery, and implicit external-model fallback are forbidden.
    open_implementation_evidence:
      state: OPEN_IMPLEMENTATION
      required_artifacts:
      - artifact: ffmpeg and ffprobe binary SHA-256 values
        value: null
      - artifact: canonical configure command and captured ffmpeg -buildconf output SHA-256
        value: null
      - artifact: SPDX-2.3 JSON SBOM covering source, builder image, compiler, libc, binaries, and shipped runtime files
        value: null
      - artifact: machine-verifiable license inventory and ffmpeg -L output SHA-256
        value: null
      - artifact: document-extractor image vulnerability and forbidden-license scan receipt SHA-256
        value: null
      final_document_extractor_oci_digest:
        mandatory: true
        state: OPEN_IMPLEMENTATION
        value: null
        required_pattern: '^sha256:[0-9a-f]{64}$'
        mutable_tag_is_evidence: false
      evidence_rule: Null, missing, mutable-tag-only, mismatched, or self-asserted evidence keeps runtime support and production readiness blocked.
    required_before_support_claim:
    - All OPEN_IMPLEMENTATION artifacts above are non-null, hash-verified, mutually consistent, and bound to the same final document-extractor OCI digest.
    - Image preflight proves the exact program/component inventory, build flags, LGPL-2.1-or-later effective license, and absence of GPL, version3, nonfree, external codec library, file/device, and network surfaces.
    - Real non-fixture and embedded-golden execution through the same production parser, repository, locator, rights, timeout, cancellation, and resource-limit path.
    - Every deterministic metadata, locator, concurrency, cancellation, negative fixture, and no-network gate in this file passes against the final OCI digest.
    - The pinned whisper.cpp adapter and model are installed and hash-verified; every supported non-silent stream must produce timestamped ko/en transcript segments or one explicit UNSUPPORTED_LANGUAGE, LOW_CONFIDENCE, NON_SPEECH or POLICY_BLOCKED abstention with zero fabricated text.
    - VLM caption/table/visual observation remains disabled until model_use rights, provider/classification activation, exact model/config digest, proposal-only output, and local source-use receipt are all implemented.
  pinning: Cargo.lock checksum, package source checksum, external binary SHA-256 and --version, exact component inventory, exact build flags, SBOM and license receipt SHA-256, traineddata SHA-256, and final document-extractor OCI digest are verified before parsing; drift is a hard failure.
media_determinism_contract:
  arithmetic:
    integer_only: true
    overflow_behavior: reject before allocation or subprocess spawn
    time_rescale: Convert signed FFmpeg timestamp ticks using the probed positive rational time_base with checked integer arithmetic; start milliseconds use floor toward negative infinity and end milliseconds use ceiling, then require start >= 0 and end > start.
    decimal_metadata: Locale-independent decimal strings are parsed as exact rationals; NaN, infinity, exponent notation, negative duration, zero denominator, or overflow is CORRUPT_AUDIO or CORRUPT_VIDEO by media kind.
  exact_format_rules:
  - format_id: html
    metadata: document title, BCP-47 language or null, node count, and ignored active-content count from the bounded html5ever tree only
    locator: stable lowercase DOM element path with one-based nth-of-type for every step; source id and class attributes never affect identity
  - format_id: png
    metadata: IHDR geometry, one still frame, decoded color model, and applied orientation transform
    locator: half-open integer IMAGE_BBOX after the applied orientation transform
  - format_id: jpeg
    metadata: SOF geometry, one still frame, decoded color model, and the single accepted EXIF orientation transform
    locator: half-open integer IMAGE_BBOX in the oriented image
  - format_id: webp
    metadata: RIFF/VP8, VP8L, or nonanimated VP8X canvas geometry and exactly one decoded frame
    locator: half-open integer IMAGE_BBOX in the decoded still image
  - format_id: tiff
    metadata: first and only IFD geometry, decoded color model, and the single accepted orientation transform
    locator: half-open integer IMAGE_BBOX in the oriented single-page image
  - format_id: wav
    metadata: RIFF_WAVE, PCM_S16LE, exact fmt sample rate/channel count, and durationMs as floor(sampleCount * 1000 / sampleRateHz); exactly one fmt chunk and one data chunk are required, and a nonintegral final sample is CORRUPT_AUDIO
    locator: AUDIO_TIME_RANGE derived only from half-open decoded sample indexes using the exact sample rate and the shared integer time rescale rule
  - format_id: webm
    metadata: WEBM, VP8 geometry, exact stream codec IDs, decoded frame count, durationMs as the maximum checked end timestamp of decoded video frames and supported decoded audio samples, and frameRateMilliHz as floor(decodedFrameCount * 1000000 / durationMs)
    locator: Decode frames in presentation order, scale each to 64x64 RGB24 with the pinned integer bilinear scaler, and calculate floor(sum(abs(current-prior channel byte))*10000/(64*64*3*255)). The first frame starts shot 1. A later frame starts a shot only when score >= 1800 and at least 500 ms has elapsed from the current shot start; otherwise it stays in the shot. A boundary is that frame's presentation timestamp. Each nonempty half-open shot ends at the next boundary or durationMs. The representative frame has presentation timestamp closest to the shot midpoint, with earlier timestamp then lower decode ordinal as ties. Emit one VIDEO_TIME_RANGE per shot and run OCR on every representative frame; VIDEO_REGION_TIME uses that shot range and oriented RGB24 pixel bounds.
  ordering_and_hashes:
    video_frame_end: Use a positive packet/frame duration; otherwise use the next greater presentation timestamp; the final frame requires a positive WebM DefaultDuration or BlockDuration, and absence or disagreement is CORRUPT_VIDEO.
    frame_order: ascending presentation timestamp, then ascending decode ordinal; missing, duplicate-with-conflicting-payload, decreasing, or negative timestamps are CORRUPT_VIDEO
    segment_order: ascending locator start, then locator kind, then normalized text SHA-256
    extraction_sha256: SHA-256 of RFC 8785 canonical JSON for the closed result with extractionSha256 omitted
    parser_version_binding:
      prefix: ffmpeg-8.0.1+gurinnae-ffmpeg-subprocess-media-v1+
      suffix: lowercase SHA-256 of RFC 8785 canonical JSON containing configure_flags_exact_order and enabled_component_inventory_exact
      concatenation: prefix immediately followed by the 64-character suffix with no delimiter
  transcript_and_caption_state:
    silence_rule: SILENCE_CONFIRMED if and only if every decoded PCM_S16LE sample in every supported audio channel equals zero; otherwise NON_SILENT_UNCLASSIFIED. Neither state is speech evidence.
    wav_transcript: all-zero input yields NOT_APPLICABLE_SILENCE and zero transcript; every supported non-silent input invokes the pinned whisper.cpp adapter and yields TRANSCRIBED or one typed UNSUPPORTED_LANGUAGE, LOW_CONFIDENCE, NON_SPEECH or POLICY_BLOCKED abstention
    webm_audio: absent audio yields NOT_APPLICABLE_NO_AUDIO, all-zero decoded audio yields NOT_APPLICABLE_SILENCE, and every supported non-silent audio stream follows the same mandatory whisper.cpp path as WAV
    diarization: NOT_ACTIVATED; speakerLabel and speakerConfidence are null until a separately reviewed positive diarization adapter and corpus are activated
    vlm: OpenAiResponsesVlmAdapterV1 is the selected optional proposal-only adapter. It starts UNCONFIGURED and may run only for current model-use rights plus an activated exact provider/model/config/region/retention/price receipt; otherwise VLM state is NOT_ACTIVATED or POLICY_BLOCKED while deterministic shots, keyframe OCR and ASR remain available. VLM output can never replace structural extraction, OCR, transcript, Evidence or a human decision.
    fabricated_text_or_speaker: HARD_FAIL
semantic_media_activation:
  asr:
    adapter_id: gurinnae-whisper-cpp-subprocess-asr-v1
    initial_state: REQUIRED_NOT_IMPLEMENTED
    activation_state_after_evidence: ACTIVE
    required_evidence:
      - source, executable, model, model-card, license, configuration and final OCI digests are exact and mutually bound
      - non-silent ko/en corpus reaches the declared text/confidence/timestamp oracle through the production subprocess and repository path
      - silence, non-speech, unsupported language, low confidence, timeout, malformed output and cancellation produce typed abstention with zero fabricated segment
      - two identical runs in each final supported CPU image produce byte-identical normalized segment and receipt bytes
    support_rule: WAV/WebM support cannot be claimed while a supported non-silent input returns NOT_ACTIVATED
  diarization:
    adapter_id: null
    initial_state: NOT_ACTIVATED
    safe_output: speakerLabel and speakerConfidence null
    future_gate: a new reviewed adapter/model/config/source corpus must prove speaker segments; channel number, voice appearance and language-model inference are forbidden substitutes
  vlm:
    adapter_id: OpenAiResponsesVlmAdapterV1
    provider_id: OPENAI_RESPONSES_API
    endpoint: https://api.openai.com/v1/responses
    initial_state: UNCONFIGURED
    model_selection: one exact non-alias model ID and immutable provider configuration ID/version/digest supplied by the activated model-provider registry; latest, rolling alias and silent fallback are forbidden
    request:
      inputs: immutable representative-frame PNG bytes, shot time/region locator, keyframe OCR, optional verified transcript segment, source/content/parser/rights/source-use digests and a closed instruction/schema digest
      forbidden: [original filename, person identity, hidden prompt, unrestricted prior chat, nonselected frames, endpoint credentials, browser state]
      maximum_frames_per_request: 20
      output_schema: MediaVisualProposalV1 additionalProperties=false with ordered proposal-only caption, visibleText, tableObservation, visualObservation, uncertainty, citation locators and confidence basis points
    activation_required:
      - current model_use and model_egress rights for every frame and transcript segment
      - PUBLIC or explicitly approved INTERNAL classification; RESTRICTED, PERSONAL_DATA and LEGAL_HOLD are forbidden
      - exact provider/model/config/region/retention/training/price/FX/cost-reservation and live-preflight receipts
      - provider response schema validation, local source-use/citation validation and zero raw-provider-payload persistence
    terminal_states: [PROPOSED,NOT_ACTIVATED,POLICY_BLOCKED,LOW_CONFIDENCE,PROVIDER_UNAVAILABLE,RECONCILIATION_REQUIRED]
    authority_rule: only PROPOSED stores untrusted MediaVisualProposalV1 rows; it creates no Evidence, claim, fact, action authorization or external effect
media_activation_negative_gates:
  readiness_hard_failures:
  - FFmpeg source SHA-256, binary SHA-256, version, build flags, enabled inventory, SBOM, license receipt, or final OCI digest is missing or mismatched.
  - Any protocol other than pipe, any device, any extra demuxer/decoder/parser/encoder/muxer, any external codec library, or any network surface is enabled.
  - Effective licensing is not LGPL-2.1-or-later or any GPL, version3, nonfree, or unclassified shipped component is present.
  - The Rust adapter can pass a URL, path, filename, playlist, concat manifest, device, inherited descriptor, proxy variable, or credential to the child.
  - The final OCI digest is a mutable tag, does not match ^sha256:[0-9a-f]{64}$, or is not the image used by all acceptance receipts.
  document_failure_rules:
  - Probe and decode disagree on stream count, codec, geometry, sample rate, channels, duration, frame count, timestamp order, or consumed input digest; fail closed with zero partial persistence.
  - Unsupported WAV codec is AUDIO_CODEC_UNSUPPORTED; malformed RIFF, fmt, data, block alignment, sample count, or chunk bounds is CORRUPT_AUDIO.
  - Unsupported WebM video codec is VIDEO_CODEC_UNSUPPORTED; unsupported WebM audio codec is AUDIO_CODEC_UNSUPPORTED; extra streams are VIDEO_STREAM_LIMIT; malformed EBML, timestamps, lacing, dimensions, or frame extents is CORRUPT_VIDEO.
  - Child timeout is TIMEOUT; output/allocation/dimension/sample/frame/duration limits use their exact existing typed limit rejection; nonzero child exit is accepted only when deterministically mapped from validated probe/input facts to one such typed code.
  - Every rejection, kill, cancellation, malformed child output, or digest disagreement persists no segment, shot, table, link, source-use, or Evidence row and leaves no live child process.
sandbox_additive:
  network: none
  filesystem: read-only single input plus empty writable tmpfs; no object-store credentials in the child
  process:
    uid: non-root
    no_new_privileges: true
    max_children: 4
    socket_mount_ptrace: denied
  limits:
    input_bytes: 104857600
    image_width_px: 30000
    image_height_px: 30000
    image_total_pixels: 250000000
    animated_frames: 1
    decoded_rgba_bytes: 1000000000
    html_nodes: 1000000
    html_depth: 256
    html_text_bytes: 52428800
    html_attributes_per_element: 256
    html_attribute_bytes: 1048576
    audio_duration_ms: 7200000
    audio_channels: 8
    audio_sample_rate_hz: 192000
    audio_decoded_samples: 2764800000
    video_duration_ms: 7200000
    video_width_px: 7680
    video_height_px: 4320
    video_frame_rate_millihz: 120000
    video_decoded_frames: 216000
    video_streams: 16
    wall_seconds: 60
    cpu_seconds: 45
    memory_bytes: 1073741824
    file_descriptors: 64
  rejections:
  - ACTIVE_IMAGE_UNSUPPORTED
  - AUDIO_CHANNEL_LIMIT
  - AUDIO_CODEC_UNSUPPORTED
  - AUDIO_DURATION_LIMIT
  - AUDIO_SAMPLE_LIMIT
  - AUDIO_SAMPLE_RATE_LIMIT
  - CORRUPT_AUDIO
  - CORRUPT_VIDEO
  - DECODE_ALLOCATION_LIMIT
  - HTML_DEPTH_LIMIT
  - HTML_NODE_LIMIT
  - HTML_TEXT_LIMIT
  - IMAGE_DIMENSION_LIMIT
  - IMAGE_PIXEL_LIMIT
  - MALFORMED_HTML
  - MALFORMED_IMAGE
  - SIZE_LIMIT
  - TIMEOUT
  - UNSUPPORTED_MEDIA_TYPE
  - VIDEO_CODEC_UNSUPPORTED
  - VIDEO_DIMENSION_LIMIT
  - VIDEO_DURATION_LIMIT
  - VIDEO_FRAME_LIMIT
  - VIDEO_FRAME_RATE_LIMIT
  - VIDEO_STREAM_LIMIT
closed_output_contracts:
  MultimodalExtractionResultV2:
    additional_properties: false
    required:
    - schemaVersion
    - documentSha256
    - mediaType
    - parserId
    - parserVersion
    - status
    - metadata
    - segments
    - shots
    - tables
    - links
    - warnings
    - rejectionCode
    - extractionSha256
    fields:
      schemaVersion:
        const: multimodal-extraction-result.v2
      status:
      - EXTRACTED
      - REJECTED
      - FAILED
      metadata: closed MediaMetadataV2
      segments: ordered ExtractionSegmentV2[]
      shots: ordered ExtractionShotV1[]
      tables: ordered ExtractionTableV2[]
      links: ordered HtmlLinkV1[]
      warnings: sorted unique closed warning codes
  MediaMetadataV2:
    discriminator: mediaKind
    variants:
      HTML:
        required:
        - documentTitle
        - language
        - nodeCount
        - activeContentCount
      IMAGE:
        required:
        - widthPx
        - heightPx
        - frameCount
        - colorModel
        - orientationApplied
      AUDIO:
        required:
        - container
        - codec
        - sampleRateHz
        - channelCount
        - durationMs
        - silenceState
        - transcriptState
      VIDEO:
        required:
        - container
        - durationMs
        - widthPx
        - heightPx
        - frameRateMilliHz
        - videoCodec
        - frameCount
        - audioStreamState
        - audioCodec
        - transcriptState
  ExtractionSegmentV2:
    additional_properties: false
    required:
    - segmentId
    - kind
    - text
    - normalizedTextSha256
    - locator
    - confidenceBasisPoints
    - language
    - sourceAssetId
    - sourceAssetRevision
    - sourceContentSha256
    - extractionVersion
    kinds:
    - HTML_HEADING
    - HTML_PARAGRAPH
    - HTML_LIST_ITEM
    - HTML_TABLE_CELL
    - HTML_LINK_TEXT
    - OCR_LINE
    - OCR_WORD
    - AUDIO_TRANSCRIPT
    - VIDEO_SHOT
    - VIDEO_CAPTION
    - VIDEO_TRANSCRIPT
  ExtractionShotV1:
    additional_properties: false
    required:
    - shotId
    - locator
    - decodedFrameCount
    - representativeFrameSha256
    - sourceAssetId
    - sourceAssetRevision
    - sourceContentSha256
    - extractionVersion
    - confidenceBasisPoints
  LocatorV2:
    additional_properties: false
    variants:
      HTML_CSS_SELECTOR:
        value: stable lowercase DOM path with nth-of-type; dynamic id/class values are not authority
      IMAGE_BBOX:
        value: pixel:x=<int>,y=<int>,w=<positive-int>,h=<positive-int>; half-open within decoded oriented image
      AUDIO_TIME_RANGE:
        value: time-ms:start=<nonnegative-int>,end=<greater-int>; half-open within decoded stream duration
      VIDEO_TIME_RANGE:
        value: time-ms:start=<nonnegative-int>,end=<greater-int>; half-open within decoded container duration
      VIDEO_REGION_TIME:
        value: time-ms:start=<nonnegative-int>,end=<greater-int>;pixel:x=<int>,y=<int>,w=<positive-int>,h=<positive-int>; both half-open and in bounds for the decoded frame geometry
formats:
- id: html
  media_types:
  - text/html
  extensions:
  - html
  - htm
  magic_or_structure: leading optional BOM/whitespace followed by HTML doctype/tag or successful HTML5 parse under declared
    byte limit
  parser: html5ever 0.39.0 + gurinnae-html-v1
  provenance: HTML_CSS_SELECTOR
  network: false
  extraction:
  - visible DOM text in document order
  - heading/paragraph/list/table/link typed segments
  - same-origin and absolute HTTPS link metadata without fetching
  ignored:
  - script
  - style
  - template
  - noscript active fallback
  - form controls
  - event-handler attributes
  - javascript/data/blob URLs
  - subresources
- id: png
  media_types:
  - image/png
  extensions:
  - png
  magic_hex: 89504e470d0a1a0a
  parser: image 0.25.10 png + tesseract 5.5.0
  provenance: IMAGE_BBOX
  network: false
- id: jpeg
  media_types:
  - image/jpeg
  extensions:
  - jpg
  - jpeg
  magic_hex: ffd8ff
  parser: image 0.25.10 jpeg + tesseract 5.5.0
  provenance: IMAGE_BBOX
  network: false
- id: webp
  media_types:
  - image/webp
  extensions:
  - webp
  magic_rule: RIFF size WEBP with one supported still-image VP8/VP8L/VP8X payload and no animation flag
  parser: image 0.25.10 webp + tesseract 5.5.0
  provenance: IMAGE_BBOX
  network: false
- id: tiff
  media_types:
  - image/tiff
  extensions:
  - tif
  - tiff
  magic_hex_any:
  - 49492a00
  - 4d4d002a
  parser: image 0.25.10 tiff + tesseract 5.5.0
  provenance: IMAGE_BBOX
  network: false
- id: wav
  media_types:
  - audio/wav
  - audio/x-wav
  extensions:
  - wav
  magic_rule: RIFF little-endian size followed by WAVE and one supported fmt chunk; declared chunk bounds must fit exact bytes and overlapping/duplicate authority chunks are rejected
  parser: FFmpeg 8.0.1 gurinnae-ffmpeg-subprocess-media-v1, wav demuxer and native pcm_s16le decoder
  implementation_state: DESIGN_COMPLETE_OPEN_IMPLEMENTATION_SUPPORT_CLAIM_FORBIDDEN
  required_capabilities:
  - bounded RIFF/WAVE PCM metadata and sample decode
  - silence/non-speech decision with receipt
  - timestamped transcript only when an approved transcription capability is activated
  - speaker label only with positive diarization evidence; otherwise null
  provenance: AUDIO_TIME_RANGE
  network: false
- id: webm
  media_types:
  - video/webm
  extensions:
  - webm
  magic_rule: EBML header and DocType webm with bounded Segment/Track/Cluster elements; stream codec and dimensions/duration are validated before frame allocation
  parser: FFmpeg 8.0.1 gurinnae-ffmpeg-subprocess-media-v1, matroska demuxer and native VP8/Opus/Vorbis decoders
  implementation_state: DESIGN_COMPLETE_OPEN_IMPLEMENTATION_SUPPORT_CLAIM_FORBIDDEN
  required_capabilities:
  - bounded WebM container/track metadata and visual frame decode
  - timestamped visual shots for a usable declared video stream
  - explicit ABSENT, SILENT, UNSUPPORTED, or DECODED audioStreamState
  - timestamped transcript only when usable audio and an approved transcription capability exist
  - proposal-only VLM captions/regions only behind model-use rights and provider/classification activation
  provenance:
  - VIDEO_TIME_RANGE
  - VIDEO_REGION_TIME
  - AUDIO_TIME_RANGE
  network: false
