      responseRequestVersion: {type: integer, minimum: 1}
      scopeDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      claimSetDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      evidenceLocatorSetDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      questionSetDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestedPublicationScopeDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      deliveryActionContentDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      auditEventId: {type: string, format: uuid}
      outboxEventIds:
