      subjectEntityId: {type: [string, 'null'], format: uuid}
      subjectEntityRevision: {type: [integer, 'null'], minimum: 1}
      subjectIdentityDigest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
      subjectDisplayName: {type: [string, 'null'], minLength: 1, maxLength: 500}
      dueAt: {type: string, format: date-time}
      scopeDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
    allOf:
      - if:
          properties: {subjectPartyType: {enum: [AGENCY, SUPPLIER]}}
          required: [subjectPartyType]
        then:
          properties:
            subjectEntityId: {type: string, format: uuid}
            subjectEntityRevision: {type: integer, minimum: 1}
            subjectIdentityDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
            subjectDisplayName: {type: 'null'}
      - if:
          properties: {subjectPartyType: {const: OTHER}}
          required: [subjectPartyType]
        then:
          properties:
            subjectEntityId: {type: 'null'}
            subjectEntityRevision: {type: 'null'}
            subjectIdentityDigest: {type: 'null'}
            subjectDisplayName: {type: string, minLength: 1, maxLength: 500}

  ResponseRequestBindingReceiptV1:
    type: object
    additionalProperties: false
    required:
      - responseRequestId
      - responseRequestVersion
      - scopeDigest
      - claimSetDigest
      - evidenceLocatorSetDigest
      - questionSetDigest
      - requestedPublicationScopeDigest
      - deliveryActionContentDigest
