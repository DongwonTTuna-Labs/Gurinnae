logical_foreign_keys:
  - id: procurement_source_revision_document_fk
    from: every procurement revision [source_document_id, source_asset_id, source_asset_revision, source_content_sha256]
    to: raw.source_documents [id, asset_id, asset_revision, content_sha256]
    on_delete: RESTRICT
  - id: procurement_source_revision_parsed_record_fk
    from: every procurement revision [parsed_record_id, source_document_id, record_digest]
    to: raw.parsed_records [id, source_document_id, payload_sha256]
    on_delete: RESTRICT
  - id: procurement_normalization_run_fk
    from: every procurement revision [normalization_run_id, source_document_id, revision_id, revision, record_digest]
    to: core.normalization_runs [id, source_document_id, output_object_id, output_object_version, output_payload_sha256]
    on_delete: RESTRICT
  - id: procurement_revision_predecessor_fk
    from: each revision after one [root_id, predecessor_revision_id, revision_minus_one, predecessor_record_digest]
    to: same relation [root_id, revision_id, revision, record_digest]
    on_delete: RESTRICT
  - id: award_notice_revision_fk
    from: core.procurement_award_revisions [notice_root_id, notice_revision_id, notice_revision, notice_record_digest]
    to: core.procurement_notice_revisions [root_id, revision_id, revision, record_digest]
    on_delete: RESTRICT
  - id: bidder_notice_revision_fk
    from: core.procurement_bidder_participation_revisions [notice_root_id, notice_revision_id, notice_revision, notice_record_digest]
    to: core.procurement_notice_revisions [root_id, revision_id, revision, record_digest]
    on_delete: RESTRICT
  - id: procurement_supplier_candidate_fk
    from: award, bidder, and contract party refs [candidate_id, candidate_revision, candidate_digest]
    to: core.supplier_identity_candidates [candidate_id, candidate_revision, candidate_digest]
    on_delete: RESTRICT
  - id: contract_notice_revision_fk
    from: core.procurement_contract_revisions [notice_root_id, notice_revision_id, notice_revision, notice_record_digest]
    to: core.procurement_notice_revisions [root_id, revision_id, revision, record_digest]
    nullable_as_tuple: true
    on_delete: RESTRICT
  - id: contract_award_revision_fk
    from: core.procurement_contract_revisions [award_root_id, award_revision_id, award_revision, award_record_digest]
    to: core.procurement_award_revisions [root_id, revision_id, revision, record_digest]
    nullable_as_tuple: true
    on_delete: RESTRICT
  - id: amendment_contract_before_fk
    from: core.procurement_contract_amendment_revisions [contract_root_id, contract_before_revision_id, contract_before_revision, contract_before_digest]
    to: core.procurement_contract_revisions [root_id, revision_id, revision, record_digest]
    on_delete: RESTRICT
  - id: amendment_contract_after_fk
    from: core.procurement_contract_amendment_revisions [contract_root_id, contract_after_revision_id, contract_after_revision, contract_after_digest]
    to: core.procurement_contract_revisions [root_id, revision_id, revision, record_digest]
    on_delete: RESTRICT
  - id: identity_decision_candidate_fk
    from: core.supplier_identity_resolution_decision_members [candidate_id, candidate_revision, candidate_digest]
    to: core.supplier_identity_candidates [candidate_id, candidate_revision, candidate_digest]
    on_delete: RESTRICT
  - id: relationship_assertion_evidence_fk
    from: core.supplier_relationship_assertion_evidence [evidence_id, evidence_version, evidence_digest, source_document_id, source_asset_id, source_asset_revision, locator_digest]
    to: exact editorial evidence revision and raw source locator candidate keys
    on_delete: RESTRICT
  - id: response_request_claim_revision_fk
    from: editorial.response_request_claim_scopes [case_id, claim_id, claim_revision, claim_digest, review_snapshot_id]
    to: exact immutable editorial claim revision and review snapshot candidate key
    on_delete: RESTRICT
  - id: response_request_evidence_locator_fk
    from: editorial.response_request_evidence_scopes [evidence_id, evidence_version, evidence_digest, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, locator_digest]
    to: exact immutable evidence revision and source locator candidate key
    on_delete: RESTRICT
  - id: procurement_export_snapshot_fk
    from: intake.dataset_export_requests and public download receipt [snapshot_id, filter_digest, member_set_digest]
    to: core.procurement_query_snapshots [snapshot_id, filter_digest, member_set_digest]
    on_delete: RESTRICT

physical_integration_needs:
  - Extend core.normalization_runs.output_object_type with the five procurement object types only after physical tables and exact output candidate keys exist.
  - Preserve core.contracts and core.contract_changes as legacy projections; they are not immutable revision authority after this addendum is implemented.
  - Add concrete tables for every logical relation, decision member, assertion evidence, response scope member, and query snapshot member; opaque JSONB is not a substitute.
  - Add immutable/update-delete rejection triggers, exact predecessor constraints, deferred cross-revision constraints, RLS/privileges, repository mappings, and PostgreSQL concurrency tests.
  - Add source-derived catalog totals only after the physical migration exists; do not preserve an old magic count by hiding a relation in JSONB.

schema_validation_contract:
  dialect: https://json-schema.org/draft/2020-12/schema
  inventory:
    source: keys(schemas)
    minimum_schema_count: 42
    count_rule: derive at validation time; a hand-written exact total is forbidden
  mandatory_per_schema_tests:
    meta_schema:
      test_id_formula: schema name plus META
      assertion: Draft 2020-12 meta-schema validation succeeds with unknown keywords rejected by the contract linter.
    reference_resolution:
      test_id_formula: schema name plus REF
      assertion: Every local reference resolves within this document and every reference branch can be reached from a root instance.
    positive:
      test_id_formula: schema name plus POSITIVE
      assertion: One minimal canonical instance and every conditional branch validate after format checking is enabled.
    negative_missing_required:
      test_id_formula: schema name plus NEGATIVE_MISSING_REQUIRED
      assertion: Removing each required property one at a time is rejected at the exact JSON pointer.
    negative_additional_property:
      test_id_formula: schema name plus NEGATIVE_ADDITIONAL_PROPERTY
      assertion: Adding one unknown member to every object schema is rejected at that object boundary.
    negative_closed_value:
      test_id_formula: schema name plus NEGATIVE_CLOSED_VALUE
      assertion: Unknown enum, wrong const, malformed digest, invalid UUID/date/time, duplicate set member, and out-of-range ordinal are rejected where applicable.
  cross_schema_tests:
    - RuleFactRevisionRefV1 rejects generic maps and accepts each of its ten typed fact variants exactly once.
    - ProcurementSignalExplanationV1 rejects BLOCKED with no blocker, unknown blockers, and SIGNAL or NO_SIGNAL with a blocker.
    - ResponseRequestScopeV1 rejects missing ordered question/publication members, ordinal gaps, and every invalid subject conditional branch.
    - SupplierIdentityResolutionReceiptV1 rejects a digest-only receipt without exact candidate/locator/actor/reason/prior-decision material.
    - KonepsMappingActivationReceiptV1 rejects any mapping contract digest unequal to the active connector addendum binding.
  executable_status: OPEN_IMPLEMENTATION
  required_artifact: tests/integration/acceptance/procurement_domain_schema_contract.rs
  completion_gate: >-
    The validator must report the source-derived schema count and one META, REF,
    POSITIVE, NEGATIVE_MISSING_REQUIRED, NEGATIVE_ADDITIONAL_PROPERTY and
    NEGATIVE_CLOSED_VALUE result per applicable schema with zero skip, xfail or
    fixture-only substitutions before this contract can become FINAL.

implementation_closure:
  runtime:
    status: OPEN_IMPLEMENTATION
    required: Rust normalizers, typed rule snapshot builder, deterministic digest verifier, decision handlers and immutable receipt repositories
  api:
    status: OPEN_IMPLEMENTATION
    required: effective request/response schemas and operations for identity, relationship, triage, response scope, list snapshot and export binding
  database:
    status: OPEN_IMPLEMENTATION
    required: concrete PostgreSQL relations, exact candidate/foreign keys, append-only triggers, RLS/privileges, concurrency and replay tests
  ui:
    status: OPEN_IMPLEMENTATION
    required: typed source/revision/coverage/counter-evidence/uncertainty/next-action surfaces without generic JSON fallback
  acceptance_runner:
    status: OPEN_IMPLEMENTATION
    required: executable bindings for AC-PROCUREMENT-DOMAIN-001 through AC-PROCUREMENT-DOMAIN-020 plus the schema validation contract
  closure_rule: >-
    REVIEW_REQUIRED remains mandatory while any layer is OPEN_IMPLEMENTATION.
    This contract design is not runtime, API, database, UI, fixture or hard-gate
    completion evidence.

detection_rule_closure:
  exact_rule_ids:
    - PRICE_OUTLIER
    - CONTRACT_SPLITTING_PATTERN
    - REPEATED_SINGLE_SOURCE
    - SUPPLIER_CONCENTRATION
    - LOW_BID_COMPETITION
    - RESTRICTIVE_SPECIFICATION
    - CONTRACT_AMENDMENT_ESCALATION
    - YEAR_END_SPENDING_SPIKE
    - NEW_SUPPLIER_DEPENDENCE
    - SHARED_SUPPLIER_IDENTITY
  common_output_schema: ProcurementSignalExplanationV1
  common_required_blockers:
    identity: IDENTITY_AMBIGUOUS
    coverage: SOURCE_COVERAGE_INCOMPLETE
    freshness: SOURCE_STALE_OR_UNAVAILABLE
    effective_time: EFFECTIVE_TIME_UNKNOWN
    revision_chain: REVISION_CHAIN_INCOMPLETE
    counter_evidence: COUNTER_EVIDENCE_REVIEW_INCOMPLETE
  rules:
    PRICE_OUTLIER:
      ordinary_language_title: 비슷한 조건의 관측값보다 높은 가격
      required_fact_types: [PROCUREMENT_CONTRACT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [unit, quantity, VAT basis, bundle contents, shipping, installation, maintenance, warranty, date window, comparable inclusion and exclusion]
      counter_evidence_kinds: [COMPARABILITY_LIMIT, SCOPE_EXPLANATION, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    CONTRACT_SPLITTING_PATTERN:
      ordinary_language_title: 짧은 기간에 나뉘어 체결된 비슷한 계약
      required_fact_types: [PROCUREMENT_NOTICE, PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [complete window, category, method, threshold version, cancellations, superseded contracts, amendment chain]
      counter_evidence_kinds: [SCOPE_EXPLANATION, LEGAL_OR_POLICY_CONTEXT, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    REPEATED_SINGLE_SOURCE:
      ordinary_language_title: 같은 기관과 업체 사이의 반복 수의계약 관측
      required_fact_types: [PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [complete window, procurement method, category, amount, distinct contract date, cancellation and correction]
      counter_evidence_kinds: [LEGAL_OR_POLICY_CONTEXT, SCOPE_EXPLANATION, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    SUPPLIER_CONCENTRATION:
      ordinary_language_title: 관측 범위에서 한 업체에 집중된 계약 금액
      required_fact_types: [PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [complete denominator, comparable category, period, currency, cancellation, supplier merge and split history]
      counter_evidence_kinds: [COMPARABILITY_LIMIT, SCOPE_EXPLANATION, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    LOW_BID_COMPETITION:
      ordinary_language_title: 경쟁 절차에서 유효 입찰자가 적게 관측됨
      required_fact_types: [PROCUREMENT_NOTICE, BIDDER_PARTICIPATION, AWARD]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [complete participant set, validation status, withdrawal, emergency basis, notice revision, award revision]
      counter_evidence_kinds: [LEGAL_OR_POLICY_CONTEXT, SCOPE_EXPLANATION, SUBJECT_RESPONSE, SOURCE_CORRECTION]
      source_gap_rule: Missing exact BidderParticipation mapping is BIDDER_PARTICIPATION_COVERAGE_UNAVAILABLE and always BLOCKED.
    RESTRICTIVE_SPECIFICATION:
      ordinary_language_title: 특정 상표·모델 조건과 낮은 입찰 참여가 함께 관측됨
      required_fact_types: [PROCUREMENT_NOTICE, BIDDER_PARTICIPATION]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [complete specification text, equivalent language, justification, participant set, notice revision]
      counter_evidence_kinds: [SCOPE_EXPLANATION, LEGAL_OR_POLICY_CONTEXT, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    CONTRACT_AMENDMENT_ESCALATION:
      ordinary_language_title: 최초 계약 뒤 금액·기간이 크게 변경됨
      required_fact_types: [PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [revision one, every amendment, previous and new amount, currency, scope reason, cancellation]
      counter_evidence_kinds: [SCOPE_EXPLANATION, LEGAL_OR_POLICY_CONTEXT, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    YEAR_END_SPENDING_SPIKE:
      ordinary_language_title: 관측 연도의 연말 집행 비중이 높음
      required_fact_types: [PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY]
      material_coverage: [all twelve months, fiscal timezone, cancelled and corrected contracts, currency, denominator]
      counter_evidence_kinds: [SCOPE_EXPLANATION, LEGAL_OR_POLICY_CONTEXT, SOURCE_CORRECTION]
    NEW_SUPPLIER_DEPENDENCE:
      ordinary_language_title: 설립 초기 업체와 특정 기관의 계약 비중이 높음
      required_fact_types: [PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [verified incorporation date, complete public spend denominator, amendment chain, supplier merge and split history]
      counter_evidence_kinds: [COMPARABILITY_LIMIT, SCOPE_EXPLANATION, SUBJECT_RESPONSE, SOURCE_CORRECTION]
    SHARED_SUPPLIER_IDENTITY:
      ordinary_language_title: 서로 다른 업체 후보에서 검증된 식별정보가 겹침
      required_fact_types: [PROCUREMENT_CONTRACT]
      required_identity_roles: [AGENCY, SUPPLIER]
      material_coverage: [two distinct verified candidates, strong identifier provenance, complete contract context, merge and split history]
      counter_evidence_kinds: [SOURCE_CORRECTION, COMPARABILITY_LIMIT, SUBJECT_RESPONSE]
  set_equality:
    - exact_rule_ids equals keys(rules).
    - Every rule has one ordinary-language title, required fact types, identity roles, material coverage list, and counter-evidence kind list.
    - Every persisted signal validates ProcurementSignalExplanationV1 and binds one immutable input snapshot before insertion.

operation_needs:
  existing_operations:
    getSignalTriageView:
      additive_response_fields:
        explanation: ProcurementSignalExplanationV1
        sourceRevisionChain: array<RevisionRefV1>
        identityDecisionHistory: array<SupplierIdentityResolutionDecisionV1>
      rule: Generic RuleExplanation, string explanation, and opaque calculation do not satisfy the effective response.
    triageSignal:
      transport_compatibility:
        investigate: PROMOTE_TO_CASE
        dismiss: DISMISS
        duplicate: MARK_DUPLICATE
        needs_data: NEEDS_DATA
      additive_request_fields:
        decisionDetail: SignalTriageDecisionV1
      success_schema: SignalTriageReceiptV1
      transaction_branches:
        PROMOTE_TO_CASE: lock signal and explanation snapshot; insert case, case-signal link, owned task, triage decision, audit, outbox, and receipt atomically
        NEEDS_DATA: lock signal; insert owned data task, update signal, audit, outbox, and receipt atomically
        DISMISS: lock signal; update status, insert decision, audit, outbox, and receipt atomically
        MARK_DUPLICATE: lock both signals in UUID order; insert duplicate relation, update signal, audit, outbox, and receipt atomically
      incompatibility_rule: Base decision and decisionDetail.decision must map exactly; mismatch is INVALID_PARAMETER.
    linkSignalToCase:
      domain_decision: LINK_TO_CASE
      additive_request_fields:
        target: ExistingCaseTargetV1
        task: TriageTaskV1
        reasonCode: enum<LINK_TO_EXISTING_INVESTIGATION>
        expectedExplanationDigest: sha256
      success_schema: SignalTriageReceiptV1
      transaction: lock signal and case in stable order; insert link, owned task, decision, audit, outbox, and receipt atomically
    getContract:
      additive_response_fields:
        noticeRevision: nullable<RevisionRefV1>
        awardRevision: nullable<RevisionRefV1>
        currentContractRevision: RevisionRefV1
        amendmentRevisions: array<RevisionRefV1>
        identityQuality: IdentityQualityV1
        coverage: CoverageSummaryV1
      rule: Public projection exposes only approved identifiers and never hides incomplete award, participant, identity, or amendment coverage.
    listContracts:
      canonical_request_schema: ProcurementContractFilterV1
      additive_response_fields:
        querySnapshot: ProcurementQuerySnapshotV1
      rule: appliedFilters is byte-equivalent to querySnapshot.filters after canonicalization.
    downloadContracts:
      additive_request_fields:
        filters: ProcurementContractFilterV1
        exportBinding: ProcurementExportRequestBindingV1
      success_metadata_schema: ProcurementExportReceiptV1
      rule: All list filter dimensions are accepted; the legacy four-filter subset cannot silently widen the export.
    createDatasetExport:
      when: datasetId equals PUBLIC_CONTRACTS
      additive_request_fields:
        filters: ProcurementContractFilterV1
        exportBinding: ProcurementExportRequestBindingV1
      success_metadata_schema: ProcurementExportReceiptV1
      rule: Generic DatasetExportFilters cannot substitute for the procurement filter or snapshot binding.
    getResponseRequestComposer:
      additive_response_fields:
        responseScope: ResponseRequestScopeV1
      rule: Composer shows exact claim revisions, evidence locators, counter-evidence, subject scope, and resulting scope digest before send.
    saveResponseRequestDraft:
      additive_request_fields:
        responseScope: ResponseRequestScopeV1
      success_schema: ResponseRequestBindingReceiptV1
      rule: Every scope-changing save appends a draft revision and a new scope digest; it never mutates a sent request.
    createResponseRequest:
      additive_request_fields:
        responseScope: ResponseRequestScopeV1
      success_schema: ResponseRequestBindingReceiptV1
      transaction: lock case, exact claims, exact evidence revisions and locators, scope, subject endpoint and idempotency row; validate set digests; insert request, scope members, delivery proposal binding, audit, outbox and receipt atomically
  required_new_operations:
    recordSupplierIdentityResolution:
      reason: AC-ENTITY_RESOLUTION-003 and AC-ENTITY_RESOLUTION-004 have no base command capable of recording append-only merge/split history.
      request_schema: SupplierIdentityResolutionRequestV1
      success_schema: SupplierIdentityResolutionReceiptV1
      catalog_rule: Add to canonical operation, command, persistence, event, authorization, UI action, and acceptance inventories together; derive counts from source.
    recordSupplierRelationshipAssertion:
      reason: Verified ownership, control, management, representative, and contractual facts cannot be encoded as a generic evidence link.
      request_schema: CreateSupplierRelationshipAssertionRequestV1
      success_schema: SupplierRelationshipAssertionReceiptV1
      catalog_rule: Add to canonical inventories together; creation starts PENDING and cannot claim VERIFIED.
    decideSupplierRelationshipAssertion:
      reason: Verification is an independent human decision over an exact assertion/evidence digest.
      request_schema: DecideSupplierRelationshipAssertionRequestV1
      success_schema: SupplierRelationshipAssertionReceiptV1
      catalog_rule: Add to canonical inventories together with independence and version-conflict gates.
  internal_job_needs:
    normalizeKonepsProcurementRevision:
      input: SourceRevisionRefV1
      outputs:
        - ProcurementNoticeRevisionV1
        - AwardRevisionV1
        - BidderParticipationRevisionV1
        - ProcurementContractRevisionV1
        - ContractAmendmentRevisionV1
      rule: Output variants are operation-allowlisted by the KONEPS mapping addendum; unsupported variants return a typed blocked receipt with zero domain rows.
    evaluateProcurementRule:
      input: immutable DatasetSnapshot plus exact rule version
      output: ProcurementSignalExplanationV1
      rule: Insert a signal only after schema validation, source/identity/coverage fences, deterministic replay, and explanation digest equality pass.

receipt_contracts:
  identity_resolution:
    schema: SupplierIdentityResolutionReceiptV1
    immutable: true
  relationship_assertion:
    schema: SupplierRelationshipAssertionReceiptV1
    immutable: true
  signal_triage:
    schema: SignalTriageReceiptV1
    immutable: true
  response_request:
    schema: ResponseRequestBindingReceiptV1
    immutable: true
  procurement_export:
    schema: ProcurementExportReceiptV1
    immutable: true

acceptance_bindings:
  feature: tests/acceptance/procurement-domain-addendum.feature
  scenario_ids:
    - AC-PROCUREMENT-DOMAIN-001
    - AC-PROCUREMENT-DOMAIN-002
    - AC-PROCUREMENT-DOMAIN-003
    - AC-PROCUREMENT-DOMAIN-004
    - AC-PROCUREMENT-DOMAIN-005
    - AC-PROCUREMENT-DOMAIN-006
    - AC-PROCUREMENT-DOMAIN-007
    - AC-PROCUREMENT-DOMAIN-008
    - AC-PROCUREMENT-DOMAIN-009
    - AC-PROCUREMENT-DOMAIN-010
    - AC-PROCUREMENT-DOMAIN-011
    - AC-PROCUREMENT-DOMAIN-012
    - AC-PROCUREMENT-DOMAIN-013
    - AC-PROCUREMENT-DOMAIN-014
    - AC-PROCUREMENT-DOMAIN-015
    - AC-PROCUREMENT-DOMAIN-016
    - AC-PROCUREMENT-DOMAIN-017
    - AC-PROCUREMENT-DOMAIN-018
    - AC-PROCUREMENT-DOMAIN-019
    - AC-PROCUREMENT-DOMAIN-020
  closure:
    - Every scenario ID appears exactly once in the feature.
    - The ten-rule outline executes once for every exact detection rule ID and validates ordinary explanation, coverage, counter-evidence, identity, and safe-copy fences.
