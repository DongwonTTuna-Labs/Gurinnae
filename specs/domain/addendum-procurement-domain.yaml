          properties: {status: {const: COMPLETE}}
          required: [status]
        then:
          properties:
            completedAt: {type: string, format: date-time}
            blockers: {maxItems: 0}
      - if:
          properties: {status: {enum: [PARTIAL, BLOCKED]}}
          required: [status]
        then:
          properties:
            blockers: {minItems: 1}

