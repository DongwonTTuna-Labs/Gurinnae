      recordDigest: {type: string, pattern: '^[0-9a-f]{64}$'}

  EffectiveTimeV1:
    type: object
    additionalProperties: false
    required: [status, value, precision, sourceField, sourceTimezone]
    properties:
      status:
        type: string
        enum: [KNOWN, UNKNOWN]
      value:
        type: [string, 'null']
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2}(:[0-9]{2})?)?([+-][0-9]{2}:[0-9]{2}|Z)?$'
