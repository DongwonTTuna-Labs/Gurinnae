        maxItems: 10
        uniqueItems: true
        items: {type: string, format: uuid}
      acceptedAt: {type: string, format: date-time}

  ProcurementContractFilterV1:
    type: object
    additionalProperties: false
    required:
      - query
      - agencyIds
      - supplierIds
      - contractStatuses
      - procurementMethods
      - signedFrom
      - signedTo
      - amountMin
      - amountMax
      - sort
