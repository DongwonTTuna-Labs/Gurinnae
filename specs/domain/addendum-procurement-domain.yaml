        maxItems: 100
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 300}
      signedFrom: {type: [string, 'null'], format: date}
      signedTo: {type: [string, 'null'], format: date}
      amountMin: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
      amountMax: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
