      filterDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      memberCount: {type: integer, minimum: 0}
      memberSetDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      format: {type: string, enum: [CSV, JSONL, PARQUET]}
      mediaType: {type: string, enum: [text/csv, application/x-ndjson, application/vnd.apache.parquet]}
