      filters: {$ref: '#/schemas/ProcurementContractFilterV1'}
      filterDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      projectionGeneration: {type: string, format: uuid}
      projectionWatermark: {type: integer, minimum: 0}
      visibilityAsOf: {type: string, format: date-time}
      memberCount: {type: integer, minimum: 0}
