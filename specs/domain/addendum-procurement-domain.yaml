schema_version: 1
specification_version: 13.0.0-procurement-addendum
status: REVIEW_REQUIRED
implementation_state: OPEN_IMPLEMENTATION
purpose: >-
  Close the procurement-domain facts, identity decisions, detection explanation,
  signal triage, response-request scope, and filter/export bindings that the v13
  base contracts leave implicit. This file is additive and does not weaken any
  base invariant or authorize a new upstream source by implication.

authority:
  sole_pack_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
  base_contracts:
    - specs/domain/state-machines.yaml
    - specs/api/operation-contracts.yaml
    - specs/application/command-semantics.yaml
    - specs/api/operation-persistence.yaml
    - specs/api/resource-schemas.yaml
    - specs/database/migrations/0002_raw_and_core.sql
    - specs/database/migrations/0003_editorial_and_intake.sql
    - specs/database/addendum/0025-evidence-snapshots-search.yaml
    - specs/connectors/koneps-notices/field-mapping.yaml
    - specs/connectors/koneps-contracts/field-mapping.yaml
    - specs/detection/rule-evaluation-catalog.yaml
    - specs/product/owner-addendum-2026-07-14.yaml
    - DESIGN.md
  source_mapping_addendum: specs/connectors/addendum-koneps-mapping.yaml
  executable_acceptance: tests/acceptance/procurement-domain-addendum.feature

normative_language:
  must: required for implementation and verification
  must_not: prohibited in source, runtime, projection, and copy
  unknown: an explicit domain state; never zero, false, empty, or absence by inference
  revision: an immutable fact version with an exact predecessor and content digest

scope_guardrails:
  - A signal is an observation that a deterministic rule matched; it is never a finding of wrongdoing.
  - Missing source coverage, an incomplete revision chain, or material identity ambiguity is BLOCKED, not NO_SIGNAL.
  - A supplier name, address, phone number, representative name, or shared hash never causes an automatic merge.
  - A source record is never overwritten. Correction, deletion, merge, split, and supersession append immutable history.
  - Award means only the exact official outcome represented by its source basis. A contract-conclusion record cannot be described as a complete bid-evaluation history.
  - BidderParticipation is never inferred from a notice watcher, contract party list, award winner, contract count, or absence of other parties.
  - Relationship, ownership, control, and management assertions require revision-fixed verified evidence and a human verification decision.
  - Public copy exposes source limits, contrary material, subject responses, and identity uncertainty with the observation.
  - Generic JSON, free-form maps, opaque fallback renderers, and synthetic identifiers or timestamps are forbidden.

canonicalization:
  algorithm: GURINE_CANONICAL_JSON_V1
  digest: lowercase SHA-256 over canonical UTF-8 bytes
  rules:
    - Object schemas below have additionalProperties false and all required fields are present, including nullable fields.
    - UUID sets are duplicate-free and sorted by UUID bytes; enum sets use the declared enum order; digests are lowercase hex.
    - Revision and evidence arrays use their explicit ordinal and are never reordered by display label.
    - Decimal values use non-exponent canonical decimal strings with no leading plus sign or insignificant trailing zeroes.
    - Human text is UTF-8 NFC, contains no NUL, and is included by digest rather than truncated or normalized for identity.

closed_enums:
  procurement_object_type:
    - PROCUREMENT_NOTICE
    - AWARD
    - BIDDER_PARTICIPATION
    - PROCUREMENT_CONTRACT
    - CONTRACT_AMENDMENT
  revision_state: [ACTIVE, CANCELLED, DELETED, SUPERSEDED, CORRECTED]
  effective_time_status: [KNOWN, UNKNOWN]
  effective_time_precision: [DATE, MINUTE, SECOND]
  business_type: [GOODS, CONSTRUCTION, SERVICE, FOREIGN]
  identity_status: [UNVERIFIED, CANDIDATE, VERIFIED, AMBIGUOUS, CONFLICTED, REJECTED]
  coverage_status: [COMPLETE, PARTIAL, UNKNOWN, NOT_AVAILABLE]
  verification_status: [PENDING, VERIFIED, REJECTED, CONFLICTED, SUPERSEDED]
  rule_outcome: [SIGNAL, NO_SIGNAL, BLOCKED]
  triage_decision: [DISMISS, NEEDS_DATA, MARK_DUPLICATE, PROMOTE_TO_CASE, LINK_TO_CASE]

schemas:
  SourceRevisionRefV1:
    type: object
    additionalProperties: false
    required:
      - sourceId
      - connectorId
      - operationId
      - sourceDocumentId
      - sourceAssetId
      - sourceAssetRevision
      - sourceContentSha256
      - externalId
      - externalRevision
      - parsedRecordId
      - recordIndex
      - recordDigest
      - retrievedAt
      - mappingVersion
      - mappingEffectiveFrom
    properties:
      sourceId: {type: string, minLength: 1, maxLength: 100}
      connectorId: {type: string, minLength: 1, maxLength: 100}
      operationId: {type: string, minLength: 1, maxLength: 160}
      sourceDocumentId: {type: string, format: uuid}
      sourceAssetId: {type: string, format: uuid}
      sourceAssetRevision: {type: integer, minimum: 1}
      sourceContentSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      externalId: {type: string, minLength: 1, maxLength: 500}
      externalRevision: {type: string, minLength: 1, maxLength: 500}
      parsedRecordId: {type: string, format: uuid}
      recordIndex: {type: integer, minimum: 0}
      recordDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      retrievedAt: {type: string, format: date-time}
      mappingVersion: {type: string, minLength: 1, maxLength: 100}
      mappingEffectiveFrom: {type: string, format: date-time}

  SourceFieldLocatorV1:
    type: object
    additionalProperties: false
    required:
      - fieldPath
      - sourceDocumentId
      - sourceAssetId
      - sourceAssetRevision
      - sourceContentSha256
      - locatorKind
      - locatorValue
      - locatorDigest
      - rawValueSha256
      - parserVersion
      - transformationVersion
    properties:
      fieldPath: {type: string, minLength: 1, maxLength: 300}
      sourceDocumentId: {type: string, format: uuid}
      sourceAssetId: {type: string, format: uuid}
      sourceAssetRevision: {type: integer, minimum: 1}
      sourceContentSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      locatorKind:
        type: string
        enum: [JSON_POINTER, XML_XPATH, API_FIELD]
      locatorValue: {type: string, minLength: 1, maxLength: 2000}
      locatorDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      rawValueSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      parserVersion: {type: string, minLength: 1, maxLength: 100}
      transformationVersion: {type: [string, 'null'], minLength: 1, maxLength: 100}

  RevisionIdentityV1:
    type: object
    additionalProperties: false
    required:
      - revisionId
      - rootId
      - revision
      - recordDigest
      - predecessorRevisionId
      - predecessorRecordDigest
      - supersedesRevisionId
      - state
    properties:
      revisionId: {type: string, format: uuid}
      rootId: {type: string, format: uuid}
      revision: {type: integer, minimum: 1}
      recordDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      predecessorRevisionId: {type: [string, 'null'], format: uuid}
      predecessorRecordDigest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
      supersedesRevisionId: {type: [string, 'null'], format: uuid}
      state:
        type: string
        enum: [ACTIVE, CANCELLED, DELETED, SUPERSEDED, CORRECTED]

  RevisionRefV1:
    type: object
    additionalProperties: false
    required: [objectType, rootId, revisionId, revision, recordDigest]
    properties:
      objectType:
        type: string
        enum: [PROCUREMENT_NOTICE, AWARD, BIDDER_PARTICIPATION, PROCUREMENT_CONTRACT, CONTRACT_AMENDMENT]
      rootId: {type: string, format: uuid}
      revisionId: {type: string, format: uuid}
