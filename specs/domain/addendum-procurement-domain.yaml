      rightsDecisionDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      generatedAt: {type: string, format: date-time}
      expiresAt: {type: string, format: date-time}

schema_invariants:
  revision_chain:
    - Revision 1 has null predecessorRevisionId, predecessorRecordDigest, and supersedesRevisionId.
    - Every later revision points to revision minus one of the same root and carries that row's exact recordDigest in predecessorRecordDigest.
    - supersedesRevisionId equals predecessorRevisionId for a normal change, correction, cancellation, deletion, or tombstone.
    - A duplicate source revision and recordDigest is an idempotent replay; the same source identity with different bytes is a conflict and quarantines the record.
    - Effective ordering uses known source effective time, then source revision token, then recordDigest only as a deterministic tie-breaker; a tie-breaker never invents business time.
    - EffectiveTime UNKNOWN is allowed for preservation but blocks time-window, amendment-order, bidder-count, and current-state rules.
  cross_object_linkage:
    - AwardRevision.noticeRevision.objectType is PROCUREMENT_NOTICE.
    - AwardRevision.noticeIdentity.noticeRevision is byte-equal to noticeRevision, and externalNoticeId is escaped(noticeNumber) plus hash plus escaped(noticeOrder); both bidNtceNo and bidNtceOrd are mandatory source fields.
    - BidderParticipationRevision.noticeRevision.objectType is PROCUREMENT_NOTICE.
    - ProcurementContractRevision notice and award refs, when present, are PROCUREMENT_NOTICE and AWARD respectively.
    - ContractAmendment contractBefore and contractAfter are PROCUREMENT_CONTRACT refs for the same root; after.revision equals before.revision plus one.
    - An amendment sequence equals contractAfter.revision minus one and cannot skip a predecessor.
    - Missing or ambiguous notice/award linkage remains null with a limitation and cannot be guessed from title, amount, date, or party name.
  supplier_identity:
    - Every source party first becomes a SupplierIdentityCandidate; canonicalSupplier is nullable until a recorded decision proves the binding.
    - SupplierPartyRef identityStatus VERIFIED requires a non-null canonicalSupplier with the same VERIFIED status; every other status is ineligible for rule grouping or public relationship projection.
    - MERGE has at least two source candidates and exactly one target canonical supplier.
    - SPLIT has exactly one prior canonical supplier and at least two target canonical suppliers, plus a non-null impact task owner and due date.
    - KEEP_SEPARATE and MARK_AMBIGUOUS do not reparent historical rows.
    - A split never rewrites a public revision. Every affected public revision creates correction-impact work before any new projection is approved.
    - Name-only, address-only, representative-only, phone-only, or one weak shared identifier evidence cannot yield VERIFIED.
    - SupplierIdentityResolutionReceipt candidateRefs ordinals are contiguous from zero and reproduce every candidate ID/revision/digest, candidate source locator, and identifier fact used by the decision.
    - Receipt candidateSetDigest, evidenceLocatorSetDigest, priorDecisionDigest, actorUserId, reasonCode, and reason equal the immutable decision row exactly; a digest-only receipt is invalid.
  supplier_assertions:
    - OWNERSHIP and BENEFICIAL_OWNERSHIP require ownershipPercent; all other kinds require null ownershipPercent.
    - MANAGEMENT_ROLE requires managementRole; every other kind requires null managementRole.
    - VERIFIED requires both parties VERIFIED, at least one locator for a VERIFIED evidence revision, verifiedBy, verifiedAt, verificationReason, and no unresolved counter assertion.
    - Conflicting current assertions are both retained and the current status is CONFLICTED; neither is usable by a rule or public claim.
    - publicUseStatus APPROVED requires a separate exact-revision editorial/publication decision; domain verification alone never authorizes publication.
    - CreateSupplierRelationshipAssertionRequestV1 always creates PENDING; it cannot supply server-generated verification fields.
    - VERIFY requires the exact current assertion and evidence-locator set digests and an actor independent from the assertion author; stale or same-author decisions have zero effects.
  signal_explanation:
    - inputFactRefs ordinals are contiguous from zero and the included/excluded partition is exact for the locked input snapshot.
    - Every inputFactRef uses exactly one closed typed fact variant. Line item, unit, VAT basis, bundle composition, supplier candidate, supplier identifier, incorporation, relationship, and notice specification facts cannot be represented by a generic procurement revision or free-form map.
    - A SIGNAL or NO_SIGNAL requires COMPLETE rule-specific material coverage, CURRENT freshness, COMPLETE counter-evidence search, and VERIFIED identities for every grouping or subject identity.
    - PARTIAL, UNKNOWN, NOT_AVAILABLE, STALE, SOURCE_UNAVAILABLE, AMBIGUOUS, CONFLICTED, or UNVERIFIED produces BLOCKED with at least one typed blocker.
    - An empty counterEvidence array is valid only when counterEvidenceSearchStatus is COMPLETE and coverage records the searched scope; it never means no contrary material exists outside the scope.
    - coverage.counterEvidenceSearchScope and coverage.counterEvidenceSearchReceipt bind the same scope ID/digest, repositories, queries and input snapshot; counterEvidenceSearchStatus equals the receipt status and every CounterEvidenceRef carries that receipt digest.
    - BLOCKED has at least one closed ProcurementRuleBlockerCodeV1. SIGNAL and NO_SIGNAL have an empty blocker array; unknown blocker strings are rejected.
    - ordinaryLanguageSummary describes observed records and calculation only. nonConclusion explicitly states that the result does not establish illegality, corruption, intent, favoritism, or fault.
    - explanationDigest covers every field except itself and equals the signal row's immutable explanation digest.
  triage:
    - PROMOTE_TO_CASE requires NewCaseTargetV1 and a non-null task owned by a user with a future dueAt.
    - LINK_TO_CASE requires ExistingCaseTargetV1 and a non-null task; the case and signal link are inserted atomically with the decision and task.
    - NEEDS_DATA requires a COLLECT_MISSING_DATA or VERIFY_IDENTITY task and null target.
    - MARK_DUPLICATE requires duplicateSignalId and null target and task.
    - DISMISS requires null target, task, and duplicateSignalId and a bounded non-conclusory reason.
    - A receipt for PROMOTE_TO_CASE or LINK_TO_CASE requires non-null caseId, caseVersion, taskId, taskOwnerUserId, and taskDueAt.
    - No branch may update the signal without its case/link/task/audit/outbox effects; rollback is all-or-nothing.
  response_request:
    - claims are sorted by ordinal, ordinals are contiguous from zero, and every claim belongs to caseId and the locked review snapshot.
    - Each claim binds its exact claim revision/digest and at least one exact evidence revision/source locator/digest; evidence locator ordinals are contiguous from zero within each claim.
    - questions and requestedPublicationScope are material ordered arrays with contiguous zero-based ordinals. Every referenced claim/evidence ordinal exists, and no duplicate question ID or claim/evidence pointer is allowed.
    - questionSetDigest is recomputed from the complete ordered questions. requestedPublicationScopeDigest is recomputed from the complete ordered publication-scope members; neither digest may stand in for omitted source members.
    - AGENCY and SUPPLIER subjects require non-null exact entity ID/revision/identity digest and null display name. OTHER requires null entity fields and a non-empty display name.
    - publicationRevision is null only for a not-yet-published public candidate; otherwise it is the exact immutable publication revision containing the claim.
    - scopeDigest covers case/version, ordered claim refs, ordered evidence locators, questions, requested publication scope, subject, and dueAt.
    - Send, delivery, response session, submission, excerpt decision, appeal, correction, and publication all carry the same scopeDigest or an explicitly linked superseding scope digest.
    - A stale claim, changed evidence locator, cross-case evidence, incomplete locator, or digest mismatch rejects the command with zero request, delivery, audit-success, or outbox rows.
  filter_export:
    - Omitted filter arrays normalize to empty arrays meaning all authorized values; present empty and omitted are the same canonical value.
    - Filter arrays are mathematical sets and canonicalized by the declared enum or UUID order; duplicates and unknown values are INVALID_PARAMETER.
    - signedFrom after signedTo and amountMin greater than amountMax are INVALID_PARAMETER.
    - filterDigest covers datasetId, the complete canonical ProcurementContractFilterV1, and sort; cursor, page limit, format, email, and abuse proof are excluded.
    - listContracts returns the snapshotId, filterDigest, projection generation/watermark, visibilityAsOf, memberCount, and memberSetDigest used for the result.
    - downloadContracts and createDatasetExport accept ProcurementExportRequestBindingV1 and require exact equality with the locked unexpired snapshot before any bytes or job row is created.
    - Export receipt filterDigest, memberCount, and memberSetDigest equal the query snapshot exactly. A changed filter, changed snapshot, current-data rerun, or visibility drift is a typed conflict, never a silent export of another set.

logical_relations:
  - relation: core.procurement_notice_revisions
    schema: ProcurementNoticeRevisionV1
    primary_key: [revision_id]
    candidate_keys:
      - [root_id, revision]
      - [source_document_id, parsed_record_id, mapping_version, record_digest]
      - [revision_id, root_id, revision, record_digest]
    mutability: append_only
  - relation: core.procurement_award_revisions
    schema: AwardRevisionV1
    primary_key: [revision_id]
    candidate_keys:
      - [root_id, revision]
      - [revision_id, root_id, revision, record_digest]
    mutability: append_only
  - relation: core.procurement_bidder_participation_revisions
    schema: BidderParticipationRevisionV1
    primary_key: [revision_id]
    candidate_keys:
      - [root_id, revision]
      - [notice_root_id, candidate_id, external_participation_id, revision]
      - [revision_id, root_id, revision, record_digest]
    mutability: append_only
  - relation: core.procurement_contract_revisions
    schema: ProcurementContractRevisionV1
    primary_key: [revision_id]
    candidate_keys:
      - [root_id, revision]
      - [source_id, external_contract_id, revision]
      - [revision_id, root_id, revision, record_digest]
    mutability: append_only
  - relation: core.procurement_contract_amendment_revisions
    schema: ContractAmendmentRevisionV1
    primary_key: [revision_id]
    candidate_keys:
      - [root_id, revision]
      - [contract_root_id, amendment_sequence]
