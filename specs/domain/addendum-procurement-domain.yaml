        type: array
        maxItems: 100
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 200}
      queryDigests:
        type: array
        maxItems: 1000
        uniqueItems: true
        items: {type: string, pattern: '^[0-9a-f]{64}$'}
      candidateCount: {type: integer, minimum: 0}
      acceptedCount: {type: integer, minimum: 0}
      counterEvidenceSetDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      blockers:
        type: array
        maxItems: 100
        uniqueItems: true
        items: {$ref: '#/schemas/ProcurementRuleBlockerCodeV1'}
      actorKind: {type: string, enum: [AGENT, HUMAN, HYBRID]}
      actorId: {type: string, minLength: 1, maxLength: 200}
