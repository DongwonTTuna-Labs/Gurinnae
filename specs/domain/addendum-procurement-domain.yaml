      effectiveTime: {$ref: '#/schemas/EffectiveTimeV1'}
      externalLineItemId: {type: [string, 'null'], minLength: 1, maxLength: 500}
      lineOrdinal: {type: integer, minimum: 0}
      description: {type: string, minLength: 1, maxLength: 10000}
      categoryCode: {type: [string, 'null'], minLength: 1, maxLength: 200}
