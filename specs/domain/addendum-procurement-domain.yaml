        minItems: 1
        maxItems: 1000
        items: {$ref: '#/schemas/SourceFieldLocatorV1'}
      coverageStatus: {type: string, enum: [COMPLETE, PARTIAL, UNKNOWN, NOT_AVAILABLE]}
      limitations:
        type: array
        maxItems: 100
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 1000}
    allOf:
      - if:
          properties: {bundleState: {const: NOT_BUNDLE}}
          required: [bundleState]
        then:
          properties: {components: {maxItems: 0}, componentCount: {const: 0}}
      - if:
          properties: {bundleState: {const: COMPLETE}}
          required: [bundleState]
        then:
          properties: {components: {minItems: 1}, componentCount: {minimum: 1}}

