version: 2
base_images:
  postgres:
    tag: postgres:18.4-bookworm
    release_digest_required: true
    volume_mount: /var/lib/postgresql
    pgdata: /var/lib/postgresql/18/docker
  rust_builder:
    tag: rust:1.97.0-bookworm
    release_digest_required: true
  bun_builder_runtime:
    tag: oven/bun:1.3.14
    release_digest_required: true
policies:
  latest_tag_forbidden: true
  non_root_runtime_required: true
  multi_stage_required: true
  secrets_in_build_args_forbidden: true
  postgres_18_legacy_data_mount_forbidden: true
  sqlx_cli_unlocked_exception_requires_compensating_evidence: true
  healthcheck_required: true
  graceful_shutdown_test_required: true
compose_services:
  postgres:
    profiles:
    - infra
    - full
    - test
    healthcheck: pg_isready
  migrator:
    profiles:
    - full
    - test
    depends_on:
      postgres: service_healthy
    exit_policy: completed_successfully
  public-api:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  billing-gateway:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
    public_port_default: false
  control-api:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
    public_port_default: false
  submission-api:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
    public_port_default: false
  scheduler:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  public-web:
    profiles:
    - full
    - test
    depends_on:
      public-api: service_healthy
      billing-gateway: service_healthy
  review-console:
    profiles:
    - full
    - test
    depends_on:
      control-api: service_healthy
  response-portal:
    profiles:
    - full
    - test
    depends_on:
      submission-api: service_healthy
  identity-api:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
      egress-gateway: service_started
    public_port_default: false
  ingest-worker:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  analysis-worker:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  projection-worker:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  notification-worker:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  workflow-worker:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  document-extractor:
    profiles:
    - full
    - test
    depends_on:
      migrator: service_completed_successfully
  egress-gateway:
    profiles:
    - full
    - test
  oidc-test-provider:
    profiles:
    - development
    - test
smoke_tests:
- migrations-run-once
- public-api-health-readiness
- control-api-health-readiness
- public-web-ssr
- review-console-ssr
- bun-cookie-streaming-forwarded-headers
- sigterm-graceful-shutdown
- no-browser-secret-or-internal-url
- postgres-18-volume-recreate-persistence
- sqlx-cli-tool-image-sbom
- submission-api-health-readiness
- response-portal-ssr
- submission-token-redaction
- submission-attachment-quarantine
- identity-api-health-readiness
- oidc-login-and-step-up-bff
- four-client-boundary
- split-worker-database-role-boundary
- billing-gateway-disabled-and-test-only-mode
- billing-gateway-no-direct-table-dml-or-egress
