- operation_id: submitResponse
  api: submission-api
  method: POST
  aggregate: requestToken
  authorization:
    capability: none
    step_up_required: false
  repository_methods:
  - SubmissionBoundary::submit_response
  domain_events:
  - response.submitted.v1
  integration_events:
  - workflow.response_submitted.v1
  - notification.response_submitted.v1
  audit_action: intake.response.submitted
  concurrency:
    mode: OPTIMISTIC
    version_field: expectedVersion
    execution:
      kind: SECURITY_DEFINER_FUNCTION
      function: intake.submit_response
      signature: char(64),bigint,char(64),bytea,jsonb,char(64)
      caller: gurine_submission_api
    guard_relation: intake.response_drafts
    guard_identity_predicate: response_request_id = RESOLVE_RESPONSE_REQUEST_ID(HMAC_SHA256(:requestToken))
    guard_version_predicate: version = :expectedVersion
    guard_lock: response token, response request and draft are locked inside intake.submit_response
    additional_guards:
    - relation: intake.response_access_tokens
      predicate: token valid, verified, unrevoked, unexpired and below max uses
      lock: FOR UPDATE
    - relation: editorial.response_requests
      predicate: status IN ('SENT','VIEWED') AND due_at > clock_timestamp()
      lock: FOR UPDATE
    - relation: intake.response_submissions
      predicate: no row exists for response_request_id
      constraint: UNIQUE(response_request_id)
    - relation: intake.response_attachments
      predicate: all non-deleted rows are FINALIZED and CLEAN
    mutation_relation: intake.response_submissions
    mutation_identity_predicate: response_request_id = RESOLVE_RESPONSE_REQUEST_ID(HMAC_SHA256(:requestToken))
    version_effect: GUARD_ONLY_TERMINALIZE
    version_mutation: draft version is immutable; response request version = version + 1
    success_effect: insert one immutable submission, advance the request to SUBMITTED, increment request version once and revoke the access token
      atomically
    zero_rows_resolution:
      probe: read token, request, draft and existing submission under the function locks
      missing_error: RESOURCE_NOT_FOUND
      existing_error: VERSION_CONFLICT or RESPONSE_REQUEST_CLOSED
    request_placeholders:
    - expectedVersion
    - requestToken
    context_placeholders: []
    guard_columns:
    - response_request_id
    - version
    mutation_columns:
    - response_request_id
