- operation_id: saveResponseDraft
  api: submission-api
  method: PUT
  aggregate: requestToken
  authorization:
    capability: none
    step_up_required: false
  repository_methods:
  - SubmissionBoundary::save_response_draft
  domain_events: []
  integration_events: []
  audit_action: intake.response_draft.saved
  concurrency:
    mode: OPTIMISTIC
    version_field: expectedVersion
    execution:
      kind: SECURITY_DEFINER_FUNCTION
      function: intake.save_response_draft
      signature: char(64),bigint,bytea,jsonb,timestamptz
      caller: gurine_submission_api
    guard_relation: intake.response_drafts
    guard_identity_predicate: response_request_id = RESOLVE_RESPONSE_REQUEST_ID(HMAC_SHA256(:requestToken))
    guard_version_predicate: version = :expectedVersion
    guard_lock: response request and existing draft are locked inside intake.save_response_draft
    mutation_relation: intake.response_drafts
    mutation_identity_predicate: response_request_id = RESOLVE_RESPONSE_REQUEST_ID(HMAC_SHA256(:requestToken))
    version_effect: CREATE_AT_ONE_OR_INCREMENT_ONE
    creation_predicate: no draft exists AND :expectedVersion = 0
    version_mutation: new row version = 1; existing row version = version + 1
    success_effect: create version 1 only from expectedVersion 0, otherwise update exactly one current draft and increment version by one
    zero_rows_resolution:
      probe: resolve request token and read the draft without the version predicate inside the same transaction
      missing_error: RESOURCE_NOT_FOUND
      existing_error: VERSION_CONFLICT
    request_placeholders:
    - expectedVersion
    - requestToken
    context_placeholders: []
    guard_columns:
    - response_request_id
    - version
    mutation_columns:
    - response_request_id
    - version
