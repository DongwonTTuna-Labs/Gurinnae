- id: public-web
  kind: sveltekit-ssr
  api_clients:
  - public
  - submission
  network:
  - public
  - internal
  external_egress: []
- id: review-console
  kind: sveltekit-ssr-bff
  api_clients:
  - control
  - identity-internal
  network:
  - internal
  external_egress: []
  authentication:
    conditional_capability_derivation: for submitReview derive exactly review.editorial when criteria.namedIndividualOverride is absent and exactly review.legal when present from the same downstream bytes used for bodySha256, then send that single value as issueActorAssertion.requiredCapability; independently derive requiredAssuranceLevel from the existing decision policy so APPROVE remains STEP_UP with or without the override
    capability_any_of: forbidden
- id: response-portal
  kind: sveltekit-ssr-bff
  api_clients:
  - submission
  network:
  - public
  - internal
  external_egress: []
network_rules:
- Only egress-gateway has direct external network access.
- Review Console OIDC discovery and token exchange use the OIDC egress channel.
- Workers use distinct database login roles; a single WORKER_DATABASE_URL is forbidden.
- Submission API and ClamAV share an internal network; uploaded objects remain quarantined until a clean scan result.
- Public API cannot reach Control API, private schemas, object storage or external providers.
- Review Console BFF owns browser session cookies and synchronizer CSRF; Control API never parses them.
- Identity API issues a request-bound actor assertion after resolving the opaque session and consuming any required step-up proof.
- Control API accepts only X-Gurine-Actor-Assertion and verifies audience, request binding, capability, expiry and JTI replay.
- Submission API has no public ingress; public-web and response-portal call it only over the internal network with request-bound
  service assertions.
- Billing Gateway has no public port or direct external egress; public-web reaches it only over the internal network with an exact
  request-bound service assertion, and its database role has zero direct table DML.
- Payment merchant credentials, webhook secrets and provider host allowlists never belong to billing-gateway. R6e configures none;
  any future live provider transport requires a separately approved egress-gateway channel and strong request-bound caller assertion.
- PAYMENT-TEST-V1 fixture identity and billing-key-vault keyrings exist only in TEST_ONLY, remain distinct from webhook and
  public-web assertions, issue only with current material, and resolve persisted opaque versions against current or previous
  in-memory material fail-closed.
- PAID_OUTCOME_SUBJECT_HMAC_V2 is a separate TEST_FIXTURE_ONLY current-and-previous domain and cannot reuse or derive from payment,
  webhook, public-web, assertion, donor, billing-key or generic identity material. Its environment names and runtime owner remain
  OPEN_CANONICAL_DELTA, so no service owns or activates it yet.
- Raw response, receipt, draft, verification and management tokens are accepted only by one-time BFF exchange operations in request
  bodies and never in Submission API paths or queries.
- Scoped Submission sessions are opaque tokens forwarded in X-Gurine-Submission-Session; browsers hold them only inside authenticated-encrypted
  host-only BFF cookies.
