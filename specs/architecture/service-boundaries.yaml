  funding_disclosure_publication:
    authority:
      id: GFD-AUTHORITY-V1
      provenance: 감독자 결정 v1
      change_control: May be revised only by legal and finance owners before a production deployment.
    logical_command: private.PublishFundingDisclosureRevision
    logical_effect_owner: action-execution-worker.funding-disclosure-executor
    database_principal: gurine_workflow_worker
