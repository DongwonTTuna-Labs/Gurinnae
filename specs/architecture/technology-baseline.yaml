specification_version: 13.0.0
as_of: 2026-07-11
status: FINAL
runtime_policy:
  production_languages:
  - rust
  - typescript
  production_python_allowed: false
  spec_tooling_python_allowed: true
  floating_versions_allowed: false
  docker_latest_tag_allowed: false
standards:
  rust_edition: '2024'
  openapi: 3.1.0
  json_schema: 2020-12
components:
  rust:
    version: 1.97.0
    pin: rust-toolchain.toml
    source: https://blog.rust-lang.org/2026/07/09/Rust-1.97.0/
  actix_web:
    version: 4.14.0
    source: https://crates.io/crates/actix-web
  tokio:
    policy: exact-compatible-via-cargo-lock
    source: https://crates.io/crates/tokio
  sqlx:
    version: 0.9.0
    source: https://crates.io/crates/sqlx
  sqlx_cli:
    version: 0.9.0
    install_locked_supported: false
    exception_marker: SQLX_UPSTREAM_LOCK_ABSENT
    compensating_controls:
    - exact-version-and-feature-install
    - resolved-dependency-graph-evidence
    - sbom-and-vulnerability-scan
    - immutable-tool-image-digest-before-release
    source: https://github.com/launchbadge/sqlx/blob/v0.9.0/CHANGELOG.md
  utoipa:
    version: 5.5.0
    source: https://crates.io/crates/utoipa
  utoipa_actix_web:
    version: 0.1.2
    source: https://crates.io/crates/utoipa-actix-web
  postgresql:
    version: '18.4'
    image: postgres:18.4-bookworm
    image_volume_mount: /var/lib/postgresql
    image_pgdata: /var/lib/postgresql/18/docker
    digest_required_for_release: true
    source: https://www.postgresql.org/docs/release/18.4/
    image_source: https://hub.docker.com/_/postgres
  bun:
    version: 1.3.14
    package_manager_field: bun@1.3.14
    digest_required_for_release: true
    source: https://bun.sh/blog/bun-v1.3.14
  svelte:
    version: 5.56.4
    source: https://www.npmjs.com/package/svelte
  sveltekit:
    package: '@sveltejs/kit'
    version: 2.69.2
    source: https://www.npmjs.com/package/@sveltejs/kit
  svelte_adapter_bun:
    version: 1.0.1
    runtime_fitness_gate_required: true
    published_typescript_peer_range: ^5
    selected_typescript_version: 5.9.3
    node_runtime_fallback_forbidden_without_adr: true
    source: https://www.npmjs.com/package/svelte-adapter-bun
  biome:
    package: '@biomejs/biome'
    version: 2.5.3
    source: https://www.npmjs.com/package/@biomejs/biome
  typescript:
    version: 5.9.3
    selection: adapter-peer-compatible-and-codegen-pinned
    reason: Matches svelte-adapter-bun ^5 peer range while retaining strict generated-client compilation.
    source: https://www.npmjs.com/package/typescript
  openapi_typescript_generator:
    package: '@hey-api/openapi-ts'
    version: 0.99.0
    client: fetch
    source: https://www.npmjs.com/package/@hey-api/openapi-ts
  runtime_validation:
    package: valibot
    version: 1.1.0
    scope: forms, environment and untrusted browser/server inputs
compatibility_gates:
- rust_workspace_compile
- postgresql_18_4_migrations
- sqlx_live_prepare_and_offline_build
- openapi_generation_without_database_or_network
- typescript_hey_api_codegen_smoke
- typescript_client_clean_regeneration
- sveltekit_bun_ssr_container_smoke
- bun_only_build_and_runtime_no_node_fallback
- linux_amd64_runtime
- target_deployment_architecture_runtime
- four_client_surface_generation
- submission_api_boundary_and_quarantine
- four_typescript_client_clean_regeneration
- response_portal_bun_ssr_container_smoke
- svelte_adapter_bun_typescript_5_9_clean_install_build_runtime
lock_artifacts:
- .sqlx/
- Cargo.lock
- bun.lock
- infra/images.lock
- package.json
- packages/api-client-control/src/generated
- packages/api-client-identity-internal/src/generated
- packages/api-client-public/src/generated
- packages/api-client-submission/src/generated
- rust-toolchain.toml
- specs/dependencies/bun-bom.json
- specs/dependencies/cargo-bom.toml
- specs/generated/control-api.openapi.json
- specs/generated/identity-provider.openapi.json
- specs/generated/identity-service-internal.openapi.json
- specs/generated/public-api.openapi.json
- specs/generated/submission-api.openapi.json
