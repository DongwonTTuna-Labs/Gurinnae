schema_version: 4
specification_version: 13.0.0
status: FINAL
rules:
- Every runtime variable read by first-party code is declared exactly once.
- External provider and source credentials are readable only by the egress gateway.
- Development uses synthetic/local adapters; production rejects placeholder values.
- Missing optional connector credentials disable only that connector; missing foundational cryptographic keys fail startup.
- Secrets are never emitted to logs, traces, metrics, fixtures, screenshots or problem responses.
