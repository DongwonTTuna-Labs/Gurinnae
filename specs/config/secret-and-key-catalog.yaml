schema_version: 4
specification_version: 13.0.0
status: FINAL
authority_decisions:
- id: PAID-EVIDENCE-V2-AUTHORITY
  provenance: 감독자 결정 v1
  change_control: May be revised only by legal and finance owners before a production deployment.
  subject_hmac:
    domain: PAID_OUTCOME_SUBJECT_HMAC_V2
    key_versions:
    - CURRENT
    - PREVIOUS
    issuance: current-only
    persisted_lookup: exact opaque persisted version selects current or previous material
    injection: TEST_FIXTURE_ONLY
    forbidden_reuse_or_derivation:
    - payment
    - webhook
    - public-web
    - assertion
    - donor
    - billing-key
    - generic identity
  unresolved_configuration_authority:
    status: OPEN_CANONICAL_DELTA
    missing:
    - concrete environment variable names
    - runtime service owner
    fail_closed: No catalog entry or runtime activation may be invented until both are fixed by canonical authority.
- id: PAYMENT-TEST-V1
  provenance: 감독자 결정 v1
  change_control: May be revised only by legal and finance owners before a production deployment.
  production_effect: NONE; production and the unspecified default remain DISABLED.
rules:
- Every runtime variable read by first-party code is declared exactly once.
- External provider and source credentials are readable only by the egress gateway.
- Development uses synthetic/local adapters; production rejects placeholder values.
- Missing optional connector credentials disable only that connector; missing foundational cryptographic keys fail startup.
- Secrets are never emitted to logs, traces, metrics, fixtures, screenshots or problem responses.
- PAYMENT_FIXTURE_IDENTITY_HMAC_KEY and PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY are independent TEST_ONLY
  current-and-previous keyrings. They are never reused or derived from each other, fixture webhook assertion keys, public-web
  assertion keys, or any public/assertion signing key.
- Only a current PAYMENT fixture key may issue a new persisted HMAC. Verification and lookup select current or previous material
  solely by the exact opaque persisted VERSION; missing selected in-memory material fails closed without recovery, replacement,
  reissuance or recharge.
- Live payment merchant credentials, provider API credentials, webhook secrets and provider host allowlists remain egress-gateway
  owned. R6e declares no live payment credential or live provider configuration.
- PAID_OUTCOME_SUBJECT_HMAC_V2 is a separate TEST_FIXTURE_ONLY current-and-previous domain. No concrete runtime variable or owner
  is declared while its configuration authority remains OPEN_CANONICAL_DELTA, so issuance and verification remain unavailable.
