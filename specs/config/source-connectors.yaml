connector_contract:
  runtime_owner: ingest-worker
  network_path: ingest-worker -> egress-gateway source channel -> allowlisted official host
  required_capabilities:
  - checkpoint
  - bounded retry
  - rate-limit handling
  - raw-byte preservation
  - schema-drift detection
  - reconciliation
  - kill switch
  - activation receipt
  manifest_rule: manifest connectors require an HTTPS signed/operator-controlled manifest that validates against official-manifest.schema.json;
    the manifest is not a claim of an undocumented upstream REST API.
  live_evidence_rule: synthetic fixtures prove structure only. Production activation requires a credentialed or official-link preflight
    receipt and recorded official payload fingerprint.
