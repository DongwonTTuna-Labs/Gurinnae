schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
authority_source: product-owner instruction dated 2026-07-14
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
rules:
  - Every original v13 contract remains required; an additive contract cannot replace or satisfy it.
  - Original migrations 0001 through 0024 are immutable; additive migrations start at 0025.
  - Original screen and operation counts are compatibility minima, not ceilings for this owner addendum.
  - Generic JSON payloads, undocumented variants, and semantic reuse of an unrelated operation are forbidden.
  - Every count change updates the build contract, machine catalogs, generated contracts, traceability, validators, acceptance mapping, and manifest atomically.

surface_resolution:
  surfaces: 3
  screens: 94
  new_routes: 0
  paid_workspace:
    surface: review-console
    deployment_model: one configured organization per deployment
    no_fourth_surface: true
    excluded:
      - cross-organization tenant switcher
      - self-service billing route
      - public entitlement UI
      - customer data reuse across deployments

state_machine_inventory:
  machine_count: derived as len(addendum-state-machines.machines)
  edge_count: derived as sum(len(addendum-state-machines.machines[*].edges))
  count_semantics: source-derived expanded lifecycle registry; machine names and complete edge mappings are unique and unlisted transitions remain invalid; historical numeric totals are not completion targets

operation_counts:
  count_rule: all values are derived from the immutable base catalogs plus the set-equal registries below; numeric inventory literals are non-normative and forbidden
  base:
    public: derived count(specs/api/operation-contracts.yaml operations where api=public-api)
    submission: derived count(specs/api/operation-contracts.yaml operations where api=submission-api)
    control: derived count(specs/api/operation-contracts.yaml operations where api=control-api)
    browser_identity: derived count(specs/api/operation-contracts.yaml operations where api=identity-api and browser-exposed)
    external_total: derived sum(base.public,base.submission,base.control,base.browser_identity)
    private_identity: derived operation count(specs/api/identity-service-internal.openapi.yaml paths)
  additive:
    public: derived count(additive_operations where api=public-api)
    submission: derived count(additive_operations where api=submission-api)
    control: derived count(additive_operations where api=control-api)
    browser_identity: derived count(additive_operations where api=identity-api)
  final:
    public: derived base.public + additive.public
    submission: derived base.submission + additive.submission
    control: derived base.control + additive.control
    browser_identity: derived base.browser_identity + additive.browser_identity
    external_total: derived sum(final.public,final.submission,final.control,final.browser_identity)
    private_identity: derived base.private_identity
    private_communication_gateway: derived len(private_communication_gateway_operations)
    private_control_service: derived len(private_control_service_operations)
    private_application_commands: derived len(private_application_commands.commands)
  kind_counts:
    base: {query: derived count(base operations where kind=QUERY), command: derived count(base operations where kind=COMMAND)}
    additive: {query: derived count(additive_operations where kind=QUERY), command: derived count(additive_operations where kind=COMMAND)}
    external_final: {query: derived base.query + additive.query, command: derived base.command + additive.command}
    private_identity: {query: derived count(private identity where kind=QUERY), command: derived count(private identity where kind=COMMAND)}
    private_communication_gateway: {query: derived count(private_communication_gateway_operations where kind=QUERY), command: derived count(private_communication_gateway_operations where kind=COMMAND)}
    private_control_service: {query: derived count(private_control_service_operations where kind=QUERY), command: derived count(private_control_service_operations where kind=COMMAND)}
    private_application_commands: {query: derived count(private_application_commands where kind=QUERY), command: derived count(private_application_commands where kind=COMMAND)}
    complete_http_catalog: {query: derived external_final.query + private_identity.query + private_communication_gateway.query + private_control_service.query, command: derived external_final.command + private_identity.command + private_communication_gateway.command + private_control_service.command, total: derived query + command}

