base_operation_atomic_extensions:
  source: specs/api/operation-contracts.yaml
  operations:
    submitResponse: replace the token-bearing v1 producer set with one token-free persisted submission receipt and atomic response.submitted.v2, notification.response_submitted.v2 and workflow.response_submitted.v2 events; v1 remains historical only and cannot be admitted by a runtime role
    resolveCorrectionRequest: correction REVIEW to PUBLISHED and publication current state to CORRECTED commit in one SERIALIZABLE group
    placeTemporaryRestriction: one access decision, preserved prior public state, audit, domain event, projection outbox and receipt commit atomically
    publishCase: a TEMPORARILY_RESTRICTED restoration branch performs a fresh full publication gate and appends a new immutable revision
    placeLegalHold: the request uses the closed target union and exact ops.legal_hold_target_anchors binding for case and non-case targets
  rule: These are additive semantic extensions of existing operation IDs, never new aliases or parallel effect owners.

provider_contracts:
  fixed_adapters:
    - SMTP_EMAIL
    - TELEGRAM_BOT_API
    - META_WHATSAPP_BUSINESS_CLOUD
    - LINE_MESSAGING_API
    - SOLAPI_SMS
    - SOLAPI_KAKAO_BIZMESSAGE
    - TWILIO_VOICE
    - SIGNED_WEBHOOK
  fixed_adapter_bindings:
    SMTP_EMAIL:
      adapter_id: smtp-email-v1
      user_channel: EMAIL
      callback_operations: [acceptSmtpDsn]
      delivery_proof: authenticated DSN or authenticated provider poll
    TELEGRAM_BOT_API:
      adapter_id: telegram-bot-api-v1
      user_channel: TELEGRAM
      callback_operations: [receiveTelegramWebhook]
      delivery_proof: authenticated webhook or authenticated provider poll
    META_WHATSAPP_BUSINESS_CLOUD:
      adapter_id: meta-whatsapp-business-cloud-v1
      user_channel: WHATSAPP
      callback_operations: [verifyWhatsAppWebhook, receiveWhatsAppWebhook]
      delivery_proof: authenticated webhook or authenticated provider poll
    LINE_MESSAGING_API:
      adapter_id: line-messaging-api-v1
      user_channel: LINE
      callback_operations: [receiveLineWebhook]
      delivery_proof: authenticated webhook or authenticated provider poll
    SOLAPI_SMS:
      adapter_id: solapi-sms-v1
      user_channel: SMS
      callback_operations: [receiveSolapiSmsCallback]
      delivery_proof: authenticated callback or authenticated provider poll
    SOLAPI_KAKAO_BIZMESSAGE:
      adapter_id: solapi-kakao-bizmessage-v1
      user_channel: KAKAO
      callback_operations: [receiveSolapiKakaoCallback]
      delivery_proof: authenticated callback or authenticated provider poll
    TWILIO_VOICE:
      adapter_id: twilio-voice-v1
      user_channel: VOICE
      callback_operations: [receiveTwilioVoiceCallback]
      delivery_proof: authenticated callback or authenticated provider poll
    SIGNED_WEBHOOK:
      adapter_id: signed-webhook-v1
      user_channel: WEBHOOK
      callback_operations: []
      delivery_proof: synchronous receiver-signed terminal receipt or authenticated status poll
  binding_rule: fixed_adapters, fixed_adapter_bindings keys and the physical provider
    channel/adapter_id pairs are set-equal. A channel with another adapter_id is
    invalid; a provider acceptance response is not delivery proof. SIGNED_WEBHOOK
    has no Gurinnae callback operation because its pinned receiver contract must
    return a verified terminal receipt synchronously or expose an authenticated
    status-poll resource. If neither capability is present it cannot become ACTIVE.
  activation_states:
    - DISABLED
    - UNCONFIGURED
    - PENDING_PROVIDER_APPROVAL
    - ACTIVE
    - SUSPENDED
  rule: Source completeness requires each concrete adapter and synthetic contract path; production effect additionally requires an exact activation receipt and deployment inputs.

search_and_provenance_contract:
  filter_contracts:
    common:
      q:
        type: string
        required: true
        min_length: 1
        max_length: 512
      cursor:
        type: string
        required: false
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        required: false
      sort:
        type: enum
        values: [relevance, updated_desc, title_asc]
        default: relevance
        required: false
    searchPublicRecords:
      only_fields: [q, types, publicationState, dateFrom, dateTo, cursor, limit, sort]
      types: [CASE, CONTRACT, AGENCY, SUPPLIER, METHODOLOGY, CORRECTION]
      publication_states:
        - NEVER_PUBLISHED
        - PUBLISHED_ANOMALY
        - PUBLISHED_EXPLAINED
        - OFFICIALLY_CONFIRMED
        - CORRECTED
        - RETRACTED
        - TEMPORARILY_RESTRICTED
      date_semantics: ISO-8601 calendar dates in Asia/Seoul; dateFrom is inclusive and dateTo includes the whole date; dateFrom after dateTo is INVALID_PARAMETER.
    searchInternalRecords:
      only_fields: [q, types, status, cursor, limit, sort]
      types: [CASE, SIGNAL, EVIDENCE, AGENT_RUN, AUDIT_EVENT]
      type_qualified_statuses:
        - CASE:SIGNAL_DETECTED
        - CASE:TRIAGE
        - CASE:INVESTIGATING
        - CASE:AWAITING_RESPONSE
        - CASE:EDITORIAL_REVIEW
        - CASE:LEGAL_REVIEW
        - CASE:READY_TO_PUBLISH
        - CASE:CLOSED
        - SIGNAL:NEW
        - SIGNAL:ASSIGNED
        - SIGNAL:NEEDS_DATA
        - SIGNAL:LINKED
        - SIGNAL:DISMISSED
        - SIGNAL:DUPLICATE
        - EVIDENCE:PENDING
        - EVIDENCE:VERIFIED
        - EVIDENCE:REJECTED
        - EVIDENCE:NEEDS_WORK
        - AGENT_RUN:QUEUED
        - AGENT_RUN:RUNNING
        - AGENT_RUN:SUCCEEDED
        - AGENT_RUN:FAILED
        - AGENT_RUN:CANCELLED
        - AGENT_RUN:BUDGET_BLOCKED
        - AGENT_RUN:POLICY_BLOCKED
        - AUDIT_EVENT:SUCCESS
        - AUDIT_EVENT:DENIED
        - AUDIT_EVENT:FAILED
    collection_rules:
      - Omitted type/status/publication-state arrays mean all values authorized for that operation.
      - Present arrays are non-empty mathematical sets; duplicates or values outside the closed enum are INVALID_PARAMETER.
      - A type-qualified internal status whose type is absent from an explicit types set is INVALID_PARAMETER.
      - Filter array order does not affect the filter digest; values are canonicalized in the declared type order.
      - No search operation exposes source filters, facet counts, or undeclared fields.
  ranking_policy:
    version: search-rank-v1
    non_statistical_tier_score: '1.000000'
    postgres_config: simple
    vector_weights_d_c_b_a: ['0.05', '0.20', '0.50', '1.00']
    vector_fields:
      A: [identifier_tokens, canonical_title_tokens, canonical_name_tokens]
      B: [verified_alias_tokens]
      C: [authorized_summary_tokens]
      D: [authorized_body_tokens, locator_tokens]
    ts_rank_cd_normalization: 32
    full_text_expression: ts_rank_cd(ARRAY[0.05,0.20,0.50,1.00]::real[], search_vector, plainto_tsquery('simple', conjunctive_terms), 32)
    trigram_expression: similarity(normalized_query, normalized_title)
    trigram_minimum: '0.45'
    quantization: round(raw_score::numeric, 6)
    tier_reason_field_contract:
      '1': {reason: EXACT_IDENTIFIER, fields: [IDENTIFIER]}
      '2': {reason: EXACT_CANONICAL_TITLE, fields: [TITLE, CANONICAL_NAME]}
      '3': {reason: EXACT_QUOTED_PHRASE, fields: [IDENTIFIER, TITLE, CANONICAL_NAME, VERIFIED_ALIAS, SUMMARY, BODY, LOCATOR]}
      '4': {reason: VERIFIED_ALIAS, fields: [VERIFIED_ALIAS]}
      '5': {reason: CANONICAL_PREFIX, fields: [TITLE, CANONICAL_NAME, VERIFIED_ALIAS]}
      '6': {reason: FULL_TEXT, fields: [IDENTIFIER, TITLE, CANONICAL_NAME, VERIFIED_ALIAS, SUMMARY, BODY, LOCATOR]}
      '7': {reason: TRIGRAM_FALLBACK, fields: [TITLE, CANONICAL_NAME]}
  schema_deltas:
    SearchMatchRangeV1:
      additional_properties: false
      fields:
        startUtf16: {type: integer, format: int32, minimum: 0, required: true}
        endUtf16: {type: integer, format: int32, minimum: 1, required: true}
      invariants:
        - endUtf16 is strictly greater than startUtf16.
    SearchMatchV1:
      additional_properties: false
      fields:
        tier: {type: integer, format: int32, minimum: 1, maximum: 7, required: true}
        score: {type: string, pattern: '^(0|1)\.[0-9]{6}$', required: true}
        reason:
          type: enum
          values: [EXACT_IDENTIFIER, EXACT_CANONICAL_TITLE, EXACT_QUOTED_PHRASE, VERIFIED_ALIAS, CANONICAL_PREFIX, FULL_TEXT, TRIGRAM_FALLBACK]
          required: true
        field:
          type: enum
          values: [IDENTIFIER, TITLE, CANONICAL_NAME, VERIFIED_ALIAS, SUMMARY, BODY, LOCATOR]
          required: true
        text: {type: string, min_length: 1, required: true}
        ranges: {type: array, items: SearchMatchRangeV1, min_items: 1, required: true}
      invariants:
        - ranges are sorted, non-overlapping, half-open UTF-16 offsets inside text.
        - tier, reason, and field obey ranking_policy.tier_reason_field_contract.
        - text is authorized plain text and is never interpreted as markup.
    PublicSearchStateOverlayV1:
      additional_properties: false
      fields:
        currentRevision: {type: integer, format: int64, minimum: 1, required: true}
        noticeKind: {type: enum, values: [NONE, CORRECTED, RETRACTED], required: true}
        noticeHref: {type: uri-reference, nullable: true, required: true}
        changedAfterPageWatermark: {type: boolean, required: true}
        matchedConclusionInvalidated: {type: boolean, required: true}
      invariants:
        - NONE requires null noticeHref and false matchedConclusionInvalidated.
        - CORRECTED and RETRACTED require a non-null current noticeHref.
        - RETRACTED requires true matchedConclusionInvalidated.
    PublicRecordsSearchResultItem:
      additive_fields:
        objectRevision: {type: integer, format: int64, minimum: 1, required: true}
        freshness: {type: FreshnessModel, required: true}
        match: {type: SearchMatchV1, required: true}
        stateOverlay: {type: PublicSearchStateOverlayV1, required: true}
    InternalRecordsSearchResultItem:
      additive_fields:
        objectRevision: {type: integer, format: int64, minimum: 1, required: true}
        freshness: {type: FreshnessModel, required: true}
        match: {type: SearchMatchV1, required: true}
    PublicRecordsSearchResultPage:
      additive_fields:
        projectionGeneration: {type: string, format: uuid, required: true}
        projectionWatermark: {type: integer, format: int64, minimum: 0, required: true}
        rankingPolicyVersion: {type: enum, values: [search-rank-v1], required: true}
        visibilityAsOf: {type: string, format: date-time, required: true}
        partialDueToVisibilityChange: {type: boolean, required: true}
    InternalRecordsSearchResultPage:
      additive_fields:
        projectionGeneration: {type: string, format: uuid, required: true}
        projectionWatermark: {type: integer, format: int64, minimum: 0, required: true}
        rankingPolicyVersion: {type: enum, values: [search-rank-v1], required: true}
        partialDueToVisibilityChange: {type: boolean, required: true}
    EvidenceProvenanceV1:
      additional_properties: false
      fields:
        sourceDocumentId: {type: string, format: uuid, required: true}
        sourceAssetId: {type: string, format: uuid, required: true}
        sourceAssetRevision: {type: integer, format: int64, minimum: 1, required: true}
        sourceContentSha256: {type: string, pattern: '^[a-f0-9]{64}$', required: true}
        sourceAuthority: {type: string, min_length: 1, required: true}
        retrievedAt: {type: string, format: date-time, required: true}
        locatorKind:
          type: enum
          values: [PAGE_BBOX, XLSX_CELL, CSV_ROW_COLUMN, XML_XPATH, DOCX_PARAGRAPH, HWPX_XPATH, JSON_POINTER, HTML_CSS_SELECTOR, API_FIELD, TEXT_RANGE]
          required: true
        locatorValue: {type: string, min_length: 1, required: true}
        locatorDigest: {type: string, pattern: '^[a-f0-9]{64}$', required: true}
        rawValueSha256: {type: string, pattern: '^[a-f0-9]{64}$', required: true}
        selectedContentSha256: {type: string, pattern: '^[a-f0-9]{64}$', required: true}
        parserVersion: {type: string, min_length: 1, required: true}
        transformationVersion: {type: string, nullable: true, required: true}
      invariants:
        - PublicEvidence.contentSha256 or EvidenceDetail.contentSha256 equals sourceContentSha256.
        - locatorDigest is canonical JSON SHA-256 over locatorKind, locatorValue, sourceAssetId, sourceAssetRevision, and sourceContentSha256.
    PublicEvidence:
      additive_fields:
        provenance: {type: EvidenceProvenanceV1, required: true}
    EvidenceDetail:
      additive_fields:
        provenance: {type: EvidenceProvenanceV1, required: true}
  current_overlay_rules:
    - Candidate rank and cursor tuple come only from the pinned projection generation and watermark.
    - Current authorization and visibility are read after candidate selection on every page.
    - A no-longer-visible object is omitted and partialDueToVisibilityChange is true.
    - Every remaining public hit has one overlay read from the current authoritative publication revision.
    - A correction or retraction newer than projectionWatermark cannot be returned with noticeKind NONE.
    - The overlay never changes rank, score, or the encoded cursor tuple.
  screen_typed_slices:
    PUB-002:
      query: [PublicRecordsSearchResultPage.appliedFilters.q, PublicRecordsSearchResultPage.appliedFilters.types, PublicRecordsSearchResultPage.appliedFilters.publicationState, PublicRecordsSearchResultPage.appliedFilters.dateFrom, PublicRecordsSearchResultPage.appliedFilters.dateTo]
      results: ['PublicRecordsSearchResultPage.items[].resultType', 'PublicRecordsSearchResultPage.items[].id', 'PublicRecordsSearchResultPage.items[].title', 'PublicRecordsSearchResultPage.items[].status', 'PublicRecordsSearchResultPage.items[].objectRevision', 'PublicRecordsSearchResultPage.items[].freshness', 'PublicRecordsSearchResultPage.items[].match', 'PublicRecordsSearchResultPage.items[].stateOverlay', 'PublicRecordsSearchResultPage.items[].href', PublicRecordsSearchResultPage.asOf, PublicRecordsSearchResultPage.projectionGeneration, PublicRecordsSearchResultPage.projectionWatermark, PublicRecordsSearchResultPage.rankingPolicyVersion, PublicRecordsSearchResultPage.visibilityAsOf, PublicRecordsSearchResultPage.partialDueToVisibilityChange, PublicRecordsSearchResultPage.totalApproximate]
    INT-003:
      query: [InternalRecordsSearchResultPage.appliedFilters.q]
      types: [InternalRecordsSearchResultPage.appliedFilters.types, InternalRecordsSearchResultPage.appliedFilters.status]
      results: ['InternalRecordsSearchResultPage.items[].objectType', 'InternalRecordsSearchResultPage.items[].objectId', 'InternalRecordsSearchResultPage.items[].title', 'InternalRecordsSearchResultPage.items[].status', 'InternalRecordsSearchResultPage.items[].objectRevision', 'InternalRecordsSearchResultPage.items[].freshness', 'InternalRecordsSearchResultPage.items[].match', 'InternalRecordsSearchResultPage.items[].href']
      recent: [InternalRecordsSearchResultPage.asOf, InternalRecordsSearchResultPage.projectionGeneration, InternalRecordsSearchResultPage.projectionWatermark, InternalRecordsSearchResultPage.rankingPolicyVersion, InternalRecordsSearchResultPage.partialDueToVisibilityChange, InternalRecordsSearchResultPage.totalApproximate]
    PUB-004:
      status: [PublicCaseResponse.publicState, PublicCaseResponse.revision, PublicCaseResponse.freshness, PublicCaseResponse.updatedAt, 'PublicCaseResponse.corrections[]']
      known: ['PublicCaseResponse.confirmedFacts[]', 'PublicCaseResponse.claims[]', 'PublicCaseResponse.evidence[].provenance']
      unknown: ['PublicCaseResponse.criticalUnknowns[]', 'PublicCaseResponse.limitations[]']
      response: ['PublicCaseResponse.partyResponses[]']
      comparison: [PublicCaseResponse.comparison]
      counter: ['PublicCaseResponse.counterEvidence[]']
      evidence: ['PublicCaseResponse.evidence[].id', 'PublicCaseResponse.evidence[].title', 'PublicCaseResponse.evidence[].sourceLocator', 'PublicCaseResponse.evidence[].contentSha256', 'PublicCaseResponse.evidence[].provenance']
      timeline: ['PublicCaseResponse.timeline[]']
      revision: [PublicCaseResponse.revision, 'PublicCaseResponse.corrections[]']
    CAS-004:
      matrix: ['CaseEvidencePage.items[].id', 'CaseEvidencePage.items[].verificationStatus', 'CaseEvidencePage.items[].version']
      filters: [CaseEvidencePage.appliedFilters.caseId, CaseEvidencePage.appliedFilters.verificationStatus, CaseEvidencePage.appliedFilters.classification, CaseEvidencePage.appliedFilters.evidenceType]
      list: ['CaseEvidencePage.items[].id', 'CaseEvidencePage.items[].title', 'CaseEvidencePage.items[].sourceLocator', 'CaseEvidencePage.items[].contentSha256', 'CaseEvidencePage.items[].provenance', 'CaseEvidencePage.items[].verificationStatus']
      gaps: ['CaseEvidencePage.items[].verificationStatus', CaseEvidencePage.totalApproximate, CaseEvidencePage.asOf]
  screen_ten_second_sections:
    PUB-002: {location: query, state: results, matters_now: results, evidence: results, unknown_or_disputed: results, next_action: results}
    INT-003: {location: query, state: results, matters_now: results, evidence: results, unknown_or_disputed: results, next_action: results}
    PUB-004: {location: status, state: status, matters_now: known, evidence: evidence, unknown_or_disputed: unknown, next_action: evidence}
    CAS-004: {location: matrix, state: list, matters_now: matrix, evidence: list, unknown_or_disputed: gaps, next_action: matrix}

route_contract:
  canonical_overrides:
    PUB-028: /correction-request/receipt
    PUB-030: /subscription/manage
    RSP-001: /respond/access
    RSP-002: /respond/overview
    RSP-003: /respond/answer
    RSP-004: /respond/attachments
    RSP-005: /respond/review
    RSP-006: /respond/receipt
    RSP-007: /respond/extension
  legacy_token_exchange:
    status: 303
    session_cookie: authority-declared HttpOnly Secure SameSite=Strict scoped cookie
    response_headers:
      Referrer-Policy: no-referrer
      Cache-Control: no-store
    rules:
      - Token is validated once and never copied to query, fragment, analytics, logs, DOM, client storage, or another origin.
      - Valid exchange redirects to the corresponding token-free canonical route.
      - Invalid, expired, revoked, or already-consumed exchange redirects to RSP-008 without object-existence detail.
  parameter_aliases:
    PUB-008:
      agencySlug:
        operation_parameter: agencyId
        type: string
        resolver: verified canonical public agency slug or retained immutable alias to core agency UUID
    PUB-010:
      supplierSlug:
        operation_parameter: supplierId
        type: string
        resolver: verified canonical public supplier slug or retained immutable alias to core supplier UUID
    CAS-011:
      runId:
        operation_parameter: agentRunId
        type: uuid
        resolver: direct route identity rename; no lookup or coercion
    SRC-004:
      runId:
        operation_parameter: sourceRunId
        type: uuid
        resolver: direct route identity rename; no lookup or coercion
  direct_binding_rule: Every other route parameter binds only to an exact same-name typed operation request field; local systemPath is consumed by the system route resolver.
  corrected_redirect:
    from: /cases/{caseSlug}/history
    to: /cases/{caseSlug}#revision
    status: 308

