counting_rule: pg_class.relkind='r' base tables only; compatibility views do not change active-table count
legal_hold_release:
  original_relation: editorial.legal_holds
  release_relation: editorial.legal_hold_releases
  privileges:
    gurine_control_api:
      editorial.legal_holds:
      - SELECT
      - INSERT
      editorial.legal_hold_releases:
      - SELECT
      - INSERT
    revoked:
    - UPDATE
    - DELETE
  coverage_atoms:
  - RETENTION
  - DELETION
  - DISCLOSURE
  affected_set: affected_ids when nonempty else singleton object_id
  active_formula: original scope-atom x affected-ID cells minus union of valid release cells; effects of all holds are union
  expiry_effect: review task/event only; never releases coverage
  release_constraints:
  - release cells are a nonempty subset of current active coverage
  - a cell cannot be released twice
  - expected release sequence and case version are locked
  - placer and releaser differ and the approval receipt is current
  transaction: SERIALIZABLE
  statements:
  - lock case row exactly one by caseId and expectedCaseVersion
  - lock original hold exactly one and select all release rows ordered by sequence
  - verify prior active coverage digest
  - insert one append-only release row with next sequence
  - insert audit, legal.hold_released.v1 outbox and immutable command receipt
  - commit and return the stored receipt
transaction_templates:
  typed_query:
    isolation: READ_COMMITTED
    statements:
    - authorize actor/session and scope
    - validate closed filters and cursor
    - execute one typed repository query
    - map stored rows without synthesis
    cardinality: page queries return 0..limit rows; detail queries return exactly 1 or RESOURCE_NOT_FOUND
  optimistic_command:
    isolation: READ_COMMITTED
    statements:
    - claim idempotency key
    - lock aggregate by ID
    - verify expected version and digest
    - apply typed transition
    - insert audit
    - insert outbox events
    - insert receipt
    - commit
    cardinality: aggregate update exactly 1; every declared event and receipt exactly 1; zero maps NOT_FOUND or VERSION_CONFLICT after existence
      check
  serializable_decision:
    isolation: SERIALIZABLE
    statements:
    - claim idempotency key
    - lock aggregate graph in declared order
    - re-evaluate policy and conflicts in SQL
    - apply one transition
    - insert audit
    - outbox and receipt
    - commit
    cardinality: one terminal winner; serialization retry is internal bounded database retry and never repeats an external effect
  append_only_fact:
    isolation: SERIALIZABLE
    statements:
    - verify signed import or terminal receipt
    - compute canonical fact identity
    - insert immutable fact
    - insert audit and outbox
    - commit
    cardinality: same identity/digest returns existing fact; changed digest is FACT_CONFLICT
  external_effect_request:
    isolation: SERIALIZABLE
    statements:
    - lock authorization and generation
    - recheck policy rights consent suppression switch and budget
    - insert attempt before egress
    - commit durable claimed state
    - execute through adapter
    - append observed receipt in a new transaction
    cardinality: one provider idempotency key per delivery/execution generation; ambiguous outcome must be RECONCILIATION_REQUIRED
