        external_actor_http: {transport_profile: CONTROL_COMMAND, session_user: gurine_control_api, assertion_type: ACTOR, attempt_wrapper: ops.consume_journey_handoff_assertion_attempt_v1}
        internal_service_workflow: {transport_profile: JOURNEY_WORKFLOW_DB_COMMAND, session_user: gurine_workflow_worker, assertion_type: SERVICE, canonical_target: ops.consume_journey_handoff_assertion_attempt_v1->ops.prepare_journey_handoff_decision_v1->ops.decide_journey_handoff_v1->ops.finalize_journey_handoff_decision_response_v1}
