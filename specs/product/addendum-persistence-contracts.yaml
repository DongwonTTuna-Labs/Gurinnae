canonical_existing_relations:
- ops.cost_events remains the existing v13 relation and is reused without counting it as additive.
- ops.communication_provider_configs is the sole additive provider-configuration relation; no duplicate provider-config table is permitted.
- ops.incidents is the physical rename target of existing ops.source_incidents and is not counted as additive.
- Migration 0034 alters core.agencies, public.agencies, editorial.evidence, and intake.create_correction_session without adding a product relation; its contract is specs/database/addendum/0034-public-monitoring-extensions.yaml.
- Migration 0041 alters editorial.cases and editorial.named_person_publication_policies, replaces named-person publication routines and the case publication trigger, and adds no product relation; its contract is specs/database/addendum/0041-f9-natural-person-name-guard-closure.yaml.
- Migration 0042 replaces the public.source_official_urls security-barrier view and the archive public-text-tail routine without adding a product relation; its contract is specs/database/addendum/0042-f3-public-source-url-exposure-closure.yaml.
- Migration 0043 adds the immutable public_slug_rename_receipts_v1 authority and replaces the case publication guard only forward; its contract is specs/database/addendum/0043-b1-public-slug-rename-authority.yaml.
