worker_transactions:
  snapshot_producer:
    isolation: REPEATABLE_READ
    statements:
    - insert or reuse BUILDING producer digest
    - materialize typed members and member-source joins
    - verify ordered member digest
    - transition exactly one row to READY
    - insert dataset.snapshot_created.v1
    cardinality: same active producer digest at most one; READY immutable; FAILED retry creates new generation
  publication_gate:
    isolation: SERIALIZABLE
    statements:
    - lock case and target snapshot
    - recompute every gate in SQL
    - insert decision and typed blocker rows
    - on PASS insert publication revision and projection event
    - insert audit/outbox/receipt
    cardinality: BLOCKED inserts zero publication rows; PASS inserts exactly one immutable revision
  communication_dispatch:
    template: external_effect_request
    logical_intent_unique:
    - deployment_id
    - logical_intent_digest
    delivery_unique:
    - intent_digest
    - endpoint_id
    - endpoint_version
    - channel
    - locale
    - template_id
    - template_revision
    - rendered_sha256
  connector_completion:
    isolation: READ_COMMITTED
    statements:
    - persist raw page before parse
    - insert immutable page receipt
    - reconcile exact item set
    - on complete lock checkpoint by expected version and advance once
    cardinality: every ordinal exactly once; missing duplicate extra or total drift prevents success
  accounting_fact_import:
    template: append_only_fact
    signed_inputs:
    - tariff
    - contract period
    - discount
    - invoice
    - revenue
    - FX
    - accounting correction
  conflict_expiry:
    isolation: SERIALIZABLE
    effect_owner: scheduler.conflict-expiry-worker
    atomic_transition_group: gurine.worker.conflictExpiry.v1
    idempotency_identity: declaration_id + declaration_sequence + declaration_digest + expires_at
    lock_order:
      - editorial.conflict_declarations(id)
      - editorial.conflict_declarations(subject_actor_id,target_type,target_id,conflict_type,declaration_sequence DESC,id)
      - ops.audit_events chain head
      - ops.outbox
    statements:
    - lock the candidate declaration and latest series head; a non-head, superseded, withdrawn or not-yet-expired candidate is a durable no-op
    - derive ConflictExpiryReceiptV1 digest from immutable declaration identity/digest, policy digest, expiresAt and transaction expiredAt
    - insert exactly one CONFLICT_DECLARATION_EXPIRED audit and governance.conflict_expired.v1 outbox row under the idempotency identity
    - commit before dispatch; consumers claim ops.inbox and never rewrite the immutable declaration
    cardinality: one audit plus one outbox for a newly expired current head; exact replay or stale scheduled work writes zero
exact_persistence_registry:
  source_sets:
    queries: specs/product/addendum-operation-contracts.yaml#operations[kind=QUERY]
    external_commands: specs/product/addendum-command-semantics.yaml#external_commands
    private_application_commands: specs/product/addendum-command-semantics.yaml#private_application_commands
    base_operation_atomic_extensions: specs/product/addendum-command-semantics.yaml#base_operation_atomic_extensions
    private_callbacks: specs/product/addendum-command-semantics.yaml#private_callback_operations
    private_control_service: specs/product/addendum-command-semantics.yaml#private_control_service_commands
  counts:
    queries: derived len(query_persistence)
    external_commands: derived len(external_command_persistence)
    private_application_commands: derived len(private_application_command_persistence)
    base_operation_atomic_extensions: derived len(base_operation_atomic_extension_persistence)
    private_callback_operations: derived len(private_callback_persistence)
    private_control_service: derived len(private_control_service_persistence)
  query_persistence:
    listActionApprovalQueue:
      operation_kind: QUERY
      api: control-api
      method: GET
      path: /v1/internal/action-proposals
      isolation: READ_COMMITTED
      authorization:
        capability: actions.read
        authorization: null
        assurance: ACTIVE_SESSION
        predicate: authorize actor/session and persisted object scope before existence-sensitive lookup
      relations:
      - ops.action_proposals
      - ops.action_proposal_versions
      - ops.action_review_assignments
      statements:
      - AUTHORIZE closed actor/session and object scope [exactly-one decision]
      - VALIDATE closed filters/sort/limit/authenticated cursor [exactly-one result]
      - RESOLVE exact V2 queue projection and cursor authority [exactly-one contract; unavailable or ambiguous authority is DEPENDENCY_UNAVAILABLE with zero rows synthesized]
      - SELECT typed projection/join [declared cardinality]
      - MAP stored rows to closed response without synthesized values [declared cardinality]
      cardinality: 0..limit
      ordering: due_at ASC,proposal_id ASC or updated_at DESC,proposal_id DESC; authenticated cursor binds filters/sort/asOf where paged
      writes: zero including idempotency, audit and outbox
      errors:
      - INVALID_PARAMETER
      - INVALID_CURSOR
      - ACTOR_ASSERTION_REQUIRED
      - ACTOR_ASSERTION_INVALID
      - CAPABILITY_DENIED
      - INTERNAL_ERROR
    getActionProposal:
      operation_kind: QUERY
      api: control-api
      method: GET
      path: /v1/internal/action-proposals/{proposalId}
      isolation: READ_COMMITTED
      authorization:
        capability: actions.read
        authorization: null
        assurance: ACTIVE_SESSION
        predicate: authorize actor/session and persisted object scope before existence-sensitive lookup
      relations:
      - ops.action_proposals
      - ops.action_proposal_versions
      - ops.action_review_assignments
      - ops.action_decisions
      - ops.in_flight_effects
      - ops.execution_authorizations
      statements:
      - AUTHORIZE closed actor/session and object scope [exactly-one decision]
      - VALIDATE closed filters/sort/limit/authenticated cursor [exactly-one result]
      - SELECT typed projection/join [declared cardinality]
      - MAP stored rows to closed response without synthesized values [declared cardinality]
      cardinality: exactly-one graph or RESOURCE_NOT_FOUND
      ordering: version,slot,decision,generation order; authenticated cursor binds filters/sort/asOf where paged
      writes: zero including idempotency, audit and outbox
      errors:
      - INVALID_PARAMETER
      - ACTOR_ASSERTION_REQUIRED
      - CAPABILITY_DENIED
      - RESOURCE_NOT_FOUND
      - INTERNAL_ERROR
    getActionExecutionReceipt:
      operation_kind: QUERY
      api: control-api
      method: GET
      path: /v1/internal/action-executions/{executionId}/receipt
      isolation: READ_COMMITTED
      authorization:
        capability: actions.read
        authorization: null
        assurance: ACTIVE_SESSION
        predicate: authorize actor/session and persisted object scope before existence-sensitive lookup
      relations:
      - ops.in_flight_effects
      - ops.execution_authorizations
      - ops.execution_attempts
      - ops.execution_receipts
      statements:
      - AUTHORIZE closed actor/session and object scope [exactly-one decision]
      - VALIDATE closed filters/sort/limit/authenticated cursor [exactly-one result]
      - SELECT typed projection/join [declared cardinality]
      - MAP stored rows to closed response without synthesized values [declared cardinality]
      cardinality: exactly-one effect and complete chain or RESOURCE_NOT_FOUND/EXECUTION_RECEIPT_INCOMPLETE
      ordering: generation ASC,receipt_sequence ASC; authenticated cursor binds filters/sort/asOf where paged
      writes: zero including idempotency, audit and outbox
      errors:
      - CAPABILITY_DENIED
      - RESOURCE_NOT_FOUND
      - EXECUTION_RECEIPT_INCOMPLETE
      - INTERNAL_ERROR
    getResponseAppeal:
      operation_kind: QUERY
      api: submission-api
      method: GET
      path: /v1/response-receipt/appeals/{appealId}
      isolation: READ_COMMITTED
      authorization:
        capability: null
        authorization: APPEAL_STATUS derived session
        assurance: SCOPED_TOKEN
        predicate: require ACTIVE APPEAL_STATUS, exact BFF issuer, scope_id=:appealId and stored appeal-to-response-submission-to-response-request
