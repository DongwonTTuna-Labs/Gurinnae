      authorization: request-bound reconciliation-worker service assertion and current job fence; browser and human assertions are forbidden
      evidence_rule: exact run-bound reconciliation evidence ID+digest and target composite are locked; stale, cross-run, ambiguous or caller-only proof writes zero
      effect_owner: control-api-private.reconcileAgentRun
      atomic_transition_group: gurine.private.reconcileAgentRun.v2
      outbox: {events: [agent.run_control_changed.v2], cardinality: {agent.run_control_changed.v2: exactly-one}}
      receipt: {schema: AgentRunControlReceiptV2, storage: ops.agent_run_control_receipts plus finalized ops.idempotency_keys response bytes}
      repository_result: safe retry only from RECONCILIATION_REQUIRED; recovered result is reused, CANCEL_REQUESTED never returns directly to ACTIVE, and exact replay dispatches nothing

