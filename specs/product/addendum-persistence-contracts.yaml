      - ops.action_proposal_versions
      - ops.action_review_assignments
      statements:
      - AUTHORIZE closed actor/session and object scope [exactly-one decision]
      - VALIDATE closed filters/sort/limit/authenticated cursor [exactly-one result]
      - SELECT typed projection/join [declared cardinality]
      - MAP stored rows to closed response without synthesized values [declared cardinality]
      cardinality: 0..limit
      ordering: due_at ASC,proposal_id ASC or updated_at DESC,proposal_id DESC; authenticated cursor binds filters/sort/asOf where paged
      writes: zero including idempotency, audit and outbox
      errors:
      - INVALID_PARAMETER
