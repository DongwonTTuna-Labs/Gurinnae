        START_REVIEW: implemented owner edge for an already VERIFIED request carrying exact policy/calendar bindings
        VERIFY_IDENTITY:
          RESPONSE_RECEIPT: IMPLEMENTED with an immutable same-subject exact-scope authority receipt, one-time proof consumption receipt and the V3 verification owner
          VERIFIED_ENDPOINT: OPEN_FAIL_CLOSED because the endpoint proof has no canonical verifier/runtime producer; no synthetic ACTIVE endpoint or privacy authority receipt is permitted
        APPROVE:
          RESPONSE_PARTY_NAME_CORRECTION: IMPLEMENTED only with exactly one current plan plus immutable final ACCESS binding, current response/version/digest/receipt chain, complete OBJECT_SET inventory and zero active holds; creates one existing decision event and one dedicated job in the same transaction
          OTHER_REQUEST_TYPES_OR_TARGETS: OPEN_FAIL_CLOSED until a typed execution owner is authorized
        EXTEND: contract complete but reachable only after authoritative VERIFY_IDENTITY and an approved response policy/calendar
        REJECT: contract complete but reachable only after authoritative VERIFY_IDENTITY and an approved response policy/calendar
        COMPLETE: outside this command; RESPONSE `/partyName` correction is implemented only by the fenced workflow owner and every other request type or target remains OPEN_FAIL_CLOSED
