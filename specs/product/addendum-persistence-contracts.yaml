cross_file_physical_dependencies:
  required_relations_not_yet_in_migration_ownership:
  - intake.communication_endpoint_versions
  - ops.communication_provider_config_versions
  satisfied_derived_session_contract: specs/submission/addendum-derived-session-boundary.yaml plus the 0027 intake.submission_sessions additive
    columns persist APPEAL_CREATE, APPEAL_STATUS and COMMUNICATION_PROFILE scope, lineage, version, SHA-256 token, issuance, rotation, expiry
    and revocation without widening RESPONSE_RECEIPT.
  satisfied_privacy_request_storage_contract: migration 0038 owns ops.privacy_requests_v2, its immutable receipt relations, the concrete ops.privacy_request_access_policies_v1 binding and the ops.create_privacy_request_v2, ops.exchange_privacy_request_receipt_token_v2 and ops.get_privacy_request_v2 routines; PRIVACY_REQUEST_RECEIPT uses the closed intake.submission_sessions extension without widening any prior kind.
  privacy_access_policy_physical_binding:
    status: FINAL
    relation: ops.privacy_request_access_policies_v1
    primary_key: [policy_id, revision]
    receipt_binding_key: [policy_id, revision, policy_digest, binding_digest]
    version_column: revision
    lifecycle_state_column: state
    approved_state: APPROVED
    policy_version_column: policy_version
    authority_column: authority
    test_only_authority: TEST_ONLY
    selector: ops.current_privacy_request_access_policy_v1(timestamptz)
    production_preflight: ops.preflight_privacy_request_access_policy_v1(timestamptz)
    production_seed: FORBIDDEN
    fixture_authority: TEST_ONLY
    production_rule: runtime service identities cannot select TEST_ONLY and deployment preflight rejects it; zero, duplicate, expired or unapproved rows remain request-id-only DEPENDENCY_UNAVAILABLE with zero writes
  open_privacy_transition_authorities:
    status: IMPLEMENTED_WITH_EXPLICIT_FAIL_CLOSED_BRANCHES
    successful_edges:
      START_REVIEW: IMPLEMENTED
      VERIFY_IDENTITY:
        RESPONSE_RECEIPT: IMPLEMENTED
      APPROVE:
        CORRECTION_RESPONSE_PARTY_NAME:
          status: IMPLEMENTED_JOB_ONLY_0040
          selector: requestType CORRECTION plus exact targetObjectType RESPONSE and fieldPath /partyName
          authority: the current immutable plan binding, ACCESS-identical projection digest, approval transition receipt and zero-active-hold proof are revalidated before exactly one dedicated PRIVACY_RESPONSE_PARTY_NAME_CORRECTION job is created
          effect_boundary: APPROVE emits only the existing privacy.request_decision_recorded.v1 decision event and the dedicated job; it cannot mutate the response value or synthesize completion authority
      COMPLETE:
        CORRECTION_RESPONSE_PARTY_NAME:
          status: IMPLEMENTED_PRIVATE_FENCED_OWNER_0040
          owner: ops.execute_privacy_response_party_name_correction_job_v1
          authority: only the current claimed workflow-worker job lease and fencing token may consume the exact plan, approval, ACCESS projection, response-version, value-digest, receipt-chain and legal-hold graph
          effect_boundary: one response version increment, privacy request completion, immutable completion receipt, redacted audit and privacy.response_party_name_corrected.v1 event are atomic; plaintext, ciphertext, keys and job payload are forbidden from result and observability surfaces
    blocked_edges:
      VERIFY_IDENTITY:
        VERIFIED_ENDPOINT: OPEN_FAIL_CLOSED because no canonical endpoint verifier/runtime producer can create the source receipt; the RESPONSE_RECEIPT proof path is implemented and does not widen this unavailable branch
      APPROVE: every request type or target other than CORRECTION plus exact RESPONSE /partyName remains OPEN_FAIL_CLOSED with zero job, decision, audit, outbox or target writes; no generic inventory or target fallback is authority
      COMPLETE: every request type or target other than CORRECTION plus exact RESPONSE /partyName remains OPEN_FAIL_CLOSED because no per-branch private fenced owner and immutable completion receipt graph exists; legacy V1 decision/execution paths are historical read-only
    dependent_edges: {EXTEND: requires a prior successful VERIFY_IDENTITY and an approved response policy/calendar, REJECT: requires a prior successful VERIFY_IDENTITY and an approved response policy/calendar}
    forbidden_completion_claim: unsupported APPROVE/COMPLETE branches remain physically unsatisfied, and even the supported CORRECTION RESPONSE /partyName branch cannot claim completion without the exact immutable plan binding, approval binding, dedicated job fence, ACCESS receipt chain and completion receipt/audit/event graph
  privacy_scope_legal_hold_mapping:
    required_object_kinds: [RESPONSE, CORRECTION, SUBSCRIPTION, COMMUNICATION_ENDPOINT, PUBLICATION, EVIDENCE, AUDIT_SUBJECT_RECORD]
    set_equality: mappings keys equal required_object_kinds; no aggregate-level or generic fallback counts as a concrete object mapping
    mappings:
      RESPONSE:
        status: IMPLEMENTED
        target_kind: RESPONSE
        source: editorial.responses(id,version,response_content_sha256)
        anchor: ops.legal_hold_target_anchors(response_id)
        owner_branch: ops.place_legal_hold_v2 RESPONSE
      CORRECTION:
        status: IMPLEMENTED_0040
        target_kind: CORRECTION
        source: ops.privacy_correction_snapshots_v1(snapshot_id,correction_id,snapshot_version,snapshot_digest)
        anchor: ops.legal_hold_target_anchors(correction_snapshot_id,correction_id,target_version,correction_snapshot_digest)
        owner_branch: ops.place_legal_hold_v2 CORRECTION
        binding: targetId equals snapshot_id, targetVersion equals snapshot_version, targetDigest equals snapshot_digest and correctionId equals correction_id
      SUBSCRIPTION:
        status: IMPLEMENTED_0040
        target_kind: SUBSCRIPTION
        source: ops.privacy_subscription_snapshots_v1(snapshot_id,subscription_id,snapshot_version,snapshot_digest)
        anchor: ops.legal_hold_target_anchors(subscription_snapshot_id,subscription_id,target_version,subscription_snapshot_digest)
        owner_branch: ops.place_legal_hold_v2 SUBSCRIPTION
        binding: targetId equals snapshot_id, targetVersion equals snapshot_version, targetDigest equals snapshot_digest and subscriptionId equals subscription_id
      COMMUNICATION_ENDPOINT:
        status: IMPLEMENTED_0040
        target_kind: COMMUNICATION_ENDPOINT
        source: intake.communication_endpoints(id,version,endpoint_digest)
        anchor: ops.legal_hold_target_anchors(communication_endpoint_id,communication_endpoint_version,communication_endpoint_digest)
        owner_branch: ops.place_legal_hold_v2 COMMUNICATION_ENDPOINT
        binding: targetId equals id, targetVersion equals version and targetDigest equals endpoint_digest; endpointSnapshotDigest substitution is forbidden
      PUBLICATION:
        status: IMPLEMENTED
        target_kind: PUBLICATION
        source: editorial.publication_revisions(id,revision,public_payload_sha256)
        anchor: ops.legal_hold_target_anchors(publication_revision_id)
        owner_branch: ops.place_legal_hold_v2 PUBLICATION
      EVIDENCE:
        status: IMPLEMENTED
        target_kind: EVIDENCE
        source: editorial.evidence(id,version,content_sha256)
        anchor: ops.legal_hold_target_anchors(evidence_id)
        owner_branch: ops.place_legal_hold_v2 EVIDENCE
      AUDIT_SUBJECT_RECORD:
        status: EXPLICITLY_UNSUPPORTED
        error: LEGAL_HOLD_TARGET_UNSUPPORTED
        http_status: 422
        reason: no authoritative source relation exists, so a target version, canonical digest, lock or foreign-key anchor cannot be validated
        unlock_condition: authorize a versioned immutable audit-subject source relation, canonical digest preimage, owner lock, anchor columns and foreign key, placement/release validation and event payload branch
    generic_fallback: FORBIDDEN
    aggregate_substitution: PRIVACY_REQUEST and COMMUNICATION_SUBJECT anchors do not prove hold coverage for any unmapped inventory member
    enforcement: an inventory containing AUDIT_SUBJECT_RECORD cannot pass APPROVE or retention-worker COMPLETE; placeLegalHold returns LEGAL_HOLD_TARGET_UNSUPPORTED and every boundary produces zero target writes
  failure_mode: fail validation and migration generation until every supported relation, column, key, grant, retention and repository contract exists; AUDIT_SUBJECT_RECORD remains an explicit unsupported error until its unlock condition is met, with no JSONB fallback or RESPONSE_RECEIPT mutation reuse
  retention_location_shape:
    current_physical_source: ops.retention_execution_receipts.location_counts as sqlx::types::Json<RetentionLocationCountV1Array>
    lock_identity:
    - retention_request_id
    - completed_at DESC
    - execution_generation DESC
    - id DESC
    rule: location_ordinal is not a physical column and is forbidden in SQL; per-location values are decoded only through the closed array validator
      and their canonical order/digest.
    required_if_row_level_location_mutation_is_introduced: add a normalized immutable child relation with an explicit ordinal, composite FK, grants,
      retention and repository round-trip before any SQL may lock or address one location independently.
  lifecycle_contract_physical_closure:
    response_request_sent:
      required: editorial.response_requests typed sent-binding columns/candidate key, immutable endpoint/provider version ledgers, exact delivery receipt composite and one workflow-worker mutation function matching private application persistence
      failure: DRAFT to SENT remains unavailable; status cannot be inferred from mutable heads or event presence
    conflict_commands:
      required: editorial.record_conflict_declaration exact signature must accept both PRESENT/UNKNOWN declaration and ABSENT withdrawal shapes, claim/finalize stored idempotency bytes, and emit the selected closed event exactly once
      failure: declareConflict and withdrawConflict remain unavailable; direct table INSERT is forbidden
    correction_publication:
      required: resolveCorrectionRequest typed function and base persistence row must implement the SERIALIZABLE correction+gate+publication graph and immutable receipt candidate keys
      failure: RESOLVED cannot map to PUBLISHED and cannot return success after only updating editorial.corrections
    restriction_restoration:
      required: publication access decision stores cause kind/id/digest, preserved prior state, release receipt linkage and immutable overlay digest; publishCase restoration accepts only an exact released cause and full fresh gate
      failure: restriction or restoration returns a typed unavailable/gate error without changing public projection
    retraction:
      required: private.PublishRetraction typed workflow function plus publication/execution composite candidate keys and exact receipt chain
      failure: RETRACTION execution stays POLICY_BLOCKED or fails typed; an event consumer cannot synthesize success
    noncase_hold:
      required: base placeLegalHold request/OpenAPI/persistence imports LegalHoldTargetBindingV1 and editorial.place_legal_hold exact procedure already declared by 0028
      failure: non-case target request is rejected rather than coerced into a synthetic case
    set_equality: every required item above must have migration columns/keys/grants/procedure, Rust repository and PostgreSQL concurrency/negative tests before status FINAL
derived_session_persistence_overlay:
  normative_source: specs/submission/addendum-derived-session-boundary.yaml
  relation: intake.submission_sessions
  additive_columns:
  - parent_session_id
  - scope_binding_digest
  - issuance_receipt_digest
  - rotation_sequence
  status_values:
  - ACTIVE
  - CONSUMED
  - REVOKED
  - EXPIRED
  token_storage: lowercase SHA-256 only; raw 32-byte base64url-no-padding values exist only in the BFF sealed cookie boundary
  common_replay_order:
  - Authenticate request-bound BFF assertion and compute operationId+bffIssuer+sessionTokenHash+idempotencyKeyHash plus exact request digest.
  - Lock ops.idempotency_keys and finalized encrypted response bytes before checking ACTIVE session state.
  - Same finalized digest returns exact status, safe headers and response bytes after consume/rotation with zero second domain, session, audit
    or outbox effect.
  - Changed digest returns IDEMPOTENCY_CONFLICT; different token, issuer, operation or key cannot retrieve another replay.
  - A new claim alone locks the ACTIVE session/domain graph, mutates, consumes or rotates, writes audit/outbox/receipt, stores exact response
    bytes and finalizes atomically.
  private_bff_broker_operations:
    issueCommunicationProfileSession:
      lock_order:
      - ops.idempotency_keys
      - eligible parent intake.submission_sessions
      - exact origin row
      - intake.communication_subjects
      - prior same-scope COMMUNICATION_PROFILE child
      - ops.audit_events chain head
      cardinality: one exact subject, zero-or-one prior child revoked, one new ACTIVE child, one issuance receipt and one finalized response
      parent_kinds:
      - SUBSCRIPTION_MANAGEMENT
      - RESPONSE_RECEIPT
      - CORRECTION_RECEIPT
    issueResponseAppealCreateSession:
      lock_order:
      - ops.idempotency_keys
      - RESPONSE_RECEIPT parent
      - response submission
      - response request
      - prior same-scope APPEAL_CREATE child
      - ops.audit_events chain head
      cardinality: one exact submission/request/receipt composite, one ACTIVE APPEAL_CREATE child, one issuance receipt and one finalized response
      parent_kinds:
      - RESPONSE_RECEIPT
    rotateResponseAppealStatusSession:
      lock_order:
      - ops.idempotency_keys
      - RESPONSE_RECEIPT parent
      - response submission
      - response request
      - exact appeal
      - prior APPEAL_STATUS child
      - ops.audit_events chain head
      cardinality: one exact appeal composite, zero-or-one prior status child revoked, one replacement ACTIVE child, one issuance receipt and
        one finalized response
      parent_kinds:
      - RESPONSE_RECEIPT
  operation_mutations:
    createResponseAppeal:
      session: APPEAL_CREATE ACTIVE->CONSUMED and APPEAL_STATUS NONE->ACTIVE
      atomic_group: appeal insert, audit, response.appeal_created.v1 outbox, appeal receipt, session consume/issue, token-free issuance receipt
        and finalized exact response bytes
    requestCommunicationEndpointLink:
      session: COMMUNICATION_PROFILE ACTIVE->REVOKED and replacement NONE->ACTIVE under identical subject/origin scope
    verifyCommunicationEndpointLink:
      session: endpoint challenge consumed plus COMMUNICATION_PROFILE ACTIVE->REVOKED and replacement NONE->ACTIVE under identical subject/origin
        scope
    unlinkCommunicationEndpoint:
      session: endpoint/authorization revocations plus COMMUNICATION_PROFILE ACTIVE->REVOKED and replacement NONE->ACTIVE under identical subject/origin
        scope
  cookie_profiles:
    appeal:
      name: gurine_response_appeal_session
      path: /respond/receipt/appeal
      kinds:
      - APPEAL_CREATE
      - APPEAL_STATUS
    communication_profile:
      name: gurine_communication_profile_session
      path: /communication-profile
      kinds:
      - COMMUNICATION_PROFILE
    privacy_request_receipt:
      name: gurine_privacy_request_receipt_session
      path: /privacy
      kinds:
      - PRIVACY_REQUEST_RECEIPT
    defaults:
      host_only: true
      httpOnly: true
      sameSite: Lax
      secure_in_production: true
  redaction: X-Gurine-Next-Submission-Session and all raw/hashed session credentials are absent from domain events, audit details, errors, logs,
    traces, metrics, analytics, URLs and browser storage.
r6d_backup_disposal_due_inventory_contract:
  authority: supervisor D1; the database owns only deterministic due inventory and the existing infra/scripts backup and restore operator remains the external physical-disposal owner
  relations:
    source: ops.r6d_entity_retention_execution_receipts_v1
    due_inventory: ops.r6d_backup_disposal_due_inventory_v1
  list_due:
    procedure: ops.list_due_r6d_backup_disposals_v1(integer)
    input: integer limit in 1..1000
    selection: terminal ANONYMIZE execution receipt whose backup_disposal_due_at is at or before the database evaluatedAt; no disposal-completion relation or exclusion exists in this wave
    order: [backup_disposal_due_at ASC, execution_receipt_id ASC]
    result:
      schema: R6dBackupDisposalDueListV1
      exact_top_level_keys: [evaluatedAt, dueCount, items]
      exact_item_keys: [executionReceiptId, executionReceiptDigest, entityKind, entityId, anonymizedAt, backupDisposalDueAt, scheduleId, scheduleDigest]
      due_count: exact returned item-array length
    repeatability: because no disposal-completion authority is stored in the database, the same due source receipt remains eligible on later calls; the result means due candidate, not confirmed outstanding backup artifact
  privileges:
    owner: gurine_migrator
    mutation: none; PUBLIC and every gurine runtime role have no disposal writer, and no new role or capability is introduced
    read: PUBLIC is revoked and only gurine_auditor may execute the bounded list owner; no application runtime role receives access
  external_operator_procedure:
    - Export the deterministic due candidate list without treating it as proof of an extant backup artifact.
    - Resolve the affected backup artifacts under the existing infra/scripts backup and restore operating boundary.
    - Perform physical disposal manually after the one-year due time; this wave adds no scheduler or automatic deletion.
    - Stop without a completion claim whenever artifact coverage, legal-hold absence, or independent absence verification cannot be established under the operator procedure.
  operator_owned_deferral:
    status: OPERATOR_OWNED_DEFERRED
    input_contract: specs/legal/operator-owned-launch-inputs.yaml#BACKUP_PHYSICAL_DISPOSAL_RECEIPT_AUTHORITY
    required_input: [external append-only receipt storage and access controls, authenticated producer and independent verifier, backup-artifact identity and N-to-M cardinality, allowed disposal methods and method-specific success evidence, authoritative absence-verification scope and evidence, exact immutable receipt ABI and digest or signature preimage]
    system_receipt_producer: none
    system_completion_claim: forbidden
    completed_item_exclusion: none
    forbidden_until_supplied: [database disposal receipt relation, database record owner, writer grant, new role, new capability, invented backupSetDigest, invented operatorReferenceDigest, invented disposalMethodCode enum]
  deployment: no operating schedule, policy seed, automatic disposal or database completion attestation is introduced in this wave
