        - ops.agent_provider_turns(agent_run_id,turn_ordinal,id)
        - ops.agent_tool_calls(agent_run_id,call_id)
        - ops.agent_reconciliation_evidence(agent_run_id,evidence_id,evidence_sha256)
        - ops.agent_run_control_receipts(agent_run_id,aggregate_version,id)
        - ops.budget_reservations(id)
        - ops.budget_reservation_ledger_entries(reservation_id,sequence)
        - ops.audit_events chain head
        - ops.outbox
      relations: [ops.idempotency_keys, ops.agent_runs, ops.agent_provider_turns, ops.agent_tool_calls, ops.agent_reconciliation_evidence, ops.agent_run_control_receipts, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.audit_events, ops.outbox]
      authorization: request-bound reconciliation-worker service assertion and current job fence; browser and human assertions are forbidden
      evidence_rule: exact run-bound reconciliation evidence ID+digest and target composite are locked; stale, cross-run, ambiguous or caller-only proof writes zero
      effect_owner: control-api-private.reconcileAgentRun
      atomic_transition_group: gurine.private.reconcileAgentRun.v2
      outbox: {events: [agent.run_control_changed.v2], cardinality: {agent.run_control_changed.v2: exactly-one}}
      receipt: {schema: AgentRunControlReceiptV2, storage: ops.agent_run_control_receipts plus finalized ops.idempotency_keys response bytes}
      repository_result: safe retry only from RECONCILIATION_REQUIRED; recovered result is reused, CANCEL_REQUESTED never returns directly to ACTIVE, and exact replay dispatches nothing

  private_action_executor_persistence_contract:
    isolation: SERIALIZABLE
    common_lock_prefix: [ops.idempotency_keys(scope,key_hash), ops.in_flight_effects(id), ops.execution_authorizations(execution_id,generation), ops.execution_attempts(execution_id,generation)]
    common_lock_suffix: [ops.audit_events chain head, ops.outbox, ops.execution_receipts(execution_id,receipt_sequence)]
    cardinality: exactly one current authorization, exactly one typed target effect, one audit, declared outbox set and one gapless execution receipt; exact replay writes zero
