      effect_owner: control-api.decideJourneyHandoff
      atomic_transition_group: gurine.command.decideJourneyHandoff.v1
      state_disposition: terminal old PENDING_ACK to ACKNOWLEDGED or DECLINED; optional compiled DECLINE replacement inserts generation+1 and performs a second parent/receipt transition to final WAITING_ACK
      compound_branches: [decline_with_replacement, expiry_with_replacement, supersession_with_replacement, terminal_outcome_with_cancellation]
      success_contract: {decision_receipt: required-old-terminal-step, replacement: nullable-complete-generation-plus-one-request, final_parent: required-authoritative-post-command-head}
      decision_reason_shape:
        discriminator: decision
        closed_decline_reason_codes: [CAPABILITY_UNAVAILABLE, OBJECT_SCOPE_MISMATCH, CONFLICT_OF_INTEREST, WORKLOAD_CAPACITY, DEPENDENCY_BLOCKED, SUBJECT_INVALID, OWNER_UNAVAILABLE, POLICY_BLOCKED, RECEIVER_DECLINED]
        branches:
          ACKNOWLEDGE: {reasonCode: MUST_BE_NULL, reason: MUST_BE_NULL, reasonDigest: MUST_BE_NULL, reasonEncrypted: MUST_BE_NULL}
          DECLINE: {reasonCode: REQUIRED_CLOSED_DECLINE_REASON_CODE, reason: REQUIRED_VALID_UNICODE_NUL_FREE_NFC_NON_WHITESPACE_1_TO_4000, reasonDigest: REQUIRED_SHA256_OF_EXACT_NFC_UTF8_BYTES, reasonEncrypted: REQUIRED_NEW_CLAIM_ONLY_RANDOMIZED_CIPHERTEXT}
      write_ownership:
        attempt_consume: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED]
        prepare: [ops.idempotency_keys]
        apply: [binding-specific domain relations, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events#command, ops.outbox]
        finalize: [ops.idempotency_keys]
        apply_forbidden: [ops.idempotency_keys, ops.assertion_replay_guard]
      transaction_identity:
        attempt_columns: [ops.assertion_replay_guard.attempt_transaction_xid8, ops.audit_events.attempt_transaction_xid8]
        attempt_predicate: both immutable rows are MVCC-visible, non-null and equal; their xid8 differs from Transaction-B pg_current_xact_id(); each producer bound it to server-side pg_current_xact_id() in Transaction A
        claim_column: ops.idempotency_keys.claim_transaction_xid8
        claim_predicate: BOUND_V1 NEW stores server-only pg_current_xact_id(); apply and finalize require equality with Transaction B's top-level xid under ordinary, SAVEPOINT and nested SAVEPOINT execution
        forbidden: [xmin, hard pg_xact_status committed predicate, caller xid input, legacy xid backfill]
        legacy: all legacy xid8 values remain NULL and are never proof
      relation_access_registry:
        prepare: {owner_claim: exactly-once, owner_replay: exactly-once-iff-FINAL_AVAILABLE, direct_ops_idempotency_keys: zero}
        apply: {direct_ops_idempotency_keys: exactly-one schema-qualified SELECT INTO STRICT of complete prepared-NEW tuple, direct_dml: zero, helper_calls: zero, owner_calls: zero}
        finalize: {pre_finalize_direct_read: exactly-one schema-qualified SELECT INTO STRICT FOR UPDATE of complete tuple, owner_finalize: exactly-once, owner_replay: zero, post_finalize_direct_readback: exactly-one complete tuple, equality: status/schema/media/header bytes/body bytes/digests/resource/receipt/audit/outbox/completed values plus preserved claim xid; JSON reserialization forbidden}
      idempotency:
        relation: ops.idempotency_keys
        contract: external-command-idempotency-v1
        key_sources: {external_actor_http: 'SHA256(UTF8(raw HTTP Idempotency-Key header))', internal_service_workflow: exact authenticated workload envelope idempotencyKeySha256}
        stable_business_identity: seven-field business hash excluding transport request and assertion-attempt identity
        non_substitution: key hash, transport request ID, wire request digest and business request hash are distinct fields and cannot substitute for one another
        authorization_attempt: fresh JTI replay-guard plus immutable attempt audit before the business transaction, with equal non-null persisted attempt_transaction_xid8 values from a distinct top-level transaction
        exact_replay_business_writes: 0
        changed_business_replay: IDEMPOTENCY_CONFLICT
      update_relations: ops.journey_handoffs includes one old UPDATE and a conditional new row; ops.journey_instances, ops.journey_transition_receipts, ops.audit_events and ops.outbox each include a conditional second ordered row for the replacement step
      cardinality:
        no_replacement: {journey_instance_updates: 1, old_handoff_updates: 1, new_handoffs: 0, transition_receipts: 1, audits: 1, outbox: 1, finalized_receipts: 1}
        with_replacement: {journey_instance_updates: 2, old_handoff_updates: 1, new_handoffs: 1, transition_receipts: 2, audits: 2, outbox: 2, finalized_receipts: 1}
        domain_adapter_effect: exact compiled binding cardinality
        exact_replay: {authorization_attempt_writes: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED], business_writes: 0, response: byte-identical-finalized}
      audit: {relation: ops.audit_events, new_success_rows: one-or-two by replacement branch, exact_replay_command_rows: 0, exact_replay_authorization_attempt_rows: 1, action: command.decideJourneyHandoff, authorization_action: ASSERTION_ATTEMPT_CONSUMED}
      outbox: {events: [journey.handoff_decided.v1, journey.handoff_requested.v1], cardinality: {journey.handoff_decided.v1: exactly-one, journey.handoff_requested.v1: zero-or-one iff replacement}, payload_source: specs/product/addendum-event-contracts.yaml}
      receipt: {schema: JourneyHandoffDecisionReceiptV1, contract: external-command-receipt-v1}
      errors: [INVALID_PARAMETER, ACTOR_ASSERTION_INVALID, ACTOR_ASSERTION_REPLAYED, SERVICE_ASSERTION_INVALID, SERVICE_ASSERTION_REPLAYED, RESOURCE_NOT_FOUND, CAPABILITY_DENIED, HANDOFF_RECEIVER_MISMATCH, HANDOFF_STATE_INVALID, HANDOFF_BINDING_MISMATCH, VERSION_CONFLICT, HANDOFF_EXPIRED, JOURNEY_TERMINAL, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
      repository_result: one SERIALIZABLE transaction calls typed prepare; FINAL_REPLAY returns stored status/media/header/body before encryption or domain lookup, while NEW alone persists claim_transaction_xid8, encrypts, applies the typed decisionReceipt nullable replacement and finalParent, calls owner-finalize once, and directly reads back the complete exact response tuple; success requires receipt/head parity and persisted byte equality before commit, with no replay-owner call, xmin proof or hard pg_xact_status predicate; wrong receiver stale version stale digest expiry terminal state and changed business replay write zero protected business rows
