rules:
- Migrations 0001 through 0024 are byte-immutable; physical owner additions are in 0025 through 0029 and the reviewed submission hardening is migration 0030.
- Runtime roles never own schema objects and receive only declared table/view/function grants.
- Every command stores idempotency, mutation, audit, outbox and receipt atomically; any failure rolls back all five.
- Repository methods return typed cardinality; zero and more-than-one are explicit errors and never synthetic success.
- JSONB payload columns are sqlx::types::Json<ClosedRustType>; serde_json::Value and string dispatch are forbidden.
- The statement-level source for every additive external command, private application command, base-operation atomic extension and private callback operation is specs/product/addendum-command-semantics.yaml; inventories are source-derived rather than frozen numeric counts.
- Query, command and callback persistence inventories are source-derived and exact set-equal to their authority registries; route-only, template-only
  and generic repository fallbacks are forbidden.
- One effect_owner and atomic_transition_group owns every command mutation. A worker may continue a durable attempt but cannot rematerialize a
  business effect owned by the initiating command.
