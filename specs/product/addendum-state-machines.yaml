  journey_instance:
    states: [ACTIVE, WAITING_ACK, BLOCKED, RECONCILIATION_REQUIRED, COMPLETED, CANCELLED, EXPIRED, REJECTED]
    terminal: [COMPLETED, CANCELLED, EXPIRED, REJECTED]
    edges:
      - {actor: journey-coordinator, from: NONE, to: ACTIVE, guard: exact-compiled-J01-through-J12-entry-root-object-owner-and-SLA-binding, event: journey.instance_started.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_INSTANCE_STARTED}
      - {actor: journey-coordinator, from: ACTIVE|BLOCKED|RECONCILIATION_REQUIRED, to: WAITING_ACK, guard: exact-compiled-edge-current-object-one-pending-generation-receiver-capability-authority-and-due-policy, event: journey.handoff_requested.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_REQUESTED}
