      - {operation: decideSupplierRelationshipAssertion, from: PENDING, to: VERIFIED, selector: VERIFY, guard: independent-human-and-expected-revision-evidence-digest, event: supplier.relationship_assertion_decided.v1, receipt: SupplierRelationshipAssertionReceiptV1, audit: SUPPLIER_RELATIONSHIP_ASSERTION_DECIDED}
      - {operation: decideSupplierRelationshipAssertion, from: PENDING, to: REJECTED|CONFLICTED|SUPERSEDED, selector: REJECT|MARK_CONFLICT|SUPERSEDE, guard: independent-human-and-expected-revision-evidence-digest, event: supplier.relationship_assertion_decided.v1, receipt: SupplierRelationshipAssertionReceiptV1, audit: SUPPLIER_RELATIONSHIP_ASSERTION_DECIDED}
    invariants: [creation always PENDING, verifiedBy and verifiedAt are null until independent decision, stale decisions mutate nothing, prior revisions remain immutable]

