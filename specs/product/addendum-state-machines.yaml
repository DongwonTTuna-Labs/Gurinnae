schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
rules:
  - Every listed state and edge is closed; unlisted transitions are invalid.
  - Every mutation uses the operation, capability, assurance, guards, expected version, event and receipt declared on its edge.
  - Terminal state is immutable; a changed object creates a new version or linked aggregate.
  - Machine and edge inventories are derived from the actual registry; historical 15/84 or intermediate 34/166 literals are non-normative and forbidden as completion gates.
  - Every mutation has exactly one effect owner and one atomic transition group. An operation edge inherits both from addendum-command-semantics; an actor edge derives owner=actor and group=machine.edge ordinal unless explicitly overridden.

registry_contract:
  machine_count: derived as len(machines)
  edge_count: derived as sum(len(machine.edges))
  count_rule: validators calculate both values from the registry and compare cross-file coverage sets; no numeric count literal is authoritative
  operation_disposition_count: derived as len(operation_dispositions)
  immutable_fact_lifecycle_count: derived as len(immutable_fact_lifecycles)
  edge_effect_owner:
    operation_edge: specs/product/addendum-command-semantics.yaml#external_commands[operation].effect_owner
    actor_edge: edge.effect_owner when present else edge.actor
  edge_atomic_transition_group:
    operation_edge: specs/product/addendum-command-semantics.yaml#external_commands[operation].atomic_transition_group
    actor_edge: explicit edge.atomic_transition_group when cross-aggregate, otherwise machine name plus edge ordinal
  closure: every additive command has exactly one operation_disposition; every event-producing actor is a logical component in addendum-event-contracts

machines:
  action_proposal:
    states: [DRAFT, PENDING_QUORUM, APPROVED, REJECTED, CHANGES_REQUIRED, WITHDRAWN, EXPIRED, SUPERSEDED]
    terminal: [APPROVED, REJECTED, CHANGES_REQUIRED, WITHDRAWN, EXPIRED, SUPERSEDED]
    edges:
      - {operation: createActionProposal, from: NONE, to: DRAFT, selector: origin-not-compensation, guard: typed-target-and-proposer-capability, event: action.proposal_created.v1}
      - {operation: createActionProposal, from: NONE, to: DRAFT, selector: origin-compensation, guard: typed-target-and-proposer-capability-and-immutable-succeeded-predecessor-link, event: action.proposal_created.v1}
      - {operation: updateActionDraft, from: DRAFT, to: SUPERSEDED+DRAFT_NEW_VERSION, guard: expected-version-and-content-digest, event: action.proposal_updated.v1}
      - {operation: submitActionForReview, from: DRAFT, to: PENDING_QUORUM, guard: current-preview-policy-and-quorum-plan, event: action.review_requested.v1}
      - {operation: submitActionDecision, from: PENDING_QUORUM, to: PENDING_QUORUM, selector: approve-counted-but-quorum-incomplete, guard: valid-independent-current-approve-decision, event: action.decision_recorded.v1}
      - {operation: submitActionDecision, from: PENDING_QUORUM, to: APPROVED, guard: exact-quorum-counted-and-no-blocker, event: action.decision_recorded.v1, effect_owner: control-api.submitActionDecision.final-approve, atomic_transition_group: gurine.command.submitActionDecision.v1}
      - {operation: submitActionDecision, from: PENDING_QUORUM, to: REJECTED, guard: first-committed-terminal-reject, event: action.decision_recorded.v1}
      - {operation: submitActionDecision, from: PENDING_QUORUM, to: CHANGES_REQUIRED, guard: nonempty-owned-change-tasks, event: action.decision_recorded.v1}
      - {operation: withdrawActionProposal, from: DRAFT|PENDING_QUORUM, to: WITHDRAWN, guard: exact-current-version-content-and-state-digest-no-execution-authorization-and-creator-or-current-owner, event: action.proposal_withdrawn.v1}
      - {operation: withdrawActionDecision, from: PENDING_QUORUM, to: PENDING_QUORUM, guard: same-human-current-unwithdrawn-APPROVE-and-final-authorization-not-committed, event: action.decision_withdrawn.v1}
      - {actor: expiry-worker, from: DRAFT|PENDING_QUORUM, to: EXPIRED, guard: expires-at-elapsed-and-version-current, event: action.proposal_updated.v1, receipt: ActionProposalExpiryReceiptV1}
      - {actor: superseding-origin, from: DRAFT|PENDING_QUORUM, to: SUPERSEDED, guard: target-or-origin-version-changed, event: action.proposal_updated.v1}
    lock_order: [action_proposals, action_proposal_versions, action_review_assignments, action_decisions, execution_authorizations]
    race: first SERIALIZABLE terminal commit wins; losers receive ACTION_DECISION_CLOSED without mutation
  action_review_assignment:
    states: [VACANT, ASSIGNED, IN_PROGRESS, COMPLETED, RECUSED, CANCELLED]
    terminal: [COMPLETED, RECUSED, CANCELLED]
    edges:
      - {operation: submitActionForReview, from: NONE, to: ASSIGNED, guard: immutable-quorum-slot, event: action.review_requested.v1}
      - {operation: claimActionReview, from: ASSIGNED, to: IN_PROGRESS, guard: expected-assignment-version-and-slot-capability, event: action.review_claimed.v1}
      - {operation: submitActionDecision, from: IN_PROGRESS, to: COMPLETED, guard: decision-variant-not-recuse, event: action.decision_recorded.v1}
      - {operation: submitActionDecision, from: ASSIGNED|IN_PROGRESS, to: RECUSED, guard: typed-conflict-and-generation-plus-one-replacement-or-vacancy-created-atomically, event: action.decision_recorded.v1}
      - {operation: withdrawActionDecision, from: NONE, to: VACANT|ASSIGNED, guard: prior-COMPLETED-generation-remains-immutable-and-generation-plus-one-uses-deterministic-current-eligibility, event: action.decision_withdrawn.v1}
      - {actor: action-review-assignment-coordinator, from: VACANT, to: ASSIGNED, guard: fill_action_review_vacancy_v1-locks-current-vacancy-and-deterministic-current-eligible-independent-reviewer-and-same-slot-generation, event: action.review_vacancy_filled.v1}
      - {actor: proposal-terminalizer, from: VACANT|ASSIGNED|IN_PROGRESS, to: CANCELLED, guard: proposal-terminal-or-superseded, caused_by_event: action.proposal_updated.v1|action.proposal_withdrawn.v1, event: NONE, receipt: ActionReviewAssignmentCancelledReceiptV1, audit: ACTION_REVIEW_ASSIGNMENT_CANCELLED}
  action_execution:
    states: [POLICY_BLOCKED, QUEUED, RUNNING, RETRYABLE_FAILED, CANCEL_REQUESTED, RECONCILIATION_REQUIRED, SUCCEEDED, PARTIALLY_SUCCEEDED, PERMANENT_FAILED, CANCELLED, EXPIRED]
    terminal: [POLICY_BLOCKED, SUCCEEDED, PARTIALLY_SUCCEEDED, PERMANENT_FAILED, CANCELLED, EXPIRED]
    edges:
      - {operation: submitActionDecision, from: NONE, to: POLICY_BLOCKED, guard: final-approve-and-current-policy-blocked, event: operations.effect_policy_blocked.v1, effect_owner: control-api.submitActionDecision.final-approve, atomic_transition_group: gurine.command.submitActionDecision.v1}
      - {operation: submitActionDecision, from: NONE, to: QUEUED, guard: final-approve-and-all-current-fences-pass, event: action.execution_authorized.v1, effect_owner: control-api.submitActionDecision.final-approve, atomic_transition_group: gurine.command.submitActionDecision.v1}
      - {actor: execution-worker, from: QUEUED, to: RUNNING, guard: existing-generation-attempt-lease-claimed-under-effect-and-attempt-locks, event: NONE, receipt: ActionExecutionClaimReceiptV1, audit: ACTION_EXECUTION_CLAIMED}
      - {actor: execution-worker, from: RUNNING, to: SUCCEEDED, guard: definitive-effect-and-complete-receipt, event: action.execution_completed.v1}
      - {actor: execution-worker, from: RUNNING, to: PARTIALLY_SUCCEEDED, guard: definitive-known-mixed-effects-with-complete-per-target-receipts-and-no-unknown-effect, event: action.execution_completed.v1}
      - {actor: execution-worker, from: RUNNING, to: RETRYABLE_FAILED, guard: definitive-not-accepted-and-safe-retry-proof-and-dispatch-attempt-count-below-3, event: action.execution_completed.v1}
      - {actor: execution-worker, from: RUNNING, to: PERMANENT_FAILED, guard: definitive-permanent-failure-or-definitive-not-accepted-at-dispatch-attempt-count-3, event: action.execution_completed.v1}
      - {actor: execution-worker, from: RUNNING, to: RECONCILIATION_REQUIRED, guard: any-possible-effect-without-definitive-proof, event: action.execution_completed.v1}
      - {actor: analysis-worker, private_command: private.ExecuteProviderControl, from: RUNNING, to: SUCCEEDED|PERMANENT_FAILED|RECONCILIATION_REQUIRED, selector: action-kind-PROVIDER_CONTROL, guard: ops.claim_provider_control_execution_v1 committed the exact current authorization providerOperationId providerId expectedVersion target digest capability assurance generation and fencing token before egress and exactly one ops.complete_provider_control_execution_v1 or ops.fail_provider_control_execution_v1 consumes that fence with definitive connection-test proof, event: action.execution_completed.v1, effect_owner: analysis-worker.provider-control-executor, atomic_transition_group: gurine.private.ExecuteProviderControl.v1}
      - {operation: cancelActionExecution, from: QUEUED|RETRYABLE_FAILED|RUNNING, to: CANCELLED, selector: locked-current-attempt-has-no-dispatch-ordinal, guard: effect-then-authorization-then-attempt-lock-wins-before-dispatch, event: action.execution_cancel_requested.v1}
      - {operation: cancelActionExecution, from: RUNNING|RECONCILIATION_REQUIRED, to: CANCEL_REQUESTED, selector: locked-current-attempt-has-dispatch-ordinal-or-possible-effect, guard: dispatch-or-possible-effect-proof, event: action.execution_cancel_requested.v1}
      - {actor: reconciliation-worker, from: CANCEL_REQUESTED, to: CANCELLED|SUCCEEDED|PERMANENT_FAILED|RECONCILIATION_REQUIRED, selector: provider-proof-resolution, guard: authenticated-current-provider-observation-or-bounded-ambiguity, event: action.execution_completed.v1}
      - {operation: retryActionExecution, from: RETRYABLE_FAILED, to: QUEUED, guard: generation-increment-and-valid-safe-retry-proof, event: action.execution_retry_requested.v1}
      - {actor: reconciliation-worker, from: RECONCILIATION_REQUIRED, to: SUCCEEDED|PARTIALLY_SUCCEEDED|PERMANENT_FAILED|RETRYABLE_FAILED|CANCELLED, guard: definitive-proof-and-retryable-only-below-dispatch-limit, event: action.execution_completed.v1}
      - {actor: action-execution-worker, from: QUEUED|RETRYABLE_FAILED, to: EXPIRED, guard: authorization-expired-and-no-provider-attempt, event: action.execution_completed.v1}
    invariants:
      - POLICY_BLOCKED is terminal for the exact approved bytes; changed policy or content requires a new ActionProposal rather than retry.
      - PARTIALLY_SUCCEEDED is a known-mixed terminal result and is never counted as success or paid value.
      - Maximum effect attempts is 3 and a retry keeps contentDigest, approvalDigest, rendered bytes and provider idempotency key.
      - Blind retry, silent fallback, lower-generation claim and synthetic terminal receipt are forbidden.
      - Compensation creates a new linked ActionProposal and ExecutionAuthorization; the original SUCCEEDED execution remains immutable.
      - getActionExecutionReceipt reads only the append-only stored receipt chain.
      - The aggregate state is stored only in ops.in_flight_effects; authorization, attempt and receipt states have their own closed machines and are not copied enum-for-enum.
      - Final APPROVE creates the effect exactly once inside submitActionDecision; execution workers cannot materialize an effect from an event replay.
      - A third definitive failed dispatch terminalizes PERMANENT_FAILED in the same receipt transaction and cannot remain RETRYABLE_FAILED.
  action_execution_attempt:
    states: [QUEUED, CLAIMED, DISPATCHING, PROVIDER_ACCEPTED, SUCCEEDED, PARTIALLY_SUCCEEDED, RETRYABLE_FAILED, PERMANENT_FAILED, CANCEL_REQUESTED, CANCELLED, RECONCILIATION_REQUIRED]
    terminal: [SUCCEEDED, PARTIALLY_SUCCEEDED, PERMANENT_FAILED, CANCELLED]
    edges:
      - {operation: submitActionDecision, from: NONE, to: QUEUED, guard: generation-one-authorization-created-in-final-approve-atomic-group, event: action.execution_authorized.v1, effect_owner: control-api.submitActionDecision.final-approve, atomic_transition_group: gurine.command.submitActionDecision.v1}
      - {operation: retryActionExecution, from: NONE, to: QUEUED, guard: next-generation-authorization-and-safe-retry-proof, event: action.execution_retry_requested.v1}
      - {actor: execution-worker, from: QUEUED, to: CLAIMED, guard: lease-and-fencing-token-CAS-under-effect-then-attempt-lock, event: NONE, receipt: ActionExecutionClaimReceiptV1, audit: ACTION_EXECUTION_CLAIMED}
      - {actor: execution-worker, from: CLAIMED, to: DISPATCHING, guard: current-fencing-token-and-assign-next-unique-dispatch-ordinal-with-aggregate-count-increment-before-egress, event: NONE, receipt: ActionExecutionDispatchStartedReceiptV1, audit: ACTION_EXECUTION_DISPATCH_STARTED}
      - {operation: cancelActionExecution, from: QUEUED|CLAIMED, to: CANCELLED, guard: locked-attempt-has-null-dispatch-ordinal-and-cancel-CAS-wins, event: action.execution_cancel_requested.v1}
      - {operation: cancelActionExecution, from: DISPATCHING|PROVIDER_ACCEPTED|RECONCILIATION_REQUIRED, to: CANCEL_REQUESTED, guard: dispatch-ordinal-or-possible-acceptance-exists, event: action.execution_cancel_requested.v1}
      - {actor: execution-worker, from: DISPATCHING, to: PROVIDER_ACCEPTED, guard: definitive-authenticated-provider-acceptance, event: NONE, receipt: ActionExecutionProviderAcceptedReceiptV1, audit: ACTION_EXECUTION_PROVIDER_ACCEPTED}
      - {actor: execution-worker, from: DISPATCHING|PROVIDER_ACCEPTED, to: SUCCEEDED, guard: definitive-success-and-complete-cost-receipt, event: action.execution_completed.v1}
      - {actor: execution-worker, from: DISPATCHING|PROVIDER_ACCEPTED, to: PARTIALLY_SUCCEEDED, guard: definitive-known-mixed-per-target-results-complete-cost-and-no-unknown-effect, event: action.execution_completed.v1}
      - {actor: execution-worker, from: DISPATCHING, to: RETRYABLE_FAILED, guard: definitive-not-accepted-and-safe-proof-and-aggregate-dispatch-count-below-3, event: action.execution_completed.v1}
      - {actor: execution-worker, from: DISPATCHING|PROVIDER_ACCEPTED, to: PERMANENT_FAILED, guard: definitive-permanent-failure-or-definitive-not-accepted-at-count-3, event: action.execution_completed.v1}
      - {actor: execution-worker, from: DISPATCHING|PROVIDER_ACCEPTED|CANCEL_REQUESTED, to: RECONCILIATION_REQUIRED, guard: possible-effect-without-definitive-proof, event: action.execution_completed.v1}
      - {actor: reconciliation-worker, from: CANCEL_REQUESTED|RECONCILIATION_REQUIRED, to: SUCCEEDED|PARTIALLY_SUCCEEDED|PERMANENT_FAILED|RETRYABLE_FAILED|CANCELLED, guard: authenticated-definitive-proof-with-retryable-below-count-3-and-cancelled-only-not-accepted-or-provider-cancelled, event: action.execution_completed.v1}
    invariants:
      - One attempt row exists per authorized generation; lease reclamation changes only lease/fencing fields and appends a claim receipt.
      - CLAIMED is not proof of egress. Dispatch exists only after dispatchOrdinal assignment and aggregate dispatchAttemptCount increment commit atomically.
      - A stale fencing token, lower generation or cancelled lease cannot dispatch or append an observation.
      - PROVIDER_ACCEPTED never becomes RETRYABLE_FAILED or CANCELLED without authenticated provider cancellation/non-acceptance proof.
  task:
    states: [OPEN, IN_PROGRESS, BLOCKED, DONE, CANCELLED]
    terminal: [DONE, CANCELLED]
    edges:
      - {actor: action-execution-worker, private_command: private.CreateTaskFromApprovedAction, from: NONE, to: OPEN, guard: exact-current-TASK-execution-authorization-target-version-assignee-scope-and-effect-idempotency-binding, event: NONE, receipt: TaskExecutionReceiptV1, audit: ACTION_TASK_CREATED, effect_owner: action-execution-worker.task-executor, atomic_transition_group: gurine.private.CreateTaskFromApprovedAction.v1}
    invariants: [Creation is owned only by the private executor; subsequent task lifecycle remains the typed base task authority, Exact replay returns the stored task receipt and creates no second task]
  procurement_comparable_candidate:
    states: [CANDIDATE]
    terminal: [CANDIDATE]
    edges:
      - {actor: action-execution-worker, private_command: private.MaterializeComparableCandidate, from: NONE, to: CANDIDATE, guard: exact-current-COMPARABLE-execution-authorization-target-and-candidate-line-item-version-digest-and-comparability-evidence, event: NONE, receipt: ComparableExecutionReceiptV1, audit: PROCUREMENT_COMPARABLE_CANDIDATE_MATERIALIZED, effect_owner: action-execution-worker.comparable-executor, atomic_transition_group: gurine.private.MaterializeComparableCandidate.v1}
    invariants: [A candidate is not a verified comparable fact, Physical target and candidate keys are owned by the procurement canonical contract]
  kill_switch:
    states: [INACTIVE, ACTIVE, EXPIRED_REVIEW_REQUIRED]
    terminal: []
    edges:
      - {actor: action-execution-worker, private_command: private.ApplyKillSwitchCommand, from: INACTIVE|EXPIRED_REVIEW_REQUIRED, to: ACTIVE, selector: ACTIVATE, guard: exact-current-KILL_SWITCH-execution-authorization-and-expected-switch-generation, event: operations.kill_switch_activated.v1, receipt: KillSwitchExecutionReceiptV1, audit: KILL_SWITCH_ACTIVATED, effect_owner: action-execution-worker.kill-switch-executor, atomic_transition_group: gurine.private.ApplyKillSwitchCommand.v1}
      - {actor: action-execution-worker, private_command: private.ApplyKillSwitchCommand, from: ACTIVE, to: INACTIVE, selector: DEACTIVATE, guard: exact-current-KILL_SWITCH-execution-authorization-and-expected-switch-generation, event: operations.kill_switch_deactivated.v1, receipt: KillSwitchExecutionReceiptV1, audit: KILL_SWITCH_DEACTIVATED, effect_owner: action-execution-worker.kill-switch-executor, atomic_transition_group: gurine.private.ApplyKillSwitchCommand.v1}
      - {actor: action-execution-worker, private_command: private.ApplyKillSwitchCommand, from: ACTIVE, to: ACTIVE, selector: EXTEND, guard: exact-current-KILL_SWITCH-execution-authorization-later-expiry-and-expected-switch-generation, event: operations.kill_switch_extended.v1, receipt: KillSwitchExecutionReceiptV1, audit: KILL_SWITCH_EXTENDED, effect_owner: action-execution-worker.kill-switch-executor, atomic_transition_group: gurine.private.ApplyKillSwitchCommand.v1}
      - {actor: kill-switch-expiry-worker, from: ACTIVE, to: EXPIRED_REVIEW_REQUIRED, guard: expires-at-elapsed, event: NONE, receipt: KillSwitchExpiryReviewReceiptV1, audit: KILL_SWITCH_EXPIRED_REVIEW_REQUIRED}
    invariants: [Expiry never resumes work or deactivates a fence, Stale cache unknown target or unavailable authority fails closed]
  commercial_control_projection:
    states: [NORMAL, PAUSE_ACKNOWLEDGEMENT_PENDING, PAUSED, RESUME_ACKNOWLEDGEMENT_PENDING, RECONCILIATION_REQUIRED]
    terminal: []
    edges:
      - {actor: action-execution-worker, private_command: private.ApplyCommercialControl, from: NORMAL, to: PAUSE_ACKNOWLEDGEMENT_PENDING, selector: PAUSE_OR_SUSPEND, guard: exact-current-COMMERCIAL_CONTROL-execution-authorization-and-product-fence-committed-before-external-import, event: commercial.control_execution_recorded.v1, effect_owner: action-execution-worker.commercial-control-executor, atomic_transition_group: gurine.private.ApplyCommercialControl.v1}
      - {actor: action-execution-worker, private_command: private.ApplyCommercialControl, from: PAUSED, to: RESUME_ACKNOWLEDGEMENT_PENDING, selector: RESUME_OR_REACTIVATE, guard: exact-current-COMMERCIAL_CONTROL-execution-authorization-and-all-closure-rights-readiness-no-trigger-evidence-while-product-fence-remains-active, event: commercial.control_execution_recorded.v1, effect_owner: action-execution-worker.commercial-control-executor, atomic_transition_group: gurine.private.ApplyCommercialControl.v1}
      - {actor: commercial-control-reconciliation-worker, from: PAUSE_ACKNOWLEDGEMENT_PENDING, to: PAUSED, guard: exact-external-import-and-distinct-matching-acknowledgement-receipts, event: commercial.control_external_effect_acknowledged.v1}
      - {actor: commercial-control-reconciliation-worker, from: RESUME_ACKNOWLEDGEMENT_PENDING, to: NORMAL, guard: exact-external-import-and-distinct-matching-acknowledgement-receipts-then-release-product-fence-last, event: commercial.control_external_effect_acknowledged.v1}
      - {actor: commercial-control-reconciliation-worker, from: PAUSE_ACKNOWLEDGEMENT_PENDING|RESUME_ACKNOWLEDGEMENT_PENDING, to: RECONCILIATION_REQUIRED, guard: partial-ambiguous-stale-or-mismatched-import-or-acknowledgement, event: commercial.control_reconciliation_required.v1}
    invariants: [A trigger or metric cannot mutate this projection directly, External import and acknowledgement are distinct immutable receipts, Automatic expiry or resume is forbidden, Missing acknowledgement is never PAUSED NORMAL SUCCEEDED revenue qualification or paid value]
  paid_evidence_packet:
    states: [AWAITING_TERMINAL_BINDING, FINALIZED, INVALIDATED]
    terminal: [FINALIZED, INVALIDATED]
    edges:
      - {actor: workflow-worker, private_command: private.MaterializePaidEvidencePacket, from: NONE, to: AWAITING_TERMINAL_BINDING, guard: claimed-source-event-exact-qualification-contract-subject-and-duplicate-free-typed-member-candidate-keys, event: product.paid_evidence_packet_subject_persisted.v1, effect_owner: workflow-worker.paid-evidence-packet-materializer, atomic_transition_group: gurine.private.MaterializePaidEvidencePacket.v1}
      - {actor: paid-terminal-binding-worker, from: AWAITING_TERMINAL_BINDING, to: FINALIZED, guard: exactly-one-definitive-organization-decision-or-applied-delivered-read-terminal-binding-and-complete-final-digest, event: product.paid_terminal_receipt_bound.v1}
      - {actor: paid-terminal-binding-worker, from: AWAITING_TERMINAL_BINDING, to: INVALIDATED, guard: qualification-contract-subject-or-member-candidate-definitively-invalid-before-terminal-binding, event: NONE, receipt: PaidEvidencePacketInvalidationReceiptV1, audit: PAID_EVIDENCE_PACKET_INVALIDATED}
    invariants: [AI output proposal approval provider acceptance page view invoice and technical action success are never a paid terminal, Final packet digest is derived only after the one-way terminal binding and cannot reverse-reference an outcome fact]
  communication_intent:
    states: [CREATED, MATERIALIZED, POLICY_BLOCKED, CANCELLED]
    terminal: [MATERIALIZED, POLICY_BLOCKED, CANCELLED]
    edges:
      - {actor: action-execution-worker, private_command: private.DispatchCommunicationIntent, from: NONE, to: CREATED, selector: all-current-communication-fences-pass, guard: exact-current-COMMUNICATION-execution-authorization-and-rendering-recipient-endpoint-provider-consent-suppression-policy-budget-bindings, event: communication.intent_created.v1, effect_owner: action-execution-worker.communication-executor, atomic_transition_group: gurine.private.DispatchCommunicationIntent.v1}
      - {actor: action-execution-worker, private_command: private.DispatchCommunicationIntent, from: NONE, to: POLICY_BLOCKED, selector: definitive-pre-dispatch-policy-denial, guard: exact-current-COMMUNICATION-execution-authorization-and-one-typed-blocker-with-zero-egress, event: operations.effect_policy_blocked.v1, effect_owner: action-execution-worker.communication-executor, atomic_transition_group: gurine.private.DispatchCommunicationIntent.v1}
      - {actor: policy-materializer, from: CREATED, to: MATERIALIZED, guard: exact-class-purpose-basis-policy, event: NONE, receipt: CommunicationIntentMaterializedReceiptV1, audit: COMMUNICATION_INTENT_MATERIALIZED}
      - {actor: policy-materializer, from: CREATED, to: POLICY_BLOCKED, guard: any-missing-or-denied-policy-input, event: NONE, receipt: CommunicationIntentPolicyBlockedReceiptV1, audit: COMMUNICATION_INTENT_POLICY_BLOCKED}
      - {actor: source-cancellation, from: CREATED, to: CANCELLED, guard: source-event-invalidated-before-materialization, event: NONE, receipt: CommunicationIntentCancelledReceiptV1, audit: COMMUNICATION_INTENT_CANCELLED}
  communication_draft:
    states: [DRAFT, AWAITING_APPROVAL, APPROVED, REJECTED, CHANGES_REQUIRED, EXPIRED, SUPERSEDED]
    terminal: [APPROVED, REJECTED, CHANGES_REQUIRED, EXPIRED, SUPERSEDED]
    edges:
      - {actor: materializer, from: NONE, to: DRAFT, guard: rendering-complete, event: NONE, receipt: CommunicationDraftMaterializedReceiptV1, audit: COMMUNICATION_DRAFT_MATERIALIZED}
      - {actor: policy-engine, from: DRAFT, to: APPROVED, guard: system-transactional-or-consented-subscription-with-source-decision, event: NONE, receipt: CommunicationDraftPolicyApprovalReceiptV1, audit: COMMUNICATION_DRAFT_POLICY_APPROVED}
      - {operation: submitActionForReview, from: DRAFT, to: AWAITING_APPROVAL, guard: discretionary-external, event: action.review_requested.v1}
      - {operation: submitActionDecision, from: AWAITING_APPROVAL, to: APPROVED|REJECTED|CHANGES_REQUIRED, guard: exact-communication-quorum, event: action.decision_recorded.v1}
      - {actor: expiry-worker, from: DRAFT|AWAITING_APPROVAL, to: EXPIRED, guard: expires-at-elapsed, event: NONE, receipt: CommunicationDraftExpiryReceiptV1, audit: COMMUNICATION_DRAFT_EXPIRED}
      - {actor: edit, from: DRAFT|AWAITING_APPROVAL, to: SUPERSEDED, guard: new-rendering-version, event: NONE, receipt: CommunicationDraftSupersedeReceiptV1, audit: COMMUNICATION_DRAFT_SUPERSEDED}
  outbound_delivery:
    states: [QUEUED, SENDING, PROVIDER_ACCEPTED, DELIVERED, READ, RETRY_SCHEDULED, FAILED_PERMANENT, RECONCILIATION_REQUIRED, SUPPRESSED, CANCELLED]
    terminal: [READ, FAILED_PERMANENT, SUPPRESSED, CANCELLED]
    provider_terminal_allowed: [PROVIDER_ACCEPTED, DELIVERED]
    edges:
