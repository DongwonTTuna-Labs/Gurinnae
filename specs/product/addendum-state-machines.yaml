      - {operation: decideJourneyHandoff, from: WAITING_ACK, to: ACTIVE|BLOCKED, selector: DECLINE, guard: exact-receiver-and-closed-reason-with-compiled-deterministic-replacement-or-blocked-policy, event: journey.handoff_decided.v1}
      - {actor: journey-handoff-scheduler, from: WAITING_ACK, to: WAITING_ACK, guard: authoritative-clock-due-and-monotonic-NOT_DUE-to-DUE-or-DUE-to-ESCALATED-without-owner-change, event: journey.handoff_escalated.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_ESCALATED}
      - {actor: journey-handoff-scheduler, from: WAITING_ACK, to: ACTIVE|BLOCKED|EXPIRED, guard: authoritative-clock-expired-and-compiled-replacement-or-terminal-policy-with-one-race-winner, event: journey.handoff_expired.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_EXPIRED}
      - {actor: journey-coordinator, from: ACTIVE|BLOCKED|RECONCILIATION_REQUIRED|WAITING_ACK, to: ACTIVE|BLOCKED|RECONCILIATION_REQUIRED|COMPLETED|CANCELLED|EXPIRED|REJECTED, guard: exact-registered-definitive-subject-effect-and-outcome-class; no pending handoff unless the compiled terminal policy first appends HANDOFF_CANCELLED in the same two-step transaction, event: journey.outcome_recorded.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_OUTCOME_RECORDED}
    compound_branches:
      decline_with_replacement:
        selector: DECLINE with exact compiled replacement policy
        step_1: {parent_from: WAITING_ACK, parent_to: ACTIVE, handoff_from: PENDING_ACK, handoff_to: DECLINED, receipt: HANDOFF_DECLINED, escalation_to: RESOLVED, clear_active_handoff: true, clear_next_owner: true, preserve_current_owner: true, due_at: compiled replacement-origin node SLA checkpoint}
        step_2: {parent_from: ACTIVE, parent_to: WAITING_ACK, handoff_from: NONE, handoff_to: PENDING_ACK, receipt: HANDOFF_REQUESTED, escalation_to: NOT_DUE, generation_delta: 1, set_active_handoff: true, set_next_owner: true, due_at: first escalation threshold or immutable hard expiry}
      expiry_with_replacement:
        selector: database clock at or after immutable hard expiry with exact compiled replacement policy
        step_1: {parent_from: WAITING_ACK, parent_to: ACTIVE, handoff_from: PENDING_ACK, handoff_to: EXPIRED, receipt: HANDOFF_EXPIRED, escalation_to: RESOLVED, clear_active_handoff: true, clear_next_owner: true, preserve_current_owner: true, due_at: compiled replacement-origin node SLA checkpoint}
        step_2: {parent_from: ACTIVE, parent_to: WAITING_ACK, handoff_from: NONE, handoff_to: PENDING_ACK, receipt: HANDOFF_REQUESTED, escalation_to: NOT_DUE, generation_delta: 1, set_active_handoff: true, set_next_owner: true, due_at: first escalation threshold or immutable hard expiry}
      supersession_with_replacement:
        selector: exact compiled supersession policy only
        step_1: {parent_from: WAITING_ACK, parent_to: ACTIVE, handoff_from: PENDING_ACK, handoff_to: SUPERSEDED, receipt: HANDOFF_SUPERSEDED, escalation_to: RESOLVED, clear_active_handoff: true, clear_next_owner: true, preserve_current_owner: true, due_at: compiled replacement-origin node SLA checkpoint}
        step_2: {parent_from: ACTIVE, parent_to: WAITING_ACK, handoff_from: NONE, handoff_to: PENDING_ACK, receipt: HANDOFF_REQUESTED, escalation_to: NOT_DUE, generation_delta: 1, set_active_handoff: true, set_next_owner: true, due_at: first escalation threshold or immutable hard expiry}
      terminal_outcome_with_cancellation:
        selector: exact compiled terminal outcome cancellation policy only
        step_1: {parent_from: WAITING_ACK, parent_to: ACTIVE, handoff_from: PENDING_ACK, handoff_to: CANCELLED, receipt: HANDOFF_CANCELLED, escalation_to: RESOLVED, clear_active_handoff: true, clear_next_owner: true, preserve_current_owner: true, due_at: compiled destination-node or terminal-policy SLA}
        step_2: {parent_from: ACTIVE, parent_to: exact compiled outcome state, receipt: OUTCOME_RECORDED, active_handoff: null, next_owner: null, due_at: same as step-1 resulting_due_at}
      shared_invariants:
        - each step advances parent version and receipt sequence by exactly one and independently satisfies parent and receipt checks
        - receipt prior_due_at equals the immediately prior parent due_at and receipt resulting_due_at equals that step persisted parent due_at
        - both steps occur in one SERIALIZABLE transaction and one atomic transition group
    invariants:
      - current owner changes only on the ACKNOWLEDGE edge and equals the persisted receiver binding; decline, escalation and expiry never silently transfer ownership.
      - exactly one immutable transition receipt advances each version and the parent receipt head, receipt sequence and digest match before commit.
      - HTTP success, queued work, provider acceptance, AI output, synthetic fixture or an unverified projection is never a durable journey outcome.
      - every edge, object kind, node, receiver, capability, assurance, SLA and adapter is compiled from the canonical journey and twenty-row handoff registry; regex is shape-only.
      - deterministic decline or expiry replacement consumes two consecutive parent versions and receipts in one transaction: terminal old generation first, then HANDOFF_REQUESTED for generation+1; the final parent head is the request receipt.
      - compiled supersession and terminal-outcome cancellation use the same two-step rule with HANDOFF_SUPERSEDED or HANDOFF_CANCELLED first; no other branch may advance by two.
  journey_handoff:
    states: [PENDING_ACK, ACKNOWLEDGED, DECLINED, EXPIRED, CANCELLED, SUPERSEDED]
    terminal: [ACKNOWLEDGED, DECLINED, EXPIRED, CANCELLED, SUPERSEDED]
    edges:
      - {actor: journey-coordinator, from: NONE, to: PENDING_ACK, guard: exact-compiled-binding-and-generation-plus-one-with-one-pending-unique-constraint, event: journey.handoff_requested.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_REQUESTED}
      - {operation: decideJourneyHandoff, from: PENDING_ACK, to: ACKNOWLEDGED, selector: ACKNOWLEDGE, guard: exact-current-version-binding-receiver-capability-scope-assurance-unexpired-and-null-reason, event: journey.handoff_decided.v1}
      - {operation: decideJourneyHandoff, from: PENDING_ACK, to: DECLINED, selector: DECLINE, guard: exact-current-version-binding-receiver-capability-scope-assurance-unexpired-and-encrypted-closed-reason, event: journey.handoff_decided.v1}
      - {actor: journey-handoff-scheduler, from: PENDING_ACK, to: PENDING_ACK, guard: monotonic-due-or-escalated-receipt-with-no-owner-or-binding-change, event: journey.handoff_escalated.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_ESCALATED}
      - {actor: journey-handoff-scheduler, from: PENDING_ACK, to: EXPIRED, guard: database-clock-expired-and-human-decision-race-lost, event: journey.handoff_expired.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_EXPIRED}
      - {actor: journey-coordinator, from: PENDING_ACK, to: CANCELLED, guard: source-terminal-or-explicit-registered-cancellation-before-acknowledgement, event: NONE, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_CANCELLED}
      - {actor: journey-coordinator, from: PENDING_ACK, to: SUPERSEDED, guard: generation-plus-one-replacement-created-only-by-the-exact-compiled-supersession-policy, event: NONE, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_SUPERSEDED}
    invariants:
      - immutable routing and subject columns never change; a replacement is a new generation rather than an update of a terminal handoff.
      - PENDING_ACK has no decision fields, ACKNOWLEDGED has no reason, DECLINED has encrypted reason plus digest, and system terminal states use only exact system reason codes.
      - an exact idempotent replay returns the stored receipt and changed bytes, stale version, stale digest, wrong receiver, expiry or terminal state write zero rows.
  journey_escalation:
    states: [NOT_DUE, DUE, ESCALATED, RESOLVED]
    terminal: [RESOLVED]
    identity: journey_instance_id+handoff_generation
    edges:
      - {id: JE-01, actor: journey-coordinator, from: NONE, to: NOT_DUE, guard: exact-new-pending-handoff-generation-and-compiled-due-policy, event: journey.handoff_requested.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_REQUESTED, atomic_transition_group: same-as-owning-handoff-request-step}
      - {id: JE-02, actor: journey-handoff-scheduler, from: NOT_DUE, to: DUE, guard: locked-current-pending-generation-and-database-clock-at-or-after-first-escalation-threshold-and-before-hard-expiry, event: journey.handoff_escalated.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_ESCALATED, atomic_transition_group: journey-handoff-first-escalation}
      - {id: JE-03, actor: journey-handoff-scheduler, from: DUE, to: ESCALATED, guard: locked-current-pending-generation-and-database-clock-at-or-after-second-escalation-threshold-and-before-hard-expiry, event: journey.handoff_escalated.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_ESCALATED, atomic_transition_group: journey-handoff-second-escalation}
      - {id: JE-04, operation: decideJourneyHandoff, from: NOT_DUE|DUE|ESCALATED, to: RESOLVED, selector: ACKNOWLEDGE|DECLINE, guard: same-locked-generation-as-the-terminal-decision-receipt, event: journey.handoff_decided.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_DECIDED, atomic_transition_group: journey-handoff-decision}
      - {id: JE-05, actor: journey-handoff-scheduler, from: NOT_DUE|DUE|ESCALATED, to: RESOLVED, guard: same-locked-generation-as-the-HANDOFF_EXPIRED-receipt, event: journey.handoff_expired.v1, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_EXPIRED, atomic_transition_group: journey-handoff-expiry}
      - {id: JE-06, actor: journey-coordinator, from: NOT_DUE|DUE|ESCALATED, to: RESOLVED, guard: same-locked-generation-as-the-HANDOFF_CANCELLED-receipt, event: NONE, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_CANCELLED, atomic_transition_group: same-as-terminal-outcome-step}
      - {id: JE-07, actor: journey-coordinator, from: NOT_DUE|DUE|ESCALATED, to: RESOLVED, guard: same-locked-generation-as-the-HANDOFF_SUPERSEDED-receipt, event: NONE, receipt: JourneyTransitionReceiptV1, audit: JOURNEY_HANDOFF_SUPERSEDED, atomic_transition_group: same-as-replacement-request-step}
    invariants:
      - no escalation edge changes current owner or the immutable handoff binding.
      - DUE and ESCALATED each occur at most once per handoff generation.
      - every terminal handoff receipt resolves that exact generation; a replacement starts a new NOT_DUE identity and never reopens RESOLVED.

