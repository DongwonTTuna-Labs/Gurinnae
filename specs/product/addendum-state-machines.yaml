resolved_required_operation_decisions:
  materializeResponseRequestSent: NEW_PRIVATE_APPLICATION_COMMAND
  publishCorrectionRevision: EXTEND_BASE_resolveCorrectionRequest
  declareConflict: NEW_ADDITIVE_CONTROL_COMMAND
  withdrawConflict: NEW_ADDITIVE_CONTROL_COMMAND
  restrictPublicationAccess: EXTEND_BASE_placeTemporaryRestriction
  restorePublicationAccess: EXTEND_BASE_publishCase_RESTORE_ACCESS_BRANCH
  executeApprovedRetraction: NEW_PRIVATE_APPLICATION_COMMAND_private.PublishRetraction
  placeNonCaseLegalHold: EXTEND_BASE_placeLegalHold_WITH_CLOSED_TARGET_UNION
  set_equality: keys are exactly the previously audited required_operation_registry gap keys; each value resolves to one owned command contract and none is merely waived

required_operation_registry:
  status: CLOSED_CURRENT_TRUTH
  count: derived as len(required_operations)
  required_operations: {}
  hard_gate: len(required_operations) must be zero and resolved_required_operation_decisions must remain set-equal to the audited former gap set with each decision covered by operation/resource/error/persistence/command/event contracts; runtime and acceptance evidence remain independent FINAL gates

expanded_registry_set_equality:
  machine_count: derived len(machines)
  edge_count: derived sum(len(machine.edges))
  additive_operation_set: set(operation_dispositions) equals addendum-operation-contracts operations where kind COMMAND
  private_control_operation_set: set(private_control_lifecycle_bindings.current_bindings) equals owner-addendum private_control_service_operations
  base_operation_set: set(base_operation_lifecycle_bindings.current_bindings) equals machine-referenced base operations that mutate expanded lifecycles
  required_gap_set: set(required_operation_registry.required_operations) is empty and set(resolved_required_operation_decisions except set_equality) is set-equal to the audited former eight-gap inventory
  event_set: every edge event is NONE or belongs to immutable base event catalog union additive event registry
  no_magic_inventory: historical machine/edge counts are forbidden validator inputs

immutable_fact_lifecycles:
  evidence.segment_created.v1: append-only evidence segment identity plus immutable source asset revision and locator/content digests
  source.page_reconciled.v1: append-only page receipt identity; duplicate ordinal/digest is replay and changed digest is conflict
  operations.sli_window_closed.v1: immutable closed interval fact; corrections append a new identified evaluation fact
  cost.allocation_period_closed.v1: immutable period allocation fact; never overwrite a closed allocation
  cost.fx_rate_recorded.v1: immutable signed import with source/time/rate identity
  accounting.correction_recorded.v1: append-only correction linked to the exact prior fact
  product.fact_recorded.v1: append-only terminal-receipt-derived fact
  product.fact_corrected.v1: inverse or superseding fact; original remains immutable
  commercial.contract_period_recorded.v1: append-only effective interval import with overlap rejection
  commercial.tariff_version_activated.v1: append-only effective tariff version with nonoverlapping interval
  commercial.usage_fact_recorded.v1: append-only metered fact; corrections use predecessor/inverse revision
  commercial.discount_decided.v1: append-only approved effective interval
  commercial.invoice_reconciled.v1: immutable provider reconciliation fact and line-set digest
  commercial.revenue_fact_recorded.v1: immutable recognition fact linked to contract and invoice
  governance.funding_snapshot_created.v1: immutable signed funding snapshot batch
  response.organization_identity_verified.v1: immutable exact response version, content, consent, organization, official-channel and step-up verification fact; raw proof remains in its authorized ledger
  response.excerpt_approved.v2: immutable approval fact bound to the exact response version, excerpt digest, publication form and nullable-by-ANONYMOUS identity receipt
  commercial.sku_readiness_evaluated.v1: immutable evaluation and item-set digest; a new run creates a new evaluation
