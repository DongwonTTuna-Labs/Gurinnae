      - {actor: retention-worker, from: APPROVED, to: COMPLETED, selector: every-non-Q4-request-type-or-target, availability: OPEN_FAIL_CLOSED, guard: dedicated-per-request-type-execution-owner-required, event: retention.execution_completed.v1, effect_owner: retention-worker, atomic_transition_group: gurine.worker.completePrivacyRequest.v2}
    deadline_policy:
      policy_id: PRIVACY_RESPONSE_CALENDAR
      selection: every authoritative transition locks exactly one active, effective, unexpired and approved policy row plus its exact calendar version; missing, duplicate, stale or unapproved rows fail closed
      calculation: the owner uses only the selected row's request-type due days, extension maximum/count/timing, refusal notice days, timezone, day unit and ordered holiday set, then persists policy/calendar version and digests in immutable receipts
      immutable_declared_seed:
        policy_version: supervisor-decision-v1
        authority: supervisor-decision-v1
        timezone: Asia/Seoul
        day_unit: BUSINESS_DAY
        holiday_source: immutable ordered Republic of Korea holiday dates pinned in the selected policy/calendar version
        clock_start: VERIFY_IDENTITY is the only transition that sets identityVerifiedAt and initial dueAt; unverified requests retain null for both fields
        request_due_business_days: {ACCESS: 10, CORRECTION: 10, DELETION: 10, RESTRICTION: 10}
        extension: {maximum_business_days: 10, maximum_count: 1, must_be_recorded_before_current_due_at: true, notice_receipt_required: true}
        refusal: {notice_due_business_days_after_decision: 10, reason_required: true, appeal_instructions_required: true, notice_receipt_required: true}
      future_approved_versions: allowed only as new immutable rows with the same closed field shape, independent approval/effective interval and a new canonical policy/calendar digest; they may change declared values without mutating the supervisor-decision-v1 seed or prior request receipts
    access_policy:
      logical_contract: privacy_request_receipt_access_policy
      schema_version: privacy-request-receipt-access-policy-v1
      exact_payload_keys: [tokenTtlSeconds, readOnlySessionTtlSeconds, cookieProfileId, cookieName, cookiePath, allowedOperations]
      selection: createPrivacyRequest and exchangePrivacyRequestReceiptToken each resolve exactly one current, approved, effective and unexpired version before any write
      versioning: no seed, default or fallback; future approved immutable versions may change TTL values while earlier token/session receipts remain pinned to their selected policy identity/version/digest
      physical_binding_status: FINAL
      physical_binding:
        relation: ops.privacy_request_access_policies_v1
        primary_key: [policy_id, revision]
        receipt_binding_key: [policy_id, revision, policy_digest, binding_digest]
        version_column: revision
        lifecycle_state_column: state
        approved_state: APPROVED
        policy_version_column: policy_version
        policy_digest_column: policy_digest
        binding_digest_column: binding_digest
        authority_column: authority
        test_only_authority: TEST_ONLY
        effective_at_column: effective_at
        review_expires_at_column: review_expires_at
        selector: ops.current_privacy_request_access_policy_v1(timestamptz)
        production_preflight: ops.preflight_privacy_request_access_policy_v1(timestamptz)
      failure: zero, duplicate, expired or unapproved maps to request-id-only DEPENDENCY_UNAVAILABLE 503 and zero writes; CAPABILITY_UNCONFIGURED and INTERNAL_ERROR detail are forbidden substitutions
      separation: this access policy is never the PRIVACY_RESPONSE_CALENDAR authority and cannot provide statutory due dates, business calendars, extension limits or refusal-notice deadlines
    invariants:
      - PENDING_VERIFICATION requires identityVerifiedAt and dueAt both null; VERIFIED requires both nonnull and bound to one immutable policy/calendar digest pair.
      - Caller-supplied calendar, policy, digest, identityVerifiedAt, dueAt and noticeDueAt values never become authority.
      - 'createPrivacyRequest accepts exact closed PrivacyRequestScopeV1 only; the PostgreSQL owner computes scopeCanonical=canonical JSON(scope), scopeSha256=SHA256(scopeCanonical), and subjectScopeDigest=SHA256(canonical JSON({schemaVersion:"privacy-subject-scope-v1",subjectProofHash,scopeSha256})).'
      - subjectProofHash, scopeSha256 and subjectScopeDigest are DB-derived and caller-forbidden; public/event scopeDigest equals scopeSha256, while subjectScopeDigest remains the internal subject-plus-scope binding.
      - Raw scope is validation-only and cannot enter persistence, audit, outbox, events, receipts, errors or observability; encrypted scope and the two DB-derived digests are the durable forms.
      - COMPLETE is owned only by retention-worker after authoritative execution receipts; transitionRetentionRequest cannot select it.
      - Public status exposes exactly one reachable closed next action: pending identity VERIFY_IDENTITY; RECEIVED plus VERIFIED AWAIT_REVIEW; REVIEW AWAIT_DECISION; APPROVED AWAIT_EXECUTION; REJECTED REVIEW_REFUSAL_NOTICE; COMPLETED COMPLETE. No NONE or unsupported submission/contact action exists.
      - COMPLETED and REJECTED public status fails closed without its exact immutable decision chain; detailed reason, notice and appeal wording remains authoritative only in encrypted notice delivery.
