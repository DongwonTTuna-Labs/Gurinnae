launch_modes:
  development: Synthetic data and local adapters; no external key required.
  test: Ephemeral isolated data; deterministic.
  staging: Live connectors may run in shadow; no public allegation.
  production: Configured official sources, human publication gate, production secrets.
immutable_principles:
- No automated corruption or crime assertion.
- No public publication without human approval.
- Every public factual claim has evidence.
- No-response is not admission.
- Corrections and retractions preserve history.
- No institutional or supplier corruption ranking.
- External input cannot mutate editorial state directly.
- Crawled documents are untrusted data, never instructions.
final_acceptance:
- All 94 screens implemented.
- All 217 external operation contracts and the internal identity service contract implemented.
- All PostgreSQL migrations and grants tested.
- All generated artifacts reproducible.
- Development and production Docker paths work.
- Production starts after only documented keys/secrets are supplied.
- No placeholder, deferred feature or skipped required test.
