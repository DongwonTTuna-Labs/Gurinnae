launch_modes:
  development: Synthetic data and local adapters; no external key required.
  test: Ephemeral isolated data; deterministic.
  staging: Live connectors may run in shadow; no public allegation.
  production: Configured official sources, human publication gate, production secrets; donation is UNAVAILABLE because R6e defines no live provider or production tier authority.
commercial_and_funding_boundaries:
  free_forever: public facts, evidence, correction history, right of reply, basic verified subscriptions, and reasonable public API/export
  b2b: offered collection remains signed written contract plus external electronic tax invoice and bank transfer; cash application may additionally accept signed typed PG_SETTLEMENT_IMPORT accounting evidence, stored as source kind PG_SETTLEMENT, for an externally completed settlement with an exact invoice fence, but this is not live PG, checkout, card billing, entitlement, or a donation-to-invoice path
  donation: TEST_MODE_ONLY public fundraising unrelated to SKU, contract, invoice, paid-workspace value, or entitlement; no live PG or ASP and no invented price, tier, or payment success
  public_routes:
  - PUB-035 /donate
  - PUB-023 downloadTransparencyReport
immutable_principles:
- No automated corruption or crime assertion.
- No public publication without human approval.
- Every public factual claim has evidence.
- No-response is not admission.
- Corrections and retractions preserve history.
- No institutional or supplier corruption ranking.
- External input cannot mutate editorial state directly.
- Crawled documents are untrusted data, never instructions.
- Donation and commercial state never reduce free public access or create editorial priority.
final_acceptance:
- All 95 screens implemented.
- All 268 external operation contracts and all 3 additive PRIVATE_IDENTITY_API supplier operation contracts (271 all-scope HTTP operations in their disjoint union), plus the separate 9-operation internal identity service contract, implemented.
- All PostgreSQL migrations and grants tested.
- All generated artifacts reproducible.
- Development and production Docker paths work.
- Production starts after only documented keys/secrets are supplied.
- No placeholder, deferred feature or skipped required test.
