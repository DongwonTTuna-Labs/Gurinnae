    - getCommunicationDeliveryReceipt
    - reconcileCommunicationDelivery
    - cancelCommunicationDelivery
    - getIncident
    - triageIncident
    - containIncident
    - startIncidentRecovery
    - resolveIncident
    - closeIncidentPostmortem
    - listResponseAppeals
    - getResponseAppealWorkspace
    - transitionResponseAppeal
    - decideResponseExtension
    - listRetentionRequests
    - getRetentionRequest
    - transitionRetentionRequest
    - listRecordClassSchedules
    - requestCommunicationEndpointLink
    - verifyCommunicationEndpointLink
    - unlinkCommunicationEndpoint
    - createPrivacyRequest
    - exchangePrivacyRequestReceiptToken
    - getPrivacyRequest
    - declareConflict
    - withdrawConflict
    - withdrawActionProposal
    - withdrawActionDecision
    - promoteResearchArtifactToEvidence
    - cancelAgentRun
    - recordSupplierIdentityResolution
    - recordSupplierRelationshipAssertion
    - decideSupplierRelationshipAssertion
  private_application_command_ids:
    - materializeResponseRequestSent
    - private.PublishRetraction
  private_communication_operation_ids:
    - acceptSmtpDsn
    - receiveTelegramWebhook
    - verifyWhatsAppWebhook
    - receiveWhatsAppWebhook
    - receiveLineWebhook
    - receiveSolapiSmsCallback
    - receiveSolapiKakaoCallback
    - receiveTwilioVoiceCallback
  private_control_service_operation_ids:
    - reconcileAgentRun
  invariants:
    - additive_external_operation_ids equals keys(operation_bindings) filtered by ADDITIVE_EXTERNAL.
    - private_application_command_ids equals keys(private_application_command_bindings), keys(private_application_request_schemas) and keys(private_application_error_sets).
    - private_communication_operation_ids equals keys(operation_bindings) filtered by PRIVATE_COMMUNICATION.
    - private_control_service_operation_ids equals keys(operation_bindings) filtered by PRIVATE_CONTROL.
    - union of additive external, private communication, and private control sets equals keys(operation_bindings), keys(request_schemas_by_operation), and keys(operation_error_sets).
    - every operation binding has exactly one defined request schema and one defined success schema.
    - every named V1 reference reachable from a request or success schema resolves exactly once.
    - no schema permits arbitrary object, free-form map, untyped object, generic JSON, or undocumented discriminator value.
    - every normalized operation error set is a subset of the union of base error codes and error_catalog_additions.

type_expression_grammar:
  primitives:
    uuid: RFC4122 lowercase canonical string
    sha256: lowercase 64-hex string
    datetime: UTC RFC3339 string with exactly six fractional digits and Z
    date: RFC3339 full-date
    uri-reference: RFC3986 URI-reference
    email: RFC5322 addr-spec normalized for comparison
    secret-string: never logged, traced, rendered, or returned
    int32: signed 32-bit integer
    int64: signed 64-bit integer serialized as a JSON integer
    decimal: non-exponent canonical decimal string
  constructors:
    optional: field may be absent and is never implicitly null
    nullable: field is present and may be null
    array: ordered collection with explicit item and length bounds
    unique-array: duplicate-free ordered collection with explicit canonical comparison
    enum: closed case-sensitive set
    const: one exact value
  rules:
    - Every object has additional_properties false.
    - A field is required unless its type begins with optional.
    - nullable is not optional.
    - Strings and arrays without explicit bounds are invalid.
    - All free text is valid UTF-8, NFC normalized, and rejects NUL and unpaired surrogates.

schema_field_normalizations:
  ActionPayloadV1.KILL_SWITCH.target:
    replace_with: switchTarget
    reason: target is already the common typed ActionTargetV1 field; a second incompatible target field makes the closed merged object impossible.
  ActionPayloadV1.KILL_SWITCH.effect:
    replace_with: switchEffect
    reason: effect is already the common typed ActionEffectV1 field; a second enum effect field makes the closed merged object impossible.
  rule: Apply these two source corrections in addendum-operation-contracts, approval binding/canonicalization, persistence columns, Rust/TypeScript DTOs, tests, and digest fixtures before schema generation.

common_schema_normalizations:
  ExactPageV1:
    action: REMOVE_AS_GENERATED_SCHEMA
    reason: typed-array and typed-object are unresolved generic escape hatches; every concrete page schema in this proposal is closed instead.
  ErrorEnvelopeV1:
    action: REPLACE_WITH_AddendumProblemDetailsV1
    reason: code/message/requestId is not the required closed RFC 9457 response and has no status, type URI, retryability, or typed state context.
  CommandReceiptV1:
    action: REPLACE_WITH_THIS_PROPOSAL_DEFINITION
    reason: status is now a closed enum and all receipt fields have exact bounds and types.

transport_profiles:
  CONTROL_QUERY:
    required_headers: {X-Gurine-Actor-Assertion: ActorAssertionToken}
    forbidden_credentials: [Cookie, X-CSRF-Token, raw-step-up-authorization]
  CONTROL_COMMAND:
    required_headers: {Content-Type: 'const<application/json>', Idempotency-Key: 'secret-string[16..200]', X-Gurine-Actor-Assertion: ActorAssertionToken}
    forbidden_credentials: [Cookie, X-CSRF-Token, raw-step-up-authorization]
  SUBMISSION_SCOPED_QUERY:
    required_headers: {X-Gurine-Service-Assertion: ServiceAssertionToken, X-Gurine-Submission-Session: 'secret-string[32..4096]'}
    bff_boundary: Browser scoped cookie is decrypted by the SvelteKit BFF and is never sent as a Cookie header to submission-api.
    cache_control: no-store
  SUBMISSION_SCOPED_COMMAND:
    required_headers: {Content-Type: 'const<application/json>', Idempotency-Key: 'secret-string[16..200]', X-Gurine-Service-Assertion: ServiceAssertionToken, X-Gurine-Submission-Session: 'secret-string[32..4096]'}
    bff_boundary: Browser scoped cookie is decrypted by the SvelteKit BFF and is never sent as a Cookie header to submission-api.
    cache_control: no-store
  SUBMISSION_ANONYMOUS_COMMAND:
    required_headers: {Content-Type: 'const<application/json>', Idempotency-Key: 'secret-string[16..200]', X-Gurine-Service-Assertion: ServiceAssertionToken}
    cache_control: no-store
  PRIVATE_PROVIDER_CALLBACK:
    rules:
      - Signature or provider-secret verification runs over exact received bytes before parsing.
      - A verified provider event ID plus exact body digest is the idempotency scope; an exact replay returns the stored success response byte-for-byte.
      - Same provider event ID with different bytes is CALLBACK_REPLAY_CONFLICT.
      - Raw request body, endpoint, signature, token, and secret never enter logs, metrics, traces, audit URLs, or response bodies.
      - Out-of-order evidence is appended but cannot regress delivery or endpoint state.
  PRIVATE_CONTROL_COMMAND:
    required_headers: {Content-Type: 'const<application/json>', Idempotency-Key: 'secret-string[16..200]', X-Gurine-Service-Assertion: ServiceAssertionToken, X-Gurine-Job-Fence: 'secret-string[16..512]'}
    caller: reconciliation-worker only; browser actor assertions and human override are forbidden
    cache_control: no-store
    rules:
      - The service assertion binds operation, method, canonical path, exact body digest, content type, idempotency key hash, deployment, caller and current job fence.
      - Reconciliation evidence is an immutable authenticated adapter lookup/usage/no-dispatch fact; caller-supplied raw provider proof is rejected.
  JOURNEY_WORKFLOW_DB_COMMAND:
    protocol: POSTGRES_REGPROCEDURE_CHAIN
    caller: gurine_workflow_worker only
    session_user: gurine_workflow_worker
    assertion_type: SERVICE
    required_envelope: {schemaVersion: 'const<journey-workflow-command-envelope.v1>', commandInstanceId: uuid, operationId: 'const<decideJourneyHandoff>', canonicalTarget: 'const<ops.consume_journey_handoff_assertion_attempt_v1->ops.prepare_journey_handoff_decision_v1->ops.decide_journey_handoff_v1->ops.finalize_journey_handoff_decision_response_v1>', semanticRequestDigest: sha256, commandEnvelopeDigest: sha256, idempotencyKeySha256: sha256, deploymentId: uuid, workloadPrincipalId: string, acknowledgementAuthorityDigest: sha256, serviceAssertion: ServiceAssertionToken}
    service_assertion_binding: [operationId, canonicalTarget, commandInstanceId, semanticRequestDigest, commandEnvelopeDigest, idempotencyKeySha256, deploymentId, workloadPrincipalId, acknowledgementAuthorityDigest, expiry, fresh JTI]
    digest_contract:
      semanticRequestDigest: SHA256(GURINE_CANONICAL_JSON_V1(DecideJourneyHandoffRequestV1))
      commandEnvelopeDigest: SHA256(GURINE_CANONICAL_JSON_V1(the complete closed envelope excluding serviceAssertion token signature and commandEnvelopeDigest itself))
      businessRequestHash: JOURNEY_HANDOFF_DECISION_BUSINESS_V1(exact seven semantic fields)
      non_substitution: commandEnvelopeDigest, semanticRequestDigest and businessRequestHash are three distinct domains and values; equality or substitution is forbidden even if test bytes happen to collide
    database_mapping: {transport_request_id: commandInstanceId, wire_request_digest: commandEnvelopeDigest, business_request_hash: businessRequestHash, idempotency_key_sha256: idempotencyKeySha256, assertion_type: SERVICE}
    forbidden_http_material: [HTTP method, HTTP path, Content-Type header, Cookie, X-Gurine-Actor-Assertion, X-Gurine-Service-Assertion header, X-CSRF-Token]
    rule: this is an in-process workload command boundary, not an HTTP endpoint; the envelope is verified before the assertion-attempt wrapper and raw assertion bytes are never passed to prepare, apply, finalize, audit or idempotency storage

journey_handoff_decision_entry_boundaries:
  logical_operation_id: decideJourneyHandoff
  semantic_request_schema: DecideJourneyHandoffRequestV1
  stable_business_hash_profile: journey-handoff-business-v1
  external_actor_http:
    transport_profile: CONTROL_COMMAND
    session_user: gurine_control_api
    assertion_type: ACTOR
    required_credential: X-Gurine-Actor-Assertion
    forbidden_credential: X-Gurine-Service-Assertion
    error_set: [INVALID_PARAMETER, ACTOR_ASSERTION_INVALID, ACTOR_ASSERTION_REPLAYED, RESOURCE_NOT_FOUND, CAPABILITY_DENIED, HANDOFF_RECEIVER_MISMATCH, HANDOFF_STATE_INVALID, HANDOFF_BINDING_MISMATCH, VERSION_CONFLICT, HANDOFF_EXPIRED, JOURNEY_TERMINAL, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  internal_service_workflow:
    transport_profile: JOURNEY_WORKFLOW_DB_COMMAND
    session_user: gurine_workflow_worker
    assertion_type: SERVICE
    required_credential: serviceAssertion in the closed workload envelope
    forbidden_credential: ActorAssertionToken or any HTTP credential/header
    error_set: [INVALID_PARAMETER, SERVICE_ASSERTION_INVALID, SERVICE_ASSERTION_REPLAYED, RESOURCE_NOT_FOUND, CAPABILITY_DENIED, HANDOFF_RECEIVER_MISMATCH, HANDOFF_STATE_INVALID, HANDOFF_BINDING_MISMATCH, VERSION_CONFLICT, HANDOFF_EXPIRED, JOURNEY_TERMINAL, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  mutual_exclusion: one attempt matches exactly one boundary from session_user and assertion_type; HTTP never accepts SERVICE and the workflow boundary never accepts ACTOR or HTTP credentials
  parity: both boundaries canonicalize the same semantic request, consume their own fresh request-bound assertion JTI, compute the same stable seven-field business hash, and enter the same prepare/apply/finalize transaction and response schema
  transaction_identity_contract:
    attempt_proof: MVCC-visible replay-guard and SUCCESS audit rows carry equal non-null server-produced attempt_transaction_xid8 values and that xid differs from the business transaction pg_current_xact_id()
    claim_proof: BOUND_V1 NEW carries server-produced claim_transaction_xid8 equal to the business transaction top-level pg_current_xact_id(), including SAVEPOINT and nested SAVEPOINT paths
    forbidden: [xmin proof, hard pg_xact_status committed requirement, caller-supplied xid, legacy xid backfill]
    error_mapping: missing, NULL, mismatch or same-transaction attempt proof is ACTOR_ASSERTION_INVALID or SERVICE_ASSERTION_INVALID by selected boundary with zero business writes; pg_xact_status NULL alone is not an error
  persisted_response_verification: finalize performs one pre-read, one owner-finalize and one post-readback of the full tuple; replay-owner, partial/digest-only comparison and JSON reserialization are forbidden

