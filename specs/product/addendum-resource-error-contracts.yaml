      CALLBACK_QUERY: {additional_properties: false, fields: {eventKind: 'const<CALLBACK_QUERY>', updateId: 'int64[0..max]', callbackQueryId: 'string[1..500]', senderId: 'int64[1..9007199254740991]', chatInstance: 'string[1..500]', data: 'secret-string[1..256]', sentAtEpochSeconds: 'int64[0..max]'}}

