callback_non_error_semantics:
  exact_replay:
    predicate: same immutable provider revision, purpose-HMACed replay identity, canonical request digest, and verified provider identity
    result: FIRST_STORED_DISPOSITION
    http_status: 202
    effect: Return the first stored CommunicationCallbackReceiptV1 byte-for-byte and append no second domain mutation, audit event, or outbox event.
  authenticated_out_of_order:
    predicate: authentic evidence is older than or incomparable with the current monotonic delivery state
    result: STALE_STORED
    http_status: 202
    effect: Append the immutable callback/evidence receipt while leaving canonical delivery and endpoint state unchanged.
  authenticated_unknown_correlation:
    predicate: authentic event belongs to the configured integration but no delivery can yet be correlated
    result: UNMATCHED_RECONCILIATION_REQUIRED
    http_status: 202
    effect: Persist typed quarantined evidence and incident/audit references without inventing a delivery identity or state.
  authenticated_mixed:
    predicate: one authenticated request contains items in two or more of APPLIED, STALE_STORED, and UNMATCHED_RECONCILIATION_REQUIRED
    result: AUTHENTICATED_MIXED
    http_status: 202
    effect: Return every ordinal outcome in one atomic request receipt; apply only legal monotonic item effects and preserve every stale or unmatched item without collapsing the batch.
  authenticated_unsupported_event:
    predicate: authentic provider event is outside the product event allowlist but is not malformed
    result: UNMATCHED_RECONCILIATION_REQUIRED
    http_status: 202
    effect: Persist only typed envelope metadata and digest under a bounded quarantine retention policy; do not project or mutate a domain object.

provider_native_boundary_rules:
  - Every adapter pins a provider contract revision and golden native payload fixtures before production activation.
  - Provider-native payload acceptance is exact for that pinned revision; new fields or variants fail callback parsing until reviewed and repinned.
  - The closed normalized schemas in this proposal are the only values allowed past the gateway parser; raw bytes are retained only in the encrypted callback evidence object under retention and rights policy.
  - Signature verification uses the exact raw method, canonical public callback URL, query, headers, and body required by the pinned adapter; verification never uses a reserialized object.
  - Freshness uses provider timestamp when cryptographically bound, otherwise the provider event timestamp plus configured ingress receipt window and monotonic event identity; exact replay remains idempotent.
  - Callback operation, adapter, HTTP method, authentication discriminator, media type and maximum raw bytes are one closed tuple. All callback commands are POST; an unlisted combination fails before parse and writes nothing.
  - SMTP DSN is exactly POST multipart/report; report-type=delivery-status up to 10485760 bytes with a request-bound X-Gurine-Mta-Assertion no older than 300 seconds. Signed JSON profiles are application/json up to 2097152 bytes. Twilio Voice is application/x-www-form-urlencoded up to 262144 bytes.
  - SIGNED_WEBHOOK is outbound-only in this eight-operation gateway registry. An unsigned or merely successful HTTP response proves at most PROVIDER_ACCEPTED; DELIVERED requires a receiver-signed terminal receipt bound to provider revision, delivery key, provider idempotency key, request digest and rendered digest, or an authenticated status poll. Any uncertainty is RECONCILIATION_REQUIRED with no retry or fallback.
  - Provider activation is impossible without golden tests for valid proof, missing proof, invalid proof, freshness boundary, exact replay, changed-digest replay, out-of-order delivery, and unknown correlation.

closure_counts:
  count_rule: every value is derived from the referenced sets at validation time; numeric inventory literals are forbidden
  operations: derived len(operation_bindings)
  additive_external_operations: derived count(operation_bindings where scope=ADDITIVE_EXTERNAL)
  private_communication_operations: derived count(operation_bindings where scope=PRIVATE_COMMUNICATION)
  private_application_commands: derived len(private_application_command_bindings)
  named_request_schemas: derived len(request_schemas_by_operation)
  private_application_request_schemas: derived len(private_application_request_schemas)
  unique_success_schemas: derived cardinality(unique operation_bindings.success_schema)
  additive_external_unique_success_schemas: derived cardinality(unique ADDITIVE_EXTERNAL success_schema)
  private_communication_unique_success_schemas: derived cardinality(unique PRIVATE_COMMUNICATION success_schema)
  total_schema_registry_entries: derived len(schemas)
  supporting_non_success_schema_entries: derived schemas not directly selected as success schemas
  base_error_catalog_entries: derived len(specs/api/error-code-catalog.yaml errors)
  raw_additive_external_missing_error_refs: derived external error refs absent from base before normalization
  duplicate_error_semantics_normalized: derived len(error_code_normalizations excluding rule)
  additive_external_error_catalog_additions: derived error additions reachable from additive external operations
  private_callback_error_catalog_additions: derived error additions reachable only from private callbacks
  private_application_error_catalog_additions: derived error additions reachable from private application commands or base extensions
  total_error_catalog_additions: derived len(error_catalog_additions)
  resulting_error_catalog_entries: derived cardinality(base codes union error_catalog_additions)
  source_additive_external_error_occurrences: derived sum(len(operation_error_sets[id]) for ADDITIVE_EXTERNAL ids)
  private_callback_error_occurrences: derived sum(len(operation_error_sets[id]) for PRIVATE_COMMUNICATION ids)

validator_requirements:
  - Parse this file and every referenced YAML with duplicate-key rejection.
  - Assert additive external and private communication authority sets against operation_bindings, request_schemas_by_operation and operation_error_sets exactly, with every partition derived from source metadata.
  - Assert private application command bindings, requests and error sets are set-equal to owner-addendum.private_application_commands and base extension error keys are set-equal to owner-addendum.base_operation_atomic_extensions.
  - Assert every binding request_schema equals the matching request_schemas_by_operation.name and every success_schema resolves in schemas.
  - Traverse every field, union common field, union variant field, parser output, and success schema; every V1 reference resolves exactly once and no unreachable V1 definition remains except AddendumProblemDetailsV1, which is reached from rfc9457_contract.
  - Assert every discriminated-union common field set is disjoint from every variant field set after applying schema_field_normalizations; specifically KILL_SWITCH exposes switchTarget/switchEffect and only the common target/effect names remain.
  - Assert all object and union variants are closed and reject object, map, dictionary, any, unknown, serde_json.Value, JSON scalar escape hatches, undocumented enum values, and discriminator fallbacks.
  - Assert all external success refs are exactly the response refs in addendum-operation-contracts and all are defined.
  - Assert every source operation error array remains byte-order equal to operation_error_sets before normalization; then apply error_code_normalizations and require total catalog resolution.
  - Assert RECENT_SESSION_REQUIRED appears only as the documented source alias and never as a generated OpenAPI/client/runtime error code.
  - Assert error_catalog_additions is disjoint from the source-derived base code set and every addition is reachable from an external, private application, base extension or callback contract.
  - Assert every error row has exactly one layer, status, Korean title, retryability, exposure, state source/effect, and allowed context field set; all state effects are UNCHANGED.
  - Assert AddendumProblemDetailsV1 context is absent for no-context codes and is the exact closed union variant selected by error_context_mapping for authorized state-bearing errors.
  - Assert effective error sets are deterministic profile union operation arrays and every effective code resolves to one status and retryability.
  - Assert private callback exact replay, out-of-order, unknown-correlation, and unsupported authentic events follow callback_non_error_semantics and cannot regress state or duplicate outbox/domain effects.
  - Generate Rust DTOs/OpenAPI 3.1/TypeScript clients twice and require byte-identical output with generated inventories derived from the registries.
  - Contract-test every operation and private application command for valid request/success bytes, every enum boundary, missing required field, extra field, malformed nested variant, each declared error, state context redaction, and retryability/status parity.

integration_edits_required_before_authority_final:
  - Treat this file as the canonical additive resource/error catalog and generate every source-derived named request, success schema, supporting type and effective RFC 9457 union into OpenAPI/Rust/TypeScript without a parallel handwritten schema source.
  - Form the effective error catalog as the immutable source-derived base set plus this file's disjoint reachable additions; base catalog bytes remain unchanged.
  - Give every private callback operation complete auth, request, response, error, persistence, idempotency, audit, outbox, rate-limit, fixture, and implementation pointers.
  - Keep `response_extension` set-equal to the canonical `SUBMITTED -> APPROVED|REJECTED` machine; no dead-end CHANGES_REQUIRED branch exists without a typed update/resubmission operation.
  - Pin each provider-native callback contract revision, real header/signature algorithm, content type, maximum bytes, and golden payload bytes; invented or configuration-only header names cannot pass production activation.
  - Add this canonicalized contract to the design bundle digest, generated OpenAPI/client diff gate, supplemental acceptance registry, and manifest.

remaining_blockers:
  proposal_internal_reference_or_set_blockers: []
  authority_integration_blockers:
    - provider-native callback revisions and real golden payload/signature fixtures are not yet pinned in the current authority tree
    - generated OpenAPI/client artifacts, implementation, and contract tests do not yet consume this canonical additive contract
    - base operation OpenAPI/persistence still needs the correction publication, restriction/restoration and non-case legal-hold overlays, and private application command repositories are not implemented
