      ACTION_ASSIGNMENT: {additional_properties: false, fields: {kind: 'const<ACTION_ASSIGNMENT>', currentState: 'enum<ASSIGNED|IN_PROGRESS|COMPLETED|RECUSED|CANCELLED|VACANT>', currentVersion: 'int64[1..max]', currentGeneration: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>', expectedGeneration: 'nullable<int64[0..max]>'}}
      AGENT_RUN: {additional_properties: false, fields: {kind: 'const<AGENT_RUN>', currentStatus: 'enum<QUEUED|RUNNING|SUCCEEDED|FAILED|CANCELLED|BUDGET_BLOCKED|POLICY_BLOCKED>', currentControlState: 'enum<NONE|ACTIVE|CANCEL_REQUESTED|RECONCILIATION_REQUIRED|SETTLED>', currentVersion: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>', expectedStatuses: 'array<enum<QUEUED|RUNNING|SUCCEEDED|FAILED|CANCELLED|BUDGET_BLOCKED|POLICY_BLOCKED>>[0..7]', expectedControlStates: 'array<enum<NONE|ACTIVE|CANCEL_REQUESTED|RECONCILIATION_REQUIRED|SETTLED>>[0..5]'}}
      RESEARCH_ARTIFACT: {additional_properties: false, fields: {kind: 'const<RESEARCH_ARTIFACT>', artifactId: uuid, assetRevision: 'int64[1..max]', currentState: 'enum<STORED|RENDER_REQUIRED|QUARANTINED>', contentSafetyState: 'enum<CLEAN|SUSPECT|BLOCKED|UNKNOWN>', currentVersion: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>'}}
      ASSET_RIGHTS: {additional_properties: false, fields: {kind: 'const<ASSET_RIGHTS>', decisionId: uuid, currentState: 'enum<GRANT|DENY|SUSPEND|REVOKE>', currentVersion: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>'}}
      APPEAL: {additional_properties: false, fields: {kind: 'const<APPEAL>', currentState: 'enum<RECEIVED|REVIEW|RESOLVED|REJECTED|DUPLICATE|WITHDRAWN>', currentDecisionSequence: 'int64[0..max]', expectedDecisionSequence: 'nullable<int64[0..max]>', appealWindowClosedAt: 'nullable<datetime>'}}
      RESPONSE_REQUEST: {additional_properties: false, fields: {kind: 'const<RESPONSE_REQUEST>', currentState: 'enum<DRAFT|SENT|VIEWED|SUBMITTED|CLOSED|EXPIRED>', currentVersion: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>', currentDeliveryBindingDigest: 'nullable<sha256>'}}
