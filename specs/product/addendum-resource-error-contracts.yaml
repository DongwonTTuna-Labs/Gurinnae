    fields: {CallSid: 'string-pattern<^CA[0-9A-Fa-f]{32}$>', AccountSid: 'string-pattern<^AC[0-9A-Fa-f]{32}$>', CallStatus: 'enum<queued|ringing|in-progress|completed|busy|failed|no-answer|canceled>', Direction: 'enum<outbound-api|outbound-dial>', SequenceNumber: 'int32[0..max]', CallbackSource: 'const<call-progress-events>', Timestamp: datetime, ToSha256: sha256, FromSha256: sha256, SipResponseCode: 'nullable<int32[100..699]>', CallDurationSeconds: 'nullable<int32[0..86400]>'}

  CommunicationCallbackItemReceiptV1:
    kind: object
    additional_properties: false
    fields: {itemOrdinal: 'int32[0..999]', effectKind: 'enum<DELIVERY_OBSERVATION|OPT_OUT_REQUEST|ENDPOINT_INTERACTION>', providerEventIdentityHmac: sha256, providerEvidenceDigest: sha256, result: 'enum<APPLIED|STALE_STORED|UNMATCHED_RECONCILIATION_REQUIRED>', deliveryId: 'nullable<uuid>', priorState: 'nullable<enum<QUEUED|SENDING|PROVIDER_ACCEPTED|DELIVERED|READ|RETRY_SCHEDULED|FAILED_PERMANENT|RECONCILIATION_REQUIRED|SUPPRESSED|CANCELLED>>', currentState: 'nullable<enum<QUEUED|SENDING|PROVIDER_ACCEPTED|DELIVERED|READ|RETRY_SCHEDULED|FAILED_PERMANENT|RECONCILIATION_REQUIRED|SUPPRESSED|CANCELLED>>', mutationApplied: boolean, observedAt: datetime, itemReceiptDigest: sha256}
    invariants:
      - STALE_STORED has mutationApplied false and currentState equals priorState.
      - UNMATCHED_RECONCILIATION_REQUIRED has null deliveryId, priorState and currentState and creates a bounded reconciliation/incident reference outside this response.
      - OPT_OUT_REQUEST and ENDPOINT_INTERACTION never claim a delivery state transition; their durable domain receipt is referenced only by providerEvidenceDigest.

  CommunicationCallbackReceiptV1:
    kind: object
    additional_properties: false
    fields: {callbackRequestId: uuid, provider: 'enum<SMTP_EMAIL|TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_SMS|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE>', processingDisposition: 'enum<AUTHENTICATED_APPLIED|AUTHENTICATED_MIXED|AUTHENTICATED_STALE|AUTHENTICATED_UNMATCHED>', itemCount: 'int32[1..1000]', appliedItemCount: 'int32[0..1000]', staleItemCount: 'int32[0..1000]', unmatchedItemCount: 'int32[0..1000]', itemReceipts: 'array<CommunicationCallbackItemReceiptV1>[1..1000]', receivedAt: datetime, processedAt: datetime, receiptDigest: sha256}
    invariants:
      - itemReceipts are ordered by zero-based contiguous itemOrdinal and the three outcome counts sum exactly to itemCount and equal the item receipt results.
      - AUTHENTICATED_APPLIED means all items APPLIED, AUTHENTICATED_STALE means all STALE_STORED, AUTHENTICATED_UNMATCHED means all UNMATCHED_RECONCILIATION_REQUIRED, and every other non-empty combination is AUTHENTICATED_MIXED.
      - An exact authenticated replay returns this first stored status, headers and body byte-for-byte; it does not replace the original disposition with a synthetic DUPLICATE result.
      - No raw provider event/message/account/recipient identity, endpoint, signature, token or body is present anywhere in this response.

