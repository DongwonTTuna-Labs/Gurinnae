      DELIVERY: {additional_properties: false, fields: {kind: 'const<DELIVERY>', currentState: 'enum<QUEUED|SENDING|PROVIDER_ACCEPTED|DELIVERED|READ|RETRY_SCHEDULED|FAILED_PERMANENT|RECONCILIATION_REQUIRED|SUPPRESSED|CANCELLED>', currentVersion: 'int64[1..max]', expectedVersion: 'nullable<int64[0..max]>', retryAfterSeconds: 'nullable<int64[0..86400]>'}}
      ENDPOINT: {additional_properties: false, fields: {kind: 'const<ENDPOINT>', currentState: 'enum<PENDING_VERIFICATION|ACTIVE|REVOKED|BOUNCED|SUPPRESSED>', currentEndpointVersion: 'int64[1..max]', expectedEndpointVersion: 'nullable<int64[0..max]>', currentProfileVersion: 'int64[1..max]', supportedEndpointTypes: 'array<enum<EMAIL|SMS|TELEGRAM|WHATSAPP|LINE|KAKAO|VOICE>>[0..7]'}}
      COMMUNICATION_AUTHORIZATION: {additional_properties: false, fields: {kind: 'const<COMMUNICATION_AUTHORIZATION>', currentState: 'enum<GRANTED|REVOKED|RESTRICTED|EXPIRED>', endpointId: uuid, endpointVersion: 'int64[1..max]', purpose: 'enum<SYSTEM_TRANSACTIONAL|SUBSCRIPTION_UPDATE|DISCRETIONARY_EXTERNAL|INTERNAL_ACTION_REQUEST>', policyVersion: 'string[1..100]'}}
      EXECUTION: {additional_properties: false, fields: {kind: 'const<EXECUTION>', currentState: 'enum<QUEUED|CLAIMED|DISPATCHING|PROVIDER_ACCEPTED|SUCCEEDED|RETRYABLE_FAILED|PERMANENT_FAILED|CANCEL_REQUESTED|CANCELLED|RECONCILIATION_REQUIRED>', currentGeneration: 'int64[1..max]', currentStateVersion: 'int64[1..max]', expectedGeneration: 'nullable<int64[0..max]>', expectedStateVersion: 'nullable<int64[0..max]>', currentAttemptCount: 'int32[0..3]', maximumAttemptCount: 'const<3>', retryEligibility: 'enum<NOT_ELIGIBLE|PROOF_REQUIRED|ELIGIBLE>'}}
