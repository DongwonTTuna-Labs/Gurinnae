      RATE_LIMIT: {additional_properties: false, fields: {kind: 'const<RATE_LIMIT>', retryAfterSeconds: 'int64[0..86400]'}}

  JourneyHandoffDecisionReceiptV1:
    kind: object
    additional_properties: false
    fields:
      schemaVersion: const<journey-handoff-decision-receipt.v1>
      command: CommandReceiptV1
      decisionReceipt: JourneyHandoffTerminalReceiptV1
      replacement: nullable<JourneyHandoffReplacementReceiptV1>
      finalParent: JourneyInstanceHeadReceiptV1
      effectDigest: sha256
      decidedAt: datetime
    invariants:
      - decisionReceipt is always the immutable terminal old-handoff step; replacement is one complete nullable generation+1 HANDOFF_REQUESTED receipt and finalParent is the authoritative post-command head
      - without replacement finalParent version and head equal decisionReceipt journeyInstanceVersion, receiptId and receiptDigest
      - with replacement finalParent is WAITING_ACK, its version equals replacement journeyInstanceVersion and its head equals replacement request receipt ID and digest
      - CommandReceiptV1 response digest covers decisionReceipt, nullable replacement, finalParent, effectDigest and decidedAt in this canonical field order
      - an HTTP response missing any referenced durable receipt or with a mismatched final head is never success

  JourneyHandoffTerminalReceiptV1:
    kind: object
    additional_properties: false
    fields:
      receiptId: uuid
      receiptDigest: sha256
      journeyInstanceId: uuid
      journeyInstanceVersion: int64[1..max]
      handoffId: uuid
      handoffVersion: int64[1..max]
      handoffKind: enum<HS-01-RESPONSE_REQUEST_DELIVERY|HS-02-RESPONSE_INTAKE_OWNERSHIP|HS-03-CASE_OWNERSHIP|HS-04-SIGNAL_ENRICHMENT_TASK|HS-05-EDITORIAL_REVIEW_ASSIGNMENT|HS-06-REVIEW_CHANGES_TASK|HS-07-PUBLICATION_ASSIGNMENT|HS-08-ACTION_REVIEW_ASSIGNMENT|HS-09-ACTION_EXECUTION_CLAIM|HS-10-ACTION_RECONCILIATION|HS-11-AI_RUN_RECONCILIATION|HS-12-EVIDENCE_PROJECTION_ACK|HS-13-CORRECTION_OWNER|HS-14-SOURCE_DRIFT_RECOVERY|HS-15-COMMERCIAL_REMEDIATION_TASK|HS-16-RETENTION_WATCH_TASK|HS-17-COMMUNICATION_DELIVERY_OWNERSHIP|HS-18-COMMUNICATION_DELIVERY_RECONCILIATION|HS-19-PAID_PACKET_TERMINAL_BINDING|HS-20-COMMERCIAL_CONTROL_EXTERNAL_ACK>
      generation: int64[1..max]
      decision: enum<ACKNOWLEDGE|DECLINE>
      resultingHandoffState: enum<ACKNOWLEDGED|DECLINED>
      resultingJourneyState: enum<ACTIVE|BLOCKED>
      currentOwnerBindingDigest: sha256
      nextOwnerBindingDigest: nullable<sha256>
      auditEventId: uuid
      outboxEventId: uuid
    invariants:
      - receipt identity, versions, decision, state, owner bindings, audit and outbox are copied from the immutable physical transition receipt and its canonical digest is recomputed
      - ACKNOWLEDGE makes nextOwnerBindingDigest null after the persisted receiver becomes current; DECLINE preserves the current owner

  JourneyHandoffReplacementReceiptV1:
    kind: object
    additional_properties: false
    fields:
      handoffId: uuid
      handoffVersion: const<1>
      generation: int64[1..max]
      bindingDigest: sha256
      requestReceiptId: uuid
      requestReceiptDigest: sha256
      auditEventId: uuid
      outboxEventId: uuid
      journeyInstanceVersion: int64[1..max]
      receiverFunction: string[1..160]
      hardExpiryAt: datetime
      resultingDueAt: datetime
    invariants:
      - journeyInstanceVersion equals decisionReceipt.journeyInstanceVersion plus one
      - request receipt is HANDOFF_REQUESTED and binds this exact handoff at version one
      - this object is nullable only as one complete unit; scalar replacement fields never appear outside it
      - receiverFunction is the safe function label from the immutable handoff binding and never contains receiver identity bytes; hardExpiryAt is the immutable acknowledgement deadline while resultingDueAt is the next scheduler checkpoint

  JourneyInstanceHeadReceiptV1:
    kind: object
    additional_properties: false
    fields:
      journeyInstanceId: uuid
      version: int64[1..max]
      state: enum<ACTIVE|WAITING_ACK|BLOCKED|RECONCILIATION_REQUIRED|COMPLETED|CANCELLED|EXPIRED|REJECTED>
      currentOwnerBindingDigest: sha256
      nextOwnerBindingDigest: nullable<sha256>
      activeHandoffId: nullable<uuid>
      activeHandoffGeneration: nullable<int64[1..max]>
      activeHandoffState: nullable<enum<PENDING_ACK>>
      escalationState: enum<NOT_DUE|DUE|ESCALATED|RESOLVED>
      dueAt: datetime
      headReceiptId: uuid
      headReceiptDigest: sha256
    invariants:
      - without replacement version and head equal decisionReceipt journey version, receipt ID and digest and all active handoff fields are null
      - with replacement state is WAITING_ACK, version equals replacement journeyInstanceVersion, head equals the replacement request receipt, active handoff fields equal replacement, next owner is nonnull and escalationState is NOT_DUE
      - the field set is copied from the persisted parent head after all ordered steps and is never synthesized from the request

  SupplierPartyRefV1:
    kind: object
    additional_properties: false
    fields: {candidateId: uuid, candidateRevision: 'int64[1..max]', candidateDigest: sha256, identityStatus: 'enum<UNVERIFIED|CANDIDATE|VERIFIED|AMBIGUOUS|CONFLICTED|REJECTED>', valueHmac: 'nullable<sha256>'}
  EvidenceLocatorRefV1:
    kind: object
    additional_properties: false
    fields: {evidenceId: uuid, evidenceVersion: 'int64[1..max]', evidenceDigest: sha256, sourceDocumentId: uuid, sourceAssetId: uuid, sourceAssetRevision: 'int64[1..max]', locatorDigest: sha256}
  AssertionPartyV1:
    kind: object
    additional_properties: false
    fields: {partyKind: 'enum<SUPPLIER|ORGANIZATION|NATURAL_PERSON>', supplierCandidateId: nullable<uuid>, supplierCandidateRevision: 'nullable<int64[1..max]>', supplierCandidateDigest: nullable<sha256>, canonicalSupplierId: nullable<uuid>, identityKeyDigest: sha256, identityStatus: 'enum<UNVERIFIED|CANDIDATE|VERIFIED|AMBIGUOUS|CONFLICTED|REJECTED>'}
  SupplierIdentityResolutionReceiptV1:
    kind: object
    additional_properties: false
    fields: {decisionId: uuid, decisionSequence: 'int64[1..max]', action: 'enum<MERGE|SPLIT|KEEP_SEPARATE|MARK_AMBIGUOUS>', candidateSetDigest: sha256, evidenceLocatorSetDigest: sha256, publicImpactSetDigest: sha256, decisionDigest: sha256, actorUserId: uuid, auditEventId: uuid, emittedEventIds: 'array<uuid>[1..10]', acceptedAt: datetime}
  SupplierRelationshipAssertionReceiptV1:
    kind: object
    additional_properties: false
    fields: {assertionId: uuid, assertionRevision: 'int64[1..max]', assertionDigest: sha256, verificationStatus: 'enum<PENDING|VERIFIED|REJECTED|CONFLICTED|SUPERSEDED>', evidenceLocatorSetDigest: sha256, verifiedBy: nullable<uuid>, verifiedAt: nullable<datetime>, auditEventId: uuid, emittedEventIds: 'array<uuid>[1..10]', acceptedAt: datetime}

rfc9457_contract:
  media_type: application/problem+json
  schema: AddendumProblemDetailsV1
  type_uri_template: 'https://api.gurinnae.invalid/problems/{lower-kebab-code}'
  base_catalog_is_extended_not_replaced: true
  rules:
    - Every non-2xx response for every external operation in operation_bindings is exactly AddendumProblemDetailsV1.
    - One response code maps to one HTTP status; an operation cannot override catalog status or retryability.
    - A rejected callback signature or unknown integration reveals no delivery, subject, endpoint, or account existence.
    - An exact provider callback replay is success, not an error; a changed digest under the same provider event identity is CALLBACK_REPLAY_CONFLICT.
    - Every error before commit leaves all domain, idempotency, audit, and outbox state unchanged; an internal/storage failure after a provider callback is accepted is impossible because the success response is written only after the receipt transaction commits.

