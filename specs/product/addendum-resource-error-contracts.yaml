  PrivateActionExecutionReceiptV1:
    kind: object
    additional_properties: false
    fields: {command: CommandReceiptV1, actionKind: ActionKindV1, executionId: uuid, generation: 'int64[1..max]', executionDigest: sha256, approvalDigest: sha256, countedDecisionReceiptSetDigest: sha256, effectIdempotencyKeySha256: sha256, targetBindingDigest: sha256, effectReceiptId: uuid, effectReceiptDigest: sha256, resultingObjectId: 'nullable<uuid>', resultingObjectVersion: 'nullable<int64[1..max]>', resultingObjectDigest: 'nullable<sha256>', state: 'enum<SUCCEEDED|PARTIALLY_SUCCEEDED|PERMANENT_FAILED|RECONCILIATION_REQUIRED>', occurredAt: datetime}
