      ASSET_RIGHTS_DECISION: {additional_properties: false, fields: {kind: 'const<ASSET_RIGHTS_DECISION>', assetLabel: 'string[1..500]', decisionKind: 'enum<GRANT|DENY|SUSPEND|REVOKE>', nineDimensionSummary: 'array<string[1..1000]>[9..9]', legalBasisAndLicense: 'string[1..4000]', downstreamImpact: 'string[1..4000]'}}
      RETENTION_SCHEDULE: {additional_properties: false, fields: {kind: 'const<RETENTION_SCHEDULE>', recordClass: 'string[1..500]', triggerAndDurations: 'string[1..2000]', terminalAction: 'string[1..1000]', legalHoldBehavior: 'string[1..2000]', restoreSuppressionBehavior: 'string[1..2000]', affectedRecords: 'string[1..4000]'}}
