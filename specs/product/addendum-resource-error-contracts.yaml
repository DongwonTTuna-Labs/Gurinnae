error_code_normalizations:
  RECENT_SESSION_REQUIRED:
    replace_with_existing_code: RECENT_AUTH_REQUIRED
    reason: Both names mean the same recent authenticated-session requirement and both map to AUTHORIZATION 403; retaining both violates the closed no-duplicate catalog rule.
    source_operations: [resolveIncident, closeIncidentPostmortem]
  rule: Apply this total mapping before catalog reference validation, OpenAPI generation, error-state UX generation, and operation set equality.

