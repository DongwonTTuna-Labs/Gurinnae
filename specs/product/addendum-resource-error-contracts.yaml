      RULE_ACTIVATION: {additional_properties: false, fields: {kind: 'const<RULE_ACTIVATION>', ruleLabel: 'string[1..500]', evaluationResult: 'string[1..4000]', activationScope: 'string[1..500]', affectedDeployment: 'string[1..2000]', rollbackPlan: 'string[1..4000]'}}
      ROLE_GRANT: {additional_properties: false, fields: {kind: 'const<ROLE_GRANT>', subjectLabel: 'string[1..500]', roleLabel: 'string[1..500]', scope: 'string[1..2000]', expiry: 'string[1..1000]', separationOfDuty: 'string[1..4000]'}}
