base_operation_extension_error_sets:
  resolveCorrectionRequest: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, CORRECTION_STATE_INVALID, PUBLICATION_GATE_BLOCKED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeTemporaryRestriction: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  publishCase.RESTORE_ACCESS: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_ACTIVE, PUBLICATION_GATE_BLOCKED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeLegalHold: [INVALID_PARAMETER, TARGET_NOT_FOUND, LEGAL_HOLD_TARGET_INVALID, CONFLICT_UNRESOLVED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
base_operation_extension_request_overlays:
  resolveCorrectionRequest:
    branch: resolution=RESOLVED
    additional_properties: false
    required_overlay: [publicationPreviewId, publicationPreviewDigest, publicationGatePreviewDigest, expectedPublicationRevision, replacementContentDigest]
    fields: {publicationPreviewId: uuid, publicationPreviewDigest: sha256, publicationGatePreviewDigest: sha256, expectedPublicationRevision: 'int64[1..max]', replacementContentDigest: sha256}
  placeTemporaryRestriction:
    additional_properties: false
    required_overlay: [expectedPublicationRevision, expectedPublicationDigest, causeKind, causeDecisionId, causeDecisionDigest, preservedPriorPublicState, expiresAt]
    fields: {expectedPublicationRevision: 'int64[1..max]', expectedPublicationDigest: sha256, causeKind: 'enum<LEGAL|RIGHTS|LEGAL_HOLD|SAFETY>', causeDecisionId: uuid, causeDecisionDigest: sha256, preservedPriorPublicState: 'enum<PUBLISHED_ANOMALY|PUBLISHED_EXPLAINED|OFFICIALLY_CONFIRMED|CORRECTED>', expiresAt: datetime}
  publishCase.RESTORE_ACCESS:
    discriminator: intent=RESTORE_ACCESS
    additional_properties: false
    required_overlay: [intent, restrictionDecisionId, restrictionDecisionDigest, causeReleaseReceiptId, causeReleaseReceiptDigest, expectedPriorPublicState]
    fields: {intent: 'const<RESTORE_ACCESS>', restrictionDecisionId: uuid, restrictionDecisionDigest: sha256, causeReleaseReceiptId: uuid, causeReleaseReceiptDigest: sha256, expectedPriorPublicState: 'enum<PUBLISHED_ANOMALY|PUBLISHED_EXPLAINED|OFFICIALLY_CONFIRMED|CORRECTED>'}
  placeLegalHold:
    action: REPLACE_CASE_SHAPED_TARGET_FIELDS
    additional_properties: false
    required_replacement: [target, scopeAtoms, affectedIds, authorityReference, reasonCode, reason, expiresAt]
    fields: {target: LegalHoldTargetBindingV1, scopeAtoms: 'unique-array<enum<RETENTION|DELETION|DISCLOSURE>>[1..3]', affectedIds: 'unique-array<uuid>[1..10000]', authorityReference: 'string[1..500]', reasonCode: 'string[1..100]', reason: 'string[1..4000]', expiresAt: 'nullable<datetime>'}
  set_equality: keys normalized by publishCase.RESTORE_ACCESS to publishCase are set-equal to owner-addendum.base_operation_atomic_extensions.operations and base_operation_extension_error_sets
derived_session_authorization_and_rotation:
  normative_source: specs/submission/addendum-derived-session-boundary.yaml
  parent_non_widening: {RESPONSE_RECEIPT: [getResponseReceipt], rule: parent kind/scope/operation allowlist is immutable}
  operations:
    createResponseAppeal: {required_session_kind: APPEAL_CREATE, scope_type: RESPONSE_SUBMISSION, success: consume current APPEAL_CREATE and issue one APPEAL_STATUS for the new appeal in the domain transaction, next_session_header: BFF_ONLY}
    getResponseAppeal: {required_session_kind: APPEAL_STATUS, scope_type: APPEAL, success: read-only and no rotation, reentry: private broker proves the same response receipt composite then rotates only the same appeal child}
    requestCommunicationEndpointLink: {required_session_kind: COMMUNICATION_PROFILE, scope_type: COMMUNICATION_SUBJECT, success: same-subject/same-origin COMMUNICATION_PROFILE rotation, next_session_header: BFF_ONLY}
    verifyCommunicationEndpointLink: {required_session_kind: COMMUNICATION_PROFILE, scope_type: COMMUNICATION_SUBJECT, success: consume exact challenge plus same-subject/same-origin COMMUNICATION_PROFILE rotation, next_session_header: BFF_ONLY}
    unlinkCommunicationEndpoint: {required_session_kind: COMMUNICATION_PROFILE, scope_type: COMMUNICATION_SUBJECT, success: revoke bound endpoint authorizations plus same-subject/same-origin COMMUNICATION_PROFILE rotation, next_session_header: BFF_ONLY}
  replay_order: claim/finalized response lookup by operation+BFF issuer+session token hash+idempotency key hash and exact request digest precedes ACTIVE validation; exact replay returns stored bytes and changed replay returns IDEMPOTENCY_CONFLICT
  next_session_header:
    name: X-Gurine-Next-Submission-Session
    request_source: fresh 32-byte base64url-no-padding token generated and retained by the BFF
    service_binding: exact header value is covered by the request-bound service assertion and idempotency request digest
    response_rule: Submission API never returns the raw token; BFF seals its retained value only after the successful rotation receipt
    persistence: lowercase SHA-256 only
    forbidden: [browser request, public OpenAPI body, response body, receipt, event, audit, log, trace, metric, analytics, error, URL, DOM, client storage]
  uniform_unavailable: unknown, wrong issuer, wrong kind, wrong scope, expired, consumed, revoked, lineage mismatch and cross-object all map to byte-equivalent SCOPED_SESSION_REQUIRED

schemas:
