  SignedProviderJsonBytesV1:
    kind: binary
    media_type: application/json
    min_bytes: 2
    max_bytes: 2097152
    rules:
      - Signature verification uses these exact bytes before UTF-8 or JSON parsing.
      - The pinned provider parser rejects duplicate JSON keys, invalid UTF-8, excessive depth over 32, arrays over 1000, and values outside its exact native revision.

  SignedProviderFormBytesV1:
    kind: binary
    media_type: application/x-www-form-urlencoded
    min_bytes: 1
    max_bytes: 262144
    rules:
      - Signature verification uses the exact public URL and these exact bytes before decoding.
      - The pinned provider parser rejects duplicate keys, invalid percent encoding, unknown fields, and values outside TwilioVoiceCallbackBodyV1.

  SmtpDsnMimeBodyV1:
    kind: binary
    media_type: multipart/report; report-type=delivery-status
    min_bytes: 1
    max_bytes: 10485760
    parser_rules:
      - MIME nesting depth is at most 16 and part count is at most 128.
      - Exactly one message/delivery-status part is required.
      - Unknown DSN extension fields are rejected rather than stored as a map.

  SmtpDsnReportV1:
    kind: object
    additional_properties: false
    fields: {providerEventId: 'string[1..500]', originalMessageId: 'string[1..998]', deliveryKey: 'secret-string[16..500]', action: 'enum<DELAYED|DELIVERED|RELAYED|EXPANDED|FAILED>', statusCode: 'string-pattern<^[245]\.[0-9]{1,3}\.[0-9]{1,3}$>', diagnosticCode: 'nullable<string[1..2000]>', finalRecipientSha256: sha256, remoteMtaSha256: 'nullable<sha256>', lastAttemptAt: datetime, willRetryUntil: 'nullable<datetime>'}

