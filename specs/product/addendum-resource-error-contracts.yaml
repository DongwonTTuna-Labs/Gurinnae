      COMMERCIAL_CONTROL: {additional_properties: false, fields: {kind: 'const<COMMERCIAL_CONTROL>', plainLanguageTrigger: 'string[1..4000]', affectedScope: 'string[1..4000]', requestedActions: 'array<string[1..1000]>[1..3]', whyNow: 'string[1..4000]', evidenceAndMetricInputs: 'string[1..4000]', currentVersions: 'string[1..4000]', expectedProductEffects: 'string[1..4000]', expectedExternalEffects: 'string[1..4000]', existingCustomerContinuityPlan: 'string[1..4000]', maximumCostAndExposure: 'string[1..4000]', expiry: 'string[1..1000]', rollbackOrResumeRequirements: 'string[1..4000]', requiredQuorum: 'array<string[1..500]>[3..5]', importReceiptStatus: 'string[1..2000]', acknowledgementStatus: 'string[1..2000]'}}

  ActionApprovalSubjectViewV1:
    kind: object
    additional_properties: false
    required: [summary, evidence, effect, destination, exactContent, governance, decisionHelp, details]
    fields: {summary: ActionApprovalSummarySectionV1, evidence: ActionApprovalEvidenceSectionV1, effect: ActionApprovalEffectSectionV1, destination: ActionApprovalDestinationSectionV1, exactContent: ActionApprovalExactContentSectionV1, governance: ActionApprovalGovernanceSectionV1, decisionHelp: ActionApprovalDecisionHelpSectionV1, details: ActionApprovalDetailViewV1}
    invariants:
      - details.kind equals ApprovalBindingV1.actionKind and actionDetailKind.
      - The first viewport exposes object, current state, highest-priority fact, material unknown, evidence entry, next decision and durable consequence before technical IDs.
      - UUIDs and digests are secondary technical details and are never editable decision inputs.
      - No decision control is enabled until subject canonical bytes, approvalSubjectDigest and current binding are revalidated.

  ApprovalBindingV1:
    kind: discriminated_union
    discriminator: actionDetailKind
    additional_properties: false
    canonical_source: specs/product/addendum-approval-policy.yaml#closed_binding_schemas.ApprovalBindingV1
    required: [schemaVersion, proposalId, proposalVersion, actionKind, originDigest, contentDigest, rationaleDigest, targetType, targetId, targetVersion, targetDigest, objectScopeDigest, operationId, requiredCapability, targetRequestDigest, previewId, approvalSubjectDigest, evidenceSetDigest, contraryEvidenceSetDigest, uncertaintySetDigest, riskAssessmentDigest, policySnapshotDigest, conflictSnapshotDigest, expectedEffectDigest, reversible, quorumPlanDigest, effectIdempotencyKeySha256, notBefore, expiresAt, actionDetailKind, actionDetail, actionDetailDigest]
    fields:
      schemaVersion: 'const<approval-binding.v1>'
      proposalId: uuid
      proposalVersion: 'int64[1..max]'
      actionKind: ActionKindV1
      originDigest: sha256
      contentDigest: sha256
      rationaleDigest: sha256
      targetType: ActionTargetTypeV1
      targetId: 'string[1..500]'
      targetVersion: 'int64[1..max]'
      targetDigest: sha256
      objectScopeDigest: sha256
      operationId: 'string[1..128]'
      requiredCapability: 'string[1..128]'
      targetRequestDigest: sha256
      previewId: uuid
      approvalSubjectDigest: sha256
      evidenceSetDigest: sha256
      contraryEvidenceSetDigest: sha256
      uncertaintySetDigest: sha256
      riskAssessmentDigest: sha256
      policySnapshotDigest: sha256
      conflictSnapshotDigest: sha256
      expectedEffectDigest: sha256
      reversible: boolean
      quorumPlanDigest: sha256
      effectIdempotencyKeySha256: sha256
      notBefore: datetime
      expiresAt: datetime
      actionDetailKind: ActionKindV1
      actionDetail: ActionApprovalDetailV1
      actionDetailDigest: sha256
    invariants:
      - Field keys equal required and are byte-for-byte set-equal to the canonical approval policy schema.
      - actionKind equals actionDetailKind and actionDetail selects exactly one of the seventeen closed branches.
      - actionDetailDigest is recomputed from Gurine Canonical JSON v1 bytes for actionDetailKind and actionDetail.
      - decisionDigest, decisionKind, actorId, assignmentId, slotKind, reasonCode, reason, assurance, conflictDeclarationId and decidedAt are forbidden.
      - Inapplicable provider, recipient, rendering, consent, suppression, rights and cost fields are absent rather than represented by sentinels.

  ActionDecisionReceiptBindingV1:
    kind: object
    additional_properties: false
    canonical_source: specs/product/addendum-approval-policy.yaml#closed_binding_schemas.ActionDecisionReceiptBindingV1
    required: [decisionId, proposalId, proposalVersion, assignmentId, assignmentGeneration, slotKind, decisionKind, actorId, assertedRequiredCapability, assurance, reasonCode, reasonDigest, conflictDeclarationId, approvalDigest, decidedAt]
    fields:
      decisionId: uuid
      proposalId: uuid
      proposalVersion: 'int64[1..max]'
      assignmentId: uuid
      assignmentGeneration: 'int64[1..max]'
      slotKind: 'string[1..100]'
      decisionKind: 'enum<APPROVE|REJECT|CHANGES_REQUIRED|RECUSE>'
      actorId: uuid
      assertedRequiredCapability: 'string[1..128]'
      assurance: 'enum<ACTIVE_SESSION|RECENT_SESSION|STEP_UP>'
      reasonCode: 'string[1..100]'
      reasonDigest: sha256
      conflictDeclarationId: 'nullable<uuid>'
      approvalDigest: sha256
      decidedAt: datetime
    invariants:
      - Field keys equal required and are byte-for-byte set-equal to the canonical approval policy schema.
      - approvalDigest is the common cycle digest; decisionReceiptDigest is computed over this decision-specific binding and never aliases approvalDigest.

  ConflictTargetV1:
    kind: discriminated_union
    discriminator: targetType
    common_fields: {targetType: 'enum<CASE|REVIEW_SNAPSHOT|ACTION_PROPOSAL|PUBLICATION|COMMUNICATION_INTENT|RESPONSE_REQUEST|LEGAL_HOLD|CAPABILITY|SOURCE_ASSET|RESEARCH_ARTIFACT|PRIVACY_REQUEST|COMMUNICATION_SUBJECT>', targetId: 'string[1..512]', targetVersion: 'int64[1..max]', targetDigest: sha256}
    variants:
      CASE: {additional_properties: false, fields: {caseId: uuid}}
      REVIEW_SNAPSHOT: {additional_properties: false, fields: {reviewSnapshotId: uuid}}
      ACTION_PROPOSAL: {additional_properties: false, fields: {proposalId: uuid}}
      PUBLICATION: {additional_properties: false, fields: {publicationRevisionId: uuid}}
      COMMUNICATION_INTENT: {additional_properties: false, fields: {communicationIntentId: uuid}}
      RESPONSE_REQUEST: {additional_properties: false, fields: {responseRequestId: uuid}}
      LEGAL_HOLD: {additional_properties: false, fields: {legalHoldId: uuid}}
      CAPABILITY: {additional_properties: false, fields: {capabilityId: 'string[1..200]'}}
      SOURCE_ASSET: {additional_properties: false, fields: {sourceAssetId: uuid}}
      RESEARCH_ARTIFACT: {additional_properties: false, fields: {researchArtifactId: uuid}}
      PRIVACY_REQUEST: {additional_properties: false, fields: {privacyRequestId: uuid}}
      COMMUNICATION_SUBJECT: {additional_properties: false, fields: {communicationSubjectId: uuid, originBindingDigest: sha256}}
    invariants:
      - The variant-specific ID canonical string equals targetId and its repository row supplies targetVersion and targetDigest; caller scalars are comparison-only.
      - Exactly one target-specific candidate key resolves; missing or ambiguous resolution is TARGET_NOT_FOUND or INTERNAL_ERROR respectively.

  ConflictEvidenceRefV1:
    kind: discriminated_union
