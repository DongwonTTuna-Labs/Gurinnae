  ConflictExpiryReceiptV1:
    kind: object
    additional_properties: false
    fields: {declarationId: uuid, subjectActorId: uuid, targetType: 'string[1..64]', targetId: 'string[1..512]', targetVersion: 'int64[1..max]', targetDigest: sha256, conflictType: 'string[1..64]', declarationSequence: 'int64[1..max]', declarationDigest: sha256, policyDigest: sha256, expiresAt: datetime, expiredAt: datetime, auditEventId: uuid, emittedEventId: uuid, receiptDigest: sha256}

  LegalHoldTargetBindingV1:
    kind: discriminated_union
    discriminator: targetKind
    common_fields: {targetKind: 'enum<CASE|PUBLICATION|EVIDENCE|RESPONSE|SOURCE_ASSET|RESEARCH_ARTIFACT|PRIVACY_REQUEST|COMMUNICATION_SUBJECT>', targetId: uuid, targetVersion: 'int64[1..max]', targetDigest: sha256}
    variants:
      CASE: {additional_properties: false, fields: {caseId: uuid, reviewSnapshotId: uuid, reviewSnapshotDigest: sha256}}
      PUBLICATION: {additional_properties: false, fields: {publicationRevisionId: uuid}}
      EVIDENCE: {additional_properties: false, fields: {evidenceId: uuid}}
      RESPONSE: {additional_properties: false, fields: {responseId: uuid}}
      SOURCE_ASSET: {additional_properties: false, fields: {sourceDocumentId: uuid, sourceAssetId: uuid}}
      RESEARCH_ARTIFACT: {additional_properties: false, fields: {researchArtifactId: uuid, researchAssetId: uuid}}
      PRIVACY_REQUEST: {additional_properties: false, fields: {privacyRequestId: uuid, privacyRequestType: 'enum<ACCESS|CORRECTION|DELETION|RESTRICTION>'}}
      COMMUNICATION_SUBJECT: {additional_properties: false, fields: {communicationSubjectId: uuid, communicationSubjectOriginDigest: sha256}}
    invariants: [target-specific ID equals targetId, exactly one physical target candidate key resolves, anchorDigest is server-derived from the exact concrete target and never caller-authored]

  ResponseRequestSentReceiptV1:
    kind: object
    additional_properties: false
    fields: {receiptId: uuid, sourceEventId: uuid, sourceEventEnvelopeDigest: sha256, responseRequestId: uuid, priorRequestVersion: 'int64[1..max]', requestVersion: 'int64[2..max]', responseRequestBindingDigest: sha256, scopeDigest: sha256, priorState: 'const<DRAFT>', state: 'const<SENT>', communicationIntentId: uuid, communicationIntentDigest: sha256, renderingId: uuid, renderingDigest: sha256, renderedSha256: sha256, responseAccessTokenId: uuid, accessArtifactBindingDigest: sha256, endpointId: uuid, endpointVersion: 'int64[1..max]', endpointSnapshotDigest: sha256, channel: CommunicationChannelV1, providerConfigId: uuid, providerConfigVersion: 'int64[1..max]', providerConfigurationDigest: sha256, providerPreflightReceiptId: uuid, providerPreflightReceiptDigest: sha256, deliveryId: uuid, deliveryVersion: 'int64[1..max]', deliveryReceiptId: uuid, deliveryReceiptSequence: 'int64[1..max]', deliveryReceiptDigest: sha256, deliveryResultingState: 'enum<PROVIDER_ACCEPTED|DELIVERED|READ>', deliveryReceiptApplied: 'const<true>', acceptanceEvidenceKind: 'enum<PROVIDER_RESPONSE|SIGNED_PROVIDER_CALLBACK|AUTHENTICATED_PROVIDER_POLL|OFFICIAL_CHANNEL_RECEIPT|RECONCILIATION_PROOF>', providerEvidenceDigest: sha256, providerAcceptedAt: datetime, auditEventId: uuid, emittedEventId: uuid, receiptDigest: sha256}
    invariants: [requestVersion equals priorRequestVersion plus one, providerAcceptedAt equals the exact delivery receipt observedAt, receiptDigest excludes only itself and binds every listed field]

  ResponseRequestSentMaterializationResultV1:
    kind: discriminated_union
    discriminator: disposition
    variants:
      APPLIED_SENT: {additional_properties: false, fields: {disposition: 'const<APPLIED_SENT>', sourceEventId: uuid, responseRequestId: uuid, receipt: ResponseRequestSentReceiptV1, resultDigest: sha256}}
      NO_OP_ALREADY_SENT: {additional_properties: false, fields: {disposition: 'const<NO_OP_ALREADY_SENT>', sourceEventId: uuid, responseRequestId: uuid, existingSentReceiptId: uuid, existingSentReceiptDigest: sha256, resultDigest: sha256}}
      NO_OP_NONQUALIFYING: {additional_properties: false, fields: {disposition: 'const<NO_OP_NONQUALIFYING>', sourceEventId: uuid, responseRequestId: uuid, deliveryReceiptId: uuid, deliveryReceiptSequence: 'int64[1..max]', reasonCode: 'enum<NOT_APPLIED|WRONG_OBJECT_KIND|STATE_NOT_ACCEPTANCE|RECEIPT_NOT_CURRENT>', resultDigest: sha256}}
    invariants: [only APPLIED_SENT writes response request sent state sent receipt audit or domain outbox, both NO_OP variants terminalize only the claimed inbox row, exact replay returns byte-identical stored result]

  ResponseSubmissionMaterializationResultV1:
    kind: discriminated_union
    discriminator: disposition
    variants:
      APPLIED: {additional_properties: false, fields: {disposition: 'const<APPLIED>', sourceEventId: uuid, responseSubmissionId: uuid, responseRequestId: uuid, editorialResponseId: uuid, submissionReceiptVersion: 'int64[1..max]', submissionReceiptDigest: sha256, auditEventId: uuid, emittedEventId: uuid, resultDigest: sha256}}
      NO_OP_ALREADY_MATERIALIZED: {additional_properties: false, fields: {disposition: 'const<NO_OP_ALREADY_MATERIALIZED>', sourceEventId: uuid, responseSubmissionId: uuid, responseRequestId: uuid, editorialResponseId: uuid, ownedIntakeReceiptDigest: sha256, resultDigest: sha256}}
    invariants: [both branches require the exact reciprocal submission/response binding, only APPLIED inserts domain audit and outbox rows, a mismatched existing pointer is EVENT_EFFECT_CONFLICT rather than no-op]

  RetractionExecutionReceiptV1:
    kind: object
    additional_properties: false
    fields: {receiptId: uuid, executionId: uuid, generation: 'int64[1..max]', executionDigest: sha256, approvalDigest: sha256, caseId: uuid, caseVersion: 'int64[1..max]', priorPublicationRevisionId: uuid, priorPublicationRevisionDigest: sha256, retractionRevisionId: uuid, retractionRevision: 'int64[1..max]', retractionRevisionDigest: sha256, publicationGateDecisionId: uuid, publicationGateDecisionDigest: sha256, auditEventId: uuid, domainEventId: uuid, projectionEventId: uuid, completedAt: datetime, receiptDigest: sha256}

  ActionChangeTaskV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..99]', ownerUserId: uuid, dueAt: datetime, blockerCode: 'string[1..100]', requestedChange: 'string[1..4000]', verificationMethod: 'string[1..2000]'}

  ActionDecisionV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      APPROVE: {additional_properties: false, fields: {kind: 'const<APPROVE>', reasonCode: 'string[1..100]', reason: 'string[1..4000]', attestExactPreview: 'const<true>', assurance: 'nullable<enum<ACTIVE_SESSION|STEP_UP>>', stepUpAuthorizationId: 'nullable<uuid>', assertedActionDigest: 'nullable<sha256>', stepUpAt: 'nullable<datetime>'}}
      REJECT: {additional_properties: false, fields: {kind: 'const<REJECT>', reasonCode: 'string[1..100]', reason: 'string[1..4000]'}}
      CHANGES_REQUIRED: {additional_properties: false, fields: {kind: 'const<CHANGES_REQUIRED>', reasonCode: 'string[1..100]', reason: 'string[1..4000]', tasks: 'array<ActionChangeTaskV1>[1..100]'}}
      RECUSE: {additional_properties: false, fields: {kind: 'const<RECUSE>', reasonCode: 'string[1..100]', reason: 'string[1..4000]', conflictDeclarationId: uuid}}

  SafeRetryProofV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      NO_PROVIDER_ATTEMPT: {additional_properties: false, fields: {kind: 'const<NO_PROVIDER_ATTEMPT>', attemptReceiptId: uuid, attemptReceiptDigest: sha256}}
      PROVIDER_LOOKUP_NOT_FOUND: {additional_properties: false, fields: {kind: 'const<PROVIDER_LOOKUP_NOT_FOUND>', lookupReceiptId: uuid, lookupReceiptDigest: sha256, observedAt: datetime}}
      PROVIDER_IDEMPOTENT_REPLAY_SAFE: {additional_properties: false, fields: {kind: 'const<PROVIDER_IDEMPOTENT_REPLAY_SAFE>', providerCapabilityReceiptId: uuid, lookupReceiptId: uuid, providerIdempotencyKeySha256: sha256}}

  CommunicationTopicScopeV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      EXACT_TOPIC_SET: {additional_properties: false, fields: {kind: 'const<EXACT_TOPIC_SET>', topicIds: 'unique-array<string[1..200]>[1..1000]'}}
      EXACT_EVENT_SET: {additional_properties: false, fields: {kind: 'const<EXACT_EVENT_SET>', eventTypes: 'unique-array<string-pattern<^[a-z][a-z0-9_.-]*[.]v[0-9]+$>>[1..1000]'}}
      EXACT_SUBJECT: {additional_properties: false, fields: {kind: 'const<EXACT_SUBJECT>', subjectType: 'enum<CASE|PUBLICATION|RESPONSE_REQUEST|CORRECTION|PRIVACY_REQUEST|COMMUNICATION_SUBJECT>', subjectId: uuid, subjectVersion: 'int64[1..max]', subjectDigest: sha256}}
    invariants:
      - Scope arrays are sorted in canonical order before digesting and have no implicit ALL or wildcard value.
      - A purpose, topic, event or subject outside the selected variant requires a new authorization fact.

  PendingCommunicationAuthorizationBindingV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<pending-communication-authorization.v1>', communicationSubjectId: uuid, endpointId: uuid, endpointVersion: 'int64[1..max]', endpointSnapshotDigest: sha256, channel: 'enum<SMTP_EMAIL|TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_SMS|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE|SIGNED_WEBHOOK>', purpose: 'enum<SYSTEM_TRANSACTIONAL|SUBSCRIPTION_UPDATE|DISCRETIONARY_EXTERNAL|INTERNAL_ACTION_REQUEST>', topicScope: CommunicationTopicScopeV1, topicScopeDigest: sha256, basis: 'enum<CONTRACT|LEGAL_OBLIGATION|LEGITIMATE_INTEREST|CONSENT>', policyVersion: 'string[1..100]', jurisdiction: 'string[2..64]', locale: 'string[2..35]', sourceKind: 'enum<PUBLIC_SUBSCRIPTION|RESPONSE_WORKFLOW|PRIVACY_WORKFLOW|INTERNAL_APPROVAL|ENDPOINT_LINK>', sourceId: uuid, sourceDigest: sha256, proofDigest: sha256, grantedAt: datetime, verificationExpiresAt: datetime, authorizationExpiresAt: datetime}
    invariants:
      - topicScopeDigest is the canonical digest of topicScope and sourceDigest binds the immutable initiating object.
      - verificationExpiresAt and authorizationExpiresAt are after grantedAt; endpoint verification alone never widens purpose or topic scope.

  JurisdictionSetV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<jurisdiction-set.v1>', policyVersion: 'string[1..100]', jurisdictionCodes: 'unique-array<string-pattern<^[A-Z]{2}(?:-[A-Z0-9]{1,3})?$>>[1..256]', dataResidencyCountryCodes: 'unique-array<string-pattern<^[A-Z]{2}$>>[1..250]', decisionReceiptDigests: 'unique-array<sha256>[1..256]', evaluatedAt: datetime, expiresAt: datetime}
    invariants:
      - Every code is an explicitly approved deployment jurisdiction; omission is deny and no global default exists.
      - expiresAt is after evaluatedAt and the set is unusable when any bound decision is suspended, revoked or expired.

  CommunicationRateLimitRuleV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..99]', dimension: 'enum<PROVIDER|CHANNEL|DEPLOYMENT|ENDPOINT|PURPOSE>', windowSeconds: 'int32[1..86400]', maximumRequests: 'int64[1..max]', maximumRecipients: 'int64[1..max]', burst: 'int32[1..10000]', sourceReceiptDigest: sha256}

  CommunicationRateLimitPolicyV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-rate-limit.v1>', policyVersion: 'string[1..100]', rules: 'array<CommunicationRateLimitRuleV1>[5..100]', evaluatedAt: datetime, expiresAt: datetime, policyDigest: sha256}
    invariants:
      - Exactly one or more rules cover each of PROVIDER, CHANNEL, DEPLOYMENT, ENDPOINT and PURPOSE; rule ordinals are zero-based, contiguous and unique.
      - Retry, fallback, replay and reconciliation never create a new allowance or bypass a more restrictive applicable rule.

  CommunicationCostPolicyV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-cost-policy.v1>', policyVersion: 'string[1..100]', settlementCurrency: 'string-pattern<^[A-Z]{3}$>', maximumCostPerAttempt: MoneyV1, maximumCostPerIntent: MoneyV1, maximumDailyDeploymentCost: MoneyV1, fxRateSetDigest: sha256, requireWorstCaseReservation: 'const<true>', evaluatedAt: datetime, expiresAt: datetime, policyDigest: sha256}
    invariants:
      - All money fields use settlementCurrency and maximumCostPerAttempt does not exceed maximumCostPerIntent or maximumDailyDeploymentCost.
      - Dispatch is impossible without a current worst-case reservation; actual settlement never authorizes an over-budget retry or fallback.

  CommunicationProviderCapabilitiesV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-provider-capabilities.v1>', contractRevision: 'string[1..200]', adapter: 'enum<SMTP_EMAIL|TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_SMS|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE|SIGNED_WEBHOOK>', adapterId: 'enum<smtp-email-v1|telegram-bot-api-v1|meta-whatsapp-business-cloud-v1|line-messaging-api-v1|solapi-sms-v1|solapi-kakao-bizmessage-v1|twilio-voice-v1|signed-webhook-v1>', idempotencyMode: 'enum<NONE|REQUEST_KEY|PROVIDER_MESSAGE_ID>', acknowledgementSemantics: 'enum<NONE|PROVIDER_ACCEPTED|TERMINAL_SIGNED_RECEIPT>', reconciliationModes: 'unique-array<enum<SIGNED_CALLBACK|AUTHENTICATED_POLL|SYNCHRONOUS_SIGNED_TERMINAL>>[0..3]', provableStates: 'unique-array<enum<PROVIDER_ACCEPTED|DELIVERED|READ|FAILED_PERMANENT|CANCELLED>>[1..5]', supportsProviderCancellation: boolean, supportsOptOutReceipt: boolean, maximumPayloadBytes: 'int64[1..10485760]', maximumRecipientsPerRequest: 'int32[1..1000]', capabilityEvidenceDigest: sha256, evaluatedAt: datetime, expiresAt: datetime}
    invariants:
      - adapter and adapterId must be the fixed pair in owner-addendum.provider_contracts.fixed_adapter_bindings.
      - READ is absent unless the pinned authenticated provider contract proves it; email open-pixel evidence never qualifies.
      - NONE idempotency with no reconciliation mode cannot activate for a duplication-sensitive effect.

  CommunicationProviderPreflightItemV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..63]', code: 'enum<ADAPTER_IMPLEMENTED|SECRET_REFERENCE_RESOLVED|SENDER_IDENTITY_VERIFIED|JURISDICTION_APPROVED|DPA_CURRENT|TEMPLATE_CATALOG_APPROVED|CALLBACK_OR_POLL_VERIFIED|ALLOWLIST_PINNED|RATE_LIMIT_CURRENT|COST_POLICY_CURRENT|KILL_SWITCH_READY|GOLDEN_FIXTURES_PASS|LIVE_SANDBOX_RECEIPT_CURRENT>', result: 'enum<PASS|FAIL|NOT_APPLICABLE>', evidenceReceiptDigest: 'nullable<sha256>', evaluatedAt: datetime, expiresAt: 'nullable<datetime>'}
    invariants:
      - PASS requires evidenceReceiptDigest and unexpired expiresAt; FAIL has a blocker and NOT_APPLICABLE requires a typed applicability decision.

  CommunicationProviderPreflightChecklistV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-provider-preflight-checklist.v1>', providerConfigId: uuid, providerConfigVersion: 'int64[1..max]', configurationDigest: sha256, items: 'array<CommunicationProviderPreflightItemV1>[13..13]', evaluatedAt: datetime, checklistDigest: sha256}
    invariants:
      - Item codes are set-equal to the closed 13-code catalog, ordinals are zero-based and exactly one row exists per code.
      - ACTIVE requires every applicable item PASS; a file sink, synthetic fixture or configuration parse proves none of the production items by itself.

  CommunicationProviderPreflightBlockerV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..63]', checklistCode: 'enum<ADAPTER_IMPLEMENTED|SECRET_REFERENCE_RESOLVED|SENDER_IDENTITY_VERIFIED|JURISDICTION_APPROVED|DPA_CURRENT|TEMPLATE_CATALOG_APPROVED|CALLBACK_OR_POLL_VERIFIED|ALLOWLIST_PINNED|RATE_LIMIT_CURRENT|COST_POLICY_CURRENT|KILL_SWITCH_READY|GOLDEN_FIXTURES_PASS|LIVE_SANDBOX_RECEIPT_CURRENT>', reasonCode: 'string[1..100]', safeMessage: 'string[1..1000]', evidenceReceiptDigest: 'nullable<sha256>', retryAfter: 'nullable<datetime>'}

  CommunicationProviderPreflightBlockerSetV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-provider-preflight-blockers.v1>', blockers: 'array<CommunicationProviderPreflightBlockerV1>[0..64]', blockerSetDigest: sha256}
    invariants:
      - Blocker ordinals are zero-based and duplicate checklistCode/reasonCode pairs are forbidden.
      - A PASS preflight has an empty blocker set; any non-empty blocker set prevents ACTIVE.

  CommunicationTemplateVariableV1:
    kind: discriminated_union
    discriminator: valueKind
    common_fields: {name: 'string-pattern<^[A-Za-z][A-Za-z0-9_]{0,99}$>', valueKind: 'enum<STRING|URI_REFERENCE|INTEGER|DECIMAL|DATETIME|BOOLEAN>'}
    variants:
      STRING: {additional_properties: false, fields: {value: 'string[0..50000]'}}
      URI_REFERENCE: {additional_properties: false, fields: {value: uri-reference}}
      INTEGER: {additional_properties: false, fields: {value: 'int64[min..max]'}}
      DECIMAL: {additional_properties: false, fields: {value: decimal}}
      DATETIME: {additional_properties: false, fields: {value: datetime}}
      BOOLEAN: {additional_properties: false, fields: {value: boolean}}

  CommunicationTemplateVariablesV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-template-variables.v1>', variables: 'array<CommunicationTemplateVariableV1>[0..200]', variableSetDigest: sha256}
    invariants:
      - Variable names are unique and sorted by UTF-8 bytes; the digest covers the exact typed values and no free-form object/map is permitted.

  CommunicationAttachmentManifestItemV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..19]', attachmentId: uuid, mediaType: 'string[1..200]', sizeBytes: 'int64[0..52428800]', contentSha256: sha256, rightsDecisionDigest: sha256, malwareScanReceiptDigest: sha256, disclosureClass: 'enum<PUBLIC|INTERNAL_MINIMAL|CONFIDENTIAL_LINK_ONLY>'}

  CommunicationAttachmentManifestV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-attachment-manifest.v1>', items: 'array<CommunicationAttachmentManifestItemV1>[0..20]', totalSizeBytes: 'int64[0..104857600]', manifestDigest: sha256}
    invariants:
      - Item ordinals are zero-based and contiguous; totalSizeBytes equals the exact sum and each attachment is immutable and scan/rights current.

  CommunicationRenderingBindingV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-rendering-binding.v1>', intentId: uuid, renderingRevision: 'int64[1..max]', endpointId: uuid, endpointVersion: 'int64[1..max]', endpointSnapshotDigest: sha256, channel: 'enum<SMTP_EMAIL|TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_SMS|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE|SIGNED_WEBHOOK>', locale: 'string[2..35]', templateId: 'string[1..200]', templateRevision: 'string[1..100]', variableSetDigest: sha256, attachmentManifestDigest: sha256, disclosureClass: 'enum<PUBLIC|INTERNAL_MINIMAL|CONFIDENTIAL_LINK_ONLY>', semanticPayloadDigest: sha256, recipientBindingDigest: sha256, renderedSha256: sha256, renderedByteLength: 'int64[1..10485760]', transportContentType: 'string[1..200]', expiresAt: datetime}
    invariants:
      - renderingDigest is the canonical SHA-256 of every field; decrypted immutable bytes must equal renderedSha256 and renderedByteLength before dispatch.

  CommunicationProviderRevisionSnapshotV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-provider-revision.v1>', integrationId: uuid, providerConfigId: uuid, providerConfigVersion: 'int64[1..max]', deploymentId: uuid, environment: 'enum<DEVELOPMENT|TEST|STAGING|PRODUCTION>', channel: 'enum<SMTP_EMAIL|TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_SMS|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE|SIGNED_WEBHOOK>', adapterId: 'enum<smtp-email-v1|telegram-bot-api-v1|meta-whatsapp-business-cloud-v1|line-messaging-api-v1|solapi-sms-v1|solapi-kakao-bizmessage-v1|twilio-voice-v1|signed-webhook-v1>', providerAccountHmac: sha256, senderIdentityHmac: sha256, credentialSecretReference: 'string[1..500]', webhookSecretReference: 'nullable<string[1..500]>', callbackPath: 'nullable<uri-reference>', callbackAllowlistDigest: 'nullable<sha256>', jurisdictionSetDigest: sha256, dpaEvidenceDigest: sha256, approvedTemplateCatalogDigest: sha256, rateLimitPolicyDigest: sha256, costPolicyDigest: sha256, providerCapabilitiesDigest: sha256, killSwitchCode: 'string[1..100]', configurationDigest: sha256}
    invariants:
      - channel and adapterId are one fixed pair; secret references are immutable version-qualified resolver identifiers and never secret bytes or latest aliases.

  CommunicationCallbackAuthenticationEvidenceV1:
    kind: discriminated_union
    discriminator: method
    variants:
      GURINE_MTA_ASSERTION: {additional_properties: false, fields: {method: 'const<GURINE_MTA_ASSERTION>', issuer: 'string[1..200]', keyId: 'string[1..200]', jtiHmac: sha256, assertionDigest: sha256, signedInputSha256: sha256, issuedAt: datetime, expiresAt: datetime}}
      TELEGRAM_SECRET_TOKEN: {additional_properties: false, fields: {method: 'const<TELEGRAM_SECRET_TOKEN>', secretTokenKeyVersion: 'string[1..200]', secretTokenComparisonDigest: sha256, signedInputSha256: sha256}}
      META_HMAC_SHA256: {additional_properties: false, fields: {method: 'const<META_HMAC_SHA256>', appSecretKeyVersion: 'string[1..200]', xHubSignature256Digest: sha256, signedBodySha256: sha256, signedInputSha256: sha256}}
      LINE_HMAC_SHA256: {additional_properties: false, fields: {method: 'const<LINE_HMAC_SHA256>', channelSecretKeyVersion: 'string[1..200]', xLineSignatureDigest: sha256, signedBodySha256: sha256, signedInputSha256: sha256}}
      SOLAPI_SIGNATURE: {additional_properties: false, fields: {method: 'const<SOLAPI_SIGNATURE>', apiSecretKeyVersion: 'string[1..200]', signedDate: datetime, saltHash: sha256, signatureDigest: sha256, signedInputSha256: sha256, freshnessPolicyVersion: 'string[1..100]'}}
      TWILIO_SIGNATURE: {additional_properties: false, fields: {method: 'const<TWILIO_SIGNATURE>', authTokenKeyVersion: 'string[1..200]', xTwilioSignatureDigest: sha256, externalUrlDigest: sha256, parameterCanonicalizationRevision: 'string[1..100]', signedInputSha256: sha256}}
    invariants:
      - Only the selected adapter's exact fields exist. Authentication is over the raw canonical signed input before parsing and the evidence never contains a credential or signature byte.
      - GURINE_MTA_ASSERTION binds POST path, exact content type and body digest, expires within 300 seconds and has single-use JTI replay protection; mTLS may be additional transport defense but is not the identity proof.

  CommunicationNormalizedProviderEvidenceV1:
    kind: discriminated_union
    discriminator: adapter
    variants:
      SMTP_EMAIL: {additional_properties: false, fields: {adapter: 'const<SMTP_EMAIL>', action: 'enum<DELAYED|DELIVERED|RELAYED|EXPANDED|FAILED>', enhancedStatusCode: 'string-pattern<^[245][.][0-9]{1,3}[.][0-9]{1,3}$>', diagnosticDigest: 'nullable<sha256>'}}
      TELEGRAM_BOT_API: {additional_properties: false, fields: {adapter: 'const<TELEGRAM_BOT_API>', updateKind: 'enum<MESSAGE|CALLBACK_QUERY>', interactionDigest: sha256}}
      META_WHATSAPP_BUSINESS_CLOUD: {additional_properties: false, fields: {adapter: 'const<META_WHATSAPP_BUSINESS_CLOUD>', eventKind: 'enum<STATUS|INBOUND_TEXT>', status: 'nullable<enum<SENT|DELIVERED|READ|FAILED>>', interactionDigest: 'nullable<sha256>'}}
      LINE_MESSAGING_API: {additional_properties: false, fields: {adapter: 'const<LINE_MESSAGING_API>', eventKind: 'enum<MESSAGE_TEXT|POSTBACK|FOLLOW|UNFOLLOW>', interactionDigest: sha256}}
      SOLAPI_SMS: {additional_properties: false, fields: {adapter: 'const<SOLAPI_SMS>', status: 'enum<QUEUED|SENT|DELIVERED|FAILED>', statusCode: 'string[1..100]', statusMessageDigest: sha256}}
      SOLAPI_KAKAO_BIZMESSAGE: {additional_properties: false, fields: {adapter: 'const<SOLAPI_KAKAO_BIZMESSAGE>', status: 'enum<QUEUED|SENT|DELIVERED|FAILED>', statusCode: 'string[1..100]', statusMessageDigest: sha256}}
      TWILIO_VOICE: {additional_properties: false, fields: {adapter: 'const<TWILIO_VOICE>', status: 'enum<QUEUED|RINGING|IN_PROGRESS|COMPLETED|BUSY|FAILED|NO_ANSWER|CANCELED>', sipResponseCode: 'nullable<int32[100..699]>', durationSeconds: 'nullable<int32[0..86400]>'}}

  CommunicationCallbackNormalizedItemV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..999]', effectKind: 'enum<DELIVERY_OBSERVATION|OPT_OUT_REQUEST|ENDPOINT_INTERACTION>', providerEventIdentityHmac: sha256, providerMessageIdHmac: 'nullable<sha256>', deliveryKeySha256: 'nullable<sha256>', providerSequence: 'nullable<int64[0..max]>', providerOccurredAt: 'nullable<datetime>', assertedState: 'nullable<enum<PROVIDER_ACCEPTED|DELIVERED|READ|FAILED_PERMANENT>>', evidenceRank: 'int32[0..100]', normalizedEvidence: CommunicationNormalizedProviderEvidenceV1, normalizedEvidenceDigest: sha256, processingDisposition: 'enum<APPLIED|STALE_STORED|UNMATCHED_RECONCILIATION_REQUIRED>', matchedDeliveryId: 'nullable<uuid>', matchedAttemptId: 'nullable<uuid>', itemDigest: sha256}
    invariants:
      - Matched IDs appear only for APPLIED or STALE_STORED. OPT_OUT_REQUEST and ENDPOINT_INTERACTION cannot synthesize a delivery state.

  CommunicationCallbackNormalizedItemSetV1:
    kind: object
    additional_properties: false
    fields: {schemaVersion: 'const<communication-callback-items.v1>', items: 'array<CommunicationCallbackNormalizedItemV1>[1..1000]', itemSetDigest: sha256}
    invariants:
      - Ordinals are zero-based, contiguous and unique; providerEventIdentityHmac is unique and each itemDigest binds every item field.
      - SMTP, Telegram and Twilio allow exactly one item. WhatsApp and LINE allow 1..1000. Each SOLAPI revision declares either exactly one or 1..1000 at activation.

  CommunicationCallbackAcknowledgementHeaderV1:
    kind: object
    additional_properties: false
    fields: {name: 'enum<content-type|cache-control>', value: 'string[1..200]'}

  CommunicationCallbackAcknowledgementHeadersV1:
    kind: object
    additional_properties: false
    fields: {headers: 'array<CommunicationCallbackAcknowledgementHeaderV1>[1..2]', headerSetDigest: sha256}
    invariants:
      - Header names are unique and sorted; set-cookie, authorization, location and submission-session headers are impossible.

  CommunicationReconciliationEvidenceV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      PROVIDER_LOOKUP_NOT_FOUND: {additional_properties: false, fields: {kind: 'const<PROVIDER_LOOKUP_NOT_FOUND>', lookupReceiptId: uuid, providerAccountId: uuid, lookupRequestSha256: sha256, lookupResponseSha256: sha256, observedAt: datetime}}
      PROVIDER_SIGNED_RECEIPT: {additional_properties: false, fields: {kind: 'const<PROVIDER_SIGNED_RECEIPT>', callbackRequestId: uuid, itemOrdinal: 'int32[0..999]', providerEventIdentityHmac: sha256, providerEvidenceDigest: sha256, signatureVerificationReceiptId: uuid, observedAt: datetime}}
      AUTHENTICATED_PROVIDER_POLL: {additional_properties: false, fields: {kind: 'const<AUTHENTICATED_PROVIDER_POLL>', pollReceiptId: uuid, providerStatus: 'string[1..100]', providerEvidenceDigest: sha256, observedAt: datetime}}
      OPERATOR_EVIDENCE: {additional_properties: false, fields: {kind: 'const<OPERATOR_EVIDENCE>', evidenceReceiptIds: 'unique-array<uuid>[1..100]', evidenceDigest: sha256, observedAt: datetime}}
    invariants:
      - OPERATOR_EVIDENCE cannot support resolution DELIVERED.
      - DELIVERED requires PROVIDER_SIGNED_RECEIPT or AUTHENTICATED_PROVIDER_POLL and an activated provider capability that proves delivery semantics.

  CommunicationSafeRetryProofV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      NO_PROVIDER_ATTEMPT: {additional_properties: false, fields: {kind: 'const<NO_PROVIDER_ATTEMPT>', preEgressReceiptId: uuid, preEgressReceiptSequence: 'int64[1..max]', preEgressReceiptDigest: sha256, providerIdempotencyKeySha256: sha256, requestSha256: sha256}}
      PROVIDER_LOOKUP_NOT_FOUND: {additional_properties: false, fields: {kind: 'const<PROVIDER_LOOKUP_NOT_FOUND>', lookupReceiptId: uuid, lookupReceiptDeliveryId: uuid, lookupReceiptSequence: 'int64[1..max]', lookupReceiptDigest: sha256, lookupReceiptEvidenceKind: 'const<AUTHENTICATED_PROVIDER_POLL>', lookupReceiptApplied: 'const<false>', lookupRequestSha256: sha256, lookupResponseSha256: sha256, providerIdempotencyKeySha256: sha256, requestSha256: sha256, observedAt: datetime}}
      PROVIDER_IDEMPOTENT_REPLAY_SAFE: {additional_properties: false, fields: {kind: 'const<PROVIDER_IDEMPOTENT_REPLAY_SAFE>', providerPreflightReceiptId: uuid, providerConfigId: uuid, providerConfigVersion: 'int64[1..max]', providerConfigurationDigest: sha256, providerPreflightReceiptDigest: sha256, lookupReceiptId: uuid, lookupReceiptDeliveryId: uuid, lookupReceiptSequence: 'int64[1..max]', lookupReceiptDigest: sha256, lookupReceiptEvidenceKind: 'const<AUTHENTICATED_PROVIDER_POLL>', lookupReceiptApplied: 'const<false>', providerIdempotencyKeySha256: sha256, requestSha256: sha256, observedAt: datetime}}
    invariants: [every variant binds the same delivery provider key and request bytes, digest-only or cross-delivery evidence is invalid, lookupReceiptId/DeliveryId/Sequence/Digest/EvidenceKind/Applied is one exact composite key in ops.outbound_delivery_receipts, and the database reconstructs the authoritative proof before persisting a RETRY_SCHEDULED decision]

  IncidentCapabilityV1:
    kind: catalog_enum
    source_union:
      - specs/ui/roles-and-permissions.yaml#capabilities
      - specs/product/owner-addendum-2026-07-14.yaml#authorization_delta.capabilities[*].id

  IncidentEvidenceRefV1:
    kind: object
    additional_properties: false
    fields: {kind: 'enum<AUDIT_EVENT|EXECUTION_RECEIPT|DELIVERY_RECEIPT|SLI_RECEIPT|SOURCE_RUN|DATASET_SNAPSHOT|MANUAL_NOTE>', id: uuid, version: 'nullable<int64[1..max]>', digest: sha256, label: 'string[1..500]'}

  PostmortemActionItemV1:
    kind: object
    additional_properties: false
    fields: {ordinal: 'int32[0..99]', title: 'string[1..500]', ownerUserId: uuid, dueAt: datetime, priority: 'enum<P0|P1|P2|P3>', verificationMethod: 'string[1..2000]'}

  ResponseAppealInformationTaskV1:
    kind: object
    additional_properties: false
    fields: {title: 'string[1..500]', description: 'string[1..4000]', assigneeUserId: uuid, dueAt: datetime, requestedEvidenceKinds: 'unique-array<enum<DELIVERY|CONSENT|SCOPE|PUBLICATION_EXCERPT|DEADLINE|IDENTITY|OTHER>>[1..7]'}

  EndpointEnrollmentV1:
    kind: discriminated_union
    discriminator: channel
    variants:
      EMAIL: {additional_properties: false, fields: {channel: 'const<EMAIL>', address: 'secret-string[3..320]', locale: 'string[2..35]'}}
      SMS: {additional_properties: false, fields: {channel: 'const<SMS>', e164: 'secret-string[8..16]', locale: 'string[2..35]'}}
      TELEGRAM: {additional_properties: false, fields: {channel: 'const<TELEGRAM>', providerSubjectToken: 'secret-string[16..4096]', locale: 'string[2..35]'}}
      WHATSAPP: {additional_properties: false, fields: {channel: 'const<WHATSAPP>', providerSubjectToken: 'secret-string[16..4096]', locale: 'string[2..35]'}}
      LINE: {additional_properties: false, fields: {channel: 'const<LINE>', providerSubjectToken: 'secret-string[16..4096]', locale: 'string[2..35]'}}
      KAKAO: {additional_properties: false, fields: {channel: 'const<KAKAO>', e164: 'secret-string[8..16]', locale: 'string[2..35]'}}
      VOICE: {additional_properties: false, fields: {channel: 'const<VOICE>', e164: 'secret-string[8..16]', locale: 'string[2..35]', explicitVoiceConsentReceiptId: uuid}}

  EndpointLinkingConsentV1:
    kind: object
    additional_properties: false
    fields: {decision: 'const<LINK>', purposes: 'unique-array<enum<SYSTEM_TRANSACTIONAL|SUBSCRIPTION_UPDATE|DISCRETIONARY_EXTERNAL|INTERNAL_ACTION_REQUEST>>[1..4]', policyVersion: 'string[1..100]', jurisdiction: 'string[2..64]', locale: 'string[2..35]', consentTextDigest: sha256, acceptedAt: datetime}

  EndpointVerificationProofV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      EMAIL_LINK: {additional_properties: false, fields: {kind: 'const<EMAIL_LINK>', token: 'secret-string[32..4096]'}}
      SMS_OTP: {additional_properties: false, fields: {kind: 'const<SMS_OTP>', code: 'secret-string[4..12]'}}
      PROVIDER_SIGNED_BINDING: {additional_properties: false, fields: {kind: 'const<PROVIDER_SIGNED_BINDING>', provider: 'enum<TELEGRAM_BOT_API|META_WHATSAPP_BUSINESS_CLOUD|LINE_MESSAGING_API|SOLAPI_KAKAO_BIZMESSAGE|TWILIO_VOICE>', bindingToken: 'secret-string[32..4096]'}}

  AbuseProofV1:
    kind: object
    additional_properties: false
    fields: {provider: 'enum<TURNSTILE|HCAPTCHA|SYNTHETIC_TEST>', token: 'secret-string[1..4096]', action: 'string[1..80]', issuedAtEpochSeconds: 'nullable<int64[0..max]>'}

  BrowserProofV1:
    kind: object
    additional_properties: false
    fields: {provider: 'enum<TURNSTILE|HCAPTCHA|SYNTHETIC_TEST>', token: 'secret-string[1..4096]', action: 'const<privacy-request-receipt-exchange>', clientNonce: 'secret-string[16..128]', issuedAtEpochSeconds: 'nullable<int64[0..max]>'}

  PrivacyIdentityProofV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      RESPONSE_RECEIPT: {additional_properties: false, fields: {kind: 'const<RESPONSE_RECEIPT>', receiptId: uuid, possessionToken: 'secret-string[32..4096]'}}
      VERIFIED_ENDPOINT: {additional_properties: false, fields: {kind: 'const<VERIFIED_ENDPOINT>', endpointChallengeId: uuid, endpointProof: EndpointVerificationProofV1}}
      IDENTITY_DOCUMENT_CHALLENGE: {additional_properties: false, fields: {kind: 'const<IDENTITY_DOCUMENT_CHALLENGE>', challengeId: uuid, verificationReceiptId: uuid, verificationReceiptDigest: sha256}}

  PrivacyObjectRefV1:
    kind: object
    additional_properties: false
    fields: {objectType: 'enum<RESPONSE|CORRECTION|SUBSCRIPTION|COMMUNICATION_ENDPOINT|PUBLICATION|EVIDENCE|AUDIT_SUBJECT_RECORD>', objectId: uuid}

  PrivacyRequestScopeV1:
    kind: object
    additional_properties: false
    fields: {scopeKind: 'enum<ALL_VERIFIED_SUBJECT_DATA|OBJECT_SET|DATE_RANGE>', objectRefs: 'array<PrivacyObjectRefV1>[0..1000]', dateFrom: 'nullable<date>', dateTo: 'nullable<date>', includeDerivatives: boolean, includeBackups: boolean}
    invariants:
      - OBJECT_SET requires at least one objectRefs item and null dateFrom/dateTo.
      - DATE_RANGE requires empty objectRefs and non-null dateFrom/dateTo with dateFrom not after dateTo.
      - ALL_VERIFIED_SUBJECT_DATA requires empty objectRefs and null dateFrom/dateTo.

  ActionAssignmentSummaryV1:
