      retryable: boolean
      fieldErrors: 'optional<array<FieldError>[1..100]>'
      errorContext: 'optional<AddendumErrorContextV1>'
    invariants:
      - type is the stable absolute problem type URI for code, not about:blank.
      - title, status, retryable, and allowed extension set exactly match the error catalog row.
      - detail never contains secrets, endpoint values, provider raw bodies, existence-sensitive scope data, or stack traces.
      - errorContext is emitted only when the catalog row declares a context and the caller is authorized to know the aggregate exists.

