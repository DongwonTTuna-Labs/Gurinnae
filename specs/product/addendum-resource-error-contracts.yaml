      INTERNAL_RECORD: {additional_properties: false, fields: {kind: 'const<INTERNAL_RECORD>', relationKind: 'enum<REVIEW_DECISION|ACTION_DECISION|AUDIT_EVENT|RIGHTS_DECISION|LEGAL_HOLD|FUNDING_DISCLOSURE>', recordId: uuid, recordDigest: sha256}}
      SIGNED_EXTERNAL_REFERENCE: {additional_properties: false, fields: {kind: 'const<SIGNED_EXTERNAL_REFERENCE>', referenceId: uuid, contentDigest: sha256, verificationReceiptId: uuid, verificationReceiptDigest: sha256}}

  ConflictDeclarationSummaryV1:
