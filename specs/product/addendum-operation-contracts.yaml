    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request: {required: [proposalId, expectedVersion, expectedContentDigest, previewId, previewDigest], fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256', previewId: 'uuid', previewDigest: 'sha256'}}
    response: ActionReviewRequestedReceiptV1
    transition: DRAFT->PENDING_QUORUM
    errors: [ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_PREVIEW_STALE, ACTION_POLICY_BLOCKED, ACTION_QUORUM_UNAVAILABLE, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: claimActionReview
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:claim-review
    kind: COMMAND
    capability: actions.review
    assurance: ACTIVE_SESSION
    request:
      required: [proposalId, assignmentId, expectedProposalVersion, expectedAssignmentVersion, expectedApprovalDigest]
