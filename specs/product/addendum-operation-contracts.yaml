      required: [proposalId, decisionId, expectedProposalVersion, expectedProposalStateVersion, expectedAssignmentVersion, expectedApprovalDigest, expectedDecisionReceiptDigest, reasonCode, reason]
      fields:
        proposalId: uuid
        decisionId: uuid
