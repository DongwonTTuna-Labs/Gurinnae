  - operation_id: createPrivacyCorrectionPlan
    api: control-api
    method: POST
    path: /v1/internal/commands/create-privacy-correction-plan
    kind: COMMAND
    capability: privacy.requests.manage
    assurance: STEP_UP
    description: >-
      Creates one immutable sealed correction plan only for the exact RESPONSE `/partyName` cell after re-reading the same subject-bound ACCESS projection and current-value digest. Every other object-kind and field-path pair is rejected as PRIVACY_CORRECTION_TARGET_UNSUPPORTED with zero writes.
    request:
      required: [retentionRequestId, expectedDecisionVersion, targetObjectType, targetObjectId, fieldPath, currentValueDigest, requestedValue, evidenceIds, reason]
      fields: {retentionRequestId: uuid, expectedDecisionVersion: 'int64>=0', targetObjectType: 'enum<RESPONSE|CORRECTION|SUBSCRIPTION|COMMUNICATION_ENDPOINT|PUBLICATION|EVIDENCE|AUDIT_SUBJECT_RECORD>', targetObjectId: uuid, fieldPath: 'json-pointer[1..1000]', currentValueDigest: sha256, requestedValue: secret-nonempty-string, evidenceIds: 'unique-array<uuid>[1..100]', reason: nonempty_string}
    server_derived_owner_input:
      generated_and_sealed_fields: [_correctionPlanId, requestedValueCiphertextBase64, requestedValueSha256]
      actor_fields: [_actorAssertionJti, _actorAssertionRequestSha256, _actorAssuranceLevel, _actorEffectiveCapability, _actorActionDigest, _actorStepUpAuthorizationId, _actorIdempotencyKeySha256, _actorRequestKeySha256]
      exact_owner_payload_key_count: 19
      scalar_owner_arguments: [actorId, sessionId, requestId, idempotencyKeySha256, semanticRequestSha256]
      rule: requestedValue is removed before the owner call and all eleven owner-only JSON fields plus every scalar owner argument are forbidden caller input
      digest_separation: _actorAssertionRequestSha256 must equal ops.assertion_replay_guard.request_digest for _actorAssertionJti; semanticRequestSha256 and requestedValueSha256 are respectively the idempotency request digest and service-derived plaintext digest, and none of the three may substitute for another
    response: PrivacyCorrectionPlanReceiptV1
    authorized_target_field_allowlist:
      - {targetObjectType: RESPONSE, fieldPath: /partyName, access_projection: PrivacyResponsePartyNameAccessProjectionV1, apply_owner: ops.execute_privacy_response_party_name_correction_job_v1}
    unsupported_target_contract:
      error: PRIVACY_CORRECTION_TARGET_UNSUPPORTED
      http_status: 422
      mutation_count: zero
      applies_to: every pair except exactly RESPONSE plus /partyName
    constraints:
      - The locked request must have requestType CORRECTION, a verified same-subject exact-scope receipt and an exact decision version in REVIEW; all other request types and states fail closed.
      - targetObjectType and fieldPath are first validated only as closed enum and bounded JSON Pointer syntax, then exact-matched against the one-entry allowlist. Wildcards, prefixes and inferred aliases are forbidden; every other pair returns PRIVACY_CORRECTION_TARGET_UNSUPPORTED before encryption, idempotency claim, owner writes, audit or effects.
      - currentValueDigest is caller comparison input, never authority. PostgreSQL recomputes it from the same PrivacyResponsePartyNameAccessProjectionV1 that supplies ACCESS and rejects a stale request, response version, receipt chain or projection digest as RETENTION_VERSION_CONFLICT before plan creation.
      - The accepted targetObjectId is the materialized editorial response bound through RESPONSE_RECEIPT to the exact submission receipt and immutable response-origin receipt. A submission ID, response-request ID or unrelated response cannot substitute.
      - Plan creation appends one sealed ops.privacy_correction_plans_v1 row and one immutable source-authority binding while mutating zero response rows. requestedValue plaintext is removed before the owner call and is absent from every response, event, audit field, log and metric.
      - The reused 0039 plan row's generic currentValueAuthority value HUMAN_REVIEWER_ASSERTION is subordinate provenance for the caller comparison input. Only the 0040 privacy-response-party-name-correction-plan-binding.v1 row with currentValueAuthority RESPONSE_PARTY_NAME_ACCESS_PROJECTION_V1 is final current-value authority, and every APPROVE/COMPLETE fence revalidates that binding.
      - PUBLICATION, EVIDENCE and AUDIT_SUBJECT_RECORD remain forbidden correction surfaces. CORRECTION, SUBSCRIPTION and COMMUNICATION_ENDPOINT and every RESPONSE path other than `/partyName` remain unsupported; procurement facts, detection results, publication decisions and audit records are never admitted through this operation.
      - Human APPROVE preserves privacy.request_decision_recorded.v1 and creates exactly one dedicated PRIVACY_RESPONSE_PARTY_NAME_CORRECTION job in the same transaction. Only the fenced workflow worker may apply the value and append the immutable completion receipt and privacy.response_party_name_corrected.v1 event.
    errors: [INVALID_PARAMETER, IDENTITY_PROOF_INVALID, PRIVACY_SCOPE_INVALID, PRIVACY_CORRECTION_TARGET_UNSUPPORTED, RETENTION_VERSION_CONFLICT, RETENTION_STATE_INVALID, RESOURCE_NOT_FOUND, CAPABILITY_DENIED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
  - operation_id: transitionRetentionRequest
    api: control-api
    method: POST
    path: /v1/internal/commands/transition-retention-request
    kind: COMMAND
    capability: privacy.requests.manage
    assurance: STEP_UP
    request:
      required: [retentionRequestId, expectedDecisionVersion, transition, reasonCode, reason]
      fields: {retentionRequestId: 'uuid', expectedDecisionVersion: 'int64>=0', transition: 'VERIFY_IDENTITY|START_REVIEW|APPROVE|REJECT|EXTEND', reasonCode: 'string[1..100]', reason: 'string[1..10000]', identityProofReceiptId: 'uuid', extensionReasonCode: 'string[1..100]', extensionReason: 'string[1..4000]', extensionBusinessDays: 'int32[1..max]', rejectionReasonCode: 'string[1..100]', rejectionReason: 'string[1..4000]', appealInstructions: 'string[1..4000]'}
    server_derived_owner_input:
      actor_fields: [_actorAssertionJti, _actorAssertionRequestSha256, _actorAssuranceLevel, _actorEffectiveCapability, _actorActionDigest, _actorStepUpAuthorizationId, _actorIdempotencyKeySha256, _actorRequestKeySha256]
      scalar_owner_arguments: [actorId, sessionId, requestId, idempotencyKeySha256, semanticRequestSha256]
      rule: the public variant is sealed first and the eight actor fields are then derived from the authenticated request; every generated sealed actor or scalar owner field is forbidden caller input
      digest_separation: _actorAssertionRequestSha256 must equal ops.assertion_replay_guard.request_digest for _actorAssertionJti and is distinct from semanticRequestSha256 and every service-derived sealed-plaintext digest
    response: RetentionRequestDecisionReceiptV2
    constraints:
      - VERIFY_IDENTITY requires only identityProofReceiptId in addition to the common fields; PostgreSQL selects exactly one current approved PRIVACY_RESPONSE_CALENDAR row and derives its policy/calendar binding, identityVerifiedAt and request-type dueAt from that row. The immutable supervisor-decision-v1 seed currently yields ten business days but is not a permanent operation constant.
      - EXTEND requires only extensionReasonCode, extensionReason and extensionBusinessDays in addition to the common fields; PostgreSQL compares the positive requested value and prior extension count with the exact current approved policy row, including its maximum days/count and pre-expiry notice rule. The supervisor-decision-v1 seed currently permits at most ten business days once.
      - REJECT requires only rejectionReasonCode, rejectionReason and appealInstructions in addition to the common fields; PostgreSQL derives refusal notice dueAt from the exact current approved policy row. The supervisor-decision-v1 seed currently specifies ten business days.
      - START_REVIEW and APPROVE permit no transition-specific fields. Every field belonging to another variant is forbidden.
      - Caller-supplied calendar, policy, digest, identityVerifiedAt, dueAt or noticeDueAt values are forbidden comparison substitutes.
      - COMPLETE is worker-owned after authoritative location receipts and is not an external Control API transition.
      - START_REVIEW has no unresolved external authority once the locked request already carries an exact VERIFIED identity receipt and policy/calendar binding. VERIFY_IDENTITY is also implemented when identityProofReceiptId is the immutable same-subject exact-scope RESPONSE_RECEIPT authority produced and consumed by the V3 owner.
      - VERIFY_IDENTITY remains OPEN_FAIL_CLOSED only for VERIFIED_ENDPOINT because no canonical endpoint verifier/runtime producer can create its source receipt. CORRECTION APPROVE is implemented only for exactly one current RESPONSE `/partyName` plan: it revalidates the response version, ACCESS projection and immutable authority chain, requires zero active legal holds, emits the existing privacy.request_decision_recorded.v1 event, and enqueues exactly one dedicated workflow job in the same transaction without mutating the response.
      - CORRECTION COMPLETE is private and implemented only by the fenced PRIVACY_RESPONSE_PARTY_NAME_CORRECTION worker. ACCESS, DELETION, RESTRICTION and every other CORRECTION target remain OPEN_FAIL_CLOSED until their own typed execution owners exist.
      - EXTEND and REJECT have complete policy/calendar rules but are reachable only after a successful authoritative VERIFY_IDENTITY. Any unresolved authority maps to request-id-only DEPENDENCY_UNAVAILABLE 503 with zero writes.
    errors: [INVALID_PARAMETER, IDENTITY_PROOF_INVALID, PRIVACY_SCOPE_INVALID, RETENTION_VERSION_CONFLICT, RETENTION_STATE_INVALID, BUSINESS_CALENDAR_STALE, LEGAL_HOLD_ACTIVE, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
