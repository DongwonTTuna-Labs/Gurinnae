    kind: COMMAND
    capability: responses.review
    assurance: STEP_UP
    description: >-
      Verifies a response organization against the current immutable official-channel authority assertion selected by officialChannelSourceId. The identifier is never a raw communication endpoint verification or document evidence identifier; the owner requires an active, unexpired and unrevoked assertion and revalidates its exact EMAIL domain-control or DOCUMENT official-representation binding in the transaction. Missing authority and OTP-only proof fail closed.
    request:
      description: >-
        Verifies a response organization against one current immutable official-channel authority assertion. The owner revalidates assertion state and the exact underlying authority proof in the transaction; missing authority fails closed.
      required: [responseId, organizationId, publicationForm, verificationMethod, officialChannelSourceId, reason, expectedVersion]
      fields: {responseId: uuid, organizationId: uuid, publicationForm: 'enum<FULL|REDACTED>', verificationMethod: 'enum<OFFICIAL_DOMAIN_EMAIL|OFFICIAL_DOCUMENT>', officialChannelSourceId: uuid, reason: 'string[1..4000]', expectedVersion: 'int64>=1'}
