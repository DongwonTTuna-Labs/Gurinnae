        expectedProposalStateVersion: int64>=1
        expectedAssignmentVersion: int64>=1
        expectedApprovalDigest: sha256
        expectedDecisionReceiptDigest: sha256
        reasonCode: CONFLICT_DISCOVERED|EVIDENCE_CHANGED|DECISION_ERROR|NO_LONGER_ELIGIBLE|OTHER
        reason: string[1..4000]
    response: ActionDecisionReceiptV1
    transition: counted APPROVE remains immutable and gains one APPROVAL_WITHDRAWAL record; its slot advances to generation+1 ASSIGNED when one deterministic eligible replacement exists, otherwise VACANT for the assignment coordinator
    concurrency: exact proposal/version/decision/assignment graph lock; final quorum authorization or withdrawal wins and the loser writes zero rows
    constraints:
      - Only the exact original human APPROVE actor may withdraw the unwithdrawn decision while the proposal remains PENDING_QUORUM.
      - The command re-performs the same or stronger assurance and never accepts a withdrawal as a submitActionDecision variant.
    errors: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, ACTION_PROPOSAL_STALE, ACTION_ASSIGNMENT_STALE, ACTION_DIGEST_MISMATCH, ACTION_DECISION_CLOSED, STEP_UP_REQUIRED, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
