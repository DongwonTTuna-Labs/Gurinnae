      required: []
      optional:
        actionKind: unique-array<action_payloads.kinds>[1..19]
        proposalState: unique-array<DRAFT|PENDING_QUORUM|APPROVED|REJECTED|CHANGES_REQUIRED|EXPIRED|SUPERSEDED|WITHDRAWN>[1..8]
        assignmentState: unique-array<ASSIGNED|IN_PROGRESS|COMPLETED|RECUSED|CANCELLED|VACANT>[1..6]
        dueBefore: datetime
        cursor: cursor
        limit: int32[1..100]=20
        sort: DUE_ASC|UPDATED_DESC=DUE_ASC
    response: ActionApprovalQueuePageV1
    errors: [INVALID_PARAMETER, INVALID_CURSOR, ACTOR_ASSERTION_REQUIRED, ACTOR_ASSERTION_INVALID, CAPABILITY_DENIED, INTERNAL_ERROR]
  - operation_id: createActionProposal
    api: control-api
    method: POST
    path: /v1/internal/action-proposals
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request:
      required: [actionKind, origin, draft, rationale, expiresAt]
      fields:
        actionKind: enum action_payloads.kinds
        origin: ActionOriginV1
        draft: ActionPayloadV1
        rationale: ActionRationaleV1
        expiresAt: datetime
    response: ActionProposalReceiptV1
    transition: NONE->DRAFT
    concurrency: idempotency-key+content-digest
    errors: [INVALID_PARAMETER, ACTION_KIND_MISMATCH, TARGET_NOT_FOUND, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: getActionProposal
    api: control-api
    method: GET
    path: /v1/internal/action-proposals/{proposalId}
    kind: QUERY
    capability: actions.read
    assurance: ACTIVE_SESSION
    request: {required: [proposalId], fields: {proposalId: 'uuid'}}
    response: ActionProposalDetailV1
    errors: [INVALID_PARAMETER, ACTOR_ASSERTION_REQUIRED, CAPABILITY_DENIED, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
  - operation_id: updateActionDraft
    api: control-api
    method: PATCH
    path: /v1/internal/action-proposals/{proposalId}/draft
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request:
      required: [proposalId, expectedVersion, expectedContentDigest, draft, rationale, expiresAt]
      fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256', draft: 'ActionPayloadV1', rationale: 'ActionRationaleV1', expiresAt: 'datetime'}
    response: ActionProposalReceiptV1
    transition: DRAFT(vN)->SUPERSEDED + DRAFT(vN+1)
    errors: [INVALID_PARAMETER, ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_DECISION_CLOSED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: previewActionDraft
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:preview
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request: {required: [proposalId, expectedVersion, expectedContentDigest], fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256'}}
    response: ActionPreviewReceiptV1
    transition: DRAFT->DRAFT
    errors: [ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_POLICY_BLOCKED, CAPABILITY_UNCONFIGURED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: submitActionForReview
    api: control-api
