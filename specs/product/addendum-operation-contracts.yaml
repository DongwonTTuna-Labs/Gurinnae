      - Withdrawal after execution authorization or POLICY_BLOCKED receipt creation is forbidden.
    errors: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_DECISION_CLOSED, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
