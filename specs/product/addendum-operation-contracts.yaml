schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
counts:
  operations: derived len(operations)
  queries: derived count(operations where kind=QUERY)
  commands: derived count(operations where kind=COMMAND)
  by_api:
    control-api: derived count(operations where api=control-api)
    submission-api: derived count(operations where api=submission-api)
    identity-api: derived count(operations where api=identity-api)
  rule: values are calculated from operations and compared set-equal to owner-addendum.additive_operations; numeric inventory literals are forbidden
rules:
  - Every schema is closed; additional properties, undocumented enum values, generic JSON and partial merge patch are invalid.
  - Every command requires Idempotency-Key, canonical request SHA-256 and one transaction for domain rows, idempotency receipt, audit and outbox.
  - Same idempotency scope and request digest returns the stored receipt byte-for-byte; changed bytes return IDEMPOTENCY_CONFLICT.
  - Every mutation that uses expectedVersion locks the aggregate and maps zero rows to NOT_FOUND or VERSION_CONFLICT by an explicit existence check.
  - Synthetic identifiers, timestamps, states, digests and receipts are forbidden.

type_grammar:
  uuid: RFC4122 lowercase string
  sha256: lowercase 64-hex string
  datetime: UTC RFC3339 with microseconds
  decimal: canonical non-exponent decimal string
  money: MoneyV1
  cursor: authenticated opaque string
  optional: field may be absent; nullable means field is present and may be null

common_schemas:
  canonical_source: specs/product/addendum-resource-error-contracts.yaml#schemas
  required: [CommandReceiptV1, AddendumProblemDetailsV1]
  rule: Concrete closed request, page, receipt and error schemas come only from the canonical additive resource/error contract; generic typed-array, typed-object, JSON or fallback error envelopes are forbidden.

action_payloads:
  kinds:
    - HYPOTHESIS
    - CLAIM
    - TASK
    - COMPARABLE
    - COMMUNICATION
    - PUBLICATION
    - RETRACTION
    - RULE_ACTIVATION
    - ROLE_GRANT
    - KILL_SWITCH
    - COMMUNICATION_AUTHORIZATION
    - ASSET_RIGHTS_DECISION
    - RETENTION_SCHEDULE
    - FUNDING_DISCLOSURE
    - CAPABILITY_ACTIVATION
    - RESPONSE_POLICY_CALENDAR
    - COMMERCIAL_CONTROL
    - PROVIDER_CONTROL
  common:
    additional_properties: false
    required: [schemaVersion, kind, target, rationale, effect]
    fields:
      schemaVersion: const action-payload.v1
      kind: enum action_payloads.kinds
      target: ActionTargetV1
      rationale: ActionRationaleV1
      effect: ActionEffectV1
  variants:
    HYPOTHESIS:
      required: [caseId, expectedCaseVersion, statement, unknowns, evidenceSegmentIds]
      executor: createHypothesis
      proposer_capability: cases.investigate
    CLAIM:
      required: [caseId, expectedCaseVersion, claimType, text, responseIds, limitations, evidenceSegmentIds]
      executor: addClaim
      proposer_capability: claims.author
    TASK:
      required: [objectType, objectId, expectedObjectVersion, taskType, title, description, priority, assigneeUserId, dueAt]
      executor: private.CreateTaskFromApprovedAction
      proposer_capability: cases.assign
    COMPARABLE:
      required: [caseId, expectedCaseVersion, targetLineItemId, targetLineItemVersion, candidateLineItemId, candidateLineItemVersion, compatibilityKind, includeReason, evidenceSegmentIds]
      executor: private.MaterializeComparableCandidate
      proposer_capability: cases.investigate
    COMMUNICATION:
      required: [caseId, expectedCaseVersion, purpose, provider, senderConfigId, templateId, templateRevision, locale, recipients, subject, bodyPlainText, attachmentIds, authorizationPurpose, maximumCost, notBefore, expiresAt]
      executor: private.DispatchCommunicationIntent
      proposer_capability: communications.propose
    PUBLICATION:
      required: [caseId, expectedCaseVersion, reviewSnapshotId, reviewSnapshotDigest, previewId, previewDigest, publicationGatePreviewDigest]
      executor: publishCase
      proposer_capability: publication.preview
    RETRACTION:
      required: [caseId, expectedCaseVersion, retractionDraftId, retractionDraftDigest, reviewSnapshotId, previewId, previewDigest, tombstoneReason]
      executor: private.PublishRetraction
      proposer_capability: publication.retract
    RULE_ACTIVATION:
      required: [ruleId, version, expectedRuleVersion, evaluationReceiptId, evaluationDigest, activationScope, effectiveAt]
      executor: activateRuleVersion
      proposer_capability: rules.propose
    ROLE_GRANT:
      required: [userId, roleId, expectedUserVersion, scope, expiresAt, reason]
      executor: grantRole
      proposer_capability: roles.grant
    KILL_SWITCH:
      required: [command, switchTarget, switchEffect, expectedGeneration, reason, expiresAt]
      executor: private.ApplyKillSwitchCommand
      proposer_capability: kill_switch.execute
    COMMUNICATION_AUTHORIZATION:
      required: [subjectId, endpointId, endpointVersion, purpose, topicScope, basis, jurisdiction, policyVersion, decision, proofReceiptId, effectiveAt, expiresAt]
      executor: private.RecordCommunicationAuthorizationDecision
      proposer_capability: communications.authorization.manage
    ASSET_RIGHTS_DECISION:
      required: [assetId, assetSha256, expectedDecisionVersion, decision, dimensions, legalBasis, licenseEvidenceDigests, jurisdiction, attribution, effectiveAt, expiresAt]
      executor: private.ReviseAssetRightsDecision
      proposer_capability: rights.decide
    RETENTION_SCHEDULE:
      required: [recordClass, expectedScheduleRevision, purpose, lawfulBasis, trigger, activeDuration, backupDuration, locations, terminalAction, holdBehavior, restoreSuppressionBehavior, effectiveAt, reviewExpiresAt]
      executor: private.CreateRecordClassScheduleRevision
      proposer_capability: retention.policy.manage
    FUNDING_DISCLOSURE:
      required: [snapshotBatchId, snapshotDigest, priorDisclosureRevision, fiscalYear, amountBand, concentrationBand, purpose, conflictSummary, policyRequestOutcomes, effectiveAt]
      executor: private.PublishFundingDisclosureRevision
      proposer_capability: funding.manage
    CAPABILITY_ACTIVATION:
      required: [capabilityClass, capabilityId, environment, configurationDigest, evidenceReceiptIds, policyDigest, contractDigest, rightsDigest, jurisdiction, effectiveAt, expiresAt]
      executor: private.DecideCapabilityActivation
      proposer_capability: providers.manage
    RESPONSE_POLICY_CALENDAR:
      required: [calendarId, expectedCalendarVersion, timezone, weekendDays, holidayDates, policyDigest, effectiveAt, reviewExpiresAt]
      executor: private.CreateBusinessCalendarVersion
      proposer_capability: responses.policy.manage
    COMMERCIAL_CONTROL:
      required: [triggerId, triggerVersion, triggerDigest, triggerKind, exactMetricResultDigests, dependencyInputSetDigest, evidenceSetDigest, affectedScopeDigest, requestedActions, expectedKillSwitchGeneration, expectedCapabilityVersionSetDigest, expectedContractVersionSetDigest, reason, consequence, existingCustomerContinuityPlanDigest, originalControlReceiptDigest, resumeEvidenceSetDigest, expiresAt, commercialControlBindingDigest]
      executor: private.ApplyCommercialControl
      proposer_capability: commercial.controls.propose
    PROVIDER_CONTROL:
      required: [providerControl]
      executor: private.ExecuteProviderControl
      proposer_capability: selected by providerControl.operationId
      operation_policies:
        disableProviderRouting: {capability: kill_switch.execute, assurance: STEP_UP}
        testProviderConnection: {capability: jobs.operate, assurance: ACTIVE_SESSION}
        upgradeProviderModel: {capability: kill_switch.execute, assurance: STEP_UP}
        setModelAutoUpgrade: {capability: kill_switch.execute, assurance: STEP_UP}

action_digest_contract:
  normative_source: specs/product/addendum-approval-policy.yaml#digest_contracts
  contentDigest: RFC8785_JCS(ActionPayloadV1) with declared ordered arrays and UTF-8 free-text digests
  approvalDigest: GURINE_CANONICAL_JSON_V1(ApprovalBindingV1)
  actionDetailDigest: GURINE_CANONICAL_JSON_V1({actionDetailKind,actionDetail}) and actionDetailKind equals actionKind
  actorActionDigest: GURINE_CANONICAL_JSON_V1(ActionAuthorizationContext) whose businessPayloadSha256 is approvalDigest
  executionDigest: GURINE_CANONICAL_JSON_V1(ExecutionBindingV1)

provider_control_http_side_door:
  operation_ids: [disableProviderRouting, testProviderConnection, upgradeProviderModel, setModelAutoUpgrade]
  logical_role: The existing operation IDs and request schemas are closed provider-control form and ActionPayloadV1 discriminator anchors only; they are not effect entrypoints.
  direct_http:
    status: 409
    error_code: ACTION_PROPOSAL_REQUIRED
    state_effect: UNCHANGED
    transaction: NONE
    writes: []
    outbox_events: []
    external_effects: []
  only_effect_path: PROVIDER_CONTROL ActionProposal -> independent review -> current ExecutionAuthorization -> one jobs.operate provider-control job -> analysis-worker private.ExecuteProviderControl three-phase version fence
  invariants:
    - A direct HTTP invocation never creates a proposal, authorization, job, receipt, audit, outbox event or provider effect.
    - The four request schemas remain byte-compatible with ProviderControlActionV1 branches so the BFF can create a typed proposal without calling the effect endpoint.
    - No browser, BFF or Control API handler may invoke relay or mutate provider state outside the authorized analysis-worker executor path.

operations:
  - operation_id: listActionApprovalQueue
    api: control-api
    method: GET
    path: /v1/internal/action-proposals
    kind: QUERY
    capability: actions.read
    assurance: ACTIVE_SESSION
    request:
      required: []
      optional:
        actionKind: unique-array<action_payloads.kinds>[1..18]
        proposalState: unique-array<DRAFT|PENDING_QUORUM|APPROVED|REJECTED|CHANGES_REQUIRED|EXPIRED|SUPERSEDED|WITHDRAWN>[1..8]
        assignmentState: unique-array<ASSIGNED|IN_PROGRESS|COMPLETED|RECUSED|CANCELLED|VACANT>[1..6]
        dueBefore: datetime
        cursor: cursor
        limit: int32[1..100]=20
        sort: DUE_ASC|UPDATED_DESC=DUE_ASC
    response: ActionApprovalQueuePageV1
    errors: [INVALID_PARAMETER, INVALID_CURSOR, ACTOR_ASSERTION_REQUIRED, ACTOR_ASSERTION_INVALID, CAPABILITY_DENIED, INTERNAL_ERROR]
  - operation_id: createActionProposal
    api: control-api
    method: POST
    path: /v1/internal/action-proposals
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request:
      required: [actionKind, origin, draft, rationale, expiresAt]
      fields:
        actionKind: enum action_payloads.kinds
        origin: ActionOriginV1
        draft: ActionPayloadV1
        rationale: ActionRationaleV1
        expiresAt: datetime
    response: ActionProposalReceiptV1
    transition: NONE->DRAFT
    concurrency: idempotency-key+content-digest
    errors: [INVALID_PARAMETER, ACTION_KIND_MISMATCH, TARGET_NOT_FOUND, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: getActionProposal
    api: control-api
    method: GET
    path: /v1/internal/action-proposals/{proposalId}
    kind: QUERY
    capability: actions.read
    assurance: ACTIVE_SESSION
    request: {required: [proposalId], fields: {proposalId: 'uuid'}}
    response: ActionProposalDetailV1
    errors: [INVALID_PARAMETER, ACTOR_ASSERTION_REQUIRED, CAPABILITY_DENIED, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
  - operation_id: updateActionDraft
    api: control-api
    method: PATCH
    path: /v1/internal/action-proposals/{proposalId}/draft
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request:
      required: [proposalId, expectedVersion, expectedContentDigest, draft, rationale, expiresAt]
      fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256', draft: 'ActionPayloadV1', rationale: 'ActionRationaleV1', expiresAt: 'datetime'}
    response: ActionProposalReceiptV1
    transition: DRAFT(vN)->SUPERSEDED + DRAFT(vN+1)
    errors: [INVALID_PARAMETER, ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_DECISION_CLOSED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: previewActionDraft
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:preview
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request: {required: [proposalId, expectedVersion, expectedContentDigest], fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256'}}
    response: ActionPreviewReceiptV1
    transition: DRAFT->DRAFT
    errors: [ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_POLICY_BLOCKED, CAPABILITY_UNCONFIGURED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: submitActionForReview
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:submit-review
    kind: COMMAND
    capability: actions.propose
    assurance: ACTIVE_SESSION
    request: {required: [proposalId, expectedVersion, expectedContentDigest, previewId, previewDigest], fields: {proposalId: 'uuid', expectedVersion: 'int64>=1', expectedContentDigest: 'sha256', previewId: 'uuid', previewDigest: 'sha256'}}
    response: ActionReviewRequestedReceiptV1
    transition: DRAFT->PENDING_QUORUM
    errors: [ACTION_PROPOSAL_STALE, ACTION_DIGEST_MISMATCH, ACTION_PREVIEW_STALE, ACTION_POLICY_BLOCKED, ACTION_QUORUM_UNAVAILABLE, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: claimActionReview
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:claim-review
    kind: COMMAND
    capability: actions.review
    assurance: ACTIVE_SESSION
    request:
      required: [proposalId, assignmentId, expectedProposalVersion, expectedAssignmentVersion, expectedApprovalDigest]
      fields: {proposalId: 'uuid', assignmentId: 'uuid', expectedProposalVersion: 'int64>=1', expectedAssignmentVersion: 'int64>=1', expectedApprovalDigest: 'sha256'}
    response: ActionReviewClaimedReceiptV1
    transition: ASSIGNED->IN_PROGRESS
    errors: [ACTION_PROPOSAL_STALE, ACTION_ASSIGNMENT_STALE, ACTION_DIGEST_MISMATCH, ACTION_REVIEW_ALREADY_CLAIMED, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: submitActionDecision
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:decide
    kind: COMMAND
    capability: actions.review
    assurance: conditional-by-action-and-decision
    request:
      required: [proposalId, actionKind, assignmentId, expectedProposalVersion, expectedAssignmentVersion, expectedApprovalDigest, decision]
      fields: {proposalId: 'uuid', actionKind: 'enum action_payloads.kinds', providerOperationId: 'optional<ProviderControlOperationIdV1>', assignmentId: 'uuid', expectedProposalVersion: 'int64>=1', expectedAssignmentVersion: 'int64>=1', expectedApprovalDigest: 'sha256', decision: 'ActionDecisionV1'}
      invariants: [providerOperationId is required exactly when actionKind is PROVIDER_CONTROL and equals the immutable ProviderControlApprovalDetailV1 operationId; it is forbidden for every other action kind]
    response: ActionDecisionReceiptV1
    transition: IN_PROGRESS->COMPLETED or ASSIGNED|IN_PROGRESS->RECUSED; quorum may terminalize proposal
    errors: [ACTION_KIND_MISMATCH, ACTION_PROPOSAL_STALE, ACTION_ASSIGNMENT_STALE, ACTION_DIGEST_MISMATCH, ACTION_DECISION_CLOSED, ACTION_CONFLICT_UNRESOLVED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: getActionExecutionReceipt
    api: control-api
    method: GET
    path: /v1/internal/action-executions/{executionId}/receipt
    kind: QUERY
    capability: actions.read
    assurance: ACTIVE_SESSION
    request: {required: [executionId], fields: {executionId: 'uuid'}}
    response: ActionExecutionReceiptChainV1
    errors: [CAPABILITY_DENIED, RESOURCE_NOT_FOUND, EXECUTION_RECEIPT_INCOMPLETE, INTERNAL_ERROR]
  - operation_id: cancelActionExecution
    api: control-api
    method: POST
    path: /v1/internal/action-executions/{executionId}:cancel
    kind: COMMAND
    capability: actions.operate
    assurance: ACTIVE_SESSION
    request:
      required: [executionId, expectedGeneration, expectedStateVersion, reasonCode, reasonNote]
      fields: {executionId: 'uuid', expectedGeneration: 'int64>=1', expectedStateVersion: 'int64>=1', reasonCode: 'USER_REQUEST|POLICY_CHANGE|CONSENT_REVOKED|SUPPRESSION|RIGHTS_REVOKED|INCIDENT|KILL_SWITCH|BUDGET|OTHER', reasonNote: 'string[1..2000]'}
    response: ActionExecutionMutationReceiptV1
    errors: [EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, EXECUTION_ALREADY_TERMINAL, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: retryActionExecution
    api: control-api
    method: POST
    path: /v1/internal/action-executions/{executionId}:retry
    kind: COMMAND
    capability: actions.operate
    assurance: conditional-by-action-kind
    request:
      required: [executionId, actionKind, expectedGeneration, expectedStateVersion, safeRetryProof, reasonCode, reasonNote]
      fields: {executionId: 'uuid', actionKind: 'enum action_payloads.kinds', expectedGeneration: 'int64>=1', expectedStateVersion: 'int64>=1', safeRetryProof: 'SafeRetryProofV1', reasonCode: 'NO_PROVIDER_ATTEMPT|PROVIDER_LOOKUP_NOT_FOUND|PROVIDER_IDEMPOTENT_REPLAY_SAFE', reasonNote: 'string[1..2000]'}
    response: ActionExecutionMutationReceiptV1
    errors: [EXECUTION_FENCE_STALE, EXECUTION_RETRY_UNSAFE, EXECUTION_ATTEMPT_LIMIT, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: releaseLegalHold
    api: control-api
    method: POST
    path: /v1/internal/commands/release-legal-hold
    kind: COMMAND
    capability: review.legal
    assurance: STEP_UP
    request:
      required: [holdId, caseId, reviewSnapshotId, expectedReleaseSequence, expectedCaseVersion, releaseScopeAtoms, affectedIds, releaseAuthorityReference, reasonCode, reason]
      fields: {holdId: 'uuid', caseId: 'uuid', reviewSnapshotId: 'uuid', expectedReleaseSequence: 'int64>=0', expectedCaseVersion: 'int64>=1', releaseScopeAtoms: 'unique-array<RETENTION|DELETION|DISCLOSURE>[1..3]', affectedIds: 'unique-array<uuid>[1..10000]', releaseAuthorityReference: 'string[1..500]', reasonCode: 'AUTHORITY_WITHDRAWN|EXPIRED_REVIEWED|RESOLVED|SUPERSEDED|COURT_ORDER|OTHER', reason: 'string[1..4000]'}
    response: LegalHoldReleaseReceiptV1
    errors: [LEGAL_HOLD_NOT_FOUND, LEGAL_HOLD_RELEASE_STALE, LEGAL_HOLD_SCOPE_INVALID, LEGAL_HOLD_ALREADY_RELEASED, CONFLICT_UNRESOLVED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: createResponseAppeal
    api: submission-api
    method: POST
    path: /v1/response-receipt/appeals
    kind: COMMAND
    authorization: derived-session:APPEAL_CREATE
    assurance: SCOPED_TOKEN
    request:
      required: [expectedReceiptVersion, reasonCode, requestedOutcome, statement, supportingAttachmentIds, attestation, privacyConsent]
      fields: {expectedReceiptVersion: 'int64>=1', reasonCode: 'DELIVERY_DISPUTE|SCOPE_DISPUTE|CONSENT_DISPUTE|PUBLICATION_EXCERPT_DISPUTE|DEADLINE_DISPUTE|OTHER', requestedOutcome: 'REOPEN_RESPONSE|REVIEW_EXCERPT|CORRECT_STATUS|EXTEND_DEADLINE|HUMAN_REVIEW', statement: 'string[1..10000]', supportingAttachmentIds: 'unique-array<uuid>[0..20]', attestation: 'boolean-true', privacyConsent: 'boolean-true'}
    response: ResponseAppealReceiptV1
    errors: [SCOPED_SESSION_REQUIRED, APPEAL_SCOPE_INVALID, APPEAL_WINDOW_CLOSED, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: getResponseAppeal
    api: submission-api
    method: GET
    path: /v1/response-receipt/appeals/{appealId}
    kind: QUERY
    authorization: derived-session:APPEAL_STATUS
    assurance: SCOPED_TOKEN
    request: {required: [appealId], fields: {appealId: 'uuid'}}
    response: ResponseAppealPublicStatusV1
    errors: [SCOPED_SESSION_REQUIRED, RESOURCE_NOT_FOUND, APPEAL_SCOPE_INVALID, INTERNAL_ERROR]
  - operation_id: getCommunicationDeliveryReceipt
    api: control-api
    method: GET
    path: /v1/internal/communication-deliveries/{deliveryId}/receipt
    kind: QUERY
    capability: communications.read
    assurance: ACTIVE_SESSION
    request: {required: [deliveryId], fields: {deliveryId: 'uuid'}}
    response: CommunicationDeliveryReceiptViewV1
    errors: [CAPABILITY_DENIED, RESOURCE_NOT_FOUND, DELIVERY_RECEIPT_INCOMPLETE, INTERNAL_ERROR]
  - operation_id: reconcileCommunicationDelivery
    api: control-api
    method: POST
    path: /v1/internal/communication-deliveries/{deliveryId}:reconcile
    kind: COMMAND
    capability: communications.operate
    assurance: STEP_UP
    request:
      required: [deliveryId, expectedVersion, evidence, resolution, safeRetryProof, reason]
      fields:
        deliveryId: uuid
        expectedVersion: int64>=1
        evidence: CommunicationReconciliationEvidenceV1
        resolution: NOT_TRANSMITTED|PROVIDER_ACCEPTED|DELIVERED|FAILED_PERMANENT
        safeRetryProof: nullable<CommunicationSafeRetryProofV1>
        reason: string[1..4000]
    response: CommunicationDeliveryMutationReceiptV1
    constraints:
      - OPERATOR_EVIDENCE alone cannot assert DELIVERED or READ.
      - NOT_TRANSMITTED requires one closed safeRetryProof that PostgreSQL re-resolves under the delivery lock; every other resolution requires null.
      - NOT_TRANSMITTED proof is required before a retry or alternate endpoint becomes eligible.
    errors: [DELIVERY_VERSION_CONFLICT, DELIVERY_RECONCILIATION_EVIDENCE_INVALID, DELIVERY_STATE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: cancelCommunicationDelivery
    api: control-api
    method: POST
    path: /v1/internal/communication-deliveries/{deliveryId}:cancel
    kind: COMMAND
    capability: communications.operate
    assurance: STEP_UP
    request:
      required: [deliveryId, expectedVersion, reasonCode, reason]
      fields: {deliveryId: 'uuid', expectedVersion: 'int64>=1', reasonCode: 'USER_REQUEST|CONSENT_REVOKED|SUPPRESSION|POLICY_CHANGE|INCIDENT|KILL_SWITCH|OTHER', reason: 'string[1..4000]'}
    response: CommunicationDeliveryMutationReceiptV1
    constraints:
      - Pre-dispatch cancellation may become CANCELLED.
      - Post-dispatch records cancelRequestedAt and remains truthfully nonterminal until provider proof.
    errors: [DELIVERY_VERSION_CONFLICT, DELIVERY_STATE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: getIncident
    api: control-api
    method: GET
    path: /v1/internal/incidents/{incidentId}
    kind: QUERY
    capability: incidents.read
    assurance: ACTIVE_SESSION
    request: {required: [incidentId], fields: {incidentId: 'uuid'}}
    response: IncidentDetailV1
    errors: [CAPABILITY_DENIED, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
  - operation_id: triageIncident
    api: control-api
    method: POST
    path: /v1/internal/incidents/{incidentId}:triage
    kind: COMMAND
    capability: incidents.manage
    assurance: ACTIVE_SESSION
    request:
      required: [incidentId, expectedVersion, severity, affectedCapabilities, ownerUserId, commanderUserId, nextUpdateAt, impact, evidenceRefs, reasonCode, reason]
      fields: {incidentId: 'uuid', expectedVersion: 'int64>=1', severity: 'SEV0|SEV1|SEV2|SEV3', affectedCapabilities: 'unique-array<IncidentCapability>[1..32]', ownerUserId: 'uuid', commanderUserId: 'nullable-uuid', nextUpdateAt: 'datetime', impact: 'string[1..4000]', evidenceRefs: 'unique-array<IncidentEvidenceRefV1>[1..100]', reasonCode: 'string[1..100]', reason: 'string[1..4000]'}
    response: IncidentTransitionReceiptV1
    transition: DETECTED->TRIAGED
    errors: [INCIDENT_VERSION_CONFLICT, INCIDENT_STATE_INVALID, INCIDENT_COMMANDER_REQUIRED, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: containIncident
    api: control-api
    method: POST
    path: /v1/internal/incidents/{incidentId}:contain
    kind: COMMAND
    capability: incidents.manage
    assurance: ACTIVE_SESSION
    request:
      required: [incidentId, expectedVersion, containmentActions, residualImpact, reconciliationPlan, nextUpdateAt, switchReceiptIds, cancellationReceiptIds, evidenceRefs, reasonCode, reason]
      fields: {incidentId: 'uuid', expectedVersion: 'int64>=1', containmentActions: 'array<string[1..1000]>[1..100]', residualImpact: 'string[1..4000]', reconciliationPlan: 'string[1..4000]', nextUpdateAt: 'datetime', switchReceiptIds: 'unique-array<uuid>[0..100]', cancellationReceiptIds: 'unique-array<uuid>[0..100]', evidenceRefs: 'unique-array<IncidentEvidenceRefV1>[1..100]', reasonCode: 'string[1..100]', reason: 'string[1..4000]'}
    response: IncidentTransitionReceiptV1
    transition: TRIAGED->CONTAINED
    errors: [INCIDENT_VERSION_CONFLICT, INCIDENT_STATE_INVALID, INCIDENT_CONTAINMENT_INCOMPLETE, CAPABILITY_DENIED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  - operation_id: startIncidentRecovery
    api: control-api
    method: POST
    path: /v1/internal/incidents/{incidentId}:start-recovery
    kind: COMMAND
    capability: incidents.manage
    assurance: ACTIVE_SESSION
    request:
      required: [incidentId, expectedVersion, recoveryPlan, rollbackPlan, recoveryOwnerUserId, validationEvidenceRefs, evidenceRefs, reasonCode, reason]
      fields: {incidentId: 'uuid', expectedVersion: 'int64>=1', recoveryPlan: 'string[1..10000]', rollbackPlan: 'string[1..10000]', recoveryOwnerUserId: 'uuid', validationEvidenceRefs: 'unique-array<IncidentEvidenceRefV1>[1..100]', evidenceRefs: 'unique-array<IncidentEvidenceRefV1>[1..100]', reasonCode: 'string[1..100]', reason: 'string[1..4000]'}
    response: IncidentTransitionReceiptV1
    transition: CONTAINED->RECOVERING
