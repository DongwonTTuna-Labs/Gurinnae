      required: [reportId]
      fields: {reportId: uuid}
      optional: {format: 'enum<JSON|CSV>=JSON'}
    response: TransparencyReportDownloadV1
    errors: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, PRECONDITION_FAILED, RATE_LIMITED, INTERNAL_ERROR]
  - operation_id: listActionApprovalQueue
