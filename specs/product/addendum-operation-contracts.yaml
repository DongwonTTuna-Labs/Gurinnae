  - operation_id: createPrivacyRequest
    api: submission-api
    method: POST
    path: /v1/privacy-requests
    kind: COMMAND
    authorization: anonymous-proof
    assurance: ANONYMOUS_PROOF
    request:
      required: [requestType, subjectIdentityProof, jurisdiction, scope, contactEndpoint, statement, attestation, privacyConsent, abuseProof]
      fields: {requestType: 'ACCESS|CORRECTION|DELETION|RESTRICTION', subjectIdentityProof: 'PrivacyIdentityProofV1', jurisdiction: 'string[2..64]', scope: 'PrivacyRequestScopeV1', contactEndpoint: 'EndpointEnrollmentV1', statement: 'string[1..10000]', attestation: 'boolean-true', privacyConsent: 'boolean-true', abuseProof: 'AbuseProofV1'}
    response: PrivacyRequestReceiptV1
    constraints:
      - Success always persists request state RECEIVED with identityState PENDING_VERIFICATION and null identityVerifiedAt/dueAt; submitted proof bytes never imply synchronous verification and are never persisted raw.
      - The request body contains the exact closed PrivacyRequestScopeV1 and no caller-authored scopeDigest, scopeSha256, subjectProofHash or subjectScopeDigest field. The PostgreSQL owner canonicalizes the validated scope and derives both digests.
      - 'scopeCanonical = canonical JSON(exact closed PrivacyRequestScopeV1); scopeSha256 = SHA256(scopeCanonical); subjectScopeDigest = SHA256(canonical JSON({schemaVersion: "privacy-subject-scope-v1", subjectProofHash: DB-derived subject proof hash, scopeSha256: DB-derived scopeSha256})). The public scopeDigest field and privacy.request_created.v2 scopeDigest are exactly scopeSha256, never subjectScopeDigest.'
      - Raw scope is validation-only owner input and is forbidden from persistence, audit, outbox, event, receipt, error and observability bytes; only encrypted scope plus the DB-derived scopeSha256 and subjectScopeDigest are durable.
      - Before any write, the owner resolves exactly one current, approved, effective and unexpired versioned privacy access policy with the closed payload keys tokenTtlSeconds, readOnlySessionTtlSeconds, cookieProfileId, cookieName, cookiePath and allowedOperations. There is no seed or fallback value.
      - Missing, duplicate, expired or unapproved privacy access policy maps only to request-id-only DEPENDENCY_UNAVAILABLE 503 with zero writes; CAPABILITY_UNCONFIGURED, INTERNAL_ERROR detail and policy cardinality are never exposed.
    errors: [INVALID_PARAMETER, IDENTITY_PROOF_INVALID, PRIVACY_SCOPE_INVALID, ABUSE_PROOF_INVALID, RATE_LIMITED, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
