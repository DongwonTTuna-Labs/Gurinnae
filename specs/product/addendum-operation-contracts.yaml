private_action_executor_contract:
  transport: PRIVATE_APPLICATION_COMMAND
  authorization: exact current ExecutionAuthorization and generation; approvalDigest and countedDecisionReceiptSetDigest are immutable comparison fields
  request_fields_exact: [executionId, generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256, targetRequest]
  rules:
    - The targetRequest is one closed action-kind-specific schema and its digest equals the authorization target digest.
    - The worker commits dispatch/claim fencing before any egress and appends one definitive or reconciliation-required receipt after observation.
    - Exact replay returns stored bytes and changed bytes fail with zero second effect.

private_application_commands:
  private.RecordOutboundDeliveryObservation:
    transport: PRIVATE_APPLICATION_COMMAND
    caller: notification-worker communication gateway holding the exact committed delivery attempt fence; authenticated callback/poll/reconciliation gateways use the same routine with their closed source variant
    authorization: workload identity plus exact delivery/attempt generation and adapter policy; no browser or caller-selected proof ceiling
    request_schema:
      additional_properties: false
      required: [deliveryId, expectedDeliveryVersion, sourceKind, attemptId, sourceReceiptId, sourceReceiptDigest, observationKeyDigest, evidenceKind, assertedState, providerEvidenceDigest, providerOccurredAt]
      fields: {deliveryId: uuid, expectedDeliveryVersion: 'int64[1..max]', sourceKind: 'enum<PROVIDER_RESPONSE|PROVIDER_CALLBACK|PROVIDER_POLL|RECONCILIATION_DECISION|CANCELLATION|SUPPRESSION>', attemptId: 'nullable<uuid>', sourceReceiptId: 'nullable<uuid>', sourceReceiptDigest: 'nullable<sha256>', observationKeyDigest: sha256, evidenceKind: 'enum<PROVIDER_RESPONSE|SIGNED_PROVIDER_CALLBACK|AUTHENTICATED_PROVIDER_POLL|OFFICIAL_CHANNEL_RECEIPT|RECONCILIATION_PROOF|CANCELLATION_PROOF>', assertedState: 'enum<PROVIDER_ACCEPTED|DELIVERED|READ|FAILED_PERMANENT|RECONCILIATION_REQUIRED|CANCELLED|SUPPRESSED>', providerEvidenceDigest: sha256, providerOccurredAt: 'nullable<datetime>'}
      invariants: [PROVIDER_RESPONSE requires attemptId and forbids sourceReceiptId/sourceReceiptDigest, PROVIDER_CALLBACK|PROVIDER_POLL|RECONCILIATION_DECISION require an exact immutable sourceReceiptId/sourceReceiptDigest and forbid attemptId, cancellation/suppression forbid both source pointers, synchronous PROVIDER_RESPONSE assertedState is at most PROVIDER_ACCEPTED, observedAt is forbidden input and the database derives observed_at from transaction time or the immutable callback/poll/reconciliation receipt time, raw response/signature/provider identifier is absent]
    response_schema: OutboundDeliveryObservationReceiptV1
    errors: [RESOURCE_NOT_FOUND, DELIVERY_VERSION_CONFLICT, DELIVERY_OBSERVATION_INVALID, DELIVERY_OBSERVATION_CONFLICT, DELIVERY_RECONCILIATION_REQUIRED, INTERNAL_ERROR]
