    constraints:
      - No prior scoped session is accepted or required; only the request-bound BFF service assertion, one-time body token and required BFF-generated X-Gurine-Next-Submission-Session header authorize exchange.
      - The service assertion and request digest bind the exact next-session header; PostgreSQL stores only its lowercase SHA-256.
      - Neither one-time token nor next-session token appears in URL, response body, receipt, event, audit, log, trace, metric, analytics, DOM or browser storage.
      - Success returns cookieName=gurine_privacy_request_receipt_session; only then may the public-web BFF seal its retained raw next-session token into the host-only HttpOnly SameSite=Lax /privacy cookie.
      - Before any write, the owner resolves exactly one current, approved, effective and unexpired versioned privacy access policy and derives the session TTL, cookie profile and sole allowed read operation from its closed payload; no seed or fallback is permitted.
      - Missing, duplicate, expired or unapproved privacy access policy maps only to request-id-only DEPENDENCY_UNAVAILABLE 503 with zero token consumption or session/idempotency/audit/outbox writes; CAPABILITY_UNCONFIGURED, INTERNAL_ERROR detail and policy cardinality are never exposed.
