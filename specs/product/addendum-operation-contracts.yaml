    method: POST
    path: /v1/internal/communication-deliveries/{deliveryId}:reconcile
    kind: COMMAND
    capability: communications.operate
    assurance: STEP_UP
    request:
      required: [deliveryId, expectedVersion, evidence, resolution, safeRetryProof, reason]
      fields:
        deliveryId: uuid
        expectedVersion: int64>=1
        evidence: CommunicationReconciliationEvidenceV1
        resolution: NOT_TRANSMITTED|PROVIDER_ACCEPTED|DELIVERED|FAILED_PERMANENT
        safeRetryProof: nullable<CommunicationSafeRetryProofV1>
        reason: string[1..4000]
    response: CommunicationDeliveryMutationReceiptV1
    constraints:
      - OPERATOR_EVIDENCE alone cannot assert DELIVERED or READ.
      - NOT_TRANSMITTED requires one closed safeRetryProof that PostgreSQL re-resolves under the delivery lock; every other resolution requires null.
      - NOT_TRANSMITTED proof is required before a retry or alternate endpoint becomes eligible.
    errors: [DELIVERY_VERSION_CONFLICT, DELIVERY_RECONCILIATION_EVIDENCE_INVALID, DELIVERY_STATE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
