    response: PromoteResearchArtifactReceiptV1
    transition: immutable research-only artifact -> one revision-fixed Evidence graph; the artifact itself remains research-only
    concurrency: Idempotency-Key header plus canonical request digest and expected case version under SERIALIZABLE locks
    constraints:
      - Idempotency-Key is a request-bound HTTP header and is forbidden from the body.
      - The exact run/turn/tool/fetch/artifact tuple, CLEAN STORED bytes, current GRANT rights, pinned parser extraction, ordered nonoverlapping locators and selected-content digests are reverified before any write.
      - One source-document revision, one or more evidence segments, one pending Evidence revision, one HUMAN_PROMOTION source use, promotion receipt, audit and event commit atomically.
    errors: [INVALID_REQUEST, ACTOR_ASSERTION_INVALID, CAPABILITY_DENIED, RESOURCE_NOT_FOUND, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, ARTIFACT_NOT_CLEAN, RIGHTS_DENIED, LOCATOR_MISMATCH, CONTENT_HASH_MISMATCH, VALIDATION_FAILED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
