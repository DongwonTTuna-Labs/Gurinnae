derived_session_authorization_overlay:
  normative_source: specs/submission/addendum-derived-session-boundary.yaml#operation_authorization_overlay
  parent_non_widening: RESPONSE_RECEIPT remains authorized only for getResponseReceipt; it cannot call createResponseAppeal or getResponseAppeal
  operations:
    createResponseAppeal:
      required_session_kind: APPEAL_CREATE
      scope_type: RESPONSE_SUBMISSION
      successful_transition: APPEAL_CREATE ACTIVE->CONSUMED and APPEAL_STATUS NONE->ACTIVE in gurine.command.createResponseAppeal.v1
      replay_order: finalized exact session+issuer+operation+idempotency-key+request-digest response is returned before ACTIVE validation
    getResponseAppeal:
      required_session_kind: APPEAL_STATUS
      scope_type: APPEAL
      rotation: read-only; re-entry uses the private broker and revokes the prior APPEAL_STATUS only when the same appeal composite is proven
    requestCommunicationEndpointLink:
      required_session_kind: COMMUNICATION_PROFILE
      scope_type: COMMUNICATION_SUBJECT
      successful_rotation: revoke the current child and issue one same-subject/same-origin COMMUNICATION_PROFILE child atomically
    verifyCommunicationEndpointLink:
      required_session_kind: COMMUNICATION_PROFILE
      scope_type: COMMUNICATION_SUBJECT
      successful_rotation: consume the exact challenge, revoke the current child and issue one same-subject/same-origin COMMUNICATION_PROFILE child atomically
    unlinkCommunicationEndpoint:
      required_session_kind: COMMUNICATION_PROFILE
      scope_type: COMMUNICATION_SUBJECT
      successful_rotation: revoke endpoint authorization rows, revoke the current child and issue one same-subject/same-origin COMMUNICATION_PROFILE child atomically
  next_token: X-Gurine-Next-Submission-Session is BFF-generated, request-assertion-bound and persisted only as lowercase SHA-256; it is forbidden from request/response bodies, receipts, events, audit, logs and telemetry

