      - ACCESS and CORRECTION workspaces for the sole authorized RESPONSE `/partyName` cell include one closed PrivacyResponsePartyNameAccessProjectionV1 produced from the same response-receipt, submission, immutable origin-receipt and editorial-response chain. Its currentValueDigest is SHA-256 of the UTF-8 partyName and its projectionDigest covers the exact redacted authority preimage.
