    api: submission-api
    method: POST
    path: /v1/submission-session/privacy-request-receipt:exchange
    kind: COMMAND
    authorization: request-bound-bff-service-assertion+one-time-receipt-token
    assurance: ONE_TIME_PROOF
    request:
      required: [token]
      fields: {token: 'secret-string[32..4096]'}
