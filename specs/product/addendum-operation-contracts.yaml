      exact_internal_fields: [_actorAssertionJti, _actorAssuranceLevel, _actorEffectiveCapability, _actorActionDigest, _actorStepUpAuthorizationId, _actorIdempotencyKeySha256, _actorRequestKeySha256]
      rule: control-api validates and merges these seven request-bound actor values into the seven-field public body immediately before calling editorial.verify_response_organization_identity_v1; they are forbidden in OpenAPI and caller input
    response: VerifyResponseOrganizationIdentityReceiptV1
    transition: UNVERIFIED->SECOND_FACTOR_VERIFIED
    constraints:
      - officialChannelSourceId resolves exactly one active, unexpired and unrevoked immutable official-channel authority assertion; a missing or empty registry, absent assertion or failed currentness check writes nothing and has no raw-proof fallback.
      - OFFICIAL_DOMAIN_EMAIL requires that assertion to bind the exact organization to an EMAIL domain-control receipt and requires the owner to revalidate the exact underlying endpoint, domain-control receipt and response-request binding as current in the transaction.
      - OFFICIAL_DOCUMENT requires that assertion to bind the exact organization to a DOCUMENT official-representation binding receipt and requires the owner to revalidate the exact underlying document, representation binding and source locator as current in the transaction.
      - OTP alone never establishes official-channel authority and cannot satisfy either verification method.
      - Raw email, domain, document, proof and reason bytes are absent from events and receipts.
    errors: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, VERSION_CONFLICT, PRECONDITION_FAILED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
