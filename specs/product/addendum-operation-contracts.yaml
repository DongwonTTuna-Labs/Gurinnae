  - operation_id: decideJourneyHandoff
    api: control-api
    method: POST
    path: /v1/internal/journey-handoffs/{handoffId}:decide
    kind: COMMAND
    capability: journeys.handoff.decide
    assurance: conditional-by-persisted-handoff-binding-with-minimum-ACTIVE_SESSION
    entry_boundaries:
      external_actor_http: {transport: CONTROL_COMMAND, session_user: gurine_control_api, assertion_type: ACTOR, credential: X-Gurine-Actor-Assertion, service_credential: FORBIDDEN}
      internal_service_workflow: {transport: JOURNEY_WORKFLOW_DB_COMMAND, session_user: gurine_workflow_worker, assertion_type: SERVICE, credential: closed in-process workload envelope serviceAssertion, actor_or_http_credential: FORBIDDEN}
      mutual_exclusion: session_user and assertion type select exactly one boundary; the public control HTTP route is ACTOR-only and the workflow service path has no HTTP endpoint
      shared_semantics: exact request schema, stable seven-field business hash, prepare/apply/finalize transaction, durable receipt and error-to-zero-write rules are identical
    request:
      required: [schemaVersion, handoffId, expectedHandoffVersion, expectedBindingDigest, decision, reasonCode, reason]
      fields:
        schemaVersion: const<decide-journey-handoff.request.v1>
        handoffId: uuid
        expectedHandoffVersion: int64>=1
        expectedBindingDigest: sha256
        decision: enum<ACKNOWLEDGE|DECLINE>
        reasonCode: nullable<enum<CAPABILITY_UNAVAILABLE|OBJECT_SCOPE_MISMATCH|CONFLICT_OF_INTEREST|WORKLOAD_CAPACITY|DEPENDENCY_BLOCKED|SUBJECT_INVALID|OWNER_UNAVAILABLE|POLICY_BLOCKED|RECEIVER_DECLINED>>
        reason: nullable<string[1..4000]>
      forbidden: [journeyId, edgeId, handoffKind, receiver, receiverFunction, receiverCapability, destination, owner, domainAdapter]
    decision_reason_shape:
      discriminator: decision
      closed_decline_reason_codes: [CAPABILITY_UNAVAILABLE, OBJECT_SCOPE_MISMATCH, CONFLICT_OF_INTEREST, WORKLOAD_CAPACITY, DEPENDENCY_BLOCKED, SUBJECT_INVALID, OWNER_UNAVAILABLE, POLICY_BLOCKED, RECEIVER_DECLINED]
      branches:
        ACKNOWLEDGE: {reasonCode: MUST_BE_NULL, reason: MUST_BE_NULL, reasonDigest: MUST_BE_NULL, reasonEncrypted: MUST_BE_NULL}
        DECLINE: {reasonCode: REQUIRED_CLOSED_DECLINE_REASON_CODE, reason: REQUIRED_VALID_UNICODE_NUL_FREE_NFC_NON_WHITESPACE_1_TO_4000, reasonDigest: REQUIRED_SHA256_OF_EXACT_NFC_UTF8_BYTES, reasonEncrypted: REQUIRED_NEW_CLAIM_ONLY_RANDOMIZED_CIPHERTEXT}
      transport_visibility: {reasonCode: REQUEST, reason: REQUEST, reasonDigest: SERVER_DERIVED, reasonEncrypted: SERVER_DERIVED_NEVER_RETURNED}
    response: JourneyHandoffDecisionReceiptV1
    transition: PENDING_ACK->ACKNOWLEDGED|DECLINED is the terminal old-handoff step; a compiled DECLINE replacement atomically follows with generation+1 NONE->PENDING_ACK and the final parent state WAITING_ACK
    compound_branches: [decline_with_replacement, expiry_with_replacement, supersession_with_replacement, terminal_outcome_with_cancellation]
    success_contract: {decision_receipt: required-old-terminal-step, replacement: nullable-complete-generation-plus-one-request, final_parent: required-authoritative-post-command-head}
    concurrency: expected handoff version plus binding digest under SERIALIZABLE locks and one logical request-bound idempotency key; ACTOR derives its digest from the HTTP Idempotency-Key header and SERVICE supplies the already-derived idempotencyKeySha256 in the authenticated workload envelope
    transaction_identity_contract:
      authorization_attempt: Transaction A persists non-null equal ops.assertion_replay_guard.attempt_transaction_xid8 and generated ops.audit_events.attempt_transaction_xid8 from server-side pg_current_xact_id(); Transaction B sees both immutable rows and requires that xid8 to differ from its pg_current_xact_id()
      business_claim: a BOUND_V1 NEW ops.idempotency_keys row persists server-only claim_transaction_xid8=pg_current_xact_id(); apply and finalize require equality in the same top-level Transaction B, including SAVEPOINT and nested SAVEPOINT execution
      legacy: all three legacy xid8 values remain NULL and cannot be backfilled into proof
      forbidden: [xmin authorization proof, hard pg_xact_status committed predicate, caller-supplied xid, migration backfill]
      diagnostic: pg_xact_status committed corroborates; NULL is allowed after history truncation; in-progress or aborted is an integrity fault
    idempotency_relation_access:
      prepare: owner claim exactly once and owner replay exactly once iff FINAL_AVAILABLE; zero direct ops.idempotency_keys statements
      apply: exactly one schema-qualified direct SELECT INTO STRICT of the complete prepared-NEW tuple; zero DML, helper or owner calls
      finalize: exactly one pre-finalize SELECT INTO STRICT FOR UPDATE, exactly one owner-finalize call, zero replay-owner calls, then exactly one direct persisted-tuple readback comparing all response bytes, metadata, resource, receipt, audit, outbox and completion fields
    constraints:
      - The server resolves journey, edge, receiver, capability, destination, SLA and domain adapter only from the persisted binding and compiled registry; caller routing fields are forbidden.
      - ACKNOWLEDGE always requires reasonCode and reason to be null; any receiver attestation is proven by the persisted acknowledgement-authority receipt and is never smuggled through free text. DECLINE requires both a closed reasonCode and bounded reason.
      - Exact receiver identity, required capability, object scope, expiry and any stored stricter assurance are revalidated immediately before mutation.
      - The service canonicalizes and encrypts a DECLINE reason, passes only encrypted bytes plus its digest to SQL, and never persists or logs plaintext reason at the database boundary.
      - Every retry verifies and consumes a fresh request-bound actor or service assertion JTI and records one immutable authorization attempt before the business transaction. Request ID, assertion JTI/token bytes, randomized ciphertext and plaintext reason do not enter the stable business idempotency hash.
      - ACTOR enters only through the control-api HTTP binding. SERVICE enters only through the gurine_workflow_worker in-process PostgreSQL command envelope bound to the exact regprocedure chain; neither path accepts the other's credential or transport.
      - A finalized replay with the same Idempotency-Key and stable business fields returns the original stored bytes after the fresh assertion attempt; only a NEW business claim encrypts or mutates, and only a changed operation, handoff subject/version/binding, decision, reasonCode or reasonDigest conflicts.
      - Transaction A proof uses ordinary MVCC visibility plus equal non-null persisted attempt_transaction_xid8 values that differ from Transaction B; tuple xmin is never authority and pg_xact_status NULL is not a hard failure.
      - Transaction B apply/finalize use the server-persisted claim_transaction_xid8 top-level transaction proof and the exact relation-access registry. Finalize verifies persisted header/body bytes and the entire terminal tuple by direct post-owner readback without replay-owner or JSON reserialization.
      - Success returns the durable old terminal decision receipt, a nullable complete replacement handoff/request receipt and the authoritative final parent head. Missing referenced receipts or a head mismatch makes success impossible.
      - The decision event records the old terminal step even when a second journey.handoff_requested.v1 event records the replacement; HTTP success, task projection or notification is never a handoff outcome.
    errors: [INVALID_PARAMETER, ACTOR_ASSERTION_INVALID, ACTOR_ASSERTION_REPLAYED, SERVICE_ASSERTION_INVALID, SERVICE_ASSERTION_REPLAYED, RESOURCE_NOT_FOUND, CAPABILITY_DENIED, HANDOFF_RECEIVER_MISMATCH, HANDOFF_STATE_INVALID, HANDOFF_BINDING_MISMATCH, VERSION_CONFLICT, HANDOFF_EXPIRED, JOURNEY_TERMINAL, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
