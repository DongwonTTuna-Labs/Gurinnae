    path: /v1/internal/commands/promote-research-artifact-to-evidence
    kind: COMMAND
    capability: cases.evidence.manage
    assurance: ACTIVE_SESSION
    request:
      required: [schemaVersion, caseId, expectedCaseVersion, agentRunId, researchArtifact, rightsDecision, evidence, selectedSegments, reason]
