    authorization: gurine_billing_gateway plus one claimed RUNNING DONATION_CHARGE job on queue billing-gateway whose current job ID, worker ID, nonexpired lease token, positive fencing token and canonical payload digest are execution context outside the request payload
    request_schema:
      additional_properties: false
      required: [schemaVersion, donationScheduleId, donationScheduleVersion, donationScheduleDigest, paymentMethodBindingId, paymentMethodBindingDigest, offerVersionId, offerDigest, tierId, consentReceiptDigest, logicalChargeId, chargeIdempotencyKeySha256, scheduledFor]
      fields: {schemaVersion: 'const<donation-charge-job.v1>', donationScheduleId: uuid, donationScheduleVersion: 'int64[1..max]', donationScheduleDigest: sha256, paymentMethodBindingId: uuid, paymentMethodBindingDigest: sha256, offerVersionId: uuid, offerDigest: sha256, tierId: uuid, consentReceiptDigest: sha256, logicalChargeId: uuid, chargeIdempotencyKeySha256: sha256, scheduledFor: datetime}
      invariants:
        - The payload has exactly thirteen fields; jobId, workerId, leaseToken, fencingToken and jobPayloadDigest are claimed-job context and are forbidden payload fields.
        - chargeIdempotencyKeySha256 is recomputed from the exact logicalChargeId, paymentMethodBindingDigest and canonical scheduledFor binding before claim.
        - Billing keys, provider authorization material, merchant order identifiers, raw provider bytes and replayable credentials are absent from the payload, result, errors, logs and audit.
    lifecycle_contract:
      core_target_relations: [ops.payment_method_bindings, ops.payment_charge_attempts, ops.donation_facts]
      auxiliary_relations: [ops.tasks, ops.audit_events, ops.outbox]
      success_binding_transitions:
        SINGLE_CHARGE: {from: ACTIVE, to: REVOKED, terminal_disposition: CONSUMED}
        RECURRING: {from: ACTIVE, to: ACTIVE, terminal_disposition: RETAINED}
      success_atomicity: the definitive SUCCEEDED charge attempt, donation fact and credential-use-policy-selected binding transition commit in one payment-owner transaction; only SINGLE_CHARGE appends the ACTIVE to REVOKED consumption transition
      recurring_scheduler_owner: ops.enqueue_due_r6e_donation_charge_jobs_v1
      recurring_schedule_policy: payment_test_v1_operation_contract.recurring_schedule_policy_b
      review_assignee_source: exact request-bound reviewAssigneeUserId persisted by the TEST_ONLY donation intent and reloaded for a later authoritative payment failure; it is never synthesized by the scheduler or failure handler
      local_reject_terminal_owner: ops.fail_r6e_donation_charge_v1
      failure_outcomes:
        LOCAL_REJECT: {attempt_transition: REQUESTED_TO_FAILED, review_tasks: ZERO, donation_facts: ZERO, binding_consumptions: ZERO}
        FETCHED_FAILED: {attempt_transition: PROVIDER_ACCEPTED_TO_FAILED, review_tasks: EXACTLY_ONE, donation_facts: ZERO, binding_consumptions: ZERO}
        FETCHED_CANCELED: {attempt_transition: PROVIDER_ACCEPTED_TO_FAILED, review_tasks: EXACTLY_ONE, donation_facts: ZERO, binding_consumptions: ZERO}
      non_success_rule: replay, reconciliation and every failure append no second binding consumption and authorize no automatic resubmission, new logical charge or new idempotency identity
      authority_effects: entitlement, access, investigation-priority, publication-priority and public-readiness effects are always zero
    response_schema: DonationChargeExecutionResultV1
    errors: [INVALID_REQUEST, IDEMPOTENCY_CONFLICT, PAYMENT_RUNTIME_UNAVAILABLE, RECONCILIATION_REQUIRED, INTERNAL_ERROR]
  private.DecideCapabilityActivation: {transport: PRIVATE_APPLICATION_COMMAND, caller: action-execution-worker.capability-activation-executor, authorization: private_action_executor_contract, action_kind: CAPABILITY_ACTIVATION, request_schema: {additional_properties: false, required: [executionId, generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256, targetRequest], targetRequest: CapabilityActivationActionTargetV1}, response_schema: CapabilityActivationDecisionReceiptV1, errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, CAPABILITY_UNCONFIGURED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]}
  private.CreateBusinessCalendarVersion: {transport: PRIVATE_APPLICATION_COMMAND, caller: action-execution-worker.business-calendar-executor, authorization: private_action_executor_contract, action_kind: RESPONSE_POLICY_CALENDAR, request_schema: {additional_properties: false, required: [executionId, generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256, targetRequest], targetRequest: BusinessCalendarActionTargetV1}, response_schema: BusinessCalendarVersionReceiptV1, errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, VALIDATION_FAILED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]}
  private.ApplyCommercialControl: {transport: PRIVATE_APPLICATION_COMMAND, caller: action-execution-worker.commercial-control-executor, authorization: private_action_executor_contract, action_kind: COMMERCIAL_CONTROL, request_schema: {additional_properties: false, required: [executionId, generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256, targetRequest], targetRequest: CommercialControlActionTargetV1}, response_schema: CommercialControlExecutionReceiptV1, errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, COMMERCIAL_CONTROL_TRIGGER_STALE, COMMERCIAL_CONTROL_RECEIPT_INVALID, RECONCILIATION_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]}
  private.ExecuteProviderControl: {transport: PRIVATE_APPLICATION_COMMAND, caller: analysis-worker.provider-control-executor, authorization: private_action_executor_contract plus exact providerOperationId capability and assurance policy, action_kind: PROVIDER_CONTROL, request_schema: {additional_properties: false, required: [executionId, generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256, targetRequest], targetRequest: ProviderControlActionTargetV1}, response_schema: ProviderControlExecutionReceiptV1, errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, CAPABILITY_DENIED, STEP_UP_REQUIRED, VALIDATION_FAILED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]}
  private.MaterializePaidEvidencePacket: {transport: PRIVATE_APPLICATION_COMMAND, caller: workflow-worker.paid-evidence-packet-materializer, authorization: claimed allowlisted source event plus exact organization qualification contract outcome subject and member candidate digests, request_schema: {additional_properties: false, required: [sourceEventId, packetId, organizationId, qualificationEpisodeId, qualificationEpisodeVersion, qualificationEpisodeDigest, commercialContractId, commercialContractVersion, commercialContractDigest, subject, orderedMembers, expectedPacketSubjectDigest], targetRequest: MaterializePaidEvidencePacketRequestV1}, response_schema: PaidEvidencePacketMaterializationReceiptV1, errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PAID_EVIDENCE_SUBJECT_INVALID, PAID_EVIDENCE_MEMBER_SET_INVALID, EVENT_REPLAY_CONFLICT, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]}
  ops.execute_due_r6d_entity_retention_job_v1:
    transport: PRIVATE_APPLICATION_COMMAND
    caller: workflow-worker.entity-retention-executor
    authorization: gurine_workflow_worker database role plus one claimed RUNNING R6D_ENTITY_RETENTION job on queue workflow-worker whose current nonexpired lease token and positive fencing token are passed only as owner-call context
    request_schema:
      additional_properties: false
      required: [schemaVersion, entityKind, entityId, personhoodReceiptId, personhoodReceiptDigest, closureReceiptId, closureReceiptDigest, closureAt, scheduleId, scheduleRevision, scheduleDigest, dueAt, requestDigest, idempotencyDigest, queuedAt]
      fields: {schemaVersion: 'const<r6d-entity-retention-job.v1>', entityKind: 'enum<AGENCY|SUPPLIER>', entityId: uuid, personhoodReceiptId: uuid, personhoodReceiptDigest: sha256, closureReceiptId: uuid, closureReceiptDigest: sha256, closureAt: datetime, scheduleId: uuid, scheduleRevision: 'int64[1..max]', scheduleDigest: sha256, dueAt: datetime, requestDigest: sha256, idempotencyDigest: sha256, queuedAt: datetime}
      invariants:
        - The payload has exactly these fifteen fields; jobId, leaseToken and fencingToken are claimed-job context and are forbidden payload fields.
        - closureAt is not after dueAt and dueAt is not after queuedAt.
        - PostgreSQL recomputes requestDigest, idempotencyDigest and every current receipt, schedule, material-use and legal-hold binding before erasing plaintext.
    response_schema: R6dEntityRetentionExecutionResultV1
    errors: [INVALID_R6D_ENTITY_RETENTION_JOB, INVALID_R6D_ENTITY_RETENTION_RESULT, R6D_ENTITY_RETENTION_BINDING_MISMATCH, R6D_ENTITY_RETENTION_OWNER_REJECTED, R6D_ENTITY_RETENTION_OWNER_CONFLICT, R6D_ENTITY_RETENTION_OWNER_NOT_READY, R6D_ENTITY_RETENTION_OWNER_UNAVAILABLE]
  ops.execute_privacy_response_party_name_correction_job_v1:
    transport: PRIVATE_APPLICATION_COMMAND
    caller: workflow-worker.response-party-name-correction-executor
    authorization: gurine_workflow_worker database role plus one claimed RUNNING PRIVACY_RESPONSE_PARTY_NAME_CORRECTION job on queue workflow-worker whose current nonexpired lease token and positive fencing token are passed only as owner-call context
    request_schema:
      additional_properties: false
      required: [schemaVersion, privacyRequestId, requestDecisionVersion, correctionPlanId, planVersion, planDigest, responseId, expectedResponseVersion, expectedCurrentValueDigest, accessProjectionDigest, privacyIdentityProofReceiptId, privacyIdentityProofReceiptDigest, responseSubmissionReceiptId, responseSubmissionReceiptDigest, responseOriginReceiptId, responseOriginReceiptDigest, approvalTransitionReceiptId, approvalTransitionReceiptDigest, requestedValueSha256, requestedValueAadDigest, requestedValueCiphertextDigest, encryptionKeyId, holdCoverageDigest, queuedAt]
      fields: {schemaVersion: 'const<privacy-response-party-name-correction-job.v1>', privacyRequestId: uuid, requestDecisionVersion: 'int64[1..max]', correctionPlanId: uuid, planVersion: 'int64[1..max]', planDigest: sha256, responseId: uuid, expectedResponseVersion: 'int64[1..max]', expectedCurrentValueDigest: sha256, accessProjectionDigest: sha256, privacyIdentityProofReceiptId: uuid, privacyIdentityProofReceiptDigest: sha256, responseSubmissionReceiptId: uuid, responseSubmissionReceiptDigest: sha256, responseOriginReceiptId: uuid, responseOriginReceiptDigest: sha256, approvalTransitionReceiptId: uuid, approvalTransitionReceiptDigest: sha256, requestedValueSha256: sha256, requestedValueAadDigest: sha256, requestedValueCiphertextDigest: sha256, encryptionKeyId: 'string[1..200]', holdCoverageDigest: sha256, queuedAt: datetime}
      invariants:
        - The payload has exactly these twenty-four fields; jobId, leaseToken and fencingToken are claimed-job context and partyName, requestedValue and ciphertext are forbidden payload fields.
        - PostgreSQL re-derives and exact-compares every plan, approval, response, ACCESS projection, receipt-chain, legal-hold and job-payload binding before the loader releases the sealed ciphertext envelope.
        - Plaintext exists only in zeroized worker memory between authenticated envelope decryption and the five-argument database apply call and is forbidden from every result, event, audit, log, trace, metric and error.
    response_schema: PrivacyResponsePartyNameCorrectionCompletionV1
    errors: [INVALID_PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_JOB, INVALID_PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_LOAD, INVALID_PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_COMPLETION, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_BINDING_MISMATCH, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_DECRYPTION_FAILED, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_OWNER_REJECTED, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_UNSUPPORTED, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_CONFLICT, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_NOT_READY, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_BLOCKED, PRIVACY_RESPONSE_PARTY_NAME_CORRECTION_OWNER_UNAVAILABLE]

base_operation_atomic_extensions:
  resolveCorrectionRequest:
    branch: resolution=RESOLVED
    atomic_transition_group: gurine.command.resolveCorrectionRequest.publish.v1
    effect_owner: control-api.resolveCorrectionRequest
    required_request_overlay: [publicationPreviewId, publicationPreviewDigest, publicationGatePreviewDigest, expectedPublicationRevision, replacementContentDigest]
    success: correction REVIEW->PUBLISHED and publication current state->CORRECTED with one immutable revision, one gate decision, audit, exactly one each of correction.resolved.v1, notification.correction_resolved.v1, publication.revision_created.v1 and projection.publication_revision_created.v1, and one stored receipt
  placeTemporaryRestriction:
    atomic_transition_group: gurine.command.placeTemporaryRestriction.v1
    effect_owner: control-api.placeTemporaryRestriction
    required_request_overlay: [expectedPublicationRevision, expectedPublicationDigest, causeKind, causeDecisionId, causeDecisionDigest, preservedPriorPublicState, expiresAt]
    success: append one restriction/access overlay and projection work item without mutating prior publication bytes
  publishCase:
    branch: source state TEMPORARILY_RESTRICTED and intent RESTORE_ACCESS
    atomic_transition_group: gurine.command.publishCase.restore.v1
    effect_owner: control-api.publishCase
    required_request_overlay: [restrictionDecisionId, restrictionDecisionDigest, causeReleaseReceiptId, causeReleaseReceiptDigest, expectedPriorPublicState]
    success: full fresh gate PASS plus one new immutable revision restores exactly the preserved prior public state; a normal publish branch cannot bypass the cause-release proof
  placeLegalHold:
    atomic_transition_group: gurine.command.placeLegalHold.v2
    effect_owner: control-api.placeLegalHold
    request_replacement: case-shaped object fields are replaced by closed LegalHoldTargetBindingV1 plus scopeAtoms, affectedIds, authorityReference, reasonCode, reason and public-optional nullable expiresAt
    supported_target_extension:
      CORRECTION: targetId is correctionSnapshotId and the full tuple binds ops.privacy_correction_snapshots_v1(snapshot_id,correction_id,snapshot_version,snapshot_digest); correctionId remains an explicit object binding
      SUBSCRIPTION: targetId is subscriptionSnapshotId and the full tuple binds ops.privacy_subscription_snapshots_v1(snapshot_id,subscription_id,snapshot_version,snapshot_digest); subscriptionId remains an explicit object binding
      COMMUNICATION_ENDPOINT: targetId equals communicationEndpointId and targetVersion plus targetDigest bind the existing intake.communication_endpoints version and endpoint_digest without an endpoint-snapshot substitute
    unsupported_target:
      targetKind: AUDIT_SUBJECT_RECORD
      error: LEGAL_HOLD_TARGET_UNSUPPORTED
      status: 422
      reason: no authoritative source relation exists, so no version fence, canonical digest, owner lock or foreign-key anchor can be validated
      unlock_condition: authorize a versioned immutable audit-subject source relation, canonical digest preimage, owner lock and exact legal-hold anchor foreign key
    internal_normalization: omitted expiresAt means no expiry and is canonicalized to an explicit JSON null before the idempotency request digest and exact owner payload are derived
    success: exact concrete target lock, derived/reused immutable target anchor, one hold placement, audit, legal_hold.placed.v2 and stored receipt; case-only version mutation occurs only for case-governed target variants
    effective_event: legal_hold.placed.v2
    legacy_event: legal_hold.placed.v1 remains historical schema evidence and is forbidden for new runtime admission
  approveResponseExcerpt:
    atomic_transition_group: gurine.command.approveResponseExcerpt.v2
    effect_owner: control-api.approveResponseExcerpt
    required_request_overlay: [publicationForm]
    success: ANONYMOUS requires matching anonymous consent and consumes no organization identity receipt; FULL or REDACTED locks and consumes the exact active SECOND_FACTOR_VERIFIED official-channel identity receipt bound to response, version, content, consent, organization and form before one immutable approval receipt, response update, audit and outbox event commit
    effective_event: response.excerpt_approved.v2
    legacy_event: response.excerpt_approved.v1 remains historical schema evidence and is forbidden for new runtime admission
