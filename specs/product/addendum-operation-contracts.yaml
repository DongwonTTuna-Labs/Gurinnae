private_billing_gateway_operations:
  private.GetDonationFixtureOffer:
    operation_kind: QUERY
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: {method: GET, path: /internal/v1/donation-offers}
    caller: public-web SvelteKit server load
    effect_owner: billing-gateway
    authorization: request-bound service assertion with issuer public-web and audience billing-gateway, durable JTI replay rejection, and exact method/path/request digest
    required_headers: {X-Gurine-Service-Assertion: request-bound-service-assertion}
    request_schema: GetDonationFixtureOfferRequestV1
    response_schema: DonationFixtureOfferV1
    availability:
      TEST_ONLY: {status: 200, authority: TEST_FIXTURE_ONLY_NO_PRODUCTION_AUTHORITY}
      PRODUCTION: {status: 503, state: DISABLED, effect: NONE}
    errors: [SERVICE_ASSERTION_INVALID, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
  private.QueueDonationIntent:
    operation_kind: COMMAND
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: {method: POST, path: /internal/v1/donation-intents, success_status: 202}
    caller: public-web SvelteKit server action
    effect_owner: billing-gateway
    authorization: request-bound service assertion with issuer public-web and audience billing-gateway, durable JTI replay rejection, exact method/path/request digest, and required Idempotency-Key
    required_headers: {Idempotency-Key: 'secret-string[8..200]', X-Gurine-Service-Assertion: request-bound-service-assertion}
    request_schema: DonationIntentQueueRequestV1
    required_request_overlay: [reviewAssigneeUserId]
    response_schema: DonationIntentQueuedReceiptV1
    authority_boundary:
      authority: TEST_FIXTURE_ONLY_NO_PRODUCTION_AUTHORITY
      test: offerVersionId, offerDigest and tierId resolve against the exact in-memory TEST_ONLY fixture registry
      production: UNAVAILABLE; no donation intent or provider handoff is created
    consent_receipt_digest: billing-gateway recomputes the exact UTF-8 LF preimage declared by DonationIntentQueueRequestV1; mismatch is INVALID_REQUEST with zero writes or provider handoff
    payment_review_binding:
      reviewAssigneeUserId: required request-bound UUID in TEST_ONLY; it is included in the canonical request digest, immutable donation-intent detail digest and queued receipt digest
      due_rule: A later authoritative fetched failure uses occurredAt plus exactly 24 hours; request time and scheduler time never substitute.
      routing: PAYMENT_REVIEW_V1 with source kind DONATION_PAYMENT_FAILURE and the exact current subject, authorization, one endpoint, one evaluator and source-bound deployment
      mismatch: {sqlstate: "55000", writes: 0}
      reconciliation_required: no task, notification or automatic retry
      forbidden_effects: [external dunning, entitlement change, contract change, public-access change]
    errors: [INVALID_REQUEST, SERVICE_ASSERTION_INVALID, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
  private.ReceivePaymentWebhook:
    operation_kind: COMMAND
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: {method: POST, path: '/internal/v1/payment-webhooks/{provider}'}
    path_parameter: {provider: 'enum<toss-payments|kakao-pay|stripe>'}
    request_media_type: application/json
    maximum_raw_body_bytes: 65536
    caller: payment-fixture TEST_ONLY ingress
    effect_owner: payment-owner-function-boundary
    authorization: request-bound service assertion with issuer payment-fixture and audience billing-gateway bound to exact method, path, raw-body digest and content type; maximum TTL is 30 seconds and JTI replay rejection is durable
    provider_authentication:
      STRIPE: stripe-signature is required and verified over the exact raw bytes before acceptance
      TOSS_PAYMENTS: NOT_AVAILABLE_FETCH_REQUIRED and never VERIFIED from the webhook request
      KAKAO_PAY: NOT_AVAILABLE_FETCH_REQUIRED and never VERIFIED from the webhook request
    availability: {TEST_ONLY: enabled for deterministic fixture acceptance, PRODUCTION: PAYMENT_RUNTIME_UNAVAILABLE before body parsing or provider call}
    request_schema: PaymentWebhookIngressV1
    response_schema: PaymentWebhookAcceptanceV1
    errors: [INVALID_REQUEST, SERVICE_ASSERTION_INVALID, PAYMENT_WEBHOOK_CONFLICT, PAYMENT_RUNTIME_UNAVAILABLE, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]

donation_fact_producer_contract:
  event_type: donation.fact_recorded.v1
