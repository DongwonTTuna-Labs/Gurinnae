schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5

supervisor_decision_v1:
  decision_id: R6E_SUPERVISOR_DECISION_V1
  authority_label: 감독자 결정 v1
  authority_kind: PRODUCT_POLICY_DECISION
  decision_revision: 1
  status: APPROVED_AS_RECOMMENDED
  canonical_contract: specs/product/business-model-contract.yaml#supervisor_decision_v1
  canonical_contract_status: REVIEW_REQUIRED
  canonical_delta_status: APPROVED_POLICY_WITH_OPEN_CANONICAL_DELTAS
  provenance:
    approval_path: .fable-sol/r6e-authority-approval.md
    approval_sha256: a73ccb4da942c32b70ac7056dfe2d65b6c5595beb3e64e22999b07eb0f939f47
    recommendation_record: .fable-sol/run-r6e.log lines 15-104
  approved_packages_ordered_exactly:
    - {ordinal: 1, package_id: ECO-AUTHORITY-V1, approval: APPROVED_AS_RECOMMENDED}
    - {ordinal: 2, package_id: PAID-EVIDENCE-V2-AUTHORITY, approval: APPROVED_AS_RECOMMENDED}
    - {ordinal: 3, package_id: PAYMENT-TEST-V1, approval: APPROVED_AS_RECOMMENDED, review_due_hours: 24}
    - {ordinal: 4, package_id: GFD-AUTHORITY-V1, approval: APPROVED_AS_RECOMMENDED}
  revision_policy:
    ordinary_revision_forbidden: true
    only_allowed_round: a later pre-production review jointly owned by the designated legal and finance owners
    update_shape: a new explicit supervisor decision revision preserving this decision as provenance; silent reinterpretation, partial package substitution and in-place weakening are forbidden
  binding_rule: These four approved policy packages are set-equal to the canonical business-model supervisor decision; every unresolved canonical delta remains fail-closed and may not be inferred from an older addendum, migration, fixture or runtime implementation.

economics_authority_v1_operation_contract:
  authority: supervisor-decision-v1.ECO-AUTHORITY-V1
  target_version:
    economics_import: target.expectedVersion is present and exactly null; integer sentinel 1 is forbidden
    all_other_action_kinds: target.expectedVersion remains a positive int64 and null is invalid
    approval_binding: ApprovalBindingV1.targetVersion mirrors the same null-only ECONOMICS_IMPORT branch and remains positive for every other action kind
  commercial_contract_offer_parent:
    schema: CommercialContractOfferParentV1
    schema_version: {value: 1, json_type: number}
    forbidden_encodings: ['"1"', commercial-contract-offer-parent.v1, offer-profile.v1]
  first_tariff_bootstrap:
    cardinality: one-shot
    stage: PILOT
    required_margin_basis_points: 6000
    guards_ordered_exactly:
      - same deployment and SKU have zero tariff and commercial-contract history
      - current GENERAL_AVAILABILITY READY count is zero
      - one approved complete current cost close is locked and digest-equal
      - the immutable approved detail binds the intended first contract and qualification tuple and both validity intervals
    later_contract_fence: the later recordCommercialContractPeriod import must be exact-equal to the approved bootstrap tuple or fail with write zero
    prohibited_inference: [date, price, label, caller assertion, operator flag, partial cost evidence, current wall clock]
  low_margin:
    branches_exactly: [createTariffVersion, recordInvoice.discount.APPEND]
    condition: projected variable gross margin is below the exact required margin
    exception_authority: UNAVAILABLE
    database_error: {sqlstate: "55000", writes: 0}
    affected_write_sets: tariff, discount, invoice, receipt, audit, outbox, inbox, job and idempotency writes are all zero
  approved_operation_identity:
    rule: Every newly inserted identity is an immutable approved operation byte; PostgreSQL, Rust and repository code may not synthesize a hidden random UUID.
    current_typed_identity_paths:
      recordUsageWindow: [receipt.rootReceiptId, receipt.supersedesReceiptId, fact.rootUsageFactId, fact.supersedesUsageFactId, fact.sourceReceiptId]
      recordInvoice: [invoice.rootInvoiceId, invoice.supersedesInvoiceId, 'lines[*].lineOrdinal', 'memberships[*].rootMembershipId', 'memberships[*].supersedesMembershipId', 'memberships[*].invoiceLineOrdinal']
      recordAccountingCorrection: ['rows[*].rootCorrectionId', 'rows[*].supersedesCorrectionId', 'rows[*].reversesCorrectionId']
      recordCashApplication: ['rows[*].rootFactId', 'rows[*].supersedesFactId']
      recordTaxInvoiceIssuance: ['rows[*].rootReceiptId', 'rows[*].supersedesReceiptId']
    open_wire_name_gate:
      status: BLOCKING_OWNER_SCHEMA_DECISION
      required_by_approved_decision: every new successor receipt/fact row plus invoice line/membership, revenue, cash, tax-invoice and accounting-correction child row must have its new row identity in approved bytes
      unresolved_names: [usage successor row IDs, invoice line row ID, revenue fact row ID]
      rule: The approval fixes identity provenance but does not rename the current typed fields or authorize a new generic id field; until the canonical resource schema and Rust typed ABI fix each unresolved wire name set-equal, the affected positive branch remains unavailable with zero protected writes.
    exact_replay: returns the committed identities and writes zero second child
  invoice_adjustment:
    reference: correctsLineId selects only an earlier line ordinal in the same approved invoice array whose lineKind is not ADJUSTMENT
    forbidden: [cross-invoice reference, forward reference, missing reference, adjustment-to-adjustment reference, cycle]
    failure_writes: 0
  digest_abi:
    name: GURINE_LENGTH_PREFIXED_UTF8_V1
    scope: [economics, usage, invoice, revenue, cash, tax-invoice, accounting-correction]
    framing: unsigned u64 big-endian byte length frames domain, schema version, type tag and value separately
    scalar_rules: [explicit NULL, fixed-six decimal, lowercase UUID, lowercase SHA-256, UTC timestamp with exactly six fractional digits]
    array_rule: an unsigned u64 member count is framed before members in declared order
    preimage_rule: preserve the declared field order and include every immutable business column except the self digest and created_at or updated_at
    per_digest_registry_status: OPEN_CANONICAL_DELTA
    positive_runtime_rule: No digest-dependent positive operation is available until the exact domain, schema-version, type-tag, field-order and nullable/array preimage registry is additionally approved.
    verification: PostgreSQL and Rust golden vectors plus one-byte mutation rejection are mandatory
    funding_use: FORBIDDEN; funding uses its separately approved closed Gurine Canonical JSON V1 contract

paid_evidence_v2_operation_contract:
  authority: supervisor-decision-v1.PAID-EVIDENCE-V2-AUTHORITY
  versioning:
    v1: migration 0029 V1 bytes and relations remain byte-identical and are never reinterpreted
    v2: forward-only additive schemas, preimages, constraints, functions and key domain
    migration_fence: any existing paid packet, paid packet member or paid-bound outcome row aborts before schema effect; backfill, coercion and mixed V1/V2 interpretation are forbidden
  member_digest:
    leaf_preimage: excludes global memberSetDigest and includes the category-local digest under exact field name categoryDigest
    computation_order: compute each leaf first, then compute the global member-set digest over complete leaves in ordinal order
    rejected: [global digest inside a leaf, caller-supplied leaf digest, reordered category/ordinal arrays, incomplete membership]
  review_snapshot_forward_field_count: 12
  review_snapshot_exact_field_registry: OPEN_CANONICAL_DELTA
  review_snapshot_source_constraint: The exact twelve-name subset must be selected from the fields declared by migration 0028 through an additional approved canonical schema; this policy approval does not authorize guessing a subset.
  review_snapshot_presence: all twelve fields are null for a non-paid legacy snapshot or all twelve are present for a paid-eligible V2 snapshot; partial presence is invalid and no historical value is reconstructed
  packet_outcome_cycle:
    outcome_to_packet: MATCH FULL DEFERRABLE INITIALLY DEFERRED
    packet_to_outcome: MATCH FULL DEFERRABLE INITIALLY DEFERRED
    atomicity: the final packet and eligible outcome bind in one transaction with no partially null composite key
  terminal_binding:
    workflow_proofs: exact existing four ordered VerifiedWorkflowProofV1 milestones
    additional_authorities: [exact terminal receipt, policy digest, formula digest, accounting timezone, effective-until]
    stale_rule: missing, expired, reordered, partially present or digest-mismatched evidence is UNKNOWN and cannot finalize a packet or outcome
  subject_hmac:
    domain: PAID_OUTCOME_SUBJECT_HMAC_V2
    key_versions: [CURRENT, PREVIOUS]
    concrete_environment_names: OPEN_CANONICAL_DELTA; this approval does not authorize invented variable names
    issue_rule: current issues new HMACs and the persisted opaque key version selects current or previous for verification
    forbidden_reuse_or_derivation: [payment, webhook, public-web, assertion, donor, billing-key, generic identity]
    injection: TEST_FIXTURE_ONLY

payment_test_v1_operation_contract:
  authority: supervisor-decision-v1.PAYMENT-TEST-V1
  runtime_modes: {default: DISABLED, production: DISABLED, allowed_exactly: [DISABLED, TEST_ONLY], source_live_credentials: 0}
  keyrings_ordered_exactly:
    - {key_env: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY_CURRENT, version_env: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY_CURRENT_VERSION, role: ISSUE_AND_VERIFY}
    - {key_env: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY_PREVIOUS, version_env: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY_PREVIOUS_VERSION, role: VERIFY_ONLY}
    - {key_env: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY_CURRENT, version_env: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY_CURRENT_VERSION, role: ISSUE_AND_VERIFY}
    - {key_env: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY_PREVIOUS, version_env: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY_PREVIOUS_VERSION, role: VERIFY_ONLY}
  key_rule: persisted opaque version selects current or previous; webhook assertion, public-web and every other key cannot be reused or used as a derivation input
  post_restart_missing_billing_material: fail closed with zero automatic recovery, replacement, recharge or resubmission
  recurring_schedule_policy_b:
    anchor: first_charge_at UTC monthly anchor with non-drifting month-end clamp
    eligible_window: current UTC month only
    catch_up_or_backcharge: FORBIDDEN
    occurrence_identity: [schedule_id, schedule_version, scheduledFor]
    occurrence_uniqueness: PERMANENT
    later_month_blockers: [PENDING, ACCEPTED, RECONCILIATION_REQUIRED]
    next_month_release_authorities: [DEFINITIVE_PRE_DISPATCH_REJECTION, FETCH_CONFIRMED_SUCCESS, FETCH_CONFIRMED_REFUND, FETCH_CONFIRMED_FAILURE]
    same_occurrence_resubmission_writes: 0
    scheduler_effect_exactly: insert one DONATION_CHARGE job
    scheduler_direct_effects_forbidden: [payment, contract, entitlement, public_access]
  payment_review:
    required_request_field: reviewAssigneeUserId
    applies_to: [TEST_ONLY donation intent, recordCollectionFailure]
    request_binding: request-bound exact UUID and included in request digest, immutable detail digest and receipt digest
    topic: PAYMENT_REVIEW_V1
    source_kinds_exactly: [DONATION_PAYMENT_FAILURE, SIGNED_COLLECTION_FAILURE]
    required_current_bindings: [one active internal subject, current authorization, exactly one endpoint, exactly one evaluator, source-bound deployment]
    communication_authority_abi: OPEN_CANONICAL_DELTA
    positive_runtime_rule: Task and notification materialization remain unavailable until the exact communication subject, authorization, endpoint/evaluator candidate keys, source-deployment binding, owner function and receipt ABI are additionally approved.
    mismatch: {sqlstate: "55000", writes: 0}
    due_at: occurredAt plus exactly 24 hours
    reconciliation_required: {task_writes: 0, notification_writes: 0, automatic_retry_writes: 0}
    forbidden_effects: [external_dunning, automatic_entitlement_change, automatic_contract_change, automatic_public_access_change]
    fixture_identity_rule: test UUIDs and digests are generated only in an ephemeral database with authority TEST_FIXTURE

gfd_authority_v1_operation_contract:
  authority: supervisor-decision-v1.GFD-AUTHORITY-V1
  target_revision: candidate revision N is 1 for the first publication and locked head plus 1 thereafter; zero sentinel is forbidden
  slots_ordered_exactly:
    - {ordinal: 1, slot_id: funding_preparer, capability: funding.manage, allowed_roles: [EXECUTIVE_APPROVER, OPERATIONS], conditional: false}
    - {ordinal: 2, slot_id: funding_publisher, capability: funding.publish, allowed_roles: [EXECUTIVE_APPROVER], conditional: false}
    - {ordinal: 3, slot_id: oversight_reviewer, capability: review.legal, allowed_roles: [LEGAL_REVIEWER], conditional_on: requires_oversight_review}
    - {ordinal: 4, slot_id: board_approver, capability: funding.publish, allowed_roles: [EXECUTIVE_APPROVER], conditional_on: requires_board_approval}
  slot_rule: Every present slot also requires actions.review and STEP_UP, counted actors are pairwise distinct, a conditional slot exists only when its exact boolean is true, and VACANT never counts or closes quorum.
  related_case_prerequisite: Every distinct related case binds one current existing PUBLICATION.independent_editorial APPROVE with review.editorial, role EDITOR or PUBLISHER, actions.review and STEP_UP.
  publisher: {service: workflow-worker, database_principal: gurine_workflow_worker, function: editorial.publish_funding_disclosure_v1, function_owner: gurine_migrator, direct_table_dml: 0}
  digest_abi:
    name: closed Gurine Canonical JSON V1
    scalar_rules: [fixed-six decimal string, UTC timestamp with exactly six fractional digits, explicit null]
    public_content_rule: includes every stored entryDigest
    revision_preimage_rule: excludes receiptDigest
    computation_order: entry and set digests -> revisionDigest -> receiptDigest -> event and response digests
    counted_decision_tuple_order: [slotOrdinal, slotId, decisionId, decisionReceiptDigest, actorId]
  published_event_required_binding_groups: [revision and prior revision, period, snapshot, policy, conflict, concentration, conditional gates, entry and public-content digests, proposal, execution, approval, counted decisions, related-case reviews, publisher, effective and published timestamps, receipt digest]
  implementation_hold:
    affected_operations_exactly: [createActionProposal, updateActionDraft, previewActionDraft, submitActionForReview, claimActionReview, submitActionDecision]
    database_error: {sqlstate: "55000", message: FUNDING_DISCLOSURE_AUTHORITY_UNAVAILABLE, writes: 0}
    external_error: {code: INTERNAL_ERROR, http_status: 500}
    release_rule: Approval alone does not remove the hold; every authority, ACL, digest, event and test obligation must first be implemented and verified.
counts:
  operations: derived len(operations)
  queries: derived count(operations where kind=QUERY)
  commands: derived count(operations where kind=COMMAND)
  by_api:
    public-api: derived count(operations where api=public-api)
    control-api: derived count(operations where api=control-api)
    submission-api: derived count(operations where api=submission-api)
    identity-api: derived count(operations where api=identity-api)
  rule: values are calculated from operations and compared set-equal to owner-addendum.additive_operations; numeric inventory literals are forbidden
rules:
  - Every schema is closed; additional properties, undocumented enum values, generic JSON and partial merge patch are invalid.
  - Every command requires Idempotency-Key, canonical request SHA-256 and one transaction for domain rows, idempotency receipt, audit and outbox.
  - Same idempotency scope and request digest returns the stored receipt byte-for-byte; changed bytes return IDEMPOTENCY_CONFLICT.
  - Every mutation that uses expectedVersion locks the aggregate and maps zero rows to NOT_FOUND or VERSION_CONFLICT by an explicit existence check.
  - Synthetic identifiers, timestamps, states, digests and receipts are forbidden.

type_grammar:
  uuid: RFC4122 lowercase string
  sha256: lowercase 64-hex string
  datetime: UTC RFC3339 with microseconds
  decimal: canonical non-exponent decimal string
  money: MoneyV1
  cursor: authenticated opaque string
  optional: field may be absent; nullable means field is present and may be null

common_schemas:
  canonical_source: specs/product/addendum-resource-error-contracts.yaml#schemas
  required: [CommandReceiptV1, AddendumProblemDetailsV1]
  rule: Concrete closed request, page, receipt and error schemas come only from the canonical additive resource/error contract; generic typed-array, typed-object, JSON or fallback error envelopes are forbidden.

action_payloads:
  kinds:
    - HYPOTHESIS
    - CLAIM
    - TASK
    - COMPARABLE
    - COMMUNICATION
    - PUBLICATION
    - RETRACTION
    - RULE_ACTIVATION
    - ROLE_GRANT
    - KILL_SWITCH
    - COMMUNICATION_AUTHORIZATION
    - ASSET_RIGHTS_DECISION
    - RETENTION_SCHEDULE
    - FUNDING_DISCLOSURE
    - ECONOMICS_IMPORT
    - CAPABILITY_ACTIVATION
    - RESPONSE_POLICY_CALENDAR
    - COMMERCIAL_CONTROL
    - PROVIDER_CONTROL
  common:
    additional_properties: false
    required: [schemaVersion, kind, target, rationale, effect]
    fields:
      schemaVersion: const action-payload.v1
      kind: enum action_payloads.kinds
      target: ActionTargetV1
      rationale: ActionRationaleV1
      effect: ActionEffectV1
  variants:
    HYPOTHESIS:
      required: [caseId, expectedCaseVersion, statement, unknowns, evidenceSegmentIds]
      executor: createHypothesis
      proposer_capability: cases.investigate
    CLAIM:
      required: [caseId, expectedCaseVersion, claimType, text, responseIds, limitations, evidenceSegmentIds]
      executor: addClaim
      proposer_capability: claims.author
    TASK:
      required: [objectType, objectId, expectedObjectVersion, taskType, title, description, priority, assigneeUserId, dueAt]
      executor: private.CreateTaskFromApprovedAction
      proposer_capability: cases.assign
    COMPARABLE:
      required: [caseId, expectedCaseVersion, targetLineItemId, targetLineItemVersion, candidateLineItemId, candidateLineItemVersion, compatibilityKind, includeReason, evidenceSegmentIds]
      executor: private.MaterializeComparableCandidate
      proposer_capability: cases.investigate
    COMMUNICATION:
      required: [caseId, expectedCaseVersion, purpose, provider, senderConfigId, templateId, templateRevision, locale, recipients, subject, bodyPlainText, attachmentIds, authorizationPurpose, maximumCost, notBefore, expiresAt]
      executor: private.DispatchCommunicationIntent
      proposer_capability: communications.propose
    PUBLICATION:
      required: [caseId, expectedCaseVersion, reviewSnapshotId, reviewSnapshotDigest, previewId, previewDigest, publicationGatePreviewDigest]
      executor: publishCase
      proposer_capability: publication.preview
    RETRACTION:
      required: [caseId, expectedCaseVersion, retractionDraftId, retractionDraftDigest, reviewSnapshotId, previewId, previewDigest, tombstoneReason]
      executor: private.PublishRetraction
      proposer_capability: publication.retract
    RULE_ACTIVATION:
      required: [ruleId, version, expectedRuleVersion, evaluationReceiptId, evaluationDigest, activationScope, effectiveAt]
      executor: activateRuleVersion
      proposer_capability: rules.propose
    ROLE_GRANT:
      required: [userId, roleId, expectedUserVersion, scope, expiresAt, reason]
      executor: grantRole
      proposer_capability: roles.grant
    KILL_SWITCH:
      required: [command, switchTarget, switchEffect, expectedGeneration, reason, expiresAt]
      executor: private.ApplyKillSwitchCommand
      proposer_capability: kill_switch.execute
    COMMUNICATION_AUTHORIZATION:
      required: [subjectId, endpointId, endpointVersion, purpose, topicScope, basis, jurisdiction, policyVersion, decision, proofReceiptId, effectiveAt, expiresAt]
      executor: private.RecordCommunicationAuthorizationDecision
      proposer_capability: communications.authorization.manage
    ASSET_RIGHTS_DECISION:
      required: [assetId, assetSha256, expectedDecisionVersion, decision, dimensions, legalBasis, licenseEvidenceDigests, jurisdiction, attribution, effectiveAt, expiresAt]
      executor: private.ReviseAssetRightsDecision
      proposer_capability: rights.decide
    RETENTION_SCHEDULE:
      required: [recordClass, expectedScheduleRevision, purpose, lawfulBasis, trigger, activeDuration, backupDuration, locations, terminalAction, holdBehavior, restoreSuppressionBehavior, effectiveAt, reviewExpiresAt]
      executor: private.CreateRecordClassScheduleRevision
      proposer_capability: retention.policy.manage
      invariants:
        - trigger is one closed RetentionScheduleActionTargetV1 value, including CONSENT_REVOKED_AT without retiring any legacy trigger.
        - terminalAction is one closed RetentionScheduleActionTargetV1 value, including PRESERVE_REFERENCED_REVISION, PRESERVE_IDENTITY_GRAPH and PRESERVE_WITH_PARENT without retiring DELETE, ANONYMIZE or ARCHIVE.
    FUNDING_DISCLOSURE:
      required: [snapshotBatchId, snapshotDigest, priorDisclosureRevision, fiscalYear, amountBand, concentrationBand, purpose, conflictSummary, policyRequestOutcomes, effectiveAt]
      executor: private.PublishFundingDisclosureRevision
      proposer_capability: funding.manage
      invariants:
        - target.targetType is FUNDING_DISCLOSURE and target.expectedVersion is the positive candidate revision N: 1 for the first publication and locked head plus 1 thereafter; zero is forbidden.
        - PostgreSQL derives requires_oversight_review, requires_board_approval, related case IDs and every conditional-gate digest from the locked snapshot graph; the immutable approval detail binds those derived values without accepting caller substitutes.
        - The exact four-slot, conditional, pairwise-distinct actor, VACANT and related-case prerequisite rules are gfd_authority_v1_operation_contract and the approval-policy FUNDING_DISCLOSURE quorum.
        - Publication uses closed Gurine Canonical JSON V1 in the approved digest order and never GURINE_LENGTH_PREFIXED_UTF8_V1.
    ECONOMICS_IMPORT:
      required: [operation, sourceEvidenceDigests, importPolicyDigest, asOf]
      executor: private.ExecuteEconomicsImport
      proposer_capability: actions.propose
      required_capabilities: [actions.propose, budgets.manage]
      invariants:
        - target.targetType is ECONOMICS_IMPORT and target.expectedVersion is present and exactly null; sentinel 1 is forbidden. Every other action kind retains a positive expectedVersion.
        - operation is one closed row-valued EconomicsImportOperationV1 discriminator; it carries no untyped JSON, caller-authored summary digest, dummy hash, cash balance or inferred payment state.
        - EconomicsImportOperationV1 has exactly eleven operationId branches: recordCommercialQualification, importCostAllocationClose, createTariffVersion, recordCommercialContractPeriod, recordUsageWindow, recordInvoice, recordRevenue, recordAccountingCorrection, recordCashApplication, recordTaxInvoiceIssuance and recordCollectionFailure. replaceCommercialContractPeriod is not a branch.
        - Each branch is the mechanical flat camelCase projection of every field in its selected stable SQL composite. SQL import_kind and all non-selected wrapper slots are never wire fields; nested composites and arrays remain closed named schemas, SQL enums retain their exact literals, and numeric(p,s) values are canonical decimal strings with the same precision and scale.
        - Every nullable SQL field remains a required nullable<T> wire field unless the stable owner ABI explicitly derives or defaults it. Omission is never inferred from nullability, and every array preserves the SQL validator cardinality, canonical order and uniqueness rule.
        - The server resolves rationale.evidenceSegmentIds to immutable ID and digest pairs, sorts them canonically, requires their digest set to equal sourceEvidenceDigests, and persists the parallel ID and digest arrays. Branch-specific named receipt anchors are additional equality checks, never a replacement wire map; private.ExecuteEconomicsImport reloads the immutable detail and accepts neither array again.
        - recordCashApplication accepts only signed typed external import evidence with sourceKind BANK_TRANSFER or PG_SETTLEMENT and the exact invoice ID, record digest, reconciliation digest and expected head fence. PG_SETTLEMENT is not live provider execution, B2B checkout, a payment or entitlement API, and a donation fact never creates an invoice or cash application.
        - CommercialContractOfferParentV1.schemaVersion is JSON number 1; a string or type-name-derived literal is invalid.
        - createTariffVersion admits one PILOT bootstrap only under economics_authority_v1_operation_contract.first_tariff_bootstrap; later contract import must exact-match the approved bootstrap tuple.
        - A low-margin tariff or APPEND discount branch always raises SQLSTATE 55000 with zero writes; R6e has no oversight exception branch.
        - The current typed identity paths and unresolved wire-name gate are exact economics_authority_v1_operation_contract.approved_operation_identity; neither database UUID synthesis nor an invented generic id field is authorized.
        - Invoice adjustments follow economics_authority_v1_operation_contract.invoice_adjustment and can reference only an earlier non-adjustment line in the same approved array.
        - Economics, usage, invoice, revenue, cash, tax-invoice and accounting-correction digests use GURINE_LENGTH_PREFIXED_UTF8_V1; funding digests never use that ABI.
        - recordCollectionFailure requires exact reviewAssigneeUserId bound into request, immutable detail and receipt digests, accepts only signed external evidence bound to the exact invoice digest or provider-fetch-confirmed donation failure, and never derives a dunning state from absence, elapsed time or a missing webhook.
    CAPABILITY_ACTIVATION:
      required: [capabilityClass, capabilityId, environment, configurationDigest, evidenceReceiptIds, policyDigest, contractDigest, rightsDigest, jurisdiction, effectiveAt, expiresAt]
      executor: private.DecideCapabilityActivation
      proposer_capability: providers.manage
    RESPONSE_POLICY_CALENDAR:
      required: [calendarId, expectedCalendarVersion, timezone, weekendDays, holidayDates, policyDigest, effectiveAt, reviewExpiresAt]
      executor: private.CreateBusinessCalendarVersion
      proposer_capability: responses.policy.manage
    COMMERCIAL_CONTROL:
      required: [triggerId, triggerVersion, triggerDigest, triggerKind, exactMetricResultDigests, dependencyInputSetDigest, evidenceSetDigest, affectedScopeDigest, requestedActions, expectedKillSwitchGeneration, expectedCapabilityVersionSetDigest, expectedContractVersionSetDigest, reason, consequence, existingCustomerContinuityPlanDigest, originalControlReceiptDigest, resumeEvidenceSetDigest, expiresAt, commercialControlBindingDigest]
      executor: private.ApplyCommercialControl
      proposer_capability: commercial.controls.propose
    PROVIDER_CONTROL:
      required: [providerControl]
      executor: private.ExecuteProviderControl
      proposer_capability: selected by providerControl.operationId
      operation_policies:
        disableProviderRouting: {capability: kill_switch.execute, assurance: STEP_UP}
        testProviderConnection: {capability: jobs.operate, assurance: ACTIVE_SESSION}
        upgradeProviderModel: {capability: kill_switch.execute, assurance: STEP_UP}
        setModelAutoUpgrade: {capability: kill_switch.execute, assurance: STEP_UP}

economics_import_effect_disposition_registry:
  key: operationId
  dispositions_exactly: [RECORDED, REPLACED, REVERSED, REVIEW_TASK_CREATED]
  transport_from_state:
    aggregate: ECONOMICS_IMPORT
    state: UNRECORDED
    meaning: Pre-effect wire sentinel used only to review the requested durable effect; it is not a lifecycle state, stored head, transition source, or state-machine node.
  variants:
    recordCommercialQualification:
      target_relations: [ops.acquisition_source_receipts, ops.commercial_qualification_receipts]
      atomic_cardinality: optional zero-or-one acquisition source plus exactly one qualification receipt
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    importCostAllocationClose:
      target_relations: [ops.fx_rate_facts, ops.cost_allocations]
      atomic_cardinality: zero-or-more inline FX facts plus one period head and one-or-more allocation lines
      allowed_result_effects: [RECORDED, REPLACED]
    createTariffVersion:
      target_relations: [ops.tariff_versions]
      atomic_cardinality: exactly one tariff version
      allowed_result_effects: [RECORDED]
    recordCommercialContractPeriod:
      target_relations: [ops.commercial_contract_periods, ops.offer_profile_capabilities]
      atomic_cardinality: exactly one contract period plus exactly twelve ordered offer-capability rows
      allowed_result_effects: [RECORDED, REPLACED]
    recordUsageWindow:
      target_relations: [ops.usage_window_receipts, ops.usage_facts]
      atomic_cardinality: exactly one paired usage-window receipt and usage fact
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    recordInvoice:
      target_relations: [ops.discount_decisions, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships]
      atomic_cardinality: zero-or-more discounts, exactly one invoice, one-or-more lines, and complete expected usage memberships
      allowed_result_effects: [RECORDED, REPLACED]
    recordRevenue:
      target_relations: [ops.revenue_facts]
      atomic_cardinality: one-or-more revenue facts fenced to persisted invoice-line ID and digest
      allowed_result_effects: [RECORDED]
    recordAccountingCorrection:
      target_relations: [ops.accounting_corrections]
      atomic_cardinality: one-or-more append-only corrections
      allowed_result_effects: [RECORDED, REVERSED]
    recordCashApplication:
      target_relations: [ops.cash_application_facts]
      atomic_cardinality: one-or-more signed imported facts
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    recordTaxInvoiceIssuance:
      target_relations: [ops.tax_invoice_issuance_receipts]
      atomic_cardinality: one-or-more signed imported receipts
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    recordCollectionFailure:
      target_relations: [ops.tasks]
      atomic_cardinality: exactly one operator review task and no economics, entitlement, or public-access mutation
      allowed_result_effects: [REVIEW_TASK_CREATED]
  invariants:
    - The ordered variant keys are set-equal to EconomicsImportOperationV1 and contain exactly eleven entries.
    - ActionEffectV1 for ECONOMICS_IMPORT has effectClass INTERNAL_MATERIALIZATION, externalSideEffect false, fromState exactly the transport-only UNRECORDED sentinel and toState exactly one allowed_result_effect for the selected operationId.
    - Existing ActionProposal, ActionDecision and ExecutionAuthorization lifecycles are the only lifecycle authority. This registry is a closed immutable effect/disposition contract and never defines a pseudo-machine or generic state transition.
    - Target relations, atomic cardinality and allowed result effects are exact-equal in operation, approval, persistence, command semantics, database addendum and validators.

economics_import_terminal_contract:
  owner_dispositions_exactly: [SUCCEEDED, OPERATION_REJECTED, PERMANENT_FAILED]
  receipt_field: terminalKind
  generic_action_execution_state_selector:
    SUCCEEDED: SUCCEEDED
    OPERATION_REJECTED: PERMANENT_FAILED
    PERMANENT_FAILED: PERMANENT_FAILED
  operation_rejected: The nested branch apply is rolled back and only a redacted business or constraint rejection terminalization is retained; it is not retryable and is not reconciliation.
  commit_ack_ambiguity: SQLSTATE class 08 or equivalent commit acknowledgement uncertainty creates no terminal receipt, terminal state or second submission. The same claim, idempotency identity and execution fence recalls the owner until it returns the committed replay or executes the previously uncommitted transaction.
  invariants:
    - The generic action execution state enum remains unchanged and never gains OPERATION_REJECTED.
    - RECONCILIATION_REQUIRED is absent from the economics owner disposition and EconomicsImportExecutionReceiptV1 terminalKind sets.
    - Worker job success is selected only by terminalKind SUCCEEDED; no external send, automatic resubmission or new idempotency identity exists in this database-only executor.

action_digest_contract:
  normative_source: specs/product/addendum-approval-policy.yaml#digest_contracts
  contentDigest: RFC8785_JCS(ActionPayloadV1) with declared ordered arrays and UTF-8 free-text digests
  approvalDigest: GURINE_CANONICAL_JSON_V1(ApprovalBindingV1)
  actionDetailDigest: GURINE_CANONICAL_JSON_V1({actionDetailKind,actionDetail}) and actionDetailKind equals actionKind
  actorActionDigest: GURINE_CANONICAL_JSON_V1(ActionAuthorizationContext) whose businessPayloadSha256 is approvalDigest
  executionDigest: GURINE_CANONICAL_JSON_V1(ExecutionBindingV1)

provider_control_http_side_door:
  operation_ids: [disableProviderRouting, testProviderConnection, upgradeProviderModel, setModelAutoUpgrade]
  logical_role: The existing operation IDs and request schemas are closed provider-control form and ActionPayloadV1 discriminator anchors only; they are not effect entrypoints.
  direct_http:
    status: 409
    error_code: ACTION_PROPOSAL_REQUIRED
    state_effect: UNCHANGED
    transaction: NONE
    writes: []
    outbox_events: []
    external_effects: []
  only_effect_path: PROVIDER_CONTROL ActionProposal -> independent review -> current ExecutionAuthorization -> one jobs.operate provider-control job -> analysis-worker private.ExecuteProviderControl three-phase version fence
  invariants:
    - A direct HTTP invocation never creates a proposal, authorization, job, receipt, audit, outbox event or provider effect.
    - The four request schemas remain byte-compatible with ProviderControlActionV1 branches so the BFF can create a typed proposal without calling the effect endpoint.
    - No browser, BFF or Control API handler may invoke relay or mutate provider state outside the authorized analysis-worker executor path.

operations:
  - operation_id: downloadTransparencyReport
    api: public-api
