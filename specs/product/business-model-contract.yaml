  binding_rule: Each deployed primary and backup is represented by distinct domain-separated role-binding HMACs under one current owner-binding-set digest. Function labels alone do not prove staffing; missing/stale/same-person bindings make the metric owner state UNKNOWN and block a decision that needs the owner.
  separation_rule: The same person may cover functions where the base authority permits small-team overlap, but proposer and counted independent approver for pause, hard-stop classification, tariff exception, renewal, expansion, and resume must be distinct at decision time.

metrics:
  BM-ACQ-QUALIFIED-ORG-COUNT:
    version: 1
    unit: organizations
    decision_use: qualified funnel volume
    population: qualification episodes whose immutable first_qualified_at falls in the cohort window and whose current qualification head is valid at cutoff
    window: accounting calendar month by first_qualified_at
    formula: count_distinct(qualification_episode_id where current_qualification_receipt(cutoff).status = "VALID")
    sources: [ops.commercial_qualification_receipts, ops.acquisition_source_receipts]
    exclusions: [reversed qualification, duplicate organization/SKU, lead-only or acquisition-only record]
    owner: Sales/CS/Finance
    data_quality: all thirteen ordered qualification criteria, primary/backup role-binding HMACs, decision_effective_at, immutable first_qualified_at, and policy/evidence-set digests validate
    unknown_handling: missing or stale criterion increments unknown_count and does not enter numerator or an unqualified denominator
    threshold: planning input; no standalone success target
    healthy_issue_code: NONE
    breach_action: NONE for a known contextual count; UNKNOWN assigns SALES_CS_FINANCE to complete qualification evidence before the organization is used by any funnel rate
  BM-ACQ-CHANNEL-MIX:
    version: 1
    unit: organizations_by_source_kind
    decision_use: privacy-safe channel allocation
    population: the exact BM-ACQ-QUALIFIED-ORG-COUNT qualification-episode set for one first_qualified_at cohort
    window: accounting calendar month by first_qualified_at, source fixed by acquisition_attribution_contract at the same cutoff
    formula: one ordered SourceBreakdownEntryV1 per acquisition_attribution_contract.source_order_exactly; group_count_distinct(qualification_episode_id by conserved source kind)
    sources: [ops.commercial_qualification_receipts, ops.acquisition_source_receipts]
    exclusions: [reversed/stale attribution, person-level touchpoint, unqualified organization]
    owner: Product/PdM and Sales/CS/Finance
    data_quality: one exact qualification-bound current non-reversed attribution head or explicit UNKNOWN_SOURCE per episode; sum of all ordered counts equals BM-ACQ-QUALIFIED-ORG-COUNT under the same cohort/input digest
    unknown_handling: unattributed is an explicit UNKNOWN_SOURCE bucket and is never reassigned by guess or excluded from the conserved total; attribution-dependent CAC/payback remain UNKNOWN
    threshold: no channel is scaled without activation, retention, CAC, and trust evidence
    healthy_issue_code: NONE
    breach_action: do not scale or fund an UNKNOWN_SOURCE or weak retained-value channel; assign PRODUCT_PDM and SALES_CS_FINANCE to close attribution and matured-cohort evidence
  BM-FUNNEL-CONFIGURATION-RATE:
    version: 1
    unit: ratio
    decision_use: onboarding conversion
    population: qualified qualification episodes whose 14-day configuration observation window has matured
    window: rolling 90-day QUALIFIED cohorts, observed through qualified_at + 14 days
    formula: count_distinct(qualification_episode_id with valid CONFIGURED at <= first_qualified_at + 14d) / count_distinct(matured valid QUALIFIED qualification_episode_id)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.capability_activation_decisions, ops.capability_activation_evidence, ops.sku_readiness_evaluations, ops.sku_readiness_items]
    exclusions: [qualification reversed before configuration, duplicate deployment, non-production configuration]
    owner: Sales/CS/Finance and SRE
    data_quality: exact contract/configuration/activation digests and effective intervals match
    unknown_handling: missing predecessor or receipt is UNKNOWN in numerator detail and remains in matured denominator
    threshold: diagnose if below 0.80 with at least 10 eligible organizations
    healthy_issue_code: NONE
    breach_action: COMPLETE_CONFIGURATION for each blocked episode and REVIEW_COHORT_LOSS when the known rate is below threshold
  BM-FUNNEL-DATA-READY-RATE:
    version: 1
    unit: ratio
    decision_use: source onboarding effectiveness
    population: configured qualification episodes whose 14-day data-readiness observation window has matured
    window: rolling 90-day CONFIGURED cohorts, observed through configured_at + 14 days
    formula: count_distinct(qualification_episode_id with valid DATA_READY at <= configured_at + 14d) / count_distinct(matured valid CONFIGURED qualification_episode_id)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots]
    exclusions: [fixture/non-production snapshot, empty snapshot, expired rights/readiness]
    owner: Data/Engineering and Product/PdM
    data_quality: readiness evaluation and snapshot/evidence-set digests are current and reproducible
    unknown_handling: missing coverage/freshness/rights is UNKNOWN and remains in matured denominator
    threshold: diagnose if below 0.80 with at least 10 eligible organizations
    healthy_issue_code: NONE
    breach_action: REPAIR_DATA_READINESS without weakening rights, freshness, snapshot, or limitation gates; REVIEW_COHORT_LOSS when the known rate is below threshold
  BM-VALUE-PAID-MVW:
    version: 1
    unit: verified_workflows
    decision_use: north-star paid value
    population: current paid-MVW-eligible organization outcome chains
    window: accounting calendar month by outcome effective_from
    formula: count_distinct(root_fact_id where strict_paid_mvw_eligible(current_outcome_head, cutoff))
    sources: [ops.outcome_facts, ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots, ops.outbound_delivery_receipts, ops.audit_events]
    exclusions: [TRIAGED_SIGNAL, REVIEWED_INVESTIGATION, ACCEPTED_PROPOSAL, PUBLICATION, CORRECTION, public scope, inverse head, incomplete proof, AI-only output]
    owner: Product/PdM
    data_quality: exact packet/proof/decision/review/terminal receipt and current correction head resolve
    unknown_handling: unresolved proof/chain/contract is reported as unknown_candidate_count and never counted
    threshold: at least 1 for activation; at least 2 additional in the retention window
    healthy_issue_code: NONE
    breach_action: VERIFY_PAID_PACKET for unknown candidates and RECOVER_VALUE_WORKFLOW when a matured episode has no eligible paid MVW
  BM-VALUE-PAID-MVW-PER-ACTIVE-ORG:
    version: 1
    unit: workflows_per_organization
    decision_use: depth of recurring value
    population: revenue-qualified organizations in one immutable qualification cohort during the month
    cohort_scope: exact qualification cohort month plus qualification_episode_id, organization_id, SKU, accounting timezone, metric window, and as_of cutoff
    window: accounting calendar month, reported separately by qualification cohort month
    formula: count_distinct(root_fact_id where strict_paid_mvw_eligible(current_outcome_head, cutoff) and (qualification_episode_id, organization_id) in revenue_qualified_org_set(same_qualification_cohort, same_sku, same_window, cutoff)) / count_distinct(qualification_episode_id in that exact denominator set)
    aggregation_rule: Portfolio totals may use exact summed cohort numerators divided by exact summed disjoint cohort denominators; averaging cohort ratios, reassigning an organization across episodes, or joining a global MVW numerator to a cohort denominator is forbidden.
    sources: [ops.outcome_facts, ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots, ops.outbound_delivery_receipts, ops.audit_events, ops.invoice_facts]
    exclusions: [non-revenue-qualified organization, public outcome]
    owner: Product/PdM
    data_quality: numerator is re-scoped to exactly the denominator's qualification episode/cohort, revenue-qualified organization set, SKU, accounting timezone, accounting window, and cutoff; a global or cross-cohort paid-MVW numerator is forbidden
    unknown_handling: zero eligible organizations is NOT_APPLICABLE; any incomplete source marks UNKNOWN
    threshold: trend and cohort diagnostic; no vanity target
    healthy_issue_code: NONE
    breach_action: NONE for a known contextual value; UNKNOWN triggers VERIFY_PAID_PACKET and no expansion, renewal, or scale decision may use the ratio
  BM-ACTIVATION-7D-RATE:
    version: 1
    unit: ratio
    decision_use: qualified pilot activation
    population: DATA_READY qualification episodes whose 7-day observation window has matured
    window: rolling 90-day DATA_READY cohorts, observed through data_ready_at + 7 days
    formula: count_distinct(episode satisfying activation_measurement_contract.seven_day_rate.success) / count_distinct(episode satisfying its maturity rule)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots, ops.outcome_facts]
    exclusions: [data readiness reversed, outcome before data readiness, non-production or inactive-contract outcome]
    owner: Product/PdM
    data_quality: projected DATA_READY and FIRST_PAID_VALUE share qualification episode, organization/SKU, cutoff, and monotonic time
    unknown_handling: matured organization without valid first value or terminal-without-value stays in denominator and is a failure; younger episodes are pending, while ambiguous predecessor is UNKNOWN with reason
    threshold: at least 0.80 when eligible count is at least 10
    healthy_issue_code: NONE
    breach_action: REVIEW_COHORT_LOSS and RECOVER_VALUE_WORKFLOW; commercial_pause applies at its declared consecutive-cohort threshold
  BM-ACTIVATION-TTFPV-P90:
    version: 1
    unit: hours
    decision_use: activation latency
    population: every DATA_READY qualification episode in the rolling 90-day cohort whose 336-hour observation has matured or terminated without value; activated-only survivor populations are forbidden
    window: rolling 90 days by DATA_READY effective_at, evaluated after the activation_measurement_contract 336-hour maturity boundary
    formula: activation_measurement_contract.p90_objective RESTRICTED_EMPIRICAL_P90_OBJECTIVE_V1 at rank integer_divide(9 * eligibleCount + 9, 10); return exact timely event hours or the typed 336-hour lower-bound breach, never percentile_cont over completers
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots, ops.outcome_facts]
    exclusions: [negative interval or ambiguous predecessor is UNKNOWN rather than excluded, corrected-away first value is recomputed, pre-336 active episode is pending rather than excluded]
    owner: Product/PdM and Data/Engineering
    data_quality: projected DATA_READY, event/terminal/censor state, and FIRST_PAID_VALUE use immutable sources, one qualification episode, one cutoff, monotonic timestamps, and a complete ordered observation-set digest
    unknown_handling: fewer than 5 eligible organizations returns SmallSampleEvidenceV1 and an authorized privacy-controlled MetricOrderedObservationSetV1 without a percentile claim; a selected infinite rank returns a KNOWN typed lower-bound breach, not a fabricated finite value
    threshold: no more than 336 hours
    healthy_issue_code: NONE
    breach_action: REVIEW_COHORT_LOSS and remove the slowest evidence-backed configuration/data/value blocker without changing the clock or cohort
  BM-RETENTION-D29-56-RATE:
    version: 1
    unit: ratio
    decision_use: activated-pilot retention
    population: activated organizations with as_of >= activation_at + 57 days
    window: additional paid MVWs in [activation_at + 29d, activation_at + 57d)
    formula: count_distinct(episode with paid_mvw_count(fixed window) >= 2) / count_distinct(all day-57-matured activated episodes)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts]
    exclusions: [the activation workflow itself, duplicate/retry outcome]
    denominator_rule: early churn, contract end, inactivity, and loss of access remain denominator failures
    owner: Product/PdM and Sales/CS/Finance
    data_quality: correction-chain heads are evaluated at the cohort cutoff and organization/SKU match
    unknown_handling: incomplete outcome chain remains in the fixed denominator and makes the aggregate UNKNOWN; early churn remains a known failure; current trailing-30-day health is reported separately by BM-RETENTION-AT-RISK-ORG-COUNT
    threshold: at least 0.70 when eligible count is at least 10
    healthy_issue_code: NONE
    breach_action: RECOVER_VALUE_WORKFLOW for affected organizations and REVIEW_COHORT_LOSS; commercial_pause applies at its declared consecutive-cohort threshold
  BM-RETENTION-AT-RISK-ORG-COUNT:
    version: 1
    unit: organizations
    decision_use: customer-success intervention
    population: every currently qualified non-churned episode from onboarding through retained operation
    window: point-in-time plus trailing 30 days
    formula: count_distinct(episode where relationship_health_contract state is ONBOARDING_AT_RISK or POST_ACTIVATION_AT_RISK)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts, ops.sku_readiness_evaluations, ops.sku_readiness_items, ops.sli_window_receipts]
    exclusions: [churned episode only; not-yet-configured and not-yet-data-ready episodes are evaluated against explicit onboarding clocks rather than excluded]
    owner: Sales/CS/Finance and Product/PdM
    data_quality: each at-risk reason has source receipt, health class, primary and backup owner, first_seen_at, due_at, recovery predicate, and next review time
    unknown_handling: missing value/readiness/SLA evidence is an explicit at-risk reason, not healthy
    threshold: every organization has a named recovery owner within one business day
    healthy_issue_code: NONE
    breach_action: RECOVER_VALUE_WORKFLOW with one-business-day owner assignment; readiness or SLA unknown uses its specialized remediation first
  BM-RETENTION-CHURN-RATE:
    version: 1
    unit: ratio
    decision_use: commercial continuation
    population: qualification episodes with an ACTIVE or SUSPENDED current contract at window start
    window: accounting calendar month
    formula: count_distinct(qualification_episode_id with valid CHURNED effective_at in window) / count_distinct(qualification_episode_id active_or_suspended at window_start)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods]
    exclusions: [temporary inactivity, at-risk without terminal contract state, replacement contract without a service gap]
    denominator_rule: early terminal episodes remain churn numerator and fixed-retention denominator when their respective windows mature
    owner: Sales/CS/Finance
    data_quality: deterministic as-of contract projection binds terminal state/effective interval and proves absence of an active or suspended replacement
    unknown_handling: contract gap or ambiguous successor marks organization UNKNOWN, not churned
    threshold: review every churn; aggregate stop criteria are defined below
    healthy_issue_code: NONE
    breach_action: REVIEW_COHORT_LOSS for every churn and require a new qualification episode for re-entry; never backdate or erase historical churn
  BM-FUNNEL-PILOT-TO-PAID-RATE:
    version: 1
    unit: ratio
    decision_use: commercial conversion
    population: QUALIFIED pilot qualification episodes whose 60-day observation window has matured
    window: "[qualified_at, qualified_at + 60d)"
    formula: count_distinct(qualification_episode_id with positive recognized_revenue and >= 1 strict paid MVW in window) / count_distinct(matured QUALIFIED pilot qualification_episode_id)
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.revenue_facts, ops.outcome_facts]
    exclusions: [signed-only contract, invoice-only organization, fixture value, reversed revenue]
    owner: Sales/CS/Finance and Product/PdM
    data_quality: revenue and value facts share organization/contract/SKU and current chains
    unknown_handling: missing revenue reconciliation or value proof remains in denominator and is UNKNOWN/failure detail
    threshold: at least 0.30 when eligible count is at least 10
    healthy_issue_code: NONE
    breach_action: REVIEW_COHORT_LOSS and RECONCILE_USAGE_AND_INVOICE; commercial_pause applies at its declared consecutive-cohort threshold
  BM-REVENUE-QUALIFIED-ORG-COUNT:
    version: 1
    unit: organizations
    decision_use: separate active value-bearing revenue from bookings
    population: qualification episodes with a current ACTIVE, PROVISIONED contract
    window: point-in-time with trailing 30-day invoice and value windows
    formula: count_distinct(qualification_episode_id with reconciled_positive_invoice_trailing_30d and strict_paid_mvw_trailing_30d)
    sources: [ops.commercial_contract_periods, ops.invoice_facts, ops.invoice_usage_memberships, ops.outcome_facts]
    exclusions: [signed/unprovisioned/inactive contract, zero/invalid invoice, no paid MVW]
    owner: Sales/CS/Finance
    data_quality: current contract, invoice membership, and paid outcome are KNOWN
    unknown_handling: incomplete invoice/value proof marks UNKNOWN and does not count
    threshold: reporting denominator; no standalone target
    healthy_issue_code: NONE
    breach_action: NONE for a known contextual count; UNKNOWN triggers RECONCILE_USAGE_AND_INVOICE or VERIFY_PAID_PACKET according to the typed reason
  BM-EXPANSION-ELIGIBILITY-RATE:
    version: 1
    unit: ratio
    decision_use: evidence-backed same-SKU quota, seat-block, SLA, or explicitly offered channel expansion review; never automatic entitlement
    population: revenue-qualified qualification episodes with two consecutive complete billing months at the monthly as_of cutoff
    window: trailing 60 days for value/demand plus the two complete accounting months ending before as_of
    formula: count_distinct(qualification_episode_id where expansion_eligibility(qualification_episode_id, same_cutoff) = "ELIGIBLE") / count_distinct(matured revenue-qualified qualification_episode_id in denominator)
    eligibility:
      - current contract is ACTIVE and PROVISIONED with no terminal successor
      - either strict paid MVW count in trailing 60 days is at least 4 or one nonzero included billable quota has utilization at least 0.80 in each of the two complete months
      - matured retention is satisfied; an episode not yet retention-mature has at least one strict paid MVW in trailing 30 days
      - billing reconciliation equals 1.0 and actual variable gross margin meets the applicable PILOT or GENERAL_AVAILABILITY target in both complete months
      - the current tariff P75 projection for the proposed expanded OfferProfileV1 also meets that same resolved stage target
      - support is at most 4.0 hours per activated organization in both complete months
      - required readiness and source rights are current, selected SLA is KNOWN and passing, and trust hard-stop count is zero
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.tariff_versions, ops.usage_window_receipts, ops.usage_facts, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships, ops.outcome_facts, ops.revenue_facts, ops.cost_allocations, ops.fx_rate_facts, ops.sku_readiness_evaluations, ops.sku_readiness_items, ops.sli_window_receipts, ops.incident_events]
    exclusions: [fewer than two complete billing months, inactive/unprovisioned contract, churned episode, free public use, unoffered capability]
    owner: Sales/CS/Finance and Product/PdM with SRE readiness review
    data_quality: every eligibility predicate uses the same organization/SKU, qualification episode, OfferProfileV1, accounting windows, formula catalog, stage-target resolver, and as_of cutoff; actual and P75 values are separately typed and never substituted
    unknown_handling: if any denominator organization has an unresolved eligibility input, status is UNKNOWN with null rate and typed organization counts; unknown is never forced ineligible or omitted
    threshold: no aggregate growth target; an expansion offer is allowed only for an individually ELIGIBLE organization
    healthy_issue_code: NONE
    breach_action: do not offer or auto-apply expansion; close the typed readiness, reconciliation, margin, support, SLA, or value reason and re-evaluate at a new as_of cutoff
  BM-RENEWAL-ELIGIBILITY-RATE:
    version: 1
    unit: ratio
    decision_use: evidence-backed contract renewal recommendation; never automatic renewal or cash/revenue claim
    population: every current non-superseded contract root with period_end in (as_of, as_of + 60 days] at the monthly cutoff, including inactive, blocked, unknown, and not-provisioned roots as typed ineligible/unknown members rather than excluding weak renewals
    window: forward 60-day contract decision window plus trailing 90-day value/readiness and two complete accounting months
    formula: count_distinct(contract_root where renewal_eligibility(contract_root, same_cutoff) = "ELIGIBLE") / count_distinct(contract_root in renewal decision window)
    eligibility:
      - no CANCELLED/ENDED successor and no unresolved contract-identity gap
      - at least one strict paid MVW in trailing 30 days and matured retention is satisfied when the episode is at least 57 days old
      - billing reconciliation equals 1.0 for the latest complete invoice period
      - actual variable gross margin meets the applicable PILOT or GENERAL_AVAILABILITY target and support is at most 4.0 hours in each of the two complete accounting months
      - the renewal OfferProfileV1/current tariff P75 projection meets the same resolved stage target
      - required readiness/source rights are current, selected SLA is KNOWN and passing, and no open trust hard stop or blocking incident exists
    sources: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.tariff_versions, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships, ops.usage_facts, ops.outcome_facts, ops.revenue_facts, ops.cost_allocations, ops.fx_rate_facts, ops.sku_readiness_evaluations, ops.sku_readiness_items, ops.sli_window_receipts, ops.incident_events]
    exclusions: [contract ending after the forward window, duplicate or superseded contract root]
    denominator_rule: inactive/unprovisioned, fewer-than-two-month, cancelled, blocked, and unknown roots remain visible typed members of the all-expiring-root denominator
    owner: Sales/CS/Finance with Product/PdM, SRE, and Trust/Privacy/Legal gate review
    data_quality: all expiring-root set, contract as-of interval, OfferProfileV1, stage target, separate actual/P75 economics, paid-value correction heads, invoice/revenue/cost periods, readiness, SLA, and incident sets share one cutoff and transitive input-set digest
    unknown_handling: any unresolved eligibility input makes status UNKNOWN with null rate and typed contract counts; unknown is never treated as eligible, ineligible, churned, or renewed
    threshold: no aggregate revenue target; renewal may be recommended only for an individually ELIGIBLE contract root
    healthy_issue_code: NONE
    breach_action: make no renewal recommendation or automatic mutation; assign the typed blocker owner and re-evaluate before the decision window expires
  BM-REVENUE-RECOGNIZED-KRW:
    version: 1
    unit: KRW
    decision_use: accounting revenue
    population: current effective revenue-fact chains for the SKU
    window: accounting calendar month by recognition interval overlap
    formula: exact_sum6(current revenue slices assigned by revenue_recognition_contract to the window); point-in-time uses the containing window and over-time uses exact microsecond intersection with deterministic final-slice residual
    sources: [ops.revenue_facts, ops.accounting_corrections]
    exclusions: [invoice total, commitment, tax payable, reversed or superseded amount]
    owner: Sales/CS/Finance
    data_quality: policy, recognition method, invoice/line membership, source/terminal receipt, currency, interval, ordered allocation/residual set, correction union, and cumulative cap validate
    unknown_handling: a broken chain or missing recognition input makes the affected amount UNKNOWN and separately disclosed
    threshold: actual fact, never a target substituted for value
    healthy_issue_code: NONE
    breach_action: NONE for a known accounting fact; UNKNOWN blocks revenue, margin, expansion, renewal, and scale claims until Finance appends or validates the exact correction chain
  BM-BILLING-RECONCILIATION-COVERAGE:
    version: 1
    unit: ratio
    decision_use: invoice completeness
    population: effective COMPLETE usage facts whose windows fall in a closed invoice period
    window: accounting calendar month
    formula: count(effective_usage_fact with exactly_one_valid_invoice_membership) / count(effective_COMPLETE_usage_fact_due_for_reconciliation)
    sources: [ops.usage_window_receipts, ops.usage_facts, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships]
    exclusions: [PARTIAL/UNKNOWN measurement from denominator but reported separately, reversed fact, not-yet-due open window]
    owner: Sales/CS/Finance and Data/Engineering
    data_quality: receipt->usage->membership chain and line/header conservation are exact
    unknown_handling: unknown/partial usage has a separate unknown_usage_count and blocks READY; it cannot reduce the denominator by silent filtering
    threshold: exactly 1.0 after first billing cycle
    healthy_issue_code: NONE
    breach_action: RECONCILE_USAGE_AND_INVOICE and block invoice/revenue/readiness claims for the affected period
  BM-MARGIN-VARIABLE-GROSS-RATE:
    version: 1
    unit: ratio
    decision_use: pricing and quota sustainability
    population: recognized SKU revenue and eligible variable costs in the same organization/window/currency
    window: accounting calendar month; P75 projection uses the exact tariff usage cohort
    formula: (metric("BM-REVENUE-RECOGNIZED-KRW") - eligible_variable_cost) / metric("BM-REVENUE-RECOGNIZED-KRW")
    sources: [ops.revenue_facts, ops.cost_allocations, ops.fx_rate_facts, ops.tariff_versions]
    exclusions: [SALES_CUSTOMER_ACQUISITION from variable cost, tax, unclosed period]
    owner: Sales/CS/Finance and SRE
    data_quality: cost_completeness_contract source/category matrix is closed, event coverage >= 0.99, direct amount coverage = 1, total amount coverage >= 0.95, every unknown has an upper-bound state, unallocated policy is applied, and FX direction is exact
    unknown_handling: zero revenue is NOT_APPLICABLE; incomplete cost or FX is UNKNOWN and cannot produce a healthy margin
    threshold: P75 at least 0.60 pilot and 0.70 general availability
    healthy_issue_code: NONE
    breach_action: CLOSE_COST_AND_FX_GAPS for UNKNOWN; ADJUST_PRICE_QUOTA_OR_EFFICIENCY for a known breach without weakening trust/quality gates
  BM-MARGIN-CONTRIBUTION-KRW:
    version: 1
    unit: KRW
    decision_use: absolute economic contribution
    population: recognized SKU revenue and all attributable operating variable costs
    window: accounting calendar month
    formula: metric("BM-REVENUE-RECOGNIZED-KRW") - eligible_variable_cost
    sources: [ops.revenue_facts, ops.cost_allocations, ops.fx_rate_facts]
    exclusions: [SALES_CUSTOMER_ACQUISITION, tax, unclosed period]
    owner: Sales/CS/Finance
    data_quality: same complete source/category/amount/upper-bound/unallocated/correction contract as BM-MARGIN-VARIABLE-GROSS-RATE
    unknown_handling: any material unknown/unallocated cost makes contribution UNKNOWN with known lower/upper components, never an exact claim
    threshold: must be positive before general-availability scale
    healthy_issue_code: NONE
    breach_action: CLOSE_COST_AND_FX_GAPS for UNKNOWN; REVIEW_PRODUCT_PAUSE when known contribution is nonpositive
  BM-COST-PER-PAID-MVW-KRW:
    version: 1
    unit: KRW_per_verified_workflow
    decision_use: workflow efficiency
    population: eligible variable cost allocated to paid outcome facts in the month
    window: accounting calendar month
    formula: eligible_variable_cost / metric("BM-VALUE-PAID-MVW")
    sources: [ops.cost_allocations, ops.outcome_facts]
    exclusions: [public outcomes, sales acquisition, unallocated cost from numerator but disclosed as blocker]
    owner: Product/PdM and SRE
    data_quality: every counted outcome and cost line uses current chain and closed period
    unknown_handling: zero paid MVW is NOT_APPLICABLE; incomplete allocation is UNKNOWN
    threshold: improve without trust/quality regression; no arbitrary vanity target
    healthy_issue_code: NONE
    breach_action: NONE for a known contextual value; UNKNOWN closes allocation gaps, while a worsening trend may adjust efficiency only and never evidence/review/privacy controls
  BM-CAC-KRW:
    version: 1
    unit: KRW
    decision_use: acquisition efficiency
    population: distinct valid qualification episodes in one immutable first_qualified_at acquisition cohort plus the complete captured SALES_CUSTOMER_ACQUISITION cost set ending exclusively at each episode's first_qualified_at
    cohort_scope: exact first_qualified_at cohort month, qualification_episode_id set, source binding set, SKU, reporting currency, accounting timezone, acquisition-end rule, cutoff, FX policy, and correction-set digest
    window: per-episode acquisition interval ending at first_qualified_at exclusive, aggregated only within the exact cohort_scope
    formula: if complete captured acquisition set and every episode/source/currency/correction binding are KNOWN and unattributed amount = 0 then exact_sum6(cohort acquisition amounts) / count_distinct(qualified qualification_episode_id); otherwise UNKNOWN
    aggregation_rule: This is cohort ratio-of-sums CAC per newly qualified episode. Per-organization cost ratios, averaging source/cohort CACs, using activated survivors only, or dividing a global spend total by another cohort is forbidden.
    sources: [ops.cost_allocations, ops.acquisition_source_receipts, ops.fx_rate_facts]
    exclusions: [reversed/stale attribution, person-level data, editorial/public-interest activity, unallocated amount]
    owner: Sales/CS/Finance
    data_quality: amount conservation, organization/campaign/episode/receipt digest, acquisition-end boundary, complete cohort denominator, post-qualification reclassification, and exact FX bind every line
    unknown_handling: missing attribution or unallocated acquisition cost makes CAC UNKNOWN, not lower
    threshold: input to payback; no isolated cheap-CAC target
    healthy_issue_code: NONE
    breach_action: close ATTRIBUTION_UNKNOWN and unallocated acquisition cost, pause the affected paid channel, and never impute a lower CAC
  BM-CAC-PAYBACK-MONTHS:
    version: 1
    unit: months
    decision_use: general-availability scale
    population: the exact BM-CAC-KRW qualification cohort after every episode has three complete contribution observation months or a terminal contract state; nonactivated and churned episodes remain in the cohort with zero revenue and their actual known costs
    cohort_scope: exactly BM-CAC-KRW cohort/episode/source/SKU/currency/timezone/acquisition-end/cutoff, with three chronological complete contribution months and the same transitive input digest lineage
    window: acquisition cohort plus its first three complete post-qualification accounting months under the bound cohort observation policy
    formula: cohort_cac_per_qualified_episode / (exact_sum6(cohort recognized revenue - cohort eligible variable cost across 3 complete months) / (qualified_episode_count * 3)); both sides are ratio-of-sums over the same episode set
    aggregation_rule: Never average organization payback, monthly margin percentages, cohort ratios, or activated-survivor contribution. A terminal/no-value episode remains in qualified_episode_count and contributes its actual zero revenue and known cost.
    sources: [ops.cost_allocations, ops.acquisition_source_receipts, ops.revenue_facts]
    exclusions: [fewer than 3 complete months, reversed attribution, nonpositive contribution]
    owner: Sales/CS/Finance
    data_quality: all three contribution months, every qualification episode, attribution/source cohort, CAC, revenue/cost correction head, FX, currency, and cutoff are KNOWN and identical in scope
    unknown_handling: fewer than 3 complete months is NOT_APPLICABLE for GA evidence; zero/negative contribution sets status UNKNOWN, reasonCode NONPOSITIVE_CONTRIBUTION, null value, and failed readiness
    threshold: no more than 12.0 months
    healthy_issue_code: NONE
    breach_action: pause GA expansion and the affected paid acquisition channel; CLOSE_COST_AND_FX_GAPS for UNKNOWN or ADJUST_PRICE_QUOTA_OR_EFFICIENCY for a known value above threshold
  BM-SLA-AVAILABILITY-RATE:
    version: 1
    unit: ratio
    decision_use: SLA compliance and service credit
    population: contracted critical capability minutes for SLA-selected organizations
    window: accounting calendar month
    formula: round12_half_even((eligible_service_minutes - union_unavailable_minutes) / eligible_service_minutes)
    sources: [ops.sli_window_receipts, ops.commercial_contract_periods, ops.incident_events]
    exclusions: [only closed policy-allowed announced maintenance up to 4h/month]
    owner: SRE
    data_quality: gap-free SLI coverage, exact capability set, incident interval union, policy digest
    unknown_handling: missing telemetry or target is UNKNOWN and opens an incident; no green SLA claim
    threshold: exact signed SLA policy target; absent target blocks sale of add-on
    healthy_issue_code: NONE
    breach_action: RESTORE_SLA_AND_TELEMETRY, open or update the incident, and append the exact service-credit correction when the signed policy requires it
  BM-SUPPORT-HOURS-PER-ACTIVATED-ORG:
    version: 1
    unit: hours_per_organization_month
    decision_use: support capacity
    population: activated organizations with current contract
    window: accounting calendar month
    formula: sum(SUPPORT and MATERIAL_CORRECTION_HOUR driver quantities) / count_distinct(activated organization)
    sources: [ops.cost_allocations, ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts]
    exclusions: [sales acquisition time, unrelated public editorial time, fixture effort]
    owner: Sales/CS/Finance and SRE
    data_quality: purpose-limited time receipt and allocation rule digest bind every hour
    unknown_handling: missing expected support receipts makes UNKNOWN; zero hours requires complete capture evidence
    threshold: no more than 4.0 hours/month
    healthy_issue_code: NONE
    breach_action: RESTORE_SUPPORT_CAPACITY; above 8.0 for two months applies commercial_pause while existing contracts remain safely supported
  BM-TRUST-HARD-STOP-COUNT:
    version: 1
    unit: incidents
    decision_use: non-negotiable continuation gate
    population: independently validated commercial trust-firewall incidents
    window: trailing 12 months and lifetime unresolved
    formula: count_distinct(incident_id where classification in HARD_STOP and not invalidated)
    sources: [ops.incident_events, ops.audit_events, editorial.conflict_snapshots]
    exclusions: [unsubstantiated duplicate report, invalidated incident while preserving history]
    owner: Trust/Privacy/Legal and Editorial duty
    data_quality: incident classification, evidence, affected scope, owner, containment, and closure review are present
    unknown_handling: an unresolved suspected hard stop sets metric status UNKNOWN with reasonCode TRUST_REVIEW_OPEN and blocks scale until classified; it is never treated as zero
    threshold: zero; one confirmed event immediately applies hard_stop_effect
    healthy_issue_code: NONE
    breach_action: CONTAIN_TRUST_INCIDENT immediately; no growth, revenue, margin, expansion, or renewal metric can offset it

commercial_stage_target_contract:
  stages: [PILOT, GENERAL_AVAILABILITY]
  resolver:
    PILOT: applies from the first current paid-workspace contract until a current non-reversed GENERAL_AVAILABILITY sku-readiness evaluation is READY at or before cutoff
    GENERAL_AVAILABILITY: applies only from the exact GA readiness decision_effective_at forward while every mandatory GA item remains current; expiry/blocker returns decision state UNKNOWN/BLOCKED and never silently falls back to the lower pilot target
    forbidden: date, customer count, revenue, operator flag, route, or current tariff label cannot infer stage
  targets:
    PILOT: {p75_variable_gross_margin_min: '0.600000', actual_variable_gross_margin_min: '0.600000'}
    GENERAL_AVAILABILITY: {p75_variable_gross_margin_min: '0.700000', actual_variable_gross_margin_min: '0.700000'}
  value_kinds:
    P75_PROJECTED: versioned tariff usage-assumption distribution, complete cost/FX set, and formula digest; it proves proposed price/quota sustainability, not actual realized margin
    ACTUAL_CLOSED_MONTH: recognized revenue and complete actual cost for one closed accounting month; it cannot substitute for proposed-offer P75 evidence
  eligibility_rule: Expansion and renewal require both the declared number of ACTUAL_CLOSED_MONTH results and the applicable P75_PROJECTED result for the exact current/proposed OfferProfileV1. Passing one kind cannot fill the other.

commercial_eligibility_projection_contract:
  type: CommercialEligibilityProjectionV1
  additional_properties: false
  fields:
    schemaVersion: const<1>
    projectionKind: enum<EXPANSION|RENEWAL>
    subjectRootHmac: lowercase HMAC-SHA-256 under the commercial decision domain; never raw contract/customer identity
    qualificationEpisodeHmac: lowercase HMAC-SHA-256
    sku: const<EVIDENCE_WORKSPACE_ORGANIZATION_V1>
    offerProfileId: uuid
    offerProfileDigest: sha256
    currentContractRootId: uuid internal-only
    currentContractHeadDigest: sha256
    applicableStage: enum<PILOT|GENERAL_AVAILABILITY>
    stageDecisionDigest: sha256
    state: enum<ELIGIBLE|INELIGIBLE|UNKNOWN|NOT_MATURE|NOT_APPLICABLE>
    predicateResults: ordered-array<CommercialEligibilityPredicateV1>[1..64]
    actualEconomics: ordered-array<CommercialEconomicsWindowV1>[0..2]
    p75Economics: CommercialP75EconomicsV1
    primaryReasonCode: closed eligibility reason
    owner: OperationalOwnerBindingV1
    nextReviewAt: datetime
    asOf: datetime
    formulaDigest: sha256
    transitiveInputSetDigest: sha256
    projectionDigest: sha256
  CommercialEligibilityPredicateV1:
    additional_properties: false
    fields: {ordinal: int32, code: closed eligibility predicate, state: 'enum<PASS|FAIL|UNKNOWN|NOT_APPLICABLE>', evidenceDigest: sha256, owner: OperationalOwnerBindingV1, remediationCode: closed-remediation-code}
  CommercialEconomicsWindowV1:
    additional_properties: false
    fields: {window: ClosedMetricWindowV1, kind: 'const<ACTUAL_CLOSED_MONTH>', revenueKrw: nullable-decimal-string, variableCostKrw: nullable-decimal-string, marginRate: nullable-decimal-string, status: 'enum<KNOWN|UNKNOWN>', inputSetDigest: sha256}
  CommercialP75EconomicsV1:
    additional_properties: false
    fields: {kind: 'const<P75_PROJECTED>', tariffVersionId: uuid, tariffDigest: sha256, assumptionDigest: sha256, p75RevenueKrw: nullable-decimal-string, p75VariableCostKrw: nullable-decimal-string, p75MarginRate: nullable-decimal-string, applicableThreshold: decimal-string, status: 'enum<KNOWN|UNKNOWN>', inputSetDigest: sha256}
  expansion_population: every matured revenue-qualified episode in the declared two-month window; unoffered capability is NOT_APPLICABLE and unknown predicates make the aggregate UNKNOWN
  renewal_population: set-equal to every current non-superseded contract root ending in (as_of,as_of+60 days]; inactive, unprovisioned, blocked, cancelled, immature, and unknown roots remain typed members rather than disappearing
  no_mutation_rule: ELIGIBLE is a review recommendation only. Applying an expansion, offer change, tariff, contract renewal, capability activation, or quota change requires its existing typed proposal, independent approval, expected-version fence, execution, and durable receipt.

commercial_control_contract:
  projection_states: [NORMAL, PAUSE_PROPOSED, PAUSED, HARD_STOP_BLOCKED, RESUME_PROPOSED, ACKNOWLEDGEMENT_PENDING, UNKNOWN]
  actions: [PAUSE_NEW_GA_SALES, PAUSE_PAID_ACQUISITION, SUSPEND_AFFECTED_PAID_CAPABILITY, RESUME_NEW_GA_SALES, RESUME_PAID_ACQUISITION, REACTIVATE_PAID_CAPABILITY]
  trigger_rule: A metric threshold, commercial_pause condition, or trust hard stop creates a read-only BusinessControlTriggerV1 projection. Metrics and dashboards never mutate sales, contract, provider, capability, tariff, editorial, or accounting state.
  BusinessControlTriggerV1:
    additional_properties: false
    required_fields: [triggerId, triggerKind, exactMetricResultDigests, triggerPolicyDigest, affectedScopeDigest, requiredActions, state, primaryOwner, backupOwner, firstObservedAt, decisionDueAt, evidenceSetDigest, triggerDigest]
  proposal:
    type: BusinessControlProposalV1
    binds: trigger digest, exact frozen metric/dependency/input digests, affected SKU/offer/capabilities/channels/acquisition sources, requested actions, current kill-switch/capability/contract versions, reason, consequence, existing-customer continuity plan, and expiry
    proposer: current primary or backup owner binding with capability; proposal alone changes nothing
  approval:
    quorum: one authorized approver distinct from proposer plus every specialized gate required by action; trust hard-stop classification/resume requires Trust/Privacy/Legal and an independent executive approver, while commercial pause/resume requires Finance/Product/SRE
    exact_binding: decision binds proposal ID/version/digest, trigger/evidence digest, action set, expected versions, expiry, and approver role-binding HMAC
    invalidation: any changed metric input, incident/closure evidence, capability/kill-switch version, affected scope, expiry, or offer/contract digest invalidates the decision
  execution:
    product_effect: existing typed kill-switch and capability activation/suspension operations execute with expected-version fence; partial, stale, ambiguous, or unauthorized execution is RECONCILIATION_REQUIRED and never reported PAUSED/RESUMED
    external_effect: because sales, paid-media buying, cash, and contracting are outside product mutation APIs, a signed CommercialControlImportReceiptV1 records the external system/version/action and a distinct accountable CommercialControlAcknowledgementV1 confirms application
    atomic_receipt: action execution receipt, resulting kill-switch/capability versions, external import/ack bindings when applicable, audit, and exact trigger/proposal/decision digests are durably linked; missing external acknowledgement leaves ACKNOWLEDGEMENT_PENDING
  hard_stop:
    fail_closed_fence: A current independently validated hard-stop incident immediately makes the affected paid capability ineligible at every execution boundary before a human command; no revenue or sample threshold can override it.
    containment: owner opens the exact suspension/sales-pause proposal immediately and completes approval/execution/import/ack. Failure of the control workflow preserves the fail-closed block and opens an incident.
  resume:
    prerequisites: current closure receipt, remedy verification, restored rights/privacy/isolation/reconciliation/readiness, no remaining trigger, fresh metric/input digests, and explicit rollback/recovery evidence
    same_digest_rule: The resume proposal, every approval, product execution, external import, and acknowledgement bind the same canonical resume evidence-set digest and the exact original pause/hard-stop receipt digest.
    independence: Resume proposer and final approver are distinct; at least one final approver did not approve the action/evidence that caused the original trigger, and trust resume includes independent Trust/Privacy/Legal review.
    no_expiry_resume: time passage, metric recovery alone, acknowledgement, contract renewal, or kill-switch expiry cannot resume service without the exact independently approved execution receipt.
  durable_types:
    CommercialControlImportReceiptV1: {additional_properties: false, fields: {sourceSystemId: closed configured adapter, sourceRecordIdentityHmac: sha256, sourceVersion: string, action: closed commercial control action, effectiveAt: datetime, sourceRecordDigest: sha256, sourceSignatureDigest: sha256, importReceiptDigest: sha256}}
    CommercialControlAcknowledgementV1: {additional_properties: false, fields: {importReceiptDigest: sha256, acknowledgedAction: closed commercial control action, observedExternalVersion: string, acknowledgedByRoleBindingHmac: sha256, acknowledgedAt: datetime, evidenceDigest: sha256, acknowledgementDigest: sha256}}

metric_decision_thresholds:
  scale_candidate:
    requirements:
      - BM-ACTIVATION-7D-RATE >= 0.80 with eligible_n >= 10
      - BM-ACTIVATION-TTFPV-P90 <= 336 hours with eligible_n >= 10
      - BM-RETENTION-D29-56-RATE >= 0.70 with eligible_n >= 10
      - BM-FUNNEL-PILOT-TO-PAID-RATE >= 0.30 with eligible_n >= 10
      - BM-MARGIN-VARIABLE-GROSS-RATE >= applicable stage target for two closed months
      - BM-BILLING-RECONCILIATION-COVERAGE = 1.0
      - BM-SUPPORT-HOURS-PER-ACTIVATED-ORG <= 4.0
      - BM-TRUST-HARD-STOP-COUNT = 0
      - all mandatory readiness and trust/legal/privacy/quality hard gates are READY
  improvement_loop:
    cadence: monthly
    trigger: any scale requirement misses while no immediate hard stop applies
    response: keep service truthful, identify the largest funnel/quality/cost loss, assign owner and dated experiment, preserve formula/cohort, and review the next matured cohort
  commercial_pause:
    triggers:
      - activation 7-day rate below 0.50 for two consecutive matured cohorts with eligible_n >= 10 each
      - retention rate below 0.50 for two consecutive matured cohorts with eligible_n >= 10 each
      - pilot-to-paid rate below 0.20 for two consecutive matured cohorts with eligible_n >= 10 each
      - actual variable gross margin below 0.40 for two consecutive closed months or contribution margin <= 0 for one closed month
      - support hours above 8.0 per activated organization for two consecutive closed months
      - CAC payback above 18 months for two consecutive eligible cohorts
    effect: pause new general-availability sales and paid acquisition, honor existing contracts safely, run a dated corrective review, and require independent finance/product/SRE approval to resume
  product_kill_review:
    trigger: after at least 20 matured qualified organizations, both activation 7-day rate < 0.50 and retention < 0.50 across two consecutive cohorts despite two decision-documented improvement cycles
    effect: executive stop/pivot review; do not mask failure by changing cohort, formula, exclusions, free boundary, or trust gates

risk_register:
  BM-RISK-001-MARKET-JOB-FIT:
    signal: activation, retention, pilot-to-paid, and paid MVW depth miss together
    owner: Product/PdM
    mitigation: interview the exact matured cohort, repair the largest journey loss, and run one versioned experiment without changing the outcome definition
    escalation: commercial_pause and product_kill_review thresholds above
  BM-RISK-002-DATA-RIGHTS-QUALITY:
    signal: source rights, coverage, freshness, parser quality, snapshot reproduction, or exact locator is BLOCKED/UNKNOWN
    owner: Data/Engineering with Trust/Privacy/Legal
    mitigation: stop affected ingestion/output, preserve last-known truth, show limitation, repair source/contract/parser, and re-evaluate from an immutable snapshot
    escalation: no DATA_READY or paid MVW from the affected evidence; production processing without rights is an immediate hard stop
  BM-RISK-003-AI-PROVENANCE:
    signal: model/tool revision, source use, citation locator, counter-evidence, or human-review binding is absent or stale
    owner: AI/Data Engineering and independent reviewer
    mitigation: abstain, quarantine the run, preserve provider/tool evidence, and require a corrected reviewed packet
    escalation: zero paid value for the run; repeated material provenance failure blocks the AI capability, not the human evidence workflow
  BM-RISK-004-BILLING-INTEGRITY:
    signal: usage receipt gap, invoice membership mismatch, non-half-even amount, duplicate membership, or revenue over-recognition
    owner: Sales/CS/Finance and Data/Engineering
    mitigation: block invoice close/revenue claim, append corrections, reconcile exact source sets, and notify affected customer when required
    escalation: reconciliation below 1.0 blocks post-billing readiness; billing UNKNOWN usage is an immediate hard stop
  BM-RISK-005-VARIABLE-COST:
    signal: provider/model/storage/support cost growth, capture below threshold, or margin below stage target
    owner: SRE and Sales/CS/Finance
    mitigation: improve workload efficiency, routing, quota, tariff, or support design under current quality/trust gates
    escalation: margin/support commercial_pause thresholds above; never reduce evidence, privacy, review, or recovery controls
  BM-RISK-006-ACQUISITION-EFFICIENCY:
    signal: CAC payback exceeds 12 months, attribution is UNKNOWN, or one paid channel has weak retained-value cohorts
    owner: Sales/CS/Finance and Product/PdM
    mitigation: pause the weak channel, preserve privacy-safe attribution, and reallocate only after matured activation/retention evidence
    escalation: CAC payback above 18 months for two eligible cohorts pauses paid acquisition
  BM-RISK-007-SUPPORT-OPERABILITY:
    signal: support exceeds 4 hours per activated organization/month, unresolved at-risk blockers, or missing primary/backup owner
    owner: Sales/CS and SRE
    mitigation: remove recurring friction, improve runbooks/self-diagnosis, set truthful capacity, and narrow new onboarding
    escalation: support above 8 hours for two months pauses new GA sales
  BM-RISK-008-SLA-RECOVERY:
    signal: SLA breach, telemetry gap, restore failure, unresolved incident, or missing service-credit evidence
    owner: SRE
    mitigation: contain, reconcile, restore, publish truthful status to the customer, append service credit when due, and verify the recovery receipt
    escalation: affected capability is BLOCKED/UNKNOWN; repeated threshold failure enters commercial pause review
  BM-RISK-009-INDEPENDENCE-PRIVACY:
    signal: customer identity reaches editorial priority, cross-deployment access, tenant data reuse, rights bypass, or material conflict nondisclosure
    owner: Trust/Privacy/Legal and Editorial duty
    mitigation: immediate containment, access revocation, evidence preservation, independent investigation, notice/remedy, and control revalidation
    escalation: immediate commercial hard stop regardless of revenue, sample size, or other metrics
  BM-RISK-010-CONCENTRATION:
    signal: source, provider, acquisition channel, customer, or funder concentration prevents an independent fallback or creates material influence risk
    owner: Executive approver with Finance, SRE, and Editorial independence
    mitigation: show the concentration with counts/intervals, add a tested fallback, diversify only through reviewed channels, and disclose conflicts/funding as required
    escalation: missing fallback blocks scale; a material independence conflict invokes BM-RISK-009

database_requirements:
  existing_authoritative_relations:
    - ops.acquisition_source_receipts
    - ops.commercial_contract_periods
    - ops.tariff_versions
    - ops.usage_window_receipts
    - ops.usage_facts
    - ops.discount_decisions
    - ops.invoice_facts
    - ops.invoice_line_facts
    - ops.invoice_usage_memberships
    - ops.revenue_facts
    - ops.accounting_corrections
    - ops.outcome_facts
    - ops.cost_allocations
    - ops.sku_readiness_evaluations
    - ops.sku_readiness_items
    - ops.sli_window_receipts
    - ops.incident_events
    - ops.audit_events
    - core.dataset_snapshots
  required_existing_contract_alignments:
    sku_readiness_catalog:
      physical_contract_status: CLOSED
      current_truth: specs/database/addendum/0029-invoice-revenue-sku.yaml#sku_readiness_catalog now names PILOT_ENTRY_READINESS, declares the exact 14/17/18 mandatory counts, exact twelve conditional-offered rows, and 26/29/30 visible item counts. Migration, generated inventory, and runtime subset proof remain release work.
      closed_contract:
        mandatory_all_stages_exactly_14: [PAID_WORKSPACE_PROCESSING_ACTIVE, DEPLOYMENT_ISOLATION_PROVEN, OIDC_AND_ROSTER_READY, DATA_STORES_KEYS_QUEUES_ISOLATED, SOURCE_RIGHTS_CONFIGURED, TELEMETRY_ALERTS_RUNBOOK_READY, BACKUP_RESTORE_PROVEN, INCIDENT_OWNERSHIP_READY, CURRENT_CONTRACT_PERIOD, CURRENT_TARIFF_VERSION, BILLING_RECONCILIATION_PATH_READY, COST_CAPTURE_PATH_READY, P75_VARIABLE_GROSS_MARGIN, SUPPORT_CAPACITY]
        conditional_offered_exactly_12:
          PUBLIC_WEB_ACTIVE: PUBLIC_WEB
          VERIFIED_EMAIL_ACTIVE: VERIFIED_EMAIL
          API_EXPORT_ACTIVE: API_EXPORT
          SIGNED_WEBHOOK_ACTIVE: SIGNED_WEBHOOK
          DAILY_DIGEST_ACTIVE: DAILY_DIGEST
          WEEKLY_DIGEST_ACTIVE: WEEKLY_DIGEST
          SMS_ADAPTER_ACTIVE: delivery.sms
          TELEGRAM_ADAPTER_ACTIVE: delivery.telegram
          WHATSAPP_ADAPTER_ACTIVE: delivery.whatsapp
          LINE_ADAPTER_ACTIVE: delivery.line
          KAKAO_ADAPTER_ACTIVE: delivery.kakao
          VOICE_ADAPTER_ACTIVE: delivery.voice
        stage_counts:
          PILOT_ENTRY_READINESS: {mandatory_count: 14, item_count_before_offered_requirement: 26, margin_threshold: 0.600000}
          POST_FIRST_BILLING_CYCLE: {mandatory_count: 17, item_count_before_offered_requirement: 29, margin_threshold: 0.600000}
          GENERAL_AVAILABILITY: {mandatory_count: 18, item_count_before_offered_requirement: 30, margin_threshold: 0.700000}
        count_rule: required_item_count equals stage mandatory_count plus the number of explicitly offered conditional rows; all stage-relevant conditional rows remain visible as NOT_APPLICABLE/UNCONFIGURED so item_count does not depend on the offer.
        verified_workflow_rule: FIRST_PAID_VERIFIED_WORKFLOW_CYCLE accepts only paid_mvw_contract eligibility, not any terminal outcome fact.
        production_rule: Post-first-billing actual reconciliation, cost capture, and first paid workflow use production immutable facts; CAC remains GA-only.
    outcome_terminal_registry:
      - Every terminal_receipt_kind has one exact physical candidate-key/digest resolver; ORGANIZATION_DECISION cannot remain a symbolic kind.
      - Paid eligibility additionally validates PaidEvidencePacketV1 and the strict allowed pair; general outcome facts remain useful operational facts but do not become paid MVW.
    invoice_membership:
      - Zero-overage included usage receives an immutable reconciliation membership result even though no zero-quantity invoice charge line is created.
      - Any due PARTIAL/UNKNOWN usage makes the reconciliation status UNKNOWN/BLOCKED rather than shrinking the due population.
    operation_projection:
      - Business metric read functions return closed scalar/composite types, formula and input digests, and typed unknown reasons; serde_json::Value or free-form metric maps are forbidden.
  additive_relation_budget:
    required_cross_file_relations_exactly: [ops.commercial_qualification_receipts]
    relation_purpose: one append-only human qualification-episode decision receipt authority; it is the sole business-model relation this contract requests beyond the current physical catalog
    new_general_lifecycle_relations_forbidden: [ops.commercial_lifecycle_facts, ops.commercial_stage_facts, ops.commercial_stage_events, ops.funnel_stage_facts, ops.customer_lifecycle_events]
    new_stage_events_exactly: []
    non_qualified_stage_rule: CONFIGURED, DATA_READY, FIRST_PAID_VALUE, ACTIVATED, RETAINED, AT_RISK, and CHURNED are deterministic read projections over the named existing immutable relations. They are never imported, written, cached as authority, corrected through a stage ledger, or emitted as a general commercial lifecycle event.
    cache_rule: A materialized/cache representation may exist only as a rebuildable non-authoritative derivative that carries the exact source-set/formula/policy/as_of digest, is denied to qualification/accounting writers, and can be dropped without losing business truth.
    validator_rule: The required relation set and forbidden relation/event names are checked across database inventory, persistence registry, domain events, API DTOs, migrations, and generated manifests; an alias or generic fact table does not evade the budget.
  required_new_authority:
    name: ops.commercial_qualification_receipts
    cross_file_status: DECISION_COMPLETE_AWAITING_INDEPENDENT_REVIEW
    authority_kind: QUALIFICATION_EPISODE_RECEIPT_ONLY
    reason: Only the human commercial qualification-episode decision is not derivable from current immutable product/economics facts. Every later stage is projected and must not create a general commercial-stage ledger or event stream.
    migration: 0029_product_economics.sql after ops.accounting_corrections as creation ordinal 21
    inventory_effect_if_adopted: exactly one active relkind-r qualification receipt relation and zero new commercial-stage domain events; owner, persistence, hold, privilege, global inventory and validator registries are updated atomically in the review-required design
    mutation: append-only ORIGINAL/REPLACEMENT/REVERSAL receipt chain with one current leaf per deployment/organization/SKU/qualification_episode_id
    required_fields:
      id: uuid primary key
      root_receipt_id: uuid self-FK; equals id for ORIGINAL
      revision: bigint >= 1
      receipt_effect: enum<ORIGINAL|REPLACEMENT|REVERSAL>
      supersedes_receipt_id: nullable uuid self-FK; required after revision 1
      predecessor_receipt_digest: nullable lowercase sha256; required after revision 1
      qualification_episode_id: uuid; stable for one qualification receipt chain and never reused after churn
      deployment_id: uuid equal to immutable deployment configuration
      organization_id: uuid equal to immutable organization configuration
      sku: enum<EVIDENCE_WORKSPACE_ORGANIZATION_V1>
      decision_effective_at: timestamptz for this exact receipt effect
      first_qualified_at: timestamptz equal to ORIGINAL decision_effective_at and immutable within the episode
      recurring_job_attested: boolean true for an effective qualification
      authorized_data_identified: boolean true for an effective qualification
      authorized_data_feasible: boolean true for an effective qualification
      economic_buyer_role_bound: boolean true for an effective qualification
      operational_owner_role_bound: boolean true for an effective qualification
      independent_reviewer_role_bound: boolean true for an effective qualification
      source_rights_owner_role_bound: boolean true for an effective qualification
      incident_support_owner_role_bound: boolean true for an effective qualification
      pilot_scope_accepted: boolean true for an effective qualification
      success_metric_accepted: boolean true for an effective qualification
      budget_authority_accepted: boolean true for an effective qualification
      support_expectation_accepted: boolean true for an effective qualification
      trust_terms_accepted: boolean true for an effective qualification
      role_binding_hmac_key_version: string[1..100]
      economic_buyer_primary_role_binding_hmac: lowercase HMAC-SHA-256
      economic_buyer_backup_role_binding_hmac: lowercase HMAC-SHA-256 distinct from primary
      operational_owner_primary_role_binding_hmac: lowercase HMAC-SHA-256
      operational_owner_backup_role_binding_hmac: lowercase HMAC-SHA-256 distinct from primary
      independent_reviewer_primary_role_binding_hmac: lowercase HMAC-SHA-256
      independent_reviewer_backup_role_binding_hmac: lowercase HMAC-SHA-256 distinct from primary
      source_rights_owner_primary_role_binding_hmac: lowercase HMAC-SHA-256
      source_rights_owner_backup_role_binding_hmac: lowercase HMAC-SHA-256 distinct from primary
      incident_support_owner_primary_role_binding_hmac: lowercase HMAC-SHA-256
      incident_support_owner_backup_role_binding_hmac: lowercase HMAC-SHA-256 distinct from primary
      source_system_id: string[1..128] closed configured adapter
      source_record_identity_hmac: lowercase HMAC-SHA-256
      acquisition_source_receipt_id: nullable uuid
      acquisition_source_receipt_digest: nullable lowercase sha256 paired with acquisition_source_receipt_id
      source_signature_digest: lowercase sha256
      qualification_policy_version: bigint >= 1
      qualification_policy_digest: lowercase sha256
      criterion_set_digest: lowercase sha256 over the exact thirteen code/boolean pairs in qualification_contract ordinal order
      role_binding_set_digest: lowercase sha256 over the exact five function/primary/backup HMAC triples in qualification_contract ordinal order
      evidence_set_digest: lowercase sha256 over duplicate-free ordered evidence receipt ID/digest bindings
      reason_code: enum<QUALIFICATION_ACCEPTED|SOURCE_CORRECTION|SOURCE_REVERSAL>
      receipt_digest: lowercase sha256 over every immutable business field except recorded_at
      recorded_at: timestamptz default clock_timestamp()
    effective_shape:
      ORIGINAL_OR_REPLACEMENT: all thirteen criteria true, each primary/backup pair present and distinct, reason QUALIFICATION_ACCEPTED or SOURCE_CORRECTION, and exact policy/role/evidence/source digests present
      REVERSAL: preserves scope/episode/first_qualified_at/source/policy identity, reason SOURCE_REVERSAL, and makes the episode unqualified from decision_effective_at forward without deleting history
    uniqueness:
      - [root_receipt_id, revision]
      - [deployment_id, organization_id, sku, qualification_episode_id, revision]
      - one successor per supersedes_receipt_id
      - one active non-reversed qualification episode per deployment/organization/SKU at one as-of instant
      - one acquisition_source_receipt_id+digest pair may bind at most one ORIGINAL qualification episode; requalification requires a fresh attribution receipt or UNKNOWN_SOURCE
    as_of_selection: greatest decision_effective_at, revision, id current chain head whose decision_effective_at <= cutoff; a REVERSAL contributes no current qualified episode from that instant while first_qualified_at remains historical cohort truth
    selection_order: decision_effective_at ASC, revision ASC, id ASC
    privacy: no name, email, phone, address, handle, free text, raw CRM/contact ID, query, cookie, message, or source/response content
    write_boundary: typed signed qualification importer only; SERIALIZABLE, fixed lock order, same-identity/same-digest replay, changed-digest conflict, audit and idempotency receipt atomicity; no stage writer and no commercial-stage outbox event
    mutation_guard: BEFORE UPDATE OR DELETE ops.reject_mutation(); replacement/reversal locks the unique current leaf and appends exactly one successor
    direct_write_grants: none for every runtime role
    function_execute: gurine_workflow_worker only; control-api reads projections and never imports mutable CRM assertions
    select_grants: [gurine_workflow_worker, gurine_control_api, gurine_auditor]
    denied_roles: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_identity_api]
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      schedule: latest effective nonexpired record-class schedule; missing/stale preserves the fact and opens review
      legal_hold_key: [COMMERCIAL_QUALIFICATION_RECEIPT, id, deployment_id, organization_id]
      correction: append replacement/reversal; never rewrite or erase a historical qualification receipt
      source_body: external CRM/contract source bodies follow their own shorter schedule and are not copied into this relation
  required_read_functions:
    ops.read_business_stage_projection_v1: deterministically derives all non-QUALIFIED stages for one qualification episode/as_of/policy digest and returns source/input/freshness/unknown digests; it never writes a stage row/event
    ops.read_paid_mvw_inputs_v1: returns only exact eligible outcome/packet/terminal-receipt bindings; analysis/public/submission roles have no execute
    ops.read_business_health_projection_v1: deterministic as-of metric projection with formula/input/freshness/unknown digests for control-api
    ops.read_invoice_membership_v1: returns complete expected-versus-observed usage membership and blockers
    ops.read_sla_metric_inputs_v1: returns gap-checked contracted capability minute sets and policy target
    ops.read_cac_metric_inputs_v1: returns the complete captured acquisition-cost set before organization attribution filtering and yields UNKNOWN/null on any unattributed, stale, reversed, FX, or correction gap
  required_closed_projection:
    name: PaidEvidencePacketV1
    additional_properties: false
    required_fields:
      schemaVersion: const<1>
      organizationId: uuid
      sku: const<EVIDENCE_WORKSPACE_ORGANIZATION_V1>
      contractPeriodId: uuid
      contractRecordDigest: sha256
      datasetSnapshotIds: unique-array<uuid>[1..10000]
      datasetSnapshotDigests: array<sha256> same length/order as datasetSnapshotIds
      datasetSnapshotSetDigest: sha256
      sourceRightsReceiptIds: unique-array<uuid>[1..10000]
      capabilityActivationReceiptIds: unique-array<uuid>[1..1000]
      activationSetDigest: sha256
      extractionLineageDigest: sha256
      transformationLineageDigest: sha256
      reproductionInputDigest: sha256
      comparisonPopulationDigest: sha256
      exclusionSetDigest: sha256
      supportingEvidenceSetDigest: sha256
      contraryEvidenceSetDigest: sha256; empty set has the canonical empty-set digest, never null
      locatorSetDigest: sha256
      freshnessDigest: sha256
      limitationSetDigest: sha256
      disagreementSetDigest: sha256; empty set has the canonical empty-set digest, never null
      unknownSetDigest: sha256; empty set has the canonical empty-set digest, never null
      aiContributed: boolean
      aiProvenanceDigest: nullable<sha256>; nonnull exactly when aiContributed=true
      humanDecisionId: uuid
      humanDecisionDigest: sha256
      independentReviewDisposition: enum<APPROVED|NOT_REQUIRED_BY_POLICY>
      independentReviewReceiptId: nullable<uuid>; required when disposition=APPROVED and null otherwise
      independentReviewDigest: sha256 of the review receipt or exact not-required policy evaluation
      terminalReceiptKind: enum<OUTBOUND_DELIVERY|ORGANIZATION_DECISION>
      terminalReceiptId: uuid
      terminalReceiptVersion: bigint[1..max]
      terminalReceiptDigest: sha256
      packetDigest: sha256
      persistedAt: datetime UTC
    canonicalization: Gurine Canonical JSON v1 over the exact ordered fields; every member array is duplicate-free and sorted by UUID byte order then digest
    storage_rule: The immutable packet or its closed scalar binding is persisted before an outcome fact can become paid-MVW eligible; an ad hoc JSON projection or audit text is insufficient.
  terminal_receipt_registry_requirement:
    ORGANIZATION_DECISION: resolves one finalized decision cycle through exact action proposal/version, counted action decisions, optional execution receipt chain, packet digest, resulting state, and immutable decision-cycle receipt; ACCEPTED proposal or queued/running execution is rejected
    OUTBOUND_DELIVERY: resolves one applied ops.outbound_delivery_receipts row in DELIVERED or READ plus its delivery/rendering/authorization/packet binding; retry and callback rows do not create another business identity
    rule: The registry is closed and database-validated by terminal_receipt_kind; a symbolic kind without one exact physical candidate key and digest mapping blocks migration and paid-MVW evaluation.
  prohibited_sources:
    - product analytics as a substitute for qualification, derived-stage, or accounting facts
    - raw CRM/contact, billing provider payload, search/response/evidence content, token, filename, cookie, or person identity
    - public editorial projections as commercial identity or revenue inputs

