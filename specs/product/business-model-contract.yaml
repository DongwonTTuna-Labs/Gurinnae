    metric_result_kind_rule: key set equals metrics exactly and value equals the required BusinessMetricResultV1 discriminator; runtime/OpenAPI/client/UI/export schema generation fails on drift
    funnel_stage: [QUALIFIED, CONFIGURED, DATA_READY, FIRST_PAID_VALUE, ACTIVATED, RETAINED, AT_RISK, CHURNED]
    funnel_stage_state: [NOT_STARTED, COMPLETE, LATE, AT_RISK, CHURNED, BLOCKED, UNKNOWN]
