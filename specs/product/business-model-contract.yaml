schema_version: 1
specification_version: 13.1.0-business-model-r3
contract_version: 2026-07-15.business-model.r3
decision_revision: 2
status: REVIEW_REQUIRED
authority:
  archive: gurine-codex-authority-pack-v13.0.0-20260712.zip
  sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
  rule: This contract closes the business-model decisions left implicit by the pinned v13 authority; retired packs and unrelated Gurinnae material are not inputs.

scope:
  sku: EVIDENCE_WORKSPACE_ORGANIZATION_V1
  deployment: one isolated organization per physical deployment
  reporting_currency: KRW
  accounting_timezone: deployment-bound IANA timezone; Asia/Seoul is the first deployment default
  commercial_ui: existing review-console screens only
  no_new_surface: true
  no_self_service_checkout: true
  no_payment_api: true
  contracting_and_cash_collection: signed external operating records imported through typed, audited boundaries

business_thesis:
  customer: Korean investigative newsrooms and public-interest research organizations with 3-20 recurring procurement investigators
  economic_buyer: investigation editor or research director accountable for research throughput and budget
  primary_users:
    - data reporter or civic researcher finding and comparing procurement records
    - investigator building evidence and counter-evidence
    - editor and independent reviewer approving an exact packet or action
    - data operator maintaining sources, snapshots, parsers, and quality
    - operations and finance owner maintaining providers, cost, invoice, SLA, and recovery
  champion: senior investigator or data editor who owns a recurring procurement research program
  required_qualification_roles:
    - economic buyer
    - operational owner
    - independent reviewer distinct from the proposer for exact approvals
    - data/source-rights owner
    - incident and support owner with a named backup
  non_participants:
    - public readers and subscribers
    - response subjects, suppliers, agencies, witnesses, and people appearing in source data
    - sources, correction requesters, appellants, and privacy-rights requesters
  non_participant_rule: Non-participants are never leads, billable units, advertising audiences, cross-session profiles, or product-training inputs; their access and rights do not depend on a customer contract.
  deferred_segments:
    - multi-tenant SaaS
    - self-service checkout and card billing
    - public-agency internal audit product
    - general corporate compliance product
    - commercial ranking, due-diligence scoring, or automated wrongdoing claims

qualification_contract:
  policy_version: 1
  cohort_unit: one deployment_id plus organization_id plus EVIDENCE_WORKSPACE_ORGANIZATION_V1 plus qualification_episode_id
  criterion_registry_ordered_exactly:
    - {ordinal: 1, code: RECURRING_JOB_ATTESTED, field: recurring_job_attested}
    - {ordinal: 2, code: AUTHORIZED_DATA_IDENTIFIED, field: authorized_data_identified}
    - {ordinal: 3, code: AUTHORIZED_DATA_FEASIBLE, field: authorized_data_feasible}
    - {ordinal: 4, code: ECONOMIC_BUYER_OWNED, field: economic_buyer_role_bound}
    - {ordinal: 5, code: OPERATIONAL_OWNER_OWNED, field: operational_owner_role_bound}
    - {ordinal: 6, code: INDEPENDENT_REVIEW_READY, field: independent_reviewer_role_bound}
    - {ordinal: 7, code: SOURCE_RIGHTS_OWNER_OWNED, field: source_rights_owner_role_bound}
    - {ordinal: 8, code: INCIDENT_SUPPORT_OWNER_OWNED, field: incident_support_owner_role_bound}
    - {ordinal: 9, code: PILOT_SCOPE_ACCEPTED, field: pilot_scope_accepted}
    - {ordinal: 10, code: SUCCESS_METRIC_ACCEPTED, field: success_metric_accepted}
    - {ordinal: 11, code: BUDGET_AUTHORITY_ACCEPTED, field: budget_authority_accepted}
    - {ordinal: 12, code: SUPPORT_EXPECTATION_ACCEPTED, field: support_expectation_accepted}
    - {ordinal: 13, code: TRUST_TERMS_ACCEPTED, field: trust_terms_accepted}
  criterion_count: 13
  criterion_rule: Every ordered criterion is true under one current qualification policy and evidence-set digest. A missing, false, stale, differently ordered, or policy-mismatched criterion is not qualified and is never silently defaulted.
  decision_times:
    decision_effective_at: the signed human decision instant for this exact ORIGINAL, REPLACEMENT, or REVERSAL receipt; as-of chain selection and reversal effect use this field
    first_qualified_at: the ORIGINAL accepted decision_effective_at, preserved byte-for-byte by every successor in the same episode; it alone assigns the acquisition/qualification cohort and starts configuration observation
    recorded_at: append/import time only; it is never a cohort or funnel clock
    ordering: decision_effective_at ASC, revision ASC, id ASC
    invariants:
      - ORIGINAL has receipt_effect ORIGINAL, decision_effective_at = first_qualified_at, and revision 1.
      - REPLACEMENT and REVERSAL preserve first_qualified_at and have decision_effective_at strictly greater than the predecessor decision_effective_at; neither may backdate qualification or move a cohort.
      - decision_effective_at is no later than recorded_at and no later than the metric cutoff. A future or ambiguous source decision is UNKNOWN.
      - A REVERSAL removes current qualification only from its decision_effective_at forward. Historical as-of results before that instant remain reproducible.
      - Qualification after churn or after a reversal requires a new qualification_episode_id and a new first_qualified_at; an old episode is never reopened.
  role_binding_registry_ordered_exactly:
    - {ordinal: 1, function: ECONOMIC_BUYER, primary_field: economic_buyer_primary_role_binding_hmac, backup_field: economic_buyer_backup_role_binding_hmac}
    - {ordinal: 2, function: OPERATIONAL_OWNER, primary_field: operational_owner_primary_role_binding_hmac, backup_field: operational_owner_backup_role_binding_hmac}
    - {ordinal: 3, function: INDEPENDENT_REVIEWER, primary_field: independent_reviewer_primary_role_binding_hmac, backup_field: independent_reviewer_backup_role_binding_hmac}
    - {ordinal: 4, function: SOURCE_RIGHTS_OWNER, primary_field: source_rights_owner_primary_role_binding_hmac, backup_field: source_rights_owner_backup_role_binding_hmac}
    - {ordinal: 5, function: INCIDENT_SUPPORT_OWNER, primary_field: incident_support_owner_primary_role_binding_hmac, backup_field: incident_support_owner_backup_role_binding_hmac}
  role_binding_rules:
    - Every registry row has two non-null lowercase domain-separated HMAC-SHA-256 bindings under the receipt's declared binding-key version; raw person, account, email, directory, CRM, or contact identifiers are forbidden.
    - Within each function primary and backup HMACs are distinct. A missing or same-person backup fails qualification.
    - Small-team cross-function reuse is allowed except that the actor counted as independent reviewer for an exact packet/action must be distinct from its proposer and must satisfy the action-time recusal and authorization policy. Qualification assignment alone never proves decision independence.
    - Role changes append a REPLACEMENT receipt with a new role-binding-set digest. A stale role binding blocks later configuration, review, incident, support, renewal, and resume decisions that depend on it.
  acquisition_binding:
    optional_at_qualification: true
    known_shape: acquisition_source_receipt_id and acquisition_source_receipt_digest identify one same-organization current non-reversed receipt valid at first_qualified_at
    unknown_shape: both fields are null and attribution state is UNKNOWN_SOURCE; qualification may remain valid but channel allocation, CAC, and payback remain blocked as declared below
    pair_rule: exactly both fields or neither; a stale, reversed, cross-organization, reused-episode, or digest-mismatched pair is ATTRIBUTION_UNKNOWN
  canonical_digests:
    criterion_set_digest: Gurine Canonical JSON v1 SHA-256 over the thirteen code/boolean pairs in criterion_registry_ordered_exactly order
    role_binding_set_digest: Gurine Canonical JSON v1 SHA-256 over function, primary HMAC, and backup HMAC in role_binding_registry_ordered_exactly order
    qualification_receipt_digest: Gurine Canonical JSON v1 SHA-256 over every immutable business field except recorded_at, including both decision times and all ordered digests

first_sku_contract:
  sku: EVIDENCE_WORKSPACE_ORGANIZATION_V1
  sale_unit: one isolated single-organization Evidence Workspace deployment; there is no second tier, tenant switcher, self-service checkout, or payment entitlement
  core_paid_capabilities:
    - authorized private source ingestion and immutable reproducible snapshots
    - permitted multimodal batch analysis with exact tool/model/source provenance
    - saved queries and cohorts with scheduled refresh
    - team annotation, contrary-evidence handling, independent review, and exact-digest approval
    - persisted packet and audited organization decision, export, or delivery receipt
    - usage, quality, cost, recovery, support, and audit evidence
  base_meter_contract:
    active_contributors: ten are included; read-only viewers are not a billable meter in v1; additional active contributors are sold only in blocks of ten
    processing_credits: included quantity and unit price come from the signed tariff; reserve maximum before work and settle actual versioned job/provider credits
    storage_gb_month: decimal encrypted GB-month using the exact byte-hour formula in usage_receipt_contract
    api_record_unit: exactly 1000 normalized records successfully returned
    signed_webhook_and_digest: included bounded quotas only in v1; exhaustion is visible and no undeclared overage line is permitted
  default_offer_template:
    template_is_not_authority: true
    included_by_default: [PUBLIC_WEB, VERIFIED_EMAIL, API_EXPORT, SIGNED_WEBHOOK, DAILY_DIGEST, WEEKLY_DIGEST]
    not_included_by_default: [SMS, TELEGRAM, WHATSAPP, LINE, KAKAO, VOICE]
    rule: The default is a sales drafting aid only. The signed OfferProfileV1 exact subset bound by the current contract is authority; an omitted capability is NOT_OFFERED, not implicitly included.
  value_loop_ordered_exactly:
    - authorize source rights, contract, offer, tariff, isolation, and owners
    - produce the first non-empty immutable reproducible snapshot with visible limitations
    - save one scoped query or cohort and schedule the next authorized refresh
    - detect changed evidence and preserve source, parser, transformation, and comparison provenance
    - assemble supporting, contrary, unknown, freshness, and limitation evidence into PaidEvidencePacketV1
    - obtain exact human decision and independent-review disposition
    - complete one finalized organization decision or reconciled DELIVERED/READ audited delivery
    - show the durable value/cost/recovery receipt and create the next scoped watch without automatic external action
  loop_measurement:
    activation: the first strict paid MVW after DATA_READY closes the first loop
    retention: two additional strict paid MVWs in the fixed days-29-through-56 window prove repeat use; notifications or page views never substitute
    expansion_and_renewal: require repeated value plus actual economics, P75 tariff economics, readiness, support, SLA, trust, and exact OfferProfileV1 evidence; no metric auto-mutates the contract

value_delivery:
  job_to_be_done: When a team repeatedly investigates procurement records across documents and updates, produce a reviewable and reproducible evidence packet without rebuilding collection, extraction, comparison, collaboration, approval, and delivery by hand.
  paid_outcome_type: PaidEvidencePacketV1
  paid_outcome_required_members:
    - authorized immutable dataset snapshot and member-set digest
    - source rights and capability activation receipts valid for the work interval
    - extraction and transformation lineage with parser and model/tool revisions
    - comparison population, exclusions, and deterministic reproduction inputs
    - supporting evidence, contrary evidence, and exact source locators
    - freshness, limitations, disagreement, and unknown-state disclosure
    - AI proposal provenance when AI contributed, including provider turns, tool calls, and citations
    - human decision and exact content/action digest
    - independent review or an explicit policy-backed not-required decision
    - durable persisted-packet, export, organization-decision, or audited-delivery receipt
  paid_value:
    - repeatable private authorized collection and snapshots
    - permitted multimodal batch analysis with provenance
    - collaboration, annotation, independent review, and exact-digest approval
    - saved queries/cohorts, scheduled processing, export/API integration, quota, SLA, and support
    - usage, quality, cost, audit, and recovery evidence
  not_value:
    - page view, login, setup, fixture, synthetic run, draft, failed job, or raw signal
    - triage alone, reviewed investigation alone, or accepted proposal before a responsible terminal outcome
    - unreviewed AI output, model confidence, generated prose, or citation UUID without opened evidence
    - signed but inactive/unprovisioned contract, invoice without value, or recognized revenue without a paid workflow
  success_promise: A qualified team reaches its first paid verified workflow within 7 days of authorized data readiness; P90 must be no more than 14 days.

commercial_trust_firewall:
  invariants:
    - Payment never changes detection thresholds, source priority, case priority, factual wording, publication timing, response opportunity, correction priority, or evidence and approval gates.
    - Customer data never enters public editorial work, model training, cross-deployment analysis, fundraising, or another customer deployment.
    - Billing, customer, contract, invoice, acquisition, and funder identity is unavailable to public, submission, detection, and editorial-priority paths.
    - Customer output is labelled as customer-controlled work and is not an official Gurinnae finding.
    - A related public case requires disclosure, recusal, independent review, and the ordinary publication gate; no commercial receipt satisfies an editorial gate.
    - Cost or margin failure changes price, quota, efficiency, support, or sale decisions only; it never weakens evidence, privacy, rights, correction, response, accessibility, or approval behavior.
  hard_stop_conditions:
    - unauthorized customer-data reuse or cross-deployment access
    - commercial influence on editorial/detection/correction/public access
    - material unreported conflict, fabricated metric receipt, or billing from unknown usage
    - production processing without current source rights, privacy basis, or capability activation
  hard_stop_effect: Suspend the affected paid capability, preserve evidence, open an incident, notify accountable trust owners, and block new sales/renewal until independently closed; never silently degrade a trust gate.

free_public_access_policy:
  free_forever:
    - public facts, evidence locators, source links, and current public revisions
    - corrections, retractions, limitation notices, and revision history
    - right of reply, response submission/status, appeal, correction, rights, and privacy requests
    - methodology, rule behavior, source coverage/freshness, funding, governance, conflict, and editorial-independence disclosures
    - basic verified subscriptions and reasonable public API/export for public records
  prohibited_paywalls:
    - evidence required to understand or verify a public claim
    - response, correction, appeal, privacy, accessibility, or unsubscribe flows
    - adverse history, uncertainty, counter-evidence, funding, or conflicts
  fair_use_rule: Abuse controls may rate-limit by a documented content-neutral policy, but payment cannot buy factual completeness, priority, suppression, or a weaker safety gate.
  customer_contract_may_gate_only:
    - isolated private-workspace provisioning and private authorized source ingestion
    - private multimodal batch analysis, saved cohorts, scheduled refresh, collaboration, independent review, and audited organization-controlled delivery
    - organization-only API/export, signed webhook, selected messenger adapters, quota, SLA, support, and private audit/economics evidence
  boundary_invariants:
    - A paid private packet may cite a free public fact, but the public fact, locator, revision, limitation, counter-evidence, correction, response, appeal, privacy route, and verification evidence remain reachable without the customer contract.
    - Contract expiry, suspension, quota exhaustion, invoice failure, churn, or a commercial hard stop may block private processing and delivery only; it cannot remove, truncate, delay, or make less verifiable any free_public_access_policy.free_forever member.
    - Free public access is not a trial tier, acquisition discount, metered preview, or paid-workspace entitlement. Paid workspace value is private repeated workflow execution and accountable receipts, never exclusive factual completeness.
    - The same source object may participate in both boundaries only through separately authorized projections with distinct scope and evidence digests; customer identity and private work never enter the public projection.

funnel_contract:
  subject: one deployment_id plus organization_id plus EVIDENCE_WORKSPACE_ORGANIZATION_V1
  episode_rule: An ORIGINAL accepted ops.commercial_qualification_receipts row creates a random qualification_episode_id and immutable first_qualified_at; every derived stage is scoped to that episode, and post-churn or post-reversal requalification creates a new ID so historical and current cohorts cannot merge.
  time_model: half-open intervals [start,end) evaluated in the contract accounting timezone and persisted as UTC instants
  correction_model: append-only original/replacement/reversal facts; current state uses the unique non-reversed chain head as of the metric cutoff
  analytics_rule: ops.product_events may prove ordered workflow milestones but never by themselves establish a commercial stage, paid MVW, invoice, revenue, churn, or retention fact
  projection_rule: Except for QUALIFIED, no commercial stage row or event is persisted. CONFIGURED, DATA_READY, FIRST_PAID_VALUE, ACTIVATED, RETAINED, AT_RISK, and CHURNED are deterministic as-of projections over the exact immutable sources named below; the same source snapshot, formula version, policy digest, and cutoff must return byte-equivalent stage evidence.
  stages:
    QUALIFIED:
      entered_when: the current non-reversed immutable qualification receipt passes all thirteen qualification_contract.criterion_registry_ordered_exactly members under one policy, criterion, role-binding, and evidence-set digest
      cohort_entered_at: immutable first_qualified_at from the ORIGINAL accepted receipt; replacement, import delay, or metric recomputation never moves it
      current_decision_at: current head decision_effective_at; this controls as-of validity and reversal without replacing cohort_entered_at
      criteria: exact qualification_contract.criterion_registry_ordered_exactly in ordinal order; no prose subset or aggregate boolean may substitute
      cannot_be_inferred_from: [lead, contact, page_view, acquisition_receipt, meeting, proposal, unsigned_quote]
    CONFIGURED:
      entered_when: the deterministic as-of projection finds a current ACTIVE and PROVISIONED contract period, matching deployment configuration, APPROVED and ACTIVE PAID_WORKSPACE_PROCESSING decision/evidence, and satisfied OIDC/roster/isolation readiness items for the qualification episode
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.capability_activation_decisions, ops.capability_activation_evidence, ops.sku_readiness_evaluations, ops.sku_readiness_items]
      blocked_when: any required receipt is missing, expired, suspended, fixture-only, or for another configuration/environment
    DATA_READY:
      entered_when: the deterministic as-of projection finds the earliest cutoff at which the core pilot readiness profile is READY, at least one non-empty authorized DatasetSnapshot is immutable/reproducible, and source freshness/coverage/limitations/rights evidence is current for the episode
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.sku_readiness_evaluations, ops.sku_readiness_items, core.dataset_snapshots]
      clock_start: earliest qualifying readiness evidence_cutoff_at; a later query may not backdate it from mutable state
      cannot_be_inferred_from: [connector_green_without_snapshot, source_run_started, fixture_snapshot, unreviewed_parser_output]
    FIRST_PAID_VALUE:
      entered_when: the deterministic as-of projection selects the earliest strict paid-MVW-eligible current outcome head at or after data_ready_at and within a current active contract period for the episode
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts, ops.outbound_delivery_receipts, ops.audit_events]
      clock_end: paid outcome effective_from
      uniqueness: one projected first-value outcome per organization, SKU, and qualification episode; a corrected-away candidate recomputes to the next eligible outcome in that episode or UNKNOWN
    ACTIVATED:
      entered_when: projected FIRST_PAID_VALUE exists; activation is on-time when elapsed time from projected DATA_READY is at most 7x24 hours and late when greater than 7x24 hours
      service_objective: P90 elapsed time is at most 14x24 hours
      late_rule: A value after 14 days still records truthful activation but fails both the 7-day rate and the P90 objective; it is never backdated.
    RETAINED:
      stage_class: fixed_cohort_milestone
      entered_when: an activated organization completes at least two additional strict paid MVWs in [activation_at + 29 days, activation_at + 57 days); current trailing-30-day health is deliberately not part of this immutable fixed-window milestone
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts]
      cohort_maturity: evaluate the days-29-through-56 result only when as_of is at least activation_at + 57 days
      early_churn_rule: ENDED or CANCELLED before day 57 remains in the matured denominator and is a retention failure. Contract termination, loss of access, missing value, or support withdrawal never removes a poor outcome from the fixed cohort.
    AT_RISK:
      stage_class: current_relationship_health_overlay
      entered_when: a non-churned episode is ONBOARDING_AT_RISK or POST_ACTIVATION_AT_RISK under relationship_health_contract; this overlay is reported beside the highest achieved funnel milestone and never rewrites fixed cohort history
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods, ops.outcome_facts, ops.sku_readiness_evaluations, ops.sku_readiness_items, ops.sli_window_receipts]
      exit_when: current receipts prove every active reason cleared under relationship_health_contract; onboarding recovery does not require a fabricated paid MVW, while post-activation inactivity recovery requires a strict paid MVW in the trailing 30 days
      rule: Inactivity may create AT_RISK but never fabricates CHURNED.
    CHURNED:
      entered_when: the deterministic as-of contract projection selects an ENDED or CANCELLED current contract-period leaf and proves no ACTIVE or SUSPENDED replacement interval for the episode; inactivity alone is insufficient
      derived_from: [ops.commercial_qualification_receipts, ops.commercial_contract_periods]
      effective_at: max(terminal contract state_effective_at, contract period_end local-midnight instant)
      reactivation: starts a new qualification_episode_id at QUALIFIED and repeats configuration, data readiness, first paid value, and activation; the prior episode and churn remain immutable.
  allowed_transitions:
    - START -> QUALIFIED
    - QUALIFIED -> CONFIGURED
    - CONFIGURED -> DATA_READY
    - DATA_READY -> FIRST_PAID_VALUE
    - FIRST_PAID_VALUE -> ACTIVATED
    - ACTIVATED -> RETAINED
    - QUALIFIED|CONFIGURED|DATA_READY|FIRST_PAID_VALUE|ACTIVATED|RETAINED -> AT_RISK relationship overlay
    - AT_RISK -> highest still-proven QUALIFIED|CONFIGURED|DATA_READY|FIRST_PAID_VALUE|ACTIVATED|RETAINED milestone when every current risk reason clears
    - QUALIFIED|CONFIGURED|DATA_READY|FIRST_PAID_VALUE|ACTIVATED|RETAINED|AT_RISK -> CHURNED
    - CHURNED -> QUALIFIED in a new qualification episode
  missing_predecessor_rule: A later-stage projection without every required predecessor source is invalid; dashboards report UNKNOWN/BLOCKED and the first missing gate, never silently skip a stage.

relationship_health_contract:
  projection_kind: current as-of overlay; never a persisted general lifecycle fact or a replacement for fixed-window retention
  states: [HEALTHY_ONBOARDING, ONBOARDING_AT_RISK, HEALTHY_ACTIVE, POST_ACTIVATION_AT_RISK, CHURNED, UNKNOWN]
  onboarding_at_risk_reasons:
    - CONFIGURATION_NOT_COMPLETE by first_qualified_at + 14 days
    - DATA_NOT_READY by configured_at + 14 days
    - required readiness, source rights, isolation, owner, billing path, cost path, or telemetry evidence BLOCKED/UNKNOWN for more than 72 hours
    - a current contract or tariff will expire before the next committed onboarding checkpoint without a valid successor
  post_activation_at_risk_reasons:
    - no strict paid MVW in trailing 30 days
    - fixed days-29-through-56 retention failure after maturity
    - required readiness, rights, SLA, support, reconciliation, or trust evidence BLOCKED/UNKNOWN for more than 72 hours
    - a current contract ends within 60 days and renewal projection is INELIGIBLE or UNKNOWN
  early_churn:
    fixed_retention: remains a denominator failure after day-57 cohort maturity
    current_health: becomes CHURNED at the exact contract terminal effective_at; it is not first rewritten as healthy, excluded, or censored
    recovery: only a new qualification episode may re-enter after churn; the old episode's retention and churn remain immutable
  recovery_rules:
    ONBOARDING_AT_RISK: all onboarding blockers have current closure receipts and the next legitimate milestone may be reached; no paid-value event is required before DATA_READY
    POST_ACTIVATION_AT_RISK: all active blockers have current closure receipts and, when NO_PAID_VALUE_30D applied, at least one new strict paid MVW exists in the trailing 30 days
    UNKNOWN: missing evidence must be repaired before HEALTHY; time passage or operator acknowledgement alone is insufficient
  reason_order: [TRUST_REVIEW_OPEN, CONTRACT_NOT_CURRENT, RIGHTS_NOT_CURRENT, CONFIGURATION_MISMATCH, SNAPSHOT_EMPTY_OR_UNREPRODUCIBLE, SLA_TELEMETRY_GAP, INVOICE_MEMBERSHIP_GAP, COST_CAPTURE_INCOMPLETE, NO_PAID_VALUE_30D, RETENTION_WINDOW_FAILED]
  output_rule: Return every active typed reason, firstObservedAt, owner, backup owner, dueAt, nextReviewAt, and evidence digest; choose the primary reason by reason_order without discarding the rest.

activation_measurement_contract:
  clock: elapsed exact seconds from DATA_READY effective_at inclusive to FIRST_PAID_VALUE effective_at exclusive, divided by 3600 using PostgreSQL numeric; calendar-day subtraction, import time, and recorded_at are forbidden
  observation_unit: one qualification episode with valid DATA_READY, fixed to organization, SKU, accounting timezone, cohort, formula/policy digest, and as_of cutoff
  seven_day_rate:
    maturity: include in the decision denominator only when as_of >= data_ready_at + 168 hours or a terminal-without-value contract event occurred earlier
    success: first paid value exists at elapsed hours <= 168
    failure: no qualifying value by 168 hours, a value after 168 hours, or terminal-without-value before 168 hours
    pending: an active episode observed for less than 168 hours; report separately and never place in denominator
  p90_objective:
    horizon: 336 hours
    survivor_bias_decision: Every DATA_READY episode whose 336-hour observation has matured remains in the objective population whether or not it activated. Computing percentile only among activated survivors is forbidden.
    event: first valid paid value at its exact elapsed hours
    right_censor: Only an active, nonterminal episode without value at as_of is right-censored at elapsed(as_of - data_ready_at). A corrected/reversed qualification or DATA_READY input is UNKNOWN, not censored. ENDED/CANCELLED/CHURNED without value is TERMINAL_WITHOUT_EVENT and never non-informatively censored or excluded.
    maturity: Objective threshold is evaluated only over episodes with at least 336 hours observable follow-up or an earlier TERMINAL_WITHOUT_EVENT. Younger active episodes remain pending outside the matured objective denominator.
    estimator: RESTRICTED_EMPIRICAL_P90_OBJECTIVE_V1; let n be the matured population, k = integer_divide(9*n + 9, 10), and x be exact first-value events with elapsed hours <= 336. This answers the declared P90<=336 objective without pretending to identify the post-horizon quantile.
    exact_result: If x >= k, sort only exact timely event hours ascending and select the kth value. estimateState is EXACT, p90Hours is that duration, and no active censor can precede it because every included active censor was observed through 336 hours. Linear interpolation and percentile_cont are forbidden.
    lower_bound_result: If x < k, the true P90 is known to be strictly greater than 336 but its exact late value is not identified. estimateState is EXCEEDS_OBJECTIVE_BOUND, p90Hours is null, lowerBoundHours is 336, boundOperator is GREATER_THAN, and the result is a truthful KNOWN breach for eligibleCount >= 10. No infinity sentinel or fabricated finite latency is emitted.
    right_censor_decision: Because threshold cohorts are 336-hour matured, no active episode may be censored before the objective boundary. A pre-336 cutoff is pending/COHORT_NOT_MATURE rather than an estimable P90.
  corrections: A corrected-away first value recomputes the ordered set at the new cutoff and may turn an exact P90 into a lower bound. Historical metric receipts and ordered-set digests remain immutable.
  small_sample:
    eligible_lt_5: status NOT_APPLICABLE, reason SAMPLE_TOO_SMALL, no rate/P90 claim and no automated verdict; return typed counts plus privacy-controlled ordered observations as declared in MetricOrderedObservationSetV1
    eligible_5_to_9: display the exact rate/Wilson or exact/bounded P90 evidence, but thresholdState remains NOT_EVALUATED and no automated scale, pause, or stop verdict is emitted
    eligible_at_least_10: threshold decisions are permitted when all inputs are KNOWN
  ordering: elapsedHours ASC, observationKind EVENT before RIGHT_CENSORED before TERMINAL_WITHOUT_EVENT for equal finite bounds, then qualificationEpisodeHmac ASC only inside the server digest; the HMAC is never serialized to aggregate screens

paid_mvw_contract:
  metric_id: BM-VALUE-PAID-MVW
  unit: one unique root outcome-fact chain
  paid_semantics: Paid means the workflow occurred inside a current paid SKU contract after DATA_READY. It does not mean invoice issued, cash collected, or revenue recognized; those authorities are deliberately independent.
  eligibility:
    scope_kind: ORGANIZATION
    organization_id: must equal the configured organization and current contract
    sku: EVIDENCE_WORKSPACE_ORGANIZATION_V1 through the bound contract period
    environment: production only
    allowed_terminal_pairs:
      - {fact_type: AUDITED_DELIVERY, terminal_receipt_kind: OUTBOUND_DELIVERY}
      - {fact_type: COMPLETED_DECISION_CYCLE, terminal_receipt_kind: ORGANIZATION_DECISION}
    chain_rule: Select the greatest correction_sequence for each root_fact_id as of cutoff; ORIGINAL or SUPERSEDING counts one and INVERSE counts zero.
    interval_rule: effective_from is at or after DATA_READY and inside an ACTIVE, PROVISIONED contract period for the same organization/SKU.
    proof_rule: The exact four ordered VerifiedWorkflowProofV1 milestones and the terminal receipt are valid and bind PaidEvidencePacketV1, its evidence set, human decision, independent-review disposition, and durable outcome receipt.
    delivery_rule: AUDITED_DELIVERY requires an applied DELIVERED or READ outbound-delivery receipt; QUEUED, SENDING, PROVIDER_ACCEPTED, RETRY_SCHEDULED, ambiguous, cancelled, suppressed, or failed delivery does not count.
    decision_rule: COMPLETED_DECISION_CYCLE requires a finalized organization-decision receipt whose approved content/action digest equals the persisted packet/action digest; proposal acceptance or execution start is insufficient.
    terminality_rule: The current non-INVERSE outcome head, PaidEvidencePacketV1, exact terminal receipt candidate key/version/digest, and terminal resulting state are locked and validated in one SERIALIZABLE append. Provider acceptance, dispatch, queued/running execution, acknowledgement without effect, or an ambiguous outcome is non-terminal.
    temporal_rule: packet persistedAt <= terminal receipt effective_at = outcome effective_from; effective_from must be inside the same ACTIVE and PROVISIONED contract interval and no earlier than DATA_READY. Import/recorded timestamps never substitute.
  explicit_exclusions:
    - TRIAGED_SIGNAL
    - REVIEWED_INVESTIGATION
    - ACCEPTED_PROPOSAL
    - PUBLICATION
    - CORRECTION
    - public-scope outcomes
    - product-event rows without an eligible outcome fact
    - fixture, synthetic, sandbox, preview, draft, failed, cancelled, suppressed, or unreviewed work
    - AI output, agent proposal, tool call, citation identifier, or generated visualization by itself
  deduplication: A terminal receipt, workflow_instance_hmac, and root outcome chain can contribute at most one unit; delivery retries and correction history never multiply the unit.
  unknown_rule: Missing/expired proof, ambiguous terminal effect, absent contract/readiness binding, or an incomplete correction chain is UNKNOWN and excluded with a reason count; it is never treated as zero-cost success or coerced into an eligible unit.
  correction_rule:
    - ORIGINAL or SUPERSEDING current outcome heads may count once; INVERSE counts zero. A correction never changes the original packet, receipt, invoice, revenue, or cost bytes.
    - Correcting away a paid outcome recomputes value, activation, retention, expansion, and renewal projections at the new cutoff and opens typed reconciliation for any already-issued invoice, recognized revenue, or allocated cost. It does not silently reverse those independent facts.
    - Correcting invoice, revenue, cost, cash, tax, or attribution never creates, deletes, or makes a product outcome eligible. Each authority needs its own valid append-only correction and shared causal receipt digest.

economic_fact_boundary_contract:
  authorities:
    product_value:
      source: current ops.outcome_facts root heads validated by paid_mvw_contract
      proves: a responsible terminal customer workflow
      does_not_prove: usage quantity, invoice, cash, tax, revenue, cost, margin, renewal, or editorial quality
    usage:
      source: current ops.usage_window_receipts and ops.usage_facts heads
      proves: complete, partial, unknown, reversed, or zero measured service consumption
      does_not_prove: a charge, product value, payment, or revenue
    billing:
      source: current ops.invoice_facts, ops.invoice_line_facts, and ops.invoice_usage_memberships heads
      proves: reconciled amount billed for one exact service interval and membership set
      does_not_prove: cash collection, revenue recognition, paid MVW, margin, or retention
    revenue:
      source: current ops.revenue_facts heads under revenue_recognition_contract
      proves: tax-exclusive accounting revenue recognized under one policy
      does_not_prove: cash collection, product value, invoice payment, or healthy economics
    cost:
      source: current closed ops.cost_allocations period and line-set heads under cost_completeness_contract
      proves: captured/allocated/unknown/unallocated cost for one exact period
      does_not_prove: revenue, product value, or invoice accuracy
    cash:
      source: signed external accounting/bank settlement record imported only if a future typed authority approved by the owner exists
      proves: cash settlement/application only
      does_not_prove: revenue, paid MVW, invoice correctness, tax correctness, or entitlement
      v1_product_status: OUT_OF_SCOPE_NO_TABLE_NO_API; no cash value is synthesized from invoice or contract state
    tax:
      source: tax-exclusive/tax columns and tax-policy digest on immutable invoice lines plus append-only tax-targeted correction
      proves: invoice tax basis/liability presentation under the bound policy
      does_not_prove: revenue or operating cost
  no_cascade_rule: A change in one authority never mutates another authority in place and never fabricates a compensating fact. It creates a reconciliation issue and requires the target authority's typed append-only restatement/reversal/adjustment.
  same_cutoff_rule: A composite metric selects every current chain head at one as_of, accounting timezone, policy/formula catalog, and transitive input-set digest; mixing close times or latest-now joins is forbidden.
  correction_effect_union:
    normalized_effects: [ORIGINAL, REPLACEMENT, REVERSAL, INVERSE, SUPERSEDING, RESTATEMENT, WITHDRAWN, ADJUSTMENT]
    lossless_mapping:
      ORIGINAL: physical ORIGINAL or first immutable fact
      REPLACEMENT: physical REPLACEMENT successor
      REVERSAL: physical REVERSAL successor with zero future effect
      INVERSE: physical INVERSE outcome head
      SUPERSEDING: physical SUPERSEDING outcome head
      RESTATEMENT: invoice, membership, revenue, or cost successor that replaces a complete prior set
      WITHDRAWN: physical WITHDRAWAL or withdrawn terminal window; source spelling and source row digest remain in CorrectionHeadBindingV1
      ADJUSTMENT: signed nonzero delta that preserves the original and identifies exact amount kind
    forbidden_loss: A generic CORRECTED flag, latest-row overwrite, or normalized effect without source relation, source effect, predecessor, sequence, effective delta where applicable, and head digest is invalid.

tax_credit_and_cash_boundary:
  invoice_equation: tax-exclusive subtotal - price-reduction discounts + tax + separately authorized accounting adjustments = invoice total; tax and cash are never included in recognized revenue or variable gross margin revenue
  tax_ledger_rule: Each invoice line binds tax category, basis, rate, exemption when applicable, policy digest, rounded tax amount, and source evidence. TAX_CORRECTION targets tax only and appends; it cannot change tax-exclusive revenue or product value.
  credit_classes:
    PRICE_REDUCTION:
      examples: [contract discount, refund of transaction price, SLA service credit classified by the bound accounting policy as consideration reduction]
      effect: reduces tax-exclusive invoice consideration and any related future/corrected revenue through separate exact target corrections; it never records an operating expense for the same amount
    CUSTOMER_COMPENSATION:
      examples: [damages, incident compensation, goodwill payment not classified as transaction-price reduction]
      effect: signed external liability/expense evidence and cost treatment under the accounting policy; it does not reduce invoice/revenue unless a separate price-reduction decision is also valid
    TAX_ADJUSTMENT:
      effect: changes tax basis/liability only through a tax-targeted correction
    CASH_APPLICATION:
      effect: changes receivable/cash settlement only in the external accounting authority; never product entitlement, revenue timing, or paid MVW
  no_double_effect: One source credit/settlement identity may resolve to exactly one primary economic class. A policy-approved split uses distinct ordered components whose amounts conserve the signed source total and whose component-set digest is bound by every target correction.
  v1_runtime_boundary: Gurinnae has no checkout, payment, receivable, cash-ledger, or tax-remittance API. Existing invoice/revenue/cost screens must label those states separately and show UNKNOWN when the required external accounting acknowledgement is absent.

pricing_and_billing:
  sku: EVIDENCE_WORKSPACE_ORGANIZATION_V1
  currency: KRW
  tariff_source: current immutable ops.tariff_versions row covering the full service interval
  formula_version: 1
  formula: >-
    monthly_pre_tax_charge = exact_sum6(
      prorated_workspace_base
      + prorated_active_contributor_block_charge
      + processing_credit_overage_charge
      + storage_gb_month_overage_charge
      + api_record_unit_overage_charge
      + prorated_selected_sla_add_on
      - approved_discount_amount);
    monthly_invoice_total = exact_sum6(ordered already-rounded line_total values, including tax_amount and separately authorized accounting_adjustment_amount)
  components:
    period_proration: active calendar days in the billed slice divided by calendar days in the accounting month, calculated exactly before one half-even rounding at the charge line
    prorated_workspace_base: round6_half_even(workspace_base_amount * period_proration)
    active_contributor_blocks: ceil(max(active_contributors - included_active_contributors, 0) / active_contributor_block_size)
    prorated_active_contributor_block_charge: round6_half_even(active_contributor_blocks * active_contributor_block_amount * period_proration)
    processing_credit_overage: max(processing_credits - included_processing_credits, 0)
    processing_credit_overage_charge: round6_half_even(processing_credit_overage * processing_credit_overage_amount)
    storage_gb_month_overage: max(storage_gb_month - included_storage_gb_month, 0)
    storage_gb_month_overage_charge: round6_half_even(storage_gb_month_overage * storage_gb_month_overage_amount)
    api_record_unit_overage: max(api_record_units - included_api_record_units, 0)
    api_record_unit_overage_charge: round6_half_even(api_record_unit_overage * api_record_unit_overage_amount)
    prorated_selected_sla_add_on: round6_half_even(sla_add_on_amount * period_proration) when contract.sla_add_on_selected is true; otherwise 0; null amount means unavailable and cannot be selected
    approved_discount_amount: sum of effective immutable discount decisions applied only to eligible line kinds, bounded by the pre-discount subtotal
    accounting_adjustment_amount: append-only effective corrections; never an in-place rewrite
  rounding:
    function: ops.round_half_even_numeric_v1
    storage_scale: 6
    rule: Every normalized quantity, line subtotal, discount, tax basis, tax, correction, and line total uses numeric arithmetic and half-even rounding at its declared scale; the invoice aggregate is the exact sum of already-rounded line columns and is not independently re-rounded. PostgreSQL round() away-from-zero is forbidden.
  taxes: Applied after net taxable amount using the versioned tax policy bound by invoice; taxes are not revenue until the accounting policy says so.
  forbidden_price_metrics:
    - case, signal, claim, allegation, publication, correction, response, or subject count
    - person identity, sensitivity, wrongdoing likelihood, model confidence, or editorial priority
  v1_quota_rule: Signed-webhook and digest quotas are included service limits; v1 does not silently create an undeclared overage line. Exhaustion uses a visible bounded quota state and a reviewed tariff amendment.

usage_receipt_contract:
  authoritative_chain: ops.usage_window_receipts -> ops.usage_facts -> ops.invoice_usage_memberships -> optional charged ops.invoice_line_facts
  rules:
    - Every usage fact binds one current non-reversed signed window receipt, contract period, tariff version, measurement window, meter policy version/digest, unit, and source record-set digest.
    - COMPLETE with observed quantity zero is billable truth; PARTIAL or UNKNOWN is not zero and cannot generate an automatic charge.
    - Replacements and reversals append; only the current chain head participates in a new invoice reconciliation.
    - One effective usage fact is represented once in the invoice membership set, including a zero-overage/included-quota membership, or the reconciliation is incomplete.
  meter_definitions:
    active_contributors: distinct rostered non-read-only identities with at least one successful eligible internal command or independent-review receipt in the service window; login and read-only viewing do not count
    processing_credits: versioned sum of settled actual job/provider credits after reservation; rejected, cancelled-before-effect, and unexecuted maximum reservations do not count
    storage_gb_month: round6_half_even(encrypted_byte_hours / (1000000000 * exact_local_period_hours)); decimal GB-month is normative for v1
    api_record_units: round6_half_even(normalized_records_successfully_returned / 1000); request count and failed responses do not substitute
    delivery_attempts: authentic provider dispatch attempts, not callback count; included quota only in v1
    export_bytes: successfully materialized authorized export bytes, included quota only in v1

invoice_membership_contract:
  authority: current immutable ops.invoice_usage_memberships chain selected per usage_root_fact_id and billing cutoff; invoice lines alone are not membership authority
  header: one ops.invoice_facts row for one organization, contract period, SKU, currency, and half-open service interval
  line_set:
    order: line_ordinal ASC then id ASC
    digest: exact immutable line-set digest bound by the header
    gap_rule: line ordinals are contiguous 1..line_count with no duplicate
  fixed_lines:
    WORKSPACE_BASE: exactly one per covered accounting month or prorated contract fragment, quantity 1, no usage_fact_id
    SLA_ADD_ON: exactly one only when selected and available; otherwise zero lines
    ACCOUNTING_ADJUSTMENT: only a signed append-only provider/accounting correction with its source digest
  metered_lines:
    ACTIVE_CONTRIBUTOR_BLOCK: exact current ACTIVE_CONTRIBUTOR usage fact
    PROCESSING_CREDIT_OVERAGE: exact current PROCESSING_CREDIT usage fact
    STORAGE_GB_MONTH_OVERAGE: exact current STORAGE_GB_MONTH usage fact
    API_RECORD_UNIT_OVERAGE: exact current API_RECORD_UNIT usage fact
  membership_rule: Every due meter/window is returned by ops.read_invoice_membership_v1 before observation-state filtering. Every effective COMPLETE usage root in the service interval has exactly one current ops.invoice_usage_memberships leaf, including ZERO_USAGE and INCLUDED_ALLOWANCE rows with null invoice_line_id; BILLED_OVERAGE binds exactly one same-invoice line. No root may fund two current invoices or effective lines.
  conservation: subtotal - discount_total = taxable_amount; taxable_amount + tax_total + correction_total = invoice_total
  unknown_rule: Missing receipt, partial window, stale tariff, currency mismatch, membership gap, or total mismatch makes invoice reconciliation UNKNOWN/BLOCKED and forbids revenue/margin/readiness claims from that invoice.

revenue_contract:
  recognized_source: current append-only ops.revenue_facts chains under a versioned accounting policy
  not_revenue: [signed_contract, binding_commitment, invoice_total, cash_expectation, accepted_proposal, triage, usage_without_invoice]
  rules:
    - A revenue fact binds exact organization, contract period, invoice header and eligible non-adjustment invoice line, recognition interval, currency, policy version/digest, signed source receipt, and import receipt.
    - Cumulative recognized amount for a line cannot exceed its effective recognizable amount; intervals do not overlap.
    - Corrections append through ops.accounting_corrections; original invoice and revenue bytes never change.
    - Binding committed amount is forecast/funding evidence only and is never recognized revenue.

revenue_recognition_contract:
  eligible_basis: tax-exclusive recognizable amount of one reconciled non-adjustment invoice line after effective price-reduction discounts and before tax; cash, tax, compensation expense, commitment, and invoice total are excluded
  recognition_methods:
    POINT_IN_TIME_V1:
      eligible_lines: only a line whose bound performance-obligation policy and terminal performance receipt declare point-in-time recognition
      recognized_at: exact terminal performance receipt effective_at
      allocation: the full effective recognizable amount belongs to the unique half-open accounting window containing recognized_at
    OVER_TIME_STRAIGHT_LINE_UTC_MICROSECOND_V1:
      eligible_lines: recurring workspace, SLA, and other lines whose bound policy declares over-time recognition
      service_interval: exact invoice-line [service_period_start,service_period_end), with both instants derived from the contract accounting timezone and then persisted in UTC
      exact_fraction: integer UTC microseconds in intersection(service interval, reporting window) divided by integer UTC microseconds in the full service interval; binary float and calendar-month averaging are forbidden
      ordered_allocation: calculate unrounded numeric allocations for every chronological accounting-window intersection; round all but the last nonempty slice half-even to scale 6; set the last slice to effective recognizable amount minus the exact sum of prior rounded slices
      residual_rule: the final residual is deterministic, preserves sign and total, and is bound by ordered allocation-set digest; spreading, dropping, or posting it to an unrelated current month is forbidden
  cross_month_rule: Revenue is reported by exact interval overlap. A multi-month line cannot be recognized wholly at invoice issue, payment, import, or month end unless its bound method is POINT_IN_TIME_V1 and its actual performance receipt occurred then.
  cumulative_cap: Across all current non-reversed revenue facts and corrections for one invoice line/policy, recognized tax-exclusive amount equals no more than the current effective recognizable amount; overlapping recognition intervals are forbidden and adjacency is allowed.
  corrections_and_restatement:
    - A price reduction, line restatement, performance-date correction, or policy correction appends exact accounting correction and successor revenue facts for every affected historical/future slice; it never edits a prior fact.
    - Prior-period effects remain assigned to their original accounting windows in metric as-of reconstruction. A separately approved accounting presentation may show a current-period adjustment but must also expose original-window restatement and cannot change source economics.
    - WITHDRAWN or reversed revenue contributes zero after its effective correction, while historical cutoffs before correction remain byte-reproducible.
    - Reallocation locks invoice-line plus policy, locks existing revenue/correction heads in deterministic order, and atomically proves no gap, overlap, negative final slice, over-recognition, or duplicate residual.
  proof_fields: [invoice_line_id, invoice_line_digest, recognition_method, service_period_start, service_period_end, terminal_performance_receipt_id, terminal_performance_receipt_digest, recognition_policy_version, recognition_policy_digest, exact_unrounded_fraction, rounded_amount, residual_amount, allocation_ordinal, allocation_set_digest, source_receipt_digest]

unit_economics:
  cost_source: current closed ops.cost_allocations period and line set
  variable_cost_categories:
    - COMPUTE
    - DATABASE_WAL_BACKUP
    - STORAGE
    - EGRESS
    - MODEL_OCR
    - SEARCH
    - DELIVERY
    - OBSERVABILITY
    - SUPPORT
    - HUMAN_REVIEW
    - LEGAL_SECURITY
  acquisition_cost_category: SALES_CUSTOMER_ACQUISITION
  eligibility:
    cost_capture_coverage_min: 0.99
    direct_coverage_required: 1.0
    total_coverage_min: 0.95
    unknown_or_unallocated_rule: Missing, unknown, or unallocated cost stays visible and blocks a healthy margin claim; it is never zero.
  margin_targets:
    pilot_p75_variable_gross_margin_min: 0.60
    general_availability_p75_variable_gross_margin_min: 0.70
    lower_pilot_price: requires independent oversight reason, expiry, exact cost evidence, and no trust-gate change
  support_capacity_hours_per_activated_org_month_max: 4.0
  cac_payback_months_max: 12.0
  cac_rule: Only SALES_CUSTOMER_ACQUISITION allocations with a current non-reversed acquisition receipt and matching organization/campaign count; lead/contact/query/cookie/message content is forbidden.

cost_completeness_contract:
  close_unit: one deployment, half-open accounting period, reporting currency, accounting timezone, cost-policy version/digest, and current superseding period head
  required_source_category_matrix:
    source_registry: exact current configured provider, infrastructure, payroll/time, legal/security, support, and internal allocation sources effective for the period
    category_registry: [COMPUTE, DATABASE_WAL_BACKUP, STORAGE, EGRESS, MODEL_OCR, SEARCH, DELIVERY, OBSERVABILITY, SUPPORT, HUMAN_REVIEW, LEGAL_SECURITY, SALES_CUSTOMER_ACQUISITION]
    cell_states: [COMPLETE, NO_ACTIVITY_WITH_PROOF, UNKNOWN]
    rule: Every expected source/category cell appears exactly once in the close set. NO_ACTIVITY_WITH_PROOF binds a signed zero-activity receipt; absent, late, partial, duplicate, or unsigned cells are UNKNOWN rather than omitted.
  completeness_dimensions:
    event_coverage: captured expected source-event count / expected source-event count is at least 0.99 when the expected count is known
    direct_amount_coverage: known directly attributable amount / direct eligible amount equals 1.0
    total_amount_coverage: known allocated amount / captured known amount is at least 0.95
    category_coverage: every required category is COMPLETE or NO_ACTIVITY_WITH_PROOF; a high aggregate percentage cannot hide a missing category
  unknown_amount_contract:
    required_fields: unknown source/category cell count, reason set digest, conservative upper-bound amount or UPPER_BOUND_UNAVAILABLE, upper-bound policy version/digest, materiality policy version/digest
    rule: An absent upper bound remains UNKNOWN and blocks exact margin, contribution, cost-per-MVW, CAC/payback, expansion, renewal, and scale claims. A finite upper bound may support a displayed conservative range but never changes UNKNOWN to KNOWN or supplies zero.
    materiality_rule: Deployment-configured materiality controls escalation and review cadence only. It cannot exclude a required source/category, weaken 100% direct coverage, or make unknown/unallocated cost healthy.
  unallocated_policy:
    known_portfolio_cost: Every captured known unallocated amount remains included in portfolio total variable cost and conservative contribution/margin bounds; it is never dropped to improve economics.
    unit_metrics: Any positive unallocated amount whose eligible target set intersects an organization, paid outcome, acquisition cohort, or SKU window makes the affected unit metric UNKNOWN until an append-only allocation restatement resolves it.
    explicit_pool: Unallocated acquisition cost uses the exact privacy-safe pool digest and makes cohort CAC/payback UNKNOWN; it is never divided only across attributed organizations.
  close_rule: A period may persist with state UNKNOWN for truthful operations, but only a CLOSED+COMPLETE current head with all matrix, amount, FX, correction, allocation, and upper-bound evidence may support a KNOWN healthy economics claim.
  correction_rule: Cost corrections append a complete superseding period header and full ordered line set. Delta-only orphan lines, in-place edits, partial carry-forward, or a latest-period join that loses the predecessor/correction union are forbidden.

sla_contract:
  applies_when: current contract selects an available SLA add-on and binds a versioned SLA policy digest
  window: one accounting calendar month
  availability_formula: round12_half_even((eligible_service_minutes - unavailable_minutes) / eligible_service_minutes)
  eligible_service_minutes: all scheduled service minutes minus only policy-allowed maintenance announced at least 72 hours in advance and capped at 4 hours per month
  unavailable_minutes: union of minute intervals in which a contracted critical capability is unavailable; overlapping incidents count once
  target: exact target and service-credit schedule from the signed SLA policy bound by the contract; a missing target is UNKNOWN and the add-on cannot be sold
  telemetry_rule: Missing required SLI receipts or telemetry makes the window UNKNOWN, opens a telemetry-gap incident, and forbids claiming SLA success.
  service_credit: a signed SERVICE_CREDIT discount/accounting correction; never rewrite the invoice or hide the breached window
  excluded_causes: only the closed signed policy set may exclude a minute; provider fault, capacity exhaustion, deployment error, and unknown cause are not automatically excluded

pilot_readiness:
  profile_id: BM-PILOT-CORE-V1
  stage: PILOT_ENTRY_READINESS
  stage_semantics: This is the pre-activation admission gate for one paid private workspace pilot, not an ACTIVATED funnel stage, a completed value event, or proof of post-billing economics.
  evidence_cutoff: evaluation.evidence_cutoff_at
  mandatory_core_items:
    - PAID_WORKSPACE_PROCESSING_ACTIVE
    - DEPLOYMENT_ISOLATION_PROVEN
    - OIDC_AND_ROSTER_READY
    - DATA_STORES_KEYS_QUEUES_ISOLATED
    - SOURCE_RIGHTS_CONFIGURED
    - TELEMETRY_ALERTS_RUNBOOK_READY
    - BACKUP_RESTORE_PROVEN
    - INCIDENT_OWNERSHIP_READY
    - CURRENT_CONTRACT_PERIOD
    - CURRENT_TARIFF_VERSION
    - BILLING_RECONCILIATION_PATH_READY
    - COST_CAPTURE_PATH_READY
    - P75_VARIABLE_GROSS_MARGIN
    - SUPPORT_CAPACITY
  post_first_billing_required:
    - ACTUAL_BILLABLE_RECONCILIATION
    - ACTUAL_COST_CAPTURE
    - FIRST_PAID_VERIFIED_WORKFLOW_CYCLE
  general_availability_only:
    - CAC_PAYBACK
  conditional_when_explicitly_offered:
    - PUBLIC_WEB_ACTIVE
    - VERIFIED_EMAIL_ACTIVE
    - API_EXPORT_ACTIVE
    - SIGNED_WEBHOOK_ACTIVE
    - DAILY_DIGEST_ACTIVE
    - WEEKLY_DIGEST_ACTIVE
    - SMS_ADAPTER_ACTIVE
    - TELEGRAM_ADAPTER_ACTIVE
    - WHATSAPP_ADAPTER_ACTIVE
    - LINE_ADAPTER_ACTIVE
    - KAKAO_ADAPTER_ACTIVE
    - VOICE_ADAPTER_ACTIVE
  optional_rule: Unoffered Public Web, email, API/export, webhook, digest, SMS, Telegram, WhatsApp, LINE, Kakao, and voice are visible as NOT_APPLICABLE/UNCONFIGURED and do not block a core pilot; once promised in the signed offer they become required and must have exact production activation evidence.
  evidence_rule: FIXTURE_ONLY and NON_PRODUCTION_PREFLIGHT never satisfy production readiness. PRODUCTION_PREFLIGHT may satisfy only path-readiness items; actual billing, cost, value, SLA, margin, and CAC require production facts.

acquisition_activation_retention_loops:
  acquisition_channels:
    ORGANIC_SEARCH: public evidence, stable citations, source-status, or methodology pages
    REFERRAL: newsroom, researcher, civic organization, or existing-user referral
    PARTNER: documented data-journalism, research, or public-interest partnership
    EVENT: workshop, conference, or training with a signed campaign receipt
    CONTENT: reproducible methods, source coverage, or case-study content
    DIRECT: customer-initiated direct inquiry
    OUTBOUND: reviewed organization-level outreach with lawful basis and suppression controls
    PAID_SEARCH: bounded campaign; no sensitive-keyword or person-level audience
    PAID_SOCIAL: bounded campaign; no source/subject/customer-list matching
  attribution: current ops.acquisition_source_receipts chain with organization/campaign HMACs and no raw lead, contact, query, cookie, address, handle, or message
  activation_moments:
    - first non-empty authorized snapshot is reproducible and limitations are visible
    - first evidence packet is independently reviewed and receives a responsible terminal outcome
    - first value receipt is visible with provenance, cost, next action, and recovery path
  retention_loops:
    - saved query or cohort -> scheduled source refresh -> changed evidence -> human review -> approved packet/decision/delivery -> receipt -> next scoped watch
    - correction or counter-evidence -> impact review -> revised packet -> immutable correction receipt -> restored trust
    - usage/cost/SLA report -> quota or workflow optimization -> lower cost per paid MVW without changing trust gates
  anti_dark_pattern: Notifications, digests, and messenger delivery require current consent, quiet-time policy, frequency controls, unsubscribe, and truthful delivery state; engagement does not override those gates.

acquisition_attribution_contract:
  model: SINGLE_SOURCE_100_PERCENT_PER_QUALIFICATION_EPISODE_V1
  source_order_exactly: [ORGANIC_SEARCH, REFERRAL, PARTNER, EVENT, CONTENT, DIRECT, OUTBOUND, PAID_SEARCH, PAID_SOCIAL, OTHER_REVIEWED, UNKNOWN_SOURCE]
  acquisition_cohort: accounting calendar month containing qualification_contract.first_qualified_at, keyed by qualification_episode_id, organization_id, SKU, accounting timezone, and metric cutoff
  acquisition_end_exclusive: qualification_contract.first_qualified_at
  selection:
    - Select the current qualification head at cutoff, then only its exact acquisition_source_receipt_id+digest binding; never search for a convenient latest campaign by organization alone.
    - The bound acquisition receipt must be the unique current non-reversed head at cutoff, match deployment/organization/campaign, be valid at first_qualified_at, and have attributed_at no later than the qualification decision_effective_at.
    - A null pair, reversed/stale pair, later unbound receipt, cross-episode reuse, invalid interval, changed digest, or ambiguous chain contributes exactly one UNKNOWN_SOURCE episode and sets attribution-dependent cost metrics UNKNOWN.
    - No fractional, last-click fallback, multi-touch weighting, or operator guess exists in v1. A source correction requires an acquisition-receipt successor and qualification REPLACEMENT binding the new exact digest; first_qualified_at and cohort never move.
  episode_count_conservation: sum(count for every ten known source kinds) + unknown_source_count = distinct current valid qualification episodes in the exact cohort; every episode contributes exactly one unit and no organization-only join may multiply or drop requalification episodes
  source_cohort_parity:
    - Acquisition, configuration, data-ready, activation, fixed retention, pilot-to-paid, churn, CAC, and payback source cuts use the same qualification_episode_id, first_qualified_at cohort, source binding, SKU, timezone, as_of, and cohort input digest.
    - A channel numerator is always a subset of that channel's exact conserved denominator. Global outcome/revenue/cost numerators, current organization source, cohort-ratio averaging, and reassignment after activation are forbidden.
    - Portfolio aggregation sums disjoint cohort/source numerators and denominators first; it never averages rates or per-organization CAC/payback ratios.
  acquisition_cost_window:
    start: earliest effective captured SALES_CUSTOMER_ACQUISITION source event bound to the campaign and current correction set
    end: first_qualified_at exclusive
    post_qualification_policy: A source event effective at or after first_qualified_at is onboarding, customer-success, support, expansion, or another actual category and never first-acquisition CAC. A late invoice may enter CAC only when it corrects a source event whose service/effective interval ended before first_qualified_at; import or invoice date cannot move the economic event across the boundary.
  amount_conservation:
    formula: complete_captured_acquisition_amount = exact_sum6(attributed_episode_amounts) + exact_sum6(unattributed_pool_amounts)
    requirements:
      - Every effective source cost identity appears exactly once in attributed or unattributed lines under the same currency, FX policy, period, cutoff, and correction-set digest.
      - Any positive unattributed pool, unknown source amount, missing/stale/reversed receipt, FX gap, or correction ambiguity makes CAC and payback UNKNOWN; the attributed subset is never reported as a lower known value.
      - Reassigning an amount appends a complete cost-period restatement that removes the predecessor allocation and adds the successor under one conserved source identity; dual-current allocation is forbidden.
  privacy: Source kind, campaign HMAC/digest, organization role-scoped HMAC, cohort month, and aggregate counts/amounts are the only acquisition dimensions. Raw lead, contact, person, query, URL parameter, cookie, device, address, handle, message, referral text, and cross-session public identity are forbidden.

offer_profile_contract:
  type: OfferProfileV1
  additional_properties: false
  source: signed external offer/contract operating record imported through the typed commercial-contract boundary; a UI checkbox, tariff default, sales note, or capability health is not authority
  required_fields:
    schemaVersion: const<1>
    offerProfileId: uuid
    offerProfileVersion: bigint[1..max]
    organizationId: uuid
    qualificationEpisodeId: uuid
    sku: const<EVIDENCE_WORKSPACE_ORGANIZATION_V1>
    contractPeriodId: uuid
    contractPeriodDigest: sha256
    tariffVersionId: uuid
    tariffRecordDigest: sha256
    capabilityEntries: ordered-array<OfferCapabilityV1>[12]
    capabilitySetDigest: sha256
    quotaSetDigest: sha256
    overagePolicySetDigest: sha256
    serviceCreditPolicyDigest: sha256
    effectiveFrom: datetime
    effectiveUntil: datetime
    sourceReceiptDigest: sha256
    signatureDigest: sha256
    offerProfileDigest: sha256
  capability_codes_ordered_exactly: [PUBLIC_WEB, VERIFIED_EMAIL, API_EXPORT, SIGNED_WEBHOOK, DAILY_DIGEST, WEEKLY_DIGEST, SMS, TELEGRAM, WHATSAPP, LINE, KAKAO, VOICE]
  OfferCapabilityV1:
    additional_properties: false
    fields:
      ordinal: int32[1..12]
      capabilityCode: closed offer capability code
      offerState: enum<INCLUDED_REQUIRED|NOT_OFFERED>
      quotaKind: enum<NOT_METERED|API_RECORD_UNIT|DELIVERY_ATTEMPT|DIGEST_DISPATCH|WEBHOOK_DISPATCH>
      includedQuantity: nullable<decimal-string>
      overagePolicy: enum<DECLARED_TARIFF_OVERAGE|HARD_LIMIT_NO_OVERAGE|NOT_APPLICABLE>
      overageUnitPrice: nullable<decimal-string>
      activationPolicyDigest: nullable<sha256>
      consentPolicyDigest: nullable<sha256>
      costPolicyDigest: nullable<sha256>
      entryDigest: sha256
    invariants:
      - ordinal and capabilityCode equal capability_codes_ordered_exactly; every code appears exactly once.
      - NOT_OFFERED has NOT_APPLICABLE overage, null quantity/prices/policy digests, remains visible, and does not block core readiness.
      - INCLUDED_REQUIRED has an exact quota/overage shape, current provider/legal/consent/cost activation as applicable, and blocks readiness/sale when evidence is missing, stale, synthetic, fixture, or for another environment.
      - API_EXPORT may use DECLARED_TARIFF_OVERAGE only when the exact API Record Unit price exists in the bound tariff. Signed webhook, digest, and delivery channel quotas are HARD_LIMIT_NO_OVERAGE in v1. PUBLIC_WEB is NOT_METERED.
  exact_subset_rule: The twelve entries, not the default template, determine offered capability requirements. Changes append a new signed OfferProfileV1 and compatible contract/tariff period; they never rewrite history or silently enable a channel.
  credit_rule: Processing credits are a consumption meter settled from reservation to actual. SLA service credits and price reductions are accounting corrections. Neither is an entitlement token, cash, or a substitute for quota/overage terms; their distinct digests are mandatory.
  sale_rule: A contract is CONFIGURED only when its OfferProfileV1, tariff, deployment configuration, and every INCLUDED_REQUIRED capability activation resolve at the same cutoff. Sales/marketing may not promise a NOT_OFFERED or UNCONFIGURED capability.

metric_defaults:
  status_values: [KNOWN, UNKNOWN, NOT_APPLICABLE]
  interval: half-open [start,end)
  arithmetic: PostgreSQL numeric with ops.round_half_even_numeric_v1; binary float is forbidden
  rate_rule: denominator zero is NOT_APPLICABLE, never 0% or 100%
  small_sample_rule: for eligible organization count below 5 show the typed SmallSampleEvidenceV1 and permitted de-identified ordered observations only, set rate/quantile status NOT_APPLICABLE with SAMPLE_TOO_SMALL, and make no automated verdict; at 5 or more show the applicable exact result, and binomial organization rates also show Wilson 95%; automated stop/scale decisions require at least 10 eligible organizations unless an immediate trust hard stop applies
  freshness_rule: Each value exposes as_of, window, formula version/digest, input-set digest, known/unknown/not-applicable status, unknown reason counts, and latest source timestamp.
  correction_rule: Results are reproducible as-of results over immutable facts; corrections create a new receipt/input digest and never rewrite historical reported evidence.
  privacy_rule: Metric dimensions are allowlisted organization HMAC, SKU, cohort month, stage, source kind, and reason code; no public/response person, query, content, token, filename, contact, or session identifier.
  breach_action_rule: Every metric declares its own breach_action. Contextual metrics use explicit NONE semantics only for a KNOWN, non-breaching value; UNKNOWN and BREACH always name an owner action and cannot be hidden by another healthy metric.
  result_contract:
    status: required enum<KNOWN|UNKNOWN|NOT_APPLICABLE>
    reasonCode: required closed metric-status reason code, never null
    known: the metric-specific closed result variant is complete and reasonCode is NONE; an exact scalar/rate may be replaced only by the declared KNOWN time-to-event lower-bound variant, while a threshold breach changes thresholdState, issueCode, and breachAction without falsifying status
    unknown: every decision scalar/rate/quantile is null, reasonCode is the highest-priority non-NONE cause, unknownReasons contains that cause and every additional cause with counts, diagnostic counts/bounds remain in the typed result variant, and issueCode is never NONE
    not_applicable: every decision scalar/rate/quantile is null, reasonCode is one of DENOMINATOR_ZERO, COHORT_NOT_MATURE, SAMPLE_TOO_SMALL, or CAPABILITY_NOT_OFFERED, and typed sample/pending evidence explains why; missing/stale/ambiguous evidence is UNKNOWN instead
    healthy: a KNOWN PASS or normal NOT_EVALUATED result has issueCode NONE and breachAction NONE; a legitimate NOT_APPLICABLE result also has issueCode NONE and breachAction NONE
    reason_priority: [TRUST_REVIEW_OPEN, CORRECTION_CHAIN_AMBIGUOUS, CONTRACT_NOT_CURRENT, RIGHTS_NOT_CURRENT, CONFIGURATION_MISMATCH, SNAPSHOT_EMPTY_OR_UNREPRODUCIBLE, SOURCE_MISSING, SOURCE_PARTIAL, SOURCE_STALE, TERMINAL_RECEIPT_MISSING, PACKET_PROOF_INCOMPLETE, USAGE_UNKNOWN, INVOICE_MEMBERSHIP_GAP, REVENUE_CHAIN_INVALID, COST_CAPTURE_INCOMPLETE, FX_MISSING_OR_STALE, SLA_TELEMETRY_GAP, ATTRIBUTION_UNKNOWN, NONPOSITIVE_CONTRIBUTION, DENOMINATOR_ZERO, COHORT_NOT_MATURE, SAMPLE_TOO_SMALL, CAPABILITY_NOT_OFFERED, NONE]
    breach_action_priority: [CONTAIN_TRUST_INCIDENT, REPAIR_DATA_READINESS, RESTORE_SLA_AND_TELEMETRY, RECONCILE_USAGE_AND_INVOICE, RECONCILE_REVENUE, VERIFY_PAID_PACKET, CLOSE_ATTRIBUTION, CLOSE_COST_AND_FX_GAPS, RESTORE_SUPPORT_CAPACITY, COMPLETE_QUALIFICATION, COMPLETE_CONFIGURATION, RECOVER_VALUE_WORKFLOW, REVIEW_COHORT_LOSS, ADJUST_PRICE_QUOTA_OR_EFFICIENCY, REVIEW_PRODUCT_PAUSE, NONE]
  catalog_parity_rule: The exact metric key set equals both result_reason_catalog and metric_breach_action_catalog, and every metric has version, formula, population, window, sources, exclusions, owner, data_quality, unknown_handling, threshold, breach_action, and healthy_issue_code fields; generation fails on a missing or extra key.

statistical_result_contract:
  binomial_rate_metrics_exactly: [BM-FUNNEL-CONFIGURATION-RATE, BM-FUNNEL-DATA-READY-RATE, BM-ACTIVATION-7D-RATE, BM-RETENTION-D29-56-RATE, BM-RETENTION-CHURN-RATE, BM-FUNNEL-PILOT-TO-PAID-RATE, BM-EXPANSION-ELIGIBILITY-RATE, BM-RENEWAL-ELIGIBILITY-RATE]
  deterministic_ratio_metrics_exactly: [BM-BILLING-RECONCILIATION-COVERAGE, BM-MARGIN-VARIABLE-GROSS-RATE, BM-SLA-AVAILABILITY-RATE]
  ordered_breakdown_metrics_exactly: [BM-ACQ-CHANNEL-MIX]
  time_to_event_metrics_exactly: [BM-ACTIVATION-TTFPV-P90]
  wilson_95_v1:
    method: WILSON_SCORE_WITHOUT_CONTINUITY_CORRECTION_V1
    z: '1.959963984540054'
    exact_formula: >-
      p=x/n; z2=z*z; denominator=1+z2/n;
      center=(p+z2/(2*n))/denominator;
      half_width=(z*sqrt((p*(1-p)+z2/(4*n))/n))/denominator;
      lower=max(0,center-half_width); upper=min(1,center+half_width)
    arithmetic: arbitrary-precision decimal for division and correctly rounded square root under formula version 1; serialize lower/upper after one half-even rounding to scale 12
    requirements: x and n are exact nonnegative int64, x <= n, n >= 5, and the interval binds the same numerator, denominator, cohort, cutoff, and input-set digest as the displayed rate
    forbidden: normal approximation, Wald interval, continuity correction, binary float, a different z constant, reuse across a changed denominator, or Wilson on financial/minute/completeness ratios
  small_sample_evidence:
    threshold: eligibleCount < 5
    visible: eligibleCount, pendingCount, unknownCount, excludedCount, numeratorCount when disclosure policy permits, maturity horizon, cutoff, and suppression reason
    hidden: rate, percentile claim, organization/campaign HMAC, exact money, exact acquisition source for a singleton, raw timestamps, or any field that permits identity linkage
    ordered_duration_exception: OPS-004 may return MetricOrderedObservationSetV1 for BM-ACTIVATION-TTFPV-P90 only to an authorized budgets.manage actor; it contains duration/bound and observation kind without identity, source, money, or wall-clock timestamp. INT-001, public, export, logs, analytics, and notification paths receive counts only below five.
  status_rules:
    - SAMPLE_TOO_SMALL is NOT_APPLICABLE, not UNKNOWN, only when every included input is otherwise complete and eligibleCount is 1..4.
    - Missing, stale, ambiguous, privacy-blocked, or incomplete inputs remain UNKNOWN even when the known subset is below five.
    - DENOMINATOR_ZERO applies only when eligibleCount is zero and unknownCount is zero; pending or unknown populations use COHORT_NOT_MATURE or UNKNOWN respectively.
    - eligibleCount 5..9 permits display but thresholdState is NOT_EVALUATED; eligibleCount >=10 permits the declared decision threshold.

