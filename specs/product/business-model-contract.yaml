screen_operation_mapping:
  no_new_route_rule: No fourth surface, tenant switcher, sales CRM, checkout, invoice-payment, or entitlement route is created.
  closed_codes:
    metric_id: exact sorted keys of metrics in this contract; generation fails on any missing or extra ID
    breach_action: [NONE, COMPLETE_QUALIFICATION, CLOSE_ATTRIBUTION, REVIEW_COHORT_LOSS, COMPLETE_CONFIGURATION, REPAIR_DATA_READINESS, VERIFY_PAID_PACKET, RECOVER_VALUE_WORKFLOW, RECONCILE_USAGE_AND_INVOICE, RECONCILE_REVENUE, CLOSE_COST_AND_FX_GAPS, ADJUST_PRICE_QUOTA_OR_EFFICIENCY, RESTORE_SUPPORT_CAPACITY, RESTORE_SLA_AND_TELEMETRY, CONTAIN_TRUST_INCIDENT, REVIEW_PRODUCT_PAUSE]
    breach_action_rule: A metric response selects exactly one code allowed by metric_breach_action_catalog[metricId]. Healthy selects NONE. UNKNOWN selects the code bound to its primary reasonCode; BREACH selects the deterministic highest-priority applicable action. The prose metrics.*.breach_action explains the action and is not serialized as an enum.
    source_relation: exact sorted union of every metrics.*.sources value in this contract
    correctable_business_relation: [ops.commercial_qualification_receipts, ops.outcome_facts, ops.acquisition_source_receipts, ops.commercial_contract_periods, ops.usage_window_receipts, ops.usage_facts, ops.discount_decisions, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships, ops.revenue_facts, ops.accounting_corrections, ops.cost_allocations]
    owner_function: [PRODUCT_PDM, EDITORIAL_DUTY, DATA_ENGINEERING, AI_DATA, SRE, TRUST_PRIVACY_LEGAL, SALES_CS_FINANCE, EXECUTIVE_APPROVER]
    metric_status_reason: [NONE, SOURCE_MISSING, SOURCE_STALE, SOURCE_PARTIAL, CORRECTION_CHAIN_AMBIGUOUS, CONTRACT_NOT_CURRENT, CONFIGURATION_MISMATCH, RIGHTS_NOT_CURRENT, SNAPSHOT_EMPTY_OR_UNREPRODUCIBLE, TERMINAL_RECEIPT_MISSING, PACKET_PROOF_INCOMPLETE, USAGE_UNKNOWN, INVOICE_MEMBERSHIP_GAP, REVENUE_CHAIN_INVALID, COST_CAPTURE_INCOMPLETE, FX_MISSING_OR_STALE, SLA_TELEMETRY_GAP, ATTRIBUTION_UNKNOWN, NONPOSITIVE_CONTRIBUTION, TRUST_REVIEW_OPEN, DENOMINATOR_ZERO, COHORT_NOT_MATURE, SAMPLE_TOO_SMALL, CAPABILITY_NOT_OFFERED]
    metric_unknown_reason: [SOURCE_MISSING, SOURCE_STALE, SOURCE_PARTIAL, CORRECTION_CHAIN_AMBIGUOUS, CONTRACT_NOT_CURRENT, CONFIGURATION_MISMATCH, RIGHTS_NOT_CURRENT, SNAPSHOT_EMPTY_OR_UNREPRODUCIBLE, TERMINAL_RECEIPT_MISSING, PACKET_PROOF_INCOMPLETE, USAGE_UNKNOWN, INVOICE_MEMBERSHIP_GAP, REVENUE_CHAIN_INVALID, COST_CAPTURE_INCOMPLETE, FX_MISSING_OR_STALE, SLA_TELEMETRY_GAP, ATTRIBUTION_UNKNOWN, NONPOSITIVE_CONTRIBUTION, TRUST_REVIEW_OPEN]
    issue_code: [NONE, ACTIVATION_BELOW_TARGET, RETENTION_BELOW_TARGET, PILOT_CONVERSION_BELOW_TARGET, NO_PAID_VALUE_30D, READINESS_BLOCKED, BILLING_RECONCILIATION_BLOCKED, MARGIN_BELOW_TARGET, CAC_ABOVE_TARGET, SUPPORT_ABOVE_CAPACITY, SLA_UNKNOWN_OR_BREACHED, EXPANSION_NOT_ELIGIBLE, RENEWAL_NOT_ELIGIBLE, TRUST_HARD_STOP, DATA_UNKNOWN]
    remediation_code: [NO_ACTION_REQUIRED, COMPLETE_QUALIFICATION, CLOSE_ATTRIBUTION, REVIEW_COHORT_LOSS, COMPLETE_CONFIGURATION, REPAIR_DATA_READINESS, VERIFY_PAID_PACKET, RECOVER_VALUE_WORKFLOW, RECONCILE_USAGE_AND_INVOICE, RECONCILE_REVENUE, CLOSE_COST_AND_FX_GAPS, ADJUST_PRICE_QUOTA_OR_EFFICIENCY, RESTORE_SUPPORT_CAPACITY, RESTORE_SLA_AND_TELEMETRY, CONTAIN_TRUST_INCIDENT, REVIEW_PRODUCT_PAUSE]
    metric_result_kind:
      BM-ACQ-QUALIFIED-ORG-COUNT: SCALAR
      BM-ACQ-CHANNEL-MIX: SOURCE_BREAKDOWN
      BM-FUNNEL-CONFIGURATION-RATE: BINOMIAL_RATE
      BM-FUNNEL-DATA-READY-RATE: BINOMIAL_RATE
      BM-VALUE-PAID-MVW: SCALAR
      BM-VALUE-PAID-MVW-PER-ACTIVE-ORG: DETERMINISTIC_RATIO
