    BM-FUNNEL-PILOT-TO-PAID-RATE: [BM-VALUE-PAID-MVW, BM-REVENUE-RECOGNIZED-KRW, BM-BILLING-RECONCILIATION-COVERAGE]
    BM-EXPANSION-ELIGIBILITY-RATE: [BM-VALUE-PAID-MVW-PER-ACTIVE-ORG, BM-RETENTION-D29-56-RATE, BM-BILLING-RECONCILIATION-COVERAGE, BM-MARGIN-VARIABLE-GROSS-RATE, BM-SLA-AVAILABILITY-RATE, BM-SUPPORT-HOURS-PER-ACTIVATED-ORG, BM-TRUST-HARD-STOP-COUNT]
    BM-RENEWAL-ELIGIBILITY-RATE: [BM-VALUE-PAID-MVW-PER-ACTIVE-ORG, BM-RETENTION-D29-56-RATE, BM-RETENTION-CHURN-RATE, BM-BILLING-RECONCILIATION-COVERAGE, BM-MARGIN-VARIABLE-GROSS-RATE, BM-SLA-AVAILABILITY-RATE, BM-SUPPORT-HOURS-PER-ACTIVATED-ORG, BM-TRUST-HARD-STOP-COUNT]
  acyclic_rule: The dependency key set and topological-order set equal metrics exactly. Every dependency appears earlier than its consumer; cycles, missing nodes, duplicate nodes, and undeclared runtime dependencies fail generation.
  transitive_input_digest:
    leaf_binding_order: relation ASC, root identity digest ASC, selected head version ASC, selected head ID ASC
    dependency_order: direct_metric_dependencies list order, then metricId lexical as a validation tiebreaker
    formula: Gurine Canonical JSON v1 SHA-256 over metric ID/version, formula/policy/catalog digests, window/timezone/as_of, exact leaf MetricSourceBindingV1 set, exact CorrectionHeadBindingV1 union, direct dependency result digests, and dependency transitive input digests
    rules:
      - Direct and transitive source sets are both exposed in evidence export. A derived metric cannot hash only child scalar values or only its own table reads.
      - Any leaf correction, withdrawal, restatement, adjustment, source-set membership change, or dependency formula change changes every affected descendant inputSetDigest.
      - Reordering equivalent canonical sets is byte-stable; dropping a zero, withdrawn, excluded, unknown, or correction member is not equivalent and fails lossless reconstruction.

