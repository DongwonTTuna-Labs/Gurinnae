      capability_id: specs/product/owner-addendum-2026-07-14.yaml#authorization_delta
      sku_readiness_item_blocker_remediation: specs/database/addendum/0029-invoice-revenue-sku.yaml#closed_types
  closed_response_types:
    OperationalOwnerBindingV1:
      additional_properties: false
      fields: {primaryFunction: closed-owner-function, backupFunction: closed-owner-function, escalationFunction: closed-owner-function, primaryRoleBindingHmac: sha256, backupRoleBindingHmac: sha256, ownerBindingSetDigest: sha256, responseDueAt: datetime, nextReviewAt: datetime}
      invariants: [primary and backup function/binding pairs are present, primaryRoleBindingHmac differs from backupRoleBindingHmac, bindings are current at asOf, raw person/account/contact identity is absent]
    SmallSampleEvidenceV1:
      additional_properties: false
      fields: {eligibleCount: 'int64[0..4]', numeratorCount: nullable-int64, pendingCount: int64, unknownCount: int64, excludedCount: int64, maturityHorizonHours: nullable-decimal-string, suppressionState: 'enum<COUNTS_ONLY|AUTHORIZED_ORDERED_DURATIONS>', suppressionReason: 'const<SAMPLE_TOO_SMALL>', evidenceDigest: sha256}
    Wilson95IntervalV1:
      additional_properties: false
      fields: {method: 'const<WILSON_SCORE_WITHOUT_CONTINUITY_CORRECTION_V1>', confidenceLevel: 'const<0.95>', z: 'const<1.959963984540054>', successCount: int64, trialCount: int64, lower: decimal-string, upper: decimal-string, scale: 'const<12>', intervalDigest: sha256}
      invariant: trialCount >= 5, 0 <= successCount <= trialCount, and lower/upper exactly satisfy statistical_result_contract.wilson_95_v1
    MetricOrderedObservationV1:
      additional_properties: false
      fields: {ordinal: 'int64[1..max]', observationKind: 'enum<EVENT|RIGHT_CENSORED|TERMINAL_WITHOUT_EVENT>', durationHours: nullable-decimal-string, lowerBoundHours: nullable-decimal-string, selectedForP90: boolean, observationDigest: sha256}
      invariants:
        - EVENT has finite durationHours and null lowerBoundHours.
        - RIGHT_CENSORED has null durationHours and a finite lowerBoundHours at least 336 for the matured P90 population.
        - TERMINAL_WITHOUT_EVENT has null durationHours and lowerBoundHours 336 because it is a known objective failure with no later event in the episode.
        - No identity, source, campaign, money, raw timestamp, contract reference, or content is serialized.
    MetricOrderedObservationSetV1:
      additional_properties: false
      fields: {metricId: 'const<BM-ACTIVATION-TTFPV-P90>', unit: 'const<hours>', ordering: 'const<DURATION_ASC_EVENT_THEN_CENSOR_THEN_TERMINAL_V1>', eligibleCount: int64, eventCount: int64, rightCensoredCount: int64, terminalWithoutEventCount: int64, observations: 'ordered-array<MetricOrderedObservationV1>[0..10000]', visibility: 'enum<AUTHORIZED_INTERNAL|SUPPRESSED_COUNTS_ONLY>', setDigest: sha256}
      privacy: observations is empty for SUPPRESSED_COUNTS_ONLY, every nonempty set requires budgets.manage and never appears in INT-001/public/export/log/analytics/notification
    ScalarMetricResultV1:
      additional_properties: false
      fields: {kind: 'const<SCALAR>', unit: closed scalar metric unit, value: nullable-decimal-string, resultDigest: sha256}
    BinomialRateMetricResultV1:
      additional_properties: false
      fields: {kind: 'const<BINOMIAL_RATE>', numeratorCount: int64, denominatorCount: int64, rate: nullable-decimal-string, wilson95: nullable<Wilson95IntervalV1>, smallSample: nullable<SmallSampleEvidenceV1>, resultDigest: sha256}
      invariants:
        - denominatorCount >= 5 and complete KNOWN input requires rate and Wilson95IntervalV1; denominatorCount 1..4 requires null rate/wilson95 and SmallSampleEvidenceV1.
        - denominatorCount 0 requires null rate/wilson95 and DENOMINATOR_ZERO or COHORT_NOT_MATURE at the envelope.
    DeterministicRatioMetricResultV1:
      additional_properties: false
      fields: {kind: 'const<DETERMINISTIC_RATIO>', numerator: nullable-decimal-string, denominator: nullable-decimal-string, ratio: nullable-decimal-string, unit: closed deterministic ratio unit, resultDigest: sha256}
      invariant: Wilson interval is inapplicable; a KNOWN nonzero denominator binds exact numeric numerator/denominator and half-even result
    SourceBreakdownEntryV1:
      additional_properties: false
      fields: {ordinal: 'int32[1..11]', sourceKind: closed acquisition source kind including UNKNOWN_SOURCE, episodeCount: int64, share: nullable-decimal-string, wilson95: nullable<Wilson95IntervalV1>, entryDigest: sha256}
    SourceBreakdownMetricResultV1:
      additional_properties: false
      fields: {kind: 'const<SOURCE_BREAKDOWN>', totalQualifiedEpisodeCount: int64, knownSourceEpisodeCount: int64, unknownSourceEpisodeCount: int64, entries: 'ordered-array<SourceBreakdownEntryV1>[11]', smallSample: nullable<SmallSampleEvidenceV1>, conservationDigest: sha256, resultDigest: sha256}
      invariants:
        - Entries exactly follow acquisition_attribution_contract.source_order_exactly and their counts sum to totalQualifiedEpisodeCount.
        - total below five suppresses shares/Wilson and singleton source detail outside authorized OPS-004; any UNKNOWN_SOURCE makes attribution-dependent decision status UNKNOWN.
    TimeToEventMetricResultV1:
      additional_properties: false
      fields: {kind: 'const<TIME_TO_EVENT_P90>', estimator: 'const<RESTRICTED_EMPIRICAL_P90_OBJECTIVE_V1>', estimateState: 'enum<EXACT|EXCEEDS_OBSERVATION_BOUND|SAMPLE_TOO_SMALL|COHORT_NOT_MATURE|UNKNOWN>', eligibleCount: int64, eventCount: int64, rightCensoredCount: int64, terminalWithoutEventCount: int64, selectedRank: nullable-int64, p90Hours: nullable-decimal-string, lowerBoundHours: nullable-decimal-string, smallSample: nullable<SmallSampleEvidenceV1>, orderedObservationSet: nullable<MetricOrderedObservationSetV1>, resultDigest: sha256}
      invariants:
        - EXACT requires finite p90Hours and null lowerBoundHours; EXCEEDS_OBSERVATION_BOUND requires null p90Hours, lowerBoundHours at least 336, status KNOWN, thresholdState BREACH, and non-NONE issue/action.
        - SAMPLE_TOO_SMALL requires eligibleCount 1..4, null p90/lower bound, SmallSampleEvidenceV1, and NOT_APPLICABLE; COHORT_NOT_MATURE has no threshold claim; UNKNOWN preserves typed diagnostic counts but no decision value.
    BusinessMetricResultV1:
      additional_properties: false
      discriminator: kind
      one_of: [ScalarMetricResultV1, BinomialRateMetricResultV1, DeterministicRatioMetricResultV1, SourceBreakdownMetricResultV1, TimeToEventMetricResultV1]
    BusinessMetricValueV1:
      additional_properties: false
      fields:
        metricId: closed enum of the 25 metrics keys in this contract
        metricVersion: int64[1..max]
        formulaDigest: sha256
        policyDigest: sha256
        inputSetDigest: sha256
        status: enum<KNOWN|UNKNOWN|NOT_APPLICABLE>
        reasonCode: closed-business-metric-status-reason
        resultKind: enum<SCALAR|BINOMIAL_RATE|DETERMINISTIC_RATIO|SOURCE_BREAKDOWN|TIME_TO_EVENT_P90>
        result: BusinessMetricResultV1 whose discriminator equals resultKind and the exact metric-result-kind registry
        eligibleCount: int64[0..max]
        pendingCount: int64[0..max]
        unknownCount: int64[0..max]
        unknownReasons: ordered-array<BusinessMetricUnknownReasonV1>[0..64]
        windowStart: datetime
        windowEnd: datetime
        accountingTimezone: IANA-timezone
        asOf: datetime
        latestSourceAt: nullable<datetime>
        freshUntil: nullable<datetime>
        thresholdState: enum<PASS|BREACH|NOT_EVALUATED|UNKNOWN>
        issueCode: closed-business-issue
        breachAction: closed-business-breach-action
        owner: OperationalOwnerBindingV1
      invariants:
        - KNOWN requires reasonCode NONE and a complete exact typed result, except the declared TimeToEvent EXCEEDS_OBSERVATION_BOUND is a known lower-bound breach with no fabricated scalar. unknownCount may be nonzero only for a diagnostic population proven not to alter the decision; otherwise status is UNKNOWN.
        - UNKNOWN requires every decision value in result null, thresholdState UNKNOWN, a non-NONE reasonCode, unknownCount at least one, nonempty unknownReasons whose first code equals reasonCode, non-NONE issueCode, and a current owner action.
        - NOT_APPLICABLE requires every decision value null, thresholdState NOT_EVALUATED, reasonCode in DENOMINATOR_ZERO|COHORT_NOT_MATURE|SAMPLE_TOO_SMALL|CAPABILITY_NOT_OFFERED, unknownCount zero, empty unknownReasons, issueCode NONE, breachAction NONE, and the applicable typed sample/pending evidence.
        - A healthy KNOWN result requires thresholdState PASS|NOT_EVALUATED, issueCode NONE, and breachAction NONE; no metric-specific serializer may omit or weaken these rules.
    BusinessMetricUnknownReasonV1:
      additional_properties: false
      fields: {reasonCode: closed-business-metric-unknown-reason, count: 'int64[1..max]', ownerFunction: closed-owner-function, firstObservedAt: datetime, nextReviewAt: datetime}
    BusinessFunnelStageV1:
      additional_properties: false
      fields: {stage: closed-funnel-stage, state: closed-funnel-stage-state, organizationCount: int64, unknownCount: int64, earliestEnteredAt: nullable<datetime>, latestEnteredAt: nullable<datetime>, evidenceSetDigest: sha256, primaryIssueCode: nullable<closed-business-issue>, ownerFunction: closed-owner-function}
    BusinessIssueV1:
      additional_properties: false
      fields: {issueCode: closed-business-issue, severity: 'enum<INFO|WARNING|BLOCKING|HARD_STOP>', metricId: nullable<closed-business-metric-id>, observedValue: nullable<decimal-string>, thresholdValue: nullable<decimal-string>, status: 'enum<KNOWN|UNKNOWN>', firstObservedAt: datetime, ownerFunction: closed-owner-function, nextActionCode: closed-remediation-code, nextReviewAt: datetime, evidenceDigest: sha256}
    ReadinessBlockerV1:
      additional_properties: false
      fields: {itemCode: closed-sku-readiness-item-code, blockerCode: closed-sku-readiness-blocker-code, remediationCode: closed-sku-readiness-remediation-code, ownerFunction: closed-owner-function, evidenceAsOf: nullable<datetime>, evidenceExpiresAt: nullable<datetime>, evidenceDigest: sha256}
    TelemetryGapV1:
      additional_properties: false
      fields: {capabilityId: closed-capability-id, gapStart: datetime, gapEnd: nullable<datetime>, expectedReceiptCount: int64, observedReceiptCount: int64, incidentId: uuid, ownerFunction: 'const<SRE>', evidenceDigest: sha256}
    ClosedMetricWindowV1:
      additional_properties: false
      fields: {start: datetime, end: datetime, accountingTimezone: IANA-timezone, asOf: datetime}
      invariant: start < end <= asOf
    MetricSourceBindingV1:
      additional_properties: false
      fields: {metricId: closed-business-metric-id, relation: closed-business-source-relation, sourceRowId: uuid, sourceVersion: int64, sourceDigest: sha256, effectiveAt: datetime, correctionHeadId: nullable<uuid>, included: boolean, exclusionOrUnknownCode: nullable<closed-business-metric-unknown-reason>}
    CorrectionHeadBindingV1:
      additional_properties: false
      fields: {relation: closed-correctable-business-relation, rootId: uuid, headId: uuid, headVersion: int64, normalizedEffect: 'enum<ORIGINAL|REPLACEMENT|REVERSAL|INVERSE|SUPERSEDING|RESTATEMENT|WITHDRAWN|ADJUSTMENT>', sourceEffect: closed relation-specific physical effect, predecessorHeadId: nullable<uuid>, predecessorDigest: nullable<sha256>, effectiveDelta: nullable<decimal-string>, headDigest: sha256, selectedAsOf: datetime}
      invariant: normalizedEffect maps losslessly under economic_fact_boundary_contract.correction_effect_union; ADJUSTMENT requires nonzero effectiveDelta and every non-original requires predecessor identity/digest
    BusinessPulseV1:
      additional_properties: false
      fields: {asOf: datetime, qualifiedCount: int64, configuredCount: int64, dataReadyCount: int64, activatedCount: int64, atRiskCount: int64, unknownCount: int64, topIssueCode: closed-business-issue, ownerFunction: closed-owner-function, nextReviewAt: datetime}
      privacy: aggregate counts only; values below 5 use a LESS_THAN_FIVE bucket and never expose organization/campaign identity or money
    BusinessHealthV1:
      additional_properties: false
      fields: {asOf: datetime, specificationVersion: string, metricCatalogDigest: sha256, funnel: 'ordered-array<BusinessFunnelStageV1>[8]', metrics: 'ordered-array<BusinessMetricValueV1>[25]', topIssue: BusinessIssueV1, readinessState: 'enum<READY|BLOCKED|UNKNOWN>', unknownSourceCount: int64, nextReviewAt: datetime}
    CommercialReadinessAndSlaV1:
      additional_properties: false
      fields: {asOf: datetime, profileId: 'const<BM-PILOT-CORE-V1>', readinessEvaluationId: uuid, readinessDigest: sha256, state: 'enum<READY|BLOCKED|UNKNOWN>', blockers: 'ordered-array<ReadinessBlockerV1>', slaMetrics: 'ordered-array<BusinessMetricValueV1>', telemetryGaps: 'ordered-array<TelemetryGapV1>', activeIncidentIds: 'unique-array<uuid>', ownerFunction: closed-owner-function, nextReviewAt: datetime}
    BusinessMetricEvidenceExportV1:
      additional_properties: false
      fields: {schemaVersion: 'const<1>', generatedAt: datetime, requestedWindow: ClosedMetricWindowV1, metricCatalogDigest: sha256, metrics: 'ordered-array<BusinessMetricValueV1>', sourceBindings: 'ordered-array<MetricSourceBindingV1>', correctionHeads: 'ordered-array<CorrectionHeadBindingV1>', exportDigest: sha256}
      forbidden: [raw CRM/contact identity, customer name, external contract/invoice reference, search/response/evidence content, token, filename, cookie, session identity, generic JSON]
  healthy_issue_semantics:
    metric: A KNOWN metric with thresholdState PASS or NOT_EVALUATED has issueCode NONE. A NOT_APPLICABLE metric also has NONE when its reason is an expected empty denominator or immature cohort rather than missing evidence. UNKNOWN always has issueCode DATA_UNKNOWN or its more specific typed issue and never NONE.
    screen: BusinessHealthV1.topIssue uses issueCode NONE, severity INFO, null metric/value/threshold, status KNOWN, nextActionCode NO_ACTION_REQUIRED, and the current evidence digest only when every required metric is KNOWN or legitimately NOT_APPLICABLE, no threshold is breached, readiness is READY, and no open trust/incident blocker exists.
    ordering: HARD_STOP before BLOCKING before WARNING before DATA_UNKNOWN before NONE; ties use oldest firstObservedAt then issueCode lexical order.
  mappings:
    - screen: INT-001
      operation: getInternalDashboard
      view: role-safe BusinessPulseV1 aggregate only when actor also has budgets.manage
      required_information: [qualified/configured/data-ready/activated counts, at-risk count by reason, freshness, unknown count, next owner]
      forbidden_information: [organization identity, contract reference, invoice/revenue amount, acquisition campaign, contact data]
    - screen: OPS-004
      operation: getBudgetOverview
      view: BusinessHealthV1
      required_information: [funnel with cohort denominators, paid MVW, retention, revenue qualification, recognized revenue, reconciliation, margin, cost per paid MVW, CAC/payback, support capacity, formula version/digest, as_of, unknown reasons]
      ten_second_order: [current commercial state, largest breach/unknown, value/activation, retention, revenue/margin, evidence freshness, next owner/action]
    - screen: OPS-004
      operation: exportCostReport
      view: audited business-metric evidence export
      required_information: [formula and policy digests, cohort/window, input-set digest, source receipt IDs/digests, correction heads, unknown/exclusion counts, generated_at]
      export_dimensions: [ORGANIZATION_HMAC, SKU, OUTCOME, COST_CATEGORY, ACQUISITION_SOURCE_KIND, COHORT_MONTH, DAY]
    - screen: OPS-001
      operation: getOperationsOverview
      view: CommercialReadinessAndSlaV1
      required_information: [pilot readiness blockers, SLA status, telemetry gaps, active incidents, provider/cost dependencies, owner, next review]
    - screen: AUD-001
      operation: searchAuditEvents
      view: qualification, metric policy, reconciliation, correction, readiness, and pause/resume decision receipts
      required_information: [actor/function, event kind, object HMAC, exact digest, prior/current version, reason, timestamp]
  states:
    LOADING: skeleton preserves heading/metric layout and announces loading once
    EMPTY: explains no eligible cohort and distinguishes NOT_APPLICABLE from zero
    PARTIAL: renders known values plus a prominent unknown-source count and excluded scope
    STALE: shows last-known value, cutoff, stale source, consequence, and owner; never green
    ERROR: preserves request/trace receipt, retry eligibility, and unaffected known sections
    BLOCKED: names failed readiness/trust/reconciliation gate and remediation owner
  action_rule: Business panels are read-only evidence views; existing reviewed budget/provider/kill-switch actions keep their own exact operation and approval path. No dashboard click mutates a commercial, editorial, or accounting fact.

operating_cadence:
  daily: source/data readiness, queue/provider, delivery reconciliation, telemetry gaps, incidents, budget and hard-stop review
  weekly: qualification/onboarding losses, activation blockers, AI/evidence quality, at-risk organizations, support load, and corrective experiments
  monthly: matured activation/retention cohorts, invoice membership, recognized revenue, margin, CAC, SLA, churn, trust incidents, and continuation/pause decision
  quarterly: source rights, restore, accessibility, conflict/funding concentration, pricing policy, free boundary, and product stop/pivot review

acceptance:
  feature: tests/acceptance/business-model-addendum.feature
  feature_tag: '@additive-review'
  contract_status: REVIEW_REQUIRED
  scenario_count: 41
  metric_dictionary: implementation-evidence/business-model-metric-dictionary.md
  required_execution_mapping:
    path: tests/acceptance/supplemental-executable-mapping.yaml
    current_status: CATALOG_PRESENT_IMPLEMENTATION_MISSING
    current_truth: All 41 scenario IDs are present once with skip_policy FORBIDDEN, but each is implementation_status MISSING, the declared tests/integration/acceptance/business_model_addendum.rs path is absent, and the declared gurine-acceptance-tests package/commands are not executable.
    rule: Every AC-BUSINESS_MODEL scenario requires exactly one skip_policy FORBIDDEN mapping with a present implementation path and an executing command before release freeze.
  final_tag_rule: '@final is forbidden while any open_cross_file_blockers row is OPEN or the supplemental mapping/runtime evidence is absent.'
  hard_rules:
    - Every metric ID in this contract appears exactly once in the dictionary, declares breach_action, and exposes all required evidence fields.
    - All formulas use the same named metric versions, half-open windows, timezone, correction heads, and half-even arithmetic in API, UI, export, and tests.
    - No skipped, fixture-only, placeholder, 501, generic JSON, or analytics-only implementation satisfies a production business gate.
    - A release cannot claim business-model LGTM until database, operation, screen, runtime, and production-evidence mappings above are implemented and independently reviewed on one frozen digest.
