    payload_required: [revocationId, assertionId, revocationReceiptDigest, revokedAt]
    redaction: {allowlist: payload_schema.properties only, forbidden: [email, domain, endpoint, document, source locator, raw proof, raw reason, organization name, token, secret]}
    ordering: {key: [aggregate_type, aggregate_id], sequence: aggregate_version, rule: revocation is append-only and immediately prevents new response-identity use, tie_breaker: [occurred_at, event_id]}
    replay: {delivery: at-least-once, exact_replay: owner returns the stored revocation receipt and emits no second event, changed_event_identity: EVENT_REPLAY_CONFLICT}
    consumers: []
    consumer_bindings: []
    fact_semantics: IMMUTABLE_FACT

journey_event_runtime_contract:
  events: [journey.instance_started.v1, journey.handoff_requested.v1, journey.handoff_decided.v1, journey.handoff_escalated.v1, journey.handoff_expired.v1, journey.outcome_recorded.v1]
  producers: [ops.start_journey_instance_v1, ops.request_journey_handoff_v1, ops.decide_journey_handoff_v1, ops.escalate_journey_handoff_v1, ops.expire_journey_handoff_v1, ops.record_journey_outcome_v1]
  consumers: [journey-projector, operations-projector, audit-indexer]
  envelope_rule: eventId exists only in the canonical event envelope and is forbidden from every payload required or properties set
  reconstruction_rule: immutable receipt IDs and digests plus explicit nullable replacement receipt identities reconstruct every applied instance version without reading a mutable parent or handoff head
  ordering_rule: aggregate version equals receipt journey_instance_version and receipt sequence; a compound branch emits two consecutive versions and consumers park gaps rather than collapsing the steps
  set_equalities:
    - union of producer_routines across the six events equals producers
    - every event consumers set and consumer_bindings consumer set both equal consumers
    - every payload required list equals both payload_schema.required and payload_schema.properties keys
    - stored escalation tokens across request decision escalation and expiry events are exactly NOT_DUE DUE ESCALATED RESOLVED and NONE never appears as a payload value

set_equality_assertions:
- set(events) == set(owner-addendum.event_delta.event_types)
- len(events) == event_count after evaluating the source-derived count expression; numeric event inventory literals are forbidden
- every payload_schema is type object and additionalProperties false; required equals payload_required and properties keys equal the disjoint union of payload_required plus payload_optional where omitted payload_optional means an empty list
- eventId is envelope-only and is forbidden from every event payload; the six journey events share exactly journey-projector, operations-projector and audit-indexer consumers
- every producer and consumer is present in logical_component_bindings
- every consumer binding names physical service, module, handler, inbox key, replay, failure and ordering behavior
- union of command-semantics outbox events that are additive is a subset of events
