      properties:
        retentionRequestId:
          $ref: '#/$defs/uuid'
        decisionVersion:
          type: integer
          minimum: 0
        transition:
          type: string
          enum:
          - START_REVIEW
          - APPROVE
          - REJECT
        priorState:
          type: string
          enum:
          - RECEIVED
          - REVIEW
          - APPROVED
        state:
          type: string
          enum:
          - REVIEW
          - APPROVED
          - REJECTED
        inventorySnapshotDigest:
          type: [string, 'null']
          pattern: ^[0-9a-f]{64}$
        holdCoverageDigest:
          type: [string, 'null']
          pattern: ^[0-9a-f]{64}$
        decisionDigest:
          $ref: '#/$defs/sha256'
        receiptDigest:
          $ref: '#/$defs/sha256'
      oneOf:
      - properties:
          transition: {const: START_REVIEW}
          priorState: {const: RECEIVED}
          state: {const: REVIEW}
          inventorySnapshotDigest: {type: 'null'}
          holdCoverageDigest: {type: 'null'}
      - properties:
          transition: {const: APPROVE}
          priorState: {const: REVIEW}
          state: {const: APPROVED}
          inventorySnapshotDigest: {$ref: '#/$defs/sha256'}
          holdCoverageDigest: {$ref: '#/$defs/sha256'}
      - properties:
          transition: {const: REJECT}
          priorState: {const: REVIEW}
          state: {const: REJECTED}
          inventorySnapshotDigest: {type: 'null'}
          holdCoverageDigest: {type: 'null'}
    payload_required:
    - retentionRequestId
    - decisionVersion
    - transition
    - priorState
    - state
    - inventorySnapshotDigest
    - holdCoverageDigest
    - decisionDigest
    - receiptDigest
    redaction:
      allowlist: payload_schema.properties only
      forbidden:
      - secret
      - token
      - credential
      - signature bytes
      - raw request/response body
      - plaintext endpoint
      - message body
      - identity proof
      - cookie
      - provider-native account or recipient ID
      reference_rule: restricted source material appears only as opaque internal ID, HMAC or sha256 digest
    ordering:
      key:
      - aggregate_type
      - aggregate_id
      sequence: aggregate_version
      rule: strict monotonic; same event_id is replay, lower version is stored as out-of-order evidence only where declared, and a gap parks processing
        until reconciliation
      tie_breaker:
      - occurred_at
      - event_id
    replay:
      delivery: at-least-once
      deduplication_relation: ops.inbox
      deduplication_key:
      - consumer
      - event_id
      exact_replay: return stored result; zero repeated domain mutation, notification, job, audit or external effect
      changed_event_identity: same event_id with changed canonical envelope digest is EVENT_REPLAY_CONFLICT and incident evidence
    consumers:
    - retention-worker
    consumer_bindings:
    - consumer: retention-worker
      physical_service: workflow-worker
      module: retention
      handler: handle_privacy_request_decision_recorded_v1
      dispatch_predicate: payload.transition == APPROVE
      inbox_key:
      - consumer
      - event_id
      on_exact_replay: return stored handler result without repeating projection, notification, job or external effect
      failure: bounded exponential backoff with jitter, then durable DEAD_LETTER plus incident and operator-visible replay action
      ordering: reject regression; park gaps for aggregate reconciliation
