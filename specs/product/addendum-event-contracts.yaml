schema_version: 2
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
event_count: derived len(events)
event_count_rule: derived as len(events); set must remain equal to owner-addendum.event_delta.event_types
base_event_count: derived len(specs/events/event-catalog.yaml events)
final_event_count: derived base_event_count + event_count
rules:
- Every event uses the immutable v13 snake_case envelope and the event-specific draft-2020-12 closed payload schema below; additional payload
  properties are rejected before outbox insert.
- Producer persists aggregate mutation, successful audit and every outbox row in one transaction; immutable imports persist signed fact identity
  and outbox atomically.
- Every consumer claims ops.inbox(consumer,event_id) before handler effects. Exact replay returns stored result and cannot repeat notifications,
  jobs, projections or external effects.
- Aggregate versions are monotonic. A gap parks the event and requests reconciliation; a lower version cannot regress current state.
- Payload classification and allowlist redaction are enforced before storage, logs, traces and delivery. Secrets, endpoints, bodies, tokens and
  identity proof never enter an event.
- 'Consumer binding is executable: physical service, module and handler are mandatory for every declared consumer; missing handler is a hard gate,
  not a skipped consumer.'
$defs:
  uuid:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  datetime:
    type: string
    format: date-time
  nonempty_string:
    type: string
    minLength: 1
    maxLength: 10000
  decimal:
    type: string
    pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
  currency:
    type: string
    pattern: ^[A-Z]{3}$
  locale:
    type: string
    pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
  date:
    type: string
    format: date
envelope_schema: specs/schemas/event-envelope.schema.json
envelope_required:
- event_id
- event_type
- event_version
- occurred_at
- recorded_at
- aggregate_type
- aggregate_id
- aggregate_version
- producer
- correlation_id
- causation_id
- idempotency_key
- actor
- trace_id
- classification
- payload
envelope_constraints:
  event_type: exact registry key
  event_version: numeric suffix after .v
  aggregate_type: closed aggregate name
  aggregate_version: persisted aggregate/fact version after mutation
  classification: exact event contract value
  payload: must validate the selected closed payload_schema
  canonical_digest: SHA256(RFC8785_JCS(complete envelope excluding delivery metadata))
