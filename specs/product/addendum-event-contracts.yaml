consumer_runtime:
  claim: INSERT ops.inbox(consumer,event_id) before handler; existing completed row returns prior result
  transaction: inbox claim, idempotent handler state mutation and handler result commit atomically where one database owns them; external requests
    use a durable effect/outbox fence
  replay_operation: operator replay addresses the same event_id and consumer; it never manufactures a new event ID
  dead_letter: bounded attempts create durable job.dead_lettered.v1 or incident evidence with redacted error digest and an operator-visible remediation
    path
  no_skip: unknown event, missing handler, schema failure or ordering gap cannot be ACKed as success
derived_session_event_overlay:
  normative_source: specs/submission/addendum-derived-session-boundary.yaml
  events:
    response.appeal_created.v1:
      session_effect: consume APPEAL_CREATE and issue APPEAL_STATUS atomically with the appeal
      payload_rule: token-free appeal/request/receipt digest facts only; no session token/hash, cookie, next-session header or encrypted response bytes
    communication.authorization_changed.v1:
      session_effect: rotate COMMUNICATION_PROFILE under the identical subject/origin scope on each successful profile mutation
      payload_rule: token-free authorization/endpoint/profile digest facts only; no session token/hash, cookie, next-session header or encrypted endpoint bytes
  exact_replay: finalized derived-session command replay returns stored response bytes before ACTIVE-state validation and emits no second domain event
  changed_replay: same replay identity with changed request digest returns IDEMPOTENCY_CONFLICT and emits no event
  redaction_hard_gate: raw or hashed session credentials and X-Gurine-Next-Submission-Session are forbidden in every envelope, payload, log, audit and trace

response_submission_v2_overlay:
  retired_events: [response.submitted.v1, notification.response_submitted.v1, workflow.response_submitted.v1]
  retirement_rule: the token-bearing v1 payload schemas remain historical bytes but have no producer or consumer and cannot be inserted by a runtime role after 0027; new submission paths emit v2 only
  producer_operation: submitResponse
  atomic_events: [response.submitted.v2, notification.response_submitted.v2, workflow.response_submitted.v2]
  payload:
    additionalProperties: false
    required: [responseSubmissionId,responseRequestId,responseRequestVersion,responseRequestBindingDigest,submissionSha256,receiptVersion,receiptDigest,submittedAt]
    properties:
      responseSubmissionId: {$ref: '#/$defs/uuid'}
      responseRequestId: {$ref: '#/$defs/uuid'}
      responseRequestVersion: {type: integer, minimum: 1}
      responseRequestBindingDigest: {$ref: '#/$defs/sha256'}
      submissionSha256: {$ref: '#/$defs/sha256'}
      receiptVersion: {type: integer, minimum: 1}
      receiptDigest: {$ref: '#/$defs/sha256'}
      submittedAt: {$ref: '#/$defs/datetime'}
  producer_transaction: submitResponse locks and terminalizes the draft/request/session, inserts the immutable response submission and token-free receipt, audit and all three v2 events before commit; the payload is built only from the persisted row and DB timestamps
  workflow_consumer:
    consumer: response-submission-materializer
    physical_service: workflow-worker
    handler: handle_workflow_response_submitted_v2
    inbox_identity: [consumer,event_id]
    routine: editorial.materialize_response_submission_intake_v1
    outcomes: [APPLIED,NO_OP_ALREADY_MATERIALIZED]
    transaction: claim and bind the exact envelope; lock submission, request and case; validate every payload field against immutable rows; insert exactly one editorial response; write both reciprocal origin bindings; append one audit and editorial.response_materialized.v1 outbox only for APPLIED; store the typed inbox result and digest in the same SERIALIZABLE transaction
    replay: exact completed replay returns the stored result and writes zero; a distinct event that is byte-equal to an already reciprocally materialized submission stores NO_OP_ALREADY_MATERIALIZED in its inbox row and writes no domain/audit/outbox row; any mismatched payload or existing pointer is EVENT_EFFECT_CONFLICT with all new writes rolled back
  notification_consumer:
    consumer: notification-worker
    rule: uses only submission/request/receipt IDs and digests to create an internal task notification; response body, token, endpoint and party identity are reloaded only under the declared authorization and never enter the event
  domain_event: response.submitted.v2 is a durable audit/projector fact and never serves as an unowned alternate materializer route; only workflow.response_submitted.v2 owns response materialization
  schema_set_equality: the three JSON Schema files and this payload have the same eight required/property names, formats and bounds; requestToken, actor_id, operation_id and arbitrary request_id are forbidden

events:
  evidence.segment_created.v1:
    category: DOMAIN
    schema_version: 1
    producer: ingest-worker
    producer_operations: []
    aggregate: EvidenceSegment
    classification: INTERNAL
    delivery: OUTBOX_AT_LEAST_ONCE
    payload_schema:
      type: object
      additionalProperties: false
      required:
      - evidenceSegmentId
      - sourceAssetId
      - sourceAssetRevision
      - locatorDigest
      - contentSha256
      properties:
        evidenceSegmentId:
          $ref: '#/$defs/uuid'
        sourceAssetId:
          $ref: '#/$defs/uuid'
        sourceAssetRevision:
          type: integer
          minimum: 0
        locatorDigest:
          $ref: '#/$defs/sha256'
        contentSha256:
          $ref: '#/$defs/sha256'
    payload_required:
    - evidenceSegmentId
    - sourceAssetId
    - sourceAssetRevision
    - locatorDigest
    - contentSha256
    redaction:
      allowlist: payload_schema.properties only
      forbidden:
      - secret
      - token
      - credential
      - signature bytes
      - raw request/response body
      - plaintext endpoint
      - message body
      - identity proof
      - cookie
      - provider-native account or recipient ID
      reference_rule: restricted source material appears only as opaque internal ID, HMAC or sha256 digest
    ordering:
      key:
      - aggregate_type
      - aggregate_id
      sequence: aggregate_version
      rule: strict monotonic; same event_id is replay, lower version is stored as out-of-order evidence only where declared, and a gap parks processing
        until reconciliation
      tie_breaker:
      - occurred_at
      - event_id
    replay:
      delivery: at-least-once
      deduplication_relation: ops.inbox
      deduplication_key:
      - consumer
      - event_id
      exact_replay: return stored result; zero repeated domain mutation, notification, job, audit or external effect
      changed_event_identity: same event_id with changed canonical envelope digest is EVENT_REPLAY_CONFLICT and incident evidence
    consumers:
    - analysis-worker
    - projection-worker
    - audit-indexer
    consumer_bindings:
    - consumer: analysis-worker
      physical_service: analysis-worker
      module: analysis
      handler: handle_evidence_segment_created_v1
      inbox_key:
      - consumer
      - event_id
      on_exact_replay: return stored handler result without repeating projection, notification, job or external effect
      failure: bounded exponential backoff with jitter, then durable DEAD_LETTER plus incident and operator-visible replay action
      ordering: reject regression; park gaps for aggregate reconciliation
    - consumer: projection-worker
      physical_service: projection-worker
      module: core_projection
      handler: handle_evidence_segment_created_v1
      inbox_key:
      - consumer
      - event_id
      on_exact_replay: return stored handler result without repeating projection, notification, job or external effect
      failure: bounded exponential backoff with jitter, then durable DEAD_LETTER plus incident and operator-visible replay action
      ordering: reject regression; park gaps for aggregate reconciliation
    - consumer: audit-indexer
      physical_service: projection-worker
      module: audit_index
      handler: handle_evidence_segment_created_v1
      inbox_key:
      - consumer
      - event_id
      on_exact_replay: return stored handler result without repeating projection, notification, job or external effect
      failure: bounded exponential backoff with jitter, then durable DEAD_LETTER plus incident and operator-visible replay action
      ordering: reject regression; park gaps for aggregate reconciliation
