cross_journey_arc_contracts:
  arcs:
  - caller_edge: J-03-E01
    mode: REPLACES_EDGE_DESTINATION
    caller_selector: ALL
    callee: J-11
    callee_entry: J-11::ORIGIN[CAS-009]
    success_return: RSP-001
    nonvalue_return: J-03::DELIVERY_NONVALUE
    recovery_return: J-03::DELIVERY_RECOVERY_REQUIRED
