required_functions:
- name: ops.read_business_health_projection_v1
  status: EXISTING_DESIGN_ONLY
  responsibility: Return current relationship-health state, every typed reason, highest still-proven milestone, formula/policy/input/freshness
    digests, and cutoff without writing a stage row/event.
- name: ops.read_business_stage_projection_v1
  status: EXISTING_DESIGN_ONLY
  responsibility: Derive CONFIGURED, DATA_READY, FIRST_PAID_VALUE, ACTIVATED, RETAINED, and CHURNED for one qualification
    episode and cutoff; missing predecessor is UNKNOWN/BLOCKED.
- name: ops.build_paid_evidence_member_candidate_set_v1
  status: NEW_FUNCTION_REQUIRED
  responsibility: Resolve the exact ten PaidEvidencePacketMemberInputV1 categories from the approved review snapshot and return
    typed candidate keys plus canonical set digest; it is read-only and cannot accept caller-supplied replacement facts.
- name: ops.resolve_organization_decision_terminal_v1
  status: NEW_FUNCTION_REQUIRED
  responsibility: Resolve exactly REJECTED_FINAL from one immutable ops.action_decisions REJECT receipt or EFFECT_SUCCEEDED
    from one immutable ops.execution_receipts EFFECT_SUCCEEDED receipt, with proposal/version/approval/counted-decision/packet/resulting-state
    parity. No new stage row or symbolic receipt kind is allowed.
- name: ops.resolve_outbound_delivery_terminal_v1
  status: NEW_FUNCTION_REQUIRED
  responsibility: Resolve one applied ops.outbound_delivery_receipts candidate in DELIVERED or READ with delivery/rendering/authorization/packet
    digest parity; PROVIDER_ACCEPTED and callback-attempt rows are rejected.
- name: ops.materialize_paid_evidence_packet_subject_v1
  status: EXISTING_DESIGN_ONLY
  responsibility: Persist the exact ten typed member candidate bindings before terminal binding, under private.MaterializePaidEvidencePacket
    idempotency and service identity.
- name: ops.bind_paid_terminal_receipt_v1
  status: NEW_FUNCTION_REQUIRED
  responsibility: Lock one awaiting packet and one exact terminal resolver result, finalize packetDigest once, append the
    terminal binding receipt, and emit product.paid_terminal_receipt_bound.v1.
- name: ops.append_paid_outcome_fact_v1
  status: NEW_FUNCTION_REQUIRED
  responsibility: Validate the finalized packet, allowed paid pair, active contract interval, DATA_READY cutoff, four ordered
    workflow milestones, and current correction head, then call the existing append-only outcome-fact boundary exactly once.
- name: ops.request_journey_handoff_v1
  status: EXISTING_DESIGN_ONLY
  responsibility: Persist J-12 HS-15, HS-16, and paid-workflow owner handoffs from the compiled graph; the caller cannot select
    receiver, capability, destination, or adapter.
