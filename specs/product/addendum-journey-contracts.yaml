rejected_alternatives:
- alternative: retain 9 journeys and 47 linear edges
  reason: J-10 through J-12 and mandatory durable return paths remain absent
- alternative: keep createResponseRequest and publishCase as direct journey effects
  reason: they bypass the current exact proposal review authorization execution and receipt spine
- alternative: infer branch edges from labels route names regex or list order
  reason: this recreates a dynamic workflow DSL and cannot prove resolver set equality
- alternative: use one generic branch handler without a closed selector map
  reason: unknown decisions could route or succeed silently
- alternative: collapse J-11 communication execution into one send edge
  reason: intent authorization delivery claim provider observation reconciliation and origin receipt are different facts
- alternative: treat PROVIDER_ACCEPTED as delivery or paid value
  reason: only applied DELIVERED or READ may close the delivery pair
- alternative: start J-12 at a backend qualification or stage projection
  reason: the user loses the current-health answer owned remediation task and explicit acknowledgement
- alternative: force the human-only J-12 path through CAS-011 by inventing an AgentRun
  reason: it fabricates AI provenance and violates the two-path decision
- alternative: persist a general commercial stage ledger or event stream
  reason: every stage after QUALIFIED is a deterministic as-of projection
- alternative: add a fourth paid surface or generic workflow route
  reason: the fixed three surfaces and 94 routes are product invariants
- alternative: mark J-12 complete at first paid value or activation
  reason: the journey completes only after two additional distinct roots in the fixed window and immutable audit visibility
implementation_gate:
  status: OPEN_IMPLEMENTATION
  rule: No edge, handler, handoff, event consumer, operation placement, database resolver, or acceptance receipt may be claimed
    complete until the same source digest passes real runtime gates.
