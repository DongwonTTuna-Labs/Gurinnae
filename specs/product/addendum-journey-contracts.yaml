edge_failure_contract:
  applicability: every primary edge row unless a stricter operation/state contract applies
  dispositions:
    CANCELLED:
      terminal_class: NONVALUE_TERMINAL
      requires:
      - reason
      - actor
      - effective_at
      - receipt_id
      - receipt_digest
    EXPIRED:
      terminal_class: NONVALUE_TERMINAL
      requires:
      - scope
      - expired_at
      - owner
      - receipt_id
      - receipt_digest
    REJECTED:
      terminal_class: NONVALUE_TERMINAL
      requires:
      - reason_code
      - reason_digest
      - decided_at
      - receipt_id
      - receipt_digest
    ACCESS_UNAVAILABLE:
      terminal_class: RECOVERY_TERMINAL
      requires:
      - safe_message
      - support_reference
      - safe_return_route
    CONFLICT:
      terminal_class: RECOVERY_TERMINAL
      requires:
      - attempted_version
      - current_version
      - readable_diff
      - preserved_input
    PARTIAL_EFFECT:
      terminal_class: RECOVERY_TERMINAL
      requires:
      - possible_effect
      - known_receipt_set_digest
      - reconciliation_owner
      - retry_fence
  named_specializations:
    J-10::DEPENDENCY_UNAVAILABLE:
      base_disposition: ACCESS_UNAVAILABLE
      terminal_class: RECOVERY_TERMINAL
      applies_to: every J-10 edge with an unavailable required provider tool parser projection or persistence dependency
  rule: These are typed edge exits, not additional happy-path edge IDs. They are included in terminal reachability but never
    counted in the fixed 129-edge registry.
