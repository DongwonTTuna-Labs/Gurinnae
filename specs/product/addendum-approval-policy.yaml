  RESPONSE_POLICY_CALENDAR: {executor_id: private.CreateBusinessCalendarVersion, transport: PRIVATE_APPLICATION_COMMAND, capability: responses.policy.manage, assurance: STEP_UP, transaction: serializable_decision, repository: response_clock}
