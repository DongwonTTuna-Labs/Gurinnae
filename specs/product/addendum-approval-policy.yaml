    repository: provider_control
    operation_policies:
      disableProviderRouting: {capability: kill_switch.execute, assurance: STEP_UP}
      testProviderConnection: {capability: jobs.operate, assurance: ACTIVE_SESSION}
      upgradeProviderModel: {capability: kill_switch.execute, assurance: STEP_UP}
      setModelAutoUpgrade: {capability: kill_switch.execute, assurance: STEP_UP}

safe_retry_proof:
  schema: SafeRetryProofV1
  additional_properties: false
  discriminator: kind
  one_of:
    - {kind: NO_PROVIDER_ATTEMPT, required: [attemptReceiptId, attemptReceiptDigest]}
    - {kind: PROVIDER_LOOKUP_NOT_FOUND, required: [lookupReceiptId, lookupReceiptDigest, observedAt]}
    - {kind: PROVIDER_IDEMPOTENT_REPLAY_SAFE, required: [providerCapabilityReceiptId, lookupReceiptId, providerIdempotencyKeySha256]}
  rules:
    - Operator confirmation, free-form OTHER and nullable proof are forbidden.
    - Any possible provider acceptance requires reconciliation and is not retryable.
    - The three-attempt ceiling counts actual effect dispatch attempts, not HTTP requests.
    - A definitive not-accepted result with dispatchAttemptCount below 3 may become RETRYABLE_FAILED; the same result at dispatchAttemptCount 3 becomes PERMANENT_FAILED atomically and can never remain retryable.
    - Claim or lease reclamation without a dispatch ordinal does not consume an attempt; assigning the next unique dispatch ordinal and incrementing the aggregate dispatchAttemptCount happen under the effect/attempt locks before egress.
    - Safe retry preserves approvalDigest, exact rendered bytes, target request digest, executor, provider configuration and provider idempotency key. Any changed business effect is a new proposal, never a retry.

cancel_reconcile_compensate:
  cancel_race:
    lock_order: [ops.in_flight_effects, ops.execution_authorizations, ops.execution_attempts, ops.execution_receipts]
    pre_dispatch: if the locked current attempt has no dispatchOrdinal, cancelActionExecution revokes its lease and commits aggregate/attempt CANCELLED before the worker can assign an ordinal
    dispatch_winner: if the worker assigned dispatchOrdinal first, cancellation commits CANCEL_REQUESTED and cannot assert cancellation as provider fact
    forbidden: [check-then-act without attempt lock, deleting queued work, marking possible effect CANCELLED, reusing a revoked fencing token]
  reconciliation:
    entry: any possible external acceptance, callback ambiguity, timeout after egress or cancel after dispatch
    destinations: [SUCCEEDED, PERMANENT_FAILED, RETRYABLE_FAILED, CANCELLED]
    retryable_destination_guard: authenticated definitive NOT_ACCEPTED proof and dispatchAttemptCount below 3
    cancelled_destination_guard: authenticated definitive NOT_ACCEPTED or provider-confirmed cancellation proof
    ambiguous_result: remains RECONCILIATION_REQUIRED with a new bounded observation receipt and incident linkage
  compensation:
    origin_kind: COMPENSATION
    required_link: compensatesExecutionId identifies one immutable SUCCEEDED predecessor effect
    content: a new typed ActionPayloadV1 with its own target version, common approval binding, quorum, authorization, idempotency identity and receipts
    predecessor: remains SUCCEEDED and immutable; compensation never rewrites or relabels history

cross_file_required_changes:
  status: BLOCKING_FINAL
  resource_error_contract:
    - Execution error/view schemas must expose aggregate state separately from attempt state and cannot use one conflated enum.
  operation_contract:
    - Generated OpenAPI, BFF clients and runtime repositories must consume the now-closed APPEAL_CREATE, APPEAL_STATUS and COMMUNICATION_PROFILE authorization/rotation overlay without widening RESPONSE_RECEIPT.
  physical_contract:
    - ops.in_flight_effects and proposal origin constraints must admit the exact COMPENSATION link contract while preserving a SUCCEEDED predecessor.
    - Every approval digest field above needs a typed physical column or closed encrypted snapshot field plus a canonical digest canary; missing fields cannot be replaced with nullable JSON.
  completion_rule: these imported files and runtime/acceptance tests must become set-equal before status may become FINAL.

binding_schema_set_equality:
  ApprovalBindingV1:
    canonical: closed_binding_schemas.ApprovalBindingV1
    imports:
      - specs/product/addendum-resource-error-contracts.yaml#schemas.ApprovalBindingV1
    assertion: imported field keys equal canonical properties keys equal required; decisionKind, actorId, assignmentId, slotKind, reasonCode, reason, assurance, conflictDeclarationId and decidedAt are absent
  ActionDecisionReceiptBindingV1:
    canonical: closed_binding_schemas.ActionDecisionReceiptBindingV1
    imports:
      - specs/product/addendum-resource-error-contracts.yaml#schemas.ActionDecisionReceiptBindingV1
    assertion: imported field keys equal canonical properties keys equal required and include decisionKind, actorId, assertedRequiredCapability, assurance, reasonDigest and conflictDeclarationId

private_application_command_authorization:
  materializeResponseRequestSent:
    caller: workflow-worker.response-request-materializer
    required_proof: claimed ops.inbox event for communication.delivery_receipt_recorded.v1 plus exact request/intent/rendering/endpoint/provider/delivery/receipt composite
    assurance: SERVICE_WORKLOAD_IDENTITY
    forbidden: [human actor assertion, browser session, inferred SENT state, unclaimed event replay]
  private.PublishRetraction:
    caller: action-execution-worker.retraction-executor
    required_proof: exact current RETRACTION ExecutionAuthorization, executionDigest, approvalDigest, complete counted decision receipt set, generation and unexpired STEP_UP authorization
    assurance: BOUND_STEP_UP_EXECUTION_AUTHORIZATION
    forbidden: [event-only materialization, changed tombstone bytes, mutable current-head substitution, second effect for one proposal version]
  private.ApplyCommercialControl:
    caller: action-execution-worker.commercial-control-executor
    required_proof: exact current COMMERCIAL_CONTROL ExecutionAuthorization, executionDigest, approvalDigest, complete counted decision receipt set, commercial trigger snapshot, product fence receipt, external import receipt and distinct acknowledgement receipt
    assurance: BOUND_STEP_UP_EXECUTION_AUTHORIZATION
    forbidden: [metric-only auto-effect, inferred acknowledgement, elapsed-time resume, import receipt reused as acknowledgement, commercial stage mutation, paid-value inference]
  private.ExecuteProviderControl:
    caller: analysis-worker.provider-control-executor
    required_proof: exact current PROVIDER_CONTROL ExecutionAuthorization, executionDigest, approvalDigest, complete counted decision receipt set, providerOperationId, providerId, expectedVersion and targetRequestDigest; providerOperationId selects the exact capability and assurance policy and is equality-checked against the immutable approval detail
    assurance: testProviderConnection uses BOUND_ACTIVE_SESSION_EXECUTION_AUTHORIZATION; disableProviderRouting upgradeProviderModel and setModelAutoUpgrade use BOUND_STEP_UP_EXECUTION_AUTHORIZATION
    forbidden: [browser command side door, workflow-worker communication executor, missing or mismatched providerOperationId, unversioned provider mutation, open JSON payload, changed target request, second effect for one proposal version]

base_operation_guards:
  activateKillSwitch:
    broad_classifier: GLOBAL_OR_PUBLIC_SERVING_OR_MULTI_TARGET
    required_execution_authorization: {actionKind: KILL_SWITCH, command: ACTIVATE, quorumClass: BROAD}
    failure: ACTION_APPROVAL_REQUIRED
  deactivateKillSwitch:
    broad_classifier: GLOBAL_OR_PUBLIC_SERVING_OR_MULTI_TARGET
    required_execution_authorization: {actionKind: KILL_SWITCH, command: DEACTIVATE, quorumClass: BROAD}
    failure: ACTION_APPROVAL_REQUIRED
  extendKillSwitch:
    broad_classifier: GLOBAL_OR_PUBLIC_SERVING_OR_MULTI_TARGET
    required_execution_authorization: {actionKind: KILL_SWITCH, command: EXTEND, quorumClass: BROAD}
    failure: ACTION_APPROVAL_REQUIRED
  publishCase:
    required_execution_authorization: {actionKind: PUBLICATION, generation: current, executionDigest: exact}
    failure: ACTION_APPROVAL_REQUIRED
    restoration_branch: TEMPORARILY_RESTRICTED requires cause-release receipt, preserved prior public state and a full fresh gate; ordinary publish authorization cannot bypass these predicates
  resolveCorrectionRequest:
    resolved_branch: resolution RESOLVED requires current publication preview/gate and atomically creates the CORRECTED immutable publication revision
    assurance: RECENT_SESSION
    failure: PUBLICATION_GATE_BLOCKED
  placeTemporaryRestriction:
    required_cause: exact legal, rights, hold or safety decision with preserved prior public state
    assurance: STEP_UP
    failure: PUBLICATION_RESTRICTION_CAUSE_INVALID
  placeLegalHold:
    target: closed thirteen-kind LegalHoldTargetBindingV1 including exact target version/digest and derived anchor digest; CORRECTION and SUBSCRIPTION bind immutable snapshots and COMMUNICATION_ENDPOINT binds existing id/version/endpoint_digest
    assurance: STEP_UP
    failure: LEGAL_HOLD_TARGET_INVALID
    unsupported_target: {targetKind: AUDIT_SUBJECT_RECORD, failure: LEGAL_HOLD_TARGET_UNSUPPORTED, http_status: 422, reason: no authoritative source relation, unlock_condition: versioned immutable source relation plus canonical digest owner lock and anchor foreign key}
