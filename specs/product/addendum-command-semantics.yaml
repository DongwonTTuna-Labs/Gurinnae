      predicates: [self-subject-or-conflicts.manage, exact-target-scope, current-policy-digest]
    effect_owner: control-api.declareConflict
    atomic_transition_group: gurine.command.declareConflict.v1
    state_disposition: conflict_declaration.NONE|ACTIVE->ACTIVE_NEW_APPEND_ONLY_FACT
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - conflict semantic advisory lock(subject_actor_id,target_type,target_id,conflict_type)
      - concrete target row by target-specific candidate key
      - editorial.conflict_declarations(subject_actor_id,target_type,target_id,conflict_type,declaration_sequence DESC,id)
      - ops.audit_events chain head
      - ops.outbox
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'AUTHORIZE current actor and target scope [exactly-one-pass] :: self declaration or conflicts.manage plus STEP_UP for another subject'
      - 'LOCK concrete typed target [exactly-one] :: derive target version and digest; caller values are comparison-only'
      - 'SELECT_FOR_UPDATE latest editorial.conflict_declarations series head [zero-or-one] :: sequence equals expectedPriorSequence'
      - 'VALIDATE closed conflict fact [exactly-one-pass] :: PRESENT or UNKNOWN physical state shape, evidence set digest, current policy and bounded interval'
      - 'INSERT editorial.conflict_declarations [exactly-one] :: sequence one or prior+one, immutable canonical digest and optional exact predecessor'
      - 'INSERT ops.audit_events [exactly-one] :: CONFLICT_DECLARED with digest-only evidence references'
      - 'INSERT ops.outbox [exactly-one] :: governance.conflict_declared.v1'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: finalize ConflictDeclarationReceiptV1 exact bytes'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality: {declaration_fact: exactly-one new success, audit: exactly-one new success, outbox: exactly-one new success, receipt: exactly-one new success, exact_replay: zero writes}
    audit_contract: external-command-audit-v1
    outbox: {events: [governance.conflict_declared.v1], cardinality: {governance.conflict_declared.v1: exactly-one}, payload_source: specs/product/addendum-event-contracts.yaml}
    receipt: {schema: ConflictDeclarationReceiptV1, contract: external-command-receipt-v1}
    errors:
      exact_codes: [INVALID_PARAMETER, TARGET_NOT_FOUND, CONFLICT_DECLARATION_STALE, CONFLICT_POLICY_STALE, CAPABILITY_DENIED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
      rollback_contract: all-or-nothing-v1
  withdrawConflict:
