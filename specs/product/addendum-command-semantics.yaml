    operation_kind: QUERY
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: GET /internal/v1/donation-offers
    caller: public-web SvelteKit server load
    effect_owner: billing-gateway
    authorization: request-bound service assertion with issuer public-web, audience billing-gateway, exact method/path/request digest and durable JTI replay rejection
    state_disposition: read the immutable in-memory TEST_ONLY offer fixture and write no business, audit, outbox or readiness state
    availability: {TEST_ONLY: 200 DonationFixtureOfferV1, PRODUCTION: 503 DEPENDENCY_UNAVAILABLE with zero state effect}
    authority: TEST_FIXTURE_ONLY_NO_PRODUCTION_AUTHORITY
