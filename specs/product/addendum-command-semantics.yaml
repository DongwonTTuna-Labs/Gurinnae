private_control_service_commands:
  reconcileAgentRun:
    operation_id: reconcileAgentRun
    api: control-api-private
    method: POST
    path: /v1/private/agent-runs/{runId}:reconcile
    operation_kind: COMMAND
    caller: reconciliation-worker only
    authorization:
      service_assertion: exact operation, method, canonical path, body digest, content type, idempotency key hash, deployment, caller and current job fence
      human_override: forbidden
      evidence: immutable authenticated adapter lookup, usage receipt or definitive no-dispatch fact bound by run/evidence ID/digest
    effect_owner: control-api-private.reconcileAgentRun
    atomic_transition_group: gurine.private.reconcileAgentRun.v2
    state_disposition: RECONCILIATION_REQUIRED selects one authenticated safe-retry or terminal edge; CANCEL_REQUESTED selects only authenticated terminal/no-effect edges and never ACTIVE
    idempotency_contract: external-command-idempotency-v1 with service identity scope
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.agent_runs(id)
      - ops.agent_provider_turns(agent_run_id,provider_turn_id)
      - ops.agent_tool_calls(agent_run_id,tool_call_id)
      - ops.agent_reconciliation_evidence(agent_run_id,evidence_id,evidence_sha256)
      - ops.agent_run_control_receipts(agent_run_id,aggregate_version)
      - ops.budget_reservations(id)
      - ops.budget_reservation_ledger_entries(reservation_id,sequence)
      - ops.audit_events chain head
      - ops.outbox
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: service-scoped claim or exact stored replay'
      - 'VERIFY reconciliation-worker service assertion and current job fence [exactly-one-pass] :: browser/human assertions and raw proof are rejected'
      - 'SELECT_FOR_UPDATE run, affected turn/tool, exact reconciliation evidence and prior control receipt [exactly-one-bound-graph] :: expected version and evidence ID/digest parity'
      - 'VERIFY authenticated proof against the immutable reconciliation row and receipt/digest columns on the bound provider turn or tool call [exactly-one-result] :: cross-run, stale, ambiguous or caller-asserted evidence fails'
      - 'RESOLVE budget reservations and effect certainty [complete affected set] :: no duplicate charge/effect and no release without proof'
      - 'SELECT one legal runtime edge [exactly-one] :: safe retry only from RECONCILIATION_REQUIRED; terminal result only with authenticated terminal/no-effect proof'
      - 'INSERT ops.agent_run_control_receipts [exactly-one] :: RECONCILIATION_WORKER command binding with reconcileAgentRun and exact request/key digests'
      - 'UPDATE ops.agent_runs [exactly-one] :: exact status/control/version/receipt head; recovered result is reused rather than redispatched'
      - 'INSERT ops.audit_events and ops.outbox [exactly-one-each] :: agent.run_control_changed.v2'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store AgentRunControlReceiptV2 exact bytes'
      network_io: FORBIDDEN_UNTIL_COMMIT; adapter lookup was persisted as immutable evidence before this command
    cardinality: {run: exactly-one, reconciliation_evidence: exactly-one, control_receipt: exactly-one, budget_resolution_set: exactly-one, audit: exactly-one, outbox: exactly-one, provider_or_tool_dispatch: zero, receipt: exactly-one, exact_replay: zero writes}
    outbox: {events: [agent.run_control_changed.v2], cardinality: {agent.run_control_changed.v2: exactly-one}, payload_source: specs/product/addendum-event-contracts.yaml}
    receipt: {schema: AgentRunControlReceiptV2, contract: external-command-receipt-v1}
    errors: {exact_codes: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, VERSION_CONFLICT, AGENT_RUN_STATE_INVALID, VALIDATION_FAILED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR], rollback_contract: all-or-nothing-v1}

private_action_executor_semantics:
  authorization: immutable current ExecutionAuthorization plus exact generation, executionDigest, approvalDigest, countedDecisionReceiptSetDigest, effectIdempotencyKeySha256 and closed targetRequest
  transaction:
    isolation: SERIALIZABLE
    common_lock_prefix: [ops.idempotency_keys(scope,key_hash), ops.in_flight_effects(id), ops.execution_authorizations(execution_id,generation), ops.execution_attempts(execution_id,generation)]
    common_lock_suffix: [ops.audit_events chain head, ops.outbox, ops.execution_receipts(execution_id,receipt_sequence)]
    statements:
      - claim or return the exact finalized effect-idempotency receipt before any target lock
      - lock and reauthorize the current execution/effect/attempt graph; reject stale generation, digest, decision set or assurance
      - lock the action-kind target relations in declared order and compare every targetRequest field with the approved target digest
      - call exactly one typed application routine; zero or multiple affected logical targets roll back
      - append one audit, declared domain outbox rows and one gapless execution receipt; only then mark the attempt/effect terminal or reconciliation-required
      - finalize the exact response bytes in the idempotency row before commit
    network_io: forbidden; an executor that creates outbound intent commits authorization before a separate adapter may claim it
  replay: exact bytes return the stored receipt with zero second target/audit/outbox/effect; changed bytes are IDEMPOTENCY_CONFLICT

private_application_commands:
  private.RecordOutboundDeliveryObservation:
    operation_id: private.RecordOutboundDeliveryObservation
    transport: PRIVATE_APPLICATION_COMMAND
    operation_kind: COMMAND
    trigger: notification-worker has one closed adapter result for an already committed outbound delivery attempt; callback and reconciliation gateways use the same owner routine with their own authenticated source variant
    effect_owner: notification-worker.communication-gateway
    atomic_transition_group: gurine.private.recordOutboundDeliveryObservation.v1
    state_disposition: outbound_delivery exact monotonic observation; synchronous provider response proves at most PROVIDER_ACCEPTED
    idempotency:
      identity: delivery_id + observation_key_digest
      exact_replay: return the stored outbound_delivery_observation_receipt_v1 with zero second receipt, delivery mutation, audit or outbox event
      changed_replay: same provider observation identity with changed canonical evidence is DELIVERY_OBSERVATION_CONFLICT and zero writes
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.outbound_deliveries(id)
      - ops.outbound_delivery_attempts(delivery_id,attempt_ordinal,id) when source_kind is PROVIDER_RESPONSE
      - ops.communication_callback_events(id) when source_kind is PROVIDER_CALLBACK
      - ops.communication_reconciliation_decisions(id) when source_kind is PROVIDER_POLL or RECONCILIATION_DECISION
      - ops.outbound_delivery_receipts(delivery_id,receipt_sequence,id)
      - ops.audit_events chain head
      - ops.outbox
      statements:
      - 'SELECT_FOR_UPDATE ops.outbound_deliveries [exactly-one] :: current delivery/version/generation and immutable intent/rendering/endpoint/provider binding'
      - 'SELECT typed source receipt [exactly-one by source variant] :: PROVIDER_RESPONSE locks the committed attempt; PROVIDER_CALLBACK locks callback ID+digest and copies received_at; PROVIDER_POLL or RECONCILIATION_DECISION locks decision ID+receipt digest and copies decided_at; cancellation/suppression use DB transaction time and accept no source pointer'
      - 'VERIFY closed adapter evidence [exactly-one] :: authenticated synchronous response may assert only PROVIDER_ACCEPTED; timeout, partial response or unsigned bytes become RECONCILIATION_REQUIRED'
      - 'INSERT ops.outbound_delivery_receipts [exactly-one-new-or-exact-replay] :: gapless sequence, receipt ID/digest and receipt-derived observed_at'
      - 'UPDATE_CONDITIONAL ops.outbound_deliveries [zero-or-one] :: only an applied monotonic receipt changes version/state/proof'
      - 'INSERT ops.audit_events [exactly-one-new] :: digest-only observation receipt'
      - 'INSERT_CONDITIONAL ops.outbox [exactly-one-applied-state-change] :: communication.delivery_receipt_recorded.v1 with exact receipt ID/sequence/digest/applied flag'
      network_io: FORBIDDEN; provider I/O completed before this transaction and its raw secret-bearing response is never persisted outside the encrypted provider capsule
    cardinality: {receipt: exactly-one-new-or-exact-replay, delivery_update: zero-or-one, audit: exactly-one-new, outbox: zero-or-one, exact_replay: zero writes}
    receipt: {schema: OutboundDeliveryObservationReceiptV1, persistence: ops.outbound_delivery_receipts, exact_identity: [id,delivery_id,receipt_sequence,receipt_digest,resulting_state,applied,observed_at]}
    errors: {exact_codes: [RESOURCE_NOT_FOUND, DELIVERY_VERSION_CONFLICT, DELIVERY_OBSERVATION_INVALID, DELIVERY_OBSERVATION_CONFLICT, DELIVERY_RECONCILIATION_REQUIRED, INTERNAL_ERROR], rollback: receipt/delivery/audit/outbox roll back together}
  materializeResponseRequestSent:
    operation_id: materializeResponseRequestSent
    transport: PRIVATE_APPLICATION_COMMAND
    operation_kind: COMMAND
    trigger: claimed communication.delivery_receipt_recorded.v1 inbox event whose authenticated provider evidence proves acceptance
    effect_owner: workflow-worker.response-request-materializer
    atomic_transition_group: gurine.private.materializeResponseRequestSent.v1
    state_disposition: response_request.DRAFT->SENT
    idempotency:
      identity: consumer=response-request-materializer + source_event_id
      claim: INSERT ops.inbox before any domain read; exact completed replay returns stored ResponseRequestSentMaterializationResultV1
      changed_replay: same event_id with changed canonical envelope digest is EVENT_REPLAY_CONFLICT and zero writes
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.inbox(consumer,event_id)
      - editorial.response_requests(id)
      - ops.communication_intents(id)
      - ops.communication_renderings(id)
      - intake.response_access_tokens(id)
      - intake.communication_endpoint_link_events(endpoint_id,endpoint_version)
      - ops.communication_provider_preflight_receipts(id)
      - ops.outbound_deliveries(id)
      - ops.outbound_delivery_receipts(delivery_id,receipt_sequence,id)
      - ops.audit_events chain head
      - ops.outbox
      statements:
      - 'INSERT_OR_READ ops.inbox [exactly-one-logical-result] :: claim logical consumer plus source event and persist the authoritative event-envelope digest before any domain read; same completed digest returns stored typed result, changed digest is EVENT_REPLAY_CONFLICT'
      - 'SELECT ops.outbox [exactly-one] :: reload the claimed source event and prove it is the exact outbox_event_id of the delivery receipt'
      - 'SELECT_FOR_UPDATE editorial.response_requests [exactly-one] :: immutable request binding and current state/version; DRAFT may apply, the exact already-SENT binding may no-op, and every other state is a typed no-op or conflict according to the closed result branch'
      - 'SELECT ops.communication_intents + ops.communication_renderings [exactly-one composite] :: exact request object, rendering and bytes digest'
      - 'SELECT intake.response_access_tokens [exactly-one] :: exact unexchanged COMMUNICATION_V1 access artifact bound to request, intent and rendering; no token generation occurs here'
      - 'SELECT intake.communication_endpoint_link_events + ops.communication_provider_preflight_receipts [exactly-one composite] :: exact immutable endpoint revision and provider preflight snapshot'
      - 'SELECT_FOR_UPDATE ops.outbound_deliveries [exactly-one] :: exact response request object binding and delivery version'
      - 'SELECT ops.outbound_delivery_receipts [exactly-one bound observation] :: ID/sequence/digest equal the event; only applied PROVIDER_ACCEPTED|DELIVERED|READ qualifies, while stale, wrong-object or other-state receipts select NO_OP_NONQUALIFYING without a domain write'
      - 'BRANCH result [exactly-one] :: DRAFT plus qualifying receipt is APPLIED_SENT; an exact already-SENT request pointer is NO_OP_ALREADY_SENT; a bound nonqualifying receipt is NO_OP_NONQUALIFYING; any mismatched existing sent pointer is RESPONSE_DELIVERY_BINDING_INVALID'
      - 'PREALLOCATE audit/outbox UUIDs and compute ResponseRequestSentReceiptV1 [exactly-one iff APPLIED_SENT] :: digest excludes only receiptDigest and includes the preallocated outbox ID without a reverse digest dependency'
      - 'INSERT editorial.response_request_sent_receipts and UPDATE editorial.response_requests [exactly-one each iff APPLIED_SENT] :: DRAFT to SENT, version+1, sent_at=exact DB-owned receipt observed_at, sent pointer; no clock row'
      - 'INSERT ops.audit_events and ops.outbox [exactly-one each iff APPLIED_SENT] :: RESPONSE_REQUEST_SENT and response.request_sent.v1'
      - 'UPDATE ops.inbox [exactly-one every branch] :: terminal disposition plus stored closed ResponseRequestSentMaterializationResultV1 and result digest in the same transaction'
      network_io: FORBIDDEN
    cardinality:
      APPLIED_SENT: {response_request_update: exactly-one, delivery_binding: exactly-one, audit: exactly-one, outbox: exactly-one, receipt: exactly-one, inbox_terminal_result: exactly-one}
      NO_OP_ALREADY_SENT: {response_request_update: zero, audit: zero, outbox: zero, receipt: zero, inbox_terminal_result: exactly-one}
      NO_OP_NONQUALIFYING: {response_request_update: zero, audit: zero, outbox: zero, receipt: zero, inbox_terminal_result: exactly-one}
      exact_replay: {all_writes: zero, result: byte-identical stored union}
    audit: {action: RESPONSE_REQUEST_SENT, classification: RESTRICTED, redaction: "no token, endpoint plaintext, rendered bytes, provider identifier or signature"}
    outbox: {events: [response.request_sent.v1], cardinality: {APPLIED_SENT: exactly-one, NO_OP_ALREADY_SENT: zero, NO_OP_NONQUALIFYING: zero, exact_replay: zero}}
    receipt: {schema: ResponseRequestSentMaterializationResultV1, applied_receipt: ResponseRequestSentReceiptV1, persistence: ops.inbox stored closed union plus applied-only editorial.response_request_sent_receipts and response_requests immutable sent pointer}
    errors: {exact_codes: [RESOURCE_NOT_FOUND, RESPONSE_REQUEST_VERSION_CONFLICT, RESPONSE_REQUEST_STATE_INVALID, RESPONSE_DELIVERY_BINDING_INVALID, EVENT_REPLAY_CONFLICT, INTERNAL_ERROR], rollback: inbox/domain/audit/outbox/receipt roll back together}
  materializeResponseSubmissionIntake:
    operation_id: materializeResponseSubmissionIntake
    transport: PRIVATE_APPLICATION_COMMAND
    operation_kind: COMMAND
    trigger: claimed workflow.response_submitted.v2 inbox event emitted atomically by submitResponse
    effect_owner: workflow-worker.response-submission-materializer
    atomic_transition_group: gurine.private.materializeResponseSubmissionIntake.v1
    state_disposition: immutable intake.response_submissions to one owned editorial.responses origin graph
    idempotency:
      identity: consumer=response-submission-materializer + source_event_id
      claim: INSERT ops.inbox before any domain read; exact completed replay returns stored ResponseSubmissionMaterializationResultV1
      changed_replay: same event_id with changed canonical envelope digest is EVENT_REPLAY_CONFLICT and zero writes
    transaction:
      isolation: SERIALIZABLE
      lock_order: [ops.inbox(consumer,event_id), ops.outbox(id), intake.response_submissions(id), editorial.response_requests(id), editorial.cases(id), editorial.responses(submission_id), ops.audit_events chain head, ops.outbox]
      statements:
      - 'INSERT_OR_READ ops.inbox [exactly-one-logical-result] :: claim source event and immutable envelope digest; exact completed replay returns stored bytes, changed digest conflicts'
      - 'SELECT ops.outbox [exactly-one] :: event type workflow.response_submitted.v2 and its exact eight-field payload/envelope digest'
      - 'SELECT_FOR_UPDATE intake.response_submissions + editorial.response_requests + editorial.cases [exactly-one graph] :: every event ID/version/digest/time equals persisted authority and request/submission/case identity is exact'
      - 'BRANCH existing reciprocal binding [exactly-one] :: none is APPLIED; exact both-way response/submission/event/digest graph is NO_OP_ALREADY_MATERIALIZED; one-sided, cross-request, cross-case or changed binding is EVENT_EFFECT_CONFLICT'
      - 'INSERT editorial.responses and UPDATE intake.response_submissions [exactly-one each iff APPLIED] :: copy encrypted answer bytes, publication consent, party name, case/request/submission/timestamp and write both reciprocal origin pointers plus one owned-intake receipt digest'
      - 'INSERT ops.audit_events and ops.outbox [exactly-one each iff APPLIED] :: RESPONSE_SUBMISSION_MATERIALIZED and editorial.response_materialized.v1 with no response body, token or party plaintext'
      - 'UPDATE ops.inbox [exactly-one] :: terminal closed APPLIED or NO_OP_ALREADY_MATERIALIZED result and result digest atomically with the branch'
      network_io: FORBIDDEN
    cardinality:
      APPLIED: {editorial_response: exactly-one, submission_pointer_update: exactly-one, reciprocal_foreign_keys: exactly-two, audit: exactly-one, outbox: exactly-one, inbox_terminal_result: exactly-one}
      NO_OP_ALREADY_MATERIALIZED: {domain: zero, audit: zero, outbox: zero, inbox_terminal_result: exactly-one}
      exact_replay: {all_writes: zero, result: byte-identical stored union}
    receipt: {schema: ResponseSubmissionMaterializationResultV1, authority: ops.inbox terminal result plus reciprocal intake.response_submissions and editorial.responses bindings}
    errors: {exact_codes: [RESOURCE_NOT_FOUND,EVENT_REPLAY_CONFLICT,EVENT_EFFECT_CONFLICT,RESPONSE_SUBMISSION_BINDING_INVALID,INTERNAL_ERROR], rollback: inbox/domain/audit/outbox/result roll back together}
  private.PublishRetraction:
    operation_id: private.PublishRetraction
    transport: PRIVATE_APPLICATION_COMMAND
    operation_kind: COMMAND
    trigger: current RETRACTION ExecutionAuthorization claimed by action-execution-worker
    effect_owner: action-execution-worker.retraction-executor
    atomic_transition_group: gurine.private.PublishRetraction.v1
    state_disposition: publication.PUBLISHED_*|CORRECTED|TEMPORARILY_RESTRICTED->RETRACTED
    idempotency:
      identity: execution_id + generation + execution_digest
      exact_replay: existing immutable execution receipt and publication revision are returned; zero second revision/audit/outbox/effect
      changed_replay: same execution generation with changed request digest is IDEMPOTENCY_CONFLICT
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.in_flight_effects(id)
      - ops.execution_authorizations(execution_id,generation)
      - ops.execution_attempts(execution_id,generation)
      - editorial.cases(id)
      - editorial.retraction_drafts(id)
      - editorial.review_snapshots(id)
      - editorial.publication_previews(id)
      - editorial.publication_gate_decisions(case_id,decision_sequence,id)
      - editorial.publication_revisions(case_id,revision DESC,id)
      - ops.audit_events chain head
      - ops.outbox
      - ops.execution_receipts(execution_id,receipt_sequence)
      statements:
      - 'SELECT_FOR_UPDATE ops.in_flight_effects + authorization + attempt [exactly-one composite] :: current RETRACTION generation, executionDigest, approvalDigest and counted receipt set'
      - 'SELECT_FOR_UPDATE editorial.cases [exactly-one] :: exact expected case version and non-retracted current publication'
      - 'SELECT editorial.retraction_drafts + review_snapshots + publication_previews [exactly-one composite] :: immutable approved draft/snapshot/preview/tombstone digests'
      - 'INSERT editorial.publication_gate_decisions [exactly-one PASS] :: fresh rights, hold, conflict, funding and copy-safety evaluation for exact retraction bytes'
      - 'INSERT editorial.publication_revisions [exactly-one] :: immutable RETRACTED tombstone revision superseding exact prior revision'
      - 'UPDATE editorial.cases [exactly-one] :: publication state RETRACTED, revision+1 and case version+1'
      - 'INSERT ops.audit_events [exactly-one] :: PUBLICATION_RETRACTED with digest-only binding'
      - 'INSERT ops.outbox [exactly-one publication.revision_created.v1 plus exactly-one projection.publication_revision_created.v1]'
      - 'UPDATE ops.execution_attempts + ops.in_flight_effects [exactly-one each] :: SUCCEEDED only after revision/audit/outbox exist'
      - 'INSERT ops.execution_receipts [exactly-one] :: RetractionExecutionReceiptV1 chain head'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality: {gate_decision: exactly-one, publication_revision: exactly-one, case_update: exactly-one, audit: exactly-one, domain_outbox: exactly-one, projection_outbox: exactly-one, execution_receipt: exactly-one, exact_replay: zero writes}
    audit: {action: PUBLICATION_RETRACTED, classification: RESTRICTED, redaction: tombstone text represented only by its approved digest}
    outbox: {events: [publication.revision_created.v1, projection.publication_revision_created.v1], cardinality: {publication.revision_created.v1: exactly-one, projection.publication_revision_created.v1: exactly-one}}
    receipt: {schema: RetractionExecutionReceiptV1, persistence: ops.execution_receipts plus immutable publication revision candidate key}
    errors: {exact_codes: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, PUBLICATION_GATE_BLOCKED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR], rollback: all revision/case/audit/outbox/execution/receipt writes roll back together}
