base_operation_atomic_extensions:
  submitResponse:
    operation_id: submitResponse
    decision: REPLACE_LEGACY_EVENT_PRODUCER_SET
    branch: successful response-session submission
    effect_owner: submission-api.submitResponse
    atomic_transition_group: gurine.command.submitResponse.v2
    isolation: SERIALIZABLE
    lock_order: [intake.submission_sessions(session_token_hash,issuer), intake.response_drafts(response_request_id), editorial.response_requests(id), intake.response_submissions(id), ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock and consume the exact RESPONSE_SUBMIT derived session, expected draft version and current request binding'
    - 'insert one immutable intake.response_submissions row with DB-owned submitted_at, submission_sha256, receipt_version, receipt_digest and no plaintext token'
    - 'terminalize the draft, request and session exactly once under the same transaction'
    - 'append one intake.response.submitted audit plus response.submitted.v2, notification.response_submitted.v2 and workflow.response_submitted.v2 from the persisted eight-field payload'
    - 'store the exact response receipt before commit; requestToken, actor/operation/request transport identity and v1 event admission are forbidden'
    cardinality: {submission: exactly-one, draft_terminalization: exactly-one, request_terminalization: exactly-one, session_revocation: exactly-one, audit: exactly-one, outbox: exactly-three, receipt: exactly-one, exact_replay: zero writes}
    v1_runtime_admission: forbidden by 0027 event-type activation and role grants; the historical schemas and base catalog rows remain immutable evidence only
    errors: [INVALID_PARAMETER, INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, RATE_LIMITED, SERVICE_ASSERTION_REQUIRED, SERVICE_ASSERTION_INVALID, SERVICE_ASSERTION_EXPIRED, SERVICE_ASSERTION_AUDIENCE_MISMATCH, SERVICE_ASSERTION_REQUEST_MISMATCH, SERVICE_ASSERTION_REPLAYED, SUBMISSION_SESSION_REQUIRED, SUBMISSION_SESSION_INVALID, SUBMISSION_SESSION_EXPIRED, SUBMISSION_SESSION_REVOKED, SUBMISSION_SESSION_SCOPE_MISMATCH, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, RESOURCE_NOT_FOUND, PRECONDITION_FAILED, VALIDATION_FAILED, INVALID_STATE_TRANSITION, RESPONSE_REQUEST_CLOSED, INTERNAL_ERROR]
  resolveCorrectionRequest:
    operation_id: resolveCorrectionRequest
    decision: EXTEND_EXISTING_COMMAND
    branch: resolution=RESOLVED
    effect_owner: control-api.resolveCorrectionRequest
    atomic_transition_group: gurine.command.resolveCorrectionRequest.publish.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.corrections, editorial.cases, editorial.publication_previews, editorial.publication_gate_decisions, editorial.publication_revisions, ops.tasks, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock correction REVIEW at expected version and its exact source publication revision'
    - 'lock case and exact current publication head; validate publication preview and full gate inputs'
    - 'insert one PASS gate decision and one immutable CORRECTED publication revision'
    - 'update correction to PUBLISHED and case publication head/version exactly once; complete zero-or-one task'
    - 'append correction.resolved.v1, publication.revision_created.v1, projection outbox, one audit and one stored response receipt'
    cardinality: {correction: exactly-one, gate: exactly-one, revision: exactly-one, case: exactly-one, task: zero-or-one, audit: exactly-one, outbox: exactly-three, receipt: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, CORRECTION_STATE_INVALID, PUBLICATION_GATE_BLOCKED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeTemporaryRestriction:
    operation_id: placeTemporaryRestriction
    decision: EXTEND_EXISTING_COMMAND
    effect_owner: control-api.placeTemporaryRestriction
    atomic_transition_group: gurine.command.placeTemporaryRestriction.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.cases, editorial.publication_revisions, exact cause decision relation, editorial.publication_access_decisions, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock exact current public revision and derive preservedPriorPublicState; reject caller mismatch'
    - 'lock and validate one current legal/rights/hold/safety cause decision and bounded expiry'
    - 'insert one immutable access decision/overlay linked to cause and prior state; never update publication bytes'
    - 'append publication.access_restricted.v1, projection.publication_access_changed.v1, one audit and one stored receipt atomically'
    cardinality: {access_decision: exactly-one, publication_revision_mutation: zero, audit: exactly-one, outbox: exactly-two, receipt: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  publishCase:
    operation_id: publishCase
    decision: EXTEND_EXISTING_COMMAND_WITH_RESTORE_BRANCH
    branch: intent=RESTORE_ACCESS
    effect_owner: control-api.publishCase
    atomic_transition_group: gurine.command.publishCase.restore.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.cases, editorial.publication_access_decisions, cause release receipt relation, editorial.review_snapshots, editorial.publication_previews, editorial.publication_gate_decisions, editorial.publication_revisions, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock TEMPORARILY_RESTRICTED head, exact restriction decision and cause-release receipt; destination must equal preserved prior public state'
    - 're-evaluate the complete current publication gate; stale prior PASS is not reusable'
    - 'insert one PASS decision and one immutable restored revision; update case head/version once'
    - 'append publication.revision_created.v1, projection.publication_revision_created.v1, one audit and one stored receipt atomically'
    cardinality: {gate: exactly-one, revision: exactly-one, case: exactly-one, audit: exactly-one, outbox: exactly-two, receipt: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_ACTIVE, PUBLICATION_GATE_BLOCKED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeLegalHold:
    operation_id: placeLegalHold
    decision: EXTEND_EXISTING_COMMAND_WITH_CLOSED_TARGET_UNION
    effect_owner: control-api.placeLegalHold
    atomic_transition_group: gurine.command.placeLegalHold.v2
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, concrete target by target-kind candidate key, case and review snapshot when case-governed, editorial.conflict_snapshots, ops.legal_hold_target_anchors, editorial.legal_holds, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'validate closed LegalHoldTargetBindingV1 and lock exactly one concrete target; derive target ID/version/digest'
    - 'for case-governed variants lock exact case/review snapshot; for non-case variants require both absent'
    - 'lock current CLEAR conflict snapshot, independent approval and exact STEP_UP receipt'
    - 'insert-or-reuse one exact immutable target anchor and insert one append-only hold placement'
    - 'append legal_hold.placed.v1, one audit and one stored receipt; mutate case version only for case-governed variants'
    cardinality: {target: exactly-one, anchor: exactly-one logical, hold: exactly-one new success, audit: exactly-one, outbox: exactly-one, receipt: exactly-one, exact_replay: zero writes}
    errors: [INVALID_PARAMETER, TARGET_NOT_FOUND, LEGAL_HOLD_TARGET_INVALID, CONFLICT_UNRESOLVED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]

set_equality_assertions:
- set(external_commands) == set(addendum-operation-contracts.operations where kind == COMMAND)
- set(private_control_commands) == set(owner-addendum.private_control_service_operations where kind == COMMAND)
- set(private_application_commands) == set(owner-addendum.private_application_commands.commands.operation_id)
- set(base_operation_atomic_extensions) == set(owner-addendum.base_operation_atomic_extensions.operations)
- set(private_callback_operations) == set(owner-addendum.private_communication_gateway_operations)
- every external entry has transaction, lock order, statement cardinality, idempotency, audit, outbox, receipt, exact errors, effect owner, atomic
  transition group and state disposition
- every private control command has exact service caller/fence, typed immutable proof, total lock order, state/budget/effect resolution, idempotency, audit, event and stored receipt; it performs no provider/tool dispatch
- every mutating callback has raw-byte authentication, request-level replay ledger, item cardinality, ordered delivery locks, audit, conditional
  outbox and stored request receipt
- every private application command and base-operation extension has exact authorization/trigger, total lock order, statement/cardinality, idempotency/replay, audit, outbox, receipt, error, effect-owner and atomic-group contracts
physical_dependencies:
  required_existing:
  - ops.idempotency_keys
  - ops.audit_events
  - ops.outbox
  - ops.inbox
  required_additive:
  - intake.privacy_request_receipt_tokens
  session_binding: 'Exact import of specs/submission/addendum-derived-session-boundary.yaml: intake.submission_sessions stores APPEAL_CREATE,
    APPEAL_STATUS and COMMUNICATION_PROFILE lineage/scope/issuance/rotation fields; RESPONSE_RECEIPT remains read-only. PRIVACY_REQUEST_RECEIPT
    remains a separate unresolved dependency.'
  callback_request_ledger: ops.communication_callback_events is the single append-only authenticated request ledger (CommunicationCallbackRequestRow);
    no ops.communication_callback_requests relation or per-item callback row exists.
imports:
  derived_session_boundary: specs/submission/addendum-derived-session-boundary.yaml
  rule: The session overlay is exact and non-widening; RESPONSE_RECEIPT remains read-only.
derived_session_contract:
  source: specs/submission/addendum-derived-session-boundary.yaml
  parent_non_widening:
    RESPONSE_RECEIPT:
    - getResponseReceipt
    rule: derivation inserts child rows and never changes parent kind/scope/allowlist
  session_kinds:
    APPEAL_CREATE:
      scope: RESPONSE_SUBMISSION
      ttl_seconds: 900
      mode: ONE_SHOT_COMMAND
      operations:
      - createResponseAppeal
      success: consume and issue APPEAL_STATUS atomically
    APPEAL_STATUS:
      scope: APPEAL
      ttl_seconds: 1800
      mode: READ_ONLY_ROTATING
      operations:
      - getResponseAppeal
      reentry: re-establish RESPONSE_RECEIPT composite proof and revoke prior status child for same appeal
    COMMUNICATION_PROFILE:
      scope: COMMUNICATION_SUBJECT
      ttl_seconds: 1800
      mode: ROTATING_SCOPED_COMMAND
      operations:
      - requestCommunicationEndpointLink
      - verifyCommunicationEndpointLink
      - unlinkCommunicationEndpoint
      success: rotate under identical subject/origin binding
  next_session_header:
    name: X-Gurine-Next-Submission-Session
    source: fresh 32-byte base64url token generated only by BFF
    binding: service assertion and idempotency request digest
    database: lowercase SHA-256 only
    forbidden:
    - browser request
    - URL
    - DOM
    - client storage
    - audit
    - outbox
    - receipt
    - log
    - trace
    - metric
    - analytics
    - error
  cookie_profiles:
    appeal:
      name: gurine_response_appeal_session
      path: /respond/receipt/appeal
      kinds:
      - APPEAL_CREATE
      - APPEAL_STATUS
    communication_profile:
      name: gurine_communication_profile_session
      path: /communication-profile
      kinds:
      - COMMUNICATION_PROFILE
    defaults:
      host_only: true
      httpOnly: true
      sameSite: Lax
      secure_in_production: true
  replay: lock finalized stored response before session status; byte-identical replay succeeds after consume/rotation with zero second domain/audit/outbox/session
    effect
  event_redaction: response.appeal_created.v1 and communication.authorization_changed.v1 carry no session token/hash, cookie, next-session header
    or encrypted session bytes
