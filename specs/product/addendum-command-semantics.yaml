  verifyResponseOrganizationIdentity:
    operation_id: verifyResponseOrganizationIdentity
    api: control-api
    method: POST
    path: /v1/internal/commands/verify-response-organization-identity
    operation_kind: COMMAND
    authorization:
      capability: responses.review
      authorization: request-bound actor assertion plus exact step-up authorization receipt
      assurance: STEP_UP
      reauthorized_in_transaction: true
    owner_input:
      public_body_fields: [responseId, organizationId, publicationForm, verificationMethod, officialChannelSourceId, reason, expectedVersion]
      server_derived_fields: [_actorAssertionJti, _actorAssuranceLevel, _actorEffectiveCapability, _actorActionDigest, _actorStepUpAuthorizationId, _actorIdempotencyKeySha256, _actorRequestKeySha256]
      exact_owner_shape: the seven closed public fields plus these seven server-derived actor bindings and no others
      merge_boundary: control-api validates the public body, derives the seven values from the authenticated request context and merges them immediately before calling editorial.verify_response_organization_identity_v1
      forbidden_public_fields: [_actorAssertionJti, _actorAssuranceLevel, _actorEffectiveCapability, _actorActionDigest, _actorStepUpAuthorizationId, _actorIdempotencyKeySha256, _actorRequestKeySha256]
      official_channel_source_semantics:
        authority: officialChannelSourceId is the identifier of the current immutable official-channel authority assertion, never a raw communication endpoint verification or official document evidence identifier
        current_assertion_guard: the owner resolves exactly one active, unexpired and unrevoked assertion in the registry; a missing or empty registry, absent assertion or failed currentness check is fail-closed with zero writes and no fallback
        email_guard: OFFICIAL_DOMAIN_EMAIL additionally requires the assertion's exact EMAIL domain-control receipt and the underlying endpoint, domain-control and response-request binding to remain current in the same transaction
        document_guard: OFFICIAL_DOCUMENT additionally requires the assertion's exact DOCUMENT official-representation binding receipt and the underlying document, representation binding and source locator to remain current in the same transaction
        otp_rule: OTP alone is never official-channel authority
      currentness_nested_lock_contract:
        pre_r6d39: lock the selected registry assertion FOR UPDATE, then EMAIL validates one joined verification/endpoint/subject/latest-link/sent relation set FOR SHARE without promising planner-level per-relation acquisition order; DOCUMENT locks evidence then source document FOR SHARE
        authority_wrapper: reselect the registry assertion FOR SHARE, lock its exact authority-receipt ID+digest composite FOR SHARE, invoke the same source resolver advisory lock and organization/method-specific graph order used at attestation, then lock the authority audit and outbox rows FOR SHARE
        consequence: revocation and consumption serialize on the registry assertion; missing, stale, changed or partially bound authority fails closed before response mutation
    effect_owner: control-api.verifyResponseOrganizationIdentity
    procedure: editorial.verify_response_organization_identity_v1
    atomic_transition_group: gurine.command.verifyResponseOrganizationIdentity.v1
    state_disposition: response_organization_identity.UNVERIFIED->SECOND_FACTOR_VERIFIED_APPEND_ONLY
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - editorial.response_organization_identity_assertions_v1(idempotency_key_sha256)
      - editorial.responses(id,version)
      - editorial.response_requests(id)
      - core.agencies(id)|core.suppliers(id)
      - ops.step_up_authorizations(id)
      - ops.sessions(id)
      - editorial.organization_official_channel_assertions_v1(assertion_id) FOR UPDATE in pre-r6d39 validator
      - 'pre-r6d39 EMAIL joined verification/endpoint/subject/latest-link/sent set FOR SHARE | DOCUMENT evidence then source_document FOR SHARE'
      - editorial.organization_official_channel_assertions_v1(assertion_id) FOR SHARE in authority wrapper
      - editorial.organization_official_channel_authority_receipts_v1(authority_receipt_id,authority_receipt_digest) FOR SHARE
      - 'authority-wrapper source resolver advisory lock -> organization row -> EMAIL verification/subject/endpoint/latest-link/response-request/sent-receipt or DOCUMENT evidence/source-document, all FOR SHARE'
      - ops.audit_events(authority.audit_event_id) FOR SHARE
      - ops.outbox(authority.outbox_event_id) FOR SHARE
      statements:
      - 'SELECT_FOR_SHARE editorial.response_organization_identity_assertions_v1 [zero-or-one] :: exact stored replay by idempotency-key digest or changed-request conflict'
      - 'SELECT_FOR_UPDATE editorial.responses [exactly-one] :: expected UNVERIFIED response version with INTERNAL_ONLY form, organization entity, content digest and consent digest'
      - 'SELECT_FOR_SHARE editorial.response_requests [exactly-one] :: exact response party kind and organization identity'
      - 'VALIDATE core.agencies|core.suppliers [exactly-one] :: organization exists in the response party kind; names and identifiers do not enter the receipt'
      - 'SELECT_FOR_SHARE ops.step_up_authorizations [exactly-one] :: active unexpired action/idempotency-bound authorization'
      - 'VALIDATE ops.sessions [exactly-one] :: active actor-owned session bound to the step-up authorization'
      - 'SELECT_FOR_SHARE current immutable official-channel authority assertion and exact underlying currentness graph [exactly-one] :: active, unexpired and unrevoked assertion selected by officialChannelSourceId plus EMAIL domain-control receipt or DOCUMENT official-representation binding receipt; raw endpoint verification/evidence IDs and OTP-only proof cannot substitute'
      - 'INSERT ops.audit_events [exactly-one] :: successful organization-identity verification with assertion and source receipt digests only'
      - 'SELECT ops.audit_events [exactly-one] :: immutable audit receipt digest'
      - 'INSERT ops.outbox [exactly-one] :: response.organization_identity_verified.v1 after final response version is fixed'
      - 'INSERT editorial.response_organization_identity_assertions_v1 [exactly-one] :: immutable exact subject, evidence, policy, step-up and actor assertion binding'
      - 'INSERT editorial.response_publication_identity_receipts_v1 [exactly-one] :: active exact publication guard receipt'
      - 'UPDATE editorial.responses [exactly-one] :: SECOND_FACTOR_VERIFIED, selected FULL|REDACTED form, assertion pointer and version+1'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      assertion: exactly-one new success; zero replay
      publication_identity_receipt: exactly-one new success; zero replay
      response_update: exactly-one new success; zero replay
      audit: exactly-one new success; zero replay
      outbox:
        response.organization_identity_verified.v1: exactly-one new success; zero replay
      receipt: exactly-one custom response envelope; replay projects the stored immutable owner proof with zero writes
    audit_contract: external-command-audit-v1
    outbox:
      events: [response.organization_identity_verified.v1]
      cardinality: {response.organization_identity_verified.v1: exactly-one}
      payload_source: specs/product/addendum-event-contracts.yaml
      forbidden: [raw email, raw domain, raw document, raw proof, raw reason, person name, organization name]
    receipt:
      schema: VerifyResponseOrganizationIdentityReceiptV1
      contract: exact resource-schemas custom command envelope; replacing it with CommandReceiptV1 or another generic additive receipt is forbidden
      owner_proof_fields: [assertionId, assertionVersion, responseVersion, receiptDigest, auditEventId, verifiedAt, outboxEventIds, replayed]
