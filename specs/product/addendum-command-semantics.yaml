    operation_id: private.QueueDonationIntent
    decision_authority: supervisor_decision_v1.PAYMENT-TEST-V1
    authority_label: 감독자 결정 v1
    operation_kind: COMMAND
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: POST /internal/v1/donation-intents
    success_status: 202
    caller: public-web SvelteKit server action
    effect_owner: billing-gateway
    authorization: request-bound service assertion with issuer public-web, audience billing-gateway, exact method/path/request digest, durable JTI replay rejection and required Idempotency-Key
    authority: offerVersionId, offerDigest and tierId resolve set-equal against TEST_FIXTURE_ONLY_NO_PRODUCTION_AUTHORITY
    review_assignee: reviewAssigneeUserId is required, source-bound, active and bound into the canonical request and durable receipt digest; no first-user, cross-subject or fallback assignment is allowed
    idempotency: requestId and Idempotency-Key bind the exact canonical body; exact replay returns the original five-field receipt bytes and changed bytes fail with IDEMPOTENCY_CONFLICT
    consent_receipt_digest: billing-gateway recomputes the lowercase SHA-256 of the exact UTF-8 LF preimage in DonationIntentQueueRequestV1; mismatch is INVALID_REQUEST with zero writes or provider handoff
    state_disposition: TEST_ONLY queues one donation intent and one job without creating payment entitlement or changing a commercial contract, public access, factual, editorial or production-readiness priority; production and the default mode are DISABLED/UNAVAILABLE with zero writes
    secret_boundary: paymentAuthorizationToken is passed once to the TEST_ONLY provider handoff and is forbidden from persistence, audit, outbox, logs, Debug, errors and receipts
    receipt: DonationIntentQueuedReceiptV1
    errors: [INVALID_REQUEST, SERVICE_ASSERTION_INVALID, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
  private.ReceivePaymentWebhook:
    operation_id: private.ReceivePaymentWebhook
    decision_authority: supervisor_decision_v1.PAYMENT-TEST-V1
    authority_label: 감독자 결정 v1
    operation_kind: COMMAND
    transport: PRIVATE_BILLING_GATEWAY_HTTP
    entrypoint: POST /internal/v1/payment-webhooks/{provider}
    path_parameter: {provider: 'enum<toss-payments|kakao-pay|stripe>'}
    request_media_type: application/json
    maximum_raw_body_bytes: 65536
    caller: payment-fixture TEST_ONLY ingress
    effect_owner: payment-owner-function-boundary
    authorization: request-bound service assertion with issuer payment-fixture and audience billing-gateway bound to exact method, canonical path, raw-body digest and application/json content type; TTL is at most 30 seconds and JTI replay rejection is durable
    provider_authentication: {STRIPE: required stripe-signature over exact raw bytes, TOSS_PAYMENTS: NOT_AVAILABLE_FETCH_REQUIRED, KAKAO_PAY: NOT_AVAILABLE_FETCH_REQUIRED}
    availability: {TEST_ONLY: enabled for deterministic fixture acceptance, PRODUCTION: 503 PAYMENT_RUNTIME_UNAVAILABLE before parse/provider call/write}
    state_disposition: APPLIED or DUPLICATE is derived only after the provider-specific TEST_ONLY authentication or required fetch; raw body, assertion and signature bytes are never persisted and no live payment or B2B API exists
    replay: exact finalized replay returns original 200 bytes; the same event identity with changed raw bytes is PAYMENT_WEBHOOK_CONFLICT; in-flight or unavailable required fetch returns 503 without a receipt
    payment_review: a fetch-confirmed DONATION_PAYMENT_FAILURE may use only the exact source-bound reviewAssigneeUserId and PAYMENT_REVIEW_V1 authorization; dueAt is occurredAt plus exactly 24 hours; zero/multiple/mismatched active subject, authorization, endpoint, evaluator or deployment raises SQLSTATE 55000 with zero writes
    reconciliation_required: creates no task, notification or automatic retry and never changes entitlement, commercial contract or public access
    outbox:
      events: [donation.fact_recorded.v1, notification.payment_review_requested.v1]
      cardinality: donation.fact_recorded.v1 exactly once only when the provider fetch confirms a successful donation fact; notification.payment_review_requested.v1 exactly once only when the provider fetch confirms DONATION_PAYMENT_FAILURE; DUPLICATE and every rejected or unavailable branch emit neither event
    receipt: PaymentWebhookAcceptanceV1
    errors: [INVALID_REQUEST, SERVICE_ASSERTION_INVALID, PAYMENT_WEBHOOK_CONFLICT, PAYMENT_RUNTIME_UNAVAILABLE, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]

provider_control_http_side_door_semantics:
  operation_ids: [disableProviderRouting, testProviderConnection, upgradeProviderModel, setModelAutoUpgrade]
  request_validation: Retain each existing closed request schema solely to construct the matching ProviderControlActionV1 proposal payload.
  direct_http_result: {status: 409, error_code: ACTION_PROPOSAL_REQUIRED, state_effect: UNCHANGED}
  exact_statements:
    - 'RETURN_PROBLEM [exactly-one] :: 409 ACTION_PROPOSAL_REQUIRED'
    - 'DATABASE_WRITE [zero] :: no proposal, authorization, job, receipt, audit or outbox mutation'
    - 'EXTERNAL_EFFECT [zero] :: no connection test, relay call or provider state mutation'
  authorized_effect_path: submitActionDecision creates the current PROVIDER_CONTROL ExecutionAuthorization; action.execution_authorized.v1 dispatches only that kind to analysis-worker; the worker claims, observes and completes or fails the exact private.ExecuteProviderControl fence.
  forbidden_paths: [browser_to_control_command_effect, bff_to_control_command_effect, control_api_to_relay, workflow_worker_provider_control_executor]

base_operation_atomic_extensions:
  submitResponse:
    operation_id: submitResponse
    decision: REPLACE_LEGACY_EVENT_PRODUCER_SET
    branch: successful response-session submission
    effect_owner: submission-api.submitResponse
    atomic_transition_group: gurine.command.submitResponse.v2
    isolation: SERIALIZABLE
    lock_order: [intake.submission_sessions(session_token_hash,issuer), intake.response_drafts(response_request_id), editorial.response_requests(id), intake.response_submissions(id), ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock and consume the exact RESPONSE_SUBMIT derived session, expected draft version and current request binding'
    - 'insert one immutable intake.response_submissions row with DB-owned submitted_at, submission_sha256, receipt_version, receipt_digest and no plaintext token'
    - 'terminalize the draft, request and session exactly once under the same transaction'
    - 'append one intake.response.submitted audit plus response.submitted.v2, notification.response_submitted.v2 and workflow.response_submitted.v2 from the persisted eight-field payload'
    - 'store the exact response receipt before commit; requestToken, actor/operation/request transport identity and v1 event admission are forbidden'
    cardinality: {submission: exactly-one, draft_terminalization: exactly-one, request_terminalization: exactly-one, session_revocation: exactly-one, audit: exactly-one, outbox: exactly-three, receipt: exactly-one, exact_replay: zero writes}
    v1_runtime_admission: forbidden by 0027 event-type activation and role grants; the historical schemas and base catalog rows remain immutable evidence only
    errors: [INVALID_PARAMETER, INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, RATE_LIMITED, SERVICE_ASSERTION_REQUIRED, SERVICE_ASSERTION_INVALID, SERVICE_ASSERTION_EXPIRED, SERVICE_ASSERTION_AUDIENCE_MISMATCH, SERVICE_ASSERTION_REQUEST_MISMATCH, SERVICE_ASSERTION_REPLAYED, SUBMISSION_SESSION_REQUIRED, SUBMISSION_SESSION_INVALID, SUBMISSION_SESSION_EXPIRED, SUBMISSION_SESSION_REVOKED, SUBMISSION_SESSION_SCOPE_MISMATCH, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, RESOURCE_NOT_FOUND, PRECONDITION_FAILED, VALIDATION_FAILED, INVALID_STATE_TRANSITION, RESPONSE_REQUEST_CLOSED, INTERNAL_ERROR]
  approveResponseExcerpt:
    operation_id: approveResponseExcerpt
    decision: REPLACE_SHALLOW_DIRECT_UPDATE_WITH_GUARDED_OWNER
    effect_owner: control-api.approveResponseExcerpt
    procedure: editorial.approve_response_excerpt_guarded_v2
    atomic_transition_group: gurine.command.approveResponseExcerpt.v2
    effective_event: response.excerpt_approved.v2
    legacy_event: response.excerpt_approved.v1 remains historical only and the guarded v2 owner never emits it
    isolation: SERIALIZABLE
    owner_input:
      public_body_fields: [responseId, excerptHash, publicationForm, reason, expectedVersion]
      server_derived_fields: [_actorId, _actorAssertionJti, _actorAssuranceLevel, _actorRequestKeySha256, _requestId, _idempotencyKeySha256, _requestSha256]
      caller_selected_assertion: FORBIDDEN
    lock_order: [editorial.response_excerpt_approval_receipts_v2(idempotency_key_sha256), editorial.responses(id,version), editorial.response_publication_identity_receipts_v1(response_id,response_version)]
    exact_statements:
    - 'resolve immutable approval receipt replay before mutable-state validation; changed request digest conflicts'
    - 'lock the exact response version and verify persisted excerpt bytes, excerpt digest, content digest, consent digest and body consent'
    - 'for ANONYMOUS require persisted identityDisplay=ANONYMOUS and consume no organization identity receipt'
    - 'for FULL or REDACTED lock exactly one active SECOND_FACTOR_VERIFIED publication identity receipt matching response, version, content digest, consent digest, organization and publication form; the response assertion pointer and form must match and OTP_ONLY or UNVERIFIED is forbidden'
    - 'append one audit and response.excerpt_approved.v2 outbox event, insert one immutable approval receipt, then update only approval fields, allowed status and response version+1'
    cardinality: {approval_receipt: exactly-one new success, response_update: exactly-one new success, identity_receipt: exactly-one for FULL_or_REDACTED and zero for ANONYMOUS, audit: exactly-one, outbox: exactly-one, exact_replay: zero writes}
    errors: [INVALID_PARAMETER, RESOURCE_NOT_FOUND, VERSION_CONFLICT, PRECONDITION_FAILED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  resolveCorrectionRequest:
    operation_id: resolveCorrectionRequest
    decision: EXTEND_EXISTING_COMMAND
    branch: resolution=RESOLVED
    effect_owner: control-api.resolveCorrectionRequest
    atomic_transition_group: gurine.command.resolveCorrectionRequest.publish.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.corrections, editorial.cases, editorial.publication_previews, editorial.publication_gate_decisions, editorial.publication_revisions, ops.tasks, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock correction REVIEW at expected version and its exact source publication revision'
    - 'lock case and exact current publication head; validate publication preview and full gate inputs'
    - 'insert one PASS gate decision and one immutable CORRECTED publication revision'
    - 'update correction to PUBLISHED and case publication head/version exactly once; complete zero-or-one task'
    - 'append correction.resolved.v1, notification.correction_resolved.v1, publication.revision_created.v1, projection.publication_revision_created.v1, one audit and one stored response receipt'
    cardinality: {correction: exactly-one, gate: exactly-one, revision: exactly-one, case: exactly-one, task: zero-or-one, audit: exactly-one, outbox: exactly-four, receipt: exactly-one}
    outbox:
      events: [correction.resolved.v1, notification.correction_resolved.v1, publication.revision_created.v1, projection.publication_revision_created.v1]
      cardinality: {correction.resolved.v1: exactly-one, notification.correction_resolved.v1: exactly-one, publication.revision_created.v1: exactly-one, projection.publication_revision_created.v1: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, CORRECTION_STATE_INVALID, PUBLICATION_GATE_BLOCKED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeTemporaryRestriction:
    operation_id: placeTemporaryRestriction
    decision: EXTEND_EXISTING_COMMAND
    effect_owner: control-api.placeTemporaryRestriction
    atomic_transition_group: gurine.command.placeTemporaryRestriction.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.cases, editorial.publication_revisions, exact cause decision relation, editorial.publication_access_decisions, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock exact current public revision and derive preservedPriorPublicState; reject caller mismatch'
    - 'lock and validate one current legal/rights/hold/safety cause decision and bounded expiry'
    - 'insert one immutable access decision/overlay linked to cause and prior state; never update publication bytes'
    - 'append publication.access_restricted.v1, projection.publication_access_changed.v1, one audit and one stored receipt atomically'
    cardinality: {access_decision: exactly-one, publication_revision_mutation: zero, audit: exactly-one, outbox: exactly-two, receipt: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_INVALID, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  publishCase:
    operation_id: publishCase
    decision: EXTEND_EXISTING_COMMAND_WITH_RESTORE_BRANCH
    branch: intent=RESTORE_ACCESS
    effect_owner: control-api.publishCase
    atomic_transition_group: gurine.command.publishCase.restore.v1
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, editorial.cases, editorial.publication_access_decisions, cause release receipt relation, editorial.review_snapshots, editorial.publication_previews, editorial.publication_gate_decisions, editorial.publication_revisions, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'lock TEMPORARILY_RESTRICTED head, exact restriction decision and cause-release receipt; destination must equal preserved prior public state'
    - 're-evaluate the complete current publication gate; stale prior PASS is not reusable'
    - 'insert one PASS decision and one immutable restored revision; update case head/version once'
    - 'append publication.revision_created.v1, projection.publication_revision_created.v1, one audit and one stored receipt atomically'
    cardinality: {gate: exactly-one, revision: exactly-one, case: exactly-one, audit: exactly-one, outbox: exactly-two, receipt: exactly-one}
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, PUBLICATION_STATE_INVALID, PUBLICATION_RESTRICTION_CAUSE_ACTIVE, PUBLICATION_GATE_BLOCKED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  placeLegalHold:
    operation_id: placeLegalHold
    decision: EXTEND_EXISTING_COMMAND_WITH_CLOSED_TARGET_UNION
    effect_owner: control-api.placeLegalHold
    atomic_transition_group: gurine.command.placeLegalHold.v2
    isolation: SERIALIZABLE
    lock_order: [ops.idempotency_keys, concrete target by target-kind candidate key including immutable correction/subscription snapshot or communication endpoint tuple, case and review snapshot when case-governed, editorial.conflict_snapshots, ops.legal_hold_target_anchors, editorial.legal_holds, ops.audit_events chain head, ops.outbox]
    exact_statements:
    - 'normalize a missing public expiresAt to explicit JSON null before calculating the idempotency request digest; the owner payload always contains the nullable key'
    - 'validate the closed thirteen-kind LegalHoldTargetBindingV1 and lock exactly one concrete target; derive target ID/version/digest'
    - 'CORRECTION and SUBSCRIPTION bind their immutable snapshot IDs versions and digests; COMMUNICATION_ENDPOINT binds intake.communication_endpoints(id,version,endpoint_digest) exactly and never substitutes endpointSnapshotDigest'
    - 'recognize AUDIT_SUBJECT_RECORD before generic target-shape validation and reject LEGAL_HOLD_TARGET_UNSUPPORTED with zero writes because no authoritative source relation exists'
    - 'for case-governed variants lock exact case/review snapshot; for non-case variants require both absent'
    - 'lock current CLEAR conflict snapshot, independent approval and exact STEP_UP receipt'
    - 'insert-or-reuse one exact immutable target anchor and insert one append-only hold placement'
    - 'append legal_hold.placed.v2, one audit and one stored receipt; mutate case version only for case-governed variants'
    cardinality: {target: exactly-one, anchor: exactly-one logical, hold: exactly-one new success, audit: exactly-one, outbox: exactly-one, receipt: exactly-one, exact_replay: zero writes}
    effective_event: legal_hold.placed.v2
    legacy_event: legal_hold.placed.v1 remains historical schema evidence and is forbidden for new runtime admission
    errors: [INVALID_PARAMETER, TARGET_NOT_FOUND, LEGAL_HOLD_TARGET_INVALID, LEGAL_HOLD_TARGET_UNSUPPORTED, CONFLICT_UNRESOLVED, STEP_UP_REQUIRED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]

set_equality_assertions:
- set(external_commands) == set(addendum-operation-contracts.operations where kind == COMMAND)
- set(private_control_commands) == set(owner-addendum.private_control_service_operations where kind == COMMAND)
- set(private_application_commands) == set(addendum-operation-contracts.private_application_commands)
- set(private_billing_gateway_operations) == set(addendum-operation-contracts.private_billing_gateway_operations)
- set(base_operation_atomic_extensions) == set(owner-addendum.base_operation_atomic_extensions.operations)
- set(private_callback_operations) == set(owner-addendum.private_communication_gateway_operations)
- every external entry has transaction, lock order, statement cardinality, idempotency, audit, outbox, receipt, exact errors, effect owner, atomic
  transition group and state disposition
- every private control command has exact service caller/fence, typed immutable proof, total lock order, state/budget/effect resolution, idempotency, audit, event and stored receipt; it performs no provider/tool dispatch
- every mutating callback has raw-byte authentication, request-level replay ledger, item cardinality, ordered delivery locks, audit, conditional
  outbox and stored request receipt
- every private application command and base-operation extension has exact authorization/trigger, total lock order, statement/cardinality, idempotency/replay, audit, outbox, receipt, error, effect-owner and atomic-group contracts
physical_dependencies:
  required_existing:
  - ops.idempotency_keys
  - ops.audit_events
  - ops.outbox
  - ops.inbox
  required_additive:
  - ops.privacy_response_calendar_policies_v1
  - ops.privacy_requests_v2
  - ops.privacy_request_receipt_tokens_v2
  - ops.privacy_request_identity_receipts_v2
  - ops.privacy_request_extension_receipts_v2
  - ops.privacy_request_refusal_receipts_v2
  - ops.privacy_request_notice_receipts_v2
  - ops.privacy_request_transition_receipts_v2
  session_binding: 'Exact import of specs/submission/addendum-derived-session-boundary.yaml: intake.submission_sessions stores APPEAL_CREATE,
    APPEAL_STATUS and COMMUNICATION_PROFILE lineage/scope/issuance/rotation fields; RESPONSE_RECEIPT remains read-only. exchangePrivacyRequestReceiptToken
    creates PRIVACY_REQUEST_RECEIPT only from the request-bound BFF assertion, one-time body token and hash-bound next-session header; getPrivacyRequest
    is its sole consumer.'
  privacy_query_routine: ops.get_privacy_request_v2 is the sole read authority for PrivacyRequestPublicStatusV2 and returns closed action codes plus immutable receipt identities/digests without raw notice, appeal, identity or contact text.
  callback_request_ledger: ops.communication_callback_events is the single append-only authenticated request ledger (CommunicationCallbackRequestRow);
    no ops.communication_callback_requests relation or per-item callback row exists.
imports:
  derived_session_boundary: specs/submission/addendum-derived-session-boundary.yaml
  rule: The session overlay is exact and non-widening; RESPONSE_RECEIPT remains read-only.
derived_session_contract:
  source: specs/submission/addendum-derived-session-boundary.yaml
  parent_non_widening:
    RESPONSE_RECEIPT:
    - getResponseReceipt
    rule: derivation inserts child rows and never changes parent kind/scope/allowlist
  session_kinds:
    APPEAL_CREATE:
      scope: RESPONSE_SUBMISSION
      ttl_seconds: 900
      mode: ONE_SHOT_COMMAND
      operations:
      - createResponseAppeal
      success: consume and issue APPEAL_STATUS atomically
    APPEAL_STATUS:
      scope: APPEAL
      ttl_seconds: 1800
      mode: READ_ONLY_ROTATING
      operations:
      - getResponseAppeal
      reentry: re-establish RESPONSE_RECEIPT composite proof and revoke prior status child for same appeal
    COMMUNICATION_PROFILE:
      scope: COMMUNICATION_SUBJECT
      ttl_seconds: 1800
      mode: ROTATING_SCOPED_COMMAND
      operations:
      - requestCommunicationEndpointLink
      - verifyCommunicationEndpointLink
      - unlinkCommunicationEndpoint
      success: rotate under identical subject/origin binding
    PRIVACY_REQUEST_RECEIPT:
      scope: PRIVACY_REQUEST
      mode: READ_ONLY
      operations:
      - getPrivacyRequest
      issuance: exchangePrivacyRequestReceiptToken uses no prior scoped session; it requires a request-bound BFF service assertion, one-time body token and hash-bound X-Gurine-Next-Submission-Session
      success: session token SHA-256 only at rest; raw token is retained and sealed by the BFF and absent from every response body
  next_session_header:
    name: X-Gurine-Next-Submission-Session
    source: fresh 32-byte base64url token generated only by BFF
    binding: service assertion and idempotency request digest
    database: lowercase SHA-256 only
    forbidden:
    - browser request
    - URL
    - DOM
    - client storage
    - audit
    - outbox
    - receipt
    - log
    - trace
    - metric
    - analytics
    - error
  cookie_profiles:
    appeal:
      name: gurine_response_appeal_session
      path: /respond/receipt/appeal
      kinds:
      - APPEAL_CREATE
      - APPEAL_STATUS
    communication_profile:
      name: gurine_communication_profile_session
      path: /communication-profile
      kinds:
      - COMMUNICATION_PROFILE
    privacy_request_receipt:
      name: gurine_privacy_request_receipt_session
      path: /privacy
      kinds:
      - PRIVACY_REQUEST_RECEIPT
    defaults:
      host_only: true
      httpOnly: true
      sameSite: Lax
      secure_in_production: true
  replay: lock finalized stored response before session status; byte-identical replay succeeds after consume/rotation with zero second domain/audit/outbox/session
    effect
  event_redaction: response.appeal_created.v1 and communication.authorization_changed.v1 carry no session token/hash, cookie, next-session header
    or encrypted session bytes
