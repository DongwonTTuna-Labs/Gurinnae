  acceptSmtpDsn:
    operation_id: acceptSmtpDsn
    provider: SMTP_EMAIL
    method: POST
    path: /private/v1/callbacks/smtp-dsn
    operation_kind: COMMAND
    effect_owner: notification-worker.callback-gateway
    atomic_transition_group: gurine.callback.acceptSmtpDsn.request.v1
    state_disposition: request evidence append plus zero or more monotonic outbound_delivery transitions
    authentication:
      order:
      - size/content-type/rate precheck
      - verify exact raw method/canonical URL/query/headers/body
      - freshness and active pinned adapter
      - closed native parser
      redaction: raw body, proof, token, endpoint and provider-native identity never enter logs/traces/events/audit/response
    idempotency:
      scope: provider_config_id + replay_key_digest; provider_request_identity_hmac is an additional changed-body conflict fence when present
      request_digest: SHA256(exact received bytes plus signed method/URL/query/header subset)
      exact_replay: same provider revision, replay key and callback request digest decrypts and returns stored acknowledgement status/headers/body
        byte-for-byte before delivery locks; zero second request/receipt/domain/audit/outbox write
      changed_replay: CALLBACK_REPLAY_CONFLICT and zero writes
      multi_item: one append-only request row owns one ordinal-complete CommunicationCallbackNormalizedItemSetV1; each matched item may bind at
        most one outbound receipt by callback request ID and item ordinal/digest
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.communication_callback_events(provider_config_id,replay_key_digest,id)
      - ops.communication_provider_configs(id)
      - ops.outbound_deliveries(id ascending)
      - ops.outbound_delivery_attempts(delivery_id,attempt_ordinal)
      - ops.outbound_delivery_receipts(delivery_id,receipt_sequence)
      statements:
      - 'SELECT ops.communication_provider_configs [exactly-one-internally-or-nonenumerating-error] :: pinned active adapter'
      - 'VERIFY_RAW_BYTES provider-native-verifier [exactly-one-pass] :: before parsing'
      - 'PARSE_CLOSED provider-native-parser [one] :: pinned normalized items only'
      - 'SELECT_EXISTING_OR_ADVISORY_XACT_LOCK ops.communication_callback_events [zero-or-one-existing] :: serialize provider_config_id plus replay_key_digest;
        exact finalized row returns acknowledgement bytes'
      - 'SELECT_FOR_UPDATE ops.outbound_deliveries [zero-to-item-count] :: correlated IDs ascending'
      - 'SELECT_FOR_UPDATE ops.outbound_delivery_attempts [zero-to-item-count] :: delivery/attempt order'
      - 'EVALUATE normalized callback item set [one] :: fold at most one monotonic result per delivery and derive applied/stale/unmatched counts
        plus exact acknowledgement bytes'
      - 'INSERT ops.communication_callback_events [exactly-one] :: append authenticated request ledger with encrypted raw body, closed normalized
        item set, counts and encrypted exact acknowledgement'
      - 'INSERT_CONDITIONAL ops.outbound_delivery_receipts [zero-to-item-count] :: authentic applied or out-of-order evidence'
      - 'UPDATE_CONDITIONAL ops.outbound_deliveries [zero-to-distinct-delivery-count] :: monotonic fold only'
      - 'INSERT ops.audit_events [exactly-one] :: request-level redacted audit'
      - 'INSERT_CONDITIONAL ops.outbox [exactly-state-changing-distinct-delivery-count] :: communication.delivery_receipt_recorded.v1'
      network_io: FORBIDDEN; success only after durable commit
    cardinality:
      request_ledger: exactly-one append-only ops.communication_callback_events row per new authenticated request
      callback_items: one closed items inside normalized_items; zero standalone item rows
      delivery_mutations: zero-to-distinct-item-delivery-count and at most one folded mutation per delivery
      audit: exactly-one new request
      outbox: exactly state-changing distinct delivery count
      receipt: one request receipt plus one item receipt per parsed item
    audit:
      action: callback.acceptSmtpDsn
      classification: RESTRICTED
      redaction: HMAC/digest references only
    outbox:
      events:
      - communication.delivery_receipt_recorded.v1
      condition: APPLIED item changes canonical delivery state
      out_of_order_unbound: zero domain outbox
    receipt:
      schema: CommunicationCallbackReceiptV1
      storage: ops.communication_callback_events acknowledgement_http_status/content_type/headers/body_ciphertext/body_sha256/body_length/digest
        plus bound outbound receipt item ordinals
      results:
      - APPLIED
      - DUPLICATE
      - RECORDED_OUT_OF_ORDER
      - QUARANTINED_UNBOUND
    errors:
      exact_codes:
      - INVALID_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - PAYLOAD_TOO_LARGE
      - CALLBACK_INTEGRATION_UNAVAILABLE
      - CALLBACK_AUTHENTICATION_REQUIRED
      - CALLBACK_AUTHENTICATION_INVALID
      - CALLBACK_FRESHNESS_INVALID
      - CALLBACK_EVENT_ID_REQUIRED
      - CALLBACK_CORRELATION_REQUIRED
      - CALLBACK_BINDING_MISMATCH
      - CALLBACK_REPLAY_CONFLICT
      - RATE_LIMITED
      - STORAGE_FAILURE
      - INTERNAL_ERROR
      rollback: all request/item/domain/audit/outbox/receipt writes roll back together; never 2xx before commit
