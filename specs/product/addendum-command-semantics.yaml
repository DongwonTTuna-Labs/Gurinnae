schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
purpose: Normative statement-level lifecycle and persistence semantics for every additive external command, private application command, base-operation atomic extension and private provider callback operation.
source_sets:
  external_commands:
    source: specs/product/addendum-operation-contracts.yaml#operations[kind=COMMAND]
    count: derived from registry
  private_application_commands:
    source: specs/product/owner-addendum-2026-07-14.yaml#private_application_commands.commands
    count: derived from registry
  base_operation_atomic_extensions:
    source: specs/product/owner-addendum-2026-07-14.yaml#base_operation_atomic_extensions.operations
    count: derived from registry
  private_callback_operations:
    source: specs/product/owner-addendum-2026-07-14.yaml#private_communication_gateway_operations
    count: derived from registry
    mutating_commands: derived count(registry where operation_kind=COMMAND)
    read_only_queries: derived count(registry where operation_kind=QUERY)
  private_control_commands:
    source: specs/product/owner-addendum-2026-07-14.yaml#private_control_service_operations[kind=COMMAND]
    count: derived from registry
global_invariants:
- Registry key equals operation_id and both authority sets are exact set-equal.
- One operation has one effect_owner and one atomic_transition_group; workers execute durable work but never rematerialize the owned effect.
- Each command uses the explicit idempotency profile selected below. Only `decideJourneyHandoff` uses a separately committed fresh-assertion attempt before its business transaction; no other command inherits that split or its stable seven-field hash implicitly.
- Every SELECT_FOR_UPDATE follows the listed total order; rows outside bracketed cardinality are typed errors.
- No network I/O occurs in a database transaction; possible external acceptance is reconciled, never blindly retried or cancelled as fact.
- Error sets are exact aliases of the canonical resource/error contract.
shared_contracts:
  external-command-idempotency-v1:
    scope: the exact operation-specific deployment, operation and authenticated actor/session binding declared by each command
    key: SHA256(UTF8(Idempotency-Key))
    request_hash: the exact canonical request hash declared by the command
    claim_and_lock: resolve one claim or finalized replay before owned mutable-state validation in the command's declared lock order
    exact_replay: return the original safe response tuple and write zero second owned-effect, business-audit, outbox or receipt row
    changed_replay: a changed request hash under the same bound key is IDEMPOTENCY_CONFLICT with zero owned-effect writes
    response_finalization: status, media type, safe header bytes, exact body bytes, resource identity and receipt digest commit atomically with the owned effect
    fresh_assertion_inference: forbidden; this common contract alone never creates a separately committed authorization-attempt transaction or changes the operation's request-hash projection
    derived_session_exact_replay: same operation, BFF issuer, session token hash, idempotency key hash and request digest returns stored HTTP status, safe headers and exact response bytes even after one-shot consumption or profile rotation
    derived_session_changed_replay: same replay identity with changed digest returns IDEMPOTENCY_CONFLICT; different token, issuer or key cannot read another stored response
  fresh-assertion-stable-business-idempotency-v1:
    operations: [decideJourneyHandoff]
    business_hash_profile: journey-handoff-business-v1
    authorization_attempt_contract: separately-committed-before-business
    attempt_writes: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED]
    duplicate_errors: [ACTOR_ASSERTION_REPLAYED, SERVICE_ASSERTION_REPLAYED]
    fixed_scope: JOURNEY_HANDOFF_DECISION
    fixed_operation_id: decideJourneyHandoff
    bff_issuer: MUST_BE_NULL
    session_token_hash: MUST_BE_NULL
    transaction_a_proof: {relations: [ops.assertion_replay_guard, ops.audit_events], columns: [attempt_transaction_xid8, attempt_transaction_xid8], predicate: both MVCC-visible immutable rows have equal non-null xid8 and that xid8 differs from Transaction-B pg_current_xact_id(), producer: each controlled INSERT binds the stored xid8 to its server-side pg_current_xact_id(), legacy: NULL is never proof}
    transaction_b_claim_proof: {relation: ops.idempotency_keys, column: claim_transaction_xid8, new_claim_predicate: BOUND_V1 and claim_transaction_xid8=pg_current_xact_id(), apply_finalize_predicate: equality with the same top-level xid even inside SAVEPOINT or nested SAVEPOINT, final_replay: historical claim does not require current-xid equality}
    forbidden_transaction_proofs: [tuple xmin, row xmin, caller-supplied xid, legacy xid backfill, hard pg_xact_status=committed]
    pg_xact_status_diagnostic: committed is corroborating only; NULL is permitted after status-history truncation; in-progress or aborted is an integrity fault
    exact_replay: after a different fresh assertion attempt, prepare returns FINAL_REPLAY and the caller returns stored response bytes before encryption or mutable/domain lookup with zero second protected business row
    changed_replay: only a changed included seven-field business value conflicts; transport request, fresh JTI, token encoding and randomized ciphertext never define business identity
    profile_set_equality: this profile has the exact singleton operation set [decideJourneyHandoff], is referenced by that operation exactly once, and prefix/fallback/implicit membership is forbidden
  external-command-audit-v1:
    rows: exactly-one business-success audit on each new successful command and zero second business-success audit on exact replay; a separately committed assertion-attempt audit exists only when the selected operation profile explicitly requires it
    relation: ops.audit_events
    classification: INTERNAL_RESTRICTED
    redaction: no secret, token, endpoint, message bytes, raw proof, identity proof or provider identifier
  external-command-receipt-v1:
    rows: exactly-one closed receipt stored before commit; zero new on replay
    storage: ops.idempotency_keys.response_body plus aggregate-specific immutable receipt/digest columns
    digest: SHA256(GURINE_CANONICAL_JSON_V1(the exact stored closed response body))
    replay_bytes: status, content type, safe headers and body are returned exactly as stored; replay never toggles or injects a body field
    idempotencyReplay_field: forbidden in the canonical response body because changing false to true would violate byte-identical replay; the current resource schema must remove it or freeze it as a non-semantic constant false until removal
  all-or-nothing-v1: inside the selected profile's business transaction every error rolls back its claim, domain mutation, command audit, outbox, receipt and response finalization together; only fresh-assertion-stable-business-idempotency-v1 has an earlier committed replay-guard and authorization-attempt audit, which is not rolled back with business work; response is returned only from the exact stored tuple
external_commands:
  createActionProposal:
    operation_id: createActionProposal
    api: control-api
    method: POST
    path: /v1/internal/action-proposals
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.createActionProposal
    atomic_transition_group: gurine.command.createActionProposal.v1
    state_disposition: action_proposal.NONE->DRAFT
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: READ_COMMITTED
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'VALIDATE typed-origin-and-target-repositories [exactly-one-per-reference] :: immutable identity/version/digest exists and actor scope
        is current'
      - 'INSERT ops.action_proposals [exactly-one] :: immutable origin, target, owner and compensation link'
      - 'INSERT ops.action_proposal_versions [exactly-one] :: encrypted ActionPayloadV1 and DRAFT version 1'
      - 'UPDATE ops.action_proposals [exactly-one] :: set deferred current-version and receipt pointers'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.proposal_created.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.proposal_created.v1
      cardinality:
        action.proposal_created.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionProposalReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - ACTION_KIND_MISMATCH
      - TARGET_NOT_FOUND
      - CAPABILITY_DENIED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  updateActionDraft:
    operation_id: updateActionDraft
    api: control-api
    method: PATCH
    path: /v1/internal/action-proposals/{proposalId}/draft
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.updateActionDraft
    atomic_transition_group: gurine.command.updateActionDraft.v1
    state_disposition: action_proposal.DRAFT->SUPERSEDED plus new DRAFT version
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: id=:proposalId and current_version=:expectedVersion'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: current DRAFT and content_digest=:expectedContentDigest'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: old DRAFT->SUPERSEDED and state_version+1'
      - 'INSERT ops.action_proposal_versions [exactly-one] :: encrypted replacement DRAFT at version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: current_version+1 and aggregate_version+1'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.proposal_updated.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.proposal_updated.v1
      cardinality:
        action.proposal_updated.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionProposalReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - ACTION_PROPOSAL_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_DECISION_CLOSED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  previewActionDraft:
    operation_id: previewActionDraft
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:preview
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.previewActionDraft
    atomic_transition_group: gurine.command.previewActionDraft.v1
    state_disposition: NON_STATE_MUTATION preview fact append on DRAFT
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: READ_COMMITTED
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: exact proposal/current version'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: DRAFT, exact content digest, preview_id is null'
      - 'EVALUATE policy-rights-consent-conflict-activation-budget-render [exactly-one-result] :: closed common ApprovalBindingV1 and rendered-byte
        digest'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: append encrypted preview/binding once; state remains DRAFT; state_version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: aggregate_version+1 and receipt pointers'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.proposal_updated.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.proposal_updated.v1
      cardinality:
        action.proposal_updated.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionPreviewReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - ACTION_PROPOSAL_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_POLICY_BLOCKED
      - CAPABILITY_UNCONFIGURED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  submitActionForReview:
    operation_id: submitActionForReview
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:submit-review
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.submitActionForReview
    atomic_transition_group: gurine.command.submitActionForReview.v1
    state_disposition: action_proposal.DRAFT->PENDING_QUORUM plus assignments.NONE->ASSIGNED
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      - ops.action_review_assignments(proposal_id,proposal_version,slot_ordinal,assignment_generation,id)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: exact proposal/current version'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: DRAFT and exact content/preview/common approval digests'
      - 'EVALUATE quorum-policy-and-eligible-reviewers [exactly-one-plan] :: nonempty deterministic distinct-human slot plan'
      - 'INSERT ops.action_review_assignments [exactly-required-slot-count] :: one generation-one assignment per slot'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: DRAFT->PENDING_QUORUM and state_version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: aggregate_version+1'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.review_requested.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.review_requested.v1
      cardinality:
        action.review_requested.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionReviewRequestedReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - ACTION_PROPOSAL_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_PREVIEW_STALE
      - ACTION_POLICY_BLOCKED
      - ACTION_QUORUM_UNAVAILABLE
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  claimActionReview:
    operation_id: claimActionReview
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:claim-review
    operation_kind: COMMAND
    authorization:
      capability: actions.review
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.claimActionReview
    atomic_transition_group: gurine.command.claimActionReview.v1
    state_disposition: action_review_assignment.ASSIGNED->IN_PROGRESS
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      - ops.action_review_assignments(id)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: exact proposal/current version'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: PENDING_QUORUM and approval_digest=:expectedDecisionDigest'
      - 'SELECT_FOR_UPDATE ops.action_review_assignments [exactly-one] :: assigned reviewer/version/slot and actor is eligible'
      - 'UPDATE ops.action_review_assignments [exactly-one] :: ASSIGNED->IN_PROGRESS and version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: aggregate_version+1'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.review_claimed.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.review_claimed.v1
      cardinality:
        action.review_claimed.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionReviewClaimedReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - ACTION_PROPOSAL_STALE
      - ACTION_ASSIGNMENT_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_REVIEW_ALREADY_CLAIMED
      - CAPABILITY_DENIED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  submitActionDecision:
    operation_id: submitActionDecision
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:decide
    operation_kind: COMMAND
    authorization:
      capability: actions.review
      authorization: null
      assurance: conditional-by-action-and-decision
      reauthorized_in_transaction: true
    effect_owner: control-api.submitActionDecision.final-approve
    atomic_transition_group: gurine.command.submitActionDecision.v1
    state_disposition: assignment terminalization plus proposal quorum transition plus atomic effect creation
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      - ops.action_review_assignments(proposal_id,proposal_version,slot_ordinal,assignment_generation,id)
      - ops.action_decisions(proposal_id,proposal_version,created_at,id)
      - ops.in_flight_effects(id)
      - ops.execution_authorizations(execution_id,generation)
      - ops.budget_limits(scope,id)
      - ops.budget_reservations(id)
      - ops.budget_reservation_ledger_entries(scope,window,id)
      - ops.execution_attempts(execution_id,generation)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: exact pending proposal head'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: PENDING_QUORUM and common ApprovalBindingV1 digest'
      - 'SELECT_FOR_UPDATE ops.action_review_assignments [exactly-current-slot-count] :: total canonical slot order'
      - 'SELECT_FOR_UPDATE ops.action_decisions [zero-or-more] :: immutable decisions in decision order'
      - 'EVALUATE authorization-conflict-separation-quorum [exactly-one-result] :: reauthorize every counted human and choose one winner'
      - 'INSERT ops.action_decisions [exactly-one] :: decision kind/actor/reason/assurance have separate receipt digest; approval digest stays
        common'
      - 'UPDATE ops.action_review_assignments [exactly-one] :: complete or recuse current assignment'
      - 'INSERT_CONDITIONAL ops.action_review_assignments [one-if-RECUSE-else-zero] :: deterministic replacement generation; recused actor excluded'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: same-state approval append or terminal winner; state_version+1'
      - 'INSERT_CONDITIONAL ops.in_flight_effects [one-if-final-APPROVE-else-zero] :: sole effect owner; POLICY_BLOCKED or QUEUED'
      - 'INSERT_CONDITIONAL ops.budget_reservations [one-if-paid-policy-pass-else-zero] :: exact approval/fence snapshot'
      - 'INSERT_CONDITIONAL ops.budget_reservation_ledger_entries [six-if-reserved-else-zero] :: environment/provider/case crossed day/month'
      - 'INSERT_CONDITIONAL ops.execution_authorizations [one-if-final-APPROVE-and-all-fences-pass-else-zero] :: generation 1'
      - 'INSERT_CONDITIONAL ops.execution_attempts [one-if-authorization-created-else-zero] :: generation 1 QUEUED'
      - 'UPDATE ops.action_proposals [exactly-one] :: aggregate_version+1'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.decision_recorded.v1: exactly-one
        action.execution_authorized.v1: one iff final APPROVE and all fences pass
        operations.effect_policy_blocked.v1: one iff final APPROVE and a current fence blocks
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.decision_recorded.v1
      - action.execution_authorized.v1
      - operations.effect_policy_blocked.v1
      cardinality:
        action.decision_recorded.v1: exactly-one
        action.execution_authorized.v1: one iff final APPROVE and all fences pass
        operations.effect_policy_blocked.v1: one iff final APPROVE and a current fence blocks
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionDecisionReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - ACTION_KIND_MISMATCH
      - ACTION_PROPOSAL_STALE
      - ACTION_ASSIGNMENT_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_DECISION_CLOSED
      - ACTION_CONFLICT_UNRESOLVED
      - STEP_UP_REQUIRED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  cancelActionExecution:
    operation_id: cancelActionExecution
    api: control-api
    method: POST
    path: /v1/internal/action-executions/{executionId}:cancel
    operation_kind: COMMAND
    authorization:
      capability: actions.operate
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.cancelActionExecution
    atomic_transition_group: gurine.command.cancelActionExecution.v1
    state_disposition: action_execution pre-dispatch->CANCELLED; possible-effect->CANCEL_REQUESTED
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.in_flight_effects(id)
      - ops.execution_authorizations(execution_id,generation)
      - ops.execution_attempts(execution_id,generation)
      - ops.execution_receipts(execution_id,receipt_sequence)
      statements:
