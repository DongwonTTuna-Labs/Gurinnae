    operation_kind: COMMAND
    authorization:
      capability: conflicts.declare
      assurance: SELF_ACTIVE_SESSION_OR_OVERSIGHT_STEP_UP
      reauthorized_in_transaction: true
      predicates: [self-subject-or-conflicts.manage, independent-oversight-when-required, no-history-rewrite]
    effect_owner: control-api.withdrawConflict
    atomic_transition_group: gurine.command.withdrawConflict.v1
    state_disposition: conflict_declaration.ACTIVE->WITHDRAWN_BY_APPEND_ONLY_ABSENT_FACT
