    cardinality: {withdrawal_fact: exactly-one new success, prior_mutation: zero, audit: exactly-one new success, outbox: exactly-one new success, receipt: exactly-one new success, exact_replay: zero writes}
    audit_contract: external-command-audit-v1
    outbox: {events: [governance.conflict_withdrawn.v1], cardinality: {governance.conflict_withdrawn.v1: exactly-one}, payload_source: specs/product/addendum-event-contracts.yaml}
    receipt: {schema: ConflictDeclarationReceiptV1, contract: external-command-receipt-v1}
    errors:
