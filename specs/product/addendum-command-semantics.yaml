  decideJourneyHandoff:
    operation_id: decideJourneyHandoff
    api: control-api
    method: POST
    path: /v1/internal/journey-handoffs/{handoffId}:decide
    operation_kind: COMMAND
    authorization:
      capability: journeys.handoff.decide
      assurance: conditional-by-persisted-handoff-binding-with-minimum-ACTIVE_SESSION
      reauthorized_in_transaction: true
      predicates: [exact persisted receiver identity, exact object scope, current required capability, stored minimum assurance]
    entry_boundaries:
      external_actor_http: {transport_profile: CONTROL_COMMAND, session_user: gurine_control_api, assertion_type: ACTOR, credential: X-Gurine-Actor-Assertion, opposite_credential: FORBIDDEN}
      internal_service_workflow: {transport_profile: JOURNEY_WORKFLOW_DB_COMMAND, session_user: gurine_workflow_worker, assertion_type: SERVICE, credential: closed workload envelope serviceAssertion, HTTP_and_actor_credentials: FORBIDDEN}
      service_canonical_target: ops.consume_journey_handoff_assertion_attempt_v1->ops.prepare_journey_handoff_decision_v1->ops.decide_journey_handoff_v1->ops.finalize_journey_handoff_decision_response_v1
      mutual_exclusion: exact one boundary by session_user plus assertion_type before attempt consume; cross-boundary credential or transport is INVALID assertion with zero replay-guard or business writes
      shared_semantics: semantic request and seven-field hash are byte-equal before entering the shared prepare/apply/finalize business transaction
    effect_owner: control-api.decideJourneyHandoff
    atomic_transition_group: gurine.command.decideJourneyHandoff.v1
    state_disposition: simple ACKNOWLEDGE or DECLINE advances one parent version; a compiled DECLINE replacement is the exact two-step terminal-decision then generation+1 HANDOFF_REQUESTED sequence and finishes WAITING_ACK
    compound_branches: [decline_with_replacement, expiry_with_replacement, supersession_with_replacement, terminal_outcome_with_cancellation]
    success_contract: {decision_receipt: required-old-terminal-step, replacement: nullable-complete-generation-plus-one-request, final_parent: required-authoritative-post-command-head}
    idempotency_contract: external-command-idempotency-v1
    idempotency_profile: fresh-assertion-stable-business-idempotency-v1
    idempotency_key_sources:
      external_actor_http: SHA256(UTF8(raw HTTP Idempotency-Key header))
      internal_service_workflow: exact idempotencyKeySha256 from the authenticated closed workload envelope
      parity: both map to the same ops.idempotency_keys key_hash field and neither request ID, wire digest, JTI nor business hash may substitute for it
    idempotency_request_hash:
      profile: journey-handoff-business-v1
      algorithm: SHA256(GURINE_CANONICAL_JSON_V1(closed object with explicit null reason fields))
      includes: [operationId, handoffId, expectedHandoffVersion, expectedBindingDigest, decision, reasonCode, reasonDigest]
      excludes: [requestId, actorAssertionJti, serviceAssertionJti, assertionTokenBytes, wireRequestDigest, randomizedReasonEncrypted, plaintextReason]
      rule: ACKNOWLEDGE uses null reasonCode/reasonDigest; DECLINE rejects NUL unpaired surrogate and whitespace-only input, NFC-normalizes UTF-8 without trimming or rewriting internal whitespace, and sets reasonDigest=SHA256(exact normalized bytes) before the business claim; every accepted attempt first consumes a fresh request-bound assertion JTI and records its authorization attempt, then a finalized matching business hash returns stored bytes; only NEW encrypts or mutates and only a changed included business field is IDEMPOTENCY_CONFLICT
    decision_reason_shape:
      discriminator: decision
      closed_decline_reason_codes: [CAPABILITY_UNAVAILABLE, OBJECT_SCOPE_MISMATCH, CONFLICT_OF_INTEREST, WORKLOAD_CAPACITY, DEPENDENCY_BLOCKED, SUBJECT_INVALID, OWNER_UNAVAILABLE, POLICY_BLOCKED, RECEIVER_DECLINED]
      branches:
        ACKNOWLEDGE: {reasonCode: MUST_BE_NULL, reason: MUST_BE_NULL, reasonDigest: MUST_BE_NULL, reasonEncrypted: MUST_BE_NULL}
        DECLINE: {reasonCode: REQUIRED_CLOSED_DECLINE_REASON_CODE, reason: REQUIRED_VALID_UNICODE_NUL_FREE_NFC_NON_WHITESPACE_1_TO_4000, reasonDigest: REQUIRED_SHA256_OF_EXACT_NFC_UTF8_BYTES, reasonEncrypted: REQUIRED_NEW_CLAIM_ONLY_RANDOMIZED_CIPHERTEXT}
      enforcement_points: [trusted wire validation before attempt consume, prepare business-hash validation before idempotency relation access, apply SQL branch validation before domain writes, finalize receipt graph validation]
    authorization_attempt_contract:
      order: verify signature audience request binding and semantic request; consume fresh JTI with server-persisted attempt_transaction_xid8 in ops.assertion_replay_guard and append ASSERTION_ATTEMPT_CONSUMED audit whose generated attempt_transaction_xid8 is equal and hash-bound; commit; then enter a distinct business idempotency transaction whose current xid differs
      accepted_attempt_writes: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED]
      duplicate_jti: ACTOR_ASSERTION_REPLAYED or SERVICE_ASSERTION_REPLAYED before business claim with zero business writes
      crash_after_attempt_before_business: fresh JTI retry may claim the same stable business request; the prior attempt evidence remains and no in-flight business claim exists
      replay: a different fresh JTI and transport request ID may return the byte-identical finalized response when the included business fields and Idempotency-Key are unchanged
      transaction_proof: ordinary MVCC visibility plus equal non-null immutable attempt xid8 values and current-xid inequality; xmin is forbidden and pg_xact_status is diagnostic only
    idempotency_relation_access:
      prepare: {direct_ops_idempotency_keys: zero, owner_claim_calls: exactly-one, owner_replay_calls: exactly-one-iff-FINAL_AVAILABLE, owner_finalize_calls: zero}
      apply: {direct_ops_idempotency_keys: exactly-one schema-qualified SELECT INTO STRICT complete-tuple read, dml: zero, helper_calls: zero, owner_calls: zero, proof: claim_transaction_xid8=pg_current_xact_id()}
      finalize: {pre_read: exactly-one schema-qualified SELECT INTO STRICT FOR UPDATE complete-tuple read, owner_finalize_calls: exactly-one, owner_replay_calls: zero, post_readback: exactly-one schema-qualified complete persisted-tuple read, equality: exact status/schema/media/header bytes/body bytes/digests/resource/receipt/audit/outbox/completed tuple without JSON reserialization}
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - immutable committed assertion replay-guard plus ASSERTION_ATTEMPT_CONSUMED audit proof lookup
      - ops.idempotency_keys(scope,key_hash)
      - non-locking immutable handoff lookup solely to discover journey_instance_id
      - ops.journey_instances(id)
      - ops.journey_handoffs(id,journey_instance_id,generation)
      - compiled domain adapter rows in registered relation and primary-key order
      - ops.journey_transition_receipts(journey_instance_id,sequence)
      - ops.audit_events chain head
      - ops.outbox
      statements:
      - 'PREPARE ops.prepare_journey_handoff_decision_v1 [exactly-one-logical-result] :: recompute the seven-field business request hash, require MVCC-visible equal non-null attempt_transaction_xid8 proof from a different top-level transaction without xmin or hard pg_xact_status, and return NEW or FINAL_REPLAY while locking the Idempotency-Key identity; NEW persists claim_transaction_xid8=pg_current_xact_id()'
      - 'FINAL_REPLAY [zero protected business writes] :: return stored status, media type, safe header bytes and body bytes before encryption, handoff lookup, session/domain validation or response reserialization'
      - 'NEW_ONLY_ENCRYPTION [exactly-one logical boundary] :: only a NEW prepare receipt authorizes local encryption of the canonical NFC reason bytes; ACKNOWLEDGE keeps every reason field null'
      - 'LOOKUP ops.journey_handoffs [exactly-one, non-locking identity only] :: discover journey_instance_id without reading mutable authority'
      - 'SELECT_FOR_UPDATE ops.journey_instances [exactly-one] :: active handoff tuple, nonterminal state, exact current owner and receipt head'
      - 'SELECT_FOR_UPDATE ops.journey_handoffs [exactly-one] :: expectedHandoffVersion, expectedBindingDigest, PENDING_ACK and one database-clock value strictly before immutable due_at'
      - 'REAUTHORIZE receiver and compiled binding [exactly-one] :: actor/service identity, capability, object scope and stored minimum assurance; no caller-selected route or adapter'
      - 'SELECT_FOR_UPDATE compiled domain adapter rows [exact binding cardinality] :: lock and validate current domain owner state in the registered order'
      - 'APPLY compiled ownership adapter [exact binding cardinality] :: ACKNOWLEDGE transfers owner; DECLINE preserves owner and creates only the registered deterministic replacement or BLOCKED result'
      - 'ENCRYPTION_BOUNDARY [exactly-one logical validation] :: verify ciphertext was produced after the NEW prepare receipt; ACKNOWLEDGE passes null reason fields and DECLINE passes closed reasonCode, reason_encrypted and canonical reason_digest while SQL receives no plaintext'
      - 'UPDATE ops.journey_handoffs [exactly-one old row] :: version+1, terminal state, actor binding and encrypted/digested reason shape'
      - 'UPDATE ops.journey_instances [one-or-two ordered statements] :: each statement advances version/head by exactly one; optional second step creates the replacement final WAITING_ACK head'
      - 'INSERT ops.journey_transition_receipts [one-or-two] :: terminal HANDOFF_ACKNOWLEDGED or HANDOFF_DECLINED first; optional HANDOFF_REQUESTED second at consecutive instance version/sequence'
      - 'INSERT ops.journey_handoffs [zero-or-one] :: exact compiled replacement generation+1 at version one; caller cannot select it'
      - 'INSERT ops.audit_events [one-or-two] :: terminal JOURNEY_HANDOFF_DECIDED plus optional JOURNEY_HANDOFF_REQUESTED with digest-only references'
