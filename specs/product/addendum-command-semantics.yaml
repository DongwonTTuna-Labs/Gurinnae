  verifyWhatsAppWebhook:
    operation_id: verifyWhatsAppWebhook
    provider: META_WHATSAPP_BUSINESS_CLOUD
    method: GET
    path: /private/v1/callbacks/whatsapp/{integrationId}
    operation_kind: QUERY
    effect_owner: notification-worker.callback-gateway
    atomic_transition_group: NONE_READ_ONLY
    state_disposition: READ_ONLY authenticated challenge echo
    authentication: constant-time comparison against active HMAC-backed verify token; no integration existence oracle
    transaction:
      isolation: READ_COMMITTED
      lock_order: []
      statements:
      - 'SELECT ops.communication_provider_configs [zero-or-one] :: active pinned WhatsApp verification config'
      writes: zero
    cardinality:
      domain: zero
      audit: zero
      outbox: zero
      receipt: zero
      response: one exact text/plain challenge on success
    idempotency:
      mode: SAFE_READ
      replay: same authenticated query returns same challenge without state
    audit:
      rows: zero
      failure_observability: redacted bounded metric only
    outbox:
      events: []
      cardinality: zero
    receipt:
      schema: WhatsAppWebhookVerificationChallengeV1
      storage: not persisted
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - CALLBACK_INTEGRATION_NOT_FOUND
      - CALLBACK_INTEGRATION_UNAVAILABLE
      - CALLBACK_AUTHENTICATION_REQUIRED
      - CALLBACK_VERIFY_TOKEN_INVALID
      - RATE_LIMITED
      - STORAGE_FAILURE
      - INTERNAL_ERROR
      rollback: read-only
