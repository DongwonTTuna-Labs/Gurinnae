  createPrivacyRequest:
    operation_id: createPrivacyRequest
    api: submission-api
    method: POST
    path: /v1/privacy-requests
    operation_kind: COMMAND
    authorization:
      capability: null
      authorization: anonymous-proof
      assurance: ANONYMOUS_PROOF
      reauthorized_in_transaction: true
    effect_owner: submission-api.createPrivacyRequest
    atomic_transition_group: gurine.command.createPrivacyRequest.v2
    state_disposition: privacy_request.NONE->RECEIVED with identity_state=PENDING_VERIFICATION and identity_verified_at/due_at null
    idempotency_contract: external-command-idempotency-v1
    access_policy_contract: privacy_request_receipt_access_policy
    procedure: ops.create_privacy_request_v2
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.privacy_requests_v2(subject_scope_digest,created_at,id)
      - ops.privacy_request_receipt_tokens_v2(token_hmac)
      statements:
      - 'RESOLVE ops.current_privacy_request_access_policy_v1(database clock) [exactly-one APPROVED effective unexpired ops.privacy_request_access_policies_v1 row] :: bind policy_id, revision, policy_digest and binding_digest; zero, duplicate, expired, unapproved or production TEST_ONLY authority returns request-id-only DEPENDENCY_UNAVAILABLE before the idempotency claim and writes nothing'
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'VALIDATE proof-envelope-scope-consent-abuse [exactly-one-pass] :: accept exact closed PrivacyRequestScopeV1, forbid caller digest scalars, and derive subjectProofHash from the validated proof; no synchronous identity approval and no raw identity proof persisted'
      - 'DERIVE scope digests [exactly-one] :: scopeCanonical=canonical JSON(exact closed PrivacyRequestScopeV1), scopeSha256=SHA256(scopeCanonical), subjectScopeDigest=SHA256(canonical JSON({schemaVersion:"privacy-subject-scope-v1",subjectProofHash,scopeSha256})); all three digests are owner-derived and public/event scopeDigest equals scopeSha256'
      - 'SELECT_FOR_UPDATE ops.privacy_requests_v2 [zero-or-more] :: active same subject/scope request'
      - 'INSERT ops.privacy_requests_v2 [exactly-one] :: RECEIVED plus PENDING_VERIFICATION, encrypted scope, DB-derived scopeSha256/subjectScopeDigest, null identity_verified_at, null due_at and no response-calendar binding; raw scope is forbidden'
      - 'INSERT ops.privacy_request_receipt_tokens_v2 [exactly-one] :: verifier HMAC/digest of the deterministically derived one-time token, exact operation/idempotencyKeyHash/requestHash and selected access-policy identity/version/digest; expiresAt uses only tokenTtlSeconds and plaintext is never persisted'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit with digests only; raw scope is forbidden'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version; scopeDigest is the DB-derived scopeSha256 and raw scope/subjectScopeDigest are absent unless the event schema explicitly declares the digest'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store status/media/safe headers, resource identity, receipt digest and canonical secretless response template before commit; raw receiptToken is forbidden'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        privacy.request_created.v2: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - privacy.request_created.v2
      cardinality:
        privacy.request_created.v2: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: PrivacyRequestReceiptV1
      contract: secret-bearing-command-receipt-v2
      exact_replay: re-derive byte-identical receiptToken from the finalized operation/idempotencyKeyHash/requestHash tuple and deterministic secretless template; zero writes
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - IDENTITY_PROOF_INVALID
      - PRIVACY_SCOPE_INVALID
      - ABUSE_PROOF_INVALID
      - RATE_LIMITED
      - IDEMPOTENCY_CONFLICT
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
      dependency_unavailable_contract: access-policy zero, duplicate, expired or unapproved is 503 request-id-only and zero-write; never expose CAPABILITY_UNCONFIGURED, INTERNAL_ERROR detail, row count, policy identity or SQL detail
  exchangePrivacyRequestReceiptToken:
    operation_id: exchangePrivacyRequestReceiptToken
    api: submission-api
    method: POST
    path: /v1/submission-session/privacy-request-receipt:exchange
    operation_kind: COMMAND
    authorization:
      capability: null
      authorization: request-bound-bff-service-assertion+one-time-receipt-token+hash-bound-next-session-header
      assurance: ONE_TIME_PROOF
      reauthorized_in_transaction: true
      prior_scoped_session: FORBIDDEN
      browser_proof: FORBIDDEN
    effect_owner: submission-api.exchangePrivacyRequestReceiptToken
    atomic_transition_group: gurine.command.exchangePrivacyRequestReceiptToken.v2
    state_disposition: NON_DOMAIN_STATE_MUTATION token.FRESH->CONSUMED plus session.NONE->ACTIVE
    idempotency_contract: external-command-idempotency-v1
    access_policy_contract: privacy_request_receipt_access_policy
    request_schema: ExchangePrivacyRequestReceiptTokenRequestV1 with body field token only
    required_headers: [X-Gurine-Service-Assertion, X-Gurine-Next-Submission-Session]
    procedure: ops.exchange_privacy_request_receipt_token_v2
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.privacy_request_receipt_tokens_v2(token_hmac)
      - ops.privacy_requests_v2(id)
      - intake.submission_sessions(id)
      statements:
      - 'RESOLVE ops.current_privacy_request_access_policy_v1(database clock) [exactly-one APPROVED effective unexpired ops.privacy_request_access_policies_v1 row] :: bind policy_id, revision, policy_digest and binding_digest; zero, duplicate, expired, unapproved or production TEST_ONLY authority returns request-id-only DEPENDENCY_UNAVAILABLE before the idempotency claim and writes nothing'
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'VERIFY request-bound BFF service assertion [exactly-one-pass] :: exact operation, method, path, body digest, idempotency key and X-Gurine-Next-Submission-Session bytes'
      - 'SELECT_FOR_UPDATE ops.privacy_request_receipt_tokens_v2 [exactly-one] :: fresh body-token HMAC and unconsumed; no prior scoped session or browser proof'
      - 'SELECT_FOR_UPDATE ops.privacy_requests_v2 [exactly-one] :: exact request bound by the one-time token'
      - 'UPDATE ops.privacy_request_receipt_tokens_v2 [exactly-one] :: consume exactly once and bind session/receipt digest'
      - 'INSERT intake.submission_sessions [exactly-one] :: PRIVACY_REQUEST_RECEIPT session storing only SHA256(X-Gurine-Next-Submission-Session), exact request/BFF issuer scope and selected access-policy identity/version/digest; expiresAt uses only readOnlySessionTtlSeconds and authorization is exactly allowedOperations'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        identity.session_created.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - identity.session_created.v1
      cardinality:
        identity.session_created.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: PrivacyRequestSessionReceiptV1
      contract: external-command-receipt-v1
      cookie_name: gurine_privacy_request_receipt_session
      raw_token_rule: one-time body token and next-session header are absent; only safe request/session IDs, state, times and the exact cookie name are returned
      bff_sealing: only a successful receipt permits public-web to seal its retained raw next-session token into the /privacy cookie; failure seals nothing
    errors:
      exact_codes:
      - TOKEN_INVALID
      - TOKEN_EXPIRED
      - TOKEN_REPLAYED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
      dependency_unavailable_contract: access-policy zero, duplicate, expired or unapproved is 503 request-id-only and zero-write; token remains FRESH and no idempotency/session/audit/outbox row is written; never expose CAPABILITY_UNCONFIGURED, INTERNAL_ERROR detail, row count, policy identity or SQL detail
  declareConflict:
    operation_id: declareConflict
    api: control-api
