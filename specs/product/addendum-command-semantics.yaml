  private.ExecuteEconomicsImport:
    operation_id: private.ExecuteEconomicsImport
    authority: supervisor_decision_v1.ECO-AUTHORITY-V1
    authority_label: 감독자 결정 v1
    contract: private_action_executor_semantics
    operation_kind: COMMAND
    trigger: current ECONOMICS_IMPORT ExecutionAuthorization with STEP_UP and economics.import capability
    caller: workflow-worker.economics-import-executor
    effect_owner: workflow-worker.economics-import-executor
    database_role: gurine_economics_importer
    atomic_transition_group: gurine.private.ExecuteEconomicsImport.v1
    approval_detail_relation: ops.action_approval_economics_import_details
    effect_disposition_registry: specs/product/addendum-operation-contracts.yaml#economics_import_effect_disposition_registry
    target_version_contract: ActionTargetV1.expectedVersion and ApprovalBindingV1.targetVersion are exactly null for ECONOMICS_IMPORT; no positive sentinel is accepted, while every other action kind retains a positive version.
    approved_operation_identity_contract: Every new or successor usage receipt/fact ID and every invoice header/line/membership, revenue, cash, tax and accounting-correction ID is loaded from immutable approved operation bytes; database-generated hidden random identities are forbidden.
    digest_contract: Economics, usage, invoice, revenue, cash, tax and accounting-correction records use GURINE_LENGTH_PREFIXED_UTF8_V1 exactly as frozen by 감독자 결정 v1; funding records are excluded.
    branch_contracts:
      recordCommercialQualification:
        target_relations: [ops.acquisition_source_receipts, ops.commercial_qualification_receipts]
        atomic_cardinality: optional zero-or-one acquisition source plus exactly one qualification receipt
        allowed_result_effects: [RECORDED, REPLACED, REVERSED]
      importCostAllocationClose:
        target_relations: [ops.fx_rate_facts, ops.cost_allocations]
        atomic_cardinality: zero-or-more inline FX facts plus one period head and one-or-more allocation lines
        allowed_result_effects: [RECORDED, REPLACED]
      createTariffVersion:
        target_relations: [ops.tariff_versions]
        atomic_cardinality: exactly one tariff version
        allowed_result_effects: [RECORDED]
        first_tariff_bootstrap: one-shot PILOT at required margin 6000 only when same deployment and SKU tariff and contract history is zero, current GA READY is zero, one approved complete current cost close exists, the approval detail binds the first contract and qualification tuple plus both validity intervals, and the later contract import exact-matches that tuple
        low_margin_exception: {status: UNAVAILABLE, sqlstate: '55000', writes: 0}
      recordCommercialContractPeriod:
        target_relations: [ops.commercial_contract_periods, ops.offer_profile_capabilities]
        atomic_cardinality: exactly one contract period plus exactly twelve ordered offer-capability rows
        allowed_result_effects: [RECORDED, REPLACED]
      recordUsageWindow:
        target_relations: [ops.usage_window_receipts, ops.usage_facts]
        atomic_cardinality: exactly one paired usage-window receipt and usage fact
        allowed_result_effects: [RECORDED, REPLACED, REVERSED]
      recordInvoice:
        target_relations: [ops.discount_decisions, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships]
        atomic_cardinality: zero-or-more discounts, exactly one invoice, one-or-more lines, and complete expected usage memberships
        allowed_result_effects: [RECORDED, REPLACED]
        adjustment_rule: an adjustment references only an earlier non-adjustment line in the same approved array; cross-invoice, adjustment-to-adjustment, forward, missing or cyclic references roll back with zero writes
        low_margin_discount_exception: {status: UNAVAILABLE, sqlstate: '55000', writes: 0}
      recordRevenue:
        target_relations: [ops.revenue_facts]
        atomic_cardinality: one-or-more revenue facts fenced to persisted invoice-line ID and digest
        allowed_result_effects: [RECORDED]
      recordAccountingCorrection:
        target_relations: [ops.accounting_corrections]
        atomic_cardinality: one-or-more append-only corrections
        allowed_result_effects: [RECORDED, REVERSED]
      recordCashApplication:
        target_relations: [ops.cash_application_facts]
        atomic_cardinality: one-or-more signed imported facts
        allowed_result_effects: [RECORDED, REPLACED, REVERSED]
      recordTaxInvoiceIssuance:
        target_relations: [ops.tax_invoice_issuance_receipts]
        atomic_cardinality: one-or-more signed imported receipts
        allowed_result_effects: [RECORDED, REPLACED, REVERSED]
      recordCollectionFailure:
        target_relations: [ops.tasks]
        atomic_cardinality: exactly one operator review task and no economics, entitlement, or public-access mutation
        allowed_result_effects: [REVIEW_TASK_CREATED]
        review_authority: reviewAssigneeUserId is required and bound in request, immutable detail and receipt digests; PAYMENT_REVIEW_V1 with source SIGNED_COLLECTION_FAILURE requires one current active subject, authorization, endpoint, evaluator and source-bound deployment; mismatch raises SQLSTATE 55000 with zero writes
        due_at: occurredAt plus exactly 24 hours under 감독자 결정 v1 PAYMENT-TEST-V1
    state_disposition: append the selected branch's exact immutable effect and return only its allowed result disposition; never infer invoice, payment, cash, entitlement or public-access state, and payment-review failure never automatically changes a contract, entitlement or public access
    lifecycle_rule: Existing ActionProposal, ActionDecision and ExecutionAuthorization lifecycles are the only state-machine authority; UNRECORDED is a transport-only pre-effect sentinel and branch result dispositions are not pseudo-machine states.
    terminal_contract:
      owner_dispositions_exactly: [SUCCEEDED, OPERATION_REJECTED, PERMANENT_FAILED]
      receipt_field: terminalKind
      action_execution_state_selector: {SUCCEEDED: SUCCEEDED, OPERATION_REJECTED: PERMANENT_FAILED, PERMANENT_FAILED: PERMANENT_FAILED}
      worker_job_success_only: SUCCEEDED
      operation_rejected: nested branch apply rollback followed by one redacted non-retryable business or constraint rejection terminalization
      commit_ack_ambiguity: no terminal receipt or state; same claim, idempotency identity and fence recalls committed replay or executes only the uncommitted transaction
      forbidden: [RECONCILIATION_REQUIRED economics receipt, reconciliation economics state, external send, automatic resubmission, new idempotency identity]
    outbox:
      events: [action.execution_completed.v1, notification.payment_review_requested.v1]
      cardinality: action.execution_completed.v1 exactly once for every terminal execution; notification.payment_review_requested.v1 exactly once only for a successful recordCollectionFailure transition and zero for every other branch
    receipt: EconomicsImportExecutionReceiptV1
    errors: [RESOURCE_NOT_FOUND, VERSION_CONFLICT, EXECUTION_FENCE_STALE, EXECUTION_STATE_INVALID, ACTION_DIGEST_MISMATCH, STEP_UP_REQUIRED, VALIDATION_FAILED, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
  private.ExecuteDonationCharge:
    operation_id: private.ExecuteDonationCharge
    authority: supervisor_decision_v1.PAYMENT-TEST-V1
    authority_label: 감독자 결정 v1
    operation_kind: COMMAND
    transport: PRIVATE_APPLICATION_COMMAND
    trigger: billing-gateway has claimed one RUNNING DONATION_CHARGE job on queue billing-gateway with the current nonexpired lease token and positive fencing token
    caller: billing-gateway.donation-charge-executor
    effect_owner: payment-owner-function-boundary
    database_role: gurine_billing_gateway
    direct_dml: FORBIDDEN
    request: DonationChargeJobPayloadV1 exact thirteen-key payload; job ID, worker ID, lease token, fencing token and canonical job payload digest are execution context only
    target_relations: [ops.payment_method_bindings, ops.payment_charge_attempts, ops.donation_facts]
    auxiliary_relations: [ops.tasks, ops.audit_events, ops.outbox]
    lifecycle_contract:
      core_target_relations: [ops.payment_method_bindings, ops.payment_charge_attempts, ops.donation_facts]
      auxiliary_relations: [ops.tasks, ops.audit_events, ops.outbox]
      success_binding_transitions:
        SINGLE_CHARGE: {from: ACTIVE, to: REVOKED, terminal_disposition: CONSUMED}
        RECURRING: {from: ACTIVE, to: ACTIVE, terminal_disposition: RETAINED}
      success_atomicity: the definitive SUCCEEDED charge attempt, donation fact and credential-use-policy-selected binding transition commit in one payment-owner transaction; only SINGLE_CHARGE appends the ACTIVE to REVOKED consumption transition
      recurring_scheduler_owner: ops.enqueue_due_r6e_donation_charge_jobs_v1
      recurring_schedule_policy: payment_test_v1_operation_contract.recurring_schedule_policy_b
      review_assignee_source: exact request-bound reviewAssigneeUserId persisted by the TEST_ONLY donation intent and reloaded for a later authoritative payment failure; it is never synthesized by the scheduler or failure handler
      local_reject_terminal_owner: ops.fail_r6e_donation_charge_v1
      failure_outcomes:
        LOCAL_REJECT: {attempt_transition: REQUESTED_TO_FAILED, review_tasks: ZERO, donation_facts: ZERO, binding_consumptions: ZERO}
        FETCHED_FAILED: {attempt_transition: PROVIDER_ACCEPTED_TO_FAILED, review_tasks: EXACTLY_ONE, donation_facts: ZERO, binding_consumptions: ZERO}
        FETCHED_CANCELED: {attempt_transition: PROVIDER_ACCEPTED_TO_FAILED, review_tasks: EXACTLY_ONE, donation_facts: ZERO, binding_consumptions: ZERO}
      non_success_rule: replay, reconciliation and every failure append no second binding consumption and authorize no automatic resubmission, new logical charge or new idempotency identity
      authority_effects: entitlement, access, investigation-priority, publication-priority and public-readiness effects are always zero
    recurring_policy_b:
      anchor: first_charge_at UTC monthly anchor with non-drifting month-end clamp
      eligibility: current UTC month only; catch-up and backcharge are forbidden
      permanent_occurrence_identity: [schedule_id, schedule_version, scheduledFor]
      later_month_blockers: [pending, accepted, reconciliation_required]
      release_authorities: [definitive_pre_dispatch_rejection, fetch_confirmed_success, fetch_confirmed_refund, fetch_confirmed_failure]
      same_occurrence_resubmission_writes: 0
      scheduler_effect: one DONATION_CHARGE job insert and no direct payment, contract, entitlement or public-access effect
    payment_review:
      assignee_source: the exact source-bound reviewAssigneeUserId persisted from the TEST_ONLY donation intent
      topic: PAYMENT_REVIEW_V1
      source_kind: DONATION_PAYMENT_FAILURE
      due_at: occurredAt plus exactly 24 hours
      authorization_gate: one active internal subject, current authorization, exact-one endpoint and evaluator, and source-bound deployment
      mismatch: {sqlstate: '55000', writes: 0}
      reconciliation_required: {task: 0, notification: 0, automatic_retry: 0}
    transaction_phases:
      - The payment owner claim commits the exact job, lease, fencing, logical-charge and idempotency binding before provider I/O.
      - The TEST_ONLY provider charge is followed by an authoritative fetch outside every database transaction; raw authorization, billing key, merchant identifier and provider bytes never enter a receipt, error, audit or log.
      - The same payment-owner completion apply used by private.ReceivePaymentWebhook records the definitive charge attempt and, only for an authoritative result, one donation fact or one payment-review task plus its exact outbox event; a SINGLE_CHARGE success consumes ACTIVE to REVOKED in this same transaction while RECURRING remains ACTIVE.
    outcomes:
      CONFIRMED: DonationChargeExecutionResultV1 CONFIRMED with exact attemptId, receiptDigest and effects NONE
      REPLAY: the same immutable attemptId, receiptDigest and effects NONE with zero second write or outbox event
      RECONCILIATION_REQUIRED: attemptId only; no success receipt, claim release, automatic resubmission, new logical charge or new idempotency identity
      IN_PROGRESS: bounded nonterminal retry with no error receipt or duplicate provider effect
      LOCAL_REJECT: REQUESTED to FAILED under ops.fail_r6e_donation_charge_v1 with no review task, donation fact or binding consumption
      FETCHED_FAILED: PROVIDER_ACCEPTED to FAILED with exactly one payment-review task, no donation fact and no binding consumption
      FETCHED_CANCELED: provider CANCELED persists as FAILED with exactly one payment-review task, no donation fact and no binding consumption
    producer_contract:
      event_type: donation.fact_recorded.v1
      producer_operations_exactly: [private.ExecuteDonationCharge, private.ReceivePaymentWebhook]
      other_producer_disposition: REJECT
    state_disposition: donation and payment state cannot create or mutate a commercial contract, invoice, cash application, entitlement, access, investigation priority or publication priority
    errors: [INVALID_REQUEST, IDEMPOTENCY_CONFLICT, PAYMENT_RUNTIME_UNAVAILABLE, RECONCILIATION_REQUIRED, INTERNAL_ERROR]
