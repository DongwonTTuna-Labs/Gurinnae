      isolation: READ_COMMITTED
      scope: one SQLx auto-commit statement invoking ops.execute_due_r6d_entity_retention_job_v1; the SECURITY DEFINER function provides the complete owner transaction and performs no transaction-level isolation override
      lock_order:
        - ops.jobs(id) FOR UPDATE
