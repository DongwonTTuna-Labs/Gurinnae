schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
base_authority_zip_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
purpose: Normative statement-level lifecycle and persistence semantics for every additive external command, private application command, private billing-gateway HTTP operation, base-operation atomic extension and private provider callback operation.
source_sets:
  external_commands:
    source: specs/product/addendum-operation-contracts.yaml#operations[kind=COMMAND]
    count: derived from registry
  private_application_commands:
    source: specs/product/addendum-operation-contracts.yaml#private_application_commands
    count: derived from registry
  private_billing_gateway_operations:
    source: specs/product/addendum-operation-contracts.yaml#private_billing_gateway_operations
    count: derived from registry
  base_operation_atomic_extensions:
    source: specs/product/owner-addendum-2026-07-14.yaml#base_operation_atomic_extensions.operations
    count: derived from registry
  private_callback_operations:
    source: specs/product/owner-addendum-2026-07-14.yaml#private_communication_gateway_operations
    count: derived from registry
    mutating_commands: derived count(registry where operation_kind=COMMAND)
    read_only_queries: derived count(registry where operation_kind=QUERY)
  private_control_commands:
    source: specs/product/owner-addendum-2026-07-14.yaml#private_control_service_operations[kind=COMMAND]
    count: derived from registry
r6e_supervisor_decision_v1:
  authority_label: 감독자 결정 v1
  decision_revision: 1
  approval_status: APPROVED_AS_RECOMMENDED
  canonical_source: specs/product/business-model-contract.yaml#supervisor_decision_v1
  approved_packages_in_order: [ECO-AUTHORITY-V1, PAID-EVIDENCE-V2-AUTHORITY, PAYMENT-TEST-V1, GFD-AUTHORITY-V1]
  revision_policy: 운영 배포 전 지정 법률·재무 책임자의 공동 검토에서 새 명시적 revision으로 갱신할 수 있으며, 이 v1 값과 provenance를 덮어쓰거나 부분 재해석할 수 없다.
  command_authority:
    ECO-AUTHORITY-V1:
      authority_label: 감독자 결정 v1
      target_version: null exactly for ECONOMICS_IMPORT; every other action kind retains int64[1..max], and sentinel 1 is forbidden as an ECONOMICS_IMPORT substitute
      first_tariff_bootstrap:
        stage: PILOT
        required_margin_bps: 6000
        cardinality: one-shot
        prerequisites_in_order: [same deployment and SKU tariff and contract history zero, current GA READY zero, approved complete current cost close, approval detail binds intended first contract and qualification tuple plus both validity intervals, later contract import exact-matches the bootstrap tuple]
      low_margin_tariff_or_discount_exception: {status: UNAVAILABLE, sqlstate: '55000', writes: 0}
      explicit_identities: Every usage successor receipt and fact ID and every invoice header, line, membership, revenue, cash, tax and accounting-correction ID is present in approved operation bytes; hidden random database identity generation is forbidden.
      invoice_adjustments: Only an earlier non-adjustment line in the same approved array may be referenced; cross-invoice, adjustment-to-adjustment, forward, missing and cyclic references fail with zero writes.
      digest_abi: GURINE_LENGTH_PREFIXED_UTF8_V1 with unsigned-u64 big-endian length frames, explicit NULL, member count, fixed-six decimals, lowercase UUID/SHA and UTC microseconds; preserve field order and exclude only self digest and created_at or updated_at; PostgreSQL/Rust golden vectors and one-byte mutations are mandatory; funding digests never use this ABI.
      final_owner_abi_status: OPEN_QUESTION_FAIL_CLOSED_PENDING_FINAL_0041
    PAID-EVIDENCE-V2-AUTHORITY:
      authority_label: 감독자 결정 v1
      migration: Preserve 0029 V1 bytes and relations; abort before schema effects when any paid packet member or outcome row exists; never backfill.
      digest_order: V2 leaf excludes global member-set digest and contains categoryDigest; compute leaves first and then global set digest in ordinal order.
      review_snapshot: Add the twelve 0028-declared fields forward-only with zero-or-all presence.
      foreign_keys: Both outcome-to-packet and packet-to-outcome are MATCH FULL DEFERRABLE INITIALLY DEFERRED.
      terminal_binding: Existing four ordered VerifiedWorkflowProofV1 milestones plus exact terminal receipt, policy, formula, timezone and effective-until.
      subject_hmac: {domain: PAID_OUTCOME_SUBJECT_HMAC_V2, versions: [CURRENT, PREVIOUS], other_key_reuse_or_derivation: FORBIDDEN, injection: TEST_FIXTURE_ONLY}
      exact_v2_identifier_schema_preimage_status: OPEN_QUESTION_FAIL_CLOSED_NOT_AUTHORIZED_BY_APPROVAL_TEXT
    PAYMENT-TEST-V1:
      authority_label: 감독자 결정 v1
      runtime: {only_enabled_mode: TEST_ONLY, default: DISABLED, production: DISABLED, source_live_credentials: 0}
      keyrings: [{name: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY, versions: [CURRENT, PREVIOUS]}, {name: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY, versions: [CURRENT, PREVIOUS]}]
      recurring_policy_b: {anchor: first_charge_at UTC with non-drifting month-end clamp, window: current UTC month only, catch_up: FORBIDDEN, backcharge: FORBIDDEN, occurrence_identity: [schedule_id, schedule_version, scheduledFor], uniqueness: permanent, blockers: [pending, accepted, reconciliation_required], next_month_release: [definitive_pre_dispatch_rejection, fetch_confirmed_success, fetch_confirmed_refund, fetch_confirmed_failure], same_occurrence_resubmission_writes: 0, scheduler_effect: DONATION_CHARGE job insert only}
      payment_review: {required_field: reviewAssigneeUserId, applies_to: [TEST_ONLY donation intent, recordCollectionFailure], topic: PAYMENT_REVIEW_V1, source_kinds: [DONATION_PAYMENT_FAILURE, SIGNED_COLLECTION_FAILURE], due_at: occurredAt plus exactly 24 hours, mismatch: {sqlstate: '55000', writes: 0}, reconciliation_required: {task: 0, notification: 0, automatic_retry: 0}}
      review_gate: One active internal subject, current authorization, exact-one endpoint and evaluator, and source-bound deployment must all be current before task, intent, outbox and audit commit atomically.
      forbidden_automatic_effects: [external_dunning, entitlement_change, commercial_contract_change, public_access_change]
      restart_rule: Missing in-memory billing material fails closed without automatic recovery, replacement, recharge or resubmission.
      test_identity_generation: ephemeral database with TEST_FIXTURE authority only
    GFD-AUTHORITY-V1:
      authority_label: 감독자 결정 v1
      slots_in_order: [{ordinal: 1, slot: funding_preparer, capability: funding.manage, roles: [EXECUTIVE_APPROVER, OPERATIONS]}, {ordinal: 2, slot: funding_publisher, capability: funding.publish, roles: [EXECUTIVE_APPROVER]}, {ordinal: 3, slot: oversight_reviewer, capability: review.legal, roles: [LEGAL_REVIEWER], conditional_on: requires_oversight_review}, {ordinal: 4, slot: board_approver, capability: funding.publish, roles: [EXECUTIVE_APPROVER], conditional_on: requires_board_approval}]
      slot_rule: Every created slot also requires actions.review and STEP_UP; actors are pairwise distinct, VACANT does not close quorum, and conditional slots exist only when their boolean is true.
      related_case_rule: Each distinct related case requires one existing current PUBLICATION independent_editorial APPROVE with review.editorial, EDITOR or PUBLISHER, actions.review and STEP_UP.
      target_version: Candidate revision N is 1 for first publication and locked head plus 1 thereafter; N is at least 1 and zero/null sentinels are forbidden.
      publisher: {service: workflow-worker, database_role: gurine_workflow_worker, owner_function: editorial.publish_funding_disclosure_v1, function_owner: gurine_migrator, direct_table_dml: 0}
      digest_order: entry and set then revisionDigest then receiptDigest then event and response, using closed canonical JSON V1 with fixed-six decimal strings, UTC microseconds, explicit null and stored entryDigest; revision preimage excludes receiptDigest; counted tuples are [slotOrdinal, slotId, decisionId, decisionReceiptDigest, actorId].
      lifecycle_hold: {operations: [createActionProposal, updateActionDraft, previewActionDraft, submitActionForReview, claimActionReview, submitActionDecision], database: {sqlstate: '55000', message: FUNDING_DISCLOSURE_AUTHORITY_UNAVAILABLE, writes: 0}, external: {code: INTERNAL_ERROR, http_status: 500}, release: only after full authority and tests are implemented}
global_invariants:
- Registry key equals operation_id and both authority sets are exact set-equal.
- One operation has one effect_owner and one atomic_transition_group; workers execute durable work but never rematerialize the owned effect.
- Each command uses the explicit idempotency profile selected below. Only `decideJourneyHandoff` uses a separately committed fresh-assertion attempt before its business transaction; no other command inherits that split or its stable seven-field hash implicitly.
- Every SELECT_FOR_UPDATE follows the listed total order; rows outside bracketed cardinality are typed errors.
- No network I/O occurs in a database transaction; possible external acceptance is reconciled, never blindly retried or cancelled as fact.
- Error sets are exact aliases of the canonical resource/error contract.
- createPrivacyRequest alone uses the closed secret-bearing-command-receipt-v2 exception; no other command may omit its raw response body from durable idempotency storage or reconstruct a secret on replay.
shared_contracts:
  external-command-idempotency-v1:
    scope: the exact operation-specific deployment, operation and authenticated actor/session binding declared by each command
    key: SHA256(UTF8(Idempotency-Key))
    request_hash: the exact canonical request hash declared by the command
    claim_and_lock: resolve one claim or finalized replay before owned mutable-state validation in the command's declared lock order
    exact_replay: return the original safe response tuple and write zero second owned-effect, business-audit, outbox or receipt row
    changed_replay: a changed request hash under the same bound key is IDEMPOTENCY_CONFLICT with zero owned-effect writes
    response_finalization: status, media type, safe header bytes, exact body bytes, resource identity and receipt digest commit atomically with the owned effect, except the exact singleton secret-bearing-command-receipt-v2 profile whose canonical secretless template and digests commit atomically and whose raw token is deterministically reconstructed by the service
    fresh_assertion_inference: forbidden; this common contract alone never creates a separately committed authorization-attempt transaction or changes the operation's request-hash projection
    derived_session_exact_replay: same operation, BFF issuer, session token hash, idempotency key hash and request digest returns stored HTTP status, safe headers and exact response bytes even after one-shot consumption or profile rotation
    derived_session_changed_replay: same replay identity with changed digest returns IDEMPOTENCY_CONFLICT; different token, issuer or key cannot read another stored response
  fresh-assertion-stable-business-idempotency-v1:
    operations: [decideJourneyHandoff]
    business_hash_profile: journey-handoff-business-v1
    authorization_attempt_contract: separately-committed-before-business
    attempt_writes: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED]
    duplicate_errors: [ACTOR_ASSERTION_REPLAYED, SERVICE_ASSERTION_REPLAYED]
    fixed_scope: JOURNEY_HANDOFF_DECISION
    fixed_operation_id: decideJourneyHandoff
    bff_issuer: MUST_BE_NULL
    session_token_hash: MUST_BE_NULL
    transaction_a_proof: {relations: [ops.assertion_replay_guard, ops.audit_events], columns: [attempt_transaction_xid8, attempt_transaction_xid8], predicate: both MVCC-visible immutable rows have equal non-null xid8 and that xid8 differs from Transaction-B pg_current_xact_id(), producer: each controlled INSERT binds the stored xid8 to its server-side pg_current_xact_id(), legacy: NULL is never proof}
    transaction_b_claim_proof: {relation: ops.idempotency_keys, column: claim_transaction_xid8, new_claim_predicate: BOUND_V1 and claim_transaction_xid8=pg_current_xact_id(), apply_finalize_predicate: equality with the same top-level xid even inside SAVEPOINT or nested SAVEPOINT, final_replay: historical claim does not require current-xid equality}
    forbidden_transaction_proofs: [tuple xmin, row xmin, caller-supplied xid, legacy xid backfill, hard pg_xact_status=committed]
    pg_xact_status_diagnostic: committed is corroborating only; NULL is permitted after status-history truncation; in-progress or aborted is an integrity fault
    exact_replay: after a different fresh assertion attempt, prepare returns FINAL_REPLAY and the caller returns stored response bytes before encryption or mutable/domain lookup with zero second protected business row
    changed_replay: only a changed included seven-field business value conflicts; transport request, fresh JTI, token encoding and randomized ciphertext never define business identity
    profile_set_equality: this profile has the exact singleton operation set [decideJourneyHandoff], is referenced by that operation exactly once, and prefix/fallback/implicit membership is forbidden
  external-command-audit-v1:
    rows: exactly-one business-success audit on each new successful command and zero second business-success audit on exact replay; a separately committed assertion-attempt audit exists only when the selected operation profile explicitly requires it
    relation: ops.audit_events
    classification: INTERNAL_RESTRICTED
    redaction: no secret, token, endpoint, message bytes, raw proof, identity proof or provider identifier
  external-command-receipt-v1:
    rows: exactly-one closed receipt stored before commit; zero new on replay
    storage: ops.idempotency_keys.response_body plus aggregate-specific immutable receipt/digest columns; the exact singleton createPrivacyRequest imports secret-bearing-command-receipt-v2 instead of storing its raw secret-bearing body
    digest: SHA256(GURINE_CANONICAL_JSON_V1(the exact stored closed response body))
    replay_bytes: status, content type, safe headers and body are returned exactly as stored; replay never toggles or injects a body field
    idempotencyReplay_field: forbidden in the canonical response body because changing false to true would violate byte-identical replay; the current resource schema must remove it or freeze it as a non-semantic constant false until removal
  control-owner-managed-single-procedure-v1:
    operations: [classifyEntityPersonhood, attestEntityMaterialUseClosure, attestOrganizationOfficialChannel, revokeOrganizationOfficialChannel, createPrivacyCorrectionPlan, transitionRetentionRequest]
    pre_database:
      - Validate the closed public request schema and reject every owner-only field.
      - Verify the request-bound actor assertion, required capability and STEP_UP claims; persisted session, role, assertion-replay and step-up rows are reauthorized by the database owner.
    transaction_order:
      - Begin one SERIALIZABLE Control transaction.
      - Claim or refresh ops.idempotency_keys, then lock the same live row FOR UPDATE and return only an exact validated finalized replay.
      - Skip the generic canonical_guard path; these owners validate and mutate their exact aggregate graph themselves.
      - Derive the semantic idempotency request digest and reconstruct _actorAssertionRequestSha256 from signed actor-assertion claims, then build the exact closed owner payload and scalar arguments.
      - Invoke exactly one declared SECURITY DEFINER owner routine in the same transaction.
      - Parse the exact owner result and replace the prepared aggregate identity/version only from that result.
      - Skip generic audit and in-process/outbox generation because the database owner already appended the declared audit and outbox rows.
      - Project the final closed response and update the still-locked ops.idempotency_keys row with exact status, response and resource identity.
      - Commit, then return the response; no network I/O or second domain emission occurs before or after commit.
    digest_separation: _actorAssertionRequestSha256 must exact-match ops.assertion_replay_guard.request_digest for the consumed JTI; the semantic idempotency request digest is a different server-derived value and cannot substitute for the signed wire-request digest
    replay: a finalized exact digest returns stored response bytes after owner-replay validation and commits without invoking the owner; changed or incomplete replay is IDEMPOTENCY_CONFLICT with zero owner/audit/outbox writes
    owner_result: null, partial, additional-field, cross-aggregate, wrong-version, wrong-digest or malformed owner output is a persistence failure and the whole transaction rolls back
  secret-bearing-command-receipt-v2:
    operations: [createPrivacyRequest]
    base_contract: external-command-receipt-v1 except raw response_body storage and direct stored-body replay
    token_derivation: BASE64URL_NO_PAD(HMAC_SHA256(server privacy-receipt key, UTF8("privacy-receipt-v2\\0" || operationId || "\\0" || lowercase idempotencyKeyHash || "\\0" || lowercase requestHash)))
    fixed_operation_id: createPrivacyRequest
    durable_storage: token HMAC/digest plus the canonical secretless PrivacyRequestReceiptV1 response template, safe status/media/header bytes, resource identity and template/receipt digest only; receiptToken bytes are forbidden
    new_success: the service derives receiptToken after the owner transaction returns the secretless template and emits the complete PrivacyRequestReceiptV1 exactly once
    exact_replay: before mutable/domain lookup the service verifies the same finalized operation/idempotencyKeyHash/requestHash tuple, re-derives the identical receiptToken and inserts it into the stored secretless template with deterministic serialization so status, headers and body bytes are byte-identical to first success
    changed_replay: same operation and idempotencyKeyHash with changed requestHash is IDEMPOTENCY_CONFLICT and never derives or discloses a token
    secrecy: plaintext receiptToken is never persisted, logged, formatted with Debug, traced, measured, audited, emitted to outbox/events/errors or included in a digest preimage other than its declared verifier HMAC
    set_equality: the operation set is exactly [createPrivacyRequest]; prefix, fallback and implicit membership are forbidden
  privacy_request_receipt_access_policy:
    schema_version: privacy-request-receipt-access-policy-v1
    payload_schema: specs/product/addendum-resource-error-contracts.yaml#schemas.PrivacyRequestAccessPolicyV1
    additional_properties: false
    physical_binding_status: FINAL
    physical_binding:
      relation: ops.privacy_request_access_policies_v1
      primary_key: [policy_id, revision]
      receipt_binding_key: [policy_id, revision, policy_digest, binding_digest]
      version_column: revision
      lifecycle_state_column: state
      approved_state: APPROVED
      policy_version_column: policy_version
      policy_digest_column: policy_digest
      binding_digest_column: binding_digest
      authority_column: authority
      test_only_authority: TEST_ONLY
      effective_at_column: effective_at
      review_expires_at_column: review_expires_at
      selector: ops.current_privacy_request_access_policy_v1(timestamptz)
      production_preflight: ops.preflight_privacy_request_access_policy_v1(timestamptz)
    physical_authority: one immutable versioned policy row selected by the PostgreSQL owner through the exact 0038 relation and composite receipt-binding key
    exact_payload_keys: [tokenTtlSeconds, readOnlySessionTtlSeconds, cookieProfileId, cookieName, cookiePath, allowedOperations]
    payload_contract: {tokenTtlSeconds: 'int64[1..max]', readOnlySessionTtlSeconds: 'int64[1..max]', cookieProfileId: 'const<privacy_request_receipt>', cookieName: 'const<gurine_privacy_request_receipt_session>', cookiePath: 'const</privacy>', allowedOperations: 'unique-array<const<getPrivacyRequest>>[1..1]'}
    selection: exactly one current, approved, effective and unexpired row before any command write
    versioning: no seed, implicit default or fallback exists; a later independently approved immutable version may change TTL values without changing earlier token/session receipts
    binding: token and session issuance receipts bind the selected policy identity, version and digest plus the exact values used
    separation: independent from PRIVACY_RESPONSE_CALENDAR; statutory response deadlines, business calendars, extension limits and refusal-notice deadlines can never supply these TTLs
    unavailable: zero, duplicate, expired or unapproved rows map only to request-id-only DEPENDENCY_UNAVAILABLE 503 and zero writes; CAPABILITY_UNCONFIGURED, INTERNAL_ERROR detail, row count and policy identity are forbidden from the public problem
    production_seed: FORBIDDEN
    test_values: FIXTURE_ONLY
    operations: [createPrivacyRequest, exchangePrivacyRequestReceiptToken]
    set_equality: the importing operation set is exactly [createPrivacyRequest, exchangePrivacyRequestReceiptToken]
  all-or-nothing-v1: inside the selected profile's business transaction every error rolls back its claim, domain mutation, command audit, outbox, receipt and response finalization together; only fresh-assertion-stable-business-idempotency-v1 has an earlier committed replay-guard and authorization-attempt audit, which is not rolled back with business work; response is returned only from the exact stored tuple
external_commands:
  createActionProposal:
    operation_id: createActionProposal
    api: control-api
    method: POST
    path: /v1/internal/action-proposals
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.createActionProposal
    atomic_transition_group: gurine.command.createActionProposal.v1
    state_disposition: action_proposal.NONE->DRAFT
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: READ_COMMITTED
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'VALIDATE typed-origin-and-target-repositories [exactly-one-per-reference] :: immutable identity/version/digest exists and actor scope
        is current'
      - 'INSERT ops.action_proposals [exactly-one] :: immutable origin, target, owner and compensation link'
      - 'INSERT ops.action_proposal_versions [exactly-one] :: encrypted ActionPayloadV1 and DRAFT version 1'
      - 'UPDATE ops.action_proposals [exactly-one] :: set deferred current-version and receipt pointers'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.proposal_created.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.proposal_created.v1
      cardinality:
        action.proposal_created.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionProposalReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - ACTION_KIND_MISMATCH
      - TARGET_NOT_FOUND
      - CAPABILITY_DENIED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  updateActionDraft:
    operation_id: updateActionDraft
    api: control-api
    method: PATCH
    path: /v1/internal/action-proposals/{proposalId}/draft
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.updateActionDraft
    atomic_transition_group: gurine.command.updateActionDraft.v1
    state_disposition: action_proposal.DRAFT->SUPERSEDED plus new DRAFT version
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: SERIALIZABLE
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: id=:proposalId and current_version=:expectedVersion'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: current DRAFT and content_digest=:expectedContentDigest'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: old DRAFT->SUPERSEDED and state_version+1'
      - 'INSERT ops.action_proposal_versions [exactly-one] :: encrypted replacement DRAFT at version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: current_version+1 and aggregate_version+1'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
      audit: exactly-one new success; zero replay
      outbox:
        action.proposal_updated.v1: exactly-one
      receipt: exactly-one new success; zero replay
    audit_contract: external-command-audit-v1
    outbox:
      events:
      - action.proposal_updated.v1
      cardinality:
        action.proposal_updated.v1: exactly-one
      payload_source: specs/product/addendum-event-contracts.yaml
    receipt:
      schema: ActionProposalReceiptV1
      contract: external-command-receipt-v1
    errors:
      exact_codes:
      - INVALID_PARAMETER
      - ACTION_PROPOSAL_STALE
      - ACTION_DIGEST_MISMATCH
      - ACTION_DECISION_CLOSED
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
      rollback_contract: all-or-nothing-v1
  previewActionDraft:
    operation_id: previewActionDraft
    api: control-api
    method: POST
    path: /v1/internal/action-proposals/{proposalId}:preview
    operation_kind: COMMAND
    authorization:
      capability: actions.propose
      authorization: null
      assurance: ACTIVE_SESSION
      reauthorized_in_transaction: true
    effect_owner: control-api.previewActionDraft
    atomic_transition_group: gurine.command.previewActionDraft.v1
    state_disposition: NON_STATE_MUTATION preview fact append on DRAFT
    idempotency_contract: external-command-idempotency-v1
    transaction:
      isolation: READ_COMMITTED
      lock_order:
      - ops.idempotency_keys(scope,key_hash)
      - ops.action_proposals(id)
      - ops.action_proposal_versions(proposal_id,version)
      statements:
      - 'INSERT_OR_READ ops.idempotency_keys [exactly-one-logical-result] :: claim or exact stored replay'
      - 'SELECT_FOR_UPDATE ops.action_proposals [exactly-one] :: exact proposal/current version'
      - 'SELECT_FOR_UPDATE ops.action_proposal_versions [exactly-one] :: DRAFT, exact content digest, preview_id is null'
      - 'EVALUATE policy-rights-consent-conflict-activation-budget-render [exactly-one-result] :: closed common ApprovalBindingV1 and rendered-byte
        digest'
      - 'UPDATE ops.action_proposal_versions [exactly-one] :: append encrypted preview/binding once; state remains DRAFT; state_version+1'
      - 'UPDATE ops.action_proposals [exactly-one] :: aggregate_version+1 and receipt pointers'
      - 'INSERT ops.audit_events [exactly-one] :: successful command audit'
      - 'INSERT ops.outbox [exactly-declared-event-cardinality] :: closed event payload after final aggregate version'
      - 'UPDATE ops.idempotency_keys [exactly-one] :: store closed response before commit'
      network_io: FORBIDDEN_UNTIL_COMMIT
    cardinality:
      statements: each statement bracket is normative
