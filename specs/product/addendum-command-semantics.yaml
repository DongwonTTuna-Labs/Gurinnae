      - 'FINALIZE ops.finalize_journey_handoff_decision_response_v1 [exactly-one] :: before relation access enforce fixed scope JOURNEY_HANDOFF_DECISION, operation decideJourneyHandoff, null BFF/session binding, canonical JOURNEY_HANDOFF resource, status 200, JourneyHandoffDecisionReceiptV1 and application/json; pre-read and lock the exact prepared NEW tuple with claim_transaction_xid8=pg_current_xact_id(), verify the receipt/audit/outbox graph, construct the internal generic composite, call owner-finalize exactly once, never call replay-owner, and directly read back and compare the complete persisted response tuple and exact safe bytes before commit'
