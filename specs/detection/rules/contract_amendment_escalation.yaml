schema_version: 1
specification_version: 13.0.0
status: FINAL
rule_id: CONTRACT_AMENDMENT_ESCALATION
name: 변경계약 증가
version: 1.0.0
required:
- contract.id
- contract.original_amount
- contract.final_amount
- contract.amendment_count
- contract.scope_change_explained
thresholds:
  final_to_original_ratio_gte: '1.5000'
  minimum_amendments: 2
  minimum_original_amount: 10000000
formula: final_amount / original_amount >= threshold and amendment_count >= minimum
blockers:
- REQUIRED_FIELD_MISSING
- ORIGINAL_AMOUNT_ZERO
- AMENDMENT_HISTORY_INCOMPLETE
metamorphic:
- amendment order irrelevant
- explained scope suppresses
- currency mismatch blocks
output:
  outcomes:
  - SIGNAL
  - NO_SIGNAL
  - BLOCKED
  ratio_precision: 4
  money_unit: KRW integer
  publication_claim_allowed: false
implementation: crates/detection/src/rules/contract_amendment_escalation.rs
reference_evaluator: specs/detection/reference_evaluator.py
