schema_version: 1
specification_version: 13.0.0
status: FINAL
rule_id: LOW_BID_COMPETITION
name: 낮은 경쟁
version: 1.0.0
required:
- procurement.id
- procurement.method
- procurement.valid_bidder_count
- procurement.estimated_amount
- procurement.emergency
thresholds:
  valid_bidder_count_lte: 1
  minimum_estimated_amount: 50000000
formula: competitive procurement with <=1 valid bidder and amount >= threshold, unless emergency
blockers:
- REQUIRED_FIELD_MISSING
- METHOD_UNKNOWN
- BIDDER_COUNT_UNKNOWN
metamorphic:
- bidder order irrelevant
- noncompetitive method does not signal
- emergency suppresses
output:
  outcomes:
  - SIGNAL
  - NO_SIGNAL
  - BLOCKED
  ratio_precision: 4
  money_unit: KRW integer
  publication_claim_allowed: false
implementation: crates/detection/src/rules/low_bid_competition.rs
reference_evaluator: specs/detection/reference_evaluator.py
