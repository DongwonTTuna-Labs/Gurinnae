schema_version: 1
specification_version: 13.0.0
status: FINAL
rule_id: RESTRICTIVE_SPECIFICATION
name: 제한적 규격
version: 1.0.0
required:
- specification.id
- specification.brand_mentions
- specification.model_mentions
- specification.equivalent_allowed
- specification.valid_bidder_count
- specification.justification_present
thresholds:
  minimum_brand_or_model_mentions: 1
  valid_bidder_count_lte: 1
formula: brand/model-specific requirement + no equivalent + <=1 valid bidder + no documented justification
blockers:
- REQUIRED_FIELD_MISSING
- SPECIFICATION_TEXT_UNAVAILABLE
- BIDDER_COUNT_UNKNOWN
metamorphic:
- text order irrelevant
- equivalent allowed suppresses
- documented justification suppresses
output:
  outcomes:
  - SIGNAL
  - NO_SIGNAL
  - BLOCKED
  ratio_precision: 4
  money_unit: KRW integer
  publication_claim_allowed: false
implementation: crates/detection/src/rules/restrictive_specification.rs
reference_evaluator: specs/detection/reference_evaluator.py
