  relation_count_rule: only CREATE TABLE statements count; ALTER, routine, trigger, ACL, and registry statements add zero
    relkind-r relations
authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0039 remain byte-preserved; all physical changes are forward-only in
    0040
  transaction_rule: one outer BEGIN is the first pglast statement and terminal COMMIT is the last statement
  seed_rule: no operating retention policy, identity proof, verified endpoint, correction target, legal hold, or privacy object
    is seeded
  legacy_rule: pre-0040 correction and subscription rows remain STAGED_LEGACY; no historical snapshot is invented
  q1_governance_rule: both entity governance commands require users.manage, STEP_UP, and request-bound human authority; classification
    independence is human-versus-automation with no second per-command maker-reviewer, while closure actor_id must differ from
    the exact referenced personhood-classification receipt actor_id
  q3_verified_endpoint_rule: existing key-ring, HMAC/replay, delivery-receipt, and scoped-session primitives are reusable,
    but no canonical verifier producer is connected; VERIFIED_ENDPOINT remains zero-write fail-closed
  q4_correction_rule: RESPONSE /partyName is the sole executable field cell because its current-value digest is derived from the
    exact ACCESS receipt chain and its fenced workflow owner completes through immutable plan, approval and completion bindings;
    every other object/path pair is rejected before writes
  q5_hold_rule: CORRECTION and SUBSCRIPTION use immutable snapshot tuples; COMMUNICATION_ENDPOINT uses the existing (id,version,endpoint_digest);
    AUDIT_SUBJECT_RECORD is loudly unsupported; privacy-request coverage is evaluated only from a complete materialized OBJECT_SET
    inventory and otherwise fails closed
  release_rule: release reuses immutable placement/anchor and existing coverage ownership without invented mutable-head currentness
  fail_closed_rule: missing, staged-legacy, stale, partial, unsupported, or digest-mismatched authority produces no protected
    transition
