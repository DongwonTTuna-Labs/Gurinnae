known_fail_closed_boundaries:
  staged_legacy_snapshots: rows without an immutable tuple cannot be selected as CORRECTION or SUBSCRIPTION hold targets
  privacy_correction_effect: every target except exact RESPONSE /partyName returns typed 422 with zero writes; the supported
    cell mutates only through the fenced completion owner and immutable receipt/audit/event transaction
  verified_endpoint_identity_proof: reusable primitives alone do not authorize a VERIFIED_ENDPOINT receipt
  audit_subject_hold: AUDIT_SUBJECT_RECORD returns typed 422 and SQLSTATE 0A000; no UUID/digest is synthesized
  privacy_scope_inventory: a missing inventory, non-OBJECT_SET selector, zero or noncontiguous items, count mismatch, unsupported
    object kind, or derivative/backup scope without materialized location authority raises SQLSTATE 55000 instead of returning
    false coverage
  d1_independent_reviewer: classification excludes automation without a second human reviewer; closure exact-compares its actor
    against the referenced classification receipt actor and rejects equality as typed PRECONDITION_FAILED with zero writes
verification_obligations:
- pglast parses exactly 159 statements with one BEGIN and one terminal COMMIT
- exactly five CREATE TABLE relations match scope.exact_relations and no view changes relkind-r count
- all 27 routines, 12 triggers, 0 indexes, 8 altered relations, and two event upserts reproduce the pglast inventory
- 0040 embedded legal_hold.placed.v2 and privacy.response_party_name_corrected.v1 equal their named schemas; 0040 is the latest
  registry owner for both
- migration_sha256, all canonical statement hashes, and object_inventory_sha256 reproduce from current SQL
- the three new hold branches use exact anchors and AUDIT_SUBJECT_RECORD rejects before persistence
- Q4 exposes only RESPONSE /partyName, derives the current digest from the exact ACCESS authority chain, creates one job on
  APPROVE, and applies one versioned response mutation plus immutable completion receipt, redacted audit and event on COMPLETE
- both entity governance commands accept only users.manage under STEP_UP request-bound human authority; classification proves
  human-versus-automation independence without a per-command maker-reviewer, and closure rejects the referenced classifier actor
  with exact SQLSTATE/message, typed PRECONDITION_FAILED, and zero writes before accepting a distinct human actor
