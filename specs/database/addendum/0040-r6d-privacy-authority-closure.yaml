  append_rule: BEFORE materializer selects the tuple and defers its named reciprocal FK; AFTER materializer appends one exact
    immutable row under a transaction-local owner GUC
privacy_correction_authority:
  supported_targets:
  - target_object_type: RESPONSE
    field_path: /partyName
    access_projection: ops.read_privacy_response_party_name_access_v1
    access_projection_keys: 17
    plan_binding: ops.privacy_response_party_name_correction_plan_bindings_v1
    approval_binding: ops.privacy_response_party_name_correction_approval_bindings_v1
    job_type: PRIVACY_RESPONSE_PARTY_NAME_CORRECTION
    complete_owner: ops.execute_privacy_response_party_name_correction_job_v1
    completion_receipt: ops.privacy_response_party_name_correction_completion_receipts_v1
    completion_event: privacy.response_party_name_corrected.v1
  unsupported_targets:
    error: PRIVACY_CORRECTION_TARGET_UNSUPPORTED
    sqlstate: 0A000
    zero_write: true
    scope: every object/path pair except exact RESPONSE /partyName
  forbidden_categories:
  - procurement facts
  - detection results
  - publication decisions
  - audit records
  - organization or supplier identity
  authority_rule: the plan locks the same receipt-to-submission-to-origin-receipt-to-editorial-response chain and digest used
    by ACCESS; APPROVE creates only its immutable binding, the existing decision event and one dedicated job; only the fenced
    worker COMPLETE may change party_name and append the redacted completion receipt, audit and event
  secret_rule: partyName, priorPartyName, requestedValue, ciphertext, encryption key, lease token and job payload are forbidden
    from public status, event, audit, log, trace, metric and error surfaces
legal_hold_target_authority:
  supported_target_kinds:
  - CASE
  - PUBLICATION
  - EVIDENCE
  - RESPONSE
  - SOURCE_ASSET
  - RESEARCH_ARTIFACT
  - PRIVACY_REQUEST
  - COMMUNICATION_SUBJECT
  - SUPPLIER_RETENTION_SNAPSHOT
  - AGENCY_RETENTION_SNAPSHOT
  - CORRECTION
  - SUBSCRIPTION
  - COMMUNICATION_ENDPOINT
  new_concrete_branches:
    CORRECTION: immutable (snapshot_id,correction_id,snapshot_version,snapshot_digest)
    SUBSCRIPTION: immutable (snapshot_id,subscription_id,snapshot_version,snapshot_digest)
    COMMUNICATION_ENDPOINT: existing intake.communication_endpoints(id,version,endpoint_digest)
  unsupported_target:
    target_kind: AUDIT_SUBJECT_RECORD
    error: LEGAL_HOLD_TARGET_UNSUPPORTED
    sqlstate: 0A000
    zero_write: true
    reason: no authoritative versioned immutable source relation
    unlock_condition: authorize a versioned immutable source relation, digest preimage, placement/release anchor, and lifecycle
      owner
  event_branch_count: 13
governance_authority:
  operations:
  - classifyEntityPersonhood
  - attestEntityMaterialUseClosure
  capability: users.manage
  assurance_level: STEP_UP
  independence_required: true
  per_command_maker_reviewer_required: false
  classification_independence:
    comparator: HUMAN_VERSUS_AUTOMATION
    enforcement: active human user, request-bound assertion, users.manage capability, and exact STEP_UP authorization
    per_command_maker_reviewer: false
  closure_independence:
    comparator: closure p_actor_id differs from referenced personhood classification receipt actor_id
    database_owner: ops.attest_r6d_entity_material_use_closure_v1
    error: PRECONDITION_FAILED
    sqlstate: '55000'
    database_message: r6d_entity_closure_actor_not_independent
    zero_write: true
  excluded_comparators: [entity source producer, represented entity subject, inferred maker-reviewer actor]
  migration_effect: 0040 replaces the 0039 owners forward-only; sources.operate is not accepted
