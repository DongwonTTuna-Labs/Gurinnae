altered_base_relations:
  ops.source_incidents_to_ops.incidents:
    additive_table_delta: 0
    steps:
      - ACCESS EXCLUSIVE lock ops.source_incidents; revoke/deny every writer; assert the exact migration-0015 columns, ops.incident_severity enum labels, status CHECK definition, source_incidents_updated_at trigger, row count, and per-column null counts
      - add legacy_status text and legacy_severity text; populate both from status::text and severity::text and assert neither is null before any type or value conversion
      - drop the base status CHECK before introducing any DETECTED/TRIAGED/CONTAINED value; keeping it through the conversion would reject the migration
      - drop source_incidents_updated_at before the set-based conversion so the migration does not manufacture updated_at changes
      - ALTER severity TYPE text USING CASE severity::text WHEN 'CRITICAL' THEN 'SEV0' WHEN 'MAJOR' THEN 'SEV1' WHEN 'MINOR' THEN 'SEV2' WHEN 'INFO' THEN 'SEV3' ELSE NULL END; fail if any result is null
      - ALTER status TYPE text USING CASE status WHEN 'OPEN' THEN 'DETECTED' WHEN 'ACKNOWLEDGED' THEN 'TRIAGED' WHEN 'MITIGATED' THEN 'CONTAINED' WHEN 'RESOLVED' THEN 'RESOLVED' ELSE NULL END; fail if any result is null
      - drop source_id NOT NULL so non-source operational incidents are representable; preserve source_id/source_run_id for source incidents
      - add affected_capabilities text[] with canonical unique order, owner_user_id uuid, commander_user_id uuid, next_update_at timestamptz, linked_incident_id uuid, migration_provenance_digest char(64), while preserving source_id and source_run_id
      - add named NOT VALID status/severity/shape/digest CHECKs over converted values, validate them, then set every required new column NOT NULL only after evidence-backed backfill
      - rename ops.source_incidents to ops.incidents only after all old-name constraints and triggers have been removed or renamed and every converted row passes the new checks; rename its primary key and indexes deterministically
      - create ops.incident_transition_detail_is_valid with the closed MIGRATION_BASELINE variant, then create ops.incident_events and all named CHECKs including edge/version/migration-shape/detail validation; query pg_constraint and execute a rolled-back MIGRATION_BASELINE canary before migrating any row
      - only after the table, discriminator value, validator function, and every CHECK exist and admit the canary, create exactly one immutable MIGRATION_BASELINE ops.incident_events row per legacy incident; it reports provenance and does not invent RECOVERING or POSTMORTEM_CLOSED
      - assert count(*) FILTER (WHERE transition_kind='MIGRATION_BASELINE') equals the locked legacy incident count and every legacy incident has exactly one event_sequence=1 baseline before installing runtime incident guards
      - create ops.source_incidents as SELECT of the v13 columns from ops.incidents WHERE source_id IS NOT NULL WITH LOCAL CHECK OPTION
      - preserve former relation-specific readers; all new writes use the typed ops.incidents command path and there is no dual write
      - install a root lifecycle trigger that rejects any INSERT/UPDATE not accompanied by the exact transaction-local incident-event function context; compatibility-view write privileges cannot bypass event/version/audit/outbox/receipt atomicity
    root_concurrency: ops.incidents.version is expected-version guarded and increments exactly one with each appended incident event
    compatibility_order: [created_at DESC, id DESC]
  ops.retention_requests:
