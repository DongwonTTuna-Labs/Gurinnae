    additions:
      - {name: retraction_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: target_publication_revision_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.publication_revisions(id) ON DELETE RESTRICT}
