journey_compound_transition_contracts:
  shared_step_one:
    parent_state: ACTIVE
    active_handoff: {id: null, generation: null, state: null}
    next_owner: {kind: null, function: null, ref_hmac: null}
    current_owner: unchanged
    escalation_state: RESOLVED
    version_delta: 1
    receipt_sequence_delta: 1
    parent_head: exact old terminal handoff receipt
    receipt_due_continuity: prior_due_at equals the locked old parent due_at and resulting_due_at equals the persisted step-one parent due_at
    rationale: WAITING_ACK would violate the exact active-PENDING_ACK tuple check, BLOCKED would contradict an immediate compiled replacement, and a terminal intermediate would forbid the second parent update
  decline_with_replacement:
    first_receipt: HANDOFF_DECLINED
    first_parent_due_at: exact replacement-origin node SLA checkpoint from the compiled decline policy
    second_receipt: HANDOFF_REQUESTED
    final_parent: WAITING_ACK with generation+1 active PENDING_ACK, nonnull next owner and NOT_DUE escalation
  expiry_with_replacement:
    first_receipt: HANDOFF_EXPIRED
    first_parent_due_at: exact replacement-origin node SLA checkpoint from the compiled expiry policy
    second_receipt: HANDOFF_REQUESTED
    final_parent: WAITING_ACK with generation+1 active PENDING_ACK, nonnull next owner and NOT_DUE escalation
  supersession_with_replacement:
    first_receipt: HANDOFF_SUPERSEDED
    first_parent_due_at: exact replacement-origin node SLA checkpoint from the compiled supersession policy
    second_receipt: HANDOFF_REQUESTED
    final_parent: WAITING_ACK with generation+1 active PENDING_ACK, nonnull next owner and NOT_DUE escalation
  terminal_outcome_with_cancellation:
    first_receipt: HANDOFF_CANCELLED
    first_parent_due_at: exact destination-node or terminal-policy SLA of the compiled outcome
    second_receipt: OUTCOME_RECORDED
    second_parent_due_at: exactly the first step resulting_due_at for receipt continuity
    final_parent_state: exact compiled outcome state with no active handoff and no next owner
  replacement_step_two_due_rule: new handoff due_at is its immutable hard acknowledgement expiry; parent and request receipt resulting_due_at are the first escalation threshold or hard expiry when no threshold exists; request receipt prior_due_at equals step-one resulting_due_at
  atomicity: both ordered parent UPDATE statements and both immutable receipts occur in one SERIALIZABLE transaction and one atomic transition group; each intermediate tuple independently satisfies all immediate and deferred contracts

journey_result_types:
  ops.journey_replacement_result_v1:
    fields:
      - {name: handoff_id, type: uuid, nullable: false}
      - {name: handoff_version, type: bigint, nullable: false, invariant: exactly 1}
      - {name: generation, type: bigint, nullable: false}
      - {name: binding_digest, type: char(64), nullable: false}
      - {name: request_receipt_id, type: uuid, nullable: false}
      - {name: request_receipt_digest, type: char(64), nullable: false}
      - {name: request_journey_instance_version, type: bigint, nullable: false}
      - {name: audit_event_id, type: uuid, nullable: false}
      - {name: outbox_event_id, type: uuid, nullable: false}
      - {name: receiver_function, type: text, nullable: false}
      - {name: hard_expiry_at, type: timestamptz, nullable: false}
      - {name: resulting_due_at, type: timestamptz, nullable: false}
    invariants:
      - request receipt is HANDOFF_REQUESTED and binds this exact handoff at version one
      - request_journey_instance_version equals the terminal old receipt instance version plus one
      - final parent head ID and digest equal this request receipt ID and digest
      - receiver_function is the safe organizational function label from the immutable handoff binding, never receiver identity bytes; hard_expiry_at equals immutable handoff.due_at and resulting_due_at equals the parent scheduler checkpoint
    usage_acl:
      gurine_control_api: [USAGE]
      gurine_workflow_worker: [USAGE]
      gurine_scheduler: [USAGE]
      PUBLIC: []
  ops.journey_handoff_terminal_result_v1:
    fields:
      - {name: receipt_id, type: uuid, nullable: false}
      - {name: receipt_digest, type: char(64), nullable: false}
      - {name: journey_instance_id, type: uuid, nullable: false}
      - {name: journey_instance_version, type: bigint, nullable: false}
      - {name: handoff_id, type: uuid, nullable: false}
      - {name: handoff_version, type: bigint, nullable: false}
      - {name: handoff_kind, type: text, nullable: false}
      - {name: generation, type: bigint, nullable: false}
      - {name: decision, type: text, nullable: false, closed_values: [ACKNOWLEDGE, DECLINE]}
      - {name: resulting_handoff_state, type: text, nullable: false, closed_values: [ACKNOWLEDGED, DECLINED]}
      - {name: resulting_journey_state, type: text, nullable: false, closed_values: [ACTIVE, BLOCKED]}
      - {name: current_owner_binding_digest, type: char(64), nullable: false}
      - {name: next_owner_binding_digest, type: char(64), nullable: true}
      - {name: audit_event_id, type: uuid, nullable: false}
      - {name: outbox_event_id, type: uuid, nullable: false}
    invariants:
      - all fields are copied from the immutable old terminal receipt plus its immutable handoff binding and never from mutable final parent state
      - ACKNOWLEDGE transfers current owner and has null next owner; DECLINE preserves current owner and also has null next owner at the terminal step, even when final_parent later carries a replacement next owner
    usage_acl:
      gurine_control_api: [USAGE]
      gurine_workflow_worker: [USAGE]
      PUBLIC: []
  ops.journey_instance_head_result_v1:
    fields:
      - {name: journey_instance_id, type: uuid, nullable: false}
      - {name: version, type: bigint, nullable: false}
      - {name: state, type: text, nullable: false}
      - {name: current_owner_binding_digest, type: char(64), nullable: false}
      - {name: next_owner_binding_digest, type: char(64), nullable: true}
      - {name: active_handoff_id, type: uuid, nullable: true}
      - {name: active_handoff_generation, type: bigint, nullable: true}
      - {name: active_handoff_state, type: text, nullable: true, closed_nonnull_values: [PENDING_ACK]}
      - {name: escalation_state, type: text, nullable: false, closed_values: [NOT_DUE, DUE, ESCALATED, RESOLVED]}
      - {name: due_at, type: timestamptz, nullable: false}
      - {name: head_receipt_id, type: uuid, nullable: false}
      - {name: head_receipt_digest, type: char(64), nullable: false}
    invariants:
      - WAITING_ACK if and only if active handoff tuple and next owner are all nonnull and active_handoff_state is PENDING_ACK
      - every other state has the active handoff tuple and next owner all null
      - version and head identity equal the persisted parent after every ordered step
    usage_acl:
      gurine_control_api: [USAGE]
      gurine_workflow_worker: [USAGE]
      gurine_scheduler: [USAGE]
      PUBLIC: []
  ops.journey_handoff_decision_result_v1:
    fields:
      - {name: decision_receipt, type: ops.journey_handoff_terminal_result_v1, nullable: false}
      - {name: replacement, type: ops.journey_replacement_result_v1, nullable: true}
      - {name: final_parent, type: ops.journey_instance_head_result_v1, nullable: false}
      - {name: effect_digest, type: char(64), nullable: false}
      - {name: decided_at, type: timestamptz, nullable: false}
    invariants:
      - without replacement final_parent version and head equal decision_receipt journey version, receipt ID and digest
      - with replacement final_parent.version equals decision_receipt.journey_instance_version plus one and final_parent head equals the replacement request receipt
      - final_parent.state is WAITING_ACK if and only if replacement is nonnull and final_parent.next_owner_binding_digest is nonnull
      - finalized external response digest covers the old terminal receipt, optional replacement receipt and final parent head
    usage_acl:
      gurine_control_api: [USAGE]
      gurine_workflow_worker: [USAGE]
      PUBLIC: []
  ops.journey_scheduler_result_v1:
    fields:
      - {name: disposition, type: text, nullable: false, closed_values: [APPLIED_NEW, APPLIED_REPLAY, NOT_DUE, NO_LONGER_CURRENT, VERSION_CONFLICT]}
      - {name: action, type: text, nullable: false, closed_values: [ESCALATE, EXPIRE]}
      - {name: transition_receipt_id, type: uuid, nullable: true}
      - {name: transition_receipt_digest, type: char(64), nullable: true}
      - {name: transition_journey_instance_version, type: bigint, nullable: true}
      - {name: transition_handoff_id, type: uuid, nullable: true}
      - {name: transition_handoff_version, type: bigint, nullable: true}
      - {name: transition_audit_event_id, type: uuid, nullable: true}
      - {name: transition_outbox_event_id, type: uuid, nullable: true}
      - {name: replacement, type: ops.journey_replacement_result_v1, nullable: true}
      - {name: final_parent, type: ops.journey_instance_head_result_v1, nullable: true}
      - {name: hard_expiry_at, type: timestamptz, nullable: true}
      - {name: next_scheduler_at, type: timestamptz, nullable: true}
    invariants:
      - APPLIED_NEW and APPLIED_REPLAY require the complete transition group and nonnull final_parent
      - NOT_DUE, NO_LONGER_CURRENT and VERSION_CONFLICT have every transition, replacement and final_parent field null and write zero rows
      - APPLIED_REPLAY returns the immutable matching receipt and writes no audit, outbox, effect or receipt
      - ESCALATE never returns replacement, preserves hard_expiry_at and returns the persisted instance due time as next_scheduler_at
      - EXPIRE with replacement returns both terminal expiry and replacement request receipts and final_parent head is the replacement request receipt
    usage_acl:
      gurine_scheduler: [USAGE]
      PUBLIC: []

journey_result_type_catalog_contract:
  creation_order: [ops.journey_replacement_result_v1, ops.journey_handoff_terminal_result_v1, ops.journey_instance_head_result_v1, ops.journey_handoff_decision_result_v1, ops.journey_scheduler_result_v1]
  dependency_rule: referenced composite types are created before every dependent type and owner function; migration fails if pg_type and pg_attribute declaration order/type identity differ
  semantic_attribute_rule: PostgreSQL composite attributes cannot carry physical NOT NULL or CHECK constraints, so every nullable and closed-values declaration is enforced inside the SECURITY DEFINER producer before RETURN and rechecked by executable PostgreSQL result-shape canaries
  acl_rule: REVOKE ALL ON TYPE from PUBLIC and every runtime role before granting only each type usage_acl; no runtime role owns a type
  default_privileges: ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator REVOKE ALL ON TYPES FROM PUBLIC and every runtime role

