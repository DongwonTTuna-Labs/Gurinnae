      - {name: effect_receipt_digest, type: char(64), nullable: true, staged_legacy: true}
    change: DRAFT/REVIEW remain expected-version guarded work states, but RESOLVED/PUBLISHED can commit only through the common publication gate. The transaction locks the current source revision and correction, creates a fresh snapshot and exact-byte preview, obtains PASS, inserts revision N+1 with content_variant CORRECTION and source_effect_id/digest, sets target_revision and immutable effect receipt, advances the case/current pointer, appends audit plus correction/publication/projection/notification events, and never updates a historical publication revision or projection row.
  editorial.retraction_drafts:
