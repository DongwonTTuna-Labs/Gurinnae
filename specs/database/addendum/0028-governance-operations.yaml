        unique_by: [streamKey]
        item:
          additional_properties: false
          required: [streamKey, checkpointId, headEventId, headHash, signatureKeyId, signatureDigest, recordedAt]
          fields:
            streamKey: string[1..200]
            checkpointId: uuid
            headEventId: uuid
            headHash: sha256
            signatureKeyId: string[1..200]
            signatureDigest: sha256
            recordedAt: datetime
      selectedEventSetDigest: sha256
      members:
        type: array
        min_items: 0
        max_items: 1000000
        ordered_by: [objectKind, objectId, objectVersion, objectDigest]
        unique_by: [objectKind, objectId, objectVersion, objectDigest]
        item:
          additional_properties: false
          required: [objectKind, objectId, objectVersion, objectDigest, classification, fieldRuleSetDigest, rightsDisposition, holdDisposition, holdCoverageDigest]
          fields:
            objectKind: AUDIT_EVENT|CASE|SIGNAL|SOURCE|USER|ROLE|JOB|PROVIDER|PUBLICATION|RESPONSE|PRIVACY_REQUEST|LEGAL_HOLD|INCIDENT
            objectId: opaque-id[1..512]
            objectVersion: int64>=1
            objectDigest: sha256
            classification: PUBLIC|INTERNAL|CONFIDENTIAL|RESTRICTED_GOVERNANCE
            fieldRuleSetDigest: sha256
            rightsDisposition: ALLOW|NOT_APPLICABLE
            holdDisposition: CLEAR|WITHHELD
            holdCoverageDigest: sha256
  AuditExportFieldRuleSetV1:
    sql_type: jsonb
    rust_type: sqlx::types::Json<AuditExportFieldRuleSetV1>
    additional_properties: false
    required: [schemaVersion, policyVersion, policyDigest, rules]
    fields:
      schemaVersion: {const: audit-export-field-rule-set.v1}
      policyVersion: string[1..100]
      policyDigest: sha256
      rules:
        type: array
        min_items: 1
        max_items: 10000
        ordered_by: [objectKind, fieldPath]
        unique_by: [objectKind, fieldPath]
        item:
          additional_properties: false
          required: [objectKind, fieldPath, disposition, transform, reasonCode]
          fields:
            objectKind: AUDIT_EVENT|CASE|SIGNAL|SOURCE|USER|ROLE|JOB|PROVIDER|PUBLICATION|RESPONSE|PRIVACY_REQUEST|LEGAL_HOLD|INCIDENT
            fieldPath: json-pointer[1..1000]
            disposition: INCLUDE|REDACT|OMIT|WITHHOLD
            transform: NONE|MASK|HASH_SHA256|GENERALIZE_TIME|GENERALIZE_IDENTITY
            reasonCode: AUTHORIZED_SCOPE|DATA_MINIMIZATION|CLASSIFICATION|THIRD_PARTY_PRIVACY|LEGAL_HOLD|RIGHTS_RESTRICTION|SECRET_OR_CREDENTIAL|UNSUPPORTED_FIELD
  AuditExportObjectReceiptV1:
    sql_type: jsonb
    rust_type: sqlx::types::Json<AuditExportObjectReceiptV1>
    additional_properties: false
    required: [schemaVersion, objectKeyHmac, objectVersionId, mediaType, formatSchemaVersion, byteLength, rowCount, preWatermarkSha256, watermarkDigest, contentSha256, scopeManifestDigest, fieldRuleSetDigest, watermarkSetDigest, objectStoreHeadReceiptDigest, completedAt]
    fields:
      schemaVersion: {const: audit-export-object-receipt.v1}
      objectKeyHmac: sha256
      objectVersionId: opaque-id[1..512]
      mediaType: text/csv|application/x-ndjson
      formatSchemaVersion: audit-export-csv.v1|audit-export-jsonl.v1
      byteLength: int64>=0
      rowCount: int64>=0
