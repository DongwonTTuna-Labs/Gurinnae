      - {name: request_id, type: uuid, nullable: false, default: NONE}
      - {name: audit_event_id, type: uuid, nullable: false, default: NONE, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: decision_digest, type: char(64), nullable: false, default: NONE}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: publication_gate_decisions_pkey, columns: [id]}
    uniques:
      - {name: publication_gate_decisions_exact_uq, columns: [case_id, expected_case_version, decision_digest]}
      - {name: publication_gate_decisions_digest_uq, columns: [decision_digest]}
      - {name: publication_gate_decisions_receipt_uq, columns: [receipt_digest]}
      - {name: publication_gate_decisions_step_up_uq, columns: [step_up_authorization_id]}
      - {name: publication_gate_decisions_jti_uq, columns: [actor_assertion_jti]}
      - {name: publication_gate_decisions_pass_version_uq, columns: [case_id, expected_case_version], predicate: "outcome = 'PASS'"}
      - {name: publication_gate_decisions_pass_preview_uq, columns: [preview_id], predicate: "outcome = 'PASS'"}
    foreign_keys:
      - {name: publication_gate_decisions_snapshot_fk, columns: [review_snapshot_id, case_id, expected_case_version, snapshot_digest], references: "editorial.review_snapshots(id,case_id,case_version,snapshot_sha256)", on_delete: RESTRICT}
      - {name: publication_gate_decisions_preview_fk, columns: [preview_id, case_id, review_snapshot_id, preview_digest, preview_expires_at], references: "editorial.publication_previews(id,case_id,review_snapshot_id,preview_sha256,expires_at)", on_delete: RESTRICT}
      - {name: publication_gate_decisions_publisher_conflict_fk, columns: [publisher_conflict_snapshot_id, publisher_user_id, publisher_conflict_target_type, publisher_conflict_target_id, publisher_conflict_target_version, publisher_conflict_target_digest, publisher_conflict_snapshot_digest, publisher_conflict_evaluation_state, publisher_conflict_valid_until], references: "editorial.conflict_snapshots(id,subject_actor_id,target_type,target_id,target_version,target_digest,snapshot_sha256,evaluation_state,valid_until)", on_delete: RESTRICT}
    checks:
      - {name: publication_gate_decisions_version_ck, expression: "expected_case_version > 0"}
      - {name: publication_gate_decisions_policy_ck, expression: "length(policy_version) BETWEEN 1 AND 100"}
      - {name: publication_gate_decisions_risk_ck, expression: "risk_level IN ('LOW','MEDIUM','HIGH','BLOCKED_DEFAULT') AND required_editor_count BETWEEN 1 AND 2"}
      - {name: publication_gate_decisions_quorum_ck, expression: "(risk_level = 'LOW' AND required_editor_count = 1) OR (risk_level IN ('MEDIUM','HIGH','BLOCKED_DEFAULT') AND required_editor_count = 2)"}
      - {name: publication_gate_decisions_outcome_ck, expression: "outcome IN ('PASS','BLOCKED')"}
      - {name: publication_gate_decisions_time_ck, expression: "preview_expires_at > evaluated_at AND earliest_expiry_at > evaluated_at AND earliest_expiry_at <= preview_expires_at"}
      - {name: publication_gate_decisions_parity_ck, expression: "outcome = 'BLOCKED' OR application_evaluation_digest = database_evaluation_digest"}
      - {name: publication_gate_decisions_publisher_conflict_ck, expression: "publisher_conflict_target_type = 'REVIEW_SNAPSHOT' AND publisher_conflict_target_id = review_snapshot_id::text AND publisher_conflict_target_version = expected_case_version AND publisher_conflict_target_digest = snapshot_digest AND publisher_conflict_evaluation_state = 'CLEAR' AND publisher_conflict_valid_until > evaluated_at"}
      - {name: publication_gate_decisions_step_up_time_ck, expression: "step_up_expires_at > step_up_issued_at AND created_at >= step_up_issued_at AND created_at <= step_up_expires_at"}
      - {name: publication_gate_decisions_digest_ck, expression: "ops.is_lower_sha256(snapshot_digest) AND ops.is_lower_sha256(preview_digest) AND ops.is_lower_sha256(public_payload_digest) AND ops.is_lower_sha256(claim_revision_set_digest) AND ops.is_lower_sha256(claim_evidence_matrix_digest) AND ops.is_lower_sha256(source_freshness_digest) AND ops.is_lower_sha256(response_policy_digest) AND ops.is_lower_sha256(privacy_restriction_digest) AND ops.is_lower_sha256(rights_digest) AND ops.is_lower_sha256(publication_consent_digest) AND ops.is_lower_sha256(conflict_digest) AND ops.is_lower_sha256(funding_digest) AND ops.is_lower_sha256(hold_coverage_digest) AND ops.is_lower_sha256(activation_set_digest) AND ops.is_lower_sha256(kill_switch_digest) AND ops.is_lower_sha256(review_decision_set_digest) AND ops.is_lower_sha256(quorum_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(publisher_conflict_snapshot_digest) AND ops.is_lower_sha256(publisher_conflict_target_digest) AND ops.is_lower_sha256(application_evaluation_digest) AND ops.is_lower_sha256(database_evaluation_digest) AND ops.is_lower_sha256(blocker_set_digest) AND ops.is_lower_sha256(step_up_authorization_receipt_digest) AND ops.is_lower_sha256(action_digest) AND ops.is_lower_sha256(idempotency_key_sha256) AND ops.is_lower_sha256(decision_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: publication_gate_decisions_case_idx, method: btree, keys: [case_id, evaluated_at DESC, id DESC]}
      - {name: publication_gate_decisions_snapshot_idx, method: btree, keys: [review_snapshot_id, evaluated_at DESC, id DESC]}
      - {name: publication_gate_decisions_expiry_idx, method: btree, keys: [earliest_expiry_at, case_id, id]}
    grants:
      gurine_control_api: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable internal publication authorization; public role sees only the resulting public projection}
    digest_and_concurrency:
      identity: case_id+expected_case_version+decision_digest
      canonical_digest: decision_digest binds every declared digest and scalar, ordered child rows, publisher, assurance binding, evaluated time, earliest expiry, outcome, and blocker set
      transaction: SERIALIZABLE; lock idempotency, exact case/version, snapshot, preview, publisher conflict snapshot, ordered claims/evidence/sources and dimensional rights rows, response/consent/rights/restriction/conflict/funding/holds/activation/reviews/switches; independently recompute SQL digest; insert parent and children; PASS requires every rights dimension needed for public commercial display ALLOW, inserts one publication revision and advances case, BLOCKED inserts zero revision; append audit/outbox/receipt atomically
      stale_rule: any bound row/version/digest/policy change or earliest expiry creates a new decision; no refresh-in-place and no prior decision reuse
      parity_rule: application/SQL mismatch always BLOCKED with EVALUATOR_DIVERGENCE, opens an incident, and never inserts a revision
      publication_fk: post-0028 editorial.publication_revisions.publication_gate_decision_id references this row; deferred graph constraint enforces PASS=one revision and BLOCKED=zero
    retention:
      record_class_by_outcome: {PASS: PUBLICATION_GATE_PASS, BLOCKED: PUBLICATION_GATE_BLOCKED}
      trigger: PASS follows immutable publication revision; BLOCKED follows governance/audit schedule
      terminal_action_by_outcome: {PASS: PRESERVE_PUBLIC_REVISION, BLOCKED: CRYPTO_ERASE}
      legal_hold_key: case_id+review_snapshot_id
      backup_behavior: parent and all child digests verify before projection rebuild
    roundtrip:
      read_order: [evaluated_at DESC, id DESC]
      assertions: [all digest fields, exact child digest parity, PASS one-revision atomicity, BLOCKED zero-revision durability, SQL/app divergence, stale every binding, publisher separation, step-up replay, update/delete denial]

  - relation: editorial.publication_gate_claim_evidence
    domain: PublicationGateDecision
    repository: crates/persistence-postgres::publication_gate
    logical_owner: publication-gate
    writer_components: [control-api]
    mutation: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
