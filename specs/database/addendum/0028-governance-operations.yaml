      - {name: legal_conflict_snapshot_id, type: uuid, nullable: false, default: NONE, fk: editorial.conflict_snapshots(id) ON DELETE RESTRICT}
      - {name: legal_conflict_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: operational_action_decision_id, type: uuid, nullable: false, default: NONE, fk: ops.action_decisions(id) ON DELETE RESTRICT}
      - {name: operational_action_decision_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: operational_approver_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: operational_action_decision_kind, type: text, nullable: false, default: "'APPROVE'"}
      - {name: operational_conflict_snapshot_id, type: uuid, nullable: false, default: NONE, fk: editorial.conflict_snapshots(id) ON DELETE RESTRICT}
      - {name: operational_conflict_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: counted_decision_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: execution_id, type: uuid, nullable: false, default: NONE}
      - {name: execution_generation, type: bigint, nullable: false, default: NONE}
      - {name: execution_digest, type: char(64), nullable: false, default: NONE}
      - {name: execution_receipt_id, type: uuid, nullable: false, default: NONE, fk: ops.execution_receipts(id) ON DELETE RESTRICT}
      - {name: execution_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: decided_by_service, type: text, nullable: false, default: "'workflow-worker'"}
      - {name: reason_code, type: text, nullable: false, default: NONE}
      - {name: reason_encrypted, type: bytea, nullable: false, default: NONE}
      - {name: reason_digest, type: char(64), nullable: false, default: NONE}
      - {name: effective_at, type: timestamptz, nullable: true, default: NONE}
      - {name: expires_at, type: timestamptz, nullable: true, default: NONE}
      - {name: decision_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: capability_activation_decisions_pkey, columns: [id]}
    uniques:
      - {name: capability_activation_decisions_version_uq, columns: [capability_id, environment, decision_version]}
      - {name: capability_activation_decisions_digest_uq, columns: [decision_digest]}
      - {name: capability_activation_decisions_execution_uq, columns: [execution_receipt_id]}
      - {name: capability_activation_decisions_readiness_binding_uq, columns: [id, decision_version, decision_digest]}
    foreign_keys:
      - {name: capability_activation_decisions_action_binding_fk, columns: [proposal_id, proposal_version, approval_digest], references: "ops.action_proposal_versions(proposal_id,version,approval_digest)", on_delete: RESTRICT}
      - {name: capability_activation_decisions_legal_action_receipt_fk, columns: [legal_action_decision_id, proposal_id, proposal_version, approval_digest, legal_action_decision_receipt_digest], references_requires_0026_candidate_key: "ops.action_decisions(id,proposal_id,proposal_version,approval_digest,receipt_digest)", on_delete: RESTRICT, exact_actor_kind_conflict_guard: owner procedure locks the same row and compares actor_id, decision_kind=APPROVE, and conflict_snapshot_digest to the stored legal columns}
      - {name: capability_activation_decisions_operational_action_receipt_fk, columns: [operational_action_decision_id, proposal_id, proposal_version, approval_digest, operational_action_decision_receipt_digest], references_requires_0026_candidate_key: "ops.action_decisions(id,proposal_id,proposal_version,approval_digest,receipt_digest)", on_delete: RESTRICT, exact_actor_kind_conflict_guard: owner procedure locks the same row and compares actor_id, decision_kind=APPROVE, and conflict_snapshot_digest to the stored operational columns}
      - {name: capability_activation_decisions_legal_conflict_fk, columns: [legal_conflict_snapshot_id, legal_approver_user_id, legal_conflict_snapshot_digest], references: "editorial.conflict_snapshots(id,subject_actor_id,snapshot_sha256)", on_delete: RESTRICT}
      - {name: capability_activation_decisions_operational_conflict_fk, columns: [operational_conflict_snapshot_id, operational_approver_user_id, operational_conflict_snapshot_digest], references: "editorial.conflict_snapshots(id,subject_actor_id,snapshot_sha256)", on_delete: RESTRICT}
      - {name: capability_activation_decisions_execution_authorization_fk, columns: [execution_id, execution_generation, proposal_id, proposal_version, approval_digest, counted_decision_set_digest, execution_digest], references_requires_0026_candidate_key: "ops.execution_authorizations(execution_id,generation,proposal_id,proposal_version,approval_digest,counted_decision_set_digest,execution_digest)", on_delete: RESTRICT}
      - {name: capability_activation_decisions_execution_receipt_fk, columns: [execution_receipt_id, execution_id, execution_generation, execution_receipt_digest], references_requires_0026_candidate_key: "ops.execution_receipts(id,execution_id,generation,receipt_digest)", on_delete: RESTRICT}
    checks:
      - {name: capability_activation_decisions_id_ck, expression: "capability_id ~ '^[a-z][a-z0-9_.-]{2,127}$'"}
      - {name: capability_activation_decisions_class_ck, expression: "capability_class IN ('PUBLIC_PUBLICATION','SOURCE_ACCESS','SOURCE_STORAGE','SOURCE_REDISTRIBUTION','MODEL_EGRESS','DELIVERY_CHANNEL','PRIVACY_DSAR','PAID_WORKSPACE_PROCESSING')"}
      - {name: capability_activation_decisions_environment_ck, expression: "environment IN ('DEVELOPMENT','TEST','STAGING','PRODUCTION')"}
      - {name: capability_activation_decisions_state_ck, expression: "legal_state IN ('UNCONFIGURED','PENDING_REVIEW','APPROVED','SUSPENDED','EXPIRED')"}
      - {name: capability_activation_decisions_operational_state_ck, expression: "operational_state IN ('DISABLED','UNCONFIGURED','PENDING_PROVIDER_APPROVAL','ACTIVE','SUSPENDED')"}
      - {name: capability_activation_decisions_state_pair_ck, expression: "(legal_state, operational_state) IN (('UNCONFIGURED','DISABLED'),('UNCONFIGURED','UNCONFIGURED'),('PENDING_REVIEW','PENDING_PROVIDER_APPROVAL'),('PENDING_REVIEW','DISABLED'),('APPROVED','ACTIVE'),('APPROVED','SUSPENDED'),('APPROVED','DISABLED'),('SUSPENDED','SUSPENDED'),('SUSPENDED','DISABLED'),('EXPIRED','SUSPENDED'),('EXPIRED','DISABLED'))"}
      - {name: capability_activation_decisions_scope_ck, expression: "scope_type IN ('DEPLOYMENT','SOURCE','PROVIDER','SENDER','TEMPLATE','MODEL','DATA_CLASS','WORKSPACE') AND length(scope_id) BETWEEN 1 AND 512 AND scope_version > 0"}
      - {name: capability_activation_decisions_arrays_ck, expression: "cardinality(jurisdiction_codes) BETWEEN 1 AND 64 AND ops.text_array_is_sorted_unique(jurisdiction_codes) AND cardinality(data_class_codes) BETWEEN 1 AND 64 AND ops.text_array_is_sorted_unique(data_class_codes)"}
      - {name: capability_activation_decisions_version_ck, expression: "decision_version > 0 AND proposal_version > 0 AND execution_generation > 0 AND ((decision_version = 1 AND prior_decision_id IS NULL) OR (decision_version > 1 AND prior_decision_id IS NOT NULL))"}
      - {name: capability_activation_decisions_approval_time_ck, expression: "(legal_state = 'APPROVED' AND effective_at IS NOT NULL AND (expires_at IS NULL OR expires_at > effective_at)) OR legal_state <> 'APPROVED'"}
      - {name: capability_activation_decisions_dpa_ck, expression: "capability_class NOT IN ('MODEL_EGRESS','DELIVERY_CHANNEL','PAID_WORKSPACE_PROCESSING') OR dpa_digest IS NOT NULL"}
      - {name: capability_activation_decisions_license_ck, expression: "capability_class NOT IN ('SOURCE_ACCESS','SOURCE_STORAGE','SOURCE_REDISTRIBUTION') OR license_digest IS NOT NULL"}
      - {name: capability_activation_decisions_active_evidence_ck, expression: "operational_state <> 'ACTIVE' OR (legal_state = 'APPROVED' AND provider_preflight_receipt_digest IS NOT NULL AND routing_policy_digest IS NOT NULL AND kill_switch_digest IS NOT NULL AND legal_action_decision_id <> operational_action_decision_id)"}
      - {name: capability_activation_decisions_approval_binding_ck, expression: "legal_action_decision_kind = 'APPROVE' AND operational_action_decision_kind = 'APPROVE' AND legal_approver_user_id <> operational_approver_user_id AND legal_conflict_snapshot_id <> operational_conflict_snapshot_id"}
      - {name: capability_activation_decisions_service_ck, expression: "decided_by_service = 'workflow-worker'"}
      - {name: capability_activation_decisions_digest_ck, expression: "ops.is_lower_sha256(configuration_digest) AND ops.is_lower_sha256(scope_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(contract_digest) AND (dpa_digest IS NULL OR ops.is_lower_sha256(dpa_digest)) AND (license_digest IS NULL OR ops.is_lower_sha256(license_digest)) AND ops.is_lower_sha256(rights_digest) AND (provider_preflight_receipt_digest IS NULL OR ops.is_lower_sha256(provider_preflight_receipt_digest)) AND (routing_policy_digest IS NULL OR ops.is_lower_sha256(routing_policy_digest)) AND (kill_switch_digest IS NULL OR ops.is_lower_sha256(kill_switch_digest)) AND ops.is_lower_sha256(conditions_digest) AND ops.is_lower_sha256(evidence_set_digest) AND ops.is_lower_sha256(approval_digest) AND ops.is_lower_sha256(legal_action_decision_receipt_digest) AND ops.is_lower_sha256(legal_conflict_snapshot_digest) AND ops.is_lower_sha256(operational_action_decision_receipt_digest) AND ops.is_lower_sha256(operational_conflict_snapshot_digest) AND ops.is_lower_sha256(counted_decision_set_digest) AND ops.is_lower_sha256(execution_digest) AND ops.is_lower_sha256(execution_receipt_digest) AND ops.is_lower_sha256(reason_digest) AND ops.is_lower_sha256(decision_digest)"}
    indexes:
      - {name: capability_activation_decisions_latest_idx, method: btree, keys: [capability_id, environment, decision_version DESC, id DESC]}
      - {name: capability_activation_decisions_effective_idx, method: btree, keys: [capability_class, environment, effective_at DESC, id], predicate: "legal_state = 'APPROVED'"}
      - {name: capability_activation_decisions_expiry_idx, method: btree, keys: [expires_at, id], predicate: expires_at IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: deployment-wide legal activation fact consumed only by fixed service roles}
    digest_and_concurrency:
      identity: capability_id+environment+configuration_digest+decision_version
      canonical_digest: decision_digest binds exact scope, configuration, both legal and operational states, prerequisite evidence set, policy/contract/DPA/license/rights/preflight/routing/switch digests, distinct legal and operational approvals/conflict snapshots, execution authorization/receipt, effective/expiry, and prior decision digest
      insert_rule: SERIALIZABLE lock on latest capability_id+environment row; expected prior version and prior decision ID must match; no direct SUSPENDED->APPROVED
      effective_rule: newest effective unexpired row wins; production effect requires legal_state APPROVED plus operational_state ACTIVE; any exact tuple/config mismatch, missing evidence, SUSPENDED, EXPIRED, disabled or pending state fails closed without fallback
    retention:
      record_class: GOVERNANCE_CAPABILITY_ACTIVATION
      trigger: superseded_or_expires_at
      terminal_action: CRYPTO_ERASE
      preserved_after_crypto_erase: [scope and decision digests, legal_state, effective_at, expires_at, receipt links]
      legal_hold_key: capability_id+environment+scope_digest
      backup_behavior: erased conditions and reasons are never restored as readable
    roundtrip:
      read_order: [decision_version DESC, id DESC]
      assertions: [legal and operational axes remain distinct, prior-version CAS, exact config match, prerequisite applicability, health-not-activation, no suspended-direct-approve, immutable denial]

  - relation: ops.capability_activation_evidence
    domain: CapabilityActivationDecision
    repository: crates/persistence-postgres::capability_activation
    logical_owner: capability-activation
    writer_components: [action-execution-worker]
    mutation: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: decision_id, type: uuid, nullable: false, default: NONE, fk: ops.capability_activation_decisions(id) ON DELETE RESTRICT}
      - {name: ordinal, type: smallint, nullable: false, default: NONE}
      - {name: evidence_kind, type: text, nullable: false, default: NONE}
      - {name: applicability, type: text, nullable: false, default: NONE}
      - {name: applicability_reason_code, type: text, nullable: false, default: NONE}
      - {name: evidence_ref_type, type: text, nullable: false, default: NONE}
      - {name: evidence_ref_id, type: text, nullable: false, default: NONE}
      - {name: evidence_ref_version, type: bigint, nullable: false, default: NONE}
      - {name: evidence_ref_digest, type: char(64), nullable: false, default: NONE}
      - {name: evidence_state, type: text, nullable: false, default: NONE}
      - {name: proof_tier, type: text, nullable: false, default: NONE}
      - {name: valid_from, type: timestamptz, nullable: false, default: NONE}
      - {name: expires_at, type: timestamptz, nullable: true, default: NONE}
      - {name: policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: capability_activation_evidence_pkey, columns: [id]}
    uniques:
      - {name: capability_activation_evidence_ordinal_uq, columns: [decision_id, ordinal]}
      - {name: capability_activation_evidence_fact_uq, columns: [decision_id, evidence_kind, evidence_ref_type, evidence_ref_id, evidence_ref_version, evidence_ref_digest]}
      - {name: capability_activation_evidence_readiness_binding_uq, columns: [id, decision_id, evidence_ref_digest]}
    checks:
      - {name: capability_activation_evidence_ordinal_ck, expression: "ordinal BETWEEN 1 AND 256"}
      - {name: capability_activation_evidence_kind_ck, expression: "evidence_kind IN ('OPERATING_ENTITY','CONTROLLER','COUNSEL_REVIEW','PRIVACY_NOTICE','DATA_MAP_DPIA','PROCESSOR_DPA','TRANSFER_MECHANISM','SOURCE_LICENSE','PROVIDER_APPROVAL','SENDER_VERIFICATION','TEMPLATE_APPROVAL','CALLBACK_RECONCILIATION','MODEL_TERMS','LIVE_PREFLIGHT_RECEIPT','PAID_PROCESSING_AUTHORITY','JURISDICTION_REVIEW','RIGHTS_AUTHORIZATION')"}
      - {name: capability_activation_evidence_applicability_ck, expression: "applicability IN ('APPLICABLE','NOT_APPLICABLE')"}
      - {name: capability_activation_evidence_applicability_reason_ck, expression: "applicability_reason_code IN ('POLICY_REQUIRED','JURISDICTION_REQUIRED','CONTRACT_REQUIRED','RIGHTS_REQUIRED','PROVIDER_REQUIRED','NO_EXTERNAL_PROCESSOR','NO_INTERNATIONAL_TRANSFER','NO_SOURCE_COMPONENT','NO_CHANNEL_COMPONENT','NO_MODEL_COMPONENT','NO_PAID_PROCESSING')"}
      - {name: capability_activation_evidence_ref_ck, expression: "evidence_ref_type IN ('ACTION_DECISION','EXECUTION_RECEIPT','PREFLIGHT_RECEIPT','RIGHTS_DECISION','CONTRACT_ARTIFACT','POLICY_ARTIFACT','LEGAL_REVIEW_ARTIFACT') AND length(evidence_ref_id) BETWEEN 1 AND 512 AND evidence_ref_version > 0"}
      - {name: capability_activation_evidence_state_ck, expression: "evidence_state IN ('SATISFIED','UNSATISFIED','UNKNOWN','REVOKED')"}
      - {name: capability_activation_evidence_tier_ck, expression: "proof_tier IN ('PRODUCTION_LEGAL','PRODUCTION_OPERATIONAL','NON_PRODUCTION_PREFLIGHT','SANDBOX_ONLY','FIXTURE_ONLY','CONNECTION_TEST_ONLY')"}
      - {name: capability_activation_evidence_time_ck, expression: "expires_at IS NULL OR expires_at > valid_from"}
      - {name: capability_activation_evidence_applicability_state_ck, expression: "(applicability = 'APPLICABLE' AND applicability_reason_code NOT LIKE 'NO_%') OR (applicability = 'NOT_APPLICABLE' AND applicability_reason_code LIKE 'NO_%' AND evidence_state = 'SATISFIED' AND proof_tier = 'PRODUCTION_LEGAL')"}
      - {name: capability_activation_evidence_digest_ck, expression: "ops.is_lower_sha256(evidence_ref_digest) AND ops.is_lower_sha256(policy_digest)"}
    indexes:
      - {name: capability_activation_evidence_order_idx, method: btree, keys: [decision_id, ordinal]}
      - {name: capability_activation_evidence_expiry_idx, method: btree, keys: [expires_at, decision_id, ordinal], predicate: expires_at IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: normalized child of deployment-wide activation decision}
    digest_and_concurrency:
      identity: decision_id+ordinal+evidence_kind+evidence_ref_digest
      parent_digest_rule: parent evidence_set_digest is SHA256 of canonical ordered child tuples; deferred trigger requires exact equality and the full capability_evidence_matrix, including exact NOT_APPLICABLE authorization, with no missing or duplicate kind
      replay: same parent and natural identity/digest returns existing row; changed evidence requires a new parent decision version
    retention:
      record_class: GOVERNANCE_CAPABILITY_ACTIVATION_EVIDENCE
      trigger: parent decision schedule
      terminal_action: CRYPTO_ERASE
      minimum: never shorter than parent decision
      legal_hold_key: decision_id
      backup_behavior: follows parent activation decision
    roundtrip:
      read_order: [ordinal ASC]
      assertions: [closed evidence kind, applicability distinction, expiry, parent digest parity, duplicate ordinal rejection, update/delete denial]

