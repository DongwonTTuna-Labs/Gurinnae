      - {name: journey_transition_receipts_one_handoff_version_uq, columns: [journey_instance_id, handoff_id, handoff_version], nulls: DISTINCT}
      - {name: journey_transition_receipts_digest_uq, columns: [receipt_digest]}
    foreign_keys:
      - {name: journey_transition_receipts_instance_fk, columns: [journey_instance_id], references: "ops.journey_instances(id)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
      - {name: journey_transition_receipts_handoff_fk, columns: [handoff_id, journey_instance_id], references: "ops.journey_handoffs(id,journey_instance_id)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
      - {name: journey_transition_receipts_prior_fk, columns: [prior_receipt_id, journey_instance_id, prior_receipt_digest], references: "ops.journey_transition_receipts(id,journey_instance_id,receipt_digest)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
    checks:
      - {name: journey_transition_receipts_edge_ck, expression: "edge_id ~ '^J-(0[1-9]|1[0-2])-E[0-9]{2}[A-Z]?$'"}
      - {name: journey_transition_receipts_kind_ck, expression: "receipt_kind IN ('INSTANCE_STARTED','HANDOFF_REQUESTED','HANDOFF_ACKNOWLEDGED','HANDOFF_DECLINED','HANDOFF_ESCALATED','HANDOFF_EXPIRED','HANDOFF_CANCELLED','HANDOFF_SUPERSEDED','OUTCOME_RECORDED')"}
      - {name: journey_transition_receipts_sequence_ck, expression: "journey_instance_version = sequence AND sequence > 0 AND ((sequence = 1 AND receipt_kind = 'INSTANCE_STARTED' AND prior_receipt_id IS NULL AND prior_receipt_digest IS NULL AND prior_owner_binding_digest IS NULL AND prior_instance_state IS NULL AND prior_due_at IS NULL) OR (sequence > 1 AND prior_receipt_id IS NOT NULL AND prior_receipt_digest IS NOT NULL AND prior_owner_binding_digest IS NOT NULL AND prior_instance_state IS NOT NULL AND prior_due_at IS NOT NULL))"}
      - {name: journey_transition_receipts_handoff_ck, expression: "(handoff_id IS NULL AND handoff_version IS NULL AND prior_handoff_state IS NULL AND resulting_handoff_state IS NULL) OR (handoff_id IS NOT NULL AND handoff_version > 0 AND resulting_handoff_state IN ('PENDING_ACK','ACKNOWLEDGED','DECLINED','EXPIRED','CANCELLED','SUPERSEDED'))"}
      - {name: journey_transition_receipts_instance_state_ck, expression: "resulting_instance_state IN ('ACTIVE','WAITING_ACK','BLOCKED','RECONCILIATION_REQUIRED','COMPLETED','CANCELLED','EXPIRED','REJECTED') AND (prior_instance_state IS NULL OR prior_instance_state IN ('ACTIVE','WAITING_ACK','BLOCKED','RECONCILIATION_REQUIRED','COMPLETED','CANCELLED','EXPIRED','REJECTED'))"}
      - {name: journey_transition_receipts_escalation_ck, expression: "escalation_state IN ('NOT_DUE','DUE','ESCALATED','RESOLVED')"}
      - {name: journey_transition_receipts_outbox_ck, expression: "(receipt_kind IN ('HANDOFF_CANCELLED','HANDOFF_SUPERSEDED') AND outbox_event_id IS NULL) OR (receipt_kind NOT IN ('HANDOFF_CANCELLED','HANDOFF_SUPERSEDED') AND outbox_event_id IS NOT NULL)"}
      - {name: journey_transition_receipts_kind_shape_ck, expression: "(receipt_kind = 'INSTANCE_STARTED' AND handoff_id IS NULL AND handoff_version IS NULL AND resulting_instance_state = 'ACTIVE' AND escalation_state = 'NOT_DUE' AND next_owner_binding_digest IS NULL) OR (receipt_kind = 'HANDOFF_REQUESTED' AND handoff_id IS NOT NULL AND handoff_version = 1 AND prior_handoff_state IS NULL AND resulting_handoff_state = 'PENDING_ACK' AND resulting_instance_state = 'WAITING_ACK' AND escalation_state = 'NOT_DUE' AND next_owner_binding_digest IS NOT NULL) OR (receipt_kind = 'HANDOFF_ACKNOWLEDGED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'ACKNOWLEDGED' AND resulting_instance_state = 'ACTIVE' AND escalation_state = 'RESOLVED' AND next_owner_binding_digest IS NULL) OR (receipt_kind = 'HANDOFF_DECLINED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'DECLINED' AND resulting_instance_state IN ('ACTIVE','BLOCKED') AND escalation_state = 'RESOLVED') OR (receipt_kind = 'HANDOFF_ESCALATED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'PENDING_ACK' AND prior_instance_state = 'WAITING_ACK' AND resulting_instance_state = 'WAITING_ACK' AND escalation_state IN ('DUE','ESCALATED') AND next_owner_binding_digest IS NOT NULL) OR (receipt_kind = 'HANDOFF_EXPIRED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'EXPIRED' AND resulting_instance_state IN ('ACTIVE','BLOCKED','EXPIRED') AND escalation_state = 'RESOLVED') OR (receipt_kind = 'HANDOFF_CANCELLED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'CANCELLED' AND escalation_state = 'RESOLVED') OR (receipt_kind = 'HANDOFF_SUPERSEDED' AND handoff_id IS NOT NULL AND prior_handoff_state = 'PENDING_ACK' AND resulting_handoff_state = 'SUPERSEDED' AND escalation_state = 'RESOLVED') OR (receipt_kind = 'OUTCOME_RECORDED' AND handoff_id IS NULL AND handoff_version IS NULL AND prior_handoff_state IS NULL AND resulting_handoff_state IS NULL)"}
      - {name: journey_transition_receipts_digest_ck, expression: "(prior_receipt_digest IS NULL OR ops.is_lower_sha256(prior_receipt_digest)) AND ops.is_lower_sha256(subject_digest) AND (prior_owner_binding_digest IS NULL OR ops.is_lower_sha256(prior_owner_binding_digest)) AND ops.is_lower_sha256(current_owner_binding_digest) AND (next_owner_binding_digest IS NULL OR ops.is_lower_sha256(next_owner_binding_digest)) AND ops.is_lower_sha256(effect_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: journey_transition_receipts_instance_idx, method: btree, keys: [journey_instance_id, sequence DESC, id DESC]}
      - {name: journey_transition_receipts_handoff_idx, method: btree, keys: [handoff_id, sequence DESC, id DESC], predicate: handoff_id IS NOT NULL}
      - {name: journey_transition_receipts_time_idx, method: btree, keys: [occurred_at DESC, id DESC]}
      - {name: journey_transition_receipts_handoff_fk_idx, method: btree, keys: [handoff_id, journey_instance_id], predicate: handoff_id IS NOT NULL}
      - {name: journey_transition_receipts_prior_fk_idx, method: btree, keys: [prior_receipt_id, journey_instance_id, prior_receipt_digest], predicate: prior_receipt_id IS NOT NULL}
      - {name: journey_transition_receipts_audit_fk_idx, method: btree, keys: [audit_event_id]}
      - {name: journey_transition_receipts_outbox_fk_idx, method: btree, keys: [outbox_event_id]}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
      gurine_auditor: [SELECT]
    rls: {enabled: false, forced: false, reason: append-only internal receipt chain with exact audit and outbox bindings; no external direct access}
    mutability:
      mode: APPEND_ONLY
      guard_trigger: ops.reject_mutation()
      update: FORBIDDEN
      delete: FORBIDDEN_UNTIL_RETENTION_GRAPH_DELETE
    constraint_triggers:
      - ops.check_journey_receipt_chain_v1 verifies prior sequence equals sequence minus one and exact prior ID and digest under the same instance
      - ops.check_journey_receipt_parent_versions_v1 verifies inserted instance and optional handoff versions equal the newly persisted parent heads without retaining an FK to a mutable historical version
      - ops.check_journey_receipt_state_owner_v1 verifies the exact nine-kind prior and resulting instance, handoff, owner and escalation shapes
    digest_and_concurrency:
      identity: journey_instance_id+sequence
      canonical_digest: receipt_digest binds prior receipt, exact instance and optional handoff versions, edge and receipt kind, subject, owner transitions, states, escalation, prior_due_at, resulting_due_at, effect, audit, outbox and occurrence time in declaration order
      chain_rule: sequence is gapless, every sequence after one references the exact prior ID and digest, and the parent last-receipt head advances in the same deferred-constraint transaction
      effect_rule: receipt replay never repeats a domain or external effect; an exact replay returns the prior receipt while a digest change is an idempotency conflict
    retention:
      record_class: JOURNEY_COORDINATION
      trigger: governed by parent journey, subject, audit and legal-hold schedules
      terminal_action: DELETE
      legal_hold_key: journey_instance_id+subject_digest
      backup_behavior: the complete gapless chain and audit/outbox references restore before the journey can be read as current
    roundtrip:
      read_order: [sequence ASC, id ASC]
      assertions: [initial receipt, gapless prior chain, handoff all-or-none, owner digest transition, audit outbox atomicity, immutable denial, exact replay no duplicate effect, restore parity]

