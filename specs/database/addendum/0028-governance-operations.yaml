    core.procurement_query_snapshot_members: PROCUREMENT_QUERY_SNAPSHOT
    editorial.response_request_claim_scopes: RESPONSE_REQUEST_SCOPE_HISTORY
    editorial.response_request_evidence_scopes: RESPONSE_REQUEST_SCOPE_HISTORY
  alter_each_relation:
    columns:
      retention_record_class: text NOT NULL
      retention_schedule_id: uuid NOT NULL
      retention_schedule_digest: char(64) NOT NULL
    backfill: lock the exact relation row, select the latest effective nonexpired matching schedule at the row creation time, reject missing/overlapping/stale schedules, then write the three immutable binding columns
    foreign_key: (retention_schedule_id,retention_record_class,retention_schedule_digest) REFERENCES ops.record_class_schedules(id,record_class,schedule_digest) ON DELETE RESTRICT
    runtime_write_rule: owner routines resolve and bind the current schedule; callers cannot supply or override the class or schedule identity
  active_hold_resolver:
    function: ops.record_has_active_legal_hold(retention_record_class text, relation_name regclass, row_id uuid, at_time timestamptz) -> boolean
    owner: gurine_migrator
    execute_roles: [gurine_workflow_worker, gurine_scheduler, gurine_control_api]
    search_path: pg_catalog,ops,editorial,core,raw,intake,public,pg_temp
    result_contract: true when any unreleased RETENTION or DELETION coverage reaches the exact typed anchor graph; unknown, missing anchor, unsupported relation, stale schedule or inconsistent release chain raises a typed fail-closed exception and never returns false
    lock_order: [ops.legal_hold_target_anchors, editorial.legal_holds, editorial.legal_hold_releases, target_relation_row]
    dynamic_sql_rule: relation_name must be one of the exact map keys and is resolved to a pinned regclass before any format or EXECUTE; arbitrary identifiers are rejected
  migration_order:
    - create and validate record_class_schedules plus record_class_schedules_binding_uq
    - create legal_hold_target_anchors and typed graph indexes
    - add nullable binding columns to all 36 relations
    - backfill under locked evidence-grounded schedules
    - add and validate all 36 three-column foreign keys
    - set all binding columns NOT NULL and install immutable-column guards
    - create the active-hold resolver and revoke PUBLIC execute
    - enable destructive workers only after the complete bridge canary passes
  exact_oracles:
    - relation and record-class keys are set-equal to the 0025 map and count 18
    - each relation has the exact three immutable columns and one validated composite FK
    - direct, transitive, multiple, partial-release, expired-review and hold-placement-versus-retention races fail closed
    - one no-hold row per class reaches only the schedule-selected terminal action
    - restore remains inaccessible until schedule, hold and suppression graph revalidation succeeds

