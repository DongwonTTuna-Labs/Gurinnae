    change: add RECUSED to editorial.review_status, add UNIQUE(case_id,review_snapshot_id,assignment_generation), and make assignment generation append-only. Recusal requires the current reviewer, one exact current PRESENT declaration, a RECUSE_REQUIRED|INDEPENDENT_REVIEW_REQUIRED|BLOCKED_UNKNOWN snapshot, and expected generation; the owner function terminalizes the row and inserts exactly one generation+1 replacement with an eligible reviewer or a durable reviewer-null vacancy. The recused actor is permanently excluded from later generations for the same snapshot. No nullable conflictDeclarationId can support RECUSE.
  editorial.corrections:
