owner_procedure_contracts:
  editorial.place_legal_hold:
    sql_signature: (jsonb,text[],uuid[],text,text,timestamptz,uuid,uuid,char(64),uuid) -> editorial.legal_holds
    input_order: [target_binding, scope_atoms, affected_ids, reason, authority_reference, expires_at, placed_by_user_id, actor_assertion_jti, idempotency_key_sha256, request_id]
    target_binding: closed TargetBindingV1 discriminator; caller generic target ID/version/digest is comparison-only
    transaction: SERIALIZABLE
    statements:
      - claim idempotency key and validate review.legal capability plus current STEP_UP assurance receipt
      - lock exactly one concrete target through the target-kind-specific composite candidate key and derive target_id, target_version, and target_digest
      - for case-governed variants lock exact case/review snapshot; for non-case variants require no invented case or review snapshot
      - lock a current CLEAR placeLegalHold conflict snapshot for the placer and exact target, derive the dedicated legal approval receipt, and bind the immutable STEP_UP assurance receipt
      - insert or reuse one exact ops.legal_hold_target_anchors row and verify anchor_digest
      - insert one immutable placement with canonical cells/digests and active=true; append audit, legal.hold_placed.v1, and stored command receipt
    cardinality: exactly one anchor and one placement for new bytes; exact idempotent replay adds zero rows; mismatch is IDEMPOTENCY_CONFLICT
    acl: owner gurine_migrator; EXECUTE gurine_control_api only; PUBLIC and every other runtime role revoked
  ops.record_capability_activation_decision:
    sql_signature: (text,text,text,char(64),bigint,uuid,uuid,uuid,uuid,uuid,uuid,uuid,text,bytea) -> ops.capability_activation_decisions
    input_order: [capability_id, capability_class, environment, configuration_digest, expected_decision_version, legal_action_decision_id, legal_conflict_snapshot_id, operational_action_decision_id, operational_conflict_snapshot_id, execution_receipt_id, proposal_id, prior_decision_id, reason_code, reason_encrypted]
    transaction: SERIALIZABLE
    statements:
      - lock latest capability/environment decision and exact proposal/authorization/execution receipt graph
      - lock both action decisions; require distinct human actors, decision_kind APPROVE, exact shared proposal/version/approval digest, exact receipts, and copied conflict digests
      - lock both conflict snapshots; require subject actors equal the action actors, target exact proposal/version/digest, current CLEAR state, nonexpired validity, and legal versus operational role separation
      - derive evidence applicability matrix and evidence_set_digest in SQL; reject caller-provided state or digest mismatch
      - append decision/evidence/audit/outbox atomically and return the stored row
    cardinality: one next version or typed stale/evidence/conflict error; no partial child set
    acl: owner gurine_migrator; EXECUTE gurine_workflow_worker only
  ops.record_retention_request_decision:
    sql_signature: (uuid,text,bigint,text,text,bytea,char(64),char(64),uuid,uuid,char(64),uuid) -> ops.retention_request_decisions
    input_order: [retention_request_id, request_type, expected_decision_version, transition_kind, reason_code, reason_encrypted, inventory_snapshot_digest, hold_coverage_digest, completion_receipt_id, step_up_authorization_id, idempotency_key_sha256, request_id]
    transaction: SERIALIZABLE
    statements:
      - claim idempotency; lock root request and prove the stored request_type equals the supplied discriminator
      - validate PrivacyInventorySetV1 and bind the exact inventory digest/count on START_REVIEW without changing request_type
      - for COMPLETE lock the receipt through id+request+type+execution-kind; require ACCESS/DISCLOSE_COPY, CORRECTION/CORRECT, DELETION/DESTRUCTIVE, or RESTRICTION/RESTRICT_PROCESSING exactly
      - require zero active hold cells and exact restoration-suppression mode/count; update root once and append decision/audit/outbox/receipt
    cardinality: exactly one version edge; 64-way stale race has one winner; idempotent replay writes zero rows
    acl: owner gurine_migrator; EXECUTE gurine_control_api only
  ops.record_retention_execution_completion:
    sql_signature: (uuid,text,uuid,bigint,jsonb,jsonb,uuid,uuid,bigint,timestamptz,timestamptz,text) -> ops.retention_execution_receipts
    input_order: [retention_request_id, request_type, approval_decision_id, execution_generation, inventory_manifest, location_counts, job_id, lease_token, fencing_token, started_at, completed_at, worker_id]
    transaction: SERIALIZABLE
    statements:
      - lock APPROVED root/decision, current schedule set, inventory rows, hold cells, worker job lease, and backup generations in global order
      - derive request-specific required actions and exact integer counts; reject missing, duplicate, failed, or extra location rows
      - insert no suppression for ACCESS; insert permanent corrected-version replay fences for CORRECTION; insert permanent erasure suppressions for DELETION; insert until-release processing suppressions for RESTRICTION
      - recompute suppression set/tombstone/evidence/receipt digests, append one immutable receipt plus audit/outbox, and never update the root status
    cardinality: one fenced generation receipt; replay returns it; different bytes are RETENTION_EXECUTION_FACT_CONFLICT
    acl: owner gurine_migrator; EXECUTE gurine_workflow_worker only
  editorial.release_legal_hold:
    sql_signature: (uuid,uuid,bigint,text[],uuid[],text,text,text,uuid,uuid,char(64),uuid) -> editorial.legal_hold_releases
    input_order: [hold_id, target_anchor_id, expected_release_sequence, released_scope_atoms, affected_ids, release_authority_reference, reason_code, reason, released_by_user_id, step_up_authorization_id, idempotency_key_sha256, request_id]
    transaction: SERIALIZABLE
    statements:
      - claim idempotency and lock exact placement+anchor+concrete target; derive case context instead of accepting nullable case scalars as authority
      - lock release chain; prove requested cells are an unreleased subset and recompute prior/resulting coverage digests
      - lock current CLEAR LEGAL_HOLD conflict snapshot for the releaser and validate legal capability, authority reference, placer/releaser separation, and STEP_UP receipt
      - append release/audit/legal.hold_released.v1/receipt atomically; expiry never calls this function
    cardinality: one next release sequence or typed stale/scope/conflict error; no coverage mutation
    acl: owner gurine_migrator; EXECUTE gurine_control_api only
  ops.record_incident_transition:
    sql_signature: (uuid,bigint,text,text,text[],uuid,uuid,timestamptz,jsonb,jsonb,text,text,text,text,char(64),uuid) -> ops.incident_events
    input_order: [incident_id, expected_version, transition_kind, severity, affected_capabilities, owner_user_id, commander_user_id, next_update_at, transition_detail, evidence_refs, reason_code, reason, actor_type, actor_id, idempotency_key_sha256, request_id]
    transaction: SERIALIZABLE
    statements:
      - lock incident root and latest event; validate exact edge, closed detail discriminator, evidence order, severity commander rule, and resolution evidence
      - append one event; update root version/state/summary exactly once under transaction-local guard; append audit/outbox/receipt
    cardinality: one next event/version; stale 64-way race has one winner; MIGRATION_BASELINE is callable only by the migration owner in the migration transaction
    acl: owner gurine_migrator; EXECUTE gurine_control_api and gurine_workflow_worker; migration-only overload has no runtime grant
  editorial.evaluate_and_publish_case:
    sql_signature: (uuid,bigint,uuid,uuid,uuid,uuid,char(64),uuid) -> editorial.publication_gate_decisions
    input_order: [case_id, expected_case_version, review_snapshot_id, preview_id, publisher_user_id, step_up_authorization_id, idempotency_key_sha256, request_id]
    transaction: SERIALIZABLE
    statements:
      - claim idempotency and lock exact case/snapshot/preview/publisher conflict tuple
      - select every public factual claim and exact evidence edge; lock concrete source rows, current dimensional asset-rights decisions, response publication-consent facts, privacy/restriction/hold/funding/activation/review/kill-switch rows
      - require source freshness CURRENT; ASSET_RIGHTS requires GRANT with access, excerpt, redistribution, commercial use, and public display all ALLOW at evaluated_at, RESPONSE_CONSENT requires the exact immutable consent digest, and EDITORIAL_POLICY requires an exact approved policy binding; UNKNOWN, DENY, SUSPEND, REVOKE, expiry, missing, or cross-kind evidence emits a typed blocker
      - independently compute ordered child rows and all parent digests in SQL; compare application digest; derive outcome and blockers without caller authority
      - insert parent/children and audit/outbox/receipt; PASS inserts exactly one bound publication revision and advances the case, BLOCKED inserts none
    cardinality: one immutable decision graph; deferred graph trigger proves PASS=one revision and BLOCKED=zero at commit
    acl: owner gurine_migrator; EXECUTE gurine_control_api only; no table INSERT grant
  ops.close_sli_window:
    sql_signature: (text,text,text,char(64),text,text,timestamptz,timestamptz,uuid,jsonb,jsonb,jsonb,uuid,uuid) -> ops.sli_window_receipts
    input_order: [sli_id, definition_version, environment, scope_digest, window_kind, scope_id, window_start, window_end, evaluation_batch_id, evidence_set, exclusion_set, telemetry_gap_set, paired_receipt_id, request_id]
    transaction: SERIALIZABLE
    statements:
      - lock logical window identities and prior receipts; derive all counts/fixed-point arithmetic from closed evidence/exclusion/gap sets
      - for a burn pair allocate both UUIDs first, insert both rows, and defer the reciprocal composite FK and pair trigger until both are present
      - enforce exact paired kinds, shared definition/scope/batch/end/policy, reciprocal IDs/digests, threshold semantics, and identical derived alert state
      - append audit/outbox with immutable receipt IDs; no partial pair may commit
    cardinality: one nonpair receipt or exactly two reciprocal pair receipts; same window/digest replays, changed fact is SLI_FACT_CONFLICT
    acl: owner gurine_migrator; EXECUTE gurine_workflow_worker only
  ops.start_journey_instance_v1:
    sql_signature: (text,text,text,bigint,char(64),text,text,bigint,char(64),text,text,text,char(64),timestamptz,uuid,char(64),uuid) -> ops.journey_transition_receipts
    input_order: [journey_code, root_object_kind, root_object_id, root_object_version, root_object_digest, current_object_kind, current_object_id, current_object_version, current_object_digest, current_node_id, current_owner_kind, current_owner_function, current_owner_ref_hmac, due_at, request_id, idempotency_key_sha256, actor_assertion_jti]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    writes: [ops.idempotency_keys, ops.journey_instances, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    receipt_kinds: [INSTANCE_STARTED]
    events: [journey.instance_started.v1]
    statements:
      - claim JOURNEY_START through ops.claim_owner_idempotency_v1, resolve the exact J-01-through-J-12 compiled entry binding, and lock the concrete root object through its registered candidate key
      - derive current object, entry node, owner function, owner reference HMAC and SLA from the compiled binding; caller values are comparison-only
      - allocate the instance, receipt, audit and outbox IDs, insert one ACTIVE instance and one sequence-one INSTANCE_STARTED receipt, then bind the parent receipt head through the deferred composite FK
      - append journey.instance_started.v1 and return the stored receipt; no task, owner or state is synthesized outside the compiled registry
    cardinality: one journey per exact root tuple; exact replay returns the same receipt with zero writes and changed bytes are IDEMPOTENCY_CONFLICT
    acl: owner gurine_migrator; EXECUTE gurine_control_api and gurine_workflow_worker only
  ops.request_journey_handoff_v1:
    sql_signature: (uuid,bigint,text,char(64),uuid,char(64),uuid) -> ops.journey_transition_receipts
    input_order: [journey_instance_id, expected_version, edge_id, expected_current_object_digest, request_id, idempotency_key_sha256, actor_assertion_jti]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    writes: [ops.idempotency_keys, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    receipt_kinds: [HANDOFF_REQUESTED, HANDOFF_SUPERSEDED]
    events: [journey.handoff_requested.v1]
    statements:
      - claim JOURNEY_HANDOFF_REQUEST through ops.claim_owner_idempotency_v1, lock the journey instance, then any current handoff, concrete current object and immutable receipt head in the canonical journey lock order; reject terminal, stale or mismatched-object state with zero writes
      - resolve handoff kind, destination node, receiver kind/function/reference, capability, subject tuple, acknowledgement authority and SLA only from the exact journey-code plus edge-id compiled registry
      - for an ordinary request allocate generation=max+1 and receipt sequence+1, insert one immutable PENDING_ACK handoff and HANDOFF_REQUESTED receipt, then update the instance to WAITING_ACK with the exact next-owner and active-handoff tuple
      - only an exact compiled supersession policy may replace the current pending generation; update the old generation to SUPERSEDED and parent to the first intermediate version with one HANDOFF_SUPERSEDED receipt and audit, then insert generation+1 and update the parent again with one HANDOFF_REQUESTED receipt, audit and outbox
      - append journey.handoff_requested.v1 only for the new request step; the caller cannot provide or override routing, receiver, destination, capability, replacement, due policy or domain adapter
    cardinality:
      ordinary: {instance_updates: 1, old_handoff_updates: 0, new_handoffs: 1, receipts: 1, audits: 1, outbox: 1}
      compiled_supersession: {instance_updates: 2, old_handoff_updates: 1, new_handoffs: 1, receipts: 2, audits: 2, outbox: 1}
      conflict: arbitrary already-waiting request is HANDOFF_STATE_INVALID and writes zero rows; the partial unique constraint is the final concurrent-writer oracle
    acl: owner gurine_migrator; EXECUTE gurine_control_api and gurine_workflow_worker only
  ops.decide_journey_handoff_v1:
    sql_signature: (uuid,bigint,char(64),text,text,bytea,char(64),uuid,char(64),uuid) -> ops.journey_handoff_decision_result_v1
    input_order: [handoff_id, expected_handoff_version, expected_binding_digest, decision, reason_code, reason_encrypted, reason_digest, request_id, idempotency_key_sha256, assertion_jti]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    request_hash_preimage: [operation_id, handoff_id, expected_handoff_version, expected_binding_digest, decision, reason_code, reason_digest]
    request_hash_excludes: [request_id, assertion_jti, assertion_token_bytes, reason_encrypted, plaintext_reason]
    writes: [compiled domain owner relation, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    forbidden_writes: [ops.idempotency_keys, ops.assertion_replay_guard]
    receipt_kinds: [HANDOFF_ACKNOWLEDGED, HANDOFF_DECLINED, HANDOFF_REQUESTED]
    events: [journey.handoff_decided.v1, journey.handoff_requested.v1]
    statements:
      - require a same-transaction ops.prepare_journey_handoff_decision_v1 NEW receipt, then perform the one registry-authorized schema-qualified SELECT INTO STRICT from ops.idempotency_keys and require exact key, generation, recomputed seven-field business hash, BOUND_V1 all-null terminal tuple and claim_transaction_xid8=pg_current_xact_id(); zero idempotency DML/helper/owner calls are permitted and xmin is forbidden; FINAL_REPLAY never calls this routine
      - discover parent identity without a lock, then lock the parent instance, handoff, compiled domain rows and immutable receipt head in canonical order; resolve journey, edge, receiver, capability, destination and adapter only from persisted binding plus the compiled registry
      - capture one database clock value after instance and handoff locks; session_user fixes assertion_jti to ACTOR for gurine_control_api or SERVICE for gurine_workflow_worker, require the same MVCC-visible equal non-null Transaction-A attempt_transaction_xid8 proof with current-xid inequality, then validate the exact persisted human receiver or service acknowledgement authority with required capability and object scope and require the handoff current PENDING_ACK, strictly before due_at, and byte-equal to expected version and binding digest
      - for ACKNOWLEDGE apply the closed domain ownership adapter, advance handoff and instance versions, replace current owner with the persisted receiver, clear next-owner and active-handoff, and append one HANDOFF_ACKNOWLEDGED receipt
      - ACKNOWLEDGE requires reason_code, reason_encrypted and reason_digest all null; DECLINE requires a closed reason_code plus nonnull encrypted bytes and canonical reason_digest, and plaintext reason is never accepted by SQL
      - for DECLINE preserve current owner and terminalize the old handoff with one HANDOFF_DECLINED receipt and journey.handoff_decided.v1; if the exact compiled policy requires replacement, update the parent a second time and insert generation+1 plus one HANDOFF_REQUESTED receipt and journey.handoff_requested.v1
      - return the terminal decision receipt, nullable complete replacement receipt and final parent head; the caller serializes exact response bytes and calls ops.finalize_journey_handoff_decision_response_v1, which performs one pre-read, one owner-finalize, zero replay-owner calls and one complete persisted tuple/byte readback before committing the same transaction; stale, expired, wrong-receiver, wrong-digest, terminal and changed-replay requests mutate zero protected business rows
    cardinality:
      without_replacement: {instance_updates: 1, old_handoff_updates: 1, new_handoffs: 0, receipts: 1, audits: 1, outbox: 1}
      with_replacement: {instance_updates: 2, old_handoff_updates: 1, new_handoffs: 1, receipts: 2, audits: 2, outbox: 2}
      replay: a fresh assertion attempt precedes prepare FINAL_REPLAY; exact stored response bytes return with zero second protected business writes and without calling this apply routine
    acl: owner gurine_migrator; EXECUTE gurine_control_api and gurine_workflow_worker only; workflow execution requires the exact persisted service acknowledgement authority and request-bound service assertion; PUBLIC and every other role revoked
  ops.escalate_journey_handoff_v1:
    sql_signature: (uuid,bigint,uuid) -> ops.journey_scheduler_result_v1
    input_order: [handoff_id, expected_handoff_version, scheduler_run_id]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    writes: [ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    receipt_kinds: [HANDOFF_ESCALATED]
    events: [journey.handoff_escalated.v1]
    statements:
      - discover parent identity without locking, then lock the journey instance, PENDING_ACK handoff and immutable receipt head in canonical order and capture exactly one clock_timestamp value
      - resolve the next threshold and notification policy only from the exact twenty-row binding registry; advance NOT_DUE to DUE or DUE to ESCALATED without changing either owner or immutable handoff due_at
      - persist prior_due_at and the next scheduler checkpoint in resulting_due_at, update instance.due_at, and append one HANDOFF_ESCALATED receipt, journey.handoff_escalated.v1, audit and outbox
      - an exact applied replay returns the immutable receipt; NOT_DUE, NO_LONGER_CURRENT and VERSION_CONFLICT return a typed all-null transition group and write zero rows
    cardinality: one monotonic escalation edge or a typed zero-write scheduler result; a generation reaches DUE and ESCALATED at most once each
    acl: owner gurine_migrator; EXECUTE gurine_scheduler only
  ops.expire_journey_handoff_v1:
    sql_signature: (uuid,bigint,uuid) -> ops.journey_scheduler_result_v1
    input_order: [handoff_id, expected_handoff_version, scheduler_run_id]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    writes: [ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    receipt_kinds: [HANDOFF_EXPIRED, HANDOFF_REQUESTED]
    events: [journey.handoff_expired.v1, journey.handoff_requested.v1]
    statements:
      - discover parent identity without locking, then lock the journey instance, PENDING_ACK handoff and immutable receipt head in canonical order and capture exactly one clock_timestamp value
      - only at or after immutable handoff.due_at terminalize the old generation as EXPIRED, preserve current owner, resolve escalation and append one HANDOFF_EXPIRED receipt plus journey.handoff_expired.v1
      - if exact compiled policy requires replacement, update the parent a second time and insert generation+1 with one HANDOFF_REQUESTED receipt plus journey.handoff_requested.v1; otherwise finish in the exact ACTIVE, BLOCKED or EXPIRED state
      - a concurrent human decision has one winner; applied replay returns immutable receipts and every noncurrent, not-due or version-conflict result writes zero rows
    cardinality:
      without_replacement: {instance_updates: 1, old_handoff_updates: 1, new_handoffs: 0, receipts: 1, audits: 1, outbox: 1}
      with_replacement: {instance_updates: 2, old_handoff_updates: 1, new_handoffs: 1, receipts: 2, audits: 2, outbox: 2}
      no_op_or_replay: typed ops.journey_scheduler_result_v1; exact replay writes zero rows
    acl: owner gurine_migrator; EXECUTE gurine_scheduler only
  ops.record_journey_outcome_v1:
    sql_signature: (uuid,bigint,text,text,text,bigint,char(64),char(64),uuid,char(64),uuid) -> ops.journey_transition_receipts
    input_order: [journey_instance_id, expected_version, edge_id, outcome_code, subject_kind, subject_version, subject_digest, effect_digest, request_id, idempotency_key_sha256, actor_assertion_jti]
    transaction: SERIALIZABLE
    isolation_guard: journey_owner_routine_common.isolation_guard
    writes: [ops.idempotency_keys, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    receipt_kinds: [HANDOFF_CANCELLED, OUTCOME_RECORDED]
    events: [journey.outcome_recorded.v1]
    statements:
      - claim JOURNEY_OUTCOME through ops.claim_owner_idempotency_v1, lock the instance, current handoff if any, immutable receipt head and exact registered subject candidate key, then derive subject ID, outcome class and resulting state from the compiled edge/outcome registry
      - verify the effect receipt or projection digest is definitive rather than HTTP success, queueing, provider acceptance, AI output or synthetic evidence
      - when and only when the exact compiled terminal policy requires closing an active pending handoff, first terminalize it as CANCELLED and update the parent with one HANDOFF_CANCELLED receipt and audit but no journey event
      - append OUTCOME_RECORDED, update object/node/state/version and append journey.outcome_recorded.v1, audit and outbox; after either branch no active pending handoff remains
    cardinality:
      ordinary: {instance_updates: 1, handoff_updates: 0, receipts: 1, audits: 1, outbox: 1}
      terminal_with_pending_handoff: {instance_updates: 2, handoff_updates: 1, receipts: 2, audits: 2, outbox: 1}
      replay_or_invalid_effect: exact replay returns stored receipt with zero writes; changed or nondefinitive effect writes zero rows
    acl: owner gurine_migrator; EXECUTE gurine_control_api and gurine_workflow_worker only

grant_correction:
  rule: Any per-table INSERT shown above identifies the logical writer only; generated DDL MUST revoke that direct INSERT and grant only the matching mutation_entrypoints function. SELECT grants remain exactly as listed.
  reason: direct INSERT would bypass state, digest, idempotency, audit, outbox, quorum, hold, or receipt invariants

global_lock_order:
  - ops.idempotency_keys when command-scoped
  - root aggregate row (case, retention request, hold case/hold, incident, capability tuple, record class, or SLI window identity)
  - immutable target/version/snapshot rows in relation then primary-key order
  - conflict declarations/snapshots and review decisions in primary-key order
  - rights, consent, restriction, funding, activation, legal-hold placement/release, and kill-switch rows in relation then primary-key/sequence order
  - child decision/membership/event rows
  - ops.audit_chain_heads through ops.append_audit_event
  - ops.outbox through ops.enqueue_outbox
  - immutable command receipt/idempotency response

repository_roundtrip_common:
  rust_json_rule: every JSONB column maps to the named closed Rust type; serde_json::Value is forbidden
  row_cardinality: detail exactly one or RESOURCE_NOT_FOUND; pages 0..limit; mutations exactly one graph or explicit typed conflict
  no_synthesis: no missing ID, timestamp, state, digest, count, receipt, version, provider/legal proof, or null is invented by repository mapping
  required_oracles:
    - insert/read/recompute/reinsert preserves every scalar, array order, encrypted byte, decimal, timestamp, and digest
    - same idempotency and same bytes returns the stored receipt with zero new domain rows/events
    - changed bytes under one key is IDEMPOTENCY_CONFLICT
    - stale version/sequence has one winner in a 64-client race
    - invalid enum, bound, digest, array duplicate/order, FK, and graph parity fail with a typed error
    - PUBLIC and every undeclared runtime role fail SELECT/INSERT/UPDATE/DELETE
    - declared reader succeeds and direct INSERT/UPDATE/DELETE fails; only the declared owner function may append
    - active legal hold cells block matching destructive/disclosure action and partial releases change only exact released cells

acceptance_oracles:
  - id: AC-OA-TABLE-OPS-LEGAL-HOLD-TARGET-ANCHORS-CONTRACT
    assertion: all eight anchor variants round-trip exact concrete IDs/versions/digests; every cross-variant, missing-target, generic/concrete mismatch, ambiguous legacy row, UPDATE, DELETE, direct INSERT, and undeclared read is rejected
  - id: AC-OA-0028-INCIDENT-ALTER-ORDER
    assertion: a PostgreSQL 18.4 migration fixture containing every legacy status/severity proves the old status CHECK is dropped before conversion, legacy text is captured first, the rename happens only after new root checks validate, ops.incident_events plus its MIGRATION_BASELINE discriminator/detail/edge/version CHECKs exist and accept a rolled-back canary before baseline insertion, no updated_at trigger fires during conversion, and every legacy row gets exactly one event_sequence=1 MIGRATION_BASELINE event
  - id: AC-OA-0028-PG-TYPE-AND-WHOLE-ROW
    assertion: PostgreSQL 18.4 pg_attribute proves publication_gate_review_bindings.review_decision_kind and editorial.review_decisions.decision are both editorial.review_decision; the exact composite FK accepts APPROVE and rejects a mismatched enum tuple; pg_get_constraintdef proves the SLI CHECK calls ops.sli_window_arithmetic_is_valid with a 77-field declaration-order ROW constructor cast to ops.sli_window_receipts and valid/invalid arithmetic inserts pass/fail
  - id: AC-OA-0028-CLOSED-JSONB
    assertion: every named JSONB validator accepts canonical min/max fixtures and rejects unknown/missing keys, wrong discriminator, invalid scalar bounds, duplicate identities, noncanonical order, count mismatch, and extra nested keys through both direct INSERT and owner functions
  - id: AC-OA-0028-PRIVACY-RIGHT-DISCRIMINATOR
    assertion: ACCESS maps only to DISCLOSE_COPY, CORRECTION only to CORRECT, DELETION only to DESTRUCTIVE, and RESTRICTION only to RESTRICT_PROCESSING across root, inventory, decision, location actions, execution receipt, event, and completion; every cross-kind receipt FK fails
  - id: AC-OA-0028-RESTORATION-SUPPRESSION
    assertion: ACCESS creates zero suppression rows, CORRECTION creates permanent corrected-version replay fences, DELETION creates permanent DELETE/ANONYMIZE/CRYPTO_ERASE fences, RESTRICTION creates until-release RESTRICT_PROCESSING fences, and a restored backup remains inaccessible until the exact suppression set digest/count verifies and every correction/erasure/restriction action is reapplied
  - id: AC-OA-0028-NONCASE-HOLD
    assertion: SourceAsset, ResearchArtifact, PrivacyRequest, and CommunicationSubject placements and partial releases succeed without case/review IDs while CASE/PUBLICATION/EVIDENCE/RESPONSE require them; legacy anchor/cell/digest backfill succeeds before ops.reject_mutation is installed, then UPDATE/DELETE canaries fail; all variants enforce exact anchor/placement/release/conflict binding and multi-hold cell union
  - id: AC-OA-0028-CONFLICT-APPROVAL-BINDING
    assertion: capability legal/operational approvals and publication editor/legal/publisher bindings prove exact actor, APPROVE decision, receipt, proposal/snapshot digest, current CLEAR conflict snapshot, role, validity, and required separation; swapped actors, digests, roles, or snapshots fail at the owner procedure or composite FK
  - id: AC-OA-0028-PUBLICATION-RIGHTS
    assertion: PASS requires every public claim/evidence/source composite FK, CURRENT freshness, an exact ASSET_RIGHTS dimensional GRANT or RESPONSE_CONSENT or approved EDITORIAL_POLICY binding as appropriate, valid consent or policy-digested N/A, current policy/hold/privacy/funding/activation/switch graph, digest parity, and one bound revision; each missing/cross-kind/UNKNOWN/DENY/SUSPEND/REVOKE/expired binding yields BLOCKED and zero revisions
  - id: AC-OA-0028-SLI-RECIPROCAL-PAIR
    assertion: deferred 5m/1h at 14.4 and 30m/6h at 6.0 pairs commit only with reciprocal IDs/digests/kinds/sequences, same definition/scope/batch/end/policy and derived alert state; one-sided, crossed, stale-digest, unequal-threshold, or partial pairs fail at commit
  - id: AC-OA-0028-OWNER-ACL
    assertion: PUBLIC and undeclared roles have zero table/function/sequence privilege, runtime roles own nothing, declared roles can SELECT only declared columns/relations, direct mutation is denied, and every mutation succeeds only through the fixed-search-path owner procedure with one audit/outbox/receipt graph
  - id: AC-OA-0028-CATALOG-SET
    assertion: pg_catalog after migration has exactly the nineteen listed new relkind-r relations, one compatibility view, no unexpected relation/constraint/index/function/grant, and the source-derived 0028 and all-migration active-table counts
  - id: AC-OA-0028-JOURNEY-HANDOFF-SPINE
    assertion: PostgreSQL 18.4 proves exactly one pending handoff, generation history, gapless receipt chain, wrong-receiver and wrong-binding zero-write denial, owner change only with ACKNOWLEDGED receipt, deterministic decline/expiry replacement, exact replay with zero duplicate effect, changed replay conflict, direct DML denial, and restore parity for J-01 through J-12

blockers_and_required_upstream_closures:
  - id: B0028-001
    severity: BLOCKING
    status: CROSS_FILE_OPEN
    issue: No declared external or private operation records ConflictDeclaration, although governance.conflict_declared.v1 names control-api as producer.
    required_resolution: add one exact typed command and assurance/capability/receipt contract, or name the exact existing operation and extend its request/transaction; do not allow an undocumented direct insert.
  - id: B0028-002
    severity: BLOCKING
    status: RESOLVED_IN_0028_CONTRACT
    issue: releaseLegalHold returns CONFLICT_UNRESOLVED but the current conflict target vocabulary and operation bindings do not include LEGAL_HOLD/releaseLegalHold.
    required_resolution: extend ConflictSnapshot target/action vocabulary and bind a current CLEAR legal-releaser snapshot, or remove the error with an explicit alternative independence receipt.
  - id: B0028-003
    severity: BLOCKING
    status: RESOLVED_IN_0028_CONTRACT
    issue: addendum persistence requires a current approval receipt for hold release, while releaseLegalHold is outside ActionProposal and has no approvalReceipt field.
    required_resolution: declare whether the action-bound STEP_UP authorization plus conflict-clear/legal-authority receipt is sufficient, or add a dedicated legal approval receipt ID/digest to the request and table.
  - id: B0028-004
    severity: BLOCKING
    status: RESOLVED_IN_0028_CONTRACT_PENDING_SQL
    issue: active_legal_hold_idx and legacy active/released columns contradict multiple-hold union and append-only partial release.
    required_resolution: approve the altered-base contract, preflight historical rows, drop the unique index, make placement immutable, and derive coverage only from placements minus releases.
  - id: B0028-005
    severity: BLOCKING_FOR_UPGRADE_DATA
    status: RESOLVED_IN_0028_CONTRACT_PENDING_PREFLIGHT_FIXTURES
    issue: no lossless authority rule exists for historical active=false holds, malformed/duplicate affected_ids JSON, or missing canonical placement digest.
    required_resolution: migration preflight must fail to a reviewed remediation artifact; it may not invent cells, sequence, authority, or actors.
  - id: B0028-006
    severity: BLOCKING
    status: RESOLVED_IN_0028_CONTRACT_PENDING_SQL
    issue: ops.retention_requests lacks the identity/jurisdiction/SLA/scope/inventory/current-decision/current-receipt fields needed by new operations.
    required_resolution: freeze the staged ALTER and an evidence-backed legacy quarantine/backfill contract before DDL generation.
  - id: B0028-007
    severity: BLOCKING
    status: RESOLVED_IN_0028_CONTRACT_PENDING_APPROVAL
    issue: no normalized item-level retention inventory relation is allocated in the canonical 80-table additive set; a live query digest alone cannot prove all-location completion.
    required_resolution: approve an immutable encrypted inventory capsule and digest/count stored on the root request, or revise the canonical 80-table additive inventory to add snapshot/member relations.
  - id: B0028-008
    severity: BLOCKING
    status: CROSS_FILE_OPEN
    issue: APPROVED->COMPLETED is an external transitionRetentionRequest edge, but retention.execution_completed.v1 declares retention-worker as producer.
    required_resolution: choose one reconstructive sequence—worker receipt/event followed by human COMPLETE plus a distinct privacy decision event, or worker-owned completion that retires the external COMPLETE transition.
  - id: B0028-009
    severity: BLOCKING
    status: CROSS_FILE_OPEN
    issue: createPrivacyRequest/exchangePrivacyRequestReceiptToken/getPrivacyRequest lack an exact 0027 scoped-session persistence binding.
    required_resolution: bind privacy receipt token/session to exact communication-subject/endpoint/session relations and fixed-search-path functions; no raw token or direct submission grants.
  - id: B0028-010
    severity: BLOCKING
    status: RESOLVED_BY_0026_CANDIDATE_KEYS_PENDING_SQL
    issue: 0026 action decision/execution authorization/execution receipt candidate keys are not yet normative, so activation and schedule FKs cannot be emitted safely.
    required_resolution: freeze 0026 table columns and candidate keys, then compile all marked FKs before migration generation.
  - id: B0028-011
    severity: BLOCKING
    status: CROSS_FILE_OPEN
    issue: publishCase base command semantics and operation persistence do not select/insert the four gate tables or bind publication_revisions to the authoritative decision.
    required_resolution: replace the base transaction graph with evaluate_and_publish_case and update command semantics, operation persistence, runtime tests, OpenAPI error detail, and acceptance overlays without editing the base 271 bytes.
  - id: B0028-012
    severity: BLOCKING
    status: CROSS_FILE_OPEN
    issue: canonical publication blockers differ from base acceptance block-code vocabulary, and EVALUATOR_DIVERGENCE is required by DESIGN behavior but absent from its 14-code list.
    required_resolution: freeze the canonical 15-code catalog plus explicit legacy aliases, or revise DESIGN and mappings; storage must not contain competing aliases.
  - id: B0028-013
    severity: BLOCKING
