      - {name: review_snapshot_id, type: uuid, nullable: false, default: NONE, fk: editorial.review_snapshots(id) ON DELETE RESTRICT}
      - {name: review_snapshot_version, type: bigint, nullable: false, default: NONE}
      - {name: review_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: review_decision_kind, type: editorial.review_decision, nullable: false, default: "'APPROVE'::editorial.review_decision"}
      - {name: reviewer_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: counted_role, type: text, nullable: false, default: NONE}
      - {name: conflict_snapshot_id, type: uuid, nullable: false, default: NONE, fk: editorial.conflict_snapshots(id) ON DELETE RESTRICT}
      - {name: conflict_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: conflict_target_type, type: text, nullable: false, default: "'REVIEW_SNAPSHOT'"}
      - {name: conflict_target_id, type: text, nullable: false, default: NONE}
      - {name: conflict_target_version, type: bigint, nullable: false, default: NONE}
      - {name: conflict_target_digest, type: char(64), nullable: false, default: NONE}
      - {name: conflict_evaluation_state, type: text, nullable: false, default: "'CLEAR'"}
      - {name: conflict_valid_until, type: timestamptz, nullable: false, default: NONE}
      - {name: assignment_digest, type: char(64), nullable: false, default: NONE}
      - {name: binding_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: publication_gate_review_bindings_pkey, columns: [id]}
    uniques:
      - {name: publication_gate_review_bindings_ordinal_uq, columns: [decision_id, ordinal]}
      - {name: publication_gate_review_bindings_decision_uq, columns: [decision_id, review_decision_id]}
      - {name: publication_gate_review_bindings_reviewer_uq, columns: [decision_id, reviewer_user_id]}
      - {name: publication_gate_review_bindings_digest_uq, columns: [decision_id, binding_digest]}
    foreign_keys:
      - {name: publication_gate_review_bindings_review_fk, columns: [review_decision_id, review_snapshot_id, reviewer_user_id, review_decision_kind, review_decision_digest], references: "editorial.review_decisions(id,review_snapshot_id,reviewer_id,decision,decision_digest)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_review_bindings_snapshot_fk, columns: [review_snapshot_id, review_snapshot_version, review_snapshot_digest], references: "editorial.review_snapshots(id,case_version,snapshot_sha256)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_review_bindings_conflict_fk, columns: [conflict_snapshot_id, reviewer_user_id, conflict_target_type, conflict_target_id, conflict_target_version, conflict_target_digest, conflict_snapshot_digest, conflict_evaluation_state, conflict_valid_until], references: "editorial.conflict_snapshots(id,subject_actor_id,target_type,target_id,target_version,target_digest,snapshot_sha256,evaluation_state,valid_until)", on_delete: RESTRICT}
    checks:
      - {name: publication_gate_review_bindings_ordinal_ck, expression: "ordinal BETWEEN 1 AND 3"}
      - {name: publication_gate_review_bindings_role_ck, expression: "counted_role IN ('EDITOR','LEGAL_REVIEWER')"}
      - {name: publication_gate_review_bindings_exact_ck, expression: "review_snapshot_version > 0 AND review_decision_kind = 'APPROVE' AND conflict_target_type = 'REVIEW_SNAPSHOT' AND conflict_target_id = review_snapshot_id::text AND conflict_target_version = review_snapshot_version AND conflict_target_digest = review_snapshot_digest AND conflict_evaluation_state = 'CLEAR' AND conflict_valid_until > created_at"}
      - {name: publication_gate_review_bindings_digest_ck, expression: "ops.is_lower_sha256(review_decision_digest) AND ops.is_lower_sha256(review_snapshot_digest) AND ops.is_lower_sha256(conflict_snapshot_digest) AND ops.is_lower_sha256(conflict_target_digest) AND ops.is_lower_sha256(assignment_digest) AND ops.is_lower_sha256(binding_digest)"}
    indexes:
      - {name: publication_gate_review_bindings_order_idx, method: btree, keys: [decision_id, ordinal]}
      - {name: publication_gate_review_bindings_reviewer_idx, method: btree, keys: [reviewer_user_id, decision_id]}
    grants:
      gurine_control_api: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable reviewer identity binding available only to internal fixed roles}
    digest_and_concurrency:
      identity: decision_id+ordinal+review_decision_id
      parent_digest_rule: parent review_decision_set_digest/quorum_digest/conflict_digest are recomputed over ordered bindings and referenced snapshots
      counted_rule: referenced review decision is human APPROVE for the exact parent review snapshot; conflict snapshot is current CLEAR for that reviewer and role; publisher, author, other counted reviewers, recused actors, case parties, recipients, and executors are all distinct as required
      quorum_rule: LOW has exactly one editor; MEDIUM has two editors; HIGH has two editors plus one legal reviewer; duplicate human or role-slot reuse is impossible
    retention:
      record_class: PUBLICATION_GATE_REVIEW_BINDING
      trigger: parent decision
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: decision_id+review_decision_id
      backup_behavior: follows parent decision and publication revision
    roundtrip:
      read_order: [ordinal ASC]
      assertions: [human APPROVE only, exact snapshot, reviewer uniqueness, publisher/author separation, current CLEAR conflict snapshot, LOW/MEDIUM/HIGH quorum, binding digest, update/delete denial]

  - relation: editorial.publication_gate_blockers
    domain: PublicationGateDecision
    repository: crates/persistence-postgres::publication_gate
    logical_owner: publication-gate
    writer_components: [control-api]
    mutation: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: decision_id, type: uuid, nullable: false, default: NONE, fk: editorial.publication_gate_decisions(id) ON DELETE RESTRICT}
      - {name: ordinal, type: smallint, nullable: false, default: NONE}
      - {name: blocker_code, type: text, nullable: false, default: NONE}
      - {name: subject_type, type: text, nullable: false, default: NONE}
      - {name: subject_id, type: text, nullable: false, default: NONE}
      - {name: subject_version, type: bigint, nullable: true, default: NONE}
      - {name: subject_digest, type: char(64), nullable: false, default: NONE}
      - {name: detail_code, type: text, nullable: false, default: NONE}
      - {name: resolution_kind, type: text, nullable: false, default: NONE}
      - {name: resolution_operation_id, type: text, nullable: true, default: NONE}
      - {name: policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: blocker_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: publication_gate_blockers_pkey, columns: [id]}
    uniques:
      - {name: publication_gate_blockers_ordinal_uq, columns: [decision_id, ordinal]}
      - {name: publication_gate_blockers_fact_uq, columns: [decision_id, blocker_code, subject_type, subject_id, subject_digest]}
      - {name: publication_gate_blockers_digest_uq, columns: [decision_id, blocker_digest]}
    checks:
      - {name: publication_gate_blockers_ordinal_ck, expression: "ordinal BETWEEN 1 AND 256"}
      - {name: publication_gate_blockers_code_ck, expression: "blocker_code IN ('CASE_NOT_READY','SNAPSHOT_STALE','PREVIEW_STALE','CLAIM_EVIDENCE_INCOMPLETE','SOURCE_STALE','RESPONSE_POLICY_UNSATISFIED','RIGHTS_NOT_AUTHORIZED','PRIVACY_OR_RESTRICTION_BLOCKED','DISCLOSURE_HOLD_ACTIVE','CONFLICT_UNRESOLVED','QUORUM_INSUFFICIENT','LEGAL_APPROVAL_REQUIRED','LEGAL_ACTIVATION_NOT_APPROVED','KILL_SWITCH_ACTIVE','EVALUATOR_DIVERGENCE')"}
      - {name: publication_gate_blockers_subject_ck, expression: "subject_type IN ('CASE','SNAPSHOT','PREVIEW','CLAIM','EVIDENCE','SOURCE','RESPONSE_POLICY','RIGHTS_DECISION','RESTRICTION','LEGAL_HOLD','CONFLICT_SNAPSHOT','REVIEW_DECISION','ACTIVATION_DECISION','KILL_SWITCH','EVALUATOR') AND length(subject_id) BETWEEN 1 AND 512 AND (subject_version IS NULL OR subject_version > 0)"}
      - {name: publication_gate_blockers_detail_ck, expression: "length(detail_code) BETWEEN 1 AND 100"}
      - {name: publication_gate_blockers_resolution_ck, expression: "resolution_kind IN ('FIX_CASE','REBUILD_SNAPSHOT','REBUILD_PREVIEW','LINK_EVIDENCE','REFRESH_SOURCE','COMPLETE_RESPONSE_POLICY','REVISE_RIGHTS','REMOVE_RESTRICTION','RELEASE_HOLD','RESOLVE_CONFLICT','ADD_REVIEWER','OBTAIN_LEGAL_APPROVAL','ACTIVATE_CAPABILITY','DEACTIVATE_SWITCH','INVESTIGATE_EVALUATOR') AND (resolution_operation_id IS NULL OR resolution_operation_id ~ '^[A-Za-z][A-Za-z0-9]{1,127}$')"}
      - {name: publication_gate_blockers_digest_ck, expression: "ops.is_lower_sha256(subject_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(blocker_digest)"}
    indexes:
      - {name: publication_gate_blockers_order_idx, method: btree, keys: [decision_id, ordinal]}
      - {name: publication_gate_blockers_code_idx, method: btree, keys: [blocker_code, created_at DESC, decision_id]}
      - {name: publication_gate_blockers_subject_idx, method: btree, keys: [subject_type, subject_id, created_at DESC, decision_id]}
    grants:
      gurine_control_api: [SELECT]
    rls: {enabled: false, forced: false, reason: typed non-sensitive blocker facts; no direct external table access}
    digest_and_concurrency:
      identity: decision_id+ordinal
      parent_digest_rule: parent blocker_set_digest is SHA256 of canonical ordered blocker tuples; PASS has no rows and BLOCKED has at least one
      ordering: canonical blocker-code ordinal, then subject_type, subject_id, subject_version nulls first, subject_digest
      compatibility_error_mapping:
        MISSING_HUMAN_APPROVAL: QUORUM_INSUFFICIENT
        STALE_REVIEW_SNAPSHOT: SNAPSHOT_STALE
        LEGAL_REVIEW_REQUIRED: LEGAL_APPROVAL_REQUIRED
        RESPONSE_WINDOW_INCOMPLETE: RESPONSE_POLICY_UNSATISFIED
        UNRESOLVED_BLOCKING_CONDITION: CASE_NOT_READY
        KILL_SWITCH_ACTIVE: KILL_SWITCH_ACTIVE
        SOURCE_FRESHNESS_BLOCKED: SOURCE_STALE
      compatibility_rule: stored code is canonical; the base 271 acceptance vocabulary is an explicit response-mapping alias and never a second stored blocker
    retention:
      record_class: PUBLICATION_GATE_BLOCKER
      trigger: parent decision
      terminal_action: CRYPTO_ERASE
      preserved_after_crypto_erase: [code, subject digest, policy and blocker digest, resolution kind]
      legal_hold_key: decision_id+subject_type+subject_id
      backup_behavior: follows parent decision
    roundtrip:
      read_order: [ordinal ASC]
      assertions: [all 15 codes, subject shape, resolution mapping, canonical order/digest, PASS zero versus BLOCKED nonzero, base-code alias mapping, update/delete denial]

