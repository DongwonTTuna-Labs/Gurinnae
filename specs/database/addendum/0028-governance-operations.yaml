      - {name: effect_receipt_digest, type: char(64), nullable: true, staged_legacy: true}
    change: APPROVED draft execution is function-only and requires the current RETRACTION action authorization, independent quorum/conflict bindings, fresh snapshot and exact-byte tombstone preview. PASS inserts revision N+1 with content_variant RETRACTION_TOMBSTONE and never deletes or rewrites source bytes; BLOCKED inserts zero revision/effect receipt. The current URL remains and resolves to the visible tombstone plus immutable prior history.
  editorial.publication_access_decisions:
    additive_table_delta: 0
    additions:
      - {name: decision_kind, type: text, nullable: true, staged_legacy: true}
      - {name: decision_sequence, type: bigint, nullable: true, staged_legacy: true}
      - {name: prior_decision_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.publication_access_decisions(id) ON DELETE RESTRICT}
      - {name: scope_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: decision_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: publication_gate_decision_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.publication_gate_decisions(id) ON DELETE RESTRICT}
      - {name: notice_publication_revision_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.publication_revisions(id) ON DELETE RESTRICT}
      - {name: effect_receipt_digest, type: char(64), nullable: true, staged_legacy: true}
    change: post-0028 decisions are append-only PLACE|RELEASE|SUPERSEDE series; state is derived from the highest valid sequence, never updated in place. PLACE requires STEP_UP, legal/conflict authority, exact scope and fresh gate and creates revision N+1 RESTRICTION_NOTICE. expires_at is review_due_at only and emits work; it never releases or changes visibility. RELEASE requires a new STEP_UP/legal/conflict review, current scope/rights/hold/policy proof, fresh snapshot/preview/PASS gate and creates revision N+1 RESTRICTION_RELEASE. Stale/expired policy, UNKNOWN/DENY/SUSPEND/REVOKE rights, active disclosure hold, scope mismatch, or 64-way race loser creates zero revision/projection effect.

