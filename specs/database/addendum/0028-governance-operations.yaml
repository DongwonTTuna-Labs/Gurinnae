      - {name: sli_window_receipts_arithmetic_ck, expression: "ops.sli_window_arithmetic_is_valid(ROW(id,sli_id,definition_version,definition_digest,environment,scope_type,scope_id,scope_digest,capability_id,operation_id,sli_kind,window_kind,window_start,window_end,window_sequence,prior_receipt_id,prior_window_sequence,prior_window_end,prior_receipt_digest,evaluation_batch_id,measurement_kind,unit,target_operator,target_value,objective_good_ratio,quantile,expected_observation_count,observed_observation_count,missing_observation_count,excluded_count,maintenance_observation_count,eligible_count,good_count,bad_count,measured_value,error_budget_fraction,error_budget_allowed_count,error_budget_consumed_count,error_budget_remaining_count,error_budget_consumed_fraction,burn_rate,burn_policy_digest,burn_pair_kind,burn_threshold,paired_receipt_id,paired_window_kind,paired_window_sequence,paired_receipt_digest,burn_alert_state,latency_threshold_ms,evaluation_state,telemetry_state,missing_telemetry_reason,operational_state,evidence_set,evidence_item_count,incident_id,incident_event_id,incident_link_kind,exclusion_set,exclusion_set_digest,telemetry_gap_set,telemetry_gap_count,telemetry_gap_digest,evidence_set_digest,telemetry_query_digest,telemetry_backend_receipt_digest,source_watermark_digest,evaluator_config_digest,build_revision,evaluator_version,policy_digest,audit_event_id,outbox_event_id,evaluated_at,receipt_digest,created_at)::ops.sli_window_receipts)"}
      - {name: sli_window_receipts_latency_ck, expression: "(sli_kind = 'LATENCY' AND latency_threshold_ms IS NOT NULL AND latency_threshold_ms > 0) OR (sli_kind <> 'LATENCY' AND latency_threshold_ms IS NULL)"}
      - {name: sli_window_receipts_evaluation_ck, expression: "evaluation_state IN ('MET','BREACHED','UNKNOWN') AND telemetry_state IN ('COMPLETE','GAP') AND ((evaluation_state <> 'UNKNOWN' AND telemetry_state = 'COMPLETE' AND missing_observation_count = 0 AND eligible_count > 0 AND measured_value IS NOT NULL) OR (evaluation_state = 'UNKNOWN' AND (telemetry_state = 'GAP' OR eligible_count = 0) AND measured_value IS NULL AND burn_rate IS NULL))"}
      - {name: sli_window_receipts_missing_ck, expression: "missing_telemetry_reason IN ('NONE','NO_ELIGIBLE_OBSERVATIONS','HEARTBEAT_MISSING','QUERY_FAILED','BACKEND_UNAVAILABLE','SOURCE_WATERMARK_MISSING','EVIDENCE_INCOMPLETE') AND ((missing_telemetry_reason = 'NONE' AND telemetry_state = 'COMPLETE') OR (missing_telemetry_reason <> 'NONE' AND evaluation_state = 'UNKNOWN'))"}
      - {name: sli_window_receipts_operational_ck, expression: "operational_state IN ('OPERATIONAL','DEGRADED','INCIDENT','UNKNOWN_INTERNAL') AND ((operational_state IN ('INCIDENT','UNKNOWN_INTERNAL') AND incident_id IS NOT NULL) OR operational_state IN ('OPERATIONAL','DEGRADED'))"}
      - {name: sli_window_receipts_unknown_ck, expression: "telemetry_state <> 'GAP' OR operational_state = 'UNKNOWN_INTERNAL'"}
      - {name: sli_window_receipts_burn_pair_ck, expression: "(burn_pair_kind = 'NONE' AND burn_threshold IS NULL AND paired_receipt_id IS NULL AND paired_window_kind IS NULL AND paired_window_sequence IS NULL AND paired_receipt_digest IS NULL AND burn_alert_state = 'NOT_APPLICABLE') OR (burn_pair_kind = 'FAST_5M_1H' AND burn_threshold = 14.4 AND ((window_kind = 'FIVE_MINUTE' AND paired_window_kind = 'ONE_HOUR') OR (window_kind = 'ONE_HOUR' AND paired_window_kind = 'FIVE_MINUTE')) AND paired_receipt_id IS NOT NULL AND paired_window_sequence IS NOT NULL AND paired_receipt_digest IS NOT NULL AND burn_alert_state IN ('CLEAR','SINGLE_WINDOW_ONLY','FIRING')) OR (burn_pair_kind = 'SLOW_30M_6H' AND burn_threshold = 6.0 AND ((window_kind = 'THIRTY_MINUTE' AND paired_window_kind = 'SIX_HOUR') OR (window_kind = 'SIX_HOUR' AND paired_window_kind = 'THIRTY_MINUTE')) AND paired_receipt_id IS NOT NULL AND paired_window_sequence IS NOT NULL AND paired_receipt_digest IS NOT NULL AND burn_alert_state IN ('CLEAR','SINGLE_WINDOW_ONLY','FIRING'))"}
      - {name: sli_window_receipts_incident_link_ck, expression: "incident_link_kind IN ('NONE','SLO_BREACH_DETECTION','TELEMETRY_GAP_DETECTION','RESTORATION_EVIDENCE') AND ((incident_link_kind = 'NONE' AND incident_id IS NULL AND incident_event_id IS NULL) OR (incident_link_kind <> 'NONE' AND incident_id IS NOT NULL AND incident_event_id IS NOT NULL))"}
      - {name: sli_window_receipts_json_shape_ck, expression: "ops.sli_evidence_set_is_valid(evidence_set) AND ops.sli_exclusion_set_is_valid(exclusion_set) AND ops.sli_telemetry_gap_set_is_valid(telemetry_gap_set)"}
      - {name: sli_window_receipts_json_count_ck, expression: "evidence_item_count = jsonb_array_length(evidence_set->'items') AND excluded_count = ops.sli_exclusion_count(exclusion_set) AND telemetry_gap_count = jsonb_array_length(telemetry_gap_set->'items')"}
      - {name: sli_window_receipts_time_ck, expression: "evaluated_at >= window_end"}
      - {name: sli_window_receipts_version_text_ck, expression: "length(build_revision) BETWEEN 7 AND 128 AND length(evaluator_version) BETWEEN 1 AND 100"}
      - {name: sli_window_receipts_digest_ck, expression: "ops.is_lower_sha256(definition_digest) AND ops.is_lower_sha256(scope_digest) AND (prior_receipt_digest IS NULL OR ops.is_lower_sha256(prior_receipt_digest)) AND ops.is_lower_sha256(burn_policy_digest) AND (paired_receipt_digest IS NULL OR ops.is_lower_sha256(paired_receipt_digest)) AND ops.is_lower_sha256(exclusion_set_digest) AND ops.is_lower_sha256(telemetry_gap_digest) AND ops.is_lower_sha256(evidence_set_digest) AND ops.is_lower_sha256(telemetry_query_digest) AND ops.is_lower_sha256(telemetry_backend_receipt_digest) AND ops.is_lower_sha256(source_watermark_digest) AND ops.is_lower_sha256(evaluator_config_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: sli_window_receipts_latest_idx, method: btree, keys: [sli_id, definition_version, environment, scope_digest, window_kind, window_end DESC, window_sequence DESC, id DESC]}
      - {name: sli_window_receipts_capability_idx, method: btree, keys: [capability_id, window_end DESC, sli_id, id DESC]}
      - {name: sli_window_receipts_incident_idx, method: btree, keys: [incident_id, window_end DESC, id DESC], predicate: incident_id IS NOT NULL}
      - {name: sli_window_receipts_gap_idx, method: btree, keys: [window_end DESC, sli_id, id DESC], predicate: "telemetry_state = 'GAP'"}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable aggregate telemetry facts with no subject data or external direct access}
    digest_and_concurrency:
      identity: sli_id+definition_version+environment+scope_digest+window_kind+window_start+window_end
      canonical_digest: receipt_digest binds definition/query/config, scope/capability/operation, sequence/prior link, measurement/target/objective, exact counts and fixed-point arithmetic, evidence/exclusions/gaps, burn pair, telemetry/evaluation/operational state, incident, build/evaluator/policy, and evaluated time
      close_rule: same logical window plus identical digest returns the stored row; changed evidence/formula/digest is SLI_FACT_CONFLICT and never creates a correction row; a changed formula/query requires a new definition_version
      unknown_rule: missing required telemetry is GAP plus UNKNOWN_INTERNAL and a linked incident; public-relevant projection maps it to incident text and never operational
      alert_rule: a DEFERRABLE INITIALLY DEFERRED reciprocal-pair trigger locks the lower then higher UUID and requires A.paired_receipt_id=B.id, B.paired_receipt_id=A.id, reciprocal stored digests/window kinds/sequences, identical SLI definition/environment/scope/evaluation batch/window_end/policy/threshold/alert state, and distinct row IDs; FIRING requires both burn rates meet the pair threshold, SINGLE_WINDOW_ONLY exactly one, CLEAR neither; maintenance remains in eligible/bad counts and is not silently excluded
      month_rule: UTC_MONTH begins at 00:00:00Z on day one and ends at the next UTC month boundary
    retention:
      record_class: OPERATIONAL_SLI_WINDOW
      trigger: window_end plus approved operational schedule
      terminal_action: DELETE
      minimum: enough history for current UTC-month budget, alert reconstruction, incident/postmortem linkage, and capacity/recovery comparison; exact duration comes from record-class schedule rather than DDL
      legal_hold_key: incident_id when present, otherwise capability_id+sli_id+window range
      backup_behavior: receipts referenced by open incidents or restore evidence cannot be pruned
    roundtrip:
      read_order: [window_end DESC, window_start DESC, window_sequence DESC, id DESC]
      cursor: window_end+window_start+window_sequence+id
      assertions: [definition and query binding, exact decimal formulas, complete versus gap, zero eligible UNKNOWN, exclusions and maintenance inclusion, all SLI kinds, UTC month, gapless series, same-window fact conflict, reciprocal 14.4 and 6 burn pairs, incident/event requirement, immutable denial]

  - relation: ops.journey_instances
    domain: JourneyInstance
    repository: crates/persistence-postgres::journeys
    logical_owner: journey-coordination
    writer_components: [control-api, workflow-worker, scheduler]
    mutation: LIFECYCLE_GUARDED
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: journey_code, type: text, nullable: false, default: NONE}
      - {name: root_object_kind, type: text, nullable: false, default: NONE}
      - {name: root_object_id, type: text, nullable: false, default: NONE}
      - {name: root_object_version, type: bigint, nullable: false, default: NONE}
      - {name: root_object_digest, type: char(64), nullable: false, default: NONE}
      - {name: current_object_kind, type: text, nullable: false, default: NONE}
      - {name: current_object_id, type: text, nullable: false, default: NONE}
      - {name: current_object_version, type: bigint, nullable: false, default: NONE}
      - {name: current_object_digest, type: char(64), nullable: false, default: NONE}
      - {name: current_node_id, type: text, nullable: false, default: NONE}
      - {name: state, type: text, nullable: false, default: "'ACTIVE'"}
      - {name: version, type: bigint, nullable: false, default: '1'}
      - {name: current_owner_kind, type: text, nullable: false, default: NONE}
      - {name: current_owner_function, type: text, nullable: false, default: NONE}
      - {name: current_owner_ref_hmac, type: char(64), nullable: false, default: NONE}
      - {name: next_owner_kind, type: text, nullable: true, default: NONE}
      - {name: next_owner_function, type: text, nullable: true, default: NONE}
      - {name: next_owner_ref_hmac, type: char(64), nullable: true, default: NONE}
      - {name: due_at, type: timestamptz, nullable: false, default: NONE}
      - {name: active_handoff_id, type: uuid, nullable: true, default: NONE}
      - {name: active_handoff_generation, type: bigint, nullable: true, default: NONE}
      - {name: active_handoff_state, type: text, nullable: true, default: NONE}
      - {name: escalation_state, type: text, nullable: false, default: "'NOT_DUE'"}
      - {name: last_receipt_id, type: uuid, nullable: false, default: NONE}
      - {name: last_receipt_sequence, type: bigint, nullable: false, default: NONE}
      - {name: last_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: started_at, type: timestamptz, nullable: false, default: clock_timestamp()}
      - {name: updated_at, type: timestamptz, nullable: false, default: clock_timestamp()}
      - {name: terminal_at, type: timestamptz, nullable: true, default: NONE}
    primary_key: {name: journey_instances_pkey, columns: [id]}
    uniques:
      - {name: journey_instances_version_uq, columns: [id, version]}
      - {name: journey_instances_code_uq, columns: [id, journey_code]}
      - {name: journey_instances_receipt_head_uq, columns: [id, last_receipt_id, last_receipt_digest]}
      - {name: journey_instances_root_uq, columns: [journey_code, root_object_kind, root_object_id, root_object_version, root_object_digest]}
    foreign_keys:
      - {name: journey_instances_last_receipt_fk, columns: [last_receipt_id, id, version, last_receipt_digest], references: "ops.journey_transition_receipts(id,journey_instance_id,journey_instance_version,receipt_digest)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
      - {name: journey_instances_active_handoff_fk, columns: [active_handoff_id, id, active_handoff_generation, active_handoff_state], references: "ops.journey_handoffs(id,journey_instance_id,generation,state)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
    checks:
      - {name: journey_instances_code_ck, expression: "journey_code IN ('J-01','J-02','J-03','J-04','J-05','J-06','J-07','J-08','J-09','J-10','J-11','J-12')"}
      - {name: journey_instances_object_ck, expression: "length(root_object_kind) BETWEEN 1 AND 100 AND length(root_object_id) BETWEEN 1 AND 512 AND root_object_version > 0 AND length(current_object_kind) BETWEEN 1 AND 100 AND length(current_object_id) BETWEEN 1 AND 512 AND current_object_version > 0 AND length(current_node_id) BETWEEN 1 AND 200"}
      - {name: journey_instances_state_ck, expression: "state IN ('ACTIVE','WAITING_ACK','BLOCKED','RECONCILIATION_REQUIRED','COMPLETED','CANCELLED','EXPIRED','REJECTED')"}
      - {name: journey_instances_owner_ck, expression: "current_owner_kind IN ('HUMAN_USER','HUMAN_ROLE','SERVICE','WORKER','QUEUE') AND length(current_owner_function) BETWEEN 1 AND 160 AND ((next_owner_kind IS NULL AND next_owner_function IS NULL AND next_owner_ref_hmac IS NULL) OR (next_owner_kind IN ('HUMAN_USER','HUMAN_ROLE','SERVICE','WORKER','QUEUE') AND length(next_owner_function) BETWEEN 1 AND 160 AND next_owner_ref_hmac IS NOT NULL))"}
      - {name: journey_instances_handoff_ck, expression: "(state = 'WAITING_ACK' AND active_handoff_id IS NOT NULL AND active_handoff_generation > 0 AND active_handoff_state = 'PENDING_ACK' AND next_owner_kind IS NOT NULL) OR (state <> 'WAITING_ACK' AND active_handoff_id IS NULL AND active_handoff_generation IS NULL AND active_handoff_state IS NULL AND next_owner_kind IS NULL AND next_owner_function IS NULL AND next_owner_ref_hmac IS NULL)"}
      - {name: journey_instances_escalation_ck, expression: "escalation_state IN ('NOT_DUE','DUE','ESCALATED','RESOLVED')"}
      - {name: journey_instances_terminal_ck, expression: "(state IN ('COMPLETED','CANCELLED','EXPIRED','REJECTED') AND terminal_at IS NOT NULL) OR (state NOT IN ('COMPLETED','CANCELLED','EXPIRED','REJECTED') AND terminal_at IS NULL)"}
      - {name: journey_instances_sequence_ck, expression: "version > 0 AND last_receipt_sequence = version AND updated_at >= started_at AND (terminal_at IS NULL OR terminal_at >= started_at)"}
      - {name: journey_instances_digest_ck, expression: "ops.is_lower_sha256(root_object_digest) AND ops.is_lower_sha256(current_object_digest) AND ops.is_lower_sha256(current_owner_ref_hmac) AND (next_owner_ref_hmac IS NULL OR ops.is_lower_sha256(next_owner_ref_hmac)) AND ops.is_lower_sha256(last_receipt_digest)"}
    indexes:
      - {name: journey_instances_owner_due_idx, method: btree, keys: [current_owner_function, due_at ASC, id ASC], predicate: "state NOT IN ('COMPLETED','CANCELLED','EXPIRED','REJECTED')"}
      - {name: journey_instances_root_idx, method: btree, keys: [root_object_kind, root_object_id, root_object_version DESC, id DESC]}
      - {name: journey_instances_handoff_idx, method: btree, keys: [active_handoff_id, active_handoff_generation], predicate: active_handoff_id IS NOT NULL}
      - {name: journey_instances_receipt_fk_idx, method: btree, keys: [last_receipt_id, id, version, last_receipt_digest]}
      - {name: journey_instances_active_handoff_fk_idx, method: btree, keys: [active_handoff_id, id, active_handoff_generation, active_handoff_state], predicate: active_handoff_id IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
    rls: {enabled: false, forced: false, reason: internal digest-bound coordination state; every mutation is through an exact owner routine and no browser or public role has direct access}
    mutability:
      mode: LIFECYCLE_GUARDED
      immutable_columns: [id, journey_code, root_object_kind, root_object_id, root_object_version, root_object_digest, started_at]
      mutable_columns: [current_object_kind, current_object_id, current_object_version, current_object_digest, current_node_id, state, version, current_owner_kind, current_owner_function, current_owner_ref_hmac, next_owner_kind, next_owner_function, next_owner_ref_hmac, due_at, active_handoff_id, active_handoff_generation, active_handoff_state, escalation_state, last_receipt_id, last_receipt_sequence, last_receipt_digest, updated_at, terminal_at]
      guard_trigger: ops.guard_journey_instance_update_v1()
      delete: FORBIDDEN_UNTIL_RETENTION_GRAPH_DELETE
    constraint_triggers:
      - ops.check_journey_instance_head_v1 verifies last receipt ID, sequence, version and digest plus active-handoff and owner parity at commit
      - ops.check_journey_instance_transition_v1 compiles the exact J-01-through-J-12 edge prior/result state matrix and rejects every undeclared update
    digest_and_concurrency:
      identity: journey_code+root_object_kind+root_object_id+root_object_version+root_object_digest
      canonical_digest: every receipt binds the immutable root, current object and node, owner bindings, handoff generation, state, due time, escalation state, version and prior receipt head
      write_rule: one SERIALIZABLE owner routine locks idempotency then the journey row, domain row, handoff and receipt head; current owner changes only in the same transaction as an acknowledged handoff receipt
      replay_rule: exact request bytes return the stored decision receipt; changed bytes, stale version, wrong owner or changed subject digest write zero rows
    retention:
      record_class: JOURNEY_COORDINATION
      trigger: terminal_at plus the longest governing subject, audit, delivery, paid-value or legal-hold schedule
      terminal_action: DELETE
      legal_hold_key: root_object_kind+root_object_id+root_object_digest
      backup_behavior: instance, handoff and receipt chain restore atomically before any pending task becomes actionable
    roundtrip:
      read_order: [updated_at DESC, id DESC]
      cursor: updated_at+id
      assertions: [J-01 through J-12, one open handoff, owner switch only on acknowledgement, terminal no-open-handoff, exact replay, changed replay conflict, restore chain]

