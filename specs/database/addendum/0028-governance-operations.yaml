  - {ordinal: 14, relation: editorial.publication_gate_review_bindings}
  - {ordinal: 15, relation: editorial.publication_gate_blockers}
  - {ordinal: 16, relation: ops.sli_window_receipts}
  - {ordinal: 17, relation: ops.journey_instances}
  - {ordinal: 18, relation: ops.journey_handoffs}
  - {ordinal: 19, relation: ops.journey_transition_receipts}
migration_phase_order:
  - preflight exact base catalog, constraints, triggers, grants, enum labels, legacy row shapes, and immutable input digests; any ambiguity aborts without DDL
  - create relations 1 through 10 without forward/cyclic FKs; install only helper functions whose argument types already exist
  - perform the ops.source_incidents column conversion and rename through the rename step in altered_base_relations under ACCESS EXCLUSIVE lock
  - create the closed incident-detail validator, then relation 11 ops.incident_events with MIGRATION_BASELINE already admitted by every relevant CHECK; only after catalog proof insert exactly one baseline event per legacy incident
  - create relations 12 through 16; create ops.sli_window_receipts without its whole-row arithmetic CHECK, create ops.sli_window_arithmetic_is_valid(ops.sli_window_receipts), then add and validate the CHECK with an exact declaration-order ROW constructor cast to ops.sli_window_receipts
  - create relations 17 through 19 without their cyclic/deferred journey foreign keys, then add the instance, handoff, receipt-head and prior-receipt graph constraints only after all three candidate-key sets exist
  - backfill typed legal-hold anchors, placement digests, and other staged legacy columns only from reconstructible bytes; validate constraints and NOT NULL, then install legal-hold immutability guards
  - add forward/cyclic/deferred composite FKs and constraint triggers; install fixed-search-path owner procedures; revoke all direct runtime writes and reset exact SELECT/EXECUTE grants
  - run pg_catalog set equality, privilege canaries, acceptance_oracles, and commit only when warnings and errors are zero

physical_policy:
  owner: gurine_migrator
  uuid_default: gen_random_uuid()
  digest_type: char(64)
  digest_check: "VALUE ~ '^[0-9a-f]{64}$'"
  timestamp_type: timestamptz
  timestamps_are_utc: true
  runtime_role_object_ownership: forbidden
  runtime_role_bypassrls: forbidden
  public_privileges: none
  default_privileges:
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA editorial REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA editorial REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
  per_relation_revokes:
    - REVOKE ALL ON TABLE <relation> FROM PUBLIC
    - REVOKE UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE <relation> FROM every runtime role
  immutable_trigger: BEFORE UPDATE OR DELETE FOR EACH ROW EXECUTE FUNCTION ops.reject_mutation()
  rls_default:
    enabled: false
    forced: false
    reason: These nineteen relations are internal single-deployment governance and journey-coordination records; no browser, public, submission-session, or cross-organization direct table access exists. External reads and journey decisions remain owner-controlled SECURITY DEFINER projections over exact persisted bindings.

