      - {name: freshness_state, type: text, nullable: false, default: NONE}
      - {name: freshness_policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: source_locator_digest, type: char(64), nullable: false, default: NONE}
      - {name: rights_binding_kind, type: text, nullable: false, default: NONE}
      - {name: rights_binding_digest, type: char(64), nullable: false, default: NONE}
      - {name: asset_rights_decision_id, type: uuid, nullable: true, default: NONE, fk: raw.asset_rights_decisions(id) ON DELETE RESTRICT}
      - {name: asset_rights_digest, type: char(64), nullable: true, default: NONE}
      - {name: asset_rights_decision_version, type: bigint, nullable: true, default: NONE}
      - {name: asset_rights_decision_kind, type: text, nullable: true, default: NONE}
      - {name: asset_access_right, type: text, nullable: true, default: NONE}
      - {name: asset_excerpt_right, type: text, nullable: true, default: NONE}
      - {name: asset_redistribution_right, type: text, nullable: true, default: NONE}
      - {name: asset_commercial_use_right, type: text, nullable: true, default: NONE}
      - {name: asset_public_display_right, type: text, nullable: true, default: NONE}
      - {name: asset_rights_effective_at, type: timestamptz, nullable: true, default: NONE}
      - {name: asset_rights_expires_at, type: timestamptz, nullable: true, default: NONE}
      - {name: publication_consent_state, type: text, nullable: false, default: NONE}
      - {name: publication_consent_digest, type: char(64), nullable: false, default: NONE}
      - {name: matrix_row_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: publication_gate_claim_evidence_pkey, columns: [id]}
    uniques:
      - {name: publication_gate_claim_evidence_ordinal_uq, columns: [decision_id, ordinal]}
      - {name: publication_gate_claim_evidence_pair_uq, columns: [decision_id, claim_id, claim_version, evidence_id, evidence_version]}
      - {name: publication_gate_claim_evidence_row_digest_uq, columns: [decision_id, matrix_row_digest]}
    foreign_keys:
      - {name: publication_gate_claim_evidence_link_fk, columns: [claim_id, evidence_id, supports], references: "editorial.claim_evidence(claim_id,evidence_id,supports)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_claim_evidence_claim_fk, columns: [claim_id, claim_version, claim_digest], references: "editorial.claims(id,version,claim_digest)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_claim_evidence_evidence_fk, columns: [evidence_id, evidence_version, evidence_digest], references: "editorial.evidence(id,version,evidence_digest)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_claim_evidence_source_asset_fk, columns: [source_document_id, source_asset_id, source_asset_revision, source_digest], references: "raw.source_documents(id,asset_id,asset_revision,content_sha256)", on_delete: RESTRICT}
      - {name: publication_gate_claim_evidence_response_fk, columns: [response_id, response_version, response_content_digest, publication_consent_digest], references: "editorial.responses(id,version,content_sha256,publication_consent_sha256)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_claim_evidence_editorial_source_fk, columns: [editorial_source_evidence_id, editorial_source_evidence_version, editorial_source_evidence_digest], references: "editorial.evidence(id,version,evidence_digest)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: publication_gate_claim_evidence_rights_fk, columns: [asset_rights_decision_id, asset_rights_digest], references: "raw.asset_rights_decisions(id,decision_sha256)", on_delete: RESTRICT, exact_dimension_guard: owner procedure locks this row and compares decision_version, decision_kind, all copied rights dimensions, effective_at, and expires_at before parent insertion}
    checks:
      - {name: publication_gate_claim_evidence_ordinal_ck, expression: "ordinal BETWEEN 1 AND 100000 AND claim_version > 0 AND evidence_version > 0"}
      - {name: publication_gate_claim_evidence_supports_ck, expression: "supports IN ('FACT','CALCULATION','LIMITATION','CONTEXT')"}
      - {name: publication_gate_claim_evidence_source_ck, expression: "source_ref_type IN ('RAW_SOURCE_DOCUMENT','RESPONSE_SUBMISSION','EDITORIAL_RECORD') AND length(source_ref_id) BETWEEN 1 AND 512 AND length(source_version) BETWEEN 1 AND 512 AND ((source_ref_type = 'RAW_SOURCE_DOCUMENT' AND source_document_id IS NOT NULL AND source_asset_id IS NOT NULL AND source_asset_revision > 0 AND response_id IS NULL AND response_version IS NULL AND response_content_digest IS NULL AND editorial_source_evidence_id IS NULL AND editorial_source_evidence_version IS NULL AND editorial_source_evidence_digest IS NULL) OR (source_ref_type = 'RESPONSE_SUBMISSION' AND response_id IS NOT NULL AND response_version > 0 AND response_content_digest IS NOT NULL AND source_document_id IS NULL AND source_asset_id IS NULL AND source_asset_revision IS NULL AND editorial_source_evidence_id IS NULL AND editorial_source_evidence_version IS NULL AND editorial_source_evidence_digest IS NULL) OR (source_ref_type = 'EDITORIAL_RECORD' AND editorial_source_evidence_id IS NOT NULL AND editorial_source_evidence_version > 0 AND editorial_source_evidence_digest IS NOT NULL AND source_document_id IS NULL AND source_asset_id IS NULL AND source_asset_revision IS NULL AND response_id IS NULL AND response_version IS NULL AND response_content_digest IS NULL))"}
      - {name: publication_gate_claim_evidence_source_binding_ck, expression: "(source_ref_type = 'RAW_SOURCE_DOCUMENT' AND source_ref_id = source_document_id::text AND source_version = source_asset_revision::text) OR (source_ref_type = 'RESPONSE_SUBMISSION' AND source_ref_id = response_id::text AND source_version = response_version::text AND source_digest = response_content_digest) OR (source_ref_type = 'EDITORIAL_RECORD' AND source_ref_id = editorial_source_evidence_id::text AND source_version = editorial_source_evidence_version::text AND source_digest = editorial_source_evidence_digest)"}
      - {name: publication_gate_claim_evidence_freshness_ck, expression: "freshness_state IN ('CURRENT','STALE','UNKNOWN')"}
      - {name: publication_gate_claim_evidence_rights_shape_ck, expression: "(rights_binding_kind = 'ASSET_RIGHTS' AND source_ref_type <> 'RESPONSE_SUBMISSION' AND num_nonnulls(asset_rights_decision_id,asset_rights_digest,asset_rights_decision_version,asset_rights_decision_kind,asset_access_right,asset_excerpt_right,asset_redistribution_right,asset_commercial_use_right,asset_public_display_right,asset_rights_effective_at) = 10) OR (rights_binding_kind = 'RESPONSE_CONSENT' AND source_ref_type = 'RESPONSE_SUBMISSION' AND num_nonnulls(asset_rights_decision_id,asset_rights_digest,asset_rights_decision_version,asset_rights_decision_kind,asset_access_right,asset_excerpt_right,asset_redistribution_right,asset_commercial_use_right,asset_public_display_right,asset_rights_effective_at,asset_rights_expires_at) = 0) OR (rights_binding_kind = 'EDITORIAL_POLICY' AND source_ref_type = 'EDITORIAL_RECORD' AND num_nonnulls(asset_rights_decision_id,asset_rights_digest,asset_rights_decision_version,asset_rights_decision_kind,asset_access_right,asset_excerpt_right,asset_redistribution_right,asset_commercial_use_right,asset_public_display_right,asset_rights_effective_at,asset_rights_expires_at) = 0)"}
      - {name: publication_gate_claim_evidence_rights_ck, expression: "rights_binding_kind <> 'ASSET_RIGHTS' OR (asset_rights_decision_version > 0 AND asset_rights_decision_kind = 'GRANT' AND asset_access_right = 'ALLOW' AND asset_excerpt_right = 'ALLOW' AND asset_redistribution_right = 'ALLOW' AND asset_commercial_use_right = 'ALLOW' AND asset_public_display_right = 'ALLOW' AND (asset_rights_expires_at IS NULL OR asset_rights_expires_at > asset_rights_effective_at))"}
      - {name: publication_gate_claim_evidence_consent_ck, expression: "(source_ref_type = 'RESPONSE_SUBMISSION' AND publication_consent_state = 'AUTHORIZED') OR (source_ref_type <> 'RESPONSE_SUBMISSION' AND publication_consent_state IN ('AUTHORIZED','NOT_APPLICABLE_POLICY'))"}
      - {name: publication_gate_claim_evidence_digest_ck, expression: "ops.is_lower_sha256(claim_digest) AND ops.is_lower_sha256(evidence_digest) AND ops.is_lower_sha256(source_digest) AND (response_content_digest IS NULL OR ops.is_lower_sha256(response_content_digest)) AND (editorial_source_evidence_digest IS NULL OR ops.is_lower_sha256(editorial_source_evidence_digest)) AND ops.is_lower_sha256(freshness_policy_digest) AND ops.is_lower_sha256(source_locator_digest) AND ops.is_lower_sha256(rights_binding_digest) AND (asset_rights_digest IS NULL OR ops.is_lower_sha256(asset_rights_digest)) AND ops.is_lower_sha256(publication_consent_digest) AND ops.is_lower_sha256(matrix_row_digest)"}
    indexes:
      - {name: publication_gate_claim_evidence_order_idx, method: btree, keys: [decision_id, ordinal]}
      - {name: publication_gate_claim_evidence_claim_idx, method: btree, keys: [claim_id, claim_version, decision_id]}
      - {name: publication_gate_claim_evidence_evidence_idx, method: btree, keys: [evidence_id, evidence_version, decision_id]}
      - {name: publication_gate_claim_evidence_source_idx, method: btree, keys: [source_ref_type, source_ref_id, source_version, decision_id]}
    grants:
      gurine_control_api: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable matrix contains only opaque IDs/digests and is never exposed directly to public or submission roles}
    digest_and_concurrency:
      identity: decision_id+ordinal
      parent_digest_rule: parent claim_revision_set_digest and claim_evidence_matrix_digest are recomputed over ordered rows; every public factual claim revision has at least one valid row and every row resolves to the exact base claim-evidence link
      source_rule: CURRENT is mandatory for PASS; STALE or UNKNOWN creates SOURCE_STALE; every source variant is a concrete composite FK; ASSET_RIGHTS locks the exact dimensional decision and requires GRANT plus ALLOW for access, excerpt, redistribution, commercial use, and public display at parent evaluated_at; RESPONSE_CONSENT binds the immutable response consent digest; EDITORIAL_POLICY is allowed only for an editorial record with an exact independently approved policy digest; missing or cross-kind bindings block
      replay: row set is inserted only inside the publication gate function; same decision digest reuses the existing graph
    retention:
      record_class: PUBLICATION_GATE_CLAIM_EVIDENCE
      trigger: parent decision
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: decision_id+claim_id+evidence_id
      backup_behavior: IDs and digests restore before public revision projection
    roundtrip:
      read_order: [ordinal ASC]
      assertions: [composite claim-evidence FK, exact versions/digests, three source variants, current/stale/unknown, rights and consent binding, matrix order/digest, mutation denial]

