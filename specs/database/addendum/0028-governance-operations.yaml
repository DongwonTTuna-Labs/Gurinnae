    checks:
      - {name: restoration_suppressions_subject_ck, expression: "subject_type IN ('PERSON','ORGANIZATION','RESPONSE_PARTY','COMMUNICATION_SUBJECT')"}
      - {name: restoration_suppressions_request_type_ck, expression: "request_type IN ('CORRECTION','DELETION','RESTRICTION')"}
      - {name: restoration_suppressions_scope_ck, expression: "scope_kind IN ('ALL_SUBJECT_DATA','RECORD_CLASS','RELATION_ROW','OBJECT_KEY','BACKUP_GENERATION')"}
      - {name: restoration_suppressions_scope_shape_ck, expression: "(scope_kind = 'ALL_SUBJECT_DATA' AND record_class IS NULL AND scope_ref_hmac IS NULL) OR (scope_kind = 'RECORD_CLASS' AND record_class IS NOT NULL AND scope_ref_hmac IS NULL) OR (scope_kind IN ('RELATION_ROW','OBJECT_KEY','BACKUP_GENERATION') AND scope_ref_hmac IS NOT NULL)"}
      - {name: restoration_suppressions_action_ck, expression: "(request_type = 'CORRECTION' AND terminal_action = 'REPLAY_CORRECTED_VERSION') OR (request_type = 'DELETION' AND terminal_action IN ('DELETE','ANONYMIZE','CRYPTO_ERASE')) OR (request_type = 'RESTRICTION' AND terminal_action = 'RESTRICT_PROCESSING')"}
      - {name: restoration_suppressions_reason_ck, expression: "(request_type = 'CORRECTION' AND reason_code = 'PRIVACY_CORRECTION_COMPLETED') OR (request_type = 'DELETION' AND reason_code = 'PRIVACY_DELETION_COMPLETED') OR (request_type = 'RESTRICTION' AND reason_code = 'PRIVACY_RESTRICTION_ACTIVE')"}
      - {name: restoration_suppressions_permanence_ck, expression: "(request_type IN ('CORRECTION','DELETION') AND expires_at IS NULL) OR request_type = 'RESTRICTION'"}
      - {name: restoration_suppressions_time_ck, expression: "expires_at IS NULL OR expires_at > effective_at"}
      - {name: restoration_suppressions_worker_ck, expression: "length(created_by_worker) BETWEEN 1 AND 255"}
      - {name: restoration_suppressions_digest_ck, expression: "ops.is_lower_sha256(subject_ref_hash) AND (scope_ref_hmac IS NULL OR ops.is_lower_sha256(scope_ref_hmac)) AND ops.is_lower_sha256(subject_scope_digest) AND ops.is_lower_sha256(schedule_digest) AND ops.is_lower_sha256(suppression_digest)"}
    indexes:
      - {name: restoration_suppressions_subject_idx, method: btree, keys: [subject_ref_hash, effective_at DESC, id DESC]}
      - {name: restoration_suppressions_scope_idx, method: btree, keys: [subject_scope_digest, effective_at DESC, id DESC]}
      - {name: restoration_suppressions_expiry_idx, method: btree, keys: [expires_at, id], predicate: expires_at IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls:
      enabled: false
      forced: false
      reason: hash/HMAC-only internal restore fence
      denied_roles: [gurine_submission_api, gurine_public_api]
    digest_and_concurrency:
      identity: suppression_id and subject_scope_digest+source_decision_id+schedule_id
      canonical_digest: suppression_digest binds only hashes/HMACs, request type, action/reason, source request/decision, schedule, and effective range; no raw identity or object key is stored
      insert_rule: same natural identity/digest is idempotent; changed scope or action is a new row; no update or automatic expiry deletion
      restore_rule: every restore evaluates matching subject, record-class, row, object, and backup-generation suppressions before making bytes readable, searchable, processable, exportable, or eligible for provider egress; correction rows replay the exact corrected immutable version before activation, deletion rows remove/fence bytes, and restriction rows keep processing disabled until an authorized release fact
    retention:
      record_class: RESTORATION_SUPPRESSION
      trigger: last potentially restorable backup generation expires
      terminal_action: PRESERVE_PUBLIC_REVISION
      minimum: permanent deletion/anonymization/crypto-erase suppression outlives every restorable backup and key generation
      legal_hold_key: subject_scope_digest
      backup_behavior: suppression set is restored first and activation remains fenced until its digest verifies
    roundtrip:
      read_order: [effective_at DESC, id DESC]
      assertions: [scope shape matrix, no raw identifier, permanent deletion suppression, temporary restriction expiry, idempotent replay, restore-before-access fence, update/delete denial]

  - relation: editorial.legal_hold_releases
    domain: LegalHoldCoverage
    repository: crates/persistence-postgres::retention
    logical_owner: trust-governance
    writer_components: [control-api]
    mutation: APPEND_ONLY
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: hold_id, type: uuid, nullable: false, default: NONE, fk: editorial.legal_holds(id) ON DELETE RESTRICT}
      - {name: hold_version, type: bigint, nullable: false, default: NONE}
      - {name: original_hold_digest, type: char(64), nullable: false, default: NONE}
      - {name: target_anchor_id, type: uuid, nullable: false, default: NONE, fk: ops.legal_hold_target_anchors(id) ON DELETE RESTRICT}
      - {name: target_anchor_digest, type: char(64), nullable: false, default: NONE}
      - {name: release_context_kind, type: text, nullable: false, default: NONE}
      - {name: release_sequence, type: bigint, nullable: false, default: NONE}
      - {name: prior_release_id, type: uuid, nullable: true, default: NONE, fk: editorial.legal_hold_releases(id) ON DELETE RESTRICT}
      - {name: prior_release_digest, type: char(64), nullable: true, default: NONE}
      - {name: case_id, type: uuid, nullable: true, default: NONE, fk: editorial.cases(id) ON DELETE RESTRICT}
      - {name: review_snapshot_id, type: uuid, nullable: true, default: NONE, fk: editorial.review_snapshots(id) ON DELETE RESTRICT}
      - {name: expected_case_version, type: bigint, nullable: true, default: NONE}
      - {name: released_scope_atoms, type: 'text[]', nullable: false, default: NONE}
      - {name: affected_ids, type: 'uuid[]', nullable: false, default: NONE}
      - {name: affected_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: prior_coverage_digest, type: char(64), nullable: false, default: NONE}
      - {name: resulting_coverage_digest, type: char(64), nullable: false, default: NONE}
      - {name: release_authority_reference, type: text, nullable: false, default: NONE}
      - {name: authority_reference_digest, type: char(64), nullable: false, default: NONE}
      - {name: reason_code, type: text, nullable: false, default: NONE}
      - {name: reason, type: text, nullable: false, default: NONE}
      - {name: released_by_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: conflict_snapshot_id, type: uuid, nullable: false, default: NONE, fk: editorial.conflict_snapshots(id) ON DELETE RESTRICT}
      - {name: conflict_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: conflict_target_type, type: text, nullable: false, default: "'LEGAL_HOLD'"}
      - {name: conflict_target_id, type: text, nullable: false, default: NONE}
      - {name: conflict_target_version, type: bigint, nullable: false, default: NONE}
      - {name: conflict_target_digest, type: char(64), nullable: false, default: NONE}
      - {name: conflict_evaluation_state, type: text, nullable: false, default: "'CLEAR'"}
      - {name: conflict_valid_until, type: timestamptz, nullable: false, default: NONE}
      - {name: approval_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: step_up_authorization_id, type: uuid, nullable: false, default: NONE, logical_reference: validated while live at insert; no durable FK to the session-cascaded authorization row}
      - {name: step_up_authorization_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: step_up_issued_at, type: timestamptz, nullable: false, default: NONE}
      - {name: step_up_expires_at, type: timestamptz, nullable: false, default: NONE}
      - {name: action_digest, type: char(64), nullable: false, default: NONE}
      - {name: idempotency_key_sha256, type: char(64), nullable: false, default: NONE}
      - {name: actor_assertion_jti, type: uuid, nullable: false, default: NONE}
      - {name: request_id, type: uuid, nullable: false, default: NONE}
      - {name: audit_event_id, type: uuid, nullable: false, default: NONE, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: release_digest, type: char(64), nullable: false, default: NONE}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: released_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: legal_hold_releases_pkey, columns: [id]}
    uniques:
      - {name: legal_hold_releases_sequence_uq, columns: [hold_id, release_sequence]}
      - {name: legal_hold_releases_digest_uq, columns: [release_digest]}
      - {name: legal_hold_releases_receipt_uq, columns: [receipt_digest]}
      - {name: legal_hold_releases_step_up_uq, columns: [step_up_authorization_id]}
      - {name: legal_hold_releases_jti_uq, columns: [actor_assertion_jti]}
    foreign_keys:
      - {name: legal_hold_releases_hold_binding_fk, columns: [hold_id, hold_version, original_hold_digest, target_anchor_id, target_anchor_digest], references: "editorial.legal_holds(id,version,hold_digest,target_anchor_id,target_anchor_digest)", on_delete: RESTRICT, candidate_key_added_by_0028: true}
      - {name: legal_hold_releases_anchor_fk, columns: [target_anchor_id, target_anchor_digest], references: "ops.legal_hold_target_anchors(id,anchor_digest)", on_delete: RESTRICT}
      - {name: legal_hold_releases_conflict_fk, columns: [conflict_snapshot_id, released_by_user_id, conflict_target_type, conflict_target_id, conflict_target_version, conflict_target_digest, conflict_snapshot_digest, conflict_evaluation_state, conflict_valid_until], references: "editorial.conflict_snapshots(id,subject_actor_id,target_type,target_id,target_version,target_digest,snapshot_sha256,evaluation_state,valid_until)", on_delete: RESTRICT}
    checks:
      - {name: legal_hold_releases_sequence_ck, expression: "hold_version > 0 AND release_sequence > 0 AND ((release_sequence = 1 AND prior_release_id IS NULL AND prior_release_digest IS NULL) OR (release_sequence > 1 AND prior_release_id IS NOT NULL AND prior_release_digest IS NOT NULL))"}
      - {name: legal_hold_releases_context_ck, expression: "(release_context_kind = 'CASE_GOVERNED' AND case_id IS NOT NULL AND review_snapshot_id IS NOT NULL AND expected_case_version > 0) OR (release_context_kind = 'NON_CASE_GOVERNED' AND case_id IS NULL AND review_snapshot_id IS NULL AND expected_case_version IS NULL)"}
      - {name: legal_hold_releases_conflict_binding_ck, expression: "conflict_target_type = 'LEGAL_HOLD' AND conflict_target_id = hold_id::text AND conflict_target_version = hold_version AND conflict_target_digest = original_hold_digest AND conflict_evaluation_state = 'CLEAR' AND conflict_valid_until > released_at"}
      - {name: legal_hold_releases_atoms_ck, expression: "cardinality(released_scope_atoms) BETWEEN 1 AND 3 AND ops.text_array_is_sorted_unique(released_scope_atoms) AND released_scope_atoms <@ ARRAY['DELETION','DISCLOSURE','RETENTION']::text[]"}
      - {name: legal_hold_releases_affected_ck, expression: "cardinality(affected_ids) BETWEEN 1 AND 10000 AND ops.uuid_array_is_sorted_unique(affected_ids)"}
      - {name: legal_hold_releases_reason_ck, expression: "reason_code IN ('AUTHORITY_WITHDRAWN','EXPIRED_REVIEWED','RESOLVED','SUPERSEDED','COURT_ORDER','OTHER') AND length(btrim(reason)) BETWEEN 1 AND 4000 AND length(btrim(release_authority_reference)) BETWEEN 1 AND 500"}
      - {name: legal_hold_releases_step_up_time_ck, expression: "step_up_expires_at > step_up_issued_at AND released_at >= step_up_issued_at AND released_at <= step_up_expires_at"}
      - {name: legal_hold_releases_digest_ck, expression: "ops.is_lower_sha256(original_hold_digest) AND ops.is_lower_sha256(target_anchor_digest) AND (prior_release_digest IS NULL OR ops.is_lower_sha256(prior_release_digest)) AND ops.is_lower_sha256(affected_set_digest) AND ops.is_lower_sha256(prior_coverage_digest) AND ops.is_lower_sha256(resulting_coverage_digest) AND ops.is_lower_sha256(authority_reference_digest) AND ops.is_lower_sha256(conflict_snapshot_digest) AND ops.is_lower_sha256(conflict_target_digest) AND ops.is_lower_sha256(approval_receipt_digest) AND ops.is_lower_sha256(step_up_authorization_receipt_digest) AND ops.is_lower_sha256(action_digest) AND ops.is_lower_sha256(idempotency_key_sha256) AND ops.is_lower_sha256(release_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: legal_hold_releases_timeline_idx, method: btree, keys: [hold_id, release_sequence ASC, id ASC]}
      - {name: legal_hold_releases_case_idx, method: btree, keys: [case_id, released_at DESC, id DESC]}
      - {name: legal_hold_releases_anchor_idx, method: btree, keys: [target_anchor_id, release_sequence ASC, id ASC]}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
    rls: {enabled: false, forced: false, reason: internal legal coverage decision with no external direct access}
    digest_and_concurrency:
      identity: hold_id+target_anchor_id+release_sequence
      coverage_atoms: [RETENTION, DELETION, DISCLOSURE]
      affected_set: original affected_ids when nonempty, otherwise singleton original object_id
      active_formula: union over holds of original scope-atom x affected-ID cells minus union of valid release cells
      transaction: SERIALIZABLE; lock idempotency, exact anchor and concrete target, optional case by expected version for CASE_GOVERNED, original hold, and releases ordered by sequence; verify expectedReleaseSequence, prior digest, exact subset, no repeated cell, placer differs from releaser, current exact CLEAR conflict snapshot and STEP_UP receipt; insert release/audit/outbox/receipt atomically
      approval_receipt: approval_receipt_digest is the owner-function-derived GURINE_LEGAL_HOLD_RELEASE_APPROVAL_V1 digest over exact hold/case/snapshot/coverage/release cells, current review.legal actor capability, action-bound STEP_UP authorization, current CLEAR conflict snapshot targeted to releaseLegalHold, authority reference digest, and placer-releaser separation; it is not an ActionProposal approval and cannot be caller-supplied
      replay: same idempotency and exact bytes returns stored receipt; changed bytes is IDEMPOTENCY_CONFLICT; concurrent release has one winner and LEGAL_HOLD_RELEASE_STALE losers
      expiry: never inserts a release; it only emits legal.hold_review_due.v1 and creates a task
    retention:
      record_class: LEGAL_HOLD_RELEASE
      trigger: never before original hold and every governed record are beyond their schedules
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: hold_id
      backup_behavior: placement and complete release chain are restored before coverage is evaluated
    roundtrip:
      read_order: [release_sequence ASC, id ASC]
      assertions: [single/full/partial atom release, subset validation, cell non-overlap, multi-hold union, placer-releaser separation, expected case and sequence races, expiry-no-release, event and receipt digest, update/delete denial]

  - relation: ops.incident_events
    domain: Incident
    repository: crates/persistence-postgres::incidents
    logical_owner: incidents
    writer_components: [control-api, incident-detector]
    mutation: APPEND_ONLY
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: incident_id, type: uuid, nullable: false, default: NONE, fk: ops.incidents(id) ON DELETE RESTRICT}
      - {name: event_sequence, type: bigint, nullable: false, default: NONE}
      - {name: prior_version, type: bigint, nullable: false, default: NONE}
      - {name: version, type: bigint, nullable: false, default: NONE}
      - {name: prior_state, type: text, nullable: true, default: NONE}
      - {name: state, type: text, nullable: false, default: NONE}
      - {name: transition_kind, type: text, nullable: false, default: NONE}
      - {name: severity, type: text, nullable: false, default: NONE}
      - {name: affected_capabilities, type: 'text[]', nullable: false, default: NONE}
      - {name: owner_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: commander_user_id, type: uuid, nullable: true, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: next_update_at, type: timestamptz, nullable: true, default: NONE}
      - {name: transition_detail, type: jsonb, nullable: false, default: NONE, rust_type: IncidentTransitionDetailV1}
      - {name: evidence_refs, type: jsonb, nullable: false, default: NONE, rust_type: IncidentEvidenceRefV1Array}
      - {name: evidence_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: reason_code, type: text, nullable: false, default: NONE}
      - {name: reason, type: text, nullable: false, default: NONE}
      - {name: actor_type, type: text, nullable: false, default: NONE}
      - {name: actor_id, type: text, nullable: false, default: NONE}
      - {name: idempotency_key_sha256, type: char(64), nullable: true, default: NONE}
      - {name: actor_assertion_jti, type: uuid, nullable: true, default: NONE}
      - {name: request_id, type: uuid, nullable: false, default: NONE}
      - {name: audit_event_id, type: uuid, nullable: false, default: NONE, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: occurred_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: incident_events_pkey, columns: [id]}
    uniques:
      - {name: incident_events_sequence_uq, columns: [incident_id, event_sequence]}
      - {name: incident_events_version_uq, columns: [incident_id, version]}
      - {name: incident_events_receipt_uq, columns: [receipt_digest]}
      - {name: incident_events_request_uq, columns: [request_id]}
      - {name: incident_events_jti_uq, columns: [actor_assertion_jti], nulls_distinct: true}
    checks:
      - {name: incident_events_sequence_ck, expression: "event_sequence > 0 AND prior_version >= 0 AND version > 0"}
      - {name: incident_events_version_ck, expression: "transition_kind = 'MIGRATION_BASELINE' OR version = prior_version + 1"}
      - {name: incident_events_state_ck, expression: "state IN ('DETECTED','TRIAGED','CONTAINED','RECOVERING','RESOLVED','POSTMORTEM_CLOSED') AND (prior_state IS NULL OR prior_state IN ('DETECTED','TRIAGED','CONTAINED','RECOVERING','RESOLVED'))"}
      - {name: incident_events_edge_ck, expression: "(transition_kind = 'DETECTED' AND prior_state IS NULL AND state = 'DETECTED') OR (transition_kind = 'TRIAGED' AND prior_state = 'DETECTED' AND state = 'TRIAGED') OR (transition_kind = 'CONTAINED' AND prior_state = 'TRIAGED' AND state = 'CONTAINED') OR (transition_kind = 'RECOVERY_STARTED' AND prior_state = 'CONTAINED' AND state = 'RECOVERING') OR (transition_kind = 'RESOLVED' AND prior_state = 'RECOVERING' AND state = 'RESOLVED') OR (transition_kind = 'POSTMORTEM_CLOSED' AND prior_state = 'RESOLVED' AND state = 'POSTMORTEM_CLOSED') OR transition_kind = 'MIGRATION_BASELINE'"}
      - {name: incident_events_severity_ck, expression: "severity IN ('SEV0','SEV1','SEV2','SEV3')"}
      - {name: incident_events_capabilities_ck, expression: "cardinality(affected_capabilities) BETWEEN 1 AND 32 AND ops.text_array_is_sorted_unique(affected_capabilities)"}
      - {name: incident_events_commander_ck, expression: "severity NOT IN ('SEV0','SEV1') OR commander_user_id IS NOT NULL"}
      - {name: incident_events_next_update_ck, expression: "(state = 'POSTMORTEM_CLOSED' AND next_update_at IS NULL) OR (transition_kind = 'MIGRATION_BASELINE' AND state = 'RESOLVED' AND next_update_at IS NULL) OR (state <> 'POSTMORTEM_CLOSED' AND next_update_at IS NOT NULL AND next_update_at > occurred_at)"}
      - {name: incident_events_migration_shape_ck, expression: "transition_kind <> 'MIGRATION_BASELINE' OR (event_sequence = 1 AND prior_state IS NULL AND actor_type = 'MIGRATION' AND actor_assertion_jti IS NULL AND idempotency_key_sha256 IS NULL)"}
      - {name: incident_events_detail_json_ck, expression: "ops.incident_transition_detail_is_valid(transition_kind,transition_detail)"}
      - {name: incident_events_evidence_json_ck, expression: "ops.incident_evidence_ref_array_is_valid(evidence_refs)"}
      - {name: incident_events_reason_ck, expression: "length(reason_code) BETWEEN 1 AND 100 AND length(btrim(reason)) BETWEEN 1 AND 4000"}
      - {name: incident_events_actor_ck, expression: "actor_type IN ('HUMAN','SERVICE','MIGRATION') AND length(actor_id) BETWEEN 1 AND 512 AND ((actor_type = 'HUMAN' AND actor_assertion_jti IS NOT NULL AND idempotency_key_sha256 IS NOT NULL) OR (actor_type <> 'HUMAN' AND actor_assertion_jti IS NULL))"}
      - {name: incident_events_digest_ck, expression: "ops.is_lower_sha256(evidence_set_digest) AND (idempotency_key_sha256 IS NULL OR ops.is_lower_sha256(idempotency_key_sha256)) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: incident_events_timeline_idx, method: btree, keys: [incident_id, event_sequence ASC, id ASC]}
      - {name: incident_events_state_time_idx, method: btree, keys: [state, occurred_at DESC, id DESC]}
      - {name: incident_events_next_update_idx, method: btree, keys: [next_update_at, severity, incident_id], predicate: next_update_at IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: deployment operations timeline with fixed internal service writers only}
    digest_and_concurrency:
      identity: incident_id+version
      canonical_digest: receipt_digest binds prior/current state and version, severity, ordered affected capabilities, owner/commander/next update, closed transition detail, ordered evidence, actor, reason, request, and audit IDs
      insert_rule: lock incident root by ID and expectedVersion; event_sequence equals latest+1; verify exact state edge; insert event and update root state/version/summary fields exactly once in one transaction with audit/outbox/receipt
      detection_rule: incident-detector creates root DETECTED plus sequence/version one; duplicate detection digest links to the existing open incident instead of creating a duplicate
      recurrence: creates a new linked DETECTED root and never reopens RESOLVED or POSTMORTEM_CLOSED
      resolution_guard: every restored SLI receipt is current and non-UNKNOWN; all affected reconciliation receipts are terminal; each affected capability has current readiness evidence
      migration_baseline: one event per legacy row, actor_type MIGRATION, preserves old status/severity, does not emit incident.state_changed.v1, and uses the already stored root version
    retention:
      record_class: INCIDENT_EVENT
      trigger: POSTMORTEM_CLOSED plus severity-specific schedule
      terminal_action: CRYPTO_ERASE
      preserved_after_crypto_erase: [state/version/severity, capability and evidence digests, timing, receipt and audit linkage]
      legal_hold_key: incident_id
      backup_behavior: timeline and latest root version are restored and digest-checked before incident UI becomes operational
    roundtrip:
      read_order: [event_sequence ASC, id ASC]
      assertions: [initial detection, every exact edge, closed detail variant, SEV0/1 commander, next-update bounds, stale version 64-way winner, recurrence link, resolution unknown-SLI denial, migration baseline, update/delete denial]

  - relation: editorial.publication_gate_decisions
