journey_decision_idempotency_boundary:
  closed_key_contract:
    boundary_keys: [closed_key_contract, decision_reason_shape, business_hash, attempt_proof, prepare, apply, finalize, relation_access_registry_ref, transaction_xid_runtime_matrix, commit_guard, response_rule, crash_matrix]
    prepare_keys: [signature, owner, security, volatility, search_path, execute_roles, fixed_binding_before_relation_access, algorithm]
    apply_keys: [rule, prepared_new_binding, relation_access, write_ownership, forbidden_writes]
    finalize_keys: [signature, owner, security, volatility, search_path, execute_roles, accepted_argument_type, fixed_binding_before_relation_access, variable_input_fields, prepared_new_binding, validation_order, internal_composite_constructor, write_ownership, relation_access, rule]
    unknown_key_rule: any extra key, alternate relation-read declaration, dynamic_sql flag, select_star flag, helper declaration or unregistered access surface is a design and migration failure
  decision_reason_shape:
    discriminator: decision
    closed_decline_reason_codes: [CAPABILITY_UNAVAILABLE, OBJECT_SCOPE_MISMATCH, CONFLICT_OF_INTEREST, WORKLOAD_CAPACITY, DEPENDENCY_BLOCKED, SUBJECT_INVALID, OWNER_UNAVAILABLE, POLICY_BLOCKED, RECEIVER_DECLINED]
    sql_field_mapping: {reasonCode: reason_code, reason: FORBIDDEN_SQL_INPUT, reasonDigest: reason_digest, reasonEncrypted: reason_encrypted}
    branches:
      ACKNOWLEDGE: {reasonCode: MUST_BE_NULL, reason: MUST_BE_NULL, reasonDigest: MUST_BE_NULL, reasonEncrypted: MUST_BE_NULL}
      DECLINE: {reasonCode: REQUIRED_CLOSED_DECLINE_REASON_CODE, reason: REQUIRED_VALID_UNICODE_NUL_FREE_NFC_NON_WHITESPACE_1_TO_4000, reasonDigest: REQUIRED_SHA256_OF_EXACT_NFC_UTF8_BYTES, reasonEncrypted: REQUIRED_NEW_CLAIM_ONLY_RANDOMIZED_CIPHERTEXT}
    enforcement: attempt consume and prepare validate the wire/canonical nullability branch before relation access; apply validates the SQL field branch again and never accepts plaintext
  business_hash:
    domain: JOURNEY_HANDOFF_DECISION_BUSINESS_V1
    algorithm: SHA256(GURINE_CANONICAL_JSON_V1(closed object))
    preimage: [operation_id, handoff_id, expected_handoff_version, expected_binding_digest, decision, reason_code, reason_digest]
    excludes: [transport_request_id, actor_assertion_jti, service_assertion_jti, assertion_token_bytes, actor_or_service_identity_bytes, action_or_step_up_token_bytes, raw_idempotency_key, idempotency_key_sha256, reason_encrypted, plaintext_reason, http_header_order, json_field_order]
  attempt_proof:
    transaction: separately committed before the SERIALIZABLE business transaction
    required_rows: [ops.assertion_replay_guard exact assertion_type+jti+wire_request_digest+attempt_transaction_xid8, ops.audit_events exact auth.assertion.consume SUCCESS attempt+generated attempt_transaction_xid8]
    lookup: immutable non-locking lookup before idempotency relation access; session_user fixes ACTOR for gurine_control_api and SERVICE for gurine_workflow_worker
    mvcc_visibility: both exact immutable rows must be visible in Transaction B's ordinary SERIALIZABLE snapshot; an uncommitted Transaction A row is invisible and an aborted row does not exist
    persisted_xid_rule: both attempt_transaction_xid8 values are non-null, equal as xid8 and not equal to pg_current_xact_id(); their controlled INSERT producers require the stored value to equal pg_current_xact_id() in Transaction A
    binding_rule: assertion type, JTI, wire digest, operation, handoff, business request hash, transport request ID, idempotency key digest, audit event ID and audit event hash all join exactly
    legacy_rule: NULL legacy xid8 rows are LEGACY_UNPROVEN, remain NULL and never authorize a journey decision; migration-time or caller-supplied backfill is forbidden
    forbidden_proof: [tuple xmin, row xmin, txid_current, caller-supplied xid, migration backfill]
    pg_xact_status_diagnostic: committed is corroborating only; NULL is allowed after status-history truncation; in progress or aborted is an integrity fault and fails closed with an operational alert, but pg_xact_status is never the positive authorization predicate
    duplicate: "*_ASSERTION_REPLAYED before business prepare; no protected business write"
    authority_by_session_user:
      gurine_control_api: {assertion_type: ACTOR, entry_boundary: CONTROL_COMMAND, receiver_authority: persisted human receiver identity plus capability object scope and stored assurance}
      gurine_workflow_worker: {assertion_type: SERVICE, entry_boundary: JOURNEY_WORKFLOW_DB_COMMAND, receiver_authority: persisted service acknowledgement authority plus workload identity capability object scope and stored assurance}
    exact_rule: the supplied assertion_type must equal the session_user-fixed value; neither runtime may select the other path and the committed attempt receipt must bind the same assertion type, operation, handoff, business hash, request, key, wire digest and persisted Transaction-A xid8 proof; same-transaction consume then prepare fails with *_ASSERTION_INVALID and zero business writes
  prepare:
    signature: ops.prepare_journey_handoff_decision_v1(ops.journey_handoff_decision_prepare_v1) RETURNS ops.journey_handoff_decision_prepare_receipt_v1
    owner: gurine_migrator
    security: DEFINER
    volatility: VOLATILE
    search_path: [pg_catalog, ops]
    execute_roles: [gurine_control_api, gurine_workflow_worker]
    fixed_binding_before_relation_access: {scope: JOURNEY_HANDOFF_DECISION, operation_id: decideJourneyHandoff, bff_issuer: null, session_token_hash: null, resource_type: JOURNEY_HANDOFF, resource_id: canonical lowercase UUID text of handoff_id}
    algorithm:
      - require SERIALIZABLE, exact session_user/assertion type, MVCC-visible immutable replay-guard row and SUCCESS attempt audit bound to operation, transport request, wire digest, key digest and recomputed business hash; their non-null attempt_transaction_xid8 values are equal and differ from pg_current_xact_id(), without xmin or hard pg_xact_status reliance
      - claim or lock fixed scope JOURNEY_HANDOFF_DECISION exactly once through ops.claim_owner_idempotency_v1; request_hash is the seven-field business hash and BFF/session binding fields are null
      - NEW requires the owner-created BOUND_V1 row claim_transaction_xid8=pg_current_xact_id() and returns generation with every response field null; this top-level xid rule remains true inside SAVEPOINT and nested SAVEPOINT even when tuple xmin is a subxid
      - FINAL_AVAILABLE immediately calls ops.replay_owner_idempotency_response_v1 exactly once and returns exact stored bytes before handoff, instance or domain lookup; historical FINAL_REPLAY does not require claim_transaction_xid8=current xid
      - RECLAIMED_EXPIRED and IN_PROGRESS are forbidden for this synchronous scope; a committed incomplete row is internal reconciliation-required evidence and never authorizes encryption or re-execution
  apply:
    rule: ops.decide_journey_handoff_v1 no longer claims or finalizes idempotency; before local ciphertext or domain writes it performs exactly one schema-qualified direct SELECT INTO STRICT against ops.idempotency_keys and requires the same Transaction-B prepared NEW row with exact scope, key, generation, recomputed business hash and server-persisted top-level xid8
    prepared_new_binding: {row_identity: '(JOURNEY_HANDOFF_DECISION,idempotency_key_sha256)', operation_id: decideJourneyHandoff, request_hash: recomputed seven-field business hash, generation: exact current row generation, transaction_proof: 'claim_transaction_xid8 = pg_current_xact_id(); terminal marker, compatibility JSON, response bytes, digests, receipt, audit, outbox and completion tuple all NULL; xmin is forbidden'}
    relation_access: {ops.idempotency_keys: exactly-one schema-qualified direct SELECT INTO STRICT of the complete registry column set; zero INSERT/UPDATE/DELETE/COPY; zero helper or owner calls; no SELECT star or dynamic SQL}
    write_ownership: [compiled domain owner relation, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events, ops.outbox]
    forbidden_writes: [ops.idempotency_keys, ops.assertion_replay_guard]
  finalize:
    signature: ops.finalize_journey_handoff_decision_response_v1(ops.idempotency_finalize_v1) RETURNS ops.idempotency_finalize_receipt_v1
    owner: gurine_migrator
    security: DEFINER
    volatility: VOLATILE
    search_path: [pg_catalog, ops]
    execute_roles: [gurine_control_api, gurine_workflow_worker]
    accepted_argument_type: ops.idempotency_finalize_v1
    fixed_binding_before_relation_access:
      scope: JOURNEY_HANDOFF_DECISION
      operation_id: decideJourneyHandoff
      bff_issuer: null
      session_token_hash: null
      resource_type: JOURNEY_HANDOFF
      resource_id: canonical lowercase UUID text of the decision receipt handoff_id
      response_status: 200
      response_schema: JourneyHandoffDecisionReceiptV1
      response_media_type: application/json
    variable_input_fields: [key_hash, request_hash, expected_claim_generation, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at]
    prepared_new_binding: {row_identity: '(JOURNEY_HANDOFF_DECISION,key_hash)', operation_id: decideJourneyHandoff, request_hash: exact seven-field business hash, generation: expected_claim_generation, transaction_proof: 'claim_transaction_xid8 = pg_current_xact_id(); terminal marker, compatibility JSON, response bytes, digests, receipt, audit, outbox and completion tuple all NULL before finalize; xmin is forbidden'}
    validation_order:
      - before any relation access require session_user in the exact runtime set and require every fixed field in the received composite to equal the fixed binding; mismatch is a zero-write typed conflict and no caller value may override a fixed field
      - perform exactly one schema-qualified pre-finalize SELECT INTO STRICT FOR UPDATE of the complete registry column set; require the same Transaction-B prepared NEW claim, exact key hash, seven-field request hash, claim generation, claim_transaction_xid8=pg_current_xact_id(), null BFF/session binding, canonical handoff resource identity and all-null terminal tuple
      - validate one complete typed decision result, the old terminal receipt, optional replacement request receipt, final parent head, exact command audit rows and exact one-or-two outbox graph; all IDs and digests must join the same journey, handoff and atomic transition group
      - construct a new internal ops.idempotency_finalize_v1 value inside the wrapper from the fixed constants plus the verified variable fields; never forward the caller composite directly to the generic owner finalizer
      - call ops.finalize_owner_idempotency_response_v1 exactly once on the already-held generation; ops.replay_owner_idempotency_response_v1 is forbidden in this wrapper
      - perform exactly one schema-qualified post-finalize direct SELECT INTO STRICT of the complete registry column set and compare persisted scope/key/request/operation, null BFF/session, generation, preserved claim_transaction_xid8, BOUND_V1/RESPONSE_FINAL marker, terminalized/completed time, status, schema, media, exact header and body bytes, compatibility JSON, response digest, JOURNEY_HANDOFF resource, receipt ID/digest, audit ID and outbox ID to the pre-validated tuple; any mismatch rolls back and JSON reserialization is forbidden
    internal_composite_constructor: {constants: [scope, operation_id, bff_issuer, session_token_hash, resource_type, resource_id, response_status, response_schema, response_media_type], verified_variables: [key_hash, request_hash, expected_claim_generation, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at], direct_forwarding: FORBIDDEN}
    write_ownership: [ops.idempotency_keys]
    relation_access: {ops.idempotency_keys: 'exactly one pre-finalize direct locked read plus exactly one post-finalize direct persisted-tuple readback; exactly one owner-finalize call; zero replay-owner calls, other helpers, direct DML, SELECT star or dynamic SQL'}
    rule: after Rust serializes the typed decision result once, enforce the fixed binding, validate the prepared NEW claim and exact receipt/business audit/outbox graph, construct the internal generic composite, finalize the already-held generation exactly once, and prove the persisted tuple and exact response bytes by direct post-finalize readback before commit
  relation_access_registry_ref: specs/database/addendum/0027-communication-consent-delivery.yaml#migration.existing_relation_changes[relation=ops.idempotency_keys].journey_owner_routine_internal_scope_registry.owner_internal_functions.relation_access_registry
  transaction_xid_runtime_matrix:
    same_transaction_attempt: consume plus prepare in one top-level transaction is rejected because attempt_transaction_xid8 equals pg_current_xact_id(); protected business writes remain zero
    committed_attempt: Transaction A COMMIT then Transaction B prepare succeeds when both immutable attempt xid8 values are visible, equal and different from current
    uncommitted_or_aborted_attempt: invisible or absent proof is rejected
    savepoint_claim: NEW prepare inside SAVEPOINT or nested SAVEPOINT stores claim_transaction_xid8 equal to the top-level pg_current_xact_id() even when tuple xmin is a subxid; apply/finalize succeed on the persisted xid8 proof
    vacuum_freeze: VACUUM FREEZE may change tuple metadata but never the user xid8 columns; proof remains valid and pg_xact_status NULL is not a hard failure
  commit_guard: ops.check_journey_decision_idempotency_complete_v1 rejects a touched incomplete JOURNEY_HANDOFF_DECISION row at deferred commit; finalized and tombstoned rows are never reclaimed after expires_at
  response_rule: application status, media type, safe end-to-end header bytes and body bytes are stored and replayed exactly; a replay cannot inject a new x-request-id, idempotent-replay header or JSON serialization
  crash_matrix:
    auth_commit_before_business: only replay guard plus attempt audit persist; fresh JTI may obtain NEW
    prepare_or_encrypt_or_apply_before_commit: the whole business claim/effect/finalize rolls back
    business_commit_before_http_response: fresh JTI obtains FINAL_REPLAY with byte-identical response

