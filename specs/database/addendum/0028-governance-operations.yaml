      - {name: scope_manifest_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: field_rule_set, type: jsonb, nullable: true, staged_legacy: true, rust_type: AuditExportFieldRuleSetV1}
      - {name: field_rule_set_digest, type: char(64), nullable: true, staged_legacy: true}
