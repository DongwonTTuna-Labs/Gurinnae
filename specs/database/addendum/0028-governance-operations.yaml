    issue: additive event payloads omit replay-critical fields stored here, including schedule action/owner, incident transition detail, release actor/cell count, publication child graph, and SLI unknown/burn fields.
    required_resolution: make events reconstructive with exact payload schemas or explicitly declare lossy notification semantics whose consumers rehydrate by immutable ID; never infer omitted values.
