journey_owner_routine_common:
  owner: gurine_migrator
  security_definer: true
  volatility: VOLATILE
  search_path: [pg_catalog, ops, editorial, core, raw, intake, extensions, pg_temp]
  transaction: SERIALIZABLE
  isolation_guard: every routine checks current_setting('transaction_isolation') = 'serializable' before any relation lookup, lock, idempotency claim or write; any other isolation returns JOURNEY_SERIALIZABLE_REQUIRED and writes zero rows because a PostgreSQL function cannot upgrade its caller transaction
  network_io: FORBIDDEN
  dynamic_sql: FORBIDDEN except a separately pinned relation registry using regclass and schema-qualified format identifiers
  authorization_attempt_precondition: JOURNEY_HANDOFF_DECISION alone requires a separately committed fresh JTI replay-guard row and immutable auth.assertion.consume attempt audit; no other journey scope inherits that split, and requestId/JTI/token bytes never enter the decision business request hash
  lock_order:
    - immutable committed assertion-attempt proof lookup when authenticated
    - idempotency claim when command-scoped
    - non-locking immutable lookup used only to discover journey_instance_id from handoff_id
    - ops.journey_instances by id FOR UPDATE
    - ops.journey_handoffs by id FOR UPDATE
    - compiled domain rows in registry relation then primary-key order
    - immutable prior receipt rows
    - ops.audit_chain_heads through the owner append function
    - ops.outbox through the owner enqueue function
    - idempotency final response bytes when command-scoped
  idempotency_boundary: start/request/outcome command-scoped routines use ops.claim_owner_idempotency_v1 plus the owner finalize/replay functions; JOURNEY_HANDOFF_DECISION alone uses runtime-authorized prepare, one exact schema-qualified apply read, then finalize with one pre-read, one owner-finalize and one full persisted post-readback in one SERIALIZABLE business transaction; scheduler routines call none; generic idempotency functions reject JOURNEY_* scopes
  replay_rule: for JOURNEY_HANDOFF_DECISION, after its mandatory fresh assertion attempt, finalized exact replay is checked through the dedicated owner boundary before mutable-state validation and returns stored status/media/header/body bytes while writing zero second idempotency, command-audit, outbox, domain-effect or receipt row; start, request and outcome use only their declared ordinary owner-boundary replay contract
  randomized_encryption_replay_rule: the seven-field business request hash binds canonical reason_digest and never request/JTI/token/plaintext/randomized ciphertext; local encryption occurs only after prepare returns NEW, FINAL_REPLAY returns stored bytes before encryption, and changed included business bytes are IDEMPOTENCY_CONFLICT

