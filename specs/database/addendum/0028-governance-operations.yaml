      - {name: receipt_token_expires_at, type: timestamptz, nullable: true, default: NONE}
      - {name: receipt_token_consumed_at, type: timestamptz, nullable: true, default: NONE}
      - {name: status_session_binding_digest, type: char(64), nullable: true, default: NONE, logical_reference: exact PRIVACY_REQUEST_STATUS derived-session issuance receipt; no raw session token or session-cascaded FK}
      - {name: due_at, type: timestamptz, nullable: true, default: NONE}
      - {name: inventory_snapshot_encrypted, type: bytea, nullable: true, default: NONE}
      - {name: inventory_manifest, type: jsonb, nullable: true, default: NONE, rust_type: PrivacyInventorySetV1}
      - {name: inventory_item_count, type: bigint, nullable: false, default: '0', check: inventory_item_count >= 0}
      - {name: current_inventory_snapshot_digest, type: char(64), nullable: true, default: NONE}
      - {name: current_hold_coverage_digest, type: char(64), nullable: true, default: NONE}
      - {name: current_decision_id, type: uuid, nullable: true, default: NONE, fk_added_after_child: ops.retention_request_decisions(id) ON DELETE RESTRICT}
      - {name: current_decision_digest, type: char(64), nullable: true, default: NONE}
      - {name: completion_receipt_id, type: uuid, nullable: true, default: NONE, fk_added_after_child: ops.retention_execution_receipts(id) ON DELETE RESTRICT}
      - {name: completion_receipt_digest, type: char(64), nullable: true, default: NONE}
      - {name: request_receipt_digest, type: char(64), nullable: true, default: NONE}
      - {name: updated_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    backfill_rule: legacy rows receive no invented jurisdiction/scope/proof; they remain readable but cannot transition until a typed inventory reconstruction receipt supplies the missing digests
    added_constraints:
      - {name: retention_requests_identity_uq, kind: UNIQUE, columns: [id, request_type]}
      - {name: retention_requests_inventory_binding_uq, kind: UNIQUE, columns: [id, request_type, decision_version, current_inventory_snapshot_digest]}
      - {name: retention_requests_inventory_shape_ck, kind: CHECK, expression: "(status = 'RECEIVED' AND inventory_manifest IS NULL AND inventory_item_count = 0 AND current_inventory_snapshot_digest IS NULL) OR (status <> 'RECEIVED' AND inventory_manifest IS NOT NULL AND inventory_item_count > 0 AND current_inventory_snapshot_digest IS NOT NULL AND ops.privacy_inventory_set_is_valid(request_type,inventory_manifest) AND inventory_item_count = jsonb_array_length(inventory_manifest->'items'))"}
      - {name: retention_requests_completion_shape_ck, kind: CHECK, expression: "(status = 'COMPLETED') = (completion_receipt_id IS NOT NULL AND completion_receipt_digest IS NOT NULL)"}
      - {name: retention_requests_basis_ck, kind: CHECK, expression: "processing_basis_code IS NULL OR processing_basis_code IN ('LEGAL_OBLIGATION','PUBLIC_TASK','LEGITIMATE_INTEREST','CONSENT_FOR_OPTIONAL_CONTACT')"}
      - {name: retention_requests_notice_basis_shape_ck, kind: CHECK, expression: "(request_scope_schema_version IS NULL AND subject_scope_digest IS NULL AND notice_version IS NULL AND notice_digest IS NULL AND notice_acknowledged_at IS NULL AND processing_basis_code IS NULL AND processing_basis_policy_digest IS NULL AND processing_basis_review_digest IS NULL) OR (length(request_scope_schema_version) BETWEEN 1 AND 100 AND subject_scope_digest IS NOT NULL AND length(notice_version) BETWEEN 1 AND 100 AND notice_digest IS NOT NULL AND notice_acknowledged_at IS NOT NULL AND processing_basis_code IN ('LEGAL_OBLIGATION','PUBLIC_TASK','LEGITIMATE_INTEREST') AND processing_basis_policy_digest IS NOT NULL AND processing_basis_review_digest IS NOT NULL)"}
      - {name: retention_requests_optional_contact_consent_ck, kind: CHECK, expression: "optional_contact_consent_state IN ('NONE','GRANTED','DECLINED','WITHDRAWN') AND ((optional_contact_consent_state = 'NONE' AND contact_endpoint_id IS NULL AND optional_contact_consent_digest IS NULL) OR (optional_contact_consent_state <> 'NONE' AND optional_contact_consent_digest IS NOT NULL))"}
      - {name: retention_requests_receipt_session_ck, kind: CHECK, expression: "(receipt_token_hash IS NULL AND receipt_token_expires_at IS NULL AND receipt_token_consumed_at IS NULL AND status_session_binding_digest IS NULL) OR (receipt_token_hash IS NOT NULL AND receipt_token_expires_at > created_at AND (receipt_token_consumed_at IS NULL OR (receipt_token_consumed_at <= receipt_token_expires_at AND status_session_binding_digest IS NOT NULL)))"}
      - {name: retention_requests_governance_digest_ck, kind: CHECK, expression: "(subject_scope_digest IS NULL OR ops.is_lower_sha256(subject_scope_digest)) AND (notice_digest IS NULL OR ops.is_lower_sha256(notice_digest)) AND (processing_basis_policy_digest IS NULL OR ops.is_lower_sha256(processing_basis_policy_digest)) AND (processing_basis_review_digest IS NULL OR ops.is_lower_sha256(processing_basis_review_digest)) AND (optional_contact_consent_digest IS NULL OR ops.is_lower_sha256(optional_contact_consent_digest)) AND (receipt_token_hash IS NULL OR ops.is_lower_sha256(receipt_token_hash)) AND (status_session_binding_digest IS NULL OR ops.is_lower_sha256(status_session_binding_digest))"}
    lifecycle_guard: RECEIVED->REVIEW->APPROVED|REJECTED is human/control-owned through one ops.retention_request_decisions row; APPROVED->COMPLETED is retention-worker-owned only through one ops.retention_execution_receipts graph. ACCESS, CORRECTION, DELETION, and RESTRICTION remain distinct through scope, inventory, decision, execution, event, receipt, requester projection, and restoration suppression. Notice acknowledgment proves disclosure only; optional contact consent is never the processing basis and DECLINED/WITHDRAWN cannot prevent exercise of a right.
    requester_session: one-time receipt token exchange claims the hash before session validity checks, consumes it once, issues one PRIVACY_REQUEST_STATUS HttpOnly host-only session bound to request ID+type+request receipt digest, and stores only the token-free issuance digest; same-key finalized replay returns exact bytes, while wrong issuer, request, type, digest, expiry, reuse, or cross-IDOR returns one non-enumerating unavailable error
