    additions:
      - {name: correction_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: source_publication_revision_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.publication_revisions(id) ON DELETE RESTRICT}
