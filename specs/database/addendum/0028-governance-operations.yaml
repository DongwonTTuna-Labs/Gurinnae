      - {name: record_class_schedules_operational_action_receipt_fk, columns: [operational_action_decision_id, action_proposal_id, action_proposal_version, approval_digest, operational_action_decision_receipt_digest], references_requires_0026_candidate_key: "ops.action_decisions(id,proposal_id,proposal_version,approval_digest,receipt_digest)", on_delete: RESTRICT}
      - {name: record_class_schedules_legal_action_receipt_fk, columns: [legal_action_decision_id, action_proposal_id, action_proposal_version, approval_digest, legal_action_decision_receipt_digest], references_requires_0026_candidate_key: "ops.action_decisions(id,proposal_id,proposal_version,approval_digest,receipt_digest)", on_delete: RESTRICT}
      - {name: record_class_schedules_execution_authorization_fk, columns: [action_execution_id, action_execution_generation, action_proposal_id, action_proposal_version, approval_digest, counted_decision_set_digest, action_execution_digest], references_requires_0026_candidate_key: "ops.execution_authorizations(execution_id,generation,proposal_id,proposal_version,approval_digest,counted_decision_set_digest,execution_digest)", on_delete: RESTRICT}
      - {name: record_class_schedules_execution_receipt_fk, columns: [action_execution_receipt_id, action_execution_id, action_execution_generation, action_execution_receipt_digest], references_requires_0026_candidate_key: "ops.execution_receipts(id,execution_id,generation,receipt_digest)", on_delete: RESTRICT}
    checks:
      - {name: record_class_schedules_id_ck, expression: "record_class ~ '^[A-Z][A-Z0-9_]{2,99}$' AND owner_team ~ '^[a-z][a-z0-9-]{1,63}$'"}
      - {name: record_class_schedules_revision_ck, expression: "revision > 0 AND action_proposal_version > 0 AND action_execution_generation > 0 AND ((revision = 1 AND supersedes_schedule_id IS NULL) OR (revision > 1 AND supersedes_schedule_id IS NOT NULL))"}
      - {name: record_class_schedules_text_ck, expression: "length(btrim(purpose)) BETWEEN 1 AND 4000 AND length(btrim(lawful_basis)) BETWEEN 1 AND 2000"}
      - {name: record_class_schedules_trigger_ck, expression: "trigger_kind IN ('CREATED_AT','UPDATED_AT','CONSUMED_AT','EXPIRES_AT','CASE_CLOSED_AT','LAST_MATERIAL_USE_AT','SUPERSEDED_AT','DELIVERED_AT','TERMINAL_AT')"}
      - {name: record_class_schedules_duration_ck, expression: "(active_duration_seconds IS NULL OR active_duration_seconds BETWEEN 0 AND 3155760000) AND (backup_duration_seconds IS NULL OR backup_duration_seconds BETWEEN 0 AND 3155760000)"}
      - {name: record_class_schedules_locations_ck, expression: "cardinality(location_codes) BETWEEN 1 AND 128 AND ops.text_array_is_sorted_unique(location_codes) AND cardinality(derivative_record_classes) <= 128 AND ops.text_array_is_sorted_unique(derivative_record_classes)"}
      - {name: record_class_schedules_terminal_ck, expression: "terminal_action IN ('DELETE','ANONYMIZE','CRYPTO_ERASE','PRESERVE_PUBLIC_REVISION')"}
      - {name: record_class_schedules_indefinite_ck, expression: "(terminal_action = 'PRESERVE_PUBLIC_REVISION' AND active_duration_seconds IS NULL AND backup_duration_seconds IS NULL) OR (terminal_action <> 'PRESERVE_PUBLIC_REVISION' AND active_duration_seconds IS NOT NULL AND backup_duration_seconds IS NOT NULL)"}
      - {name: record_class_schedules_hold_ck, expression: "hold_behavior IN ('BLOCK_ON_RETENTION','BLOCK_ON_RETENTION_OR_DELETION','NOT_DESTRUCTIVE') AND ((terminal_action = 'PRESERVE_PUBLIC_REVISION' AND hold_behavior = 'NOT_DESTRUCTIVE') OR (terminal_action <> 'PRESERVE_PUBLIC_REVISION' AND hold_behavior <> 'NOT_DESTRUCTIVE'))"}
      - {name: record_class_schedules_restore_ck, expression: "restore_suppression_behavior IN ('REAPPLY_BEFORE_ACCESS','NOT_APPLICABLE') AND (terminal_action = 'PRESERVE_PUBLIC_REVISION' OR restore_suppression_behavior = 'REAPPLY_BEFORE_ACCESS')"}
      - {name: record_class_schedules_sod_ck, expression: "operational_action_decision_id <> legal_action_decision_id"}
      - {name: record_class_schedules_time_ck, expression: "review_expires_at > effective_at"}
      - {name: record_class_schedules_digest_ck, expression: "ops.is_lower_sha256(lawful_basis_review_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(approval_digest) AND ops.is_lower_sha256(operational_action_decision_receipt_digest) AND ops.is_lower_sha256(legal_action_decision_receipt_digest) AND ops.is_lower_sha256(counted_decision_set_digest) AND ops.is_lower_sha256(action_execution_digest) AND ops.is_lower_sha256(action_execution_receipt_digest) AND ops.is_lower_sha256(schedule_digest)"}
    indexes:
      - {name: record_class_schedules_current_idx, method: btree, keys: [record_class, effective_at DESC, revision DESC, id DESC]}
      - {name: record_class_schedules_review_idx, method: btree, keys: [review_expires_at, record_class, revision]}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
    rls: {enabled: false, forced: false, reason: deployment-wide executable policy with action-approved revisions only}
    digest_and_concurrency:
      identity: record_class+revision
      canonical_digest: schedule_digest binds every policy field, ordered locations and derivatives, action decision/execution receipts, effective time, and review expiry
      insert_rule: SERIALIZABLE lock latest record_class; expectedScheduleRevision must equal latest revision or zero for first row; effective_at must be monotonic; no update-in-place
      selection: greatest (effective_at, revision, id) not after now is current; no current row or review-expired row fails destructive work closed and opens a review task
    retention:
      record_class: RETENTION_POLICY_REVISION
      trigger: superseded_and_no_referenced_records
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: record_class
      backup_behavior: all revisions and digests are restored before data activation
    roundtrip:
      read_order: [record_class ASC, effective_at DESC, revision DESC, id DESC]
      cursor: record_class+effective_at+revision+id
      assertions: [first and successor revision, stale expected revision, future/current/review-expired selection, indefinite publication schedule, location order, action receipt linkage, update/delete denial]

  - relation: ops.retention_request_decisions
    domain: PrivacyRequest
    repository: crates/persistence-postgres::retention
    logical_owner: privacy-retention
    writer_components: [control-api]
    mutation: APPEND_ONLY
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: retention_request_id, type: uuid, nullable: false, default: NONE, fk: ops.retention_requests(id) ON DELETE RESTRICT}
      - {name: request_type, type: text, nullable: false, default: NONE}
      - {name: decision_version, type: bigint, nullable: false, default: NONE}
      - {name: prior_decision_id, type: uuid, nullable: true, default: NONE, fk: ops.retention_request_decisions(id) ON DELETE RESTRICT}
      - {name: prior_state, type: text, nullable: false, default: NONE}
      - {name: state, type: text, nullable: false, default: NONE}
      - {name: transition_kind, type: text, nullable: false, default: NONE}
      - {name: inventory_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: hold_coverage_digest, type: char(64), nullable: false, default: NONE}
      - {name: restore_suppression_required, type: boolean, nullable: false, default: NONE}
      - {name: policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: reason_code, type: text, nullable: false, default: NONE}
      - {name: reason_encrypted, type: bytea, nullable: false, default: NONE}
      - {name: reason_digest, type: char(64), nullable: false, default: NONE}
      - {name: decided_by_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: step_up_authorization_id, type: uuid, nullable: false, default: NONE, logical_reference: validated while live at insert; no durable FK to the session-cascaded authorization row}
      - {name: step_up_authorization_receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: step_up_issued_at, type: timestamptz, nullable: false, default: NONE}
      - {name: step_up_expires_at, type: timestamptz, nullable: false, default: NONE}
      - {name: action_digest, type: char(64), nullable: false, default: NONE}
      - {name: idempotency_key_sha256, type: char(64), nullable: false, default: NONE}
      - {name: actor_assertion_jti, type: uuid, nullable: false, default: NONE}
      - {name: request_id, type: uuid, nullable: false, default: NONE}
      - {name: audit_event_id, type: uuid, nullable: false, default: NONE, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: decision_digest, type: char(64), nullable: false, default: NONE}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: decided_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: retention_request_decisions_pkey, columns: [id]}
    uniques:
      - {name: retention_request_decisions_version_uq, columns: [retention_request_id, decision_version]}
      - {name: retention_request_decisions_digest_uq, columns: [decision_digest]}
      - {name: retention_request_decisions_receipt_uq, columns: [receipt_digest]}
      - {name: retention_request_decisions_request_type_uq, columns: [id, retention_request_id, request_type]}
      - {name: retention_request_decisions_type_binding_uq, columns: [id, retention_request_id, request_type, state]}
      - {name: retention_request_decisions_step_up_uq, columns: [step_up_authorization_id]}
      - {name: retention_request_decisions_jti_uq, columns: [actor_assertion_jti]}
    checks:
      - {name: retention_request_decisions_version_ck, expression: "decision_version > 0 AND ((decision_version = 1 AND prior_decision_id IS NULL) OR (decision_version > 1 AND prior_decision_id IS NOT NULL))"}
      - {name: retention_request_decisions_type_ck, expression: "request_type IN ('ACCESS','CORRECTION','DELETION','RESTRICTION') AND restore_suppression_required = (request_type IN ('CORRECTION','DELETION','RESTRICTION'))"}
      - {name: retention_request_decisions_state_ck, expression: "prior_state IN ('RECEIVED','REVIEW') AND state IN ('REVIEW','APPROVED','REJECTED')"}
      - {name: retention_request_decisions_edge_ck, expression: "(transition_kind = 'START_REVIEW' AND prior_state = 'RECEIVED' AND state = 'REVIEW') OR (transition_kind = 'APPROVE' AND prior_state = 'REVIEW' AND state = 'APPROVED') OR (transition_kind = 'REJECT' AND prior_state = 'REVIEW' AND state = 'REJECTED')"}
      - {name: retention_request_decisions_reason_ck, expression: "length(reason_code) BETWEEN 1 AND 100"}
      - {name: retention_request_decisions_step_up_time_ck, expression: "step_up_expires_at > step_up_issued_at AND decided_at >= step_up_issued_at AND decided_at <= step_up_expires_at"}
      - {name: retention_request_decisions_digest_ck, expression: "ops.is_lower_sha256(inventory_snapshot_digest) AND ops.is_lower_sha256(hold_coverage_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(reason_digest) AND ops.is_lower_sha256(step_up_authorization_receipt_digest) AND ops.is_lower_sha256(action_digest) AND ops.is_lower_sha256(idempotency_key_sha256) AND ops.is_lower_sha256(decision_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: retention_request_decisions_timeline_idx, method: btree, keys: [retention_request_id, decision_version ASC, id ASC]}
      - {name: retention_request_decisions_state_idx, method: btree, keys: [state, decided_at DESC, id DESC]}
    foreign_keys:
      - {name: retention_request_decisions_request_type_fk, columns: [retention_request_id, request_type], references: "ops.retention_requests(id,request_type)", on_delete: RESTRICT}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: no direct submission access; scoped public status is produced by fixed-search-path owner procedure}
    digest_and_concurrency:
      identity: retention_request_id+decision_version
      canonical_digest: decision_digest binds request_type, prior/current state, inventory, hold coverage, restore-suppression requirement, policy, actor, reason digest, action digest, and absolute time
      transaction: SERIALIZABLE; lock idempotency, root request, prior decision and active hold/release rows in UUID/sequence order; insert one human decision; update root status and decision_version exactly once; append audit/outbox/receipt
      race: one terminal winner; stale expectedDecisionVersion is RETENTION_VERSION_CONFLICT and writes nothing
      event_rule: START_REVIEW/APPROVE/REJECT emit privacy.request_decision_recorded.v1 only; no control command may emit retention.execution_completed.v1 or set COMPLETED
    retention:
      record_class: PRIVACY_REQUEST_DECISION
      trigger: request_completed_or_rejected_plus_governing_schedule
      terminal_action: CRYPTO_ERASE
      preserved_after_crypto_erase: [state, transition, policy and receipt digests, timing, audit linkage]
      legal_hold_key: retention_request_id+inventory_snapshot_digest
      backup_behavior: erased reason bytes stay inaccessible after restore
    roundtrip:
      read_order: [decision_version ASC, id ASC]
      assertions: [all three human edges for all four request types, stale CAS 64-way single winner, no human COMPLETE edge, action binding, idempotent replay, exact event choice, update/delete denial]

  - relation: ops.retention_execution_receipts
    domain: PrivacyRequest
    repository: crates/persistence-postgres::retention
    logical_owner: privacy-retention
    writer_components: [retention-worker]
    mutation: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: retention_request_id, type: uuid, nullable: false, default: NONE, fk: ops.retention_requests(id) ON DELETE RESTRICT}
      - {name: request_type, type: text, nullable: false, default: NONE}
      - {name: approval_decision_id, type: uuid, nullable: false, default: NONE, fk: ops.retention_request_decisions(id) ON DELETE RESTRICT}
      - {name: execution_kind, type: text, nullable: false, default: NONE}
      - {name: execution_generation, type: bigint, nullable: false, default: NONE}
      - {name: schedule_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: inventory_snapshot_digest, type: char(64), nullable: false, default: NONE}
      - {name: hold_coverage_digest, type: char(64), nullable: false, default: NONE}
      - {name: active_hold_cell_count, type: bigint, nullable: false, default: '0'}
      - {name: location_counts, type: jsonb, nullable: false, default: NONE, rust_type: RetentionLocationCountV1Array}
      - {name: location_count_digest, type: char(64), nullable: false, default: NONE}
      - {name: primary_count, type: bigint, nullable: false, default: NONE}
      - {name: derivative_count, type: bigint, nullable: false, default: NONE}
      - {name: index_count, type: bigint, nullable: false, default: NONE}
      - {name: cache_count, type: bigint, nullable: false, default: NONE}
      - {name: queue_count, type: bigint, nullable: false, default: NONE}
      - {name: object_count, type: bigint, nullable: false, default: NONE}
      - {name: backup_suppression_count, type: bigint, nullable: false, default: NONE}
      - {name: backup_suppression_digest, type: char(64), nullable: false, default: NONE}
      - {name: restoration_suppression_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: restoration_suppression_count, type: bigint, nullable: false, default: '0'}
      - {name: suppression_mode, type: text, nullable: false, default: NONE}
      - {name: tombstone_state, type: text, nullable: false, default: NONE}
      - {name: tombstone_digest, type: char(64), nullable: false, default: NONE}
      - {name: outcome_manifest, type: jsonb, nullable: false, default: NONE, rust_type: PrivacyOutcomeManifestV1}
      - {name: outcome_manifest_digest, type: char(64), nullable: false, default: NONE}
      - {name: evidence_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: job_id, type: uuid, nullable: false, default: NONE, fk: ops.jobs(id) ON DELETE RESTRICT}
      - {name: lease_token, type: uuid, nullable: false, default: NONE}
      - {name: fencing_token, type: bigint, nullable: false, default: NONE}
      - {name: started_at, type: timestamptz, nullable: false, default: NONE}
      - {name: completed_at, type: timestamptz, nullable: false, default: NONE}
      - {name: worker_id, type: text, nullable: false, default: NONE}
      - {name: audit_event_id, type: uuid, nullable: false, default: NONE, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: retention_execution_receipts_pkey, columns: [id]}
    uniques:
      - {name: retention_execution_receipts_generation_uq, columns: [retention_request_id, approval_decision_id, execution_generation]}
      - {name: retention_execution_receipts_receipt_uq, columns: [receipt_digest]}
      - {name: retention_execution_receipts_job_fence_uq, columns: [job_id, fencing_token]}
      - {name: retention_execution_receipts_completion_binding_uq, columns: [id, retention_request_id, request_type, execution_kind]}
    foreign_keys:
      - {name: retention_execution_receipts_approval_type_fk, columns: [approval_decision_id, retention_request_id, request_type], references: "ops.retention_request_decisions(id,retention_request_id,request_type)", on_delete: RESTRICT}
    checks:
      - {name: retention_execution_receipts_generation_ck, expression: "execution_generation > 0 AND fencing_token > 0"}
      - {name: retention_execution_receipts_type_ck, expression: "(request_type = 'ACCESS' AND execution_kind = 'DISCLOSE_COPY') OR (request_type = 'CORRECTION' AND execution_kind = 'CORRECT') OR (request_type = 'DELETION' AND execution_kind = 'DESTRUCTIVE') OR (request_type = 'RESTRICTION' AND execution_kind = 'RESTRICT_PROCESSING')"}
      - {name: retention_execution_receipts_hold_ck, expression: "active_hold_cell_count = 0"}
      - {name: retention_execution_receipts_counts_ck, expression: "primary_count >= 0 AND derivative_count >= 0 AND index_count >= 0 AND cache_count >= 0 AND queue_count >= 0 AND object_count >= 0 AND backup_suppression_count >= 0"}
      - {name: retention_execution_receipts_location_json_ck, expression: "ops.retention_location_count_array_is_valid(request_type,location_counts) AND ops.retention_receipt_counts_are_valid(request_type,location_counts,primary_count,derivative_count,index_count,cache_count,queue_count,object_count,backup_suppression_count)"}
      - {name: retention_execution_receipts_suppression_ck, expression: "(request_type = 'ACCESS' AND restoration_suppression_count = 0 AND suppression_mode = 'NONE') OR (request_type = 'CORRECTION' AND restoration_suppression_count > 0 AND suppression_mode = 'PERMANENT_CORRECTION_REPLAY') OR (request_type = 'DELETION' AND restoration_suppression_count > 0 AND suppression_mode = 'PERMANENT_ERASURE') OR (request_type = 'RESTRICTION' AND restoration_suppression_count > 0 AND suppression_mode = 'UNTIL_RESTRICTION_RELEASE')"}
      - {name: retention_execution_receipts_tombstone_ck, expression: "(request_type = 'DELETION' AND tombstone_state = 'CREATED') OR (request_type <> 'DELETION' AND tombstone_state = 'NOT_APPLICABLE')"}
      - {name: retention_execution_receipts_outcome_ck, expression: "ops.privacy_outcome_manifest_is_valid(request_type,inventory_snapshot_digest,restoration_suppression_set_digest,outcome_manifest)"}
      - {name: retention_execution_receipts_time_ck, expression: "completed_at >= started_at"}
      - {name: retention_execution_receipts_worker_ck, expression: "length(worker_id) BETWEEN 1 AND 255"}
      - {name: retention_execution_receipts_digest_ck, expression: "ops.is_lower_sha256(schedule_set_digest) AND ops.is_lower_sha256(inventory_snapshot_digest) AND ops.is_lower_sha256(hold_coverage_digest) AND ops.is_lower_sha256(location_count_digest) AND ops.is_lower_sha256(backup_suppression_digest) AND ops.is_lower_sha256(restoration_suppression_set_digest) AND ops.is_lower_sha256(tombstone_digest) AND ops.is_lower_sha256(outcome_manifest_digest) AND ops.is_lower_sha256(evidence_set_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: retention_execution_receipts_request_idx, method: btree, keys: [retention_request_id, completed_at DESC, execution_generation DESC, id DESC]}
      - {name: retention_execution_receipts_approval_idx, method: btree, keys: [approval_decision_id, execution_generation DESC]}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: internal all-location execution proof; public view receives only redacted status and receipt digest}
    digest_and_concurrency:
      identity: retention_request_id+approval_decision_id+execution_generation
      canonical_digest: receipt_digest binds request type and execution kind, exact approved decision, schedule/inventory/hold snapshots, ordered request-discriminated location actions, every count, suppression mode/count/set, tombstone state/digest, closed outcome manifest/digest, evidence, lease fence, and times
      insert_rule: worker locks approved request and current effect-specific hold cells, validates its job lease/fence, re-evaluates rights/legal basis at claim time, requires every required location and outcome member with zero unclassified failure, inserts exactly one receipt, updates root APPROVED->COMPLETED, and emits retention.execution_completed.v1 atomically
      completion_rule: there is no external COMPLETE command; only this owner function may set COMPLETED, bind root completion_receipt_id/digest, and finalize the requester-safe outcome projection
    retention:
      record_class: PRIVACY_REQUEST_EXECUTION_RECEIPT
      trigger: request completion plus governing audit schedule
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: retention_request_id
      backup_behavior: receipt and suppression digest are restored before any data activation
    roundtrip:
      read_order: [completed_at DESC, execution_generation DESC, id DESC]
      assertions: [typed location array, count parity, no failed location, hold-zero, lease fence, generation replay, mismatched request/decision denial, immutable denial]

