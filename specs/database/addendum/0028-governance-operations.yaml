      watermarkDigest: sha256
      contentSha256: sha256
      scopeManifestDigest: sha256
      fieldRuleSetDigest: sha256
      watermarkSetDigest: sha256
      objectStoreHeadReceiptDigest: sha256
      completedAt: datetime

closed_json_validation_rules:
  implementation: SQL-language functions owned by gurine_migrator; IMMUTABLE, STRICT, PARALLEL SAFE; no dynamic SQL, locale comparison, implicit cast, or exception-as-valid path
  object_keys: each object requires jsonb_typeof(value)='object' and sorted jsonb_object_keys(value) set-equal to the declared required plus explicitly nullable field set; unknown and missing keys return false
  arrays: require jsonb_typeof(value)='array'; validate bounds before expansion; use WITH ORDINALITY and C-collated scalar tuple comparison for exact canonical order and uniqueness
  scalars: string/integer/boolean/null are checked by jsonb_typeof before text extraction; int64 conversion is range-guarded; timestamps require RFC3339 UTC instants; UUID and sha256 use closed lowercase lexical predicates
  discriminators: variant key set and value are selected only from the declared discriminator; fields from any other variant cause false even when null
  arithmetic: checked numeric/integer helpers reject overflow and require exact declared equalities; no floating point, rounding, missing-value substitution, or JSON numeric coercion
  canonical_digest: JSONB storage equality is not a digest algorithm; every digest is recomputed from GURINE_CANONICAL_JSON_V1 over the typed domain value after validation
  negative_fixture_matrix: [nonobject, nonarray, unknown_key, missing_key, null_required, wrong_scalar_type, out_of_range, duplicate_identity, noncanonical_order, invalid_discriminator, cross_variant_field, uppercase_digest, non_utc_time, arithmetic_mismatch]

polymorphic_target_bindings:
  conflict_target:
    rule: caller supplies one closed TargetBindingV1; owner function locks the exact row and derives target_type, target_id, target_version, and target_digest. Independent scalar combinations are comparison-only and cannot create a row.
    variants:
      CASE: {relation: editorial.cases, key: id, version: version, digest: canonical-case-version-digest}
      REVIEW_SNAPSHOT: {relation: editorial.review_snapshots, key: id, version: case_version, digest: snapshot_sha256}
      ACTION_PROPOSAL: {relation: ops.action_proposal_versions, key: [proposal_id, version], version: version, digest: decision_digest}
      PUBLICATION: {relation: editorial.publication_revisions, key: id, version: revision, digest: public_payload_sha256}
      COMMUNICATION_INTENT: {relation: ops.communication_intents, key: id, version: version, digest: intent_digest, exact_columns_pending_0027_freeze: true}
      RESPONSE_REQUEST: {relation: editorial.response_requests, key: id, version: version, digest: canonical-response-request-version-digest}
      LEGAL_HOLD: {relation: editorial.legal_holds, key: id, version: version, digest: canonical-hold-placement-digest}
      CAPABILITY: {relation: ops.capability_activation_decisions, key: [id, decision_version], version: decision_version, digest: decision_digest}
      SOURCE_ASSET: {relation: raw.source_documents, key: [id, asset_id, asset_revision, content_sha256], version: asset_revision, digest: content_sha256}
      RESEARCH_ARTIFACT: {relation: raw.research_artifacts, key: [id, asset_id, asset_revision, content_sha256], version: asset_revision, digest: content_sha256}
      PRIVACY_REQUEST: {relation: ops.retention_requests, key: [id, request_type, decision_version, current_inventory_snapshot_digest], version: decision_version, digest: current_inventory_snapshot_digest}
      COMMUNICATION_SUBJECT: {relation: intake.communication_subjects, key: [id, profile_version, profile_digest], version: profile_version, digest: profile_digest}

capability_evidence_matrix:
  all_production_classes_require: [OPERATING_ENTITY, CONTROLLER, COUNSEL_REVIEW, PRIVACY_NOTICE, DATA_MAP_DPIA]
  class_specific_required:
    PUBLIC_PUBLICATION: [RIGHTS_AUTHORIZATION, JURISDICTION_REVIEW]
    SOURCE_ACCESS: [SOURCE_LICENSE, RIGHTS_AUTHORIZATION, JURISDICTION_REVIEW]
    SOURCE_STORAGE: [SOURCE_LICENSE, RIGHTS_AUTHORIZATION, JURISDICTION_REVIEW]
    SOURCE_REDISTRIBUTION: [SOURCE_LICENSE, RIGHTS_AUTHORIZATION, JURISDICTION_REVIEW]
    MODEL_EGRESS: [PROCESSOR_DPA, TRANSFER_MECHANISM, MODEL_TERMS, RIGHTS_AUTHORIZATION, PROVIDER_APPROVAL, LIVE_PREFLIGHT_RECEIPT]
    DELIVERY_CHANNEL: [PROCESSOR_DPA, TRANSFER_MECHANISM, PROVIDER_APPROVAL, SENDER_VERIFICATION, TEMPLATE_APPROVAL, CALLBACK_RECONCILIATION, LIVE_PREFLIGHT_RECEIPT]
    PRIVACY_DSAR: [JURISDICTION_REVIEW, PAID_PROCESSING_AUTHORITY]
    PAID_WORKSPACE_PROCESSING: [PROCESSOR_DPA, TRANSFER_MECHANISM, PAID_PROCESSING_AUTHORITY, JURISDICTION_REVIEW]
  not_applicable_rule:
    allowed_only_for: [PROCESSOR_DPA, TRANSFER_MECHANISM, SOURCE_LICENSE, SENDER_VERIFICATION, TEMPLATE_APPROVAL, CALLBACK_RECONCILIATION, MODEL_TERMS, LIVE_PREFLIGHT_RECEIPT, PAID_PROCESSING_AUTHORITY]
    requires_reason_code: NO_EXTERNAL_PROCESSOR|NO_INTERNATIONAL_TRANSFER|NO_SOURCE_COMPONENT|NO_CHANNEL_COMPONENT|NO_MODEL_COMPONENT|NO_PAID_PROCESSING
    requires_authoritative_policy_evidence: true
  active_rule: every required kind has exactly one latest APPLICABLE+SATISFIED production-tier row, or a policy-authorized NOT_APPLICABLE row; any missing, duplicate, expired, UNSATISFIED, UNKNOWN, REVOKED, sandbox, fixture, connection-test, or nonproduction row blocks ACTIVE

governance_decision_closure:
  contract_status: DECISION_COMPLETE
  implementation_status: DESIGN_ONLY_PENDING_0025_TO_0029_DDL_RUST_API_UI_RUNTIME_AND_POSTGRES_PROOFS
  no_false_completion: REVIEW_REQUIRED remains authoritative until every listed migration, typed repository, service owner function, event, requester/internal projection, UI action, and negative/race oracle exists and passes on PostgreSQL 18.4; this file is not runtime evidence
  conditional_submit_review_assurance:
    normalized_decision_matrix:
      APPROVE: STEP_UP
      REJECT: ACTIVE_SESSION
      CHANGES_REQUIRED: ACTIVE_SESSION
      RECUSE: STEP_UP
    authority_rule: the evaluator consumes the already schema-validated closed decision discriminator, never raw JSON text, UI labels, case variants, or caller-provided assurance. Identity issues a fresh Actor Assertion bound to exact method, path, canonical query, body bytes, content type, operation ID submitReview, capability review.editorial, Idempotency-Key hash, action digest, normalized decision and assurance receipt.
    database_fence: editorial.submit_review_decision re-parses the typed command and derives required assurance again. APPROVE without a live unused STEP_UP receipt or with wrong actor/action/body/idempotency/operation/JTI, expired authorization, stale snapshot/assignment, non-CLEAR conflict, recusal-required actor, or direct INSERT writes zero review decision, assignment/task transition, event, audit success, or publication-eligible receipt.
    concurrency: lock idempotency, exact immutable snapshot, assignment generation, reviewer conflict snapshot and prior review decisions; 64 identical APPROVE requests create one decision and return one stored byte-identical receipt, changed bytes conflict, and every stale/JTI replay loses without side effects
  rights_request_lifecycle:
    intake: notice version/digest/acknowledgment, subject-proof receipt, closed subject scope schema/digest, jurisdiction, counsel-approved processing basis and policy/review digests are mandatory independently of optional contact consent; raw identity, receipt token and session token are never stored, logged, emitted, indexed or returned
    human_edges: [RECEIVED->REVIEW, REVIEW->APPROVED, REVIEW->REJECTED]
    worker_edge: APPROVED->COMPLETED
    owner_rule: control owns only human decision rows and privacy.request_decision_recorded.v1; retention-worker owns the immutable effect receipt, root completion CAS and exactly one retention.execution_completed.v1. No external COMPLETE selector, duplicate event, or two-phase root finalization remains.
    request_type_effects:
      ACCESS: exact immutable disclosure package bytes/hash/length/row count plus per-item disclosed or withheld reason; no restoration suppression and no mutation of source records
      CORRECTION: append immutable corrected-version facts and receipts; preserve originals; create permanent correction replay suppressions so restore cannot reactivate superseded bytes
      DELETION: per-location DELETE|ANONYMIZE|CRYPTO_ERASE or closed lawful exception, exact counts, tombstone and permanent restoration suppressions
      RESTRICTION: append processing suppressions for exact scope with review due time; release is a separate authorized append-only fact and expiry only opens review work
    hold_effect_matrix:
      ACCESS_DISCLOSURE: a matching DISCLOSURE hold prevents every held byte from entering a package; the request remains REVIEW until a current legal withholding decision classifies every held member, after which only nonheld bytes plus nonrevealing withholding reasons may be exported
      CORRECTION_APPEND: RETENTION and DELETION holds preserve the prior row but do not block a non-destructive append-only correction; any public/external disclosure of the correction separately obeys DISCLOSURE coverage and publication rights
      DELETION_DESTRUCTIVE: matching RETENTION or DELETION coverage blocks the complete affected action unit; no partial delete, tombstone, suppression-count completion, or COMPLETED transition is allowed
      RESTRICTION_PLACE: protective restriction may append without destroying held evidence; matching coverage remains independently active
      RESTRICTION_RELEASE: release is blocked when any applicable legal hold, legal exception, stale policy, UNKNOWN rights, or unexpired higher-priority restriction remains
    requester_projection_field_removal:
      always_return: [requestId, requestType, state, submittedAt, updatedAt, dueAt, decisionReasonCode, outcomeSummary, receiptDigest, nextActions, links]
      conditional_safe_only: [packageByteLength, packageSha256, disclosedCount, withheldCount, correctedCount, deletedCount, restrictedCount, completedAt]
      never_return: [subject_ref_hash, subject_scope_digest, encrypted_scope, encrypted_statement, proof_internal_id, contact_endpoint_ciphertext, receipt_token_hash, session_token_or_hash, legal_hold_ids_or_cells, internal_object_keys, internal_policy_notes, worker_id, lease_token, fencing_token]
  appeal_lifecycle:
    requester_sessions: APPEAL_CREATE creates once; APPEAL_STATUS reads/re-enters only the exact appeal; APPEAL_WITHDRAW is a fresh one-shot child for requester-only withdrawal. Parent RESPONSE_RECEIPT remains read-only and none of the three child kinds widens or substitutes another.
    independence: START_REVIEW derives and locks prior decider, case authors/editors/publisher, response party/recipient and current conflict declarations; selected reviewer must be distinct, assigned to the exact appeal generation, hold a current CLEAR snapshot and remain eligible at RESOLVE
    terminal_effects: RESOLVE requires one stored AppealRemedyBindingV1 matching requested_outcome and exact effect receipt; REJECT/MARK_DUPLICATE require reason/evidence; REQUESTER_WITHDRAW requires requester session proof and no staff actor; no generic evidence UUID or free-form reason can represent a remedy
    replay_and_idor: session claim and idempotency are locked before ACTIVE validation; finalized exact replay survives one-shot consumption. Reused token, wrong issuer/appeal/submission/request/receipt, cross-IDOR, stale sequence, terminal replay with changed bytes, expired session, prior-decider assignment, conflict/recusal or remedy mismatch returns the same non-enumerating error and zero mutation.
  legal_hold_placement_release:
    anchor_rule: every case and non-case placement uses one immutable concrete relation/version/digest anchor; generic object_type/object_id are derived comparison fields, never authority
    coverage_rule: active coverage is placement-cell union minus append-only release cells. expires_at is review_due only; no scheduler, migration or restore may synthesize release.
    release_gate: every partial/full release re-locks exact anchor and target bytes, current coverage, current authority artifact, current policy, current CLEAR releaser conflict snapshot, placer-releaser separation, action-bound STEP_UP receipt, expected release sequence and idempotency. Any stale or mismatched fact writes zero release cells.
    restore_rule: placements, releases and signed/WORM suppression high-watermark reconcile while restore is QUARANTINED; only exact digest parity may enter ACTIVATABLE. RECONCILING or BLOCKED permits no DB read serving, search/index rebuild, cache fill, job claim, object read, model/provider egress, export or publication.
  effect_time_rights_and_hold_fence:
    effect_classes: [SOURCE_FETCH, PARSER_OR_OCR, MODEL_EGRESS, AGENT_TOOL, EVIDENCE_PROMOTION, RESPONSE_EXCERPT, DATASET_EXPORT, AUDIT_EXPORT, PUBLICATION, COMMUNICATION_DELIVERY]
    exact_binding: every effect input binds concrete asset ID, revision, content hash, latest rights decision ID/version/digest, all nine rights dimensions, legal basis, license, attribution, policy/evidence, and exact active hold coverage digest; transitive datasets and research artifacts expand to canonical member assets
    required_checks: the same resolver runs while enqueueing and again after a fenced job/provider claim immediately before the first external read/write. Latest means greatest decision_version under row lock, not greatest unexpired allowed row.
    deny_rule: missing or ambiguous binding, UNKNOWN/REVIEW_REQUIRED/DENY, SUSPEND/REVOKE, expiry, prior-version fallback, insufficient use dimension, license/attribution mismatch, or matching effect-specific hold produces zero job claim completion, provider/tool call, object/export bytes, excerpt, delivery or publication revision. Only a typed blocked/reconciliation receipt and audit may be appended.
    race_rule: rights or hold change between enqueue and claim invalidates the queued digest; a 64-way claim has one fencing winner and no stale claimant may make an external call
  publication_snapshot_and_gate:
    snapshot_manifest: review snapshot is canonical exact bytes plus PublicationSnapshotMemberSetV1. Every claim, claim-evidence relation, evidence/source/response, consent/excerpt, counter-evidence, entity resolution, AI provenance, copy-safety and governance input is version/digest fixed and resolved through a closed member-kind registry.
    corroboration:
      pass_rule: each public factual or calculated claim has either one current official-outcome source or at least two current independently controlled source families; mirrors, syndicated copies, reposts and URLs sharing one origin/ultimate controller count as one family
      counter_evidence_rule: every current material counter-evidence item is incorporated or excluded by one human review decision with reason/digest; absence, UNKNOWN or unaddressed item blocks
    epistemic_and_ai_copy:
      epistemic_classes: [VERIFIED_FACT, SUPPORTED_INFERENCE, ALLEGATION, UNKNOWN, DISPUTED, RETRACTED]
      exact_surfaces: [title, body, quote, caption, alt_text, snippet, notification]
      rule: every surface is in one rendered_surface_set_digest and one current PASS copy-safety evaluation; AI-derived content additionally binds prompt/schema/model/tool/citation receipts and human review. No probabilistic score is rendered as fact, no nonresponse is admission, and uncertainty uses the closed epistemic class plus public methodology/provenance link.
    invalidation: any member ID/version/digest, relation kind, consent/rights/hold/freshness, counter-evidence disposition, entity resolution, AI receipt, copy surface, policy, conflict, funding, activation, switch, case version or earliest expiry change invalidates snapshot, preview, review approvals and gate; rebuild creates new rows, never refreshes in place
    exact_byte_binding: snapshot_sha256 hashes snapshot_payload_bytes; preview_sha256 hashes preview_bytes; public_payload_sha256 hashes preview.public_payload_bytes and final revision.public_payload_bytes byte-for-byte. PASS copies bytes without rerendering. Hash/length/media-type or member-set mismatch is EVALUATOR_DIVERGENCE and zero revisions.
    blockers: [CASE_NOT_READY, SNAPSHOT_STALE, PREVIEW_STALE, CLAIM_EVIDENCE_INCOMPLETE, CORROBORATION_INSUFFICIENT, SOURCE_STALE, ENTITY_RESOLUTION_UNVERIFIED, COUNTER_EVIDENCE_UNADDRESSED, AI_PROVENANCE_INCOMPLETE, COPY_SAFETY_UNSATISFIED, RESPONSE_POLICY_UNSATISFIED, RIGHTS_NOT_AUTHORIZED, PRIVACY_OR_RESTRICTION_BLOCKED, DISCLOSURE_HOLD_ACTIVE, CONFLICT_UNRESOLVED, FUNDING_DISCLOSURE_STALE, QUORUM_INSUFFICIENT, LEGAL_APPROVAL_REQUIRED, LEGAL_ACTIVATION_NOT_APPROVED, KILL_SWITCH_ACTIVE, EVALUATOR_DIVERGENCE]
  immutable_correction_retraction_restriction:
    common_owner: all NORMAL, CORRECTION, RETRACTION_TOMBSTONE, RESTRICTION_NOTICE and RESTRICTION_RELEASE revisions use the same SERIALIZABLE publication gate and deferred PASS=one/BLOCKED=zero graph
    sequence: lock case/current revision and effect root at expected versions; create fresh snapshot and exact-byte preview; evaluate current rights/hold/privacy/conflict/funding/quorum/activation/switch/copy safety; insert gate graph; on PASS insert exactly revision N+1, effect receipt, case pointer, audit and reconstructive outbox; on BLOCKED insert no revision/effect receipt
    immutability: source publication, prior correction/retraction/restriction, public projection history and object bytes are never updated or deleted. Projector replay with equal digest is a no-op; different digest is projection corruption and opens an incident.
    expiry: restriction expiry and rights/license/policy expiry only create review work and a blocker; none changes public access. A fresh release gate is the sole release path.
  funding_conflict_recusal:
    authority_series: self, each internal authoritative system, and each external registry/signed document have separate append-only conflict series; snapshots preserve all current facts and authority digests rather than collapsing them into one declaration
    total_disposition_precedence: [BLOCKED_UNKNOWN, RECUSE_REQUIRED, INDEPENDENT_REVIEW_REQUIRED, DISCLOSURE_REQUIRED, CLEAR]
    total_disposition_matrix:
      unknown_or_conflicting: any relevant missing, stale, UNKNOWN or conflicting exact authority fact yields BLOCKED_UNKNOWN
      own_work_or_party: AUTHORSHIP|EDITING|CASE_PARTY|RECIPIENT current material yields RECUSE_REQUIRED for counted reviewer, legal reviewer, publisher, approver or executor; author/preparer participation requires disclosure plus a distinct independent reviewer
      close_relationship: PERSONAL|FAMILY|EMPLOYMENT|ADVISORY|FINANCIAL|POLITICAL|FUNDING|CUSTOMER current material yields RECUSE_REQUIRED for counted decision roles and INDEPENDENT_REVIEW_REQUIRED for noncounted authors/preparers
      past_material: relevant PAST+MATERIAL yields INDEPENDENT_REVIEW_REQUIRED for counted decision roles and DISCLOSURE_REQUIRED otherwise
      nonmaterial_present: relevant PRESENT+NON_MATERIAL yields DISCLOSURE_REQUIRED
      absent_or_not_applicable: exact current ABSENT or policy-authorized NOT_APPLICABLE contributes CLEAR
    recusal_atomicity: RECUSE always binds a nonnull exact declaration and snapshot, terminalizes one assignment generation, inserts exactly one deterministic eligible replacement or durable vacancy, appends audit/event/receipt and excludes the actor from the target forever; no staffing shortage rolls back recusal
    funding_bridge: publication and funding actions bind the exact 0029 funding snapshot/revision/denominator/grouping/UNKNOWN state/quorum/policy digests. Preparer, publisher, oversight/board approvers and each counted reviewer are pairwise independent and each has its own current conflict snapshot; any denominator UNKNOWN, grouping dispute, stale disclosure, related-party conflict or missing required quorum blocks publication/economic effect.
  incident_lifecycle:
    edges: [NONE->DETECTED, DETECTED->TRIAGED, TRIAGED->CONTAINED, CONTAINED->RECOVERING, RECOVERING->RESOLVED, RESOLVED->POSTMORTEM_CLOSED]
    authorization:
      DETECTED: incident-detector or human with incident.manage
      TRIAGED: assigned owner or on-call incident manager
      CONTAINED: commander; SEV0/SEV1 requires nonnull commander and exact switch/cancellation/reconciliation plan receipts
      RECOVERY_STARTED: commander with rollback plan and validation evidence
      RESOLVED: independent incident approver; for SEV0/SEV1 actor differs from commander and owner
      POSTMORTEM_CLOSED: reviewer distinct from commander/owner who binds root cause, contributing factors and durable action items
    resolution_fence: all affected SLI receipts are current and non-UNKNOWN, every ambiguous provider/data effect has terminal reconciliation, every required restore probe is current, and every affected capability is current-ready. Missing or stale evidence leaves state unchanged.
    recurrence_and_visibility: resolved roots never reopen; recurrence creates a linked DETECTED root. External/status projections contain severity, impact summary, affected capability labels, current state, as-of/next update and recovery status only; evidence refs, raw logs, object keys, provider identities, encrypted detail, internal user IDs, tokens and security-sensitive containment steps are removed.
  audit_export:
    immutable_request: exact actor, reason, from/to, format, scope, object selector, watermark policy, expiry, request bytes/idempotency, field rules, rights/hold manifests and audit-chain high-watermark are immutable after QUEUED
    owner_lifecycle: only fixed-search-path owner functions may execute QUEUED->RUNNING->READY|FAILED and READY->EXPIRED with expected version, lease and fencing token; terminal READY object metadata and bytes never change
    object_receipt: READY binds immutable object key+version, media type, exact byte length, row count, pre-watermark hash, watermark digest, final watermarked SHA-256, field-removal set digest and materialization receipt. Object HEAD/body mismatch, truncation, reordered row, altered watermark or wrong chain high-watermark fails before READY.
    retrieval: status query is non-mutating and field-removed; server-side authorization rechecks actor/scope/capability/expiry/rights/holds and object metadata before issuing a short-lived single-purpose download. URL/token/object key are never persisted in response history, analytics, logs or audit payload.

support_functions_and_triggers:
  - name: ops.is_lower_sha256
    signature: (text) -> boolean
    properties: IMMUTABLE STRICT PARALLEL SAFE
  - name: ops.text_array_is_sorted_unique
    signature: "(text[]) -> boolean"
    properties: IMMUTABLE STRICT PARALLEL SAFE
  - name: ops.uuid_array_is_sorted_unique
    signature: "(uuid[]) -> boolean"
    properties: IMMUTABLE STRICT PARALLEL SAFE
  - name: ops.uuid_array_is_unique
    signature: "(uuid[]) -> boolean"
    properties: IMMUTABLE STRICT PARALLEL SAFE
  - name: ops.guard_journey_instance_update_v1
    signature: () -> trigger
    properties: SECURITY DEFINER; fixed search_path pg_catalog,ops,pg_temp; rejects DELETE and immutable-column changes; every UPDATE advances version by exactly one and matches one declared simple or compound journey step
    install: BEFORE UPDATE OR DELETE ON ops.journey_instances FOR EACH ROW
    trigger_contract: {timing: BEFORE, events: [UPDATE, DELETE], relation: ops.journey_instances, for_each: ROW, constraint: false, deferrable: false, initially_deferred: false}
    security_contract: {security_definer: true, search_path: [pg_catalog, ops, pg_temp], public_execute: false, runtime_execute: []}
    owner: gurine_migrator
    execute_roles: []
  - name: ops.guard_journey_handoff_update_v1
    signature: () -> trigger
    properties: SECURITY DEFINER; fixed search_path pg_catalog,ops,pg_temp; rejects DELETE, immutable-column changes, terminal outgoing edges and every undeclared decision shape; every UPDATE advances version by exactly one
    install: BEFORE UPDATE OR DELETE ON ops.journey_handoffs FOR EACH ROW
    trigger_contract: {timing: BEFORE, events: [UPDATE, DELETE], relation: ops.journey_handoffs, for_each: ROW, constraint: false, deferrable: false, initially_deferred: false}
    security_contract: {security_definer: true, search_path: [pg_catalog, ops, pg_temp], public_execute: false, runtime_execute: []}
    owner: gurine_migrator
    execute_roles: []
  - name: ops.check_journey_decision_idempotency_complete_v1
    signature: () -> trigger
    properties: SECURITY DEFINER; fixed search_path pg_catalog,ops,pg_temp; DEFERRABLE INITIALLY DEFERRED; a touched JOURNEY_HANDOFF_DECISION BOUND_V1 row must be RESPONSE_FINAL with a complete exact response tuple at commit, so a synchronous incomplete claim can never escape its business transaction
    install: AFTER INSERT OR UPDATE ON ops.idempotency_keys FOR EACH ROW CONSTRAINT DEFERRABLE INITIALLY DEFERRED
    trigger_contract: {timing: AFTER, events: [INSERT, UPDATE], relation: ops.idempotency_keys, for_each: ROW, constraint: true, deferrable: true, initially_deferred: true}
    security_contract: {security_definer: true, search_path: [pg_catalog, ops, pg_temp], public_execute: false, runtime_execute: []}
    owner: gurine_migrator
    execute_roles: []
  - name: ops.check_journey_instance_head_v1
    signature: () -> trigger
