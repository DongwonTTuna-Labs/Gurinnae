      - {name: journey_handoffs_last_receipt_fk, columns: [last_receipt_id, journey_instance_id, id, version, last_receipt_digest], references: "ops.journey_transition_receipts(id,journey_instance_id,handoff_id,handoff_version,receipt_digest)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
