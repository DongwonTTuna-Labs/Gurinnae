      - {name: legal_hold_target_anchors_digest_uq, columns: [anchor_digest]}
      - {name: legal_hold_target_anchors_id_digest_uq, columns: [id, anchor_digest]}
      - {name: legal_hold_target_anchors_target_uq, columns: [target_kind, target_id, target_version, target_digest]}
    foreign_keys:
      - {name: legal_hold_target_anchors_case_fk, columns: [case_review_snapshot_id, case_id, target_version, target_digest], references: "editorial.review_snapshots(id,case_id,case_version,snapshot_sha256)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_publication_fk, columns: [publication_revision_id, target_version, target_digest], references: "editorial.publication_revisions(id,revision,public_payload_sha256)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_evidence_fk, columns: [evidence_id, target_version, target_digest], references: "editorial.evidence(id,version,evidence_digest)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_response_fk, columns: [response_id, target_version, target_digest], references: "editorial.responses(id,version,content_sha256)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_source_asset_fk, columns: [source_document_id, source_asset_id, target_version, target_digest], references: "raw.source_documents(id,asset_id,asset_revision,content_sha256)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_research_asset_fk, columns: [research_artifact_id, research_asset_id, target_version, target_digest], references: "raw.research_artifacts(id,asset_id,asset_revision,content_sha256)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_privacy_fk, columns: [privacy_request_id, privacy_request_type], references: "ops.retention_requests(id,request_type)", on_delete: RESTRICT, deferrable: false}
      - {name: legal_hold_target_anchors_subject_fk, columns: [communication_subject_id, communication_subject_origin_digest], references: "intake.communication_subjects(id,origin_binding_digest)", on_delete: RESTRICT, deferrable: false}
    checks:
      - {name: legal_hold_target_anchors_kind_ck, expression: "target_kind IN ('CASE','PUBLICATION','EVIDENCE','RESPONSE','SOURCE_ASSET','RESEARCH_ARTIFACT','PRIVACY_REQUEST','COMMUNICATION_SUBJECT')"}
      - {name: legal_hold_target_anchors_version_ck, expression: "target_version > 0"}
      - name: legal_hold_target_anchors_shape_ck
        expression: "(target_kind = 'CASE' AND case_id = target_id AND case_review_snapshot_id IS NOT NULL AND num_nonnulls(publication_revision_id,evidence_id,response_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'PUBLICATION' AND publication_revision_id = target_id AND num_nonnulls(case_id,case_review_snapshot_id,evidence_id,response_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'EVIDENCE' AND evidence_id = target_id AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,response_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'RESPONSE' AND response_id = target_id AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,evidence_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'SOURCE_ASSET' AND source_asset_id = target_id AND source_document_id IS NOT NULL AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,evidence_id,response_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'RESEARCH_ARTIFACT' AND research_asset_id = target_id AND research_artifact_id IS NOT NULL AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,evidence_id,response_id,source_document_id,source_asset_id,privacy_request_id,privacy_request_type,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'PRIVACY_REQUEST' AND privacy_request_id = target_id AND privacy_request_type IN ('ACCESS','CORRECTION','DELETION','RESTRICTION') AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,evidence_id,response_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,communication_subject_id,communication_subject_origin_digest) = 0) OR (target_kind = 'COMMUNICATION_SUBJECT' AND communication_subject_id = target_id AND communication_subject_origin_digest IS NOT NULL AND num_nonnulls(case_id,case_review_snapshot_id,publication_revision_id,evidence_id,response_id,source_document_id,source_asset_id,research_artifact_id,research_asset_id,privacy_request_id,privacy_request_type) = 0)"
      - {name: legal_hold_target_anchors_digest_ck, expression: "ops.is_lower_sha256(target_digest) AND (communication_subject_origin_digest IS NULL OR ops.is_lower_sha256(communication_subject_origin_digest)) AND ops.is_lower_sha256(anchor_digest)"}
      - {name: legal_hold_target_anchors_classification_ck, expression: "classification = 'RESTRICTED_GOVERNANCE'"}
    indexes:
      - {name: legal_hold_target_anchors_target_idx, method: btree, keys: [target_kind, target_id, target_version DESC, id DESC]}
      - {name: legal_hold_target_anchors_case_idx, method: btree, keys: [case_id, target_kind, id], predicate: case_id IS NOT NULL}
      - {name: legal_hold_target_anchors_privacy_idx, method: btree, keys: [privacy_request_id, id], predicate: privacy_request_id IS NOT NULL}
      - {name: legal_hold_target_anchors_subject_idx, method: btree, keys: [communication_subject_id, id], predicate: communication_subject_id IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable typed target binding; contains only internal IDs and digests and has no direct external/session access}
    digest_and_concurrency:
      identity: target_kind+target_id+target_version+target_digest
      canonical_digest: anchor_digest binds the exact target kind, concrete FK identity/version/digest, classification, and audit event; no caller-supplied polymorphic scalar is authoritative
      insert_rule: editorial.place_legal_hold locks the concrete target row, derives every generic target scalar, inserts or reuses the exact anchor, then inserts the immutable placement in one SERIALIZABLE transaction
      historical_backfill: every old hold must resolve its object_type/object_id plus case snapshot to exactly one concrete target tuple; missing, ambiguous, or digest-unreconstructible rows stop migration and require a signed remediation artifact
    retention:
      record_class: LEGAL_HOLD_TARGET_ANCHOR
      trigger: never before every placement/release and the concrete target are beyond their governing schedules
      terminal_action: PRESERVE_PUBLIC_REVISION
      legal_hold_key: target_kind+target_id+target_digest
      backup_behavior: anchors restore and verify before any hold coverage or target data becomes accessible
    roundtrip:
      read_order: [target_kind ASC, target_id ASC, target_version DESC, id DESC]
      assertions: [all eight target variants, concrete FK mismatch, generic-scalar mismatch, legacy ambiguity failure, idempotent exact anchor, immutable denial, undeclared-role denial]

  - relation: editorial.conflict_declarations
    domain: ConflictDeclaration
    repository: crates/persistence-postgres::conflicts
    logical_owner: trust-governance
    writer_components: [control-api]
    mutation: APPEND_ONLY
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: subject_actor_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: declared_by_user_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: target_type, type: text, nullable: false, default: NONE}
      - {name: target_id, type: text, nullable: false, default: NONE}
      - {name: target_version, type: bigint, nullable: false, default: NONE}
      - {name: target_digest, type: char(64), nullable: false, default: NONE}
      - {name: conflict_type, type: text, nullable: false, default: NONE}
      - {name: relation_state, type: text, nullable: false, default: NONE}
      - {name: materiality, type: text, nullable: false, default: NONE}
      - {name: temporal_state, type: text, nullable: false, default: NONE}
      - {name: source_class, type: text, nullable: false, default: NONE}
      - {name: source_authority_type, type: text, nullable: false, default: NONE}
      - {name: source_authority_id, type: text, nullable: false, default: NONE}
      - {name: source_authority_digest, type: char(64), nullable: false, default: NONE}
      - {name: nonwaivable, type: boolean, nullable: false, default: 'false'}
      - {name: evidence_refs, type: jsonb, nullable: false, default: "'[]'::jsonb", rust_type: ConflictEvidenceRefV1Array}
      - {name: evidence_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: declaration_reason_encrypted, type: bytea, nullable: true, default: NONE}
      - {name: declaration_reason_digest, type: char(64), nullable: false, default: NONE}
      - {name: declaration_sequence, type: bigint, nullable: false, default: NONE}
      - {name: effective_at, type: timestamptz, nullable: false, default: NONE}
      - {name: expires_at, type: timestamptz, nullable: false, default: NONE}
      - {name: supersedes_declaration_id, type: uuid, nullable: true, default: NONE, fk: editorial.conflict_declarations(id) ON DELETE RESTRICT}
      - {name: declaration_digest, type: char(64), nullable: false, default: NONE}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: classification, type: text, nullable: false, default: "'RESTRICTED_GOVERNANCE'"}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: conflict_declarations_pkey, columns: [id]}
    uniques:
      - {name: conflict_declarations_digest_uq, columns: [declaration_digest]}
      - {name: conflict_declarations_receipt_uq, columns: [receipt_digest]}
      - {name: conflict_declarations_series_uq, columns: [subject_actor_id, target_type, target_id, conflict_type, source_class, source_authority_type, source_authority_id, declaration_sequence]}
      - {name: conflict_declarations_exact_fact_uq, columns: [subject_actor_id, target_type, target_id, conflict_type, source_class, source_authority_type, source_authority_id, effective_at, declaration_digest]}
    checks:
      - {name: conflict_declarations_target_type_ck, expression: "target_type IN ('CASE','REVIEW_SNAPSHOT','ACTION_PROPOSAL','PUBLICATION','COMMUNICATION_INTENT','RESPONSE_REQUEST','LEGAL_HOLD','CAPABILITY','SOURCE_ASSET','RESEARCH_ARTIFACT','PRIVACY_REQUEST','COMMUNICATION_SUBJECT')"}
      - {name: conflict_declarations_target_id_ck, expression: "length(target_id) BETWEEN 1 AND 512 AND target_version > 0"}
      - {name: conflict_declarations_conflict_type_ck, expression: "conflict_type IN ('AUTHORSHIP','EDITING','CASE_PARTY','RECIPIENT','ROLE','PERSONAL','FAMILY','EMPLOYMENT','ADVISORY','FINANCIAL','POLITICAL','FUNDING','CUSTOMER')"}
      - {name: conflict_declarations_relation_state_ck, expression: "relation_state IN ('PRESENT','ABSENT','UNKNOWN')"}
      - {name: conflict_declarations_materiality_ck, expression: "materiality IN ('MATERIAL','NON_MATERIAL','UNKNOWN','NOT_APPLICABLE') AND temporal_state IN ('CURRENT','PAST','UNKNOWN','NOT_APPLICABLE') AND source_class IN ('SELF_DECLARED','INTERNAL_AUTHORITATIVE','EXTERNAL_AUTHORITATIVE')"}
      - {name: conflict_declarations_authority_ck, expression: "source_authority_type IN ('SELF','INTERNAL_SYSTEM','EXTERNAL_REGISTRY','SIGNED_DOCUMENT') AND length(source_authority_id) BETWEEN 1 AND 512 AND ((source_class = 'SELF_DECLARED' AND source_authority_type = 'SELF' AND source_authority_id = subject_actor_id::text) OR (source_class = 'INTERNAL_AUTHORITATIVE' AND source_authority_type = 'INTERNAL_SYSTEM') OR (source_class = 'EXTERNAL_AUTHORITATIVE' AND source_authority_type IN ('EXTERNAL_REGISTRY','SIGNED_DOCUMENT')))"}
      - {name: conflict_declarations_state_shape_ck, expression: "(relation_state = 'ABSENT' AND materiality = 'NOT_APPLICABLE' AND temporal_state = 'NOT_APPLICABLE') OR (relation_state = 'UNKNOWN' AND materiality = 'UNKNOWN' AND temporal_state = 'UNKNOWN') OR (relation_state = 'PRESENT' AND materiality IN ('MATERIAL','NON_MATERIAL','UNKNOWN') AND temporal_state IN ('CURRENT','PAST','UNKNOWN'))"}
      - {name: conflict_declarations_nonwaivable_ck, expression: "nonwaivable = (relation_state = 'PRESENT' AND materiality = 'MATERIAL' AND temporal_state = 'CURRENT' AND conflict_type IN ('AUTHORSHIP','CASE_PARTY','RECIPIENT','EMPLOYMENT','FINANCIAL','FUNDING','CUSTOMER'))"}
      - {name: conflict_declarations_sequence_ck, expression: "declaration_sequence > 0 AND ((declaration_sequence = 1 AND supersedes_declaration_id IS NULL) OR (declaration_sequence > 1 AND supersedes_declaration_id IS NOT NULL))"}
      - {name: conflict_declarations_time_ck, expression: "expires_at > effective_at"}
      - {name: conflict_declarations_classification_ck, expression: "classification = 'RESTRICTED_GOVERNANCE'"}
      - {name: conflict_declarations_evidence_json_ck, expression: "editorial.conflict_evidence_ref_array_is_valid(evidence_refs)"}
      - {name: conflict_declarations_digest_ck, expression: "ops.is_lower_sha256(target_digest) AND ops.is_lower_sha256(source_authority_digest) AND ops.is_lower_sha256(evidence_set_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(declaration_reason_digest) AND ops.is_lower_sha256(declaration_digest) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: conflict_declarations_lookup_idx, method: btree, keys: [subject_actor_id, target_type, target_id, conflict_type, source_class, source_authority_type, source_authority_id, declaration_sequence DESC, id DESC]}
      - {name: conflict_declarations_expiry_idx, method: btree, keys: [expires_at, id], predicate: expires_at IS NOT NULL}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: internal governance fact with no direct external/session access}
    digest_and_concurrency:
      identity: subject_actor_id+target_type+target_id+target_version+conflict_type+source_class+source_authority_type+source_authority_id+declaration_sequence
      canonical_digest: declaration_digest = SHA256(GURINE_CANONICAL_JSON_V1(all semantic columns except id, encrypted bytes, receipt_digest, created_at; reason represented by declaration_reason_digest; source authority represented by exact type, ID and digest))
      insert_rule: semantic lock on subject+target+conflict_type+source authority; expected prior sequence must match; same identity and digest returns the existing row; a changed fact is sequence+1 and supersedes only the exact prior row in that authority series
      overlap_rule: overlapping PRESENT/ABSENT/UNKNOWN facts are preserved and force the consuming snapshot to UNKNOWN; they are never overwritten
    retention:
      record_class: GOVERNANCE_CONFLICT_DECLARATION
      trigger: superseded_or_expires_at
      terminal_action: CRYPTO_ERASE
      preserved_after_crypto_erase: [identity, relation_state, digests, effective_at, expires_at, audit linkage]
      legal_hold_key: target_type+target_id
      backup_behavior: encrypted detail key remains suppressed after restore when erased
    roundtrip:
      read_order: [effective_at DESC, id DESC]
      assertions: [closed target and relation enums, encrypted detail byte identity, ordered evidence refs, supersession chain, duplicate replay, update/delete denial, stale and conflicting fact preservation]

  - relation: editorial.conflict_snapshots
    domain: ConflictSnapshot
    repository: crates/persistence-postgres::conflicts
    logical_owner: trust-governance
    writer_components: [control-api]
    mutation: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: subject_actor_id, type: uuid, nullable: false, default: NONE, fk: ops.users(id) ON DELETE RESTRICT}
      - {name: target_type, type: text, nullable: false, default: NONE}
      - {name: target_id, type: text, nullable: false, default: NONE}
      - {name: target_version, type: bigint, nullable: false, default: NONE}
      - {name: target_digest, type: char(64), nullable: false, default: NONE}
      - {name: operation_id, type: text, nullable: false, default: NONE}
      - {name: action_kind, type: text, nullable: true, default: NONE}
      - {name: candidate_role, type: text, nullable: false, default: NONE}
      - {name: declaration_ids, type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      - {name: declaration_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: finding_set, type: jsonb, nullable: false, default: NONE, rust_type: ConflictFindingSetV1}
      - {name: finding_set_digest, type: char(64), nullable: false, default: NONE}
      - {name: authorship_digest, type: char(64), nullable: false, default: NONE}
      - {name: party_recipient_digest, type: char(64), nullable: false, default: NONE}
      - {name: role_digest, type: char(64), nullable: false, default: NONE}
      - {name: relationship_digest, type: char(64), nullable: false, default: NONE}
      - {name: funding_customer_digest, type: char(64), nullable: false, default: NONE}
      - {name: policy_digest, type: char(64), nullable: false, default: NONE}
      - {name: evaluation_state, type: text, nullable: false, default: NONE}
      - {name: blocker_codes, type: 'text[]', nullable: false, default: "'{}'::text[]"}
      - {name: nonwaivable_blocker_count, type: smallint, nullable: false, default: '0'}
      - {name: evaluated_at, type: timestamptz, nullable: false, default: NONE}
      - {name: valid_until, type: timestamptz, nullable: false, default: NONE}
      - {name: evaluated_by_type, type: text, nullable: false, default: NONE}
      - {name: evaluated_by_id, type: text, nullable: false, default: NONE}
      - {name: snapshot_sha256, type: char(64), nullable: false, default: NONE}
      - {name: receipt_digest, type: char(64), nullable: false, default: NONE}
      - {name: classification, type: text, nullable: false, default: "'RESTRICTED_GOVERNANCE'"}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: conflict_snapshots_pkey, columns: [id]}
    uniques:
      - {name: conflict_snapshots_sha_uq, columns: [snapshot_sha256]}
      - {name: conflict_snapshots_receipt_uq, columns: [receipt_digest]}
      - {name: conflict_snapshots_exact_eval_uq, columns: [subject_actor_id, target_type, target_id, target_version, candidate_role, policy_digest, declaration_set_digest, evaluated_at]}
      - {name: conflict_snapshots_actor_digest_uq, columns: [id, subject_actor_id, snapshot_sha256]}
      - {name: conflict_snapshots_exact_binding_uq, columns: [id, subject_actor_id, target_type, target_id, target_version, target_digest, snapshot_sha256, evaluation_state, valid_until]}
    checks:
      - {name: conflict_snapshots_target_type_ck, expression: "target_type IN ('CASE','REVIEW_SNAPSHOT','ACTION_PROPOSAL','PUBLICATION','COMMUNICATION_INTENT','RESPONSE_REQUEST','LEGAL_HOLD','CAPABILITY','SOURCE_ASSET','RESEARCH_ARTIFACT','PRIVACY_REQUEST','COMMUNICATION_SUBJECT') AND target_version > 0"}
      - {name: conflict_snapshots_operation_ck, expression: "operation_id IN ('submitReview','submitActionDecision','placeLegalHold','publishCase','releaseLegalHold','private.ExecuteApprovedAction')"}
      - {name: conflict_snapshots_action_kind_ck, expression: "action_kind IS NULL OR action_kind IN ('HYPOTHESIS','CLAIM','TASK','COMPARABLE','COMMUNICATION','PUBLICATION','RETRACTION','RULE_ACTIVATION','ROLE_GRANT','KILL_SWITCH','COMMUNICATION_AUTHORIZATION','ASSET_RIGHTS_DECISION','RETENTION_SCHEDULE','FUNDING_DISCLOSURE','CAPABILITY_ACTIVATION','RESPONSE_POLICY_CALENDAR')"}
      - {name: conflict_snapshots_candidate_role_ck, expression: "candidate_role IN ('AUTHOR','EDITOR','LEGAL_REVIEWER','PUBLISHER','APPROVER','EXECUTOR')"}
      - {name: conflict_snapshots_state_ck, expression: "evaluation_state IN ('CLEAR','DISCLOSURE_REQUIRED','INDEPENDENT_REVIEW_REQUIRED','RECUSE_REQUIRED','BLOCKED_UNKNOWN')"}
      - {name: conflict_snapshots_actor_ck, expression: "evaluated_by_type IN ('HUMAN','SERVICE') AND length(evaluated_by_id) BETWEEN 1 AND 512"}
      - {name: conflict_snapshots_arrays_ck, expression: "cardinality(declaration_ids) <= 1300 AND ops.uuid_array_is_sorted_unique(declaration_ids) AND editorial.conflict_blocker_array_is_canonical(blocker_codes) AND cardinality(blocker_codes) <= 11"}
      - {name: conflict_snapshots_finding_set_ck, expression: "editorial.conflict_finding_set_is_valid(finding_set)"}
      - {name: conflict_snapshots_result_ck, expression: "(evaluation_state = 'CLEAR' AND cardinality(blocker_codes) = 0 AND nonwaivable_blocker_count = 0) OR (evaluation_state <> 'CLEAR' AND cardinality(blocker_codes) > 0)"}
      - {name: conflict_snapshots_nonwaivable_ck, expression: "nonwaivable_blocker_count BETWEEN 0 AND cardinality(blocker_codes)"}
      - {name: conflict_snapshots_time_ck, expression: "valid_until > evaluated_at"}
      - {name: conflict_snapshots_classification_ck, expression: "classification = 'RESTRICTED_GOVERNANCE'"}
      - {name: conflict_snapshots_digest_ck, expression: "ops.is_lower_sha256(target_digest) AND ops.is_lower_sha256(declaration_set_digest) AND ops.is_lower_sha256(finding_set_digest) AND ops.is_lower_sha256(authorship_digest) AND ops.is_lower_sha256(party_recipient_digest) AND ops.is_lower_sha256(role_digest) AND ops.is_lower_sha256(relationship_digest) AND ops.is_lower_sha256(funding_customer_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(snapshot_sha256) AND ops.is_lower_sha256(receipt_digest)"}
    indexes:
      - {name: conflict_snapshots_target_idx, method: btree, keys: [target_type, target_id, target_version, candidate_role, evaluated_at DESC, id DESC]}
      - {name: conflict_snapshots_subject_idx, method: btree, keys: [subject_actor_id, evaluated_at DESC, id DESC]}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, forced: false, reason: immutable internal decision input with capability-gated API projection only}
    digest_and_concurrency:
      identity: subject_actor_id+target_id+target_version+candidate_role+policy_digest+snapshot_sha256
      canonical_digest: snapshot_sha256 binds target/operation/action/candidate, declaration and exact 13-item finding sets, every component digest, derived disposition/blocker codes, evaluated_at, and valid_until
      validity: any target/declaration/policy/evidence change or valid_until expiry makes the snapshot stale; refresh creates a new row
      declaration_fk_rule: declarations are locked by fully qualified relation then UUID and grouped by exact source-authority series; each of the 13 relation findings carries its canonical declarationIds plus authoritySetDigest. Missing mandatory authority, current-conflicting exact authorities, stale facts, or an unresolvable evidence digest produces BLOCKED_UNKNOWN and is never replaced by fuzzy/model inference.
      derivation_precedence: BLOCKED_UNKNOWN then RECUSE_REQUIRED then INDEPENDENT_REVIEW_REQUIRED then DISCLOSURE_REQUIRED then CLEAR; caller cannot supply disposition or blocker set as authority
    retention:
      record_class: GOVERNANCE_CONFLICT_SNAPSHOT
      trigger: bound decision terminal plus governing schedule
      terminal_action: CRYPTO_ERASE
      minimum: never shorter than any review, action, delivery, capability, or publication decision that references the snapshot
      legal_hold_key: target_type+target_id
      backup_behavior: erased relationship detail is not restored; immutable digests remain
    roundtrip:
      read_order: [evaluated_at DESC, id DESC]
      assertions: [declaration order, all digest fields, CLEAR versus blocker cardinality, expiry staleness, target-version mismatch, immutable denial]

