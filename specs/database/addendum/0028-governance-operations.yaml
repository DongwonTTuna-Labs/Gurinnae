    session_rule: APPEAL_CREATE remains a one-shot create session and APPEAL_STATUS remains read-only. Requester withdrawal requires a freshly derived one-shot APPEAL_WITHDRAW child bound to the same appeal/submission/request/receipt and APPEAL_STATUS lineage; no staff actor, generic response receipt, URL token, or another appeal can withdraw.
  intake.appeal_decisions:
    additive_table_delta: 0
    additions:
      - {name: actor_type, type: text, nullable: true, staged_legacy: true}
      - {name: assignment_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.review_assignments(id) ON DELETE RESTRICT}
      - {name: assignment_generation, type: bigint, nullable: true, staged_legacy: true}
      - {name: reviewer_conflict_snapshot_id, type: uuid, nullable: true, staged_legacy: true, fk: editorial.conflict_snapshots(id) ON DELETE RESTRICT}
      - {name: reviewer_conflict_snapshot_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: remedy_binding, type: jsonb, nullable: true, staged_legacy: true, rust_type: AppealRemedyBindingV1}
      - {name: remedy_binding_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: requester_session_issuance_digest, type: char(64), nullable: true, staged_legacy: true}
    change: staff edges are START_REVIEW, RESOLVE, REJECT and MARK_DUPLICATE; WITHDRAW is requester-only and is renamed REQUESTER_WITHDRAW in stored decisions. START_REVIEW atomically binds one independent assignment whose reviewer differs from the prior decider, response/case authors, publishers, parties and recipients and has a current CLEAR conflict snapshot. RESOLVE requires AppealRemedyBindingV1 for exactly the appeal requested_outcome and the concrete effect receipt already committed in the same transaction or a deferred same-transaction graph; a generic evidence UUID never resolves an appeal. REJECT/MARK_DUPLICATE require reason/evidence but no remedy. REQUESTER_WITHDRAW requires APPEAL_WITHDRAW issuance digest, actor_type REQUESTER, no staff actor/capability/assignment/remedy, and cannot follow a terminal decision.
    state_edges:
      - RECEIVED->REVIEW by START_REVIEW
      - RECEIVED|REVIEW->REJECTED by REJECT
      - RECEIVED|REVIEW->DUPLICATE by MARK_DUPLICATE
      - RECEIVED|REVIEW->WITHDRAWN by REQUESTER_WITHDRAW
      - REVIEW->RESOLVED by RESOLVE with exact remedy effect
    race_rule: SERIALIZABLE lock appeal then highest decision sequence; exactly one terminal or withdrawal winner across 64 clients. Same idempotency+bytes returns the stored decision/session response; changed bytes conflict. A losing requester token is consumed only if its exact withdrawal commits; cross-IDOR, expiry, wrong issuer, token reuse, stale sequence, wrong requested outcome/effect digest, prior-decider reuse, non-CLEAR conflict, or direct SQL produces zero appeal/assignment/effect/event mutation.
