      - {name: journey_handoffs_kind_ck, expression: "handoff_kind IN ('HS-01-RESPONSE_REQUEST_DELIVERY','HS-02-RESPONSE_INTAKE_OWNERSHIP','HS-03-CASE_OWNERSHIP','HS-04-SIGNAL_ENRICHMENT_TASK','HS-05-EDITORIAL_REVIEW_ASSIGNMENT','HS-06-REVIEW_CHANGES_TASK','HS-07-PUBLICATION_ASSIGNMENT','HS-08-ACTION_REVIEW_ASSIGNMENT','HS-09-ACTION_EXECUTION_CLAIM','HS-10-ACTION_RECONCILIATION','HS-11-AI_RUN_RECONCILIATION','HS-12-EVIDENCE_PROJECTION_ACK','HS-13-CORRECTION_OWNER','HS-14-SOURCE_DRIFT_RECOVERY','HS-15-COMMERCIAL_REMEDIATION_TASK','HS-16-RETENTION_WATCH_TASK','HS-17-COMMUNICATION_DELIVERY_OWNERSHIP','HS-18-COMMUNICATION_DELIVERY_RECONCILIATION','HS-19-PAID_PACKET_TERMINAL_BINDING','HS-20-COMMERCIAL_CONTROL_EXTERNAL_ACK')"}
      - {name: journey_handoffs_owner_ck, expression: "from_owner_kind IN ('HUMAN_USER','HUMAN_ROLE','SERVICE','WORKER','QUEUE') AND receiver_kind IN ('HUMAN_USER','HUMAN_ROLE','SERVICE','WORKER','QUEUE') AND length(from_owner_function) BETWEEN 1 AND 160 AND length(receiver_function) BETWEEN 1 AND 160 AND length(required_receiver_capability) BETWEEN 1 AND 200"}
      - {name: journey_handoffs_subject_ck, expression: "length(subject_kind) BETWEEN 1 AND 100 AND length(subject_id) BETWEEN 1 AND 512 AND subject_version > 0 AND length(from_node_id) BETWEEN 1 AND 200 AND length(to_node_id) BETWEEN 1 AND 200"}
      - {name: journey_handoffs_authority_ck, expression: "ack_authority_kind IN ('EXTERNAL_OPERATION','PRIVATE_SERVICE_OPERATION','DOMAIN_RECEIPT_HANDLER','INBOX_CLAIM','EVENT_HANDLER') AND length(ack_authority_id) BETWEEN 1 AND 240"}
      - {name: journey_handoffs_state_ck, expression: "state IN ('PENDING_ACK','ACKNOWLEDGED','DECLINED','EXPIRED','CANCELLED','SUPERSEDED')"}
      - {name: journey_handoffs_decision_ck, expression: "(state = 'PENDING_ACK' AND decided_at IS NULL AND decision_actor_binding_hmac IS NULL AND decision_reason_code IS NULL AND decision_reason_encrypted IS NULL AND decision_reason_digest IS NULL) OR (state = 'ACKNOWLEDGED' AND decided_at IS NOT NULL AND decision_actor_binding_hmac IS NOT NULL AND decision_reason_code IS NULL AND decision_reason_encrypted IS NULL AND decision_reason_digest IS NULL) OR (state = 'DECLINED' AND decided_at IS NOT NULL AND decision_actor_binding_hmac IS NOT NULL AND decision_reason_code IN ('CAPABILITY_UNAVAILABLE','OBJECT_SCOPE_MISMATCH','CONFLICT_OF_INTEREST','WORKLOAD_CAPACITY','DEPENDENCY_BLOCKED','SUBJECT_INVALID','OWNER_UNAVAILABLE','POLICY_BLOCKED','RECEIVER_DECLINED') AND octet_length(decision_reason_encrypted) >= 32 AND decision_reason_digest IS NOT NULL) OR (state IN ('EXPIRED','CANCELLED','SUPERSEDED') AND decided_at IS NOT NULL AND decision_actor_binding_hmac IS NOT NULL AND decision_reason_code IN ('HANDOFF_EXPIRED','SOURCE_CANCELLED','REPLACEMENT_CREATED') AND decision_reason_encrypted IS NULL AND decision_reason_digest IS NULL)"}
      - {name: journey_handoffs_sequence_ck, expression: "generation > 0 AND version > 0 AND due_at > requested_at AND (decided_at IS NULL OR decided_at >= requested_at)"}
      - {name: journey_handoffs_digest_ck, expression: "ops.is_lower_sha256(from_owner_ref_hmac) AND ops.is_lower_sha256(receiver_ref_hmac) AND ops.is_lower_sha256(subject_digest) AND ops.is_lower_sha256(binding_digest) AND (decision_actor_binding_hmac IS NULL OR ops.is_lower_sha256(decision_actor_binding_hmac)) AND (decision_reason_digest IS NULL OR ops.is_lower_sha256(decision_reason_digest)) AND ops.is_lower_sha256(request_receipt_digest) AND ops.is_lower_sha256(last_receipt_digest)"}
    indexes:
      - {name: journey_handoffs_receiver_due_idx, method: btree, keys: [receiver_function, due_at ASC, journey_instance_id ASC], predicate: "state = 'PENDING_ACK'"}
      - {name: journey_handoffs_instance_history_idx, method: btree, keys: [journey_instance_id, generation DESC, id DESC]}
      - {name: journey_handoffs_subject_idx, method: btree, keys: [subject_kind, subject_id, subject_version DESC, id DESC]}
      - {name: journey_handoffs_instance_fk_idx, method: btree, keys: [journey_instance_id, journey_code]}
      - {name: journey_handoffs_request_receipt_fk_idx, method: btree, keys: [request_receipt_id, journey_instance_id, id, request_receipt_digest]}
      - {name: journey_handoffs_last_receipt_fk_idx, method: btree, keys: [last_receipt_id, journey_instance_id, id, version, last_receipt_digest]}
      - {name: journey_handoffs_pending_due_idx, method: btree, keys: [due_at ASC, journey_instance_id ASC, id ASC], predicate: "state = 'PENDING_ACK'"}
    grants:
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
    rls: {enabled: false, forced: false, reason: exact receiver and subject bindings are internal; decision and scheduling mutations are only owner-routine executable}
    mutability:
      mode: LIFECYCLE_GUARDED
      immutable_columns: [id, journey_instance_id, journey_code, edge_id, handoff_kind, generation, from_node_id, to_node_id, from_owner_kind, from_owner_function, from_owner_ref_hmac, receiver_kind, receiver_function, receiver_ref_hmac, required_receiver_capability, subject_kind, subject_id, subject_version, subject_digest, ack_authority_kind, ack_authority_id, binding_digest, requested_at, due_at, request_receipt_id, request_receipt_digest]
      mutable_columns: [state, version, decided_at, decision_actor_binding_hmac, decision_reason_code, decision_reason_encrypted, decision_reason_digest, last_receipt_id, last_receipt_digest]
      guard_trigger: ops.guard_journey_handoff_update_v1()
      delete: FORBIDDEN_UNTIL_RETENTION_GRAPH_DELETE
    constraint_triggers:
      - ops.check_journey_handoff_binding_v1 compiles the exact twenty-row kind, edge, receiver, capability, authority, assurance, SLA and domain-adapter registry
      - ops.check_journey_handoff_head_v1 verifies current version and last receipt parity before commit
    digest_and_concurrency:
      identity: journey_instance_id+generation
      canonical_digest: binding_digest covers journey and edge, handoff kind and generation, from and receiver owner bindings, capability, exact subject tuple, acknowledgement authority and due time
      one_open_rule: the partial unique constraint permits exactly zero or one PENDING_ACK handoff per journey; a replacement increments generation and never reopens a terminal row
      decision_rule: caller supplies only expected version, expected binding digest and ACKNOWLEDGE or DECLINE; route, receiver, destination, capability and domain adapter are server-resolved from this row and the compiled registry
    retention:
      record_class: JOURNEY_COORDINATION
      trigger: governed by the parent journey and subject schedule
      terminal_action: DELETE
      legal_hold_key: subject_kind+subject_id+subject_digest
      backup_behavior: all generations restore before the parent instance can resume
    roundtrip:
      read_order: [generation DESC, id DESC]
      cursor: generation+id
      assertions: [one pending generation, wrong receiver denial, digest mismatch denial, acknowledge owner switch, decline reason, expiry race, replacement history, immutable binding]

  - relation: ops.journey_transition_receipts
    domain: JourneyTransitionReceipt
