yaml_conventions:
  no_default_marker: NONE
  sql_type_scalars: quoted whenever parameterized or array-valued
  identifier_order: declaration order is normative for generated DDL, row mapping, canonical digest input, and fixtures

migration_creation_order:
  - {ordinal: 1, relation: ops.legal_hold_target_anchors}
  - {ordinal: 2, relation: editorial.conflict_declarations}
  - {ordinal: 3, relation: editorial.conflict_snapshots}
