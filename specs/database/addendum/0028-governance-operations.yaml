      - {name: hold_coverage_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: watermark_set_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: job_id, type: uuid, nullable: true, staged_legacy: true, fk: ops.jobs(id) ON DELETE RESTRICT}
      - {name: claim_generation, type: bigint, nullable: true, staged_legacy: true}
      - {name: lease_token, type: uuid, nullable: true, staged_legacy: true}
      - {name: fencing_token, type: bigint, nullable: true, staged_legacy: true}
      - {name: lease_owner, type: text, nullable: true, staged_legacy: true}
      - {name: lease_expires_at, type: timestamptz, nullable: true, staged_legacy: true}
      - {name: last_heartbeat_at, type: timestamptz, nullable: true, staged_legacy: true}
      - {name: object_version_id, type: text, nullable: true, staged_legacy: true}
      - {name: object_media_type, type: text, nullable: true, staged_legacy: true}
      - {name: object_byte_length, type: bigint, nullable: true, staged_legacy: true}
      - {name: pre_watermark_content_sha256, type: char(64), nullable: true, staged_legacy: true}
      - {name: watermark_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: materialization_receipt_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: object_receipt, type: jsonb, nullable: true, staged_legacy: true, rust_type: AuditExportObjectReceiptV1}
      - {name: download_policy_digest, type: char(64), nullable: true, staged_legacy: true}
      - {name: lifecycle_audit_event_id, type: uuid, nullable: true, staged_legacy: true, fk: ops.audit_events(id) ON DELETE RESTRICT}
      - {name: expired_at, type: timestamptz, nullable: true, staged_legacy: true}
    constraints:
      - add UNIQUE (request_id), UNIQUE (idempotency_key_sha256), and UNIQUE (request_digest)
      - require post-0028 request/scope/watermark/field-rule/rights/hold/download digests, exact AuditExportScopeManifestV1 and AuditExportFieldRuleSetV1 parity, and one jobs row before QUEUED; every scope watermark tuple composite-resolves to ops.audit_chain_checkpoints and the current chain cannot be silently substituted
      - require RUNNING iff positive claim_generation/fencing_token, job_id, lease_token, lease_owner, unexpired lease_expires_at, last_heartbeat_at and started_at are present while no object or terminal receipt fields exist
      - require READY iff immutable object_key, object_version_id, media type, nonnegative byte length/row count, pre-watermark hash, watermark digest, final content_sha256, valid AuditExportObjectReceiptV1, materialization receipt, completed_at and lifecycle audit event are present; receipt rowCount equals stored row_count and the manifest-derived serialized row count, final content_sha256 is SHA-256 of exact stored/streamed watermarked bytes, and signed object HEAD version/length/hash must match
      - require FAILED to have failure_code, no object_key/version/content hash/download capability, and an immutable lifecycle receipt; READY and FAILED are terminal except READY->EXPIRED
      - require EXPIRED to preserve object metadata/digests and set expired_at while download authorization always denies; expiry never clears or rewrites provenance
    mutation_guard: revoke direct INSERT and UPDATE from gurine_control_api and gurine_workflow_worker; ops.request_audit_export, ops.claim_audit_export, ops.complete_audit_export, ops.fail_audit_export, and ops.expire_audit_export are the only writers. A trigger permits only the declared expected-version edge under a transaction-local owner context and rejects any request/scope/watermark/object identity rewrite.
    lifecycle: QUEUED->RUNNING, RUNNING->RUNNING only for lease renewal or expired-lease reclaim with claim_generation+1 and a fresh fence, RUNNING->READY|FAILED, QUEUED|RUNNING|READY->EXPIRED when request expiry is reached; each edge locks id+version and job, increments version exactly one, appends one audit/outbox/receipt, and has one winner in a 64-client race. Live leases cannot be stolen, expired claims cannot complete, a failed/expired export is never revived, and retry creates a new request row/snapshot.
    retrieval: getAuditExport returns status metadata but never object_key, version ID, internal reason, member manifest, field rules, raw actor identifiers, hold cells, or signed credentials. A separate server-side authorization step requires audit.export plus requester-or-independent-auditor scope authority, current actor assertion, current READY/version/digest, unexpired row, current object HEAD parity, and no newly active disclosure hold or revoked rights. It issues a single-purpose same-origin or <=60-second signed URL with no-store/referrer suppression and appends a download-authorization audit receipt. The download gateway pins object version, verifies length and SHA-256 before first byte and through EOF, applies attachment filename/content type, and records success/failure without logging the URL or token.
