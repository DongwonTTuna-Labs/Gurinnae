    primary_key: {name: journey_transition_receipts_pkey, columns: [id]}
    uniques:
      - {name: journey_transition_receipts_sequence_uq, columns: [journey_instance_id, sequence]}
      - {name: journey_transition_receipts_instance_version_uq, columns: [journey_instance_id, journey_instance_version]}
      - {name: journey_transition_receipts_identity_uq, columns: [id, journey_instance_id, receipt_digest]}
      - {name: journey_transition_receipts_version_uq, columns: [id, journey_instance_id, journey_instance_version, receipt_digest]}
