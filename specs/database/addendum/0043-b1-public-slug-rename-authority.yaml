authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0042 remain byte-preserved; the 0041 guard defect is repaired only by
    the globally ordered forward migration 0043
  transaction_rule: one outer BEGIN is the first pglast statement and terminal COMMIT is the last statement
  seed_rule: 0043 inserts no case, slug, receipt, user, audit, outbox, event-registry, or policy row
  rename_rule: only editorial.rename_public_slug_v1 can append the exact old/new slug and version receipt before advancing
    editorial.cases by one version
  legacy_rule: old_slug is nullable and is not shape-validated, while new_slug must satisfy r6d_public_slug_valid_v1; this
    permits NULL assignment and invalid legacy repair without inventing a replacement value
  publication_separation_rule: the case guard accepts a rename receipt only when publication state and revision and every
    other protected case field are unchanged; a publication transition retains the prior publication receipt path and
    requires public_slug unchanged
  digest_binding_rule: every receipt payload is canonicalized with ops.canonical_jsonb_v1 and its stored SHA-256 is
    recomputed by the table CHECK from receipt_canonical
