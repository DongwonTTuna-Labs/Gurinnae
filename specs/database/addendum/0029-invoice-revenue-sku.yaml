    primary_key: [id]
    unique_constraints:
      - {name: sku_readiness_items_ordinal_uq, columns: [evaluation_id, item_ordinal]}
      - {name: sku_readiness_items_code_uq, columns: [evaluation_id, item_code]}
      - {name: sku_readiness_items_identity_uq, columns: [evaluation_id, item_identity_digest]}
      - {name: sku_readiness_items_digest_uq, columns: [item_digest]}
    foreign_keys:
      - {name: sku_readiness_items_evaluation_fk, columns: [evaluation_id], references: "ops.sku_readiness_evaluations(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: sku_readiness_items_activation_decision_fk, columns: [activation_decision_id, activation_decision_version, activation_decision_digest], references: "ops.capability_activation_decisions(id,decision_version,decision_digest)", on_delete: RESTRICT}
      - {name: sku_readiness_items_activation_evidence_fk, columns: [activation_evidence_id, activation_decision_id, activation_evidence_digest], references: "ops.capability_activation_evidence(id,decision_id,evidence_ref_digest)", on_delete: RESTRICT}
      - {name: sku_readiness_items_contract_period_fk, columns: [commercial_contract_period_id], references: "ops.commercial_contract_periods(id)", on_delete: RESTRICT}
      - {name: sku_readiness_items_tariff_fk, columns: [tariff_version_id], references: "ops.tariff_versions(id)", on_delete: RESTRICT}
      - {name: sku_readiness_items_invoice_fk, columns: [invoice_fact_id], references: "ops.invoice_facts(id)", on_delete: RESTRICT}
      - {name: sku_readiness_items_revenue_fk, columns: [revenue_fact_id], references: "ops.revenue_facts(id)", on_delete: RESTRICT}
      - {name: sku_readiness_items_cost_allocation_fk, columns: [cost_allocation_period_id, cost_allocation_row_kind], references: "ops.cost_allocations(id,row_kind)", on_delete: RESTRICT}
      - {name: sku_readiness_items_outcome_fact_fk, columns: [outcome_fact_id], references: "ops.outcome_facts(id)", on_delete: RESTRICT}
      - {name: sku_readiness_items_sli_fk, columns: [sli_window_receipt_id, sli_id, sli_definition_version, sli_environment, sli_scope_digest, sli_window_kind, sli_window_sequence, sli_receipt_digest], references: "ops.sli_window_receipts(id,sli_id,definition_version,environment,scope_digest,window_kind,window_sequence,receipt_digest)", on_delete: RESTRICT, match: FULL}
      - {name: sku_readiness_items_sli_contract_fk, columns: [sli_contract_period_id, sli_organization_id, sli_policy_digest], references: "ops.commercial_contract_periods(id,organization_id,sla_policy_digest)", on_delete: RESTRICT, match: FULL}
    checks:
      - {name: sku_readiness_items_ordinal_ck, expression: "item_ordinal > 0"}
      - name: sku_readiness_items_code_ck
        expression: >-
          item_code IN ('PAID_WORKSPACE_PROCESSING_ACTIVE','DEPLOYMENT_ISOLATION_PROVEN','OIDC_AND_ROSTER_READY','DATA_STORES_KEYS_QUEUES_ISOLATED','SOURCE_RIGHTS_CONFIGURED','TELEMETRY_ALERTS_RUNBOOK_READY','BACKUP_RESTORE_PROVEN','INCIDENT_OWNERSHIP_READY','PUBLIC_WEB_ACTIVE','VERIFIED_EMAIL_ACTIVE','API_EXPORT_ACTIVE','SIGNED_WEBHOOK_ACTIVE','DAILY_DIGEST_ACTIVE','WEEKLY_DIGEST_ACTIVE','CURRENT_CONTRACT_PERIOD','CURRENT_TARIFF_VERSION','BILLING_RECONCILIATION_PATH_READY','COST_CAPTURE_PATH_READY','P75_VARIABLE_GROSS_MARGIN','SUPPORT_CAPACITY','ACTUAL_BILLABLE_RECONCILIATION','ACTUAL_COST_CAPTURE','FIRST_PAID_VERIFIED_WORKFLOW_CYCLE','CAC_PAYBACK','SMS_ADAPTER_ACTIVE','TELEGRAM_ADAPTER_ACTIVE','WHATSAPP_ADAPTER_ACTIVE','LINE_ADAPTER_ACTIVE','KAKAO_ADAPTER_ACTIVE','VOICE_ADAPTER_ACTIVE')
      - {name: sku_readiness_items_requirement_class_ck, expression: "requirement_class IN ('MANDATORY','CONDITIONAL_OFFERED','INFORMATIONAL')"}
      - {name: sku_readiness_items_state_value_ck, expression: "item_state IN ('SATISFIED','UNSATISFIED','UNKNOWN','NOT_APPLICABLE')"}
      - {name: sku_readiness_items_evidence_tier_ck, expression: "evidence_tier IN ('PRODUCTION_LIVE','PRODUCTION_DERIVED','PRODUCTION_PREFLIGHT','NON_PRODUCTION_PREFLIGHT','FIXTURE_ONLY','MISSING')"}
      - name: sku_readiness_items_activation_decision_tuple_ck
        expression: "(activation_decision_id IS NULL AND activation_decision_version IS NULL AND activation_decision_digest IS NULL) OR (activation_decision_id IS NOT NULL AND activation_decision_version IS NOT NULL AND activation_decision_version > 0 AND activation_decision_digest IS NOT NULL)"
      - {name: sku_readiness_items_activation_evidence_tuple_ck, expression: "(activation_evidence_id IS NULL AND activation_evidence_digest IS NULL) OR (activation_evidence_id IS NOT NULL AND activation_evidence_digest IS NOT NULL)"}
      - {name: sku_readiness_items_activation_evidence_parent_ck, expression: "activation_evidence_id IS NULL OR activation_decision_id IS NOT NULL"}
      - {name: sku_readiness_items_contract_tuple_ck, expression: "(commercial_contract_period_id IS NULL AND commercial_contract_record_digest IS NULL) OR (commercial_contract_period_id IS NOT NULL AND commercial_contract_record_digest IS NOT NULL)"}
      - {name: sku_readiness_items_tariff_tuple_ck, expression: "(tariff_version_id IS NULL AND tariff_record_digest IS NULL) OR (tariff_version_id IS NOT NULL AND tariff_record_digest IS NOT NULL)"}
      - {name: sku_readiness_items_invoice_tuple_ck, expression: "(invoice_fact_id IS NULL AND invoice_reconciliation_digest IS NULL) OR (invoice_fact_id IS NOT NULL AND invoice_reconciliation_digest IS NOT NULL)"}
      - {name: sku_readiness_items_revenue_tuple_ck, expression: "(revenue_fact_id IS NULL AND revenue_record_digest IS NULL) OR (revenue_fact_id IS NOT NULL AND revenue_record_digest IS NOT NULL)"}
      - name: sku_readiness_items_cost_allocation_tuple_ck
        expression: "(cost_allocation_period_id IS NULL AND cost_allocation_row_kind IS NULL AND cost_allocation_record_digest IS NULL AND cost_allocation_close_receipt_digest IS NULL) OR (cost_allocation_period_id IS NOT NULL AND cost_allocation_row_kind = 'PERIOD' AND cost_allocation_record_digest IS NOT NULL AND cost_allocation_close_receipt_digest IS NOT NULL)"
      - {name: sku_readiness_items_outcome_tuple_ck, expression: "(outcome_fact_id IS NULL AND outcome_fact_digest IS NULL) OR (outcome_fact_id IS NOT NULL AND outcome_fact_digest IS NOT NULL)"}
      - name: sku_readiness_items_sli_tuple_ck
        expression: "(sli_window_receipt_id IS NULL AND sli_id IS NULL AND sli_definition_version IS NULL AND sli_environment IS NULL AND sli_scope_digest IS NULL AND sli_window_kind IS NULL AND sli_window_sequence IS NULL AND sli_organization_id IS NULL AND sli_contract_period_id IS NULL AND sli_policy_digest IS NULL AND sli_receipt_digest IS NULL) OR (sli_window_receipt_id IS NOT NULL AND sli_id IS NOT NULL AND sli_id ~ '^[a-z][a-z0-9_.-]{2,159}$' AND sli_definition_version IS NOT NULL AND length(sli_definition_version) BETWEEN 1 AND 100 AND sli_environment = 'PRODUCTION' AND sli_scope_digest IS NOT NULL AND sli_window_kind IS NOT NULL AND sli_window_sequence IS NOT NULL AND sli_window_sequence > 0 AND sli_organization_id IS NOT NULL AND sli_contract_period_id IS NOT NULL AND sli_policy_digest IS NOT NULL AND sli_receipt_digest IS NOT NULL)"
      - {name: sku_readiness_items_measurement_unit_ck, expression: "measurement_unit IN ('BOOLEAN','RATIO','HOURS_PER_MONTH','MONTHS','COUNT')"}
      - {name: sku_readiness_items_comparator_ck, expression: "comparator IN ('EQ','GTE','LTE')"}
      - {name: sku_readiness_items_boolean_measurement_ck, expression: "measurement_unit <> 'BOOLEAN' OR (comparator = 'EQ' AND threshold_value = 1)"}
      - {name: sku_readiness_items_ratio_measurement_ck, expression: "measurement_unit <> 'RATIO' OR observed_value IS NULL OR observed_value BETWEEN 0 AND 1"}
      - {name: sku_readiness_items_measurement_presence_ck, expression: "(threshold_value IS NULL AND observed_value IS NULL) OR (threshold_value IS NOT NULL AND observed_value IS NOT NULL)"}
      - name: sku_readiness_items_satisfied_ck
        expression: "item_state <> 'SATISFIED' OR (observed_value IS NOT NULL AND evidence_as_of IS NOT NULL AND evidence_tier IN ('PRODUCTION_LIVE','PRODUCTION_DERIVED','PRODUCTION_PREFLIGHT') AND blocker_code IS NULL AND remediation_code IS NULL AND num_nonnulls(activation_decision_id,activation_evidence_id,commercial_contract_period_id,tariff_version_id,invoice_fact_id,revenue_fact_id,cost_allocation_period_id,outcome_fact_id,sli_window_receipt_id,evidence_member_set_digest) > 0)"
      - {name: sku_readiness_items_blocked_ck, expression: "item_state NOT IN ('UNSATISFIED','UNKNOWN') OR (blocker_code IS NOT NULL AND remediation_code IS NOT NULL)"}
      - {name: sku_readiness_items_not_applicable_ck, expression: "item_state <> 'NOT_APPLICABLE' OR (required_for_evaluation = false AND requirement_class <> 'MANDATORY')"}
      - {name: sku_readiness_items_required_ck, expression: "required_for_evaluation = false OR item_state <> 'NOT_APPLICABLE'"}
      - {name: sku_readiness_items_evidence_interval_ck, expression: "evidence_expires_at IS NULL OR evidence_as_of IS NULL OR evidence_expires_at > evidence_as_of"}
      - name: sku_readiness_items_blocker_code_ck
        expression: >-
          blocker_code IS NULL OR blocker_code IN ('EVIDENCE_MISSING','EVIDENCE_STALE','EVIDENCE_NOT_PRODUCTION_GRADE','CONFIGURATION_MISMATCH','CAPABILITY_NOT_ACTIVE','CONTRACT_NOT_CURRENT','TARIFF_NOT_CURRENT','RECONCILIATION_COVERAGE_BELOW_TARGET','COST_CAPTURE_BELOW_TARGET','MARGIN_BELOW_TARGET','SUPPORT_CAPACITY_ABOVE_TARGET','CAC_PAYBACK_ABOVE_TARGET','VERIFIED_WORKFLOW_CYCLE_MISSING','LEGAL_OR_RIGHTS_BLOCKED','KILL_SWITCH_ACTIVE','INCIDENT_OR_SLO_BLOCKED')
      - name: sku_readiness_items_remediation_code_ck
        expression: >-
          remediation_code IS NULL OR remediation_code IN ('RECORD_CURRENT_EVIDENCE','REEVALUATE_EXACT_CONFIGURATION','COMPLETE_CAPABILITY_ACTIVATION','ACTIVATE_COMMERCIAL_CONTRACT','ACTIVATE_TARIFF_VERSION','RECONCILE_BILLABLE_FACTS','CLOSE_COST_ALLOCATION_PERIOD','ADJUST_PRICE_QUOTA_OR_EFFICIENCY','RESTORE_SUPPORT_CAPACITY','RECORD_FIRST_VERIFIED_WORKFLOW','RESOLVE_LEGAL_RIGHTS_OR_SWITCH_BLOCKER','RESOLVE_INCIDENT_AND_REEVALUATE')
      - {name: sku_readiness_items_owner_function_ck, expression: "owner_function IN ('PRODUCT_PDM','EDITORIAL_DUTY','DATA_ENGINEERING','SRE_ON_CALL','LEGAL_PRIVACY','SALES_CS_FINANCE','INDEPENDENT_REVIEW_PUBLISHER')"}
      - name: sku_readiness_items_digests_ck
        expression: >-
          expected_configuration_digest ~ '^[0-9a-f]{64}$'
          AND item_identity_digest ~ '^[0-9a-f]{64}$'
          AND (activation_decision_digest IS NULL OR activation_decision_digest ~ '^[0-9a-f]{64}$')
          AND (activation_evidence_digest IS NULL OR activation_evidence_digest ~ '^[0-9a-f]{64}$')
          AND (commercial_contract_record_digest IS NULL OR commercial_contract_record_digest ~ '^[0-9a-f]{64}$')
          AND (tariff_record_digest IS NULL OR tariff_record_digest ~ '^[0-9a-f]{64}$')
          AND (invoice_reconciliation_digest IS NULL OR invoice_reconciliation_digest ~ '^[0-9a-f]{64}$')
          AND (revenue_record_digest IS NULL OR revenue_record_digest ~ '^[0-9a-f]{64}$')
          AND (cost_allocation_record_digest IS NULL OR cost_allocation_record_digest ~ '^[0-9a-f]{64}$')
          AND (cost_allocation_close_receipt_digest IS NULL OR cost_allocation_close_receipt_digest ~ '^[0-9a-f]{64}$')
          AND (outcome_fact_digest IS NULL OR outcome_fact_digest ~ '^[0-9a-f]{64}$')
          AND (sli_scope_digest IS NULL OR sli_scope_digest ~ '^[0-9a-f]{64}$')
          AND (sli_policy_digest IS NULL OR sli_policy_digest ~ '^[0-9a-f]{64}$')
          AND (sli_receipt_digest IS NULL OR sli_receipt_digest ~ '^[0-9a-f]{64}$')
          AND (evidence_member_set_digest IS NULL OR evidence_member_set_digest ~ '^[0-9a-f]{64}$')
          AND item_digest ~ '^[0-9a-f]{64}$'
    indexes:
      - {name: sku_readiness_items_evaluation_order_idx, method: btree, columns: [evaluation_id, item_ordinal, id]}
      - {name: sku_readiness_items_blocker_idx, method: btree, columns: [evaluation_id, required_for_evaluation, item_state, item_ordinal], predicate: "required_for_evaluation AND item_state IN ('UNSATISFIED','UNKNOWN')"}
      - {name: sku_readiness_items_activation_idx, method: btree, columns: [activation_decision_id, activation_decision_version], predicate: "activation_decision_id IS NOT NULL"}
      - {name: sku_readiness_items_expiry_idx, method: btree, columns: [evidence_expires_at, item_state], predicate: "evidence_expires_at IS NOT NULL"}
      - {name: sku_readiness_items_activation_decision_fk_idx, method: btree, columns: [activation_decision_id, activation_decision_version, activation_decision_digest, id], predicate: "activation_decision_id IS NOT NULL"}
      - {name: sku_readiness_items_activation_evidence_fk_idx, method: btree, columns: [activation_evidence_id, activation_decision_id, activation_evidence_digest, id], predicate: "activation_evidence_id IS NOT NULL"}
      - {name: sku_readiness_items_contract_period_fk_idx, method: btree, columns: [commercial_contract_period_id, id], predicate: "commercial_contract_period_id IS NOT NULL"}
      - {name: sku_readiness_items_tariff_fk_idx, method: btree, columns: [tariff_version_id, id], predicate: "tariff_version_id IS NOT NULL"}
      - {name: sku_readiness_items_invoice_fk_idx, method: btree, columns: [invoice_fact_id, id], predicate: "invoice_fact_id IS NOT NULL"}
      - {name: sku_readiness_items_revenue_fk_idx, method: btree, columns: [revenue_fact_id, id], predicate: "revenue_fact_id IS NOT NULL"}
      - {name: sku_readiness_items_cost_allocation_fk_idx, method: btree, columns: [cost_allocation_period_id, cost_allocation_row_kind, id], predicate: "cost_allocation_period_id IS NOT NULL"}
      - {name: sku_readiness_items_outcome_fact_fk_idx, method: btree, columns: [outcome_fact_id, id], predicate: "outcome_fact_id IS NOT NULL"}
      - {name: sku_readiness_items_sli_fk_idx, method: btree, columns: [sli_window_receipt_id, sli_id, sli_definition_version, sli_environment, sli_scope_digest, sli_window_kind, sli_window_sequence, sli_receipt_digest, id], predicate: "sli_window_receipt_id IS NOT NULL"}
      - {name: sku_readiness_items_sli_contract_fk_idx, method: btree, columns: [sli_contract_period_id, sli_organization_id, sli_policy_digest, id], predicate: "sli_contract_period_id IS NOT NULL"}
    procedural_guards:
      - "item_identity_digest is recomputed from only canonical input evidence and catalog fields before state derivation; caller-provided item/evaluation IDs, ordinals, verdicts, blocker/remediation and timestamps cannot change or seed the natural identity"
      - "item item_state is recomputed from comparator: EQ equality, GTE observed>=threshold, LTE observed<=threshold; caller state is never trusted"
      - "SATISFIED evidence_as_of is not after evaluation evidence_cutoff_at and evidence_expires_at is strictly after evaluation evaluated_at"
      - "activation reference must be the MAX decision_version for capability class/id/environment, match expected_configuration_digest, have exact stored decision_digest, and be APPROVED/ACTIVE at evaluated_at"
      - "activation evidence, if bound, has the same decision_id, exact evidence_ref_digest, evidence_state SATISFIED, an allowed production proof_tier, valid_from not after evaluated_at, and null or later expires_at"
      - "contract, tariff, invoice, revenue, cost-allocation, outcome, and SLI references bind their stored immutable digests; cost_allocation_period_id must have row_kind=PERIOD and bind close_receipt_digest"
      - "an SLI reference binds the exact 0028 candidate tuple ID+sli_id+definition_version+PRODUCTION+scope_digest+window_kind+window_sequence+receipt_digest and the exact contract-period+organization+sla_policy_digest candidate. The parent evaluation organization equals sli_organization_id, the selected contract is current and SLA-selected, and scope_digest is recomputed from deployment, organization, contract period and policy; a generic service SLI or same receipt under another organization/contract/policy is rejected."
      - "evidence_member_set_digest binds the stable sorted IDs and digests consumed by aggregate measurements; the insert routine re-queries all members and recomputes it under the evidence cutoff snapshot"
      - "FIXTURE_ONLY and NON_PRODUCTION_PREFLIGHT never satisfy a production readiness item; PRODUCTION_PREFLIGHT is allowed only for *_PATH_READY and deployment preflight items, never actual financial threshold items"
      - "P75_VARIABLE_GROSS_MARGIN threshold is 0.600000 for PILOT_ENTRY_READINESS and POST_FIRST_BILLING_CYCLE, 0.700000 for GENERAL_AVAILABILITY"
      - "ACTUAL_BILLABLE_RECONCILIATION is required only after first billing cycle and threshold EQ 1.000000"
      - "ACTUAL_COST_CAPTURE is required only after first billing cycle and threshold GTE 0.990000"
      - "SUPPORT_CAPACITY threshold LTE 4.000000 HOURS_PER_MONTH; CAC_PAYBACK threshold LTE 12.000000 MONTHS and is mandatory only for GENERAL_AVAILABILITY"
      - "FIRST_PAID_VERIFIED_WORKFLOW_CYCLE is required after first billing cycle and uses only an immutable outcome fact linked to a terminal receipt; raw product events are forbidden evidence"
    mutation:
      insert_path: ops.record_sku_readiness_evaluation_v1
      update: forbidden
      delete: "only as the locked child phase of ops.purge_sku_readiness_evaluation_v1"
      trigger: sku_readiness_items_guard_update_or_parent_retention_delete
    grants:
      gurine_workflow_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_public_projector: []
      gurine_auditor: [SELECT]
      gurine_public_api: []
      gurine_submission_api: []
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_notification_worker: []
      gurine_scheduler: []
      gurine_document_extractor: []
      gurine_identity_api: []
    rls: {enabled: false, reason: "immutable child of an internal readiness evaluation"}
    retention:
      record_class: SKU_READINESS_EVALUATION
      trigger: recorded_at
      schedule_binding: "exact parent evaluation schedule revision"
      legal_hold_key: "parent evaluation legal-hold key plus 'ITEM' + id"
      backup_behavior: "restored evidence links do not reactivate a capability; a fresh evaluation is mandatory"
      terminal_action: "RETENTION_GUARDED_DELETE in item_ordinal,id order immediately before parent in the same receipted retention execution"

invoice_membership_read_contract:
  function: ops.read_invoice_membership_v1
  signature: "(uuid contract_period_id, char(64) expected_contract_record_digest, date period_start, date period_end, timestamptz billing_cutoff_at) -> SETOF ops.invoice_membership_read_row_v1"
  owner: gurine_migrator
  security: SECURITY_DEFINER
  search_path: [pg_catalog, ops, pg_temp]
  execute_roles: [gurine_workflow_worker, gurine_control_api, gurine_auditor]
  revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_scheduler, gurine_document_extractor, gurine_identity_api]
  expected_population:
    - "Derive the exact required meter/window grid from the locked contract, tariff, meter policy and half-open invoice period before filtering by observation state or overage. Every required window yields exactly one row, including explicit zero usage, included-only usage and PARTIAL/UNKNOWN/missing blockers."
    - "For each grid member select the unique current receipt leaf then unique current usage-fact leaf as of billing_cutoff_at; a missing leaf, branch, stale/reversed leaf, overlap or gap remains a row with a closed blocker_code and never shrinks expected_usage_membership_count."
    - "Resolve the unique current invoice_usage_memberships leaf for usage_root_fact_id. No leaf means unclaimed; one leaf names its current invoice; two roots/successors or a digest mismatch is INVOICE_MEMBERSHIP_CONFLICT."
  exact_result:
    - "Successful invoice close requires every expected row COMPLETE, exact receipt/fact policy binding, and one proposed membership. expected_usage_membership_count equals returned row count and usage_membership_count; usage_membership_set_digest binds the ordered proposed membership digests."
    - "ZERO_USAGE and INCLUDED_ALLOWANCE return membership_kind with current_invoice_id even with no invoice line. BILLED_OVERAGE returns the exact same-invoice line. PARTIAL/UNKNOWN/missing evidence returns membership_kind/current invoice nullable plus blocker_code and prevents invoice/revenue/readiness success."
    - "A RESTATEMENT supplies the expected current invoice and complete predecessor membership-set digest; the function returns every current predecessor leaf for atomic movement and rejects a partial subset."
  return_firewall: "Only closed scalar IDs, dates, enums, states and digests are returned; provider bodies, external invoice references, customer labels, content, token and generic JSON are forbidden."
  runtime_canaries: [zero_usage_present, included_usage_present_without_line, billed_overage_exact_line, partial_visible_blocker, unknown_visible_blocker, missing_window_visible_blocker, overlap_blocker, reversed_leaf_blocker, duplicate_current_membership_conflict, cross_invoice_exactly_once, complete_restatement_move, partial_restatement_rejected, 64_client_close]

invoice_conservation_contract:
  function: ops.enforce_invoice_conservation_v1
  triggers:
    - name: invoice_facts_conservation_deferred
      relation: ops.invoice_facts
      timing: AFTER INSERT
      shape: CONSTRAINT_TRIGGER_DEFERRABLE_INITIALLY_DEFERRED
    - name: invoice_line_facts_conservation_deferred
      relation: ops.invoice_line_facts
      timing: AFTER INSERT
      shape: CONSTRAINT_TRIGGER_DEFERRABLE_INITIALLY_DEFERRED
    - name: invoice_usage_memberships_conservation_deferred
      relation: ops.invoice_usage_memberships
      timing: AFTER INSERT
      shape: CONSTRAINT_TRIGGER_DEFERRABLE_INITIALLY_DEFERRED
  lock_order:
    - "commercial contract period row"
    - "invoice header by id"
    - "usage facts by id ASC"
    - "current invoice-usage membership roots by usage_root_fact_id ASC,revision ASC,id ASC"
    - "tariff versions by id ASC"
    - "discount decisions by id ASC"
    - "invoice lines by line_ordinal ASC,id ASC"
    - "new invoice-usage memberships by meter_kind,period_start,period_end,usage_root_fact_id,revision,id"
  exact_oracle:
    - "there is exactly line_count child rows"
    - "line_ordinal is the contiguous set 1..line_count"
    - "line_set_digest equals the canonical digest of ordered child line_digest values"
    - "expected_usage_membership_count equals the unfiltered due meter/window population from ops.read_invoice_membership_v1; usage_membership_count equals that count and the physical child count"
    - "usage_membership_set_digest equals every ordered child membership_digest, including ZERO_USAGE and INCLUDED_ALLOWANCE rows with no charge line; only BILLED_OVERAGE has a line"
    - "usage_fact_set_digest equals every referenced usage fact ID+record digest ordered meter kind, period_start, period_end, root ID, revision and row ID; no eligible terminal fact is omitted or used twice"
    - "usage_window_receipt_set_digest equals the exact current receipt ID+version+digest behind that usage set; a superseded, reversed, partial, unknown, overlapping or gapped required meter blocks close"
    - "tariff_set_digest, discount_leaf_set_digest and correction_set_digest equal the complete immutable rows applied to all lines; contract_state_interval_set_digest proves ACTIVE+PROVISIONED coverage for every billed slice through billing_cutoff_at"
    - "tax_policy_digest and rounding_policy_digest match every line and tariff; each line tax is recomputed before totals and no header total is independently rounded"
    - "header subtotal equals sum(line.subtotal)"
    - "header discount_total equals sum(line.discount_amount)"
    - "header taxable_amount equals sum(line.taxable_amount) and equals subtotal-discount_total"
    - "header tax_total equals sum(line.tax_amount)"
    - "header correction_total equals sum(line.correction_amount)"
    - "header invoice_total equals sum(line.line_total) and equals taxable_amount+tax_total+correction_total"
    - "every child currency and SKU equals the header"
    - "invoice interval is contained by the referenced commercial contract period and every line service interval is contained by the invoice interval"
    - "line service intervals split at every contract state_effective_at boundary; only ACTIVE+PROVISIONED derived intervals are billed, suspended/ended/cancelled time contributes zero, and active-day proration uses exact local calendar-day slices"
    - "invoice deployment_id, organization_id, contract_id, and SKU match the referenced contract period"
    - "processing-credit included quota is allocated once across AGENT_TOKEN, MODEL_REQUEST and SOURCE_PAGE usage facts in meter-kind,window,id order before any overage line; API record units use records returned and active-contributor blocks use qualifying contributor counts, never request or login count"
    - "each usage_root_fact_id has exactly one current membership leaf across all invoice roots; a RESTATEMENT moves the complete predecessor set to one successor invoice and leaves no current predecessor membership"
  failure_mapping:
    arithmetic_or_digest: INVOICE_CONSERVATION_FAILED
    reference_or_period: INVOICE_RECONCILIATION_FAILED

revenue_interval_exclusion_contract:
  relation: ops.revenue_facts
  partition_key: [invoice_line_id, recognition_policy_version]
  interval: "[recognition_period_start, recognition_period_end)"
  implementation: SERIALIZABLE_EXCLUSION_EQUIVALENT
  advisory_lock_material: "SHA-256('GURINE:REVENUE:LINE-POLICY-INTERVAL:V1' NUL invoice_line_id NUL recognition_policy_version), first signed 64 bits"
  index: revenue_facts_line_policy_interval_idx
  overlap_predicate: "existing.recognition_period_start < proposed.recognition_period_end AND proposed.recognition_period_start < existing.recognition_period_end"
  current_positive_rule: "existing interval participates unless the locked unique terminal accounting-correction result for that revenue fact is exactly zero; missing, branched or stale correction state participates and then fails closed"
  replacement_rule: "an interval change appends the full reversal of the old revenue fact and the replacement fact in one ops.record_revenue_fact_v1 SERIALIZABLE transaction under the same key; neither row is updated, and the two canonical receipts cross-bind"
  phantom_fence: "after the predicate read and before insert/finalize, no statement may release or change the lock key; SQLSTATE 40001 is retried only from a fresh full transaction with the same canonical request"
  runtime_canaries: [adjacent_allowed, equal_interval_rejected, left_overlap_rejected, right_overlap_rejected, contains_rejected, contained_rejected, different_line_allowed, different_policy_allowed, fully_reversed_then_replaced, partial_correction_still_rejected, stale_correction_rejected, concurrent_64_one_commit]

immutable_and_retention_delete_closure:
  immutable_preserve_relations: [ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships, ops.revenue_facts]
  preserve_rule: ops.reject_mutation rejects UPDATE and DELETE for runtime roles and owner canaries without exception; schedule expiry may erase protected source bodies but cannot delete typed accounting facts, digests, correction links or receipt identities.
  retention_guarded_relations: [ops.sku_readiness_evaluations, ops.sku_readiness_items]
  purge_function:
    name: ops.purge_sku_readiness_evaluation_v1
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: [pg_catalog, ops, pg_temp]
    execute_roles: [gurine_workflow_worker]
    arguments: [evaluation_id, expected_evaluation_digest, expected_schedule_revision, retention_request_id]
    return_type: ops.economics_mutation_receipt_v1
    idempotency_scope: ECONOMICS.PURGE_SKU_READINESS_EVALUATION.V1
    transaction: SERIALIZABLE
    lock_order: [retention request and execution receipt, non-case legal-hold anchor, evaluation row, item rows by item_ordinal then id, audit chain head, outbox, idempotency row]
    exact_preconditions:
      - Latest effective nonexpired SKU_READINESS_EVALUATION schedule selects DELETE and its deadline has passed; missing or stale schedule preserves rows and opens review.
      - Expected evaluation digest and schedule revision match; the row is not the latest currently effective readiness input for an active SKU and a fresh replacement evaluation exists when policy requires history continuity.
      - RETENTION and DELETION hold union is empty for parent and all children; DISCLOSURE hold blocks export but alone does not authorize or bypass deletion.
      - No audit, incident, activation, invoice, publication or legal evidence reference requires the evaluation; FK RESTRICT remains the final database fence.
    atomic_effect: Append retention execution receipt, audit, outbox and restoration-suppression tombstone; set a transaction-local unforgeable purge context; delete children in item_ordinal,id order and then the parent; finalize canonical stored response or roll back all.
    replay: Exact idempotency replay returns stored response bytes; the restoration-suppression tombstone prevents resurrected backup rows and returns the original purge receipt.
  trigger_contract:
    update: Always reject on both relations.
    delete: Allow only current_user gurine_migrator inside the verified purge context naming the exact parent, evaluation digest, schedule revision, retention execution receipt and complete ordered child set; direct owner DELETE without context rejects.
  oracle: A canary direct DELETE fails, an active hold race has one safe winner, a purge failure leaves every row/receipt/event absent, and restore suppresses the exact purged identity before readiness queries.

correction_link_contract:
  rule: "invoice, invoice-line, and revenue originals never point to future corrections and are never updated; ops.accounting_corrections is created after all concrete targets and owns the FK"
  required_accounting_correction_columns:
    - {name: target_fact_kind, type: "ops.accounting_fact_kind", values: [INVOICE_FACT, INVOICE_LINE_FACT, REVENUE_FACT]}
    - {name: target_fact_id, type: uuid, nullable: false}
    - {name: target_invoice_fact_id, type: uuid, nullable: true}
    - {name: target_invoice_line_fact_id, type: uuid, nullable: true}
    - {name: target_revenue_fact_id, type: uuid, nullable: true}
    - {name: deployment_id, type: uuid, nullable: false}
    - {name: organization_id, type: uuid, nullable: false}
    - {name: accounting_timezone, type: text, nullable: false}
    - {name: accounting_policy_digest, type: "char(64)", nullable: false}
    - {name: currency, type: "char(3)", nullable: false}
  required_accounting_correction_checks:
    - "num_nonnulls(target_invoice_fact_id,target_invoice_line_fact_id,target_revenue_fact_id)=1"
    - "target_fact_kind and target_fact_id exactly match the one non-null concrete target column"
    - "ADJUSTMENT and REPLACEMENT have nonzero desired terminal amount; REVERSAL has amount=0 and nonzero effective_delta equal to the negative cumulative prior root delta"
    - "every row has immutable decision digest, exact source receipt, one concrete target, gapless target+amount-kind correction_sequence and an append-only single-successor replacement/reversal chain"
  required_accounting_correction_foreign_keys:
    - {columns: [target_invoice_fact_id], references: "ops.invoice_facts(id)", on_delete: RESTRICT}
    - {columns: [target_invoice_line_fact_id], references: "ops.invoice_line_facts(id)", on_delete: RESTRICT}
    - {columns: [target_revenue_fact_id], references: "ops.revenue_facts(id)", on_delete: RESTRICT}
  current_value_derivation:
    invoice: "original invoice_total plus every effective_delta targeting the header or any child line, ordered by target amount kind, gapless correction_sequence, created_at, id; a chain head selects the root's terminal desired adjustment and no unstored source timestamp is an ordering input"
    revenue: "original amount plus every effective_delta targeting that revenue fact, ordered by target amount kind, gapless correction_sequence, created_at, id; replacement/reversal deltas telescope to the terminal root amount"
    no_double_count: "one correction targets exactly one concrete fact; a line-target correction is not also counted as a header-target correction"
  invariants:
    - "provider-origin ACCOUNTING_ADJUSTMENT line is part of original invoice conservation and is not itself an ops.accounting_correction"
    - "a later invoice correction that changes recognized revenue atomically appends the accounting correction and any required revenue correction; neither original row changes"
    - "accounting.correction_recorded.v1 must carry targetType and exact concrete target ID in addition to targetFactId"

sku_readiness_catalog:
  catalog_version: evidence-workspace-readiness.v1
  pilot_profile_id: BM-PILOT-CORE-V1
  stage_semantics:
    PILOT_ENTRY_READINESS: "pre-activation gate for admitting one paid private workspace pilot; this is not a completed activation event or proof of post-billing economics"
    POST_FIRST_BILLING_CYCLE: "first immutable billed-cycle evidence is closed and eligible for actual reconciliation/cost/workflow checks"
    GENERAL_AVAILABILITY: "scale gate after post-billing evidence, CAC payback and the higher margin threshold"
  mandatory_all_stages:
    - PAID_WORKSPACE_PROCESSING_ACTIVE
    - DEPLOYMENT_ISOLATION_PROVEN
    - OIDC_AND_ROSTER_READY
    - DATA_STORES_KEYS_QUEUES_ISOLATED
    - SOURCE_RIGHTS_CONFIGURED
    - TELEMETRY_ALERTS_RUNBOOK_READY
    - BACKUP_RESTORE_PROVEN
    - INCIDENT_OWNERSHIP_READY
    - CURRENT_CONTRACT_PERIOD
    - CURRENT_TARIFF_VERSION
    - BILLING_RECONCILIATION_PATH_READY
    - COST_CAPTURE_PATH_READY
    - P75_VARIABLE_GROSS_MARGIN
    - SUPPORT_CAPACITY
  mandatory_post_first_billing_cycle_and_ga:
    - ACTUAL_BILLABLE_RECONCILIATION
    - ACTUAL_COST_CAPTURE
    - FIRST_PAID_VERIFIED_WORKFLOW_CYCLE
  mandatory_ga_only:
    - CAC_PAYBACK
  conditional_offered_exactly_twelve_rows:
    PUBLIC_WEB_ACTIVE: PUBLIC_WEB
    VERIFIED_EMAIL_ACTIVE: VERIFIED_EMAIL
    API_EXPORT_ACTIVE: API_EXPORT
    SIGNED_WEBHOOK_ACTIVE: SIGNED_WEBHOOK
    DAILY_DIGEST_ACTIVE: DAILY_DIGEST
    WEEKLY_DIGEST_ACTIVE: WEEKLY_DIGEST
    SMS_ADAPTER_ACTIVE: delivery.sms
    TELEGRAM_ADAPTER_ACTIVE: delivery.telegram
    WHATSAPP_ADAPTER_ACTIVE: delivery.whatsapp
    LINE_ADAPTER_ACTIVE: delivery.line
    KAKAO_ADAPTER_ACTIVE: delivery.kakao
    VOICE_ADAPTER_ACTIVE: delivery.voice
  derivation:
    PILOT_ENTRY_READINESS:
      mandatory_count: 14
      item_count_before_offered_requirement: 26
      p75_variable_gross_margin_threshold: 0.600000
    POST_FIRST_BILLING_CYCLE:
      mandatory_count: 17
      item_count_before_offered_requirement: 29
      p75_variable_gross_margin_threshold: 0.600000
    GENERAL_AVAILABILITY:
      mandatory_count: 18
      item_count_before_offered_requirement: 30
      p75_variable_gross_margin_threshold: 0.700000
    rule: "required_item_count equals mandatory_count plus the number of explicitly offered conditional capabilities; all twelve conditional rows stay visible, so offering a capability changes required_item_count but never item_count"
  evidence_rules:
    capability_items: "bind latest exact ops.capability_activation_decisions decision_id, decision_version, decision_digest, expected configuration, environment, current interval, APPROVED legal state and ACTIVE operational state"
    deployment_prerequisites: "bind PAID_WORKSPACE_PROCESSING activation decision plus its exact production evidence receipts; a generic setup assertion is insufficient"
    commercial_inputs: "bind current immutable commercial contract period and tariff version by ID plus stored digest"
    path_readiness: "may use a production-targeted signed preflight receipt, but fixture-only and non-production evidence never pass"
    actual_financial_thresholds: "bind immutable invoice/revenue/cost-allocation period facts and stable member-set digest; production preflight is insufficient"
    verified_workflow: "bind current chain-head ops.outcome_facts row backed by a terminal receipt; ops.product_events are forbidden"
    conditional_surfaces_and_adapters: "UNCONFIGURED public web, verified email, API export, signed webhook, daily/weekly digest or messaging adapter is visible and nonblocking when unoffered; it cannot be selected, advertised, counted operational or used as a reason to block private-first pilot value"

insert_functions:
  ops.record_reconciled_invoice_v1:
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: "pg_catalog,ops,pg_temp"
    execute_grants: [gurine_workflow_worker]
    public_execute: revoked
    isolation: SERIALIZABLE
    idempotency_scope: ECONOMICS.RECORD_RECONCILED_INVOICE.V1
    return_type: ops.economics_mutation_receipt_v1
    atomic_writes: [invoice header, ordered invoice lines, complete ordered invoice-usage membership successor set including ZERO_USAGE and INCLUDED_ALLOWANCE rows, audit event, commercial.invoice_reconciled.v1 outbox event, immutable receipt and canonical stored response bytes]
  ops.record_revenue_fact_v1:
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: "pg_catalog,ops,pg_temp"
    execute_grants: [gurine_workflow_worker]
    public_execute: revoked
    isolation: SERIALIZABLE
    idempotency_scope: ECONOMICS.RECORD_REVENUE_FACT.V1
    return_type: ops.economics_mutation_receipt_v1
    atomic_writes: [revenue fact, audit event, commercial.revenue_fact_recorded.v1 outbox event, immutable receipt and canonical stored response bytes]
  ops.record_sku_readiness_evaluation_v1:
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: "pg_catalog,ops,pg_temp"
    execute_grants: [gurine_workflow_worker]
    public_execute: revoked
    isolation: SERIALIZABLE
    idempotency_scope: ECONOMICS.RECORD_SKU_READINESS_EVALUATION.V1
    return_type: ops.economics_mutation_receipt_v1
    atomic_writes: [readiness evaluation, exact ordered readiness items, audit event, commercial.sku_readiness_evaluated.v1 outbox event, immutable receipt and canonical stored response bytes]
  common:
    - "functions accept closed composite/array types, not jsonb or variadic key/value payloads"
    - "caller identity is a fixed service role; no session/user authorization is inferred in SQL"
    - "SET ROLE, role-name input, dynamic SQL, caller-controlled search_path, and caller-provided event payload are forbidden"
    - "each function claims its exact scope/key_hash/request_hash before domain locks and finalizes ops.idempotency_keys according to exact_idempotency_stored_response_contract; response_body JSONB is never a replay source"
    - "same canonical request returns the first stored response bytes and writes zero new rows; changed request under the key is IDEMPOTENCY_CONFLICT"

repository_contract:
  sqlx_types:
    uuid: uuid::Uuid
    date: chrono::NaiveDate
    timestamptz: chrono::DateTime<chrono::Utc>
    money: gurine_domain::money::Amount6
    currency: gurine_domain::money::Iso4217Code
    digest: gurine_domain::digest::Sha256Digest
    offered_optional_capability_ids: "Vec<OptionalCapabilityId>"
  query_order:
    invoice_lines: [invoice_id, line_ordinal, id]
    invoices_by_period: [deployment_id, organization_id, "period_start DESC", "period_end DESC", id]
    revenue_by_period: [deployment_id, organization_id, "recognition_period_start DESC", "recognition_period_end DESC", id]
    revenue_by_invoice: [invoice_id, invoice_line_id, recognition_period_start, recognition_period_end, id]
    latest_sku_evaluation: [deployment_id, sku, environment, readiness_stage, "evaluated_at DESC", id]
    readiness_items: [evaluation_id, item_ordinal, id]
  cursor_contract:
    invoices: [period_start, period_end, id]
    revenue: [recognition_period_start, recognition_period_end, id]
    readiness_history: [evaluated_at, id]
    encoding: "opaque authenticated cursor over the exact ordered tuple; no offset paging"
  row_mapping:
    - "INSERT RETURNING and SELECT enumerate every column in table-contract order; SELECT * is forbidden"
    - "nullable references remain Option<T>; repository never fabricates zero UUID, zero amount, empty digest, current timestamp, or default enum"
    - "PostgreSQL microsecond timestamp and numeric scale-six values round-trip exactly"
    - "stored digest is recomputed before a row becomes a domain value"
  aggregate_roundtrip_oracles:
    - "invoice header plus 7 line kinds, nullable discount/reference branches, negative accounting adjustment, and all totals round-trip exactly in line_ordinal,id order"
    - "invoice duplicate same-digest replay returns the stored header and lines byte-identically and emits no second event; changed digest conflicts"
    - "revenue split across multiple nonoverlapping recognition intervals round-trips and over-recognition is rejected under 64-client concurrency"
    - "all three readiness stages, every item state/evidence tier/reference family, all twelve conditional-capability subsets, measurement boundary values, and exact counts/digests round-trip"
    - "detail lookup returns exactly one or RESOURCE_NOT_FOUND; duplicate cardinality is a repository invariant error, never first-row-wins"

runtime_oracles:
  catalog:
    - "all six tables are relkind r and owned by gurine_migrator"
    - "every named PK, UQ, FK, CHECK, index, immutable trigger, deferred conservation trigger, and insert function resolves and is validated"
  privileges:
    - "PUBLIC and all unlisted runtime roles have no table or function privilege"
    - "workflow-worker can execute only the three typed record functions and cannot directly INSERT/UPDATE/DELETE/TRUNCATE"
    - "control-api and auditor are SELECT-only; public-projector, public-api, submission-api, identity-api, notification-worker, scheduler, ingest-worker, analysis-worker, and document-extractor cannot read these tables"
    - "all six direct UPDATE/DELETE attempts fail even if a canary grant is temporarily introduced; only the exact readiness purge function may delete readiness children and parent under its verified context, while the four accounting relations have no delete path"
  invoice:
    - "each independent conservation mutation fails at deferred commit: missing/duplicate ordinal, wrong line count, wrong line-set digest, each wrong subtotal/discount/taxable/tax/correction/total sum, currency mismatch, invalid adjustment link, tariff/usage/discount mismatch"
    - "64 concurrent imports of one source identity create one invoice aggregate and 63 same-digest replays or typed conflicts, never duplicate lines/events"
  revenue:
    - "stale recognition policy, wrong invoice/line/scope/currency, adjustment-line recognition, out-of-period recognition, zero/negative original fact, and cumulative over-recognition fail closed"
    - "append-only correction changes current adjusted value without changing original invoice, line, or revenue bytes"
  sku_readiness:
    - "catalog set equality is exact for every stage and every offered public/email/API/webhook/digest/messaging subset"
    - "READY is impossible with one missing, stale, config-mismatched, expired, revoked, suspended, fixture-only, or non-production required item"
    - "explicit UNSATISFIED takes header precedence as BLOCKED; absent/stale evidence with no explicit blocker derives UNKNOWN; no UNCONFIGURED header state exists"
    - "an unoffered inactive conditional capability is visible and nonblocking but cannot appear in offered_optional_capability_ids or operational projections"
    - "older APPROVED/ACTIVE capability decision, older cost/outcome chain member, product-event-only evidence, and non-period cost-allocation row are rejected"
    - "64 concurrent evaluations for the same semantic input create one stored evaluation or byte-identical replays; changed item/evidence digest conflicts"
  retention:
    - "active RETENTION or DELETION hold blocks terminal action for parent and child; DISCLOSURE hold blocks export while preserving authorized internal accounting use"
    - "invoice, line and revenue facts are preserved; backup restore cannot make a guarded-deleted/suppressed readiness evaluation or stale READY evaluation active"

event_schema_closure_required:
