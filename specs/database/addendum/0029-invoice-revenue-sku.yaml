    foreign_keys:
      - {name: revenue_facts_contract_period_fk, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone], references: "ops.commercial_contract_periods(id,deployment_id,organization_id,contract_id,sku,accounting_timezone)", on_delete: RESTRICT}
      - {name: revenue_facts_invoice_fk, columns: [invoice_id, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, currency], references: "ops.invoice_facts(id,deployment_id,organization_id,contract_period_id,contract_id,sku,accounting_timezone,currency)", on_delete: RESTRICT}
      - {name: revenue_facts_invoice_line_fk, columns: [invoice_line_id, invoice_id, sku, currency], references: "ops.invoice_line_facts(id,invoice_id,sku,currency)", on_delete: RESTRICT}
