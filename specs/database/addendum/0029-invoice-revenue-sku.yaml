      - {name: revenue_facts_sku_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1'::ops.commercial_sku"}
      - {name: revenue_facts_timezone_shape_ck, expression: "accounting_timezone = btrim(accounting_timezone) AND octet_length(accounting_timezone) BETWEEN 1 AND 255"}
      - {name: revenue_facts_period_ck, expression: "recognition_period_end > recognition_period_start"}
      - {name: revenue_facts_amount_ck, expression: "amount > 0"}
      - {name: revenue_facts_currency_ck, expression: "currency ~ '^[A-Z]{3}$'"}
      - {name: revenue_facts_policy_version_ck, expression: "recognition_policy_version ~ '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'"}
      - {name: revenue_facts_time_ck, expression: "recognized_at <= recorded_at"}
      - name: revenue_facts_digests_ck
        expression: "accounting_policy_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND source_record_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND import_receipt_digest ~ '^[0-9a-f]{64}$' AND record_digest ~ '^[0-9a-f]{64}$'"
    indexes:
      - {name: revenue_facts_scope_period_idx, method: btree, columns: [deployment_id, organization_id, "recognition_period_start DESC", "recognition_period_end DESC", id]}
      - {name: revenue_facts_contract_idx, method: btree, columns: [contract_id, "recognition_period_start DESC", id]}
      - {name: revenue_facts_invoice_idx, method: btree, columns: [invoice_id, invoice_line_id, recognition_period_start, recognition_period_end, id]}
      - {name: revenue_facts_line_policy_interval_idx, method: btree, columns: [invoice_line_id, recognition_policy_version, recognition_period_start, recognition_period_end, id]}
      - {name: revenue_facts_contract_period_fk_idx, method: btree, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone, id]}
      - {name: revenue_facts_invoice_fk_idx, method: btree, columns: [invoice_id, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, currency, id]}
      - {name: revenue_facts_invoice_line_fk_idx, method: btree, columns: [invoice_line_id, invoice_id, sku, currency, id]}
    procedural_guards:
      - "invoice line is not ACCOUNTING_ADJUSTMENT and recognition interval is contained by its service interval and the commercial contract period"
      - "accounting_timezone exists in pg_timezone_names and exactly matches invoice and contract period; recognition dates are half-open local-midnight bounds in that zone"
      - "under SERIALIZABLE lock on invoice_line_id, cumulative original revenue amount for the line cannot exceed its tax-exclusive recognizable amount; later changes are append-only ops.accounting_corrections"
      - "before any row or idempotency finalization, acquire the domain-separated advisory transaction lock for invoice_line_id+recognition_policy_version, lock that invoice line, all existing revenue rows in revenue_facts_line_policy_interval_idx order and every current correction leaf affecting them, then execute the predicate recognition_period_start < NEW.recognition_period_end AND NEW.recognition_period_start < recognition_period_end"
      - "the overlap predicate considers every existing interval whose correction-adjusted terminal amount is positive. A fully reversed row is excluded only while its exact immutable reversal chain is locked; moving an interval atomically appends that reversal and the replacement revenue fact under the same line-policy lock. Boundary adjacency is allowed, partial/full containment and cross-invoice aliases are rejected."
      - "the range predicate read remains inside SERIALIZABLE until commit, so a phantom overlapping insert or concurrent reversal/replacement yields one commit and serialization retry/conflict, never two positive current intervals. This exclusion-equivalent contract is mandatory and cannot be replaced by the cumulative amount cap."
      - "accounting_policy_digest is the exact current recognition policy at recognized_at; a stale policy fails REVENUE_RECOGNITION_POLICY_STALE"
      - "signature_digest and import_receipt_digest prove configured finance-importer verification over source_record_digest; invalid, stale, revoked, or mismatched proof fails REVENUE_FACT_INVALID"
      - "same id and record_digest is idempotent; same id or source receipt identity with another digest is REVENUE_FACT_INVALID"
    mutation:
      insert_path: ops.record_revenue_fact_v1
      update: forbidden
      delete: forbidden
      trigger: revenue_facts_immutable_before_update_delete
