      gurine_analysis_worker: []
      gurine_notification_worker: []
      gurine_scheduler: []
      gurine_document_extractor: []
      gurine_identity_api: []
    rls: {enabled: false, reason: "private single-organization accounting fact"}
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: recorded_at
      schedule_binding: "latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT"
      legal_hold_key: "deployment_id + organization_id + 'REVENUE_FACT' + id"
