      - {name: sku_readiness_evaluations_environment_ck, expression: "environment IN ('development','test','staging','production')"}
      - {name: sku_readiness_evaluations_stage_ck, expression: "readiness_stage IN ('PILOT_ENTRY_READINESS','POST_FIRST_BILLING_CYCLE','GENERAL_AVAILABILITY')"}
      - {name: sku_readiness_evaluations_catalog_version_ck, expression: "catalog_version = 'evidence-workspace-readiness.v1'"}
      - {name: sku_readiness_evaluations_offered_no_null_ck, expression: "array_position(offered_optional_capability_ids, NULL) IS NULL"}
      - name: sku_readiness_evaluations_offered_values_ck
        expression: "offered_optional_capability_ids <@ ARRAY['PUBLIC_WEB','VERIFIED_EMAIL','API_EXPORT','SIGNED_WEBHOOK','DAILY_DIGEST','WEEKLY_DIGEST','delivery.sms','delivery.telegram','delivery.whatsapp','delivery.line','delivery.kakao','delivery.voice']::text[]"
      - {name: sku_readiness_evaluations_time_ck, expression: "evidence_cutoff_at <= evaluated_at AND evaluated_at <= recorded_at"}
      - {name: sku_readiness_evaluations_count_bounds_ck, expression: "item_count > 0 AND required_item_count > 0 AND optional_item_count = 12 AND satisfied_required_item_count >= 0 AND blocked_required_item_count >= 0 AND unknown_required_item_count >= 0"}
      - {name: sku_readiness_evaluations_required_count_ck, expression: "required_item_count = satisfied_required_item_count + blocked_required_item_count + unknown_required_item_count"}
      - {name: sku_readiness_evaluations_total_count_ck, expression: "item_count >= optional_item_count AND required_item_count <= item_count"}
      - name: sku_readiness_evaluations_state_ck
        expression: "(state = 'READY' AND blocked_required_item_count = 0 AND unknown_required_item_count = 0 AND satisfied_required_item_count = required_item_count) OR (state = 'BLOCKED' AND blocked_required_item_count > 0) OR (state = 'UNKNOWN' AND blocked_required_item_count = 0 AND unknown_required_item_count > 0)"
      - name: sku_readiness_evaluations_digests_ck
        expression: "configuration_digest ~ '^[0-9a-f]{64}$' AND catalog_digest ~ '^[0-9a-f]{64}$' AND policy_digest ~ '^[0-9a-f]{64}$' AND offered_capability_set_digest ~ '^[0-9a-f]{64}$' AND item_identity_set_digest ~ '^[0-9a-f]{64}$' AND evaluation_identity_digest ~ '^[0-9a-f]{64}$' AND item_set_digest ~ '^[0-9a-f]{64}$' AND blocker_set_digest ~ '^[0-9a-f]{64}$' AND evaluator_build_digest ~ '^[0-9a-f]{64}$' AND evaluation_digest ~ '^[0-9a-f]{64}$' AND receipt_digest ~ '^[0-9a-f]{64}$'"
    indexes:
