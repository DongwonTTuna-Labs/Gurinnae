      - {name: invoice_usage_memberships_invoice_fk_idx, method: btree, columns: [invoice_id, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, currency, id]}
      - {name: invoice_usage_memberships_usage_fk_idx, method: btree, columns: [usage_fact_id, usage_root_fact_id, usage_fact_revision, usage_fact_digest, id]}
      - {name: invoice_usage_memberships_receipt_fk_idx, method: btree, columns: [usage_window_receipt_id, usage_window_receipt_version, usage_window_receipt_digest, id]}
      - {name: invoice_usage_memberships_line_fk_idx, method: btree, columns: [invoice_line_id, invoice_id, id], predicate: "invoice_line_id IS NOT NULL"}
    procedural_guards:
      - "The importer obtains a semantic advisory lock per deployment, contract, meter and usage_root_fact_id, then locks the current usage receipt/fact leaf and current membership leaf. A second ORIGINAL, branch, stale successor or current claim by another invoice cannot commit."
      - "The expected due population is computed before line arithmetic from every required meter/window intersecting the invoice interval. ZERO_USAGE and INCLUDED_ALLOWANCE remain physical membership rows even though neither creates a zero-value charge line; a due fact may never disappear merely because its overage is zero."
      - "usage fact and receipt tuples match deployment, organization, contract, tariff, SKU, accounting timezone, meter, window, measurement state, policy and digest exactly; PARTIAL, UNKNOWN, reversed, superseded, overlapping or gapped facts are returned by the read function as blockers and cannot be inserted as a successful membership."
      - "BILLED_OVERAGE invoice_line_id resolves within the same invoice, has the matching usage fact/meter/service interval and quantity = charged_quantity. ZERO_USAGE and INCLUDED_ALLOWANCE have no line. included_quantity and charged_quantity are recomputed once across the tariff quota in canonical meter/window/root/revision/id order."
      - "A RESTATEMENT points to the unique current membership leaf, increments revision one, binds predecessor invoice/digest and moves the usage root to the unique current successor invoice in the same transaction. The complete predecessor invoice membership set moves together; historical memberships remain immutable evidence."
      - "membership_digest and the parent usage_membership_set_digest are recomputed from closed canonical values after every referenced row is locked; generated time is excluded and any mismatch aborts the whole invoice aggregate."
    mutation:
      insert_path: ops.record_reconciled_invoice_v1
      update: forbidden
      delete: forbidden
      trigger: invoice_usage_memberships_immutable_before_update_delete
    grants:
      gurine_workflow_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_public_projector: []
      gurine_auditor: [SELECT]
      gurine_public_api: []
      gurine_submission_api: []
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_notification_worker: []
      gurine_scheduler: []
      gurine_document_extractor: []
      gurine_identity_api: []
    rls: {enabled: false, reason: "private immutable child/evidence ledger for one physical organization deployment"}
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: recorded_at
      schedule_binding: "same exact preservation schedule as the referenced invoices and usage facts"
      legal_hold_key: "deployment_id + organization_id + 'INVOICE_USAGE_MEMBERSHIP' + id + usage_root_fact_id"
      backup_behavior: "restore the complete membership chains before exposing any invoice as current; a missing successor/predecessor suppresses both invoices from reconciliation projections"
      terminal_action: "PRESERVE_IMMUTABLE_ACCOUNTING_FACT; source usage bodies may be crypto-erased under their own schedule but this typed membership and digest chain is never updated or deleted"

