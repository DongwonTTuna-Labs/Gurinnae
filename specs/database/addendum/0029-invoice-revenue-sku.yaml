      - {name: sku_readiness_evaluations_state_idx, method: btree, columns: [state, "evaluated_at DESC", deployment_id, id]}
      - {name: sku_readiness_evaluations_org_idx, method: btree, columns: [organization_id, "evaluated_at DESC", id]}
    procedural_guards:
      - "evaluation and all items are inserted in one SERIALIZABLE transaction under advisory lock(deployment_id,sku,environment,readiness_stage)"
      - "the exact private-first mandatory item-code set and twelve conditional offered rows are generated from the catalog digest; caller-supplied omission or duplication is rejected"
      - "a CONDITIONAL_OFFERED public/email/API/webhook/digest or messaging item is required_for_evaluation exactly when its capability id is in offered_optional_capability_ids"
      - "offered optional capability is never SATISFIED unless the latest exact production activation decision is APPROVED/ACTIVE, current, unexpired, and configuration-bound"
      - "item counts, state, item_set_digest, blocker_set_digest, evaluation_digest, and receipt_digest are recomputed after item insertion by a deferred constraint trigger"
      - "item_identity_digest is recomputed for every item before derived state/blocker fields, item_identity_set_digest is recomputed in item_code order, and evaluation_identity_digest binds that set after the complete item graph is locked; evaluated_at and generated identifiers are excluded, so retries cannot create duplicate semantic evaluations"
      - "an activation decision is selected by decision_id and digest; it need not store deployment_id because one deployment is one isolated database, but it must match environment and exact configuration"
      - "older READY rows remain immutable history; latest readiness is maximum evaluated_at,id for exact deployment,sku,environment,stage and is never inferred from an older row"
