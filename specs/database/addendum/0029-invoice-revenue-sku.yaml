canonical_digest_contract:
  scalar_encoding: "domain-separated, length-prefixed UTF-8; UUID lower-case hyphenated; date YYYY-MM-DD; UTC timestamps RFC3339 with six fractional digits and Z; numeric fixed six decimals; NULL is an explicit sentinel"
  invoice_line_digest:
    domain: GURINE_INVOICE_LINE_FACT_V1
    fields: [id, invoice_id, line_ordinal, line_kind, sku, service_period_start, service_period_end, usage_fact_id, usage_fact_digest, tariff_version_id, tariff_record_digest, discount_decision_id, discount_record_digest, corrects_line_id, meter_kind, quantity, unit_price, subtotal, discount_amount, taxable_amount, tax_category, tax_rate_basis_points, tax_exemption_digest, tax_policy_digest, tax_amount, correction_amount, correction_set_digest, rounding_policy_digest, line_total, currency, source_line_digest]
  invoice_line_set_digest:
    domain: GURINE_INVOICE_LINE_SET_V1
    members: "line_ordinal ASC, id ASC, then line_digest"
  invoice_usage_membership_digest:
    domain: GURINE_INVOICE_USAGE_MEMBERSHIP_V1
    fields: [id, root_membership_id, revision, membership_effect, supersedes_membership_id, predecessor_invoice_id, predecessor_membership_digest, invoice_id, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, currency, usage_root_fact_id, usage_fact_id, usage_fact_revision, usage_fact_digest, usage_window_receipt_id, usage_window_receipt_version, usage_window_receipt_digest, meter_kind, period_start, period_end, measurement_window_digest, measurement_state, membership_kind, billable_quantity, included_quantity, charged_quantity, billable_unit, invoice_line_id, allocation_policy_digest]
  invoice_usage_membership_set_digest:
    domain: GURINE_INVOICE_USAGE_MEMBERSHIP_SET_V1
    members: "meter_kind ASC, period_start ASC, period_end ASC, usage_root_fact_id ASC, revision ASC, id ASC, then membership_digest"
  invoice_reconciliation_digest:
    domain: GURINE_INVOICE_RECONCILIATION_V1
    fields: [id, root_invoice_id, invoice_revision, invoice_effect, supersedes_invoice_id, predecessor_reconciliation_digest, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, source_system_id, external_invoice_reference_digest, period_start, period_end, billing_cutoff_at, currency, line_count, line_set_digest, expected_usage_membership_count, usage_membership_count, usage_membership_set_digest, usage_fact_set_digest, usage_window_receipt_set_digest, tariff_set_digest, discount_leaf_set_digest, correction_set_digest, contract_state_interval_set_digest, tax_policy_digest, rounding_policy_digest, subtotal, discount_total, taxable_amount, tax_total, correction_total, invoice_total, provider_receipt_digest, source_record_digest, signature_digest, import_receipt_digest, accounting_policy_digest, reconciled_at]
  revenue_record_digest:
    domain: GURINE_REVENUE_FACT_V1
    fields: [id, deployment_id, organization_id, contract_period_id, contract_id, invoice_id, invoice_line_id, sku, accounting_timezone, recognition_period_start, recognition_period_end, amount, currency, recognition_policy_version, accounting_policy_digest, source_receipt_digest, source_record_digest, signature_digest, import_receipt_digest, recognized_at]
  sku_readiness_item_digest:
    domain: GURINE_SKU_READINESS_ITEM_V1
    fields: [id, evaluation_id, item_ordinal, item_code, item_identity_digest, requirement_class, required_for_evaluation, item_state, evidence_tier, expected_configuration_digest, activation_decision_id, activation_decision_version, activation_decision_digest, activation_evidence_id, activation_evidence_digest, commercial_contract_period_id, commercial_contract_record_digest, tariff_version_id, tariff_record_digest, invoice_fact_id, invoice_reconciliation_digest, revenue_fact_id, revenue_record_digest, cost_allocation_period_id, cost_allocation_row_kind, cost_allocation_record_digest, cost_allocation_close_receipt_digest, outcome_fact_id, outcome_fact_digest, sli_window_receipt_id, sli_id, sli_definition_version, sli_environment, sli_scope_digest, sli_window_kind, sli_window_sequence, sli_organization_id, sli_contract_period_id, sli_policy_digest, sli_receipt_digest, evidence_member_set_digest, evidence_as_of, evidence_expires_at, measurement_unit, comparator, observed_value, threshold_value, blocker_code, remediation_code, owner_function]
  sku_readiness_item_identity_digest:
    domain: GURINE_SKU_READINESS_ITEM_IDENTITY_V1
    fields: [item_code, requirement_class, required_for_evaluation, evidence_tier, expected_configuration_digest, activation_decision_id, activation_decision_version, activation_decision_digest, activation_evidence_id, activation_evidence_digest, commercial_contract_period_id, commercial_contract_record_digest, tariff_version_id, tariff_record_digest, invoice_fact_id, invoice_reconciliation_digest, revenue_fact_id, revenue_record_digest, cost_allocation_period_id, cost_allocation_row_kind, cost_allocation_record_digest, cost_allocation_close_receipt_digest, outcome_fact_id, outcome_fact_digest, sli_window_receipt_id, sli_id, sli_definition_version, sli_environment, sli_scope_digest, sli_window_kind, sli_window_sequence, sli_organization_id, sli_contract_period_id, sli_policy_digest, sli_receipt_digest, evidence_member_set_digest, evidence_as_of, evidence_expires_at, measurement_unit, comparator, observed_value, threshold_value, owner_function]
    excluded_generated_or_derived: [id, evaluation_id, item_ordinal, item_state, blocker_code, remediation_code, item_digest, recorded_at]
  sku_readiness_item_identity_set_digest:
    domain: GURINE_SKU_READINESS_ITEM_IDENTITY_SET_V1
    members: item_code ASC then item_identity_digest; generated evaluation/item UUIDs and derived verdict fields are excluded
  sku_readiness_item_set_digest:
    domain: GURINE_SKU_READINESS_ITEM_SET_V1
    members: "item_ordinal ASC, id ASC, then item_digest"
  sku_readiness_blocker_set_digest:
    domain: GURINE_SKU_READINESS_BLOCKER_SET_V1
    members: "required_for_evaluation=true and item_state in (UNSATISFIED,UNKNOWN), ordered item_ordinal ASC,id ASC, then item_digest"
  sku_readiness_evaluation_digest:
    domain: GURINE_SKU_READINESS_EVALUATION_V1
    fields: [id, deployment_id, organization_id, sku, environment, readiness_stage, configuration_digest, catalog_version, catalog_digest, policy_digest, offered_optional_capability_ids, offered_capability_set_digest, item_identity_set_digest, evaluation_identity_digest, evaluated_at, evidence_cutoff_at, item_count, required_item_count, satisfied_required_item_count, blocked_required_item_count, unknown_required_item_count, optional_item_count, item_set_digest, blocker_set_digest, state, evaluator_build_digest]
  sku_readiness_natural_identity:
    domain: GURINE_SKU_READINESS_NATURAL_IDENTITY_V1
    fields: [deployment_id, organization_id, sku, environment, readiness_stage, configuration_digest, catalog_version, catalog_digest, policy_digest, offered_capability_set_digest, evidence_cutoff_at, item_identity_set_digest]
    digest_field: evaluation_identity_digest
    excluded: [id, evaluated_at, recorded_at, state, counts, item_set_digest, blocker_set_digest, evaluator_build_digest, evaluation_digest, receipt_digest]
    replay_rule: A repeated evaluation of the same exact input snapshot resolves by evaluation_identity_digest and returns the first stored evaluation and response byte-for-byte; wall-clock retry time is never a new business identity.
  database_validation:
    - "typed SECURITY DEFINER insert routines recompute each digest from validated scalar fields"
    - "Rust and PostgreSQL canonical encoders share golden vectors; supplied digest mismatch aborts with SQLSTATE 22000"
    - "digest columns reject upper-case, non-hex, and non-64-character input"

tables:
  ops.invoice_facts:
    creation_order: 11
    object_owner: gurine_migrator
    owner_service: workflow-worker
    owner_module: finance-importer
    domain_type: gurine_domain::economics::InvoiceFact
    repository: crates/persistence-postgres::invoices
    repository_round_trip:
      typed_row: InvoiceFactRow
      domain_constructor: "InvoiceFact::try_from_persisted"
      insert_path: ops.record_reconciled_invoice_v1
      replay: "same internal/source identity and reconciliation_digest returns the byte-identical stored aggregate; changed digest is INVOICE_RECONCILIATION_FAILED"
      cardinality: "detail exactly one header; aggregate exactly line_count children; missing is RESOURCE_NOT_FOUND and duplicate is PERSISTENCE_CARDINALITY_VIOLATION"
      stable_order: ["period_start DESC", "period_end DESC", id]
      no_synthesis: [id, deployment_id, organization_id, contract_period_id, contract_id, sku, money, currency, digests, reconciled_at, recorded_at]
      error_tests: [invalid_digest, invalid_currency, missing_contract_fk, changed_digest_replay, forbidden_update, forbidden_delete, wrong_role, disclosure_hold_blocked_projection]
      test_identity: AC-OA-TABLE-OPS-INVOICE_FACTS-CONTRACT
    mutation_class: IMMUTABLE
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: root_invoice_id, type: uuid, nullable: false, default: null}
      - {name: invoice_revision, type: bigint, nullable: false, default: null}
      - {name: invoice_effect, type: ops.invoice_fact_effect, nullable: false, default: null}
      - {name: supersedes_invoice_id, type: uuid, nullable: true, default: null}
      - {name: predecessor_reconciliation_digest, type: "char(64)", nullable: true, default: null}
      - {name: deployment_id, type: uuid, nullable: false, default: null}
      - {name: organization_id, type: uuid, nullable: false, default: null}
      - {name: contract_period_id, type: uuid, nullable: false, default: null}
      - {name: contract_id, type: uuid, nullable: false, default: null}
      - {name: sku, type: "ops.commercial_sku", nullable: false, default: null}
      - {name: accounting_timezone, type: text, nullable: false, default: null}
      - {name: source_system_id, type: text, nullable: false, default: null}
      - {name: external_invoice_reference_digest, type: "char(64)", nullable: false, default: null}
      - {name: period_start, type: date, nullable: false, default: null}
      - {name: period_end, type: date, nullable: false, default: null}
      - {name: billing_cutoff_at, type: timestamptz, nullable: false, default: null}
      - {name: currency, type: "char(3)", nullable: false, default: null}
      - {name: line_count, type: integer, nullable: false, default: null}
      - {name: line_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: expected_usage_membership_count, type: integer, nullable: false, default: null}
      - {name: usage_membership_count, type: integer, nullable: false, default: null}
      - {name: usage_membership_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: usage_fact_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: usage_window_receipt_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: tariff_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: discount_leaf_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: correction_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: contract_state_interval_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: tax_policy_digest, type: "char(64)", nullable: false, default: null}
      - {name: rounding_policy_digest, type: "char(64)", nullable: false, default: null}
      - {name: subtotal, type: "numeric(24,6)", nullable: false, default: null}
      - {name: discount_total, type: "numeric(24,6)", nullable: false, default: null}
      - {name: taxable_amount, type: "numeric(24,6)", nullable: false, default: null}
      - {name: tax_total, type: "numeric(24,6)", nullable: false, default: null}
      - {name: correction_total, type: "numeric(24,6)", nullable: false, default: null}
      - {name: invoice_total, type: "numeric(24,6)", nullable: false, default: null}
      - {name: provider_receipt_digest, type: "char(64)", nullable: false, default: null}
      - {name: source_record_digest, type: "char(64)", nullable: false, default: null}
      - {name: signature_digest, type: "char(64)", nullable: false, default: null}
      - {name: import_receipt_digest, type: "char(64)", nullable: false, default: null}
      - {name: accounting_policy_digest, type: "char(64)", nullable: false, default: null}
      - {name: reconciliation_digest, type: "char(64)", nullable: false, default: null}
      - {name: reconciled_at, type: timestamptz, nullable: false, default: null}
      - {name: recorded_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    unique_constraints:
      - {name: invoice_facts_reconciliation_digest_uq, columns: [reconciliation_digest]}
      - {name: invoice_facts_import_receipt_uq, columns: [import_receipt_digest]}
      - {name: invoice_facts_root_revision_uq, columns: [root_invoice_id, invoice_revision]}
      - {name: invoice_facts_source_identity_revision_uq, columns: [deployment_id, source_system_id, external_invoice_reference_digest, invoice_revision]}
      - {name: invoice_facts_chain_reference_uq, columns: [id, root_invoice_id, reconciliation_digest]}
      - {name: invoice_facts_scope_uq, columns: [id, deployment_id, organization_id, contract_period_id, contract_id, sku, accounting_timezone, currency]}
      - {name: invoice_facts_currency_uq, columns: [id, currency]}
    foreign_keys:
      - {name: invoice_facts_root_fk, columns: [root_invoice_id], references: "ops.invoice_facts(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: invoice_facts_supersedes_fk, columns: [supersedes_invoice_id, root_invoice_id, predecessor_reconciliation_digest], references: "ops.invoice_facts(id,root_invoice_id,reconciliation_digest)", on_delete: RESTRICT, match: FULL}
      - {name: invoice_facts_contract_period_fk, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone], references: "ops.commercial_contract_periods(id,deployment_id,organization_id,contract_id,sku,accounting_timezone)", on_delete: RESTRICT}
    checks:
      - {name: invoice_facts_revision_ck, expression: "invoice_revision > 0"}
      - {name: invoice_facts_chain_shape_ck, expression: "(invoice_effect = 'ORIGINAL' AND invoice_revision = 1 AND root_invoice_id = id AND supersedes_invoice_id IS NULL AND predecessor_reconciliation_digest IS NULL) OR (invoice_effect = 'RESTATEMENT' AND invoice_revision > 1 AND root_invoice_id <> id AND supersedes_invoice_id IS NOT NULL AND predecessor_reconciliation_digest IS NOT NULL)"}
      - {name: invoice_facts_sku_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1'::ops.commercial_sku"}
      - {name: invoice_facts_source_system_ck, expression: "source_system_id ~ '^[a-z0-9][a-z0-9._-]{0,127}$'"}
      - {name: invoice_facts_timezone_shape_ck, expression: "accounting_timezone = btrim(accounting_timezone) AND octet_length(accounting_timezone) BETWEEN 1 AND 255"}
      - {name: invoice_facts_period_ck, expression: "period_end > period_start"}
      - {name: invoice_facts_currency_ck, expression: "currency ~ '^[A-Z]{3}$'"}
      - {name: invoice_facts_line_count_ck, expression: "line_count > 0 AND expected_usage_membership_count > 0 AND usage_membership_count = expected_usage_membership_count"}
      - {name: invoice_facts_nonnegative_amounts_ck, expression: "subtotal >= 0 AND discount_total >= 0 AND taxable_amount >= 0 AND tax_total >= 0 AND invoice_total >= 0"}
      - {name: invoice_facts_discount_bound_ck, expression: "discount_total <= subtotal"}
      - {name: invoice_facts_taxable_conservation_ck, expression: "taxable_amount = subtotal - discount_total"}
      - {name: invoice_facts_total_conservation_ck, expression: "invoice_total = taxable_amount + tax_total + correction_total"}
      - {name: invoice_facts_time_ck, expression: "billing_cutoff_at <= reconciled_at AND reconciled_at <= recorded_at"}
      - name: invoice_facts_digests_ck
        expression: "(predecessor_reconciliation_digest IS NULL OR predecessor_reconciliation_digest ~ '^[0-9a-f]{64}$') AND external_invoice_reference_digest ~ '^[0-9a-f]{64}$' AND line_set_digest ~ '^[0-9a-f]{64}$' AND usage_membership_set_digest ~ '^[0-9a-f]{64}$' AND usage_fact_set_digest ~ '^[0-9a-f]{64}$' AND usage_window_receipt_set_digest ~ '^[0-9a-f]{64}$' AND tariff_set_digest ~ '^[0-9a-f]{64}$' AND discount_leaf_set_digest ~ '^[0-9a-f]{64}$' AND correction_set_digest ~ '^[0-9a-f]{64}$' AND contract_state_interval_set_digest ~ '^[0-9a-f]{64}$' AND tax_policy_digest ~ '^[0-9a-f]{64}$' AND rounding_policy_digest ~ '^[0-9a-f]{64}$' AND provider_receipt_digest ~ '^[0-9a-f]{64}$' AND source_record_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND import_receipt_digest ~ '^[0-9a-f]{64}$' AND accounting_policy_digest ~ '^[0-9a-f]{64}$' AND reconciliation_digest ~ '^[0-9a-f]{64}$'"
    indexes:
      - {name: invoice_facts_one_successor_uq, unique: true, method: btree, columns: [supersedes_invoice_id], predicate: "supersedes_invoice_id IS NOT NULL"}
      - {name: invoice_facts_root_history_idx, method: btree, columns: [root_invoice_id, invoice_revision, id]}
      - {name: invoice_facts_scope_period_idx, method: btree, columns: [deployment_id, organization_id, "period_start DESC", "period_end DESC", id]}
      - {name: invoice_facts_contract_idx, method: btree, columns: [contract_id, "period_start DESC", id]}
      - {name: invoice_facts_recorded_idx, method: btree, columns: ["recorded_at DESC", id]}
      - {name: invoice_facts_contract_period_fk_idx, method: btree, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone, id]}
      - {name: invoice_facts_supersedes_fk_idx, method: btree, columns: [supersedes_invoice_id, root_invoice_id, predecessor_reconciliation_digest, id], predicate: "supersedes_invoice_id IS NOT NULL"}
    procedural_guards:
      - "accounting_timezone is an exact pg_timezone_names.name and equals the referenced commercial contract period; each date interval is interpreted as half-open local-midnight bounds in that zone"
      - "billing_cutoff_at is on or after the UTC instant of period_end local midnight and locks the complete current contract-state interval, usage-window/usage-fact, tariff, discount, correction and tax-policy sets; any later fact requires a restatement invoice"
      - "signature_digest is the SHA-256 of the detached signature bytes; import_receipt_digest binds source system, key reference, signature scheme, signed canonical source_record_digest, verification outcome, and verified_at"
      - "the configured finance-importer trust store verifies the signature before insert; unknown key, invalid signature, stale/revoked key, or receipt mismatch fails INVOICE_RECONCILIATION_FAILED"
      - "provider_receipt_digest identifies the terminal provider observation and is not itself treated as signature proof"
      - "ORIGINAL acquires the external-invoice semantic lock and creates the sole root. RESTATEMENT requires expected current head ID+reconciliation digest, locks that head, preserves external invoice identity/scope/period/currency/accounting policy, increments invoice_revision exactly one and becomes its sole successor; a changed payload without explicit restatement intent is INVOICE_RECONCILIATION_FAILED."
      - "A restatement moves the complete current usage-membership set atomically to the successor invoice. Splitting a predecessor membership set, leaving one old current membership, claiming a membership already current on another root, or replaying a stale head fails and writes no invoice, line, membership, audit or event row."
    mutation:
      insert_path: ops.record_reconciled_invoice_v1
