    foreign_keys:
      - {name: invoice_line_facts_invoice_fk, columns: [invoice_id, currency], references: "ops.invoice_facts(id,currency)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: invoice_line_facts_usage_fk, columns: [usage_fact_id, usage_fact_digest], references: "ops.usage_facts(id,record_digest)", on_delete: RESTRICT, match: FULL}
      - {name: invoice_line_facts_tariff_fk, columns: [tariff_version_id, tariff_record_digest], references: "ops.tariff_versions(id,record_digest)", on_delete: RESTRICT, match: FULL}
      - {name: invoice_line_facts_discount_fk, columns: [discount_decision_id, discount_record_digest], references: "ops.discount_decisions(id,record_digest)", on_delete: RESTRICT, match: FULL}
      - {name: invoice_line_facts_corrected_line_fk, columns: [corrects_line_id, invoice_id], references: "ops.invoice_line_facts(id,invoice_id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
    checks:
      - {name: invoice_line_facts_ordinal_ck, expression: "line_ordinal > 0"}
      - {name: invoice_line_facts_kind_ck, expression: "line_kind IN ('WORKSPACE_BASE','ACTIVE_CONTRIBUTOR_BLOCK','PROCESSING_CREDIT_OVERAGE','STORAGE_GB_MONTH_OVERAGE','API_RECORD_UNIT_OVERAGE','SLA_ADD_ON','ACCOUNTING_ADJUSTMENT')"}
      - {name: invoice_line_facts_sku_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1'::ops.commercial_sku"}
      - {name: invoice_line_facts_period_ck, expression: "service_period_end > service_period_start"}
      - {name: invoice_line_facts_currency_ck, expression: "currency ~ '^[A-Z]{3}$'"}
      - {name: invoice_line_facts_meter_kind_ck, expression: "meter_kind IS NULL OR meter_kind IN ('SEAT','AGENT_TOKEN','MODEL_REQUEST','SOURCE_PAGE','STORAGE_BYTE_HOUR','DELIVERY_ATTEMPT','EXPORT_BYTE','API_REQUEST')"}
      - {name: invoice_line_facts_nonnegative_amounts_ck, expression: "quantity >= 0 AND unit_price >= 0 AND subtotal >= 0 AND discount_amount >= 0 AND taxable_amount >= 0 AND tax_amount >= 0"}
      - {name: invoice_line_facts_discount_bound_ck, expression: "discount_amount <= subtotal"}
      - {name: invoice_line_facts_taxable_conservation_ck, expression: "taxable_amount = subtotal - discount_amount"}
      - {name: invoice_line_facts_total_conservation_ck, expression: "line_total = taxable_amount + tax_amount + correction_amount"}
      - {name: invoice_line_facts_metered_reference_ck, expression: "line_kind IN ('WORKSPACE_BASE','SLA_ADD_ON','ACCOUNTING_ADJUSTMENT') OR (usage_fact_id IS NOT NULL AND usage_fact_digest IS NOT NULL AND meter_kind IS NOT NULL)"}
      - {name: invoice_line_facts_fixed_charge_ck, expression: "line_kind NOT IN ('WORKSPACE_BASE','SLA_ADD_ON') OR (usage_fact_id IS NULL AND usage_fact_digest IS NULL AND meter_kind IS NULL AND quantity = 1)"}
      - {name: invoice_line_facts_ordinary_charge_ck, expression: "line_kind = 'ACCOUNTING_ADJUSTMENT' OR (tariff_version_id IS NOT NULL AND corrects_line_id IS NULL AND quantity > 0 AND subtotal = ops.round_half_even_numeric_v1(quantity * unit_price, 6) AND correction_amount = 0 AND line_total >= 0)"}
      - {name: invoice_line_facts_adjustment_ck, expression: "line_kind <> 'ACCOUNTING_ADJUSTMENT' OR (usage_fact_id IS NULL AND usage_fact_digest IS NULL AND tariff_version_id IS NULL AND tariff_record_digest IS NULL AND discount_decision_id IS NULL AND discount_record_digest IS NULL AND corrects_line_id IS NOT NULL AND meter_kind IS NULL AND quantity = 0 AND unit_price = 0 AND subtotal = 0 AND discount_amount = 0 AND taxable_amount = 0 AND tax_amount = 0 AND correction_amount <> 0)"}
      - {name: invoice_line_facts_seat_meter_ck, expression: "line_kind <> 'ACTIVE_CONTRIBUTOR_BLOCK' OR meter_kind = 'SEAT'"}
      - {name: invoice_line_facts_processing_meter_ck, expression: "line_kind <> 'PROCESSING_CREDIT_OVERAGE' OR meter_kind IN ('AGENT_TOKEN','MODEL_REQUEST','SOURCE_PAGE')"}
      - {name: invoice_line_facts_storage_meter_ck, expression: "line_kind <> 'STORAGE_GB_MONTH_OVERAGE' OR meter_kind = 'STORAGE_BYTE_HOUR'"}
      - {name: invoice_line_facts_api_meter_ck, expression: "line_kind <> 'API_RECORD_UNIT_OVERAGE' OR meter_kind = 'API_REQUEST'"}
      - {name: invoice_line_facts_discount_decision_ck, expression: "(discount_amount = 0 AND discount_decision_id IS NULL AND discount_record_digest IS NULL) OR (discount_amount > 0 AND discount_decision_id IS NOT NULL AND discount_record_digest IS NOT NULL)"}
      - name: invoice_line_facts_tax_ck
        expression: "tax_category IN ('STANDARD','ZERO_RATED','EXEMPT','OUT_OF_SCOPE') AND tax_rate_basis_points BETWEEN 0 AND 10000 AND ((tax_category = 'STANDARD' AND tax_rate_basis_points > 0 AND tax_exemption_digest IS NULL) OR (tax_category IN ('ZERO_RATED','EXEMPT','OUT_OF_SCOPE') AND tax_rate_basis_points = 0 AND tax_exemption_digest IS NOT NULL)) AND tax_amount = ops.round_half_even_numeric_v1(taxable_amount * tax_rate_basis_points::numeric / 10000::numeric, 6)"
      - {name: invoice_line_facts_digests_ck, expression: "(usage_fact_digest IS NULL OR usage_fact_digest ~ '^[0-9a-f]{64}$') AND (tariff_record_digest IS NULL OR tariff_record_digest ~ '^[0-9a-f]{64}$') AND (discount_record_digest IS NULL OR discount_record_digest ~ '^[0-9a-f]{64}$') AND (tax_exemption_digest IS NULL OR tax_exemption_digest ~ '^[0-9a-f]{64}$') AND tax_policy_digest ~ '^[0-9a-f]{64}$' AND correction_set_digest ~ '^[0-9a-f]{64}$' AND rounding_policy_digest ~ '^[0-9a-f]{64}$' AND source_line_digest ~ '^[0-9a-f]{64}$' AND line_digest ~ '^[0-9a-f]{64}$'"}
    indexes:
      - {name: invoice_line_facts_invoice_order_idx, method: btree, columns: [invoice_id, line_ordinal, id]}
      - {name: invoice_line_facts_usage_idx, method: btree, columns: [usage_fact_id, usage_fact_digest, id], predicate: "usage_fact_id IS NOT NULL"}
      - {name: invoice_line_facts_tariff_idx, method: btree, columns: [tariff_version_id, tariff_record_digest, service_period_start, id], predicate: "tariff_version_id IS NOT NULL"}
      - {name: invoice_line_facts_discount_idx, method: btree, columns: [discount_decision_id, discount_record_digest, id], predicate: "discount_decision_id IS NOT NULL"}
      - {name: invoice_line_facts_corrected_line_idx, method: btree, columns: [corrects_line_id, line_ordinal, id], predicate: "corrects_line_id IS NOT NULL"}
      - {name: invoice_line_facts_invoice_fk_idx, method: btree, columns: [invoice_id, currency, id]}
      - {name: invoice_line_facts_corrected_line_fk_idx, method: btree, columns: [corrects_line_id, invoice_id, id], predicate: "corrects_line_id IS NOT NULL"}
    procedural_guards:
      - "ordinary line usage fact, tariff version, contract period, deployment, organization, SKU, meter, quantity, service period, and currency match the invoice and one another"
      - "usage_fact_digest, tariff_record_digest and discount_record_digest equal the locked immutable rows; line tax_policy_digest and rounding_policy_digest equal the header and tariff policies"
      - "tariff version is effective for the service period and its closed component computes unit_price"
      - "discount decision is effective, applies to organization and line kind, and computes discount_amount exactly"
      - "ACCOUNTING_ADJUSTMENT points to an earlier non-adjustment line in the same invoice; cycles and adjustment-to-adjustment links are rejected"
      - "ACCOUNTING_ADJUSTMENT is OUT_OF_SCOPE with a policy/exemption digest and zero tax; every other line recomputes tax category, rate and exemption under the exact tax policy"
      - "all monetary arithmetic is exact numeric(24,6); every rounding point invokes ops.round_half_even_numeric_v1 at the declared scale and the built-in PostgreSQL numeric rounding overload, binary float and implicit cast rounding are forbidden"
    mutation:
      insert_path: ops.record_reconciled_invoice_v1
      update: forbidden
      delete: forbidden
      trigger: invoice_line_facts_immutable_before_update_delete
    grants:
      gurine_workflow_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_public_projector: []
      gurine_auditor: [SELECT]
      gurine_public_api: []
      gurine_submission_api: []
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_notification_worker: []
      gurine_scheduler: []
      gurine_document_extractor: []
      gurine_identity_api: []
    rls: {enabled: false, reason: "child of a private single-organization accounting aggregate"}
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: recorded_at
      schedule_binding: "same exact schedule revision bound by parent invoice fact"
      legal_hold_key: "parent invoice legal-hold key plus 'LINE' + id"
      backup_behavior: "restored child remains inaccessible whenever parent is suppressed or held"
      terminal_action: "PRESERVE_IMMUTABLE_ACCOUNTING_FACT with the parent invoice; no child-first deletion path exists"

