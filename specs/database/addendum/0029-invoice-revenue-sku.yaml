resolved_blockers:
  - id: INV-REV-SKU-001
    resolution: "commercial core now exposes exact ID+digest candidate keys, concrete correction target columns, gapless correction order and all invoice/revenue/readiness FKs validate in the physical contract"
  - id: INV-REV-SKU-005
    resolution: "the pre-activation gate is now named PILOT_ENTRY_READINESS, has exactly fourteen private-first mandatory items, and treats public web, verified email, API export, signed webhook, daily/weekly digest and six messaging adapters as twelve visible conditional-offered capabilities"
  - id: INV-REV-SKU-002
    resolution: "commercial.invoice_reconciled.v1, commercial.revenue_fact_recorded.v1, commercial.sku_readiness_evaluated.v1 and accounting.correction_recorded.v1 are frozen as deterministic rebuild payloads by event_schema_closure_required; every immutable identity, correction-set, source, policy, reconciliation and receipt digest required by the corresponding physical row is mandatory and event consumers reject unknown or missing fields"
  - id: INV-REV-SKU-003
    resolution: "capability_activation_binding is frozen to capability_class PAID_WORKSPACE_PROCESSING, capability_id in the exact twelve-element optional_capability_id registry plus the three core readiness IDs, environment PRODUCTION, and decision_version/decision_digest candidate key; the readiness item binds the latest APPROVED and ACTIVE decision and its evidence through the exact 0026 composite action FK"
  - id: INV-REV-SKU-004
    resolution: "owner-approved retention schedule bindings are explicit below; migration never invents statutory periods, but rejects a missing or stale schedule and cannot emit READY. The schedule revision, digest, trigger, hold behavior and terminal action are persisted in each evaluation/accounting receipt."

retention_schedule_bindings:
  policy_version: COMMERCIAL_RETENTION_V1
  authority_rule: "These are product retention decisions, not a claim about statutory limitation periods. A deployment owner may append a reviewed successor through the 0028 schedule command; no migration default or missing row may synthesize a duration."
  COMMERCIAL_ACCOUNTING_FACT:
    active_duration_seconds: 220752000
    backup_duration_seconds: 252288000
    trigger_kind: TERMINAL_AT
    terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    hold_behavior: BLOCK_ON_RETENTION_OR_DELETION
    restore_suppression_behavior: REAPPLY_BEFORE_ACCESS
    source_of_truth: "ops.record_class_schedules current revision bound by schedule_revision/schedule_digest"
  SKU_READINESS_EVALUATION:
    active_duration_seconds: 63072000
    backup_duration_seconds: 94608000
    trigger_kind: TERMINAL_AT
    terminal_action: DELETE
