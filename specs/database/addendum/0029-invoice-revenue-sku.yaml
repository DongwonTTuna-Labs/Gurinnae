    add_required: [deploymentId, contractPeriodId, contractId, sku, accountingTimezone, lineCount, billingCutoffAt, expectedUsageMembershipCount, usageMembershipCount, usageMembershipSetDigest, usageFactSetDigest, usageWindowReceiptSetDigest, tariffSetDigest, discountLeafSetDigest, correctionSetDigest, contractStateIntervalSetDigest, taxPolicyDigest, roundingPolicyDigest, sourceSystemId, externalInvoiceReferenceDigest, sourceRecordDigest, signatureDigest, importReceiptDigest, accountingPolicyDigest, reconciledAt]
