      - name: provider_webhook_event_identity_uq
        columns: [deployment_id, environment, provider, merchant_account_hmac, provider_event_identity_hmac]
      - name: provider_webhook_delivery_identity_uq
        columns: [deployment_id, environment, provider, merchant_account_hmac, delivery_identity_hmac]
      - {name: provider_webhook_receipt_digest_uq, columns: [receipt_digest]}
      - {name: provider_webhook_reference_uq, columns: [id, receipt_digest]}
    foreign_keys:
      - {name: provider_webhook_charge_fk, columns: [resulting_charge_attempt_id, resulting_charge_attempt_digest], references: "ops.payment_charge_attempts(id,record_digest)", on_delete: RESTRICT, match: FULL, deferrable: "INITIALLY DEFERRED"}
      - {name: provider_webhook_donation_fk, columns: [resulting_donation_fact_id, resulting_donation_fact_digest], references: "ops.donation_facts(id,fact_digest)", on_delete: RESTRICT, match: FULL, deferrable: "INITIALLY DEFERRED"}
    checks:
      - name: provider_webhook_shape_ck
        expression: >-
          provider IN ('TOSS_PAYMENTS','KAKAO_PAY','STRIPE')
          AND environment = 'TEST'
          AND signature_state IN ('VERIFIED','FAILED','NOT_SUPPORTED')
          AND fetch_state IN ('NOT_ATTEMPTED','FETCH_CONFIRMED','FETCH_NOT_FOUND')
          AND body_byte_length BETWEEN 1 AND 10485760
          AND ((signature_state = 'NOT_SUPPORTED'
          AND signature_evidence_digest IS NULL) OR
          (signature_state IN ('VERIFIED','FAILED')
          AND signature_evidence_digest IS NOT NULL))
          AND (signature_state <> 'FAILED' OR fetch_state = 'NOT_ATTEMPTED')
          AND ((fetch_state = 'FETCH_CONFIRMED'
          AND provider_object_identity_hmac IS NOT NULL
          AND provider_object_hmac_key_version IS NOT NULL
          AND provider_fetch_request_digest IS NOT NULL
          AND provider_fetch_response_digest IS NOT NULL
          AND provider_payment_state IS NOT NULL AND fetched_at IS NOT NULL) OR
          (fetch_state <> 'FETCH_CONFIRMED'
          AND provider_object_identity_hmac IS NULL
          AND provider_object_hmac_key_version IS NULL
          AND provider_fetch_request_digest IS NULL
          AND provider_fetch_response_digest IS NULL
          AND provider_payment_state IS NULL AND fetched_at IS NULL))
          AND (resulting_charge_attempt_id IS NULL) =
          (resulting_charge_attempt_digest IS NULL)
          AND (resulting_donation_fact_id IS NULL) =
          (resulting_donation_fact_digest IS NULL)
          AND (resulting_donation_fact_id IS NULL OR fetch_state = 'FETCH_CONFIRMED')
      - name: provider_webhook_digest_ck
        expression: >-
          provider_event_identity_hmac ~ '^[0-9a-f]{64}$'
          AND merchant_account_hmac ~ '^[0-9a-f]{64}$'
          AND provider_config_digest ~ '^[0-9a-f]{64}$'
          AND delivery_identity_hmac ~ '^[0-9a-f]{64}$'
          AND body_digest ~ '^[0-9a-f]{64}$'
          AND header_set_digest ~ '^[0-9a-f]{64}$'
          AND (signature_evidence_digest IS NULL OR
          signature_evidence_digest ~ '^[0-9a-f]{64}$')
          AND (provider_object_identity_hmac IS NULL OR
          provider_object_identity_hmac ~ '^[0-9a-f]{64}$')
          AND (provider_fetch_request_digest IS NULL OR
          provider_fetch_request_digest ~ '^[0-9a-f]{64}$')
          AND (provider_fetch_response_digest IS NULL OR
          provider_fetch_response_digest ~ '^[0-9a-f]{64}$')
          AND (resulting_charge_attempt_digest IS NULL OR
          resulting_charge_attempt_digest ~ '^[0-9a-f]{64}$')
          AND (resulting_donation_fact_digest IS NULL OR
          resulting_donation_fact_digest ~ '^[0-9a-f]{64}$')
          AND receipt_digest ~ '^[0-9a-f]{64}$'
    mode: TEST_ONLY
    unique_event_scope: [deployment_id, environment, provider, merchant_account_hmac, provider_event_identity_hmac]
    signature_states: [VERIFIED, FAILED, NOT_SUPPORTED]
    fetch_states: [NOT_ATTEMPTED, FETCH_CONFIRMED, FETCH_NOT_FOUND]
    truth_rule: >-
      Webhook verification is only an authenticated routing hint. A resulting
      terminal attempt or donation requires FETCH_CONFIRMED and exact provider
      request, response, and object-identity digests. Raw body, headers, and
      signatures never persist.
    grants:
      gurine_public_projector: []
      owner_routine_only: all runtime direct relation privileges are revoked
    alter_statement_sha256:
      - 446c79cb444cc764f7ae8f0682f887113cef404c982d139d95eba70677cabc10
      - 6abfa58256e3c8c3926cf00040bbeb82bb779135747a9c6d10e9dfb8e8ae836d
      - 9e440a28dd4dc2e414102ba7d760782537b0be2af09a9d0b2212b4e2da9a4599

  ops.donation_facts:
    owner_role: gurine_migrator
    source_ddl: db/migrations/0041_r6e_monetization_runtime.sql#CREATE TABLE ops.donation_facts
    create_statement_sha256: 3dc29e697aa37eb503dc8f5cbcfacad036521206a4ec1cc61fd2e4429fdce309
    columns:
      id: {type: uuid, nullable: false}
      root_fact_id: {type: uuid, nullable: false}
      revision: {type: bigint, nullable: false}
      fact_effect: {type: text, nullable: false}
      supersedes_fact_id: {type: uuid, nullable: true}
      predecessor_fact_digest: {type: char(64), nullable: true}
      deployment_id: {type: uuid, nullable: false}
      payment_charge_attempt_id: {type: uuid, nullable: false}
      payment_charge_attempt_digest: {type: char(64), nullable: false}
      donor_hmac: {type: char(64), nullable: false}
      donor_hmac_key_version: {type: text, nullable: false}
      donor_group_hmac: {type: char(64), nullable: false}
      donor_group_hmac_key_version: {type: text, nullable: false}
      amount: {type: "numeric(24,6)", nullable: false}
      currency: {type: char(3), nullable: false}
      amount_basis: {type: ops.funding_amount_basis, nullable: false}
      funding_source_kind: {type: ops.funding_source_kind, nullable: false}
      investigation_exemption: {type: boolean, nullable: false, default: false}
      access_entitlement_granted: {type: boolean, nullable: false, default: false}
      provider_fetch_digest: {type: char(64), nullable: false}
      recognized_at: {type: timestamptz, nullable: false}
      fact_digest: {type: char(64), nullable: false}
      recorded_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: {name: donation_facts_pkey, columns: [id]}
    unique_constraints:
      - {name: donation_fact_root_revision_uq, columns: [root_fact_id, revision]}
      - {name: donation_fact_digest_uq, columns: [fact_digest]}
      - {name: donation_fact_reference_uq, columns: [id, fact_digest]}
      - {name: donation_fact_charge_revision_uq, columns: [payment_charge_attempt_id, revision]}
    foreign_keys:
      - {name: donation_fact_root_fk, columns: [root_fact_id], references: "ops.donation_facts(id)", on_delete: RESTRICT, deferrable: "INITIALLY DEFERRED"}
      - {name: donation_fact_supersedes_fk, columns: [supersedes_fact_id, predecessor_fact_digest], references: "ops.donation_facts(id,fact_digest)", on_delete: RESTRICT, match: FULL}
      - {name: donation_fact_charge_fk, columns: [payment_charge_attempt_id, payment_charge_attempt_digest], references: "ops.payment_charge_attempts(id,record_digest)", on_delete: RESTRICT}
    checks:
      - name: donation_fact_chain_ck
        expression: >-
          revision > 0 AND ((fact_effect = 'ORIGINAL' AND revision = 1
          AND root_fact_id = id AND supersedes_fact_id IS NULL
          AND predecessor_fact_digest IS NULL) OR
          (fact_effect IN ('REPLACEMENT','REVERSAL') AND revision > 1
          AND root_fact_id <> id AND supersedes_fact_id IS NOT NULL
          AND predecessor_fact_digest IS NOT NULL))
      - name: donation_fact_public_firewall_ck
        expression: >-
          amount > 0 AND currency ~ '^[A-Z]{3}$'
          AND funding_source_kind = 'DONATION'
          AND investigation_exemption = false
          AND access_entitlement_granted = false
      - name: donation_fact_digest_ck
        expression: >-
          (predecessor_fact_digest IS NULL OR
          predecessor_fact_digest ~ '^[0-9a-f]{64}$')
          AND payment_charge_attempt_digest ~ '^[0-9a-f]{64}$'
          AND donor_hmac ~ '^[0-9a-f]{64}$'
          AND donor_group_hmac ~ '^[0-9a-f]{64}$'
          AND provider_fetch_digest ~ '^[0-9a-f]{64}$'
          AND fact_digest ~ '^[0-9a-f]{64}$'
    chain: >-
      Append-only ORIGINAL, REPLACEMENT, or REVERSAL with an exact predecessor
      ID plus digest and at most one successor.
    payment_fence: [payment_charge_attempt_id, payment_charge_attempt_digest, provider_fetch_digest]
    firewall_checks:
      - funding_source_kind is DONATION
      - investigation_exemption is false
      - access_entitlement_granted is false
    projection_rule: >-
      Private donor and payment facts never publish directly. Only the current
      fetch-confirmed donation head may enter a candidate funding concentration
      snapshot, followed by independent FUNDING_DISCLOSURE review and the
      ordinary public projection gate.
    grants:
      gurine_public_projector: []
      owner_routine_only: all runtime direct relation privileges are revoked
    alter_statement_sha256:
      - 769191aa98ad28473d9f9c02546414e26809ec01fc80bbc76cba7ba1888d1e13
      - 459aa654c88c2c5dbda70f060998f547d60b0e73efc6369eeafb332aaf2a2d5c
      - f6273100f0b35c70b3e1a0e3c00dd8601b649ac0a1bf77f398a63b8043ba4f40
      - 94c59f72ca0dda1c6d748209b65243c3994589cc1a270b20c3fbbf76af67cc93

