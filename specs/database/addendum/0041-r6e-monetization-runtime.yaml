economics_import_runtime_contract:
  authority: supervisor_authority_decision_v1.ECO-AUTHORITY-V1
  action_kind: ECONOMICS_IMPORT
  target_type: ECONOMICS_IMPORT
  capability: economics.import
  typed_detail_relation: ops.action_approval_economics_import_details
  target_version_contract:
    wire_path: draft.target.expectedVersion
    exact_value: null
    storage_rule: >-
      action_proposals target version and ApprovalBinding target version are
      nullable only when the authoritative action kind is ECONOMICS_IMPORT.
      Every other action kind retains its positive-version invariant.
    forbidden_substitutions:
      - positive integer 1 sentinel
      - zero sentinel
      - inferred target version
      - nullable target version for another action kind
  action_detail_kind_additive_merge:
    historical_owner: specs/database/addendum/0026-agent-action-approval.yaml
    historical_kinds_in_order:
      - HYPOTHESIS
      - CLAIM
      - TASK
      - COMPARABLE
      - COMMUNICATION
      - PUBLICATION
      - RETRACTION
      - RULE_ACTIVATION
      - ROLE_GRANT
      - KILL_SWITCH
      - COMMUNICATION_AUTHORIZATION
      - ASSET_RIGHTS_DECISION
      - RETENTION_SCHEDULE
      - FUNDING_DISCLOSURE
      - CAPABILITY_ACTIVATION
      - RESPONSE_POLICY_CALENDAR
      - COMMERCIAL_CONTROL
      - PROVIDER_CONTROL
    additive_kind: ECONOMICS_IMPORT
    additive_relation: ops.action_approval_economics_import_details
    resulting_count_exactly: 19
    rule: >-
      Historical 0026 bytes and its eighteen mappings remain unchanged. 0041
      adds exactly one closed kind-to-detail mapping; an ECONOMICS_IMPORT
      proposal must have exactly one matching detail row and zero rows in all
      eighteen historical detail relations.
  wire_discriminator: draft.operation.operationId
  database_discriminator: operation_value.import_kind
  import_kind_count_exactly: 11
  variants_in_order:
    - operation_id: recordCommercialQualification
      target_relations: [ops.acquisition_source_receipts, ops.commercial_qualification_receipts]
      atomic_cardinality: optional zero-or-one acquisition source plus exactly one qualification receipt
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    - operation_id: importCostAllocationClose
      target_relations: [ops.fx_rate_facts, ops.cost_allocations]
      atomic_cardinality: zero-or-more inline FX facts plus one period head and one-or-more allocation lines
      allowed_result_effects: [RECORDED, REPLACED]
    - operation_id: createTariffVersion
      target_relations: [ops.tariff_versions]
      atomic_cardinality: exactly one tariff version
      allowed_result_effects: [RECORDED]
    - operation_id: recordCommercialContractPeriod
      target_relations: [ops.commercial_contract_periods, ops.offer_profile_capabilities]
      atomic_cardinality: exactly one contract period plus exactly twelve ordered offer-capability rows
      allowed_result_effects: [RECORDED, REPLACED]
      native_capability_insert_count_exactly: 12
      offer_parent_schema_version:
        canonical_type: CommercialContractOfferParentV1
        json_type: number
        exact_value: 1
        caller_selectable: false
        offer_capability_schema_version_field: absent
      apply_receipt:
        result_count_exactly: 3
        logical_result_rows_exactly:
          commercial_contract_period:
            resource_kind: COMMERCIAL_CONTRACT_PERIOD
            identity: persisted contract period ID and version
            digest: database-derived contract record digest
          offer_profile_capability_set:
            resource_kind: OFFER_PROFILE_CAPABILITY
            identity: persisted offer_profile_id and offer_profile_version
            digest: database-recomputed offer_capability_set_digest
          audit_event:
            resource_kind: ECONOMICS_IMPORT_AUDIT_EVENT
            identity: persisted economics import audit event ID
            digest: database-derived audit payload digest
        forbidden_result_identities:
          - synthetic capability UUID
          - one result row per capability insert
          - twelve duplicate capability result keys
        rule: >-
          The twelve native capability inserts remain one atomic relation write
          set. Their receipt identity is one logical capability-set row, so the
          contract row, capability-set row, and audit row produce result_count
          three without changing target atomic cardinality.
    - operation_id: recordUsageWindow
      target_relations: [ops.usage_window_receipts, ops.usage_facts]
      atomic_cardinality: exactly one paired usage-window receipt and usage fact
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    - operation_id: recordInvoice
      target_relations: [ops.discount_decisions, ops.invoice_facts, ops.invoice_line_facts, ops.invoice_usage_memberships]
      atomic_cardinality: zero-or-more discounts, exactly one invoice, one-or-more lines, and complete expected usage memberships
      allowed_result_effects: [RECORDED, REPLACED]
    - operation_id: recordRevenue
      target_relations: [ops.revenue_facts]
      atomic_cardinality: one-or-more revenue facts fenced to persisted invoice-line ID and digest
      allowed_result_effects: [RECORDED]
    - operation_id: recordAccountingCorrection
      target_relations: [ops.accounting_corrections]
      atomic_cardinality: one-or-more append-only corrections
      allowed_result_effects: [RECORDED, REVERSED]
    - operation_id: recordCashApplication
      target_relations: [ops.cash_application_facts]
      atomic_cardinality: one-or-more signed imported facts
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    - operation_id: recordTaxInvoiceIssuance
      target_relations: [ops.tax_invoice_issuance_receipts]
      atomic_cardinality: one-or-more signed imported receipts
      allowed_result_effects: [RECORDED, REPLACED, REVERSED]
    - operation_id: recordCollectionFailure
      target_relations: [ops.tasks]
      atomic_cardinality: exactly one operator review task and no economics, entitlement, or public-access mutation
      allowed_result_effects: [REVIEW_TASK_CREATED]
  detail_closure:
    - >-
      The outer operation has exactly one non-null branch and contains no
      relation name, dynamic SQL target, arbitrary JSON map, caller-supplied
      audit identity, approval identity, execution identity, row digest, or
      governance state.
    - >-
      Source evidence is always an exact evidence-segment ID plus stored digest.
      PostgreSQL locks raw.evidence_segments, proves sorted set equality with
      the proposal rationale evidence IDs, compiles the closed target, and
      derives canonical bytes and every detail, operation, row, set, audit,
      receipt, and response digest.
    - >-
      Caller-supplied price, amount, external acknowledgement, or accounting
      state is accepted only when present in the exact signed typed evidence.
      Missing evidence remains UNKNOWN or rejects before writes.
  approved_operation_identity_contract:
    authority_location: immutable approved operation bytes
    caller_approved_identity_classes_exactly:
      - every new, root, and successor usage-window receipt ID
      - every new, root, and successor usage-fact ID
      - every invoice header ID
      - every invoice line ID
      - every invoice usage-membership ID
      - every revenue-fact ID
      - every cash-application ID
      - every tax-invoice issuance-receipt ID
      - every accounting-correction ID
    database_generated_hidden_identity: forbidden
    replay_rule: >-
      The approved identities participate in operation bytes, detail and receipt
      digests, idempotency, predecessor fences, and exact replay. PostgreSQL may
      not repair a missing identity with a random value.
  invoice_adjustment_graph:
    allowed_reference: >-
      An adjustment line may reference only an earlier non-adjustment line in
      the same ordered approved invoice array.
    rejected_references_exactly:
      - cross-invoice
      - adjustment-to-adjustment
      - cyclic
      - forward
      - missing
    rejection_effect: transaction delta zero
  economics_digest_abi:
    name: GURINE_LENGTH_PREFIXED_UTF8_V1
    authority_level: APPROVED_HIGH_LEVEL
    applies_to_exactly:
      - economics
      - usage
      - invoice
      - revenue
      - cash
      - tax-invoice
      - accounting-correction
    hash: SHA-256
    frame_length: unsigned u64 big-endian byte length
    separately_framed_components_in_order:
      - domain
      - schema version
      - type tag
      - value
    scalar_and_collection_rules:
      - NULL is explicit and never omitted or conflated with an empty value.
      - Arrays carry an explicit member count and preserve the declared order.
      - Decimal values use fixed-six representation.
      - UUID and SHA-256 text is lowercase.
      - Timestamps are UTC with exactly six fractional digits.
    field_order_rule: >-
      Preserve every exact field order already declared by the active 0029
      database contracts. Where 0029 declares a record but omits a digest
      preimage, the approved inclusion set is every immutable business column
      except the self digest and created_at or updated_at; the exact order remains
      part of canonical_authority_gate and cannot be inferred from catalog order.
    verification_required_exactly:
      - PostgreSQL golden vectors
      - Rust golden vectors
      - cross-language byte equality
      - one-byte mutation rejection
    funding_digest_use: forbidden
    canonical_authority_gate:
      status: OPEN_QUESTION_FAIL_CLOSED
      open_question_id: R6E-ECO-WIRE-DIGEST-CANONICAL-AUTHORITY
      unresolved_exact_inputs_in_order:
        - exact closed wire field inventory for every affected import variant
        - exact domain and schema-version value for every affected digest
        - exact type-tag vocabulary and bytes
        - exact NULL and array-member byte grammar beyond the approved high-level rules
        - exact field order for every 0029 record whose active contract omits one
        - byte-exact PostgreSQL and Rust golden vectors
      fail_closed_choice: >-
        No affected branch becomes callable from the high-level ABI name alone.
        Before any protected write, the branch remains excluded or uses its
        existing internal fail-closed latch with transaction delta zero. This
        addendum invents no database message, external error, tag literal,
        domain literal, field order, or golden value.
  governance:
    proposer_capabilities_exactly: [actions.propose, budgets.manage]
    reviewer_capabilities_exactly: [actions.review, budgets.manage]
    assurance: STEP_UP
    separation_of_duty: >-
      The proposer actor differs from every counted approving actor and is in
      every counted review assignment exclusion set. Capability and STEP_UP
      authority are revalidated at draft, submit, decision, claim, and execute.
    ordered_path:
      - ActionProposal plus immutable economics detail
      - independent counted ActionDecision
      - exact ExecutionAuthorization
      - private.ExecuteEconomicsImport
    logical_executor: workflow-worker.economics-import-executor
    database_principal: gurine_economics_importer
    claim_dispositions_exactly:
      - EXECUTE
      - REPLAY
      - VERSION_CONFLICT
      - FENCE_STALE
      - EXPIRED
      - IN_PROGRESS
      - IDEMPOTENCY_CONFLICT
    transaction_rule: >-
      Claim, all branch-specific database writes, audit, immutable execution
      receipt, authorization/effect completion, inbox completion, and job
      terminalization are one SERIALIZABLE transaction. SQLSTATE 40001 is only
      PostgreSQL serialization retry and never a semantic disposition.
  tariff_stage_rule:
    ordinary_rule: >-
      Outside the exact first-tariff bootstrap, the caller does not select stage.
      PostgreSQL resolves the current commercial_stage_target_contract and
      rejects absent, stale, ambiguous, or digest-mismatched stage authority.
    first_tariff_bootstrap:
      cardinality: one-shot
      stage: PILOT
      required_variable_gross_margin_basis_points: 6000
      scope_key: [deployment_id, sku]
      prerequisites_ordered_exactly:
        - tariff history count is zero for the same deployment and SKU
        - commercial-contract history count is zero for the same deployment and SKU
        - current GENERAL_AVAILABILITY READY count is zero
        - one approved complete current eligible digest-equal cost close is locked
        - the approved detail binds the intended first contract and qualification tuple
        - the approved detail binds both tariff and intended contract validity periods
      consumption_rule: >-
        The subsequent first recordCommercialContractPeriod import must match the
        approved bootstrap contract, qualification, deployment, SKU, tariff, and
        both validity-period bindings exactly. A mismatch fails before write and
        does not preserve authority for another tuple.
      forbidden_inferences:
        - date
        - price
        - projected margin
        - caller or operator assertion
        - route
        - tariff label
        - existing non-current or reversed row
    low_margin_tariff_discount_branch:
      authority_status: UNAVAILABLE_PENDING_SEPARATE_OVERSIGHT_AUTHORITY
      applies_to: [tariff, discount]
      sqlstate: "55000"
      transaction_delta_exactly: 0
      callable_success_path: false
      rule: >-
        감독자 결정 v1 deliberately does not open any low-margin exception.
        Approval, fixture data, elapsed time, or the PILOT bootstrap cannot bypass
        the ordinary margin CHECK or create an oversight decision.
  cost_close_bootstrap:
    - >-
      The first close accepts only manually supplied signed typed cost evidence.
      Estimates, inferred zero, UNKNOWN coercion, or dummy digest are forbidden.
    - >-
      PostgreSQL derives the complete period and line membership, FX and
      correction membership, expected and captured counts, coverage ratios,
      totals, allocation set, row, close, and receipt digests from locked input.
    - >-
      createTariffVersion requires the exact current closed, complete, eligible,
      digest-equal cost head. An absent, partial, UNKNOWN, unclosed, stale, or
      superseded cost close cannot create a tariff.
    - >-
      A deterministic test fixture is allowed only with authority TEST_FIXTURE
      in an ephemeral database and proves executable procedure only, never a
      production price, margin, cost, or readiness claim.

