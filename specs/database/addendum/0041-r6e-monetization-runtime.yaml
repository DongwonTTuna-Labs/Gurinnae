cash_tax_and_dunning_contract:
  cash_source_kinds_exactly:
    - BANK_TRANSFER
    - PG_SETTLEMENT
  cash_import_rule: >-
    Both source kinds require signed typed external evidence and exact invoice
    ID, version, record-digest, and reconciliation-digest fences. PG_SETTLEMENT
    is an accounting import only and never initiates, captures, fetches, or
    settles a provider payment. Donation evidence cannot apply to a commercial
    invoice.
  tax_import_rule: >-
    Confirmed issuance or cancellation requires signed external acknowledgement,
    exact invoice fence, approval-number HMAC, key version, ASP-reference HMAC,
    and ASP receipt digest. Missing authority remains UNKNOWN. No live ASP call
    is made.
  collection_failure_authorities_exactly:
    - PROVIDER_FETCH_CONFIRMED
    - BANK_RETURN_CONFIRMED
  dunning_rule: >-
    Exactly one authority may create one operator-visible review task and one
    notification receipt. A missing cash application, elapsed time, initial
    provider response, webhook hint, or inferred overdue state is not failure
    authority. Dunning changes no contract, capability, entitlement, invoice,
    revenue, publication, investigation priority, or public access.
  contract_change_rule: >-
    Suspension, ending, or cancellation requires a distinct human-approved
    recordCommercialContractPeriod REPLACEMENT fenced to the exact predecessor.
    Dunning never invokes that operation automatically.

donation_payment_runtime_contract:
  authority: supervisor_authority_decision_v1.PAYMENT-TEST-V1
  runtime_modes: {default: DISABLED, allowed_exactly: [DISABLED, TEST_ONLY], production: DISABLED_AND_UNAVAILABLE}
  source_live_credentials_exactly: 0
  mandatory_mode_negative_tests:
    - omitted mode is DISABLED
    - production mode is DISABLED and cannot be enabled
    - TEST_ONLY is the sole non-disabled mode
    - source contains no default key, fallback secret, or live credential
  provider_interface:
    name: PaymentProvider
    methods_exactly: [capabilities, issue_billing_key, charge, refund, verify_webhook, fetch_payment]
    scheduling: MERCHANT_SCHEDULED
    adapters_exactly:
      - TOSS_PAYMENTS_TEST_FIXTURE
      - KAKAO_PAY_TEST_FIXTURE
      - STRIPE_TEST_FIXTURE
  database_roles:
    owner: gurine_migrator
    service: gurine_billing_gateway
    economics_service_separation: >-
      gurine_billing_gateway has no economics-import capability, economics
      relation privilege, economics importer entry-routine EXECUTE, or reusable
      gurine_economics_importer credential.
  webhook_truth_rule: >-
    Receipt first records authenticated TEST fixture delivery identity and
    verification result. verify_webhook is a hint; fetch_payment is truth. Only
    an authoritative fetched terminal result may append a terminal charge
    observation and donation fact. Duplicate provider event identity replays the
    same receipt and changed delivery/request digests conflict without resubmit.
  idempotency_rule: >-
    Persist request digest and provider-idempotency-key HMAC before an attempt.
    Same logical identity and request returns the stored result; changed input
    conflicts; ambiguous send requires authoritative fetch reconciliation and
    never automatic resubmission.
  scheduler_authority_gate:
    status: AUTHORITY_RESOLVED_IMPLEMENTATION_PENDING_FAIL_CLOSED
    resolved_authority_id: R6E-DONATION-SCHEDULER-AUTHORITY
    routine_identity: ops.enqueue_due_r6e_donation_charge_jobs_v1
    installed: false
    callable: false
    final_routine_matrix_member: false
    approved_policy:
      schedule_kind: MONTHLY
      first_charge_at_required: true
      anchor: first_charge_at in UTC
      month_end_clamp: >-
        Non-drifting: derive each month from the original UTC anchor and clamp
        only that month's day to its last day; never use a previously clamped
        occurrence as the next anchor.
      eligible_window: current UTC month only
      catch_up: forbidden
      backcharge: forbidden
      occurrence_identity_exactly: [schedule_id, schedule_version, scheduledFor]
      occurrence_uniqueness: permanent
      same_occurrence_resubmission_writes: 0
      later_month_blockers_exactly:
        - pending
        - accepted
        - reconciliation_required
      next_month_release_authorities_exactly:
        - definitive_pre_dispatch_rejection
        - fetch_confirmed_success
        - fetch_confirmed_refund
        - fetch_confirmed_failure
      scheduler_effect_exactly: insert one DONATION_CHARGE job
      direct_effects_forbidden_exactly:
        - payment
        - contract
        - entitlement
        - public access
      request_limit_inclusive: {minimum: 1, maximum: 500}
    fail_closed_rule: >-
      The schedule authority is resolved, but the named routine remains absent,
      uncallable, and outside every FINAL matrix until the closed occurrence
      calculation, status matrix, owner ACL, concurrency fence, and mutation
      tests are implemented. No current worker may enqueue or backcharge by
      inferring the approved policy from prose.
  test_fixture_key_authority:
    keyrings_ordered_exactly:
      - name: PAYMENT_FIXTURE_IDENTITY_HMAC_KEY
        key_slots_exactly: [CURRENT, PREVIOUS]
        each_slot_requires_opaque_version: true
      - name: PAYMENT_FIXTURE_BILLING_KEY_VAULT_HMAC_KEY
        key_slots_exactly: [CURRENT, PREVIOUS]
        each_slot_requires_opaque_version: true
    issuance_rule: only CURRENT may issue a new identity or vault HMAC
    verification_rule: >-
      A persisted opaque key version selects the exact CURRENT or PREVIOUS key;
      missing, unknown, duplicated, or mismatched versions fail closed.
    forbidden_reuse_or_derivation:
      - webhook assertion key
      - public-web key
      - actor or service assertion key
      - either other payment fixture keyring
    restart_rule: >-
      Missing in-memory billing material after restart is never recovered from a
      persisted HMAC, silently replaced, reissued, resubmitted, or recharged.
      The exact operation fails closed and changes no ledger or access state.
  secret_boundary: >-
    Raw billing keys, authorization tokens, webhook bodies and signatures,
    provider-customer identity, payment-method secrets, and replayable provider
    payloads are forbidden from PostgreSQL, logs, errors, Debug, audit, events,
    and exported evidence. Only versioned opaque fixture references, HMACs, and
    non-replayable digests persist. Payment fixture keys are TEST_ONLY in-memory
    inputs; default and production configurations contain none.
  public_firewall: >-
    Donation success, failure, cancellation, refund, fixture-adapter state, or
    provider outage grants no access and changes no free-public member. Public
    donor disclosure occurs only after independent funding governance.
  exact_public_copy: 후원은 접근권이 아니며 조사 대상 면제가 아닙니다
  existing_funding_disclosure_policy: >-
    Existing donor-name, amount-band, and concentration-band rules remain
    unchanged. A payment or donation fact does not bypass their independent
    funding governance or UNKNOWN handling.
  failure_and_refetch_negative_invariant: >-
    A payment failure, provider-fetch mismatch, RECONCILIATION_REQUIRED state,
    missing post-restart material, or provider outage automatically changes no
    entitlement, commercial contract, or public access. Negative tests are
    mandatory before any TEST_ONLY path is callable.

