event_registry_contract:
  statement: >-
    One exact two-row R6e-owned upsert plus four exact historical
    forward-override declarations; no marker block, partial jsonb_set, or third
    R6e-owned event.
  schema_equivalence_rule: >-
    Every named source JSON and embedded payload_schema is structurally
    identical, including the canonical draft-2020-12 $schema and event-specific
    $id. UUID properties use the active lowercase RFC 4122 regex shape; a
    format: uuid substitution, metadata omission, or validator weakening is
    forbidden.
  exact_upsert_count: 2
  historical_event_forward_override_count: 4
  owned_events_in_order:
    - event_type: donation.fact_recorded.v1
      category: DOMAIN
      schema_version: 1
      payload_schema_uri: payloads/donation_fact_recorded_v1.schema.json
      payload_schema_path: specs/events/payloads/donation_fact_recorded_v1.schema.json
      payload_schema_sha256: PENDING_PAYLOAD_SCHEMA_FILE
      embedded_json_equivalent: true
      fields_exactly:
        - donationFactId
        - donationFactDigest
        - chargeAttemptId
        - chargeAttemptDigest
        - providerFetchDigest
        - occurredAt
    - event_type: notification.payment_review_requested.v1
      category: DOMAIN
      schema_version: 1
      payload_schema_uri: payloads/notification_payment_review_requested_v1.schema.json
      payload_schema_path: specs/events/payloads/notification_payment_review_requested_v1.schema.json
      payload_schema_sha256: PENDING_PAYLOAD_SCHEMA_FILE
      embedded_json_equivalent: true
      fields_exactly:
        - reviewTaskId
        - reviewTaskVersion
        - reviewTaskDigest
        - sourceKind
        - sourceReceiptId
        - sourceReceiptDigest
        - occurredAt
