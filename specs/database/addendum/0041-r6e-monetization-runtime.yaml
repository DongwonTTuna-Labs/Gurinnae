tables:
  ops.action_approval_economics_import_details:
    owner_role: gurine_migrator
    source_ddl: db/migrations/0041_r6e_monetization_runtime.sql#CREATE TABLE ops.action_approval_economics_import_details
    create_statement_sha256: 2f25e7e76a581cb0b02c4bb93e855cbaf6ca138bedcb0d951d4fe0cbaa258c6c
    owning_component: services/control-api::action_approval
    owning_domain: gurine_domain::action::EconomicsImportApprovalDetail
    detail_kind: ECONOMICS_IMPORT
    validator: ops.economics_import_operation_v1_is_valid(ops.economics_import_operation_v1)
    source_binding_contract: >-
      Proposal rationale evidenceSegmentIds are set-equal to locked
      raw.evidence_segments IDs. Wire sourceEvidenceDigests is a distinct sorted
      compiler input only: the database compares it with the distinct digest set
      resolved from those locked rows and then discards it. Persisted
      source_evidence_segment_ids and source_evidence_digests are database-derived
      parallel ID-sorted pairs; IDs are unique while positional digests may
      repeat and therefore have equal cardinality. source_evidence_set_digest
      binds the derived pairs. There is no stored public-set column.
    columns:
      proposal_id: {type: uuid, nullable: false}
      proposal_version: {type: bigint, nullable: false}
      detail_kind: {type: text, nullable: false}
      detail_binding_canonical: {type: bytea, nullable: false}
      action_detail_digest: {type: char(64), nullable: false}
      approval_digest: {type: char(64), nullable: false}
      content_digest: {type: char(64), nullable: false}
      operation_id: {type: text, nullable: false}
      operation_value: {type: ops.economics_import_operation_v1, nullable: false}
      operation_canonical: {type: bytea, nullable: false}
      operation_digest: {type: char(64), nullable: false}
      source_evidence_segment_ids: {type: "uuid[]", nullable: false}
      source_evidence_digests: {type: "char(64)[]", nullable: false}
      source_evidence_set_digest: {type: char(64), nullable: false}
      import_policy_digest: {type: char(64), nullable: false}
      as_of: {type: timestamptz, nullable: false}
      creator_actor_id: {type: uuid, nullable: false}
      proposer_capability_set_digest: {type: char(64), nullable: false}
      reviewer_capability_set_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    column_order:
      - proposal_id
      - proposal_version
      - detail_kind
      - detail_binding_canonical
      - action_detail_digest
      - approval_digest
      - content_digest
      - operation_id
      - operation_value
      - operation_canonical
      - operation_digest
      - source_evidence_segment_ids
      - source_evidence_digests
      - source_evidence_set_digest
      - import_policy_digest
      - as_of
      - creator_actor_id
      - proposer_capability_set_digest
      - reviewer_capability_set_digest
      - created_at
    primary_key:
      name: action_approval_economics_import_details_pk
      columns: [proposal_id, proposal_version]
    unique_constraints:
      - name: action_approval_economics_import_details_binding_uq
        columns: [proposal_id, proposal_version, detail_kind, action_detail_digest]
      - name: action_approval_economics_import_details_approval_uq
        columns: [proposal_id, proposal_version, approval_digest, operation_digest]
    foreign_keys:
      - name: action_approval_economics_import_details_creator_actor_id_fkey
        columns: [creator_actor_id]
        references: ops.users(id)
        on_delete: RESTRICT
      - name: action_approval_economics_import_details_version_fk
        columns: [proposal_id, proposal_version, detail_kind, action_detail_digest]
        references: ops.action_proposal_versions(proposal_id,version,action_detail_kind,action_detail_digest)
        on_delete: RESTRICT
        deferrable: INITIALLY DEFERRED
      - name: action_approval_economics_import_details_approval_fk
        columns: [proposal_id, proposal_version, approval_digest]
        references: ops.action_proposal_versions(proposal_id,version,approval_digest)
        on_delete: RESTRICT
        deferrable: INITIALLY DEFERRED
    checks:
      - name: action_approval_economics_import_details_kind_ck
        expression: detail_kind = 'ECONOMICS_IMPORT'
      - name: action_approval_economics_import_details_operation_ck
        expression: >-
          operation_id IN ('recordCommercialQualification',
          'importCostAllocationClose','createTariffVersion',
          'recordCommercialContractPeriod','recordUsageWindow','recordInvoice',
          'recordRevenue','recordAccountingCorrection','recordCashApplication',
          'recordTaxInvoiceIssuance','recordCollectionFailure')
      - name: action_approval_economics_import_details_digest_ck
        expression: >-
          action_detail_digest ~ '^[0-9a-f]{64}$'
          AND approval_digest ~ '^[0-9a-f]{64}$'
          AND content_digest ~ '^[0-9a-f]{64}$'
          AND operation_digest ~ '^[0-9a-f]{64}$'
          AND source_evidence_set_digest ~ '^[0-9a-f]{64}$'
          AND import_policy_digest ~ '^[0-9a-f]{64}$'
          AND proposer_capability_set_digest ~ '^[0-9a-f]{64}$'
          AND reviewer_capability_set_digest ~ '^[0-9a-f]{64}$'
      - name: action_approval_economics_import_details_evidence_ck
        expression: >-
          cardinality(source_evidence_segment_ids) =
          cardinality(source_evidence_digests)
          AND cardinality(source_evidence_segment_ids) BETWEEN 1 AND 1000
          AND ops.economics_uuid_array_is_sorted_unique_v1(
          source_evidence_segment_ids)
          AND ops.sha256_text_array_is_valid_v1(
          source_evidence_digests::text[])
      - name: action_approval_economics_import_details_canonical_ck
        expression: >-
          octet_length(detail_binding_canonical) > 0
          AND ops.economics_import_operation_v1_is_valid(operation_value) IS TRUE
          AND (operation_value).import_kind = operation_id
          AND operation_canonical = ops.canonical_jsonb_v1(to_jsonb(operation_value))
          AND operation_digest = encode(
          extensions.digest(operation_canonical,'sha256'),'hex')
    immutable_binding: >-
      detail_kind is ECONOMICS_IMPORT; operation_id equals the closed composite
      discriminator; exactly one of eleven branches is non-null. Evidence IDs
      are sorted and unique; each parallel digest is non-null lowercase SHA-256
      and may repeat; the cardinality-equal ID and digest pairs exactly match
      locked raw evidence. Before insertion, the compiler proves that the
      discarded wire sourceEvidenceDigests distinct set equals the distinct set
      derived from these pairs. All stored canonical bytes and digests are
      database-derived.
    grants:
      freeze_status: FINAL
      execution_reader_privileges: {}
      runtime_direct_table_dml_grants_exactly: []
      outer_routine:
        signature: ops.execute_action_approval_v1(text,jsonb,uuid) RETURNS jsonb
        owner_role: gurine_migrator
        execute_roles: [gurine_control_api]
      internal_materializer_routine:
        signature: ops.execute_economics_action_approval_v1(p_operation text,p_request jsonb,p_actor uuid) RETURNS jsonb
        owner_role: gurine_migrator
        execute_roles: []
      rule: >-
        The table remains owned by gurine_migrator and every LOGIN/runtime
        principal has zero direct table DML. Only the existing migrator-owned
        outer action routine is executable by control-api; its internal
        migrator-owned economics compiler has no PUBLIC/runtime EXECUTE.
        The inert economics-writer receives no privilege. Claim, complete, and
        fail execute as exact economics-importer sessions through
        migrator-owned SECURITY DEFINER entry routines.
    alter_statement_sha256:
      - 6c0dda23f2131b3229d76251fe733fae6e4d2b87ac5751ba41e20c9b530b943d

  ops.cash_application_facts:
    owner_role: gurine_migrator
    source_ddl: db/migrations/0041_r6e_monetization_runtime.sql#CREATE TABLE ops.cash_application_facts
    create_statement_sha256: 02eb11c878afc5953eed8f76c48627b139991f97a3dd57be60b55a9361b8a1b7
    columns:
      id: {type: uuid, nullable: false}
      root_fact_id: {type: uuid, nullable: false}
      revision: {type: bigint, nullable: false}
      fact_effect: {type: text, nullable: false}
      supersedes_fact_id: {type: uuid, nullable: true}
      predecessor_fact_digest: {type: char(64), nullable: true}
      invoice_fact_id: {type: uuid, nullable: false}
      invoice_fact_digest: {type: char(64), nullable: false}
      invoice_reconciliation_digest: {type: char(64), nullable: false}
      source_kind: {type: text, nullable: false}
      source_system_id: {type: text, nullable: false}
      source_settlement_identity_hmac: {type: char(64), nullable: false}
      source_settlement_hmac_key_version: {type: text, nullable: false}
      source_settlement_amount: {type: "numeric(24,6)", nullable: false}
      applied_amount: {type: "numeric(24,6)", nullable: false}
      currency: {type: char(3), nullable: false}
      source_record_digest: {type: char(64), nullable: false}
      source_signature_digest: {type: char(64), nullable: false}
      import_receipt_digest: {type: char(64), nullable: false}
      applied_at: {type: timestamptz, nullable: false}
      fact_digest: {type: char(64), nullable: false}
      recorded_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    column_order:
      - id
      - root_fact_id
      - revision
      - fact_effect
      - supersedes_fact_id
      - predecessor_fact_digest
      - invoice_fact_id
      - invoice_fact_digest
      - invoice_reconciliation_digest
      - source_kind
      - source_system_id
      - source_settlement_identity_hmac
      - source_settlement_hmac_key_version
      - source_settlement_amount
      - applied_amount
      - currency
      - source_record_digest
      - source_signature_digest
      - import_receipt_digest
      - applied_at
