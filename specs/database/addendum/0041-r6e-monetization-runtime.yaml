paid_evidence_packet_digest_authority_gate:
  status: HIGH_LEVEL_AUTHORITY_APPROVED_CANONICAL_PHYSICAL_OPEN_FAIL_CLOSED
  open_question_id: R6E-PAID-V2-PHYSICAL-PROOF-CANONICAL-AUTHORITY
  authority: supervisor_authority_decision_v1.PAID-EVIDENCE-V2-AUTHORITY
  installed_materializer:
    signature: ops.materialize_paid_evidence_packet_subject_v1(ops.paid_evidence_packet_subject_input_v1,text) RETURNS ops.economics_mutation_receipt_v1
    owner_role: gurine_migrator
    availability: PRE_WRITE_FAIL_CLOSED
    error_sqlstate: "55000"
    error_code: PAID_PACKET_DIGEST_AUTHORITY_UNAVAILABLE
    transaction_delta_exactly: 0
    non_owner_execute_roles_exactly: []
    public_execute: false
    runtime_type_usage_roles_exactly: []
    denied_runtime_roles_in_order:
      - gurine_economics_importer
      - gurine_billing_gateway
      - gurine_control_api
      - gurine_workflow_worker
      - gurine_analysis_worker
      - gurine_public_projector
      - gurine_public_api
      - gurine_submission_api
      - gurine_ingest_worker
      - gurine_notification_worker
      - gurine_scheduler
      - gurine_document_extractor
      - gurine_identity_api
      - gurine_auditor
  version_contract:
    v1_preservation: >-
      Every active 0029 V1 byte contract and paid packet, member, and outcome
      relation remains unchanged and is never reinterpreted as V2.
    v2_additive_only: true
    migration_existing_row_fence: >-
      If any paid packet row, paid packet member row, or paid-bound outcome row
      exists, the migration aborts before its first schema effect. Backfill,
      conversion, mixed-version interpretation, and inferred bytes are forbidden.
  approved_v2_digest_dag:
    member_leaf_rule: >-
      Each V2 member leaf excludes the global memberSetDigest from its preimage
      and carries its category-local digest under the exact field name
      categoryDigest.
    dependency_order_exactly:
      - all V2 member leaf digests in member ordinal order
      - one global member-set digest over the complete ordered leaves
      - the V2 packet digest that binds that global member-set digest
    no_cycle_oracle: rejects every repeated digest dependency
    caller_authored_digest: forbidden
    incomplete_membership: rejected before write
  canonical_physical_authority_gate:
    status: OPEN_QUESTION_FAIL_CLOSED
    unresolved_exact_inputs_in_order:
      - exact V2 composite, relation, and function identities
      - exact V2 member, category, set, packet, receipt, and outcome field inventories
      - exact domain, schema-version, preimage order, and canonical byte grammar
      - exact categoryDigest membership and packet dependency edges
      - byte-exact PostgreSQL and Rust golden vectors and one-byte mutations
      - exact migration ordering around the existing-row abort and reciprocal FKs
    rule: >-
      The approved leaf to ordered-set to packet DAG is binding high-level
      authority, but no physical ABI or digest byte sequence may be inferred from
      it. The installed V1-named materializer remains unavailable with its exact
      55000/write-zero behavior.
  review_snapshot_forward_fix:
    active_0028_declared_addition_count_exactly: 16
    physical_pre_0041_declared_additions_present_exactly: 0
    current_nonfinal_0041_columns_in_order:
      - {name: member_set_digest, type: char(64), nullable: true}
      - {name: paid_evidence_member_manifest, type: jsonb, nullable: true}
      - {name: paid_evidence_member_manifest_canonical, type: bytea, nullable: true}
      - {name: paid_evidence_member_manifest_digest, type: char(64), nullable: true}
    current_nonfinal_0041_count_exactly: 4
    approved_remaining_v2_columns_in_order:
      - {name: snapshot_format_version, type: text, nullable: true}
      - {name: snapshot_payload_bytes, type: bytea, nullable: true}
      - {name: snapshot_byte_length, type: bigint, nullable: true}
      - {name: member_manifest, type: jsonb, nullable: true}
      - {name: member_count, type: bigint, nullable: true}
      - {name: source_family_count, type: integer, nullable: true}
      - {name: official_outcome_count, type: integer, nullable: true}
      - {name: counter_evidence_count, type: integer, nullable: true}
      - {name: copy_safety_set_digest, type: char(64), nullable: true}
      - {name: epistemic_set_digest, type: char(64), nullable: true}
      - {name: entity_resolution_set_digest, type: char(64), nullable: true}
      - {name: ai_provenance_set_digest, type: char(64), nullable: true}
    approved_remaining_v2_count_exactly: 12
    final_declared_addition_count_exactly: 16
    general_snapshot_presence_rule: >-
      member_set_digest plus the approved remaining twelve fields are zero-or-all
      for a forward-upgraded snapshot.
    paid_manifest_presence_rule: >-
      paid_evidence_member_manifest, its canonical bytes, and its digest are a
      separate zero-or-all tuple and may be present only on a complete upgraded
      snapshot that is paid-eligible under the active 0028 contract.
    legacy_presence_rule: all sixteen fields may remain null; partial tuples are rejected
    backfill: forbidden
    catalog_status: APPROVED_DELTA_IMPLEMENTATION_PENDING
    scope_rule: >-
      The current four-column snapshot is only a non-final partial implementation.
      It does not restore the approved remaining twelve fields, satisfy the final
      zero-or-all rule, prove the V2 leaf DAG, or make the materializer callable.
  reciprocal_outcome_packet_fks:
    packet_to_outcome:
      name: paid_packet_outcome_fk
      match: FULL
      deferrable: true
      initially: DEFERRED
      current_physical_gap: the preserved 0029 FK is non-deferrable
    outcome_to_packet:
      name: outcome_facts_paid_packet_fk
      match: FULL
      deferrable: true
      initially: DEFERRED
      current_physical_gap: absent from the preserved 0029 migration
    atomic_rule: >-
      Both reciprocal composite keys are deferred in the same transaction; a
      partially null tuple or weakening either direction is forbidden.
  ownership_rule: >-
    The installed materializer may appear in the parsed owner-routine inventory
    only with zero non-owner EXECUTE and an unavailable logical producer until
    the approved V2 relation/type/function/FK delta and every digest vector are
    implemented. Authority approval alone is not a runtime writer or acceptance
    claim.

