    runtime_execute_roles: []
  projector:
    signature: public.project_funding_disclosure_revision_v2(public.funding_disclosure_projection_v2) RETURNS public.projection_mutation_receipt_v2
    installation_status: INSTALLED_BUT_UNAVAILABLE
    availability_gate: funding_projection_digest_abi_gate
    failure_sqlstate: "55000"
    failure_code: FUNDING_PROJECTION_DIGEST_ABI_UNAVAILABLE
    failure_before_exactly: [source-read, replay-return, write, success-return]
    currently_reachable_success_path: false
    execute_roles: [gurine_public_projector]
    transaction: SERIALIZABLE
    worker_fence: >-
      job_id, job_lease_token, and positive job_fencing_token must exactly bind
      the current unexpired RUNNING EVENT_DELIVERY job and its unfinished
      current attempt. A stale, expired, substituted, or non-current fence is
      SQLSTATE 40001 and writes nothing.
    lease_token_storage: >-
      The raw lease token is call-scoped and never persists. Only lowercase
      SHA-256 of job_lease_token::text may enter the job receipt, attempt
      metrics, audit details, or replay evidence.
    replay_fence: >-
      Replay must reproduce the same job ID, lease-token digest, and fencing
      token that terminalized the original projection; another worker fence
      cannot recover or adopt that receipt.
