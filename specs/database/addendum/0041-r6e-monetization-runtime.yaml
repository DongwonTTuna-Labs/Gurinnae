acl_contract:
  role_provisioning_precondition: runtime_role_preflight_contract
  owner_roles:
    economics: gurine_migrator
    payment: gurine_migrator
  service_roles:
    economics: gurine_economics_importer
    payment: gurine_billing_gateway
  table_dml_rule: >-
    PUBLIC and every LOGIN/runtime role have zero direct INSERT, UPDATE, DELETE,
    TRUNCATE, REFERENCES, or TRIGGER privilege on all seven new relations and
    all 24 economics relations. Mutation occurs only inside fixed-search-path,
    SECURITY DEFINER, typed owner functions.
  table_select_rule: >-
    On all seven new private relations and all 24 economics relations, Control
    API, workflow worker, billing gateway, economics importer, projector,
    scheduler, notification worker, public API, submission API, analysis
    worker, ingest worker, identity API, document extractor, and PUBLIC have
    zero direct SELECT. The Public API may read only the separately declared
    public projection. Any auditor SELECT exception is explicit, read-only, and
    grants no owner-function execution or secret-bearing output.
  owner_internal_grant_rule: >-
    The NOLOGIN gurine_migrator owner uses owner-implied access only inside its
    fixed SECURITY DEFINER routines. The compatibility writer roles own zero
    objects and receive zero privilege. The funding projector routine may use
    the migrator owner's access to public.transparency_reports plus the exact
    inbox, jobs, and job-attempt columns declared above; none of that authority
    is granted, inherited, or SET ROLE reachable by a LOGIN/runtime principal.
  function_rule: >-
    PUBLIC execute is revoked. Each service receives EXECUTE only on its exact
    narrow routine list and USAGE only on required closed composites. The
    compatibility writer roles are NOLOGIN, own zero objects, and receive zero
    privilege. Service roles are NOINHERIT and cannot SET ROLE to the migrator
    or reuse each other's credentials.
  mutation_guard: >-
    Every new ledger relation rejects UPDATE and DELETE for all roles,
    including the owner. Corrections append a new exact predecessor-bound row.

implementation_requirements:
  current_snapshot_notice: >-
    At initial addendum authoring time, the migration contains the seven tables,
    closed operation composites, validator functions, immutable triggers, event
    schemas, invoice digest closure, and legacy EXECUTE revokes. The following
    required runtime closures must exist before this addendum may be promoted
    from REVIEW_REQUIRED.
  required_before_ready:
    - >-
      ECONOMICS_IMPORT create, update, preview, submit, review decision, claim,
      execute, complete, and fail lifecycle wrappers that intercept the generic
      path and cannot fall through to a TASK or legacy detail.
    - >-
      Exact evidence-set compiler and detail owner that lock proposal rationale
      and raw evidence rows, derive ID-sorted positional pairs, compare the
      distinct derived digest set with the wire sourceEvidenceDigests set, then
      discard the wire set and derive every stored canonical byte and digest.
    - >-
      Eleven relation-specific economics branch owners and a complete exact
      one-owner matrix for all 24 economics relations.
    - >-
      ECO-AUTHORITY-V1 target-version exception, one-shot PILOT bootstrap,
      CommercialContractOfferParentV1 numeric schemaVersion 1, explicit approved
      identities, invoice adjustment DAG, GURINE_LENGTH_PREFIXED_UTF8_V1 golden
      vectors, and permanent low-margin 55000/write-zero negative coverage.
    - >-
      PAID-EVIDENCE-V2-AUTHORITY additive V2 types/relations/DAG, remaining
      twelve review-snapshot fields, existing-row abort, both MATCH FULL deferred
      reciprocal FKs, exact terminal evidence, and isolated subject-HMAC keyring.
    - >-
      TEST-only payment binding, charge/refund/fetch reconciliation, webhook
      receipt, donation fact, scheduler enqueue, and notification materializer
      owner routines with replay and changed-input conflict behavior.
    - >-
      PAYMENT-TEST-V1 separate current/previous keyrings, UTC non-drifting monthly
      occurrence scheduler, request-bound review assignee, PAYMENT_REVIEW_V1
      exact-one routing, 24-hour due time, and zero entitlement/contract/public
      access effects for every failure and re-fetch mismatch.
    - >-
      PUB-023 nine-column public relation hardening, source reader, typed
      projection input/receipt, one-transaction projector, immutable public
