      - recorded_at
    primary_key: {name: cash_application_facts_pkey, columns: [id]}
    unique_constraints:
      - {name: cash_application_root_revision_uq, columns: [root_fact_id, revision]}
      - {name: cash_application_fact_digest_uq, columns: [fact_digest]}
      - {name: cash_application_reference_uq, columns: [id, fact_digest]}
      - {name: cash_application_source_identity_uq, columns: [source_system_id, source_settlement_identity_hmac, revision]}
    foreign_keys:
      - {name: cash_application_root_fk, columns: [root_fact_id], references: "ops.cash_application_facts(id)", on_delete: RESTRICT, deferrable: "INITIALLY DEFERRED"}
      - {name: cash_application_supersedes_fk, columns: [supersedes_fact_id, predecessor_fact_digest], references: "ops.cash_application_facts(id,fact_digest)", on_delete: RESTRICT, match: FULL}
      - {name: cash_application_invoice_fk, columns: [invoice_fact_id, invoice_fact_digest], references: "ops.invoice_facts(id,record_digest)", on_delete: RESTRICT}
    checks:
      - name: cash_application_chain_ck
        expression: >-
          revision > 0 AND ((fact_effect = 'ORIGINAL' AND revision = 1
          AND root_fact_id = id AND supersedes_fact_id IS NULL
