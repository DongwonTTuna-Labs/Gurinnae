authority_and_compatibility:
  precedence:
    - AGENTS.md
    - FINAL_BUILD_CONTRACT.md
    - specs/product/final-product-contract.yaml
    - specs/engineering/code-quality-contract.yaml
    - specs/domain/state-machines.yaml
    - specs/api/operation-contracts.yaml
    - specs/application/command-semantics.yaml
    - specs/api/operation-persistence.yaml
    - specs/events/event-catalog.yaml
    - specs/database
    - specs/product/business-model-contract.yaml
    - this_addendum_for_0041_physical_closure
  business_model_rule: >-
    specs/product/business-model-contract.yaml is the top-level product and
    economics contract for R6e. This physical addendum narrows implementation
    details and may not weaken its free-access, no-invention, governance,
    payment, privacy, or publication boundaries.
  historical_migration_rule: >-
    Migrations 0001 through 0040 remain byte-preserved. Every physical R6e
    change is forward-only in 0041.
  transaction_rule: >-
    One outer BEGIN is the first parsed statement and terminal COMMIT is the
    last parsed statement.
  seed_rule: >-
    No production price, tariff, cost, contract, invoice, revenue, cash,
    tax-invoice, donation tier, billing key, merchant, donor, or provider result
    is seeded. Deterministic values are permitted only in an ephemeral test
    database and are labelled TEST_FIXTURE.
  free_public_access_rule: >-
    Public facts, evidence locators and source links, current revisions and
    history, corrections and retractions, limitation and uncertainty notices,
    response and appeal rights, privacy and accessibility flows, methodology,
    governance, funding and conflict disclosures, basic verified subscriptions,
    and reasonable public API/export remain free forever. Contract, invoice,
    collection, dunning, donation, provider, or entitlement state cannot hide,
    delay, truncate, reprioritize, or weaken any of them.
  b2b_no_checkout_rule: >-
    V1 B2B authority is a signed written contract, externally issued electronic
    tax-invoice acknowledgement, and bank-transfer collection recorded through
    signed typed import. There is no B2B self-service checkout, card billing,
    live PG, live ASP, receivable ledger, cash ledger, tax remittance, payment
    execution, or commercial entitlement API.
  donation_boundary_rule: >-
    Donation payment is DISABLED by default and TEST_ONLY when explicitly
    enabled. Toss Payments, Kakao Pay, and Stripe are deterministic fixture
    adapters only. Donation creates no SKU, contract, invoice, revenue, cash
    application, capability, entitlement, paid value, investigation priority,
    publication priority, or investigation exemption.
  fail_closed_rule: >-
    Missing, partial, stale, superseded, reversed, unclosed, UNKNOWN,
    digest-mismatched, unauthorized, non-STEP_UP, live-provider, or
    non-test-payment authority produces no protected write or public success
    claim. Elapsed time and caller-authored digests never repair authority.
  pending_derivation_rule: >-
    While the approved authority packages are not fully implemented and
    independently verified,
    global.yaml#relation_inventory.stable_derivation_snapshot.snapshot_status
    remains exactly PENDING_STABLE_0041_DERIVATION and every addendum inventory
    freeze remains PENDING. No FINAL enum may be invented. Design and static
    validation report the blockers; every artifact-ready or final gate rejects
    the pending status even if all current hashes and byte counts are populated.

supervisor_authority_decision_v1:
  authority_label: 감독자 결정 v1
  authority_kind: PRODUCT_POLICY_DECISION
  decision_revision: 1
  status: APPROVED_HIGH_LEVEL_CANONICAL_SUBGATES_OPEN
  recommendation_record: .fable-sol/run-r6e.log lines 15-104
  approval_record: .fable-sol/r6e-authority-approval.md
  approval_record_sha256: a73ccb4da942c32b70ac7056dfe2d65b6c5595beb3e64e22999b07eb0f939f47
  higher_contract: specs/product/business-model-contract.yaml#supervisor_decision_v1
  approved_packages_ordered_exactly:
    - ECO-AUTHORITY-V1
    - PAID-EVIDENCE-V2-AUTHORITY
    - PAYMENT-TEST-V1
    - GFD-AUTHORITY-V1
  revision_policy: >-
    These four package values and rules are binding as 감독자 결정 v1. They may
    be revised only by a later explicit pre-production review jointly owned by
    the designated legal and finance owners, recorded as a new decision revision
    that preserves this decision as provenance. This is a product authority
    decision, not an external legal or financial approval.
  implementation_hold_rule: >-
    Approval fixes the high-level package choices but does not supply any exact
    wire/digest, V2 physical/proof, or payment-review communication binding that
    the recommendation did not enumerate. Those canonical subgates remain open
    and fail-closed. No routine, relation, projection, payment mode, fixture, or
    acceptance path is READY; every existing pre-write latch remains active
    until the complete approved package plus each canonical subgate, ACL, event,
    runtime, negative test, and independent evidence is implemented and verified
    together. No FINAL SHA-256 is asserted while 0041 remains under mutation hold.

