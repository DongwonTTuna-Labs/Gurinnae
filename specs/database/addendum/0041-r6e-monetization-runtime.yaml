funding_disclosure_publisher_gate:
  status: AUTHORITY_RESOLVED_IMPLEMENTATION_PENDING_FAIL_CLOSED
  resolved_authority_id: R6E-FUNDING-DISCLOSURE-PUBLISHER-AUTHORITY
  authority: supervisor_authority_decision_v1.GFD-AUTHORITY-V1
  review_slots_ordered_exactly:
    - ordinal: 1
      slot_id: funding_preparer
      conditional: false
      capability: funding.manage
      allowed_roles_exactly: [EXECUTIVE_APPROVER, OPERATIONS]
    - ordinal: 2
      slot_id: funding_publisher
      conditional: false
      capability: funding.publish
      allowed_roles_exactly: [EXECUTIVE_APPROVER]
    - ordinal: 3
      slot_id: oversight_reviewer
      conditional_on: requires_oversight_review
      capability: review.legal
      allowed_roles_exactly: [LEGAL_REVIEWER]
    - ordinal: 4
      slot_id: board_approver
      conditional_on: requires_board_approval
      capability: funding.publish
      allowed_roles_exactly: [EXECUTIVE_APPROVER]
  review_slot_rules:
    common_capability: actions.review
    assurance: STEP_UP
    actor_distinctness: pairwise across every instantiated slot
    vacant_semantics: VACANT never satisfies or closes quorum
    conditional_rule: >-
      Ordinal 3 exists only when requires_oversight_review is true and ordinal 4
      exists only when requires_board_approval is true. An absent conditional
      requirement creates no assignment and contributes no counted decision.
  related_case_prerequisite:
    cardinality: exactly one per distinct related case
    existing_action_kind: PUBLICATION
    existing_slot_id: independent_editorial
    decision: APPROVE
    capability: review.editorial
    allowed_roles_exactly: [EDITOR, PUBLISHER]
    common_capability: actions.review
    assurance: STEP_UP
    current_and_exact_binding_required: true
  target_revision_contract:
    semantic: candidate revision N to be published
    first_revision: 1
    later_revision: locked current head plus 1
    minimum: 1
    zero_sentinel: forbidden
    null: forbidden
    final_transaction_fence: locked head plus 1 equals candidate N
  publisher_acl:
    logical_operation: private.PublishFundingDisclosureRevision
    physical_service: workflow-worker
    runtime_database_principal: gurine_workflow_worker
    sole_mutation_function: editorial.publish_funding_disclosure_v1
    function_owner: gurine_migrator
    security: SECURITY DEFINER
    non_owner_execute_roles_exactly: [gurine_workflow_worker]
    runtime_direct_table_dml_grants_exactly: []
    public_execute: false
  digest_and_event_authority:
    digest_abi: closed Gurine Canonical JSON V1
    scalar_rules:
      - numeric(24,6) is a fixed-six-decimal JSON string
      - timestamps are UTC with exactly six fractional digits
      - nullable values are explicit null and keys are never omitted
    public_content_rule: includes each stored entryDigest
    revision_preimage_excludes_exactly:
      - revisionDigest
      - receiptDigest
      - createdAt
    computation_order_exactly:
      - entry and set digests
      - revisionDigest
      - receiptDigest
      - event and response digests
    counted_decision_tuple_fields_in_order:
      - slotOrdinal
      - slotId
      - decisionId
      - decisionReceiptDigest
      - actorId
    counted_decision_order: slotOrdinal ascending, then decisionId ascending
    independently_sorted_parallel_arrays: forbidden
    published_event: governance.funding_disclosure_published.v1
    published_event_required_binding: >-
      Revision and prior revision, period, snapshot, policy, conflict,
      concentration, conditional gates, entry and public-content digests,
      proposal, execution, approval, counted decisions, related-case reviews,
      publisher, effective and published timestamps, and receipt digest are all
      required and digest-bound.
  implementation_gaps_in_order:
    - >-
      The authoritative funding.manage and funding.publish capability-to-role
      mappings are not seeded or mapped in the database.
    - >-
      No dedicated publisher routine implements the authoritative
      gurine_migrator owner and gurine_workflow_worker-only non-owner EXECUTE
      boundary. Economics-writer-owned pure digest helpers are separate
      internal utilities and do not implement or conflict with that publisher.
  authority_resolution_rule: >-
    The package above resolves the prior quorum, related-case, target-version,
    ACL, digest-order, and event authority conflicts. It does not remove the
    current mutation latch until those rules and their tests are implemented.
  external_error_contract_resolution:
    database_error: {sqlstate: "55000", code: FUNDING_DISCLOSURE_AUTHORITY_UNAVAILABLE}
    bounded_control_mapping:
      rust_variant: ServiceError::Persistence
      external_code: INTERNAL_ERROR
      http_status: 500
      exact_match_required:
        sqlstate: "55000"
        database_message: FUNDING_DISCLOSURE_AUTHORITY_UNAVAILABLE
    affected_dispatch_operations_exactly:
      - createActionProposal
      - updateActionDraft
      - previewActionDraft
      - submitActionForReview
      - claimActionReview
      - submitActionDecision
    higher_authority_source: specs/product/addendum-resource-error-contracts.yaml:2959-2965
    higher_authority_status: >-
      All six operations already declare INTERNAL_ERROR and their generated
      OpenAPI operations already expose HTTP 500. The bounded mapping adds no
      new public error code, response, retryability claim, or extension.
    implementation_evidence:
      mapping: services/control-api/src/service/command_addendum_errors.rs
      regression_tests: services/control-api/src/service/command_addendum_error_tests.rs
    near_miss_rule: >-
      Any different operation, SQLSTATE, message casing, message suffix, or
      missing message falls through to the pre-existing generic database error
      classifier. This exact pair must not broaden another operation or convert
      an unrelated 55000 into the funding authority latch.
    codegen_delta_required: false
    control_api_mapping_implemented: true
    publisher_authority_resolved: true
    publisher_implementation_ready: false
  lifecycle_gate:
    source_freeze_status: FINAL
    enforcement_point: final action dispatcher before the first write
    action_kind: FUNDING_DISCLOSURE
    dispatcher_signature: ops.execute_action_approval_v1(text,jsonb,uuid) RETURNS jsonb
    dispatcher_source_signature: >-
      ops.execute_action_approval_v1(p_operation text, p_request jsonb,
      p_actor uuid) RETURNS jsonb
    dispatcher_canonical_ddl_sha256: 52a1ee07d93054b073976548ce65d511d5360c30f5827cd7cf49c8ee84f730d6
    discriminator_contract:
      create:
        top_level_path: actionKind
        canonical_draft_path: draft.kind
        funding_gate_if_either_matches: true
      update:
        persisted_source: ops.action_proposals.action_kind
        canonical_draft_path: draft.kind
        funding_gate_if_either_matches: true
      later_operations:
        operations_exactly:
          - previewActionDraft
          - submitActionForReview
          - claimActionReview
          - submitActionDecision
        sole_authority: persisted ops.action_proposals.action_kind
      legacy_path:
        path: draft.actionKind
        authoritative_discriminator: false
        funding_unavailable_sentinel: FUNDING_DISCLOSURE
        rule: >-
          The legacy key can only strengthen fail-closed detection: value
          FUNDING_DISCLOSURE triggers the funding gate, but no legacy value may
          establish, replace, or repair an authoritative action kind.
      smuggling_regression_exactly: >-
        A TASK top-level discriminator combined with canonical draft.kind
        FUNDING_DISCLOSURE, the inverse mismatch, and the equivalent persisted
        versus canonical-draft FUNDING mismatch are all blocked by the exact
        funding gate before legacy delegation with transaction delta zero.
        Legacy draft.actionKind FUNDING_DISCLOSURE is also blocked but can never
        bypass or replace an authoritative discriminator.
      non_funding_mismatch_external_contract:
        status: UNRESOLVED_OUTSIDE_THIS_DATABASE_ADDENDUM
        rust_action_kind_mismatch_variant_present: false
        update_error_contract_allows_action_kind_mismatch: false
        rule: >-
          This addendum authorizes no SQLSTATE, message, Rust error, or HTTP
          mapping for a mismatch where neither authoritative discriminator is
          FUNDING_DISCLOSURE, or for a payload that supplies only a non-FUNDING
          legacy draft.actionKind value. Any such mapping requires a higher
          resource-error and OpenAPI contract decision.
    supported_operations_exactly:
      - createActionProposal
      - updateActionDraft
      - previewActionDraft
      - submitActionForReview
      - claimActionReview
      - submitActionDecision
    error_sqlstate: "55000"
    error_code: FUNDING_DISCLOSURE_AUTHORITY_UNAVAILABLE
    behavior: reject each supported operation before its first write
    transaction_delta_exactly: 0
    delta_scope: >-
      Action proposal and detail rows, assignments, decisions, authorizations,
      effects, funding revisions and entries, audit and outbox events, inbox,
      jobs, job attempts, and public projections all remain unchanged.
    absent_runtime_surfaces_exactly:
      - funding executor
      - funding publisher
      - funding claim routine
      - funding completion routine
      - funding failure routine
    absent_surface_rule: >-
      These surfaces are not installed and are not executable. They are an
      implementation gap, not implicit lifecycle operations, and must not appear
      as routines or operation names in a FINAL function matrix.
  independently_finalizable_read_only_surfaces:
    - eleven pure funding-disclosure digest helpers
    - existing-approved-revision public source reader
  closure_rule: >-
    No funding publisher function, owner assignment, service EXECUTE grant, or
    lifecycle success contract may be marked FINAL until the complete approved
    GFD package is implemented and independently verified. The existing exact
    55000 to INTERNAL_ERROR/500 hold remains authoritative in the interim.

