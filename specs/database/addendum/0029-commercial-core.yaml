    creation_order: 22
    columns:
      contract_period_id: {type: uuid, nullable: false}
      offer_profile_id: {type: uuid, nullable: false}
      offer_profile_version: {type: bigint, nullable: false}
      offer_profile_digest: {type: 'char(64)', nullable: false}
      offer_capability_set_digest: {type: 'char(64)', nullable: false}
      offer_quota_set_digest: {type: 'char(64)', nullable: false}
      offer_overage_policy_set_digest: {type: 'char(64)', nullable: false}
      offer_service_credit_policy_digest: {type: 'char(64)', nullable: false}
      capability_ordinal: {type: smallint, nullable: false}
      capability_code: {type: ops.offer_capability_code, nullable: false}
      offer_state: {type: ops.offer_capability_state, nullable: false}
      quota_kind: {type: ops.offer_quota_kind, nullable: false}
      included_quantity: {type: 'numeric(24,6)', nullable: true}
      overage_policy: {type: ops.offer_overage_policy, nullable: false}
      overage_unit_price: {type: 'numeric(24,6)', nullable: true}
      activation_policy_digest: {type: 'char(64)', nullable: true}
      consent_policy_digest: {type: 'char(64)', nullable: true}
      cost_policy_digest: {type: 'char(64)', nullable: true}
      entry_payload: {type: jsonb, nullable: false, logical_type: OfferCapabilityV1}
      entry_canonical: {type: bytea, nullable: false, logical_type: GURINE_CANONICAL_JSON_V1<OfferCapabilityV1>}
      entry_digest_preimage_canonical: {type: bytea, nullable: false, logical_type: GURINE_CANONICAL_JSON_V1<OfferCapabilityV1 excluding entryDigest>}
      entry_digest: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(entry_digest_preimage_canonical,'sha256'),'hex')"}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [contract_period_id, capability_ordinal]
    foreign_keys:
      - name: offer_profile_capability_parent_fk
        columns: [contract_period_id, offer_profile_id, offer_profile_version, offer_profile_digest, offer_capability_set_digest, offer_quota_set_digest, offer_overage_policy_set_digest, offer_service_credit_policy_digest]
        references: 'ops.commercial_contract_periods(id, offer_profile_id, offer_profile_version, offer_profile_digest, offer_capability_set_digest, offer_quota_set_digest, offer_overage_policy_set_digest, offer_service_credit_policy_digest)'
        on_delete: RESTRICT
        deferrable: INITIALLY DEFERRED
    unique_constraints:
      - {name: offer_profile_capability_profile_ordinal_uq, columns: [offer_profile_id, offer_profile_version, capability_ordinal]}
      - {name: offer_profile_capability_profile_code_uq, columns: [offer_profile_id, offer_profile_version, capability_code]}
      - {name: offer_profile_capability_entry_digest_uq, columns: [offer_profile_id, offer_profile_version, entry_digest]}
    checks:
      - {name: offer_profile_capability_version_ordinal_ck, expression: "offer_profile_version > 0 AND capability_ordinal BETWEEN 1 AND 12"}
      - name: offer_profile_capability_ordinal_code_ck
        expression: "(capability_ordinal,capability_code) IN ((1,'PUBLIC_WEB'),(2,'VERIFIED_EMAIL'),(3,'API_EXPORT'),(4,'SIGNED_WEBHOOK'),(5,'DAILY_DIGEST'),(6,'WEEKLY_DIGEST'),(7,'SMS'),(8,'TELEGRAM'),(9,'WHATSAPP'),(10,'LINE'),(11,'KAKAO'),(12,'VOICE'))"
      - name: offer_profile_capability_offer_shape_ck
        expression: >-
          (offer_state = 'NOT_OFFERED' AND quota_kind = 'NOT_METERED' AND included_quantity IS NULL AND overage_policy = 'NOT_APPLICABLE' AND overage_unit_price IS NULL AND activation_policy_digest IS NULL AND consent_policy_digest IS NULL AND cost_policy_digest IS NULL)
          OR (offer_state = 'INCLUDED_REQUIRED' AND capability_code = 'PUBLIC_WEB' AND quota_kind = 'NOT_METERED' AND included_quantity IS NULL AND overage_policy = 'NOT_APPLICABLE' AND overage_unit_price IS NULL)
          OR (offer_state = 'INCLUDED_REQUIRED' AND capability_code = 'API_EXPORT' AND quota_kind = 'API_RECORD_UNIT' AND included_quantity IS NOT NULL AND included_quantity >= 0 AND ((overage_policy = 'DECLARED_TARIFF_OVERAGE' AND overage_unit_price IS NOT NULL AND overage_unit_price >= 0) OR (overage_policy = 'HARD_LIMIT_NO_OVERAGE' AND overage_unit_price IS NULL)))
          OR (offer_state = 'INCLUDED_REQUIRED' AND capability_code = 'SIGNED_WEBHOOK' AND quota_kind = 'WEBHOOK_DISPATCH' AND included_quantity IS NOT NULL AND included_quantity >= 0 AND overage_policy = 'HARD_LIMIT_NO_OVERAGE' AND overage_unit_price IS NULL)
          OR (offer_state = 'INCLUDED_REQUIRED' AND capability_code IN ('DAILY_DIGEST','WEEKLY_DIGEST') AND quota_kind = 'DIGEST_DISPATCH' AND included_quantity IS NOT NULL AND included_quantity >= 0 AND overage_policy = 'HARD_LIMIT_NO_OVERAGE' AND overage_unit_price IS NULL)
          OR (offer_state = 'INCLUDED_REQUIRED' AND capability_code IN ('VERIFIED_EMAIL','SMS','TELEGRAM','WHATSAPP','LINE','KAKAO','VOICE') AND quota_kind = 'DELIVERY_ATTEMPT' AND included_quantity IS NOT NULL AND included_quantity >= 0 AND overage_policy = 'HARD_LIMIT_NO_OVERAGE' AND overage_unit_price IS NULL)
      - name: offer_profile_capability_digest_ck
        expression: "offer_profile_digest ~ '^[0-9a-f]{64}$' AND offer_capability_set_digest ~ '^[0-9a-f]{64}$' AND offer_quota_set_digest ~ '^[0-9a-f]{64}$' AND offer_overage_policy_set_digest ~ '^[0-9a-f]{64}$' AND offer_service_credit_policy_digest ~ '^[0-9a-f]{64}$' AND (activation_policy_digest IS NULL OR activation_policy_digest ~ '^[0-9a-f]{64}$') AND (consent_policy_digest IS NULL OR consent_policy_digest ~ '^[0-9a-f]{64}$') AND (cost_policy_digest IS NULL OR cost_policy_digest ~ '^[0-9a-f]{64}$') AND entry_digest ~ '^[0-9a-f]{64}$'"
      - name: offer_profile_capability_canonical_ck
        expression: "ops.offer_capability_v1_is_valid(entry_payload) AND convert_from(entry_canonical,'UTF8')::jsonb = entry_payload AND entry_digest = encode(extensions.digest(entry_digest_preimage_canonical,'sha256'),'hex') AND entry_payload->>'entryDigest' = entry_digest"
    indexes:
      - {name: offer_profile_capability_parent_fk_idx, columns: [contract_period_id, offer_profile_id, offer_profile_version, offer_profile_digest]}
      - {name: offer_profile_capability_offer_lookup_idx, columns: [offer_profile_id, offer_profile_version, capability_ordinal]}
    trigger_contracts:
      - name: offer_profile_capability_validate_deferred
        timing: CONSTRAINT AFTER INSERT INITIALLY DEFERRED
        rules:
          - Only ops.record_commercial_contract_period may insert the twelve rows in the same SERIALIZABLE transaction as the parent ORIGINAL contract period.
          - The complete OfferCapabilityV1 payload, scalar columns, preimage and generated entry_digest are byte-equal; caller-supplied digests are never trusted.
          - At commit the parent has exactly twelve rows, ordinals 1..12 and the exact closed capability-code order. The ordered entry digests independently reproduce the capability, quota and overage set digests on the parent. service_credit_policy_digest is a separate signed OfferProfile scalar and is validated against the exact tariff/SLA tuple, never invented from capability rows.
          - A REPLACEMENT contract period inherits the original profile tuple and inserts twelve new child rows under its own contract_period_id by copying every scalar and canonical byte from the predecessor rows exactly. The copied rows are new relational bindings, not a changed OfferProfile, and any byte difference rejects the successor.
      - {name: offer_profile_capability_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      schedule_binding: parent commercial contract period
      legal_hold_key: [OFFER_PROFILE_CAPABILITY, contract_period_id, capability_ordinal]
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository:
      insert_identity: [contract_period_id, capability_ordinal]
      insert_order: [capability_ordinal ASC]
      read_order: [capability_ordinal ASC]
      errors: [OFFER_PROFILE_INVALID, OFFER_PROFILE_SET_MISMATCH, FACT_CONFLICT]

