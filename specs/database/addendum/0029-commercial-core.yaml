      - {name: contract_period_supersedes_fk, columns: [supersedes_contract_period_id], references: 'ops.commercial_contract_periods(id)', on_delete: RESTRICT}
    unique_constraints:
      - {name: contract_period_root_revision_uq, columns: [root_contract_period_id, revision]}
      - {name: contract_period_semantic_revision_uq, columns: [deployment_id, organization_id, contract_id, period_start, revision]}
      - {name: contract_period_context_candidate_uq, columns: [id, deployment_id, organization_id, contract_id, sku, accounting_timezone]}
      - {name: contract_period_offer_binding_uq, columns: [id, offer_profile_id, offer_profile_version, offer_profile_digest]}
      - {name: contract_period_offer_child_uq, columns: [id, offer_profile_id, offer_profile_version, offer_profile_digest, offer_capability_set_digest, offer_quota_set_digest, offer_overage_policy_set_digest, offer_service_credit_policy_digest]}
      - {name: contract_period_paid_packet_binding_uq, columns: [id, deployment_id, organization_id, sku, revision, record_digest]}
      - {name: contract_period_sla_candidate_uq, columns: [id, organization_id, sla_policy_digest]}
      - {name: contract_period_record_digest_uq, columns: [record_digest]}
      - {name: contract_period_invalidation_binding_uq, columns: [id, revision, record_digest]}
    checks:
      - {name: contract_period_revision_ck, expression: revision > 0}
      - {name: contract_period_chain_shape_ck, expression: "((fact_effect = 'ORIGINAL' AND revision = 1 AND root_contract_period_id = id AND supersedes_contract_period_id IS NULL AND predecessor_record_digest IS NULL) OR (fact_effect = 'REPLACEMENT' AND revision > 1 AND root_contract_period_id <> id AND supersedes_contract_period_id IS NOT NULL AND predecessor_record_digest IS NOT NULL)) IS TRUE"}
      - {name: contract_period_interval_ck, expression: period_start < period_end}
      - {name: contract_period_offer_version_interval_ck, expression: "offer_profile_version > 0 AND offer_effective_from < offer_effective_until"}
      - {name: contract_period_currency_timezone_ck, expression: "currency ~ '^[A-Z]{3}$' AND length(btrim(accounting_timezone)) BETWEEN 1 AND 63 AND binding_committed_amount >= 0"}
      - {name: contract_period_provisioning_ck, expression: "(provisioning_state = 'UNPROVISIONED' AND provisioned_at IS NULL) OR (provisioning_state = 'PROVISIONED' AND provisioned_at IS NOT NULL AND provisioned_at >= signed_at)"}
      - {name: contract_period_state_effective_ck, expression: "state_effective_at >= signed_at AND (provisioned_at IS NULL OR state_effective_at >= provisioned_at)"}
      - name: contract_period_sla_selection_shape_ck
        expression: >-
          (sla_selection_state = 'UNAVAILABLE_NOT_SOLD' AND sla_add_on_selected = false AND sla_policy_version IS NULL AND sla_policy_digest IS NULL AND sla_target_availability_ratio IS NULL AND sla_capability_set_digest IS NULL AND sla_exclusion_schedule_digest IS NULL AND sla_service_credit_schedule_digest IS NULL AND sla_measurement_policy_digest IS NULL)
          OR (sla_selection_state = 'AVAILABLE_NOT_SELECTED' AND sla_add_on_selected = false AND sla_policy_version IS NULL AND sla_policy_digest IS NULL AND sla_target_availability_ratio IS NULL AND sla_capability_set_digest IS NULL AND sla_exclusion_schedule_digest IS NULL AND sla_service_credit_schedule_digest IS NULL AND sla_measurement_policy_digest IS NULL)
          OR (sla_selection_state = 'SELECTED' AND sla_add_on_selected = true AND sla_policy_version IS NOT NULL AND length(btrim(sla_policy_version)) BETWEEN 1 AND 100 AND sla_policy_digest IS NOT NULL AND sla_target_availability_ratio IS NOT NULL AND sla_target_availability_ratio > 0 AND sla_target_availability_ratio <= 1 AND sla_capability_set_digest IS NOT NULL AND sla_exclusion_schedule_digest IS NOT NULL AND sla_service_credit_schedule_digest IS NOT NULL AND sla_measurement_policy_digest IS NOT NULL)
      - {name: contract_period_hmac_key_version_ck, expression: length(btrim(contract_reference_hmac_key_version)) BETWEEN 1 AND 100}
      - {name: contract_period_digest_ck, expression: "(predecessor_record_digest IS NULL OR predecessor_record_digest ~ '^[0-9a-f]{64}$') AND contract_reference_hmac ~ '^[0-9a-f]{64}$' AND tariff_record_digest ~ '^[0-9a-f]{64}$' AND qualification_receipt_digest ~ '^[0-9a-f]{64}$' AND offer_contract_binding_digest ~ '^[0-9a-f]{64}$' AND offer_profile_digest ~ '^[0-9a-f]{64}$' AND offer_capability_set_digest ~ '^[0-9a-f]{64}$' AND offer_quota_set_digest ~ '^[0-9a-f]{64}$' AND offer_overage_policy_set_digest ~ '^[0-9a-f]{64}$' AND offer_service_credit_policy_digest ~ '^[0-9a-f]{64}$' AND offer_source_receipt_digest ~ '^[0-9a-f]{64}$' AND offer_signature_digest ~ '^[0-9a-f]{64}$' AND accounting_policy_digest ~ '^[0-9a-f]{64}$' AND commitment_policy_digest ~ '^[0-9a-f]{64}$' AND deployment_configuration_digest ~ '^[0-9a-f]{64}$' AND authority_reference_digest ~ '^[0-9a-f]{64}$' AND decision_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND record_digest ~ '^[0-9a-f]{64}$' AND (sla_policy_digest IS NULL OR sla_policy_digest ~ '^[0-9a-f]{64}$') AND (sla_capability_set_digest IS NULL OR sla_capability_set_digest ~ '^[0-9a-f]{64}$') AND (sla_exclusion_schedule_digest IS NULL OR sla_exclusion_schedule_digest ~ '^[0-9a-f]{64}$') AND (sla_service_credit_schedule_digest IS NULL OR sla_service_credit_schedule_digest ~ '^[0-9a-f]{64}$') AND (sla_measurement_policy_digest IS NULL OR sla_measurement_policy_digest ~ '^[0-9a-f]{64}$')"}
    indexes:
      - {name: contract_period_one_successor_uq, unique: true, columns: [supersedes_contract_period_id], where: supersedes_contract_period_id IS NOT NULL}
      - {name: contract_period_org_lookup_idx, columns: [deployment_id, organization_id, period_start DESC, id]}
      - {name: contract_period_contract_history_idx, columns: [contract_id, period_start ASC, id ASC]}
      - {name: contract_period_status_idx, columns: [deployment_id, status, period_end, id]}
      - {name: contract_period_tariff_fk_idx, columns: [tariff_version_id, deployment_id, sku, accounting_timezone, id]}
      - {name: contract_period_approver_fk_idx, columns: [approver_id, id]}
      - {name: contract_period_state_effective_idx, columns: [deployment_id, organization_id, contract_id, state_effective_at ASC, revision ASC, id ASC]}
      - {name: contract_period_offer_identity_original_uq, unique: true, columns: [offer_profile_id, offer_profile_version], where: "fact_effect = 'ORIGINAL'"}
      - {name: contract_period_offer_digest_original_uq, unique: true, columns: [offer_profile_digest], where: "fact_effect = 'ORIGINAL'"}
    trigger_contracts:
      - name: contract_period_context_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - deployment_id, organization_id, and deployment_configuration_digest equal the immutable runtime configuration.
          - Lock tariff_version_id and require same deployment, SKU, currency, accounting_timezone and accounting_policy_digest, with tariff effective interval containing the full contract period.
          - Lock the exact effective non-REVERSAL qualification receipt for the same deployment, organization, SKU and qualification_episode_id at offer_effective_from; its composite identity and digest are copied byte-for-byte.
          - Recompute CommercialContractOfferParentV1 and offer_contract_binding_digest before validating the signed OfferProfileV1 whose contractPeriodId is this row ID and contractPeriodDigest is that parent digest. Then validate the twelve capability entries and complete offer profile digest. The final contract record digest is computed last and never feeds the offer profile digest.
          - The offer interval is contained by the tariff and contract intervals. A changed offer profile, tariff, capability/quota/overage/service-credit set or interval creates a new nonoverlapping ORIGINAL root; a REPLACEMENT inherits every offer field byte-for-byte.
          - Recompute binding_committed_amount from exact contract period, selected SLA, tariff components and commitment_policy_digest; amendments or proration create another immutable contract period rather than inferred revenue.
          - ORIGINAL acquires a deployment semantic advisory lock and rejects overlap with terminal leaves of different roots; adjacent renewal periods are allowed.
          - REPLACEMENT locks the unique current leaf, binds predecessor_record_digest, inherits deployment/organization/contract/period/tariff/currency/timezone/policies/commitment/SLA/source identity, and increments revision exactly one.
          - ORIGINAL state_effective_at is signed_at. A successor has a strictly later state_effective_at than its predecessor, is no later than the UTC instant of period_end local midnight, and cannot backdate a suspension, ending or cancellation.
          - Allowed successor state changes are ACTIVE+UNPROVISIONED to ACTIVE+PROVISIONED; ACTIVE to SUSPENDED, ENDED or CANCELLED; SUSPENDED to ACTIVE, ENDED or CANCELLED. ENDED and CANCELLED are terminal. No successor can change stage or economic terms; an amendment is a new nonoverlapping root.
          - UNAVAILABLE_NOT_SOLD is permitted only when the tariff is UNCONFIGURED_NOT_SOLD; AVAILABLE_NOT_SELECTED and SELECTED require a CONFIGURED_FOR_SALE tariff. SELECTED copies the tariff SLA version, policy, target, capability-set, exclusion-schedule, service-credit-schedule and measurement-policy tuple byte-for-byte; no missing target or caller override is sellable.
      - {name: contract_period_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: record_digest
      canonical_type: CommercialContractPeriodCanonicalV1
      field_order: [schemaVersion, id, deploymentId, organizationId, contractId, rootContractPeriodId, revision, factEffect, supersedesContractPeriodId, predecessorRecordDigest, contractReferenceHmac, contractReferenceHmacKeyVersion, periodStart, periodEnd, sku, tariffVersionId, tariffRecordDigest, qualificationReceiptId, qualificationEpisodeId, qualificationReceiptDigest, offerContractBindingDigest, offerProfileId, offerProfileVersion, offerProfileDigest, offerCapabilitySetDigest, offerQuotaSetDigest, offerOveragePolicySetDigest, offerServiceCreditPolicyDigest, offerEffectiveFrom, offerEffectiveUntil, offerSourceReceiptDigest, offerSignatureDigest, currency, accountingTimezone, accountingPolicyDigest, bindingCommittedAmount, commitmentPolicyDigest, status, stage, provisioningState, slaAddOnSelected, slaSelectionState, slaPolicyVersion, slaPolicyDigest, slaTargetAvailabilityRatio, slaCapabilitySetDigest, slaExclusionScheduleDigest, slaServiceCreditScheduleDigest, slaMeasurementPolicyDigest, signedAt, provisionedAt, stateEffectiveAt, deploymentConfigurationDigest, authorityReferenceDigest, approverId, decisionDigest, sourceReceiptDigest, signatureDigest]
    effective_state_interval_contract:
      start: state_effective_at
      end: The next successor row's state_effective_at for the same root, otherwise the UTC instant obtained by converting period_end local midnight in accounting_timezone.
      half_open_interval: '[state_effective_at, derived_end)'
      as_of_selection: Select the unique row with greatest state_effective_at then revision then id whose derived interval contains the instant; requiring only the terminal leaf is forbidden for historical as-of funding, invoice, provisioning and readiness decisions.
      funding_rule: binding committed revenue at snapshot as_of uses only a state interval whose status is ACTIVE or SUSPENDED according to the versioned commitment policy; ENDED and CANCELLED contribute only when the signed policy explicitly proves a surviving enforceable commitment.
      correction_rule: A mistaken historical state is corrected by a new accounting/governance correction receipt and restated downstream fact; state_effective_at is never updated or backdated.
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: period_end or contract closure, whichever is later, plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [COMMERCIAL_CONTRACT_PERIOD, id, contract_id, organization_id]
      backup_behavior: preserve immutable fact and re-evaluate schedule, restoration suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
      identifier_rule: Only opaque internal UUIDs and HMAC/digests remain; external contracting documents follow their protected-store schedule.
    repository:
      insert_identity: [root_contract_period_id, revision]
      import_lock_order: [tariff row, semantic deployment advisory lock, neighboring contract rows ordered by period_start and id, approver user, contract-period insert, audit chain head, outbox]
      detail_order: [id]
      contract_history_order: [period_start ASC, id ASC]
      lifecycle_order: [root_contract_period_id, revision ASC, id ASC]
      current_order: [period_start DESC, revision DESC, id ASC]
      roundtrip: Do not derive status, SLA selection, organization, tariff, or provisioning time from another table during mapping; every stored field maps exactly.
      errors: [COMMERCIAL_CONTRACT_INVALID, COMMERCIAL_PERIOD_OVERLAP]

