shared_contract:
  object_owner: gurine_migrator
  identifiers:
    deployment_id: opaque uuid configured for one physical deployment
    organization_id: opaque uuid configured for the one organization in that deployment
    rule: No customer name, billing reference, invoice reference, or external contract identifier is stored; exact external reconciliation uses an HMAC or signed receipt digest.
  numerics:
    money: 'numeric(24,6)'
    quantity: 'numeric(24,6)'
    fx_rate: 'numeric(30,12)'
    forbidden: [real, double precision, money]
  currency:
    type: 'char(3)'
    check: "VALUE ~ '^[A-Z]{3}$'"
  periods:
    date_intervals: '[start, end)'
    check: start < end
    overlap_write_isolation: SERIALIZABLE
    timezone_column: accounting_timezone
    policy_column: accounting_policy_digest
    boundary_rule: A date interval is converted to UTC using exact local-midnight boundaries in accounting_timezone; the importer verifies an exact pg_timezone_names name and rejects ambiguous, nonexistent or non-round-tripping boundaries.
  digest:
    type: 'char(64)'
    check: "VALUE ~ '^[0-9a-f]{64}$'"
    algorithm: SHA-256
    canonicalization: schema-tagged canonical typed value; field order below is normative; database JSON text order and created_at are excluded
  mutation:
    mode: APPEND_ONLY_IMMUTABLE
    trigger: BEFORE UPDATE OR DELETE FOR EACH ROW EXECUTE FUNCTION ops.reject_mutation()
    same_identity_same_digest: return existing row
    same_identity_changed_digest: FACT_CONFLICT
  grants: &commercial_fact_grants
    gurine_workflow_worker: [SELECT]
    gurine_control_api: [SELECT]
    gurine_public_projector: []
    gurine_auditor: [SELECT]
    all_other_runtime_roles: []
    public: []
    rule: INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES and TRIGGER are revoked from every runtime role; workflow mutation uses only the table-specific fixed-search-path SECURITY DEFINER function below, and no ALL TABLES grant is permitted.
  rls: &commercial_fact_rls
    enabled: false
    reason: The paid workspace is one physical database deployment for exactly one configured organization; isolation is by database credential, schema grants, object namespace, queue, and keys, not a claimed multi-tenant row policy.
    invariant: Every commercial row still binds deployment_id and, where applicable, organization_id; the importer rejects values different from immutable deployment configuration.
  retention:
    record_class: COMMERCIAL_ACCOUNTING_FACT
    schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT at retention evaluation
    missing_or_stale_schedule: preserve row and open a review task; never infer deletion eligibility
    legal_hold_key: [relation, primary_key, deployment_id, organization_id]
    hold_atoms: [RETENTION, DELETION, DISCLOSURE]
    backup_behavior: retain the immutable fact and re-evaluate current schedule, restoration suppression, and hold union before restored access or export
    terminal_action: preserve this identifier-and-digest accounting fact; referenced source bodies follow their own schedule and may be crypto-erased
    correction_rule: correction is another immutable fact; original bytes are never rewritten

