round_half_even_contract:
  function: ops.round_half_even_numeric_v1(value numeric, scale integer) RETURNS numeric
  owner: gurine_migrator
  language: plpgsql
  volatility: IMMUTABLE
  strict: true
  parallel: SAFE
  search_path: pg_catalog, pg_temp
  public_execute: revoked
  execute_roles: [gurine_workflow_worker]
  scale_guard: scale BETWEEN 0 AND 12
  body_sql: |-
    DECLARE
      factor numeric;
      magnitude numeric;
      whole numeric;
      fraction numeric;
      rounded_whole numeric;
    BEGIN
      IF scale < 0 OR scale > 12 THEN
        RAISE EXCEPTION USING ERRCODE = '22023', MESSAGE = 'round_half_even scale out of range';
      END IF;
      factor := power(10::numeric, scale);
      magnitude := abs(value) * factor;
      whole := trunc(magnitude);
      fraction := magnitude - whole;
      rounded_whole := CASE
        WHEN fraction < 0.5::numeric THEN whole
        WHEN fraction > 0.5::numeric THEN whole + 1
        WHEN mod(whole, 2) = 0 THEN whole
        ELSE whole + 1
      END;
      RETURN sign(value) * rounded_whole / factor;
    END;
  exact_algorithm:
    - factor := power(10::numeric, scale)
    - magnitude := abs(value) * factor
    - whole := trunc(magnitude)
    - fraction := magnitude - whole
    - If fraction is below 0.5 keep whole; if above 0.5 use whole + 1; if exactly 0.5 use whole when mod(whole,2)=0 and whole+1 otherwise.
    - Return sign(value) * rounded_whole / factor cast to numeric; equality with 0.5 is exact numeric equality and no float cast is permitted.
  negative_ties: Apply the rule to absolute magnitude and restore the sign, so -2.5 rounds to -2 and -3.5 rounds to -4 at scale zero.
  prohibited: [pg_catalog.round numeric overload, float, double precision, locale-sensitive decimal conversion]
  golden_vectors:
    - {value: '2.500000', scale: 0, result: '2'}
    - {value: '3.500000', scale: 0, result: '4'}
    - {value: '-2.500000', scale: 0, result: '-2'}
    - {value: '-3.500000', scale: 0, result: '-4'}
    - {value: '1.2345645', scale: 6, result: '1.234564'}
    - {value: '1.2345655', scale: 6, result: '1.234566'}

exact_idempotency_stored_response_contract:
  existing_relation_hardening:
    relation: ops.idempotency_keys
    migration: 0029_product_economics.sql
    additive_columns:
      response_schema: {type: text, nullable: true}
      response_media_type: {type: text, nullable: true}
      response_body_bytes: {type: bytea, nullable: true}
      response_digest: {type: "char(64)", nullable: true}
      receipt_id: {type: uuid, nullable: true}
      receipt_digest: {type: "char(64)", nullable: true}
      audit_event_id: {type: uuid, nullable: true}
      outbox_id: {type: uuid, nullable: true}
      completed_at: {type: timestamptz, nullable: true}
    additive_checks:
      - {name: idempotency_economics_response_all_or_none_ck, expression: "scope NOT LIKE 'ECONOMICS.%' OR (num_nonnulls(response_status,response_body,response_schema,response_media_type,response_body_bytes,response_digest,receipt_id,receipt_digest,completed_at) IN (0,9) AND ((audit_event_id IS NULL AND outbox_id IS NULL) OR completed_at IS NOT NULL))"}
      - {name: idempotency_economics_response_digest_ck, expression: "response_digest IS NULL OR response_digest ~ '^[0-9a-f]{64}$'"}
      - {name: idempotency_economics_receipt_digest_ck, expression: "receipt_digest IS NULL OR receipt_digest ~ '^[0-9a-f]{64}$'"}
      - {name: idempotency_economics_response_shape_ck, expression: "response_schema IS NULL OR (response_status BETWEEN 200 AND 299 AND jsonb_typeof(response_body) = 'object' AND response_schema ~ '^[A-Za-z][A-Za-z0-9._-]{0,127}$' AND response_media_type = 'application/json' AND octet_length(response_body_bytes) > 0)"}
      - {name: idempotency_economics_retention_ck, expression: "scope NOT LIKE 'ECONOMICS.%' OR expires_at = 'infinity'::timestamptz"}
    additive_indexes:
      - {name: idempotency_economics_receipt_uq, unique: true, columns: [receipt_id], where: "scope LIKE 'ECONOMICS.%' AND receipt_id IS NOT NULL"}
      - {name: idempotency_economics_receipt_digest_uq, unique: true, columns: [receipt_digest], where: "scope LIKE 'ECONOMICS.%' AND receipt_digest IS NOT NULL"}
      - {name: idempotency_economics_resource_idx, unique: false, columns: [resource_type, resource_id, scope, key_hash], where: "scope LIKE 'ECONOMICS.%' AND completed_at IS NOT NULL"}
    guarded_update: Only ops.finalize_economics_idempotency_v1 may make the single NULL response tuple to complete response tuple transition while holding the primary-key row lock; a complete row, request_hash, key_hash, scope, created_at and expires_at are immutable and DELETE is forbidden while a referenced accounting/public fact exists.
    mutation_trigger: ops.guard_economics_idempotency_mutation_v1 rejects every UPDATE except the one incomplete-to-complete finalization and rejects DELETE for every ECONOMICS scope; cleanup jobs skip these rows and resource-specific retention acts on protected source bodies rather than the stored accounting/governance receipt.
  claim:
    scope: exact closed function-specific ECONOMICS.<FUNCTION>.V1 literal
    key_hash: lowercase SHA-256 of UTF8('GURINE:IDEMPOTENCY:V1') NUL plus the validated high-entropy idempotency-key bytes; the raw key is never stored and the stable domain-separated digest has no rotating-key replay ambiguity
    request_hash: lowercase SHA-256 of the schema-tagged canonical typed request including every scalar and ordered child digest; transport headers and generated timestamps are excluded
    lock: INSERT ON CONFLICT then SELECT FOR UPDATE on exact scope,key_hash before any domain lock
  finalize:
    response_schema: GurineEconomicsMutationResponseV1
    encoding: RFC 8785 canonical UTF-8 JSON bytes stored verbatim in response_body_bytes
    response_digest: SHA-256 of response_body_bytes
    receipt_digest: SHA-256 of schema-tagged canonical receipt fields excluding idempotency_replay
    safe_projection: Response and receipt contain only resource type/internal UUID/version/digest, audit/outbox IDs when applicable, status, committed_at and replay flag; no source body, external reference, HMAC input, customer identity, amount details, token, URL or private text is stored in response_body_bytes.
    response_body_jsonb: Compatibility mirror only; it is parsed from response_body_bytes and is never reserialized as the replay source.
    atomicity: fact graph, every audit/outbox row required by that function, receipt fields and stored response bytes commit in one transaction or all roll back; authoritative commercial/governance functions require both IDs, while nonauthoritative product analytics explicitly stores null audit/outbox IDs and cannot masquerade as an audited receipt
  replay:
    same_request: Verify response and receipt digests, return stored response_body_bytes byte-for-byte with idempotency_replay=true in the decoded SQL composite only, and write zero fact, audit, outbox or receipt rows.
    changed_request: IDEMPOTENCY_CONFLICT with zero mutation and without returning the stored response.
    incomplete_claim: recover only under the same locked transaction/fencing contract; never fabricate success from resource existence.
  scopes:
    ops.record_fx_rate_fact: ECONOMICS.RECORD_FX_RATE_FACT.V1
    ops.record_tariff_version: ECONOMICS.RECORD_TARIFF_VERSION.V1
    ops.record_commercial_contract_period: ECONOMICS.RECORD_COMMERCIAL_CONTRACT_PERIOD.V1
    ops.record_usage_window_receipt_v1: ECONOMICS.RECORD_USAGE_WINDOW_RECEIPT.V1
    ops.record_usage_fact: ECONOMICS.RECORD_USAGE_FACT.V1
    ops.record_discount_decision: ECONOMICS.RECORD_DISCOUNT_DECISION.V1
    ops.record_accounting_correction: ECONOMICS.RECORD_ACCOUNTING_CORRECTION.V1
    ops.materialize_paid_evidence_packet_subject_v1: ECONOMICS.MATERIALIZE_PAID_EVIDENCE_PACKET_SUBJECT.V1
    ops.bind_paid_terminal_receipt_v1: ECONOMICS.BIND_PAID_TERMINAL_RECEIPT.V1

