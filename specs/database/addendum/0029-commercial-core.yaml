      source_window_hmac_key_version: {type: text, nullable: false}
      source_cursor_set_digest: {type: 'char(64)', nullable: false}
      source_record_set_digest: {type: 'char(64)', nullable: false}
      source_signature_digest: {type: 'char(64)', nullable: false}
      meter_policy_version: {type: text, nullable: false}
      meter_policy_digest: {type: 'char(64)', nullable: false}
      measured_at: {type: timestamptz, nullable: false}
      receipt_digest: {type: 'char(64)', nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: usage_window_receipt_root_fk, columns: [root_receipt_id], references: 'ops.usage_window_receipts(id)', on_delete: RESTRICT, deferrable: true}
      - {name: usage_window_receipt_supersedes_fk, columns: [supersedes_receipt_id], references: 'ops.usage_window_receipts(id)', on_delete: RESTRICT}
      - {name: usage_window_receipt_contract_fk, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone], references: 'ops.commercial_contract_periods(id, deployment_id, organization_id, contract_id, sku, accounting_timezone)', on_delete: RESTRICT}
      - {name: usage_window_receipt_tariff_fk, columns: [tariff_version_id, deployment_id, sku, accounting_timezone], references: 'ops.tariff_versions(id, deployment_id, sku, accounting_timezone)', on_delete: RESTRICT}
    unique_constraints:
      - {name: usage_window_receipt_root_version_uq, columns: [root_receipt_id, receipt_version]}
      - {name: usage_window_receipt_identity_version_uq, columns: [deployment_id, organization_id, receipt_kind, meter_kind, measurement_window_digest, receipt_version]}
      - {name: usage_window_receipt_reference_uq, columns: [id, receipt_version, receipt_digest]}
      - {name: usage_window_receipt_digest_uq, columns: [receipt_digest]}
    checks:
      - {name: usage_window_receipt_version_ck, expression: receipt_version > 0}
      - name: usage_window_receipt_chain_ck
        expression: "(receipt_effect = 'ORIGINAL' AND receipt_version = 1 AND root_receipt_id = id AND supersedes_receipt_id IS NULL AND predecessor_receipt_digest IS NULL) OR (receipt_effect IN ('REPLACEMENT','REVERSAL') AND receipt_version > 1 AND root_receipt_id <> id AND supersedes_receipt_id IS NOT NULL AND predecessor_receipt_digest IS NOT NULL)"
      - {name: usage_window_receipt_period_ck, expression: period_start < period_end}
      - {name: usage_window_receipt_count_ck, expression: "expected_item_count >= 0 AND observed_item_count >= 0 AND observed_item_count <= expected_item_count"}
      - name: usage_window_receipt_measurement_ck
        expression: "(receipt_effect <> 'REVERSAL' AND measurement_state = 'COMPLETE' AND observed_item_count = expected_item_count AND observed_quantity IS NOT NULL AND observed_quantity >= 0 AND normalization_input_quantity IS NOT NULL AND normalization_input_quantity >= 0) OR (receipt_effect <> 'REVERSAL' AND measurement_state IN ('PARTIAL','UNKNOWN') AND observed_quantity IS NULL AND normalization_input_quantity IS NULL) OR (receipt_effect = 'REVERSAL' AND measurement_state = 'UNKNOWN' AND observed_quantity IS NULL AND normalization_input_quantity IS NULL)"
      - name: usage_window_receipt_kind_ck
        expression: "(meter_kind = 'SEAT' AND receipt_kind = 'IDENTITY_USAGE_WINDOW' AND unit = 'COUNT' AND normalization_basis_kind = 'ACTIVE_CONTRIBUTOR_COUNT') OR (meter_kind = 'AGENT_TOKEN' AND receipt_kind = 'AGENT_USAGE_WINDOW' AND unit = 'TOKEN' AND normalization_basis_kind = 'AGENT_TOKEN_COUNT') OR (meter_kind = 'MODEL_REQUEST' AND receipt_kind = 'MODEL_USAGE_WINDOW' AND unit = 'REQUEST' AND normalization_basis_kind = 'MODEL_REQUEST_COST_UNIT') OR (meter_kind = 'SOURCE_PAGE' AND receipt_kind = 'SOURCE_USAGE_WINDOW' AND unit = 'PAGE' AND normalization_basis_kind = 'SOURCE_PAGE_COUNT') OR (meter_kind = 'STORAGE_BYTE_HOUR' AND receipt_kind = 'STORAGE_USAGE_WINDOW' AND unit = 'BYTE_HOUR' AND normalization_basis_kind = 'ENCRYPTED_BYTE_HOUR') OR (meter_kind = 'DELIVERY_ATTEMPT' AND receipt_kind = 'DELIVERY_USAGE_WINDOW' AND unit = 'ATTEMPT' AND normalization_basis_kind = 'DELIVERY_ATTEMPT_COUNT') OR (meter_kind = 'EXPORT_BYTE' AND receipt_kind = 'EXPORT_USAGE_WINDOW' AND unit = 'BYTE' AND normalization_basis_kind = 'EXPORT_BYTE_COUNT') OR (meter_kind = 'API_REQUEST' AND receipt_kind = 'API_USAGE_WINDOW' AND unit = 'REQUEST' AND normalization_basis_kind = 'API_RECORD_RETURNED_COUNT')"
      - {name: usage_window_receipt_source_ck, expression: "source_system_id ~ '^[a-z0-9][a-z0-9._-]{0,127}$' AND length(btrim(source_window_hmac_key_version)) BETWEEN 1 AND 100 AND length(btrim(meter_policy_version)) BETWEEN 1 AND 100"}
      - {name: usage_window_receipt_time_ck, expression: measured_at <= created_at}
      - name: usage_window_receipt_digest_ck
        expression: "(predecessor_receipt_digest IS NULL OR predecessor_receipt_digest ~ '^[0-9a-f]{64}$') AND accounting_policy_digest ~ '^[0-9a-f]{64}$' AND measurement_window_digest ~ '^[0-9a-f]{64}$' AND coverage_digest ~ '^[0-9a-f]{64}$' AND source_window_identity_hmac ~ '^[0-9a-f]{64}$' AND source_cursor_set_digest ~ '^[0-9a-f]{64}$' AND source_record_set_digest ~ '^[0-9a-f]{64}$' AND source_signature_digest ~ '^[0-9a-f]{64}$' AND meter_policy_digest ~ '^[0-9a-f]{64}$' AND receipt_digest ~ '^[0-9a-f]{64}$'"
    indexes:
      - {name: usage_window_receipt_one_successor_uq, unique: true, columns: [supersedes_receipt_id], where: supersedes_receipt_id IS NOT NULL}
      - {name: usage_window_receipt_root_history_idx, columns: [root_receipt_id, receipt_version ASC, id ASC]}
      - {name: usage_window_receipt_contract_fk_idx, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone, id]}
      - {name: usage_window_receipt_tariff_fk_idx, columns: [tariff_version_id, deployment_id, sku, accounting_timezone, id]}
      - {name: usage_window_receipt_invoice_idx, columns: [organization_id, period_start ASC, period_end ASC, meter_kind, receipt_version DESC, id ASC]}
      - {name: usage_window_receipt_source_idx, columns: [source_system_id, source_window_identity_hmac, receipt_version DESC, id ASC]}
    trigger_contracts:
      - name: usage_window_receipt_context_and_chain_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - Lock the exact contract and tariff rows; scope, period, SKU, timezone and accounting policy match and the window is wholly contained by both economic intervals.
          - Verify source_signature_digest and the sorted source cursor/record set through the closed receipt-kind adapter; no caller-provided count, quantity, coverage or digest is trusted.
          - ORIGINAL locks deployment+organization+receipt-kind+meter+measurement-window and rejects another root. A successor locks the unique current leaf, inherits every context and source-window identity field, binds predecessor_receipt_digest and increments receipt_version exactly one.
          - COMPLETE proves the closed expected population and normalization input. PARTIAL and UNKNOWN preserve counts and evidence but no quantity; REVERSAL withdraws the prior terminal window and can never be treated as zero usage.
          - API_RECORD_RETURNED_COUNT stores records returned, not request count. MODEL_REQUEST_COST_UNIT binds the exact provider/model conversion catalog input; missing conversion detail makes the receipt UNKNOWN.
      - {name: usage_window_receipt_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: receipt_digest
      canonical_type: UsageWindowReceiptCanonicalV1
      field_order: [schemaVersion, id, rootReceiptId, receiptVersion, receiptEffect, supersedesReceiptId, predecessorReceiptDigest, deploymentId, organizationId, contractPeriodId, contractId, tariffVersionId, sku, accountingTimezone, accountingPolicyDigest, periodStart, periodEnd, measurementWindowDigest, receiptKind, meterKind, unit, measurementState, expectedItemCount, observedItemCount, observedQuantity, normalizationBasisKind, normalizationInputQuantity, coverageDigest, sourceSystemId, sourceWindowIdentityHmac, sourceWindowHmacKeyVersion, sourceCursorSetDigest, sourceRecordSetDigest, sourceSignatureDigest, meterPolicyVersion, meterPolicyDigest, measuredAt]
    write_boundary:
      function: ops.record_usage_window_receipt_v1
      signature: "ops.record_usage_window_receipt_v1(ops.usage_window_receipt_input_v1,text) RETURNS ops.economics_mutation_receipt_v1"
      security: SECURITY DEFINER owned by gurine_migrator
      search_path: pg_catalog, ops, pg_temp
      execute_roles: [gurine_workflow_worker]
      public_execute: revoked
      required_transaction_isolation: SERIALIZABLE
      idempotency_scope: ECONOMICS.RECORD_USAGE_WINDOW_RECEIPT.V1
      atomic_writes: [usage window receipt, audit, commercial.usage_window_receipt_recorded.v1 outbox, immutable receipt and canonical stored response]
    source_producer_registry:
      IDENTITY_USAGE_WINDOW:
        owner: identity-api plus usage-meter
        authoritative_inputs: ops.users current/historical role facts plus successful immutable command/audit receipts in the exact local accounting window
        qualifying_contributor_actions: [CASE_CREATED, EVIDENCE_LINKED, REVIEW_DECISION_RECORDED, ACTION_DECISION_RECORDED, PUBLICATION_REVISION_PUBLISHED, RESPONSE_REVIEWED]
        exclusions: [login, session refresh, page view, search, export download, failed command, bot/service identity, invitation without accepted role, action outside organization or window]
        quantity: Count distinct human user IDs with at least one qualifying action. A later deactivation does not erase an already qualifying month; a user deactivated before the window with no qualifying action contributes zero. The receipt stores only count and keyed set digest, never the user IDs.
      AGENT_USAGE_WINDOW:
        owner: analysis-worker plus usage-meter
        authoritative_inputs: terminal ops.agent_runs and exact provider/tool receipt set
        quantity: Sum nonnegative agent token units from completed, non-fixture, organization-scoped runs; retries and superseded/reconciled duplicates contribute once by effect identity.
      MODEL_USAGE_WINDOW:
        owner: analysis-worker plus usage-meter
        authoritative_inputs: terminal ops.agent_provider_turns with authenticated usage proof
        quantity: Count unique completed provider request effects; normalization_input_quantity is the versioned model cost-unit sum, not raw retry attempts.
      SOURCE_USAGE_WINDOW:
        owner: document-extractor plus usage-meter
        authoritative_inputs: terminal source-document/parser extraction receipts bound to source run and document digest
        quantity: Count successfully processed source pages once per canonical document/page identity; failed, duplicate, fixture and rights-blocked pages contribute zero.
      STORAGE_USAGE_WINDOW:
        owner: storage-meter plus usage-meter
        authoritative_inputs: signed encrypted-object inventory samples with object generation, size, sample interval and retention/suppression state
        quantity: Exact byte-hour integral for live encrypted customer objects; replicas/backups already classified as platform overhead are excluded from customer quantity and remain cost facts.
      DELIVERY_USAGE_WINDOW:
        owner: notification-worker plus usage-meter
        authoritative_inputs: ops.outbound_delivery_attempts and terminal authenticated delivery receipts
        quantity: Count unique externally dispatched attempts by effect key and channel subtype; internal retries before egress, suppressed/cancelled intents and fixture providers contribute zero.
      EXPORT_USAGE_WINDOW:
        owner: workflow-worker plus usage-meter
        authoritative_inputs: completed ops.audit_exports and exact export receipt/object digest
        quantity: Sum delivered encrypted export bytes once per completed export effect; failed, expired, duplicate download and internal projection bytes contribute zero.
      API_USAGE_WINDOW:
        owner: public-api or control-api plus usage-meter
        authoritative_inputs: terminal API query receipts binding operation, authenticated organization, response schema, record count, cursor and response digest
        quantity: observed_quantity is successful request count while normalization_input_quantity is total records returned; cached/replayed idempotent response counts once by request effect and errors contribute zero.
      common_terminal_rule: Each producer closes a bounded signed source set before ops.record_usage_window_receipt_v1. Missing producer proof yields PARTIAL or UNKNOWN with null quantities; no application query may synthesize COMPLETE or zero.
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: period_end plus the bound accounting schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [USAGE_WINDOW_RECEIPT, id, root_receipt_id, organization_id]
      backup_behavior: Preserve immutable receipt; restore revalidates chain, schedule, suppression and hold union before accounting use.
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
      source_body_rule: Raw provider/export/identity bodies may be crypto-erased under their own schedule; typed counts, digests, signature proof and receipt remain.
    repository:
      insert_identity: [root_receipt_id, receipt_version]
      import_lock_order: [contract period, tariff version, source adapter receipt lock, semantic window advisory lock, predecessor leaf, receipt insert, audit chain head, outbox, idempotency finalization]
      detail_order: [id]
      history_order: [root_receipt_id, receipt_version ASC, id ASC]
      window_order: [period_start ASC, period_end ASC, meter_kind ASC, receipt_version DESC, id ASC]
      roundtrip: Every count, nullable quantity, source identity, normalization basis, interval and digest maps exactly; UNKNOWN and explicit zero COMPLETE are distinct.
      errors: [USAGE_RECEIPT_INVALID, USAGE_RECEIPT_CONFLICT]

