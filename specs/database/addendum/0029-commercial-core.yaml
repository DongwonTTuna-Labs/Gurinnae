      - {name: paid_packet_decision_terminal_fk, columns: [decision_receipt_id, decision_proposal_id, decision_proposal_version, decision_approval_digest, decision_receipt_digest, decision_actor_id, decision_kind, decision_conflict_snapshot_digest, decision_record_kind, decision_resulting_proposal_state, decision_decided_at], references: 'ops.action_decisions(id, proposal_id, proposal_version, approval_digest, receipt_digest, actor_id, decision_kind, conflict_snapshot_digest, record_kind, resulting_proposal_state, decided_at)', on_delete: RESTRICT, match: FULL}
