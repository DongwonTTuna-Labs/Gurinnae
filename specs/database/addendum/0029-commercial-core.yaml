      role_binding_hmac_key_version: {type: text, nullable: false}
      economic_buyer_primary_role_binding_hmac: {type: 'char(64)', nullable: false}
      economic_buyer_backup_role_binding_hmac: {type: 'char(64)', nullable: false}
      operational_owner_primary_role_binding_hmac: {type: 'char(64)', nullable: false}
      operational_owner_backup_role_binding_hmac: {type: 'char(64)', nullable: false}
      independent_reviewer_primary_role_binding_hmac: {type: 'char(64)', nullable: false}
      independent_reviewer_backup_role_binding_hmac: {type: 'char(64)', nullable: false}
      source_rights_owner_primary_role_binding_hmac: {type: 'char(64)', nullable: false}
      source_rights_owner_backup_role_binding_hmac: {type: 'char(64)', nullable: false}
      incident_support_owner_primary_role_binding_hmac: {type: 'char(64)', nullable: false}
      incident_support_owner_backup_role_binding_hmac: {type: 'char(64)', nullable: false}
      source_system_id: {type: text, nullable: false}
      source_record_identity_hmac: {type: 'char(64)', nullable: false}
      acquisition_source_receipt_id: {type: uuid, nullable: true}
      acquisition_source_receipt_digest: {type: 'char(64)', nullable: true}
      source_signature_digest: {type: 'char(64)', nullable: false}
      qualification_policy_version: {type: bigint, nullable: false}
      qualification_policy_digest: {type: 'char(64)', nullable: false}
      criterion_set_digest: {type: 'char(64)', nullable: false}
      role_binding_set_digest: {type: 'char(64)', nullable: false}
      evidence_set_digest: {type: 'char(64)', nullable: false}
      reason_code: {type: ops.commercial_qualification_reason, nullable: false}
      receipt_digest: {type: 'char(64)', nullable: false}
      recorded_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: commercial_qualification_root_fk, columns: [root_receipt_id], references: 'ops.commercial_qualification_receipts(id)', on_delete: RESTRICT, deferrable: true}
      - {name: commercial_qualification_supersedes_fk, columns: [supersedes_receipt_id], references: 'ops.commercial_qualification_receipts(id)', on_delete: RESTRICT}
      - {name: commercial_qualification_acquisition_fk, columns: [acquisition_source_receipt_id, acquisition_source_receipt_digest], references: 'ops.acquisition_source_receipts(id,receipt_digest)', on_delete: RESTRICT, match: FULL}
    unique_constraints:
      - {name: commercial_qualification_root_revision_uq, columns: [root_receipt_id, revision]}
      - {name: commercial_qualification_episode_revision_uq, columns: [deployment_id, organization_id, sku, qualification_episode_id, revision]}
      - {name: commercial_qualification_receipt_digest_uq, columns: [receipt_digest]}
      - {name: commercial_qualification_reference_uq, columns: [id, receipt_digest]}
      - {name: commercial_qualification_offer_binding_uq, columns: [id, deployment_id, organization_id, sku, qualification_episode_id, receipt_digest]}
      - {name: commercial_qualification_paid_packet_binding_uq, columns: [id, deployment_id, organization_id, sku, qualification_episode_id, revision, receipt_digest]}
      - {name: commercial_qualification_invalidation_binding_uq, columns: [id, revision, receipt_digest]}
    checks:
      - {name: commercial_qualification_revision_ck, expression: revision > 0 AND qualification_policy_version > 0}
      - {name: commercial_qualification_time_ck, expression: first_qualified_at <= decision_effective_at AND decision_effective_at <= recorded_at}
      - name: commercial_qualification_chain_ck
        expression: "(receipt_effect = 'ORIGINAL' AND revision = 1 AND root_receipt_id = id AND supersedes_receipt_id IS NULL AND predecessor_receipt_digest IS NULL AND first_qualified_at = decision_effective_at AND reason_code = 'QUALIFICATION_ACCEPTED') OR (receipt_effect = 'REPLACEMENT' AND revision > 1 AND root_receipt_id <> id AND supersedes_receipt_id IS NOT NULL AND predecessor_receipt_digest IS NOT NULL AND reason_code = 'SOURCE_CORRECTION') OR (receipt_effect = 'REVERSAL' AND revision > 1 AND root_receipt_id <> id AND supersedes_receipt_id IS NOT NULL AND predecessor_receipt_digest IS NOT NULL AND reason_code = 'SOURCE_REVERSAL')"
      - name: commercial_qualification_criteria_ck
        expression: "(receipt_effect IN ('ORIGINAL','REPLACEMENT') AND recurring_job_attested AND authorized_data_identified AND authorized_data_feasible AND economic_buyer_role_bound AND operational_owner_role_bound AND independent_reviewer_role_bound AND source_rights_owner_role_bound AND incident_support_owner_role_bound AND pilot_scope_accepted AND success_metric_accepted AND budget_authority_accepted AND support_expectation_accepted AND trust_terms_accepted) OR (receipt_effect = 'REVERSAL' AND NOT recurring_job_attested AND NOT authorized_data_identified AND NOT authorized_data_feasible AND NOT economic_buyer_role_bound AND NOT operational_owner_role_bound AND NOT independent_reviewer_role_bound AND NOT source_rights_owner_role_bound AND NOT incident_support_owner_role_bound AND NOT pilot_scope_accepted AND NOT success_metric_accepted AND NOT budget_authority_accepted AND NOT support_expectation_accepted AND NOT trust_terms_accepted)"
      - {name: commercial_qualification_sku_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1'"}
      - {name: commercial_qualification_source_ck, expression: "source_system_id ~ '^[a-z0-9][a-z0-9._-]{0,127}$' AND length(btrim(role_binding_hmac_key_version)) BETWEEN 1 AND 100"}
      - name: commercial_qualification_role_distinct_ck
        expression: economic_buyer_primary_role_binding_hmac <> economic_buyer_backup_role_binding_hmac AND operational_owner_primary_role_binding_hmac <> operational_owner_backup_role_binding_hmac AND independent_reviewer_primary_role_binding_hmac <> independent_reviewer_backup_role_binding_hmac AND source_rights_owner_primary_role_binding_hmac <> source_rights_owner_backup_role_binding_hmac AND incident_support_owner_primary_role_binding_hmac <> incident_support_owner_backup_role_binding_hmac
      - name: commercial_qualification_acquisition_pair_ck
        expression: (acquisition_source_receipt_id IS NULL) = (acquisition_source_receipt_digest IS NULL)
      - name: commercial_qualification_digest_ck
        expression: "(predecessor_receipt_digest IS NULL OR predecessor_receipt_digest ~ '^[0-9a-f]{64}$') AND economic_buyer_primary_role_binding_hmac ~ '^[0-9a-f]{64}$' AND economic_buyer_backup_role_binding_hmac ~ '^[0-9a-f]{64}$' AND operational_owner_primary_role_binding_hmac ~ '^[0-9a-f]{64}$' AND operational_owner_backup_role_binding_hmac ~ '^[0-9a-f]{64}$' AND independent_reviewer_primary_role_binding_hmac ~ '^[0-9a-f]{64}$' AND independent_reviewer_backup_role_binding_hmac ~ '^[0-9a-f]{64}$' AND source_rights_owner_primary_role_binding_hmac ~ '^[0-9a-f]{64}$' AND source_rights_owner_backup_role_binding_hmac ~ '^[0-9a-f]{64}$' AND incident_support_owner_primary_role_binding_hmac ~ '^[0-9a-f]{64}$' AND incident_support_owner_backup_role_binding_hmac ~ '^[0-9a-f]{64}$' AND source_record_identity_hmac ~ '^[0-9a-f]{64}$' AND (acquisition_source_receipt_digest IS NULL OR acquisition_source_receipt_digest ~ '^[0-9a-f]{64}$') AND source_signature_digest ~ '^[0-9a-f]{64}$' AND qualification_policy_digest ~ '^[0-9a-f]{64}$' AND criterion_set_digest ~ '^[0-9a-f]{64}$' AND role_binding_set_digest ~ '^[0-9a-f]{64}$' AND evidence_set_digest ~ '^[0-9a-f]{64}$' AND receipt_digest ~ '^[0-9a-f]{64}$'"
    indexes:
      - {name: commercial_qualification_one_successor_uq, unique: true, columns: [supersedes_receipt_id], where: supersedes_receipt_id IS NOT NULL}
      - {name: commercial_qualification_acquisition_once_uq, unique: true, columns: [acquisition_source_receipt_id, acquisition_source_receipt_digest], where: "receipt_effect = 'ORIGINAL' AND acquisition_source_receipt_id IS NOT NULL"}
      - {name: commercial_qualification_episode_history_idx, columns: [deployment_id, organization_id, sku, qualification_episode_id, decision_effective_at ASC, revision ASC, id ASC]}
      - {name: commercial_qualification_current_lookup_idx, columns: [deployment_id, organization_id, sku, decision_effective_at DESC, revision DESC, id DESC]}
    trigger_contracts:
      - name: commercial_qualification_validate_insert
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - The signed typed importer validates the configured deployment and organization, exact thirteen-criterion digest, five distinct primary/backup role-binding pairs, evidence set, policy, source signature and optional acquisition receipt before insert.
          - ORIGINAL creates a fresh qualification_episode_id and root; REPLACEMENT or REVERSAL locks the unique current leaf, preserves deployment, organization, SKU, episode, first-qualified time, source identity and policy identity, increments revision exactly one and cannot branch.
          - One deployment, organization and SKU has at most one non-reversed episode at any as-of instant; churned or reversed requalification requires a fresh episode and a fresh attribution receipt or explicit unknown-source evidence.
          - Same idempotency identity and canonical bytes replay the stored response; changed bytes return FACT_CONFLICT with zero second row, audit or outbox write.
      - {name: commercial_qualification_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: receipt_digest
      canonical_type: CommercialQualificationReceiptCanonicalV1
      excludes: [recorded_at]
      field_order: [schemaVersion, id, rootReceiptId, revision, receiptEffect, supersedesReceiptId, predecessorReceiptDigest, qualificationEpisodeId, deploymentId, organizationId, sku, decisionEffectiveAt, firstQualifiedAt, recurringJobAttested, authorizedDataIdentified, authorizedDataFeasible, economicBuyerRoleBound, operationalOwnerRoleBound, independentReviewerRoleBound, sourceRightsOwnerRoleBound, incidentSupportOwnerRoleBound, pilotScopeAccepted, successMetricAccepted, budgetAuthorityAccepted, supportExpectationAccepted, trustTermsAccepted, roleBindingHmacKeyVersion, economicBuyerPrimaryRoleBindingHmac, economicBuyerBackupRoleBindingHmac, operationalOwnerPrimaryRoleBindingHmac, operationalOwnerBackupRoleBindingHmac, independentReviewerPrimaryRoleBindingHmac, independentReviewerBackupRoleBindingHmac, sourceRightsOwnerPrimaryRoleBindingHmac, sourceRightsOwnerBackupRoleBindingHmac, incidentSupportOwnerPrimaryRoleBindingHmac, incidentSupportOwnerBackupRoleBindingHmac, sourceSystemId, sourceRecordIdentityHmac, acquisitionSourceReceiptId, acquisitionSourceReceiptDigest, sourceSignatureDigest, qualificationPolicyVersion, qualificationPolicyDigest, criterionSetDigest, roleBindingSetDigest, evidenceSetDigest, reasonCode]
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: decision_effective_at plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [COMMERCIAL_QUALIFICATION_RECEIPT, id, deployment_id, organization_id]
      backup_behavior: preserve the immutable receipt and re-evaluate schedule, suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    write_boundary:
      function: ops.record_commercial_qualification_receipt_v1
      signature: "ops.record_commercial_qualification_receipt_v1(ops.commercial_qualification_receipt_input_v1,text) RETURNS ops.economics_mutation_receipt_v1"
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, pg_temp]
      execute_roles: [gurine_workflow_worker]
      direct_table_writes: forbidden for every runtime role
      atomic_writes: [qualification receipt, idempotency receipt, audit event, canonical stored response]
      outbox_events: []
    repository:
      insert_identity: [id]
      import_lock_order: [idempotency key, deployment and organization advisory key, optional acquisition receipt, episode current leaf, insert, audit chain head]
      detail_order: [id]
      history_order: [root_receipt_id, revision ASC, id ASC]
      as_of_order: [decision_effective_at DESC, revision DESC, id DESC]
      current_rule: The first row in as_of_order at or before the cutoff qualifies the episode only when its effect is ORIGINAL or REPLACEMENT; REVERSAL preserves history and contributes no current qualified episode.
      errors: [COMMERCIAL_QUALIFICATION_INVALID, COMMERCIAL_QUALIFICATION_CONFLICT, FACT_CONFLICT]

  ops.offer_profile_capabilities:
    owner:
