      canonical_type: UsageFactCanonicalV1
      field_order: [schemaVersion, id, rootUsageFactId, revision, factEffect, supersedesUsageFactId, predecessorRecordDigest, deploymentId, organizationId, contractPeriodId, contractId, tariffVersionId, sku, accountingTimezone, accountingPolicyDigest, periodStart, periodEnd, measurementWindowDigest, measurementState, expectedItemCount, observedItemCount, coverageDigest, meterKind, unit, quantity, billableMetric, billableQuantity, billableUnit, conversionPolicyDigest, sourceReceiptKind, sourceReceiptId, sourceReceiptVersion, sourceReceiptDigest, meterPolicyVersion, meterPolicyDigest, measuredAt]
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: period_end and terminal invoice reconciliation plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [USAGE_FACT, id, organization_id, source_receipt_id]
      backup_behavior: preserve immutable fact and re-evaluate schedule, restoration suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository:
      insert_identity: [root_usage_fact_id, revision]
      import_lock_order: [contract period, tariff version, typed source receipt, semantic usage identity advisory lock, usage insert, audit chain head, outbox]
      detail_order: [id]
      invoice_window_order: [period_start ASC, period_end ASC, meter_kind ASC, id ASC]
      source_history_order: [source_receipt_version ASC, id ASC]
      lifecycle_order: [root_usage_fact_id, revision ASC, id ASC]
      invoice_close_barrier: For every required meter, terminal leaves tile the exact invoice period under one meter policy with no overlap or unproved gap; all are COMPLETE and their ordered window/coverage/record digest set is bound into the invoice reconciliation digest.
      roundtrip: Source and billable quantities, both units, conversion policy, receipt, interval and meter policy map exactly; repository never equates API request count with API Record Units or fills missing conversion with zero.
      errors: [USAGE_FACT_DUPLICATE, USAGE_METER_UNKNOWN]

