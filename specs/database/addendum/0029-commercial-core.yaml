      - {name: usage_fact_tariff_fk_idx, columns: [tariff_version_id, deployment_id, sku, accounting_timezone, id]}
      - {name: usage_fact_source_receipt_fk_idx, columns: [source_receipt_id, source_receipt_version, source_receipt_digest, id]}
    trigger_contracts:
      - name: usage_fact_context_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - Lock contract_period_id then tariff_version_id; deployment, organization, contract, SKU, accounting_timezone, accounting_policy_digest and tariff IDs equal the row.
          - Contract row is the unique terminal leaf with status ACTIVE and provisioning_state PROVISIONED; usage interval is wholly contained by both contract and tariff half-open intervals.
          - Lock the exact ops.usage_window_receipts row through the composite FK; its kind, ID, version, digest, deployment, organization, contract, tariff, meter, interval, measurement state, quantities, coverage, policy and window digest must equal the fact. It must be the unique current chain leaf. Missing, stale, superseded, reversed or scope-mismatched evidence rejects the insert.
          - ORIGINAL acquires a semantic organization+meter+window lock and rejects another root with the same or overlapping window. REPLACEMENT or REVERSAL locks the unique current leaf, binds its record digest, inherits the window/context identity and increments revision exactly one.
          - Zero usage is an explicit terminal fact with a terminal source receipt; a missing required meter receipt is UNKNOWN and blocks invoice reconciliation, never inferred zero.
          - quantity/unit is the source meter observation. billable_quantity/unit is the deterministic normalized value under conversion_policy_digest before included quota, block rounding, discount or invoice arithmetic; neither is rewritten.
          - For API_REQUEST, billable_quantity is normalized records returned divided by 1,000, never request count. For processing meters, the versioned job/provider catalog determines credits. Missing conversion input is UNKNOWN and blocks invoicing.
      - {name: usage_fact_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
