supporting_validation_function_catalog:
  owner: gurine_migrator
  security: SECURITY DEFINER is forbidden; validators are immutable or stable pure checks with SET search_path = pg_catalog, ops, extensions, pg_temp
  acl: REVOKE ALL FROM PUBLIC and every runtime role; CHECK constraints invoke them through table ownership only
