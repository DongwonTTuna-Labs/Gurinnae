      - {name: usage_fact_interval_ck, expression: period_start < period_end}
      - {name: usage_fact_timezone_ck, expression: length(btrim(accounting_timezone)) BETWEEN 1 AND 63}
      - {name: usage_fact_counts_ck, expression: expected_item_count >= 0 AND observed_item_count >= 0 AND observed_item_count <= expected_item_count}
      - name: usage_fact_measurement_state_ck
        expression: "((measurement_state = 'COMPLETE' AND fact_effect <> 'REVERSAL' AND observed_item_count = expected_item_count AND quantity IS NOT NULL AND quantity >= 0 AND billable_quantity IS NOT NULL AND billable_quantity >= 0) OR (measurement_state IN ('PARTIAL','UNKNOWN') AND quantity IS NULL AND billable_quantity IS NULL) OR (fact_effect = 'REVERSAL' AND measurement_state = 'UNKNOWN' AND quantity IS NULL AND billable_quantity IS NULL)) IS TRUE"
      - {name: usage_fact_receipt_version_ck, expression: source_receipt_version > 0}
      - name: usage_fact_unit_ck
        expression: "(meter_kind = 'SEAT' AND unit = 'COUNT' AND source_receipt_kind = 'IDENTITY_USAGE_WINDOW' AND billable_metric = 'ACTIVE_CONTRIBUTOR' AND billable_unit = 'CONTRIBUTOR_MONTH') OR (meter_kind = 'AGENT_TOKEN' AND unit = 'TOKEN' AND source_receipt_kind = 'AGENT_USAGE_WINDOW' AND billable_metric = 'PROCESSING_CREDIT' AND billable_unit = 'CREDIT') OR (meter_kind = 'MODEL_REQUEST' AND unit = 'REQUEST' AND source_receipt_kind = 'MODEL_USAGE_WINDOW' AND billable_metric = 'PROCESSING_CREDIT' AND billable_unit = 'CREDIT') OR (meter_kind = 'SOURCE_PAGE' AND unit = 'PAGE' AND source_receipt_kind = 'SOURCE_USAGE_WINDOW' AND billable_metric = 'PROCESSING_CREDIT' AND billable_unit = 'CREDIT') OR (meter_kind = 'STORAGE_BYTE_HOUR' AND unit = 'BYTE_HOUR' AND source_receipt_kind = 'STORAGE_USAGE_WINDOW' AND billable_metric = 'STORAGE_GB_MONTH' AND billable_unit = 'GB_MONTH') OR (meter_kind = 'DELIVERY_ATTEMPT' AND unit = 'ATTEMPT' AND source_receipt_kind = 'DELIVERY_USAGE_WINDOW' AND billable_metric = 'INCLUDED_DELIVERY' AND billable_unit = 'ATTEMPT') OR (meter_kind = 'EXPORT_BYTE' AND unit = 'BYTE' AND source_receipt_kind = 'EXPORT_USAGE_WINDOW' AND billable_metric = 'INCLUDED_EXPORT' AND billable_unit = 'BYTE') OR (meter_kind = 'API_REQUEST' AND unit = 'REQUEST' AND source_receipt_kind = 'API_USAGE_WINDOW' AND billable_metric = 'API_RECORD_UNIT' AND billable_unit = 'KILO_RECORDS')"
