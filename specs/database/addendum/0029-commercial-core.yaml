repository_acceptance:
  common_case_id_pattern: AC-OA-TABLE-OPS-<TABLE>-CONTRACT
  per_table:
    - insert every required field with nondefault boundary values and read by typed SQLx column list without SELECT star
    - same identity and digest replays one stored row; changed digest returns FACT_CONFLICT and inserts zero audit or outbox rows
    - unknown enum, uppercase or malformed digest, invalid currency, invalid interval, missing FK and precision overflow fail
    - UPDATE and DELETE fail through both privilege and immutable trigger paths
    - workflow insert/select and control/projector/auditor select succeed; every other role and PUBLIC fail
    - multi-row query output equals its declared complete order under tied timestamps, dates and sequence values
    - active RETENTION, DELETION or DISCLOSURE hold blocks the corresponding lifecycle/export action without granting read access; immutable accounting facts have no delete lifecycle even after schedule expiry
    - required-column deletion causes mapper failure; null is distinguished from absent and no domain value is synthesized
  concurrency:
    - 64 simultaneous same FX, tariff, contract, usage, discount or correction identity imports produce one fact and 63 exact replays or typed conflicts
    - overlapping tariff, contract and discount races have one winner
    - correction and supersession races preserve a single successor and a gapless target sequence

runtime_oracles:
  catalog:
    - The eight relation names above exist as pg_class relkind r, are owned by gurine_migrator, and occur exactly once in the 0029 migration ownership set.
    - Every declared column has exact PostgreSQL type, typmod, nullability, default or generated expression and ordinal position; undeclared columns fail the gate.
    - Every named primary, unique, foreign and check constraint is validated, and every named index has exact uniqueness, key order, expression and predicate.
    - The accounting-correction migration order is after cost allocations, usage, invoice, invoice-line and revenue facts; all concrete FKs resolve without NOT VALID residue.
  privileges:
    - PUBLIC has no schema-derived table privilege and no runtime role owns an object.
    - gurine_workflow_worker, gurine_control_api and gurine_auditor have exactly SELECT on the eight relations; direct INSERT is revoked and workflow writes only through the named typed functions. gurine_public_projector and all other runtime roles have no table privilege.
    - UPDATE, DELETE and TRUNCATE fail for every runtime role; owner-issued update/delete canaries fail through ops.reject_mutation.
    - relrowsecurity and relforcerowsecurity are false for these eight relations, while a negative probe proves that another deployment database credential has no connection or schema path.
  digest_and_numeric:
    - Uppercase, short, long and nonhex digests are rejected for every digest column.
    - numeric(24,6) round-trips maximum in-range positive and negative correction values and rejects precision overflow; FX numeric(30,12) round-trips without float conversion.
    - Recomputed schema-tagged canonical digest equals the stored digest for every fixture; removing any required field changes the digest and fails typed mapping.
  fx:
    - Same-currency conversion returns no FX fact; missing, stale, withdrawn or policy-mismatched rates block rather than use zero or 1.0.
    - Inverse and cross rates are not synthesized. Exact source-to-target quote and one HALF_EVEN rounding produce the expected numeric(24,6) amount.
    - Replacement and withdrawal require a unique current leaf and gapless revision. A 64-client successor race produces one winner and no branch.
    - A replacement changes future selection only; a historical settled fact remains bound to its original rate ID and sha256 until an AccountingCorrection is appended.
  commercial_intervals:
    - Tariff intervals for deployment+SKU do not overlap; contract periods in a deployment do not overlap; adjacency succeeds.
    - Exact accounting_timezone exists in pg_timezone_names, local-midnight bounds round-trip without ambiguity, and the same accounting_policy_digest is bound across tariff, contract, usage, discount, invoice, revenue, cost and correction facts.
    - A contract period is wholly covered by its exact tariff and matches configured deployment, organization, SKU, currency, accounting timezone and policy; binding committed amount recomputes exactly from tariff, SLA selection and commitment policy.
    - Usage is wholly covered by contract and tariff, maps the exact meter-kind/unit/receipt-kind triple and has terminal receipt proof; explicit zero differs from missing UNKNOWN.
    - Distinct discount roots may coexist only when component scopes are disjoint; a shared component and overlapping interval has one winner under concurrent insertion.
  accounting_correction:
    - num_nonnulls concrete targets equals one and target_fact_id/kind/digest/currency/interval/scope match the locked target.
    - ADJUSTMENT, REPLACEMENT and REVERSAL shapes are exhaustive; explicit effective_delta is trigger-verified against the locked root chain, and reversal contributes the exact negative cumulative prior root delta.
    - Each root has one terminal leaf, each target has a gapless correction_sequence, and effective value equals original plus terminal nonreversed leaf deltas in the declared order.
    - Historical invoice/allocation/export receipts remain bound to their ordered correction-set digest; restatement produces a new receipt and never mutates the old one.
  retention_and_hold:
    - Missing or stale COMMERCIAL_ACCOUNTING_FACT schedule preserves every row and opens review.
    - RETENTION or DELETION coverage prevents terminal source-body handling; DISCLOSURE coverage prevents export/model/public projection; no hold grants read privilege.
    - Restore re-applies suppression, current schedule and unioned active hold cells before the fact or referenced source becomes readable.
