    checks:
      - {name: paid_packet_version_ck, expression: "packet_version IN (1,2) AND qualification_episode_version > 0 AND commercial_contract_version > 0 AND review_snapshot_version > 0 AND member_count = 10"}
      - {name: paid_packet_sku_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1'"}
      - name: paid_packet_subject_shape_ck
        expression: "(subject_kind = 'AUDITED_DELIVERY' AND num_nonnulls(subject_delivery_id,subject_rendering_digest,subject_authorization_snapshot_digest) = 3 AND num_nonnulls(decision_cycle_id,decision_cycle_version,decision_cycle_digest) = 0) OR (subject_kind = 'COMPLETED_DECISION_CYCLE' AND num_nonnulls(decision_cycle_id,decision_cycle_version,decision_cycle_digest) = 3 AND decision_cycle_version > 0 AND num_nonnulls(subject_delivery_id,subject_rendering_digest,subject_authorization_snapshot_digest) = 0)"
      - name: paid_packet_version_one_shape_ck
        expression: "packet_version <> 1 OR (state = 'AWAITING_TERMINAL_BINDING' AND predecessor_packet_version IS NULL AND predecessor_packet_record_digest IS NULL AND num_nonnulls(terminal_receipt_kind,terminal_receipt_id,terminal_receipt_version,terminal_receipt_digest,terminal_resulting_state,terminal_applied,terminal_binding_digest,terminal_effective_at,delivery_receipt_id,delivery_id,delivery_receipt_sequence,delivery_receipt_digest,delivery_resulting_state,delivery_applied,decision_receipt_id,decision_proposal_id,decision_proposal_version,decision_approval_digest,decision_receipt_digest,decision_actor_id,decision_kind,decision_conflict_snapshot_digest,execution_receipt_id,execution_id,execution_generation,execution_receipt_sequence,execution_receipt_digest,execution_receipt_kind,execution_aggregate_state,execution_mutates_aggregate_state,final_packet_payload,final_packet_canonical,packet_digest_preimage_canonical,packet_digest,outcome_fact_id,outcome_fact_digest,finalized_at,invalidation_reason,invalidation_evidence_digest,invalidated_at,outcome_audit_event_id,outcome_outbox_id) = 0 AND packet_outbox_id IS NOT NULL)"
      - name: paid_packet_version_two_chain_ck
        expression: "packet_version <> 2 OR (predecessor_packet_version = 1 AND predecessor_packet_record_digest IS NOT NULL AND state IN ('FINALIZED','INVALIDATED'))"
      - name: paid_packet_finalized_shape_ck
        expression: >-
          state <> 'FINALIZED' OR (packet_version = 2 AND num_nonnulls(terminal_receipt_kind,terminal_receipt_id,terminal_receipt_version,terminal_receipt_digest,terminal_resulting_state,terminal_applied,terminal_binding_digest,terminal_effective_at,final_packet_payload,final_packet_canonical,packet_digest_preimage_canonical,packet_digest,outcome_fact_id,outcome_fact_digest,finalized_at,outcome_audit_event_id,outcome_outbox_id) = 17 AND terminal_applied = true AND packet_outbox_id IS NOT NULL AND num_nonnulls(invalidation_reason,invalidation_evidence_digest,invalidated_at) = 0 AND ((terminal_receipt_kind = 'OUTBOUND_DELIVERY' AND subject_kind = 'AUDITED_DELIVERY' AND terminal_resulting_state IN ('DELIVERED','READ') AND num_nonnulls(delivery_receipt_id,delivery_id,delivery_receipt_sequence,delivery_receipt_digest,delivery_resulting_state,delivery_applied) = 6 AND delivery_id = subject_delivery_id AND delivery_receipt_id = terminal_receipt_id AND delivery_receipt_sequence = terminal_receipt_version AND delivery_receipt_digest = terminal_receipt_digest AND delivery_resulting_state = terminal_resulting_state::text AND delivery_applied = true AND num_nonnulls(decision_receipt_id,decision_proposal_id,decision_proposal_version,decision_approval_digest,decision_receipt_digest,decision_actor_id,decision_kind,decision_conflict_snapshot_digest,execution_receipt_id,execution_id,execution_generation,execution_receipt_sequence,execution_receipt_digest,execution_receipt_kind,execution_aggregate_state,execution_mutates_aggregate_state) = 0) OR (terminal_receipt_kind = 'ORGANIZATION_DECISION' AND subject_kind = 'COMPLETED_DECISION_CYCLE' AND terminal_resulting_state = 'REJECTED_FINAL' AND num_nonnulls(decision_receipt_id,decision_proposal_id,decision_proposal_version,decision_approval_digest,decision_receipt_digest,decision_actor_id,decision_kind,decision_conflict_snapshot_digest) = 8 AND decision_receipt_id = terminal_receipt_id AND decision_proposal_id = decision_cycle_id AND decision_proposal_version = terminal_receipt_version AND decision_proposal_version = decision_cycle_version AND decision_approval_digest = decision_cycle_digest AND decision_receipt_digest = terminal_receipt_digest AND decision_kind = 'REJECT' AND num_nonnulls(delivery_receipt_id,delivery_id,delivery_receipt_sequence,delivery_receipt_digest,delivery_resulting_state,delivery_applied,execution_receipt_id,execution_id,execution_generation,execution_receipt_sequence,execution_receipt_digest,execution_receipt_kind,execution_aggregate_state,execution_mutates_aggregate_state) = 0) OR (terminal_receipt_kind = 'ORGANIZATION_DECISION' AND subject_kind = 'COMPLETED_DECISION_CYCLE' AND terminal_resulting_state = 'EFFECT_SUCCEEDED' AND num_nonnulls(execution_receipt_id,execution_id,execution_generation,execution_receipt_sequence,execution_receipt_digest,execution_receipt_kind,execution_aggregate_state,execution_mutates_aggregate_state) = 8 AND execution_receipt_id = terminal_receipt_id AND execution_receipt_sequence = terminal_receipt_version AND execution_receipt_digest = terminal_receipt_digest AND execution_receipt_kind = 'EFFECT_SUCCEEDED' AND execution_aggregate_state = 'SUCCEEDED' AND execution_mutates_aggregate_state = true AND num_nonnulls(delivery_receipt_id,delivery_id,delivery_receipt_sequence,delivery_receipt_digest,delivery_resulting_state,delivery_applied,decision_receipt_id,decision_proposal_id,decision_proposal_version,decision_approval_digest,decision_receipt_digest,decision_actor_id,decision_kind,decision_conflict_snapshot_digest) = 0)))
      - name: paid_packet_invalidated_shape_ck
        expression: "state <> 'INVALIDATED' OR (packet_version = 2 AND num_nonnulls(invalidation_reason,invalidation_evidence_digest,invalidated_at) = 3 AND num_nonnulls(terminal_receipt_kind,terminal_receipt_id,terminal_receipt_version,terminal_receipt_digest,terminal_resulting_state,terminal_applied,terminal_binding_digest,terminal_effective_at,delivery_receipt_id,delivery_id,delivery_receipt_sequence,delivery_receipt_digest,delivery_resulting_state,delivery_applied,decision_receipt_id,decision_proposal_id,decision_proposal_version,decision_approval_digest,decision_receipt_digest,decision_actor_id,decision_kind,decision_conflict_snapshot_digest,execution_receipt_id,execution_id,execution_generation,execution_receipt_sequence,execution_receipt_digest,execution_receipt_kind,execution_aggregate_state,execution_mutates_aggregate_state,final_packet_payload,final_packet_canonical,packet_digest_preimage_canonical,packet_digest,outcome_fact_id,outcome_fact_digest,finalized_at,outcome_audit_event_id,outcome_outbox_id) = 0 AND packet_outbox_id IS NULL)"
      - name: paid_packet_binding_event_shape_ck
        expression: "(packet_version = 1 AND num_nonnulls(binding_source_event_id,binding_source_event_envelope_digest,binding_logical_consumer) = 0) OR (packet_version = 2 AND num_nonnulls(binding_source_event_id,binding_source_event_envelope_digest,binding_logical_consumer) = 3 AND length(btrim(binding_logical_consumer)) BETWEEN 1 AND 100)"
      - name: paid_packet_execution_cycle_shape_ck
        expression: "(execution_receipt_id IS NULL AND num_nonnulls(execution_proposal_id,execution_proposal_version,execution_approval_digest) = 0) OR (execution_receipt_id IS NOT NULL AND num_nonnulls(execution_proposal_id,execution_proposal_version,execution_approval_digest) = 3 AND execution_proposal_id=decision_cycle_id AND execution_proposal_version=decision_cycle_version AND execution_approval_digest=decision_cycle_digest)"
      - name: paid_packet_terminal_time_proof_shape_ck
        expression: "(terminal_receipt_kind IS NULL AND num_nonnulls(delivery_projection_disposition,delivery_resulting_proof_level,delivery_observed_at,decision_record_kind,decision_resulting_proposal_state,decision_decided_at,execution_observed_at)=0) OR (terminal_receipt_kind='OUTBOUND_DELIVERY' AND delivery_projection_disposition='APPLIED' AND delivery_resulting_proof_level=terminal_resulting_state::text AND delivery_observed_at=terminal_effective_at AND num_nonnulls(decision_record_kind,decision_resulting_proposal_state,decision_decided_at,execution_observed_at)=0) OR (terminal_receipt_kind='ORGANIZATION_DECISION' AND terminal_resulting_state='REJECTED_FINAL' AND decision_record_kind='DECISION' AND decision_resulting_proposal_state='REJECTED' AND decision_decided_at=terminal_effective_at AND num_nonnulls(delivery_projection_disposition,delivery_resulting_proof_level,delivery_observed_at,execution_observed_at)=0) OR (terminal_receipt_kind='ORGANIZATION_DECISION' AND terminal_resulting_state='EFFECT_SUCCEEDED' AND execution_observed_at=terminal_effective_at AND num_nonnulls(delivery_projection_disposition,delivery_resulting_proof_level,delivery_observed_at,decision_record_kind,decision_resulting_proposal_state,decision_decided_at)=0)"
      - name: paid_packet_invalidation_authority_shape_ck
        expression: "(state = 'INVALIDATED' AND num_nonnulls(invalidation_authority_kind,invalidation_authority_id,invalidation_authority_version,invalidation_authority_digest) = 4 AND invalidation_authority_version > 0) OR (state <> 'INVALIDATED' AND num_nonnulls(invalidation_authority_kind,invalidation_authority_id,invalidation_authority_version,invalidation_authority_digest) = 0)"
      - name: paid_packet_digest_ck
        expression: "qualification_episode_digest ~ '^[0-9a-f]{64}$' AND commercial_contract_digest ~ '^[0-9a-f]{64}$' AND review_snapshot_digest ~ '^[0-9a-f]{64}$' AND review_member_set_digest ~ '^[0-9a-f]{64}$' AND paid_member_manifest_digest ~ '^[0-9a-f]{64}$' AND source_event_envelope_digest ~ '^[0-9a-f]{64}$' AND packet_subject_digest ~ '^[0-9a-f]{64}$' AND member_set_digest ~ '^[0-9a-f]{64}$' AND operation_receipt_digest ~ '^[0-9a-f]{64}$' AND packet_record_digest ~ '^[0-9a-f]{64}$' AND (binding_source_event_envelope_digest IS NULL OR binding_source_event_envelope_digest ~ '^[0-9a-f]{64}$') AND (predecessor_packet_record_digest IS NULL OR predecessor_packet_record_digest ~ '^[0-9a-f]{64}$') AND (terminal_receipt_digest IS NULL OR terminal_receipt_digest ~ '^[0-9a-f]{64}$') AND (terminal_binding_digest IS NULL OR terminal_binding_digest ~ '^[0-9a-f]{64}$') AND (packet_digest IS NULL OR packet_digest ~ '^[0-9a-f]{64}$') AND (outcome_fact_digest IS NULL OR outcome_fact_digest ~ '^[0-9a-f]{64}$') AND (invalidation_evidence_digest IS NULL OR invalidation_evidence_digest ~ '^[0-9a-f]{64}$') AND (invalidation_authority_digest IS NULL OR invalidation_authority_digest ~ '^[0-9a-f]{64}$')"
      - name: paid_packet_canonical_ck
        expression: "ops.paid_evidence_packet_subject_binding_v1_is_valid(subject_binding_payload) AND convert_from(subject_binding_canonical,'UTF8')::jsonb = subject_binding_payload AND ops.paid_evidence_packet_storage_record_v1_is_valid(packet_record_payload) AND convert_from(packet_record_canonical,'UTF8')::jsonb = packet_record_payload AND packet_record_digest = encode(extensions.digest(packet_record_digest_preimage_canonical,'sha256'),'hex') AND packet_record_payload->>'packetRecordDigest' = packet_record_digest AND (packet_digest IS NULL OR (ops.paid_evidence_packet_v1_is_valid(final_packet_payload) AND convert_from(final_packet_canonical,'UTF8')::jsonb = final_packet_payload AND packet_digest = encode(extensions.digest(packet_digest_preimage_canonical,'sha256'),'hex') AND final_packet_payload->>'packetDigest' = packet_digest))"
    indexes:
      - {name: paid_packet_one_successor_uq, unique: true, columns: [packet_id], where: "packet_version = 2"}
      - {name: paid_packet_terminal_uq, unique: true, columns: [terminal_receipt_kind, terminal_receipt_id, terminal_receipt_version, terminal_receipt_digest], where: "state = 'FINALIZED'"}
      - {name: paid_packet_subject_source_event_uq, unique: true, columns: [source_event_id, source_event_envelope_digest], where: "packet_version = 1"}
      - {name: paid_packet_delivery_subject_uq, unique: true, columns: [subject_delivery_id], where: "packet_version = 1 AND subject_kind = 'AUDITED_DELIVERY'"}
      - {name: paid_packet_decision_subject_uq, unique: true, columns: [decision_cycle_id, decision_cycle_version, decision_cycle_digest], where: "packet_version = 1 AND subject_kind = 'COMPLETED_DECISION_CYCLE'"}
      - {name: paid_packet_binding_inbox_uq, unique: true, columns: [binding_logical_consumer, binding_source_event_id, binding_source_event_envelope_digest], where: "packet_version = 2"}
      - {name: paid_packet_awaiting_idx, columns: [state, created_at, packet_id], where: "state = 'AWAITING_TERMINAL_BINDING'"}
      - {name: paid_packet_contract_idx, columns: [commercial_contract_id, commercial_contract_version, packet_version, packet_id]}
      - {name: paid_packet_qualification_idx, columns: [qualification_receipt_id, qualification_episode_version, packet_version, packet_id]}
    trigger_contracts:
      - name: paid_packet_validate_insert
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - Version 1 is inserted only by ops.materialize_paid_evidence_packet_subject_v1 after locking the exact current non-REVERSAL qualification, immutable contract OfferProfile tuple, approved review snapshot and all ten source candidate graphs. It recomputes subject and ordered member-set digests in PostgreSQL.
          - Version 2 locks version 1, all ten members and one exact resolver graph. Missing, ambiguous, queued, running, PROVIDER_ACCEPTED, retryable or reconciliation-required evidence leaves version 1 unchanged and cannot become INVALIDATED.
          - FINALIZED accepts only applied DELIVERED or READ for the exact AUDITED_DELIVERY subject, or REJECTED_FINAL/EFFECT_SUCCEEDED for the exact COMPLETED_DECISION_CYCLE subject. The function also proves current generation, no later decision/withdrawal, final reviewer assignment, correction head, contract interval and organization parity.
          - Digest order is packet_digest, then outcome fact digest including packet_digest, then packet_record_digest including the exact outcome ID/digest. No preimage contains a digest that depends transitively on itself.
          - Version 2, ORIGINAL outcome fact, packet and outcome audit rows, required outbox rows, inbox terminal result and exact stored response commit atomically. Exact event/idempotency replay writes zero; changed bytes return EVENT_REPLAY_CONFLICT or IDEMPOTENCY_CONFLICT.
      - {name: paid_packet_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      packet_subject: GURINE_CANONICAL_JSON_V1 SHA-256 over exact organization, qualification, contract, review snapshot, typed subject and ordered ten-member candidate bindings; excludes all later terminal, outcome and storage fields
      final_packet: PaidEvidencePacketV1 excluding only packetDigest
      storage_record: PaidEvidencePacketStorageRecordV1 excluding only packetRecordDigest
      dependency_order: [packet_subject_digest, member_set_digest, terminal_binding_digest, packet_digest, outcome_fact_digest, packet_record_digest, operation_receipt_digest, outbox_payload_digest]
    invalidation_authority_registry:
      COMMERCIAL_QUALIFICATION_RECEIPT: {target: ops.commercial_qualification_receipts, candidate_key: [id, revision, receipt_digest], allowed_reason: QUALIFICATION_REVERSED, required_state: receipt_effect = REVERSAL}
      COMMERCIAL_CONTRACT_PERIOD: {target: ops.commercial_contract_periods, candidate_key: [id, revision, record_digest], allowed_reason: CONTRACT_REPLACED, required_state: fact_effect = REPLACEMENT with changed economic root or terminal contract correction}
      OUTCOME_FACT_CORRECTION: {target: ops.outcome_facts, candidate_key: [id, correction_sequence, fact_digest], allowed_reason: SUBJECT_CORRECTED, required_state: current correction head definitively invalidates the frozen subject}
      REVIEW_SNAPSHOT: {target: editorial.review_snapshots, candidate_key: [id, case_version, snapshot_sha256, paid_evidence_member_manifest_digest], allowed_reason: MEMBER_AUTHORITY_REVERSED, required_state: exact replacement snapshot proves one frozen leaf authority reversed}
      TERMINAL_RECEIPT: {target: closed terminal resolver registry, candidate_key: exact branch candidate key and digest, allowed_reason: TERMINAL_SUBJECT_MISMATCH, required_state: immutable resolver evidence proves the receipt can never match the frozen subject}
      enforcement: ops.invalidate_paid_evidence_packet_v1 dispatches by the closed enum, locks the exact native candidate key, verifies reason/state/version/digest and inserts version 2 plus audit and inbox terminal result. A generic digest, missing authority row, stale/ambiguous evidence or recoverable terminal gap cannot invalidate.
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      schedule_binding: longest of qualification, contract, review snapshot, outcome and terminal-receipt authorities
      legal_hold_key: [PAID_EVIDENCE_PACKET, packet_id, packet_version, organization_id]
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    write_boundary:
      materialize_function: ops.materialize_paid_evidence_packet_subject_v1
      bind_function: ops.bind_paid_terminal_receipt_v1
      signature: "ops.bind_paid_terminal_receipt_v1(ops.paid_terminal_binding_input_v1,text) RETURNS ops.economics_mutation_receipt_v1"
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, editorial, core, raw, intake, extensions, pg_temp]
      execute_roles: [gurine_workflow_worker]
      direct_table_writes: forbidden for every runtime role
    repository:
      insert_identity: [packet_id, packet_version]
      history_order: [packet_id, packet_version ASC]
      awaiting_order: [created_at ASC, packet_id ASC]
      errors: [PAID_PACKET_INVALID, PAID_PACKET_TERMINAL_NOT_READY, PAID_PACKET_TERMINAL_MISMATCH, EVENT_REPLAY_CONFLICT, FACT_CONFLICT]

  ops.paid_evidence_packet_members:
    owner:
      logical_component: paid-evidence-materializer
      physical_service: workflow-worker
      rust_type: gurine_domain::economics::PaidEvidencePacketMember
      repository: crates/persistence-postgres::paid_evidence_packet_members
    creation_order: 24
    columns:
      packet_id: {type: uuid, nullable: false}
      packet_version: {type: bigint, nullable: false}
      packet_subject_digest: {type: 'char(64)', nullable: false}
      packet_member_set_digest: {type: 'char(64)', nullable: false}
      member_ordinal: {type: smallint, nullable: false}
      category: {type: ops.paid_evidence_member_category, nullable: false}
      source_set_id: {type: uuid, nullable: false}
      source_set_version: {type: bigint, nullable: false}
      source_set_digest: {type: 'char(64)', nullable: false}
      disposition_kind: {type: text, nullable: true}
      member_payload: {type: jsonb, nullable: false, logical_type: PaidEvidencePacketMemberInputV1}
      member_canonical: {type: bytea, nullable: false, logical_type: GURINE_CANONICAL_JSON_V1<PaidEvidencePacketMemberInputV1>}
      member_digest_preimage_canonical: {type: bytea, nullable: false, logical_type: GURINE_CANONICAL_JSON_V1<PaidEvidencePacketMemberInputV1 excluding memberDigest>}
      member_record_digest: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(member_digest_preimage_canonical,'sha256'),'hex')"}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [packet_id, packet_version, member_ordinal]
    foreign_keys:
      - {name: paid_packet_member_parent_fk, columns: [packet_id, packet_version, packet_subject_digest, packet_member_set_digest], references: 'ops.paid_evidence_packets(packet_id, packet_version, packet_subject_digest, member_set_digest)', on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
    unique_constraints:
      - {name: paid_packet_member_category_uq, columns: [packet_id, packet_version, category]}
      - {name: paid_packet_member_record_digest_uq, columns: [packet_id, packet_version, member_record_digest]}
      - {name: paid_packet_member_source_uq, columns: [packet_id, packet_version, category, source_set_id, source_set_version, source_set_digest]}
    checks:
      - {name: paid_packet_member_version_ordinal_ck, expression: "packet_version = 1 AND member_ordinal BETWEEN 0 AND 9 AND source_set_version > 0"}
      - name: paid_packet_member_category_ordinal_ck
        expression: "(member_ordinal,category) IN ((0,'AUTHORIZED_DATASET_SNAPSHOT'),(1,'SOURCE_RIGHTS'),(2,'CAPABILITY_ACTIVATION'),(3,'EXTRACTION_AND_TRANSFORMATION_LINEAGE'),(4,'REPRODUCTION_AND_COMPARISON_INPUT'),(5,'SUPPORTING_CONTRARY_AND_LOCATOR_EVIDENCE'),(6,'FRESHNESS_LIMITATION_DISAGREEMENT_AND_UNKNOWN_DISCLOSURE'),(7,'AI_PROVENANCE_WHEN_CONTRIBUTED'),(8,'HUMAN_DECISION'),(9,'INDEPENDENT_REVIEW_OR_POLICY_NOT_REQUIRED'))"
      - name: paid_packet_member_disposition_ck
        expression: "(category NOT IN ('AI_PROVENANCE_WHEN_CONTRIBUTED','INDEPENDENT_REVIEW_OR_POLICY_NOT_REQUIRED') AND disposition_kind IS NULL) OR (category = 'AI_PROVENANCE_WHEN_CONTRIBUTED' AND disposition_kind IN ('CONTRIBUTED','DID_NOT_CONTRIBUTE')) OR (category = 'INDEPENDENT_REVIEW_OR_POLICY_NOT_REQUIRED' AND disposition_kind IN ('COMPLETED','POLICY_NOT_REQUIRED'))"
      - name: paid_packet_member_digest_ck
        expression: "packet_subject_digest ~ '^[0-9a-f]{64}$' AND packet_member_set_digest ~ '^[0-9a-f]{64}$' AND source_set_digest ~ '^[0-9a-f]{64}$' AND member_record_digest ~ '^[0-9a-f]{64}$'"
      - name: paid_packet_member_canonical_ck
        expression: "ops.paid_evidence_packet_member_input_v1_is_valid(member_payload) AND convert_from(member_canonical,'UTF8')::jsonb = member_payload AND member_record_digest = encode(extensions.digest(member_digest_preimage_canonical,'sha256'),'hex')"
    indexes:
      - {name: paid_packet_member_parent_idx, columns: [packet_id, packet_version, member_ordinal]}
      - {name: paid_packet_member_source_idx, columns: [source_set_id, source_set_version, source_set_digest, packet_id]}
    trigger_contracts:
      - name: paid_packet_member_authority_guard
        timing: CONSTRAINT AFTER INSERT INITIALLY DEFERRED
        rules:
          - The parent version-1 immutable review snapshot is the native FK authority for the complete approved member manifest. The trigger parses its closed PublicationSnapshotMemberSetV1, requires an exact category/ordinal/source tuple, and then resolves the branch-specific immutable source candidate key below; JSON membership alone is never sufficient.
          - AUTHORIZED_DATASET_SNAPSHOT resolves core.dataset_snapshots(id,version,snapshot_sha256) in READY state and exact member-set digest.
          - SOURCE_RIGHTS resolves the ordered asset-rights/response-consent decision set represented by the snapshot and each raw.asset_rights_decisions or response-consent candidate key.
          - CAPABILITY_ACTIVATION resolves the ordered current ops.capability_activation_decisions candidate set for the exact contract/environment.
          - EXTRACTION_AND_TRANSFORMATION_LINEAGE and REPRODUCTION_AND_COMPARISON_INPUT resolve immutable parser, normalization, dataset-member and reproduction receipts named by the snapshot.
          - SUPPORTING_CONTRARY_AND_LOCATOR_EVIDENCE and FRESHNESS_LIMITATION_DISAGREEMENT_AND_UNKNOWN_DISCLOSURE resolve exact immutable snapshot scope/member digests, evidence locators, freshness and limitation receipts.
          - AI_PROVENANCE_WHEN_CONTRIBUTED resolves either exact VALID ops.agent_output_validations candidate keys or an exact no-contribution policy receipt. HUMAN_DECISION resolves immutable action/review decisions. INDEPENDENT_REVIEW_OR_POLICY_NOT_REQUIRED resolves exact review receipts or the exact not-required policy evaluation.
          - All ten rows must be present before commit, ordinals and categories are set-equal, their canonical member digests reproduce packet_member_set_digest, and the parent packet_subject_digest is recomputed with the ordered member bindings.
      - {name: paid_packet_member_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    branch_authority_registry:
      AUTHORIZED_DATASET_SNAPSHOT: {root: core.dataset_snapshots, required_candidate_key: [id, version, snapshot_sha256], required_alter: add exact candidate key before packet FK/guard installation}
      SOURCE_RIGHTS: {root: editorial.review_snapshots.member_manifest, leaves: [raw.asset_rights_decisions, editorial.responses publication consent]}
      CAPABILITY_ACTIVATION: {root: editorial.review_snapshots.member_manifest, leaves: [ops.capability_activation_decisions, ops.capability_activation_evidence]}
      EXTRACTION_AND_TRANSFORMATION_LINEAGE: {root: editorial.review_snapshots.member_manifest, leaves: [core.parser_runs, core.normalization_runs, raw.evidence_segments]}
      REPRODUCTION_AND_COMPARISON_INPUT: {root: editorial.review_snapshots.member_manifest, leaves: [core.dataset_snapshots, core.dataset_snapshot_members, core.procurement_query_snapshots, core.procurement_query_snapshot_members]}
      SUPPORTING_CONTRARY_AND_LOCATOR_EVIDENCE: {root: editorial.review_snapshots.member_manifest, leaves: [editorial.response_request_claim_scopes, editorial.response_request_evidence_scopes]}
      FRESHNESS_LIMITATION_DISAGREEMENT_AND_UNKNOWN_DISCLOSURE: {root: editorial.review_snapshots.member_manifest, leaves: [editorial.review_snapshots]}
      AI_PROVENANCE_WHEN_CONTRIBUTED: {root: editorial.review_snapshots.member_manifest, leaves: [ops.agent_output_validations, ops.agent_source_uses]}
      HUMAN_DECISION: {root: editorial.review_snapshots.member_manifest, leaves: [ops.action_decisions, editorial.review_decisions]}
      INDEPENDENT_REVIEW_OR_POLICY_NOT_REQUIRED: {root: editorial.review_snapshots.member_manifest, leaves: [editorial.review_decisions, ops.action_decisions]}
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      schedule_binding: parent packet and every referenced source authority
      legal_hold_key: [PAID_EVIDENCE_PACKET_MEMBER, packet_id, member_ordinal]
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository:
      insert_identity: [packet_id, packet_version, member_ordinal]
      read_order: [member_ordinal ASC]
      errors: [PAID_PACKET_MEMBER_INVALID, PAID_PACKET_MEMBER_SOURCE_MISMATCH, PAID_PACKET_MEMBER_SET_MISMATCH]

