      - {name: tariff_oversight_approver_fk, columns: [oversight_approver_id], references: 'ops.users(id)', on_delete: RESTRICT}
      - {name: tariff_cost_allocation_period_fk, columns: [cost_allocation_period_id, cost_allocation_row_kind], references: 'ops.cost_allocations(id, row_kind)', on_delete: RESTRICT}
    unique_constraints:
      - {name: tariff_effective_start_uq, columns: [deployment_id, sku, effective_from]}
      - {name: tariff_context_candidate_uq, columns: [id, deployment_id, sku, accounting_timezone]}
      - {name: tariff_record_reference_uq, columns: [id, record_digest]}
      - {name: tariff_record_digest_uq, columns: [record_digest]}
    checks:
      - {name: tariff_first_sku_currency_ck, expression: "sku = 'EVIDENCE_WORKSPACE_ORGANIZATION_V1' AND currency = 'KRW'"}
      - {name: tariff_interval_ck, expression: effective_from < effective_until}
      - {name: tariff_timezone_ck, expression: length(btrim(accounting_timezone)) BETWEEN 1 AND 63}
      - {name: tariff_components_ck, expression: 'workspace_base_amount > 0 AND included_active_contributors = 10 AND active_contributor_block_size = 10 AND active_contributor_block_amount >= 0 AND included_processing_credits >= 0 AND processing_credit_overage_amount >= 0 AND included_storage_gb_month >= 0 AND storage_gb_month_overage_amount >= 0 AND included_api_record_units >= 0 AND api_record_unit_overage_amount >= 0 AND (sla_add_on_amount IS NULL OR sla_add_on_amount >= 0) AND included_signed_webhook_deliveries >= 0 AND included_digest_deliveries >= 0'}
      - name: tariff_sla_offer_shape_ck
        expression: >-
          (sla_offer_state = 'UNCONFIGURED_NOT_SOLD' AND sla_add_on_amount IS NULL AND sla_policy_version IS NULL AND sla_policy_digest IS NULL AND sla_target_availability_ratio IS NULL AND sla_capability_set_digest IS NULL AND sla_exclusion_schedule_digest IS NULL AND sla_service_credit_schedule_digest IS NULL AND sla_measurement_policy_digest IS NULL AND sla_policy_source_receipt_digest IS NULL AND sla_policy_signature_digest IS NULL)
          OR (sla_offer_state = 'CONFIGURED_FOR_SALE' AND sla_add_on_amount IS NOT NULL AND sla_add_on_amount > 0 AND sla_policy_version IS NOT NULL AND length(btrim(sla_policy_version)) BETWEEN 1 AND 100 AND sla_policy_digest IS NOT NULL AND sla_target_availability_ratio IS NOT NULL AND sla_target_availability_ratio > 0 AND sla_target_availability_ratio <= 1 AND sla_capability_set_digest IS NOT NULL AND sla_exclusion_schedule_digest IS NOT NULL AND sla_service_credit_schedule_digest IS NOT NULL AND sla_measurement_policy_digest IS NOT NULL AND sla_policy_source_receipt_digest IS NOT NULL AND sla_policy_signature_digest IS NOT NULL)
      - {name: tariff_sod_ck, expression: proposed_by <> approver_id}
      - {name: tariff_required_margin_ck, expression: "(stage = 'PILOT' AND required_variable_gross_margin_basis_points = 6000) OR (stage = 'GENERAL_AVAILABILITY' AND required_variable_gross_margin_basis_points = 7000)"}
      - {name: tariff_margin_range_ck, expression: projected_p75_variable_gross_margin_basis_points BETWEEN -100000 AND 10000}
      - {name: tariff_cost_evidence_kind_ck, expression: "cost_allocation_row_kind = 'PERIOD'"}
      - {name: tariff_cost_evidence_threshold_ck, expression: 'cost_capture_coverage BETWEEN 0.99 AND 1 AND direct_cost_coverage = 1 AND total_cost_coverage BETWEEN 0.95 AND 1 AND p75_revenue_amount > 0 AND p75_variable_cost_amount >= 0'}
      - {name: tariff_margin_formula_ck, expression: 'projected_p75_variable_gross_margin_basis_points = ops.round_half_even_numeric_v1(((p75_revenue_amount - p75_variable_cost_amount) / p75_revenue_amount) * 10000, 0)::integer'}
      - name: tariff_margin_exception_ck
        expression: "((projected_p75_variable_gross_margin_basis_points >= required_variable_gross_margin_basis_points AND margin_exception_reason IS NULL AND margin_exception_expires_at IS NULL AND oversight_approver_id IS NULL AND oversight_decision_digest IS NULL) OR (stage = 'PILOT' AND projected_p75_variable_gross_margin_basis_points < required_variable_gross_margin_basis_points AND margin_exception_reason IS NOT NULL AND length(btrim(margin_exception_reason)) BETWEEN 1 AND 1000 AND margin_exception_expires_at IS NOT NULL AND margin_exception_expires_at = effective_until AND oversight_approver_id IS NOT NULL AND oversight_approver_id <> proposed_by AND oversight_approver_id <> approver_id AND oversight_decision_digest IS NOT NULL)) IS TRUE"
      - {name: tariff_digest_ck, expression: "accounting_policy_digest ~ '^[0-9a-f]{64}$' AND p75_assumption_digest ~ '^[0-9a-f]{64}$' AND cost_allocation_record_digest ~ '^[0-9a-f]{64}$' AND cost_allocation_set_digest ~ '^[0-9a-f]{64}$' AND cost_allocation_close_receipt_digest ~ '^[0-9a-f]{64}$' AND margin_formula_digest ~ '^[0-9a-f]{64}$' AND component_set_digest ~ '^[0-9a-f]{64}$' AND pricing_policy_digest ~ '^[0-9a-f]{64}$' AND tax_policy_digest ~ '^[0-9a-f]{64}$' AND decision_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND record_digest ~ '^[0-9a-f]{64}$' AND (oversight_decision_digest IS NULL OR oversight_decision_digest ~ '^[0-9a-f]{64}$') AND (sla_policy_digest IS NULL OR sla_policy_digest ~ '^[0-9a-f]{64}$') AND (sla_capability_set_digest IS NULL OR sla_capability_set_digest ~ '^[0-9a-f]{64}$') AND (sla_exclusion_schedule_digest IS NULL OR sla_exclusion_schedule_digest ~ '^[0-9a-f]{64}$') AND (sla_service_credit_schedule_digest IS NULL OR sla_service_credit_schedule_digest ~ '^[0-9a-f]{64}$') AND (sla_measurement_policy_digest IS NULL OR sla_measurement_policy_digest ~ '^[0-9a-f]{64}$') AND (sla_policy_source_receipt_digest IS NULL OR sla_policy_source_receipt_digest ~ '^[0-9a-f]{64}$') AND (sla_policy_signature_digest IS NULL OR sla_policy_signature_digest ~ '^[0-9a-f]{64}$')"}
    indexes:
      - {name: tariff_effective_lookup_idx, columns: [deployment_id, sku, effective_from DESC, effective_until, id]}
      - {name: tariff_stage_lookup_idx, columns: [deployment_id, stage, effective_from DESC, id]}
      - {name: tariff_proposer_fk_idx, columns: [proposed_by, id]}
      - {name: tariff_approver_fk_idx, columns: [approver_id, id]}
      - {name: tariff_oversight_approver_fk_idx, columns: [oversight_approver_id, id], where: oversight_approver_id IS NOT NULL}
      - {name: tariff_cost_allocation_fk_idx, columns: [cost_allocation_period_id, cost_allocation_row_kind, id]}
    trigger_contracts:
      - name: tariff_interval_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rule: Verify accounting_timezone in pg_timezone_names and exact accounting_policy_digest; lock the declared PERIOD cost allocation header and all its lines, require claim_state ELIGIBLE, exact record/allocation/receipt digests, cost capture at least 99%, direct allocation 100% and total allocation at least 95%, then recompute P75 revenue, variable cost and margin under p75_assumption_digest and margin_formula_digest. UNCONFIGURED_NOT_SOLD has no SLA amount or policy scalar. CONFIGURED_FOR_SALE verifies the detached policy signature and receipt and binds one exact version, target, contracted-capability set, maintenance/exclusion schedule, measurement policy and service-credit schedule. Acquire a semantic advisory lock for deployment_id+sku and reject overlapping tariff intervals; adjacency is allowed.
      - {name: tariff_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: component_set_digest
      canonical_type: TariffComponentSetCanonicalV1
      field_order: [workspaceBaseAmount, includedActiveContributors, activeContributorBlockSize, activeContributorBlockAmount, includedProcessingCredits, processingCreditOverageAmount, includedStorageGbMonth, storageGbMonthOverageAmount, includedApiRecordUnits, apiRecordUnitOverageAmount, slaAddOnAmount, slaOfferState, slaPolicyVersion, slaPolicyDigest, slaTargetAvailabilityRatio, slaCapabilitySetDigest, slaExclusionScheduleDigest, slaServiceCreditScheduleDigest, slaMeasurementPolicyDigest, slaPolicySourceReceiptDigest, slaPolicySignatureDigest, includedSignedWebhookDeliveries, includedDigestDeliveries]
      record_digest_type: TariffVersionCanonicalV1
