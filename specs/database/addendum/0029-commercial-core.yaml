billing_calculation_contract:
  timezone_and_period:
    cadence: calendar month in accounting_timezone
    interval: '[period_start local midnight, period_end local midnight)'
    partial_period_proration: active calendar days divided by calendar days in that local month; calculate exact decimal then ROUND_HALF_EVEN once to 6 places
    cutoff: invoice binds exact contract leaf, tariff, terminal usage-window set, terminal discount-leaf set, correction set, tax policy and cutoff timestamp in reconciliation_digest
  ordered_formula:
    - WORKSPACE_BASE = workspace_base_amount multiplied by period proration
    - ACTIVE_CONTRIBUTOR_BLOCK = ceil(max(0, active contributor count minus 10) divided by 10) multiplied by block amount and period proration
    - PROCESSING_CREDIT_OVERAGE = max(0, sum normalized credits for AGENT_TOKEN, MODEL_REQUEST and SOURCE_PAGE minus included credits) multiplied by overage amount; the versioned conversion catalog defines additive components and unique charge identities
    - STORAGE_GB_MONTH_OVERAGE = max(0, sum encrypted byte-hours divided by exact local-period hours divided by 1000000000 minus included GB-month) multiplied by overage amount
    - API_RECORD_UNIT_OVERAGE = max(0, normalized records returned divided by 1000 minus included API Record Units) multiplied by overage amount; API request count is never used as the record-unit quantity
    - SLA_ADD_ON = selected SLA add-on amount multiplied by period proration
    - Apply the single active discount decision per line kind to subtotal, then tax policy, then separately authorized accounting-adjustment lines; never discount tax or reuse one correction at two hierarchy levels
  included_only:
    SIGNED_WEBHOOK: usage is INCLUDED_QUOTA_ONLY up to tariff quota; excess is QUOTA_BLOCKED and not silently billed
    DAILY_OR_WEEKLY_DIGEST: usage is INCLUDED_QUOTA_ONLY up to tariff quota; excess is QUOTA_BLOCKED and not silently billed
    EXPORT_BYTE: NON_BILLABLE_TELEMETRY for the initial SKU; no invented export overage
  rounding:
    internal_decimal: exact PostgreSQL numeric and Rust decimal; binary float forbidden
    quantity_scale: 6
    money_scale: 6
    mode: ROUND_HALF_EVEN
    sequence: normalize quantity, calculate line subtotal, calculate line discount, calculate taxable amount, calculate tax, calculate accounting adjustment, sum already-rounded line totals
    aggregate_rule: invoice aggregates are exact sums of line columns and are not independently re-rounded
  late_arrival:
    rule: A late usage, discount, tax, FX or correction fact never mutates an invoice/revenue/allocation receipt; it produces a linked immutable restatement with a new ordered input-set and reconciliation digest.
  invoice_close_barrier:
    - exact contract leaf is ACTIVE and PROVISIONED throughout the billed slice
    - tariff and all oversight decisions are effective for the entire slice and not expired
    - required usage meters tile the slice with COMPLETE terminal windows and no overlap or unproved gap
    - included delivery subtype counts and quota outcomes are reconciled
    - active discount leaves are disjoint and aggregate margin was recomputed
    - correction source/economic-effect identities are unique and the ordered set is bound
    - tax/currency/rounding policies and source/provider receipts are current
    - any UNKNOWN, PARTIAL, stale, mismatch or missing evidence blocks invoice success

sla_metric_input_contract:
  function: ops.read_sla_metric_inputs_v1
  signature: "(uuid contract_period_id, char(64) expected_contract_record_digest, date window_start, date window_end) -> SETOF ops.sla_metric_input_v1"
  owner: gurine_migrator
  security: SECURITY_DEFINER
  search_path: [pg_catalog, ops, pg_temp]
  execute_roles: [gurine_workflow_worker, gurine_control_api, gurine_auditor]
  revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_identity_api]
  exact_input_binding:
    - Lock the unique current commercial-contract leaf and require ACTIVE, PROVISIONED and sla_selection_state SELECTED for the complete requested accounting-calendar month.
    - Require the exact stored organization_id, contract_period_id, sla_policy_version, sla_policy_digest, target ratio, capability-set digest, exclusion-schedule digest, service-credit-schedule digest and measurement-policy digest copied from the signed configured tariff.
    - Recompute the deployment-keyed scope_digest from deployment_id, organization_id, contract_period_id and sla_policy_digest; every returned ops.sli_window_receipts row has environment PRODUCTION, window_kind POLICY_WINDOW, the exact scope digest, exact policy_digest, a capability in the signed capability set and its exact receipt digest.
    - Return a gap-free, nonoverlapping tiling for every contracted critical capability. A missing target, missing capability, stale policy, interval gap, telemetry GAP, unknown evaluation or digest mismatch returns SLA_INPUT_UNKNOWN and opens or updates the telemetry-gap incident; it never omits the bad slice.
    - Eligible service minutes subtract only signed-policy exclusions announced at least 72 hours before the interval and capped at 240 minutes per accounting month. Provider fault, capacity exhaustion, deployment fault and unknown cause stay eligible and unavailable when affected.
    - Overlapping outage/incident minutes are unioned once in canonical minute order. The final availability ratio uses ops.round_half_even_numeric_v1(...,12), and the result binds the exact ordered SLI/incident/exclusion set digest.
  unavailable_behavior:
    UNCONFIGURED_NOT_SOLD: The locked contract outcome remains UNAVAILABLE_NOT_SOLD and maps to the closed business reason CAPABILITY_NOT_OFFERED before any SLI lookup; no metric-input or service-credit row is emitted, and absence is not a zero or a passing SLA.
    AVAILABLE_NOT_SELECTED: The locked contract outcome remains AVAILABLE_NOT_SELECTED and maps to the closed business reason CAPABILITY_NOT_OFFERED before any SLI lookup; no metric-input or service-credit row is emitted, and an available option is not a contracted objective.
    CONTRACT_NOT_ACTIVE_OR_PROVISIONED: The closed business reason is CONTRACT_NOT_CURRENT and no metric-input or service-credit row is emitted.
    rule: A selected contract returns the complete capability population or explicit SLA_INPUT_UNKNOWN rows. An empty successful result, default target, service-wide SLI substitution, and silent downgrade from SELECTED are forbidden.
  service_credit_binding: A due credit appends an immutable ops.accounting_corrections row with reason_code SERVICE_CREDIT targeting the exact invoice or SLA line, and binds contract, SLA policy, breach receipt and service-credit-schedule digests; neither invoice nor SLI bytes are rewritten.
  return_firewall: Returns only the named closed composite scalars; raw telemetry JSON, incident text, provider payload, organization name, contract reference and any customer/content identity are forbidden.
  runtime_canaries: [unconfigured_not_sold, available_not_selected, missing_target, wrong_org_scope, wrong_contract_scope, wrong_policy_digest, DST_month, adjacent_windows, overlapping_windows, telemetry_gap, maintenance_notice_under_72h, maintenance_over_240m, provider_fault_not_excluded, duplicate_outage_minute_union, service_credit_exact_correction]

public_projection_boundary:
  raw_relation_rule: gurine_public_projector has zero table privilege on fx rates, tariffs, contracts, usage receipts, usage facts, discounts, acquisition receipts, cost allocations, invoices, invoice lines, invoice usage memberships, revenue facts, accounting corrections and SKU readiness rows; PUBLIC and gurine_public_api also have zero access.
  allowed_entrypoints:
    - function: public.project_public_outcome_fact_v2(public.public_outcome_projection_v2)
      execute_roles: [gurine_public_projector]
      internal_source_reader: ops.read_public_outcome_projection_inputs_v1
      return_columns: [operation_id, event_id, source_aggregate_id, source_aggregate_version, source_aggregate_digest, projection_id, projection_version, projection_digest, projected_row_count, inbox_receipt_digest, job_receipt_digest, audit_event_id, outbox_event_ids, receipt_digest, completed_at]
      forbidden_columns: [organization_id, workflow_instance_hmac, subject_scope_digest, terminal_receipt_id, terminal_receipt_digest, product_event_ids, actor_or_session_identity, source_rows]
    - function: public.project_funding_disclosure_revision_v2(public.funding_disclosure_projection_v2)
      execute_roles: [gurine_public_projector]
      internal_source_reader: editorial.read_public_funding_projection_inputs_v1
      exact_contract_ref: specs/database/addendum/0029-funding-disclosure.yaml#public_projection_contract
  execution_contract: Both v2 functions are fixed-search-path SECURITY DEFINER, claim one typed projection work item, read the exact source internally, verify expected source digest under a repeatable snapshot, apply active DISCLOSURE holds and rights/source-link policy, atomically write the target plus inbox/job/audit/receipt, and return only the closed projection receipt. The public-outcome function emits only its separately declared outbox event. The funding-disclosure function emits no outbox event and returns an empty outbox_event_ids array because the active exact event catalog contains no funding-projection event. The projector cannot execute the internal readers directly.
  no_commercial_projection: Customer, contract, tariff, invoice, line, usage, revenue, cost, acquisition and correction rows have no public projector entrypoint. Public funding bands and approved aggregate transparency content are emitted only from the published funding revision function.
  catalog_gate: pg_class/table_privileges and routine_privileges equal the allowlist exactly; any raw SELECT, PUBLIC EXECUTE, SECURITY INVOKER function or undeclared return column fails migration.

tables:
  ops.fx_rate_facts:
    owner:
      logical_component: finance-importer
      physical_service: workflow-worker
      rust_type: gurine_domain::economics::FxRateFact
      repository: crates/persistence-postgres::fx_rates
    creation_order: 1
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      deployment_id: {type: uuid, nullable: false}
      root_rate_id: {type: uuid, nullable: false}
      revision: {type: bigint, nullable: false}
      fact_kind: {type: ops.fx_fact_kind, nullable: false}
      supersedes_rate_id: {type: uuid, nullable: true}
      source_currency: {type: 'char(3)', nullable: false}
      target_currency: {type: 'char(3)', nullable: false}
      quote_convention: {type: text, nullable: false}
      rate: {type: 'numeric(30,12)', nullable: true}
      rate_kind: {type: ops.fx_rate_kind, nullable: false}
      source_id: {type: text, nullable: false}
      source_record_identity_hmac: {type: 'char(64)', nullable: false}
      source_record_hmac_key_version: {type: text, nullable: false}
      source_priority: {type: smallint, nullable: false}
      observed_at: {type: timestamptz, nullable: false}
      valid_until: {type: timestamptz, nullable: false}
      rate_policy_digest: {type: 'char(64)', nullable: false}
      source_receipt_digest: {type: 'char(64)', nullable: false}
      signature_digest: {type: 'char(64)', nullable: false}
      correction_reason: {type: ops.fx_correction_reason, nullable: true}
      approver_id: {type: uuid, nullable: true}
      decision_digest: {type: 'char(64)', nullable: true}
      sha256: {type: 'char(64)', nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: fx_rate_root_fk, columns: [root_rate_id], references: 'ops.fx_rate_facts(id)', on_delete: RESTRICT, deferrable: true}
      - {name: fx_rate_supersedes_fk, columns: [supersedes_rate_id], references: 'ops.fx_rate_facts(id)', on_delete: RESTRICT}
      - {name: fx_rate_source_fk, columns: [source_id], references: 'ops.source_registry(source_id)', on_delete: RESTRICT}
      - {name: fx_rate_approver_fk, columns: [approver_id], references: 'ops.users(id)', on_delete: RESTRICT}
    unique_constraints:
      - {name: fx_rate_root_revision_uq, columns: [root_rate_id, revision]}
      - {name: fx_rate_source_record_revision_uq, columns: [deployment_id, source_id, source_record_identity_hmac, revision]}
      - {name: fx_rate_sha_uq, columns: [sha256]}
    checks:
      - {name: fx_rate_revision_ck, expression: revision > 0}
      - {name: fx_rate_currency_ck, expression: "source_currency ~ '^[A-Z]{3}$' AND target_currency ~ '^[A-Z]{3}$' AND source_currency <> target_currency"}
      - {name: fx_quote_convention_ck, expression: "quote_convention = 'TARGET_PER_SOURCE'"}
      - {name: fx_rate_value_ck, expression: "(fact_kind IN ('OBSERVATION','REPLACEMENT') AND rate IS NOT NULL AND rate > 0) OR (fact_kind = 'WITHDRAWAL' AND rate IS NULL)"}
      - {name: fx_rate_root_shape_ck, expression: "(fact_kind = 'OBSERVATION' AND revision = 1 AND root_rate_id = id AND supersedes_rate_id IS NULL AND correction_reason IS NULL AND approver_id IS NULL AND decision_digest IS NULL) OR (fact_kind IN ('REPLACEMENT','WITHDRAWAL') AND revision > 1 AND root_rate_id <> id AND supersedes_rate_id IS NOT NULL AND correction_reason IS NOT NULL AND approver_id IS NOT NULL AND decision_digest IS NOT NULL)"}
      - {name: fx_rate_priority_ck, expression: source_priority BETWEEN 0 AND 32767}
      - {name: fx_rate_interval_ck, expression: observed_at < valid_until}
      - {name: fx_rate_hmac_key_version_ck, expression: length(btrim(source_record_hmac_key_version)) BETWEEN 1 AND 100}
      - {name: fx_rate_digest_ck, expression: "rate_policy_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND source_record_identity_hmac ~ '^[0-9a-f]{64}$' AND (decision_digest IS NULL OR decision_digest ~ '^[0-9a-f]{64}$') AND sha256 ~ '^[0-9a-f]{64}$'"}
    indexes:
      - {name: fx_rate_one_successor_uq, unique: true, columns: [supersedes_rate_id], where: supersedes_rate_id IS NOT NULL}
      - {name: fx_rate_selection_idx, columns: [deployment_id, source_currency, target_currency, observed_at DESC, source_priority, revision DESC, id]}
      - {name: fx_rate_root_history_idx, columns: [root_rate_id, revision, id]}
      - {name: fx_rate_source_fk_idx, columns: [source_id, id]}
      - {name: fx_rate_approver_fk_idx, columns: [approver_id, id], where: approver_id IS NOT NULL}
    trigger_contracts:
      - name: fx_rate_chain_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - For a replacement or withdrawal, lock supersedes_rate_id and its root chain; the predecessor must be the unique current leaf.
          - root_rate_id, currencies, quote convention, rate kind, source, source-record HMAC and key version, observed_at, valid_until, source priority and rate-policy digest equal the predecessor; revision equals predecessor revision plus one.
          - The advisory-lock key is the lowercase SHA-256 domain key; a hash collision may serialize unrelated rows but cannot admit an invalid chain.
      - {name: fx_rate_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: sha256
      canonical_type: FxRateFactCanonicalV1
      field_order: [schemaVersion, id, deploymentId, rootRateId, revision, factKind, supersedesRateId, sourceCurrency, targetCurrency, quoteConvention, rate, rateKind, sourceId, sourceRecordIdentityHmac, sourceRecordHmacKeyVersion, sourcePriority, observedAt, validUntil, ratePolicyDigest, sourceReceiptDigest, signatureDigest, correctionReason, approverId, decisionDigest]
    fx_semantics:
      quote: target amount equals source amount multiplied by rate
      same_currency: return the unchanged source amount with fxRateFactId absent; never synthesize a 1.0 fact
      inverse_and_cross: forbidden unless separately imported as its own signed FxRateFact root
      effective_leaf: a root contributes only its unique terminal leaf; WITHDRAWAL contributes no usable rate and produces FX_RATE_STALE or FX_RATE_CONFLICT, never fallback success
      selection_order: [source_priority ASC, observed_at DESC, revision DESC, id ASC]
      staleness: conversion timestamp must satisfy observed_at <= timestamp < valid_until and the bound rate policy maximum age; missing or stale rate blocks accounting
      rounding: multiply exact decimal values before one ROUND_HALF_EVEN operation to numeric(24,6); consumers persist source amount, target amount, this rate ID, and rate sha256
      historical_use: a replacement never silently recomputes a settled fact; affected facts receive explicit AccountingCorrection rows
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: valid_until plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [FX_RATE_FACT, id, root_rate_id]
      backup_behavior: preserve immutable fact and re-evaluate schedule, restoration suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
      source_body_rule: source body may be crypto-erased by its own schedule; this signed digest fact remains
    repository:
      insert_identity: [id]
      import_lock_order: [source_registry row, root leaf if correction, semantic source-record advisory lock, fx_rate_facts insert, audit chain head, outbox]
      detail_order: [id]
      history_order: [root_rate_id, revision ASC, id ASC]
      selection_order: [source_priority ASC, observed_at DESC, revision DESC, id ASC]
      roundtrip: Every column including numeric scale, optional correction fields, timestamps and digests maps exactly; missing required data or an unknown enum is stored-data corruption.
      errors: [FX_RATE_STALE, FX_RATE_CONFLICT]

