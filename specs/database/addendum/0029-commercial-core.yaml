      - {name: usage_fact_supersedes_fk, columns: [supersedes_usage_fact_id], references: 'ops.usage_facts(id)', on_delete: RESTRICT}
      - {name: usage_fact_contract_period_fk, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone], references: 'ops.commercial_contract_periods(id, deployment_id, organization_id, contract_id, sku, accounting_timezone)', on_delete: RESTRICT}
