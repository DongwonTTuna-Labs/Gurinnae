physical_type_registry:
  purpose: The migration generator creates every named PostgreSQL type before any 0029 table, function signature, CHECK cast or composite that uses it; an undeclared custom type is a hard generation error.
  implementation: PostgreSQL ENUM with labels in the exact declared order; a later label or reorder requires a new reviewed migration and is never inferred from Rust or YAML map order.
  owner: gurine_migrator
  common_acl:
    public: []
    gurine_workflow_worker: [USAGE]
    gurine_control_api: [USAGE]
    gurine_auditor: [USAGE]
    all_other_runtime_roles: []
    statements:
      - REVOKE ALL ON TYPE <qualified_type> FROM PUBLIC
      - REVOKE ALL ON TYPE <qualified_type> FROM every runtime role
      - GRANT USAGE ON TYPE <qualified_type> TO gurine_workflow_worker, gurine_control_api, gurine_auditor
  creation_phase_order: [commercial_enum_types, funding_enum_types, closed_input_composites, stored_response_and_receipt_composites, tables, functions]
