      decision_digest: {type: 'char(64)', nullable: false}
      source_receipt_digest: {type: 'char(64)', nullable: false}
      signature_digest: {type: 'char(64)', nullable: false}
      record_digest: {type: 'char(64)', nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: discount_contract_period_fk, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone], references: 'ops.commercial_contract_periods(id, deployment_id, organization_id, contract_id, sku, accounting_timezone)', on_delete: RESTRICT}
      - {name: discount_tariff_fk, columns: [tariff_version_id, deployment_id, sku, accounting_timezone], references: 'ops.tariff_versions(id, deployment_id, sku, accounting_timezone)', on_delete: RESTRICT}
      - {name: discount_root_fk, columns: [root_discount_id], references: 'ops.discount_decisions(id)', on_delete: RESTRICT, deferrable: true}
      - {name: discount_supersedes_fk, columns: [supersedes_discount_id], references: 'ops.discount_decisions(id)', on_delete: RESTRICT}
      - {name: discount_proposer_fk, columns: [proposed_by], references: 'ops.users(id)', on_delete: RESTRICT}
      - {name: discount_approver_fk, columns: [approver_id], references: 'ops.users(id)', on_delete: RESTRICT}
      - {name: discount_oversight_approver_fk, columns: [oversight_approver_id], references: 'ops.users(id)', on_delete: RESTRICT}
    unique_constraints:
      - {name: discount_root_revision_uq, columns: [root_discount_id, revision]}
      - {name: discount_record_reference_uq, columns: [id, record_digest]}
      - {name: discount_record_digest_uq, columns: [record_digest]}
    checks:
      - {name: discount_scope_nonempty_ck, expression: applies_workspace_base OR applies_active_contributor_block OR applies_processing_credit_overage OR applies_storage_gb_month_overage OR applies_api_record_unit_overage OR applies_sla_add_on}
      - {name: discount_interval_ck, expression: effective_from < effective_until}
      - {name: discount_timezone_ck, expression: length(btrim(accounting_timezone)) BETWEEN 1 AND 63}
      - {name: discount_sod_ck, expression: proposed_by <> approver_id}
      - {name: discount_chain_shape_ck, expression: "(revision = 1 AND root_discount_id = id AND supersedes_discount_id IS NULL) OR (revision > 1 AND root_discount_id <> id AND supersedes_discount_id IS NOT NULL)"}
      - {name: discount_value_ck, expression: "(((state = 'ACTIVE' AND basis_points IS NOT NULL AND basis_points BETWEEN 1 AND 10000) OR (state = 'WITHDRAWN' AND basis_points IS NULL)) AND required_variable_gross_margin_basis_points IS NOT NULL AND projected_margin_after_discount_basis_points IS NOT NULL AND projected_margin_after_discount_basis_points BETWEEN -100000 AND 10000 AND margin_assumption_digest IS NOT NULL AND undiscounted_p75_revenue_amount > 0 AND discounted_p75_revenue_amount > 0 AND discounted_p75_revenue_amount <= undiscounted_p75_revenue_amount AND p75_variable_cost_amount >= 0) IS TRUE"}
      - {name: discount_margin_formula_ck, expression: 'projected_margin_after_discount_basis_points = ops.round_half_even_numeric_v1(((discounted_p75_revenue_amount - p75_variable_cost_amount) / discounted_p75_revenue_amount) * 10000, 0)::integer'}
      - name: discount_margin_exception_ck
        expression: "((projected_margin_after_discount_basis_points IS NOT NULL AND required_variable_gross_margin_basis_points IS NOT NULL AND projected_margin_after_discount_basis_points >= required_variable_gross_margin_basis_points AND oversight_reason IS NULL AND oversight_expires_at IS NULL AND oversight_approver_id IS NULL AND oversight_decision_digest IS NULL) OR (projected_margin_after_discount_basis_points IS NOT NULL AND required_variable_gross_margin_basis_points IS NOT NULL AND projected_margin_after_discount_basis_points < required_variable_gross_margin_basis_points AND oversight_reason IS NOT NULL AND length(btrim(oversight_reason)) BETWEEN 1 AND 1000 AND oversight_expires_at IS NOT NULL AND oversight_expires_at = effective_until AND oversight_approver_id IS NOT NULL AND oversight_approver_id <> proposed_by AND oversight_approver_id <> approver_id AND oversight_decision_digest IS NOT NULL)) IS TRUE"
      - {name: discount_digest_ck, expression: "tariff_record_digest ~ '^[0-9a-f]{64}$' AND accounting_policy_digest ~ '^[0-9a-f]{64}$' AND decision_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND record_digest ~ '^[0-9a-f]{64}$' AND margin_assumption_digest ~ '^[0-9a-f]{64}$' AND resulting_discount_set_digest ~ '^[0-9a-f]{64}$' AND cost_evidence_digest ~ '^[0-9a-f]{64}$' AND margin_formula_digest ~ '^[0-9a-f]{64}$' AND (oversight_decision_digest IS NULL OR oversight_decision_digest ~ '^[0-9a-f]{64}$')"}
    indexes:
      - {name: discount_one_successor_uq, unique: true, columns: [supersedes_discount_id], where: supersedes_discount_id IS NOT NULL}
      - {name: discount_effective_lookup_idx, columns: [organization_id, contract_period_id, effective_from ASC, effective_until ASC, id]}
      - {name: discount_root_history_idx, columns: [root_discount_id, revision ASC, id]}
      - {name: discount_contract_fk_idx, columns: [contract_period_id, deployment_id, organization_id, contract_id, sku, accounting_timezone, id]}
      - {name: discount_tariff_fk_idx, columns: [tariff_version_id, deployment_id, sku, accounting_timezone, id]}
      - {name: discount_proposer_fk_idx, columns: [proposed_by, id]}
      - {name: discount_approver_fk_idx, columns: [approver_id, id]}
      - {name: discount_oversight_approver_fk_idx, columns: [oversight_approver_id, id], where: oversight_approver_id IS NOT NULL}
    trigger_contracts:
      - name: discount_context_and_chain_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - Lock the current contract leaf and tariff; require matching deployment, organization, contract, SKU, tariff_version_id, tariff_record_digest, accounting_timezone and accounting_policy_digest; discount interval is contained by both contract and tariff.
          - A successor locks and supersedes the unique current leaf, inherits deployment, organization, contract, line-kind booleans and interval, and increments revision exactly one.
          - Acquire organization+contract semantic advisory lock; among ACTIVE terminal leaves of different roots, no overlapping interval may share any true line-kind boolean. Disjoint components may coexist only after the function recomputes their combined resulting_discount_set_digest, discounted P75 revenue, cost evidence and margin.
          - required margin and cost evidence equal the bound tariff. Any below-threshold resulting set is allowed only when the bound contract/tariff stage is PILOT, has explicit oversight reason/approver/decision, and this decision ends exactly at oversight expiry. NONPROFIT means the approved public-interest discount reason and is never an automatic gate bypass.
      - {name: discount_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: decision_digest
      canonical_type: DiscountDecisionCanonicalV1
      field_order: [schemaVersion, id, deploymentId, organizationId, contractPeriodId, contractId, sku, tariffVersionId, tariffRecordDigest, accountingTimezone, accountingPolicyDigest, rootDiscountId, revision, state, supersedesDiscountId, eligibleLineKindsCanonicalOrder, basisPoints, reasonCode, effectiveFrom, effectiveUntil, requiredVariableGrossMarginBasisPoints, projectedMarginAfterDiscountBasisPoints, marginAssumptionDigest, resultingDiscountSetDigest, undiscountedP75RevenueAmount, discountedP75RevenueAmount, p75VariableCostAmount, costEvidenceDigest, marginFormulaDigest, marginEvidenceAsOf, oversightReason, oversightExpiresAt, oversightApproverId, oversightDecisionDigest, proposedBy, approverId, sourceReceiptDigest, signatureDigest]
      eligible_line_kind_order: [WORKSPACE_BASE, ACTIVE_CONTRIBUTOR_BLOCK, PROCESSING_CREDIT_OVERAGE, STORAGE_GB_MONTH_OVERAGE, API_RECORD_UNIT_OVERAGE, SLA_ADD_ON]
      record_digest_type: DiscountDecisionRecordCanonicalV1
      record_digest_rule: hash the decision canonical value including decision_digest but excluding record_digest and created_at
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: effective_until plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [DISCOUNT_DECISION, id, root_discount_id, organization_id]
      backup_behavior: preserve immutable fact and re-evaluate schedule, restoration suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository:
      insert_identity: [id]
      import_lock_order: [contract period, tariff version, current predecessor leaf, organization+contract advisory lock, overlapping discount leaves ordered by root_discount_id and revision, users ordered by id, insert, audit chain head, outbox]
      detail_order: [id]
      history_order: [root_discount_id, revision ASC, id ASC]
      effective_order: [effective_from ASC, root_discount_id ASC, revision DESC, id ASC]
      effective_projection: Only the unique terminal ACTIVE leaf of each root contributes; WITHDRAWN contributes zero. A different-root overlap on any component is corruption.
      roundtrip: The six booleans are expanded to the exact canonical line-kind order; repository never treats null basis points as zero or stacks overlapping decisions.
      errors: [DISCOUNT_INVALID, DISCOUNT_AUTHORITY_REQUIRED]

  ops.accounting_corrections:
