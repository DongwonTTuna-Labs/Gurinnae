      - {name: accounting_correction_cost_allocation_fk, columns: [target_cost_allocation_id], references: 'ops.cost_allocations(id)', on_delete: RESTRICT}
      - {name: accounting_correction_invoice_fact_fk, columns: [target_invoice_fact_id], references: 'ops.invoice_facts(id)', on_delete: RESTRICT}
      - {name: accounting_correction_invoice_line_fact_fk, columns: [target_invoice_line_fact_id], references: 'ops.invoice_line_facts(id)', on_delete: RESTRICT}
      - {name: accounting_correction_revenue_fact_fk, columns: [target_revenue_fact_id], references: 'ops.revenue_facts(id)', on_delete: RESTRICT}
      - {name: accounting_correction_proposer_fk, columns: [proposed_by], references: 'ops.users(id)', on_delete: RESTRICT}
      - {name: accounting_correction_approver_fk, columns: [approver_id], references: 'ops.users(id)', on_delete: RESTRICT}
    unique_constraints:
      - {name: accounting_correction_root_revision_uq, columns: [root_correction_id, revision]}
      - {name: accounting_correction_target_sequence_uq, columns: [target_fact_kind, target_fact_id, target_amount_kind, correction_sequence]}
      - {name: accounting_correction_source_identity_uq, columns: [deployment_id, source_system_id, source_record_identity_digest, target_fact_kind, target_fact_id, target_amount_kind]}
      - {name: accounting_correction_identity_digest_uq, columns: [correction_identity_digest]}
      - {name: accounting_correction_record_digest_uq, columns: [record_digest]}
    checks:
      - {name: accounting_correction_scope_ck, expression: "(scope_kind = 'DEPLOYMENT' AND organization_id IS NULL) OR (scope_kind = 'ORGANIZATION' AND organization_id IS NOT NULL)"}
      - {name: accounting_correction_revision_ck, expression: revision > 0 AND correction_sequence > 0}
      - {name: accounting_correction_interval_ck, expression: period_start < period_end}
      - {name: accounting_correction_timezone_ck, expression: length(btrim(accounting_timezone)) BETWEEN 1 AND 63}
      - {name: accounting_correction_amount_ck, expression: "((correction_kind IN ('ADJUSTMENT','REPLACEMENT') AND amount <> 0) OR (correction_kind = 'REVERSAL' AND amount = 0)) AND effective_delta <> 0 AND resulting_effective_amount >= 0 AND currency ~ '^[A-Z]{3}$'"}
      - {name: accounting_correction_sod_ck, expression: proposed_by <> approver_id}
      - name: accounting_correction_chain_shape_ck
        expression: "(correction_kind = 'ADJUSTMENT' AND revision = 1 AND root_correction_id = id AND supersedes_correction_id IS NULL AND reverses_correction_id IS NULL AND predecessor_correction_digest IS NULL AND effective_delta = amount) OR (correction_kind = 'REPLACEMENT' AND revision > 1 AND root_correction_id <> id AND supersedes_correction_id IS NOT NULL AND reverses_correction_id IS NULL AND predecessor_correction_digest IS NOT NULL) OR (correction_kind = 'REVERSAL' AND revision > 1 AND root_correction_id <> id AND supersedes_correction_id IS NULL AND reverses_correction_id IS NOT NULL AND predecessor_correction_digest IS NOT NULL)"
      - name: accounting_correction_target_ck
        expression: "(num_nonnulls(target_cost_event_id, target_cost_allocation_id, target_invoice_fact_id, target_invoice_line_fact_id, target_revenue_fact_id) = 1 AND target_fact_id IS NOT DISTINCT FROM CASE target_fact_kind WHEN 'COST_EVENT' THEN target_cost_event_id WHEN 'COST_ALLOCATION' THEN target_cost_allocation_id WHEN 'INVOICE_FACT' THEN target_invoice_fact_id WHEN 'INVOICE_LINE_FACT' THEN target_invoice_line_fact_id WHEN 'REVENUE_FACT' THEN target_revenue_fact_id ELSE NULL END AND CASE target_fact_kind WHEN 'COST_EVENT' THEN target_cost_event_id WHEN 'COST_ALLOCATION' THEN target_cost_allocation_id WHEN 'INVOICE_FACT' THEN target_invoice_fact_id WHEN 'INVOICE_LINE_FACT' THEN target_invoice_line_fact_id WHEN 'REVENUE_FACT' THEN target_revenue_fact_id ELSE NULL END IS NOT NULL) IS TRUE"
      - {name: accounting_correction_target_amount_kind_ck, expression: "((target_fact_kind = 'COST_EVENT' AND target_amount_kind = 'COST_EVENT_AMOUNT') OR (target_fact_kind = 'COST_ALLOCATION' AND target_amount_kind IN ('COST_ALLOCATION_ALLOCATED_AMOUNT','COST_ALLOCATION_UNALLOCATED_AMOUNT')) OR (target_fact_kind = 'INVOICE_FACT' AND target_amount_kind = 'INVOICE_TOTAL') OR (target_fact_kind = 'INVOICE_LINE_FACT' AND target_amount_kind = 'INVOICE_LINE_TOTAL') OR (target_fact_kind = 'REVENUE_FACT' AND target_amount_kind = 'REVENUE_AMOUNT')) IS TRUE"}
      - {name: accounting_correction_source_system_ck, expression: length(btrim(source_system_id)) BETWEEN 1 AND 100}
      - {name: accounting_correction_digest_ck, expression: "source_record_identity_digest ~ '^[0-9a-f]{64}$' AND correction_identity_digest ~ '^[0-9a-f]{64}$' AND accounting_policy_digest ~ '^[0-9a-f]{64}$' AND target_fact_digest ~ '^[0-9a-f]{64}$' AND (predecessor_correction_digest IS NULL OR predecessor_correction_digest ~ '^[0-9a-f]{64}$') AND resulting_correction_set_digest ~ '^[0-9a-f]{64}$' AND decision_digest ~ '^[0-9a-f]{64}$' AND source_receipt_digest ~ '^[0-9a-f]{64}$' AND signature_digest ~ '^[0-9a-f]{64}$' AND record_digest ~ '^[0-9a-f]{64}$'"}
    indexes:
      - {name: accounting_correction_one_successor_uq, unique: true, expression: 'COALESCE(supersedes_correction_id, reverses_correction_id)', where: supersedes_correction_id IS NOT NULL OR reverses_correction_id IS NOT NULL}
      - {name: accounting_correction_target_idx, columns: [target_fact_kind, target_fact_id, target_amount_kind, correction_sequence ASC, id]}
      - {name: accounting_correction_root_history_idx, columns: [root_correction_id, revision ASC, id]}
      - {name: accounting_correction_period_idx, columns: [deployment_id, period_start ASC, period_end ASC, id]}
      - {name: accounting_correction_supersedes_fk_idx, columns: [supersedes_correction_id, id], where: supersedes_correction_id IS NOT NULL}
      - {name: accounting_correction_reverses_fk_idx, columns: [reverses_correction_id, id], where: reverses_correction_id IS NOT NULL}
      - {name: accounting_correction_cost_event_fk_idx, columns: [target_cost_event_id, id], where: target_cost_event_id IS NOT NULL}
      - {name: accounting_correction_cost_allocation_fk_idx, columns: [target_cost_allocation_id, id], where: target_cost_allocation_id IS NOT NULL}
      - {name: accounting_correction_invoice_fact_fk_idx, columns: [target_invoice_fact_id, id], where: target_invoice_fact_id IS NOT NULL}
      - {name: accounting_correction_invoice_line_fk_idx, columns: [target_invoice_line_fact_id, id], where: target_invoice_line_fact_id IS NOT NULL}
      - {name: accounting_correction_revenue_fact_fk_idx, columns: [target_revenue_fact_id, id], where: target_revenue_fact_id IS NOT NULL}
      - {name: accounting_correction_proposer_fk_idx, columns: [proposed_by, id]}
      - {name: accounting_correction_approver_fk_idx, columns: [approver_id, id]}
    trigger_contracts:
      - name: accounting_correction_target_and_chain_guard
        timing: BEFORE INSERT
        isolation: SERIALIZABLE
        rules:
          - Lock the exact concrete target row and select only target_amount_kind: ops.cost_events.amount; a LINE cost allocation allocated_amount; a PERIOD cost allocation unallocated_amount; invoice_facts.invoice_total; invoice_line_facts.line_total; or revenue_facts.amount. Any row-kind/amount-kind mismatch is ACCOUNTING_CORRECTION_INVALID.
          - Compare the target's canonical digest, selected currency, deployment/organization scope, accounting_timezone, accounting_policy_digest and accounting interval; a missing or changed target is ACCOUNTING_FACT_NOT_FOUND or FACT_CONFLICT. Base ops.cost_events uses a canonical locked-row digest and the deployment policy because the immutable base row has no digest columns.
          - Lock all corrections for the exact target_fact_kind, target_fact_id and target_amount_kind in correction_sequence then id order; the inserted sequence equals max plus one and no other target amount participates.
          - REPLACEMENT or REVERSAL points to the unique current terminal leaf of the same root, target, scope, currency and interval, binds predecessor_correction_digest to its record_digest, and increments revision exactly one; branching or cycles are impossible.
          - amount is the desired terminal root adjustment: ADJUSTMENT stores a nonzero initial amount, REPLACEMENT stores the complete nonzero replacement amount, and REVERSAL stores zero.
          - effective_delta is explicit and trigger-verified: ADJUSTMENT equals amount; REPLACEMENT equals amount minus the locked root's cumulative prior effective_delta; REVERSAL equals the negative of that cumulative prior effective_delta. Cross-row formulas are never delegated to a generated column.
          - resulting_effective_amount equals the selected original target amount plus every correction row effective_delta in correction_sequence order, including this row; resulting_correction_set_digest binds that exact ordered set.
          - resulting_effective_amount is nonnegative for every target kind. Allocation and invoice corrections remain pending accounting inputs until a new immutable allocation or reconciled invoice binds the resulting set and passes all allocation/invoice conservation equations; no margin, revenue or invoice claim reads a free-floating correction as final.
          - correction_identity_digest is recomputed from deployment, source system, source-record identity, exact concrete target kind/ID/amount-kind and source receipt. The same source record may correct several concrete lines, but can address one exact target amount only once; a changed payload for that identity is FACT_CONFLICT.
          - correction_sequence is the sole persisted application order. created_at and id are stable read-order tie breakers only and never replace or renumber the gapless sequence.
          - AccountingCorrection cannot target another AccountingCorrection. A bad correction is corrected only through its own replacement or reversal chain.
      - {name: accounting_correction_immutable, timing: BEFORE UPDATE OR DELETE, function: ops.reject_mutation()}
    digest_contract:
      field: record_digest
      canonical_type: AccountingCorrectionCanonicalV1
      field_order: [schemaVersion, id, deploymentId, scopeKind, organizationId, accountingTimezone, accountingPolicyDigest, rootCorrectionId, revision, correctionSequence, correctionKind, supersedesCorrectionId, reversesCorrectionId, predecessorCorrectionDigest, sourceSystemId, sourceRecordIdentityDigest, correctionIdentityDigest, targetFactKind, targetAmountKind, targetFactId, targetFactDigest, periodStart, periodEnd, amount, effectiveDelta, resultingEffectiveAmount, resultingCorrectionSetDigest, currency, reasonCode, proposedBy, approverId, decisionDigest, sourceReceiptDigest, signatureDigest]
    correction_semantics:
      original: immutable and always queryable
      chain_leaf: Each root has exactly one terminal leaf whose amount is the desired root adjustment; predecessor digests make the chain tamper-evident.
      effective_value: original monetary value plus the sum of every immutable row's effective_delta within the exact target amount kind ordered by correction_sequence, created_at then id; replacement and reversal ledger movements telescope to the terminal leaf amount
      equivalent_oracle: For each root, the sum of all row effective_delta equals the terminal leaf amount; across roots, original plus all row effective_delta equals original plus the sum of terminal leaf amounts, treating REVERSAL leaf amount as zero.
      historical_snapshot: an invoice, allocation, export or metric binds the ordered correction-set digest it used; later corrections do not silently change that historical receipt
      restatement: a new projection or invoice uses a new ordered correction-set digest and links both old and new receipts
    privileges: *commercial_fact_grants
    rls: *commercial_fact_rls
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: period_end plus the accounting record-class schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: [ACCOUNTING_CORRECTION, id, root_correction_id, target_fact_kind, target_fact_id]
      backup_behavior: preserve immutable fact and re-evaluate schedule, restoration suppression and hold union before restored use
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository:
      insert_identity: [id]
      import_lock_order: [concrete target row, target corrections by correction_sequence and id, predecessor leaf, users ordered by id, correction insert, audit chain head, outbox]
      detail_order: [id]
      target_history_order: [correction_sequence ASC, root_correction_id ASC, revision ASC, id ASC]
      effective_ledger_order: [correction_sequence ASC, created_at ASC, id ASC]
      roundtrip: Exact concrete target option is preserved; num_nonnulls must be one, numeric sign and scale remain exact, and null organization scope is not synthesized.
      errors: [ACCOUNTING_CORRECTION_INVALID, ACCOUNTING_FACT_NOT_FOUND]

  ops.commercial_qualification_receipts:
    owner:
      logical_component: commercial-qualification-importer
      physical_service: workflow-worker
      rust_type: gurine_domain::economics::CommercialQualificationReceipt
      repository: crates/persistence-postgres::commercial_qualification_receipts
    creation_order: 21
    purpose: One append-only, privacy-minimized human qualification-episode authority; every later business stage is a deterministic read projection rather than a second lifecycle ledger.
