authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0044 remain byte-preserved; the MODEL_INPUT binding repair is
    forward-only in 0045
  transaction_rule: one outer BEGIN is the first pglast statement and terminal COMMIT is the last statement
  pre_dispatch_rule: a MODEL_INPUT row is accepted only for the exact DISPATCHED provider turn and carries that turn ID plus
    its persisted input_snapshot_sha256 as the temporary receipt tuple
  promotion_rule: the existing provider-turn completion owner update invokes an AFTER trigger that promotes every sentinel
    MODEL_INPUT row to the exact authenticated terminal receipt in the same transaction
  immutable_row_rule: promotion changes only provider_receipt_id, provider_receipt_sha256, source_use_canonical, and
    source_use_sha256; source identity, evidence, rights, locator, selected-content, parent, and occurrence fields remain
    immutable
  idempotency_rule: one MODEL_INPUT row per qualified parent is required; duplicate, mixed sentinel-and-receipt, partial, or
    missing lineage states fail closed, while an already exact receipt state is a no-op
  downstream_reference_rule: a sentinel row already referenced by a child source use, citation, or research-artifact
    promotion cannot have its digest changed
