privilege_contract:
  owner_role: gurine_migrator owns all three listed routines
  public_execute_rule: PUBLIC EXECUTE is explicitly revoked from every listed routine
  explicit_execute_grants: {}
  runtime_entry_rule: 0045 contains no GRANT statement; receipt promotion is reached only from the existing
    gurine_migrator-owned provider-turn completion boundary through the installed AFTER trigger
  relation_acl_rule: 0045 grants no direct relation DML and changes no existing role capability or membership
model_input_lineage_authority:
  sentinel_identity: provider_receipt_id equals provider_turn_id and provider_receipt_sha256 equals the persisted
    input_snapshot_sha256 for that DISPATCHED turn
  terminal_statuses: [COMPLETED, PROVIDER_FAILED, RATE_LIMITED, TIMED_OUT, CANCELLED, OUTCOME_UNKNOWN]
  canonical_rule: sentinel and promoted rows each carry canonical JSON whose embedded IDs, receipt tuple, occurredAt, and
    sourceUseSha256 reproduce the stored columns and SHA-256 digest
  qualified_root_rule: MODEL_INPUT cardinality must equal the distinct qualified TOOL_QUERY source roots bound through the
    dataset member, evidence segment, member source, and exact asset-rights decision
  failure_visibility_rule: when transport fails without a receipt, the turn remains DISPATCHED and the sentinel MODEL_INPUT
    rows remain queryable with their complete evidence, rights, locator, and selected-content bindings
known_fail_closed_boundaries:
  missing_or_duplicate_lineage: terminal turn completion rolls back when MODEL_INPUT rows are absent, duplicated by parent,
    or do not cover the exact qualified root set
  receipt_state: a foreign receipt, mixed sentinel and actual receipt state, partial promotion, or sentinel-shaped terminal
    receipt is rejected
  downstream_digest_references: promotion is rejected rather than rewriting any existing child, citation, or artifact
    promotion reference
  privilege_expansion: no new runtime-role GRANT, capability, membership, or relation privilege is introduced
verification_obligations:
- pglast parses exactly 15 statements with one BEGIN first and one terminal COMMIT last
- CREATE TABLE, CREATE VIEW, explicit index, and event-registry upsert inventories are empty and relation_delta is zero
- all three routine signatures, both trigger statements, both altered-relation targets, migration SHA-256, canonical DDL
  hashes, and object inventory SHA-256 reproduce from the current SQL bytes
- PostgreSQL 18.4 proves pre-dispatch MODEL_INPUT rows exist before provider egress and survive a receipt-less transport
  failure with their evidence bindings queryable
- PostgreSQL 18.4 proves terminal receipt promotion preserves source-use identity, creates no second lineage branch, and an
  exact retry creates no duplicate row
- catalog ACL verification proves 0045 adds no GRANT and PUBLIC cannot execute any listed routine
