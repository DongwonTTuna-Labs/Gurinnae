    primary_key:
      name: outcome_facts_pkey
      columns: [id]
    foreign_keys:
      - {name: outcome_facts_root_fk, columns: [root_fact_id], target: ops.outcome_facts, target_columns: [id], on_delete: RESTRICT, deferrable: true, initially: IMMEDIATE}
      - {name: outcome_facts_supersedes_fk, columns: [supersedes_fact_id], target: ops.outcome_facts, target_columns: [id], on_delete: RESTRICT, deferrable: false}
      - {name: outcome_facts_paid_packet_fk, columns: [paid_packet_id, paid_packet_version, paid_packet_digest, organization_id, paid_subject_kind, paid_terminal_receipt_kind, terminal_receipt_id, terminal_receipt_version, terminal_receipt_digest, paid_terminal_resulting_state, effective_from], target: ops.paid_evidence_packets, target_columns: [packet_id, packet_version, packet_digest, organization_id, subject_kind, terminal_receipt_kind, terminal_receipt_id, terminal_receipt_version, terminal_receipt_digest, terminal_resulting_state, terminal_effective_at], on_delete: RESTRICT, deferrable: true, initially: DEFERRED, match: FULL, install_after_parent: true}
    unique_constraints:
      - {name: outcome_facts_digest_unique, columns: [fact_digest]}
      - {name: outcome_facts_root_sequence_unique, columns: [root_fact_id, correction_sequence]}
      - {name: outcome_facts_invalidation_binding_unique, columns: [id, correction_sequence, fact_digest]}
      - {name: outcome_facts_paid_binding_unique, columns: [id, fact_digest, organization_id, paid_subject_kind, terminal_receipt_id, terminal_receipt_version, terminal_receipt_digest, paid_terminal_receipt_kind, paid_terminal_resulting_state, effective_from, paid_packet_id, paid_packet_version, paid_packet_digest]}
    checks:
      - name: outcome_facts_subject_scope_digest_lower_hex
        expression: "subject_scope_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_metric_policy_digest_lower_hex
        expression: "metric_policy_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_workflow_digests_lower_hex
        expression: "workflow_instance_hmac ~ '^[0-9a-f]{64}$' AND workflow_proof_digest ~ '^[0-9a-f]{64}$' AND milestone_set_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_terminal_receipt_digest_lower_hex
        expression: "terminal_receipt_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_paid_packet_digest_lower_hex
        expression: "paid_packet_digest IS NULL OR paid_packet_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_formula_digest_lower_hex
        expression: "formula_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_correction_decision_digest_lower_hex
        expression: "correction_decision_digest IS NULL OR correction_decision_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_correction_receipt_digest_lower_hex
        expression: "correction_receipt_digest IS NULL OR correction_receipt_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_schedule_digest_lower_hex
        expression: "schedule_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_fact_digest_lower_hex
        expression: "fact_digest ~ '^[0-9a-f]{64}$'"
      - name: outcome_facts_sequence_positive
        expression: correction_sequence > 0
      - name: outcome_facts_contract_version_shape
        expression: "(fact_contract_version = 1 AND num_nonnulls(paid_packet_id,paid_packet_version,paid_packet_digest,paid_subject_kind,paid_terminal_receipt_kind,paid_terminal_resulting_state) = 0) OR (fact_contract_version = 2 AND num_nonnulls(paid_packet_id,paid_packet_version,paid_packet_digest,paid_subject_kind,paid_terminal_receipt_kind,paid_terminal_resulting_state) = 6)"
      - name: outcome_facts_versions_positive
        expression: "workflow_key_version > 0 AND subject_scope_key_version > 0 AND terminal_receipt_version > 0 AND formula_version > 0 AND schedule_revision > 0"
      - name: outcome_facts_workflow_proof_object
        expression: "jsonb_typeof(workflow_proof) = 'object'"
      - name: outcome_facts_workflow_completion_time
        expression: workflow_completed_at = effective_from
      - name: outcome_facts_effect_closed
        expression: "fact_effect IN ('ORIGINAL','INVERSE','SUPERSEDING')"
      - name: outcome_facts_type_closed
        expression: "fact_type IN ('TRIAGED_SIGNAL','REVIEWED_INVESTIGATION','ACCEPTED_PROPOSAL','AUDITED_DELIVERY','COMPLETED_DECISION_CYCLE','PUBLICATION','CORRECTION')"
      - name: outcome_facts_scope_closed
        expression: "scope_kind IN ('PUBLIC','ORGANIZATION')"
      - name: outcome_facts_scope_identity
        expression: "(scope_kind = 'PUBLIC' AND organization_id IS NULL) OR (scope_kind = 'ORGANIZATION' AND organization_id IS NOT NULL)"
      - name: outcome_facts_metric_timezone_shape
        expression: "length(metric_timezone) BETWEEN 1 AND 64 AND (metric_timezone = 'UTC' OR metric_timezone ~ '^[A-Za-z][A-Za-z0-9._+-]*/[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*$')"
      - name: outcome_facts_receipt_kind_closed
        expression: "terminal_receipt_kind IN ('SIGNAL_TRIAGE','REVIEW_DECISION','EXECUTION','OUTBOUND_DELIVERY','ORGANIZATION_DECISION','PUBLICATION','CORRECTION')"
      - name: outcome_facts_type_receipt_match
        expression: "(fact_type = 'TRIAGED_SIGNAL' AND terminal_receipt_kind = 'SIGNAL_TRIAGE') OR (fact_type = 'REVIEWED_INVESTIGATION' AND terminal_receipt_kind = 'REVIEW_DECISION') OR (fact_type = 'ACCEPTED_PROPOSAL' AND terminal_receipt_kind = 'EXECUTION') OR (fact_type = 'AUDITED_DELIVERY' AND terminal_receipt_kind = 'OUTBOUND_DELIVERY') OR (fact_type = 'COMPLETED_DECISION_CYCLE' AND terminal_receipt_kind = 'ORGANIZATION_DECISION') OR (fact_type = 'PUBLICATION' AND terminal_receipt_kind = 'PUBLICATION') OR (fact_type = 'CORRECTION' AND terminal_receipt_kind = 'CORRECTION')"
      - name: outcome_facts_paid_packet_shape
        expression: "fact_contract_version = 1 OR (paid_packet_version = 2 AND scope_kind = 'ORGANIZATION' AND organization_id IS NOT NULL AND paid_subject_kind::text = fact_type AND paid_terminal_receipt_kind::text = terminal_receipt_kind AND ((paid_subject_kind = 'AUDITED_DELIVERY' AND paid_terminal_receipt_kind = 'OUTBOUND_DELIVERY' AND paid_terminal_resulting_state IN ('DELIVERED','READ')) OR (paid_subject_kind = 'COMPLETED_DECISION_CYCLE' AND paid_terminal_receipt_kind = 'ORGANIZATION_DECISION' AND paid_terminal_resulting_state IN ('REJECTED_FINAL','EFFECT_SUCCEEDED'))))"
      - name: outcome_facts_effective_interval
        expression: effective_until IS NULL OR effective_until > effective_from
      - name: outcome_facts_correction_shape
        expression: "(fact_effect = 'ORIGINAL' AND root_fact_id = id AND supersedes_fact_id IS NULL AND correction_sequence = 1 AND correction_reason_code IS NULL AND correction_decision_digest IS NULL AND correction_receipt_id IS NULL AND correction_receipt_digest IS NULL) OR (fact_effect IN ('INVERSE','SUPERSEDING') AND root_fact_id <> id AND supersedes_fact_id IS NOT NULL AND correction_sequence > 1 AND correction_reason_code IS NOT NULL AND correction_reason_code ~ '^[A-Z][A-Z0-9_]{0,63}$' AND correction_decision_digest IS NOT NULL AND correction_receipt_id IS NOT NULL AND correction_receipt_digest IS NOT NULL)"
      - name: outcome_facts_record_class_fixed
        expression: record_class = 'PRODUCT_OUTCOME_FACT'
    canonical_version_contract:
      V1:
        discriminator: fact_contract_version = 1
        preimage: OutcomeFactCanonicalV1 exact pre-0029 immutable field order; fact_contract_version and all paid_* columns are excluded so existing fact_digest bytes remain unchanged
        backfill: every preexisting row receives fact_contract_version=1 and null paid columns without rewriting or recomputing fact_digest
      V2:
        discriminator: fact_contract_version = 2
        preimage: OutcomeFactCanonicalV2 is V1 ordered fields followed by paidPacketId, paidPacketVersion, paidPacketDigest, paidSubjectKind, paidTerminalReceiptKind and paidTerminalResultingState; only recorded_at and fact_digest are excluded
        creation: only ops.bind_paid_terminal_receipt_v1 may append ORIGINAL V2 and only ops.append_outcome_fact_correction_v2 may append a correction that copies the complete paid tuple byte-for-byte from the locked predecessor
      selection: ops.read_paid_mvw_inputs_v1 selects only current non-INVERSE V2 heads with an exact reciprocal packet FK; V1 facts remain valid operational outcomes but never paid MVW
    indexes:
      - {name: outcome_facts_supersedes_unique, unique: true, method: btree, keys: [supersedes_fact_id], include: [], predicate: "supersedes_fact_id IS NOT NULL"}
      - {name: outcome_facts_original_receipt_unique, unique: true, method: btree, keys: [deployment_id, terminal_receipt_kind, terminal_receipt_id, formula_version], include: [], predicate: "fact_effect = 'ORIGINAL'"}
      - {name: outcome_facts_original_workflow_unique, unique: true, method: btree, keys: [deployment_id, workflow_instance_hmac, formula_version], include: [], predicate: "fact_effect = 'ORIGINAL'"}
      - {name: outcome_facts_window_idx, method: btree, keys: [deployment_id, scope_kind, organization_id, fact_type, effective_from, id], include: [effective_until, root_fact_id, correction_sequence, fact_effect, fact_digest], predicate: null}
      - {name: outcome_facts_workflow_idx, method: btree, keys: [workflow_instance_hmac, "correction_sequence DESC", id], include: [workflow_proof_digest, milestone_set_digest, fact_effect, fact_digest], predicate: null}
      - {name: outcome_facts_chain_idx, method: btree, keys: [root_fact_id, "correction_sequence DESC", "id DESC"], include: [fact_effect, fact_type, effective_from, effective_until, fact_digest], predicate: null}
      - {name: outcome_facts_terminal_receipt_idx, method: btree, keys: [terminal_receipt_kind, terminal_receipt_id, terminal_receipt_version], include: [terminal_receipt_digest, fact_digest], predicate: null}
      - {name: outcome_facts_metric_idx, method: btree, keys: [fact_type, effective_from, id], include: [deployment_id, scope_kind, organization_id, root_fact_id, correction_sequence], predicate: null}
    triggers:
      - name: outcome_facts_validate_insert
        timing: BEFORE
        events: [INSERT]
        function: ops.validate_outcome_fact_v1()
        guarantees:
          - the closed terminal receipt kind resolves to exactly one authoritative stored receipt with matching ID, version and digest
          - page views, drafts, failed jobs, raw signals, fixtures and unreviewed AI output are rejected
          - metric_timezone exists in pg_timezone_names and metric_policy_digest binds the versioned formula, population, exclusions, timezone, window, owner, freshness, threshold and breach action
          - workflow_proof decodes only as sqlx::types::Json<VerifiedWorkflowProofV1> with additional fields forbidden and contains no raw object title, query, response, evidence, token, filename, user, session or contact identity
          - the ordered proof has exactly OBJECT_FOUND, STATE_FRESHNESS_LIMITATION_SEEN, REVISION_EVIDENCE_OR_REPRODUCTION_OPENED and RESPONSIBLE_OUTCOME_COMPLETED milestones for one workflow_instance_hmac
          - an ORIGINAL proof milestone binds an existing nonexpired product_event ID, event digest, occurred_at and allowed screen/event meaning; times are nondecreasing and the final milestone binds terminal_receipt_id and terminal_receipt_digest
          - milestone_set_digest is the canonical ordered milestone digest and workflow_proof_digest is Gurine Canonical JSON v1 SHA-256 of the complete proof
          - absent, expired, cross-workflow, duplicated, reordered or semantically incomplete milestones reject fact creation; analytics loss therefore undercounts and never fabricates a Verified Workflow
          - PUBLIC subject_scope_digest is deployment-keyed HMAC-SHA-256 of terminal receipt kind and ID, never actor, browser, session or response identity; ORGANIZATION scope is the HMAC of configured organization_id
          - subject_scope_digest stores no search, response, evidence, token, filename or personal identity content
          - an INVERSE copies the superseded fact identity, workflow proof, scope, type, terminal receipt, effective interval and formula exactly and therefore does not depend on already-expired product events
          - a SUPERSEDING fact keeps root, fact type, deployment, metric timezone, workflow instance, scope, subject digest and terminal receipt identity/version/digest fixed; after source product events expire it may copy but not alter workflow proof, while a changed proof requires every source event to remain present and valid
          - a V1 row has no paid tuple; a V2 ORIGINAL is created only in the packet-finalization transaction, and every V2 INVERSE or SUPERSEDING correction copies packet ID/version/digest, paid subject kind, paid terminal kind and paid resulting state byte-for-byte from the locked predecessor
          - fact_digest is recomputed using the exact versioned canonical preimage; migration backfill never changes a V1 digest and a V2 preimage includes every paid field
          - correction_sequence is previous sequence plus one and fact_digest is canonical over every immutable column except recorded_at
          - record-class schedule binding is current and nonexpired
          - ORIGINAL validates root_fact_id = NEW.id without querying the not-yet-visible row; INVERSE and SUPERSEDING select the stored root and current head FOR UPDATE
      - name: outcome_facts_immutable
        timing: BEFORE
        events: [UPDATE, DELETE]
        function: ops.reject_mutation()
    privileges:
      gurine_public_api: []
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_public_projector: []
      gurine_notification_worker: []
      gurine_workflow_worker: [SELECT]
      gurine_document_extractor: []
      gurine_scheduler: []
      gurine_auditor: [SELECT]
      gurine_identity_api: []
    function_privileges:
      ops.append_outcome_fact_v1:
        gurine_workflow_worker: [EXECUTE]
      ops.read_public_outcome_projection_inputs_v1:
        gurine_public_projector: []
      public.project_public_outcome_fact_v2:
        gurine_public_projector: [EXECUTE]
    write_boundary:
      function: ops.append_outcome_fact_v1
      signature: "ops.append_outcome_fact_v1(jsonb,uuid,char(64))"
      arguments: ["fact Json<OutcomeFactAppendV1>", "expected_head_id nullable for ORIGINAL", "expected_head_digest nullable for ORIGINAL"]
      returns: ops.economics_mutation_receipt_v1
      idempotency_scope: ECONOMICS.APPEND_OUTCOME_FACT.V1
      paid_internal_helper:
        function: ops.append_paid_outcome_fact_v2
        execute_roles: []
        caller: ops.bind_paid_terminal_receipt_v1 owner context only
        rule: not an independently callable journey step; it inserts the V2 outcome, audit and product.fact_recorded.v1 outbox inside the packet-binding SERIALIZABLE transaction
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, editorial, intake, public, pg_temp]
      revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_notification_worker, gurine_workflow_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
      payload_rule: jsonb validates as a closed OutcomeFactAppendV1 before any lookup; serde_json::Value, unknown properties and string dispatch are forbidden
      isolation_guard: current_setting('transaction_isolation') must equal serializable before any lock or insert
      lock_rule: lock terminal receipt, root and current head in lexical UUID order; ORIGINAL has no stored self-row lookup
      conflict_mapping: unique violation or serialization failure caused by a stale requested head maps to FACT_CONFLICT; the function never invents or automatically appends a different successor
    rls:
      enabled: false
      forced: false
      reason: Single-organization physical deployment; no tenant, public, submission or editorial-analysis direct access. Commercial identity is isolated by exact role grants.
    retention:
      record_class: PRODUCT_OUTCOME_FACT
      trigger: schedule review, privacy request or legal-hold evaluation; never age-based in-place mutation
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision recorded by schedule_revision and schedule_digest
      legal_hold_key: "object_type=PRODUCT_OUTCOME_FACT, object_id=id, affected_digest=fact_digest, subject_scope_digest=subject_scope_digest"
      backup_behavior: Restore the entire immutable correction chain, apply restoration suppressions and holds, then materialize only the unique current head.
      terminal_action: PRESERVE_IMMUTABLE_FACT; corrections append INVERSE or SUPERSEDING rows and never rewrite or delete an original
    repository_round_trip:
      append_original: SERIALIZABLE; lock and validate the terminal receipt, insert fact, audit and product.fact_recorded.v1 outbox atomically.
      append_correction: SERIALIZABLE; lock root and current head, validate decision receipt, append one chain row, audit and product.fact_corrected.v1 outbox atomically.
      replay: Same original receipt identity or correction identity plus fact_digest returns the stored fact; changed digest is FACT_CONFLICT.
      current_fact_rule: For each root_fact_id choose exactly the greatest correction_sequence; INVERSE contributes zero and ORIGINAL or SUPERSEDING contributes one Verified Workflow only because the insert function has validated the complete ordered workflow proof.
      stable_chain_order: ["correction_sequence ASC", "id ASC"]
      stable_metric_order: ["effective_from ASC", "id ASC"]
      missing_rule: Missing or ambiguous terminal receipt is an explicit error; never synthesize a fact, zero, scope or effective time.
      test_identity: AC-OA-TABLE-OPS-OUTCOME_FACTS-CONTRACT
    event_projection:
      ORIGINAL:
        event: product.fact_recorded.v1
        payload_mapping: {factId: id, factType: fact_type, deploymentId: deployment_id, metricTimezone: metric_timezone, metricPolicyDigest: metric_policy_digest, workflowInstanceHmac: workflow_instance_hmac, workflowProofDigest: workflow_proof_digest, milestoneSetDigest: milestone_set_digest, subjectScopeDigest: subject_scope_digest, terminalReceiptId: terminal_receipt_id, effectiveFrom: effective_from, effectiveUntil: effective_until, formulaVersion: formula_version, factDigest: fact_digest}
      INVERSE_OR_SUPERSEDING:
        event: product.fact_corrected.v1
        payload_mapping: {correctionFactId: id, originalFactId: root_fact_id, inverseOrSuperseding: fact_effect, reasonCode: correction_reason_code, decisionDigest: correction_decision_digest, factDigest: fact_digest}

  ops.acquisition_source_receipts:
    creation_order: 4
    purpose: Immutable privacy-minimized attribution receipts proving an organization's acquisition campaign/source without storing lead, contact, message, query, cookie or person-level touchpoint content.
    object_owner: gurine_migrator
    mutation_class: IMMUTABLE
    rust_type: gurine_domain::economics::AcquisitionSourceReceipt
    repository: crates/persistence-postgres::product_economics::AcquisitionSourceReceiptRepository
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: root_receipt_id, type: uuid, nullable: false, default: null}
      - {name: revision, type: bigint, nullable: false, default: null}
      - {name: receipt_effect, type: text, nullable: false, default: null}
      - {name: supersedes_receipt_id, type: uuid, nullable: true, default: null}
      - {name: predecessor_receipt_digest, type: "char(64)", nullable: true, default: null}
