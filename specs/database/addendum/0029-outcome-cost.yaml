      - name: cost_allocations_capture_coverage_formula
        expression: "row_kind <> 'PERIOD' OR cost_capture_state <> 'MEASURED' OR (cost_capture_coverage BETWEEN 0 AND 1 AND cost_capture_coverage = CASE WHEN expected_cost_count = 0 THEN 1::numeric ELSE ops.round_half_even_numeric_v1(captured_cost_count::numeric / expected_cost_count::numeric, 12) END)"
      - name: cost_allocations_header_amounts
        expression: "row_kind <> 'PERIOD' OR (direct_eligible_amount >= 0 AND direct_allocated_amount >= 0 AND direct_allocated_amount <= direct_eligible_amount AND captured_cost_amount >= 0 AND attributed_cost_amount >= 0 AND unallocated_amount >= 0 AND captured_cost_amount = attributed_cost_amount + unallocated_amount AND direct_coverage BETWEEN 0 AND 1 AND total_coverage BETWEEN 0 AND 1 AND direct_coverage = CASE WHEN direct_eligible_amount = 0 THEN 1::numeric ELSE ops.round_half_even_numeric_v1(direct_allocated_amount / direct_eligible_amount, 12) END AND total_coverage = CASE WHEN captured_cost_amount = 0 THEN 1::numeric ELSE ops.round_half_even_numeric_v1(attributed_cost_amount / captured_cost_amount, 12) END)"
      - name: cost_allocations_claim_state_closed
