cross_migration_dependencies:
  0028_governance_operations.sql:
    legal_hold_extension:
      - Replace the base editorial.legal_holds object_type CHECK with a closed superset containing PRODUCT_EVENT, PRODUCT_OUTCOME_FACT and COST_ALLOCATION in addition to the v13 values.
      - Make case_id and review_snapshot_id nullable only for the three generic object types; a named CHECK keeps both nonnull for CASE, PUBLICATION, EVIDENCE and RESPONSE and both null for the generic types.
      - Preserve the active object_type plus object_id unique index and append-only release model; do not copy, dual-write or rewrite existing holds.
      - place, release, retention terminal action and disclosure paths all acquire pg_advisory_xact_lock(hashtextextended('LEGAL_HOLD:' || object_type || ':' || object_id::text, 0)) before reading or writing coverage.
    restoration_suppression_extension:
      - PRODUCT_EVENT_PURGED stores SHA-256 canonical deployment_id plus emission_id as subject_scope_digest, source retention decision/receipt and an indefinite terminal suppression.
      - ops.record_product_event_v1 checks this suppression under the same advisory key before insert, so a purged emission cannot reappear from delayed delivery or restore.
    adoption_gate: Migration 0029 aborts unless the exact extended CHECKs, advisory-lock contract and suppression reason exist and validate in pg_catalog/runtime probes.

supporting_contracts:
  analytics_property_presence_v1:
    universal_required: [screen_id, surface, app_version, specification_version]
    optional: [viewport_class, success, error_code, internal_object_type, workflow_stage, result_code, duration_bucket, role_category, public_object_type, public_object_id, state, result_count_bucket, filter_category_count, step_id]
    request_null_rule: Explicit JSON null is rejected; an omitted optional key becomes SQL NULL, so omission and a claimed null value are never conflated.
    event_rule: The nonnull optional set must be a subset of that event's allowed_properties in specs/ui/analytics-events.yaml; no trigger requires every allowed optional property.
    public_object_pair: public_object_type and public_object_id are either both omitted or both present.
  analytics_scalar_catalog_v1:
    normative_path: specs/ui/analytics-scalar-contract.yaml
    required_before_migration: true
    generation_inputs: [specs/ui/analytics-events.yaml, specs/ui/screen-catalog.yaml, specs/ui/state-profile-contracts.yaml, specs/api/error-code-catalog.yaml, implementation-evidence/design-domain-closure.yaml]
    required_shape:
      - exactly 233 event_name rows at analytics-events.yaml digest 436c230e2de6edbd10c2d4f4d3f53df91147ad85bab3600cc8b0b945cf25528f
      - each row has exact consumer screen set, sensitivity, purpose, allowed optional property set, conditionally required set and per-property closed values
      - error_code values are a subset of the authoritative error catalog; object types are a subset of canonical public/internal object registries
      - duration, result-count, viewport, role, workflow-stage, result, state and step domains contain explicit bounded enums and no free-text fallback, OTHER or UNKNOWN_STRING
      - the generated immutable CASE mapping and its SHA-256 are embedded in ops.validate_product_event_v1; migration aborts on source or function digest drift
    rust_type: gurine_observability::product::AnalyticsScalarCatalogV1

