    write_boundary:
      function: ops.record_acquisition_source_receipt_v1
      signature: "ops.record_acquisition_source_receipt_v1(ops.acquisition_source_receipt_input_v1,text) RETURNS ops.economics_mutation_receipt_v1"
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, pg_temp]
      revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
      isolation_guard: current_setting('transaction_isolation') must equal serializable before any lock or insert
      idempotency_scope: ECONOMICS.RECORD_ACQUISITION_SOURCE_RECEIPT.V1
      atomic_writes: [receipt row, audit event, cost.acquisition_source_receipt_recorded.v1 outbox, canonical stored response and receipt]
    rls: {enabled: false, forced: false, reason: Single-organization private commercial attribution receipt; detection, editorial and public paths have no access.}
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: valid_until plus the accounting schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision for COMMERCIAL_ACCOUNTING_FACT
      legal_hold_key: "object_type=ACQUISITION_SOURCE_RECEIPT, object_id=id, affected_digest=receipt_digest"
      backup_behavior: Preserve typed receipt and re-evaluate schedule, suppression and hold union before CAC use; raw CRM/advertising source bodies follow their own shorter schedule.
      terminal_action: PRESERVE_IMMUTABLE_ACCOUNTING_FACT
    repository_round_trip:
