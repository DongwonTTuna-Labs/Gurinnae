      - {name: cost_allocations_supersedes_fk_idx, method: btree, keys: [supersedes_period_revision_id, supersedes_period_row_kind, id], include: [], predicate: "supersedes_period_revision_id IS NOT NULL"}
      - {name: cost_allocations_period_header_unique, unique: true, method: btree, keys: [deployment_id, period_start, period_end, currency, period_version], include: [], predicate: "row_kind = 'PERIOD'"}
      - {name: cost_allocations_supersedes_unique, unique: true, method: btree, keys: [supersedes_period_revision_id], include: [], predicate: "row_kind = 'PERIOD' AND supersedes_period_revision_id IS NOT NULL"}
      - {name: cost_allocations_close_receipt_id_unique, unique: true, method: btree, keys: [close_receipt_id], include: [], predicate: "row_kind = 'PERIOD'"}
      - {name: cost_allocations_close_receipt_digest_unique, unique: true, method: btree, keys: [close_receipt_digest], include: [], predicate: "row_kind = 'PERIOD'"}
      - {name: cost_allocations_period_idx, method: btree, keys: [deployment_id, "period_start DESC", "period_end DESC", currency, "period_version DESC", line_sequence], include: [row_kind, period_revision_id, record_digest], predicate: null}
      - {name: cost_allocations_period_lines_idx, method: btree, keys: [period_revision_id, line_sequence, id], include: [allocation_kind, cost_category, target_kind, allocated_amount, record_digest], predicate: "row_kind = 'LINE'"}
      - {name: cost_allocations_source_idx, method: btree, keys: [source_cost_event_id, period_revision_id, line_sequence], include: [source_effective_digest, reporting_source_amount, allocated_amount], predicate: "row_kind = 'LINE'"}
      - {name: cost_allocations_fx_rate_fk_idx, method: btree, keys: [fx_rate_fact_id, id], include: [source_currency, currency, reporting_source_amount], predicate: "fx_rate_fact_id IS NOT NULL"}
      - {name: cost_allocations_job_fk_idx, method: btree, keys: [job_id, period_revision_id, id], include: [allocated_amount, currency], predicate: "job_id IS NOT NULL"}
      - {name: cost_allocations_agent_run_fk_idx, method: btree, keys: [agent_run_id, period_revision_id, id], include: [allocated_amount, currency], predicate: "agent_run_id IS NOT NULL"}
      - {name: cost_allocations_case_fk_idx, method: btree, keys: [case_id, period_revision_id, id], include: [allocated_amount, currency], predicate: "case_id IS NOT NULL"}
      - {name: cost_allocations_outcome_idx, method: btree, keys: [outcome_fact_id, "period_start DESC", "period_end DESC", id], include: [allocated_amount, currency, record_digest], predicate: "row_kind = 'LINE' AND outcome_fact_id IS NOT NULL"}
      - {name: cost_allocations_organization_idx, method: btree, keys: [organization_id, "period_start DESC", "period_end DESC", id], include: [allocated_amount, currency, record_digest], predicate: "row_kind = 'LINE' AND organization_id IS NOT NULL"}
      - {name: cost_allocations_acquisition_idx, method: btree, keys: [organization_id, acquisition_campaign_digest, "period_start DESC", id], include: [allocated_amount, currency, acquisition_source_receipt_digest], predicate: "row_kind = 'LINE' AND cost_category = 'SALES_CUSTOMER_ACQUISITION'"}
      - {name: cost_allocations_acquisition_receipt_fk_idx, method: btree, keys: [acquisition_source_receipt_id, acquisition_source_receipt_digest, id], include: [organization_id, acquisition_campaign_digest], predicate: "acquisition_source_receipt_id IS NOT NULL"}
      - {name: cost_allocations_unattributed_acquisition_idx, method: btree, keys: [unattributed_acquisition_pool_digest, "period_start DESC", "period_end DESC", id], include: [allocated_amount, currency, source_effective_digest], predicate: "row_kind = 'LINE' AND cost_category = 'SALES_CUSTOMER_ACQUISITION' AND acquisition_attribution_state = 'UNATTRIBUTED'"}
      - {name: cost_allocations_claim_idx, method: btree, keys: [claim_state, "period_end DESC", id], include: [direct_coverage, total_coverage, cost_capture_coverage, close_receipt_digest], predicate: "row_kind = 'PERIOD'"}
    triggers:
      - name: cost_allocations_validate_insert
        timing: BEFORE
        events: [INSERT]
        function: ops.validate_cost_allocation_row_v1()
        guarantees:
          - period header self-reference and every line reference resolve to one header with identical deployment, period, currency and version
          - accounting_timezone exists in pg_timezone_names and accounting_policy_digest resolves to the deployment accounting policy; every line matches its header exactly
          - superseded row is a PERIOD header for the same deployment, accounting timezone, period and currency and period_version increments exactly one
          - source_cost_event is inside the half-open period formed by local midnights in accounting_timezone and converted to UTC instants; source_effective_digest binds the original cost event plus every applicable immutable correction targeting that cost event or the superseded period and line set
          - applicable accounting corrections use only LATE_PROVIDER_INVOICE, FX_CORRECTION, USAGE_CORRECTION, TAX_CORRECTION, REFUND, CREDIT or ALLOCATION_CORRECTION and are never applied in place
          - cross-currency lines reference one exact-direction fx_rate_fact valid for the source time; implicit inverse, cross-rate and stale rate are rejected
          - OUTCOME_FACT target is the unique current non-INVERSE outcome chain head; no corrected-away fact receives cost
          - ATTRIBUTED SALES_CUSTOMER_ACQUISITION locks the exact ops.acquisition_source_receipts ID+digest current non-reversed leaf and matches deployment, organization and acquisition_campaign_digest. UNATTRIBUTED acquisition cost is a valid explicit UNALLOCATED line with no organization or receipt, a canonical unattributed_acquisition_pool_digest and its full amount; it is never dropped or assigned to a fake organization.
          - record_digest equals Gurine Canonical JSON v1 SHA-256 of every immutable row field except recorded_at
          - record-class schedule binding is current and nonexpired
      - name: cost_allocations_validate_period_close
        trigger_kind: CONSTRAINT_TRIGGER
        timing: AFTER
        events: [INSERT]
        deferrable: true
        initially: DEFERRED
        for_each: ROW
        function: ops.validate_cost_allocation_period_v1()
        guarantees:
          - line_sequence is gap-free 1..N and allocation_set_digest is the SHA-256 of rows in line_sequence then id order
          - each effective source cost is represented exactly once across DIRECT, SHARED and explicit UNALLOCATED portions and allocated sums equal the header
          - source, pool, driver and correction set digests match the locked input sets
          - missing cost remains cost_capture_state UNKNOWN and never becomes zero
          - every queued row invocation validates the complete set; only the NEW.row_kind = PERIOD invocation may append the close receipt, audit and cost.allocation_period_closed.v1 outbox
          - LINE invocation requires its header xmin to equal pg_current_xact_id(), so a later transaction cannot add a line to a closed immutable period
          - the existing ops.outbox unique key on aggregate_type, aggregate_id, aggregate_version and event_type makes period close emission idempotent
          - close receipt, audit and cost.allocation_period_closed.v1 outbox are in the same SERIALIZABLE transaction
      - name: cost_allocations_immutable
        timing: BEFORE
        events: [UPDATE, DELETE]
        function: ops.reject_mutation()
    privileges:
      gurine_public_api: []
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_public_projector: []
      gurine_notification_worker: []
      gurine_workflow_worker: [SELECT]
      gurine_document_extractor: []
      gurine_scheduler: []
      gurine_auditor: [SELECT]
      gurine_identity_api: []
    function_privileges:
      ops.close_cost_allocation_period_v1:
        gurine_workflow_worker: [EXECUTE]
    write_boundary:
      function: ops.close_cost_allocation_period_v1
      signature: "ops.close_cost_allocation_period_v1(jsonb,jsonb,uuid,char(64))"
      arguments: ["header Json<CostAllocationPeriodHeaderV1>", "ordered_lines Json<Vec<CostAllocationLineV1>>", "expected_predecessor_id nullable for version 1", "expected_predecessor_digest nullable for version 1"]
      returns: ops.economics_mutation_receipt_v1
      idempotency_scope: ECONOMICS.CLOSE_COST_ALLOCATION_PERIOD.V1
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, editorial, pg_temp]
      revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
      payload_rule: both jsonb arguments validate as closed Rust types before any lookup; unknown properties, duplicate line identities, noncanonical order and serde_json::Value are forbidden
      isolation_guard: current_setting('transaction_isolation') must equal serializable before any lock or insert
      lock_rule: lock predecessor header, source cost events, accounting corrections, FX facts and outcome targets in lexical relation then UUID order
      insertion_rule: PERIOD validates period_revision_id = NEW.id without querying the not-yet-visible row; LINE rows select the same-transaction PERIOD header FOR KEY SHARE
      conflict_mapping: unique violation or serialization failure caused by a stale requested predecessor/input set maps to FACT_CONFLICT; no automatic successor or changed-input retry is created
    rls:
      enabled: false
      forced: false
      reason: Single-organization physical deployment; no public, submission or editorial-analysis role can read commercial accounting rows.
    trust_firewall:
      - Cost or revenue never feeds detection, case priority, publication, response, correction, rights or approval decisions.
      - The analysis-worker has zero privilege; only operations/economics/projector/auditor paths read allocations.
      - UNKNOWN and UNALLOCATED affect margin, price, quota or efficiency only and never weaken evidence, privacy, correction or approval gates.
      - Attributed customer-acquisition cost is organization-scoped; unattributed acquisition cost is isolated in a digest-bound pool with no organization identity. Both may be used only for CAC UNKNOWN/payback and commercial continuation decisions.
    retention:
      record_class: COMMERCIAL_ACCOUNTING_FACT
      trigger: accounting schedule review, contract closure, privacy request or legal-hold evaluation; never in-place correction
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision recorded by schedule_revision and schedule_digest
      legal_hold_key: "object_type=COST_ALLOCATION, object_id=id, affected_digest=record_digest, period=period_start/period_end"
      backup_behavior: Restore all period revisions and accounting corrections, validate digests, holds and current-head uniqueness, then expose economics projections.
      terminal_action: PRESERVE_ACCOUNTING_FACT; correction creates immutable accounting correction inputs and a new superseding PERIOD revision with new LINE rows
    repository_round_trip:
      close_period: SERIALIZABLE; lock period predecessor, source cost events, corrections and FX facts in lexical primary-key order; insert header then lines and one close receipt/event atomically.
      replay: Same period identity/version and allocation_set_digest returns the stored header plus lines; changed digest is FACT_CONFLICT.
      correction: Original rows never change; a new version must point to the unique prior head, bind correction_set_digest and recompute every line and coverage value.
      stable_order: ["PERIOD header first", "line_sequence ASC", "id ASC"]
      detail_cardinality: Exactly one PERIOD header plus zero through N ordered LINE rows; missing header, gap, duplicate source portion or aggregate mismatch is COST_ATTRIBUTION_INCOMPLETE.
      claim_gate: Margin or pricing claims require claim_state ELIGIBLE; UNKNOWN, below 99 percent capture, below 100 percent direct allocation or below 95 percent total allocation returns COST_ATTRIBUTION_INCOMPLETE.
      no_synthesis: Missing source cost, FX, driver, correction, target, receipt or digest is never zero, current or allocated.
      test_identity: AC-OA-TABLE-OPS-COST_ALLOCATIONS-CONTRACT
    event_projection:
      PERIOD:
        event: cost.allocation_period_closed.v1
        payload_mapping: {periodStart: period_start, periodEnd: period_end, accountingTimezone: accounting_timezone, accountingPolicyDigest: accounting_policy_digest, currency: currency, poolSetDigest: pool_set_digest, driverSetDigest: driver_set_digest, allocationSetDigest: allocation_set_digest, directCoverage: direct_coverage, totalCoverage: total_coverage, unallocatedAmount: unallocated_amount, receiptDigest: close_receipt_digest}
        rule: LINE rows emit no period-close event; one PERIOD row emits exactly one event in the close transaction.

cac_metric_input_contract:
  function: ops.read_cac_metric_inputs_v1
  signature: "(date period_start, date period_end, char(3) reporting_currency, char(64) expected_accounting_policy_digest) -> SETOF closed scalar CAC input rows"
  owner: gurine_migrator
  security: SECURITY_DEFINER
  search_path: [pg_catalog, ops, pg_temp]
  execute_roles: [gurine_workflow_worker, gurine_control_api, gurine_auditor]
  revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_identity_api]
  exact_semantics:
    - Select the unique current cost-allocation PERIOD leaf for every intersecting accounting slice and lock its complete line set, source/correction set and FX facts under one repeatable snapshot.
    - The complete captured SALES_CUSTOMER_ACQUISITION population includes ATTRIBUTED and UNATTRIBUTED lines. No organization predicate may run before this completeness test.
    - ATTRIBUTED contributes only when its acquisition receipt is the unique current non-reversed leaf and organization/campaign/digest tuple matches. UNATTRIBUTED contributes its full allocated_amount to unattributed_acquisition_amount without an organization, receipt or fabricated zero UUID.
    - If capture is UNKNOWN/PARTIAL, any acquisition line is UNATTRIBUTED, a receipt is missing/stale/reversed, an FX fact is missing/stale, or a correction chain is ambiguous, CAC state is UNKNOWN, value is NULL and reason is ATTRIBUTION_UNKNOWN. The function never divides only the attributed subset to report a lower known CAC.
    - CAC becomes KNOWN only when the complete captured acquisition set is measured and every positive acquisition amount is currently attributed or explicitly reversed by an immutable correction. HALF_EVEN conversion and summation use the exact pinned FX and accounting policies.
  return_firewall: Returns opaque organization UUID only for a KNOWN attributed member plus amounts, currency, interval and canonical input-set digests; source payload, campaign label, person/contact/query/cookie/message identity and public/editorial data are forbidden.
  runtime_canaries: [all_attributed_known, one_unattributed_unknown, missing_receipt_unknown, stale_receipt_unknown, reversed_receipt_unknown, explicit_reversal_removed, mixed_currency_exact_fx, missing_fx_unknown, no_fake_organization, no_lower_subset_cac, 64_client_snapshot]

runtime_oracles:
  catalog:
    - Exactly ops.product_events, ops.outcome_facts, ops.acquisition_source_receipts and ops.cost_allocations are contributed by this fragment.
    - All four tables have relkind r and owner gurine_migrator; no sequence object is required for UUID identity.
    - ops.cost_allocations evidence FKs may target only row_kind PERIOD IDs; product_events are forbidden as SKU-readiness evidence because they are short-lived nonauthoritative analytics.
  analytics_privacy:
    - specs/ui/analytics-events.yaml SHA-256 is 436c230e2de6edbd10c2d4f4d3f53df91147ad85bab3600cc8b0b945cf25528f and declares exactly 233 events.
    - Physical allowed-property columns equal exactly app_version, duration_bucket, error_code, filter_category_count, internal_object_type, public_object_id, public_object_type, result_code, result_count_bucket, role_category, screen_id, specification_version, state, step_id, success, surface, viewport_class and workflow_stage.
    - Response/search/evidence text, filename, token, email, IP, user-agent, user/session identity and generic JSON payload insertion all fail before storage.
    - workflow_instance_hmac correlates only one bounded task instance, is never derived from identity or object, and cannot span terminal/abandoned workflows.
    - SSR plus hydration replay of one emission_id stores exactly one row; changed content under the same emission identity is FACT_CONFLICT.
    - An analytics database outage leaves public reading, response submission and internal commands successful and creates no prohibited retry payload.
  outcome_fact_correction:
    - One deployment, workflow_instance_hmac and formula version creates at most one ORIGINAL fact; the same terminal receipt also cannot seed a second workflow fact.
    - ORIGINAL creation requires all four ordered Verified Workflow milestones from matching nonexpired product events and the terminal receipt; incomplete analytics undercounts and never creates a partial fact.
    - A 64-client correction race yields one appended successor and 63 FACT_CONFLICT results; no branch, update or delete occurs.
    - Current MVW selects one head per root; INVERSE counts zero and ORIGINAL or SUPERSEDING counts one.
    - Public facts have organization_id NULL; paid organization facts require organization_id and remain inaccessible to public, submission and analysis roles.
  cost_period_correction:
    - One source cost is partitioned exactly into attributed plus explicit unallocated amount in the reporting currency.
    - Different-currency allocation without an exact-direction valid fx_rate_fact fails; inverse or cross-rate synthesis is forbidden.
    - Missing expected cost produces UNKNOWN with null capture coverage, never zero or healthy.
    - The first period has version 1; each correction appends exactly one unique successor header and a complete replacement line set.
    - Original allocation rows reject UPDATE and DELETE for every runtime role and the table owner trigger path.
    - Pricing/margin eligibility is true only for measured capture at least 0.99, direct coverage exactly 1 and total coverage at least 0.95.
    - CAC payback first scans the complete captured SALES_CUSTOMER_ACQUISITION set. Any UNATTRIBUTED line, missing/stale/reversed receipt, FX gap or correction ambiguity returns UNKNOWN with null value; only a fully attributed set uses exact current receipts, organization targets, campaign digests and authoritative organization revenue facts.
    - A captured unattributed acquisition line is accepted only as UNALLOCATED+UNATTRIBUTED with a pool digest, no organization and no acquisition receipt; assigning a fake organization/receipt, omitting the amount or reporting a lower attributed-subset CAC fails.
  acquisition_receipt:
    - The physical catalog contains no person/contact/query/cookie/message fields, and the typed input rejects unknown properties before source verification.
    - One source identity and revision creates one row; 64 same-request clients receive one stored receipt and 63 byte-identical replays while changed requests produce FACT_CONFLICT.
    - Replacement/reversal races have one successor, historical allocations remain stable, and new allocations reject a non-current or reversed leaf.
  privileges:
    - PUBLIC has zero table/function privileges.
    - gurine_analysis_worker has zero privilege on all four tables, enforcing the commercial/editorial firewall.
    - Every undeclared runtime privilege is denied after the 0029 final privilege reset.
    - All four tables grant no direct INSERT. Fixed-search-path record/append/close function EXECUTE is exact, and gurine_public_projector has no raw table SELECT; it may execute only append_outcome_fact_v1 and the allowlisted public outcome read function.
  retention_and_restore:
    - An active RETENTION or DELETION hold blocks product-event purge; DISCLOSURE blocks export or projection.
    - Product events expire no later than 90 days, or 30 days for response-sensitive-minimal, unless exact active hold coverage applies.
    - Outcome and cost facts preserve originals and use append-only correction; restore validates full chains before current projections become readable.
  repository_round_trip:
    - Every required and optional column is inserted with a nondefault boundary value and read through a closed SQLx type without serde_json::Value.
    - numeric(24,6), numeric(18,12), UUID, date, timestamptz and char(64) values round-trip exactly.
    - Invalid enum, digest, FK, row shape, stale head, missing source and forbidden mutation each map to a distinct typed repository error.
    - PostgreSQL 18.4 positive and negative role probes run under every declared runtime role for each table.
