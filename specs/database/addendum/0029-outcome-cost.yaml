      - {name: source_system_id, type: text, nullable: false, default: null}
      - {name: source_record_identity_hmac, type: "char(64)", nullable: false, default: null}
      - {name: source_record_hmac_key_version, type: text, nullable: false, default: null}
      - {name: acquisition_campaign_digest, type: "char(64)", nullable: false, default: null}
      - {name: organization_binding_digest, type: "char(64)", nullable: false, default: null}
      - {name: attribution_model_version, type: text, nullable: false, default: null}
      - {name: attribution_model_digest, type: "char(64)", nullable: false, default: null}
      - {name: touchpoint_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: source_record_digest, type: "char(64)", nullable: false, default: null}
      - {name: source_signature_digest, type: "char(64)", nullable: false, default: null}
      - {name: valid_from, type: timestamptz, nullable: false, default: null}
      - {name: valid_until, type: timestamptz, nullable: false, default: null}
      - {name: attributed_at, type: timestamptz, nullable: false, default: null}
      - {name: receipt_digest, type: "char(64)", nullable: false, default: null}
      - {name: created_at, type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: acquisition_source_receipt_root_fk, columns: [root_receipt_id], target: ops.acquisition_source_receipts, target_columns: [id], on_delete: RESTRICT, deferrable: true, initially: IMMEDIATE}
      - {name: acquisition_source_receipt_supersedes_fk, columns: [supersedes_receipt_id], target: ops.acquisition_source_receipts, target_columns: [id], on_delete: RESTRICT, deferrable: false}
    unique_constraints:
      - {name: acquisition_source_receipt_root_revision_uq, columns: [root_receipt_id, revision]}
      - {name: acquisition_source_receipt_source_revision_uq, columns: [deployment_id, source_system_id, source_record_identity_hmac, revision]}
      - {name: acquisition_source_receipt_reference_uq, columns: [id, receipt_digest]}
      - {name: acquisition_source_receipt_digest_uq, columns: [receipt_digest]}
    checks:
      - {name: acquisition_source_receipt_revision_ck, expression: "revision > 0"}
      - name: acquisition_source_receipt_chain_ck
        expression: "(receipt_effect = 'ORIGINAL' AND revision = 1 AND root_receipt_id = id AND supersedes_receipt_id IS NULL AND predecessor_receipt_digest IS NULL) OR (receipt_effect IN ('REPLACEMENT','REVERSAL') AND revision > 1 AND root_receipt_id <> id AND supersedes_receipt_id IS NOT NULL AND predecessor_receipt_digest IS NOT NULL)"
      - {name: acquisition_source_receipt_effect_ck, expression: "receipt_effect IN ('ORIGINAL','REPLACEMENT','REVERSAL')"}
      - {name: acquisition_source_receipt_source_kind_ck, expression: "source_kind IN ('ORGANIC_SEARCH','REFERRAL','DIRECT','PARTNER','EVENT','PAID_SEARCH','PAID_SOCIAL','CONTENT','OUTBOUND','OTHER_REVIEWED')"}
      - {name: acquisition_source_receipt_source_ck, expression: "source_system_id ~ '^[a-z0-9][a-z0-9._-]{0,127}$' AND length(btrim(source_record_hmac_key_version)) BETWEEN 1 AND 100 AND length(btrim(attribution_model_version)) BETWEEN 1 AND 128"}
      - {name: acquisition_source_receipt_interval_ck, expression: "valid_from < valid_until AND valid_from <= attributed_at AND attributed_at < valid_until AND attributed_at <= created_at"}
      - name: acquisition_source_receipt_digest_ck
        expression: "(predecessor_receipt_digest IS NULL OR predecessor_receipt_digest ~ '^[0-9a-f]{64}$') AND source_record_identity_hmac ~ '^[0-9a-f]{64}$' AND acquisition_campaign_digest ~ '^[0-9a-f]{64}$' AND organization_binding_digest ~ '^[0-9a-f]{64}$' AND attribution_model_digest ~ '^[0-9a-f]{64}$' AND touchpoint_set_digest ~ '^[0-9a-f]{64}$' AND source_record_digest ~ '^[0-9a-f]{64}$' AND source_signature_digest ~ '^[0-9a-f]{64}$' AND receipt_digest ~ '^[0-9a-f]{64}$'"
    indexes:
      - {name: acquisition_source_receipt_one_successor_uq, unique: true, method: btree, keys: [supersedes_receipt_id], include: [], predicate: "supersedes_receipt_id IS NOT NULL"}
      - {name: acquisition_source_receipt_root_history_idx, unique: false, method: btree, keys: [root_receipt_id, revision, id], include: [receipt_effect, receipt_digest], predicate: null}
      - {name: acquisition_source_receipt_org_campaign_idx, unique: false, method: btree, keys: [deployment_id, organization_id, acquisition_campaign_digest, "attributed_at DESC", id], include: [source_kind, receipt_digest], predicate: null}
      - {name: acquisition_source_receipt_source_idx, unique: false, method: btree, keys: [source_system_id, source_record_identity_hmac, revision, id], include: [receipt_digest], predicate: null}
    triggers:
      - name: acquisition_source_receipt_validate_insert
        timing: BEFORE
        events: [INSERT]
        function: ops.validate_acquisition_source_receipt_v1()
        guarantees:
          - deployment and organization equal immutable deployment configuration and organization_binding_digest is recomputed from that scope under the current binding key
          - configured source trust verifies the detached signature over source_record_digest; campaign, attribution model, bounded validity and duplicate-free touchpoint-set digest are recomputed from a closed adapter result
          - no raw lead, contact, query, cookie, address, handle, message or person-level touchpoint is accepted by the typed input or present in the physical catalog
          - ORIGINAL locks the semantic source identity; successor locks the unique current leaf, inherits scope/source/campaign identity, binds predecessor digest, increments revision exactly one and cannot branch
          - REVERSAL remains historical evidence but is not eligible for a new CAC allocation; a historical cost allocation remains bound to its original receipt and requires a superseding cost period for restatement
      - {name: acquisition_source_receipt_immutable, timing: BEFORE, events: [UPDATE, DELETE], function: ops.reject_mutation()}
    privileges:
      gurine_public_api: []
      gurine_submission_api: []
      gurine_control_api: [SELECT]
