tables:
  ops.product_events:
    creation_order: 2
    purpose: Privacy-minimized first-party task analytics; never an audit record or an authoritative workflow outcome.
    object_owner: gurine_migrator
    mutation_class: LIFECYCLE_GUARDED
    rust_type: gurine_observability::product::ProductEvent
    repository: crates/persistence-postgres::product_economics::ProductEventRepository
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: emission_id, type: uuid, nullable: false, default: null}
      - {name: event_name, type: text, nullable: false, default: null}
      - {name: sensitivity, type: text, nullable: false, default: null}
      - {name: purpose_code, type: text, nullable: false, default: null}
      - {name: event_catalog_digest, type: "char(64)", nullable: false, default: null}
      - {name: deployment_id, type: uuid, nullable: false, default: null}
      - {name: workflow_instance_hmac, type: "char(64)", nullable: false, default: null}
      - {name: workflow_key_version, type: bigint, nullable: false, default: null}
      - {name: workflow_started_at, type: timestamptz, nullable: false, default: null}
      - {name: workflow_expires_at, type: timestamptz, nullable: false, default: null}
      - {name: occurred_at, type: timestamptz, nullable: false, default: null}
      - {name: recorded_at, type: timestamptz, nullable: false, default: clock_timestamp()}
      - {name: record_class, type: text, nullable: false, default: null}
      - {name: schedule_revision, type: bigint, nullable: false, default: null}
      - {name: schedule_digest, type: "char(64)", nullable: false, default: null}
      - {name: retention_deadline, type: timestamptz, nullable: false, default: null}
      - {name: screen_id, type: text, nullable: false, default: null}
      - {name: surface, type: text, nullable: false, default: null}
      - {name: app_version, type: text, nullable: false, default: null}
      - {name: specification_version, type: text, nullable: false, default: null}
      - {name: viewport_class, type: text, nullable: true, default: null}
      - {name: success, type: boolean, nullable: true, default: null}
      - {name: error_code, type: text, nullable: true, default: null}
      - {name: internal_object_type, type: text, nullable: true, default: null}
      - {name: workflow_stage, type: text, nullable: true, default: null}
      - {name: result_code, type: text, nullable: true, default: null}
      - {name: duration_bucket, type: text, nullable: true, default: null}
      - {name: role_category, type: text, nullable: true, default: null}
      - {name: public_object_type, type: text, nullable: true, default: null}
      - {name: public_object_id, type: text, nullable: true, default: null}
      - {name: state, type: text, nullable: true, default: null}
      - {name: result_count_bucket, type: text, nullable: true, default: null}
      - {name: filter_category_count, type: smallint, nullable: true, default: null}
      - {name: step_id, type: text, nullable: true, default: null}
      - {name: event_digest, type: "char(64)", nullable: false, default: null}
    primary_key:
      name: product_events_pkey
      columns: [id]
    foreign_keys: []
    unique_constraints:
      - {name: product_events_emission_unique, columns: [deployment_id, emission_id]}
      - {name: product_events_digest_unique, columns: [event_digest]}
    checks:
      - name: product_events_catalog_digest_lower_hex
        expression: "event_catalog_digest ~ '^[0-9a-f]{64}$'"
      - name: product_events_workflow_hmac_lower_hex
        expression: "workflow_instance_hmac ~ '^[0-9a-f]{64}$'"
      - name: product_events_schedule_digest_lower_hex
        expression: "schedule_digest ~ '^[0-9a-f]{64}$'"
      - name: product_events_event_digest_lower_hex
        expression: "event_digest ~ '^[0-9a-f]{64}$'"
      - name: product_events_event_name_shape
        expression: "event_name ~ '^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){1,3}$' AND length(event_name) <= 128"
      - name: product_events_sensitivity_closed
        expression: "sensitivity IN ('PUBLIC_PRODUCT','INTERNAL_OPERATIONAL','RESPONSE_SENSITIVE_MINIMAL')"
      - name: product_events_purpose_closed
        expression: "purpose_code = 'TASK_PROGRESSION_QUALITY_RECOVERY'"
      - name: product_events_surface_closed
        expression: "surface IN ('public','internal','response')"
      - name: product_events_surface_sensitivity_match
        expression: "(surface = 'public' AND sensitivity = 'PUBLIC_PRODUCT') OR (surface = 'internal' AND sensitivity = 'INTERNAL_OPERATIONAL') OR (surface = 'response' AND sensitivity = 'RESPONSE_SENSITIVE_MINIMAL')"
      - name: product_events_record_class_match
        expression: "(sensitivity = 'PUBLIC_PRODUCT' AND record_class = 'PRODUCT_ANALYTICS_PUBLIC') OR (sensitivity = 'INTERNAL_OPERATIONAL' AND record_class = 'PRODUCT_ANALYTICS_INTERNAL') OR (sensitivity = 'RESPONSE_SENSITIVE_MINIMAL' AND record_class = 'PRODUCT_ANALYTICS_RESPONSE')"
      - name: product_events_schedule_revision_positive
        expression: "schedule_revision > 0 AND workflow_key_version > 0"
      - name: product_events_workflow_window
        expression: "workflow_started_at <= occurred_at AND occurred_at < workflow_expires_at AND ((surface IN ('public','response') AND workflow_expires_at <= workflow_started_at + interval '24 hours') OR (surface = 'internal' AND workflow_expires_at <= workflow_started_at + interval '30 days'))"
      - name: product_events_retention_deadline_after_record
        expression: retention_deadline > recorded_at
      - name: product_events_retention_hard_cap
        expression: "(sensitivity = 'RESPONSE_SENSITIVE_MINIMAL' AND retention_deadline <= recorded_at + interval '30 days') OR (sensitivity IN ('PUBLIC_PRODUCT','INTERNAL_OPERATIONAL') AND retention_deadline <= recorded_at + interval '90 days')"
      - name: product_events_screen_id_bounded
        expression: "screen_id ~ '^[A-Z]{3,4}-[0-9]{3}$' AND length(screen_id) <= 8"
      - name: product_events_version_strings_bounded
        expression: "length(app_version) BETWEEN 1 AND 64 AND length(specification_version) BETWEEN 1 AND 64"
      - name: product_events_code_properties_bounded
        expression: "(error_code IS NULL OR (error_code ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (internal_object_type IS NULL OR (internal_object_type ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (workflow_stage IS NULL OR (workflow_stage ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (result_code IS NULL OR (result_code ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (duration_bucket IS NULL OR (duration_bucket ~ '^[A-Z0-9][A-Z0-9_]{0,31}$')) AND (role_category IS NULL OR (role_category ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (public_object_type IS NULL OR (public_object_type ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (state IS NULL OR (state ~ '^[A-Z][A-Z0-9_]{0,63}$')) AND (result_count_bucket IS NULL OR (result_count_bucket ~ '^[A-Z0-9][A-Z0-9_]{0,31}$')) AND (step_id IS NULL OR (step_id ~ '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')) AND (viewport_class IS NULL OR viewport_class IN ('COMPACT','MEDIUM','WIDE','NON_VISUAL'))"
      - name: product_events_public_object_id_bounded
        expression: "public_object_id IS NULL OR (length(public_object_id) BETWEEN 1 AND 128 AND public_object_id ~ '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$')"
      - name: product_events_public_object_pair
        expression: "(public_object_type IS NULL) = (public_object_id IS NULL)"
      - name: product_events_filter_count_bounded
        expression: filter_category_count IS NULL OR filter_category_count BETWEEN 0 AND 64
    indexes:
      - {name: product_events_name_time_idx, method: btree, keys: [event_name, "occurred_at DESC", "id DESC"], include: [screen_id, success, result_code], predicate: null}
      - {name: product_events_screen_time_idx, method: btree, keys: [screen_id, "occurred_at DESC", "id DESC"], include: [event_name, surface], predicate: null}
      - {name: product_events_retention_idx, method: btree, keys: [record_class, retention_deadline, id], include: [event_digest], predicate: null}
      - {name: product_events_workflow_idx, method: btree, keys: [workflow_instance_hmac, occurred_at, id], include: [event_name, screen_id, event_digest], predicate: null}
      - {name: product_events_public_object_idx, method: btree, keys: [public_object_type, public_object_id, "occurred_at DESC", "id DESC"], include: [event_name], predicate: "public_object_id IS NOT NULL"}
    triggers:
      - name: product_events_validate_insert
        timing: BEFORE
        events: [INSERT]
        function: ops.validate_product_event_v1()
        guarantees:
          - event_name, screen_id, sensitivity and purpose match specs/ui/analytics-events.yaml; every nonnull optional property is an allowed subset and SQL NULL means absent, never an explicit analytics value
          - screen_id, surface, app_version and specification_version are the universal required properties; the pinned analytics scalar contract supplies every event-specific required, optional, mutually exclusive and allowed-value rule
          - event_catalog_digest for new rows equals 436c230e2de6edbd10c2d4f4d3f53df91147ad85bab3600cc8b0b945cf25528f
          - every code and bucket scalar resolves to its closed error, workflow, result, role, viewport or analytics-bucket catalog; bounded strings are not a free-text escape hatch
          - workflow_instance_hmac is HMAC-SHA-256 of a cryptographically random task-instance nonce under workflow_key_version, is scoped to one declared journey, and is never derived from user, organization, browser, session, response party, object or query identity
          - workflow key issuance enforces the 24-hour public/response or 30-day internal bound and a terminal or abandoned task never reuses its nonce
          - before uniqueness or insert, the function acquires the PRODUCT_EVENT legal-hold advisory key and rejects an existing PRODUCT_EVENT_PURGED restoration suppression for canonical deployment_id plus emission_id
          - public_object_id resolves only to the declared public projection object type
          - event_digest equals the declared non-self-referential canonical projection and never includes id, event_digest, recorded_at, record_class, schedule_revision, schedule_digest or retention_deadline
          - schedule revision and deadline resolve from the latest effective nonexpired record-class schedule
      - name: product_events_reject_update
        timing: BEFORE
        events: [UPDATE]
        function: ops.reject_mutation()
      - name: product_events_guard_retention_delete
        timing: BEFORE
        events: [DELETE]
        function: ops.guard_product_event_retention_delete_v1()
        guarantees:
          - current_user is gurine_migrator through the fixed-search-path SECURITY DEFINER purge function
          - a locked same-transaction retention execution receipt names id, event_digest, schedule revision and terminal action
          - retention_deadline has passed and RETENTION or DELETION legal-hold coverage is empty
    canonical_digest:
      algorithm: SHA-256 of Gurine Canonical JSON v1
      ordered_projection:
        - schemaVersion=1
        - deployment_id
        - emission_id
        - event_name
        - sensitivity
        - purpose_code
        - event_catalog_digest
        - workflow_instance_hmac
        - workflow_key_version
        - workflow_started_at
        - workflow_expires_at
        - occurred_at
        - screen_id
        - surface
        - app_version
        - specification_version
        - viewport_class
        - success
        - error_code
        - internal_object_type
        - workflow_stage
        - result_code
        - duration_bucket
        - role_category
        - public_object_type
        - public_object_id
        - state
        - result_count_bucket
        - filter_category_count
        - step_id
      null_rule: Every optional SQL NULL is encoded as canonical JSON null in the fixed key position; keys are never omitted or reordered.
      excluded: [id, event_digest, recorded_at, record_class, schedule_revision, schedule_digest, retention_deadline]
    forbidden_columns:
      - user_id
      - organization_id
      - session_id
      - cookie_id
      - email
      - ip
      - user_agent
      - raw_search_query
      - request_body
      - response_body
      - answer_body
      - correction_body
      - filename
      - token
      - evidence_text
      - generic_properties_jsonb
    privileges:
      gurine_public_api: []
      gurine_submission_api: []
      gurine_control_api: []
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_public_projector: []
      gurine_notification_worker: []
      gurine_workflow_worker: [SELECT]
      gurine_document_extractor: []
      gurine_scheduler: []
      gurine_auditor: []
      gurine_identity_api: []
    function_privileges:
      ops.record_product_event_v1:
        gurine_workflow_worker: [EXECUTE]
      ops.purge_product_event_v1:
        gurine_workflow_worker: [EXECUTE]
    write_boundary:
      function: ops.record_product_event_v1
      signature: "ops.record_product_event_v1(uuid,text,char(64),uuid,char(64),bigint,timestamptz,timestamptz,timestamptz,text,text,text,text,jsonb,char(64))"
      arguments: [emission_id, event_name, event_catalog_digest, deployment_id, workflow_instance_hmac, workflow_key_version, workflow_started_at, workflow_expires_at, occurred_at, screen_id, surface, app_version, specification_version, "properties Json<ProductEventPropertiesV1>", event_digest]
      returns: ops.economics_mutation_receipt_v1
      idempotency_scope: ECONOMICS.RECORD_PRODUCT_EVENT.V1
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, public, pg_temp]
      revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
      server_owned_columns: recorded_at = clock_timestamp(); sensitivity, purpose_code and record_class derive from event_name; schedule revision/digest/deadline derive from the current schedule; callers cannot override them
      isolation_guard: READ COMMITTED or stronger; claim deployment_id plus emission_id before insert
      replay: same event_digest returns stored row; changed digest is FACT_CONFLICT
      nonblocking: caller isolates collection from the authoritative task transaction and drops only the analytics event on failure
    purge_boundary:
      function: ops.purge_product_event_v1
      signature: "ops.purge_product_event_v1(uuid,char(64),bigint,uuid)"
      arguments: [event_id, expected_event_digest, expected_schedule_revision, retention_request_id]
      returns: ops.economics_mutation_receipt_v1
      idempotency_scope: ECONOMICS.PURGE_PRODUCT_EVENT.V1
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: [pg_catalog, ops, editorial, pg_temp]
      revoke_execute: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
      isolation_guard: SERIALIZABLE; lock the event then acquire the shared legal-hold advisory key before checking coverage
      atomic_effect: append retention execution receipt, audit, outbox and restoration suppression tombstone, then delete exactly one event
      replay: suppression tombstone makes a later retry return the stored purge receipt and forbids reinsertion
    nonblocking_delivery:
      ordering: enqueue only after the authoritative user-task transaction commits
      queue: in-memory bounded MPSC dedicated to analytics; capacity 4096; payload is ProductEventPropertiesV1 only
      full_policy: drop newest analytics item, increment a content-free counter and never block the core task
      database_pool: dedicated analytics pool with max 4 connections; never shares the authoritative command pool
      timeouts: "SET LOCAL lock_timeout = '250ms'; outer call statement_timeout = 500ms"
      retry: at most one same-emission retry inside workflow_expires_at; no body, query, filename, token or contact value is retained
    rls:
      enabled: false
      forced: false
      reason: No browser, tenant, public, submission or editorial role has direct access; public browsing has no stored cross-event identity.
    retention:
      record_class: sensitivity selects PRODUCT_ANALYTICS_PUBLIC, PRODUCT_ANALYTICS_INTERNAL or PRODUCT_ANALYTICS_RESPONSE
      trigger: retention_deadline reached and a retention worker claims the exact row digest
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision; missing or stale schedule rejects the analytics write without failing the core user task
      legal_hold_key: "object_type=PRODUCT_EVENT, object_id=id, affected_digest=event_digest"
      backup_behavior: Restore applies restoration suppressions and deletes already-expired events before analytics access or projection.
      terminal_action: DELETE through ops.purge_product_event_v1 only; append retention receipt, audit, outbox and restoration suppression atomically
    repository_round_trip:
      insert: Persist all non-default boundary fields and every optional scalar once; no JSONB or free-text property escape hatch.
      replay: Same deployment_id, emission_id and event_digest returns the stored row; changed digest is FACT_CONFLICT.
      stable_order: ["occurred_at ASC", "id ASC"]
      privacy_oracle: Physical catalog contains only the 18 allowlisted property columns plus a bounded random task-instance HMAC; forbidden values cannot be encoded in code-like fields and no user, browser, session or response identity exists.
      nonblocking_rule: Collection runs in its own bounded transaction; failure or queue loss never rolls back or delays the authoritative command, audit or receipt.
      test_identity: AC-OA-TABLE-OPS-PRODUCT_EVENTS-CONTRACT
    event_projection:
      domain_events: []
      rule: Product analytics never substitutes for audit or domain outbox events.

  ops.outcome_facts:
    creation_order: 3
    purpose: Immutable terminal-receipt facts for Verified Workflow and paid-workflow metrics; page views, drafts, raw signals and unreviewed AI output cannot become facts.
    object_owner: gurine_migrator
    mutation_class: IMMUTABLE
    rust_type: gurine_observability::product::ProductFact
    repository: crates/persistence-postgres::product_economics::OutcomeFactRepository
    columns:
      - {name: id, type: uuid, nullable: false, default: gen_random_uuid()}
      - {name: fact_contract_version, type: smallint, nullable: false, default: 1}
      - {name: root_fact_id, type: uuid, nullable: false, default: null}
      - {name: supersedes_fact_id, type: uuid, nullable: true, default: null}
      - {name: correction_sequence, type: bigint, nullable: false, default: "1"}
      - {name: fact_effect, type: text, nullable: false, default: "'ORIGINAL'::text"}
      - {name: fact_type, type: text, nullable: false, default: null}
      - {name: scope_kind, type: text, nullable: false, default: null}
      - {name: deployment_id, type: uuid, nullable: false, default: null}
      - {name: metric_timezone, type: text, nullable: false, default: null}
      - {name: metric_policy_digest, type: "char(64)", nullable: false, default: null}
      - {name: workflow_instance_hmac, type: "char(64)", nullable: false, default: null}
      - {name: workflow_key_version, type: bigint, nullable: false, default: null}
      - {name: workflow_proof, type: jsonb, nullable: false, default: null, json_type: gurine_observability::product::VerifiedWorkflowProofV1}
      - {name: workflow_proof_digest, type: "char(64)", nullable: false, default: null}
      - {name: milestone_set_digest, type: "char(64)", nullable: false, default: null}
      - {name: workflow_completed_at, type: timestamptz, nullable: false, default: null}
      - {name: organization_id, type: uuid, nullable: true, default: null}
      - {name: subject_scope_digest, type: "char(64)", nullable: false, default: null}
      - {name: subject_scope_key_version, type: bigint, nullable: false, default: null}
      - {name: terminal_receipt_kind, type: text, nullable: false, default: null}
      - {name: terminal_receipt_id, type: uuid, nullable: false, default: null}
      - {name: terminal_receipt_version, type: bigint, nullable: false, default: null}
      - {name: terminal_receipt_digest, type: "char(64)", nullable: false, default: null}
      - {name: paid_packet_id, type: uuid, nullable: true, default: null}
      - {name: paid_packet_version, type: bigint, nullable: true, default: null}
      - {name: paid_packet_digest, type: "char(64)", nullable: true, default: null}
      - {name: paid_subject_kind, type: ops.paid_evidence_subject_kind, nullable: true, default: null}
      - {name: paid_terminal_receipt_kind, type: ops.paid_terminal_receipt_kind, nullable: true, default: null}
      - {name: paid_terminal_resulting_state, type: ops.paid_terminal_resulting_state, nullable: true, default: null}
      - {name: effective_from, type: timestamptz, nullable: false, default: null}
      - {name: effective_until, type: timestamptz, nullable: true, default: null}
      - {name: formula_version, type: bigint, nullable: false, default: null}
      - {name: formula_digest, type: "char(64)", nullable: false, default: null}
      - {name: correction_reason_code, type: text, nullable: true, default: null}
      - {name: correction_decision_digest, type: "char(64)", nullable: true, default: null}
      - {name: correction_receipt_id, type: uuid, nullable: true, default: null}
      - {name: correction_receipt_digest, type: "char(64)", nullable: true, default: null}
