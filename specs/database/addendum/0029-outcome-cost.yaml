      - name: cost_allocations_allocation_kind_closed
        expression: "allocation_kind IS NULL OR allocation_kind IN ('DIRECT','SHARED','UNALLOCATED')"
      - name: cost_allocations_cost_category_closed
        expression: "cost_category IS NULL OR cost_category IN ('COMPUTE','DATABASE_WAL_BACKUP','STORAGE','EGRESS','MODEL_OCR','SEARCH','DELIVERY','OBSERVABILITY','SUPPORT','HUMAN_REVIEW','LEGAL_SECURITY','SALES_CUSTOMER_ACQUISITION')"
      - name: cost_allocations_target_kind_closed
        expression: "target_kind IS NULL OR target_kind IN ('JOB','AGENT_RUN','CASE','ORGANIZATION','OUTCOME_FACT','UNALLOCATED')"
      - name: cost_allocations_exact_target
        expression: "row_kind <> 'LINE' OR (target_kind = 'JOB' AND job_id IS NOT NULL AND agent_run_id IS NULL AND case_id IS NULL AND organization_id IS NULL AND outcome_fact_id IS NULL) OR (target_kind = 'AGENT_RUN' AND job_id IS NULL AND agent_run_id IS NOT NULL AND case_id IS NULL AND organization_id IS NULL AND outcome_fact_id IS NULL) OR (target_kind = 'CASE' AND job_id IS NULL AND agent_run_id IS NULL AND case_id IS NOT NULL AND organization_id IS NULL AND outcome_fact_id IS NULL) OR (target_kind = 'ORGANIZATION' AND job_id IS NULL AND agent_run_id IS NULL AND case_id IS NULL AND organization_id IS NOT NULL AND outcome_fact_id IS NULL) OR (target_kind = 'OUTCOME_FACT' AND job_id IS NULL AND agent_run_id IS NULL AND case_id IS NULL AND organization_id IS NULL AND outcome_fact_id IS NOT NULL) OR (target_kind = 'UNALLOCATED' AND job_id IS NULL AND agent_run_id IS NULL AND case_id IS NULL AND organization_id IS NULL AND outcome_fact_id IS NULL)"
      - name: cost_allocations_acquisition_shape
        expression: "row_kind <> 'LINE' OR (cost_category = 'SALES_CUSTOMER_ACQUISITION' AND acquisition_attribution_state = 'ATTRIBUTED' AND target_kind = 'ORGANIZATION' AND organization_id IS NOT NULL AND acquisition_campaign_digest IS NOT NULL AND acquisition_source_receipt_id IS NOT NULL AND acquisition_source_receipt_digest IS NOT NULL AND unattributed_acquisition_pool_digest IS NULL) OR (cost_category = 'SALES_CUSTOMER_ACQUISITION' AND acquisition_attribution_state = 'UNATTRIBUTED' AND allocation_kind = 'UNALLOCATED' AND target_kind = 'UNALLOCATED' AND organization_id IS NULL AND acquisition_source_receipt_id IS NULL AND acquisition_source_receipt_digest IS NULL AND unattributed_acquisition_pool_digest IS NOT NULL) OR (cost_category <> 'SALES_CUSTOMER_ACQUISITION' AND acquisition_campaign_digest IS NULL AND acquisition_source_receipt_id IS NULL AND acquisition_source_receipt_digest IS NULL AND acquisition_attribution_state IS NULL AND unattributed_acquisition_pool_digest IS NULL)"
      - name: cost_allocations_driver_kind_closed
        expression: "driver_kind IS NULL OR driver_kind IN ('DIRECT_IDENTITY','RAW_RECORD','NORMALIZED_LINE','OCR_PAGE','ANALYSIS_JOB','COHORT_RERUN','EVIDENCE_PACKET','API_RECORD_UNIT','GB_MONTH','DELIVERY_ATTEMPT_1000','SUPPORT_HOUR','MATERIAL_CORRECTION_HOUR','NONE')"
      - name: cost_allocations_driver_shape
        expression: "row_kind <> 'LINE' OR (allocation_kind = 'DIRECT' AND target_kind <> 'UNALLOCATED' AND driver_kind = 'DIRECT_IDENTITY' AND driver_quantity IS NULL AND driver_total_quantity IS NULL AND allocation_ratio IS NULL AND rounding_adjustment = 0 AND allocated_amount = reporting_source_amount) OR (allocation_kind = 'SHARED' AND target_kind <> 'UNALLOCATED' AND driver_kind NOT IN ('DIRECT_IDENTITY','NONE') AND driver_quantity IS NOT NULL AND driver_total_quantity IS NOT NULL AND allocation_ratio IS NOT NULL AND driver_quantity > 0 AND driver_total_quantity >= driver_quantity AND allocation_ratio > 0 AND allocation_ratio <= 1 AND allocation_ratio = ops.round_half_even_numeric_v1(driver_quantity / driver_total_quantity, 12) AND allocated_amount = ops.round_half_even_numeric_v1(reporting_source_amount * allocation_ratio, 6) + rounding_adjustment) OR (allocation_kind = 'UNALLOCATED' AND target_kind = 'UNALLOCATED' AND driver_kind = 'NONE' AND driver_quantity IS NULL AND driver_total_quantity IS NULL AND allocation_ratio IS NULL AND rounding_adjustment = 0 AND allocated_amount > 0 AND allocated_amount <= reporting_source_amount)"
      - name: cost_allocations_line_amounts
        expression: "row_kind <> 'LINE' OR (source_amount >= 0 AND reporting_source_amount >= 0 AND allocated_amount >= 0 AND abs(rounding_adjustment) <= 0.000001)"
      - name: cost_allocations_fx_shape
        expression: "row_kind <> 'LINE' OR (source_currency = currency AND fx_rate_fact_id IS NULL AND reporting_source_amount = source_amount) OR (source_currency <> currency AND fx_rate_fact_id IS NOT NULL)"
      - name: cost_allocations_allocation_rule_version_positive
        expression: allocation_rule_version IS NULL OR allocation_rule_version > 0
      - name: cost_allocations_record_class_fixed
        expression: record_class = 'COMMERCIAL_ACCOUNTING_FACT'
    indexes:
