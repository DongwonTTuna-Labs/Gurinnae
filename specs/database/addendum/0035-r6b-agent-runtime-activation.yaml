OPEN_RISKS:
  - id: R6B-0035-NORMALIZATION-COMPLETION-CONTRACT
    risk: The 0025 addendum requires core.complete_normalization_run, but its terminal receipt schema, event type, correlation input, and exact return contract are not decision-complete in the active specifications.
    fail_closed_disposition: Migration 0035 restores the declared normalization foreign keys and one-active-generation fence but does not invent the ambiguous completion routine. Normalization completion remains unavailable until the missing contract is resolved and reviewed.
  - id: R6B-0035-DETECTION-SNAPSHOT-SCHEDULER-AUTHORITY
    risk: The active specifications do not define the immutable source-digest preimage and runnable-build contract needed for a scheduler to create a DETECTION_DATASET job.
    fail_closed_disposition: ops.enqueue_due_detection_snapshot_builds_v1 validates a bounded 1 through 1000 limit and then returns zero with no DML; the scheduler cannot invent a build until that authority is decision-complete and reviewed.
  - id: R6B-0035-AGENT-RUN-V2-TRANSITION-AUTHORITY
    risk: claim_agent_run_worker_v1 does not create the required RUN_STARTED receipt chain, the existing v1 transition routine cannot complete the v2 status, control-state, and terminal-receipt shape, and the active specifications do not decide transition_agent_run_v2's exact signature, proof and receipt contract, or the ANALYSIS_WORKER service actor UUID.
    fail_closed_disposition: Migration 0035 does not invent a v2 transition authority. The intentionally unseeded policy and the POLICY_ABSENT or POLICY_DISABLED dispositions prevent STARTED by default; if an independently authorized enabled policy initiates a v2 run, it remains QUEUED because both legacy claim and transition routines raise SQLSTATE 55000 before mutation, so no analysis dispatch or terminalization occurs until the missing authority is decision-complete and reviewed.
  - id: R6B-0035-RETENTION-SCHEDULES
    status: RESOLVED_BY_0036
    risk: Migration 0035 originally left AGENT_RUNTIME_POLICY and AGENT_RUNTIME_INITIATION_RECEIPT outside the source-derived record-class schedule registry.
    resolved_by:
      migration: db/migrations/0036_r6b_pipeline_activation.sql
      addendum: specs/database/addendum/0036-r6b-pipeline-activation.yaml
    closure: Migration 0036 registers both exact relation-class mappings and requires every immutable row to bind retention_schedule_id, retention_record_class, and retention_schedule_digest to an approved current nonexpired operational-audit schedule before a runtime writer may create it; both classes follow AGENT_RUN_CONTROL_RECEIPT schedule semantics and never use PRESERVE_PUBLIC_REVISION.
