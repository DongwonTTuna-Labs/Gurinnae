        - {name: research_artifacts_run_fk, columns: [agent_run_id, input_snapshot_sha256], references: "ops.agent_runs(id, input_snapshot_hash)", on_delete: RESTRICT}
        - {name: research_artifacts_turn_fk, columns: [agent_run_id, provider_turn_id], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id)", on_delete: RESTRICT}
        - {name: research_artifacts_tool_fk, columns: [agent_run_id, tool_call_id], references: "ops.agent_tool_calls(agent_run_id, tool_call_id)", on_delete: RESTRICT}
        - {name: research_artifacts_call_fk, columns: [agent_run_id, call_id, request_sha256, result_sha256], references: "ops.agent_tool_calls(agent_run_id, call_id, request_sha256, result_sha256)", on_delete: RESTRICT}
      unique:
        - {name: research_artifacts_asset_uk, columns: [asset_id, asset_revision]}
        - {name: research_artifacts_asset_binding_uk, columns: [id, asset_id, asset_revision, content_sha256]}
        - {name: research_artifacts_fetch_uk, columns: [source_fetch_id]}
        - {name: research_artifacts_call_ordinal_uk, columns: [agent_run_id, call_id, artifact_ordinal]}
        - {name: research_artifacts_citation_binding_uk, columns: [id, agent_run_id, content_sha256]}
        - {name: research_artifacts_source_use_binding_uk, columns: [id, asset_id, asset_revision, artifact_sha256, content_sha256, source_fetch_id]}
      checks:
        - {name: research_artifacts_revision_ordinal_ck, expression: asset_revision = 1 AND artifact_ordinal >= 0}
        - {name: research_artifacts_request_kind_ck, expression: "request_kind IN ('SEARCH_PUBLIC_WEB','FETCH_URL')"}
        - {name: research_artifacts_outcome_ck, expression: "fetch_outcome IN ('STORED','RENDER_REQUIRED','QUARANTINED')"}
        - {name: research_artifacts_classification_ck, expression: "classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD')"}
        - {name: research_artifacts_safety_ck, expression: "content_safety_state IN ('CLEAN','FLAGGED','QUARANTINED')"}
        - {name: research_artifacts_http_size_ck, expression: http_status BETWEEN 100 AND 599 AND content_size_bytes >= 0}
        - {name: research_artifacts_url_ck, expression: "request_kind<>'FETCH_URL' OR (source_url_redacted IS NOT NULL AND final_url_redacted IS NOT NULL AND source_url_redacted LIKE 'https://%' AND final_url_redacted LIKE 'https://%')"}
        - {name: research_artifacts_render_ck, expression: "fetch_outcome<>'RENDER_REQUIRED' OR content_media_type='text/html'"}
        - {name: research_artifacts_canonical_ck, expression: "convert_from(safe_headers_canonical,'UTF8')::jsonb=safe_headers AND convert_from(redirect_chain_canonical,'UTF8')::jsonb=redirect_chain AND encode(extensions.digest(artifact_canonical,'sha256'),'hex')=artifact_sha256"}
        - {name: research_artifacts_safety_receipt_ck, expression: "content_safety_receipt_sha256 IS NOT NULL AND (fetch_outcome<>'STORED' OR content_safety_state IN ('CLEAN','FLAGGED','QUARANTINED'))"}
    indexes:
      - {name: research_artifacts_run_idx, method: btree, columns: [agent_run_id, created_at, id]}
      - {name: research_artifacts_asset_idx, method: btree, columns: [asset_id, asset_revision]}
      - {name: research_artifacts_content_idx, method: btree, columns: [content_sha256]}
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
      gurine_ingest_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, rationale: raw research capsule is service-scoped and never public}
    retention:
      record_class: RESEARCH_ARTIFACT_PAYLOAD
      trigger: promotion decision, run/case close, or unused-raw TTL, whichever policy applies
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: asset identity plus agent run/case and any promotion receipt
      backup_behavior: body/header capsule in private object storage; metadata and digests persist after proven crypto-erase
      terminal_action: unused unpromoted payload DELETE|CRYPTO_ERASE; promoted or held artifact follows evidence schedule
    repository_roundtrip:
      row_type: ResearchArtifactRow
      methods: [insert_or_replay, get_by_id, list_for_call]
      assertions: [both request kinds, all outcomes, closed headers/redirect JSON, URL and object-key redaction, mandatory scan receipt, source fetch and exact tool FK mismatch, call replay/conflict, asset identity, immutable mutation]

  - relation: ops.agent_output_validations
    owner_role: gurine_migrator
    service_owner: analysis-worker
    domain_owner: crates/agent-orchestration::validation
    rust_type: gurine_agent_orchestration::validation::AgentOutputValidation
    repository: crates/persistence-postgres::agent_output_validations
    mutation_class: IMMUTABLE
    columns:
      validation_id: {type: uuid, nullable: false, default: gen_random_uuid()}
      agent_run_id: {type: uuid, nullable: false}
      provider_turn_id: {type: uuid, nullable: false}
      input_snapshot_sha256: {type: 'char(64)', nullable: false}
      provider_output_sha256: {type: 'char(64)', nullable: false}
      validator_version: {type: text, nullable: false}
      validator_sha256: {type: 'char(64)', nullable: false}
      output_schema_id: {type: text, nullable: false}
      output_schema_version: {type: text, nullable: false}
      output_schema_sha256: {type: 'char(64)', nullable: false}
      validation_policy_version: {type: text, nullable: false}
      validation_policy_sha256: {type: 'char(64)', nullable: false}
      validation_status: {type: text, nullable: false}
      schema_status: {type: text, nullable: false}
      citation_status: {type: text, nullable: false}
      policy_status: {type: text, nullable: false}
      run_terminal_status: {type: text, nullable: false}
      output_status: {type: text, nullable: false}
      failure_code: {type: text, nullable: true}
      failure_details_redacted: {type: 'jsonb:AgentValidationFailureListV1', nullable: false}
      validated_outcome: {type: 'jsonb:AgentValidatedOutcomeV2', nullable: true}
      validated_outcome_sha256: {type: 'char(64)', nullable: true}
      citation_count: {type: integer, nullable: false}
      proposal_count: {type: integer, nullable: false}
      citation_set_sha256: {type: 'char(64)', nullable: false}
      proposal_set_sha256: {type: 'char(64)', nullable: false}
      validation_sha256: {type: 'char(64)', nullable: false}
      validated_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_output_validations_pk, columns: [validation_id]}
      foreign_keys:
        - {name: agent_output_validations_run_fk, columns: [agent_run_id, input_snapshot_sha256], references: "ops.agent_runs(id, input_snapshot_hash)", on_delete: RESTRICT}
        - {name: agent_output_validations_turn_fk, columns: [agent_run_id, provider_turn_id], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id)", on_delete: RESTRICT}
      unique:
        - {name: agent_output_validations_turn_uk, columns: [agent_run_id, provider_turn_id]}
        - {name: agent_output_validations_run_binding_uk, columns: [validation_id, agent_run_id, input_snapshot_sha256]}
        - {name: agent_output_validations_binding_uk, columns: [validation_id, agent_run_id, provider_turn_id, input_snapshot_sha256, provider_output_sha256, validation_sha256]}
      checks:
        - {name: agent_output_validations_status_ck, expression: "validation_status IN ('VALID','INVALID') AND schema_status IN ('PASS','FAIL','NOT_RUN') AND citation_status IN ('PASS','FAIL','NOT_RUN') AND policy_status IN ('PASS','FAIL','NOT_RUN')"}
        - {name: agent_output_validations_run_status_ck, expression: "run_terminal_status IN ('SUCCEEDED','FAILED','POLICY_BLOCKED','BUDGET_BLOCKED','CANCELLED') AND output_status IN ('COMPLETED','ABSTAINED','POLICY_BLOCKED','BUDGET_BLOCKED')"}
        - {name: agent_output_validations_failure_code_ck, expression: "failure_code IS NULL OR failure_code IN ('OUTPUT_SCHEMA_INVALID','CITATION_MISSING','CITATION_OUTSIDE_SNAPSHOT','CITATION_LOCATOR_MISMATCH','CITATION_CONTENT_HASH_MISMATCH','CITATION_SOURCE_KIND_INVALID','RUN_TOOL_ARTIFACT_NOT_OWNED_BY_RUN','SNAPSHOT_STALE','PROMPT_INJECTION_DETECTED','RIGHTS_DENIED','CLASSIFICATION_DENIED','SOURCE_USE_MISSING','SOURCE_USE_RIGHTS_MISMATCH','PROPOSAL_SCHEMA_INVALID')"}
        - {name: agent_output_validations_counts_ck, expression: citation_count >= 0 AND proposal_count >= 0}
        - {name: agent_output_validations_valid_ck, expression: "validation_status<>'VALID' OR (schema_status='PASS' AND citation_status='PASS' AND policy_status='PASS' AND failure_code IS NULL AND validated_outcome IS NOT NULL AND validated_outcome_sha256 IS NOT NULL)"}
        - {name: agent_output_validations_schema_failure_ck, expression: "schema_status<>'FAIL' OR (validation_status='INVALID' AND run_terminal_status='FAILED' AND failure_code IS NOT NULL AND failure_code='OUTPUT_SCHEMA_INVALID' AND citation_count=0 AND proposal_count=0 AND validated_outcome IS NULL)"}
        - {name: agent_output_validations_abstention_ck, expression: "output_status<>'ABSTAINED' OR (validation_status='INVALID' AND run_terminal_status='SUCCEEDED' AND proposal_count=0 AND failure_code IS NOT NULL AND failure_code IN ('CITATION_MISSING','CITATION_OUTSIDE_SNAPSHOT','CITATION_LOCATOR_MISMATCH','CITATION_CONTENT_HASH_MISMATCH','CITATION_SOURCE_KIND_INVALID','RUN_TOOL_ARTIFACT_NOT_OWNED_BY_RUN','SNAPSHOT_STALE','PROMPT_INJECTION_DETECTED','RIGHTS_DENIED','CLASSIFICATION_DENIED','SOURCE_USE_MISSING','SOURCE_USE_RIGHTS_MISMATCH','PROPOSAL_SCHEMA_INVALID'))"}
        - {name: agent_output_validations_proposal_ck, expression: "output_status='COMPLETED' OR proposal_count=0"}
    indexes:
      - {name: agent_output_validations_run_idx, method: btree, columns: [agent_run_id, validated_at DESC]}
    provider_turn_guard: deferred constraint trigger locks the parent and requires COMPLETED FINAL_OUTPUT with envelope_payload_sha256=provider_output_sha256
    transaction: insert validation, terminalize agent run with exact base status, append audit, and enqueue agent.output_validated.v1 atomically; zero proposals are inserted before successful validation
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: immutable run validation evidence}
    retention:
      record_class: AGENT_OUTPUT_VALIDATION
      trigger: agent run/case terminal retention decision
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: agent_run_id and exact input snapshot assets
      backup_behavior: preserve validation and digest receipt while any proposal, action, publication, or audit references it
      terminal_action: PRESERVE metadata/digests; optional safe payload crypto-erase only after references clear
    repository_roundtrip:
      row_type: AgentOutputValidationRow
      methods: [insert_atomic, get_by_id, get_for_turn]
      assertions: [valid completed, schema failure, every abstention code, zero-proposal invariant, exact provider output FK, JSON optionality, run/event atomicity, immutable mutation]

  - relation: ops.agent_proposal_citations
    owner_role: gurine_migrator
    service_owner: analysis-worker
    domain_owner: crates/domain::agent
    rust_type: gurine_domain::agent::AgentProposalCitation
    repository: crates/persistence-postgres::agent_proposals
    mutation_class: IMMUTABLE
    columns:
      citation_id: {type: uuid, nullable: false, default: gen_random_uuid()}
      citation_contract_version: {type: smallint, nullable: false, default: 2}
      proposal_id: {type: uuid, nullable: false}
      agent_run_id: {type: uuid, nullable: false}
      provider_turn_id: {type: uuid, nullable: false}
      validation_id: {type: uuid, nullable: false}
      dataset_snapshot_id: {type: uuid, nullable: false}
      snapshot_member_id: {type: uuid, nullable: true}
      snapshot_member_digest: {type: 'char(64)', nullable: true}
      citation_ordinal: {type: integer, nullable: false}
      input_snapshot_sha256: {type: 'char(64)', nullable: false}
      proposal_payload_sha256: {type: 'char(64)', nullable: false}
      source_kind: {type: text, nullable: false}
      source_use_id: {type: uuid, nullable: false}
      source_use_sha256: {type: 'char(64)', nullable: false}
      evidence_segment_id: {type: uuid, nullable: true}
      research_artifact_id: {type: uuid, nullable: true}
      source_id: {type: uuid, nullable: false, generated: "coalesce(evidence_segment_id,research_artifact_id)"}
      locator_kind: {type: text, nullable: false}
      locator_value: {type: text, nullable: false}
      locator_digest: {type: 'char(64)', nullable: false}
      content_sha256: {type: 'char(64)', nullable: false}
      supports_redacted: {type: text, nullable: false}
      supports_sha256: {type: 'char(64)', nullable: false}
      citation_digest: {type: 'char(64)', nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_proposal_citations_pk, columns: [citation_id]}
      foreign_keys:
        - {name: agent_proposal_citations_proposal_fk, columns: [proposal_id, agent_run_id, proposal_payload_sha256, input_snapshot_sha256, validation_id], references: "ops.agent_suggestions(id, agent_run_id, payload_sha256, input_snapshot_sha256, citation_validation_id)", on_delete: RESTRICT}
        - {name: agent_proposal_citations_run_snapshot_fk, columns: [agent_run_id, dataset_snapshot_id, input_snapshot_sha256], references: "ops.agent_runs(id, dataset_snapshot_id, input_snapshot_hash)", on_delete: RESTRICT}
        - {name: agent_proposal_citations_validation_fk, columns: [validation_id], references: ops.agent_output_validations(validation_id), on_delete: RESTRICT}
        - {name: agent_proposal_citations_member_fk, columns: [snapshot_member_id, dataset_snapshot_id, snapshot_member_digest], references: "core.dataset_snapshot_members(id, dataset_snapshot_id, member_digest)", on_delete: RESTRICT}
        - {name: agent_proposal_citations_segment_fk, columns: [evidence_segment_id, locator_digest, content_sha256], references: "raw.evidence_segments(id, locator_digest, selected_content_sha256)", on_delete: RESTRICT}
        - {name: agent_proposal_citations_artifact_fk, columns: [research_artifact_id, agent_run_id, content_sha256], references: "raw.research_artifacts(id, agent_run_id, content_sha256)", on_delete: RESTRICT}
        - {name: agent_proposal_citations_source_use_fk, columns: [agent_run_id, source_use_id, source_use_sha256], references: "ops.agent_source_uses(agent_run_id, source_use_id, source_use_sha256)", on_delete: RESTRICT, create_after_parent: true}
      unique:
        - {name: agent_proposal_citations_ordinal_uk, columns: [proposal_id, citation_ordinal]}
        - {name: agent_proposal_citations_digest_uk, columns: [proposal_id, citation_digest]}
      checks:
        - {name: agent_proposal_citations_version_ordinal_ck, expression: citation_contract_version = 2 AND citation_ordinal >= 0}
        - {name: agent_proposal_citations_kind_ck, expression: "source_kind IN ('EVIDENCE_SEGMENT','RUN_TOOL_ARTIFACT')"}
        - {name: agent_proposal_citations_source_shape_ck, expression: "num_nonnulls(evidence_segment_id,research_artifact_id)=1 AND ((source_kind='EVIDENCE_SEGMENT' AND evidence_segment_id IS NOT NULL AND snapshot_member_id IS NOT NULL AND snapshot_member_digest IS NOT NULL) OR (source_kind='RUN_TOOL_ARTIFACT' AND research_artifact_id IS NOT NULL AND snapshot_member_id IS NULL AND snapshot_member_digest IS NULL))"}
        - {name: agent_proposal_citations_locator_kind_ck, expression: "locator_kind IN ('PAGE_BBOX','XLSX_CELL','CSV_ROW_COLUMN','XML_XPATH','DOCX_PARAGRAPH','HWPX_XPATH','JSON_POINTER','HTML_CSS_SELECTOR','API_FIELD','TEXT_RANGE','IMAGE_BBOX','AUDIO_TIME_RANGE','VIDEO_TIME_RANGE','VIDEO_REGION_TIME')"}
        - {name: agent_proposal_citations_nonempty_ck, expression: "length(btrim(locator_value)) > 0 AND length(btrim(supports_redacted)) > 0"}
    indexes:
      - {name: agent_proposal_citations_source_idx, method: btree, columns: [source_kind, source_id]}
      - {name: agent_proposal_citations_validation_idx, method: btree, columns: [validation_id, proposal_id, citation_ordinal]}
    insertion_guard: deferred constraint trigger locks validation/proposal/run/source-use/source rows; validation identity matches run, turn, snapshot, and proposal and is VALID with output_status COMPLETED; the source use is same-run use_kind=CITATION with exact source kind/identity/locator/selected content and an ancestor path to the bytes exposed by the tool/model; evidence source member object_type/id/content match the exact READY snapshot; tool artifact belongs to the same run and a SUCCEEDED source.fetch call; citationJoinDigest is the canonical ordered [citationId,citationSha256,sourceUseId,sourceUseSha256] list
    transaction: proposal, all citations, audit, and agent.proposal_created.v2 outbox event are inserted atomically; partial proposal materialization is forbidden
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: immutable proposal provenance; user scope inherited from proposal run/case}
    retention:
      record_class: AGENT_PROPOSAL_CITATION
      trigger: proposal/action/publication terminal retention decision
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: proposal run case plus cited source asset
      backup_behavior: preserve locator/content/support digests while material target or receipt exists
      terminal_action: PRESERVE citation chain; safe support text may be crypto-erased only after all references clear
    repository_roundtrip:
      row_type: AgentProposalCitationRow
      methods: [insert_batch_atomic, list_ordered, resolve_source]
      assertions: [both source kinds, exact source-use ancestry, missing or cross-run source use, exact snapshot membership, outside-snapshot rejection, artifact ownership rejection, locator/content mismatch, duplicate order/digest, zero partial batch, immutable mutation]

