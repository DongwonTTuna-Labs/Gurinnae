      evidence_version: {type: bigint, nullable: false}
      evidence_digest: {type: 'char(64)', nullable: false}
      rights_decision_id: {type: uuid, nullable: false}
      rights_decision_version: {type: bigint, nullable: false}
      rights_decision_sha256: {type: 'char(64)', nullable: false}
      root_source_use_id: {type: uuid, nullable: false}
      root_source_use_sha256: {type: 'char(64)', nullable: false}
