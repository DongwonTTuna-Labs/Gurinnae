      locator_digest: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(locator_canonical,'sha256'),'hex')"}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: response_request_evidence_scopes_pk, columns: [response_request_id,scope_version,claim_ordinal,evidence_ordinal]}
      foreign_keys:
        - {name: response_request_evidence_scope_claim_fk, columns: [response_request_id,scope_version,claim_ordinal,claim_binding_digest], references: 'editorial.response_request_claim_scopes(response_request_id,scope_version,claim_ordinal,claim_binding_digest)', on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
        - {name: response_request_evidence_scope_snapshot_fk, columns: [review_snapshot_id,review_case_id,review_snapshot_version,review_snapshot_digest], references: 'editorial.review_snapshots(id,case_id,case_version,snapshot_sha256)', on_delete: RESTRICT}
        - {name: response_request_evidence_scope_source_fk, columns: [source_document_id,source_asset_id,source_asset_revision,source_content_sha256], references: 'raw.source_documents(id,asset_id,asset_revision,content_sha256)', on_delete: RESTRICT}
      unique:
        - {name: response_request_evidence_scope_evidence_uq, columns: [response_request_id,scope_version,claim_ordinal,evidence_id,evidence_version,evidence_digest,locator_digest]}
        - {name: response_request_evidence_scope_locator_uq, columns: [response_request_id,scope_version,claim_ordinal,locator_digest]}
      checks:
        - {name: response_request_evidence_scope_shape_ck, expression: "scope_version>0 AND claim_ordinal>=0 AND evidence_ordinal>=0 AND review_snapshot_version>0 AND evidence_version>0 AND source_asset_revision>0"}
        - {name: response_request_evidence_scope_payload_ck, expression: "ops.ordered_evidence_locator_ref_v1_is_valid(locator_payload) AND convert_from(locator_canonical,'UTF8')::jsonb=locator_payload AND locator_digest=encode(extensions.digest(locator_canonical,'sha256'),'hex')"}
    authority_rule: the immutable review snapshot and locator/source tuple are the historical evidence authority; mutable editorial evidence heads are creation-time inputs only
    indexes:
      - {name: response_request_evidence_scope_source_idx, method: btree, columns: [source_document_id,locator_digest,response_request_id]}
      - {name: response_request_evidence_scope_order_idx, method: btree, columns: [response_request_id,scope_version,claim_ordinal,evidence_ordinal]}
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants: {gurine_control_api: [SELECT], gurine_workflow_worker: [SELECT], gurine_notification_worker: [SELECT], gurine_auditor: [SELECT], all_other_runtime_roles: []}
    rls: {enabled: false, rationale: internal immutable response scope history}
    retention: {record_class: RESPONSE_REQUEST_SCOPE_HISTORY, terminal_action: PRESERVE_WITH_PARENT}
    repository_roundtrip: {row_type: ResponseRequestEvidenceScopeRow, order: [response_request_id,scope_version,claim_ordinal,evidence_ordinal ASC], assertions: [claim composite FK,snapshot authority,source locator FK,contiguous ordinal]}

cross_migration_0028_retention_and_hold_bindings:
  status: DESIGN_COMPLETE_OPEN_IMPLEMENTATION
  schedule_candidate_required_on_0028:
    relation: ops.record_class_schedules
    candidate_key: [id, record_class, schedule_digest]
    current_effective_rule: effective_at <= row.created_at and review_expires_at > row.created_at; choose greatest effective_at/revision under lock; no match, expired review, overlap or changed digest rejects the write/purge
  per_relation_columns_added_by_0028:
    retention_record_class: {type: text, nullable: false, generated_from_relation_map: true}
    retention_schedule_id: {type: uuid, nullable: false}
    retention_schedule_digest: {type: 'char(64)', nullable: false}
    foreign_key: "(retention_schedule_id,retention_record_class,retention_schedule_digest) -> ops.record_class_schedules(id,record_class,schedule_digest) ON DELETE RESTRICT"
  exact_relation_class_map:
    core.normalization_runs: NORMALIZATION_RUN_LINEAGE
