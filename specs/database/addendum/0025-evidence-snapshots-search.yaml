    core.supplier_identity_resolution_decision_members: SUPPLIER_IDENTITY_ASSERTION_HISTORY
    core.supplier_relationship_assertions: SUPPLIER_IDENTITY_ASSERTION_HISTORY
    core.supplier_relationship_assertion_evidence: SUPPLIER_IDENTITY_ASSERTION_HISTORY
    core.procurement_query_snapshots: PROCUREMENT_QUERY_SNAPSHOT
    core.procurement_query_snapshot_members: PROCUREMENT_QUERY_SNAPSHOT
    editorial.response_request_claim_scopes: RESPONSE_REQUEST_SCOPE_HISTORY
    editorial.response_request_evidence_scopes: RESPONSE_REQUEST_SCOPE_HISTORY
  operational_audit_schedule_semantics:
    reference_record_class: AGENT_RUN_CONTROL_RECEIPT
    covered_relations: [ops.signal_investigation_policies, ops.signal_investigation_initiation_receipts]
    schedule_rule: each relation retains its distinct record class and exact current nonexpired schedule binding while following the same finite operational-audit retention semantics as AGENT_RUN_CONTROL_RECEIPT; PRESERVE_PUBLIC_REVISION and custom PRESERVE terminal tokens are forbidden
    linkability:
      ops.signal_investigation_policies: no direct natural-person identifier is stored; created_by is a linkable internal user reference, so each row is operational-audit evidence
      ops.signal_investigation_initiation_receipts: no direct natural-person identifier is emitted in the canonical receipt payload; signal, case, and target graph references remain potentially linkable, so each row is operational-audit evidence
  class_set_rule: the set of values above must be a subset of the activated schedule catalog and the migration/acceptance fixture must create one current nonexpired schedule for every value before enabling any runtime writer
  hold_resolution:
    direct_anchor_kinds: [SOURCE_ASSET,RESEARCH_ARTIFACT]
    resolver: ops.record_has_active_legal_hold(retention_record_class,relation_name,row_id,at_time)
    graph:
      NORMALIZATION_RUN_LINEAGE: normalization run -> source document -> SOURCE_ASSET anchor
      EVIDENCE_SEGMENT_PAYLOAD: segment -> source document -> SOURCE_ASSET anchor and editorial evidence/case holds
      DATASET_SNAPSHOT: snapshot -> members -> member sources -> SOURCE_ASSET or RESPONSE/case anchors
      DATASET_SNAPSHOT_MEMBER: member -> member sources -> source/response/case anchors
      DATASET_SNAPSHOT_MEMBER_SOURCE: exact source asset or response/case anchor
      AGENT_PROVIDER_TURN_SAFE_PAYLOAD: provider turn -> run -> snapshot member-source graph
      AGENT_TOOL_CALL_SAFE_PAYLOAD: tool call -> source-use graph -> concrete source anchors
      RESEARCH_ARTIFACT_PAYLOAD: artifact asset -> RESEARCH_ARTIFACT anchor plus run/case holds
      AGENT_OUTPUT_VALIDATION: validation -> run/snapshot/citation source-use graph
      AGENT_PROPOSAL_CITATION: citation -> source-use -> exact source/research anchor and case
      ASSET_RIGHTS_DECISION_AUDIT: bound source or research asset anchor
      AGENT_RECONCILIATION_EVIDENCE: evidence -> run -> exact provider/tool/source and cost proof graph
      AGENT_RUN_CONTROL_RECEIPT: receipt -> run/snapshot/source-use graph
      AGENT_RUNTIME_POLICY: policy -> created_by internal user reference and referencing initiation receipt -> signal/case/run/job/audit graph
      AGENT_RUNTIME_INITIATION_RECEIPT: receipt -> policy/signal/case/snapshot/run/job/audit graph
      AGENT_SOURCE_USE: concrete source identity and parent-use closure
      RESEARCH_ARTIFACT_PROMOTION: both research and created source asset anchors plus evidence/case
      PUBLIC_SEARCH_PROJECTION: projected object/publication/evidence/response holds; purge never deletes underlying authority
      INTERNAL_SEARCH_PROJECTION: projected object/case/source holds; purge never deletes underlying authority
      SOURCE_PAGE_RECEIPT: receipt -> fetch -> source documents -> SOURCE_ASSET anchors
      PROCUREMENT_REVISION_AUTHORITY: revision/member graph -> source document/asset, normalization, predecessor, agency/supplier, contract/notice/award and query/export/response references
      SUPPLIER_IDENTITY_ASSERTION_HISTORY: candidate/decision/assertion graph -> exact source, immutable review snapshot, task, actor, public projection and counter-assertion references
      PROCUREMENT_QUERY_SNAPSHOT: snapshot parent and members -> exact public projection generation, contract and line-item revision plus cursor/export/idempotency receipt references
      RESPONSE_REQUEST_SCOPE_HISTORY: request scope graph -> immutable review snapshot, claim/evidence/source locator, response/publication/correction/appeal and sent-receipt references
    destructive_rule: RETENTION or DELETION coverage, unknown resolver result, missing anchor reconstruction, missing/expired schedule, restoration suppression or backup dependency blocks DELETE/ANONYMIZE/CRYPTO_ERASE
  migration_order: 0028 creates record_class_schedules and legal_hold_target_anchors, adds its candidate key, adds/validates all 36 three-column bindings in one transaction, backfills only from evidence-grounded effective schedules, installs the resolver, then enables destructive workers
  runtime_oracle: for every class, one no-hold row reaches only its declared terminal action; direct, transitive, multiple and partially released holds all block; expired hold review never releases; backup restore remains inaccessible until schedule/hold/suppression graph revalidates

