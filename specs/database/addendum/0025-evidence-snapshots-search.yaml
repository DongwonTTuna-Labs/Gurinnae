      actor_id: {type: uuid, nullable: true}
      reason_code: {type: text, nullable: false}
      reason_sha256: {type: 'char(64)', nullable: false}
      command_operation_id: {type: text, nullable: true}
      command_expected_run_version: {type: bigint, nullable: true}
      command_idempotency_key_sha256: {type: 'char(64)', nullable: true}
      command_request_sha256: {type: 'char(64)', nullable: true}
      prior_receipt_id: {type: uuid, nullable: true}
      prior_receipt_sha256: {type: 'char(64)', nullable: true}
      audit_event_id: {type: uuid, nullable: false}
      occurred_at: {type: timestamptz, nullable: false}
      receipt_canonical: {type: bytea, nullable: false}
      receipt_sha256: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(receipt_canonical,'sha256'),'hex')"}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_run_control_receipts_pk, columns: [receipt_id]}
      foreign_keys:
        - {name: agent_run_control_receipts_run_fk, columns: [agent_run_id], references: ops.agent_runs(id), on_delete: RESTRICT}
        - {name: agent_run_control_receipts_turn_fk, columns: [agent_run_id, affected_provider_turn_id], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id)", on_delete: RESTRICT}
        - {name: agent_run_control_receipts_tool_fk, columns: [agent_run_id, affected_tool_call_id], references: "ops.agent_tool_calls(agent_run_id, tool_call_id)", on_delete: RESTRICT}
        - {name: agent_run_control_receipts_reconciliation_fk, columns: [agent_run_id, reconciliation_evidence_id, reconciliation_evidence_sha256], references: "ops.agent_reconciliation_evidence(agent_run_id, evidence_id, evidence_sha256)", on_delete: RESTRICT}
        - {name: agent_run_control_receipts_prior_fk, columns: [agent_run_id, prior_receipt_id, prior_receipt_sha256], references: "ops.agent_run_control_receipts(agent_run_id, receipt_id, receipt_sha256)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
        - {name: agent_run_control_receipts_audit_fk, columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      unique:
        - {name: agent_run_control_receipts_version_uk, columns: [agent_run_id, aggregate_version]}
        - {name: agent_run_control_receipts_digest_uk, columns: [agent_run_id, receipt_sha256]}
        - {name: agent_run_control_receipts_binding_uk, columns: [agent_run_id, receipt_id, receipt_sha256]}
      checks:
        - {name: agent_run_control_receipts_version_ck, expression: "receipt_contract_version=2 AND aggregate_version > 0 AND ((aggregate_version=1 AND prior_receipt_id IS NULL AND prior_receipt_sha256 IS NULL AND prior_status IS NULL AND prior_control_state IS NULL) OR (aggregate_version>1 AND prior_receipt_id IS NOT NULL AND prior_receipt_sha256 IS NOT NULL AND prior_status IS NOT NULL AND prior_control_state IS NOT NULL))"}
        - {name: agent_run_control_receipts_status_ck, expression: "(prior_status IS NULL OR prior_status IN ('QUEUED','RUNNING','SUCCEEDED','FAILED','CANCELLED','BUDGET_BLOCKED','POLICY_BLOCKED')) AND next_status IN ('QUEUED','RUNNING','SUCCEEDED','FAILED','CANCELLED','BUDGET_BLOCKED','POLICY_BLOCKED')"}
        - {name: agent_run_control_receipts_control_ck, expression: "(prior_control_state IS NULL OR prior_control_state IN ('NONE','ACTIVE','CANCEL_REQUESTED','RECONCILIATION_REQUIRED','SETTLED')) AND next_control_state IN ('NONE','ACTIVE','CANCEL_REQUESTED','RECONCILIATION_REQUIRED','SETTLED')"}
        - {name: agent_run_control_receipts_terminal_ck, expression: "(next_status IN ('SUCCEEDED','FAILED','CANCELLED','BUDGET_BLOCKED','POLICY_BLOCKED'))=(next_control_state='SETTLED')"}
        - {name: agent_run_control_receipts_proof_ck, expression: "proof_kind IN ('COMMAND_INPUT','LEASE_CLAIM','PROVIDER_LOOKUP','IDEMPOTENCY_LOOKUP','TOOL_ADAPTER_LOOKUP','COST_USAGE_RECEIPT','DEFINITIVE_NO_DISPATCH','VALIDATED_FINAL_OUTPUT','DEFINITIVE_INTERNAL_FAILURE') AND budget_disposition IN ('NONE','RESERVED','SETTLED','RELEASED','RECONCILIATION_REQUIRED') AND actor_kind IN ('CONTROL_API','ANALYSIS_WORKER','RECONCILIATION_WORKER','SCHEDULER')"}
        - {name: agent_run_control_receipts_actor_ck, expression: "(actor_kind='SCHEDULER' AND actor_id IS NULL) OR (actor_kind<>'SCHEDULER' AND actor_id IS NOT NULL)"}
        - {name: agent_run_control_receipts_reconciliation_ck, expression: "(reconciliation_evidence_id IS NULL)=(reconciliation_evidence_sha256 IS NULL) AND (proof_kind NOT IN ('PROVIDER_LOOKUP','IDEMPOTENCY_LOOKUP','TOOL_ADAPTER_LOOKUP','COST_USAGE_RECEIPT') OR reconciliation_evidence_id IS NOT NULL)"}
        - {name: agent_run_control_receipts_command_ck, expression: "(actor_kind='CONTROL_API' AND command_operation_id='cancelAgentRun' AND command_expected_run_version IS NOT NULL AND command_expected_run_version>0 AND command_idempotency_key_sha256 IS NOT NULL AND command_request_sha256 IS NOT NULL) OR (actor_kind='RECONCILIATION_WORKER' AND command_operation_id='reconcileAgentRun' AND command_expected_run_version IS NOT NULL AND command_expected_run_version>0 AND command_idempotency_key_sha256 IS NOT NULL AND command_request_sha256 IS NOT NULL) OR (actor_kind IN ('ANALYSIS_WORKER','SCHEDULER') AND command_operation_id IS NULL AND command_expected_run_version IS NULL AND command_idempotency_key_sha256 IS NULL AND command_request_sha256 IS NULL)"}
        - {name: agent_run_control_receipts_reason_ck, expression: "reason_code IN ('RUN_STARTED','TURN_ADVANCED','FINAL_OUTPUT_VALIDATED','DEFINITIVE_FAILURE','BUDGET_DENIED','POLICY_DENIED','PRE_DISPATCH_CANCELLED','CANCEL_REQUESTED','OUTCOME_AMBIGUOUS','SAFE_RETRY_AUTHORIZED','RECONCILED_SUCCEEDED','RECONCILED_FAILED','RECONCILED_CANCELLED','NO_STATE_CHANGE')"}
        - {name: agent_run_control_receipts_safe_retry_ck, expression: "NOT (prior_control_state='CANCEL_REQUESTED' AND next_control_state='ACTIVE') AND (next_control_state<>'ACTIVE' OR prior_control_state='RECONCILIATION_REQUIRED')"}
        - {name: agent_run_control_receipts_canonical_ck, expression: "convert_from(receipt_canonical,'UTF8')::jsonb IS NOT NULL"}
    indexes:
      - {name: agent_run_control_receipts_run_idx, method: btree, columns: [agent_run_id, aggregate_version DESC]}
      - {name: agent_run_control_receipts_proof_idx, method: btree, columns: [proof_kind, occurred_at DESC, receipt_id]}
      - {name: agent_run_control_receipts_reconciliation_idx, method: btree, columns: [agent_run_id, reconciliation_evidence_id, reconciliation_evidence_sha256], predicate: "reconciliation_evidence_id IS NOT NULL AND reconciliation_evidence_sha256 IS NOT NULL"}
    transition_guard: deferred trigger locks the run and prior receipt; requires aggregate_version=run.version, exact allowed runtime-contract edge, proof/effect/budget parity, and exact prior chain; terminal run status/control/receipt digest and this row commit atomically
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_analysis_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_auditor: [SELECT]
    function_only_writes:
      gurine_analysis_worker: [ops.transition_agent_run_v2]
      gurine_control_api: [ops.transition_agent_run_v2]
    rls: {enabled: false, rationale: safe typed control receipts; case scope is joined through the run repository}
    retention:
      record_class: AGENT_RUN_CONTROL_RECEIPT
      trigger: later of run, case, provider/tool, budget and audit schedules
      schedule_binding: exact effective 0028 schedule revision; missing/expired schedule preserves fail-closed
      legal_hold_key: agent_run_id plus reached case/snapshot/source graph
      backup_behavior: restore before run control state becomes actionable
      terminal_action: PRESERVE receipt IDs/digests/proof classes while any run, cost, proposal, action or audit reference exists
    repository_roundtrip:
      row_type: AgentRunControlReceiptRow
      methods: [append_atomic, list_chain, get_exact]
      assertions: [all runtime edges, pre-dispatch cancel, possible-effect cancel request, reconciliation outcomes, budget dispositions, prior-chain mismatch, 64-way version winner, immutable denial]

