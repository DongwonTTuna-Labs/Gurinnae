        - {name: evidence_segments_lineage_binding_uk, columns: [id, source_document_id, locator_digest]}
        - {name: evidence_segments_source_use_binding_uk, columns: [id, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, selected_content_sha256, locator_digest]}
      checks:
        - {name: evidence_segments_revision_ordinal_ck, expression: source_asset_revision > 0 AND segment_ordinal >= 0}
        - {name: evidence_segments_locator_kind_ck, expression: "locator_kind IN ('PAGE_BBOX','XLSX_CELL','CSV_ROW_COLUMN','XML_XPATH','DOCX_PARAGRAPH','HWPX_XPATH','JSON_POINTER','HTML_CSS_SELECTOR','API_FIELD','TEXT_RANGE','IMAGE_BBOX','AUDIO_TIME_RANGE','VIDEO_TIME_RANGE','VIDEO_REGION_TIME')"}
        - {name: evidence_segments_classification_ck, expression: "classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD')"}
        - {name: evidence_segments_confidence_ck, expression: confidence IS NULL OR confidence BETWEEN 0 AND 1}
        - {name: evidence_segments_nonempty_ck, expression: "length(btrim(locator_value)) > 0 AND length(btrim(parser_name)) > 0 AND length(btrim(parser_version)) > 0 AND length(btrim(selected_content_object_key)) > 0 AND length(btrim(selected_content_locator)) > 0 AND length(btrim(selected_content_media_type)) > 0 AND length(btrim(source_authority)) > 0"}
    indexes:
      - {name: evidence_segments_source_idx, method: btree, columns: [source_document_id, segment_ordinal]}
      - {name: evidence_segments_asset_locator_idx, method: btree, columns: [source_asset_id, source_asset_revision, locator_digest]}
      - {name: evidence_segments_parser_idx, method: btree, columns: [parser_run_id, segment_ordinal]}
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_ingest_worker: [SELECT, INSERT]
      gurine_analysis_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_workflow_worker: [SELECT]
    rls: {enabled: false, rationale: classification is evaluated at the typed digest-bound projection function; gurine_public_projector has no direct raw evidence read}
    retention:
      record_class: EVIDENCE_SEGMENT_PAYLOAD
      trigger: last material use or source document terminal decision, whichever is later
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision; physical FK deferred until 0028
      legal_hold_key: source asset identity plus editorial evidence/case graph
      backup_behavior: selected object capsule may be crypto-erased only after primary and backup receipts; metadata/digests remain while referenced
      terminal_action: schedule-selected DELETE|CRYPTO_ERASE; active RETENTION or DELETION hold blocks action
    repository_roundtrip:
      row_type: EvidenceSegmentRow
      methods: [insert_or_replay, get_by_id, list_by_source, resolve_locator]
      assertions: [all ten locator kinds, null and nonnull transformation/confidence, composite source/parser FK mismatch, same digest replay, changed digest conflict, byte-identical object pointer and hashes, immutable update/delete]

