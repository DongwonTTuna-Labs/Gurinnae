    member_set_sha256: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
    rule: a proven zero-source FULL or DELTA build is a READY dataset snapshot with member_count=0, this nonnull member_set_sha256, a nonnull manifest/snapshot digest, and zero child rows; FAILED is never a zero generation
