      schema_version: {type: text, nullable: false}
      selection_spec: {type: 'jsonb:DatasetSnapshotSelectionV1', nullable: false}
      selection_canonical: {type: bytea, nullable: false}
      selection_sha256: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(selection_canonical,'sha256'),'hex')"}
      source_watermarks: {type: 'jsonb:DatasetSourceWatermarksV1', nullable: false}
      source_watermarks_canonical: {type: bytea, nullable: false}
      source_watermark_sha256: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(source_watermarks_canonical,'sha256'),'hex')"}
      normalization_versions: {type: 'jsonb:DatasetNormalizationVersionsV1', nullable: false}
      normalization_versions_canonical: {type: bytea, nullable: false}
      normalization_set_sha256: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(normalization_versions_canonical,'sha256'),'hex')"}
      member_count: {type: bigint, nullable: false, default: 0}
      member_set_sha256: {type: 'char(64)', nullable: true}
      snapshot_manifest: {type: 'jsonb:DatasetSnapshotManifestV1', nullable: true}
      snapshot_manifest_canonical: {type: bytea, nullable: true}
      snapshot_sha256: {type: 'char(64)', nullable: true, generated_when_manifest_present: "encode(extensions.digest(snapshot_manifest_canonical,'sha256'),'hex')"}
      build_request_sha256: {type: 'char(64)', nullable: false}
      build_started_audit_event_id: {type: uuid, nullable: false}
      terminal_receipt_sha256: {type: 'char(64)', nullable: true}
      terminal_audit_event_id: {type: uuid, nullable: true}
      error_code: {type: text, nullable: true}
      error_sha256: {type: 'char(64)', nullable: true}
      version: {type: bigint, nullable: false, default: 1}
      started_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      ready_at: {type: timestamptz, nullable: true}
      failed_at: {type: timestamptz, nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: dataset_snapshots_pk, columns: [id]}
      foreign_keys:
        - {name: dataset_snapshots_job_fk, columns: [producer_job_id], references: ops.jobs(id), on_delete: RESTRICT}
        - {name: dataset_snapshots_build_audit_fk, columns: [build_started_audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
        - {name: dataset_snapshots_terminal_audit_fk, columns: [terminal_audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
        - {name: dataset_snapshots_prior_fk, columns: [prior_snapshot_id, snapshot_kind, prior_snapshot_sha256], references: "core.dataset_snapshots(id, snapshot_kind, snapshot_sha256)", on_delete: RESTRICT}
      unique:
        - {name: dataset_snapshots_generation_uk, columns: [snapshot_kind, producer_key, producer_generation]}
        - {name: dataset_snapshots_producer_generation_uk, columns: [snapshot_kind, producer_digest, producer_generation]}
        - {name: dataset_snapshots_child_binding_uk, columns: [id, snapshot_kind, producer_generation, projection_watermark, contract_version]}
        - {name: dataset_snapshots_member_binding_uk, columns: [id, snapshot_kind, producer_generation, contract_version]}
        - {name: dataset_snapshots_hash_binding_uk, columns: [id, snapshot_sha256]}
        - {name: dataset_snapshots_paid_binding_uk, columns: [id, version, snapshot_sha256]}
        - {name: dataset_snapshots_prior_binding_uk, columns: [id, snapshot_kind, snapshot_sha256]}
      partial_unique:
        - {name: dataset_snapshots_one_building_uk, columns: [snapshot_kind, producer_digest], predicate: "state='BUILDING'"}
      checks:
        - {name: dataset_snapshots_contract_ck, expression: contract_version = 1}
        - {name: dataset_snapshots_kind_ck, expression: "snapshot_kind IN ('AGENT_CASE','DETECTION_DATASET','PUBLIC_SEARCH_PROJECTION','INTERNAL_SEARCH_PROJECTION')"}
        - {name: dataset_snapshots_producer_ck, expression: "(snapshot_kind IN ('AGENT_CASE','DETECTION_DATASET') AND producer_component='snapshot-producer') OR (snapshot_kind='PUBLIC_SEARCH_PROJECTION' AND producer_component='public-search-projector') OR (snapshot_kind='INTERNAL_SEARCH_PROJECTION' AND producer_component='internal-search-projector')"}
        - {name: dataset_snapshots_generation_ck, expression: producer_generation > 0 AND member_count >= 0 AND version > 0}
        - {name: dataset_snapshots_projection_shape_ck, expression: "(snapshot_kind IN ('AGENT_CASE','DETECTION_DATASET') AND projection_watermark IS NULL AND generation_mode IS NULL AND prior_snapshot_id IS NULL AND prior_snapshot_sha256 IS NULL) OR (snapshot_kind IN ('PUBLIC_SEARCH_PROJECTION','INTERNAL_SEARCH_PROJECTION') AND projection_watermark IS NOT NULL AND projection_watermark >= 0 AND generation_mode IS NOT NULL AND generation_mode IN ('FULL','DELTA') AND ((generation_mode='FULL' AND prior_snapshot_id IS NULL AND prior_snapshot_sha256 IS NULL) OR (generation_mode='DELTA' AND prior_snapshot_id IS NOT NULL AND prior_snapshot_sha256 IS NOT NULL)))"}
        - {name: dataset_snapshots_state_ck, expression: "state IN ('BUILDING','READY','FAILED')"}
        - {name: dataset_snapshots_nonempty_ck, expression: "length(btrim(producer_key)) > 0 AND length(btrim(schema_version)) > 0"}
        - {name: dataset_snapshots_canonical_json_ck, expression: "convert_from(selection_canonical,'UTF8')::jsonb=selection_spec AND convert_from(source_watermarks_canonical,'UTF8')::jsonb=source_watermarks AND convert_from(normalization_versions_canonical,'UTF8')::jsonb=normalization_versions AND (snapshot_manifest_canonical IS NULL OR convert_from(snapshot_manifest_canonical,'UTF8')::jsonb=snapshot_manifest)"}
        - {name: dataset_snapshots_terminal_shape_ck, expression: "(state='BUILDING' AND version=1 AND ready_at IS NULL AND failed_at IS NULL AND snapshot_manifest IS NULL AND snapshot_manifest_canonical IS NULL AND snapshot_sha256 IS NULL AND terminal_receipt_sha256 IS NULL AND terminal_audit_event_id IS NULL AND error_code IS NULL AND error_sha256 IS NULL) OR (state='READY' AND version=2 AND ready_at IS NOT NULL AND failed_at IS NULL AND member_set_sha256 IS NOT NULL AND snapshot_manifest IS NOT NULL AND snapshot_manifest_canonical IS NOT NULL AND snapshot_sha256 IS NOT NULL AND terminal_receipt_sha256 IS NOT NULL AND terminal_audit_event_id IS NOT NULL AND error_code IS NULL AND error_sha256 IS NULL) OR (state='FAILED' AND version=2 AND failed_at IS NOT NULL AND ready_at IS NULL AND member_count=0 AND member_set_sha256 IS NULL AND snapshot_manifest IS NULL AND snapshot_manifest_canonical IS NULL AND snapshot_sha256 IS NULL AND terminal_receipt_sha256 IS NOT NULL AND terminal_audit_event_id IS NOT NULL AND error_code IS NOT NULL AND error_sha256 IS NOT NULL)"}
    indexes:
      - {name: dataset_snapshots_current_idx, method: btree, columns: [snapshot_kind, producer_key, producer_generation DESC], predicate: "state='READY'"}
      - {name: dataset_snapshots_digest_idx, method: btree, columns: [snapshot_kind, producer_digest, producer_generation DESC]}
    lifecycle:
      start: BUILDING
      terminal: [READY, FAILED]
      allowed_edges: [BUILDING->READY, BUILDING->FAILED]
      retry: FAILED requires a new producer_generation and row
      current_generation: highest producer_generation READY row per snapshot_kind and producer_key; no mutable ACTIVE or RETIRED state
      finalizer_dispatch:
        AGENT_CASE: core.dataset_snapshot_members plus core.dataset_snapshot_member_sources
        DETECTION_DATASET: core.dataset_snapshot_members plus core.dataset_snapshot_member_sources
        PUBLIC_SEARCH_PROJECTION: public.search_documents
        INTERNAL_SEARCH_PROJECTION: ops.search_documents
      zero_member_rule: permitted only when the finalizer proves exact zero and uses the canonical empty-set digest
      immutable_columns: [id, contract_version, snapshot_kind, producer_component, producer_job_id, producer_key, producer_digest, producer_generation, projection_watermark, generation_mode, prior_snapshot_id, prior_snapshot_sha256, schema_version, selection_spec, selection_canonical, selection_sha256, source_watermarks, source_watermarks_canonical, source_watermark_sha256, normalization_versions, normalization_versions_canonical, normalization_set_sha256, build_request_sha256, build_started_audit_event_id, started_at, created_at]
      failure_transaction: outer REPEATABLE READ transaction inserts/locks BUILDING and build-start audit receipt; child work runs in a savepoint; a build error rolls back the savepoint to zero children, then outer transaction atomically records FAILED, audit, outbox, and terminal receipt
      event_aggregate_version: version
      build_started_receipt:
        type: DatasetSnapshotBuildStartedReceiptV1
        stored_binding: [id, snapshot_kind, producer_generation, producer_digest, build_request_sha256, build_started_audit_event_id, started_at, version]
        required: [snapshotId, snapshotKind, producerGeneration, producerDigest, requestDigest, auditEventId, startedAt, aggregateVersion, receiptDigest]
      terminal_event:
        event_type: dataset.snapshot_created.v1
        producers:
          AGENT_CASE: snapshot-producer
          DETECTION_DATASET: snapshot-producer
          PUBLIC_SEARCH_PROJECTION: public-search-projector
          INTERNAL_SEARCH_PROJECTION: internal-search-projector
        common_required: [snapshotId, snapshotKind, producerDigest, producerGeneration, projectionWatermark, memberCount, sourceWatermarkDigest, state, terminalReceiptDigest]
        READY: {snapshotSha256: required_nonnull, errorCode: required_null, errorDigest: required_null, aggregateVersion: 2}
        FAILED: {snapshotSha256: required_null, errorCode: required_nonnull, errorDigest: required_nonnull, aggregateVersion: 2}
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    function_only_writes:
      gurine_analysis_worker: [core.begin_dataset_snapshot, core.finalize_dataset_snapshot]
    rls: {enabled: false, rationale: kind-scoped functions prevent cross-service snapshot kind mutation}
    retention:
      record_class: DATASET_SNAPSHOT
      trigger: last dependent rule run, agent run, cursor expiry, or audit retention, whichever is later
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision; physical FK deferred until 0028
      legal_hold_key: producer scope plus all member source assets and reached cases
      backup_behavior: immutable snapshots and child rows are restored together; suppression and hold are evaluated before reactivation
      terminal_action: DELETE only as one snapshot graph after all references and holds clear; search generations may purge after cursor retention because underlying authority remains
    repository_roundtrip:
      row_type: DatasetSnapshotRow
      methods: [begin_or_reuse, finalize_ready, finalize_failed, get_ready_exact, current_generation]
      assertions: [all four kinds, zero and nonzero member sets, ordered digest equality, same producer reuse, failed new generation, 64-way one building winner, terminal mutation denial, kind-scoped role denial]

