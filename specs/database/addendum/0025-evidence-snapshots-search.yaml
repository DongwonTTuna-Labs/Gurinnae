      attribution_required: {type: boolean, nullable: false}
      attribution_text: {type: text, nullable: true}
      attribution_uri: {type: text, nullable: true}
      attribution_sha256: {type: 'char(64)', nullable: false}
      policy_version: {type: text, nullable: false}
      policy_sha256: {type: 'char(64)', nullable: false}
      approval_sha256: {type: 'char(64)', nullable: false}
      execution_sha256: {type: 'char(64)', nullable: false}
      evidence_receipt_id: {type: uuid, nullable: false}
      evidence_receipt_sha256: {type: 'char(64)', nullable: false}
      reviewer_user_id: {type: uuid, nullable: false}
      effective_at: {type: timestamptz, nullable: false}
      expires_at: {type: timestamptz, nullable: true}
      decision_sha256: {type: 'char(64)', nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: asset_rights_decisions_pk, columns: [id]}
      foreign_keys:
        - {name: asset_rights_source_fk, columns: [source_document_id, asset_id, asset_revision, asset_sha256], references: "raw.source_documents(id, asset_id, asset_revision, content_sha256)", on_delete: RESTRICT}
        - {name: asset_rights_artifact_fk, columns: [research_artifact_id, asset_id, asset_revision, asset_sha256], references: "raw.research_artifacts(id, asset_id, asset_revision, content_sha256)", on_delete: RESTRICT}
        - {name: asset_rights_reviewer_fk, columns: [reviewer_user_id], references: ops.users(id), on_delete: RESTRICT}
        - {name: asset_rights_evidence_receipt_fk, columns: [evidence_receipt_id, evidence_receipt_sha256], references: "ops.audit_events(id, event_hash)", on_delete: RESTRICT}
        - {name: asset_rights_prior_fk, columns: [prior_decision_id, asset_id, asset_revision, asset_sha256, prior_decision_version, prior_decision_sha256], references: "raw.asset_rights_decisions(id, asset_id, asset_revision, asset_sha256, decision_version, decision_sha256)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
      unique:
        - {name: asset_rights_version_uk, columns: [asset_id, asset_revision, asset_sha256, decision_version]}
        - {name: asset_rights_digest_uk, columns: [asset_id, asset_revision, asset_sha256, decision_sha256]}
        - {name: asset_rights_binding_uk, columns: [id, decision_sha256]}
        - {name: asset_rights_source_use_binding_uk, columns: [id, asset_id, asset_revision, asset_sha256, decision_version, decision_sha256]}
      checks:
        - {name: asset_rights_identity_ck, expression: "asset_revision > 0 AND decision_version > 0 AND num_nonnulls(source_document_id,research_artifact_id)=1"}
        - {name: asset_rights_kind_ck, expression: "(asset_kind='SOURCE_DOCUMENT' AND source_document_id IS NOT NULL) OR (asset_kind='RESEARCH_ARTIFACT' AND research_artifact_id IS NOT NULL)"}
        - {name: asset_rights_decision_kind_ck, expression: "decision_kind IN ('GRANT','DENY','SUSPEND','REVOKE')"}
        - {name: asset_rights_dimensions_ck, expression: "access_right IN ('ALLOW','DENY','UNKNOWN') AND private_storage_right IN ('ALLOW','DENY','UNKNOWN') AND model_egress_right IN ('ALLOW','DENY','UNKNOWN') AND model_use_right IN ('ALLOW','DENY','UNKNOWN') AND derivative_creation_right IN ('ALLOW','DENY','UNKNOWN') AND excerpt_right IN ('ALLOW','DENY','UNKNOWN') AND redistribution_right IN ('ALLOW','DENY','UNKNOWN') AND commercial_use_right IN ('ALLOW','DENY','UNKNOWN') AND public_display_right IN ('ALLOW','DENY','UNKNOWN')"}
        - {name: asset_rights_sequence_ck, expression: "(decision_version=1 AND prior_decision_id IS NULL AND prior_decision_version IS NULL AND prior_decision_sha256 IS NULL) OR (decision_version>1 AND prior_decision_id IS NOT NULL AND prior_decision_version IS NOT NULL AND prior_decision_version=decision_version-1 AND prior_decision_sha256 IS NOT NULL)"}
        - {name: asset_rights_effective_range_ck, expression: expires_at IS NULL OR expires_at > effective_at}
        - {name: asset_rights_attribution_ck, expression: "NOT attribution_required OR (attribution_text IS NOT NULL AND length(btrim(attribution_text)) > 0)"}
        - {name: asset_rights_nonempty_ck, expression: "length(btrim(legal_basis_code)) > 0 AND length(btrim(legal_basis_reference)) > 0 AND length(btrim(jurisdiction)) > 0 AND length(btrim(policy_version)) > 0"}
        - {name: asset_rights_license_set_ck, expression: "ops.digest_array_is_sorted_unique(license_evidence_digests)"}
    indexes:
      - {name: asset_rights_current_idx, method: btree, columns: [asset_id, asset_sha256, decision_version DESC]}
      - {name: asset_rights_expiry_idx, method: btree, columns: [expires_at, asset_id], predicate: "expires_at IS NOT NULL"}
    sequence_guard: SERIALIZABLE append locks the exact asset_id/revision/content row and latest decision; version, prior ID and digest must match; 64 concurrent revisions yield one winner and 63 RIGHTS_DECISION_STALE
    evaluation: latest effective nonexpired GRANT controls each dimension independently; missing, UNKNOWN, DENY, SUSPEND, REVOKE, or expired blocks every new use except private preservation required by law/hold
    backward_fk_rule: 0026 action/execution authorization and receipt rows reference this decision ID/digest; 0028 legal-hold target anchors reference the exact source/research asset composite; this 0025 relation has no FK to a future table
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_workflow_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
      gurine_analysis_worker: [SELECT]
      gurine_ingest_worker: [SELECT]
      gurine_document_extractor: [SELECT]
    rls: {enabled: false, rationale: service-owned immutable legal decision; gurine_public_projector receives only rights-filtered typed projection output and has no direct raw decision read}
    retention:
      record_class: ASSET_RIGHTS_DECISION_AUDIT
      trigger: later of asset/publication/action/audit retention
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: exact asset identity and all dependent evidence/publication cells
      backup_behavior: append-only decision and digest chain restored before any asset becomes processable
      terminal_action: PRESERVE while any asset/publication/action/audit reference exists; corrections append and never rewrite
    repository_roundtrip:
      row_type: AssetRightsDecisionRow
      methods: [append_revision, current_effective, list_history]
      assertions: [source and research assets, all nine dimensions, first and subsequent versions, expected-version race, prior digest mismatch, expiry boundary, attribution variants, future-table independence, immutable mutation]

  - relation: ops.agent_reconciliation_evidence
    owner_role: gurine_migrator
    service_owner: reconciliation-worker through owner procedure
    domain_owner: crates/agent-orchestration::runtime
    rust_type: gurine_agent_orchestration::runtime::AgentReconciliationEvidence
    repository: crates/persistence-postgres::agent_runs
    mutation_class: IMMUTABLE
    columns:
      evidence_id: {type: uuid, nullable: false, default: gen_random_uuid()}
      evidence_contract_version: {type: smallint, nullable: false, default: 1}
      agent_run_id: {type: uuid, nullable: false}
      provider_turn_id: {type: uuid, nullable: true}
      tool_call_id: {type: uuid, nullable: true}
      evidence_kind: {type: text, nullable: false}
      source_proof_kind: {type: text, nullable: false}
      adapter_id: {type: text, nullable: false}
      adapter_version: {type: text, nullable: false}
      adapter_configuration_sha256: {type: 'char(64)', nullable: false}
      lookup_request_sha256: {type: 'char(64)', nullable: false}
      lookup_idempotency_key_sha256: {type: 'char(64)', nullable: false}
      caller_assertion_sha256: {type: 'char(64)', nullable: false}
      provider_receipt_id: {type: uuid, nullable: true}
      provider_receipt_sha256: {type: 'char(64)', nullable: true}
      tool_terminal_sha256: {type: 'char(64)', nullable: true}
      resolution: {type: text, nullable: false}
      budget_disposition: {type: text, nullable: false}
      observed_at: {type: timestamptz, nullable: false}
      evidence_canonical: {type: bytea, nullable: false}
      evidence_sha256: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(evidence_canonical,'sha256'),'hex')"}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_reconciliation_evidence_pk, columns: [evidence_id]}
      foreign_keys:
        - {name: agent_reconciliation_evidence_run_fk, columns: [agent_run_id], references: ops.agent_runs(id), on_delete: RESTRICT}
        - {name: agent_reconciliation_evidence_turn_fk, columns: [agent_run_id, provider_turn_id], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id)", on_delete: RESTRICT}
        - {name: agent_reconciliation_evidence_tool_fk, columns: [agent_run_id, tool_call_id], references: "ops.agent_tool_calls(agent_run_id, tool_call_id)", on_delete: RESTRICT}
        - {name: agent_reconciliation_evidence_provider_receipt_fk, columns: [agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256)", on_delete: RESTRICT}
      unique:
        - {name: agent_reconciliation_evidence_binding_uk, columns: [agent_run_id, evidence_id, evidence_sha256]}
        - {name: agent_reconciliation_evidence_lookup_uk, columns: [agent_run_id, lookup_idempotency_key_sha256, lookup_request_sha256]}
      checks:
        - {name: agent_reconciliation_evidence_kind_ck, expression: "evidence_contract_version=1 AND evidence_kind IN ('PROVIDER_LOOKUP','IDEMPOTENCY_LOOKUP','TOOL_ADAPTER_LOOKUP','COST_USAGE_RECEIPT','DEFINITIVE_NO_DISPATCH')"}
        - {name: agent_reconciliation_evidence_source_kind_ck, expression: "source_proof_kind IN ('AUTHENTICATED_RESPONSE_HEADERS','SIGNED_PROVIDER_RECEIPT','IDEMPOTENCY_LOOKUP','USAGE_LOOKUP','TOOL_ADAPTER_TERMINAL_RECEIPT','DEFINITIVE_NO_DISPATCH')"}
        - {name: agent_reconciliation_evidence_resolution_ck, expression: "resolution IN ('STILL_AMBIGUOUS','SAFE_RETRY_AUTHORIZED','RESUME_RECOVERED_RESULT','TERMINAL_SUCCEEDED','TERMINAL_FAILED','TERMINAL_CANCELLED') AND budget_disposition IN ('NONE','SETTLED','RELEASED','RECONCILIATION_REQUIRED')"}
        - {name: agent_reconciliation_evidence_target_ck, expression: "(evidence_kind='TOOL_ADAPTER_LOOKUP' AND provider_turn_id IS NULL AND provider_receipt_id IS NULL AND provider_receipt_sha256 IS NULL AND tool_call_id IS NOT NULL AND tool_terminal_sha256 IS NOT NULL) OR (evidence_kind IN ('PROVIDER_LOOKUP','IDEMPOTENCY_LOOKUP','COST_USAGE_RECEIPT') AND provider_turn_id IS NOT NULL AND tool_call_id IS NULL AND tool_terminal_sha256 IS NULL) OR (evidence_kind='DEFINITIVE_NO_DISPATCH' AND provider_turn_id IS NULL AND tool_call_id IS NULL AND provider_receipt_id IS NULL AND provider_receipt_sha256 IS NULL AND tool_terminal_sha256 IS NULL)"}
        - {name: agent_reconciliation_evidence_provider_pair_ck, expression: "(provider_receipt_id IS NULL)=(provider_receipt_sha256 IS NULL)"}
        - {name: agent_reconciliation_evidence_ambiguous_ck, expression: "resolution<>'STILL_AMBIGUOUS' OR budget_disposition='RECONCILIATION_REQUIRED'"}
        - {name: agent_reconciliation_evidence_nonempty_ck, expression: "length(btrim(adapter_id))>0 AND length(btrim(adapter_version))>0"}
        - {name: agent_reconciliation_evidence_canonical_ck, expression: "convert_from(evidence_canonical,'UTF8')::jsonb IS NOT NULL"}
    indexes:
      - {name: agent_reconciliation_evidence_run_idx, method: btree, columns: [agent_run_id, observed_at DESC, evidence_id]}
      - {name: agent_reconciliation_evidence_turn_idx, method: btree, columns: [agent_run_id, provider_turn_id], predicate: "provider_turn_id IS NOT NULL"}
      - {name: agent_reconciliation_evidence_tool_idx, method: btree, columns: [agent_run_id, tool_call_id], predicate: "tool_call_id IS NOT NULL"}
      - {name: agent_reconciliation_evidence_receipt_idx, method: btree, columns: [agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256], predicate: "provider_turn_id IS NOT NULL AND provider_receipt_id IS NOT NULL AND provider_receipt_sha256 IS NOT NULL"}
    insertion_guard: ops.record_agent_reconciliation_evidence locks the exact run and affected turn/tool; validates authenticated adapter proof and current routing/config/idempotency bytes; derives the closed resolution and canonical identity projection server-side; raw provider identifiers, credentials and unbounded proof bytes are never stored
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_control_api: [SELECT]
      gurine_analysis_worker: [SELECT]
      gurine_auditor: [SELECT]
    function_only_writes:
      gurine_control_api: [ops.record_agent_reconciliation_evidence]
    rls: {enabled: false, rationale: immutable safe proof; case scope is resolved through the exact run}
    retention:
      record_class: AGENT_RECONCILIATION_EVIDENCE
      trigger: later of run, provider/tool, cost, control receipt, case and audit schedules
      schedule_binding: exact effective 0028 schedule revision; missing or expired schedule preserves fail-closed
      legal_hold_key: agent_run_id plus the affected provider/tool/source graph
      backup_behavior: restore before a reconciliation decision becomes actionable
      terminal_action: PRESERVE identity, proof class and digest while any run, cost, action or audit references it
    repository_roundtrip:
      row_type: AgentReconciliationEvidenceRow
      methods: [record_once, get_exact, get_for_lookup]
      assertions: [all five evidence kinds, all six resolutions, provider/tool/no-dispatch shapes, exact replay, changed request conflict, cross-run proof rejection, stale configuration rejection, canonical digest, immutable denial]

  - relation: ops.agent_run_control_receipts
    owner_role: gurine_migrator
    service_owner: analysis-worker
    domain_owner: crates/agent-orchestration::runtime
    rust_type: gurine_agent_orchestration::runtime::AgentRunControlReceipt
    repository: crates/persistence-postgres::agent_runs
    mutation_class: IMMUTABLE
    columns:
      receipt_id: {type: uuid, nullable: false, default: gen_random_uuid()}
      receipt_contract_version: {type: smallint, nullable: false, default: 2}
      agent_run_id: {type: uuid, nullable: false}
