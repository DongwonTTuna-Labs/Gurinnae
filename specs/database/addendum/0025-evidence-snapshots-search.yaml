      SUPPLIER: {payload_type: SupplierSnapshotV1, required: [canonicalName, businessStatus, identityStatus]}
      CONTRACT: {payload_type: ContractSnapshotV1, required: [externalContractId, title, agencyId, supplierId, status, currency, normalizationVersion]}
      CONTRACT_LINE_ITEM: {payload_type: ContractLineItemSnapshotV1, required: [contractId, lineNumber, rawDescription, normalizedCategory, quantity, unit, unitPrice, totalPrice]}
      CONTRACT_CHANGE: {payload_type: ContractChangeSnapshotV1, required: [contractId, changeSequence, previousAmount, newAmount, previousEndAt, newEndAt, reason]}
      PRICE_OBSERVATION: {payload_type: PriceObservationSnapshotV1, required: [observationType, normalizedCategory, observedAt, currency, quantity, unit, unitPrice]}
      EVIDENCE_SEGMENT: {payload_type: EvidenceSegmentSnapshotV1, required: [sourceDocumentId, sourceAssetId, sourceAssetRevision, sourceContentSha256, locatorKind, locatorValue, locatorDigest, selectedContentSha256, classification]}
      RESPONSE: {payload_type: ResponseSnapshotV1, required: [caseId, responseRequestId, responseVersion, submittedAt, editorialStatus, contentSha256, publicationConsentDigest]}
  search_generation_chain:
    modes: [FULL, DELTA]
    FULL: prior generation is null and rows are the complete authorized object set at projectionWatermark
    DELTA: prior generation is the immediately previous READY generation of the same kind and rows contain only changed object revisions or tombstones through projectionWatermark
    query_rule: walk the pinned immutable generation chain newest first, choose the first row per object identity, discard tombstones, then apply authorization before retrieval and rank
    compaction_rule: a deterministic FULL generation is required before chain depth exceeds 256 or cumulative delta rows exceed ten percent of the latest FULL member count
    deletion_rule: a generation may purge only after no retained descendant depends on it and its cursor TTL has elapsed
  search_rank_execution:
    rank_policy_version: search-rank-v1
    non_statistical_score: '1.000000'
    tiers:
      - {tier: 1, predicate: exact separator-insensitive identifier key, reason: EXACT_IDENTIFIER}
      - {tier: 2, predicate: exact normalized canonical title or name, reason: EXACT_CANONICAL_TITLE}
      - {tier: 3, predicate: exact balanced quoted phrase in an authorized field, reason: EXACT_QUOTED_PHRASE}
      - {tier: 4, predicate: exact verified alias, reason: VERIFIED_ALIAS}
      - {tier: 5, predicate: canonical title/name or verified alias prefix, reason: CANONICAL_PREFIX}
      - {tier: 6, predicate: conjunctive full text, reason: FULL_TEXT, score_sql: "round(ts_rank_cd(ARRAY[0.05,0.20,0.50,1.00]::real[],search_vector,plainto_tsquery('simple',:conjunctive_terms),32)::numeric,6)"}
      - {tier: 7, predicate: no tier 1-6 result and unquoted normalized query length at least 3 and similarity at least 0.45, reason: TRIGRAM_FALLBACK, score_sql: "round(similarity(:normalized_query,normalized_title)::numeric,6)"}
    winning_match: lowest tier only; within one tier field precedence is IDENTIFIER,TITLE,CANONICAL_NAME,VERIFIED_ALIAS,SUMMARY,BODY,LOCATOR and alias tie uses C-sorted normalized alias
    relevance_keyset: [tier ASC, score DESC, normalized_title COLLATE C ASC, object_type_order ASC, object_id ASC, object_revision ASC]
    updated_keyset: [object_updated_at NULLS LAST DESC, normalized_title COLLATE C ASC, object_type_order ASC, object_id ASC, object_revision ASC]
    title_keyset: [normalized_title COLLATE C ASC, object_type_order ASC, object_id ASC, object_revision ASC]
    cursor: authenticated encrypted v1 binding surface, query/filter digest, sort, limit, rank policy, generation UUID, projection watermark, complete keyset tuple, authorization-scope digest, issue time, and expiry
    cursor_ttl: {public: 30 minutes, internal: 10 minutes}

default_privileges:
  owner: gurine_migrator
  statements:
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA raw REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA core REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA public REVOKE ALL ON TABLES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA raw REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA core REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA public REVOKE ALL ON SEQUENCES FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA raw REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA core REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
    - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
  runtime_default_grants: forbidden

required_existing_relation_alters:
  - relation: raw.source_documents
    reason: EvidenceProvenanceV1 and AssetRightsDecision require stable asset identity and revision in addition to row identity.
    add_columns:
      asset_id: {type: uuid, staged_nullable: true, final_nullable: false}
      asset_revision: {type: bigint, staged_nullable: true, final_nullable: false}
    deterministic_backfill:
      partition: [source_id, external_id]
      order: [retrieved_at ASC, created_at ASC, id ASC]
      asset_id: first_value(id) over partition
      asset_revision: row_number() over partition
    constraints:
      - {name: source_documents_asset_revision_positive_ck, kind: CHECK, expression: asset_revision > 0}
      - {name: source_documents_asset_revision_uk, kind: UNIQUE, columns: [asset_id, asset_revision]}
      - {name: source_documents_asset_content_uk, kind: UNIQUE, columns: [asset_id, asset_revision, content_sha256]}
      - {name: source_documents_source_revision_uk, kind: UNIQUE, columns: [source_id, external_id, asset_revision]}
      - {name: source_documents_provenance_uk, kind: UNIQUE, columns: [id, asset_id, asset_revision, content_sha256]}
    allocation_contract:
      owner_function: raw.insert_source_document_revision
      identity: [source_id, external_id]
      lock: pg_advisory_xact_lock over a domain-separated SHA-256 of source_id NUL external_id, followed by SELECT of every existing identity row FOR UPDATE in asset_revision order
      exact_replay: same source identity and content_sha256 returns the existing row byte-equivalently and allocates no revision
      new_revision: reuse the first revision asset_id, allocate max(asset_revision)+1, bind the exact source_fetch payload digest/size/object key, and insert once
      first_revision: asset_id equals the generated source_document id and asset_revision=1
      changed_external_identity: creates a distinct asset_id even when content bytes match
      acl: revoke direct INSERT and updates to identity/content columns from every runtime role; EXECUTE raw.insert_source_document_revision only to gurine_ingest_worker and the promotion owner procedure
    lifecycle_change: raw.enforce_source_document_lifecycle rejects mutation of source_id, external_id, asset_id, asset_revision, source_fetch_id, content_sha256, content_size_bytes, and object_key after insert
    concurrency_oracle: 64 equal-content writers return one row/revision; 64 distinct-content writers serialize to one asset_id and contiguous revisions without duplicate or skipped committed revisions

  - relation: raw.source_fetches
    add_constraints:
      - {name: source_fetches_artifact_binding_uk, kind: UNIQUE, columns: [id, payload_sha256, payload_size_bytes, object_key]}
      - {name: source_fetches_page_binding_uk, kind: UNIQUE, columns: [id, source_run_id, source_id, payload_sha256]}
      - {name: source_fetches_source_run_fk, kind: FOREIGN_KEY, columns: [source_run_id], references: ops.source_runs(id), on_delete: RESTRICT, nullable_legacy: true}

  - relation: raw.parsed_records
    add_columns:
      parser_run_id: {type: uuid, nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: parsed_records_normalization_binding_uk, kind: UNIQUE, columns: [id, source_document_id, parser_version, payload_sha256]}
      - {name: parsed_records_parser_binding_uk, kind: UNIQUE, columns: [id, source_document_id, parser_run_id, parser_version, payload_sha256]}
      - {name: parsed_records_provenance_binding_uk, kind: UNIQUE, columns: [id, source_document_id, parser_run_id, parser_version]}
      - {name: parsed_records_source_run_binding_uk, kind: UNIQUE, columns: [id, source_document_id, parser_run_id]}
      - {name: parsed_records_parser_run_fk, kind: FOREIGN_KEY, columns: [parser_run_id, source_document_id], references: "core.parser_runs(id, source_document_id)", on_delete: RESTRICT, create_after_candidate_key: true}
    new_write_rule: v2 parser output requires parser_run_id; legacy rows need evidence-grounded backfill or remain v1-ineligible and cannot enter a v2 snapshot

  - relation: core.parser_runs
    add_columns:
      input_content_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      extraction_schema_version: {type: text, nullable: true, legacy_bridge: true}
      implementation_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      extraction_receipt_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: parser_runs_segment_binding_uk, kind: UNIQUE, columns: [id, source_document_id, parser_name, parser_version]}
      - {name: parser_runs_source_binding_uk, kind: UNIQUE, columns: [id, source_document_id]}
      - {name: parser_runs_extraction_binding_uk, kind: UNIQUE, columns: [id, source_document_id, input_content_sha256, parser_name, parser_version, output_digest, extraction_receipt_sha256]}
    new_write_rule: v2 SUCCEEDED extraction requires input_content_sha256 equal the source document bytes, extraction_schema_version, pinned implementation_sha256, output_digest, extraction_receipt_sha256, and an exact closed parser result; failed or quarantined runs cannot create an EvidenceSegment

  - relation: core.field_provenance
    add_columns:
      normalization_run_id: {type: uuid, nullable: true, legacy_bridge: true}
      parser_run_id: {type: uuid, nullable: true, legacy_bridge: true}
      parsed_record_id: {type: uuid, nullable: true, legacy_bridge: true}
      entity_version: {type: bigint, nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: field_provenance_normalization_run_fk, kind: FOREIGN_KEY, columns: [normalization_run_id], references: core.normalization_runs(id), on_delete: RESTRICT, create_after_parent: true}
      - {name: field_provenance_parser_run_fk, kind: FOREIGN_KEY, columns: [parser_run_id, source_document_id], references: "core.parser_runs(id, source_document_id)", on_delete: RESTRICT}
      - {name: field_provenance_parsed_record_fk, kind: FOREIGN_KEY, columns: [parsed_record_id, source_document_id, parser_run_id, parser_version], references: "raw.parsed_records(id, source_document_id, parser_run_id, parser_version)", on_delete: RESTRICT}
      - {name: field_provenance_member_binding_uk, kind: UNIQUE, columns: [id, source_document_id, normalization_run_id, parser_run_id, parsed_record_id]}
    new_write_rule: normalized v2 writes require normalization_run_id, parser_run_id, parsed_record_id, and entity_version; legacy rows may remain null but are ineligible for a v2 snapshot until verified

  - relation: editorial.evidence
    add_columns:
      evidence_segment_id: {type: uuid, nullable: true, legacy_bridge: true}
      evidence_digest: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - name: editorial_evidence_segment_fk
        kind: FOREIGN_KEY
        columns: [evidence_segment_id, source_document_id, content_sha256]
        references: "raw.evidence_segments(id, source_document_id, source_content_sha256)"
        on_delete: RESTRICT
        create_after_parent: true
      - {name: editorial_evidence_digest_binding_uk, kind: UNIQUE, columns: [id, version, evidence_digest]}
      - {name: editorial_evidence_promotion_binding_uk, kind: UNIQUE, columns: [id, version, evidence_segment_id, evidence_digest]}
    digest_contract: evidence_digest is SHA-256 of GURINE_CANONICAL_JSON_V1 over id, caseId, version, evidenceType, title digest, description digest, source document/segment identity, classification, verification status, public excerpt digest and creator; encrypted/plain free text is represented only by its digest
    new_write_rule: source-backed v2 evidence requires evidence_segment_id and evidence_digest; only explicitly typed calculation or response evidence may omit the segment; historical rows without reconstructible bytes remain v1-ineligible

  - relation: editorial.responses
    add_columns:
      content_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      publication_consent_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: responses_snapshot_binding_uk, kind: UNIQUE, columns: [id, version, content_sha256]}
      - {name: responses_source_use_binding_uk, kind: UNIQUE, columns: [id, version, content_sha256, publication_consent_sha256]}
    new_write_rule: v2 response promotion computes both digests from canonical plaintext/content and consent before encryption; historical rows without provable bytes are v1-ineligible and are never synthetically backfilled

  - relation: ops.source_runs
    require_existing_columns:
      version: {type: bigint, nullable: false, default: 1, introduced_by: 0010_v7_operation_support.sql}
    add_columns:
      terminal_page_receipt_id: {type: uuid, nullable: true, legacy_bridge: true}
      page_receipt_set_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      page_reconciliation_receipt_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      page_reconciliation_audit_event_id: {type: uuid, nullable: true, legacy_bridge: true}
      page_reconciliation_outbox_event_id: {type: uuid, nullable: true, legacy_bridge: true}
    preflight: fail unless ops.source_runs.version and its positive CHECK already exist; 0025 never attempts to add or rewrite the base column
    add_constraints:
      - {name: source_runs_page_binding_uk, kind: UNIQUE, columns: [id, source_id]}
      - {name: source_runs_page_version_binding_uk, kind: UNIQUE, columns: [id, source_id, version]}
      - {name: source_runs_terminal_page_fk, kind: FOREIGN_KEY, columns: [terminal_page_receipt_id, id, source_id], references: "raw.source_page_receipts(id, source_run_id, source_id)", on_delete: RESTRICT, create_after_parent: true}
      - {name: source_runs_page_audit_fk, kind: FOREIGN_KEY, columns: [page_reconciliation_audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {name: source_runs_page_outbox_fk, kind: FOREIGN_KEY, columns: [page_reconciliation_outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
      - {name: source_runs_page_completion_shape_ck, kind: CHECK, expression: "num_nonnulls(terminal_page_receipt_id,page_receipt_set_sha256,page_reconciliation_receipt_sha256,page_reconciliation_audit_event_id,page_reconciliation_outbox_event_id) IN (0,5)"}
    completion_rule: v2 source run SUCCEEDED requires the five completion fields and can reach them only through raw.complete_source_page_traversal; FAILED/CANCELLED never advances a checkpoint and retain null completion fields

  - relation: ops.source_checkpoints
    add_columns:
      checkpoint_sha256: {type: 'char(64)', staged_nullable: true, final_nullable: false}
    backfill_rule: compute from exact canonical checkpoint v1 bytes; fail preflight if cursor_payload cannot decode to its connector's closed checkpoint type
    add_constraints:
      - {name: source_checkpoints_receipt_binding_uk, kind: UNIQUE, columns: [source_id, partition_key, version, checkpoint_sha256]}

  - relation: ops.source_registry
    add_columns:
      connector_id: {type: text, nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: source_registry_connector_binding_uk, kind: UNIQUE, columns: [source_id, connector_id]}
      - {name: source_registry_connector_id_ck, kind: CHECK, expression: "connector_id IS NULL OR connector_id IN ('koneps-contracts','koneps-notices','local-finance','alio','open-dart','audit-results')"}
    new_write_rule: any v2 source run/page path requires a nonnull connector_id; legacy nonconnector test rows may remain null and cannot create a page receipt
    lifecycle_change: connector_type and connector_id are immutable after creation

  - relation: ops.outbox
    add_columns:
      event_sequence: {type: bigint, staged_nullable: true, final_nullable: false}
      envelope_schema: {type: text, staged_nullable: true, final_nullable: false, fixed_value: gurine.outbox-envelope.v1}
      envelope_canonical: {type: bytea, staged_nullable: true, final_nullable: false}
      envelope_digest: {type: 'char(64)', staged_nullable: true, final_nullable: false, generated: "encode(extensions.digest(envelope_canonical,'sha256'),'hex')"}
    deterministic_backfill:
      order: [occurred_at ASC, available_at ASC, id ASC]
      value: row_number() starting at 1
      precondition: completed before any v2 search generation is created
      envelope: RFC8785 JCS UTF-8 of OutboxEnvelopeV1 field order [schemaVersion,id,aggregateType,aggregateId,aggregateVersion,eventType,payload,occurredAt]; delivery fields available_at,published_at,attempt_count,last_error are excluded
    add_constraints:
      - {name: outbox_event_sequence_uk, kind: UNIQUE, columns: [event_sequence]}
      - {name: outbox_event_binding_uk, kind: UNIQUE, columns: [id, event_sequence]}
      - {name: outbox_envelope_binding_uk, kind: UNIQUE, columns: [id, envelope_digest]}
      - {name: outbox_event_sequence_positive_ck, kind: CHECK, expression: event_sequence > 0}
      - {name: outbox_envelope_ck, kind: CHECK, expression: "envelope_schema='gurine.outbox-envelope.v1' AND envelope_digest=encode(extensions.digest(envelope_canonical,'sha256'),'hex') AND ops.outbox_envelope_v1_is_valid(envelope_canonical,id,aggregate_type,aggregate_id,aggregate_version,event_type,payload,occurred_at)"}
    enqueue_change: ops.enqueue_outbox takes a fixed global transaction advisory lock, assigns max(event_sequence)+1, and holds the lock through commit; allocation order therefore equals commit order and aborted transactions leave no durable gap
    lifecycle_change: event_sequence, envelope schema/bytes/digest and every source event field are immutable while only the existing delivery fields may follow their declared publication lifecycle

  - relation: ops.inbox
    add_columns:
      source_event_envelope_digest: {type: 'char(64)', nullable: true, staged_legacy: true}
      terminal_disposition: {type: text, nullable: true, staged_legacy: true}
      result_schema: {type: text, nullable: true, staged_legacy: true}
      result_body_canonical: {type: bytea, nullable: true, staged_legacy: true}
      result_digest: {type: 'char(64)', nullable: true, staged_legacy: true, generated_when_body_present: "encode(extensions.digest(result_body_canonical,'sha256'),'hex')"}
      terminalized_at: {type: timestamptz, nullable: true, staged_legacy: true}
    add_constraints:
      - {name: inbox_event_envelope_fk, kind: FOREIGN_KEY, columns: [event_id, source_event_envelope_digest], references: 'ops.outbox(id,envelope_digest)', on_delete: RESTRICT, match: FULL, not_valid_then_validate: true}
      - {name: inbox_terminal_result_shape_ck, kind: CHECK, expression: "num_nonnulls(terminal_disposition,result_schema,result_body_canonical,result_digest,terminalized_at) IN (0,5) AND (result_digest IS NULL OR result_digest=encode(extensions.digest(result_body_canonical,'sha256'),'hex'))"}
      - {name: inbox_exact_replay_uq, kind: UNIQUE, columns: [consumer,event_id,source_event_envelope_digest]}
    transition_rule: owner claim inserts consumer,event_id,envelope digest once; the same transaction that performs the domain mutation or typed no-op stores a closed terminal disposition and exact canonical result. A terminal row and all identity/envelope/result fields are immutable; exact replay returns stored bytes and changed-envelope replay is EVENT_REPLAY_CONFLICT.

  - relation: ops.audit_events
    add_constraints:
      - {name: audit_events_receipt_binding_uk, kind: UNIQUE, columns: [id, event_hash]}

  - relation: core.agencies
    add_columns:
      version: {type: bigint, staged_nullable: true, final_nullable: false}
    backfill_rule: evidence-grounded import sets the exact current revision; arbitrary DEFAULT 1 backfill is forbidden when more than one historical source revision exists
  - relation: core.suppliers
    add_columns:
      version: {type: bigint, staged_nullable: true, final_nullable: false}
    backfill_rule: evidence-grounded import sets the exact current revision; arbitrary DEFAULT 1 backfill is forbidden when more than one historical source revision exists

  - relation: editorial.cases
    add_constraints:
      - {name: cases_agent_binding_uk, kind: UNIQUE, columns: [id, version]}
    rule: case version is the optimistic-concurrency authority for startAgentRun, proposal materialization and research promotion; no caller-provided case digest substitutes for the locked row

  - relation: editorial.hypotheses
    add_columns:
      hypothesis_digest: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: hypotheses_agent_target_uk, kind: UNIQUE, columns: [id, version, hypothesis_digest]}
    new_write_rule: an AgentProposalV2 materialization supplies the canonical digest; legacy rows without reconstructible bytes cannot be an agent materialization target

  - relation: editorial.claims
    add_columns:
      claim_digest: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: claims_agent_target_uk, kind: UNIQUE, columns: [id, version, claim_digest]}
    new_write_rule: an AgentProposalV2 materialization creates DRAFT only and supplies the canonical digest; acceptance never verifies or publishes the claim

  - relation: ops.tasks
    add_columns:
      task_digest: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: tasks_agent_target_uk, kind: UNIQUE, columns: [id, version, task_digest]}
    new_write_rule: an AgentProposalV2 materialization supplies the canonical digest and origin binding; no proposal acceptance marks the task DONE

  - relation_group: public search origin projections
    relations: [public.cases, public.contracts, public.agencies, public.suppliers, public.rules, public.corrections]
    add_columns:
      projection_version: {type: bigint, staged_nullable: true, final_nullable: false}
      last_event_sequence: {type: bigint, staged_nullable: true, final_nullable: false}
    backfill_rule: derive from authoritative publication/projection events and source object versions before v2 search; fail migration preflight if any row cannot be proven without synthesis
    constraints:
      - {kind: CHECK, expression: projection_version > 0 AND last_event_sequence > 0}
      - {kind: FOREIGN_KEY, columns: [last_event_sequence], references: ops.outbox(event_sequence), on_delete: RESTRICT}

  - relation: ops.agent_runs
    add_columns:
      run_contract_version: {type: smallint, nullable: false, default: 1}
      dataset_snapshot_id: {type: uuid, nullable: true, legacy_bridge: true}
      initial_transcript_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      control_state: {type: text, nullable: true, legacy_bridge: true}
      prompt_id: {type: text, nullable: true, legacy_bridge: true}
      prompt_version: {type: text, nullable: true, legacy_bridge: true}
      prompt_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      output_schema_id: {type: text, nullable: true, legacy_bridge: true}
      output_schema_contract_version: {type: text, nullable: true, legacy_bridge: true}
      output_schema_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      provider_policy_version: {type: text, nullable: true, legacy_bridge: true}
      provider_policy_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      provider_classification: {type: text, nullable: true, legacy_bridge: true}
      provider_candidate_ids: {type: 'text[]', nullable: true, legacy_bridge: true}
      max_micros_krw: {type: bigint, nullable: true, legacy_bridge: true}
      reserved_micros_krw: {type: bigint, nullable: true, legacy_bridge: true}
      settled_micros_krw: {type: bigint, nullable: true, legacy_bridge: true}
      remaining_micros_krw: {type: bigint, nullable: true, legacy_bridge: true}
      budget_reservation_state: {type: text, nullable: true, legacy_bridge: true}
      budget_policy_version: {type: text, nullable: true, legacy_bridge: true}
      budget_policy_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
      max_provider_turns: {type: integer, nullable: true, legacy_bridge: true}
      max_tool_calls: {type: integer, nullable: true, legacy_bridge: true}
      completed_provider_turns: {type: integer, nullable: true, legacy_bridge: true}
      completed_tool_calls: {type: integer, nullable: true, legacy_bridge: true}
      next_turn_sequence: {type: integer, nullable: true, legacy_bridge: true}
      deadline_at: {type: timestamptz, nullable: true, legacy_bridge: true}
      output_validation_id: {type: uuid, nullable: true, legacy_bridge: true}
      failure_code: {type: text, nullable: true}
      terminal_receipt_sha256: {type: 'char(64)', nullable: true, legacy_bridge: true}
    add_constraints:
      - {name: agent_runs_contract_version_ck, kind: CHECK, expression: "run_contract_version IN (1,2)"}
      - {name: agent_runs_snapshot_hash_uk, kind: UNIQUE, columns: [id, input_snapshot_hash]}
      - {name: agent_runs_snapshot_binding_uk, kind: UNIQUE, columns: [id, dataset_snapshot_id, input_snapshot_hash]}
      - {name: agent_runs_snapshot_fk, kind: FOREIGN_KEY, columns: [dataset_snapshot_id, input_snapshot_hash], references: "core.dataset_snapshots(id, snapshot_sha256)", on_delete: RESTRICT, create_after_parent: true}
      - {name: agent_runs_v2_output_validation_fk, kind: FOREIGN_KEY, columns: [output_validation_id, id, input_snapshot_hash], references: "ops.agent_output_validations(validation_id, agent_run_id, input_snapshot_sha256)", on_delete: RESTRICT, create_after_parent: true, deferrable: INITIALLY_DEFERRED}
      - {name: agent_runs_v2_shape_ck, kind: CHECK, expression: "run_contract_version=1 OR (dataset_snapshot_id IS NOT NULL AND initial_transcript_sha256 IS NOT NULL AND control_state IS NOT NULL AND prompt_id IS NOT NULL AND prompt_version IS NOT NULL AND prompt_sha256 IS NOT NULL AND output_schema_id IS NOT NULL AND output_schema_contract_version IS NOT NULL AND output_schema_sha256 IS NOT NULL AND provider_policy_version IS NOT NULL AND provider_policy_sha256 IS NOT NULL AND provider_classification IS NOT NULL AND provider_candidate_ids IS NOT NULL AND cardinality(provider_candidate_ids) BETWEEN 1 AND 8 AND max_micros_krw IS NOT NULL AND max_micros_krw >= 0 AND reserved_micros_krw IS NOT NULL AND reserved_micros_krw >= 0 AND settled_micros_krw IS NOT NULL AND settled_micros_krw >= 0 AND remaining_micros_krw IS NOT NULL AND remaining_micros_krw >= 0 AND budget_reservation_state IS NOT NULL AND budget_policy_version IS NOT NULL AND budget_policy_sha256 IS NOT NULL AND max_provider_turns IS NOT NULL AND max_provider_turns BETWEEN 1 AND 32 AND max_tool_calls IS NOT NULL AND max_tool_calls BETWEEN 0 AND 32 AND completed_provider_turns IS NOT NULL AND completed_provider_turns BETWEEN 0 AND max_provider_turns AND completed_tool_calls IS NOT NULL AND completed_tool_calls BETWEEN 0 AND max_tool_calls AND next_turn_sequence IS NOT NULL AND next_turn_sequence BETWEEN 1 AND 33 AND deadline_at IS NOT NULL AND deadline_at > created_at AND evidence_scope_ids='[]'::jsonb)"}
      - {name: agent_runs_v2_status_control_ck, kind: CHECK, expression: "run_contract_version=1 OR (status='QUEUED' AND control_state='NONE' AND started_at IS NULL AND completed_at IS NULL AND terminal_receipt_sha256 IS NULL) OR (status='RUNNING' AND control_state IN ('ACTIVE','CANCEL_REQUESTED','RECONCILIATION_REQUIRED') AND started_at IS NOT NULL AND completed_at IS NULL AND terminal_receipt_sha256 IS NULL) OR (status IN ('SUCCEEDED','FAILED','CANCELLED','BUDGET_BLOCKED','POLICY_BLOCKED') AND control_state='SETTLED' AND completed_at IS NOT NULL AND terminal_receipt_sha256 IS NOT NULL)"}
      - {name: agent_runs_v2_failure_ck, kind: CHECK, expression: "failure_code IS NULL OR failure_code IN ('OUTPUT_SCHEMA_INVALID','PROVIDER_UNAVAILABLE','INTERNAL_EXECUTION_FAILED','CITATION_INVALID','RIGHTS_DENIED','CLASSIFICATION_DENIED','ITERATION_LIMIT_REACHED','CANCELLED_BY_USER','RECONCILIATION_FAILED')"}
      - {name: agent_runs_v2_enum_ck, kind: CHECK, expression: "run_contract_version=1 OR (agent_type IN ('market-researcher','investigator','skeptic','claim-drafter','citation-verifier') AND provider_classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD'))"}
      - {name: agent_runs_v2_budget_ck, kind: CHECK, expression: "run_contract_version=1 OR (budget_reservation_state IN ('NONE','RESERVED','PARTIALLY_SETTLED','SETTLED','RELEASED','RECONCILIATION_REQUIRED') AND reserved_micros_krw <= max_micros_krw AND settled_micros_krw <= reserved_micros_krw AND remaining_micros_krw=max_micros_krw-settled_micros_krw)"}
      - {name: agent_runs_v2_candidates_ck, kind: CHECK, expression: "run_contract_version=1 OR ops.agent_provider_candidates_are_valid(provider_candidate_ids)"}
    new_write_rule: run_contract_version=2 requires the exact READY AGENT_CASE snapshot, canonical AgentRunV2 fields, initial transcript digest, and evidence_scope_ids='[]'::jsonb; snapshot members and member-source rows are the sole scope authority
    lifecycle_change:
      searchable_status_authority: [QUEUED,RUNNING,SUCCEEDED,FAILED,CANCELLED,BUDGET_BLOCKED,POLICY_BLOCKED]
      control_state_authority: [NONE,ACTIVE,CANCEL_REQUESTED,RECONCILIATION_REQUIRED,SETTLED]
      mutation_entrypoints: [ops.start_agent_run_v2, ops.transition_agent_run_v2, ops.record_agent_run_control_receipt]
      rule: direct runtime UPDATE/DELETE is revoked; each accepted CAS transition increments version exactly once and any cancel/reconcile control change inserts one immutable ops.agent_run_control_receipts row in the same transaction
      terminal_rule: terminal status, SETTLED control state, output validation when applicable, every provider/tool claim terminal, every budget reservation terminal, audit/outbox and terminal receipt commit atomically
      abstention_rule: a validated abstention remains SUCCEEDED with zero proposals and explicit output_status=ABSTAINED; it never invents a searchable status

