        - {name: public_search_documents_eligibility_ck, expression: "eligibility_state IN ('ELIGIBLE','TOMBSTONE')"}
        - {name: public_search_documents_publication_ck, expression: "publication_state IS NULL OR publication_state IN ('NEVER_PUBLISHED','PUBLISHED_ANOMALY','PUBLISHED_EXPLAINED','OFFICIALLY_CONFIRMED','CORRECTED','RETRACTED','TEMPORARILY_RESTRICTED')"}
        - {name: public_search_documents_publication_shape_ck, expression: "((object_type='CASE' AND publication_state IS NOT NULL) OR (object_type='CORRECTION' AND publication_state IS NOT NULL AND publication_state IN ('CORRECTED','RETRACTED')) OR (object_type NOT IN ('CASE','CORRECTION') AND publication_state IS NULL))"}
        - {name: public_search_documents_date_basis_ck, expression: "(object_type='CASE' AND search_date_basis='CASE_PUBLICATION') OR (object_type='CORRECTION' AND search_date_basis='CORRECTION_PUBLICATION') OR (object_type='CONTRACT' AND search_date_basis IN ('CONTRACT_SIGNED','OBJECT_UPDATED')) OR (object_type IN ('AGENCY','SUPPLIER','METHODOLOGY') AND search_date_basis='OBJECT_UPDATED')"}
        - {name: public_search_documents_alias_ck, expression: "cardinality(verified_aliases)=cardinality(normalized_verified_aliases) AND cardinality(verified_aliases)=cardinality(verified_alias_source_document_ids) AND ops.text_array_is_sorted_unique(normalized_verified_aliases) AND (object_type IN ('AGENCY','SUPPLIER') OR cardinality(verified_aliases)=0)"}
        - {name: public_search_documents_title_ck, expression: "eligibility_state='TOMBSTONE' OR (coalesce(length(btrim(canonical_title)),0)>0 OR coalesce(length(btrim(canonical_name)),0)>0)"}
        - {name: public_search_documents_href_ck, expression: "eligibility_state='TOMBSTONE' OR href LIKE '/%'"}
        - {name: public_search_documents_freshness_ck, expression: "freshness_status IN ('CURRENT','DELAYED','STALE','UNKNOWN') AND (expected_frequency_seconds IS NULL OR expected_frequency_seconds >= 0) AND (lag_seconds IS NULL OR lag_seconds >= 0)"}
        - {name: public_search_documents_policy_ck, expression: "ranking_policy_version='search-rank-v1'"}
    indexes:
      - {name: public_search_documents_vector_idx, method: gin, columns: [search_vector]}
      - {name: public_search_documents_title_trgm_idx, method: gin, expression: normalized_title, opclass: extensions.gin_trgm_ops}
      - {name: public_search_documents_identifier_idx, method: btree, columns: [projection_generation_id, normalized_identifier_key, object_type_order, object_id, object_revision]}
      - {name: public_search_documents_relevance_idx, method: btree, columns: [projection_generation_id, object_type_order, normalized_title, object_id, object_revision]}
      - {name: public_search_documents_updated_idx, method: btree, columns: [projection_generation_id, source_updated_at DESC, normalized_title, object_type_order, object_id, object_revision]}
      - {name: public_search_documents_filter_idx, method: btree, columns: [projection_generation_id, object_type, publication_state, search_date, document_watermark]}
    projector_contract:
      insert_only_versions: each immutable FULL or DELTA generation receives at most one revision/tombstone per object; no row is inserted after READY and no fixture writer is a production path
      generation_finalization: READY finalizer verifies all rows have document_watermark <= projection_watermark, exact count, and canonical object-ordered member_digest
      current_generation: highest READY producer_generation from public.search_generations
      page_watermark: exact pinned generation header projection_watermark; generation-chain resolution chooses newest object row and discards tombstones before retrieval
      purge: owner function only after generation is not current, no retained descendant/cursor depends on it, and underlying authority remains; direct UPDATE and DELETE are forbidden
    grants:
      gurine_public_api: [SELECT]
    rls: {enabled: false, rationale: only public-safe projection enters this schema; current overlay still rechecks visibility each page}
    retention:
      record_class: PUBLIC_SEARCH_PROJECTION
      trigger: generation superseded plus 30-minute public cursor TTL and operational safety margin
      schedule_binding: derived projection schedule; underlying source/evidence schedule is authoritative
      legal_hold_key: none for sole authority because projection is rebuildable; hold applies to underlying object and disclosure gate
      backup_behavior: exclude from authoritative backup requirement; rebuild and digest-verify after restore
      terminal_action: DELETE superseded generation only; current generation and underlying authority remain
    repository_roundtrip:
      row_type: PublicSearchDocumentRow
      methods: [insert_version, search_at_generation_watermark, current_overlay, purge_generation]
      assertions: [six object types, tombstone, all freshness variants, exact filter sets, seven ranking tiers, six-decimal score quantization, stable keyset cursor, visibility overlay, one-million-row plan, forbidden update]

