      envelope_payload_sha256: {type: 'char(64)', nullable: true}
      envelope_canonical: {type: bytea, nullable: true}
      response_redacted: {type: 'jsonb:AgentProviderResponseRedactedV1', nullable: true}
      response_redacted_canonical: {type: bytea, nullable: true}
      call_id: {type: text, nullable: true}
      tool_id: {type: text, nullable: true}
      provider_receipt_id: {type: uuid, nullable: true}
      provider_receipt: {type: 'jsonb:ProviderReceiptV2', nullable: true}
      provider_receipt_canonical: {type: bytea, nullable: true}
      provider_receipt_sha256: {type: 'char(64)', nullable: true}
      provider_turn_canonical: {type: bytea, nullable: true}
      provider_turn_sha256: {type: 'char(64)', nullable: true}
      turn_transcript_sha256: {type: 'char(64)', nullable: true}
      input_units: {type: bigint, nullable: true}
      output_units: {type: bigint, nullable: true}
      latency_ms: {type: bigint, nullable: true}
      cost_event_id: {type: uuid, nullable: true}
      provider_request_id_hash: {type: 'char(64)', nullable: true}
      error_code: {type: text, nullable: true}
      error_sha256: {type: 'char(64)', nullable: true}
      version: {type: bigint, nullable: false, default: 1}
      dispatched_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      completed_at: {type: timestamptz, nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_provider_turns_pk, columns: [provider_turn_id]}
      foreign_keys:
        - {name: agent_provider_turns_run_fk, columns: [agent_run_id, input_snapshot_sha256], references: "ops.agent_runs(id, input_snapshot_hash)", on_delete: RESTRICT}
        - {name: agent_provider_turns_provider_fk, columns: [provider_config_id], references: ops.provider_configs(id), on_delete: RESTRICT}
        - {name: agent_provider_turns_cost_fk, columns: [cost_event_id], references: ops.cost_events(id), on_delete: RESTRICT}
      unique:
        - {name: agent_provider_turns_attempt_uk, columns: [agent_run_id, turn_sequence, attempt_sequence]}
        - {name: agent_provider_turns_run_binding_uk, columns: [agent_run_id, provider_turn_id]}
        - {name: agent_provider_turns_dispatch_uk, columns: [agent_run_id, dispatch_key_sha256]}
        - {name: agent_provider_turns_receipt_uk, columns: [provider_receipt_id]}
        - {name: agent_provider_turns_receipt_binding_uk, columns: [agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256]}
        - {name: agent_provider_turns_digest_uk, columns: [agent_run_id, provider_turn_id, provider_turn_sha256]}
        - {name: agent_provider_turns_tool_binding_uk, columns: [agent_run_id, provider_turn_id, status, envelope_kind, call_id, tool_id, envelope_payload_sha256, prior_transcript_sha256]}
        - {name: agent_provider_turns_output_binding_uk, columns: [agent_run_id, provider_turn_id, status, envelope_kind, envelope_payload_sha256]}
      partial_unique:
        - {name: agent_provider_turns_one_success_per_turn_uk, columns: [agent_run_id, turn_sequence], predicate: "status='COMPLETED'"}
      checks:
        - {name: agent_provider_turns_sequence_version_ck, expression: turn_sequence > 0 AND attempt_sequence > 0 AND version > 0}
        - {name: agent_provider_turns_mode_ck, expression: "provider_mode IN ('EXTERNAL_APPROVED','LOCAL_APPROVED','DETERMINISTIC_DOUBLE')"}
        - {name: agent_provider_turns_classification_ck, expression: "classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD')"}
        - {name: agent_provider_turns_status_ck, expression: "status IN ('DISPATCHED','COMPLETED','PROVIDER_FAILED','RATE_LIMITED','TIMED_OUT','CANCELLED','OUTCOME_UNKNOWN')"}
        - {name: agent_provider_turns_envelope_ck, expression: "envelope_kind IS NULL OR envelope_kind IN ('FINAL_OUTPUT','TOOL_CALL')"}
        - {name: agent_provider_turns_provider_shape_ck, expression: "(provider_mode='EXTERNAL_APPROVED' AND provider_config_id IS NOT NULL AND classification IN ('PUBLIC','INTERNAL')) OR (provider_mode='LOCAL_APPROVED') OR (provider_mode='DETERMINISTIC_DOUBLE' AND provider_config_id IS NULL)"}
        - {name: agent_provider_turns_request_canonical_ck, expression: "convert_from(request_canonical,'UTF8')::jsonb=request_redacted AND encode(extensions.digest(request_canonical,'sha256'),'hex')=request_sha256"}
        - {name: agent_provider_turns_terminal_shape_ck, expression: "(status='DISPATCHED' AND completed_at IS NULL AND envelope_kind IS NULL AND envelope_canonical IS NULL AND response_redacted IS NULL AND response_redacted_canonical IS NULL AND provider_receipt_id IS NULL AND provider_receipt IS NULL AND provider_receipt_canonical IS NULL AND provider_receipt_sha256 IS NULL AND provider_turn_canonical IS NULL AND provider_turn_sha256 IS NULL AND turn_transcript_sha256 IS NULL AND error_code IS NULL AND error_sha256 IS NULL) OR (status='COMPLETED' AND completed_at IS NOT NULL AND envelope_kind IS NOT NULL AND envelope_sha256 IS NOT NULL AND envelope_payload_sha256 IS NOT NULL AND envelope_canonical IS NOT NULL AND response_redacted IS NOT NULL AND response_redacted_canonical IS NOT NULL AND provider_receipt_id IS NOT NULL AND provider_receipt IS NOT NULL AND provider_receipt_canonical IS NOT NULL AND provider_receipt_sha256 IS NOT NULL AND provider_turn_canonical IS NOT NULL AND provider_turn_sha256 IS NOT NULL AND turn_transcript_sha256 IS NOT NULL AND latency_ms IS NOT NULL AND latency_ms >= 0 AND error_code IS NULL AND error_sha256 IS NULL) OR (status IN ('PROVIDER_FAILED','RATE_LIMITED','TIMED_OUT','CANCELLED','OUTCOME_UNKNOWN') AND completed_at IS NOT NULL AND envelope_kind IS NULL AND envelope_sha256 IS NULL AND envelope_payload_sha256 IS NULL AND envelope_canonical IS NULL AND response_redacted IS NULL AND response_redacted_canonical IS NULL AND provider_receipt_id IS NOT NULL AND provider_receipt IS NOT NULL AND provider_receipt_canonical IS NOT NULL AND provider_receipt_sha256 IS NOT NULL AND provider_turn_canonical IS NOT NULL AND provider_turn_sha256 IS NOT NULL AND turn_transcript_sha256 IS NULL AND error_code IS NOT NULL AND error_sha256 IS NOT NULL AND latency_ms IS NOT NULL AND latency_ms >= 0)"}
        - {name: agent_provider_turns_terminal_canonical_ck, expression: "provider_receipt_canonical IS NULL OR (convert_from(provider_receipt_canonical,'UTF8')::jsonb=provider_receipt AND encode(extensions.digest(provider_receipt_canonical,'sha256'),'hex')=provider_receipt_sha256 AND encode(extensions.digest(provider_turn_canonical,'sha256'),'hex')=provider_turn_sha256)"}
        - {name: agent_provider_turns_response_canonical_ck, expression: "response_redacted_canonical IS NULL OR convert_from(response_redacted_canonical,'UTF8')::jsonb=response_redacted"}
        - {name: agent_provider_turns_tool_shape_ck, expression: "(envelope_kind='TOOL_CALL' AND call_id IS NOT NULL AND tool_id IS NOT NULL) OR (envelope_kind='FINAL_OUTPUT' AND call_id IS NULL AND tool_id IS NULL) OR envelope_kind IS NULL"}
        - {name: agent_provider_turns_error_code_ck, expression: "error_code IS NULL OR error_code IN ('PROVIDER_REJECTED','PROVIDER_RATE_LIMITED','PROVIDER_TIMEOUT','PROVIDER_CANCELLED','PROVIDER_OUTCOME_UNKNOWN','PROVIDER_RECEIPT_INVALID','PROVIDER_RESPONSE_INVALID')"}
        - {name: agent_provider_turns_usage_ck, expression: "(input_units IS NULL OR input_units >= 0) AND (output_units IS NULL OR output_units >= 0) AND (latency_ms IS NULL OR latency_ms >= 0)"}
        - {name: agent_provider_turns_time_ck, expression: completed_at IS NULL OR completed_at >= dispatched_at}
    indexes:
      - {name: agent_provider_turns_run_idx, method: btree, columns: [agent_run_id, turn_sequence, attempt_sequence]}
      - {name: agent_provider_turns_terminal_idx, method: btree, columns: [agent_run_id, status, completed_at DESC]}
    lifecycle:
      start: DISPATCHED
      terminal: [COMPLETED, PROVIDER_FAILED, RATE_LIMITED, TIMED_OUT, CANCELLED, OUTCOME_UNKNOWN]
      allowed_edges: [DISPATCHED->COMPLETED, DISPATCHED->PROVIDER_FAILED, DISPATCHED->RATE_LIMITED, DISPATCHED->TIMED_OUT, DISPATCHED->CANCELLED, DISPATCHED->OUTCOME_UNKNOWN]
      transcript_guard: deferred trigger recomputes closed_type_contracts.transcript_digest_contract; turn 1 prior digest equals agent_runs.initial_transcript_sha256; fallback attempts share prior/request/idempotency; turn n+1 follows the sole prior successful TOOL_CALL result transcript; FINAL_OUTPUT forbids another turn
      receipt_guard: ProviderReceiptV2 receiptId/run/turn/mode/config/candidate/model/request/outcome/proof/usage/pricing/data-policy/times match columns and terminal status; accepted final/tool outcomes require COMPLETED matching envelope, every nonaccepted outcome maps to exactly one failure status, and contradictory proof enters OUTCOME_UNKNOWN
      update_rule: ops.complete_agent_provider_turn only; expected version increments exactly one; terminal immutable
      budget_link: budget reservation created in 0026 references this turn and exact budget_reservation_key_sha256, preserving backward-only FK direction
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: service-owned run evidence; control repository filters case scope}
    retention:
      record_class: AGENT_PROVIDER_TURN_SAFE_PAYLOAD
      trigger: agent run and case terminal retention decision
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: agent_run_id resolved to case_id and input snapshot assets
      backup_behavior: only safe redacted envelopes are stored; hidden chain of thought, secrets, and raw provider bytes are forbidden
      terminal_action: crypto-erase optional external capsule, preserve digest/usage/audit chain while referenced
    repository_roundtrip:
      row_type: AgentProviderTurnRow
      methods: [insert_dispatched, complete_once, list_run_transcript, get_exact]
      assertions: [both envelope variants, all terminal failures, exact ProviderReceiptV2 roundtrip, receipt/status contradiction, transcript digest vectors, transcript chain and fallback equality, external classification denial, single completed winner, stale version denial, terminal immutability, redacted JSON closed decode]

  - relation: ops.agent_tool_calls
    owner_role: gurine_migrator
    service_owner: analysis-worker
    domain_owner: crates/agent-orchestration::tool
    rust_type: gurine_agent_orchestration::tool::AgentToolCall
    repository: crates/persistence-postgres::agent_tool_calls
    mutation_class: LIFECYCLE_GUARDED
    columns:
      tool_call_id: {type: uuid, nullable: false, default: gen_random_uuid()}
      agent_run_id: {type: uuid, nullable: false}
      provider_turn_id: {type: uuid, nullable: false}
      call_id: {type: text, nullable: false}
      input_snapshot_sha256: {type: 'char(64)', nullable: false}
      prior_transcript_sha256: {type: 'char(64)', nullable: false}
      tool_id: {type: text, nullable: false}
      tool_catalog_version: {type: text, nullable: false}
      tool_catalog_sha256: {type: 'char(64)', nullable: false}
      request_schema_id: {type: text, nullable: false}
      request_schema_version: {type: text, nullable: false}
      request_schema_sha256: {type: 'char(64)', nullable: false}
      response_schema_id: {type: text, nullable: false}
      response_schema_version: {type: text, nullable: false}
      response_schema_sha256: {type: 'char(64)', nullable: false}
      timeout_ms: {type: integer, nullable: false}
      max_results: {type: integer, nullable: false}
      request_sha256: {type: 'char(64)', nullable: false}
      request_redacted: {type: 'jsonb:AgentToolRequestV2', nullable: false}
      request_canonical: {type: bytea, nullable: false}
      allowlist_decision_sha256: {type: 'char(64)', nullable: false}
      scope_decision_sha256: {type: 'char(64)', nullable: false}
      rights_decision_sha256: {type: 'char(64)', nullable: false}
      classification: {type: text, nullable: false}
      budget_reservation_key_sha256: {type: 'char(64)', nullable: true}
      status: {type: text, nullable: false, default: CLAIMED}
      result_kind: {type: text, nullable: true}
      result_sha256: {type: 'char(64)', nullable: true}
      result_redacted: {type: 'jsonb:AgentToolResultV2', nullable: true}
      result_canonical: {type: bytea, nullable: true}
      response_validation_sha256: {type: 'char(64)', nullable: true}
      result_transcript_sha256: {type: 'char(64)', nullable: true}
      source_use_count: {type: integer, nullable: false, default: 0}
      source_use_set_sha256: {type: 'char(64)', nullable: false, default: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945}
      latency_ms: {type: bigint, nullable: true}
      cost_event_id: {type: uuid, nullable: true}
      terminal_code: {type: text, nullable: true}
      terminal_sha256: {type: 'char(64)', nullable: true}
      claim_generation: {type: bigint, nullable: false, default: 1}
      lease_token_sha256: {type: 'char(64)', nullable: false}
      lease_expires_at: {type: timestamptz, nullable: false}
      version: {type: bigint, nullable: false, default: 1}
      started_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      terminal_at: {type: timestamptz, nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: agent_tool_calls_pk, columns: [tool_call_id]}
      foreign_keys:
        - {name: agent_tool_calls_run_fk, columns: [agent_run_id, input_snapshot_sha256], references: "ops.agent_runs(id, input_snapshot_hash)", on_delete: RESTRICT}
        - {name: agent_tool_calls_turn_fk, columns: [agent_run_id, provider_turn_id], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id)", on_delete: RESTRICT}
        - {name: agent_tool_calls_cost_fk, columns: [cost_event_id], references: ops.cost_events(id), on_delete: RESTRICT}
      unique:
        - {name: agent_tool_calls_idempotency_uk, columns: [agent_run_id, call_id]}
        - {name: agent_tool_calls_run_binding_uk, columns: [agent_run_id, tool_call_id]}
        - {name: agent_tool_calls_artifact_binding_uk, columns: [agent_run_id, call_id, request_sha256, result_sha256]}
        - {name: agent_tool_calls_source_use_binding_uk, columns: [agent_run_id, tool_call_id, source_use_count, source_use_set_sha256]}
      checks:
        - {name: agent_tool_calls_id_ck, expression: "call_id ~ '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'"}
        - {name: agent_tool_calls_tool_ck, expression: "tool_id IN ('agency.profile','claim.language_check','contract.find_comparables','contract.search','entity.lookup','evidence.read','evidence.search','relationship.neighbors','response.read','rule.reproduce','source.fetch','source.locator_verify','supplier.profile')"}
        - {name: agent_tool_calls_bounds_ck, expression: timeout_ms BETWEEN 1 AND 120000 AND max_results BETWEEN 1 AND 50 AND claim_generation > 0 AND version > 0 AND source_use_count >= 0}
        - {name: agent_tool_calls_classification_ck, expression: "classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD')"}
        - {name: agent_tool_calls_status_ck, expression: "status IN ('CLAIMED','SUCCEEDED','DENIED','TIMED_OUT','FAILED','OUTCOME_UNKNOWN')"}
        - {name: agent_tool_calls_result_kind_ck, expression: "result_kind IS NULL OR result_kind IN ('TOOL_RESULT','DISPATCH_DENIAL','TOOL_ERROR')"}
        - {name: agent_tool_calls_schema_binding_ck, expression: "ops.agent_tool_schema_contract_is_valid(tool_id,request_schema_sha256,response_schema_sha256) AND ops.agent_tool_payload_is_valid(tool_id,request_redacted,result_redacted)"}
        - {name: agent_tool_calls_request_canonical_ck, expression: "convert_from(request_canonical,'UTF8')::jsonb=request_redacted AND encode(extensions.digest(request_canonical,'sha256'),'hex')=request_sha256"}
        - {name: agent_tool_calls_result_canonical_ck, expression: "result_canonical IS NULL OR (result_redacted IS NOT NULL AND convert_from(result_canonical,'UTF8')::jsonb=result_redacted AND encode(extensions.digest(result_canonical,'sha256'),'hex')=result_sha256)"}
        - {name: agent_tool_calls_terminal_shape_ck, expression: "(status='CLAIMED' AND terminal_at IS NULL AND result_kind IS NULL AND result_sha256 IS NULL AND result_redacted IS NULL AND result_canonical IS NULL AND response_validation_sha256 IS NULL AND result_transcript_sha256 IS NULL AND terminal_code IS NULL AND terminal_sha256 IS NULL AND source_use_count=0 AND source_use_set_sha256='4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945') OR (status='SUCCEEDED' AND terminal_at IS NOT NULL AND result_kind='TOOL_RESULT' AND result_sha256 IS NOT NULL AND result_redacted IS NOT NULL AND result_canonical IS NOT NULL AND response_validation_sha256 IS NOT NULL AND result_transcript_sha256 IS NOT NULL AND latency_ms IS NOT NULL AND latency_ms >= 0 AND terminal_code IS NULL AND terminal_sha256 IS NULL) OR (status IN ('DENIED','TIMED_OUT','FAILED','OUTCOME_UNKNOWN') AND terminal_at IS NOT NULL AND result_kind IN ('DISPATCH_DENIAL','TOOL_ERROR') AND result_sha256 IS NOT NULL AND result_redacted IS NULL AND result_canonical IS NULL AND response_validation_sha256 IS NULL AND result_transcript_sha256 IS NOT NULL AND latency_ms IS NOT NULL AND latency_ms >= 0 AND terminal_code IS NOT NULL AND terminal_sha256 IS NOT NULL)"}
        - {name: agent_tool_calls_budget_shape_ck, expression: "status<>'DENIED' OR budget_reservation_key_sha256 IS NULL"}
        - {name: agent_tool_calls_time_ck, expression: lease_expires_at > started_at AND (terminal_at IS NULL OR terminal_at >= started_at)}
    indexes:
      - {name: agent_tool_calls_run_idx, method: btree, columns: [agent_run_id, started_at, tool_call_id]}
      - {name: agent_tool_calls_lease_idx, method: btree, columns: [status, lease_expires_at], predicate: "status='CLAIMED'"}
    lifecycle:
      start: CLAIMED
      terminal: [SUCCEEDED, DENIED, TIMED_OUT, FAILED, OUTCOME_UNKNOWN]
      allowed_edges: [CLAIMED->SUCCEEDED, CLAIMED->DENIED, CLAIMED->TIMED_OUT, CLAIMED->FAILED, CLAIMED->OUTCOME_UNKNOWN]
      provider_turn_guard: deferred constraint trigger locks the parent and requires COMPLETED TOOL_CALL with exact call_id, tool_id, request_sha256=envelope_payload_sha256, and prior_transcript_sha256
      source_use_guard: terminal trigger locks ordered ops.agent_source_uses rows for this tool call, requires exact count and SHA-256 of the canonical ordered [sourceUseId,sourceUseSha256] array, and uses that ordered digest list in result_transcript_sha256
      idempotency: same run/call/request returns stored row or in-progress state; changed request returns AGENT_TOOL_CALL_CONFLICT
      reclaim: expired claim increments claim_generation and version through owner function; stale generation cannot complete
      terminal_mutability: immutable
      budget_link: a later 0026 budget reservation references tool_call_id and exact budget_reservation_key_sha256; no forward FK is created here
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: service-owned run evidence; tool scope is snapshot-bound}
    retention:
      record_class: AGENT_TOOL_CALL_SAFE_PAYLOAD
      trigger: agent run/case terminal retention decision
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: agent_run_id plus all cited source assets
      backup_behavior: retain safe redacted typed result; raw external artifact bytes live in raw.research_artifacts object capsule
      terminal_action: crypto-erase external capsule only; preserve call/result/transcript digests while referenced
    repository_roundtrip:
      row_type: AgentToolCallRow
      methods: [claim_or_replay, complete_success, complete_failure, get_exact, list_for_run]
      assertions: [all thirteen request/response schema pairs, every cross-tool request and result rejected, changed digest conflict, lease generation race, all terminal result variants, source-use count/set/transcript parity, snapshot and provider-turn mismatch, safe JSON decode, stale completion denial, terminal immutability]

