      cancellation_reason_digest: {type: 'char(64)', nullable: true}
      specification_detail_set_digest: {type: 'char(64)', nullable: false}
    constraints:
      primary_key: {name: procurement_notice_revisions_pk, columns: [revision_id]}
      foreign_keys:
        - {name: procurement_notice_source_fk, columns: [source_document_id, source_asset_id, source_asset_revision, source_content_sha256], references: 'raw.source_documents(id,asset_id,asset_revision,content_sha256)', on_delete: RESTRICT}
        - {name: procurement_notice_parsed_fk, columns: [parsed_record_id, source_document_id, source_record_digest], references: 'raw.parsed_records(id,source_document_id,payload_sha256)', on_delete: RESTRICT}
        - {name: procurement_notice_normalization_fk, columns: [normalization_run_id, source_document_id, revision_id, revision, record_digest], references: 'core.normalization_runs(id,source_document_id,output_object_id,output_object_version,output_payload_sha256)', on_delete: RESTRICT}
        - {name: procurement_notice_predecessor_fk, columns: [root_id, predecessor_revision_id, predecessor_revision, predecessor_record_digest], references: 'core.procurement_notice_revisions(root_id,revision_id,revision,record_digest)', on_delete: RESTRICT, match: FULL, deferrable: INITIALLY_DEFERRED}
        - {name: procurement_notice_agency_fk, columns: [agency_id], references: 'core.agencies(id)', on_delete: RESTRICT}
      unique:
        - {name: procurement_notice_root_revision_uq, columns: [root_id, revision]}
        - {name: procurement_notice_exact_revision_uq, columns: [root_id, revision_id, revision, record_digest]}
        - {name: procurement_notice_record_digest_uq, columns: [record_digest]}
        - {name: procurement_notice_source_revision_uq, columns: [connector_id, source_external_id, source_external_revision, mapping_version]}
        - {name: procurement_notice_external_revision_uq, columns: [connector_id, external_notice_id, revision]}
      checks:
        - {name: procurement_notice_common_ck, expression: "revision > 0 AND source_asset_revision > 0 AND record_index >= 0 AND revision_state IN ('ACTIVE','CANCELLED','DELETED','SUPERSEDED','CORRECTED') AND coverage_status IN ('COMPLETE','PARTIAL','UNKNOWN','NOT_AVAILABLE')"}
        - {name: procurement_notice_chain_ck, expression: "(revision=1 AND root_id=revision_id AND num_nonnulls(predecessor_revision_id,predecessor_revision,predecessor_record_digest,supersedes_revision_id)=0) OR (revision>1 AND root_id<>revision_id AND predecessor_revision=revision-1 AND predecessor_revision_id=supersedes_revision_id AND num_nonnulls(predecessor_revision_id,predecessor_revision,predecessor_record_digest,supersedes_revision_id)=4)"}
        - {name: procurement_notice_time_ck, expression: "(effective_time_status='UNKNOWN' AND num_nonnulls(effective_time_value,effective_time_precision,effective_time_source_field,effective_time_timezone)=0) OR (effective_time_status='KNOWN' AND effective_time_precision IN ('DATE','MINUTE','SECOND') AND num_nonnulls(effective_time_value,effective_time_precision,effective_time_source_field,effective_time_timezone)=4)"}
        - {name: procurement_notice_payload_ck, expression: "ops.procurement_notice_revision_v1_is_valid(typed_payload) AND convert_from(payload_canonical,'UTF8')::jsonb=typed_payload AND record_digest=encode(extensions.digest(digest_preimage_canonical,'sha256'),'hex')"}
        - {name: procurement_notice_amount_ck, expression: "(estimated_amount IS NULL)=(estimated_currency IS NULL) AND (estimated_amount IS NULL OR (estimated_amount>=0 AND estimated_currency ~ '^[A-Z]{3}$'))"}
    indexes:
      - {name: procurement_notice_source_idx, method: btree, columns: [source_document_id, record_index, revision_id]}
      - {name: procurement_notice_external_idx, method: btree, columns: [external_notice_id, revision DESC, revision_id]}
      - {name: procurement_notice_agency_idx, method: btree, columns: [agency_id, published_at DESC, revision_id]}
      - {name: procurement_notice_one_successor_uq, method: btree, columns: [supersedes_revision_id], unique: true, predicate: supersedes_revision_id IS NOT NULL}
    writer: {function: core.record_procurement_notice_revision_v1, execute: [gurine_ingest_worker], isolation: SERIALIZABLE, exact_atomic_writes: [revision, audit, outbox, idempotency receipt, normalization conflict quarantine]}
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants: *procurement_revision_grants
    rls: {enabled: false, rationale: service-owned immutable normalized procurement authority}
    retention: {record_class: PROCUREMENT_REVISION_AUTHORITY, trigger: source and downstream authority graph, terminal_action: PRESERVE_REFERENCED_REVISION}
    repository_roundtrip: {row_type: ProcurementNoticeRevisionRow, order: [root_id, revision ASC, revision_id ASC], assertions: [source versus normalized digest split, complete payload/scalar parity, predecessor race, agency snapshot parity, specification detail binding]}

