cross_table_repository_oracles:
  - test_id: AC-OA-TABLE-0025-COUNT-AND-OWNERSHIP
    assertion: exact relation set equals scope.exact_relations, count is derived as 36, migration_creation_order is contiguous and set-equal, and every owner is gurine_migrator
  - test_id: AC-OA-TABLE-0025-FK-CLOSURE
    assertion: every declared FK and supporting candidate key resolves and validates; no FK points to a table created after 0025
  - test_id: AC-OA-TABLE-0025-DIGEST-CHECKS
    assertion: every char(64) digest rejects uppercase, nonhex, short, and long input
  - test_id: AC-OA-TABLE-0025-PRIVILEGES
    assertion: PUBLIC and undeclared runtime roles have zero privilege; positive roles can perform only declared verbs; helper functions and sequences are exact
  - test_id: AC-OA-TABLE-0025-DEFAULT-PRIVILEGE-CANARY
    assertion: a new table/function/sequence created by gurine_migrator is inaccessible until explicitly granted
  - test_id: AC-OA-TABLE-0025-IMMUTABILITY
    assertion: immutable and terminal rows reject UPDATE/DELETE through both privilege and trigger paths
  - test_id: AC-OA-TABLE-0025-REPOSITORY-ROUNDTRIP
    assertion: all 36 exact AC-OA-TABLE-<SCHEMA>-<TABLE>-CONTRACT tests insert non-default boundary values and read byte-equivalent typed rows without synthesis
  - test_id: AC-OA-TABLE-0025-HOLD-RETENTION
    assertion: every relation resolves its declared record class, schedule, legal-hold key, backup behavior, and terminal action; missing schedule preserves data fail-closed
  - test_id: AC-OA-TABLE-0025-CONCURRENCY
    assertion: 64-client races yield one lifecycle/version winner for source revision, normalization, snapshot, provider turn, tool call, run control, proposal decision, rights revision, promotion and source traversal; immutable replay has no duplicate event/effect
  - test_id: AC-OA-TABLE-0025-AI-SCHEMA-SET
    assertion: runtime and tool schema paths/digests are exact; every one of thirteen request/response pairs round-trips only under its own tool ID; one-byte/cross-tool/additional-property changes fail before dispatch and persistence
  - test_id: AC-OA-TABLE-0025-AI-PROVENANCE
    assertion: provider receipt and transcript digests, all source-use kinds/source identities/rights, response snapshot lineage, citation ancestry, proposal validation and ResearchArtifact promotion graph are relationally complete; deleting or swapping any join causes zero proposals/promotions
  - test_id: AC-OA-TABLE-0025-EVENT-PAYLOADS
    assertion: READY/FAILED dataset variants, source versus selected evidence digests, source traversal completion and promotion payloads decode against the exact closed local schemas and are field-equal to stored rows
  - test_id: AC-OA-TABLE-0025-CONNECTOR-TERMINAL
    assertion: generated connector operation/predicate set equals all 44 pinned operations; page-number ceiling, zero/one page, no-pagination, zero/nonzero manifest and manifest-order cases advance checkpoint once only after exact stored completion
  - test_id: AC-OA-TABLE-0025-POSTGRES-COMPOSITE-FK
    assertion: PostgreSQL 18.4 pg_constraint proves every composite FK targets the exact nonpartial PK/UQ with identical type/order and declared deferrability; one-column swap, null-shape mismatch, cross-run/source/asset/member/promotion tuple and deferred graph mismatch all fail
  - test_id: AC-OA-TABLE-0025-SEARCH-CAPACITY
    assertion: one million public plus one million internal documents satisfy exact authorization-first plans, rank policy, cursor stability, and authority latency under PostgreSQL 18.4

blockers:
  - id: P25-BLOCK-001
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: SourceAsset identity/revision is absent from v13 raw.source_documents.
    closure: required_existing_relation_alters.raw.source_documents fixes staged identity, exact replay, semantic-lock revision allocation, immutable columns, ACL and 64-client oracles.
  - id: P25-BLOCK-002
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: ResearchArtifact to authoritative SourceDocument/Evidence promotion has no explicit human command/receipt operation.
    closure: raw.research_artifact_promotions, HUMAN_PROMOTION source-use graph and raw.promote_research_artifact_to_evidence fix request/receipt, locks, rights/scan/parser/case gates, cardinality, rollback, event and replay; product operation registration remains cross-file implementation.
  - id: P25-BLOCK-003
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: source.fetch v2 SEARCH_PUBLIC_WEB|FETCH_URL request/response and safe header/redirect schemas are not normative.
    closure: the pinned source.fetch request/response schemas and ResearchArtifactV2 schema/digests are exact inputs; raw.research_artifacts stores typed canonical safe headers, redirects, URLs, object-key hash, scan receipt and artifact digest.
  - id: P25-BLOCK-004
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Agent provider/tool/redacted/validation v2 JSON schemas and transcript digest canonicalization are not normative.
    closure: normative_json_schema_registry pins every runtime and thirteen-tool pair; provider/tool tables store canonical bytes; generated schema CASE functions and transcript_digest_contract fix all digest shapes and fallback/chain semantics.
  - id: P25-BLOCK-005
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: AgentRun v2 snapshot lifecycle and AgentProposal v2 expiry/materialization fields are not present in base wire/domain contracts.
    closure: complete ops.agent_runs and ops.agent_suggestions ALTERs, owner functions, immutable run-control receipts, seven-status/five-control-state split, typed targets, expiry, decision and materialization receipts are fixed; wire/domain implementation remains cross-file.
  - id: P25-BLOCK-006
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Agent citations can prove EvidenceSegment snapshot membership, but base response.read has no SourceDocument/member lineage for response content.
    closure: ops.agent_source_uses RESPONSE_SNAPSHOT binds READY member, exact member-source row, response id/version/content/consent and a fail-closed derived rights decision; citation/source-use joins are relational and opaque ID arrays remain forbidden.
  - id: P25-BLOCK-007
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: dataset.snapshot_created.v1 currently names only analysis snapshot-producer and requires snapshotSha256 even for FAILED.
    closure: DatasetSnapshot lifecycle and terminal_event_payloads fix all three producer components and READY versus FAILED nullability; additive event registry must import this exact schema.
  - id: P25-BLOCK-008
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Search projection has no current authoritative integer watermark or zero-document generation registry in the current files.
    closure: kind-scoped dataset snapshots, core.begin_search_projection, immutable event_sequence watermark, current READY generation query and public.search_generations view cover nonzero and zero-document generations.
  - id: P25-BLOCK-009
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Search aliases/capability arrays require deterministic sorted-unique canonicalization and generation finalization SQL not yet specified as executable functions.
    closure: sorted-unique helpers, canonical empty-array digest, snapshot finalizer, surface lock/watermark, authorization-first query and capacity/EXPLAIN oracles are exact.
  - id: P25-BLOCK-010
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: evidence.segment_created.v1 contentSha256 is ambiguous between source asset content and selected segment content.
    closure: terminal_event_payloads requires both sourceContentSha256 and selectedContentSha256, and all segment/member/source-use/citation FKs preserve their distinct meanings.
  - id: P25-BLOCK-011
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Asset rights decision/dimension enums are prose-only and legal hold object kinds do not directly cover SourceAsset or ResearchArtifact.
    closure: raw.asset_rights_decisions fixes decision/dimension enums and append chain; current 0028 has SOURCE_ASSET and RESEARCH_ARTIFACT anchors; the exact cross-migration resolver graph is declared here.
  - id: P25-BLOCK-012
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Record class schedules and retention execution receipts are created only in 0028.
    closure: cross_migration_0028_retention_and_hold_bindings fixes the 18 relation/class map, three-column FK, schedule selection, hold graph, destructive rule, migration order and runtime oracle; 0028 implementation update remains required.
  - id: P25-BLOCK-013
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: source.page_reconciled.v1 has no exact payload schema/delivery/replay contract and existing connector manifests do not declare one universal terminal predicate version field.
    closure: pinned 44-operation generated registry, four terminal algorithms, predicate digest, manifest parent composite FK, owner completion function and exact event schema/replay are fixed without changing legacy connector files in place.
  - id: P25-BLOCK-014
    severity: P0
    status: DESIGN_RESOLVED_OPEN_IMPLEMENTATION
    issue: Several composite FKs use generated constants or constraint-trigger-resolved values and require executable SQL proof before authority adoption.
    closure: every source/target column and exact candidate key is declared, cyclic edges have explicit deferred installation order, and AC-OA-TABLE-0025-POSTGRES-COMPOSITE-FK fixes the required pinned pg_constraint and negative canaries; executable migration proof remains open.
  - id: P25-BLOCK-015
    severity: P0
