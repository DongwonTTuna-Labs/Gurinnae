    constraints:
      primary_key: {name: research_artifact_promotions_pk, columns: [promotion_id]}
      foreign_keys:
        - {name: research_artifact_promotions_case_fk, columns: [case_id, case_version], references: "editorial.cases(id, version)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_run_fk, columns: [agent_run_id], references: ops.agent_runs(id), on_delete: RESTRICT}
        - {name: research_artifact_promotions_artifact_fk, columns: [research_artifact_id, research_asset_id, research_asset_revision, research_artifact_sha256, research_content_sha256, research_source_fetch_id], references: "raw.research_artifacts(id, asset_id, asset_revision, artifact_sha256, content_sha256, source_fetch_id)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_document_fk, columns: [source_document_id, source_asset_id, source_asset_revision, source_content_sha256], references: "raw.source_documents(id, asset_id, asset_revision, content_sha256)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_segment_fk, columns: [primary_evidence_segment_id, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, primary_selected_content_sha256, primary_locator_sha256], references: "raw.evidence_segments(id, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, selected_content_sha256, locator_digest)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_evidence_fk, columns: [evidence_id, evidence_version, primary_evidence_segment_id, evidence_digest], references: "editorial.evidence(id, version, evidence_segment_id, evidence_digest)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_rights_fk, columns: [rights_decision_id, research_asset_id, research_asset_revision, research_content_sha256, rights_decision_version, rights_decision_sha256], references: "raw.asset_rights_decisions(id, asset_id, asset_revision, asset_sha256, decision_version, decision_sha256)", on_delete: RESTRICT}
        - {name: research_artifact_promotions_source_use_fk, columns: [agent_run_id, root_source_use_id, root_source_use_sha256], references: "ops.agent_source_uses(agent_run_id, source_use_id, source_use_sha256)", on_delete: RESTRICT, deferrable: INITIALLY_DEFERRED}
        - {name: research_artifact_promotions_reviewer_fk, columns: [reviewer_user_id], references: ops.users(id), on_delete: RESTRICT}
        - {name: research_artifact_promotions_audit_fk, columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
        - {name: research_artifact_promotions_outbox_fk, columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
      unique:
        - {name: research_artifact_promotions_artifact_idempotency_uk, columns: [research_artifact_id, research_artifact_sha256, idempotency_key_sha256]}
        - {name: research_artifact_promotions_evidence_uk, columns: [evidence_id, evidence_version]}
        - {name: research_artifact_promotions_receipt_uk, columns: [receipt_sha256]}
        - {name: research_artifact_promotions_binding_uk, columns: [promotion_id, receipt_sha256]}
      checks:
        - {name: research_artifact_promotions_version_ck, expression: "promotion_contract_version=1 AND expected_case_version > 0 AND case_version=expected_case_version+1 AND research_asset_revision=1 AND source_asset_revision > 0 AND evidence_version > 0 AND rights_decision_version > 0 AND selected_segment_count BETWEEN 1 AND 100"}
        - {name: research_artifact_promotions_source_distinct_ck, expression: "research_asset_id<>source_asset_id AND research_content_sha256=source_content_sha256"}
        - {name: research_artifact_promotions_canonical_ck, expression: "convert_from(selected_segment_bindings_canonical,'UTF8')::jsonb=selected_segment_bindings AND convert_from(receipt_canonical,'UTF8')::jsonb=receipt_payload"}
    indexes:
      - {name: research_artifact_promotions_case_idx, method: btree, columns: [case_id, promoted_at DESC, promotion_id]}
      - {name: research_artifact_promotions_artifact_idx, method: btree, columns: [research_artifact_id, promoted_at DESC]}
    graph_guard: deferred trigger requires exactly one HUMAN_PROMOTION/RESEARCH_ARTIFACT source use whose parent is the same-run source.fetch artifact exposure; expands the closed selected_segment_bindings array, requires selected_segment_count and contiguous ordinals, locks each exact source-document EvidenceSegment tuple, requires ordinal 0 PRIMARY_EVIDENCE and primary-field parity, and recomputes selected_segment_set_sha256 over ordered [ordinal,evidenceSegmentId,locatorKind,locatorValue,locatorSha256,selectedContentSha256,selectionPurpose]
    operation_contract:
      operation_id: promoteResearchArtifactToEvidence
      input_schema: PromoteResearchArtifactRequestV1
      receipt_schema: PromoteResearchArtifactReceiptV1
      isolation: SERIALIZABLE
      lock_order: [ops.idempotency_keys,editorial.cases,raw.research_artifacts,raw.asset_rights_decisions,raw.source_documents,core.parser_runs,raw.evidence_segments,editorial.evidence,ops.agent_source_uses,raw.research_artifact_promotions,ops.audit_events,ops.outbox,immutable_command_receipt]
      preconditions: exact same-run source.fetch/tool/provider/artifact chain; STORED+CLEAN with verified scan; current dimensional GRANT; trusted pinned parser extraction; sorted nonoverlapping locators re-extract exact selected hashes; capability and ACTIVE_SESSION; expected case version
      statements: claim idempotency; create/reuse distinct SourceAsset revision from identical artifact bytes; bind/create successful parser extraction; insert selected segments; insert one PENDING evidence revision bound to primary; insert one HUMAN_PROMOTION source use for the immutable artifact and the closed relationally validated segment binding ledger; increment case version; insert promotion/audit/event/receipt
      cardinality: one source document revision, N evidence segments, one evidence, one promotion source use, one promotion, one audit and one event; any mismatch rolls back all
      replay: same idempotency and request digest returns stored receipt byte-equivalently; changed bytes are IDEMPOTENCY_CONFLICT; semantically identical prior promotion returns its identity, otherwise explicit evidence revision workflow is required
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_control_api: [SELECT]
      gurine_analysis_worker: [SELECT]
      gurine_auditor: [SELECT]
    function_only_writes:
      gurine_control_api: [raw.promote_research_artifact_to_evidence]
    rls: {enabled: false, rationale: internal immutable human-decision receipt; UI uses case-scoped typed view model}
    retention:
      record_class: RESEARCH_ARTIFACT_PROMOTION
      trigger: later of artifact, source, evidence, case, publication, action and audit schedules
      schedule_binding: exact effective 0028 schedule revision; missing/expired schedule preserves fail-closed
      legal_hold_key: research and source asset anchors plus evidence/case graph
      backup_behavior: restore complete graph and verify receipt/source-use/segment set before evidence becomes available
      terminal_action: PRESERVE promotion and digest graph; underlying payload follows the stricter artifact/evidence schedule
    repository_roundtrip:
      row_type: ResearchArtifactPromotionRow
      methods: [promote_atomic, get_receipt, list_case, replay]
      assertions: [one and many segments, exact source byte identity with distinct asset identity, rights/scan/parser/case mismatch, locator overlap/hash mismatch, source-use graph parity, byte-identical replay, changed replay conflict, zero partial writes, immutable denial]

