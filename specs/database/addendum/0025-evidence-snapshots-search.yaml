        - {name: public_search_documents_type_ck, expression: "object_type IN ('CASE','CONTRACT','AGENCY','SUPPLIER','METHODOLOGY','CORRECTION')"}
        - {name: public_search_documents_type_order_ck, expression: "(object_type='CASE' AND object_type_order=1) OR (object_type='CONTRACT' AND object_type_order=2) OR (object_type='AGENCY' AND object_type_order=3) OR (object_type='SUPPLIER' AND object_type_order=4) OR (object_type='METHODOLOGY' AND object_type_order=5) OR (object_type='CORRECTION' AND object_type_order=6)"}
