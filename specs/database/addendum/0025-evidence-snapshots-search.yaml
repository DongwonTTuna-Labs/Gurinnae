        - {name: source_page_receipts_fetch_fk, columns: [source_fetch_id, source_run_id, source_id, response_sha256], references: "raw.source_fetches(id, source_run_id, source_id, payload_sha256)", on_delete: RESTRICT}
        - {name: source_page_receipts_checkpoint_fk, columns: [source_id, partition_key, checkpoint_expected_version, checkpoint_before_sha256], references: "ops.source_checkpoints(source_id, partition_key, version, checkpoint_sha256)", on_delete: RESTRICT}
        - {name: source_page_receipts_parent_fk, columns: [parent_page_receipt_id, source_run_id, connector_id, manifest_sha256, expected_receipt_count], references: "raw.source_page_receipts(id, source_run_id, connector_id, manifest_sha256, item_count)", on_delete: RESTRICT}
      unique:
        - {name: source_page_receipts_ordinal_uk, columns: [source_run_id, connector_id, operation_id, partition_key, ordinal]}
        - {name: source_page_receipts_position_uk, columns: [source_run_id, connector_id, operation_id, partition_key, position_sha256]}
        - {name: source_page_receipts_fetch_uk, columns: [source_fetch_id]}
        - {name: source_page_receipts_digest_uk, columns: [receipt_digest]}
        - {name: source_page_receipts_run_source_binding_uk, columns: [id, source_run_id, source_id]}
        - {name: source_page_receipts_parent_binding_uk, columns: [id, source_run_id, connector_id, manifest_sha256, item_count], nulls_not_distinct: true}
      checks:
        - {name: source_page_receipts_positive_ck, expression: ordinal >= 0 AND expected_source_run_version > 0 AND expected_receipt_count > 0 AND item_count >= 0 AND parsed_item_count >= 0 AND reconciled_item_count >= 0 AND duplicate_item_count >= 0 AND checkpoint_expected_version > 0 AND receipt_version=1}
        - {name: source_page_receipts_count_ck, expression: "parsed_item_count <= item_count AND reconciled_item_count <= parsed_item_count AND duplicate_item_count <= item_count AND (reported_total IS NULL OR reported_total >= 0)"}
        - {name: source_page_receipts_connector_operation_ck, expression: "ops.connector_operation_contract_is_valid(connector_id,operation_id,pagination_strategy,terminal_predicate_version,terminal_predicate_sha256,connector_contract_version,connector_contract_sha256)"}
        - {name: source_page_receipts_pagination_ck, expression: "pagination_strategy IN ('PAGE_NUMBER','NONE','MANIFEST_DOCUMENTS_ARRAY','MANIFEST_ORDER')"}
        - {name: source_page_receipts_position_kind_ck, expression: "position_kind IN ('SINGLE','PAGE_NUMBER','MANIFEST_INDEX','DOCUMENT_KEY') AND (next_position_kind IS NULL OR next_position_kind IN ('PAGE_NUMBER','MANIFEST_INDEX','DOCUMENT_KEY'))"}
        - {name: source_page_receipts_item_set_ck, expression: "cardinality(item_identity_digests)=item_count AND (item_count=0 OR ops.digest_array_is_sorted_unique(item_identity_digests))"}
        - {name: source_page_receipts_next_shape_ck, expression: "(next_position_kind IS NULL AND next_position_value IS NULL AND next_position_sha256 IS NULL) OR (next_position_kind IS NOT NULL AND next_position_value IS NOT NULL AND length(btrim(next_position_value)) > 0 AND next_position_sha256 IS NOT NULL)"}
        - {name: source_page_receipts_terminal_shape_ck, expression: "terminal_page=(ordinal=expected_receipt_count-1) AND ((terminal_page AND next_position_kind IS NULL) OR (NOT terminal_page AND next_position_kind IS NOT NULL))"}
        - {name: source_page_receipts_page_number_ck, expression: "pagination_strategy<>'PAGE_NUMBER' OR (upstream_page_number IS NOT NULL AND upstream_page_number=ordinal+1 AND upstream_page_size IS NOT NULL AND upstream_page_size>0 AND reported_total IS NOT NULL AND reported_total_pages IS NOT NULL AND reported_total_pages=GREATEST(1,CEIL(reported_total::numeric/upstream_page_size::numeric))::bigint AND expected_receipt_count=reported_total_pages AND parent_page_receipt_id IS NULL AND manifest_sha256 IS NULL)"}
        - {name: source_page_receipts_none_ck, expression: "pagination_strategy<>'NONE' OR (ordinal=0 AND expected_receipt_count=1 AND terminal_page AND upstream_page_number IS NULL AND upstream_page_size IS NULL AND reported_total_pages IS NULL AND parent_page_receipt_id IS NULL AND manifest_sha256 IS NULL)"}
        - {name: source_page_receipts_manifest_root_ck, expression: "pagination_strategy<>'MANIFEST_DOCUMENTS_ARRAY' OR (ordinal=0 AND expected_receipt_count=1 AND terminal_page AND manifest_sha256 IS NOT NULL AND parent_page_receipt_id IS NULL)"}
        - {name: source_page_receipts_manifest_child_ck, expression: "pagination_strategy<>'MANIFEST_ORDER' OR (parent_page_receipt_id IS NOT NULL AND manifest_sha256 IS NOT NULL AND expected_receipt_count > 0 AND upstream_page_number IS NULL AND upstream_page_size IS NULL AND reported_total_pages IS NULL)"}
        - {name: source_page_receipts_nonempty_ck, expression: "length(btrim(connector_id)) > 0 AND length(btrim(connector_contract_version)) > 0 AND length(btrim(operation_id)) > 0 AND length(btrim(partition_key)) > 0 AND length(btrim(position_value)) > 0 AND length(btrim(terminal_predicate_version)) > 0"}
    indexes:
      - {name: source_page_receipts_traversal_idx, method: btree, columns: [source_run_id, connector_id, operation_id, partition_key, ordinal]}
      - {name: source_page_receipts_checkpoint_idx, method: btree, columns: [source_id, partition_key, checkpoint_expected_version, ordinal DESC]}
      - {name: source_page_receipts_terminal_idx, method: btree, columns: [source_run_id, terminal_page], predicate: terminal_page}
    completion_contract:
      persist_before_parse: raw source_fetch row commits before receipt
      exact_traversal: ordinal and position uniqueness reject repeated cursor/page; PAGE_NUMBER recomputes page count from total/size; MANIFEST_ORDER expected count is an FK to the root manifest item count; identity, manifest, position, total or predicate drift fails the run
      checkpoint: receipt may resume traversal, but source_checkpoints changes only through raw.complete_source_page_traversal after every required receipt is durable, parsed, reconciled, the generated operation-specific terminal predicate passes, expected version matches, and the source run/checkpoint lock once
      failure: missing/duplicate/extra page, malformed terminal metadata, unexplained total shrink, or item mismatch leaves checkpoint unchanged and prevents SUCCEEDED
      event: terminal reconciliation emits source.page_reconciled.v1 from stored receipt fields
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_ingest_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: service-owned immutable connector receipt}
    retention:
      record_class: SOURCE_PAGE_RECEIPT
      trigger: source run and checkpoint audit retention
      schedule_binding: latest effective nonexpired schedule; physical FK deferred until 0028
      legal_hold_key: source_run_id plus every source document/evidence reached through source_fetch_id
      backup_behavior: preserve receipt and hashes even if raw page capsule later erases; restore cannot advance checkpoint from receipt alone without reconciliation
      terminal_action: PRESERVE receipt/audit metadata; raw page payload follows source document schedule
    repository_roundtrip:
      row_type: SourcePageReceiptRow
      methods: [insert_or_replay, list_traversal, verify_completion, get_by_digest]
      assertions: [all four pagination strategies and five position kinds, terminal and nonterminal pages, zero-item manifest root, manifest child-parent count FK, exact count/total/page-ceiling boundaries, predicate digest mismatch, repeated cursor rejection, fetch/run/source mismatch, checkpoint CAS, crash replay, missing or extra page no success, one completion event, immutable mutation]

