global_rules:
  - Every digest is char(64) and has a named CHECK equivalent to value ~ '^[0-9a-f]{64}$'.
  - Every JSONB column names a closed Rust type and maps through sqlx::types::Json<ClosedRustType>; serde_json::Value is forbidden.
  - Every runtime role is revoked first; only the exact grants declared on each relation are regranted.
  - PUBLIC has no table, sequence, or helper-function privilege; helper functions use a fixed trusted search_path.
  - FK delete action is RESTRICT unless an immutable membership child is wholly owned by an immutable parent; this migration uses RESTRICT throughout.
  - No table has user-session RLS. These are service-owned evidence, lineage, lifecycle, and projection relations; actor scope is enforced by the request-bound repository query. Role and negative-query canaries remain mandatory.
  - Terminal records and immutable membership/fact rows reject UPDATE and DELETE through ops.reject_mutation().
  - Lifecycle transitions use owner-controlled SECURITY DEFINER functions; runtime roles do not receive direct broad UPDATE.
  - Search authorization and visibility predicates execute before candidate matching, rank, counts, snippets, suggestions, and pagination.
  - Repository queries enumerate every column, return typed cardinality, and never synthesize identifiers, timestamps, versions, states, digests, receipts, or provider proof.

