supporting_objects:
  sequences: []
  functions:
    - name: ops.digest_array_is_sorted_unique
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      rule: validates nonempty lowercase 64-hex members in bytewise C order with no duplicates; used only by constraints
    - name: ops.text_array_is_sorted_unique
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      rule: validates nonempty UTF-8 values in declared normalized C order with no duplicates; used only by constraints
    - name: ops.connector_operation_is_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      rule: generated closed CASE expression over the exact six connector manifests and 44 operation IDs; catalog set equality and function body digest are hard gates
    - name: ops.connector_operation_contract_is_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      signature: (text,text,text,text,char(64),text,char(64)) -> boolean
      input_order: [connector_id,operation_id,pagination_strategy,terminal_predicate_version,terminal_predicate_sha256,connector_contract_version,connector_contract_sha256]
      rule: generated from closed_type_contracts.connector_terminal_predicates; returns true only for the exact 44 operation tuples and the strategy-specific predicate version; function definition digest and source YAML digest set are migration canaries
    - name: ops.agent_tool_schema_contract_is_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      signature: (text,char(64),char(64)) -> boolean
      input_order: [tool_id,request_schema_sha256,response_schema_sha256]
      rule: generated CASE over exactly closed_type_contracts.normative_json_schema_registry.tools; any cross-tool or changed schema digest returns false
    - name: ops.agent_tool_payload_is_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      signature: (text,jsonb,jsonb) -> boolean
      input_order: [tool_id,request_payload,result_payload]
      rule: generated closed discriminator validator; request must match the exact tool request schema, a nonnull success result must match the same tool response schema, and failure result must be null
    - name: ops.agent_proposal_payload_is_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      signature: (text,jsonb) -> boolean
      input_order: [proposal_type,payload]
      rule: closed AgentProposalV2 payload discriminator; generic maps, cross-type variants and additional properties return false
    - name: ops.agent_provider_candidates_are_valid
      owner: gurine_migrator
      security: INVOKER_IMMUTABLE
      executable_by: []
      signature: (text[]) -> boolean
      rule: one through eight bytewise-sorted unique values, each matching ^[a-z0-9][a-z0-9._-]{0,127}$; null and empty arrays return false
    - name: raw.insert_source_document_revision
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,raw,ops,extensions,pg_temp
      executable_by: [gurine_ingest_worker]
      rule: implements required_existing_relation_alters.raw.source_documents allocation_contract with exact replay and semantic-lock serialization; the promotion procedure may call it as owner but receives no separate role grant
    - name: ops.allocate_outbox_event_sequence
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,ops,extensions,pg_temp
      executable_by: [ops.enqueue_outbox]
      rule: obtains one fixed global transaction advisory lock, assigns max(event_sequence)+1, and holds the lock through commit; direct runtime execution is revoked
    - name: core.begin_dataset_snapshot
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: [gurine_analysis_worker]
      kind_scope: analysis worker may create AGENT_CASE|DETECTION_DATASET; search projection helpers are invoked only inside the typed v2 projection owner routines
    - name: core.begin_search_projection
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,core,ops,extensions,pg_temp
      executable_by: []
      rule: takes a surface-scoped advisory transaction lock, snapshots coalesce(max(ops.outbox.event_sequence),0) under REPEATABLE READ, computes the immediately prior READY generation, inserts or reuses one BUILDING search snapshot, and never derives currentness from document count
    - name: core.complete_normalization_run
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: [gurine_ingest_worker]
      rule: locks exact RUNNING row by ID/version/job fence and performs one SUCCEEDED or FAILED terminal transition with audit/outbox/receipt
    - name: core.finalize_dataset_snapshot
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: [gurine_analysis_worker]
      rule: locks the header, dispatches by kind to the exact child relation, verifies count and ordered digest, and performs the sole BUILDING to READY or FAILED update
    - name: ops.complete_agent_provider_turn
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: [gurine_analysis_worker]
      rule: validates current version, exact ProviderTurnV2 and ProviderReceiptV2 canonical bytes/digests, provider receipt outcome/status parity, transcript chain, single terminal winner, and closed envelope before terminal update
    - name: ops.claim_or_complete_agent_tool_call
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: [gurine_analysis_worker]
      rule: compare-and-return stored result by runId/callId; validates the exact thirteen-tool request/response schema tuple and canonical digests; lease reclaim increments generation/version and stale completion is rejected
    - name: ops.transition_agent_run_v2
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,ops,core,extensions,pg_temp
      executable_by: [gurine_analysis_worker, gurine_control_api]
      rule: expected-version CAS over the seven searchable statuses and five control states; writes the immutable control/terminal receipt, budget disposition, audit and allowed event in the same transaction; no possible provider/tool effect may be labelled CANCELLED or FAILED without definitive proof
    - name: ops.decide_agent_proposal_v2
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,ops,editorial,core,extensions,pg_temp
      executable_by: [gurine_control_api]
      rule: implements the proposal materialization contract with exact validation/citation/source-use bindings and idempotent one-target cardinality; COMMUNICATION execution is installed only after the 0026 backward binding exists
    - name: raw.promote_research_artifact_to_evidence
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,raw,core,editorial,ops,extensions,pg_temp
      executable_by: [gurine_control_api]
      rule: validates PromoteResearchArtifactRequestV1, exact artifact/tool/run/rights and CLEAN scan receipt, trusted parser extraction receipt, sorted selected locators and expected case version; creates/reuses the source revision then inserts evidence segments, evidence, one HUMAN_PROMOTION artifact source-use, the closed promotion segment ledger, promotion/audit/outbox/receipt atomically
    - name: raw.complete_source_page_traversal
      owner: gurine_migrator
      security: SECURITY_DEFINER
      search_path: pg_catalog,raw,ops,extensions,pg_temp
      executable_by: [gurine_ingest_worker]
      rule: locks the source run, exact ordered receipt set and checkpoint; recomputes the strategy-specific terminal predicate, item/count/digest parity and receipt-set digest; one checkpoint CAS winner emits source.page_reconciled.v1 and exact replay returns the stored completion receipt
    - name: public.purge_search_generation
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: []
      rule: deletes only a noncurrent public search generation after 30-minute cursor TTL, no retained descendant dependency, exact expected generation digest, hold/disclosure recheck, and immutable purge receipt
    - name: ops.purge_search_generation
      owner: gurine_migrator
      security: SECURITY_DEFINER
      executable_by: []
      rule: deletes only a noncurrent internal search generation after 10-minute cursor TTL, no retained descendant dependency, exact expected generation digest, hold recheck, and immutable purge receipt
  views:
    - name: public.search_generations
      security_barrier: true
      source: core.dataset_snapshots
      predicate: snapshot_kind='PUBLIC_SEARCH_PROJECTION' AND state='READY'
      exposed_columns: [id, producer_generation, projection_watermark, contract_version, snapshot_sha256, member_count, member_set_sha256, ready_at]
      grants: {gurine_public_api: SELECT}
      purpose: expose safe generation metadata without granting public API access to core
  trigger_functions:
    - ops.reject_mutation
    - core.enforce_normalization_run_lifecycle
    - core.enforce_dataset_snapshot_children
    - ops.enforce_agent_provider_turn_chain
    - ops.enforce_agent_tool_call_lifecycle
    - ops.enforce_agent_run_control_chain
    - ops.enforce_agent_source_use_graph
    - ops.enforce_agent_validation_and_citation
    - raw.enforce_research_artifact_promotion_graph
    - raw.enforce_source_page_completion
    - public.enforce_search_document_projection
    - ops.enforce_search_document_projection
    - raw.enforce_asset_rights_sequence
  function_privilege_rule: REVOKE ALL FROM PUBLIC and every undeclared runtime role; fixed search_path is mandatory

procurement_physical_contract:
  canonicalization:
    algorithm: GURINE_CANONICAL_JSON_V1
    byte_definition: RFC8785 JCS encoded as UTF-8; this is the same byte algorithm as closed_type_contracts.canonical_encoding.algorithm
    self_digest_rule: every closed payload stores complete typed jsonb, complete canonical bytea, a second canonical preimage with only its own digest field omitted, and a generated lowercase SHA-256 over that preimage
    scalar_parity: every flattened scalar and FK column is compared with the decoded closed payload before insert; no caller digest, JSON member, timestamp, identity, limitation or locator is trusted independently
  common_revision_columns: &procurement_revision_columns
    revision_id: {type: uuid, nullable: false}
    root_id: {type: uuid, nullable: false}
    revision: {type: bigint, nullable: false}
    record_digest: {type: 'char(64)', nullable: false, generated: "encode(extensions.digest(digest_preimage_canonical,'sha256'),'hex')"}
    predecessor_revision_id: {type: uuid, nullable: true}
    predecessor_revision: {type: bigint, nullable: true}
    predecessor_record_digest: {type: 'char(64)', nullable: true}
    supersedes_revision_id: {type: uuid, nullable: true}
    revision_state: {type: text, nullable: false}
    source_id: {type: text, nullable: false}
    connector_id: {type: text, nullable: false}
    operation_id: {type: text, nullable: false}
    source_document_id: {type: uuid, nullable: false}
    source_asset_id: {type: uuid, nullable: false}
    source_asset_revision: {type: bigint, nullable: false}
    source_content_sha256: {type: 'char(64)', nullable: false}
    source_external_id: {type: text, nullable: false}
    source_external_revision: {type: text, nullable: false}
    parsed_record_id: {type: uuid, nullable: false}
    record_index: {type: integer, nullable: false}
    source_record_digest: {type: 'char(64)', nullable: false}
    retrieved_at: {type: timestamptz, nullable: false}
    mapping_version: {type: text, nullable: false}
    mapping_effective_from: {type: timestamptz, nullable: false}
    normalization_run_id: {type: uuid, nullable: false}
    effective_time_value: {type: text, nullable: true}
    effective_time_status: {type: text, nullable: false}
    effective_time_precision: {type: text, nullable: true}
    effective_time_source_field: {type: text, nullable: true}
    effective_time_timezone: {type: text, nullable: true}
    payload_canonical: {type: bytea, nullable: false}
    digest_preimage_canonical: {type: bytea, nullable: false}
    field_provenance_set_digest: {type: 'char(64)', nullable: false}
    coverage_status: {type: text, nullable: false}
    limitation_set_digest: {type: 'char(64)', nullable: false}
    created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
  common_revision_checks:
    - revision and source_asset_revision are positive and record_index is nonnegative
    - every digest is lowercase SHA-256 and all text identities are nonempty within the domain bounds
    - revision 1 has root_id=revision_id and the complete predecessor/supersedes tuple null; revision greater than 1 has the complete tuple nonnull, predecessor_revision=revision-1 and supersedes_revision_id=predecessor_revision_id
    - UNKNOWN effective time has value, precision, source field and timezone all null; KNOWN has all four nonnull and round-trips through the declared precision/timezone contract
    - payload_canonical decodes exactly to typed_payload; digest_preimage_canonical is the same closed object with only recordDigest removed; flattened columns are field-equal
  common_revision_foreign_keys:
    source_document: '[source_document_id,source_asset_id,source_asset_revision,source_content_sha256] -> raw.source_documents(id,asset_id,asset_revision,content_sha256)'
    parsed_record: '[parsed_record_id,source_document_id,source_record_digest] -> raw.parsed_records(id,source_document_id,payload_sha256)'
    normalization_run: '[normalization_run_id,source_document_id,revision_id,revision,record_digest] -> core.normalization_runs(id,source_document_id,output_object_id,output_object_version,output_payload_sha256)'
    predecessor: '[root_id,predecessor_revision_id,predecessor_revision,predecessor_record_digest] -> same(root_id,revision_id,revision,record_digest) MATCH FULL INITIALLY DEFERRED'
  revision_grants: &procurement_revision_grants
    gurine_ingest_worker: [SELECT]
    gurine_analysis_worker: [SELECT]
    gurine_control_api: [SELECT]
    gurine_public_projector: []
    gurine_auditor: [SELECT]
    all_other_runtime_roles: []
  mutation:
    mode: APPEND_ONLY_IMMUTABLE
    trigger: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    writer: fixed-search-path SECURITY DEFINER typed ingest function only; runtime roles have no direct INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES or TRIGGER
    replay: identical source/mapping identity and canonical bytes returns the existing row; changed normalized bytes is NORMALIZATION_CONFLICT and is quarantined without a second authoritative revision

tables:
  - relation: core.normalization_runs
    owner_role: gurine_migrator
    service_owner: ingest-worker
    domain_owner: crates/ingestion::normalization
    rust_type: gurine_ingestion::normalization::NormalizationRun
    repository: crates/persistence-postgres::normalization_runs
    mutation_class: LIFECYCLE_GUARDED
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      source_document_id: {type: uuid, nullable: false}
      parser_run_id: {type: uuid, nullable: false}
      parsed_record_id: {type: uuid, nullable: false}
      parser_version: {type: text, nullable: false}
      input_payload_sha256: {type: 'char(64)', nullable: false}
      normalization_id: {type: text, nullable: false}
      normalization_version: {type: text, nullable: false}
      normalization_contract_sha256: {type: 'char(64)', nullable: false}
      implementation_sha256: {type: 'char(64)', nullable: false}
      producer_generation: {type: bigint, nullable: false}
      state: {type: text, nullable: false, default: RUNNING}
      output_object_type: {type: text, nullable: true}
      output_object_id: {type: uuid, nullable: true}
      output_object_version: {type: bigint, nullable: true}
      output_payload_sha256: {type: 'char(64)', nullable: true}
      field_provenance_count: {type: bigint, nullable: false, default: 0}
      field_provenance_set_sha256: {type: 'char(64)', nullable: true}
      error_code: {type: text, nullable: true}
      error_sha256: {type: 'char(64)', nullable: true}
      terminal_receipt_sha256: {type: 'char(64)', nullable: true}
      terminal_audit_event_id: {type: uuid, nullable: true}
      job_id: {type: uuid, nullable: false}
      job_fencing_token: {type: bigint, nullable: false}
      version: {type: bigint, nullable: false, default: 1}
      started_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      completed_at: {type: timestamptz, nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    constraints:
      primary_key: {name: normalization_runs_pk, columns: [id]}
      foreign_keys:
        - {name: normalization_runs_source_document_fk, columns: [source_document_id], references: raw.source_documents(id), on_delete: RESTRICT}
        - {name: normalization_runs_parser_run_fk, columns: [parser_run_id, source_document_id], references: "core.parser_runs(id, source_document_id)", on_delete: RESTRICT}
        - {name: normalization_runs_parsed_record_fk, columns: [parsed_record_id, source_document_id, parser_version, input_payload_sha256], references: "raw.parsed_records(id, source_document_id, parser_version, payload_sha256)", on_delete: RESTRICT}
        - {name: normalization_runs_job_fk, columns: [job_id], references: ops.jobs(id), on_delete: RESTRICT}
        - {name: normalization_runs_terminal_audit_fk, columns: [terminal_audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      unique:
        - {name: normalization_runs_generation_uk, columns: [parsed_record_id, normalization_id, normalization_version, producer_generation]}
        - {name: normalization_runs_output_binding_uk, columns: [id, state, output_object_type, output_object_id, output_object_version, output_payload_sha256, normalization_version, normalization_contract_sha256]}
        - {name: normalization_runs_source_binding_uk, columns: [id, source_document_id]}
        - {name: normalization_runs_procurement_output_uk, columns: [id, source_document_id, output_object_id, output_object_version, output_payload_sha256]}
      checks:
        - {name: normalization_runs_generation_ck, expression: producer_generation > 0}
        - {name: normalization_runs_version_ck, expression: version > 0 AND job_fencing_token > 0}
        - {name: normalization_runs_state_ck, expression: "state IN ('RUNNING','SUCCEEDED','FAILED')"}
        - {name: normalization_runs_output_type_ck, expression: "output_object_type IS NULL OR output_object_type IN ('AGENCY','SUPPLIER','CONTRACT','CONTRACT_LINE_ITEM','CONTRACT_CHANGE','PRICE_OBSERVATION','PROCUREMENT_NOTICE','PROCUREMENT_AWARD','PROCUREMENT_BIDDER_PARTICIPATION','PROCUREMENT_CONTRACT','PROCUREMENT_CONTRACT_AMENDMENT','PROCUREMENT_CONTRACT_LINE_ITEM','SUPPLIER_IDENTITY_CANDIDATE')"}
        - {name: normalization_runs_terminal_shape_ck, expression: "(state='RUNNING' AND version=1 AND completed_at IS NULL AND output_object_type IS NULL AND output_object_id IS NULL AND output_object_version IS NULL AND output_payload_sha256 IS NULL AND field_provenance_count=0 AND field_provenance_set_sha256 IS NULL AND error_code IS NULL AND error_sha256 IS NULL AND terminal_receipt_sha256 IS NULL AND terminal_audit_event_id IS NULL) OR (state='SUCCEEDED' AND version=2 AND completed_at IS NOT NULL AND output_object_type IS NOT NULL AND output_object_id IS NOT NULL AND output_object_version IS NOT NULL AND output_object_version > 0 AND output_payload_sha256 IS NOT NULL AND field_provenance_count > 0 AND field_provenance_set_sha256 IS NOT NULL AND error_code IS NULL AND error_sha256 IS NULL AND terminal_receipt_sha256 IS NOT NULL AND terminal_audit_event_id IS NOT NULL) OR (state='FAILED' AND version=2 AND completed_at IS NOT NULL AND output_object_type IS NULL AND output_object_id IS NULL AND output_object_version IS NULL AND output_payload_sha256 IS NULL AND field_provenance_count=0 AND field_provenance_set_sha256 IS NULL AND error_code IS NOT NULL AND error_sha256 IS NOT NULL AND terminal_receipt_sha256 IS NOT NULL AND terminal_audit_event_id IS NOT NULL)"}
        - {name: normalization_runs_time_ck, expression: completed_at IS NULL OR completed_at >= started_at}
        - {name: normalization_runs_nonempty_ck, expression: "length(btrim(normalization_id)) > 0 AND length(btrim(normalization_version)) > 0"}
      partial_unique:
        - {name: normalization_runs_one_active_uk, columns: [parsed_record_id, normalization_id, normalization_version], predicate: "state='RUNNING'"}
    indexes:
      - {name: normalization_runs_source_idx, method: btree, columns: [source_document_id, started_at DESC, id]}
      - {name: normalization_runs_output_idx, method: btree, columns: [output_object_type, output_object_id, output_object_version], predicate: "state='SUCCEEDED'"}
    lifecycle:
      start: RUNNING
      terminal: [SUCCEEDED, FAILED]
      allowed_edges: [RUNNING->SUCCEEDED, RUNNING->FAILED]
      retry: FAILED creates a new producer_generation row
      immutable_columns: [id, source_document_id, parser_run_id, parsed_record_id, parser_version, input_payload_sha256, normalization_id, normalization_version, normalization_contract_sha256, implementation_sha256, producer_generation, job_id, job_fencing_token, started_at, created_at]
      update_rule: owner function only; expected version and job fencing token match, version increments exactly one
    grants:
      gurine_ingest_worker: [SELECT, INSERT]
      gurine_analysis_worker: [SELECT]
      gurine_control_api: [SELECT]
    rls: {enabled: false, rationale: service-owned lineage relation}
    retention:
      record_class: NORMALIZATION_RUN_LINEAGE
      trigger: source document terminal retention decision
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision; physical FK is deferred until 0028
      legal_hold_key: source_document_id plus all cases/evidence reached through field provenance
      backup_behavior: preserve metadata and digests; payload exists in immutable parsed/source records
      terminal_action: DELETE only after all source, snapshot, publication, audit, and hold references are absent; otherwise PRESERVE
    repository_roundtrip:
      row_type: NormalizationRunRow
      methods: [insert_running, complete_succeeded, complete_failed, get_exact, list_for_source]
      assertions: [all terminal shapes, numeric and timestamp precision, source/parser/parsed composite mismatch rejection, one active generation, stale fence rejection, terminal mutation denial]

