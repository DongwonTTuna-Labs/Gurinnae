        - {name: agent_source_uses_member_fk, columns: [snapshot_member_id, dataset_snapshot_id, snapshot_member_digest, object_type, object_id, object_version, object_content_sha256], references: "core.dataset_snapshot_members(id, dataset_snapshot_id, member_digest, object_type, object_id, object_version, object_content_sha256)", on_delete: RESTRICT}
        - {name: agent_source_uses_member_document_fk, columns: [snapshot_member_source_id, dataset_snapshot_id, snapshot_member_id, snapshot_member_digest, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, snapshot_member_source_digest], references: "core.dataset_snapshot_member_sources(id, dataset_snapshot_id, snapshot_member_id, snapshot_member_digest, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, source_digest)", on_delete: RESTRICT}
        - {name: agent_source_uses_member_response_fk, columns: [snapshot_member_source_id, dataset_snapshot_id, snapshot_member_id, snapshot_member_digest, response_id, response_version, response_content_sha256, snapshot_member_source_digest], references: "core.dataset_snapshot_member_sources(id, dataset_snapshot_id, snapshot_member_id, snapshot_member_digest, response_id, response_version, response_content_sha256, source_digest)", on_delete: RESTRICT}
        - {name: agent_source_uses_segment_fk, columns: [evidence_segment_id, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, selected_content_sha256, locator_sha256], references: "raw.evidence_segments(id, source_document_id, source_asset_id, source_asset_revision, source_content_sha256, selected_content_sha256, locator_digest)", on_delete: RESTRICT}
        - {name: agent_source_uses_response_fk, columns: [response_id, response_version, response_content_sha256, response_publication_consent_sha256], references: "editorial.responses(id, version, content_sha256, publication_consent_sha256)", on_delete: RESTRICT}
        - {name: agent_source_uses_artifact_fk, columns: [research_artifact_id, research_asset_id, research_asset_revision, research_artifact_sha256, research_content_sha256, research_source_fetch_id], references: "raw.research_artifacts(id, asset_id, asset_revision, artifact_sha256, content_sha256, source_fetch_id)", on_delete: RESTRICT}
        - {name: agent_source_uses_rights_fk, columns: [asset_rights_decision_id, rights_asset_id, rights_asset_revision, rights_asset_sha256, asset_rights_decision_version, asset_rights_decision_sha256], references: "raw.asset_rights_decisions(id, asset_id, asset_revision, asset_sha256, decision_version, decision_sha256)", on_delete: RESTRICT}
        - {name: agent_source_uses_provider_receipt_fk, columns: [agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256], references: "ops.agent_provider_turns(agent_run_id, provider_turn_id, provider_receipt_id, provider_receipt_sha256)", on_delete: RESTRICT}
      unique:
        - {name: agent_source_uses_run_digest_uk, columns: [agent_run_id, source_use_sha256]}
        - {name: agent_source_uses_binding_uk, columns: [agent_run_id, source_use_id, source_use_sha256]}
      checks:
        - {name: agent_source_uses_version_kind_ck, expression: "source_use_contract_version=2 AND use_kind IN ('TOOL_QUERY','TOOL_RESULT','MODEL_INPUT','MODEL_OUTPUT_DERIVATION','CITATION','PROPOSAL','HUMAN_PROMOTION') AND source_kind IN ('EVIDENCE_SEGMENT','RESPONSE_SNAPSHOT','DATASET_MEMBER','RESEARCH_ARTIFACT')"}
        - {name: agent_source_uses_parent_ck, expression: "(use_kind='TOOL_QUERY' AND parent_source_use_id IS NULL AND parent_source_use_sha256 IS NULL) OR (use_kind<>'TOOL_QUERY' AND parent_source_use_id IS NOT NULL AND parent_source_use_sha256 IS NOT NULL)"}
        - {name: agent_source_uses_tool_ck, expression: "(use_kind='TOOL_QUERY' AND ((source_kind='DATASET_MEMBER' AND tool_call_id IS NULL AND provider_turn_id IS NULL) OR (tool_call_id IS NOT NULL AND provider_turn_id IS NOT NULL))) OR (use_kind='TOOL_RESULT' AND tool_call_id IS NOT NULL AND provider_turn_id IS NOT NULL) OR (use_kind NOT IN ('TOOL_QUERY','TOOL_RESULT') AND tool_call_id IS NULL)"}
        - {name: agent_source_uses_provider_ck, expression: "(use_kind IN ('MODEL_INPUT','MODEL_OUTPUT_DERIVATION'))=(provider_receipt_id IS NOT NULL AND provider_receipt_sha256 IS NOT NULL AND provider_turn_id IS NOT NULL)"}
        - {name: agent_source_uses_promotion_ck, expression: "(use_kind='HUMAN_PROMOTION' AND source_kind='RESEARCH_ARTIFACT' AND promotion_id IS NOT NULL AND promotion_receipt_sha256 IS NOT NULL) OR (use_kind<>'HUMAN_PROMOTION' AND promotion_id IS NULL AND promotion_receipt_sha256 IS NULL)"}
        - {name: agent_source_uses_locator_ck, expression: "(locator_kind IS NULL AND locator_value IS NULL AND locator_sha256 IS NULL) OR (locator_kind IN ('PAGE_BBOX','XLSX_CELL','CSV_ROW_COLUMN','XML_XPATH','DOCX_PARAGRAPH','HWPX_XPATH','JSON_POINTER','HTML_CSS_SELECTOR','API_FIELD','TEXT_RANGE','IMAGE_BBOX','AUDIO_TIME_RANGE','VIDEO_TIME_RANGE','VIDEO_REGION_TIME') AND locator_value IS NOT NULL AND length(btrim(locator_value)) BETWEEN 1 AND 2048 AND locator_sha256 IS NOT NULL)"}
        - {name: agent_source_uses_classification_ck, expression: "classification IN ('PUBLIC','INTERNAL','RESTRICTED','PERSONAL_DATA','LEGAL_HOLD')"}
        - {name: agent_source_uses_member_source_kind_ck, expression: "member_source_kind IS NULL OR member_source_kind IN ('SOURCE_DOCUMENT','RESPONSE')"}
        - {name: agent_source_uses_rights_dimension_ck, expression: "access_right IN ('ALLOW','DENY','UNKNOWN') AND private_storage_right IN ('ALLOW','DENY','UNKNOWN') AND model_egress_right IN ('ALLOW','DENY','UNKNOWN') AND model_use_right IN ('ALLOW','DENY','UNKNOWN') AND derivative_creation_right IN ('ALLOW','DENY','UNKNOWN') AND excerpt_right IN ('ALLOW','DENY','UNKNOWN') AND redistribution_right IN ('ALLOW','DENY','UNKNOWN') AND commercial_use_right IN ('ALLOW','DENY','UNKNOWN') AND public_display_right IN ('ALLOW','DENY','UNKNOWN') AND (rights_expires_at IS NULL OR rights_expires_at > rights_effective_at)"}
        - {name: agent_source_uses_rights_binding_ck, expression: "(rights_binding_kind='ASSET_RIGHTS' AND rights_asset_id IS NOT NULL AND rights_asset_revision > 0 AND rights_asset_sha256 IS NOT NULL AND asset_rights_decision_id IS NOT NULL AND asset_rights_decision_version > 0 AND asset_rights_decision_sha256 IS NOT NULL AND response_publication_consent_sha256 IS NULL AND ((source_kind IN ('EVIDENCE_SEGMENT','DATASET_MEMBER') AND rights_asset_id=source_asset_id AND rights_asset_revision=source_asset_revision AND rights_asset_sha256=source_content_sha256) OR (source_kind='RESEARCH_ARTIFACT' AND rights_asset_id=research_asset_id AND rights_asset_revision=research_asset_revision AND rights_asset_sha256=research_content_sha256))) OR (rights_binding_kind='RESPONSE_CONSENT' AND rights_asset_id IS NULL AND rights_asset_revision IS NULL AND rights_asset_sha256 IS NULL AND asset_rights_decision_id IS NULL AND asset_rights_decision_version IS NULL AND asset_rights_decision_sha256 IS NULL AND source_kind='RESPONSE_SNAPSHOT' AND response_id IS NOT NULL AND response_publication_consent_sha256 IS NOT NULL)"}
        - name: agent_source_uses_source_shape_ck
          expression: >-
            (source_kind='EVIDENCE_SEGMENT'
             AND dataset_snapshot_id IS NOT NULL AND snapshot_member_id IS NOT NULL
             AND snapshot_member_digest IS NOT NULL AND snapshot_member_source_id IS NOT NULL
             AND snapshot_member_source_digest IS NOT NULL AND member_source_kind='SOURCE_DOCUMENT'
             AND object_type='EVIDENCE_SEGMENT' AND object_id IS NOT NULL
             AND object_version IS NOT NULL AND object_version > 0 AND object_content_sha256 IS NOT NULL
             AND evidence_segment_id IS NOT NULL AND evidence_segment_id=object_id
             AND source_document_id IS NOT NULL AND source_asset_id IS NOT NULL
             AND source_asset_revision IS NOT NULL AND source_asset_revision > 0
             AND source_content_sha256 IS NOT NULL AND selected_content_sha256 IS NOT NULL
             AND locator_sha256 IS NOT NULL
             AND response_id IS NULL AND response_version IS NULL AND response_content_sha256 IS NULL
             AND research_artifact_id IS NULL AND research_asset_id IS NULL
             AND research_asset_revision IS NULL AND research_artifact_sha256 IS NULL
             AND research_content_sha256 IS NULL AND research_source_fetch_id IS NULL)
            OR
            (source_kind='RESPONSE_SNAPSHOT'
             AND dataset_snapshot_id IS NOT NULL AND snapshot_member_id IS NOT NULL
             AND snapshot_member_digest IS NOT NULL AND snapshot_member_source_id IS NOT NULL
             AND snapshot_member_source_digest IS NOT NULL AND member_source_kind='RESPONSE'
             AND object_type='RESPONSE' AND object_id IS NOT NULL
             AND object_version IS NOT NULL AND object_version > 0 AND object_content_sha256 IS NOT NULL
             AND response_id IS NOT NULL AND response_id=object_id
             AND response_version IS NOT NULL AND response_version=object_version
             AND response_content_sha256 IS NOT NULL AND response_content_sha256=object_content_sha256
             AND source_document_id IS NULL AND source_asset_id IS NULL
             AND source_asset_revision IS NULL AND source_content_sha256 IS NULL
             AND evidence_segment_id IS NULL
             AND research_artifact_id IS NULL AND research_asset_id IS NULL
             AND research_asset_revision IS NULL AND research_artifact_sha256 IS NULL
             AND research_content_sha256 IS NULL AND research_source_fetch_id IS NULL)
            OR
            (source_kind='DATASET_MEMBER'
             AND dataset_snapshot_id IS NOT NULL AND snapshot_member_id IS NOT NULL
             AND snapshot_member_digest IS NOT NULL AND snapshot_member_source_id IS NOT NULL
             AND snapshot_member_source_digest IS NOT NULL AND member_source_kind='SOURCE_DOCUMENT'
             AND object_type IN ('AGENCY','SUPPLIER','CONTRACT','CONTRACT_LINE_ITEM','CONTRACT_CHANGE','PRICE_OBSERVATION')
             AND object_id IS NOT NULL AND object_version IS NOT NULL AND object_version > 0
             AND object_content_sha256 IS NOT NULL
             AND source_document_id IS NOT NULL AND source_asset_id IS NOT NULL
             AND source_asset_revision IS NOT NULL AND source_asset_revision > 0
             AND source_content_sha256 IS NOT NULL
             AND evidence_segment_id IS NULL
             AND response_id IS NULL AND response_version IS NULL AND response_content_sha256 IS NULL
             AND research_artifact_id IS NULL AND research_asset_id IS NULL
             AND research_asset_revision IS NULL AND research_artifact_sha256 IS NULL
             AND research_content_sha256 IS NULL AND research_source_fetch_id IS NULL)
            OR
            (source_kind='RESEARCH_ARTIFACT'
             AND dataset_snapshot_id IS NULL AND snapshot_member_id IS NULL
             AND snapshot_member_digest IS NULL AND snapshot_member_source_id IS NULL
             AND snapshot_member_source_digest IS NULL AND member_source_kind IS NULL
             AND object_type IS NULL AND object_id IS NULL AND object_version IS NULL
             AND object_content_sha256 IS NULL AND evidence_segment_id IS NULL
             AND source_document_id IS NULL AND source_asset_id IS NULL
             AND source_asset_revision IS NULL AND source_content_sha256 IS NULL
             AND response_id IS NULL AND response_version IS NULL AND response_content_sha256 IS NULL
             AND response_publication_consent_sha256 IS NULL
             AND research_artifact_id IS NOT NULL AND research_asset_id IS NOT NULL
             AND research_asset_revision IS NOT NULL AND research_asset_revision=1
             AND research_artifact_sha256 IS NOT NULL AND research_content_sha256 IS NOT NULL
             AND research_source_fetch_id IS NOT NULL)
        - {name: agent_source_uses_canonical_ck, expression: "convert_from(source_use_canonical,'UTF8')::jsonb IS NOT NULL"}
    indexes:
      - {name: agent_source_uses_run_idx, method: btree, columns: [agent_run_id, occurred_at, source_use_id]}
      - {name: agent_source_uses_source_idx, method: btree, columns: [source_kind, object_id, research_artifact_id, evidence_segment_id, response_id]}
      - {name: agent_source_uses_parent_idx, method: btree, columns: [agent_run_id, parent_source_use_id]}
      - {name: agent_source_uses_promotion_idx, method: btree, columns: [promotion_id, source_use_id], predicate: "promotion_id IS NOT NULL"}
    insertion_guard: deferred trigger locks run/snapshot/member/source/turn/tool/receipt/rights/parent; rejects cross-run ancestry and cycles; TOOL_QUERY is the only root use, and every MODEL_INPUT parents the exact same-run upstream source use (a later turn must parent the exact prior TOOL_RESULT source use); for DATASET_MEMBER emits one row per exact member-source asset; RESPONSE_CONSENT derives the nine dimensions from the immutable response consent plus pinned policy; external MODEL_INPUT additionally requires ALLOW for model egress/use and the exact provider receipt
    wire_mapping:
      ASSET_RIGHTS: SourceUseV2.rightsDecision uses asset_rights_decision_id/version/sha256 and the stored dimensional decision
      RESPONSE_CONSENT: SourceUseV2.rightsDecision.decisionId=response_id, decisionVersion=response_version and decisionSha256=response_publication_consent_sha256; dimensions are the fail-closed derived response-use decision under rights_policy_version/sha256
      rule: this mapping is deterministic and repository-decoded; callers never supply a generic decision identity independently of the concrete FK binding
    immutability: BEFORE UPDATE OR DELETE EXECUTE ops.reject_mutation()
    grants:
      gurine_analysis_worker: [SELECT, INSERT]
      gurine_control_api: [SELECT]
      gurine_auditor: [SELECT]
    function_only_writes:
      gurine_control_api: [raw.promote_research_artifact_to_evidence]
    rls: {enabled: false, rationale: immutable run provenance; browser scope is joined through run/case and safe view models}
    retention:
      record_class: AGENT_SOURCE_USE
      trigger: later of source, run, proposal, promotion, action, publication and audit schedules
      schedule_binding: exact effective 0028 schedule revision; missing/expired schedule preserves fail-closed
      legal_hold_key: exact source asset or response plus run/case and promotion graph
      backup_behavior: restore before citations, provider transcripts or promotion receipts become readable
      terminal_action: PRESERVE identities/digests/rights decisions; selected safe text is not stored here
    repository_roundtrip:
      row_type: AgentSourceUseRow
      methods: [insert_batch_atomic, list_run_graph, trace_to_source, get_promotion_source]
      assertions: [all seven use kinds, all four source kinds, response snapshot provenance, normalized member multi-source expansion, asset and response rights bindings, external egress denial, parent cycle and cross-run denial, source-use set digest, immutable denial]

