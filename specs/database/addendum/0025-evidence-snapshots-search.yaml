    initial: {schemaVersion: agent-transcript.initial.v1, ordered_fields: [schemaVersion,runId,inputSnapshotSha256,promptSha256,outputSchemaSha256,providerPolicySha256]}
    successful_tool_turn: {schemaVersion: agent-transcript.tool-turn.v1, ordered_fields: [schemaVersion,priorTranscriptSha256,providerTurnDigest,providerReceiptDigest,toolCallDigest,toolResultDigest,orderedSourceUseDigests]}
    final_turn: {schemaVersion: agent-transcript.final-turn.v1, ordered_fields: [schemaVersion,priorTranscriptSha256,providerTurnDigest,providerReceiptDigest,outputPayloadSha256]}
    fallback_rule: same turn attempts have identical prior transcript, semantic request, prompt, schema, budget reservation key, and idempotency key; candidate/attempt/receipt facts alone may differ
    chain_rule: one COMPLETED TOOL_CALL attempt advances to exactly its stored result transcript; FINAL_OUTPUT closes the chain; failure attempts never advance it
