    add_constraints:
      - {name: agent_suggestions_contract_version_ck, kind: CHECK, expression: "proposal_contract_version IN (1,2)"}
      - {name: agent_suggestions_v2_binding_uk, kind: UNIQUE, columns: [id, agent_run_id, payload_sha256, input_snapshot_sha256, citation_validation_id]}
      - {name: agent_suggestions_run_snapshot_fk, kind: FOREIGN_KEY, columns: [agent_run_id, input_snapshot_sha256], references: "ops.agent_runs(id, input_snapshot_hash)", on_delete: RESTRICT}
      - {name: agent_suggestions_validation_fk, kind: FOREIGN_KEY, columns: [citation_validation_id, agent_run_id, input_snapshot_sha256], references: "ops.agent_output_validations(validation_id, agent_run_id, input_snapshot_sha256)", on_delete: RESTRICT, create_after_parent: true}
      - {name: agent_suggestions_decision_audit_fk, kind: FOREIGN_KEY, columns: [decision_audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {name: agent_suggestions_v2_payload_ck, kind: CHECK, expression: "proposal_contract_version=1 OR (target_schema_version IS NOT NULL AND payload_sha256 IS NOT NULL AND payload_canonical IS NOT NULL AND convert_from(payload_canonical,'UTF8')::jsonb=payload AND encode(extensions.digest(payload_canonical,'sha256'),'hex')=payload_sha256 AND input_snapshot_sha256 IS NOT NULL AND citation_validation_id IS NOT NULL AND expires_at IS NOT NULL AND expires_at > created_at AND evidence_ids='[]'::jsonb AND citation_checks='[]'::jsonb)"}
      - {name: agent_suggestions_v2_status_ck, kind: CHECK, expression: "proposal_contract_version=1 OR status IN ('PENDING','ACCEPTED','REJECTED','SUPERSEDED','EXPIRED')"}
      - {name: agent_suggestions_v2_type_ck, kind: CHECK, expression: "proposal_contract_version=1 OR suggestion_type IN ('HYPOTHESIS','CLAIM','TASK','COMPARABLE','COMMUNICATION')"}
      - {name: agent_suggestions_v2_terminal_decision_ck, kind: CHECK, expression: "proposal_contract_version=1 OR status='PENDING' OR (decision_reason IS NOT NULL AND decided_by IS NOT NULL AND decided_at IS NOT NULL AND decision_kind IS NOT NULL AND decision_sha256 IS NOT NULL AND decision_audit_event_id IS NOT NULL)"}
      - {name: agent_suggestions_v2_decision_shape_ck, kind: CHECK, expression: "proposal_contract_version=1 OR (status='PENDING' AND decision_kind IS NULL AND decision_sha256 IS NULL AND decision_audit_event_id IS NULL AND decided_by IS NULL AND decided_at IS NULL AND materialized_target_id IS NULL AND materialization_receipt_sha256 IS NULL) OR (status='ACCEPTED' AND decision_kind='ACCEPT' AND decision_sha256 IS NOT NULL AND decision_audit_event_id IS NOT NULL AND decided_by IS NOT NULL AND decided_at IS NOT NULL AND materialized_target_type IS NOT NULL AND materialized_target_id IS NOT NULL AND materialized_target_version IS NOT NULL AND materialized_target_version > 0 AND materialized_target_digest IS NOT NULL AND materialization_receipt_sha256 IS NOT NULL) OR (status='REJECTED' AND decision_kind='REJECT' AND decision_sha256 IS NOT NULL AND decision_audit_event_id IS NOT NULL AND decided_by IS NOT NULL AND decided_at IS NOT NULL AND materialized_target_id IS NULL AND materialization_receipt_sha256 IS NULL) OR (status='SUPERSEDED' AND decision_kind='SUPERSEDE' AND decision_sha256 IS NOT NULL AND decision_audit_event_id IS NOT NULL AND decided_at IS NOT NULL AND materialized_target_id IS NULL AND materialization_receipt_sha256 IS NULL) OR (status='EXPIRED' AND decision_kind='EXPIRE' AND decision_sha256 IS NOT NULL AND decision_audit_event_id IS NOT NULL AND decided_at IS NOT NULL AND materialized_target_id IS NULL AND materialization_receipt_sha256 IS NULL)"}
      - {name: agent_suggestions_v2_target_ck, kind: CHECK, expression: "materialized_target_type IS NULL OR materialized_target_type = 'ACTION_PROPOSAL_DRAFT'"}
      - {name: agent_suggestions_v2_target_binding_ck, kind: CHECK, expression: "(status<>'ACCEPTED' AND num_nonnulls(materialized_target_type,materialized_target_id,materialized_target_version,materialized_target_digest,materialized_action_proposal_id)=0) OR (status='ACCEPTED' AND materialized_target_type='ACTION_PROPOSAL_DRAFT' AND materialized_action_proposal_id IS NOT NULL AND materialized_action_proposal_id=materialized_target_id AND materialized_target_version > 0 AND materialized_target_digest IS NOT NULL)"}
    payload_contract: proposal_contract_version=2 decodes exactly as AgentProposalV2 payload for suggestion_type HYPOTHESIS|CLAIM|TASK|COMPARABLE|COMMUNICATION; ops.agent_proposal_payload_is_valid performs the discriminator/schema check and one-byte canonical/digest changes fail
    new_write_rule: v2 requires all v2 fields, an exact VALID output validation, at least one relational citation, empty legacy evidence_ids/citation_checks arrays, and terminal materialization only through acceptAgentSuggestion/rejectAgentSuggestion or the expiry worker
    materialization_contract:
      HYPOTHESIS: 0026 creates one ops.action_proposals DRAFT with action_kind=HYPOTHESIS
      CLAIM: 0026 creates one ops.action_proposals DRAFT with action_kind=CLAIM
      TASK: 0026 creates one ops.action_proposals DRAFT with action_kind=TASK
      COMPARABLE: 0026 creates one ops.action_proposals DRAFT with action_kind=COMPARABLE; no normalized comparable fact is created
      COMMUNICATION: 0026 creates one ops.action_proposals DRAFT with action_kind=COMMUNICATION; no intent, authorization or delivery is created
      cross_migration_fk: 0026 adds the backward FK from every ops.action_proposals AGENT_SUGGESTION origin identity/version/digest to this suggestion and a deferred equality trigger for materialized_action_proposal_id; 0025 cannot reference the future relation
      transaction: SERIALIZABLE lock run, validation, proposal, citations, current case and idempotency; insert exactly one ActionProposal DRAFT plus its selected typed detail, update the agent proposal terminal fields once, append audit/outbox/receipt, and create zero domain target, authorization, attempt or external effect; any mismatch rolls back all
      replay: same operation/idempotency/request digest returns stored receipt bytes; changed bytes conflict; a second terminal decision is rejected

