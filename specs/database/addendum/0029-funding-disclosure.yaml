      entry_set_digest: {type: "char(64)", nullable: false, default: null}
      policy_snapshot_digest: {type: "char(64)", nullable: false, default: null}
      conflict_snapshot_id: {type: uuid, nullable: false, default: null}
      conflict_snapshot_digest: {type: "char(64)", nullable: false, default: null}
      quorum_snapshot_digest: {type: "char(64)", nullable: false, default: null}
      public_content_digest: {type: "char(64)", nullable: false, default: null}
      proposal_id: {type: uuid, nullable: false, default: null}
      proposal_version: {type: bigint, nullable: false, default: null}
