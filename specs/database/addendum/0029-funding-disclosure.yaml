    unique_constraints:
      - {name: funding_disclosure_entry_ordinal_uq, columns: [revision_id, ordinal]}
      - {name: funding_disclosure_entry_digest_uq, columns: [revision_id, entry_digest]}
      - {name: funding_disclosure_entry_source_set_uq, columns: [revision_id, source_snapshot_entry_set_digest]}
    checks:
      - {name: funding_disclosure_entry_identity_check, expression: "revision > 0 AND ordinal > 0"}
      - {name: funding_disclosure_entry_source_pair_check, expression: "cardinality(source_snapshot_entry_ids) = cardinality(source_snapshot_entry_digests) AND cardinality(source_snapshot_entry_ids) BETWEEN 1 AND 10000"}
      - name: funding_disclosure_entry_name_check
        expression: >-
          (identity_disclosure_mode = 'NAMED' AND cardinality(source_snapshot_entry_ids) = 1
           AND public_display_name IS NOT NULL
           AND length(btrim(public_display_name)) BETWEEN 1 AND 500
           AND withholding_reason IS NULL AND withholding_public_explanation IS NULL)
          OR
          (identity_disclosure_mode IN ('CATEGORY_ONLY','WITHHELD_LEGAL')
           AND public_display_name IS NULL AND withholding_reason IS NOT NULL
           AND withholding_public_explanation IS NOT NULL
           AND length(btrim(withholding_public_explanation)) BETWEEN 1 AND 2000)
      - name: funding_disclosure_entry_withholding_check
        expression: >-
          identity_disclosure_mode <> 'WITHHELD_LEGAL'
          OR (withholding_reason IS NOT NULL
           AND withholding_reason IN ('LEGAL_RESTRICTION','PRIVACY_RESTRICTION','REVIEWED_CONFIDENTIALITY_DUTY'))
      - {name: funding_disclosure_entry_text_check, expression: "length(btrim(counterparty_category)) BETWEEN 1 AND 200 AND length(btrim(purpose)) BETWEEN 1 AND 4000 AND length(btrim(conflict_disclosure)) BETWEEN 1 AND 8000 AND length(btrim(mitigation_summary)) BETWEEN 1 AND 8000"}
      - {name: funding_disclosure_entry_amount_check, expression: "amount_band_lower >= 0 AND (amount_band_upper IS NULL OR amount_band_upper > amount_band_lower) AND reporting_currency ~ '^[A-Z]{3}$'"}
      - name: funding_disclosure_entry_unknown_check
        expression: >-
          (concentration_band = 'UNKNOWN' AND concentration_unknown_reason IS NOT NULL
           AND public_caveat_text IS NOT NULL AND length(btrim(public_caveat_text)) BETWEEN 1 AND 2000
           AND ((concentration_unknown_reason = 'DENOMINATOR_UNKNOWN'
             AND denominator_unknown_reason IS NOT NULL AND grouping_dispute_reason IS NULL)
            OR (concentration_unknown_reason = 'GROUPING_DISPUTED'
             AND grouping_dispute_reason IS NOT NULL)))
          OR
          (concentration_band <> 'UNKNOWN' AND denominator_unknown_reason IS NULL
           AND grouping_dispute_reason IS NULL AND concentration_unknown_reason IS NULL
           AND public_caveat_text IS NULL)
      - {name: funding_disclosure_entry_case_check, expression: "cardinality(related_case_ids) <= 10000 AND cardinality(evidence_ids) BETWEEN 1 AND 10000"}
      - name: funding_disclosure_entry_independence_check
        expression: >-
          (independent_review_required AND cardinality(related_case_ids) > 0
           AND cardinality(independent_review_decision_ids) = cardinality(related_case_ids))
          OR
          (NOT independent_review_required AND cardinality(independent_review_decision_ids) = 0)
      - name: funding_disclosure_entry_digest_check
        expression: >-
          snapshot_digest ~ '^[0-9a-f]{64}$'
          AND source_snapshot_entry_set_digest ~ '^[0-9a-f]{64}$'
          AND source_counterparty_group_set_digest ~ '^[0-9a-f]{64}$'
          AND independent_review_set_digest ~ '^[0-9a-f]{64}$'
          AND source_link_set_digest ~ '^[0-9a-f]{64}$'
          AND entry_digest ~ '^[0-9a-f]{64}$'
