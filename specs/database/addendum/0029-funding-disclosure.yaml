      oversight_decision_id: {type: uuid, nullable: true, default: null}
      board_decision_id: {type: uuid, nullable: true, default: null}
      independent_case_review_decision_ids: {type: "uuid[]", nullable: false, default: "'{}'::uuid[]"}
      independent_case_review_set_digest: {type: "char(64)", nullable: false, default: null}
      decision_receipt_set_digest: {type: "char(64)", nullable: false, default: null}
