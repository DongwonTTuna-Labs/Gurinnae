      - {name: funding_disclosure_entry_source_ids_idx, method: gin, columns: [source_snapshot_entry_ids], unique: false}
      - {name: funding_disclosure_entry_revision_fk_idx, method: btree, columns: [revision_id, disclosure_id, revision, id], unique: false}
