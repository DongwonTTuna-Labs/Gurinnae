      - {name: transparency_report_funding_period_idx, columns: [period_end DESC, period_start DESC, published_at DESC, id DESC], where: "report_kind = 'FUNDING_DISCLOSURE'"}
      - {name: transparency_report_supersedes_fk_idx, columns: [supersedes_report_id, id], where: "supersedes_report_id IS NOT NULL"}
    additive_checks:
      - {name: transparency_report_kind_ck, expression: "report_kind IN ('GENERAL','FUNDING_DISCLOSURE')"}
      - name: transparency_report_funding_shape_ck
        expression: "(report_kind = 'GENERAL' AND source_revision_id IS NULL AND source_disclosure_id IS NULL AND source_revision IS NULL AND source_revision_digest IS NULL AND supersedes_report_id IS NULL AND report_schema_version IS NULL AND projection_digest IS NULL AND projected_at IS NULL) OR (report_kind = 'FUNDING_DISCLOSURE' AND source_revision_id IS NOT NULL AND source_disclosure_id IS NOT NULL AND source_revision IS NOT NULL AND source_revision > 0 AND source_revision_digest IS NOT NULL AND report_schema_version = 1 AND projection_digest IS NOT NULL AND projected_at IS NOT NULL)"
      - {name: transparency_report_funding_digest_ck, expression: "source_revision_digest IS NULL OR (source_revision_digest ~ '^[0-9a-f]{64}$' AND projection_digest ~ '^[0-9a-f]{64}$')"}
      - {name: transparency_report_funding_time_ck, expression: "projected_at IS NULL OR published_at <= projected_at"}
    report_json_contract:
      type: FundingDisclosurePublicV1
      additional_properties: false
      required: [schemaVersion, disclosureId, revision, fiscalYear, fiscalQuarter, periodStart, periodEnd, reportingCurrency, concentrationBand, caveat, purpose, policyRequests, sources, entries, effectiveAt, publishedAt, supersedesRevision, sourceRevisionDigest, publicContentDigest]
      entries_type: FundingDisclosurePublicEntryV1 closed to the source function return_allowlist; internal IDs, exact private amounts, decision actors and unapproved links are impossible fields.
      canonicalization: RFC 8785 canonical JSON; projection_digest is SHA-256 over report_kind, source revision identity/digest, period/title/summary, canonical report, published_at and supersedes_report_id.
  projector_function:
    name: public.project_funding_disclosure_revision_v2
    signature: "public.project_funding_disclosure_revision_v2(public.funding_disclosure_projection_v2) RETURNS public.projection_mutation_receipt_v2"
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: [pg_catalog, public, editorial, ops, pg_temp]
    execute_roles: [gurine_public_projector]
    public_execute: revoked
    idempotency_scope: ECONOMICS.PROJECT_FUNDING_DISCLOSURE.V2
    transaction: SERIALIZABLE
    source_reader: editorial.read_public_funding_projection_inputs_v1 is internal-only and cannot be executed by gurine_public_projector
    mutation: Claim one typed projection work item and insert exactly one immutable FUNDING_DISCLOSURE report per source revision. Same event/source digest returns the stored receipt; changed digest is PROJECTION_REPLAY_CONFLICT. Prior public report is never updated or hidden; supersedes_report_id forms gapless history.
    atomic_writes: [projection work claim, source verification, public transparency report revision, inbox and job terminalization, audit, public.funding_disclosure_projected.v1 outbox, immutable typed receipt]
  acl:
    public.transparency_reports:
      gurine_public_api: [SELECT]
      gurine_public_projector: []
      all_other_runtime_roles: []
    functions:
      editorial.read_public_funding_projection_inputs_v1: {gurine_public_projector: []}
      public.project_funding_disclosure_revision_v2: {gurine_public_projector: [EXECUTE]}
    rule: Projector has no raw source-table SELECT and no direct public-table mutation. Public API has no source access and reads only the typed public revision row.
  immutable_public_revision_guard:
    trigger: public.guard_funding_transparency_report_mutation_v1()
    rule: Reject UPDATE or DELETE when OLD.report_kind = FUNDING_DISCLOSURE for every role and owner canary; a correction is a new source and public revision. GENERAL legacy rows keep their separately declared projection lifecycle.
  runtime_oracle: PUB-023 lists current and complete historical revisions in source_revision DESC,id DESC order, exposes caveats and rights-filtered source links, and a source/public digest mismatch, hold, incomplete entry set, duplicate revision or attempted rewrite fails before visibility.

runtime_oracles:
  - id: AC-OA-TABLE-OPS-FUNDING_CONCENTRATION_SNAPSHOTS-CONTRACT
    assertion: PostgreSQL 18.4 round-trips one header plus entries, rejects every row-shape violation, validates the prior-version chain and returns same-batch same-digest replay without a second audit, outbox event or row.
  - id: AC-OA-TABLE-EDITORIAL-FUNDING_DISCLOSURE_REVISIONS-CONTRACT
    assertion: One SERIALIZABLE winner publishes the next quarterly revision; 63 concurrent stale-prior writers return VERSION_CONFLICT and write zero revision, entry, audit, outbox or receipt rows.
  - id: AC-OA-TABLE-EDITORIAL-FUNDING_DISCLOSURE_ENTRIES-CONTRACT
    assertion: Parent entry_count, gapless ordinals, exact source-entry partition and entry_set_digest are recomputed at deferred-constraint time; missing, duplicate or reordered input fails atomically.
  - id: FUNDING-DENOMINATOR-UNKNOWN
    assertion: Missing denominator, numeric zero, missing approval and stale approval remain distinct stored causes but all yield band UNKNOWN; no repository or event mapper synthesizes a positive denominator or approval digest.
  - id: FUNDING-CONCENTRATION-BOUNDARIES
    assertion: Band derivation compares exact numerator times 100 with denominator times 5, 15 and 25 before rounding percentage-point display share; 5 is LE_5_PERCENT, values above 5 through 15 are GT_5_TO_15_PERCENT, values above 15 through 25 are GT_15_TO_25_PERCENT and values above 25 are GT_25_PERCENT. A value 5.000000000001 percent that displays as 5.000000 remains GT_5_TO_15_PERCENT.
  - id: FUNDING-GROUPING-DISPUTE
    assertion: Any disputed counterparty grouping forces that entry to UNKNOWN regardless of denominator and cannot be named or used to satisfy a known concentration gate.
  - id: FUNDING-SOURCE-COVERAGE
    assertion: Recognized revenue facts, binding commercial contract periods and signed external donation, grant, sponsorship or other reviewed funding receipts each round-trip exact ID, digest and reporting-currency amount; at least one source exists, all arrays are paired/sorted/unique and their canonical digest equals entry_source_set_digest and header source_set_digest.
  - id: FUNDING-DENOMINATOR-APPROVAL
    assertion: APPROVED requires a positive denominator and a current board-approval receipt/approver-set digest at snapshot as_of; zero, absent or expired approval cannot enter the calculable path.
  - id: FUNDING-DISCLOSURE-INDEPENDENCE
    assertion: Funding preparer, publisher, exactly derived conditional oversight reviewer, exactly derived conditional board approver, proposal creator, last editor and executor satisfy pairwise/exclusion rules; every related-case review separately proves an eligible reviewer distinct from those disclosure actors and conflicted parties. All assignments, counted action decisions and prerequisite case decisions are re-authorized in the final transaction, and a spurious nonrequired slot fails.
  - id: FUNDING-THRESHOLD-GATES
    assertion: Any exact source entry above 15 percent requires oversight review, above 25 percent additionally requires board approval and enhanced public disclosure, and an investigated-subject or related-party entry above 5 percent requires one independent current review for every related case.
  - id: FUNDING-UNKNOWN-PUBLICATION
    assertion: UNKNOWN can only be published as UNKNOWN with explicit caveat, oversight review and board approval; it can never be relabelled as a lower band or omitted from the disclosure entry set.
  - id: FUNDING-NAMING-AND-WITHHOLDING
    assertion: A resolved single counterparty at or above the versioned naming threshold is NAMED unless a current legal/privacy/confidentiality withholding decision is bound; category aggregation cannot hide an entry requiring enhanced disclosure.
  - id: FUNDING-STALE-SNAPSHOT
    assertion: A newer immutable snapshot for the same fiscal year makes an authorization bound to an older snapshot stale; publication fails FUNDING_DISCLOSURE_STALE before writing any domain or receipt row.
  - id: FUNDING-DETECTION-FIREWALL
    assertion: gurine_analysis_worker and every detection/ranking/priority path have zero table privilege and zero event consumption path for raw funding or customer identities; funding is used only for conflict, independence and publication gates.
  - id: FUNDING-PUBLIC-BOUNDARY
    assertion: gurine_public_api and gurine_public_projector have zero privilege on ops/editorial funding relations; projector uses only the allowlisted digest-bound read/project functions and public API reads immutable FundingDisclosurePublicV1 rows. Every public revision remains discoverable with period, revision, caveat, rights-filtered source links and gapless supersession history, while raw private IDs/amounts/actors are absent.
  - id: FUNDING-RETENTION-HOLD
    assertion: All three record classes have exact terminal_action PRESERVE_PUBLIC_REVISION and no runtime delete path; DISCLOSURE holds still block projection/export, expiry never releases coverage and restore evaluates suppression plus the current hold union before access.
  - id: FUNDING-PRIVILEGE-CLOSURE
    assertion: All three relations are owned by gurine_migrator; PUBLIC and undeclared runtime roles have zero privilege; direct INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES and TRIGGER fail for every runtime role. Only gurine_workflow_worker may execute the two fixed-search-path typed SECURITY DEFINER write functions.
  - id: FUNDING-EVENT-UNKNOWN-CLOSURE
    assertion: governance.funding_snapshot_created.v1 carries denominatorState and denominatorUnknownReason and permits null or zero denominator plus null approval digest only for UNKNOWN; the current positive-only event schema is a hard closure blocker until changed.

required_cross_contract_changes:
  - The FUNDING_DISCLOSURE action payload must add disclosureId, fiscalQuarter, periodStart, periodEnd, namingThresholdAmount, ordered disclosure entries, source/evidence links, policySnapshotDigest, conflictSnapshotDigest and explicit first-revision null semantics; the current singular amount/concentration fields cannot reconstruct this ledger.
  - The FUNDING_DISCLOSURE quorum policy must reproduce requires_oversight_review, requires_board_approval, requires_enhanced_public_disclosure, has_related_party_gate and conditional_gate_set_digest and add exactly those conditional oversight/board slots; ops.execution_authorizations counted-decision arrays/check/domain schema/digest/roundtrip must use one identical bounded cardinality of 1..16 instead of the current database maximum 3. Per-related-case reviews remain separately authorized prerequisite decisions whose sorted IDs and receipt digest set are bound into the target request, approval digest, execution digest and independent_case_review_set_digest; they do not consume same-proposal counted slots.
  - governance.funding_snapshot_created.v1 must add denominatorState, denominatorUnknownReason and per-entry grouping/concentration status or a companion typed entry-set contract; its current required positive denominator and approval digest conflict with the authoritative UNKNOWN path.
  - governance.funding_disclosure_published.v1 must add revisionId, fiscalQuarter, period bounds, policy/conflict/public-content/conditional-gate digests, derived gate booleans, exact conditional decision set and publisher identity so the projector can verify the stored revision rather than trust event text.
  - FundingContentResponse must map the immutable public.transparency_reports FundingDisclosurePublicV1 revision history, denominator/grouping caveats, amount/concentration bands, rights-filtered source links and supersession; static ContentSection copy is not persistence closure.
