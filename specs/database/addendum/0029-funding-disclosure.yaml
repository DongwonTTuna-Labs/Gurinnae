      editorial.publish_funding_disclosure_v1: {gurine_workflow_worker: [EXECUTE]}
      editorial.read_public_funding_projection_inputs_v1: {gurine_public_projector: [EXECUTE]}
    rls:
      enabled: false
      forced: false
      policies: []
      rationale: Internal immutable approval-bound revision; anonymous readers consume only a public-schema projection.
    mutability:
      mode: APPEND_ONLY_IMMUTABLE_REVISION
      allowed_updates: []
      delete: FORBIDDEN
      immutable_trigger: ops.reject_mutation()
      deferred_publish_trigger: editorial.validate_funding_disclosure_at_commit()
      version_rule: First revision has no predecessor; every later revision binds exactly the immediately prior revision and digest under a SERIALIZABLE prior-revision CAS.
      digest_rule: revision_digest covers the exact snapshot, period, bands, purpose, conflicts, policy outcomes, entry_set_digest, policy/conflict snapshots, approvals, effective time and prior digest; created_at is excluded.
      conditional_quorum_rule: The deferred trigger derives all four gate booleans and conditional_gate_set_digest from the complete locked source-entry partition before checking decision slots; caller values are never trusted.
      correction_rule: Corrections append revision + 1 and never modify or hide prior public history.
    retention:
      record_class: FUNDING_PUBLIC_DISCLOSURE_REVISION
      trigger: Supersession does not start destruction; public revision history remains preservable indefinitely.
      schedule_binding: Latest effective nonexpired ops.record_class_schedules revision for FUNDING_PUBLIC_DISCLOSURE_REVISION.
      legal_hold_key: [relation, disclosure_id, revision, snapshot_batch_id]
      backup_behavior: Preserve every revision and reapply restoration suppression and DISCLOSURE holds before public projection or export after restore.
      terminal_action: PRESERVE_PUBLIC_REVISION
    repository:
      roundtrip:
        - Round-trip all scalar columns through FundingDisclosureRevisionRow, including null first-prior and unbounded upper amount band.
        - Recompute approval, execution, decision-receipt, entry-set, public-content and revision digests from stored typed values.
        - Missing conditional approval, stale snapshot, stale prior revision, duplicated execution authorization and any actor overlap fail with exact domain errors.
      detail_cardinality: Exactly one revision and exactly entry_count ordered entries or FUNDING_DISCLOSURE_CORRUPT.
      ordering:
        history: revision ASC, id ASC
        latest: fiscal_year DESC, fiscal_quarter DESC, effective_at DESC, revision DESC, id DESC
        decision_ids: approval slot ordinal ASC, action decision id ASC
      transaction:
        isolation: SERIALIZABLE
        lock_order: Snapshot header and entries by ordinal; latest quarterly disclosure revision; execution authorization; action assignments and decisions by slot ordinal; related cases by UUID; audit chain head; outbox; execution receipt.
        atomicity: Revision, complete entry set, audit, governance.funding_disclosure_published.v1 outbox, execution receipt and public-projection work item commit or roll back together.

