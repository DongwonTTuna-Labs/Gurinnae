      public_usage: revoked
      fields:
        - {ordinal: 1, name: revision, type: editorial.funding_public_revision_v1, nullable: false}
        - {ordinal: 2, name: entries, type: "editorial.funding_public_entry_v1[]", nullable: false}
  composite_validation:
    - Every fields list has ordinals exactly 1..N, no duplicate names, exact PostgreSQL type names and no default expressions.
    - SQL migration constructs CREATE TYPE in composite_creation_order, then queries pg_attribute/pg_type for byte-exact name/type/ordinal equality and revokes PUBLIC USAGE before any function creation.
    - Functions reject a NULL required attribute, an unexpected NULL/non-NULL pair, unsorted array, duplicate member or derived field supplied through another channel before any persistent lock.
  catalog_gate: Exact pg_type label order, owner and ACL set equality; PUBLIC or an undeclared runtime role with USAGE fails migration.

economics_shared_contract_refs:
  rounding: specs/database/addendum/0029-commercial-core.yaml#round_half_even_contract
  idempotency: specs/database/addendum/0029-commercial-core.yaml#exact_idempotency_stored_response_contract
  public_projection: specs/database/addendum/0029-commercial-core.yaml#public_projection_boundary
  idempotency_scopes:
    ops.import_funding_snapshot_v1: ECONOMICS.IMPORT_FUNDING_SNAPSHOT.V1
    editorial.publish_funding_disclosure_v1: ECONOMICS.PUBLISH_FUNDING_DISCLOSURE.V1

funding_semantics:
  denominator:
    value: Board-approved expected annual revenue for the fiscal year in reporting_currency under the exact funding policy digest.
    approved_path: Positive numeric value plus current denominator approval, approver-set and FX snapshot digests at snapshot as_of.
    unknown_paths: Missing, zero, approval-missing and approval-stale are separately stored and all remain UNKNOWN.
  numerator:
    recognized_revenue: Sum of effective immutable ops.revenue_facts plus verified external donation, grant, sponsorship and other reviewed receipts with RECOGNIZED basis for the fiscal year and counterparty group after append-only corrections and exact FX conversion.
    binding_committed_revenue: Enforceable, unrecognized fiscal-year commitment remaining under bound ops.commercial_contract_periods plus verified external receipts with BINDING_COMMITTED basis at snapshot as_of; already recognized value is excluded so it is never double counted.
    formula: numerator = recognized_revenue + binding_committed_revenue.
  concentration:
    exact_comparison: Compare numerator * 100 with denominator * 5, 15 and 25 before calculating concentration_share = ops.round_half_even_numeric_v1(numerator * 100 / denominator, 6) percentage points.
    unknown_precedence: GROUPING_DISPUTED precedes DENOMINATOR_UNKNOWN for a disputed entry; neither path permits a numeric share or known band.
    policy_effects:
      GT_15_TO_25_PERCENT: current independent oversight review
      GT_25_PERCENT: current independent oversight review, board approval and enhanced public disclosure
      investigated_subject_or_related_party_above_5_percent: one current independent review per related case
    disclosure_aggregate_derivation: If any included disclosure entry is UNKNOWN the revision band is UNKNOWN; otherwise it is the maximum exact source-entry band in order LE_5_PERCENT, GT_5_TO_15_PERCENT, GT_15_TO_25_PERCENT, GT_25_PERCENT. Every source entry gate is evaluated before aggregation, so an UNKNOWN or category aggregation cannot hide a known threshold trigger.
  independence:
    global_distinctness: Preparation, publication, oversight and board actors are pairwise distinct for one disclosure proposal. Each related case has its own independently authorized review; its reviewer is excluded from the disclosure actors and conflicted parties, while one eligible reviewer may cover different case proposals only when each proposal independently authorizes that actor.
    exclusions: [proposal_creator, last_editor, executor, counterparty_or_related_party, case_party_or_recipient, conflicted_actor, recused_actor]
    stale_rule: A changed snapshot, grouping, policy, conflict, source fact, related-case set or public rendering invalidates every decision bound to the old digest.

required_support_objects:
  ops.import_funding_snapshot_v1:
    kind: SECURITY_DEFINER_FUNCTION
    owner: gurine_migrator
    signature: "ops.import_funding_snapshot_v1(ops.funding_snapshot_import_v1, ops.funding_snapshot_entry_input_v1[]) RETURNS ops.funding_snapshot_import_receipt_v1"
    search_path: [pg_catalog, ops, core, editorial, pg_temp]
    revoke_execute_from: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_scheduler, gurine_auditor, gurine_identity_api, gurine_document_extractor]
    grant_execute_to: [gurine_workflow_worker]
    input_contract: Closed composite header plus closed composite entry array; no jsonb, polymorphic map, caller-supplied derived total, band or digest is trusted.
    idempotency_scope: ECONOMICS.IMPORT_FUNDING_SNAPSHOT.V1
    transaction: SERIALIZABLE; claims exact idempotency key/request digest, locks the prior fiscal-year header, verifies signed sources, inserts the full graph, audit, one outbox event, immutable receipt and canonical stored response bytes or rolls back all.
    replay: Same canonical request returns the original response_body_bytes decoded to ops.funding_snapshot_import_receipt_v1 and writes zero rows; changed request is IDEMPOTENCY_CONFLICT.
  editorial.publish_funding_disclosure_v1:
    kind: SECURITY_DEFINER_FUNCTION
    owner: gurine_migrator
    signature: "editorial.publish_funding_disclosure_v1(editorial.funding_disclosure_publish_v1, editorial.funding_disclosure_entry_input_v1[]) RETURNS editorial.funding_disclosure_publish_receipt_v1"
    search_path: [pg_catalog, editorial, ops, core, pg_temp]
    revoke_execute_from: [PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_scheduler, gurine_auditor, gurine_identity_api, gurine_document_extractor]
    grant_execute_to: [gurine_workflow_worker]
    input_contract: Closed approval-bound publish composite plus closed ordered entry composites; no jsonb, partial patch or caller-supplied derived quorum, band, caveat, digest or receipt is trusted.
    idempotency_scope: ECONOMICS.PUBLISH_FUNDING_DISCLOSURE.V1
    transaction: SERIALIZABLE; claims exact idempotency key/request digest, locks and re-authorizes the exact snapshot, prior revision, authorization, complete decision set, cases and conflict evidence, then inserts revision, entries, audit, outbox, execution receipt and canonical stored response atomically.
    replay: Same canonical request returns the original response_body_bytes decoded to editorial.funding_disclosure_publish_receipt_v1 and writes zero rows; changed request is IDEMPOTENCY_CONFLICT.
  ops.validate_funding_snapshot_graph_at_commit:
    kind: DEFERRABLE_INITIALLY_DEFERRED_CONSTRAINT_TRIGGER
    events: [INSERT]
    relation: ops.funding_concentration_snapshots
    assertions:
      - Exactly one header exists for snapshot_batch_id and child ordinals are gapless 1 through header.entry_count.
      - Every child header_id resolves to that header and repeats exact batch, version, fiscal year, as-of and currency.
      - A version above one points to the exact prior same-fiscal-year header and digest; no fork or skipped version is accepted.
      - Member, revenue-fact, contract-period, external signed funding-receipt and related-case arrays are sorted, duplicate-free, element digests/signatures are lowercase SHA-256 and every concrete ID/digest pair is verified at the locked revision or signed-import boundary.
      - Per-source reporting-currency amounts are nonnegative and paired by ordinal; recognized and binding totals are independently recomputed under the funding/FX/correction policy, then numerator, UNKNOWN precedence, exact threshold band and rounded display share are derived rather than trusted from the importer.
      - Ordered entry digests recompute entry_set_digest and the canonical header plus entry set recomputes snapshot_digest.
  editorial.validate_funding_disclosure_at_commit:
    kind: DEFERRABLE_INITIALLY_DEFERRED_CONSTRAINT_TRIGGER
    events: [INSERT]
    relations: [editorial.funding_disclosure_revisions, editorial.funding_disclosure_entries]
    assertions:
      - The exact snapshot header is the latest imported snapshot for its fiscal year at authorization and publication; the reporting period, quarter and currency are policy-valid.
      - The prior revision CAS is gapless and binds the exact prior revision digest.
      - ExecutionAuthorization is current, unexpired, action_kind FUNDING_DISCLOSURE, executor private.PublishFundingDisclosureRevision and its proposal payload/approval/execution digests exactly equal the stored revision and ordered entries.
      - Derive requires_oversight_review when any exact source entry is above 15 percent or UNKNOWN; derive requires_board_approval and enhanced-public-disclosure when any entry is above 25 percent or UNKNOWN; derive has_related_party_gate when an investigated-subject or related-party entry exceeds 5 percent. Recompute conditional_gate_set_digest over each triggering source entry ID, digest, exact band, relationship flags and related-case set.
      - Preparer and publisher base slots plus exactly the derived conditional oversight and board slots resolve to counted APPROVE decisions with current assurance, role/capability, assignment and conflict snapshot. A nonrequired conditional decision is rejected rather than counted; per-related-case reviews are separately authorized prerequisite decisions bound by independent_case_review_set_digest and revalidated in the same transaction.
      - Preparer, publisher, oversight reviewer and board approver users and decision rows are pairwise distinct when present, and the trigger separately excludes proposal creator, last editor, executor, counterparty/related-party actors, case parties/recipients, conflicted and recused actors using the locked proposal, execution, case and conflict graphs.
      - Source snapshot entry arrays form a duplicate-free exact partition for the disclosure policy; bands, flags, naming/withholding, evidence/rights, related cases and independent-review requirements are derived from locked source rows and policy.
      - Child ordinals are gapless, child entry digests recompute parent entry_set_digest and all policy/outcome/source/public/revision digests recompute byte-exactly.
      - The execution receipt, audit row and one governance.funding_disclosure_published.v1 outbox row bind the same revision digest in the same transaction.
  ops.reject_mutation:
    kind: BEFORE_UPDATE_OR_DELETE_TRIGGER_FUNCTION
    applies_to:
      - ops.funding_concentration_snapshots
      - editorial.funding_disclosure_revisions
      - editorial.funding_disclosure_entries
    effect: Reject every UPDATE and DELETE; corrections and supersession are insert-only.

tables:
  ops.funding_concentration_snapshots:
    creation_order: 15
    owner:
      object_owner: gurine_migrator
      logical_component: funding-importer
      physical_service: workflow-worker
      repository: crates/persistence-postgres::funding
      rust_rows: [FundingConcentrationSnapshotHeaderRow, FundingConcentrationSnapshotEntryRow]
      rust_domain: gurine_domain::funding::FundingConcentrationSnapshot
    purpose: A single immutable self-graph per fiscal-year snapshot; the header is ordinal zero and every counterparty entry is a child row, so no eighteenth 0029 table is introduced.
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      snapshot_batch_id: {type: uuid, nullable: false, default: null}
      snapshot_version: {type: bigint, nullable: false, default: null}
      row_kind: {type: ops.funding_snapshot_row_kind, nullable: false, default: null}
      ordinal: {type: integer, nullable: false, default: null}
      header_id: {type: uuid, nullable: true, default: null}
      fiscal_year: {type: integer, nullable: false, default: null}
      as_of: {type: timestamptz, nullable: false, default: null}
      reporting_currency: {type: "char(3)", nullable: false, default: null}
      prior_header_id: {type: uuid, nullable: true, default: null}
      prior_snapshot_digest: {type: "char(64)", nullable: true, default: null}
      funding_policy_version: {type: text, nullable: true, default: null}
      funding_policy_digest: {type: "char(64)", nullable: true, default: null}
      fx_snapshot_digest: {type: "char(64)", nullable: true, default: null}
      denominator_amount: {type: "numeric(24,6)", nullable: true, default: null}
      denominator_state: {type: ops.funding_denominator_state, nullable: true, default: null}
      denominator_unknown_reason: {type: ops.funding_denominator_unknown_reason, nullable: true, default: null}
      denominator_approval_digest: {type: "char(64)", nullable: true, default: null}
      denominator_approver_set_digest: {type: "char(64)", nullable: true, default: null}
      denominator_approved_at: {type: timestamptz, nullable: true, default: null}
      denominator_approval_expires_at: {type: timestamptz, nullable: true, default: null}
      entry_count: {type: integer, nullable: true, default: null}
      entry_set_digest: {type: "char(64)", nullable: true, default: null}
      source_set_digest: {type: "char(64)", nullable: true, default: null}
      snapshot_digest: {type: "char(64)", nullable: true, default: null}
      import_receipt_digest: {type: "char(64)", nullable: true, default: null}
      audit_event_id: {type: uuid, nullable: true, default: null}
      outbox_id: {type: uuid, nullable: true, default: null}
      imported_at: {type: timestamptz, nullable: true, default: null}
      counterparty_group_id: {type: uuid, nullable: true, default: null}
      counterparty_group_digest: {type: "char(64)", nullable: true, default: null}
      grouping_state: {type: ops.funding_grouping_state, nullable: true, default: null}
      grouping_dispute_reason: {type: ops.funding_grouping_dispute_reason, nullable: true, default: null}
      grouping_evidence_digest: {type: "char(64)", nullable: true, default: null}
      member_supplier_ids: {type: "uuid[]", nullable: true, default: null}
      member_supplier_identity_digests: {type: "char(64)[]", nullable: true, default: null}
      funding_source_kind: {type: ops.funding_source_kind, nullable: true, default: null}
      recognized_revenue: {type: "numeric(24,6)", nullable: true, default: null}
      binding_committed_revenue: {type: "numeric(24,6)", nullable: true, default: null}
      numerator: {type: "numeric(24,6)", nullable: true, default: null}
      concentration_share: {type: "numeric(24,6)", nullable: true, default: null}
      concentration_band: {type: editorial.funding_concentration_band, nullable: true, default: null}
      concentration_unknown_reason: {type: ops.funding_concentration_unknown_reason, nullable: true, default: null}
      government_related: {type: boolean, nullable: true, default: null}
      political_party_related: {type: boolean, nullable: true, default: null}
      procurement_supplier_related: {type: boolean, nullable: true, default: null}
      investigated_subject_related: {type: boolean, nullable: true, default: null}
      related_party: {type: boolean, nullable: true, default: null}
      related_case_ids: {type: "uuid[]", nullable: true, default: null}
      recognized_revenue_fact_ids: {type: "uuid[]", nullable: true, default: null}
      recognized_revenue_fact_digests: {type: "char(64)[]", nullable: true, default: null}
      recognized_revenue_fact_amounts: {type: "numeric(24,6)[]", nullable: true, default: null}
      binding_contract_period_ids: {type: "uuid[]", nullable: true, default: null}
      binding_contract_period_digests: {type: "char(64)[]", nullable: true, default: null}
      binding_contract_period_amounts: {type: "numeric(24,6)[]", nullable: true, default: null}
      external_funding_source_receipt_ids: {type: "uuid[]", nullable: true, default: null}
      external_funding_source_receipt_digests: {type: "char(64)[]", nullable: true, default: null}
      external_funding_source_signature_digests: {type: "char(64)[]", nullable: true, default: null}
      external_funding_source_kinds: {type: "ops.funding_source_kind[]", nullable: true, default: null}
      external_funding_amount_bases: {type: "ops.funding_amount_basis[]", nullable: true, default: null}
      external_funding_source_amounts: {type: "numeric(24,6)[]", nullable: true, default: null}
      entry_source_set_digest: {type: "char(64)", nullable: true, default: null}
      independent_review_requirement_digest: {type: "char(64)", nullable: true, default: null}
      entry_digest: {type: "char(64)", nullable: true, default: null}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: funding_snapshot_header_fk, columns: [header_id], references: "ops.funding_concentration_snapshots(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: funding_snapshot_prior_header_fk, columns: [prior_header_id], references: "ops.funding_concentration_snapshots(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: funding_snapshot_audit_fk, columns: [audit_event_id], references: "ops.audit_events(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: funding_snapshot_outbox_fk, columns: [outbox_id], references: "ops.outbox(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
    unique_constraints:
      - {name: funding_snapshot_batch_ordinal_uq, columns: [snapshot_batch_id, ordinal]}
      - {name: funding_snapshot_id_batch_uq, columns: [id, snapshot_batch_id]}
      - {name: funding_snapshot_header_binding_uq, columns: [id, snapshot_batch_id, snapshot_digest]}
      - {name: funding_snapshot_entry_binding_uq, columns: [id, snapshot_batch_id, entry_digest]}
      - {name: funding_snapshot_group_once_uq, columns: [header_id, counterparty_group_id]}
    checks:
      - {name: funding_snapshot_common_check, expression: "snapshot_version > 0 AND ordinal >= 0 AND fiscal_year BETWEEN 1 AND 9999 AND reporting_currency ~ '^[A-Z]{3}$' AND as_of <= created_at + interval '5 seconds'"}
      - name: funding_snapshot_row_shape_check
        expression: >-
          (row_kind = 'SNAPSHOT_HEADER' AND ordinal = 0 AND header_id IS NULL
           AND funding_policy_version IS NOT NULL AND funding_policy_digest IS NOT NULL
           AND fx_snapshot_digest IS NOT NULL AND denominator_state IS NOT NULL
           AND entry_count IS NOT NULL AND entry_set_digest IS NOT NULL
           AND source_set_digest IS NOT NULL AND snapshot_digest IS NOT NULL
           AND import_receipt_digest IS NOT NULL AND audit_event_id IS NOT NULL
           AND outbox_id IS NOT NULL AND imported_at IS NOT NULL
           AND counterparty_group_id IS NULL AND counterparty_group_digest IS NULL
           AND grouping_state IS NULL AND grouping_dispute_reason IS NULL
           AND grouping_evidence_digest IS NULL AND member_supplier_ids IS NULL
           AND member_supplier_identity_digests IS NULL AND funding_source_kind IS NULL
           AND recognized_revenue IS NULL AND binding_committed_revenue IS NULL
           AND numerator IS NULL AND concentration_share IS NULL
           AND concentration_band IS NULL AND concentration_unknown_reason IS NULL
           AND government_related IS NULL AND political_party_related IS NULL
           AND procurement_supplier_related IS NULL AND investigated_subject_related IS NULL
           AND related_party IS NULL
           AND related_case_ids IS NULL AND recognized_revenue_fact_ids IS NULL
           AND recognized_revenue_fact_digests IS NULL AND recognized_revenue_fact_amounts IS NULL
           AND binding_contract_period_ids IS NULL AND binding_contract_period_digests IS NULL
           AND binding_contract_period_amounts IS NULL
           AND external_funding_source_receipt_ids IS NULL
           AND external_funding_source_receipt_digests IS NULL
           AND external_funding_source_signature_digests IS NULL
           AND external_funding_source_kinds IS NULL AND external_funding_amount_bases IS NULL
           AND external_funding_source_amounts IS NULL AND entry_source_set_digest IS NULL
           AND independent_review_requirement_digest IS NULL AND entry_digest IS NULL)
          OR
          (row_kind = 'COUNTERPARTY_ENTRY' AND ordinal > 0 AND header_id IS NOT NULL
           AND prior_header_id IS NULL AND prior_snapshot_digest IS NULL
           AND funding_policy_version IS NULL AND funding_policy_digest IS NULL
           AND fx_snapshot_digest IS NULL AND denominator_amount IS NULL
           AND denominator_state IS NULL AND denominator_unknown_reason IS NULL
           AND denominator_approval_digest IS NULL AND denominator_approver_set_digest IS NULL
           AND denominator_approved_at IS NULL AND denominator_approval_expires_at IS NULL
           AND entry_count IS NULL AND entry_set_digest IS NULL AND source_set_digest IS NULL
           AND snapshot_digest IS NULL AND import_receipt_digest IS NULL
           AND audit_event_id IS NULL AND outbox_id IS NULL AND imported_at IS NULL
           AND counterparty_group_id IS NOT NULL AND counterparty_group_digest IS NOT NULL
           AND grouping_state IS NOT NULL AND grouping_evidence_digest IS NOT NULL
           AND member_supplier_ids IS NOT NULL AND member_supplier_identity_digests IS NOT NULL
           AND funding_source_kind IS NOT NULL AND recognized_revenue IS NOT NULL
           AND binding_committed_revenue IS NOT NULL AND numerator IS NOT NULL
           AND concentration_band IS NOT NULL AND government_related IS NOT NULL
           AND political_party_related IS NOT NULL AND procurement_supplier_related IS NOT NULL
           AND investigated_subject_related IS NOT NULL AND related_party IS NOT NULL
           AND related_case_ids IS NOT NULL
           AND recognized_revenue_fact_ids IS NOT NULL
           AND recognized_revenue_fact_digests IS NOT NULL
           AND recognized_revenue_fact_amounts IS NOT NULL
           AND binding_contract_period_ids IS NOT NULL
           AND binding_contract_period_digests IS NOT NULL
           AND binding_contract_period_amounts IS NOT NULL
           AND external_funding_source_receipt_ids IS NOT NULL
           AND external_funding_source_receipt_digests IS NOT NULL
           AND external_funding_source_signature_digests IS NOT NULL
           AND external_funding_source_kinds IS NOT NULL
           AND external_funding_amount_bases IS NOT NULL
           AND external_funding_source_amounts IS NOT NULL
           AND entry_source_set_digest IS NOT NULL
           AND independent_review_requirement_digest IS NOT NULL AND entry_digest IS NOT NULL)
      - name: funding_snapshot_header_chain_check
        expression: >-
          row_kind <> 'SNAPSHOT_HEADER' OR
          ((snapshot_version = 1 AND prior_header_id IS NULL AND prior_snapshot_digest IS NULL)
           OR (snapshot_version > 1 AND prior_header_id IS NOT NULL
            AND prior_snapshot_digest IS NOT NULL AND prior_snapshot_digest ~ '^[0-9a-f]{64}$'))
      - name: funding_snapshot_denominator_check
        expression: >-
          row_kind <> 'SNAPSHOT_HEADER' OR
          (denominator_state = 'APPROVED' AND denominator_amount IS NOT NULL AND denominator_amount > 0
           AND denominator_unknown_reason IS NULL
           AND denominator_approval_digest IS NOT NULL AND denominator_approval_digest ~ '^[0-9a-f]{64}$'
           AND denominator_approver_set_digest IS NOT NULL AND denominator_approver_set_digest ~ '^[0-9a-f]{64}$'
           AND denominator_approved_at IS NOT NULL
           AND denominator_approved_at <= as_of
           AND denominator_approval_expires_at IS NOT NULL
           AND denominator_approval_expires_at > denominator_approved_at
           AND as_of < denominator_approval_expires_at)
          OR
          (denominator_state = 'UNKNOWN' AND denominator_unknown_reason IS NOT NULL AND (
             (denominator_unknown_reason = 'MISSING' AND denominator_amount IS NULL
              AND denominator_approval_digest IS NULL AND denominator_approver_set_digest IS NULL
              AND denominator_approved_at IS NULL AND denominator_approval_expires_at IS NULL)
             OR (denominator_unknown_reason = 'ZERO' AND denominator_amount IS NOT NULL AND denominator_amount = 0
              AND denominator_approval_digest IS NULL AND denominator_approver_set_digest IS NULL
              AND denominator_approved_at IS NULL AND denominator_approval_expires_at IS NULL)
             OR (denominator_unknown_reason = 'APPROVAL_MISSING' AND denominator_amount IS NOT NULL AND denominator_amount > 0
              AND denominator_approval_digest IS NULL AND denominator_approver_set_digest IS NULL
              AND denominator_approved_at IS NULL AND denominator_approval_expires_at IS NULL)
             OR (denominator_unknown_reason = 'APPROVAL_STALE'
              AND denominator_amount IS NOT NULL AND denominator_amount > 0
              AND denominator_approval_digest IS NOT NULL AND denominator_approval_digest ~ '^[0-9a-f]{64}$'
              AND denominator_approver_set_digest IS NOT NULL AND denominator_approver_set_digest ~ '^[0-9a-f]{64}$'
              AND denominator_approved_at IS NOT NULL
              AND denominator_approved_at <= as_of
              AND denominator_approval_expires_at IS NOT NULL
              AND denominator_approval_expires_at > denominator_approved_at
              AND as_of >= denominator_approval_expires_at)))
      - {name: funding_snapshot_header_count_check, expression: "row_kind <> 'SNAPSHOT_HEADER' OR entry_count >= 0"}
      - {name: funding_snapshot_header_time_check, expression: "row_kind <> 'SNAPSHOT_HEADER' OR (as_of <= imported_at AND imported_at <= created_at + interval '5 seconds')"}
      - {name: funding_snapshot_policy_check, expression: "row_kind <> 'SNAPSHOT_HEADER' OR (funding_policy_version IS NOT NULL AND length(btrim(funding_policy_version)) BETWEEN 1 AND 128 AND funding_policy_digest IS NOT NULL AND funding_policy_digest ~ '^[0-9a-f]{64}$')"}
      - {name: funding_snapshot_amount_check, expression: "row_kind <> 'COUNTERPARTY_ENTRY' OR (recognized_revenue >= 0 AND binding_committed_revenue >= 0 AND numerator = recognized_revenue + binding_committed_revenue)"}
      - {name: funding_snapshot_member_pair_check, expression: "row_kind <> 'COUNTERPARTY_ENTRY' OR (cardinality(member_supplier_ids) = cardinality(member_supplier_identity_digests) AND cardinality(member_supplier_ids) <= 10000)"}
      - name: funding_snapshot_source_fact_check
        expression: >-
          row_kind <> 'COUNTERPARTY_ENTRY' OR
          (cardinality(recognized_revenue_fact_ids) = cardinality(recognized_revenue_fact_digests)
           AND cardinality(recognized_revenue_fact_ids) = cardinality(recognized_revenue_fact_amounts)
           AND cardinality(binding_contract_period_ids) = cardinality(binding_contract_period_digests)
           AND cardinality(binding_contract_period_ids) = cardinality(binding_contract_period_amounts)
           AND cardinality(external_funding_source_receipt_ids) = cardinality(external_funding_source_receipt_digests)
           AND cardinality(external_funding_source_receipt_ids) = cardinality(external_funding_source_signature_digests)
           AND cardinality(external_funding_source_receipt_ids) = cardinality(external_funding_source_kinds)
           AND cardinality(external_funding_source_receipt_ids) = cardinality(external_funding_amount_bases)
           AND cardinality(external_funding_source_receipt_ids) = cardinality(external_funding_source_amounts)
           AND cardinality(recognized_revenue_fact_ids) + cardinality(binding_contract_period_ids)
             + cardinality(external_funding_source_receipt_ids) BETWEEN 1 AND 10000)
      - {name: funding_snapshot_entry_source_digest_check, expression: "row_kind <> 'COUNTERPARTY_ENTRY' OR (entry_source_set_digest IS NOT NULL AND entry_source_set_digest ~ '^[0-9a-f]{64}$')"}
      - {name: funding_snapshot_related_case_check, expression: "row_kind <> 'COUNTERPARTY_ENTRY' OR cardinality(related_case_ids) <= 10000"}
      - name: funding_snapshot_grouping_check
        expression: >-
          row_kind <> 'COUNTERPARTY_ENTRY' OR
          (grouping_state = 'RESOLVED' AND grouping_dispute_reason IS NULL)
          OR
          (grouping_state = 'DISPUTED' AND grouping_dispute_reason IS NOT NULL
           AND concentration_share IS NULL AND concentration_band = 'UNKNOWN'
           AND concentration_unknown_reason IS NOT NULL
           AND concentration_unknown_reason = 'GROUPING_DISPUTED')
      - name: funding_snapshot_concentration_check
        expression: >-
          row_kind <> 'COUNTERPARTY_ENTRY' OR
          (concentration_band = 'UNKNOWN' AND concentration_share IS NULL
           AND concentration_unknown_reason IS NOT NULL)
          OR
          (concentration_band IN ('LE_5_PERCENT','GT_5_TO_15_PERCENT','GT_15_TO_25_PERCENT','GT_25_PERCENT')
           AND concentration_unknown_reason IS NULL
           AND concentration_share IS NOT NULL AND concentration_share >= 0)
      - name: funding_snapshot_scalar_digest_check
        expression: >-
          (prior_snapshot_digest IS NULL OR prior_snapshot_digest ~ '^[0-9a-f]{64}$')
          AND (funding_policy_digest IS NULL OR funding_policy_digest ~ '^[0-9a-f]{64}$')
          AND (fx_snapshot_digest IS NULL OR fx_snapshot_digest ~ '^[0-9a-f]{64}$')
          AND (entry_set_digest IS NULL OR entry_set_digest ~ '^[0-9a-f]{64}$')
          AND (source_set_digest IS NULL OR source_set_digest ~ '^[0-9a-f]{64}$')
          AND (snapshot_digest IS NULL OR snapshot_digest ~ '^[0-9a-f]{64}$')
          AND (import_receipt_digest IS NULL OR import_receipt_digest ~ '^[0-9a-f]{64}$')
          AND (counterparty_group_digest IS NULL OR counterparty_group_digest ~ '^[0-9a-f]{64}$')
          AND (grouping_evidence_digest IS NULL OR grouping_evidence_digest ~ '^[0-9a-f]{64}$')
          AND (entry_source_set_digest IS NULL OR entry_source_set_digest ~ '^[0-9a-f]{64}$')
          AND (independent_review_requirement_digest IS NULL OR independent_review_requirement_digest ~ '^[0-9a-f]{64}$')
          AND (entry_digest IS NULL OR entry_digest ~ '^[0-9a-f]{64}$')
    indexes:
      - {name: funding_snapshot_header_batch_uq, method: btree, columns: [snapshot_batch_id], unique: true, where: "row_kind = 'SNAPSHOT_HEADER'"}
      - {name: funding_snapshot_fiscal_version_uq, method: btree, columns: [fiscal_year, snapshot_version], unique: true, where: "row_kind = 'SNAPSHOT_HEADER'"}
      - {name: funding_snapshot_digest_uq, method: btree, columns: [snapshot_digest], unique: true, where: "row_kind = 'SNAPSHOT_HEADER'"}
      - {name: funding_snapshot_latest_idx, method: btree, columns: [fiscal_year, as_of DESC, snapshot_version DESC, id DESC], unique: false, where: "row_kind = 'SNAPSHOT_HEADER'"}
      - {name: funding_snapshot_entry_order_idx, method: btree, columns: [header_id, ordinal, id], unique: false, where: "row_kind = 'COUNTERPARTY_ENTRY'"}
      - {name: funding_snapshot_group_history_idx, method: btree, columns: [counterparty_group_digest, fiscal_year DESC, as_of DESC, id DESC], unique: false, where: "row_kind = 'COUNTERPARTY_ENTRY'"}
      - {name: funding_snapshot_related_cases_idx, method: gin, columns: [related_case_ids], unique: false, where: "row_kind = 'COUNTERPARTY_ENTRY' AND cardinality(related_case_ids) > 0"}
      - {name: funding_snapshot_prior_header_fk_idx, method: btree, columns: [prior_header_id, id], unique: false, where: "prior_header_id IS NOT NULL"}
      - {name: funding_snapshot_audit_fk_idx, method: btree, columns: [audit_event_id, id], unique: false, where: "audit_event_id IS NOT NULL"}
      - {name: funding_snapshot_outbox_fk_idx, method: btree, columns: [outbox_id, id], unique: false, where: "outbox_id IS NOT NULL"}
    grants:
      gurine_workflow_worker: [SELECT]
      gurine_control_api: [SELECT]
      gurine_auditor: [SELECT]
      gurine_public_projector: []
      gurine_public_api: []
      gurine_submission_api: []
      gurine_ingest_worker: []
      gurine_analysis_worker: []
      gurine_notification_worker: []
      gurine_scheduler: []
      gurine_document_extractor: []
      gurine_identity_api: []
      forbidden_for_all_runtime_roles: [INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER]
    function_grants:
      ops.import_funding_snapshot_v1: {gurine_workflow_worker: [EXECUTE]}
    rls:
      enabled: false
      forced: false
      policies: []
      rationale: Internal single-organization immutable governance fact; service-role grants and the funding/detection firewall are the scope boundary.
    mutability:
      mode: APPEND_ONLY_IMMUTABLE_SELF_GRAPH
      allowed_updates: []
      delete: FORBIDDEN
      immutable_trigger: ops.reject_mutation()
      deferred_graph_trigger: ops.validate_funding_snapshot_graph_at_commit()
      version_rule: Header snapshot_version is exactly prior same-fiscal-year version plus one; child version, batch, year, as-of and currency equal the header.
      digest_rule: entry_digest covers the canonical scalar entry including ordered arrays; entry_set_digest covers entry_digest by ordinal; snapshot_digest covers header fields plus entry_set_digest and excludes database timestamps and row UUIDs not declared in the import identity.
      correction_rule: A changed fact creates a new snapshot_batch_id and next snapshot_version; an existing batch with the same digest returns the stored graph and an existing batch with a different digest is FACT_CONFLICT.
    retention:
      record_class: FUNDING_GOVERNANCE_SNAPSHOT
      trigger: Creation; supersession changes current selection but never starts a destruction clock.
      schedule_binding: Latest effective nonexpired ops.record_class_schedules revision for FUNDING_GOVERNANCE_SNAPSHOT.
      legal_hold_key: [relation, snapshot_batch_id, id]
      backup_behavior: Preserve the immutable graph; on restore apply restoration suppressions and the union of RETENTION, DELETION and DISCLOSURE hold cells before read, export or projection.
      terminal_action: PRESERVE_PUBLIC_REVISION
    repository:
      roundtrip:
        - Insert one header and zero or more entries using boundary numeric values and non-default UUIDs.
        - Read through FundingConcentrationSnapshotHeaderRow and FundingConcentrationSnapshotEntryRow without select-star or synthesized defaults.
        - Preserve numeric(24,6), null versus zero denominator, array order, boolean flags and lowercase digest bytes exactly.
        - Reject missing header, wrong entry_count, ordinal gap, duplicate group, unknown enum, invalid member/source digest, missing supplier/case identity and digest mismatch as typed stored-data corruption.
      detail_cardinality: Exactly one header and exactly entry_count entries or FUNDING_SNAPSHOT_CORRUPT.
      append_replay: Same snapshot_batch_id plus canonical request digest returns the stored graph and receipt; changed bytes return FACT_CONFLICT.
      ordering:
        graph: row_kind header first, then ordinal ASC, id ASC
        entries: ordinal ASC, id ASC
        history: fiscal_year DESC, snapshot_version DESC, as_of DESC, snapshot_batch_id DESC
        ordered_arrays: Member supplier IDs, recognized revenue fact IDs, binding contract-period IDs, external funding receipt IDs, related case IDs and every paired kind, basis, amount, signature and digest array use the corresponding UUID byte order ASC before canonical hashing.
      transaction:
        isolation: SERIALIZABLE
        lock_order: Prior fiscal-year header, new header, entries by ordinal, audit chain head, outbox.
        atomicity: Header, complete entry graph, audit append, governance.funding_snapshot_created.v1 outbox and immutable import receipt commit or roll back together.

  editorial.funding_disclosure_revisions:
