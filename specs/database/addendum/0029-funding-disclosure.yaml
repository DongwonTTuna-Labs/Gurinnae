      revision_digest:
        domain: GURINE_FUNDING_DISCLOSURE_REVISION_V1
        field_order: [id, disclosure_id, revision, prior_revision_id, prior_disclosure_id, prior_revision, prior_revision_digest, fiscal_year, fiscal_quarter, period_start, period_end, snapshot_header_id, snapshot_batch_id, snapshot_digest, funding_policy_version, funding_policy_digest, naming_threshold_amount, amount_band_lower, amount_band_upper, reporting_currency, concentration_band, quorum_class, requires_oversight_review, requires_board_approval, requires_enhanced_public_disclosure, has_related_party_gate, conditional_gate_set_digest, unknown_reason, public_caveat_text, purpose, conflict_summary, policy_request_total, policy_request_accepted, policy_request_partially_accepted, policy_request_rejected, policy_request_withdrawn, policy_request_pending, policy_request_outcome_digest, source_link_set_digest, entry_count, entry_set_digest, policy_snapshot_digest, conflict_snapshot_id, conflict_snapshot_digest, quorum_snapshot_digest, public_content_digest, proposal_id, proposal_version, execution_id, execution_generation, approval_digest, execution_digest, preparer_decision_id, publisher_decision_id, oversight_decision_id, board_decision_id, independent_case_review_decision_ids, independent_case_review_set_digest, decision_receipt_set_digest, prepared_by_user_id, published_by_user_id, oversight_reviewer_user_id, board_approver_user_id, effective_at, published_at, execution_receipt_id, receipt_digest, audit_event_id, outbox_id]
        excluded: [revision_digest, created_at]
      public_content_digest: Covers only the source-read allowlist and ordered public entries; changing a private-only actor/audit pointer changes revision_digest but not public_content_digest unless the authorized public representation changes.
