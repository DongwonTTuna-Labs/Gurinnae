      gurine_document_extractor: []
      gurine_identity_api: []
      forbidden_for_all_runtime_roles: [INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER]
    function_grants:
      editorial.publish_funding_disclosure_v1: {gurine_workflow_worker: [EXECUTE]}
      editorial.read_public_funding_projection_inputs_v1: {gurine_public_projector: [EXECUTE]}
    rls:
      enabled: false
      forced: false
      policies: []
      rationale: Immutable child of an internal approval-bound disclosure revision; anonymous access is only through a rights-filtered public projection.
    mutability:
      mode: APPEND_ONLY_IMMUTABLE_MEMBERSHIP
      allowed_updates: []
      delete: FORBIDDEN
      immutable_trigger: ops.reject_mutation()
      digest_rule: entry_digest covers ordinal, exact ordered source entry identities and digests, identity mode, public strings, bands, relationship flags, related cases, review decisions, evidence IDs and source-link digest.
      correction_rule: Entries of a published revision are never changed; corrections append a complete replacement set under the next revision.
    retention:
      record_class: FUNDING_PUBLIC_DISCLOSURE_ENTRY
      trigger: Owning public revision preservation rule.
      schedule_binding: Latest effective nonexpired ops.record_class_schedules revision for FUNDING_PUBLIC_DISCLOSURE_ENTRY.
      legal_hold_key: [relation, revision_id, id, snapshot_batch_id]
      backup_behavior: Preserve with the owning revision; after restore re-evaluate rights, restoration suppression and DISCLOSURE holds before projection or export.
      terminal_action: PRESERVE_PUBLIC_REVISION
    repository:
      roundtrip:
        - Round-trip exact ordered UUID/digest arrays, null public name and unbounded upper amount band through FundingDisclosureEntryRow.
        - Validate every source snapshot entry ID/digest against the exact snapshot batch and every evidence/case/decision ID against its concrete table in the publish transaction.
        - Reject duplicate, missing or multiply consumed source snapshot entries and any reordered entry set before commit.
      detail_cardinality: Exactly one row per parent ordinal from 1 through parent entry_count.
      ordering:
        parent: ordinal ASC, id ASC
        source_snapshot_entries: source snapshot ordinal ASC, source entry id ASC
        related_cases: UUID byte order ASC
        review_decisions: related case UUID byte order ASC, action decision id ASC

public_projection_contract:
  source_read_function:
    name: editorial.read_public_funding_projection_inputs_v1
    signature: "editorial.read_public_funding_projection_inputs_v1(uuid,char(64)) RETURNS SETOF editorial.funding_public_projection_input_v1"
    owner: gurine_migrator
    security: SECURITY_DEFINER
    search_path: [pg_catalog, editorial, ops, public, pg_temp]
    execute_roles: []
    public_execute: revoked
    lock_and_verify:
      - Lock the exact revision ID and expected revision digest plus its complete ordered entry set; reject stale/mismatched source, incomplete cardinality or noncurrent rights/source-link policy.
      - Recompute revision, public-content, entry-set, conditional-gate and every public entry digest; active DISCLOSURE hold or unresolved rights blocks the row set without exposing whether private source data exists.
      - Resolve related internal case/evidence UUIDs only through approved public projection identifiers and rights-filtered source links; raw UUIDs and withheld identities never leave the function.
    return_allowlist:
      revision: [disclosure_id, revision, prior_revision, fiscal_year, fiscal_quarter, period_start, period_end, reporting_currency, concentration_band, unknown_reason, public_caveat_text, purpose, policy_request_total, policy_request_accepted, policy_request_partially_accepted, policy_request_rejected, policy_request_withdrawn, policy_request_pending, policy_request_outcome_digest, source_link_set_digest, entry_count, entry_set_digest, funding_policy_version, funding_policy_digest, effective_at, published_at, public_content_digest, revision_digest, requires_enhanced_public_disclosure]
      entry: [ordinal, identity_disclosure_mode, public_display_name, withholding_public_explanation, counterparty_category, funding_source_kind, amount_band_lower, amount_band_upper, reporting_currency, concentration_band, denominator_unknown_reason, grouping_dispute_reason, concentration_unknown_reason, public_caveat_text, purpose, conflict_disclosure, mitigation_summary, government_related, political_party_related, procurement_supplier_related, investigated_subject_related, related_party, public_case_refs, public_source_links, entry_digest]
    forbidden: [snapshot_header_id, snapshot_batch_id, source_snapshot_entry_ids, counterparty_group_id, member_supplier_ids, recognized_revenue_fact_ids, contract_period_ids, external_receipt_ids, evidence_ids, action_decision_ids, user_ids, proposal_id, execution_id, conflict_snapshot_id, audit_event_id, outbox_id, raw_source_url, private_case_id]
  existing_public_relation_hardening:
    relation: public.transparency_reports
    migration: 0029_product_economics.sql
    additive_columns:
      report_kind: {type: text, nullable: false, default: "'GENERAL'::text", historical_backfill: GENERAL}
      source_revision_id: {type: uuid, nullable: true}
      source_disclosure_id: {type: uuid, nullable: true}
      source_revision: {type: bigint, nullable: true}
      source_revision_digest: {type: "char(64)", nullable: true}
      supersedes_report_id: {type: uuid, nullable: true}
      report_schema_version: {type: bigint, nullable: true}
      projection_digest: {type: "char(64)", nullable: true}
