      board_approver_user_id: {type: uuid, nullable: true, default: null}
      effective_at: {type: timestamptz, nullable: false, default: null}
      published_at: {type: timestamptz, nullable: false, default: null}
      execution_receipt_id: {type: uuid, nullable: false, default: null}
      receipt_digest: {type: "char(64)", nullable: false, default: null}
      revision_digest: {type: "char(64)", nullable: false, default: null}
      audit_event_id: {type: uuid, nullable: false, default: null}
      outbox_id: {type: uuid, nullable: false, default: null}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: funding_disclosure_snapshot_fk, columns: [snapshot_header_id, snapshot_batch_id, snapshot_digest], references: "ops.funding_concentration_snapshots(id,snapshot_batch_id,snapshot_digest)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_prior_fk, columns: [prior_revision_id, prior_disclosure_id, prior_revision, prior_revision_digest], references: "editorial.funding_disclosure_revisions(id,disclosure_id,revision,revision_digest)", on_delete: RESTRICT, match: FULL, deferrable: true, initially: DEFERRED}
      - {name: funding_disclosure_proposal_fk, columns: [proposal_id, proposal_version, approval_digest], references: "ops.action_proposal_versions(proposal_id,version,approval_digest)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_authorization_fk, columns: [execution_id, execution_generation], references: "ops.execution_authorizations(execution_id,generation)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_preparer_decision_fk, columns: [preparer_decision_id], references: "ops.action_decisions(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_publisher_decision_fk, columns: [publisher_decision_id], references: "ops.action_decisions(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_oversight_decision_fk, columns: [oversight_decision_id], references: "ops.action_decisions(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_board_decision_fk, columns: [board_decision_id], references: "ops.action_decisions(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_preparer_user_fk, columns: [prepared_by_user_id], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_publisher_user_fk, columns: [published_by_user_id], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_oversight_user_fk, columns: [oversight_reviewer_user_id], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_board_user_fk, columns: [board_approver_user_id], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_conflict_snapshot_fk, columns: [conflict_snapshot_id], references: "editorial.conflict_snapshots(id)", on_delete: RESTRICT, deferrable: false}
      - {name: funding_disclosure_execution_receipt_fk, columns: [execution_receipt_id], references: "ops.execution_receipts(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: funding_disclosure_audit_fk, columns: [audit_event_id], references: "ops.audit_events(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: funding_disclosure_outbox_fk, columns: [outbox_id], references: "ops.outbox(id)", on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
    unique_constraints:
      - {name: funding_disclosure_series_revision_uq, columns: [disclosure_id, revision]}
      - {name: funding_disclosure_entry_parent_identity_uq, columns: [id, disclosure_id, revision]}
      - {name: funding_disclosure_chain_reference_uq, columns: [id, disclosure_id, revision, revision_digest]}
      - {name: funding_disclosure_quarter_revision_uq, columns: [fiscal_year, fiscal_quarter, revision]}
      - {name: funding_disclosure_execution_uq, columns: [execution_id, execution_generation]}
      - {name: funding_disclosure_receipt_uq, columns: [receipt_digest]}
      - {name: funding_disclosure_revision_digest_uq, columns: [revision_digest]}
      - {name: funding_disclosure_public_source_uq, columns: [id, revision_digest]}
      - {name: funding_disclosure_entry_parent_uq, columns: [id, disclosure_id, revision, entry_set_digest]}
    checks:
      - {name: funding_disclosure_identity_check, expression: "revision > 0 AND proposal_version > 0 AND execution_generation > 0 AND fiscal_year BETWEEN 1 AND 9999 AND fiscal_quarter BETWEEN 1 AND 4"}
      - {name: funding_disclosure_period_check, expression: "period_start < period_end AND period_end <= published_at::date"}
      - name: funding_disclosure_prior_check
        expression: >-
          (revision = 1 AND prior_revision_id IS NULL AND prior_disclosure_id IS NULL
           AND prior_revision IS NULL AND prior_revision_digest IS NULL)
          OR
          (revision > 1 AND prior_revision_id IS NOT NULL AND prior_disclosure_id IS NOT NULL
           AND prior_disclosure_id = disclosure_id AND prior_revision IS NOT NULL
           AND prior_revision = revision - 1 AND prior_revision_digest IS NOT NULL
           AND prior_revision_digest ~ '^[0-9a-f]{64}$')
      - {name: funding_disclosure_amount_band_check, expression: "naming_threshold_amount >= 0 AND amount_band_lower >= 0 AND (amount_band_upper IS NULL OR amount_band_upper > amount_band_lower) AND reporting_currency ~ '^[A-Z]{3}$'"}
      - {name: funding_disclosure_policy_check, expression: "length(btrim(funding_policy_version)) BETWEEN 1 AND 128 AND funding_policy_digest ~ '^[0-9a-f]{64}$'"}
      - name: funding_disclosure_unknown_check
        expression: >-
          (concentration_band = 'UNKNOWN' AND unknown_reason IS NOT NULL
           AND public_caveat_text IS NOT NULL AND length(btrim(public_caveat_text)) BETWEEN 1 AND 2000)
          OR
          (concentration_band <> 'UNKNOWN' AND unknown_reason IS NULL AND public_caveat_text IS NULL)
      - {name: funding_disclosure_text_check, expression: "length(btrim(purpose)) BETWEEN 1 AND 4000 AND length(btrim(conflict_summary)) BETWEEN 1 AND 8000"}
      - name: funding_disclosure_policy_count_check
        expression: >-
          policy_request_total >= 0 AND policy_request_accepted >= 0
          AND policy_request_partially_accepted >= 0 AND policy_request_rejected >= 0
          AND policy_request_withdrawn >= 0 AND policy_request_pending >= 0
          AND policy_request_total = policy_request_accepted + policy_request_partially_accepted
            + policy_request_rejected + policy_request_withdrawn + policy_request_pending
      - {name: funding_disclosure_entry_count_check, expression: "entry_count >= 0"}
      - {name: funding_disclosure_base_sod_check, expression: "preparer_decision_id <> publisher_decision_id AND prepared_by_user_id <> published_by_user_id"}
      - {name: funding_disclosure_conditional_pair_check, expression: "(oversight_decision_id IS NULL) = (oversight_reviewer_user_id IS NULL) AND (board_decision_id IS NULL) = (board_approver_user_id IS NULL)"}
      - name: funding_disclosure_actor_pairwise_check
        expression: "(oversight_reviewer_user_id IS NULL OR (oversight_reviewer_user_id <> prepared_by_user_id AND oversight_reviewer_user_id <> published_by_user_id)) AND (board_approver_user_id IS NULL OR (board_approver_user_id <> prepared_by_user_id AND board_approver_user_id <> published_by_user_id AND (oversight_reviewer_user_id IS NULL OR board_approver_user_id <> oversight_reviewer_user_id))) AND (oversight_decision_id IS NULL OR (oversight_decision_id <> preparer_decision_id AND oversight_decision_id <> publisher_decision_id)) AND (board_decision_id IS NULL OR (board_decision_id <> preparer_decision_id AND board_decision_id <> publisher_decision_id AND (oversight_decision_id IS NULL OR board_decision_id <> oversight_decision_id)))"
      - name: funding_disclosure_conditional_gate_shape_check
        expression: "(requires_board_approval = false OR requires_oversight_review = true) AND (requires_enhanced_public_disclosure = false OR requires_board_approval = true) AND ((requires_oversight_review AND oversight_decision_id IS NOT NULL) OR (NOT requires_oversight_review AND oversight_decision_id IS NULL)) AND ((requires_board_approval AND board_decision_id IS NOT NULL) OR (NOT requires_board_approval AND board_decision_id IS NULL))"
      - name: funding_disclosure_threshold_approval_check
        expression: >-
          (concentration_band IN ('LE_5_PERCENT','GT_5_TO_15_PERCENT')
           AND requires_oversight_review = false AND requires_board_approval = false
           AND requires_enhanced_public_disclosure = false)
          OR (concentration_band = 'GT_15_TO_25_PERCENT'
           AND requires_oversight_review = true AND requires_board_approval = false
           AND requires_enhanced_public_disclosure = false)
          OR (concentration_band IN ('GT_25_PERCENT','UNKNOWN')
           AND requires_oversight_review = true AND requires_board_approval = true
           AND requires_enhanced_public_disclosure = true)
      - name: funding_disclosure_quorum_class_check
        expression: >-
          (NOT requires_oversight_review AND NOT requires_board_approval
           AND ((NOT has_related_party_gate AND quorum_class = 'STANDARD')
             OR (has_related_party_gate AND quorum_class = 'RELATED_PARTY')))
          OR (requires_oversight_review AND NOT requires_board_approval
           AND ((NOT has_related_party_gate AND quorum_class = 'OVERSIGHT')
             OR (has_related_party_gate AND quorum_class = 'OVERSIGHT_RELATED_PARTY')))
          OR (requires_oversight_review AND requires_board_approval
           AND ((NOT has_related_party_gate AND quorum_class = 'BOARD')
             OR (has_related_party_gate AND quorum_class = 'BOARD_RELATED_PARTY')))
      - {name: funding_disclosure_case_review_array_check, expression: "cardinality(independent_case_review_decision_ids) <= 10000"}
      - name: funding_disclosure_digest_check
        expression: >-
          snapshot_digest ~ '^[0-9a-f]{64}$' AND funding_policy_digest ~ '^[0-9a-f]{64}$'
          AND policy_request_outcome_digest ~ '^[0-9a-f]{64}$'
          AND source_link_set_digest ~ '^[0-9a-f]{64}$' AND entry_set_digest ~ '^[0-9a-f]{64}$'
          AND policy_snapshot_digest ~ '^[0-9a-f]{64}$' AND conflict_snapshot_digest ~ '^[0-9a-f]{64}$'
          AND quorum_snapshot_digest ~ '^[0-9a-f]{64}$'
          AND conditional_gate_set_digest ~ '^[0-9a-f]{64}$'
          AND public_content_digest ~ '^[0-9a-f]{64}$' AND approval_digest ~ '^[0-9a-f]{64}$'
          AND execution_digest ~ '^[0-9a-f]{64}$' AND independent_case_review_set_digest ~ '^[0-9a-f]{64}$'
          AND decision_receipt_set_digest ~ '^[0-9a-f]{64}$' AND receipt_digest ~ '^[0-9a-f]{64}$'
          AND revision_digest ~ '^[0-9a-f]{64}$'
      - {name: funding_disclosure_time_check, expression: "effective_at <= published_at AND published_at <= created_at + interval '5 seconds'"}
    indexes:
      - {name: funding_disclosure_latest_idx, method: btree, columns: [fiscal_year DESC, fiscal_quarter DESC, effective_at DESC, revision DESC, id DESC], unique: false}
      - {name: funding_disclosure_history_idx, method: btree, columns: [disclosure_id, revision ASC, id ASC], unique: false}
      - {name: funding_disclosure_snapshot_idx, method: btree, columns: [snapshot_batch_id, snapshot_digest, revision DESC, id DESC], unique: false}
      - {name: funding_disclosure_effective_idx, method: btree, columns: [effective_at DESC, id DESC], unique: false}
      - {name: funding_disclosure_conditional_gate_idx, method: btree, columns: [requires_board_approval, requires_oversight_review, has_related_party_gate, effective_at DESC, id DESC], unique: false}
      - {name: funding_disclosure_snapshot_fk_idx, method: btree, columns: [snapshot_header_id, snapshot_batch_id, snapshot_digest, id], unique: false}
