    - PERSON
    - AGENCY
    - PROCUREMENT_NOTICE
    - SANCTION
    person_shape:
      identity_resolution_status: PENDING_HUMAN
      stored_context_fields:
      - contextual_name
      - role_title
      - source_locator
      - identifier_digest
      - person_node_digest
      entity_binding: forbidden until a separate human identity decision
      forbidden_fields:
      - resident_registration_number
      - address
      - birth_date
      - sex
      - phone
      - family_relation
      - kinship
      - score
      - rank
      - probability
    nonperson_shape: entity id, positive revision, and digest are all required with identity_resolution_status NOT_APPLICABLE
    provenance_branches:
    - exact source document plus parser run plus parsed record
    - exact source document plus normalization run
    - exact same-run source use
    actor_shape: HUMAN plus matching user UUID or SERVICE plus exact actor ingest-worker
    canonical_rule: endpoint_canonical hashes to endpoint_digest and equals endpoint_payload
    trigger: relationship_graph_endpoints_v2_immutable_guard
    rls:
      enabled: false
      forced: false
      reason: immutable protected typed-graph endpoint read only by fixed internal roles
    retention:
