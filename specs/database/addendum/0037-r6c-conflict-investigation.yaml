  write_privileges: []
  relations:
    core.parser_runs:
    - id
    - source_document_id
    - parser_name
    - parser_version
    - status
    - input_content_sha256
    - output_digest
    - implementation_sha256
    - extraction_receipt_sha256
    core.parser_versions:
    - parser_name
    - version
    - supported_media_types
    - implementation_digest
    - status
  reason: the SECURITY DEFINER promotion owner re-binds the selected source segment to one successful parser run and one
    active parser implementation without receiving unrelated parser-table columns
hypothesis_preview_owner_acl:
  role: gurine_migrator
  relations:
    editorial.cases:
    - SELECT
    - UPDATE
    ops.agent_suggestions:
    - SELECT
    - UPDATE
  runtime_roles: []
  reason: the migration-owned SECURITY DEFINER preview authority must lock the accepted suggestion and its case while deriving
    the exact review preimage; no browser or runtime role receives direct access through this change
hypothesis_execution_owner_acl:
  role: gurine_migrator
  relations:
    editorial.hypotheses:
    - SELECT
    - INSERT
    ops.inbox:
    - UPDATE (processed_at, result) only
  runtime_roles: []
  direct_runtime_table_dml: forbidden
  reason: the SECURITY DEFINER executor needs INSERT plus SELECT for INSERT RETURNING on the legacy hypotheses relation, while
    PostgreSQL locking SELECT on inbox requires only the two ownership-column UPDATE privileges; no inbox UPDATE statement or
    runtime-role table grant is introduced
typed_relationship_runtime_schema_acl:
  role: gurine_identity_api
  schema: core
  privilege: USAGE
  callable_owner_routines:
  - core.record_typed_relationship_assertion_v2(jsonb)
  - core.decide_typed_relationship_assertion_v2(uuid,jsonb)
  direct_relation_privileges:
    SELECT: []
    INSERT: []
    UPDATE: []
    DELETE: []
  reason: 0016 revoked broad core access; schema USAGE restores only qualified owner-routine resolution while the routines'
    SECURITY DEFINER bodies retain all graph mutation authority
