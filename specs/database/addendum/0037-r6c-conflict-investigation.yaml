    - normalization_contract_sha256
    - source_use_agent_run_id
    - source_use_id
    - source_use_sha256
    - endpoint_payload
    - endpoint_canonical
    - endpoint_digest
    - created_actor_type
    - created_actor_id
    - created_by
    - created_at
    endpoint_kinds:
