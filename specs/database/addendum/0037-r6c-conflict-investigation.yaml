agent_run_v2_completion_binding:
  routine: ops.complete_agent_run_worker_v2
  success_requires_exactly_one:
    relation: ops.agent_output_validations
    bindings:
    - agent_run_id
    - provider_output_sha256
    - input_snapshot_sha256
    - output_schema_id
    - output_schema_version
    - output_schema_sha256
    statuses:
      validation_status: VALID
      schema_status: PASS
      citation_status: PASS
      policy_status: PASS
      run_terminal_status: SUCCEEDED
  success_effect: store the exact validation_id in agent_runs.output_validation_id before the terminal receipt and completion
    event are accepted
  missing_or_ambiguous: fail closed with no terminal transition
  non_success: FAILED, BUDGET_BLOCKED, and POLICY_BLOCKED retain null output_validation_id
  replay: the stored output_validation_id is part of the exact replay comparison
