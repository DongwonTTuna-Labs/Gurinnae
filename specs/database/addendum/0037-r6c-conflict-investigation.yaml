    - RELEASE
    accounting_rule: reserve increases reserved, settle increases settled without exceeding reserved, release decreases reserved,
      and no value becomes negative
    chain_rule: sequence one has no predecessor; every later sequence binds exactly the preceding sequence and receipt digest
    actor:
      type: SERVICE
      id: workflow-worker
    trigger: hypothesis_recursion_budget_ledger_immutable_guard
    rls:
      enabled: false
      forced: false
      reason: immutable internal recursion budget ledger exposed only to fixed internal roles
    retention:
      record_class: AGENT_RUNTIME_INITIATION_RECEIPT
      parent: ops.hypothesis_recursion_plans plus ops.hypothesis_recursion_nodes
      data_classification: no natural-person data is stored
      legal_hold_key: plan_id
      backup_behavior: restore after plan and node parents and before settlement proof
      terminal_action_rule: approved finite operational-audit schedule only
    repository: crates/persistence-postgres::hypothesis_recursion::HypothesisRecursionRepository
    repository_roundtrip:
      write: recursion owners append reserve, settle, and release entries
      read: resolve the ledger in sequence order
      assertions:
      - gapless predecessor chain, case and stage caps, and nonnegative conservation
      - one settlement per reservation plus SERVICE actor and canonical digest
      - immutable update and delete denial plus direct runtime DML denial
    grants:
      select:
      - gurine_analysis_worker
      - gurine_workflow_worker
      - gurine_control_api
      - gurine_auditor
      runtime_dml: []
    retention_trigger: hypothesis_recursion_budget_ledger_retention_guard
    columns:
      ledger_id:
        type: uuid
        nullable: false
        default: gen_random_uuid()
      plan_id:
        type: uuid
        nullable: false
      node_id:
        type: uuid
        nullable: false
      ledger_sequence:
        type: bigint
        nullable: false
      stage:
        type: text
        nullable: false
      entry_kind:
        type: text
        nullable: false
      amount_micros_krw:
        type: bigint
        nullable: false
      prior_reserved_micros_krw:
        type: bigint
        nullable: false
      next_reserved_micros_krw:
        type: bigint
        nullable: false
      prior_settled_micros_krw:
        type: bigint
        nullable: false
      next_settled_micros_krw:
        type: bigint
        nullable: false
      actor_type:
        type: text
        nullable: false
        default: '''SERVICE'''
      actor_id:
        type: text
        nullable: false
        default: '''workflow-worker'''
      prior_ledger_sequence:
        type: bigint
        nullable: true
      prior_receipt_sha256:
        type: char(64)
        nullable: true
      retention_schedule_id:
        type: uuid
        nullable: false
      retention_record_class:
        type: text
        nullable: false
      retention_schedule_digest:
        type: char(64)
        nullable: false
      ledger_payload:
        type: jsonb
        nullable: false
      ledger_canonical:
        type: bytea
        nullable: false
      receipt_sha256:
        type: char(64)
        nullable: false
      created_at:
        type: timestamptz
        nullable: false
        default: clock_timestamp()
    primary_key:
      name: hypothesis_recursion_budget_ledger_pk
      columns:
      - ledger_id
    uniques:
    - name: hypothesis_recursion_budget_ledger_sequence_uq
      columns:
      - plan_id
      - ledger_sequence
    - name: hypothesis_recursion_budget_ledger_chain_uq
      columns:
      - plan_id
      - ledger_sequence
      - receipt_sha256
    - name: hypothesis_recursion_budget_ledger_receipt_uq
      columns:
      - receipt_sha256
    foreign_keys:
    - name: hypothesis_recursion_budget_ledger_plan_fk
      columns:
      - plan_id
      references: ops.hypothesis_recursion_plans(plan_id)
      on_delete: RESTRICT
    - name: hypothesis_recursion_budget_ledger_node_fk
      columns:
      - node_id
      references: ops.hypothesis_recursion_nodes(node_id)
      on_delete: RESTRICT
    - name: hypothesis_recursion_budget_ledger_retention_fk
      columns:
      - retention_schedule_id
      - retention_record_class
      - retention_schedule_digest
      references: ops.record_class_schedules(id,record_class,schedule_digest)
      on_delete: RESTRICT
      match: FULL
    - name: hypothesis_recursion_budget_ledger_prior_fk
      columns:
      - plan_id
      - prior_ledger_sequence
      - prior_receipt_sha256
      references: ops.hypothesis_recursion_budget_ledger(plan_id,ledger_sequence,receipt_sha256)
      on_delete: RESTRICT
    checks:
    - name: hypothesis_recursion_budget_ledger_retention_ck
      expression: retention_record_class IS NULL OR retention_record_class = 'AGENT_RUNTIME_INITIATION_RECEIPT'
    - name: hypothesis_recursion_budget_ledger_shape_ck
      expression: ledger_sequence > 0 AND stage IN ('MARKET_RESEARCHER', 'SKEPTIC') AND entry_kind IN ('RESERVE', 'SETTLE',
        'RELEASE') AND amount_micros_krw >= 0 AND prior_reserved_micros_krw >= 0 AND next_reserved_micros_krw >= 0 AND prior_settled_micros_krw
        >= 0 AND next_settled_micros_krw >= 0 AND next_settled_micros_krw <= next_reserved_micros_krw AND actor_type = 'SERVICE'
        AND actor_id = 'workflow-worker' AND ((ledger_sequence = 1 AND prior_ledger_sequence IS NULL AND prior_receipt_sha256
        IS NULL) OR (ledger_sequence > 1 AND prior_ledger_sequence = (ledger_sequence - 1) AND prior_receipt_sha256 ~ '^[0-9a-f]{64}$'))
    - name: hypothesis_recursion_budget_ledger_entry_ck
      expression: (entry_kind = 'RESERVE' AND next_reserved_micros_krw = (prior_reserved_micros_krw + amount_micros_krw) AND
        next_settled_micros_krw = prior_settled_micros_krw) OR (entry_kind = 'SETTLE' AND next_reserved_micros_krw = prior_reserved_micros_krw
        AND next_settled_micros_krw = (prior_settled_micros_krw + amount_micros_krw)) OR (entry_kind = 'RELEASE' AND next_reserved_micros_krw
        = (prior_reserved_micros_krw - amount_micros_krw) AND next_settled_micros_krw = prior_settled_micros_krw)
    - name: hypothesis_recursion_budget_ledger_digest_ck
      expression: receipt_sha256 ~ '^[0-9a-f]{64}$' AND CAST(convert_from(ledger_canonical, 'UTF8') AS jsonb) = ledger_payload
        AND receipt_sha256 = encode(extensions.digest(ledger_canonical, 'sha256'), 'hex')
typed_graph_contract:
  endpoint_kind_set:
  - SUPPLIER
  - PERSON
  - AGENCY
  - PROCUREMENT_NOTICE
  - SANCTION
  relationship_kind_set:
  - OWNERSHIP
  - BENEFICIAL_OWNERSHIP
  - CONTROL
  - MANAGEMENT_ROLE
  - LEGAL_REPRESENTATIVE
  - CONTRACTUAL_RELATIONSHIP
  - BID_PARTICIPATION
  - SANCTION
  - FORMER_OFFICIAL_ROLE
  family_or_kinship_kind_exists: false
  proposal_only_rule: ingest-worker may append PENDING_HUMAN endpoints and assertion revision one; it cannot write VERIFIED,
    APPROVED, a verification decision, or a merge
  independent_review_rule: VERIFIED plus APPROVED requires a later immutable human decision by a reviewer distinct from the
    proposer
  public_read_rule: typed-neighbor v3 returns only snapshot-frozen COMPLETE, VERIFIED, APPROVED assertions with complete independent
    review fields
  person_output_rule: PERSON is returned as a snapshot- and run-bound personNodeRef digest, never a raw endpoint UUID, display
    name, identifier value, score, rank, or probability
  snapshot_source_use_rule: both endpoint sides require distinct exact TOOL_QUERY DATASET_MEMBER source uses bound to the
    frozen snapshot member sources
  compatibility_reader: relationship.neighbors request/response v2 remains supplier-only
  typed_reader:
    request_schema_version: relationship.neighbors.request.v3
    response_schema_version: relationship.neighbors.response.v3
    request_schema_sha256: 520f00d9ee779e33a31d9e1ce7d72088feea51bbe8a30ab9518b52789c897679
    response_schema_sha256: 63dd5666bdd34a681047f334ef02e22da7c9342fb97f38a0a572beeb4d209b29
    maximum_limit: 50
    relationship_filter: sorted unique subset of the closed nine-kind catalog
    snapshot_gate: exact RUNNING and ACTIVE AgentRunV2 plus exact READY AGENT_CASE snapshot id, generation, and digest
open_dart_parsed_record_provenance:
  writer: core.record_typed_relationship_endpoint_v2(jsonb)
  request_schema_version: typed-relationship-endpoint.record.request.v2
  request_exact_keys:
  - schemaVersion
  - endpointKind
  - contextualName
  - roleTitle
  - sourceKind
  - sourceLocator
  - identifierDigest
  - entityId
  - entityRevision
  - entityDigest
  - sourceDocument
  - operationId
  source_document_exact_keys:
  - id
  - assetId
  - assetRevision
  - contentSha256
  - parserRunId
  - parsedRecordId
  - parserVersion
  - parsedPayloadSha256
  exact_foreign_keys:
  - raw.source_documents(id,asset_id,asset_revision,content_sha256)
  - core.parser_runs(id,source_document_id)
  - raw.parsed_records(id,source_document_id,parser_run_id,parser_version,payload_sha256)
  person_source_kinds:
  - DART_EXECUTIVE_STATUS
  - ALIO_EXECUTIVE_STATUS
  - OFFICIAL_GAZETTE
  - PUBLIC_OFFICIAL_ETHICS_NOTICE
  open_dart_rule: DART executive rows preserve exact parsed-record identity and source locator and enter as distinct PENDING_HUMAN
    PERSON endpoints
  major_shareholder_rule: no typed graph row is emitted until OpenDART exposes an authoritative entity-type discriminator
    and a separate human identity mapping is approved
  normalization_run_requirement: parsed-record exact lineage is a complete accepted provenance branch; inventing a normalization
    run solely to satisfy graph insertion is forbidden
artifact_review_tier_contract:
  orthogonality: review tier never infers rights, publication approval, provider eligibility, or data classification
  initial_fetch: successful official FETCH_URL storage is RESTRICTED plus OFFICIAL_UNREVIEWED revision one
  internal_use: unreviewed artifact metadata and immutable digests may support internal hypothesis context only
  forbidden_before_promotion:
  - MODEL_INPUT
  - CLAIM_CITATION
  - COMMUNICATION_CITATION
  - PUBLIC_EXCERPT
  - PUBLICATION
  human_promotion: explicit reviewed classification plus exact artifact, predecessor receipt, promotion receipt, and human
    reviewer produces HUMAN_PROMOTED revision two
  public_promotion_rights_gate:
    required_primary_decisions:
      redistribution: ALLOW
      commercialUse: ALLOW
      publicDisplay: ALLOW
    missing_or_non_allow: fail closed with no promoted Evidence or review-tier successor
  parser_authority_gate:
  - exact source document, asset revision, and content digest
  - selected evidence segment and its source locator
  - SUCCEEDED parser run with exact input, output, implementation, and extraction receipt digests
  - ACTIVE parser version with exact implementation digest and supported media type
  mismatch: fail closed before Evidence, case-version, promotion, or review-tier mutation
  provider_input: only HUMAN_PROMOTED Evidence classified PUBLIC or INTERNAL may proceed to the existing provider rights and
    safety gates
  public_citation: only HUMAN_PROMOTED Evidence classified PUBLIC may proceed to the existing independent publication gate
  raw_artifact_model_egress: forbidden
  source_use_forward_rule: FETCH_URL root and derived source-use classifications must remain RESTRICTED until the human promotion
    path explicitly creates the promoted Evidence lineage
conflict_input_freeze_contract:
  producer: core.build_conflict_detection_dataset_snapshot_v2(uuid,uuid,bigint)
  reader: core.read_conflict_detection_input_v2(uuid,bigint,char(64),text,uuid)
  snapshot_kind: DETECTION_DATASET
  per_snapshot_cardinality: exactly one immutable conflict input for the exact rule version job
  common_frozen_sections:
  - contracts
  - suppliers
  - procurement_notices
  - procurement_awards
  - bidder_participations
  - sanctions
  - typed_relationship_assertions
  - strong_identifier_facts
  - coverage
  contract_amount_projection:
    source: core.contracts.current_amount
    canonical_json: SQL NULL remains JSON null; every nonnull numeric is trim_scale(current_amount)::text stored as a JSON string
    example: decimal 1.50 is the JSON string 1.5
    fractional_json_number: forbidden because PostgreSQL numeric and JSON number lexical forms do not provide the frozen cross-runtime
      decimal-string authority
    digest_rule: equal projected decimal strings replay the same input digest and any projected amount change changes the digest
  graph_eligibility: only head revisions that are COMPLETE, VERIFIED, APPROVED, independently human verified, source-authoritative,
    and exact-evidence-set complete
  strong_fact_eligibility: only KOREAN_BUSINESS_NUMBER, OPEN_DART_CORP_CODE, or KONEPS_PARTY_KEY with VERIFIED plus PROVEN_V1
    immutable fact lineage
  rule_inputs:
    OFFICER_OVERLAP_AWARD:
      authorities:
      - koneps-bid-results
      - open-dart dart-executive-status
      required_frozen_inputs:
      - procurement_awards
      - MANAGEMENT_ROLE assertions
      blocked_when: either source authority is not enabled and APPROVED
    OWNERSHIP_LINKED_COMPETITORS:
      authorities:
      - koneps-structured-bidder-participation
      required_frozen_inputs:
      - procurement_notices
      - bidder_participations
      - OWNERSHIP or CONTROL assertions
      blocked_when: structured bidder authority is unavailable
    BID_ROTATION:
      authorities:
      - koneps-structured-bidder-participation
      required_frozen_inputs:
      - procurement_notices
      - procurement_awards
      - bidder_participations including bid amount and rank
      blocked_when: structured participant authority is unavailable
    REVOLVING_DOOR_CONTRACT:
      authorities:
      - open-dart dart-executive-status
      - PUBLIC_OFFICIAL_ETHICS_NOTICE or OFFICIAL_GAZETTE
      required_frozen_inputs:
      - contracts
      - MANAGEMENT_ROLE assertions
      - FORMER_OFFICIAL_ROLE assertions with departed_on
      blocked_when: no approved official reemployment authority provides complete independently verified former-role assertions
    SANCTIONED_SUCCESSOR:
      authorities:
      - pps-sanctions
      required_frozen_inputs:
      - procurement_awards
      - SANCTION assertions
      - strong_identifier_facts
      - optional approved MANAGEMENT_ROLE link
      blocked_when: sanctions source activation receipt is not READY and its registry remains disabled
  canonicality: the input digest, ordered conflict-input set digest, selection digest, normalization authority, manifest digest,
    terminal receipt, and audit all commit the same rule version and input bytes
  replay: exact producer job replays the same READY snapshot only after validating the stored conflict input, graph-binding
    cardinality, set digest, and manifest digest
  frozen_relationship_reader: core.read_frozen_relationship_assertions_for_rule_v2(uuid,bigint,char(64),text,uuid)
  reader_output:
  - rule_id
  - rule_version_id
  - coverage_status
  - input_payload
  - input_canonical
  - input_sha256
  rule_binding:
    rule_version_digest: exact core.rule_versions.code_digest
    configuration_sha256: separately committed in producer canonical bytes and selection
    policy_validation: the complete rule_versions.configuration policy object must pass the exact-key required-threshold validator
      before snapshot creation
hypothesis_recursion_contract:
  start_event: action.execution_completed.v1 with execution state SUCCEEDED and action kind HYPOTHESIS
  root_authorization_chain:
  - exact execution authorization, effect, terminal receipt, outbox event, generation, state version, and receipt predecessor
  - approved HYPOTHESIS action proposal version plus exact typed HYPOTHESIS approval detail
  - ACCEPTED six-key canonical HYPOTHESIS suggestion with decision digest and USER agents.review success audit
  - originating investigator AgentRunV2 in SUCCEEDED plus SETTLED with one exact VALID output-validation binding
  - the complete supporting plus contradicting citation identity set bound to that suggestion, run, validation, snapshot, and
    hypothesis payload digest
  hypothesis_payload_contract:
    exact_keys:
    - kind
    - statement
    - supportingCitationIds
    - contradictingCitationIds
    - unknowns
    - limitations
    kind: HYPOTHESIS
    canonical_digest: exact accepted suggestion payload_canonical and payload_sha256
    market_researcher_binding: full payload plus digest are embedded in the canonical objective and plan; the digest is bound
      into the initial transcript, node, transition, and receipt chain
    skeptic_binding: the canonical plan revalidates the same payload and digest before scheduling
  parent_output_contract:
    required_stage: MARKET_RESEARCHER
    success_gate: the parent AgentRunV2 must be SUCCEEDED plus SETTLED and bound to one exact VALID output-validation row
    digest: canonical parent output payload SHA-256 equals the run output digest and transition proof
    skeptic_binding: the untrusted parent output payload plus digest are embedded in the canonical skeptic objective; the digest
      is bound into the initial transcript, node, transition, and receipt chain
  root_depth: 0
  child_depth: parent depth plus 1
  stages:
  - MARKET_RESEARCHER
  - SKEPTIC
  sequence: evidence gap starts MARKET_RESEARCHER; a successful market-researcher node must schedule SKEPTIC before any claim-drafter
    eligibility
  claim_drafter_automatic_execution: forbidden
  required_policy_fields:
  - maxDepth
  - caseBudgetMicrosKrw
  - marketResearcherStageBudgetMicrosKrw
  - skepticStageBudgetMicrosKrw
  - providerPolicyVersion
  - providerPolicySha256
  - providerClassification
  - providerCandidateIds
  - budgetPolicyVersion
  - budgetPolicySha256
  - maxProviderTurns
  - maxToolCalls
  - deadlineInterval
  - marketResearcherPrompt
  - marketResearcherOutputSchema
  - skepticPrompt
  - skepticOutputSchema
  default_policy: forbidden
  operating_seed: forbidden
  missing_or_disabled_policy: no recursion plan, node, agent run, or job
  budget_rule: reserve before scheduling; settle or release through the immutable ledger; case and stage limits are both mandatory
  dedupe_key:
  - caseId
  - hypothesisExecutionDigest
  - snapshotDigest
  - stage
  - depth
  actor:
    type: SERVICE
    id: workflow-worker
  producer_job_fence:
    job_type: EVENT_DELIVERY
    queue: workflow-worker
    required_state: RUNNING with exact nonexpired lease token and positive fencing token
    job_payload: exact eight-key event envelope bound to the outbox event identity, type, aggregate, version, occurrence time,
      and payload in the same transaction
    private_aliases:
    - ops.process_hypothesis_execution_completed_v1_unfenced_0037(jsonb,uuid)
    - ops.process_hypothesis_recursion_stage_completed_v1_unfenced_0037(jsonb,uuid)
    direct_execute: revoked from PUBLIC and gurine_workflow_worker; only the fenced migration-owned wrappers may delegate
  artifact_tier: OFFICIAL_UNREVIEWED may support internal hypothesis metadata only and cannot be cited publicly before human
    promotion
terminal_rule:
  exact_trigger_replay: only the same trigger identity, generation, digest, predecessor receipt, producer job, and canonical
    payload may replay an existing immutable receipt
  duplicate_dedupe_key: a different trigger cannot adopt or silently suppress an existing node; the unique dedupe key fails
    closed instead of creating a DUPLICATE_SUPPRESSED receipt
  invalid_stage_budget: fail closed without a receipt
  root_case_budget_blocked: append the bounded CASE_BUDGET_BLOCKED no-start receipt
  existing_plan_case_budget_blocked: append an immutable ACTIVE to BUDGET_EXHAUSTED plan transition bound to the policy and
    budget-ledger predecessor, then append the CASE_BUDGET_BLOCKED trigger receipt
  other_no_start_receipts: policy absent or disabled, depth cap, non-hypothesis, non-success, non-recursive node, wrong stage,
    failed run, and already-terminal plan remain explicit immutable dispositions
hypothesis_preview_forward_contract:
  compatibility:
    renamed_legacy_routine: ops.execute_action_approval_v1_legacy_0030(text,jsonb,uuid)
    wrapper_routine: ops.execute_action_approval_v1(text,jsonb,uuid)
    legacy_execute: revoked from PUBLIC and gurine_control_api; reachable only inside the migration-owned wrapper
    dispatch: only previewActionDraft, submitActionForReview, and submitActionDecision for an AgentProposalV2 HYPOTHESIS
      proposal enter the v2 authorities; AgentProposalV1, system-origin, missing-suggestion, every other command, and every
      other action kind delegate to the byte-preserved legacy owner
  accepted_authority:
    routine: ops.accepted_hypothesis_action_authority_v2(uuid,bigint)
    source: the exact accepted AgentProposalV2 HYPOTHESIS suggestion and requested proposal version
    requires:
    - six-key canonical HYPOTHESIS payload and digest
    - USER agents.review acceptance audit with exact details
    - exact proposal materialization audit and version binding
    - originating investigator AgentRunV2 plus exact VALID output validation
    - complete bidirectional citation set containing only bound EVIDENCE_SEGMENT citations
    returns:
    - case identity and expected version
    - statement, evidence, contrary-evidence, unknown, and action-detail digests
    - ordered evidence segment identifiers derived from the accepted citations
  preview_writer:
    routine: ops.preview_accepted_hypothesis_action_draft_v2(jsonb,uuid)
    mutation: atomically append the exact HYPOTHESIS review preview, binding, audit, receipt, and
      ops.action_approval_hypothesis_details row before human decision
    forbidden: synthetic statement, case, citation, evidence, unknown, or request-wide substitute digests; post-approval detail
      reconstruction; browser-side direct mutation
  review_submission_writer:
    routine: ops.submit_accepted_hypothesis_action_for_review_v2(jsonb,uuid)
    eligibility: choose one active user with an active role grant whose exact role has actions.review capability, ordered by
      reviewer UUID then role code, excluding the proposer and submitter
    mutation: append the strict v2 review assignment, STEP_UP conflict snapshot, SoD and primary quorum bindings, receipt, and
      audit while storing the selected real role code
    missing_reviewer: fail closed without assignment, review state, or receipt mutation
    generic_role_alias_seed: forbidden
  decision_writer:
    routine: ops.execute_accepted_hypothesis_action_decision_v2(jsonb,uuid)
    eligibility: only the strict AgentProposalV2 HYPOTHESIS proposal, current PENDING_QUORUM version, exact locked assignment,
      expected versions, and approval digest may enter the existing decision owner
    authority_revalidation: lock and revalidate the current CASE version, normalized six-key HYPOTHESIS detail, accepted
      authority, action-detail canonical bytes, approval binding, and denormalized supporting-evidence, contrary-evidence,
      and uncertainty digests before delegation
    delegated_effect: call the byte-preserved 0030 submitActionDecision owner in the same transaction so STEP_UP, SoD, quorum,
      ExecutionAuthorization, audit, receipt, and effect creation retain their existing authority
    mismatch: fail before decision, authorization, effect, receipt, audit, or outbox mutation
  replay: the same request and accepted authority tuple returns the exact stored receipt; any authority, reviewer, role, or
    request drift is a conflict
hypothesis_execution_contract:
  scope: execute only the approved AgentProposalV2 HYPOTHESIS DATABASE_ONLY createHypothesis effect created by the existing
    proposal, decision, and ExecutionAuthorization chain; no external provider or paid egress is permitted
  sealed_load:
    routine: ops.load_approved_hypothesis_execution_v1(uuid,uuid,bigint,uuid,bigint,jsonb)
    mutation: none
    returns: exact proposal id, proposal version, encrypted target draft, and target-request SHA-256 only after the active
      workflow-worker EVENT_DELIVERY lease, fencing token, inbox claim, outbox event, authorization, immutable decision,
      accepted authority, proposal detail, and receipt chain all agree
    fail_closed: malformed or stale event, job, inbox, authorization, proposal, draft, authority, or receipt state returns no
      sealed input and performs no DML
  executor:
    routine: ops.execute_approved_hypothesis_v1(uuid,uuid,bigint,uuid,bigint,jsonb,jsonb)
    preconditions: revalidate the sealed draft after decryption, exact accepted authority, terminal APPROVE decision, immutable
      authorization, active workflow-worker job lease and fence, dispatched inbox event, QUEUED effect and attempt, and current
      CASE version
    atomic_effect: in one transaction append the lease-claim and dispatch receipts, insert one OPEN hypothesis, increment the
      CASE version, append the SERVICE/workflow-worker terminal audit and immutable EFFECT_SUCCEEDED receipt, emit
      action.execution_completed.v1, and terminalize the attempt and effect
    hypothesis_creator: the terminal human reviewer who issued the quorum-satisfying APPROVE decision; the workflow worker is
      recorded separately as the service execution actor
    stale_or_tampered: stale lease or fence, expired nonterminal authorization, modified decrypted draft, authority drift, or
      stale CASE version raises before commit and leaves hypothesis, case, receipt, audit, outbox, attempt, effect, and inbox
      state unchanged
    terminal_replay: an exact SUCCEEDED receipt and proof chain may replay after authorization expiry without new mutation;
      any replay-chain mismatch fails closed
    lease_token_rule: the raw lease token is neither returned nor written to a receipt, audit, proof, or outbox; its transient
      attempt value is cleared before the atomic transaction can commit
  inbox_lock_acl: gurine_migrator receives UPDATE on processed_at and result only because PostgreSQL locking SELECT requires an
    UPDATE privilege; neither execution routine issues inbox UPDATE and no runtime role receives direct inbox DML
retention_contract:
  relation_classes:
    raw.research_artifact_review_tiers: inherited with the immutable research artifact and promotion evidence graph
    core.relationship_graph_endpoints_v2: inherited with source evidence and graph revision legal holds
    core.relationship_graph_assertions_v2: inherited with source evidence and graph revision legal holds
    core.relationship_graph_assertion_evidence_v2: inherited with its assertion revision
    core.relationship_graph_verification_decisions_v2: inherited with its assertion decision graph
    core.dataset_snapshot_relationship_assertions_v2: inherited with the dataset snapshot
    core.dataset_snapshot_conflict_inputs_v2: inherited with the dataset snapshot
    ops.hypothesis_recursion_policies: AGENT_RUNTIME_POLICY
    ops.hypothesis_recursion_plans: AGENT_RUNTIME_INITIATION_RECEIPT
    ops.hypothesis_recursion_nodes: AGENT_RUNTIME_INITIATION_RECEIPT
    ops.hypothesis_recursion_transitions: AGENT_RUNTIME_INITIATION_RECEIPT
    ops.hypothesis_recursion_receipts: AGENT_RUNTIME_INITIATION_RECEIPT
    ops.hypothesis_recursion_budget_ledger: AGENT_RUNTIME_INITIATION_RECEIPT
  finite_schedule_predicate:
  - record class equals the relation-specific class
  - effective_at is at or before row created_at and review_expires_at is after it
  - active_duration_seconds and backup_duration_seconds are nonnull
  - terminal_action is DELETE, ANONYMIZE, or CRYPTO_ERASE
  caller_override: forbidden
  missing_or_ambiguous_schedule: fail closed before insert
  natural_person_data_check: recursion policy, receipt, transition, and budget payloads store no natural-person identifier,
    name, role, address, birth date, family relation, score, rank, or probability
  forbidden_terminal_actions:
  - PRESERVE_PUBLIC_REVISION
  - indefinite null duration
  - arbitrary PRESERVE token
