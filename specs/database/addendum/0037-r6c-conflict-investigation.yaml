schema_version: 1
proposal_version: 2026-08-01.0037-r6c-conflict-investigation.v1
status: REVIEW_REQUIRED
scope:
  migration: 0037_r6c_conflict_investigation.sql
  exact_relations:
  - raw.research_artifact_review_tiers
  - core.relationship_graph_endpoints_v2
  - core.relationship_graph_assertions_v2
  - core.relationship_graph_assertion_evidence_v2
  - core.relationship_graph_verification_decisions_v2
  - core.dataset_snapshot_relationship_assertions_v2
  - core.dataset_snapshot_conflict_inputs_v2
  - ops.hypothesis_recursion_policies
  - ops.hypothesis_recursion_plans
  - ops.hypothesis_recursion_nodes
  - ops.hypothesis_recursion_transitions
  - ops.hypothesis_recursion_receipts
  - ops.hypothesis_recursion_budget_ledger
  exact_new_relation_count: 13
  relation_delta: 13
  altered_relations:
  - raw.research_artifacts
  - raw.research_artifact_promotions
  - ops.execution_authorizations
  - core.dataset_snapshots
  - core.dataset_snapshot_members
  - ops.agent_source_uses
  - ops.event_types
  - editorial.conflict_snapshots
  purpose: Add the forward-only R6c official-artifact review tier, typed relationship graph v2, snapshot-bound typed-neighbor
    v3 reader, five conflict-rule input freezes, and bounded hypothesis recursion without changing the supplier-only graph
    v1 or any migration through 0036.
  relation_count_rule: Candidate keys, columns, enum evolution, routines, triggers, grants, revokes, and connector or rule
    catalog changes add no relkind-r relation beyond scope.exact_relations.
  acl_only_relations:
  - core.parser_runs
  - core.parser_versions
  - editorial.cases
  - editorial.hypotheses
  - ops.agent_suggestions
  - ops.inbox
authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0036 remain byte-preserved; all authority is additive or a forward function
    replacement in 0037
  supplier_graph_v1_rule: the existing supplier-to-supplier relationship model and relationship.neighbors v2 remain available
    and unchanged
  typed_graph_v2_rule: all new cross-kind relations use the closed v2 endpoint and assertion graph below
  exact_new_write_rule: runtime writes are accepted only through fixed SECURITY DEFINER owner routines with exact canonical
    payload, digest, lineage, actor, evidence, and replay checks
  no_operating_seed_rule: no production conflict-rule threshold policy and no hypothesis-recursion policy row is inserted
    by this migration
  fixture_only_rule: threshold examples and recursion limits used by tests are fixture authority only and never become an
    operating default
  fail_closed_rule: missing policy, stale lease or fence, incomplete lineage, ambiguous source coverage, unreviewed relationship,
    missing receipt predecessor, noncanonical payload, or digest mismatch performs no activation, merge, publication, or recursive
    scheduling
existing_relation_changes:
- relation: raw.research_artifacts
  added_candidate_keys:
  - name: research_artifacts_review_tier_binding_uq
    columns:
    - id
    - asset_id
    - asset_revision
    - artifact_sha256
    - content_sha256
  changes:
  - add the exact artifact identity candidate key over id, asset identity and revision, artifact SHA-256, and content SHA-256
  - require FETCH_URL artifacts to be classified RESTRICTED before insert
  - append exactly one OFFICIAL_UNREVIEWED revision-one review-tier receipt after a successful artifact insert
- relation: raw.research_artifact_promotions
  added_candidate_keys:
  - name: research_artifact_promotions_review_tier_binding_uq
    columns:
    - promotion_id
    - receipt_sha256
    - research_artifact_id
    - research_asset_id
    - research_asset_revision
    - research_artifact_sha256
    - research_content_sha256
  changes:
  - add the exact promotion, receipt, artifact, asset, and content candidate key used by HUMAN_PROMOTED review-tier lineage
  - append revision two only after the existing promotion row, explicit reviewed classification, human reviewer, and revision-one
    predecessor receipt all match
- relation: ops.execution_authorizations
  added_candidate_keys:
  - name: execution_authorizations_recursion_binding_uq
    columns:
    - execution_id
    - generation
    - execution_digest
  changes:
  - add the execution id, positive generation, and execution digest candidate key used by recursion-plan root binding
- relation: core.dataset_snapshots
  added_candidate_keys:
  - name: dataset_snapshots_generation_hash_binding_uq
    columns:
    - id
    - producer_generation
    - snapshot_sha256
  add_columns:
    conflict_input_count:
      type: bigint
      nullable: true
    conflict_input_set_sha256:
      type: char(64)
      nullable: true
  changes:
  - add the id, producer generation, and snapshot digest candidate key used by frozen typed-relationship bindings
  - require the conflict-input count and set digest to be both null or a positive count plus lowercase SHA-256
  - the conflict v2 finalizer binds the exact count and ordered input-digest set into the READY manifest
- relation: core.dataset_snapshot_members
  changes:
  - extend the closed object_type set with TYPED_RELATIONSHIP_ASSERTION
  - admit that type only in AGENT_CASE with no evidence, response, or normalization lineage columns
  - preserve every prior evidence, response, direct CONTRACT, and normalized-object branch byte-for-byte
- relation: ops.agent_source_uses
  changes:
  - extend DATASET_MEMBER object_type with TYPED_RELATIONSHIP_ASSERTION under the same exact snapshot-member and SOURCE_DOCUMENT
    tuple
  - preserve existing EVIDENCE_SEGMENT, RESPONSE_SNAPSHOT, other DATASET_MEMBER, and RESEARCH_ARTIFACT branches
  - typed-neighbor v3 requires two distinct TOOL_QUERY source-use rows, one for each frozen endpoint source
- relation: ops.event_types
  changes:
  - forward-override exactly attachment.scan_completed.v1 and agent.run_control_changed.v2 from the generated payload registry
    before any 0037 owner routine can consume either event
- relation: editorial.conflict_snapshots
  changes:
  - replace conflict_snapshots_candidate_role_ck with the exact prior AUTHOR, EDITOR, LEGAL_REVIEWER, PUBLISHER, APPROVER,
    EXECUTOR, and OPERATIONS set plus INVESTIGATOR, ACCESS_ADMIN, SECURITY_ADMIN, and EXECUTIVE_APPROVER so every eligible
    active actions.review role selected by the owner is physically admissible; no generic or invented APPROVER assignment is
    created
enum_changes:
  editorial.evidence_classification:
    additive_values:
    - INTERNAL
    reason: the promotion request already admits explicit INTERNAL classification and the physical enum must preserve that
      nondefaulted decision
event_registry_contract:
  generated_forward_override:
    generator: scripts/generate_event_payload_registry.py
    generator_sha256: 280d2ed049beba84dfa84db1752cfb8f359fab485e8a84f88e9da35a2357f244
    exact_update_cardinality: 2
    events_in_order:
    - attachment.scan_completed.v1
    - agent.run_control_changed.v2
    ordering_rule: generated overrides are the first executable migration phase and a cardinality mismatch aborts the migration
  conflict_snapshot_candidate_roles:
    exact_values:
    - AUTHOR
    - INVESTIGATOR
    - EDITOR
    - LEGAL_REVIEWER
    - PUBLISHER
    - APPROVER
    - EXECUTOR
    - OPERATIONS
    - ACCESS_ADMIN
    - SECURITY_ADMIN
    - EXECUTIVE_APPROVER
    migration_seed: forbidden
tables:
  raw.research_artifact_review_tiers:
    owner_role: gurine_migrator
    owning_component: analysis-worker source.fetch and control-api human promotion
    mutation_class: IMMUTABLE_REVISION_CHAIN
    exact_columns:
    - tier_id
    - research_artifact_id
    - research_asset_id
    - research_asset_revision
    - research_artifact_sha256
    - research_content_sha256
    - revision
    - review_tier
    - reviewed_classification
    - predecessor_revision
    - predecessor_receipt_sha256
    - source_use_agent_run_id
    - source_use_id
    - source_use_sha256
    - source_locator_digest
    - official_source_registry_digest
    - promotion_id
    - promotion_receipt_sha256
    - reviewed_by
    - reviewed_at
    - receipt_payload
    - receipt_canonical
    - receipt_sha256
    - created_at
    keys:
      primary:
      - tier_id
      unique:
      - - research_artifact_id
        - revision
      - - research_artifact_id
        - revision
        - receipt_sha256
      - - receipt_sha256
      exact_parents:
      - raw.research_artifacts(id,asset_id,asset_revision,artifact_sha256,content_sha256)
      - ops.agent_source_uses(agent_run_id,source_use_id,source_use_sha256)
      - raw.research_artifact_promotions(promotion_id,receipt_sha256,research_artifact_id,research_asset_id,research_asset_revision,research_artifact_sha256,research_content_sha256)
      - raw.research_artifact_review_tiers(research_artifact_id,revision,receipt_sha256)
    shape:
      revision_1:
        review_tier: OFFICIAL_UNREVIEWED
        reviewed_classification: RESTRICTED
        predecessor: forbidden
        promotion: forbidden
        reviewer: forbidden
      revision_2:
        review_tier: HUMAN_PROMOTED
        predecessor_revision: 1
        predecessor_receipt: required
        promotion: required
        reviewer: required
      promoted_classifications:
      - PUBLIC
      - INTERNAL
      - RESTRICTED
      - PERSONAL_DATA
      - LEGAL_HOLD
      default_classification: forbidden
    canonical_rule: receipt_canonical is canonical UTF-8 JSON equal to receipt_payload and receipt_sha256 is its lowercase
      SHA-256
    trigger: research_artifact_review_tiers_immutable_guard
    rls:
      enabled: false
      forced: false
      reason: immutable internal artifact-review receipt chain exposed only to fixed worker, control, and audit roles
    retention:
      parent: raw.research_artifacts plus raw.research_artifact_promotions
      rule: retain with the immutable artifact, promotion, source-use, and legal-hold graph
      data_classification: source locator and digest evidence can remain linkable but stores no added natural-person identifier
      legal_hold_key: research_artifact_id
      backup_behavior: restore after artifact, source-use, and promotion parents and before citation consumers
    repository: crates/persistence-postgres::research_artifacts::ResearchArtifactRepository
    repository_roundtrip:
      write: declared owner triggers append OFFICIAL_UNREVIEWED revision one and HUMAN_PROMOTED revision two only
      read: resolve the exact artifact and revision chain without direct runtime mutation
      assertions:
      - exact predecessor, promotion, and source-use digest chain
      - canonical receipt hash and the closed two-tier set
      - immutable update and delete denial plus direct runtime DML denial
    grants:
      select:
      - gurine_analysis_worker
      - gurine_workflow_worker
      - gurine_control_api
      - gurine_auditor
      runtime_dml: []
    columns:
      tier_id:
        type: uuid
        nullable: false
        default: gen_random_uuid()
      research_artifact_id:
        type: uuid
        nullable: false
      research_asset_id:
        type: uuid
        nullable: false
      research_asset_revision:
        type: bigint
        nullable: false
      research_artifact_sha256:
        type: char(64)
        nullable: false
      research_content_sha256:
        type: char(64)
        nullable: false
      revision:
        type: bigint
        nullable: false
      review_tier:
        type: text
        nullable: false
      reviewed_classification:
        type: text
        nullable: false
      predecessor_revision:
        type: bigint
        nullable: true
      predecessor_receipt_sha256:
        type: char(64)
        nullable: true
      source_use_agent_run_id:
        type: uuid
        nullable: true
      source_use_id:
        type: uuid
        nullable: true
      source_use_sha256:
        type: char(64)
        nullable: true
      source_locator_digest:
        type: char(64)
        nullable: false
      official_source_registry_digest:
        type: char(64)
        nullable: false
      promotion_id:
        type: uuid
        nullable: true
      promotion_receipt_sha256:
        type: char(64)
        nullable: true
      reviewed_by:
        type: uuid
        nullable: true
      reviewed_at:
        type: timestamptz
        nullable: true
      receipt_payload:
        type: jsonb
        nullable: false
      receipt_canonical:
        type: bytea
        nullable: false
      receipt_sha256:
        type: char(64)
        nullable: false
      created_at:
        type: timestamptz
        nullable: false
        default: clock_timestamp()
    primary_key:
      name: research_artifact_review_tiers_pk
      columns:
      - tier_id
    uniques:
    - name: research_artifact_review_tiers_revision_uq
      columns:
      - research_artifact_id
      - revision
    - name: research_artifact_review_tiers_chain_uq
      columns:
      - research_artifact_id
      - revision
      - receipt_sha256
    - name: research_artifact_review_tiers_receipt_uq
      columns:
      - receipt_sha256
    foreign_keys:
    - name: research_artifact_review_tiers_artifact_fk
      columns:
      - research_artifact_id
      - research_asset_id
      - research_asset_revision
      - research_artifact_sha256
      - research_content_sha256
      references: raw.research_artifacts(id,asset_id,asset_revision,artifact_sha256,content_sha256)
      on_delete: RESTRICT
    - name: research_artifact_review_tiers_source_use_fk
      columns:
      - source_use_agent_run_id
      - source_use_id
      - source_use_sha256
      references: ops.agent_source_uses(agent_run_id,source_use_id,source_use_sha256)
      on_delete: RESTRICT
      match: FULL
    - name: research_artifact_review_tiers_promotion_fk
      columns:
      - promotion_id
      - promotion_receipt_sha256
      - research_artifact_id
      - research_asset_id
      - research_asset_revision
      - research_artifact_sha256
      - research_content_sha256
      references: raw.research_artifact_promotions(promotion_id,receipt_sha256,research_artifact_id,research_asset_id,research_asset_revision,research_artifact_sha256,research_content_sha256)
      on_delete: RESTRICT
    - name: research_artifact_review_tiers_reviewer_fk
      columns:
      - reviewed_by
      references: ops.users(id)
      on_delete: RESTRICT
    - name: research_artifact_review_tiers_predecessor_fk
      columns:
      - research_artifact_id
      - predecessor_revision
      - predecessor_receipt_sha256
      references: raw.research_artifact_review_tiers(research_artifact_id,revision,receipt_sha256)
      on_delete: RESTRICT
    checks:
    - name: research_artifact_review_tiers_shape_ck
      expression: revision > 0 AND num_nonnulls(source_use_agent_run_id, source_use_id, source_use_sha256) IN (0, 3) AND review_tier
        IN ('OFFICIAL_UNREVIEWED', 'HUMAN_PROMOTED') AND reviewed_classification IN ('PUBLIC', 'INTERNAL', 'RESTRICTED', 'PERSONAL_DATA',
        'LEGAL_HOLD') AND ((review_tier = 'OFFICIAL_UNREVIEWED' AND reviewed_classification = 'RESTRICTED' AND revision =
        1 AND num_nonnulls(predecessor_revision, predecessor_receipt_sha256, promotion_id, promotion_receipt_sha256, reviewed_by,
        reviewed_at) = 0) OR (review_tier = 'HUMAN_PROMOTED' AND revision = 2 AND predecessor_revision = 1 AND num_nonnulls(predecessor_receipt_sha256,
        promotion_id, promotion_receipt_sha256, reviewed_by, reviewed_at) = 5))
    - name: research_artifact_review_tiers_digest_ck
      expression: research_artifact_sha256 ~ '^[0-9a-f]{64}$' AND research_content_sha256 ~ '^[0-9a-f]{64}$' AND (source_use_sha256
        IS NULL OR source_use_sha256 ~ '^[0-9a-f]{64}$') AND source_locator_digest ~ '^[0-9a-f]{64}$' AND official_source_registry_digest
        ~ '^[0-9a-f]{64}$' AND (predecessor_receipt_sha256 IS NULL OR predecessor_receipt_sha256 ~ '^[0-9a-f]{64}$') AND (promotion_receipt_sha256
        IS NULL OR promotion_receipt_sha256 ~ '^[0-9a-f]{64}$') AND receipt_sha256 ~ '^[0-9a-f]{64}$'
    - name: research_artifact_review_tiers_canonical_ck
      expression: CAST(convert_from(receipt_canonical, 'UTF8') AS jsonb) = receipt_payload AND receipt_sha256 = encode(extensions.digest(receipt_canonical,
        'sha256'), 'hex')
  core.relationship_graph_endpoints_v2:
