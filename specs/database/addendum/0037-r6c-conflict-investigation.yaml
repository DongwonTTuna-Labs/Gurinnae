legal_and_safety_boundaries:
  L1:
    rule: automatic identity merge is forbidden; ingest writes proposal-only PENDING_HUMAN graph rows
    weak_identifier_verified: forbidden
  L2:
    rule: relationship use in a snapshot or typed-neighbor response requires COMPLETE plus VERIFIED plus APPROVED plus an
      independent human reviewer
  L3:
    rule: family or kinship inference and relation kinds do not exist; sensitive natural-person fields and scoring are absent
      from the physical schema and owner payloads
  L4:
    rule: PERSON comes only from a closed official-source kind set and stores contextual name, role, source locator, and observation
      identifier digests; external readers receive only opaque run-scoped references
  L5:
    rule: all five conflict rules have publication_claim_allowed false and can produce anomaly triage only
  L6:
    rule: PERSONAL_DATA or RESTRICTED natural-person content and unreviewed raw artifact bytes cannot enter external provider
      input
  no_automatic_effects:
  - publication
  - case state change
  - relationship activation
  - supplier merge
  - identity verification
  - claim drafting
  - external communication
source_and_rule_activation:
  implemented_sources:
    open_dart_executive_status: parsed-record exact PENDING_HUMAN PERSON endpoint path only; MANAGEMENT_ROLE proposals remain
      zero-DML until the deferred supplier authority binding is resolved
    open_dart_major_shareholder_status: raw and normalized observation only; graph rows remain zero until entity-type authority
      exists
    koneps_bid_results: procurement notice and award metadata only
    pps_sanctions: manifest and CSV connector registered disabled pending rights and schema activation receipt
  deferred_sources:
    open_dart_management_role_supplier_binding:
      blocker: no owner-controlled typed read model currently resolves an observed OpenDART company to a human-resolved SUPPLIER
        entity id, revision, and digest that the assertion writer can verify in the same transaction
      prohibited_workaround: caller-supplied supplier revision or digest, company-name matching, or automatic MANAGEMENT_ROLE
        assertion creation
      unblocks:
      - OFFICER_OVERLAP_AWARD
    koneps_structured_bidder_participation:
      blocker: no authoritative structured per-procurement participant, bid amount, rank, status, and withdrawal rows
      unblocks:
      - OWNERSHIP_LINKED_COMPETITORS
      - BID_ROTATION
    open_dart_affiliated_companies:
      blocker: operation and normalization contract not in the verified connector set
    alio_executive_roster:
      blocker: no verified normalizer preserving complete official lineage and L4 field minimization
    public_official_reemployment:
      blocker: no active official ethics-notice or gazette normalizer producing independently reviewed FORMER_OFFICIAL_ROLE
        assertions
      unblocks:
      - REVOLVING_DOOR_CONTRACT
  rule_status:
    OFFICER_OVERLAP_AWARD: BLOCKED until the owner-controlled human-resolved SUPPLIER read model and transactionally verified
      MANAGEMENT_ROLE proposal path exist; after that, activation still requires immutable policy, complete KONEPS award coverage,
      and independently VERIFIED plus APPROVED OpenDART officer graph coverage
    OWNERSHIP_LINKED_COMPETITORS: BLOCKED until koneps_structured_bidder_participation is authoritative and complete
    BID_ROTATION: BLOCKED until koneps_structured_bidder_participation is authoritative and complete
    REVOLVING_DOOR_CONTRACT: BLOCKED until official reemployment source coverage creates complete approved FORMER_OFFICIAL_ROLE
      assertions
    SANCTIONED_SUCCESSOR: BLOCKED while pps_sanctions remains disabled; activation requires rights, credentialed preflight,
      exact CSV fingerprint, complete effective dates, and frozen strong identifiers
verification_obligations:
- PostgreSQL 18.4 applies migrations 0001 through 0037 in order on an empty database
- exactly 13 new ordinary relations exist and every migration through 0036 remains byte-identical
- all 13 relations are owned by gurine_migrator, PUBLIC has no privilege, runtime roles have no direct DML, and every immutable
  relation rejects UPDATE and DELETE
- OpenDART endpoint insertion rejects an inexact source-document, parser-run, parsed-record, parser-version, payload-digest,
  locator, or L4 field shape
- OpenDART executive ingestion may create only the PENDING_HUMAN PERSON endpoint while supplier authority is unresolved; it
  creates zero MANAGEMENT_ROLE assertions and OFFICER_OVERLAP_AWARD remains operationally BLOCKED
- equal names or observation digests never create a VERIFIED person identity, supplier merge, or active assertion
- typed graph revision one is PENDING_HUMAN only and VERIFIED plus APPROVED requires a distinct human reviewer and exact evidence
  count and set digest
- relationship.neighbors v2 remains byte-compatible and v3 returns only exact snapshot-frozen VERIFIED plus APPROVED rows
  with two bound source uses
- each of the five rule jobs deterministically freezes the same canonical input and digest for the same authoritative rows
  and emits BLOCKED or PARTIAL rather than inventing absent source data
- legacy weak or LEGACY_UNPROVEN supplier identifiers never enter strong_identifier_facts
- OFFICIAL_UNREVIEWED cannot enter provider input, claim or communication citation, or public output and human promotion requires
  explicit classification
- recursion proves missing policy, disabled policy, duplicate, max depth, case budget, stage budget, market-researcher success,
  skeptic scheduling, and exact replay branches
- both recursion consumers reject a wrong, expired, or missing EVENT_DELIVERY job lease, fence, closed envelope, or outbox row,
  and the private two-argument aliases have no runtime execute grant
- strict AgentProposalV2 HYPOTHESIS preview and review submission use the shared accepted authority, choose only a real active
  actions.review role, preserve STEP_UP and SoD, and fail closed when no independent reviewer exists
- strict AgentProposalV2 HYPOTHESIS decision precondition drift creates zero decision, authorization, effect, receipt, audit,
  or outbox mutation before delegating to the unchanged 0030 governance owner
- the approved-hypothesis sealed loader performs zero DML and returns input only for the exact active workflow-worker job,
  inbox claim, authorization, terminal human approval, accepted authority, encrypted draft, and receipt chain
- the approved-hypothesis executor commits hypothesis insert, CASE version advance, claim and dispatch receipts, terminal
  SERVICE/workflow-worker audit, EFFECT_SUCCEEDED receipt, completion outbox, and attempt and effect terminalization atomically,
  and exact terminal replay creates no new mutation even after authorization expiry
- a lease-expiry lock-wait race raises SQLSTATE 40001 and leaves hypothesis, CASE version, receipt sequences two through four,
  audit, outbox, attempt, effect, and inbox unchanged
- gurine_workflow_worker has only the two approved-hypothesis routine EXECUTE grants and no direct table DML; gurine_migrator
  has only processed_at and result UPDATE columns on ops.inbox and the executor performs no inbox UPDATE
- gurine_migrator has SELECT and INSERT on editorial.hypotheses only for the SECURITY DEFINER INSERT RETURNING boundary; no
  runtime role receives direct hypothesis-table privileges
- gurine_identity_api has core schema USAGE only to resolve the typed relationship assertion record and decision owner
  routines; all direct graph-relation SELECT, INSERT, UPDATE, and DELETE privileges remain absent
- the generated event payload override updates exactly two active rows before owner execution and the conflict snapshot role
  CHECK admits the exact selected reviewer role set including EXECUTIVE_APPROVER
- no production conflict threshold or recursion policy seed exists; fixture-only policies are isolated under db/test-fixtures
- retention insert guards reject caller override, missing schedule, ambiguous schedule, and nonfinite schedule for all six
  recursion relations
- the connector operation predicate accepts exactly 8 connectors and 56 manifest-pinned operations and rejects every unknown
  or cross-connector tuple
