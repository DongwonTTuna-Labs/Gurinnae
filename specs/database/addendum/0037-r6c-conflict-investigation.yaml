    checks:
    - name: relationship_graph_assertions_v2_kind_ck
      expression: relationship_kind IN ('OWNERSHIP', 'BENEFICIAL_OWNERSHIP', 'CONTROL', 'MANAGEMENT_ROLE', 'LEGAL_REPRESENTATIVE',
        'CONTRACTUAL_RELATIONSHIP', 'BID_PARTICIPATION', 'SANCTION', 'FORMER_OFFICIAL_ROLE')
    - name: relationship_graph_assertions_v2_no_self_ck
      expression: subject_endpoint_id <> object_endpoint_id
    - name: relationship_graph_assertions_v2_pair_ck
      expression: (relationship_kind IN ('OWNERSHIP', 'BENEFICIAL_OWNERSHIP', 'CONTROL', 'CONTRACTUAL_RELATIONSHIP') AND subject_endpoint_kind
        = 'SUPPLIER' AND object_endpoint_kind = 'SUPPLIER') OR (relationship_kind IN ('MANAGEMENT_ROLE', 'LEGAL_REPRESENTATIVE')
        AND subject_endpoint_kind = 'PERSON' AND object_endpoint_kind = 'SUPPLIER') OR (relationship_kind = 'BID_PARTICIPATION'
        AND subject_endpoint_kind = 'SUPPLIER' AND object_endpoint_kind = 'PROCUREMENT_NOTICE') OR (relationship_kind = 'SANCTION'
        AND subject_endpoint_kind = 'SUPPLIER' AND object_endpoint_kind = 'SANCTION') OR (relationship_kind = 'FORMER_OFFICIAL_ROLE'
        AND subject_endpoint_kind = 'PERSON' AND object_endpoint_kind = 'AGENCY')
    - name: relationship_graph_assertions_v2_revision_ck
      expression: assertion_revision > 0 AND ((assertion_revision = 1 AND num_nonnulls(predecessor_revision, predecessor_digest,
        prior_receipt_sha256) = 0) OR (assertion_revision > 1 AND predecessor_revision = (assertion_revision - 1) AND num_nonnulls(predecessor_digest,
        prior_receipt_sha256) = 2))
    - name: relationship_graph_assertions_v2_state_ck
      expression: validity_coverage_status IN ('COMPLETE', 'PARTIAL', 'UNKNOWN', 'NOT_AVAILABLE') AND verification_status
        IN ('PENDING_HUMAN', 'VERIFIED', 'REJECTED', 'CONFLICTED', 'SUPERSEDED') AND public_use_status IN ('NOT_REVIEWED',
        'APPROVED', 'DENIED') AND ((assertion_revision = 1 AND verification_status = 'PENDING_HUMAN' AND public_use_status
        = 'NOT_REVIEWED' AND num_nonnulls(verified_by, verified_at, verification_reason_digest) = 0) OR (assertion_revision
        > 1 AND verification_status = 'VERIFIED' AND public_use_status = 'APPROVED' AND validity_coverage_status = 'COMPLETE'
        AND verified_by IS NOT NULL AND verified_by IS DISTINCT FROM proposed_by AND verified_at IS NOT NULL AND verification_reason_digest
        IS NOT NULL) OR (assertion_revision > 1 AND verification_status IN ('REJECTED', 'CONFLICTED', 'SUPERSEDED') AND public_use_status
        IN ('NOT_REVIEWED', 'DENIED') AND verified_by IS NOT NULL AND verified_by IS DISTINCT FROM proposed_by AND verified_at
        IS NOT NULL AND verification_reason_digest IS NOT NULL))
    - name: relationship_graph_assertions_v2_evidence_ck
      expression: evidence_count BETWEEN 1 AND 1000 AND evidence_set_digest ~ '^[0-9a-f]{64}$'
    - name: relationship_graph_assertions_v2_time_ck
      expression: valid_from IS NULL OR valid_to IS NULL OR valid_from <= valid_to
    - name: relationship_graph_assertions_v2_source_ck
      expression: length(btrim(source_kind)) BETWEEN 1 AND 128 AND length(btrim(source_locator)) BETWEEN 1 AND 2048 AND source_locator_digest
        ~ '^[0-9a-f]{64}$'
    - name: relationship_graph_assertions_v2_departure_ck
      expression: (relationship_kind = 'FORMER_OFFICIAL_ROLE' AND departed_on IS NOT NULL AND valid_to IS NOT NULL AND valid_to
        = departed_on AND source_kind IN ('PUBLIC_OFFICIAL_ETHICS_NOTICE', 'OFFICIAL_GAZETTE')) OR (relationship_kind <> 'FORMER_OFFICIAL_ROLE'
        AND departed_on IS NULL AND NULLIF(btrim(source_kind), '') IS NOT NULL)
    - name: relationship_graph_assertions_v2_actor_ck
      expression: (proposed_actor_type = 'HUMAN' AND proposed_by IS NOT NULL AND proposed_actor_id = CAST(proposed_by AS text))
        OR (proposed_actor_type = 'SERVICE' AND proposed_by IS NULL AND proposed_actor_id = 'ingest-worker')
    - name: relationship_graph_assertions_v2_digest_ck
      expression: assertion_digest ~ '^[0-9a-f]{64}$' AND subject_endpoint_digest ~ '^[0-9a-f]{64}$' AND object_endpoint_digest
        ~ '^[0-9a-f]{64}$' AND (predecessor_digest IS NULL OR predecessor_digest ~ '^[0-9a-f]{64}$') AND (prior_receipt_sha256
        IS NULL OR prior_receipt_sha256 ~ '^[0-9a-f]{64}$') AND (verification_reason_digest IS NULL OR verification_reason_digest
        ~ '^[0-9a-f]{64}$') AND receipt_sha256 ~ '^[0-9a-f]{64}$'
    - name: relationship_graph_assertions_v2_canonical_ck
      expression: CAST(convert_from(assertion_canonical, 'UTF8') AS jsonb) = assertion_payload AND assertion_digest = encode(extensions.digest(assertion_canonical,
        'sha256'), 'hex') AND CAST(convert_from(receipt_canonical, 'UTF8') AS jsonb) = receipt_payload AND receipt_sha256
        = encode(extensions.digest(receipt_canonical, 'sha256'), 'hex')
