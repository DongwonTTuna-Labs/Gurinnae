source_fetch_forward_contract:
  routine: ops.record_research_fetch_v1
  compatibility: preserve the 0030 rights, safety, capability, legal-hold, exact replay, artifact, receipt, and object-storage
    boundaries
  SEARCH_PUBLIC_WEB: discovery-only receipt; creates no ResearchArtifact, SourceUse, or review-tier row and fails closed on
    materialized-lineage collision
  FETCH_URL:
    artifact_classification: RESTRICTED
    source_use_classification: RESTRICTED
    source_use_kind: TOOL_QUERY
    source_kind: RESEARCH_ARTIFACT
    caller_digest_rule: the caller-provided sourceUseSha256 must equal the canonical RESTRICTED preimage digest
    review_tier: OFFICIAL_UNREVIEWED revision one is inserted with the artifact transaction
    provider_or_public_use: forbidden until an exact HUMAN_PROMOTED Evidence lineage satisfies the separate use-scope gate
  tool_call_binding:
    request: caller request SHA-256 must equal the exact persisted tool-call request digest
    result: caller result SHA-256 must equal the exact persisted tool-call result digest
    mismatch: fail closed before artifact, source-use, review-tier, or receipt mutation
  replay: bind every caller identity, source, artifact, asset, result, content, rights, classification, source-use, and review-tier
    byte; partial identity adoption is forbidden
