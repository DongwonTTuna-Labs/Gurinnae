        ingest-worker path remains separate
    reviewed_revision:
      independent_human: verified_by must be nonnull and distinct from proposed_by
      actor_session_binding: the reviewer user must equal the nonempty gurine.actor_user_id session actor
      verified_public_shape: VERIFIED plus APPROVED plus COMPLETE validity coverage
      negative_shapes: REJECTED, CONFLICTED, or SUPERSEDED with NOT_REVIEWED or DENIED
    former_official_role: departed_on is required, equals valid_to, and source_kind is PUBLIC_OFFICIAL_ETHICS_NOTICE or OFFICIAL_GAZETTE
    evidence_rule: evidence_count is 1 through 1000 and equals the exact child count; evidence_set_digest binds the ordered
      child digest set
    canonical_rule: assertion and receipt canonical bytes independently hash to their stored digests
    trigger: relationship_graph_assertions_v2_immutable_guard
    rls:
