    - name: relationship_graph_endpoints_v2_person_ck
      expression: (endpoint_kind = 'PERSON' AND identity_resolution_status = 'PENDING_HUMAN' AND num_nonnulls(entity_id, entity_revision,
        entity_digest) = 0 AND person_node_digest IS NOT NULL AND NULLIF(btrim(contextual_name), '') IS NOT NULL AND NULLIF(btrim(role_title),
        '') IS NOT NULL) OR (endpoint_kind <> 'PERSON' AND identity_resolution_status = 'NOT_APPLICABLE' AND num_nonnulls(entity_id,
        entity_revision, entity_digest) = 3 AND entity_revision > 0 AND person_node_digest IS NULL AND contextual_name IS
        NULL AND role_title IS NULL)
    - name: relationship_graph_endpoints_v2_text_ck
      expression: length(btrim(source_locator)) BETWEEN 1 AND 2048 AND (contextual_name IS NULL OR length(btrim(contextual_name))
        <= 300) AND (role_title IS NULL OR length(btrim(role_title)) <= 300)
