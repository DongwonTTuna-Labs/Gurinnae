      - decision IN ('APPROVE','REJECT')
      - "decision = 'APPROVE' AND new_due_at IS NOT NULL AND new_due_at > prior_effective_due_at OR decision = 'REJECT' AND new_due_at IS NULL"
      - capability = 'responses.policy.manage' AND assurance = 'STEP_UP'
      - length(reason_code) BETWEEN 1 AND 100 AND length(reason) BETWEEN 1 AND 4000
      - ops.is_lower_sha256(calendar_digest) AND ops.is_lower_sha256(decision_digest) AND ops.is_lower_sha256(idempotency_key_hash) AND ops.is_lower_sha256(request_digest) AND ops.is_lower_sha256(receipt_digest)
