      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [event_digest], name: communication_suppression_event_digest_uq}
      - {columns: [receipt_digest], name: communication_suppression_receipt_digest_uq}
      - {columns: [release_of_suppression_id], name: communication_suppression_single_release_uq, where: "release_of_suppression_id IS NOT NULL"}
      - {columns: [source_kind, source_id], name: communication_suppression_source_uq}
    checks:
      - purpose IS NULL OR purpose IN ('ENDPOINT_VERIFICATION','RIGHT_OF_REPLY_REQUEST','RIGHT_OF_REPLY_REMINDER','RESPONSE_RECEIPT','CORRECTION_STATUS','CORRECTION_RETRACTION_NOTICE','PRIVACY_TRANSACTIONAL_NOTICE','SECURITY_TRANSACTIONAL_NOTICE','SUBSCRIPTION_UPDATE','PRODUCT_MARKETING','INCIDENT_RECOVERY','INTERNAL_ACTION_REQUEST','DISCRETIONARY_OUTREACH')
      - suppression_kind IN ('USER_OPTOUT','HARD_BOUNCE','SOFT_BOUNCE_LIMIT','ABUSE','LEGAL','PRIVACY','PROVIDER','KILL_SWITCH','DELIVERY_FAILURE')
      - effect IN ('APPLY','RELEASE')
      - source_kind IN ('OPT_OUT_RECEIPT','PROVIDER_EVIDENCE','LEGAL_DECISION','PRIVACY_DECISION','KILL_SWITCH','OPERATOR_DECISION','AUTOMATED_POLICY')
      - "effect = 'APPLY' AND release_of_suppression_id IS NULL OR effect = 'RELEASE' AND release_of_suppression_id IS NOT NULL"
      - suppression_kind IN ('USER_OPTOUT','ABUSE','LEGAL','PRIVACY') AND expires_at IS NULL OR suppression_kind NOT IN ('USER_OPTOUT','ABUSE','LEGAL','PRIVACY')
      - expires_at IS NULL OR expires_at > effective_at
      - (topic_scope_digest IS NULL OR ops.is_lower_sha256(topic_scope_digest)) AND ops.is_lower_sha256(suppression_key_digest) AND ops.is_lower_sha256(proof_digest) AND ops.is_lower_sha256(event_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: communication_suppression_dispatch_idx, columns: [subject_id, endpoint_id, purpose, topic_scope_digest, effective_at, id]}
      - {name: communication_suppression_key_idx, columns: [suppression_key_digest, effective_at, id]}
      - {name: communication_suppression_expiry_idx, columns: [expires_at, id], where: "expires_at IS NOT NULL"}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: []
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_suppression_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_suppression_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_suppression_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: APPEND_ONLY_LEDGER
      trigger: ops.reject_mutation
      active_formula: APPLY is active until an exact RELEASE row references it; expiry is honored only for reversible kinds and never auto-clears USER_OPTOUT, ABUSE, LEGAL or PRIVACY.
    retention:
      record_class: COMMUNICATION_SUPPRESSION_LEDGER
      schedule_binding: retention_defaults.schedule_binding
      trigger: subject purpose closure and dispute schedule
      terminal_action: PRESERVE_DIGESTED_RECEIPT_AND_ERASE_LINKABLE_SECRET
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [subject_id, endpoint_id, id]
    repository:
      roundtrip: nullable scope fields remain nullable and mean all matching purpose/topic only under the closed suppression scope constructor
      active_order: [effective_at DESC, created_at DESC, id DESC]

