      idempotency_key_hash: {type: char(64), nullable: false}
      request_digest: {type: char(64), nullable: false}
      request_id: {type: uuid, nullable: false}
      trace_id: {type: text, nullable: false}
      decision_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      outbox_event_id: {type: uuid, nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      decided_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [delivery_id], references: ops.outbound_deliveries(id), on_delete: RESTRICT}
      - {name: communication_reconciliation_provider_preflight_fk, columns: [safe_retry_provider_preflight_receipt_id, safe_retry_provider_config_id, safe_retry_provider_config_version, safe_retry_provider_configuration_digest, safe_retry_provider_preflight_receipt_digest], references: 'ops.communication_provider_preflight_receipts(id,provider_config_id,provider_config_version,configuration_digest,receipt_digest)', on_delete: RESTRICT, match: FULL}
      - {columns: [actor_id], references: ops.users(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
    deferred_foreign_keys:
      - {name: communication_reconciliation_pre_egress_receipt_fk, columns: [safe_retry_pre_egress_receipt_id, delivery_id, safe_retry_pre_egress_receipt_sequence, safe_retry_pre_egress_receipt_digest, safe_retry_pre_egress_evidence_kind, safe_retry_pre_egress_applied], references: 'ops.outbound_delivery_receipts(id,delivery_id,receipt_sequence,receipt_digest,evidence_kind,applied)', on_delete: RESTRICT, match: FULL, add_after: ops.outbound_delivery_receipts}
      - {name: communication_reconciliation_provider_lookup_receipt_fk, columns: [provider_lookup_receipt_id, provider_lookup_receipt_delivery_id, provider_lookup_receipt_sequence, provider_lookup_receipt_digest, provider_lookup_receipt_evidence_kind, provider_lookup_receipt_applied], references: 'ops.outbound_delivery_receipts(id,delivery_id,receipt_sequence,receipt_digest,evidence_kind,applied)', on_delete: RESTRICT, match: FULL, add_after: ops.outbound_delivery_receipts}
    unique_constraints:
      - {columns: [delivery_id, decision_sequence], name: communication_reconciliation_sequence_uq}
      - {columns: [delivery_id, expected_delivery_version], name: communication_reconciliation_expected_version_uq}
      - {columns: [idempotency_key_hash], name: communication_reconciliation_idempotency_uq}
      - {columns: [decision_digest], name: communication_reconciliation_decision_digest_uq}
      - {columns: [receipt_digest], name: communication_reconciliation_receipt_digest_uq}
      - {columns: [id, delivery_id, decision_sequence, resulting_state, safe_retry_kind, safe_retry_proof_digest, receipt_digest], name: communication_reconciliation_safe_retry_authority_uq}
    checks:
      - decision_sequence > 0 AND expected_delivery_version > 0
      - prior_state = 'RECONCILIATION_REQUIRED'
      - resolution IN ('NOT_TRANSMITTED','PROVIDER_ACCEPTED','DELIVERED','FAILED_PERMANENT')
      - resulting_state IN ('RETRY_SCHEDULED','CANCELLED','PROVIDER_ACCEPTED','DELIVERED','FAILED_PERMANENT')
      - evidence_kind IN ('NO_PROVIDER_ATTEMPT','AUTHENTICATED_PROVIDER_LOOKUP','SIGNED_PROVIDER_CALLBACK','AUTHENTICATED_PROVIDER_POLL','OFFICIAL_CHANNEL_RECEIPT')
      - "resolution = 'NOT_TRANSMITTED' AND resulting_state IN ('RETRY_SCHEDULED','CANCELLED') AND safe_retry_kind IS NOT NULL AND safe_retry_proof IS NOT NULL AND safe_retry_proof_digest IS NOT NULL OR resolution = 'PROVIDER_ACCEPTED' AND resulting_state = 'PROVIDER_ACCEPTED' AND safe_retry_kind IS NULL AND safe_retry_proof IS NULL AND safe_retry_proof_digest IS NULL OR resolution = 'DELIVERED' AND resulting_state = 'DELIVERED' AND safe_retry_kind IS NULL AND safe_retry_proof IS NULL AND safe_retry_proof_digest IS NULL OR resolution = 'FAILED_PERMANENT' AND resulting_state = 'FAILED_PERMANENT' AND safe_retry_kind IS NULL AND safe_retry_proof IS NULL AND safe_retry_proof_digest IS NULL"
      - "safe_retry_kind IS NULL OR safe_retry_kind IN ('NO_PROVIDER_ATTEMPT','PROVIDER_LOOKUP_NOT_FOUND','PROVIDER_IDEMPOTENT_REPLAY_SAFE')"
      - "safe_retry_kind IS NULL OR ops.communication_safe_retry_proof_is_valid(safe_retry_proof,safe_retry_kind,safe_retry_proof_digest)"
      - "safe_retry_kind = 'NO_PROVIDER_ATTEMPT' AND num_nonnulls(safe_retry_pre_egress_receipt_id,safe_retry_pre_egress_receipt_sequence,safe_retry_pre_egress_receipt_digest,safe_retry_pre_egress_evidence_kind,safe_retry_pre_egress_applied) = 5 AND safe_retry_pre_egress_evidence_kind = 'PRE_DISPATCH_FENCE' AND safe_retry_pre_egress_applied AND num_nonnulls(provider_lookup_receipt_id,provider_lookup_receipt_delivery_id,provider_lookup_receipt_sequence,provider_lookup_receipt_digest,provider_lookup_receipt_evidence_kind,provider_lookup_receipt_applied,safe_retry_provider_preflight_receipt_id) = 0 OR safe_retry_kind = 'PROVIDER_LOOKUP_NOT_FOUND' AND num_nonnulls(provider_lookup_receipt_id,provider_lookup_receipt_delivery_id,provider_lookup_receipt_sequence,provider_lookup_receipt_digest,provider_lookup_receipt_evidence_kind,provider_lookup_receipt_applied,safe_retry_provider_idempotency_key_sha256,safe_retry_request_sha256) = 8 AND provider_lookup_receipt_evidence_kind = 'AUTHENTICATED_PROVIDER_POLL' AND provider_lookup_receipt_applied = false AND safe_retry_pre_egress_receipt_id IS NULL AND safe_retry_provider_preflight_receipt_id IS NULL OR safe_retry_kind = 'PROVIDER_IDEMPOTENT_REPLAY_SAFE' AND num_nonnulls(provider_lookup_receipt_id,provider_lookup_receipt_delivery_id,provider_lookup_receipt_sequence,provider_lookup_receipt_digest,provider_lookup_receipt_evidence_kind,provider_lookup_receipt_applied,safe_retry_provider_preflight_receipt_id,safe_retry_provider_config_id,safe_retry_provider_config_version,safe_retry_provider_configuration_digest,safe_retry_provider_preflight_receipt_digest,safe_retry_provider_idempotency_key_sha256,safe_retry_request_sha256) = 13 AND provider_lookup_receipt_evidence_kind = 'AUTHENTICATED_PROVIDER_POLL' AND provider_lookup_receipt_applied = false AND safe_retry_pre_egress_receipt_id IS NULL OR safe_retry_kind IS NULL AND num_nonnulls(safe_retry_pre_egress_receipt_id,safe_retry_pre_egress_receipt_sequence,safe_retry_pre_egress_receipt_digest,safe_retry_pre_egress_evidence_kind,safe_retry_pre_egress_applied,provider_lookup_receipt_id,provider_lookup_receipt_delivery_id,provider_lookup_receipt_sequence,provider_lookup_receipt_digest,provider_lookup_receipt_evidence_kind,provider_lookup_receipt_applied,safe_retry_provider_preflight_receipt_id,safe_retry_provider_config_id,safe_retry_provider_config_version,safe_retry_provider_configuration_digest,safe_retry_provider_preflight_receipt_digest,safe_retry_provider_idempotency_key_sha256,safe_retry_request_sha256) = 0"
      - resolution <> 'DELIVERED' OR evidence->>'kind' IN ('SIGNED_PROVIDER_CALLBACK','AUTHENTICATED_PROVIDER_POLL','OFFICIAL_CHANNEL_RECEIPT')
      - "num_nonnulls(provider_lookup_receipt_id,provider_lookup_receipt_delivery_id,provider_lookup_receipt_sequence,provider_lookup_receipt_digest,provider_lookup_receipt_evidence_kind,provider_lookup_receipt_applied) IN (0,6)"
      - capability = 'communications.operate' AND assurance = 'STEP_UP'
      - length(reason_code) BETWEEN 1 AND 100 AND length(reason) BETWEEN 1 AND 4000 AND length(trace_id) BETWEEN 1 AND 200
      - ops.uuid_array_is_unique(callback_event_ids) AND ops.uuid_array_is_unique(attempt_ids)
      - cardinality(callback_event_ids) + cardinality(attempt_ids) > 0
      - ops.is_lower_sha256(evidence_digest) AND (safe_retry_proof_digest IS NULL OR ops.is_lower_sha256(safe_retry_proof_digest)) AND (safe_retry_pre_egress_receipt_digest IS NULL OR ops.is_lower_sha256(safe_retry_pre_egress_receipt_digest)) AND (provider_lookup_receipt_digest IS NULL OR ops.is_lower_sha256(provider_lookup_receipt_digest)) AND (safe_retry_provider_configuration_digest IS NULL OR ops.is_lower_sha256(safe_retry_provider_configuration_digest)) AND (safe_retry_provider_preflight_receipt_digest IS NULL OR ops.is_lower_sha256(safe_retry_provider_preflight_receipt_digest)) AND (safe_retry_provider_idempotency_key_sha256 IS NULL OR ops.is_lower_sha256(safe_retry_provider_idempotency_key_sha256)) AND (safe_retry_request_sha256 IS NULL OR ops.is_lower_sha256(safe_retry_request_sha256)) AND ops.is_lower_sha256(assurance_receipt_digest) AND ops.is_lower_sha256(idempotency_key_hash) AND ops.is_lower_sha256(request_digest) AND ops.is_lower_sha256(decision_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: communication_reconciliation_history_idx, columns: [delivery_id, decision_sequence]}
      - {name: communication_reconciliation_actor_idx, columns: [actor_id, decided_at DESC, id DESC]}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.reconcile_communication_delivery, execute: [gurine_control_api], security_definer: true}
    rls: {enabled: false, reason: internal immutable decision relation with capability-gated function}
    mutability:
      mode: APPEND_ONLY
      trigger: ops.reject_mutation
      transaction: SERIALIZABLE; lock delivery, attempts by ordinal, callbacks by evidence order, receipts by sequence and the exact provider preflight revision. Validate the closed CommunicationSafeRetryProofV1 by reconstructing the same delivery/provider key/request digest from locked rows. NO_PROVIDER_ATTEMPT requires an applied PRE_DISPATCH_FENCE receipt and zero committed provider request evidence; PROVIDER_LOOKUP_NOT_FOUND requires the same-account authenticated definitive lookup receipt; PROVIDER_IDEMPOTENT_REPLAY_SAFE additionally requires the activated preflight capability. Insert the immutable decision, update delivery, append receipt/audit/outbox/command receipt atomically. A later attempt must composite-reference this exact RETRY_SCHEDULED decision and the claim routine rejects it if a newer decision exists.
    retention:
      record_class: COMMUNICATION_DELIVERY_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: delivery/source record schedule
      terminal_action: PRESERVE_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [delivery_id, id]
    repository:
      roundtrip: evidence is CommunicationReconciliationEvidenceV1 and the digest is exact; OPERATOR_EVIDENCE is never promoted to delivered proof
      history_order: [decision_sequence, id]

  ops.outbound_delivery_receipts:
    owner:
      domain: CommunicationIntent
      service: notification-worker|control-api
      repository: crates/persistence-postgres::communication
      rust_row: OutboundDeliveryReceiptRow
      rust_domain: gurine_domain::communication::OutboundDeliveryReceipt
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      delivery_id: {type: uuid, nullable: false}
      receipt_sequence: {type: bigint, nullable: false}
      event_aggregate_version: {type: bigint, nullable: true}
      prior_delivery_version: {type: bigint, nullable: false}
      delivery_version: {type: bigint, nullable: false}
      attempt_id: {type: uuid, nullable: true}
      callback_event_id: {type: uuid, nullable: true}
      callback_item_ordinal: {type: integer, nullable: true}
      callback_item_digest: {type: char(64), nullable: true}
      reconciliation_decision_id: {type: uuid, nullable: true}
      source_kind: {type: text, nullable: false}
      observation_key_digest: {type: char(64), nullable: false}
      projection_disposition: {type: text, nullable: false}
      evidence_kind: {type: text, nullable: false}
      evidence_rank: {type: smallint, nullable: false}
      prior_state: {type: text, nullable: false}
      asserted_state: {type: text, nullable: false}
      resulting_state: {type: text, nullable: false}
      prior_proof_level: {type: text, nullable: false}
      resulting_proof_level: {type: text, nullable: false}
      applied: {type: boolean, nullable: false}
      provider_event_identity_hash: {type: char(64), nullable: true}
      provider_evidence_digest: {type: char(64), nullable: false}
      rendering_digest: {type: char(64), nullable: false}
      endpoint_id: {type: uuid, nullable: false}
      endpoint_version: {type: bigint, nullable: false}
      endpoint_snapshot_digest: {type: char(64), nullable: false}
      endpoint_identity_hash: {type: char(64), nullable: false}
      provider_preflight_receipt_id: {type: uuid, nullable: false}
      provider_config_id: {type: uuid, nullable: false}
      provider_config_version: {type: bigint, nullable: false}
      provider_configuration_digest: {type: char(64), nullable: false}
      provider_preflight_receipt_digest: {type: char(64), nullable: false}
      provider_identity_hash: {type: char(64), nullable: false}
      authorization_snapshot_digest: {type: char(64), nullable: false}
      activation_receipt_digest: {type: char(64), nullable: false}
      budget_reservation_id: {type: uuid, nullable: false}
      cost_fact_ids: {type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      provider_occurred_at: {type: timestamptz, nullable: true}
      observed_at: {type: timestamptz, nullable: false}
      recorded_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      actor_type: {type: text, nullable: false}
      actor_id: {type: uuid, nullable: true}
      request_id: {type: uuid, nullable: false}
      trace_id: {type: text, nullable: false}
      previous_receipt_digest: {type: char(64), nullable: true}
      receipt_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      outbox_event_id: {type: uuid, nullable: true}
    primary_key: [id]
    foreign_keys:
      - {columns: [delivery_id], references: ops.outbound_deliveries(id), on_delete: RESTRICT}
      - {columns: [attempt_id], references: ops.outbound_delivery_attempts(id), on_delete: RESTRICT}
      - {columns: [callback_event_id], references: ops.communication_callback_events(id), on_delete: RESTRICT}
      - {columns: [reconciliation_decision_id], references: ops.communication_reconciliation_decisions(id), on_delete: RESTRICT}
      - {columns: [endpoint_id, endpoint_version, endpoint_snapshot_digest], references: 'intake.communication_endpoint_link_events(endpoint_id,endpoint_version,endpoint_snapshot_digest)', on_delete: RESTRICT}
      - {columns: [provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest], references: 'ops.communication_provider_preflight_receipts(id,provider_config_id,provider_config_version,configuration_digest,receipt_digest)', on_delete: RESTRICT}
      - {columns: [budget_reservation_id], references: ops.budget_reservations(id), on_delete: RESTRICT}
      - {columns: [actor_id], references: ops.users(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [delivery_id, receipt_sequence], name: outbound_delivery_receipt_sequence_uq}
      - {columns: [delivery_id, event_aggregate_version], name: outbound_delivery_receipt_event_version_uq, where: "event_aggregate_version IS NOT NULL"}
      - {columns: [delivery_id, observation_key_digest], name: outbound_delivery_observation_uq}
      - {columns: [delivery_id, delivery_version], name: outbound_delivery_applied_version_uq, where: "applied"}
      - {columns: [receipt_digest], name: outbound_delivery_receipt_digest_uq}
      - {columns: [id, delivery_id, receipt_sequence, receipt_digest, resulting_state, applied], name: outbound_delivery_receipt_exact_binding_uq}
      - {columns: [id, delivery_id, receipt_sequence, receipt_digest, evidence_kind, applied], name: outbound_delivery_receipt_safe_retry_evidence_uq}
      - {columns: [id, delivery_id, receipt_sequence, receipt_digest, resulting_state, applied, projection_disposition, resulting_proof_level, observed_at], name: outbound_delivery_receipt_paid_terminal_uq}
      - {columns: [callback_event_id, callback_item_ordinal], name: outbound_delivery_callback_item_receipt_uq, where: "callback_event_id IS NOT NULL"}
      - {columns: [reconciliation_decision_id], name: outbound_delivery_reconciliation_receipt_uq, where: "reconciliation_decision_id IS NOT NULL"}
      - {columns: [outbox_event_id], name: outbound_delivery_receipt_outbox_uq, where: "outbox_event_id IS NOT NULL"}
    checks:
      - receipt_sequence > 0 AND (event_aggregate_version IS NULL OR event_aggregate_version > 1) AND prior_delivery_version > 0 AND delivery_version > 0 AND endpoint_version > 0 AND provider_config_version > 0
      - evidence_kind IN ('PRE_DISPATCH_FENCE','PROVIDER_REQUEST_COMMITTED','PROVIDER_RESPONSE','SIGNED_PROVIDER_CALLBACK','AUTHENTICATED_PROVIDER_POLL','OFFICIAL_CHANNEL_RECEIPT','RECONCILIATION_PROOF','CANCELLATION_PROOF')
      - prior_state IN ('QUEUED','SENDING','PROVIDER_ACCEPTED','DELIVERED','READ','RETRY_SCHEDULED','FAILED_PERMANENT','RECONCILIATION_REQUIRED','SUPPRESSED','CANCELLED')
      - asserted_state IN ('QUEUED','SENDING','PROVIDER_ACCEPTED','DELIVERED','READ','RETRY_SCHEDULED','FAILED_PERMANENT','RECONCILIATION_REQUIRED','SUPPRESSED','CANCELLED')
      - resulting_state IN ('QUEUED','SENDING','PROVIDER_ACCEPTED','DELIVERED','READ','RETRY_SCHEDULED','FAILED_PERMANENT','RECONCILIATION_REQUIRED','SUPPRESSED','CANCELLED')
      - evidence_rank BETWEEN 0 AND 100
      - source_kind IN ('DISPATCH_FENCE','PROVIDER_RESPONSE','PROVIDER_CALLBACK','PROVIDER_POLL','RECONCILIATION_DECISION','CANCELLATION','SUPPRESSION')
      - projection_disposition IN ('APPLIED','STALE_STORED')
      - prior_proof_level IN ('NONE','PROVIDER_ACCEPTED','DELIVERED','READ') AND resulting_proof_level IN ('NONE','PROVIDER_ACCEPTED','DELIVERED','READ')
      - cardinality(cost_fact_ids) <= 100 AND ops.uuid_array_is_unique(cost_fact_ids)
      - recorded_at >= observed_at
      - "applied AND resulting_state = asserted_state OR NOT applied AND resulting_state = prior_state"
      - "applied AND projection_disposition = 'APPLIED' AND delivery_version = prior_delivery_version + 1 OR NOT applied AND projection_disposition = 'STALE_STORED' AND delivery_version = prior_delivery_version"
      - "applied AND event_aggregate_version IS NOT NULL AND outbox_event_id IS NOT NULL OR NOT applied AND event_aggregate_version IS NULL AND outbox_event_id IS NULL"
      - "applied AND ops.delivery_proof_rank(resulting_proof_level) >= ops.delivery_proof_rank(prior_proof_level) OR NOT applied AND resulting_proof_level = prior_proof_level"
      - "receipt_sequence = 1 AND previous_receipt_digest IS NULL OR receipt_sequence > 1 AND previous_receipt_digest IS NOT NULL"
      - actor_type IN ('AUTHORIZED_SERVICE','HUMAN_USER','PROVIDER_CALLBACK')
      - "actor_type = 'HUMAN_USER' AND actor_id IS NOT NULL OR actor_type <> 'HUMAN_USER' AND actor_id IS NULL"
      - length(trace_id) BETWEEN 1 AND 200
      - "source_kind = 'PROVIDER_CALLBACK' AND callback_event_id IS NOT NULL OR source_kind <> 'PROVIDER_CALLBACK'"
      - "source_kind = 'PROVIDER_CALLBACK' AND callback_item_ordinal IS NOT NULL AND callback_item_ordinal >= 0 AND callback_item_digest IS NOT NULL OR source_kind <> 'PROVIDER_CALLBACK' AND callback_item_ordinal IS NULL AND callback_item_digest IS NULL"
      - "source_kind = 'RECONCILIATION_DECISION' AND reconciliation_decision_id IS NOT NULL OR source_kind <> 'RECONCILIATION_DECISION'"
      - "source_kind IN ('PROVIDER_RESPONSE','DISPATCH_FENCE') AND attempt_id IS NOT NULL OR source_kind NOT IN ('PROVIDER_RESPONSE','DISPATCH_FENCE')"
      - resulting_state <> 'READ' OR evidence_kind IN ('SIGNED_PROVIDER_CALLBACK','AUTHENTICATED_PROVIDER_POLL')
      - ops.is_lower_sha256(observation_key_digest) AND (callback_item_digest IS NULL OR ops.is_lower_sha256(callback_item_digest)) AND (provider_event_identity_hash IS NULL OR ops.is_lower_sha256(provider_event_identity_hash)) AND ops.is_lower_sha256(provider_evidence_digest) AND ops.is_lower_sha256(rendering_digest) AND ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(endpoint_identity_hash) AND ops.is_lower_sha256(provider_configuration_digest) AND ops.is_lower_sha256(provider_preflight_receipt_digest) AND ops.is_lower_sha256(provider_identity_hash) AND ops.is_lower_sha256(authorization_snapshot_digest) AND ops.is_lower_sha256(activation_receipt_digest) AND (previous_receipt_digest IS NULL OR ops.is_lower_sha256(previous_receipt_digest)) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: outbound_delivery_receipt_history_idx, columns: [delivery_id, receipt_sequence]}
      - {name: outbound_delivery_receipt_state_idx, columns: [resulting_state, recorded_at DESC, id DESC]}
      - {name: outbound_delivery_receipt_provider_event_idx, columns: [provider_event_identity_hash], where: "provider_event_identity_hash IS NOT NULL"}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.record_outbound_delivery_observation, execute: [gurine_notification_worker, gurine_control_api], security_definer: true}
    rls: {enabled: false, reason: immutable payload-free receipt relation}
    mutability:
      mode: APPEND_ONLY_DELIVERY_RECEIPT_REVISION_LEDGER
      trigger: ops.reject_mutation
      transition_rule: The function locks delivery and previous receipt, requires gap-free receipt_sequence and previous_receipt_digest, validates exact immutable endpoint/provider revisions plus the closed transition/proof rank, increments delivery version and delivery event_sequence only when applied=true, then inserts audit/outbox/receipt. Out-of-order evidence is STALE_STORED, has no event aggregate version or outbox row, and leaves state/version/proof and event_sequence unchanged. Callback observations bind one request-level callback row plus one unique item ordinal/digest; one callback request may therefore produce multiple independent receipt revisions without duplicating authentication evidence.
    retention:
      record_class: COMMUNICATION_DELIVERY_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: source record schedule
      terminal_action: PRESERVE_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [delivery_id, id]
      disclosure: no endpoint plaintext, message bytes, token, secret or callback body.
    repository:
      roundtrip: prior/asserted/resulting states, prior/result proof, versions, disposition and chain digest are stored facts; reader never reconstructs them from timestamps
      history_order: [receipt_sequence, id]

  editorial.response_request_sent_receipts:
    owner:
      domain: ResponseRequestSentReceipt
      service: workflow-worker
      repository: crates/persistence-postgres::response_request_delivery
      rust_row: ResponseRequestSentReceiptRow
      rust_domain: gurine_domain::response::ResponseRequestSentReceipt
    columns:
