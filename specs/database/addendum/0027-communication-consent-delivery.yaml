      - {columns: [budget_reservation_id], references: ops.budget_reservations(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
    deferred_foreign_keys:
      - {name: outbound_delivery_attempt_safe_retry_decision_fk, columns: [safe_retry_decision_id, delivery_id, safe_retry_decision_sequence, safe_retry_decision_resulting_state, safe_retry_kind, safe_retry_proof_digest, safe_retry_decision_receipt_digest], references: 'ops.communication_reconciliation_decisions(id,delivery_id,decision_sequence,resulting_state,safe_retry_kind,safe_retry_proof_digest,receipt_digest)', on_delete: RESTRICT, match: FULL, add_after: ops.communication_reconciliation_decisions}
    unique_constraints:
      - {columns: [delivery_id, attempt_ordinal], name: outbound_delivery_attempt_ordinal_uq}
      - {columns: [delivery_id, dispatch_generation], name: outbound_delivery_attempt_generation_uq}
      - {columns: [fencing_token], name: outbound_delivery_attempt_fence_uq}
      - {columns: [attempt_digest], name: outbound_delivery_attempt_digest_uq}
      - {columns: [claim_receipt_digest], name: outbound_delivery_attempt_claim_receipt_uq}
    checks:
      - attempt_ordinal BETWEEN 1 AND 3
      - dispatch_generation > 0 AND delivery_version_at_claim > 0 AND endpoint_version > 0 AND provider_config_version > 0 AND fencing_token > 0
      - length(worker_id) BETWEEN 1 AND 200 AND length(transport_policy_version) BETWEEN 1 AND 100
      - lease_expires_at > claimed_at AND deadline_at >= lease_expires_at
      - "attempt_ordinal = 1 AND num_nonnulls(safe_retry_decision_id,safe_retry_decision_sequence,safe_retry_decision_resulting_state,safe_retry_kind,safe_retry_proof_digest,safe_retry_decision_receipt_digest) = 0 OR attempt_ordinal > 1 AND num_nonnulls(safe_retry_decision_id,safe_retry_decision_sequence,safe_retry_decision_resulting_state,safe_retry_kind,safe_retry_proof_digest,safe_retry_decision_receipt_digest) = 6"
      - "safe_retry_decision_resulting_state IS NULL OR safe_retry_decision_resulting_state = 'RETRY_SCHEDULED'"
      - "safe_retry_kind IS NULL OR safe_retry_kind IN ('NO_PROVIDER_ATTEMPT','PROVIDER_LOOKUP_NOT_FOUND','PROVIDER_IDEMPOTENT_REPLAY_SAFE')"
      - ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(configuration_digest) AND ops.is_lower_sha256(provider_preflight_receipt_digest) AND ops.is_lower_sha256(lease_token_hash) AND ops.is_lower_sha256(provider_idempotency_key_sha256) AND ops.is_lower_sha256(request_sha256) AND ops.is_lower_sha256(rendered_sha256) AND ops.is_lower_sha256(authorization_snapshot_digest) AND ops.is_lower_sha256(suppression_snapshot_digest) AND ops.is_lower_sha256(activation_receipt_digest) AND ops.is_lower_sha256(policy_fence_digest) AND (safe_retry_proof_digest IS NULL OR ops.is_lower_sha256(safe_retry_proof_digest)) AND (safe_retry_decision_receipt_digest IS NULL OR ops.is_lower_sha256(safe_retry_decision_receipt_digest)) AND ops.is_lower_sha256(attempt_digest) AND ops.is_lower_sha256(claim_receipt_digest)
    indexes:
      - {name: outbound_delivery_attempt_history_idx, columns: [delivery_id, attempt_ordinal]}
      - {name: outbound_delivery_attempt_lease_idx, columns: [lease_expires_at, fencing_token, id]}
      - {name: outbound_delivery_attempt_provider_idx, columns: [provider_config_id, provider_config_version, claimed_at, id]}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.claim_outbound_delivery_attempt, execute: [gurine_notification_worker], security_definer: true}
    rls: {enabled: false, reason: internal effect fence relation with explicit grants}
    mutability:
      mode: APPEND_ONLY_EFFECT_CLAIM
      trigger: ops.reject_mutation
      rule: The entire claim is committed before egress and never updated. Provider observations, costs and ambiguity are append-only delivery receipts; lease expiry after possible egress transitions the delivery to RECONCILIATION_REQUIRED and never repeats the provider call.
      same_delivery_key_trigger: provider_idempotency_key_sha256, rendered_sha256, endpoint ID/version/snapshot, provider preflight receipt/configuration digest and request_sha256 must equal the immutable delivery/rendering binding for every ordinal. For ordinal greater than one the claim routine locks the exact composite safe-retry decision, proves it is the latest decision for the delivery with resulting_state RETRY_SCHEDULED, recomputes its typed proof under the same provider key/request digest, and rejects cross-delivery, stale or ambiguous proof before inserting the attempt.
    retention:
      record_class: COMMUNICATION_DELIVERY_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: delivery terminal plus source record schedule
      terminal_action: PRESERVE_DIGESTED_RECEIPT_AND_CRYPTO_ERASE_PROVIDER_IDENTIFIER
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [delivery_id, id]
    repository:
      roundtrip: all claim/fence fields and nullable safe retry proof are exact; provider outcome is never synthesized into the attempt row
      history_order: [attempt_ordinal, id]
      claim_order: [claimed_at, fencing_token, id]

