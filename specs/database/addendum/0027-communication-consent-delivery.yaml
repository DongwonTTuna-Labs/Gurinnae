      cutover:
        - Classify every pre-0027 token as LEGACY_V13 with token_generation=1 and all new binding/ciphertext fields null; a legacy token remains exchangeable only under its preexisting request/session rules but can never be selected to render or retry a current communication.
        - After classification set artifact_contract_version and token_generation NOT NULL, install the guarded trigger, and change the insert default to COMMUNICATION_V1.
      current_insert:
        transaction: The response request, immutable intent, generated rendering ID, cryptographically random token, purpose-HMAC token hash, encrypted token, deterministic OTP derivation version, purpose-separated OTP verifier HMAC plus key version, immutable rendered bytes and all binding digests are passed to one owner procedure and inserted in the same transaction. Deferred FKs are valid by commit; a partial token, verifier or rendering never commits.
        digest: artifact_binding_digest is SHA-256 of ResponseAccessArtifactBindingV1 over response request ID/version/binding digest, intent ID/digest, rendering ID/digest, token generation/hash, token encryption key ID, OTP derivation version, OTP verifier HMAC/key version and expires_at. Raw token and OTP are excluded from the digest and every outward projection.
      retry_and_reissue:
        - Consumer replay, provider retry and reconciliation always reuse the same rendering row, token generation/hash/ciphertext, OTP derivation version, rendered bytes and provider idempotency key. No retry path inserts a token row or calls a random-token generator.
        - A new token generation is allowed only after the previous row is expired, revoked or exchanged and a new authorized logical intent plus rendering revision is created. It is never a recovery action for timeout, lost response, lease expiry or database commit uncertainty.
      privilege_and_mutability:
        direct_insert_update_delete: revoked from every runtime role
        owner_procedures: [ops.create_response_access_rendering_v1, intake.exchange_response_magic_token_v2, intake.verify_response_session_v2]
        immutable_current_columns: [artifact_contract_version, token_generation, response_request_id, response_request_version, response_request_binding_digest, communication_intent_id, communication_intent_digest, rendering_id, rendering_digest, token_hash, token_ciphertext, token_encryption_key_id, otp_derivation_version, otp_verifier_hmac, otp_verifier_key_version, artifact_binding_digest, expires_at, created_at]
        allowed_update: only the existing one-shot exchange/revocation fields may transition through the exact owner procedure; token/rendering identity never changes
      proof_oracles:
        - Crash before commit leaves zero token/rendering/delivery row; replay creates one complete artifact.
        - Crash or timeout after provider dispatch leaves exactly one token generation and one rendering and enters reconciliation; it never creates another access link or OTP.
        - 64 identical event consumers create one token artifact, one rendering and one delivery; all other consumers resolve the same digests.
        - Removing any binding field, changing token generation/hash/ciphertext, regenerating OTP, or pairing another rendering fails the owner procedure with zero mutation.
