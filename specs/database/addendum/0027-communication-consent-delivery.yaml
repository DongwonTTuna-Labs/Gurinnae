        - {name: editorial_responses_owned_intake_shape_ck, expression: "(num_nonnulls(submission_id,submission_receipt_version,submission_receipt_digest,owned_intake_event_id,owned_intake_event_envelope_digest,owned_intake_receipt_digest)=0 OR (num_nonnulls(submission_id,submission_receipt_version,submission_receipt_digest,owned_intake_event_id,owned_intake_event_envelope_digest,owned_intake_receipt_digest)=6 AND response_request_id IS NOT NULL)) AND (submission_receipt_version IS NULL OR submission_receipt_version > 0) AND (submission_receipt_digest IS NULL OR ops.is_lower_sha256(submission_receipt_digest)) AND (owned_intake_event_envelope_digest IS NULL OR ops.is_lower_sha256(owned_intake_event_envelope_digest)) AND (owned_intake_receipt_digest IS NULL OR ops.is_lower_sha256(owned_intake_receipt_digest))"}
      immutable_origin_columns: [case_id,response_request_id,submission_id,party_name,submitted_at,full_text_encrypted,publication_consent,submission_receipt_version,submission_receipt_digest,owned_intake_event_id,owned_intake_event_envelope_digest,owned_intake_receipt_digest,created_at]
      current_insert_rule: only editorial.materialize_response_submission_intake_v1 inserts a new owned-intake response; it copies case, request, submitted_at, encrypted response bytes and publication consent from the locked authoritative request/submission graph and writes every origin binding nonnull. Legacy rows remain explicitly classified and cannot satisfy the current reciprocal binding.
    - relation: intake.submission_sessions
      action: ADD_DISTINCT_APPEAL_AND_COMMUNICATION_PROFILE_SCOPES_WITHOUT_WIDENING_PARENT_SESSIONS
      add_session_kinds: [APPEAL_CREATE, APPEAL_STATUS, COMMUNICATION_PROFILE]
      add_scope_types: [APPEAL, COMMUNICATION_SUBJECT]
      add_columns:
        parent_session_id: {type: uuid, nullable: true}
        scope_binding_digest: {type: char(64), nullable: true}
        issuance_receipt_digest: {type: char(64), nullable: true}
        rotation_sequence: {type: bigint, nullable: false, default: 0}
      add_foreign_keys:
        - {name: submission_session_parent_fk, columns: [parent_session_id], references: intake.submission_sessions(id), on_delete: RESTRICT}
      add_checks:
        - "session_kind = 'APPEAL_CREATE' AND scope_type = 'RESPONSE_SUBMISSION' OR session_kind = 'APPEAL_STATUS' AND scope_type = 'APPEAL' OR session_kind = 'COMMUNICATION_PROFILE' AND scope_type = 'COMMUNICATION_SUBJECT' OR session_kind NOT IN ('APPEAL_CREATE','APPEAL_STATUS','COMMUNICATION_PROFILE')"
        - "session_kind IN ('APPEAL_CREATE','APPEAL_STATUS','COMMUNICATION_PROFILE') AND parent_session_id IS NOT NULL AND scope_binding_digest IS NOT NULL AND issuance_receipt_digest IS NOT NULL AND rotation_sequence > 0 OR session_kind NOT IN ('APPEAL_CREATE','APPEAL_STATUS','COMMUNICATION_PROFILE') AND rotation_sequence = 0"
        - "scope_binding_digest IS NULL OR ops.is_lower_sha256(scope_binding_digest)"
        - "issuance_receipt_digest IS NULL OR ops.is_lower_sha256(issuance_receipt_digest)"
      rule: RESPONSE_RECEIPT remains read-only, 30-minute and allowed only getResponseReceipt. APPEAL_CREATE is a distinct one-use response-submission command session, APPEAL_STATUS is a distinct appeal-scoped read session, and COMMUNICATION_PROFILE is a subject-scoped profile session derived from one exact eligible parent scope. None is interchangeable with its parent or another derived kind.
    - relation: intake.response_extension_requests
      action: ADD_OPTIMISTIC_VERSION_AND_REQUEST_DIGEST
      add_columns:
        version: {type: bigint, nullable: false, default: 1}
        request_digest: {type: char(64), nullable: false, backfill: RFC8785_JCS(ResponseExtensionRequestStoredV1) lowercase SHA-256}
        updated_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      preserve_status_values: [SUBMITTED, APPROVED, REJECTED]
      concurrency: requestResponseExtension inserts version=1 and the canonical request_digest; decideResponseExtension locks the row and matches expectedVersion plus request_digest before one APPROVED or REJECTED transition, increments version exactly once, and stores updated_at from clock_timestamp().
      base_runtime_rule: preserve the current runtime 0001..0024 bytes and their already-closed SUBMITTED behavior; 0027 neither restores nor rewrites a prior migration.

closed_type_implementation:
  sql_type: text
  enforcement: named CHECK constraint using the exact value set below
  postgres_enum: forbidden for this migration so future policy versions require a reviewed CHECK replacement rather than ALTER TYPE side effects

