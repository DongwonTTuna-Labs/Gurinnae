        - {name: response_access_current_shape_ck, expression: "artifact_contract_version <> 'COMMUNICATION_V1' OR (token_generation > 0 AND response_request_version > 0 AND response_request_binding_digest IS NOT NULL AND communication_intent_id IS NOT NULL AND communication_intent_digest IS NOT NULL AND rendering_id IS NOT NULL AND rendering_digest IS NOT NULL AND token_ciphertext IS NOT NULL AND token_encryption_key_id IS NOT NULL AND otp_derivation_version IS NOT NULL AND otp_verifier_hmac IS NOT NULL AND otp_verifier_key_version IS NOT NULL AND artifact_binding_digest IS NOT NULL)"}
