              direct_ops_idempotency_keys:
                pre_finalize: exactly-one-schema-qualified-SELECT-INTO-STRICT-FOR-UPDATE of the complete selected_columns set; require the same incomplete BOUND_V1 tuple and claim_transaction_xid8 = pg_current_xact_id()
                post_finalize: exactly-one-schema-qualified-SELECT-INTO-STRICT of the complete selected_columns set after the owner call
                selected_columns: [scope, key_hash, request_hash, operation_id, bff_issuer, session_token_hash, claim_generation, claim_transaction_xid8, storage_format, terminal_disposition, terminalized_at, tombstone_digest, response_status, response_body, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, resource_type, resource_id, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at, expires_at]
                post_finalize_equality: persisted scope, key, request, operation, null BFF/session, generation, preserved claim_transaction_xid8, BOUND_V1, RESPONSE_FINAL marker, terminalized/completed time, status, schema, media type, exact header bytes, exact body bytes, parsed compatibility response JSON, response digest, JOURNEY_HANDOFF resource, receipt ID/digest, audit ID, outbox ID and completed tuple all equal the verified internal finalize composite and pre-finalize binding; JSON reserialization is forbidden
                insert: zero
                update: only-transitively-through-exactly-one-owner-finalize-call
                delete: zero
                copy: zero
              other_idempotency_helpers: zero
          relation_access_set_equality_oracle: pg_get_functiondef and a schema-qualified SQL call graph prove the three exact rows above, exact call counts and exact direct relation statements; any extra/missing read, DML, helper, overload, replay call, SELECT *, dynamic SQL or partial post-finalize comparison fails migration and design validation
      pre_cutover_legacy_policy:
        invariant: No pre-0027 row is silently treated as a BOUND_V1 row, and no legacy row can ever satisfy a SUBMISSION_DERIVED claim because those scopes did not exist before this migration.
        maintenance_fence:
          - Enter declared idempotency maintenance mode and stop admission of every old application revision that performs direct ops.idempotency_keys DML.
          - Wait until pg_stat_activity proves that every transaction admitted by an old revision has ended; an elapsed timeout aborts the migration rather than terminating a session or guessing whether an effect occurred.
          - Revoke table-wide and per-column runtime ACLs before classification, take SHARE ROW EXCLUSIVE on ops.idempotency_keys, and assert no runtime role can open a new direct-DML transaction.
        classification_cutover_at: one transaction_timestamp() value captured once for the migration and reused for every classification and evidence count
        classification:
          completed_unexpired_known_scope:
            predicate: response_status IS NOT NULL AND response_body IS NOT NULL AND expires_at > classification_cutover_at and scope maps to exactly one operation and runtime owner in the pinned legacy registry
            action: set storage_format=LEGACY_V13, operation_id to the exact mapped operation, claim_generation=1, terminal_disposition=LEGACY_FINAL_COMPAT and terminalized_at=classification_cutover_at; generate response_schema=LegacyJsonResponseV13, application/json media, canonical safe headers, UTF-8 PostgreSQL-18.4-jsonb-text response bytes and response_digest without inventing receipt/audit/outbox/completion metadata
            replay: only the mapped legacy caller, exact scope/key/request and NULL BFF/session binding may receive the canonicalized compatibility bytes; the receipt identifies LEGACY_FINAL_COMPAT so callers never claim original byte identity
          completed_expired_or_unknown_scope:
            predicate: response_status IS NOT NULL AND response_body IS NOT NULL and either expires_at <= classification_cutover_at or the legacy scope registry has no exact single owner
            action: clear response_status/response_body/resource fields after computing a nonreversible tombstone_digest, set storage_format=LEGACY_V13, claim_generation=1, terminal_disposition=LEGACY_EXPIRED_TOMBSTONE and terminalized_at=classification_cutover_at
            replay: terminal unavailable with no bytes and no row-existence detail; the key is never reclaimed
          incomplete_after_drain:
            predicate: response_status IS NULL AND response_body IS NULL
            action: classify as LEGACY_AMBIGUOUS_TOMBSTONE, clear resource fields, store only the nonreversible tombstone_digest and terminalized_at, and require operator reconciliation for any possible historical effect
            rationale: the old implementation committed claims separately from completion, so expiry or absence of response bytes cannot prove that no external/domain effect occurred
          partial_or_invalid:
            predicate: num_nonnulls(response_status,response_body) = 1 or any completed row fails bounded JSON compatibility encoding
            action: classify as LEGACY_CORRUPT_TOMBSTONE with a nonreversible digest and zero replay bytes; emit only aggregate migration counts to owner-only evidence
        constraints_and_trigger_order:
          - Add new columns nullable and add CHECK constraints NOT VALID so legacy rows can be classified without a false 23514 failure.
          - Classify every row and assert the four predicates are exhaustive, mutually exclusive and set-equal to the pre-cutover primary-key snapshot.
          - Set claim_generation/storage_format NOT NULL, install the boundary-transition trigger, VALIDATE every new CHECK, then create functions and grant only exact EXECUTE/TYPE USAGE.
          - Run the PostgreSQL 18.4 ACL and behavior canary in the same release gate before old application admission remains disabled and before the new application revision is admitted.
        rollback: roll-forward only after ACL revocation; restoring direct runtime DML or reclassifying a tombstone as executable is forbidden
        evidence: Persist owner-only row counts for each class, constraints validated, registry digest, migration version and cutover timestamp; never persist key_hash, request_hash, token/session hash, response bytes or per-row tombstone digests in logs, audit or telemetry.
      bound_row_lifecycle:
        active_claim:
          terminal_disposition: null
          terminal_tuple: all null
          expiry_semantics: expires_at is an incomplete-claim lease, not permission to overwrite a finalized or tombstoned result
        expired_reclaim:
          eligibility: storage_format=BOUND_V1, terminal_disposition IS NULL, the entire terminal tuple is NULL and expires_at <= clock_timestamp()
          edge: while holding the primary-key row FOR UPDATE, replace the complete claim binding and resource hint, increment claim_generation exactly once, set created_at and expires_at from validated inputs, leave the terminal tuple all NULL and return RECLAIMED_EXPIRED
          fencing: finalize and replay take expected_claim_generation; a worker holding an older generation changes zero rows and receives IDEMPOTENCY_STALE_CLAIM
          changed_request: an unexpired row with a changed request is IDEMPOTENCY_CONFLICT with zero mutation; an eligible expired incomplete row may be reclaimed for a changed request only through the generation-fenced edge
        response_final:
          edge: only finalize changes terminal_disposition NULL to RESPONSE_FINAL and populates the entire terminal tuple in the command transaction
          expiry_semantics: RESPONSE_FINAL remains replayable after claim expiry and after the bound one-shot session is consumed or rotated; expiry never makes it reclaimable
        terminal_tombstone:
          edge: legal-hold-aware owner retention may replace RESPONSE_FINAL with RETAINED_FINAL_TOMBSTONE, clear replay bytes/compatibility JSON/correlation IDs and preserve only the primary-key/request binding, generation, terminalized time and nonreversible tombstone digest
          behavior: claim/replay return IDEMPOTENCY_TERMINAL_UNAVAILABLE in the same external shape as another unavailable binding; a tombstone is immutable and never reclaimable
      boundary_functions:
        - ops.claim_idempotency_v1(ops.idempotency_claim_v1) RETURNS ops.idempotency_claim_receipt_v1
        - ops.finalize_idempotency_response_v1(ops.idempotency_finalize_v1) RETURNS ops.idempotency_finalize_receipt_v1
        - ops.replay_idempotency_response_v1(ops.idempotency_replay_v1) RETURNS ops.idempotency_replay_receipt_v1
