      safe_retry_provider_config_id: {type: uuid, nullable: true}
      safe_retry_provider_config_version: {type: bigint, nullable: true}
      safe_retry_provider_configuration_digest: {type: char(64), nullable: true}
      safe_retry_provider_preflight_receipt_digest: {type: char(64), nullable: true}
      safe_retry_provider_idempotency_key_sha256: {type: char(64), nullable: true}
      safe_retry_request_sha256: {type: char(64), nullable: true}
      callback_event_ids: {type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      attempt_ids: {type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      actor_id: {type: uuid, nullable: false}
      capability: {type: text, nullable: false}
      assurance: {type: text, nullable: false}
