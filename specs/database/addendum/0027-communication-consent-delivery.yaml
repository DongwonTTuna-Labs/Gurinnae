          - "REVOKE ALL PRIVILEGES (scope,key_hash,request_hash,response_status,response_body,resource_type,resource_id,created_at,expires_at,operation_id,bff_issuer,session_token_hash,claim_generation,claim_transaction_xid8,storage_format,terminal_disposition,terminalized_at,tombstone_digest,response_schema,response_media_type,response_header_bytes,response_body_bytes,response_digest,receipt_id,receipt_digest,audit_event_id,outbox_id,completed_at) ON TABLE ops.idempotency_keys FROM PUBLIC, gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_workflow_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api"
        sequence_acl: ops.idempotency_keys has no owned sequence because its primary key is composite text/hash; catalog preflight must prove zero pg_depend-owned sequence instead of issuing a nonexistent-sequence REVOKE.
        final_table_acl:
          PUBLIC: []
          gurine_public_api: []
          gurine_submission_api: []
          gurine_control_api: []
          gurine_ingest_worker: []
          gurine_analysis_worker: []
          gurine_public_projector: []
          gurine_notification_worker: []
          gurine_workflow_worker: []
          gurine_document_extractor: []
          gurine_scheduler: []
          gurine_auditor: []
          gurine_identity_api: []
        final_column_acl: every runtime role and PUBLIC has zero SELECT, INSERT, UPDATE or REFERENCES privilege on every all_columns entry; table-level and column-level ACLs are both inspected.
        regrant_rule: No table or column privilege is regranted. Generic runtime access is EXECUTE only on the three exact generic SECURITY DEFINER signatures; journey runtime access reaches this relation only through the exact owner-call and schema-qualified direct-read registry below, whose migrator-only owner functions remain non-executable by runtime roles. Direct reads are confined to the apply SELECT and finalize pre/post reads; no direct journey DML is granted.
      claim_scope_registry:
        rule: The claim function maps session_user to an exact reviewed scope set; LIKE-prefix authorization alone is forbidden, and an unregistered operation/scope fails before table access.
        compilation: Migration generation materializes one sorted, duplicate-free SQL text-array literal per caller from the sources below and pins its SHA-256 in the migration self-check. Runtime YAML/file reads, prefixes, regex authorization and caller-provided registry values are forbidden.
        gurine_submission_api:
          base_source: exact operation_id set where specs/api/operation-contracts.yaml api=submission-api and idempotency is required
          additive_exact: [SUBMISSION_DERIVED.ISSUE_COMMUNICATION_PROFILE.V1, SUBMISSION_DERIVED.ISSUE_RESPONSE_APPEAL_CREATE.V1, SUBMISSION_DERIVED.ROTATE_RESPONSE_APPEAL_STATUS.V1, SUBMISSION_DERIVED.CREATE_RESPONSE_APPEAL.V1, SUBMISSION_DERIVED.REQUEST_COMMUNICATION_ENDPOINT_LINK.V1, SUBMISSION_DERIVED.VERIFY_COMMUNICATION_ENDPOINT_LINK.V1, SUBMISSION_DERIVED.UNLINK_COMMUNICATION_ENDPOINT.V1]
        gurine_control_api:
          base_source: exact operation_id set where specs/api/operation-contracts.yaml api=control-api and idempotency is required
          additive_exact: [CONTROL.COMMUNICATION_AUTHORIZATION_DECISION.V1, CONTROL.COMMUNICATION_RECONCILIATION.V1, CONTROL.CANCEL_OUTBOUND_DELIVERY.V1, CONTROL.RESPONSE_EXTENSION_DECISION.V1, CONTROL.RESPONSE_APPEAL_TRANSITION.V1]
        gurine_identity_api:
          exact: [createLoginTransaction, consumeLoginCallback, createStepUpTransaction, consumeStepUpCallback, resolveInternalSession, revokeInternalSession, getSecurityManagementRedirectInternal, issueActorAssertion, closeStepUpAuthorization]
        other_runtime_roles: only exact scopes separately compiled by their owning migration; absence from the registry denies rather than falling back to direct DML
        cross_role_disjointness: every compiled caller set is pairwise disjoint; a duplicate operation ID across service roles is a build-time authority conflict and cannot be resolved by first-match order
        set_equality_oracle: Extract embedded array literals from pg_get_functiondef(ops.claim_idempotency_v1), compare each caller set to its canonical source plus additive_exact and fail on missing, extra, duplicate, cross-role overlap or prefix-like entry.
      journey_owner_routine_internal_scope_registry:
        rule: These four scopes are forbidden to the generic claim/finalize/replay functions and are claimable only through dedicated migrator-only SECURITY INVOKER owner functions called by the matching SECURITY DEFINER boundary after it validates session_user. JOURNEY_HANDOFF_DECISION alone uses the separately committed fresh-assertion attempt plus prepare/apply/finalize split; the other three scopes retain their ordinary single-business-transaction owner boundary. No runtime role has direct EXECUTE on the owner functions.
        JOURNEY_START:
          operations: [ops.start_journey_instance_v1]
          session_users: [gurine_control_api, gurine_workflow_worker]
        JOURNEY_HANDOFF_REQUEST:
          operations: [ops.request_journey_handoff_v1]
          session_users: [gurine_control_api, gurine_workflow_worker]
        JOURNEY_HANDOFF_DECISION:
          operations: [decideJourneyHandoff, ops.decide_journey_handoff_v1]
          session_users: [gurine_control_api, gurine_workflow_worker]
        JOURNEY_OUTCOME:
          operations: [ops.record_journey_outcome_v1]
          session_users: [gurine_control_api, gurine_workflow_worker]
        binding_profile: OWNER_ROUTINE_REQUEST_BOUND
        binding_rules:
          - bff_issuer and session_token_hash are null and may not be overloaded with actor or service assertion bytes
          - wire_request_digest proves the assertion was bound to the exact selected entry-boundary envelope: the actor HTTP attempt digest or the service commandEnvelopeDigest; business_request_hash is a separate seven-field idempotency identity and the digests are never substituted for or compared as each other
          - only JOURNEY_HANDOFF_DECISION validates and consumes actor_assertion_jti or service_assertion_jti in ops.assertion_replay_guard in a separately committed authorization-attempt transaction before its business claim; that transaction appends one immutable ASSERTION_ATTEMPT_CONSUMED audit bound to operation, transport request ID, wire request digest, Idempotency-Key digest and business request hash
          - only JOURNEY_HANDOFF_DECISION requires a fresh actor/service assertion JTI on retry; assertion JTI, assertion token bytes and transport request ID are attempt identity and are excluded from its business_request_hash, while no other JOURNEY_* scope inherits this split or stable seven-field projection
          - For JOURNEY_HANDOFF_DECISION the seven-field business_request_hash contains exactly operation_id, handoff_id, expected_handoff_version, expected_binding_digest, decision, reason_code and canonical reason_digest; randomized reason_encrypted, plaintext reason and every assertion/transport field are excluded
          - final response bytes bind the terminal decision receipt, optional replacement request receipt and final parent head; only a changed business_request_hash under one key is IDEMPOTENCY_CONFLICT
          - The trusted control-api or workflow-worker boundary canonicalizes plaintext when the selected branch permits it and computes reason_digest before the business prepare call. It encrypts only after prepare returns NEW in the still-open SERIALIZABLE business transaction; FINAL returns stored bytes without encryption or mutation and SQL never receives plaintext.
          - a NEW claim, domain effects, command audit/outbox/receipts and exact response-byte finalization commit in the same SERIALIZABLE transaction; a deferred commit guard rejects an incomplete JOURNEY_HANDOFF_DECISION claim, while the earlier replay-guard and authorization-attempt audit remain committed
          - claim expiry comes from the command-idempotency retention policy and never from caller input
        fresh_assertion_attempt_boundary:
          applies_to_scopes: [JOURNEY_HANDOFF_DECISION]
          applies_to_operations: [decideJourneyHandoff]
          inference_to_other_scopes: FORBIDDEN
          transaction_a:
            order: verify signature, audience, exact wire request binding and semantic request; compute canonical reason_digest and business_request_hash; consume fresh JTI; append authorization-attempt audit; COMMIT
            writes: [ops.assertion_replay_guard, ops.audit_events#ASSERTION_ATTEMPT_CONSUMED]
            persisted_xid_proof: replay guard attempt_transaction_xid8 and generated audit attempt_transaction_xid8 are non-null, byte-equal xid8 values captured from pg_current_xact_id() by their controlled INSERT producers; caller input, legacy backfill and UPDATE are forbidden
            duplicate_jti: reject before transaction_b with zero business writes
          transaction_b:
            order: BEGIN SERIALIZABLE; prepare business claim; on FINAL return stored bytes without encryption; on NEW encrypt locally then apply domain transition and finalize exact response bytes; COMMIT
            atomic_writes: [ops.idempotency_keys, binding-specific domain relations, ops.journey_instances, ops.journey_handoffs, ops.journey_transition_receipts, ops.audit_events#command, ops.outbox]
            top_level_xid_proof: NEW owner claim records claim_transaction_xid8=pg_current_xact_id(); apply and finalize require the same equality even under SAVEPOINT or nested SAVEPOINT, while FINAL_REPLAY is historical and does not require current-xid equality
            incomplete_claim_commit: rejected by deferred constraint trigger
          crash_semantics:
            after_transaction_a_before_b: only attempt evidence persists and another fresh JTI may retry the same stable business request
            inside_transaction_b: claim, effect and finalization all roll back together
            after_transaction_b_commit_before_http_response: another fresh JTI reaches FINAL and receives byte-identical stored response
        set_equality_oracle: The four scope keys and exact session_user/operation sets equal three command owner routines plus the dedicated JOURNEY_HANDOFF_DECISION prepare/finalize boundary; the decision apply routine owns no ops.idempotency_keys write. Missing, extra, duplicate or cross-scope operation membership fails migration and design validation.
        generic_boundary_exclusion: ops.claim_idempotency_v1, ops.finalize_idempotency_response_v1 and ops.replay_idempotency_response_v1 reject every JOURNEY_* scope before relation access even when session_user has generic EXECUTE for unrelated control operations.
        owner_internal_functions:
          security: SECURITY INVOKER; owner gurine_migrator; SET search_path=pg_catalog,ops; dynamic SQL forbidden
          signatures:
            - ops.claim_owner_idempotency_v1(ops.idempotency_claim_v1) RETURNS ops.idempotency_claim_receipt_v1
            - ops.finalize_owner_idempotency_response_v1(ops.idempotency_finalize_v1) RETURNS ops.idempotency_finalize_receipt_v1
            - ops.replay_owner_idempotency_response_v1(ops.idempotency_replay_v1) RETURNS ops.idempotency_replay_receipt_v1
          execute_acl:
            gurine_migrator: [claim_owner, finalize_owner, replay_owner]
            PUBLIC: []
            gurine_public_api: []
            gurine_submission_api: []
            gurine_control_api: []
            gurine_ingest_worker: []
            gurine_analysis_worker: []
            gurine_public_projector: []
            gurine_notification_worker: []
            gurine_workflow_worker: []
            gurine_document_extractor: []
            gurine_scheduler: []
            gurine_auditor: []
            gurine_identity_api: []
          exact_outer_caller_registry:
            ops.claim_owner_idempotency_v1: [ops.start_journey_instance_v1, ops.request_journey_handoff_v1, ops.prepare_journey_handoff_decision_v1, ops.record_journey_outcome_v1]
            ops.finalize_owner_idempotency_response_v1: [ops.start_journey_instance_v1, ops.request_journey_handoff_v1, ops.finalize_journey_handoff_decision_response_v1, ops.record_journey_outcome_v1]
            ops.replay_owner_idempotency_response_v1: [ops.start_journey_instance_v1, ops.request_journey_handoff_v1, ops.prepare_journey_handoff_decision_v1, ops.record_journey_outcome_v1]
          zero_owner_function_callers: [ops.decide_journey_handoff_v1, ops.escalate_journey_handoff_v1, ops.expire_journey_handoff_v1]
          invocation_rule: start, request and outcome call the three owner functions inside their ordinary command transaction; decision prepare calls claim and conditionally replay, decision finalize calls finalize exactly once and never replay, decision apply and both scheduler routines call no owner function. Every caller is a fixed SECURITY DEFINER identity and no runtime role calls an owner function directly.
          caller_set_equality_oracle: pg_get_functiondef on every exact outer signature proves all-and-only the registry calls, one callsite per allowed owner function, fixed scope/operation constants before relation access, no call in zero_owner_function_callers and no dynamic or overload dispatch.
          caller_rule: The outer journey owner routine validates session_user against the scope row and computes the canonical request hash before the inner function; the inner function additionally requires current_user=gurine_migrator and an exact registered scope/operation tuple.
          relation_rule: Claim, finalize and replay share the same immutable tuple, lease, terminal byte and zero-write replay semantics as the generic boundary but use a disjoint scope registry and cannot fall back to generic caller allowlists.
          relation_access_registry:
            ops.prepare_journey_handoff_decision_v1:
              owner_calls: {ops.claim_owner_idempotency_v1: exactly-once, ops.replay_owner_idempotency_response_v1: exactly-once-iff-FINAL_AVAILABLE, ops.finalize_owner_idempotency_response_v1: zero}
              direct_ops_idempotency_keys: {select: zero, insert: zero, update: zero, delete: zero, copy: zero}
            ops.decide_journey_handoff_v1:
              owner_calls: {ops.claim_owner_idempotency_v1: zero, ops.replay_owner_idempotency_response_v1: zero, ops.finalize_owner_idempotency_response_v1: zero}
              direct_ops_idempotency_keys:
                select: exactly-one-schema-qualified-SELECT-INTO-STRICT
                lock: none-additional-prepare-retains-row-lock
                selected_columns: [scope, key_hash, request_hash, operation_id, bff_issuer, session_token_hash, claim_generation, claim_transaction_xid8, storage_format, terminal_disposition, terminalized_at, tombstone_digest, response_status, response_body, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, resource_type, resource_id, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at, expires_at]
                predicate: exact JOURNEY_HANDOFF_DECISION key; BOUND_V1; decideJourneyHandoff; null BFF/session; exact seven-field request hash, claim generation and canonical JOURNEY_HANDOFF resource; unexpired lease; claim_transaction_xid8 = pg_current_xact_id(); all terminal marker, compatibility JSON, response byte, digest, receipt, audit, outbox and completion fields NULL
                insert: zero
                update: zero
                delete: zero
                copy: zero
