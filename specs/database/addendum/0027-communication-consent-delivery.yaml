      acknowledgement_body_length: {type: bigint, nullable: false}
      acknowledgement_encryption_key_id: {type: text, nullable: false}
      acknowledgement_digest: {type: char(64), nullable: false}
      verification_receipt_digest: {type: char(64), nullable: false}
