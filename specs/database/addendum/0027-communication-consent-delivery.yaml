      receipt_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {name: response_request_sent_source_event_fk, columns: [source_event_id, source_event_envelope_digest], references: 'ops.outbox(id,envelope_digest)', on_delete: RESTRICT}
      - {name: response_request_sent_request_fk, columns: [response_request_id, response_request_binding_digest], references: 'editorial.response_requests(id,request_binding_digest)', on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: response_request_sent_intent_fk, columns: [communication_intent_id, communication_intent_digest], references: 'ops.communication_intents(id,intent_digest)', on_delete: RESTRICT}
      - {name: response_request_sent_rendering_fk, columns: [rendering_id, rendering_digest, rendered_sha256], references: 'ops.communication_renderings(id,rendering_digest,rendered_sha256)', on_delete: RESTRICT}
      - {name: response_request_sent_access_artifact_fk, columns: [response_access_token_id, response_request_id, communication_intent_id, rendering_id, access_artifact_binding_digest], references: 'intake.response_access_tokens(id,response_request_id,communication_intent_id,rendering_id,artifact_binding_digest)', on_delete: RESTRICT}
      - {name: response_request_sent_endpoint_fk, columns: [endpoint_id, endpoint_version, endpoint_snapshot_digest, channel], references: 'intake.communication_endpoint_link_events(endpoint_id,endpoint_version,endpoint_snapshot_digest,channel)', on_delete: RESTRICT}
      - {name: response_request_sent_preflight_fk, columns: [provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest], references: 'ops.communication_provider_preflight_receipts(id,provider_config_id,provider_config_version,configuration_digest,receipt_digest)', on_delete: RESTRICT}
      - {name: response_request_sent_delivery_fk, columns: [delivery_id, communication_intent_id, delivery_object_type, response_request_id], references: 'ops.outbound_deliveries(id,intent_id,object_type,object_id)', on_delete: RESTRICT}
      - {name: response_request_sent_delivery_receipt_fk, columns: [delivery_receipt_id, delivery_id, delivery_receipt_sequence, delivery_receipt_digest, delivery_resulting_state, delivery_receipt_applied], references: 'ops.outbound_delivery_receipts(id,delivery_id,receipt_sequence,receipt_digest,resulting_state,applied)', on_delete: RESTRICT}
      - {name: response_request_sent_audit_fk, columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
      - {name: response_request_sent_outbox_fk, columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT, deferrable: true, initially: DEFERRED}
    unique_constraints:
      - {columns: [response_request_id], name: response_request_sent_once_uq}
      - {columns: [source_event_id], name: response_request_sent_source_event_uq}
      - {columns: [delivery_receipt_id], name: response_request_sent_delivery_receipt_uq}
      - {columns: [receipt_digest], name: response_request_sent_receipt_digest_uq}
      - {columns: [outbox_event_id], name: response_request_sent_outbox_uq}
      - {columns: [id, response_request_id, receipt_digest], name: response_request_sent_exact_binding_uq}
    checks:
      - prior_request_version > 0 AND request_version = prior_request_version + 1 AND endpoint_version > 0 AND provider_config_version > 0 AND delivery_version > 0 AND delivery_receipt_sequence > 0
      - prior_state = 'DRAFT' AND state = 'SENT'
      - delivery_object_type = 'RESPONSE_REQUEST'
      - delivery_receipt_applied AND delivery_resulting_state IN ('PROVIDER_ACCEPTED','DELIVERED','READ')
      - acceptance_evidence_kind IN ('PROVIDER_RESPONSE','SIGNED_PROVIDER_CALLBACK','AUTHENTICATED_PROVIDER_POLL','OFFICIAL_CHANNEL_RECEIPT','RECONCILIATION_PROOF')
      - provider_accepted_at <= created_at
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - ops.is_lower_sha256(source_event_envelope_digest) AND ops.is_lower_sha256(response_request_binding_digest) AND ops.is_lower_sha256(scope_digest) AND ops.is_lower_sha256(communication_intent_digest) AND ops.is_lower_sha256(rendering_digest) AND ops.is_lower_sha256(rendered_sha256) AND ops.is_lower_sha256(access_artifact_binding_digest) AND ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(provider_configuration_digest) AND ops.is_lower_sha256(provider_preflight_receipt_digest) AND ops.is_lower_sha256(delivery_receipt_digest) AND ops.is_lower_sha256(provider_evidence_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: response_request_sent_request_idx, columns: [response_request_id, request_version, id]}
      - {name: response_request_sent_delivery_idx, columns: [delivery_id, delivery_receipt_sequence, id]}
      - {name: response_request_sent_intent_idx, columns: [communication_intent_id, rendering_id, id]}
    privileges:
      gurine_control_api: [SELECT]
      gurine_submission_api: []
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: editorial.materialize_response_request_sent_v1, execute: [gurine_workflow_worker], security_definer: true}
    rls: {enabled: false, reason: internal immutable receipt with no token, endpoint plaintext, message bytes or provider-native identifier}
    mutability:
      mode: APPEND_ONLY_SINGLE_SENT_RECEIPT
      trigger: ops.reject_mutation
      transaction: SERIALIZABLE; claim the response-request-materializer inbox row and verify its envelope digest, reload the source outbox and exact applied receipt, lock request/intent/rendering/access artifact/endpoint/provider/delivery in the declared order, insert this receipt, perform exactly one DRAFT to SENT version increment, set response_requests.sent_receipt_id/sent_binding_digest/sent_at, append audit and response.request_sent.v1 outbox, and finalize the typed inbox result atomically. Exact replay returns the stored result with zero writes. Changed replay and nonqualifying evidence write no request state.
      clock_separation: This writer never reads or writes editorial.response_delivery_clock_decisions. PROVIDER_ACCEPTED opens the portal but only separately verified DELIVERED or READ starts the response clock.
    retention:
      record_class: RESPONSE_DELIVERY_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: response request, response, correction, appeal and publication record schedule union
      terminal_action: PRESERVE_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [response_request_id, delivery_id, id]
    repository:
      roundtrip: Every identity/version/digest, resulting state, applied flag and receipt-derived provider_accepted_at is stored and returned exactly; no timestamp or digest is reconstructed from a mutable head.
      detail_order: [response_request_id, request_version, id]

  ops.business_calendar_versions:
    owner:
      domain: ResponseDeliveryClockDecision
      service: workflow-worker
      repository: crates/persistence-postgres::response_clock
      rust_row: BusinessCalendarVersionRow
      rust_domain: gurine_domain::response::BusinessCalendarVersion
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      calendar_id: {type: uuid, nullable: false}
      version: {type: bigint, nullable: false}
      timezone: {type: text, nullable: false}
      weekend_days: {type: 'smallint[]', nullable: false}
      holiday_dates: {type: 'date[]', nullable: false, default: "'{}'::date[]"}
      holiday_set_digest: {type: char(64), nullable: false}
      policy_digest: {type: char(64), nullable: false}
      calendar_digest: {type: char(64), nullable: false}
      approval_proposal_id: {type: uuid, nullable: false}
      approval_proposal_version: {type: bigint, nullable: false}
      approval_digest: {type: char(64), nullable: false}
      execution_receipt_id: {type: uuid, nullable: false}
      execution_receipt_digest: {type: char(64), nullable: false}
      effective_at: {type: timestamptz, nullable: false}
      review_expires_at: {type: timestamptz, nullable: false}
      created_by: {type: uuid, nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [approval_proposal_id], references: ops.action_proposals(id), on_delete: RESTRICT}
      - {columns: [execution_receipt_id], references: ops.execution_receipts(id), on_delete: RESTRICT}
      - {columns: [created_by], references: ops.users(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [calendar_id, version], name: business_calendar_version_uq}
      - {columns: [calendar_id, effective_at], name: business_calendar_effective_at_uq}
      - {columns: [calendar_digest], name: business_calendar_digest_uq}
      - {columns: [execution_receipt_id], name: business_calendar_execution_receipt_uq}
    checks:
      - version > 0 AND approval_proposal_version > 0
      - length(timezone) BETWEEN 1 AND 64 AND timezone !~ '\\s'
      - cardinality(weekend_days) BETWEEN 1 AND 6 AND ops.smallint_array_is_unique(weekend_days) AND weekend_days <@ ARRAY[0,1,2,3,4,5,6]::smallint[]
      - cardinality(holiday_dates) <= 5000 AND ops.date_array_is_sorted_unique(holiday_dates)
      - review_expires_at > effective_at
      - ops.is_lower_sha256(holiday_set_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(calendar_digest) AND ops.is_lower_sha256(approval_digest) AND ops.is_lower_sha256(execution_receipt_digest)
    indexes:
      - {name: business_calendar_current_idx, columns: [calendar_id, effective_at DESC, version DESC, id DESC]}
      - {name: business_calendar_review_expiry_idx, columns: [review_expires_at, calendar_id, version]}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.create_business_calendar_version, execute: [gurine_workflow_worker], security_definer: true}
    rls: {enabled: false, reason: internal immutable policy relation}
    mutability:
      mode: APPEND_ONLY
      trigger: ops.reject_mutation
      version_rule: SERIALIZABLE insertion locks the latest calendar row, requires expectedCalendarVersion, inserts version+1 and never changes an earlier effective point. Current version at time T is max(effective_at,version,id) where effective_at <= T and review_expires_at > T.
    retention:
      record_class: RESPONSE_POLICY_CALENDAR
      schedule_binding: retention_defaults.schedule_binding
      trigger: policy supersession
      terminal_action: PRESERVE_POLICY_VERSION
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [calendar_id, id]
    repository:
      roundtrip: timezone, ordered unique weekend days and ordered unique holiday dates are exact; tzdb lookup failure is BUSINESS_CALENDAR_STALE
      version_order: [version, id]
      effective_order: [effective_at DESC, version DESC, id DESC]

