  response_portal_boundary:
    resolver: editorial.resolve_response_portal_window_v1
    resolver_algorithm:
      - Read exactly one response request by ID and never read editorial.response_requests.due_at.
      - Return open for SENT or VIEWED when effective_due_at is NULL or strictly greater than transaction_timestamp().
      - If effective_due_at has elapsed, return open only when exactly one latest response extension request remains SUBMITTED, ordered by submitted_at DESC, id DESC, its immutable submitted_at is no later than effective_due_at, and no terminal response or later APPROVED/REJECTED decision exists. Ties are impossible because id is the final order key; an older timely request cannot win over a later untimely request.
      - Every other state or elapsed window is closed; missing and closed return the same outward unavailable class through the owning portal routine.
    mandatory_callers: [intake.exchange_response_magic_token_v2, intake.verify_response_session_v2, intake.get_response_access_status_session_v2, intake.get_response_request_session_v2, intake.download_response_request_session_v2, intake.get_response_draft_session_v2, intake.get_response_preview_session_v2, intake.save_response_draft_session_v2, intake.create_response_attachment_session_v2, intake.finalize_response_attachment_session_v2, intake.delete_response_attachment_session_v2, intake.request_response_extension_session_v2, intake.submit_response_session_v2]
    forbidden_deadline_authority: [editorial.response_requests.due_at, caller timestamp, HTTP clock, session expires_at as response deadline]
    otp_verification:
      - The response access artifact stores one purpose-separated OTP verifier HMAC and immutable key version before delivery; neither value is selectable by gurine_submission_api.
      - Submission API computes the candidate verifier from the user-supplied OTP and the exact response-access purpose context, then calls intake.verify_response_session_v2. PostgreSQL locks the pending session and bound artifact and compares candidate key version plus verifier HMAC directly in constant time.
      - A mismatch increments the bounded attempt counter and may lock the artifact but cannot create an active session. Only an exact match rotates pending to active in the same transaction.
      - The old intake.verify_response_session(char(64),text,boolean,char(64),timestamptz) and every overload containing a caller success boolean are dropped before grants; pg_proc and has_function_privilege prove zero PUBLIC/runtime EXECUTE.
    direct_relation_acl: gurine_submission_api has zero SELECT on intake.response_access_tokens and editorial.response_requests; all portal reads and writes pass through the exact SECURITY DEFINER routines and the shared resolver
  acl_oracles:
    - Every exact signature above has proacl containing only its execute roles after explicit REVOKE ALL FROM PUBLIC and all other runtime roles.
    - gurine_submission_api has no direct SELECT/INSERT/UPDATE/DELETE on scoped intake relations; the SECURITY DEFINER function validates token hash, issuer, kind, scope, expiry, status, lineage and expected version before SET LOCAL scope.
    - Ciphertext-returning types are executable only by gurine_submission_api or gurine_notification_worker as declared; control/workflow/auditor receipt types contain digests and safe projections only.
    - pg_proc.proconfig contains exactly the declared search_path and no role-changing or row-security-disabling setting; every function owner is gurine_migrator.
    - The 31 relation mutation-function signatures remain set-equal to table privilege declarations. Every idempotent one calls the exact claim/finalize/replay boundary under the caller's session_user and pg_get_functiondef contains no direct INSERT, UPDATE, DELETE, SELECT or COPY against ops.idempotency_keys.
    - The three generic plus three migrator-only owner idempotency signatures are additional disjoint infrastructure boundaries, not replacements or overloads of the 31 domain signatures; exact regprocedure lookup has one row per signature and no default-argument or variadic shadow. Generic functions reject JOURNEY_* before table access and owner functions grant EXECUTE only to gurine_migrator.

journey_handoff_assertion_attempt_boundary:
  purpose: preserve the immutable v13 assertion replay contract while committing fresh-JTI consumption and one trusted attempt audit before any journey decision business transaction
  entry_transport_mapping:
    ACTOR: {session_user: gurine_control_api, transport: CONTROL_COMMAND, transport_request_id: HTTP request ID, wire_request_digest: request-bound ActorAssertion canonical HTTP attempt digest}
    SERVICE: {session_user: gurine_workflow_worker, transport: JOURNEY_WORKFLOW_DB_COMMAND, transport_request_id: commandInstanceId, wire_request_digest: commandEnvelopeDigest}
    business_request_hash: JOURNEY_HANDOFF_DECISION_BUSINESS_V1(exact seven semantic fields)
    non_substitution: transport_request_id identifies one attempt; wire_request_digest authenticates its complete boundary envelope; business_request_hash identifies stable business bytes. No field or digest may be copied into another slot.
  decision_reason_shape:
    discriminator: decision
    closed_decline_reason_codes: [CAPABILITY_UNAVAILABLE, OBJECT_SCOPE_MISMATCH, CONFLICT_OF_INTEREST, WORKLOAD_CAPACITY, DEPENDENCY_BLOCKED, SUBJECT_INVALID, OWNER_UNAVAILABLE, POLICY_BLOCKED, RECEIVER_DECLINED]
    branches:
      ACKNOWLEDGE: {reason_code: MUST_BE_NULL, reason_plaintext: MUST_BE_NULL, reason_digest: MUST_BE_NULL, reason_encrypted: MUST_BE_NULL}
      DECLINE: {reason_code: REQUIRED_CLOSED_DECLINE_REASON_CODE, reason_plaintext: REQUIRED_VALID_UNICODE_NUL_FREE_NFC_NON_WHITESPACE_1_TO_4000, reason_digest: REQUIRED_SHA256_OF_EXACT_NFC_UTF8_BYTES, reason_encrypted: DERIVED_ONLY_AFTER_PREPARE_NEW}
    attempt_boundary_rule: plaintext exists only in trusted application memory for semantic validation and digest derivation; this SQL attempt composite accepts reason_code and reason_digest only and rejects a branch mismatch before replay-guard access
  input_type:
    name: ops.journey_handoff_assertion_attempt_v1
    fields:
      - {name: assertion_type, type: text, closed_values: [ACTOR, SERVICE]}
      - {name: assertion_jti, type: uuid}
      - {name: issuer, type: text}
      - {name: audience, type: text}
      - {name: expires_at, type: timestamptz}
      - {name: wire_request_digest, type: char(64)}
      - {name: operation_id, type: text, constant: decideJourneyHandoff}
      - {name: handoff_id, type: uuid}
      - {name: expected_handoff_version, type: bigint}
      - {name: expected_binding_digest, type: char(64)}
      - {name: decision, type: text, closed_values: [ACKNOWLEDGE, DECLINE]}
      - {name: reason_code, type: text, nullable: true}
      - {name: reason_digest, type: char(64), nullable: true}
      - {name: transport_request_id, type: uuid}
      - {name: idempotency_key_sha256, type: char(64)}
  output_type:
    name: ops.journey_handoff_assertion_attempt_receipt_v1
    fields:
      - {name: assertion_type, type: text}
      - {name: jti_digest, type: char(64)}
      - {name: wire_request_digest, type: char(64)}
      - {name: business_request_hash, type: char(64)}
      - {name: audit_event_id, type: uuid}
      - {name: audit_event_hash, type: char(64)}
      - {name: consumed_at, type: timestamptz}
  function:
    signature: ops.consume_journey_handoff_assertion_attempt_v1(ops.journey_handoff_assertion_attempt_v1) RETURNS ops.journey_handoff_assertion_attempt_receipt_v1
    owner: gurine_migrator
    security: DEFINER
    volatility: VOLATILE
    search_path: [pg_catalog, ops]
    execute_roles: [gurine_control_api, gurine_workflow_worker]
    transaction: short caller transaction committed before the SERIALIZABLE business transaction
    assertion_authority_by_session_user:
      gurine_control_api: {assertion_type: ACTOR, authority: persisted human receiver identity}
      gurine_workflow_worker: {assertion_type: SERVICE, authority: persisted service acknowledgement authority}
    algorithm:
      - fail unless operation is decideJourneyHandoff, session_user maps control-api to ACTOR or workflow-worker to SERVICE, all hashes are lowercase SHA-256, the reason nullability shape is exact and SQL recomputation of JOURNEY_HANDOFF_DECISION_BUSINESS_V1 equals the supplied semantic fields
      - capture v_attempt_transaction_xid8=pg_current_xact_id() once inside the wrapper; it is server-derived and absent from every input type and caller-controlled value
      - call the immutable-base ops.consume_assertion_jti with assertion type, JTI, issuer, audience, expiry and wire request digest as the first relation-touching statement
      - require the inserted replay-guard row attempt_transaction_xid8 to equal v_attempt_transaction_xid8; a NULL legacy row, mismatch or caller-supplied/backfilled value is ACTOR_ASSERTION_INVALID or SERVICE_ASSERTION_INVALID
      - if consume returns false raise ACTOR_ASSERTION_REPLAYED or SERVICE_ASSERTION_REPLAYED; append no second consumed-attempt audit and never begin protected business work
      - append exactly one ops.audit_events row with action auth.assertion.consume, object_type ASSERTION_ATTEMPT, object_id equal SHA256(canonical assertion type plus JTI), current transport request_id, SUCCESS outcome and the exact closed details below, including attemptTransactionXid8 as the canonical unsigned decimal form of v_attempt_transaction_xid8
      - require the generated audit attempt_transaction_xid8 to equal the replay-guard value and v_attempt_transaction_xid8; the insert guard enforces this at production and the exact details object including attemptTransactionXid8 remains in the audit hash preimage
      - return only digests, audit identity and consumed_at; an audit failure rolls back both audit and replay-guard insert
  audit_contract:
    action: auth.assertion.consume
    classification: INTERNAL_RESTRICTED
    exact_detail_keys: [assertionType, operationId, jtiDigest, wireRequestDigest, idempotencyKeySha256, businessRequestHash, attemptTransactionXid8]
    attempt_transaction_xid8: {source: server-only pg_current_xact_id(), wire_type: canonical unsigned decimal string, generated_column: ops.audit_events.attempt_transaction_xid8, audit_hash_preimage: REQUIRED}
    forbidden: [raw JTI, issuer, audience, subject, session, capability set, assertion token, signature, HTTP body, plaintext reason, randomized ciphertext]
    duplicate_valid_jti: zero second consumed-attempt audit; the canonical replay error is itself observable without recording attacker-controlled details as trusted success evidence
  type_acl:
    ops.journey_handoff_assertion_attempt_v1: {gurine_control_api: [USAGE], gurine_workflow_worker: [USAGE], PUBLIC: []}
    ops.journey_handoff_assertion_attempt_receipt_v1: {gurine_control_api: [USAGE], gurine_workflow_worker: [USAGE], PUBLIC: []}
  exactness_oracle: pg_type, pg_attribute, pg_attrdef, pg_trigger, to_regprocedure, pg_proc.proconfig, aclexplode and pg_get_functiondef prove exact field order, one signature, fixed owner/search_path, no overload/default/variadic shadow, server-only top-level xid8 capture, base consume call before audit append, generated audit xid/hash binding and no direct replay-guard DML

base_subscription_bridge:
  rule: Base v13 subscription operations and rows remain authoritative compatibility inputs; migration 0027 replaces their SECURITY DEFINER bodies atomically without changing the external operation contract.
  createSubscription:
    same_transaction:
      - create the existing intake.subscriptions PENDING row and scoped session
      - create one ACCOUNTLESS_SUBSCRIBER communication subject bound to the subscription ID/version
      - create one SMTP_EMAIL endpoint in PENDING_VERIFICATION using the same encrypted destination and independent purpose HMAC
      - create endpoint verification/linking-consent rows whose hashes bind the existing one-time verification token without storing raw token
      - append audit/outbox/idempotency receipt
    forbidden: no subscription authorization or delivery before verification
  verifySubscription:
    same_transaction:
      - atomically consume the existing verification token and pending session
      - activate only the exact endpoint and exact pre-captured SUBSCRIPTION_UPDATE topic binding
      - append VERIFIED link event, SUBSCRIPTION_CONSENT authorization event and default preference row
      - issue the existing management session and append audit/outbox/idempotency receipt
  updateSubscription:
    same_transaction: update existing subscription compatibility fields and the exact purpose/topic communication_preferences row under expected profile version
    forbidden: cannot create marketing, voice or fallback consent
  unsubscribe:
    same_transaction:
      - set existing subscription UNSUBSCRIBED and consume all active subscription management sessions
      - append authorization REVOKED, USER_OPTOUT suppression and immutable opt-out receipt for SUBSCRIPTION_UPDATE only
      - suppress/cancel every unsent matching delivery and fence retry/fallback after any possible dispatch
      - append audit/outbox/idempotency receipt
    separate_transactional_purpose: remains unaffected unless its own authorization is revoked; purpose relabeling is forbidden
  legacy_events:
    rule: New communication events contain only identifiers and digests. Existing base token-bearing event payloads may not be reused or copied; their replacement/sanitization must preserve the base acceptance intent without emitting verification or management tokens.

delivery_global_lock_order:
  rule: Every command/worker uses this relative order; multiple rows of one relation lock by primary key ascending. A path that needs only a suffix may start at that suffix after unlocked ID resolution and must revalidate every FK/version under lock.
  order:
    - ops.idempotency_keys
    - ops.action_decisions and ops.execution_authorizations
    - intake.submission_sessions
    - intake.communication_subjects
    - intake.communication_endpoints
    - intake.communication_endpoint_verifications
    - intake.communication_authorization_events and intake.communication_suppressions
    - ops.communication_intents
    - ops.communication_renderings
    - ops.communication_provider_configs and ops.communication_provider_preflight_receipts
    - ops.kill_switches
    - ops.budget_reservations
    - ops.outbound_deliveries
    - ops.outbound_delivery_attempts
    - callback, reconciliation and receipt inserts
    - ops.audit_events chain head
    - ops.outbox
    - idempotency response finalization
  external_call: no database lock or transaction remains open during a provider network call

response_clock_and_appeal_contract:
  extension_request:
    create_operation: requestResponseExtension
    state: SUBMITTED
    concurrency_identity: [id, version, request_digest]
    event: response.extension_request_submitted.v2
    event_atomicity: request row, idempotency receipt, audit row and the safe additive outbox event commit together; replay with the same request digest returns the stored receipt and emits no second event.
    safe_event_rule: payload contains only opaque request/response IDs, version, requested due time, request digest, submitted time and receipt digest; reason text, token, contact value and encrypted/private content are forbidden.
    decision_operation: decideResponseExtension
    decision_states: [APPROVED, REJECTED]
    forbidden_state: CHANGES_REQUIRED
  delivery_clock:
    starts_on: [SIGNED_PROVIDER_DELIVERY_CALLBACK, AUTHENTICATED_PROVIDER_POLL, OFFICIAL_CHANNEL_RECEIPT]
    does_not_start_on: [PROVIDER_ACCEPTED, AMBIGUOUS, FAILED_PERMANENT, SUPPRESSED, CANCELLED, OPERATOR_STATEMENT, EMAIL_OPEN_PIXEL]
    duration_business_days: 5
    calendar_selection: latest nonexpired version effective at verified_delivery_at, not worker processing time
    single_authority: editorial.response_delivery_clock_decisions UNIQUE(response_request_id)
    exact_binding_chain:
      - response_request_id plus immutable request_binding_digest identifies the requested right-of-reply object.
      - communication_intent_id plus RESPONSE_REQUEST plus response_request_id plus intent_source_decision_digest identifies the immutable intent source.
      - outbound_delivery_id plus intent/object composite proves the delivery belongs to that intent and request.
      - delivery_receipt_id plus delivery ID, sequence, digest, resulting state and applied flag proves one exact append-only receipt revision belongs to that delivery.
      - The start procedure rejects any broken chain, unapplied receipt, or state other than DELIVERED/READ before calendar computation; scalar IDs are never independently trusted.
  effective_due:
    base: response_delivery_clock_decisions.due_at
    extension: highest approved response_extension_decisions.decision_sequence
    pending_extension: blocks expiry until serializable decision
    expiry_lock_order: [editorial.response_requests, editorial.response_delivery_clock_decisions, intake.response_extension_requests, editorial.response_extension_decisions]
  appeal:
    session_kinds:
      RESPONSE_RECEIPT: {ttl_seconds: 1800, mode: READ_ONLY, allowed_operations: [getResponseReceipt]}
      APPEAL_CREATE: {ttl_seconds: 900, mode: ONE_SHOT_COMMAND, allowed_operations: [createResponseAppeal], scope: response_submission_id}
      APPEAL_STATUS: {ttl_seconds: 1800, mode: READ_ONLY_ROTATING, allowed_operations: [getResponseAppeal], scope: appeal_id}
    issuance:
      - A server-only fixed-search-path procedure derives APPEAL_CREATE from a currently valid RESPONSE_RECEIPT session and a fresh BFF-generated token hash; it does not widen or reuse the receipt session.
      - Successful create consumes APPEAL_CREATE and atomically binds a fresh APPEAL_STATUS token hash to the created appeal.
      - Re-entry rotates APPEAL_STATUS only after the existing response receipt proof is re-established; raw tokens never enter audit, outbox, URLs or table projections.
    intake_immutable: true
    authorization_labels: {createResponseAppeal: appeal-create-session, getResponseAppeal: appeal-status-session}
    prior_binding: exact response submission, response request, receipt version/digest, prior decision ID and prior decision receipt are derived under APPEAL_CREATE lineage; caller-supplied cross-object identifiers are rejected before mutation
    current_state: highest append-only appeal_decisions.decision_sequence, starting from RECEIVED
    effect: Resolution may create a new task, extension decision, correction or linked request through its own authorized command; it never rewrites the appealed decision or silently reopens a response.

repository_transactions:
  materialize_intent:
    isolation: SERIALIZABLE
    lock_order: [ops.inbox, ops.communication_intents, intake.communication_subjects, intake.communication_authorization_events, intake.communication_suppressions]
    cardinality: one deployment/logical digest; same digest returns stored intent, changed source binding is FACT_CONFLICT
  queue_delivery:
    isolation: SERIALIZABLE
    lock_order: [ops.communication_intents, ops.communication_renderings, intake.communication_subjects, intake.communication_endpoints, intake.communication_authorization_events, intake.communication_preferences, intake.communication_suppressions, ops.communication_provider_configs, ops.communication_provider_preflight_receipts, ops.budget_reservations, ops.outbound_deliveries]
    cardinality: one exact delivery identity and one delivery-requested outbox event
  observe_callback:
    isolation: READ_COMMITTED
    lock_order: [ops.communication_callback_events request replay identity, matched ops.outbound_deliveries by UUID, ops.outbound_delivery_attempts by delivery and ordinal, ops.outbound_delivery_receipts by delivery and sequence]
    cardinality: exactly one authenticated callback request row and zero through item_count receipt mutations; at most one receipt for each request/item ordinal; replay returns one stored acknowledgement and produces zero additional effects
  reconcile_delivery:
    isolation: SERIALIZABLE
    lock_order: [ops.outbound_deliveries, ops.outbound_delivery_attempts by ordinal, ops.communication_callback_events by evidence order, ops.outbound_delivery_receipts by sequence, ops.communication_reconciliation_decisions]
    cardinality: one sequence winner; stale version receives DELIVERY_VERSION_CONFLICT
  start_response_clock:
    isolation: SERIALIZABLE
    lock_order: [editorial.response_requests, ops.communication_intents, ops.outbound_deliveries, ops.outbound_delivery_receipts, editorial.response_delivery_clock_decisions, ops.business_calendar_versions]
    cardinality: exactly one clock row per response request
  decide_extension:
    isolation: SERIALIZABLE
    lock_order: [editorial.response_requests, editorial.response_delivery_clock_decisions, intake.response_extension_requests, editorial.response_extension_decisions]
    cardinality: exactly one decision per extension request and monotonic sequence per response request
  create_appeal:
    isolation: READ_COMMITTED
    lock_order: [ops.idempotency_keys, intake.submission_sessions, intake.response_submissions, editorial.response_requests, intake.appeals]
    cardinality: a finalized same session/idempotency/request digest returns the exact stored response bytes even after APPEAL_CREATE consumption; a new claim creates one appeal and one APPEAL_STATUS child; cross-scope is unavailable
  decide_appeal:
    isolation: SERIALIZABLE
    lock_order: [intake.appeals, intake.appeal_decisions by sequence, ops.tasks]
    cardinality: one terminal winner; no state synthesis from missing decisions

retention_defaults:
  schedule_binding: latest effective nonexpired ops.record_class_schedules revision for exact record_class
  missing_or_stale_schedule: preserve row, open review task and fail destructive action
  backup_behavior: restored rows remain unavailable until restoration suppressions, endpoint/authorization revocations, opt-outs and legal holds are reapplied
  legal_hold_key_rule: every listed hold key maps through source object/response request/subject/delivery relations before terminal action

runtime_oracles:
  catalog:
    - migration ownership and this table map are exact set-equal 21/21 with no duplicate relation
    - ops.outbound_deliveries is relkind r and ops.email_deliveries is one relkind v compatibility view; active table delta is 21
  privileges:
    - PUBLIC has zero relation, sequence and function privilege
    - gurine_submission_api has zero direct write privilege on every additive intake table
    - endpoint/callback ciphertext columns are absent from control, workflow and auditor column grants
    - gurine_public_api, gurine_identity_api, gurine_ingest_worker, gurine_analysis_worker and gurine_document_extractor have zero relation privilege on every 0027 relation
    - Every runtime role including control, submission and identity has zero table-level and zero per-column privilege on ops.idempotency_keys after 0027; base table-wide grants are explicitly revoked before new values are written.
    - Generic function EXECUTE on the exact claim/finalize/replay signatures belongs only to gurine_submission_api, gurine_control_api and gurine_identity_api; each embedded caller scope registry is set-equal to canonical operation truth.
    - Generic composite USAGE belongs to those three API roles on all six types, plus gurine_workflow_worker on exactly ops.idempotency_finalize_v1 and ops.idempotency_finalize_receipt_v1 and on no other generic boundary type.
    - Owner helper EXECUTE belongs only to gurine_migrator. Journey decision prepare/apply/finalize wrapper EXECUTE belongs only to gurine_control_api and gurine_workflow_worker; no runtime role executes an owner helper directly.
  idempotency_role_surface_exact:
    generic_function_execute:
      ops.claim_idempotency_v1(ops.idempotency_claim_v1): [gurine_submission_api, gurine_control_api, gurine_identity_api]
      ops.finalize_idempotency_response_v1(ops.idempotency_finalize_v1): [gurine_submission_api, gurine_control_api, gurine_identity_api]
      ops.replay_idempotency_response_v1(ops.idempotency_replay_v1): [gurine_submission_api, gurine_control_api, gurine_identity_api]
    generic_composite_usage:
      ops.idempotency_claim_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api]
      ops.idempotency_claim_receipt_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api]
      ops.idempotency_finalize_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api, gurine_workflow_worker]
      ops.idempotency_finalize_receipt_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api, gurine_workflow_worker]
      ops.idempotency_replay_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api]
      ops.idempotency_replay_receipt_v1: [gurine_submission_api, gurine_control_api, gurine_identity_api]
    owner_helper_execute:
      ops.claim_owner_idempotency_v1(ops.idempotency_claim_v1): [gurine_migrator]
      ops.finalize_owner_idempotency_response_v1(ops.idempotency_finalize_v1): [gurine_migrator]
      ops.replay_owner_idempotency_response_v1(ops.idempotency_replay_v1): [gurine_migrator]
    journey_wrapper_execute:
      ops.prepare_journey_handoff_decision_v1(ops.journey_handoff_decision_prepare_v1): [gurine_control_api, gurine_workflow_worker]
      ops.decide_journey_handoff_v1(uuid,bigint,character,text,text,bytea,character,uuid,character,uuid): [gurine_control_api, gurine_workflow_worker]
      ops.finalize_journey_handoff_decision_response_v1(ops.idempotency_finalize_v1): [gurine_control_api, gurine_workflow_worker]
  idempotency_acl_and_non_leak:
    catalog:
      - For each runtime role and each privilege SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES and TRIGGER, has_table_privilege(role,'ops.idempotency_keys',privilege) is false.
      - For each runtime role, every physical column from pg_attribute and each privilege SELECT, INSERT, UPDATE and REFERENCES, has_column_privilege(role,'ops.idempotency_keys',column,privilege) is false; information_schema.column_privileges and aclexplode(attacl) expose no runtime grant.
      - pg_class.relacl/aclexplode contains only owner semantics and pg_attribute.attacl contains no PUBLIC/runtime grantee; default privileges cannot regrant future idempotency columns.
      - The three exact pg_proc rows are owned by gurine_migrator, prosecdef=true, proconfig is exactly the one-element text array ["search_path=pg_catalog, ops"] with no pg_temp/caller-writable schema or other setting, PUBLIC has no EXECUTE and role EXECUTE is exact-set equal. Composite-type USAGE is likewise exact.
    direct_dml_negative:
      - SET ROLE gurine_submission_api, gurine_control_api and gurine_identity_api each fail SELECT of safe or sensitive columns, INSERT of a claim and UPDATE of response/completion fields with SQLSTATE 42501.
      - Explicit column-list SELECT/INSERT/UPDATE, prepared statements, COPY, writable CTE, RETURNING and ON CONFLICT variants all fail 42501; table privilege revocation cannot be bypassed through a residual column ACL.
      - No runtime-owned SECURITY DEFINER function, view, rule or trigger exposes a generic row/query/update path; pg_depend and pg_get_viewdef set-equality prove this.
    guarded_function_positive:
      - Each allowed role claims one exact registered scope without SQLSTATE 23514 while the complete claim tuple is nonnull and every terminal field is null, finalizes it through the exact generation-fenced function and receives byte-identical replay for the same caller/scope/request/session/generation binding.
      - Same key with changed request while unexpired, same request under another session hash, another issuer, another operation, unregistered scope or different session_user returns the typed non-leaking conflict/unavailable result, zero bytes and a before/after row digest proving zero mutation.
      - An expired incomplete BOUND_V1 claim is reclaimed only while locked, increments claim_generation exactly once and fences a prior-generation finalize; finalized, legacy and tombstoned rows are terminal and never reclaimed.
      - Concurrent 64-way claim/finalize/replay has one incomplete-to-complete transition, one domain/audit/outbox/receipt commit and 63 exact replays; a second finalize changes zero bytes.
    token_response_projection:
      - Canary key_hash, request_hash, bff_issuer, session_token_hash, header bytes and body bytes do not appear in any runtime SELECT, generated row type, view/materialized-view/foreign-table definition, logical publication, audit, outbox, log, trace, metric or error payload.
      - A derived-session finalize containing any recursively forbidden token/cookie/verifier field or Set-Cookie/session header fails its CHECK/function validation with zero completed tuple.
      - Replay returns only the declared output allowlist after digest/schema validation; compatibility response_body and all binding hashes are never returned even to the owning runtime role.
      - Search-path trap objects and malicious temporary functions cannot intercept claim/finalize/replay because pg_proc.proconfig and schema ownership are verified on PostgreSQL 18.4.
  postgres_18_4_idempotency_canary:
    verifier_image: sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
    installed_postgres_binary_sha256: de0a4a7646c51f032e0088ae6fe9d0833fa280b78d4455681574a32937b32838
    version_gate: server_version must resolve to PostgreSQL 18.4 before assertions run
    journey_decision_exact_access:
      definitions: ['ops.prepare_journey_handoff_decision_v1(ops.journey_handoff_decision_prepare_v1)', 'ops.decide_journey_handoff_v1(uuid,bigint,character,text,text,bytea,character,uuid,character,uuid)', 'ops.finalize_journey_handoff_decision_response_v1(ops.idempotency_finalize_v1)', 'ops.claim_owner_idempotency_v1(ops.idempotency_claim_v1)', 'ops.finalize_owner_idempotency_response_v1(ops.idempotency_finalize_v1)', 'ops.replay_owner_idempotency_response_v1(ops.idempotency_replay_v1)']
      catalog_sources: [pg_proc, pg_type, pg_attribute, pg_attrdef, pg_trigger, pg_depend, aclexplode, pg_get_functiondef]
      exact_assertions: [six composite attribute sets have exact ordinal/name/type/typmod and no xid field, no overload/default/variadic/duplicate signature, prepare direct idempotency relation statements zero with claim once and replay iff final, apply one schema-qualified SELECT INTO STRICT and zero DML/helper/owner/dynamic-SQL/SELECT-star, finalize one pre-lock/read plus owner-finalize once plus one complete post-readback and zero replay/helper/direct-DML/dynamic-SQL/SELECT-star]
      negative_mutations: [caller_claim_composite_xid_field, apply_extra_relation_read, apply_dynamic_sql, apply_select_star, owner_helper_overload, finalize_claim_xid_equality_removed, finalize_post_readback_removed, finalize_partial_tuple_compare, finalize_replay_owner_call]
      mutation_runner: build each one-mutation SQL fixture on a clean PostgreSQL 18.4 catalog; the exact validator must fail with its named mutation ID before runtime admission, while the unchanged definition set passes
    clean_schema: apply base migrations through 0026, seed completed/unexpired, completed/expired, incomplete and partial legacy rows, then apply the generated 0027 migration exactly once
    required_assertions:
      - NEW derived claim stores operation_id, bff_issuer, session_token_hash and claim_generation=1 while the complete terminal tuple remains NULL; no CHECK raises SQLSTATE 23514.
      - finalize with generation=1 atomically sets RESPONSE_FINAL and the complete terminal tuple; after the bound session row is marked CONSUMED, replay returns the identical status, header octets, body octets, response digest and receipt digest with zero session/domain/audit/outbox mutation.
      - The same unexpired key and binding with a changed request hash returns IDEMPOTENCY_CONFLICT, and a digest of every physical column plus xmin/count before and after proves zero row mutation.
      - An expired incomplete BOUND_V1 row is reclaimed with claim_generation incremented exactly once; the prior generation cannot finalize, while the new generation may finalize once.
      - Completed unexpired known-scope legacy rows replay only as LEGACY_FINAL_COMPAT canonicalized JSON; completed expired/unknown, incomplete-after-drain and partial legacy rows return terminal unavailable, expose no bytes and can never be reclaimed.
      - For PUBLIC and every runtime role, all has_table_privilege checks for SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER and all has_column_privilege checks for SELECT,INSERT,UPDATE,REFERENCES are false; direct SELECT/INSERT/UPDATE/COPY/writable-CTE/RETURNING fail 42501 while only the exact registered EXECUTE calls succeed.
      - pg_proc has exactly three exact boundary signatures, owner gurine_migrator, prosecdef=true, no defaults/variadic siblings, and proconfig exactly the one-element text array ["search_path=pg_catalog, ops"]; PUBLIC/other-role EXECUTE and all unlisted composite-type USAGE are false.
    transactionality: Every behavioral assertion runs in a rollback-isolated canary transaction except catalog assertions; failure blocks release and leaves old application admission disabled.
  rls:
    - every additive intake table has relrowsecurity=true
    - cross-subject endpoint and cross-submission appeal access returns the same unavailable result
    - expired, consumed, revoked and wrong-issuer sessions produce zero row mutation
  exactly_once:
    - 64 concurrent materializers create one logical intent
    - 64 concurrent enqueuers create one delivery and one requested event
    - 64 concurrent dispatch claimers create one active attempt/fence
    - 64 identical multi-item callback replays create one request-level authentication row, at most one receipt per item ordinal and return byte-identical stored HTTP status, headers and body
    - same replay key with changed body creates zero receipt and returns CALLBACK_REPLAY_CONFLICT
    - out-of-order provider evidence is stored and creates no state regression
    - ambiguous attempt creates RECONCILIATION_REQUIRED and zero automatic retry/fallback
    - updating an endpoint or provider config head leaves historical delivery, callback and receipt revision FKs valid; stale queued work fails the current-head fence instead of rewriting or blocking history
  response:
    - provider accepted/failure/ambiguity/operator evidence creates zero clock row
    - one verified delivery creates one clock row with five-business-day due under pinned calendar
    - extension-decision versus expiry race has one serializable winner
    - appeal session cannot read/create an appeal for another response submission
    - RESPONSE_RECEIPT cannot create/read appeals, APPEAL_CREATE cannot read status or replay a different request, APPEAL_STATUS cannot create, and COMMUNICATION_PROFILE cannot cross subject lineage
    - a successful one-shot appeal/profile command replay returns exact stored response bytes after session consumption or rotation and emits zero second mutation/event
    - terminal appeal sequence cannot be followed by another decision
  repository_roundtrip:
    - each of 21 tables inserts all required nondefault boundary values, reads exact typed rows, verifies digests and encrypted bytes, and rejects required-field deletion
    - every declared stable order is tested with equal primary sort values and unique-key tiebreaker

integration_blockers:
  - id: P27-BLOCKER-IDEMPOTENCY-CLAIM-TERMINAL-SPLIT
    severity: P0
    status: CLOSED_DESIGN_REQUIRES_0027_MIGRATION_AND_PG18_CANARY
    issue: The prior derived all-or-none CHECK grouped the three fields required at claim time with ten response fields required only at finalize time, so every valid claim presented a forbidden intermediate cardinality and failed SQLSTATE 23514. It also omitted a generation fence, expired-incomplete reclaim rule and pre-cutover legacy disposition.
    closure: Generate 0027 from claim_and_terminal_split, pre_cutover_legacy_policy, bound_row_lifecycle and the exact three boundary functions. The migration must use staged nullable columns/NOT VALID checks, exhaustively classify legacy rows, install the transition trigger, validate constraints, close table/column ACLs and pass postgres_18_4_idempotency_canary before this blocker may be marked runtime-closed.
  - id: P27-BLOCKER-PRIVATE-CALLBACK-SCHEMAS
    severity: P0
    status: CLOSED_PHYSICAL_CONTRACT_REQUIRES_API_SCHEMA_IMPORT
    issue: The eight private communication operations have inventory rows but no closed request/response/error schemas in the current addendum operation contract.
    closure: This contract now freezes request-level replay/authentication, adapter-specific raw method/header/body/signature inputs, normalized multi-item evidence, exact stored acknowledgement bytes and errors. Import these named schemas and fixture gates into the private operation/OpenAPI contract before implementation; no database ambiguity remains.
  - id: P27-BLOCKER-CALLBACK-GOLDEN-FIXTURES
    severity: P0
    status: CLOSED_DESIGN_REQUIRES_FIXTURE_FILES
    issue: Provider-native valid/invalid/replay/multi-item fixture bytes and manifest digests are not files owned by this database contract.
    closure: Create the exact per-contract-revision fixture directories declared by callback_adapter_authentication_profiles, pin their manifest SHA-256 in provider contracts and require their digest in every PASS preflight receipt before activation.
  - id: P27-BLOCKER-DERIVED-SESSION-CANONICAL-IMPORT
    severity: P0
    status: CLOSED_DESIGN_REQUIRES_CANONICAL_IMPORT
    issue: Base session-boundary, operation authorization, OpenAPI, cookie schema and acceptance files do not yet consume APPEAL_CREATE, APPEAL_STATUS and COMMUNICATION_PROFILE.
    closure: Import specs/submission/addendum-derived-session-boundary.yaml exactly, including private BFF broker operations and next-session rotation header, then make every listed acceptance executable before FINAL.
  - id: P27-BLOCKER-IDEMPOTENCY-MIGRATION-OWNERSHIP
    severity: P0
    status: CLOSED_0027_REQUIRES_0029_DEDUPLICATION
    issue: One-shot session commands in 0027 need exact response bytes immediately, while the current economics draft independently adds overlapping ops.idempotency_keys columns in 0029.
    closure: 0027 owns the generic response byte columns and SUBMISSION_DERIVED checks. 0029 must reuse those columns and add only ECONOMICS-scoped checks/indexes/functions; duplicate ADD COLUMN ownership is forbidden.
  - id: P27-BLOCKER-IDEMPOTENCY-DIRECT-REPOSITORY-DML
    severity: P0
    status: CLOSED_DESIGN_REQUIRES_REPOSITORY_IMPORT
    issue: Current crates/persistence-postgres::idempotency uses direct INSERT/SELECT/UPDATE and release SQL, which will correctly fail after the 0027 ACL reset and would otherwise bypass safe byte/schema validation.
    closure: >-
      Replace every direct repository call with typed generation-fenced claim/finalize/replay function calls, keep claim/domain/audit/outbox/receipt/finalize in one enclosing transaction, and roll back on domain failure instead of committing then releasing an incomplete claim. Delete the legacy release operation: reclaim is owned only by claim after expiry. Static SQL scan and PostgreSQL role tests must prove zero direct DML before canonical status becomes FINAL.
  - id: P27-BLOCKER-RECORD-CLASS-SEEDS
    severity: P0
    status: DEFERRED_TO_0028
    issue: ops.record_class_schedules is introduced in migration 0028, so 0027 cannot add a backward-invalid FK or schedule seed.
    closure: Migration 0028 must create effective schedules for every 0027 record_class before any retention worker may perform a terminal action; missing schedules fail closed.
  - id: P27-BLOCKER-PROVIDER-ACTIVATION-FK
    severity: P0
    status: DEFERRED_TO_0028
    issue: ops.capability_activation_decisions is introduced in migration 0028.
    closure: Add and VALIDATE the provider activation decision FK in 0028; until then ACTIVE transition requires exact digest-bound existence through the application transaction and cannot occur during 0027 migration.
  - id: P27-BLOCKER-STATE-EVENT-CORRECTION
    severity: RESOLVED
    status: CLOSED_CURRENT_TRUTH
    issue: The earlier state draft emitted communication.delivery_requested.v1 at intent MATERIALIZED.
    closure: Current specs/product/addendum-state-machines.yaml uses event NONE for CREATED-to-MATERIALIZED and emits communication.delivery_requested.v1 only on outbound NONE-to-QUEUED after exact rendering, authorization, provider activation, budget and switch fences.
  - id: P27-BLOCKER-APPEAL-SESSION-BOUNDARY
    severity: P0
    status: CLOSED_IN_0027_AND_SUBMISSION_OVERLAY_REQUIRES_CANONICAL_IMPORT
    issue: Base RESPONSE_RECEIPT is a 30-minute read-only session whose only allowed operation is getResponseReceipt, while the old addendum authorization label reused it for createResponseAppeal and getResponseAppeal.
    closure: Distinct APPEAL_CREATE/APPEAL_STATUS kinds, exact issuance/consume/rotate/replay procedures and ACL are frozen here and in the submission overlay. Canonical session, operation authorization and acceptance files must import them without widening RESPONSE_RECEIPT.
  - id: P27-BLOCKER-RESPONSE-RECEIPT-CONCURRENCY
    severity: P0
    status: CLOSED_PHYSICAL_CONTRACT_REQUIRES_CANONICAL_IMPORT
    issue: createResponseAppeal.expectedReceiptVersion and priorReceiptDigest had no exact stored candidate key in base intake.response_submissions.
    closure: Adopt receipt_version, receipt_digest and receipt_updated_at plus the composite appeal FK and update every safe receipt projection transaction to advance that identity exactly once.
  - id: P27-BLOCKER-EXTENSION-REQUEST-EVENT
    severity: P0
    status: RESOLVED_BY_CURRENT_TRUTH_REQUIRES_EVENT_SCHEMA
    issue: Base response_extension_requested.v1 requires a raw requestToken and base command semantics emits no atomic event; either behavior violates the addendum secret and state contract.
    closure: Use only token-free response.extension_request_submitted.v2, close its payload/delivery/replay schema, and atomically persist the SUBMITTED row, idempotency receipt, audit and outbox event. Decisions are exactly APPROVED or REJECTED.
