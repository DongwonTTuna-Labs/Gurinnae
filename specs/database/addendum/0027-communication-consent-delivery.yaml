      - "contract_version = 'LEGACY_V13' AND NOT dispatch_eligible OR contract_version = 'COMMUNICATION_V1' AND dispatch_eligible"
      - "contract_version = 'COMMUNICATION_V1' AND intent_id IS NOT NULL AND intent_digest IS NOT NULL AND intent_source_decision_digest IS NOT NULL AND rendering_id IS NOT NULL AND endpoint_id IS NOT NULL AND endpoint_version IS NOT NULL AND endpoint_snapshot_digest IS NOT NULL AND recipient_endpoint_hmac IS NOT NULL AND provider_config_id IS NOT NULL AND provider_config_version IS NOT NULL AND provider_configuration_digest IS NOT NULL AND provider_preflight_receipt_id IS NOT NULL AND provider_preflight_receipt_digest IS NOT NULL AND delivery_key IS NOT NULL AND locale IS NOT NULL AND template_id IS NOT NULL AND template_revision IS NOT NULL AND rendered_sha256 IS NOT NULL AND rendering_digest IS NOT NULL AND authorization_snapshot_digest IS NOT NULL AND suppression_snapshot_digest IS NOT NULL AND activation_receipt_digest IS NOT NULL AND budget_reservation_id IS NOT NULL AND execution_authorization_id IS NOT NULL AND execution_generation IS NOT NULL AND decision_digest IS NOT NULL AND effect_safety_class IS NOT NULL AND provider_idempotency_key_ciphertext IS NOT NULL AND provider_key_encryption_key_id IS NOT NULL AND provider_idempotency_key_sha256 IS NOT NULL AND delivery_digest IS NOT NULL AND object_type IS NOT NULL AND object_id IS NOT NULL OR contract_version = 'LEGACY_V13'"
      - provider_idempotency_key_ciphertext IS NULL OR octet_length(provider_idempotency_key_ciphertext) BETWEEN 1 AND 4096
      - provider_key_encryption_key_id IS NULL OR length(provider_key_encryption_key_id) BETWEEN 1 AND 200
      - effect_safety_class IS NULL OR effect_safety_class IN ('DUPLICATION_SENSITIVE','DUPLICATION_TOLERANT')
      - execution_generation IS NULL OR execution_generation > 0
      - "lease_owner IS NULL AND lease_token_hash IS NULL AND lease_expires_at IS NULL OR lease_owner IS NOT NULL AND lease_token_hash IS NOT NULL AND lease_expires_at IS NOT NULL"
      - "state = 'SENDING' AND lease_owner IS NOT NULL AND fencing_token > 0 OR state <> 'SENDING'"
      - "contract_version = 'COMMUNICATION_V1' AND provider_message_id IS NULL OR contract_version = 'LEGACY_V13'"
      - "state = 'PROVIDER_ACCEPTED' AND provider_accepted_at IS NOT NULL OR state <> 'PROVIDER_ACCEPTED'"
      - "state = 'DELIVERED' AND delivered_at IS NOT NULL OR state <> 'DELIVERED'"
      - "state = 'READ' AND read_at IS NOT NULL AND delivered_at IS NOT NULL OR state <> 'READ'"
      - "state IN ('READ','FAILED_PERMANENT','SUPPRESSED','CANCELLED') AND terminal_at IS NOT NULL OR state NOT IN ('READ','FAILED_PERMANENT','SUPPRESSED','CANCELLED')"
      - "(intent_source_decision_digest IS NULL OR ops.is_lower_sha256(intent_source_decision_digest)) AND (endpoint_snapshot_digest IS NULL OR ops.is_lower_sha256(endpoint_snapshot_digest)) AND (provider_preflight_receipt_digest IS NULL OR ops.is_lower_sha256(provider_preflight_receipt_digest))"
      - every nonnull hash/digest satisfies global digest checks
    indexes:
      - {name: outbound_delivery_dispatch_idx, columns: [state, next_attempt_at, queued_at, id], where: "contract_version = 'COMMUNICATION_V1' AND dispatch_eligible AND state IN ('QUEUED','RETRY_SCHEDULED')"}
      - {name: outbound_delivery_intent_idx, columns: [intent_id, queued_at, id], where: "intent_id IS NOT NULL"}
      - {name: outbound_delivery_endpoint_idx, columns: [endpoint_id, state, queued_at, id], where: "endpoint_id IS NOT NULL"}
      - {name: outbound_delivery_reconciliation_idx, columns: [updated_at, id], where: "state = 'RECONCILIATION_REQUIRED'"}
      - {name: outbound_delivery_provider_message_idx, columns: [provider_config_id, provider_message_id_hmac], where: "provider_message_id_hmac IS NOT NULL"}
    migration_backfill:
      - Rename status to state and drop the old state CHECK only after recording its exact definition.
      - Add contract_version default LEGACY_V13 and dispatch_eligible default false while legacy rows exist; add channel NOT NULL DEFAULT SMTP_EMAIL.
      - Map QUEUED to CANCELLED because no provider attempt is recorded; map SENDING to RECONCILIATION_REQUIRED because an effect may exist; map DELIVERED to DELIVERED; map BOUNCED and FAILED to FAILED_PERMANENT; map SUPPRESSED to SUPPRESSED. Record a migration audit receipt per row and never invent delivered/read proof.
      - Backfill version=1, generation=1, current_evidence_rank=0, cancellation_generation=0, updated_at=COALESCE(delivered_at,queued_at), terminal_at only for mapped terminal states and delivery_digest=sha256(canonical legacy row plus migration version).
      - Leave current-contract FK/content/authorization/provider columns null for LEGACY_V13 rows; the conditional CHECK makes them permanently nondispatchable and queryable as honest legacy evidence.
      - Set defaults for new inserts to COMMUNICATION_V1 and dispatch_eligible=true, add all constraints NOT VALID, validate, then install lifecycle trigger.
      - Create the compatibility view only after the physical relation and constraints are final.
    compatibility_view:
      name: ops.email_deliveries
      predicate: channel = 'SMTP_EMAIL'
      check_option: LOCAL
      columns: [id, message_type, recipient_hash, template_version, object_type, object_id, provider_message_id, state AS status, attempt_count, last_error_code, queued_at, delivered_at]
      grants: SELECT only for former readers; INSERT, UPDATE and DELETE are revoked so legacy DML cannot bypass current approval, consent, budget and kill-switch fences.
      dual_write: forbidden
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      delete: revoked from every runtime role
      mutation_functions:
        - {name: ops.queue_outbound_delivery, execute: [gurine_notification_worker], security_definer: true}
        - {name: ops.claim_outbound_delivery_attempt, execute: [gurine_notification_worker], security_definer: true}
        - {name: ops.cancel_outbound_delivery, execute: [gurine_control_api], security_definer: true}
    mutability:
      mode: LIFECYCLE_GUARDED
      immutable_current_columns: [id, contract_version, intent_id, intent_digest, intent_source_decision_digest, rendering_id, endpoint_id, endpoint_version, endpoint_snapshot_digest, recipient_endpoint_hmac, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_id, provider_preflight_receipt_digest, channel, delivery_key, locale, template_id, template_revision, rendered_sha256, rendering_digest, authorization_snapshot_digest, suppression_snapshot_digest, activation_receipt_digest, budget_reservation_id, execution_authorization_id, execution_generation, decision_digest, effect_safety_class, provider_idempotency_key_ciphertext, provider_key_encryption_key_id, provider_idempotency_key_sha256, delivery_digest, object_type, object_id, queued_at]
      update_rule: expected version increments exactly once on a declared outbound_delivery edge. SENDING claims require current generation/fence and all policy checks; terminal rows never reopen. Retry increments generation only after definite-not-accepted proof and preserves delivery/rendering/provider idempotency keys.
    retention:
      record_class: COMMUNICATION_DELIVERY_EVIDENCE
      trigger: source record schedule
      schedule_binding: latest effective nonexpired ops.record_class_schedules revision
      legal_hold_key: [object_type, object_id, intent_id, endpoint_id, id]
      backup_behavior: restoration applies endpoint revocation, authorization revocation and suppression before any restored row is dispatchable
      terminal_action: PRESERVE_DIGESTED_RECEIPT_AND_CRYPTO_ERASE_PROVIDER_IDENTIFIER
    repository:
      roundtrip: COMMUNICATION_V1 rows require every current field; LEGACY_V13 is an explicit typed variant and never silently upgrades
      dispatch_order: [not_before, queued_at, id]
      lock_order: [ops.outbound_deliveries]

session_isolation_contracts:
  common:
    credential_transport: X-Gurine-Submission-Session carries the opaque token only from the server-side BFF; PostgreSQL stores lowercase SHA-256 only and browser cookies use the authenticated-encrypted submission-session envelope.
    rotation_transport: Each state-changing derived-session command carries a fresh BFF-only X-Gurine-Next-Submission-Session token bound into the service assertion and request digest; only its hash is passed to the fixed procedure, and success seals it into the next child cookie.
    issuer_set: [public-web, response-portal]
    unavailable_error: SCOPED_SESSION_REQUIRED
    non_leakage: unknown token, wrong issuer/kind/scope, expired, revoked, consumed, lineage mismatch and cross-object access produce the same status, body shape and observability classification.
    lineage: Every derived row stores parent_session_id, scope_binding_digest, issuance_receipt_digest and a strictly increasing rotation_sequence. A parent session remains its original kind and allowed-operation set; derivation never widens it.
    replay_order:
      - Verify the request-bound BFF service assertion and compute session-token hash, idempotency-key hash and exact request-byte digest.
      - Lock the operation+BFF-issuer+session-token-hash+idempotency-key claim before requiring the session to remain ACTIVE.
      - A FINAL claim with the same request and session binding returns the stored status, headers and body bytes immediately, even when the one-shot session is now CONSUMED; no domain row is locked and no event is emitted.
      - A FINAL claim with a different digest is IDEMPOTENCY_CONFLICT. An unfinished claim follows the bounded in-progress policy and never reruns a possible effect.
      - Only a new claim resolves and locks the ACTIVE session, validates lineage/scope/version, mutates the domain, consumes or rotates the session, and finalizes the immutable response bytes in one transaction.
  communication_profile_session:
    creates_new_public_operation: false
    private_bff_session_broker_operation: issueCommunicationProfileSession
    session_kind: COMMUNICATION_PROFILE
    scope_type: COMMUNICATION_SUBJECT
    ttl_seconds: 1800
    mode: ROTATING_SCOPED_COMMAND
    allowed_operations: [requestCommunicationEndpointLink, verifyCommunicationEndpointLink, unlinkCommunicationEndpoint]
    eligible_parent_session_kinds:
      SUBSCRIPTION_MANAGEMENT: {origin_object_type: SUBSCRIPTION, scope_type: SUBSCRIPTION, derive_object_id: parent.scope_id, derive_version: 1, stable_binding: "RFC8785_JCS(CommunicationOriginSubscriptionV1{id})"}
      RESPONSE_RECEIPT: {origin_object_type: RESPONSE_REQUEST, scope_type: RESPONSE_SUBMISSION, derive_object_id: intake.response_submissions.response_request_id, derive_version: 1, stable_binding: editorial.response_requests.request_binding_digest}
      CORRECTION_RECEIPT: {origin_object_type: CORRECTION_REQUEST, scope_type: CORRECTION_REQUEST, derive_object_id: parent.scope_id, derive_version: 1, stable_binding: "RFC8785_JCS(CommunicationOriginCorrectionRequestV1{id})"}
    issuer: intake.issue_communication_profile_session
    resolver: intake.resolve_communication_profile_session
    issuance:
      - Accept an eligible parent token hash, exact BFF issuer, fresh child token hash, parent expected version and absolute expiry no later than now plus 1800 seconds; raw token and CSRF value are never function arguments.
      - Lock parent, its exact origin row and any existing communication subject in global order. Derive one origin binding digest from origin type, ID, version and receipt/profile digest; zero or multiple origin rows are corruption.
      - Resolve or create only the subject with that origin binding, then insert one COMMUNICATION_PROFILE child scoped to subject ID with lineage fields and an immutable issuance receipt. Cross-origin subject merging and parent-kind conversion are forbidden.
      - Same parent/version/fresh child hash/request digest returns the stored issuance receipt. Reused child hash or changed request is conflict; wrong parent truth is the common unavailable result.
    reentry_rotation: A still-valid eligible parent may issue a fresh COMMUNICATION_PROFILE child. The prior child is revoked in the same transaction only when its subject binding matches; rotation never moves a child to another subject.
    cookie: {name: gurine_communication_profile_session, path: /communication-profile, same_site: Lax, http_only: true, host_only: true, sealed_payload_session_kind: COMMUNICATION_PROFILE}
    operation_binding: Every command requires COMMUNICATION_PROFILE and exact subject scope. expectedProfileVersion is checked after subject lock; verification additionally requires challenge.profile_session_id to equal the active child session and the challenge's subject/revision binding.
    endpoint_link_transaction:
      lock_order: [intake.submission_sessions, intake.communication_subjects, intake.communication_endpoints, intake.communication_endpoint_verifications, intake.communication_endpoint_link_events, intake.communication_authorization_events]
      request: Insert PENDING_VERIFICATION endpoint, immutable revision snapshot, single-use challenge and LINK_REQUESTED event; append endpoint-linking consent only, never communication-purpose consent. Rotate the profile session and finalize exact response bytes atomically.
      verify: Consume the exact challenge once, activate the exact endpoint, append its ACTIVE revision and VERIFIED link event, and append only an exact pre-captured subscription authorization binding; voice always needs a separate VOICE_CONSENT. Rotate the profile session and finalize exact response bytes atomically.
      unlink: Mark endpoint REVOKED, append link event and authorization revocations, apply matching suppression to every unsent delivery, and increment profile version atomically.
  response_appeal_session:
    parent_session_kind: RESPONSE_RECEIPT
    parent_scope_type: RESPONSE_SUBMISSION
    parent_allowed_operations_unchanged: [getResponseReceipt]
    private_bff_session_broker_operations: [issueResponseAppealCreateSession, rotateResponseAppealStatusSession]
    derived_session_kinds:
      APPEAL_CREATE: {scope_type: RESPONSE_SUBMISSION, ttl_seconds: 900, mode: ONE_SHOT_COMMAND, allowed_operations: [createResponseAppeal]}
      APPEAL_STATUS: {scope_type: APPEAL, ttl_seconds: 1800, mode: READ_ONLY_ROTATING, allowed_operations: [getResponseAppeal]}
    procedures: [intake.issue_response_appeal_create_session, intake.create_response_appeal_session, intake.get_response_appeal_session, intake.rotate_response_appeal_status_session]
    issuance:
      - APPEAL_CREATE derives only from an ACTIVE RESPONSE_RECEIPT whose submission row and receipt version/digest are locked. Its scope binding includes response submission, response request, receipt version and receipt digest.
      - Successful create consumes APPEAL_CREATE, inserts the appeal and issues one APPEAL_STATUS child scoped to the new appeal in the same transaction. Failure leaves no status child.
      - Re-entry derives a replacement APPEAL_STATUS only after the RESPONSE_RECEIPT proof is re-established and the appeal composite scope matches that submission/request. Rotation revokes the previous status child for that appeal.
    scope_rule: create requires APPEAL_CREATE.scope_id = appeals.response_submission_id. get requires APPEAL_STATUS.scope_id = appeals.id and verifies the stored appeal-to-submission-to-request composite; appealId never substitutes for session scope.
    cookie: {name: gurine_response_appeal_session, path: /respond/receipt/appeal, same_site: Lax, http_only: true, host_only: true, sealed_payload_kinds: [APPEAL_CREATE, APPEAL_STATUS]}

communication_authorization_evaluator_contract:
  input: CommunicationAuthorizationEvaluationV1{subjectId,subjectOriginBindingDigest,endpointId,endpointVersion,endpointSnapshotDigest,channel,purpose,topicScopeDigest,effectiveAt}
  lock_and_match:
    - Lock the communication subject by the composite ID/origin-binding candidate and require ACTIVE.
    - Lock the endpoint head by composite endpoint/subject identity and require its current version, HMAC/digest-derived snapshot and channel to equal the requested immutable link revision.
    - Resolve exactly one immutable endpoint revision by subject, endpoint, version and snapshot digest; a revision from another subject cannot join.
    - Select authorization events only for that same subject-origin plus endpoint revision plus channel/purpose/topic, effective_at <= evaluation time and unexpired; order effective_at DESC, authorization_sequence DESC, id DESC.
    - The first effective event is authority: GRANTED, VERIFIED or RESTORED allows; REVOKED, EXPIRED or SUSPENDED denies. Missing, duplicate sequence or unknown type is typed corruption and denies.
    - Resolve purpose/topic preference and every applicable subject/endpoint/purpose/topic suppression under the same subject. Any active suppression denies; a RELEASE affects only its exact APPLY row.
  consent_source_binding: The granting event's source kind/ID/version/decision digest and proof receipt are stored, unique and checked under the same transaction. A session, endpoint possession, profile preference or provider capability never substitutes for purpose consent.
  result: CommunicationAuthorizationSnapshotV1 with ordered contributing event IDs/digests, current endpoint revision, preference/suppression digests, evaluation time and lowercase SHA-256; no raw destination or identity value.
  database_boundary: ops.evaluate_communication_authorization(ops.communication_authorization_evaluation_v1) RETURNS ops.communication_authorization_snapshot_v1 is STABLE, SECURITY DEFINER, fixed-search-path, PUBLIC-revoked and executable only by gurine_notification_worker and the named queue procedures.
  negative_oracles: [subject-endpoint mismatch, stale endpoint revision, wrong channel, wrong purpose, wrong topic, expired grant, later revoke, active suppression, missing source decision, duplicate latest order]

delivery_exactly_once_contract:
  enqueue_identity:
    logical_intent_unique: [deployment_id, logical_intent_digest]
    delivery_unique: [intent_id, endpoint_id, endpoint_version, endpoint_snapshot_digest, channel, locale, template_id, template_revision, rendered_sha256]
    provider_key_unique: [provider_config_id, provider_idempotency_key_sha256]
  queue_gate:
    required_current_fences: [approved rendering digest, exact immutable endpoint revision still current on the endpoint head, active purpose/topic authorization bound to that subject and revision, no matching suppression, active exact provider config and activation receipt, selected immutable provider preflight/config revision, budget reservation, kill switch permit, not-before and expiry]
    atomic_result: Insert ops.outbound_deliveries in QUEUED and communication.delivery_requested.v1 only after all fences pass. Intent MATERIALIZED alone emits no delivery request.
  endpoint_verification_bootstrap:
    problem_closed: A newly enrolled endpoint is PENDING_VERIFICATION and therefore cannot satisfy the normal ACTIVE endpoint plus purpose-authorization gate used by ordinary delivery.
    exact_lane:
      purpose: ENDPOINT_VERIFICATION
      communication_class: SYSTEM_TRANSACTIONAL
      source_object_type: COMMUNICATION_ENDPOINT_VERIFICATION
      source_object_id: exact intake.communication_endpoint_verifications.id
      permitted_endpoint_state: PENDING_VERIFICATION
      required_bindings: [subject_origin_binding_digest, endpoint_id, endpoint_version, endpoint_snapshot_digest, verification_binding_digest, profile_session_id, challenge_hash, expires_at]
      authorization: The immutable LINK_REQUESTED revision and ENDPOINT_LINKING_CONSENT proof authorize only transport of this one challenge. They do not create subscription, marketing, voice, fallback or any other communication-purpose consent.
      provider_fences: exact active provider head, immutable PASS preflight/config revision, activation receipt, jurisdiction/template capability, budget and kill switch
      delivery_limits: {channels: exact enrolled channel only, fallback: false, maximum_attempts: 1, expires_at: no later than challenge expiry, attachments: forbidden, discretionary_content: forbidden}
      rendering_rule: rendered bytes contain only the bounded challenge/link and required transactional disclosure; raw challenge/token is encrypted content and never appears in intent, event, audit, receipt, log, URL analytics or provider idempotency key.
      terminal_rule: verified, expired, failed, cancelled or replaced challenge suppresses every unsent bootstrap delivery. Any possible provider effect follows ordinary reconciliation and cannot authorize the endpoint.
    ordinary_lane_exclusion: No other purpose may dispatch unless the endpoint head is ACTIVE and an exact active authorization event exists for subject, immutable endpoint revision, channel, purpose and topic scope.
  dispatch:
    claim_query: SELECT eligible delivery FOR UPDATE SKIP LOCKED ORDER BY not_before, queued_at, id
    before_egress: Insert and commit one attempt with ordinal, lease token hash, monotonic fencing token and stable provider idempotency key; update delivery to SENDING.
    adapter_call: exactly once per committed attempt; adapter may add transport framing but rendered_sha256 and semantic payload do not change.
    observation: Append authenticated receipt in a new transaction. Lost/timeout response after dispatch is RECONCILIATION_REQUIRED.
  retry:
    maximum_attempts: 3
    requires: definitive NOT_TRANSMITTED or provider idempotent replay-safe proof
    preserves: [delivery_key, rendering_digest, rendered_sha256, provider_config_id, provider_idempotency_key_sha256]
    increments: [generation, attempt_ordinal, fencing_token]
    forbidden: [blind retry, fallback during ambiguity, provider-key rotation, content rewrite]
  cancellation:
    before_dispatch: CANCELLED with proof of zero provider attempt
    after_dispatch: cancelRequestedAt and nonterminal truth until provider/no-effect proof

pre_dispatch_authorization_fence_contract:
  evaluations:
    audience_materialization: capture endpoint head, authorization ledger head, purpose/topic preference, suppression set and policy versions; this snapshot is evidence but never a future send permit
    queue: re-evaluate the same facts plus provider activation, approved rendering, budget, kill switch, expiry and fallback eligibility while inserting QUEUED
    dispatch_linearization: ops.claim_outbound_delivery_attempt locks subject, endpoint, authorization events, preference, suppressions, opt-out receipts, delivery, provider head/preflight, budget, kill switch and cancellation generation in delivery_global_lock_order; it re-evaluates current facts and commits the immutable attempt as the one dispatch permit immediately before egress
  required_current_facts:
    - exact subject remains ACTIVE and its origin binding is unchanged
    - exact endpoint head remains ACTIVE at the stored version/snapshot/channel, except the isolated endpoint-verification bootstrap lane
    - latest effective purpose/topic/channel authorization is granting, unexpired and bound to the exact endpoint revision and source decision
    - no active subject, endpoint, purpose, topic, provider, legal, privacy, bounce, abuse, kill-switch or opt-out suppression applies
    - preference version/digest still permits this channel, fallback position, locale, per-message cost and frequency
    - local time in the pinned IANA timezone is outside every quiet day/hour interval; the computed next eligible instant is before delivery expiry
    - immutable provider revision remains ACTIVE with nonexpired activation/preflight, budget reservation is current and cancellation generation matches
  quiet_hours:
    interval_semantics: quiet_days use local weekday 0..6; start less than end is same-day [start,end), start greater than end crosses midnight and binds both local dates. DST gaps advance to the first valid instant and folds select the later instant. The pinned timezone database revision is part of policy_fence_digest.
    blocked_action: leave the delivery QUEUED or RETRY_SCHEDULED, set next_attempt_at to the deterministic next eligible instant, emit no attempt/provider call and consume neither attempt count nor budget
    bypass: forbidden unless an exact versioned incident-recovery policy explicitly authorizes the purpose and is included in authorization_snapshot_digest; operator role or urgency text alone never bypasses quiet hours
  opt_out_atomicity:
    transaction: Lock subject, endpoint, current authorization, preference, matching suppressions, existing opt-out identity and unsent deliveries. Append authorization REVOKED when consent-based, append USER_OPTOUT APPLY suppression, insert one opt-out receipt/audit/outbox, and move every matching QUEUED/RETRY_SCHEDULED row to SUPPRESSED atomically.
    race: >-
      Opt-out and dispatch permit serialize on the same endpoint/delivery lock. If
      opt-out wins, provider calls are zero. If the committed dispatch permit wins,
      the effect is already possibly started: opt-out records cancelRequestedAt,
      forbids retry/fallback and leaves outcome to receipt/reconciliation instead
      of claiming the send was prevented.
    scope: An opt-out suppresses only its exact purpose/topic or broader explicitly selected consent scope. It never relabels marketing as transactional and never suppresses a separately documented legal/contractual transactional purpose without its own applicable suppression.
  fallback:
    eligibility: explicit fallback_allowed, ordered active purpose-compatible endpoint, definite permanent failure or reconciled SLA expiry, no ambiguous prior effect, fresh authorization/suppression/quiet-hour/cost/activation checks and an approved rendering for the new channel
    identity: same intent and semantic payload/disclosure digest, new endpoint/channel rendering and new delivery key; the prior delivery/receipt chain remains immutable
    forbidden: [fallback during SENDING, fallback during RECONCILIATION_REQUIRED, purpose widening, silent translation, content rewrite, provider-key reuse across providers]
  concurrency_proof:
    - 64 dispatch claimers versus one authorization revoke produce either one permit before the revoke or zero permits after it, never a post-revoke provider call.
    - 64 dispatch claimers versus one opt-out produce one linearized winner and one opt-out receipt; every nonwinning unsent delivery is SUPPRESSED.
    - Quiet-hour boundary, midnight, DST gap/fold and expiry races produce a single deterministic next_attempt_at and zero network call while blocked.

stable_rendering_and_provider_idempotency_contract:
  rendering: The selected CommunicationRenderingBindingV1, encrypted rendered bytes, rendered_sha256, semantic_payload_digest, endpoint revision and approval receipt are immutable before QUEUED and reused byte-for-byte by every attempt of one delivery.
  provider_key: Generate one cryptographically random or provider-prescribed idempotency key before the first attempt, store it encrypted plus its purpose-HMAC/SHA binding on the delivery, and preserve it across every proof-authorized retry. No lease, worker, retry or reconciliation path generates or rotates it.
  request_sha256: Hash the canonical provider operation request after deterministic adapter framing but before attempt-specific authorization headers; it binds rendered_sha256, destination identity HMAC, template/provider fields and provider idempotency key. Any semantically relevant byte change requires a new rendering/delivery, not another attempt.
  response_access_artifact: RIGHT_OF_REPLY_REQUEST and reminder rendering resolves the one current COMMUNICATION_V1 intake.response_access_tokens artifact bound to the response request, intent and rendering. Token, OTP derivation and link bytes are fixed before queue and reused by consumer replay/retry; no send handler inserts a token.
  recovery: A database error before attempt commit proves no provider call and rolls back. Any timeout, connection loss after a possible write, unverified response, response parse failure, stale fence discovered after dispatch, process crash after dispatch, or provider success followed by receipt transaction failure is RECONCILIATION_REQUIRED.
  lease_expiry: Lease expiry proves only that the worker lease ended. If an attempt was committed, expiry never changes it to RETRY_SCHEDULED and never authorizes another provider call.
  safe_retry: A new ordinal is permitted only by a persisted CommunicationSafeRetryProofV1 showing NO_PROVIDER_ATTEMPT, authoritative PROVIDER_LOOKUP_NOT_FOUND, or exact provider-idempotent replay safety for the same delivery/provider key/request digest. The proof is revalidated under the next claim lock.
  negative_oracles: [new token on event replay, new OTP on retry, changed rendering bytes, changed provider key, timeout retry, receipt-commit retry, ambiguity fallback, lease-expiry retry, content rewrite under same delivery]

callback_replay_and_order_contract:
  operations:
    commands: [acceptSmtpDsn, receiveTelegramWebhook, receiveWhatsAppWebhook, receiveLineWebhook, receiveSolapiSmsCallback, receiveSolapiKakaoCallback, receiveTwilioVoiceCallback]
    query: verifyWhatsAppWebhook
  verification_order:
    - Resolve integration_id to the exact immutable provider preflight/config revision selected for callback authentication without revealing existence.
    - Enforce that adapter's exact method, target, content type and body-size limit before parse; compute target, header and body digests from raw bytes.
    - Verify CommunicationCallbackAuthenticationEvidenceV1 for that adapter. SMTP request-bound X-Gurine-Mta-Assertion, Telegram secret-token, Meta HMAC, LINE HMAC, Solapi signature and Twilio signature each have their own required fields; timestamp or nonce is never required or synthesized for a provider contract that does not supply it.
    - Compute callback_request_digest and request-level replay_key_digest from provider revision plus the adapter-declared canonical signed inputs. Lock or insert one request identity before parsing or delivery locks.
    - A finalized same-digest replay returns stored HTTP status, headers and body bytes. Changed target, header or body under the same replay/provider-request identity is CALLBACK_REPLAY_CONFLICT and creates zero effect.
    - Parse one bounded CommunicationCallbackNormalizedItemSetV1 only after authentication. Ordinals are contiguous and provider identities are purpose-HMACed; raw values remain encrypted in the request row.
    - Lock matched deliveries in UUID order, then attempts and receipt chains. Apply only legal monotonic edges per item; stale and unmatched items remain represented without state regression.
    - Insert one callback request, zero-or-one receipt per item, audit/outbox rows and exact acknowledgement bytes atomically; any item-processing failure before finalization rolls back the whole request.
  evidence_order:
    primary: authenticated provider sequence when present
    secondary: provider_occurred_at when present
    tiebreaker: [received_at, callback_request_id, item_ordinal]
    rule: Storage order never authorizes a transition. Closed state edge and proof capability are authority; lower/incomparable evidence is retained with applied=false and no state regression.
  provider_limits:
    email_open_pixel: forbidden
    read_state: only an adapter with authenticated read proof
    provider_acceptance: never delivery
    unsupported_idempotency_or_reconciliation: cannot activate for duplication-sensitive communication

provider_observation_mapping_registry:
  common:
    acceptance_rule: A successful outbound HTTP/SMTP/provider API response proves at most PROVIDER_ACCEPTED unless the same response contains a separately verified SignedWebhookAcknowledgementV1 CONSUMED receipt. Queue admission, socket write, provider message ID and provider "sent" status are not delivery.
    delivery_rule: DELIVERED requires the exact activated capability and signed callback, authenticated poll or official signed channel receipt bound to this delivery/provider revision/rendering. READ additionally requires an authenticated adapter-native read fact; inference, link click and open pixel are forbidden.
    failure_rule: Only an authenticated provider fact with closed terminal semantics may assert FAILED_PERMANENT. Transport errors after a possible write and unrecognized/contradictory provider status are RECONCILIATION_REQUIRED.
  SMTP_EMAIL:
    outbound_response: PROVIDER_ACCEPTED
    authenticated_dsn:
      DELIVERED: DELIVERED
      RELAYED: PROVIDER_ACCEPTED
      EXPANDED: PROVIDER_ACCEPTED
      DELAYED: PROVIDER_ACCEPTED
      FAILED: FAILED_PERMANENT
    read: forbidden
  TELEGRAM_BOT_API:
    outbound_response: PROVIDER_ACCEPTED
    webhook_effects: [OPT_OUT_REQUEST, ENDPOINT_INTERACTION]
    delivery_callback: none
    maximum_proof: PROVIDER_ACCEPTED
  META_WHATSAPP_BUSINESS_CLOUD:
    outbound_response: PROVIDER_ACCEPTED
    authenticated_status: {SENT: PROVIDER_ACCEPTED, DELIVERED: DELIVERED, READ: READ, FAILED: FAILED_PERMANENT}
    inbound_text_effects: [OPT_OUT_REQUEST, ENDPOINT_INTERACTION]
  LINE_MESSAGING_API:
    outbound_response: PROVIDER_ACCEPTED
    webhook_effects: [OPT_OUT_REQUEST, ENDPOINT_INTERACTION]
    delivery_callback: none
    maximum_proof: PROVIDER_ACCEPTED
  SOLAPI_SMS:
    outbound_response: PROVIDER_ACCEPTED
    authenticated_status: {QUEUED: PROVIDER_ACCEPTED, SENT: PROVIDER_ACCEPTED, DELIVERED: DELIVERED, FAILED: FAILED_PERMANENT}
    opt_out_effects: [OPT_OUT_REQUEST]
  SOLAPI_KAKAO_BIZMESSAGE:
    outbound_response: PROVIDER_ACCEPTED
    authenticated_status: {QUEUED: PROVIDER_ACCEPTED, SENT: PROVIDER_ACCEPTED, DELIVERED: DELIVERED, FAILED: FAILED_PERMANENT}
    interaction_effects: [OPT_OUT_REQUEST, ENDPOINT_INTERACTION]
  TWILIO_VOICE:
    outbound_response: PROVIDER_ACCEPTED
    authenticated_status: {queued: PROVIDER_ACCEPTED, ringing: PROVIDER_ACCEPTED, in-progress: PROVIDER_ACCEPTED, completed: DELIVERED, busy: FAILED_PERMANENT, failed: FAILED_PERMANENT, no-answer: FAILED_PERMANENT, canceled: FAILED_PERMANENT}
    read: forbidden
    opt_out_effects: [OPT_OUT_REQUEST]
  SIGNED_WEBHOOK:
    unsigned_2xx: PROVIDER_ACCEPTED
    signed_acknowledgement: {ACKNOWLEDGED: PROVIDER_ACCEPTED, CONSUMED: DELIVERED, REJECTED: FAILED_PERMANENT}
    authenticated_poll: only the exact configured closed status schema may corroborate the same mapping
    read: forbidden
  set_equality_oracle: Provider-native status enums, normalized callback evidence, Rust adapter mappings, PostgreSQL transition tests and generated API receipt states are exact-set equal to this registry. Unknown or newly added provider status fails closed to reconciliation and cannot default to delivered or permanent failure.

callback_adapter_authentication_profiles:
  common:
    exact_raw_input: method, percent-encoded request target, selected header bytes and body bytes are captured before any framework normalization; each adapter declares which bytes are signed
    secret_rule: secret values are resolved only from the immutable provider revision's opaque secret reference and never stored, logged or returned
    request_identity: provider-native request/event identity is purpose-HMACed when available; otherwise the replay key uses the exact signed-input and body digests
    invalid_authentication: constant-shape provider response, zero database row and security telemetry without integration existence
  META_VERIFY_TOKEN_CHALLENGE:
    operation: verifyWhatsAppWebhook
    contract_revision: meta-whatsapp-business-cloud-v1
    request: {method: GET, exact_query_fields: [hub.mode, hub.verify_token, hub.challenge], body: forbidden, maximum_challenge_bytes: 1024}
    verification: exact constant-time comparison of hub.verify_token against the immutable version-qualified provider revision reference; hub.mode must equal subscribe
    success: return the validated hub.challenge bytes with text/plain and no persistence other than payload-free access telemetry
    failure: constant-shape 403 with no integration-existence disclosure; token/challenge never enter logs, audit, trace or analytics
  GURINE_MTA_ASSERTION:
    operation: acceptSmtpDsn
    contract_revision: gurine-smtp-dsn-v1
    request: {method: POST, content_types: ['multipart/report; report-type=delivery-status'], max_body_bytes: 10485760, item_count: 1}
    assertion_header: X-Gurine-Mta-Assertion
    evidence_required: [assertionIssuer, assertionKeyVersion, assertionJtiHmac, issuedAt, expiresAt, signedMethodSha256, signedTargetSha256, signedContentTypeSha256, signedBodySha256, signedInputSha256]
    timestamp_required: true
    freshness_window_seconds: 300
    nonce_required: true
    nonce_source: assertion JTI, stored only as purpose-separated HMAC
    signed_input: request-bound assertion covers exact POST, percent-encoded target, exact content type and raw MIME body SHA-256; the closed parser then enforces one message/delivery-status part, MIME depth 16 and part count 128
  TELEGRAM_SECRET_TOKEN:
    operation: receiveTelegramWebhook
    contract_revision: telegram-bot-api-v1
    request: {method: POST, content_types: [application/json], max_body_bytes: 2097152, item_count: 1}
    evidence_required: [secretTokenKeyVersion, secretTokenComparisonDigest]
    timestamp_required: false
    nonce_required: false
    signed_input: exact X-Telegram-Bot-Api-Secret-Token bytes plus body SHA-256
  META_HMAC_SHA256:
    operation: receiveWhatsAppWebhook
    contract_revision: meta-whatsapp-business-cloud-v1
    request: {method: POST, content_types: [application/json], max_body_bytes: 2097152, item_count: '1..1000'}
    evidence_required: [appSecretKeyVersion, xHubSignature256Digest, signedBodySha256]
    timestamp_required: false
    nonce_required: false
    signed_input: exact raw body bytes using sha256 HMAC; X-Hub-Signature-256 parsing is strict lowercase hex
  LINE_HMAC_SHA256:
    operation: receiveLineWebhook
    contract_revision: line-messaging-api-v1
    request: {method: POST, content_types: [application/json], max_body_bytes: 2097152, item_count: '1..1000'}
    evidence_required: [channelSecretKeyVersion, xLineSignatureDigest, signedBodySha256]
    timestamp_required: false
    nonce_required: false
    signed_input: exact raw body bytes using sha256 HMAC and strict canonical base64 signature decoding
  SOLAPI_SIGNATURE:
    operations: [receiveSolapiSmsCallback, receiveSolapiKakaoCallback]
    contract_revision: solapi-callback-v1
    request: {method: POST, content_types: [application/json], max_body_bytes: 2097152, item_count: 1}
    evidence_required: [apiSecretKeyVersion, signedDate, saltHash, signatureDigest, signedInputSha256]
    timestamp_required: true
    freshness_window_seconds: 300
    nonce_required: true
    nonce_source: provider salt
    signed_input: exact provider-declared date plus salt canonical bytes
  TWILIO_SIGNATURE:
    operation: receiveTwilioVoiceCallback
    contract_revision: twilio-voice-v1
    request: {method: POST, content_types: [application/x-www-form-urlencoded], max_body_bytes: 262144, item_count: 1}
    evidence_required: [authTokenKeyVersion, xTwilioSignatureDigest, externalUrlDigest, parameterCanonicalizationRevision]
    timestamp_required: false
    nonce_required: false
    signed_input: exact configured external URL plus provider-declared ordered parameters or raw-body mode; forwarded headers are never authority
  fixture_gate:
    required_per_profile: [valid, invalid_assertion_signature_or_token, wrong_method, wrong_target, wrong_content_type, body_one_byte_over_limit, changed_body, replay_same_bytes, replay_changed_bytes, maximum_multi_item, multi_item_one_over_limit, duplicate_provider_event_identity, out_of_order_item]
    storage: fixtures/communication-callbacks/<contract_revision>/ with manifest SHA-256 and provider documentation snapshot revision
    activation_rule: A provider revision cannot become ACTIVE unless all fixtures pass through the production raw-byte verifier/parser and the resulting preflight receipt binds their manifest digest. SMTP fixtures are exactly 10 MiB maximum MIME plus one-byte-over; signed JSON fixtures are exactly 2 MiB maximum plus one-byte-over; Twilio form fixtures are exactly 256 KiB maximum plus one-byte-over.
    concurrency_rule: Each profile also executes 64 identical callback requests, 64 same-replay-key changed-body contenders and a 64-item out-of-order schedule. Expected results are one request ledger plus byte-identical 63 replays, zero writes for changed-body losers, at most one effect receipt per item ordinal and no state/proof regression.

boundary_procedure_acl:
  universal:
    owner: gurine_migrator
    language: plpgsql-or-sql-as-declared
    security_definer: true
    fixed_search_path: [pg_catalog, intake, editorial, ops, extensions, pg_temp]
    dynamic_sql: forbidden
    public_execute: revoked
    runtime_table_writes: revoked
    row_count_rule: every expected singleton is SELECT INTO STRICT or an exact affected-row assertion; no first-row-wins
    error_rule: typed SQLSTATE plus closed application error; raw provider/database text is never returned
    idempotent_command_rule: lock finalized replay before session/state validation, then mutate and finalize stored response bytes atomically
  idempotency_boundary:
    relation: ops.idempotency_keys
    owner: gurine_migrator
    direct_relation_acl: no runtime role or PUBLIC has table-level or column-level privilege
    caller_identity: session_user is matched to claim_scope_registry; current_user is the fixed gurine_migrator definer and is never used as the caller identity
    role_switching: SET ROLE, SET SESSION AUTHORIZATION and caller-supplied role names are forbidden; runtime login roles have no membership path to gurine_migrator
    proconfig_literal: "search_path=pg_catalog, ops"
    sql_composite_types:
      creation_order: [ops.idempotency_claim_v1, ops.idempotency_claim_receipt_v1, ops.idempotency_finalize_v1, ops.idempotency_finalize_receipt_v1, ops.idempotency_replay_v1, ops.idempotency_replay_receipt_v1]
      ops.idempotency_claim_v1:
        fields:
          - {name: scope, type: text}
          - {name: operation_id, type: text}
          - {name: key_hash, type: "char(64)"}
          - {name: request_hash, type: "char(64)"}
          - {name: bff_issuer, type: text}
          - {name: session_token_hash, type: "char(64)"}
          - {name: resource_type, type: text}
          - {name: resource_id, type: text}
          - {name: expires_at, type: timestamptz}
      ops.idempotency_claim_receipt_v1:
        fields:
          - {name: disposition, type: text, closed: [NEW, RECLAIMED_EXPIRED, IN_PROGRESS, FINAL_AVAILABLE, LEGACY_FINAL_AVAILABLE]}
          - {name: claim_generation, type: bigint}
          - {name: response_digest, type: "char(64)"}
          - {name: receipt_digest, type: "char(64)"}
          - {name: completed_at, type: timestamptz}
          - {name: claim_expires_at, type: timestamptz}
      ops.idempotency_finalize_v1:
        fields:
          - {name: scope, type: text}
          - {name: operation_id, type: text}
          - {name: key_hash, type: "char(64)"}
          - {name: request_hash, type: "char(64)"}
          - {name: bff_issuer, type: text}
          - {name: session_token_hash, type: "char(64)"}
          - {name: expected_claim_generation, type: bigint}
          - {name: response_status, type: integer}
          - {name: response_schema, type: text}
          - {name: response_media_type, type: text}
          - {name: response_header_bytes, type: bytea}
          - {name: response_body_bytes, type: bytea}
          - {name: response_digest, type: "char(64)"}
          - {name: resource_type, type: text}
          - {name: resource_id, type: text}
          - {name: receipt_id, type: uuid}
          - {name: receipt_digest, type: "char(64)"}
          - {name: audit_event_id, type: uuid}
          - {name: outbox_id, type: uuid}
          - {name: completed_at, type: timestamptz}
      ops.idempotency_finalize_receipt_v1:
        fields:
          - {name: claim_generation, type: bigint}
          - {name: response_status, type: integer}
          - {name: response_schema, type: text}
          - {name: response_media_type, type: text}
          - {name: response_digest, type: "char(64)"}
          - {name: receipt_id, type: uuid}
          - {name: receipt_digest, type: "char(64)"}
          - {name: completed_at, type: timestamptz}
          - {name: idempotency_replay, type: boolean, constant: false}
      ops.idempotency_replay_v1:
        fields:
          - {name: scope, type: text}
          - {name: operation_id, type: text}
          - {name: key_hash, type: "char(64)"}
          - {name: request_hash, type: "char(64)"}
          - {name: bff_issuer, type: text}
          - {name: session_token_hash, type: "char(64)"}
          - {name: expected_claim_generation, type: bigint}
      ops.idempotency_replay_receipt_v1:
        fields:
          - {name: disposition, type: text, closed: [RESPONSE_FINAL, LEGACY_FINAL_COMPAT]}
          - {name: claim_generation, type: bigint}
          - {name: response_status, type: integer}
          - {name: response_schema, type: text}
          - {name: response_media_type, type: text}
          - {name: response_header_bytes, type: bytea}
          - {name: response_body_bytes, type: bytea}
          - {name: response_digest, type: "char(64)"}
          - {name: receipt_id, type: uuid}
          - {name: receipt_digest, type: "char(64)"}
          - {name: completed_at, type: timestamptz}
          - {name: idempotency_replay, type: boolean, constant: true}
      nullability_rule: PostgreSQL composite attributes are nullable; claim/finalize/replay reject NULL for every declared binding/generation field before table access. BFF/session fields may be NULL only for an exact non-derived legacy/base operation whose embedded registry declares them absent. Receipt/audit metadata may be NULL only in an explicitly identified LEGACY_FINAL_COMPAT replay; functions never synthesize it.
      field_set_oracle: pg_type+pg_attribute prove the six composite names, exact attribute ordinal/name/type/typmod and no extra attribute; every function input_fields list is exact-equal to its input composite. attempt_transaction_xid8 and claim_transaction_xid8 are server-owned physical relation columns and are forbidden in every caller composite.
      acl: REVOKE ALL ON TYPE for PUBLIC/all runtime roles, then grant the base three API roles USAGE on all six exact types; additionally grant gurine_workflow_worker USAGE on exactly ops.idempotency_finalize_v1 and ops.idempotency_finalize_receipt_v1 so the service-assertion journey wrapper signature is callable, with zero USAGE on the other four generic boundary types.
      exact_type_acl:
        ops.idempotency_claim_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [], PUBLIC: []}
        ops.idempotency_claim_receipt_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [], PUBLIC: []}
        ops.idempotency_finalize_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [USAGE], PUBLIC: []}
        ops.idempotency_finalize_receipt_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [USAGE], PUBLIC: []}
        ops.idempotency_replay_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [], PUBLIC: []}
        ops.idempotency_replay_receipt_v1: {gurine_submission_api: [USAGE], gurine_control_api: [USAGE], gurine_identity_api: [USAGE], gurine_workflow_worker: [], PUBLIC: []}
    functions:
      claim:
        signature: ops.claim_idempotency_v1(ops.idempotency_claim_v1) RETURNS ops.idempotency_claim_receipt_v1
        volatility: VOLATILE
        security_definer: true
        search_path: [pg_catalog, ops]
        input_fields: [scope, operation_id, key_hash, request_hash, bff_issuer, session_token_hash, resource_type, resource_id, expires_at]
        algorithm:
          - Validate lowercase hashes, bounded future lease, exact registered scope for session_user and the scope-specific nullability of BFF/session fields before touching the relation. Every relation/type/function reference is schema-qualified; extension functions use their exact schema because pg_temp and caller-writable schemas are absent from proconfig.
          - INSERT one storage_format=BOUND_V1 row with the complete claim tuple, claim_generation=1, terminal_disposition/terminalized_at/tombstone_digest NULL and the entire terminal-response tuple NULL, using named columns and ON CONFLICT (scope,key_hash) DO NOTHING; then SELECT the exact row FOR UPDATE.
          - For an unexpired active row, require exact operation/caller/session/request binding before IN_PROGRESS. A changed request or binding is IDEMPOTENCY_CONFLICT with zero mutation.
          - For an expired BOUND_V1 active row with an all-NULL terminal tuple, atomically replace the complete claim binding, increment claim_generation, refresh created_at/expires_at and return RECLAIMED_EXPIRED. No terminal, legacy or tombstoned row is reclaimable.
          - RESPONSE_FINAL returns FINAL_AVAILABLE even after expires_at; LEGACY_FINAL_COMPAT returns LEGACY_FINAL_AVAILABLE only for its exact mapped non-derived caller/binding. A tombstone returns IDEMPOTENCY_TERMINAL_UNAVAILABLE without row-existence fields.
          - FINAL_AVAILABLE contains only disposition, generation, response/receipt digests and completed_at; exact bytes are available only through replay with the same complete binding and generation.
        forbidden_return_fields: [key_hash, request_hash, bff_issuer, session_token_hash, storage_format, terminal_disposition, tombstone_digest, response_body, response_header_bytes, response_body_bytes]
      finalize:
        signature: ops.finalize_idempotency_response_v1(ops.idempotency_finalize_v1) RETURNS ops.idempotency_finalize_receipt_v1
        volatility: VOLATILE
        security_definer: true
        search_path: [pg_catalog, ops]
        input_fields: [scope, operation_id, key_hash, request_hash, bff_issuer, session_token_hash, expected_claim_generation, response_status, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, resource_type, resource_id, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at]
        algorithm:
          - Validate exact caller registry and every nonnull input before table access; lock exact (scope,key_hash), require storage_format=BOUND_V1, exact operation/request/BFF/session binding, expected_claim_generation equality, an unexpired active lease and NULL terminal disposition/marker/tombstone plus the entire terminal-response tuple NULL.
          - Validate the closed response schema, canonical safe-header bytes, body size/UTF-8 JSON canonical bytes, SHA-256 equality, receipt/audit/outbox existence and the command's atomic domain receipt before update.
          - Execute one named-column UPDATE from the incomplete tuple to the complete tuple, setting terminal_disposition=RESPONSE_FINAL and terminalized_at=completed_at in the same statement, guarded by claim_generation and terminal_disposition IS NULL; exact affected rows must equal one. response_body is parsed from response_body_bytes only as a compatibility mirror.
          - Re-read and return only generation/status/schema/media/digests/receipt/completed metadata. A stale generation raises IDEMPOTENCY_STALE_CLAIM; a complete row is immutable and a second finalize changes zero bytes and must continue through replay.
        forbidden: [upsert-finalize, update-without-row-lock, response-json-reserialization, null-to-partial-tuple, completed-row-update, finalize-legacy-row, finalize-expired-lease]
      replay:
        signature: ops.replay_idempotency_response_v1(ops.idempotency_replay_v1) RETURNS ops.idempotency_replay_receipt_v1
        volatility: STABLE
        security_definer: true
        search_path: [pg_catalog, ops]
        input_fields: [scope, operation_id, key_hash, request_hash, bff_issuer, session_token_hash, expected_claim_generation]
        algorithm:
          - Resolve exact registered scope for session_user and SELECT exactly one terminal row by (scope,key_hash); no session/domain row is read, so a finalized one-shot response remains replayable after its APPEAL_CREATE session is consumed or a COMMUNICATION_PROFILE token rotates.
          - Constant-shape compare operation, request, BFF issuer, session token hash and expected generation before reading response byte columns; any mismatch is IDEMPOTENCY_CONFLICT or scoped-unavailable with no existence disclosure and zero mutation.
          - For RESPONSE_FINAL, recompute response digest from response_body_bytes, validate safe header bytes and receipt digest, then return RESPONSE_FINAL plus generation/status/schema/media/header bytes/body bytes/response digest/receipt ID+digest/completed_at only.
          - For LEGACY_FINAL_COMPAT, require a non-derived exact legacy registry match, validate the pinned PostgreSQL-18.4 canonicalized JSON bytes/digest and return LEGACY_FINAL_COMPAT with nullable receipt/completion metadata. Tombstones and incomplete rows return no bytes.
          - Return zero audit, outbox, domain or session mutation and never expose compatibility response_body or any key/request/session hash.
        output_fields: [disposition, claim_generation, response_status, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, completed_at]
    owner_internal_function_catalog:
      reuse_input_output_types: [ops.idempotency_claim_v1, ops.idempotency_claim_receipt_v1, ops.idempotency_finalize_v1, ops.idempotency_finalize_receipt_v1, ops.idempotency_replay_v1, ops.idempotency_replay_receipt_v1]
      creation_order: [ops.claim_owner_idempotency_v1, ops.finalize_owner_idempotency_response_v1, ops.replay_owner_idempotency_response_v1]
      routines:
        - {name: ops.claim_owner_idempotency_v1, signature: 'ops.claim_owner_idempotency_v1(ops.idempotency_claim_v1)', returns: ops.idempotency_claim_receipt_v1, owner: gurine_migrator, security: INVOKER, volatility: VOLATILE, search_path: [pg_catalog, ops], execute: [gurine_migrator]}
        - {name: ops.finalize_owner_idempotency_response_v1, signature: 'ops.finalize_owner_idempotency_response_v1(ops.idempotency_finalize_v1)', returns: ops.idempotency_finalize_receipt_v1, owner: gurine_migrator, security: INVOKER, volatility: VOLATILE, search_path: [pg_catalog, ops], execute: [gurine_migrator]}
        - {name: ops.replay_owner_idempotency_response_v1, signature: 'ops.replay_owner_idempotency_response_v1(ops.idempotency_replay_v1)', returns: ops.idempotency_replay_receipt_v1, owner: gurine_migrator, security: INVOKER, volatility: STABLE, search_path: [pg_catalog, ops], execute: [gurine_migrator]}
      dependency_rule: create after the six reused composite types and before every 0028 journey owner routine; drop/recreate or overload substitution is forbidden
      generic_exclusion_rule: the three generic idempotency functions reject every JOURNEY_* scope before relation access; no generic caller registry contains a JOURNEY_* scope
      membership_rule: no runtime login role is a direct or transitive member of gurine_migrator and SET ROLE or SET SESSION AUTHORIZATION remains forbidden
      catalog_canary: pg_proc, pg_auth_members, aclexplode and has_function_privilege prove exactly three identities, SECURITY INVOKER, fixed search_path, owner migrator, EXECUTE only migrator, zero PUBLIC/runtime EXECUTE and no overload
    execute_acl:
      PUBLIC: []
      gurine_submission_api: [claim, finalize, replay]
      gurine_control_api: [claim, finalize, replay]
      gurine_identity_api: [claim, finalize, replay]
      all_other_runtime_roles: []
    composite_type_acl:
      PUBLIC: []
      gurine_submission_api: [USAGE]
      gurine_control_api: [USAGE]
      gurine_identity_api: [USAGE]
      gurine_workflow_worker: [USAGE_ON_ops.idempotency_finalize_v1, USAGE_ON_ops.idempotency_finalize_receipt_v1]
      all_other_runtime_roles: []
  composite_types:
    rule: Every named argument/receipt type below is a PostgreSQL composite with a matching additionalProperties=false Rust/JSON schema; generic jsonb arguments and RETURNS jsonb are forbidden.
    command_types: [idempotency_claim_v1, idempotency_claim_receipt_v1, idempotency_finalize_v1, idempotency_finalize_receipt_v1, idempotency_replay_v1, idempotency_replay_receipt_v1, communication_profile_session_issue_v1, communication_endpoint_link_request_v1, communication_endpoint_verify_v1, communication_endpoint_unlink_v1, communication_preference_update_v1, communication_opt_out_v1, communication_authorization_decision_v1, communication_authorization_evaluation_v1, communication_authorization_snapshot_v1, provider_config_create_v1, provider_config_transition_v1, provider_preflight_record_v1, communication_intent_materialize_v1, communication_intent_transition_v1, communication_rendering_create_v1, communication_rendering_transition_v1, outbound_delivery_queue_v1, outbound_delivery_claim_v1, communication_callback_request_v1, outbound_delivery_observation_v1, communication_reconciliation_v1, outbound_delivery_cancel_v1, business_calendar_create_v1, response_clock_start_v1, response_extension_decide_v1, response_appeal_create_session_issue_v1, response_appeal_create_v1, response_appeal_status_rotate_v1, response_appeal_transition_v1, response_request_sent_materialize_v1, response_request_sent_materialize_receipt_v1, response_submission_intake_materialize_v1, response_submission_intake_materialize_receipt_v1, response_otp_verify_v2]
    definitions:
      ops.outbound_delivery_observation_v1:
        fields:
          - {name: delivery_id, type: uuid}
          - {name: expected_delivery_version, type: bigint}
          - {name: source_kind, type: text}
          - {name: attempt_id, type: uuid}
          - {name: source_receipt_id, type: uuid}
          - {name: source_receipt_digest, type: "char(64)"}
