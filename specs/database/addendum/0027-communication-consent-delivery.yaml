      - {columns: [created_by], references: ops.users(id), on_delete: RESTRICT}
      - {columns: [updated_by], references: ops.users(id), on_delete: RESTRICT}
    deferred_foreign_keys:
      - {columns: [latest_preflight_receipt_id], references: ops.communication_provider_preflight_receipts(id), add_after_both_tables_exist: true, on_delete: RESTRICT}
      - {columns: [activation_decision_id], references: ops.capability_activation_decisions(id), migration: 0028_governance_operations.sql, on_delete: RESTRICT}
    unique_constraints:
      - {columns: [integration_id], name: communication_provider_integration_uq}
      - {columns: [deployment_id, environment, channel, provider_account_hmac, sender_identity_hmac], name: communication_provider_sender_uq}
      - {columns: [deployment_id, environment, configuration_digest], name: communication_provider_configuration_digest_uq}
      - {columns: [id, version, configuration_digest], name: communication_provider_id_version_digest_uq}
    checks:
      - environment IN ('development','test','staging','production')
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - adapter_id IN ('smtp-email-v1','telegram-bot-api-v1','meta-whatsapp-business-cloud-v1','line-messaging-api-v1','solapi-sms-v1','solapi-kakao-bizmessage-v1','twilio-voice-v1','signed-webhook-v1')
      - "channel = 'SMTP_EMAIL' AND adapter_id = 'smtp-email-v1' OR channel = 'TELEGRAM_BOT_API' AND adapter_id = 'telegram-bot-api-v1' OR channel = 'META_WHATSAPP_BUSINESS_CLOUD' AND adapter_id = 'meta-whatsapp-business-cloud-v1' OR channel = 'LINE_MESSAGING_API' AND adapter_id = 'line-messaging-api-v1' OR channel = 'SOLAPI_SMS' AND adapter_id = 'solapi-sms-v1' OR channel = 'SOLAPI_KAKAO_BIZMESSAGE' AND adapter_id = 'solapi-kakao-bizmessage-v1' OR channel = 'TWILIO_VOICE' AND adapter_id = 'twilio-voice-v1' OR channel = 'SIGNED_WEBHOOK' AND adapter_id = 'signed-webhook-v1'"
      - operational_state IN ('DISABLED','UNCONFIGURED','PENDING_PROVIDER_APPROVAL','ACTIVE','SUSPENDED')
      - version > 0
      - octet_length(sender_identity_ciphertext) BETWEEN 1 AND 16384
      - length(deployment_id) BETWEEN 1 AND 100
      - length(credential_secret_reference) BETWEEN 1 AND 500 AND credential_secret_reference !~ '[[:space:]]'
      - webhook_secret_reference IS NULL OR length(webhook_secret_reference) BETWEEN 1 AND 500
      - ops.secret_reference_is_version_pinned(credential_secret_reference) AND (webhook_secret_reference IS NULL OR ops.secret_reference_is_version_pinned(webhook_secret_reference))
      - callback_path IS NULL OR callback_path ~ '^/private/v1/callbacks/'
      - "channel = 'SIGNED_WEBHOOK' AND webhook_secret_reference IS NULL AND callback_path IS NULL AND callback_allowlist_digest IS NULL OR channel <> 'SIGNED_WEBHOOK' AND webhook_secret_reference IS NOT NULL AND callback_path IS NOT NULL AND callback_allowlist_digest IS NOT NULL"
      - "operational_state = 'ACTIVE' AND latest_preflight_receipt_id IS NOT NULL AND activation_decision_id IS NOT NULL AND activation_receipt_digest IS NOT NULL AND activation_effective_at IS NOT NULL OR operational_state <> 'ACTIVE'"
      - activation_expires_at IS NULL OR activation_expires_at > activation_effective_at
      - ops.is_lower_sha256(provider_account_hmac) AND ops.is_lower_sha256(sender_identity_hmac) AND (callback_allowlist_digest IS NULL OR ops.is_lower_sha256(callback_allowlist_digest)) AND ops.is_lower_sha256(jurisdiction_set_digest) AND ops.is_lower_sha256(dpa_evidence_digest) AND ops.is_lower_sha256(approved_template_catalog_digest) AND ops.is_lower_sha256(rate_limit_policy_digest) AND ops.is_lower_sha256(cost_policy_digest) AND ops.is_lower_sha256(provider_capabilities_digest) AND ops.is_lower_sha256(configuration_digest) AND (activation_receipt_digest IS NULL OR ops.is_lower_sha256(activation_receipt_digest))
    indexes:
      - {name: communication_provider_routing_idx, columns: [deployment_id, environment, channel, operational_state, id]}
      - {name: communication_provider_activation_expiry_idx, columns: [activation_expires_at, id], where: "operational_state = 'ACTIVE' AND activation_expires_at IS NOT NULL"}
    privileges:
      gurine_control_api: ["SELECT(id, integration_id, deployment_id, environment, channel, adapter_id, operational_state, version, provider_account_hmac, sender_identity_hmac, jurisdiction_set, jurisdiction_set_digest, dpa_evidence_digest, approved_template_catalog_digest, rate_limit_policy, rate_limit_policy_digest, cost_policy, cost_policy_digest, provider_capabilities, provider_capabilities_digest, kill_switch_code, configuration_digest, latest_preflight_receipt_id, activation_decision_id, activation_receipt_digest, activation_effective_at, activation_expires_at, created_by, updated_by, created_at, updated_at)"]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: ["SELECT(id, integration_id, deployment_id, environment, channel, adapter_id, operational_state, version, configuration_digest, latest_preflight_receipt_id, activation_decision_id, activation_receipt_digest, activation_effective_at, activation_expires_at)"]
      gurine_auditor: ["SELECT(id, integration_id, deployment_id, environment, channel, adapter_id, operational_state, version, provider_account_hmac, sender_identity_hmac, jurisdiction_set_digest, dpa_evidence_digest, approved_template_catalog_digest, rate_limit_policy_digest, cost_policy_digest, provider_capabilities_digest, kill_switch_code, configuration_digest, latest_preflight_receipt_id, activation_decision_id, activation_receipt_digest, activation_effective_at, activation_expires_at, created_by, updated_by, created_at, updated_at)"]
      mutation_functions:
        - {name: ops.create_communication_provider_config, execute: [gurine_control_api], security_definer: true}
        - {name: ops.transition_communication_provider_config, execute: [gurine_control_api, gurine_workflow_worker], security_definer: true}
    rls: {enabled: false, reason: internal service relation with explicit column grants and no public/submission schema privilege}
    mutability:
      mode: OPTIMISTIC_CONFIGURATION
      immutable_columns: [id, integration_id, deployment_id, environment, channel, adapter_id, created_by, created_at]
      update_rule: expected version increments exactly once; any config byte change produces a new configuration_digest, clears activation/preflight bindings and moves to UNCONFIGURED or SUSPENDED. ACTIVE never follows connection health alone.
    retention:
      record_class: COMMUNICATION_PROVIDER_CONFIGURATION
      schedule_binding: retention_defaults.schedule_binding
      trigger: superseded config plus audit schedule
      terminal_action: DELETE_SECRET_REFERENCES_AFTER_AUDIT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [id, integration_id]
      disclosure: secret references are identifiers only; credential and webhook secret values never enter PostgreSQL.
    repository:
      roundtrip: every closed JSON policy validates and its digest matches; secret references are opaque non-secret strings
      list_order: [deployment_id, environment, channel, adapter_id, id]
      activation_lock_order: [ops.communication_provider_configs, ops.communication_provider_preflight_receipts, ops.capability_activation_decisions]

  ops.communication_provider_preflight_receipts:
    owner:
      domain: CapabilityActivationDecision
      service: notification-worker
      repository: crates/persistence-postgres::capability_activation
      rust_row: CommunicationProviderPreflightReceiptRow
      rust_domain: gurine_domain::communication::CommunicationProviderPreflightReceipt
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      provider_config_id: {type: uuid, nullable: false}
      provider_config_version: {type: bigint, nullable: false}
      configuration_digest: {type: char(64), nullable: false}
      provider_revision_snapshot: {type: jsonb, schema: CommunicationProviderRevisionSnapshotV1, nullable: false}
      provider_revision_snapshot_digest: {type: char(64), nullable: false}
      test_generation: {type: bigint, nullable: false}
      test_environment: {type: text, nullable: false}
      result: {type: text, nullable: false}
      live_sandbox: {type: boolean, nullable: false}
      callback_or_poll_verified: {type: boolean, nullable: false}
      sender_identity_verified: {type: boolean, nullable: false}
      template_catalog_verified: {type: boolean, nullable: false}
      idempotency_capability: {type: text, nullable: false}
      reconciliation_capability: {type: text, nullable: false}
      highest_delivery_proof: {type: text, nullable: false}
      checklist: {type: jsonb, schema: CommunicationProviderPreflightChecklistV1, nullable: false}
      checklist_digest: {type: char(64), nullable: false}
      blocker_set: {type: jsonb, schema: CommunicationProviderPreflightBlockerSetV1, nullable: false}
      blocker_set_digest: {type: char(64), nullable: false}
      provider_evidence_digest: {type: char(64), nullable: false}
      contract_test_receipt_digest: {type: char(64), nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      performed_by_service: {type: text, nullable: false}
      requested_by: {type: uuid, nullable: false}
      started_at: {type: timestamptz, nullable: false}
      completed_at: {type: timestamptz, nullable: false}
      expires_at: {type: timestamptz, nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [provider_config_id], references: ops.communication_provider_configs(id), on_delete: RESTRICT}
      - {columns: [requested_by], references: ops.users(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [provider_config_id, provider_config_version, test_generation], name: communication_provider_preflight_generation_uq}
      - {columns: [id, provider_config_id, provider_config_version, configuration_digest, receipt_digest], name: communication_provider_revision_receipt_uq}
      - {columns: [receipt_digest], name: communication_provider_preflight_receipt_digest_uq}
    checks:
      - provider_config_version > 0 AND test_generation > 0
      - test_environment IN ('development','test','staging','production')
      - result IN ('PASS','FAIL','INCOMPLETE')
      - idempotency_capability IN ('NATIVE_IDEMPOTENCY','LOOKUP_BEFORE_RETRY','NONE')
      - reconciliation_capability IN ('SIGNED_CALLBACK','AUTHENTICATED_POLL','PROVIDER_LOOKUP','NONE')
      - highest_delivery_proof IN ('PROVIDER_ACCEPTED','DELIVERED','READ')
      - completed_at >= started_at AND expires_at > completed_at
      - provider_revision_snapshot_digest = configuration_digest
      - ops.communication_provider_revision_snapshot_is_valid(provider_revision_snapshot, provider_revision_snapshot_digest)
      - "result = 'PASS' AND live_sandbox AND callback_or_poll_verified AND sender_identity_verified AND template_catalog_verified AND blocker_set = '[]'::jsonb OR result <> 'PASS'"
      - ops.is_lower_sha256(configuration_digest) AND ops.is_lower_sha256(provider_revision_snapshot_digest) AND ops.is_lower_sha256(checklist_digest) AND ops.is_lower_sha256(blocker_set_digest) AND ops.is_lower_sha256(provider_evidence_digest) AND ops.is_lower_sha256(contract_test_receipt_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: communication_provider_preflight_current_idx, columns: [provider_config_id, provider_config_version, completed_at DESC, id DESC]}
      - {name: communication_provider_preflight_expiry_idx, columns: [expires_at, id], where: "result = 'PASS'"}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.record_communication_provider_preflight, execute: [gurine_notification_worker], security_definer: true}
    rls: {enabled: false, reason: internal immutable evidence with explicit grants}
    mutability:
      mode: APPEND_ONLY_PROVIDER_REVISION_LEDGER
      trigger: ops.reject_mutation
      rule: Each row preserves one exact closed provider configuration snapshot, including opaque secret-reference identifiers but never secret values. PASS is evidence only; exact legal activation and current configuration digest remain separately mandatory. Deliveries and callbacks bind the selected immutable receipt so a later mutable config-head transition cannot rewrite or block historical facts.
    retention:
      record_class: COMMUNICATION_PROVIDER_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: provider config retirement plus audit schedule
      terminal_action: PRESERVE_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [provider_config_id, id]
    repository:
      roundtrip: checklist and blocker set are closed, order-preserving typed values with digest equality
      current_order: [completed_at DESC, test_generation DESC, id DESC]

  ops.communication_intents:
    owner:
      domain: CommunicationIntent
      service: notification-worker
      repository: crates/persistence-postgres::communication
      rust_row: CommunicationIntentRow
      rust_domain: gurine_domain::communication::CommunicationIntent
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      deployment_id: {type: text, nullable: false}
      logical_intent_digest: {type: char(64), nullable: false}
      source_event_id: {type: uuid, nullable: false}
      source_event_type: {type: text, nullable: false}
      source_object_type: {type: text, nullable: false}
      source_object_id: {type: uuid, nullable: false}
      material_event_version: {type: bigint, nullable: false}
      communication_class: {type: text, nullable: false}
      purpose: {type: text, nullable: false}
      topic_scope: {type: jsonb, schema: CommunicationTopicScopeV1, nullable: false}
      topic_scope_digest: {type: char(64), nullable: false}
      recipient_subject_id: {type: uuid, nullable: false}
      audience_policy_version: {type: text, nullable: false}
      audience_policy_digest: {type: char(64), nullable: false}
      policy_snapshot_digest: {type: char(64), nullable: false}
      effect_safety_class: {type: text, nullable: false}
      source_decision_receipt_id: {type: uuid, nullable: false}
      source_decision_digest: {type: char(64), nullable: false}
      state: {type: text, nullable: false, default: "'CREATED'"}
      version: {type: bigint, nullable: false, default: 1}
      intent_digest: {type: char(64), nullable: false}
      creation_receipt_digest: {type: char(64), nullable: false}
      transition_receipt_digest: {type: char(64), nullable: true}
      terminal_reason_code: {type: text, nullable: true}
      terminal_evidence_digest: {type: char(64), nullable: true}
      policy_blocker_code: {type: text, nullable: true}
      policy_blocker_digest: {type: char(64), nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      state_changed_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      materialized_at: {type: timestamptz, nullable: true}
      cancelled_at: {type: timestamptz, nullable: true}
    primary_key: [id]
    foreign_keys:
      - {columns: [source_event_id], references: ops.outbox(id), on_delete: RESTRICT}
      - {columns: [recipient_subject_id], references: intake.communication_subjects(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [deployment_id, logical_intent_digest], name: communication_logical_intent_uq}
      - {columns: [deployment_id, source_event_id, material_event_version, communication_class, purpose, topic_scope_digest, recipient_subject_id, audience_policy_version], name: communication_intent_natural_identity_uq}
      - {columns: [id, source_object_type, source_object_id, source_decision_digest], name: communication_intent_source_binding_uq}
      - {columns: [intent_digest], name: communication_intent_digest_uq}
      - {columns: [id, intent_digest], name: communication_intent_id_digest_uq}
    checks:
      - material_event_version > 0 AND version > 0
      - communication_class IN ('SYSTEM_TRANSACTIONAL','SUBSCRIPTION_UPDATE','DISCRETIONARY_EXTERNAL','INTERNAL_ACTION_REQUEST')
      - purpose IN ('ENDPOINT_VERIFICATION','RIGHT_OF_REPLY_REQUEST','RIGHT_OF_REPLY_REMINDER','RESPONSE_RECEIPT','CORRECTION_STATUS','CORRECTION_RETRACTION_NOTICE','PRIVACY_TRANSACTIONAL_NOTICE','SECURITY_TRANSACTIONAL_NOTICE','SUBSCRIPTION_UPDATE','PRODUCT_MARKETING','INCIDENT_RECOVERY','INTERNAL_ACTION_REQUEST','DISCRETIONARY_OUTREACH')
      - state IN ('CREATED','MATERIALIZED','POLICY_BLOCKED','CANCELLED')
      - length(deployment_id) BETWEEN 1 AND 100
      - length(source_event_type) BETWEEN 1 AND 200
      - length(source_object_type) BETWEEN 1 AND 100
      - length(audience_policy_version) BETWEEN 1 AND 100
      - effect_safety_class IN ('DUPLICATION_SENSITIVE','DUPLICATION_TOLERANT')
      - intent_digest = logical_intent_digest
      - "communication_class = 'SUBSCRIPTION_UPDATE' AND purpose = 'SUBSCRIPTION_UPDATE' OR communication_class <> 'SUBSCRIPTION_UPDATE'"
      - "communication_class = 'INTERNAL_ACTION_REQUEST' AND purpose = 'INTERNAL_ACTION_REQUEST' OR communication_class <> 'INTERNAL_ACTION_REQUEST'"
      - "communication_class = 'SYSTEM_TRANSACTIONAL' AND purpose IN ('ENDPOINT_VERIFICATION','RIGHT_OF_REPLY_REQUEST','RIGHT_OF_REPLY_REMINDER','RESPONSE_RECEIPT','CORRECTION_STATUS','CORRECTION_RETRACTION_NOTICE','PRIVACY_TRANSACTIONAL_NOTICE','SECURITY_TRANSACTIONAL_NOTICE','INCIDENT_RECOVERY') OR communication_class <> 'SYSTEM_TRANSACTIONAL'"
      - "communication_class = 'DISCRETIONARY_EXTERNAL' OR purpose NOT IN ('PRODUCT_MARKETING','DISCRETIONARY_OUTREACH')"
      - "state = 'CREATED' AND materialized_at IS NULL AND cancelled_at IS NULL OR state = 'MATERIALIZED' AND materialized_at IS NOT NULL AND cancelled_at IS NULL OR state = 'POLICY_BLOCKED' AND policy_blocker_code IS NOT NULL AND policy_blocker_digest IS NOT NULL OR state = 'CANCELLED' AND cancelled_at IS NOT NULL"
      - "state = 'CREATED' AND transition_receipt_digest IS NULL AND terminal_reason_code IS NULL AND terminal_evidence_digest IS NULL OR state = 'MATERIALIZED' AND transition_receipt_digest IS NOT NULL OR state IN ('POLICY_BLOCKED','CANCELLED') AND transition_receipt_digest IS NOT NULL AND terminal_reason_code IS NOT NULL AND terminal_evidence_digest IS NOT NULL"
      - state_changed_at >= created_at
      - ops.is_lower_sha256(logical_intent_digest) AND ops.is_lower_sha256(topic_scope_digest) AND ops.is_lower_sha256(audience_policy_digest) AND ops.is_lower_sha256(policy_snapshot_digest) AND ops.is_lower_sha256(source_decision_digest) AND ops.is_lower_sha256(intent_digest) AND ops.is_lower_sha256(creation_receipt_digest) AND (transition_receipt_digest IS NULL OR ops.is_lower_sha256(transition_receipt_digest)) AND (terminal_evidence_digest IS NULL OR ops.is_lower_sha256(terminal_evidence_digest)) AND (policy_blocker_digest IS NULL OR ops.is_lower_sha256(policy_blocker_digest))
    indexes:
      - {name: communication_intent_source_idx, columns: [source_event_id, source_object_type, source_object_id]}
      - {name: communication_intent_recipient_idx, columns: [recipient_subject_id, purpose, created_at DESC, id DESC]}
      - {name: communication_intent_materialization_idx, columns: [state, created_at, id], where: "state = 'CREATED'"}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: ops.materialize_communication_intent, execute: [gurine_notification_worker], security_definer: true}
        - {name: ops.transition_communication_intent, execute: [gurine_notification_worker], security_definer: true}
    rls: {enabled: false, reason: internal pseudonymous relation with explicit service grants}
    mutability:
      mode: OPTIMISTIC_STATE_MACHINE
      immutable_columns: [id, deployment_id, logical_intent_digest, source_event_id, source_event_type, source_object_type, source_object_id, material_event_version, communication_class, purpose, topic_scope, topic_scope_digest, recipient_subject_id, audience_policy_version, audience_policy_digest, policy_snapshot_digest, effect_safety_class, source_decision_receipt_id, source_decision_digest, creation_receipt_digest, created_at]
      update_rule: CREATED makes one terminal MATERIALIZED, POLICY_BLOCKED or CANCELLED transition with expected version. MATERIALIZED creates renderings only; it does not emit communication.delivery_requested.v1.
    retention:
      record_class: COMMUNICATION_DELIVERY_EVIDENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: source object retention trigger
      terminal_action: PRESERVE_DIGESTED_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [source_object_type, source_object_id, recipient_subject_id, id]
    repository:
      roundtrip: source event/type/version, class, purpose, topic, recipient, audience policy and effect-safety fields form the natural identity and logical digest; none is synthesized from delivery rows
      materialization_order: [created_at, id]
      lock_order: [ops.communication_intents, intake.communication_subjects]

  ops.communication_renderings:
