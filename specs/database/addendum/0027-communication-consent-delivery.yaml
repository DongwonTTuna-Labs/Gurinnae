        nullable_terminal_response_tuple: [response_status, response_body, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at]
        rule: A new SUBMISSION_DERIVED claim stores the complete claim tuple while every terminal-response field remains NULL. Only finalize may atomically populate the entire terminal tuple and set terminal_disposition=RESPONSE_FINAL plus terminalized_at=completed_at; a 3-of-13 intermediate CHECK shape is forbidden because it rejects every valid claim with SQLSTATE 23514.
      guarded_update: For SUBMISSION_DERIVED scopes only ops.claim_idempotency_v1 may insert or reclaim the complete claim tuple, ops.finalize_idempotency_response_v1 may move one all-null terminal tuple to one complete terminal tuple, and owner retention may replace one RESPONSE_FINAL tuple with RETAINED_FINAL_TOMBSTONE. Each edge holds (scope,key_hash) FOR UPDATE and matches claim_generation. request_hash, session binding and response bytes of a finalized tuple are otherwise immutable; response_body JSONB is a parsed compatibility mirror and never the replay source.
      replay_key: key_hash is HMAC-SHA256 of operation ID, BFF issuer, session token hash and raw Idempotency-Key under the service idempotency key; same raw key in another session therefore has a different database identity.
