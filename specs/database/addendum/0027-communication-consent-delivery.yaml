      rendered_envelope_ciphertext: {type: bytea, nullable: false}
      encryption_key_id: {type: text, nullable: false}
      rendered_sha256: {type: char(64), nullable: false}
      rendered_byte_length: {type: bigint, nullable: false}
      transport_content_type: {type: text, nullable: false}
      state: {type: text, nullable: false, default: "'DRAFT'"}
      state_version: {type: bigint, nullable: false, default: 1}
      rendering_digest: {type: char(64), nullable: false}
      approval_kind: {type: text, nullable: true}
      approval_proposal_id: {type: uuid, nullable: true}
      approval_proposal_version: {type: bigint, nullable: true}
      approval_digest: {type: char(64), nullable: true}
      policy_decision_digest: {type: char(64), nullable: true}
      approval_receipt_digest: {type: char(64), nullable: true}
      transition_receipt_digest: {type: char(64), nullable: false}
      approval_expires_at: {type: timestamptz, nullable: true}
      expires_at: {type: timestamptz, nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      approved_at: {type: timestamptz, nullable: true}
      superseded_at: {type: timestamptz, nullable: true}
    primary_key: [id]
    foreign_keys:
      - {columns: [intent_id], references: ops.communication_intents(id), on_delete: RESTRICT}
      - {columns: [endpoint_id, endpoint_version, endpoint_snapshot_digest, channel], references: 'intake.communication_endpoint_link_events(endpoint_id,endpoint_version,endpoint_snapshot_digest,channel)', on_delete: RESTRICT}
      - {columns: [approval_proposal_id], references: ops.action_proposals(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [intent_id, endpoint_id, channel, rendering_revision], name: communication_rendering_revision_uq}
      - {columns: [rendering_digest], name: communication_rendering_digest_uq}
      - {columns: [intent_id, endpoint_id, channel, rendered_sha256], name: communication_rendered_bytes_uq}
      - {columns: [id, rendering_digest, rendered_sha256], name: communication_rendering_id_digest_bytes_uq}
    checks:
      - rendering_revision > 0 AND endpoint_version > 0 AND state_version > 0
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - state IN ('DRAFT','AWAITING_APPROVAL','APPROVED','REJECTED','CHANGES_REQUIRED','EXPIRED','SUPERSEDED')
      - length(locale) BETWEEN 2 AND 35
      - length(template_id) BETWEEN 1 AND 200 AND length(template_revision) BETWEEN 1 AND 100
      - disclosure_class IN ('PUBLIC','INTERNAL_MINIMAL','CONFIDENTIAL_LINK_ONLY')
      - rendered_byte_length BETWEEN 1 AND 10485760 AND octet_length(rendered_envelope_ciphertext) >= rendered_byte_length
      - length(encryption_key_id) BETWEEN 1 AND 200 AND length(transport_content_type) BETWEEN 1 AND 200
      - expires_at > created_at
      - approval_kind IS NULL OR approval_kind IN ('POLICY','HUMAN')
      - "approval_kind = 'HUMAN' AND approval_proposal_id IS NOT NULL AND approval_proposal_version IS NOT NULL AND approval_digest IS NOT NULL AND policy_decision_digest IS NULL OR approval_kind = 'POLICY' AND approval_proposal_id IS NULL AND approval_proposal_version IS NULL AND approval_digest IS NOT NULL AND policy_decision_digest IS NOT NULL OR approval_kind IS NULL AND approval_proposal_id IS NULL AND approval_proposal_version IS NULL AND approval_digest IS NULL AND policy_decision_digest IS NULL"
      - "state = 'APPROVED' AND approval_kind IS NOT NULL AND approval_receipt_digest IS NOT NULL AND approval_expires_at IS NOT NULL AND approved_at IS NOT NULL OR state <> 'APPROVED'"
      - approval_expires_at IS NULL OR approval_expires_at <= expires_at
      - "state = 'SUPERSEDED' AND superseded_at IS NOT NULL OR state <> 'SUPERSEDED'"
      - ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(variable_set_digest) AND ops.is_lower_sha256(attachment_manifest_digest) AND ops.is_lower_sha256(semantic_payload_digest) AND ops.is_lower_sha256(recipient_binding_digest) AND ops.is_lower_sha256(rendered_sha256) AND ops.is_lower_sha256(rendering_digest) AND (approval_digest IS NULL OR ops.is_lower_sha256(approval_digest)) AND (policy_decision_digest IS NULL OR ops.is_lower_sha256(policy_decision_digest)) AND (approval_receipt_digest IS NULL OR ops.is_lower_sha256(approval_receipt_digest)) AND ops.is_lower_sha256(transition_receipt_digest)
    indexes:
      - {name: communication_rendering_intent_idx, columns: [intent_id, endpoint_id, channel, rendering_revision DESC]}
      - {name: communication_rendering_review_idx, columns: [state, expires_at, id], where: "state IN ('DRAFT','AWAITING_APPROVAL')"}
      - {name: communication_rendering_one_live_idx, columns: [intent_id, endpoint_id, channel], unique: true, where: "state IN ('DRAFT','AWAITING_APPROVAL','APPROVED')"}
    privileges:
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: ["SELECT(id, intent_id, rendering_revision, endpoint_id, endpoint_version, channel, locale, template_id, template_revision, variable_set_digest, attachment_manifest_digest, disclosure_class, semantic_payload_digest, recipient_binding_digest, rendered_sha256, rendered_byte_length, transport_content_type, state, state_version, rendering_digest, approval_kind, approval_proposal_id, approval_proposal_version, approval_digest, policy_decision_digest, approval_receipt_digest, transition_receipt_digest, approval_expires_at, expires_at, created_at, approved_at, superseded_at)"]
      gurine_auditor: ["SELECT(id, intent_id, rendering_revision, endpoint_id, endpoint_version, channel, locale, template_id, template_revision, variable_set_digest, attachment_manifest_digest, disclosure_class, semantic_payload_digest, recipient_binding_digest, rendered_sha256, rendered_byte_length, transport_content_type, state, state_version, rendering_digest, approval_kind, approval_proposal_id, approval_proposal_version, approval_digest, policy_decision_digest, approval_receipt_digest, transition_receipt_digest, approval_expires_at, expires_at, created_at, approved_at, superseded_at)"]
      mutation_functions:
        - {name: ops.create_communication_rendering, execute: [gurine_notification_worker], security_definer: true}
        - {name: ops.transition_communication_rendering, execute: [gurine_notification_worker, gurine_control_api], security_definer: true}
    rls: {enabled: false, reason: internal encrypted content with explicit column grants; only gateway/control can read ciphertext}
    mutability:
      mode: CONTENT_IMMUTABLE_STATE_MACHINE
      immutable_columns: [id, intent_id, rendering_revision, endpoint_id, endpoint_version, endpoint_snapshot_digest, channel, locale, template_id, template_revision, variable_set, variable_set_digest, attachment_manifest, attachment_manifest_digest, disclosure_class, semantic_payload_digest, recipient_binding_digest, rendered_envelope_ciphertext, encryption_key_id, rendered_sha256, rendered_byte_length, transport_content_type, rendering_digest, expires_at, created_at]
      update_rule: state_version increments exactly once on a declared edge; semantic/content change inserts the next rendering_revision and supersedes the old row. APPROVED, REJECTED, CHANGES_REQUIRED, EXPIRED and SUPERSEDED are terminal.
    retention:
      record_class: COMMUNICATION_CONTENT
      schedule_binding: retention_defaults.schedule_binding
      trigger: source object retention trigger
      terminal_action: CRYPTO_ERASE_CONTENT_PRESERVE_DIGEST
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [intent_id, endpoint_id, id]
      disclosure: rendered ciphertext is never copied into event, audit, receipt, trace, metric or URL fields.
    repository:
      roundtrip: ciphertext bytes, rendered byte length and digest are exact; decrypted content must hash to rendered_sha256 before use
      revision_order: [rendering_revision, id]
      current_order: [rendering_revision DESC, id DESC]

