provider_adapter_registry:
  cardinality: exactly 8; channel and adapter_id are a bijection and neither field may be independently extended
  adapters:
    - channel: SMTP_EMAIL
      adapter_id: smtp-email-v1
      callback_operations: [acceptSmtpDsn]
      callback_authentication: GURINE_MTA_ASSERTION
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [SIGNED_PROVIDER_CALLBACK]
      read_proof: forbidden
    - channel: TELEGRAM_BOT_API
      adapter_id: telegram-bot-api-v1
      callback_operations: [receiveTelegramWebhook]
      callback_authentication: TELEGRAM_SECRET_TOKEN
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: []
      read_proof: forbidden
    - channel: META_WHATSAPP_BUSINESS_CLOUD
      adapter_id: meta-whatsapp-business-cloud-v1
      callback_operations: [verifyWhatsAppWebhook, receiveWhatsAppWebhook]
      callback_authentication: META_HMAC_SHA256
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [SIGNED_PROVIDER_CALLBACK]
      read_proof: SIGNED_PROVIDER_CALLBACK
    - channel: LINE_MESSAGING_API
      adapter_id: line-messaging-api-v1
      callback_operations: [receiveLineWebhook]
      callback_authentication: LINE_HMAC_SHA256
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: []
      read_proof: forbidden
    - channel: SOLAPI_SMS
      adapter_id: solapi-sms-v1
      callback_operations: [receiveSolapiSmsCallback]
      callback_authentication: SOLAPI_SIGNATURE
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [SIGNED_PROVIDER_CALLBACK]
      read_proof: forbidden
    - channel: SOLAPI_KAKAO_BIZMESSAGE
      adapter_id: solapi-kakao-bizmessage-v1
      callback_operations: [receiveSolapiKakaoCallback]
      callback_authentication: SOLAPI_SIGNATURE
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [SIGNED_PROVIDER_CALLBACK]
      read_proof: forbidden
    - channel: TWILIO_VOICE
      adapter_id: twilio-voice-v1
      callback_operations: [receiveTwilioVoiceCallback]
      callback_authentication: TWILIO_SIGNATURE
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [SIGNED_PROVIDER_CALLBACK]
      read_proof: forbidden
    - channel: SIGNED_WEBHOOK
      adapter_id: signed-webhook-v1
      callback_operations: []
      callback_authentication: NONE_SYNCHRONOUS_RESPONSE_ONLY
      synchronous_acceptance_maximum: PROVIDER_ACCEPTED
      verified_delivery_sources: [OFFICIAL_CHANNEL_RECEIPT, AUTHENTICATED_PROVIDER_POLL]
      read_proof: forbidden
  private_operation_set:
    commands: [acceptSmtpDsn, receiveTelegramWebhook, receiveWhatsAppWebhook, receiveLineWebhook, receiveSolapiSmsCallback, receiveSolapiKakaoCallback, receiveTwilioVoiceCallback]
    queries: [verifyWhatsAppWebhook]
    invariant: The private gateway operation set remains exactly eight. SIGNED_WEBHOOK is an outbound adapter whose optional synchronous signed acknowledgement is verified inside the dispatch observation path; it does not invent a ninth callback route.
  signed_webhook_response:
    unsigned_or_unbound_2xx: PROVIDER_ACCEPTED only
    delivered_proof: A signed acknowledgement must bind provider config ID/version/digest, delivery key digest, provider idempotency key digest, canonical request SHA-256, rendered SHA-256, receiver request identity HMAC, status and observed time. Only status CONSUMED may assert DELIVERED.
    ambiguous: timeout, connection loss after any request byte, invalid or unparseable acknowledgement, signature failure, stale acknowledgement, or post-response database failure is RECONCILIATION_REQUIRED with zero automatic retry or fallback
  set_equality_oracle: Extract channel and adapter_id pairs from this registry and require exact set equality with owner provider_contracts.fixed_adapters, provider config CHECK pairs, Rust adapter enum/registry, configuration catalog, production topology, preflight fixtures and generated operator API. A missing, extra, duplicate or cross-paired value is a release failure.

supporting_functions:
  - name: ops.is_lower_sha256
    signature: ops.is_lower_sha256(text) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: value matches exactly sixty-four lowercase hexadecimal characters
  - name: ops.idempotency_safe_header_bytes_is_valid
    signature: ops.idempotency_safe_header_bytes_is_valid(bytea,text) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: decode canonical length-prefixed lowercase header names and values, reject duplicates/CR/LF, require content-type equality and allow only content-type, cache-control, etag and idempotency-replayed; cookie, authorization, location and submission-session headers are forbidden
  - name: ops.idempotency_stored_response_is_valid
    signature: ops.idempotency_stored_response_is_valid(text,text,bytea,char(64),jsonb) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: for an exact SUBMISSION_DERIVED scope validate the allowlisted additionalProperties=false response schema, recursively reject token/cookie/verifier fields, require UTF-8 RFC8785 bytes, SHA-256 equality and exact parsed response_body compatibility mirror; unregistered scope/schema pairs return false
  - name: ops.enforce_idempotency_boundary_transition
    kind: trigger
    security_definer: true
    fixed_search_path: pg_catalog,ops
    semantics: After legacy classification and before runtime admission, reject every insert/update except a complete BOUND_V1 active-claim insert, one generation-fenced expired-active reclaim, one generation-fenced active-to-RESPONSE_FINAL all-or-none finalize, or one legal-hold-aware RESPONSE_FINAL-to-RETAINED_FINAL_TOMBSTONE retention edge. Claim bindings cannot be partially populated; finalized bytes cannot be rewritten; legacy formats and tombstones are immutable.
    installation: Install only after the pre-cutover snapshot has been exhaustively classified; REVOKE EXECUTE from PUBLIC and every runtime role because callers reach it only as a table trigger.
  - name: ops.communication_topic_scope_digest
    signature: ops.communication_topic_scope_digest(jsonb) RETURNS char(64)
    volatility: IMMUTABLE
    strict: true
    semantics: validate the closed CommunicationTopicScopeV1 shape, encode its declared field order canonically, and return lowercase SHA-256
  - name: ops.uuid_array_is_unique
    signature: ops.uuid_array_is_unique(uuid[]) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: cardinality(value) equals count of distinct unnest(value) and no element is null
  - name: ops.smallint_array_is_unique
    signature: ops.smallint_array_is_unique(smallint[]) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: cardinality(value) equals count of distinct unnest(value) and no element is null
  - name: ops.date_array_is_sorted_unique
    signature: ops.date_array_is_sorted_unique(date[]) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: no nulls, no duplicates and the stored ordinal order is strictly ascending
  - name: intake.communication_channel_array_is_unique
    signature: intake.communication_channel_array_is_unique(text[]) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: no nulls and no duplicate channel
  - name: intake.communication_channel_array_is_closed
    signature: intake.communication_channel_array_is_closed(text[]) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: every item is one exact closed_types.ops.communication_channel value
  - name: ops.communication_callback_auth_evidence_is_valid
    signature: ops.communication_callback_auth_evidence_is_valid(jsonb,text,char(64)) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: validate additionalProperties=false CommunicationCallbackAuthenticationEvidenceV1, require its discriminator to equal authentication_method, require RFC8785 digest equality and enforce only that adapter's request-bound assertion/signature/token input, immutable key version, timestamp/freshness and replay identity fields; no universal timestamp, nonce or mTLS field is synthesized
  - name: ops.communication_callback_items_are_valid
    signature: ops.communication_callback_items_are_valid(jsonb,integer,char(64)) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: validate additionalProperties=false CommunicationCallbackNormalizedItemSetV1, require RFC8785 set digest equality, cardinality=item_count, the operation-specific min/max cardinality, zero-based contiguous unique ordinals, purpose-HMACed unique provider event identities, exact per-item digest and the closed delivery/opt-out/interaction variant fields
  - name: ops.communication_safe_retry_proof_is_valid
    signature: ops.communication_safe_retry_proof_is_valid(jsonb,text,char(64)) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: validate additionalProperties=false CommunicationSafeRetryProofV1, require its discriminator to equal safe_retry_kind and its RFC8785 lowercase SHA-256 to equal safe_retry_proof_digest; every variant carries the exact same-delivery provider key/request digest and only the named pre-egress receipt, authenticated lookup receipt or activated idempotent-provider capability binding
  - name: ops.communication_provider_revision_snapshot_is_valid
    signature: ops.communication_provider_revision_snapshot_is_valid(jsonb,char(64)) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: validate additionalProperties=false CommunicationProviderRevisionSnapshotV1, forbid secret values, require every config-head identity/policy/capability/opaque-secret-reference field and require its RFC8785 lowercase SHA-256 to equal configuration_digest
  - name: ops.secret_reference_is_version_pinned
    signature: ops.secret_reference_is_version_pinned(text) RETURNS boolean
    volatility: IMMUTABLE
    strict: true
    semantics: accept only configured secret-resolver identifiers carrying an immutable provider-native version; reject plaintext-looking material, query/fragment credentials and mutable aliases such as latest/current
  - name: ops.delivery_proof_rank
    signature: ops.delivery_proof_rank(text) RETURNS smallint
    volatility: IMMUTABLE
    strict: true
    mapping: {NONE: 0, PROVIDER_ACCEPTED: 10, DELIVERED: 20, READ: 30}
    unknown: raise check violation; never default to zero
  - name: ops.enforce_communication_endpoint_lifecycle
    kind: trigger
    fixed_search_path: pg_catalog,intake,ops,pg_temp
    semantics: immutable identity, declared state edge, expected version+1 and matching link-event/profile-version transaction
  - name: ops.enforce_communication_intent_lifecycle
    kind: trigger
    fixed_search_path: pg_catalog,ops,pg_temp
    semantics: CREATED to exactly one terminal state, immutable natural identity, expected version+1 and receipt digest
  - name: ops.enforce_communication_rendering_lifecycle
    kind: trigger
    fixed_search_path: pg_catalog,ops,pg_temp
    semantics: content immutable, declared state edge, expected state_version+1 and exact POLICY xor HUMAN approval binding
  - name: ops.enforce_outbound_delivery_lifecycle
    kind: trigger
    fixed_search_path: pg_catalog,intake,ops,pg_temp
    semantics: declared state edge, monotonic proof/event/receipt/fence/generation, immutable delivery identity, no legacy dispatch
  - name: ops.enforce_communication_provider_config_lifecycle
    kind: trigger
    fixed_search_path: pg_catalog,ops,pg_temp
    semantics: expected version+1; any config digest change clears activation/preflight and cannot remain ACTIVE; ACTIVE requires latest_preflight_receipt_id to resolve a nonexpired PASS row whose provider_config_id, provider_config_version, configuration_digest and immutable revision snapshot exactly equal the resulting head
  - name: ops.reject_mutation
    existing: true
    use_for: every APPEND_ONLY or IMMUTABLE 0027 relation
supporting_function_privilege_rule: PUBLIC execute revoked; exact runtime EXECUTE grants appear only on named boundary procedures.

digest_aliases:
  intentDigest: ops.communication_intents.logical_intent_digest
  logicalIntentDigest: ops.communication_intents.logical_intent_digest
  exactRenderedBytesDigest: ops.communication_renderings.rendered_sha256
  renderedSha256: ops.communication_renderings.rendered_sha256
  renderingDigest: SHA-256 of canonical CommunicationRenderingBindingV1 containing template, variables, locale, endpoint/version, attachments, disclosure and renderedSha256
  deliveryKey: purpose-context HMAC stored as ops.outbound_deliveries.delivery_key with an explicit HMAC key ID; raw normalized destination or provider key is never the delivery key
  endpointIdentityHash: purpose-context HMAC, never an unsalted SHA-256 of email, phone, chat or provider user ID

closed_json_contracts:
  PendingCommunicationAuthorizationBindingV1:
    additional_properties: false
    required: [contractVersion, subjectId, subjectOriginBindingDigest, endpointId, endpointVersion, endpointSnapshotDigest, channel, authorizationKind, purpose, topicScope, topicScopeDigest, policyVersion, sourceKind, sourceId, sourceVersion, sourceDecisionDigest, proofReceiptDigest, grantedAt, expiresAt]
    constants: {contractVersion: pending-communication-authorization-v1}
    nullable: [expiresAt]
    closed_values:
      authorizationKind: [ENDPOINT_LINKING_CONSENT, SUBSCRIPTION_CONSENT]
      channel: [SMTP_EMAIL, TELEGRAM_BOT_API, META_WHATSAPP_BUSINESS_CLOUD, LINE_MESSAGING_API, SOLAPI_SMS, SOLAPI_KAKAO_BIZMESSAGE, TWILIO_VOICE, SIGNED_WEBHOOK]
      sourceKind: [ENDPOINT_LINK_REQUEST, SUBSCRIPTION_CREATE, SUBSCRIPTION_MANAGEMENT]
    pair_rules:
      - ENDPOINT_LINKING_CONSENT requires purpose ENDPOINT_VERIFICATION, sourceKind ENDPOINT_LINK_REQUEST and an expiry no later than the verification challenge.
      - SUBSCRIPTION_CONSENT requires purpose SUBSCRIPTION_UPDATE and sourceKind SUBSCRIPTION_CREATE or SUBSCRIPTION_MANAGEMENT.
    binding_rule: subject, origin, endpoint revision, channel, topic digest, source revision/decision and proof receipt must equal the enclosing verification and source rows; endpoint possession alone never widens this binding.
  CommunicationTopicScopeV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      PURPOSE_WIDE:
        additional_properties: false
        required: [kind, purpose]
        constants: {kind: PURPOSE_WIDE}
        allowed_purposes: [ENDPOINT_VERIFICATION, RESPONSE_RECEIPT, CORRECTION_STATUS, CORRECTION_RETRACTION_NOTICE, PRIVACY_TRANSACTIONAL_NOTICE, SECURITY_TRANSACTIONAL_NOTICE, INCIDENT_RECOVERY]
      SUBSCRIPTION:
        additional_properties: false
        required: [kind, subscriptionId, subscriptionVersion]
        constants: {kind: SUBSCRIPTION}
      PUBLICATION_REVISION:
        additional_properties: false
        required: [kind, caseId, publicationRevisionId, publicationRevision, publicationDigest]
        constants: {kind: PUBLICATION_REVISION}
      RESPONSE_REQUEST:
        additional_properties: false
        required: [kind, responseRequestId, responseRequestVersion, requestBindingDigest]
        constants: {kind: RESPONSE_REQUEST}
      CORRECTION_REQUEST:
        additional_properties: false
        required: [kind, correctionRequestId, correctionRequestVersion, correctionRequestDigest]
        constants: {kind: CORRECTION_REQUEST}
      PRIVACY_REQUEST:
        additional_properties: false
        required: [kind, privacyRequestId, privacyRequestVersion, privacyRequestDigest]
        constants: {kind: PRIVACY_REQUEST}
      INCIDENT:
        additional_properties: false
        required: [kind, incidentId, incidentVersion, incidentDigest]
        constants: {kind: INCIDENT}
      ACTION_PROPOSAL:
        additional_properties: false
        required: [kind, proposalId, proposalVersion, proposalDigest]
        constants: {kind: ACTION_PROPOSAL}
    rule: PURPOSE_WIDE is an explicit reviewed scope and is forbidden for RIGHT_OF_REPLY_REQUEST, RIGHT_OF_REPLY_REMINDER, SUBSCRIPTION_UPDATE, PRODUCT_MARKETING, INTERNAL_ACTION_REQUEST and DISCRETIONARY_OUTREACH. No missing or unknown scope is normalized to PURPOSE_WIDE.
  JurisdictionSetV1:
    additional_properties: false
    required: [contractVersion, jurisdictions, dataResidencyRegions, crossBorderTransferMode, legalBasisPolicyVersion, reviewedAt, reviewExpiresAt]
    constants: {contractVersion: communication-jurisdiction-set-v1}
    fields:
      jurisdictions: 'sorted-unique-array<string-pattern<^[A-Z]{2}(?:-[A-Z0-9]{1,3})?$>>[1..250]'
      dataResidencyRegions: 'sorted-unique-array<string[2..64]>[1..32]'
      crossBorderTransferMode: 'enum<FORBIDDEN|APPROVED_DESTINATIONS_ONLY>'
      legalBasisPolicyVersion: 'string[1..100]'
      reviewedAt: datetime
      reviewExpiresAt: datetime
    rule: reviewExpiresAt is later than reviewedAt; production routing requires the endpoint jurisdiction and actual processing region to be members and requires a current DPA evidence digest stored beside this value.
  CommunicationRateLimitPolicyV1:
    additional_properties: false
    required: [contractVersion, rules, maximumInFlight, retryAfterMode, policyVersion]
    constants: {contractVersion: communication-rate-limit-policy-v1}
    rules:
      kind: array
      minimum: 5
      maximum: 32
      item:
        additional_properties: false
        required: [ruleId, dimension, windowSeconds, maximumRequests, burst]
        closed_values:
          dimension: [PROVIDER, CHANNEL, DEPLOYMENT, ENDPOINT, PURPOSE]
    invariants:
      - Exactly one rule for each mandatory dimension PROVIDER, CHANNEL, DEPLOYMENT, ENDPOINT and PURPOSE is present; additional rules may only narrow a compound dimension declared by the provider capability schema.
      - ruleId and dimension are unique, windowSeconds is 1..86400, maximumRequests is positive and burst is 0..maximumRequests.
      - Provider Retry-After may delay but never increase a configured limit; rate-limit delay never consumes a delivery attempt or bypasses expiry, quiet hours, consent, budget or cancellation.
  CommunicationCostPolicyV1:
    additional_properties: false
    required: [contractVersion, currency, chargeUnit, maximumUnitCount, worstCaseAmount, perMessageCeiling, unknownCostMode, settlementMode, policyVersion]
    constants: {contractVersion: communication-cost-policy-v1}
    closed_values:
      chargeUnit: [MESSAGE, SEGMENT, CONVERSATION, SECOND, REQUEST]
      unknownCostMode: [BLOCK]
      settlementMode: [PROVIDER_RECEIPT_THEN_RECONCILE, PROVIDER_INVOICE_RECONCILE]
    rules:
      - currency is exactly three uppercase ISO-4217 letters; all amounts are nonnegative fixed numeric(24,6).
      - worstCaseAmount is the amount reserved before dispatch and is no greater than perMessageCeiling; maximumUnitCount is positive and bounds variable-unit channels such as SMS segments and voice seconds.
      - Missing, stale or unparseable provider cost is never synthesized as zero and blocks a new attempt once the reservation cannot be proven.
  CommunicationProviderCapabilitiesV1:
    additional_properties: false
    required: [contractVersion, adapterId, channel, providerIdempotencyMode, reconciliationModes, callbackOperationIds, synchronousAcceptanceMaximum, highestDeliveryProof, supportsReadProof, supportsOptOut, supportsFallback, supportsAttachments, supportsTemplates, maximumOutboundBytes, maximumCallbackBytes, maximumCallbackItems, capabilityRevision]
    constants: {contractVersion: communication-provider-capabilities-v1}
    closed_values:
      providerIdempotencyMode: [NATIVE_IDEMPOTENCY, LOOKUP_BEFORE_RETRY, NONE]
      reconciliationModes: [SIGNED_CALLBACK, AUTHENTICATED_POLL, PROVIDER_LOOKUP, SIGNED_SYNCHRONOUS_ACK, NONE]
      synchronousAcceptanceMaximum: [PROVIDER_ACCEPTED]
      highestDeliveryProof: [PROVIDER_ACCEPTED, DELIVERED, READ]
    adapter_rule: adapterId/channel/callbackOperationIds are exact-set equal to provider_adapter_registry. A capability may lower but never raise that registry's proof ceiling; READ requires the registry's authenticated read source.
    safety_rule: providerIdempotencyMode NONE together with reconciliationModes [NONE] cannot activate for DUPLICATION_SENSITIVE communication. supportsFallback means only that a later separate delivery may be constructed after definite failure; it never permits fallback during ambiguity.
  CommunicationProviderPreflightChecklistV1:
    additional_properties: false
    required: [contractVersion, adapterId, channel, fixtureManifestSha256, checks]
    constants: {contractVersion: communication-provider-preflight-checklist-v1}
    checks:
      kind: array
      minimum: 17
      maximum: 32
      item:
        additional_properties: false
        required: [checkId, result, evidenceDigest, observedAt]
        closed_values:
          result: [PASS, FAIL, NOT_APPLICABLE]
    required_check_ids: [CONCRETE_ADAPTER, VERSION_PINNED_SECRET_RESOLUTION, SENDER_IDENTITY, JURISDICTION, DPA, TEMPLATE_CATALOG, RATE_LIMIT, COST_LIMIT, KILL_SWITCH, LIVE_SANDBOX_SEND, PROVIDER_ACCEPTANCE_DISTINCT, DELIVERY_PROOF, IDEMPOTENCY, AMBIGUOUS_RECONCILIATION, CALLBACK_OR_POLL, CALLBACK_GOLDEN_FIXTURES, REDACTION]
    rule: checkId is unique and the required set is present exactly once. NOT_APPLICABLE is allowed only where provider_adapter_registry declares no such capability and cannot satisfy callback/poll, delivery-proof, idempotency, reconciliation or redaction activation requirements.
  CommunicationProviderPreflightBlockerSetV1:
    kind: array
    minimum: 0
    maximum: 100
    item:
      additional_properties: false
      required: [ordinal, blockerCode, severity, checkId, safeSummary, evidenceDigest]
      closed_values:
        severity: [P0, P1, P2]
    rules: [ordinal is zero-based contiguous, blockerCode is unique, safeSummary contains no endpoint/provider identity/secret, order is severity then blockerCode]
  CommunicationTemplateVariablesV1:
    additional_properties: false
    required: [contractVersion, templateId, templateRevision, variableSchemaId, variableSchemaSha256, values]
    constants: {contractVersion: communication-template-variables-v1}
    values:
      kind: array
      minimum: 0
      maximum: 100
      item:
        additional_properties: false
        required: [ordinal, name, kind, value]
        closed_values:
          kind: [PLAIN_TEXT, SAFE_URL, ABSOLUTE_TIME, DATE, INTEGER, DECIMAL, BOOLEAN, OPAQUE_REFERENCE]
    rules:
      - ordinal is zero-based contiguous and name is unique.
      - The exact immutable approved-template schema identified by variableSchemaId and variableSchemaSha256 supplies the allowed name, kind, cardinality, length and disclosure class. The stored set must be set-equal; unregistered names and coercion are rejected.
      - SAFE_URL is exact-origin/path allowlisted; no secret, raw endpoint, access token or protected evidence body is a variable. Response access links use the separately encrypted stable access-artifact binding and are never emitted into audit, event or receipt JSON.
  CommunicationAttachmentManifestV1:
    additional_properties: false
    required: [contractVersion, attachments]
    constants: {contractVersion: communication-attachment-manifest-v1}
    attachments:
      kind: array
      minimum: 0
      maximum: 20
      item:
        additional_properties: false
        required: [ordinal, assetId, assetRevision, assetSha256, mediaType, byteLength, filenameHmac, disclosureClass, rightsDecisionId, rightsDecisionDigest, malwareScanReceiptDigest]
    rules:
      - ordinal is zero-based contiguous and the tuple assetId/assetRevision/assetSha256 is unique.
      - Every asset is immutable, clean-scanned, rights-approved, within adapter size/count capability and no more permissive than the rendering disclosure class. Filename plaintext and object-store key are forbidden.
  CommunicationRenderingBindingV1:
    additional_properties: false
    required: [contractVersion, intentId, renderingRevision, endpointId, endpointVersion, endpointSnapshotDigest, channel, locale, templateId, templateRevision, variableSetDigest, attachmentManifestDigest, disclosureClass, semanticPayloadDigest, recipientBindingDigest, renderedSha256, renderedByteLength, transportContentType, expiresAt]
    constants: {contractVersion: communication-rendering-binding-v1}
    rule: RFC8785 encoding of the exact fields in declared order is rendering_digest. The decrypted immutable envelope must be exactly renderedByteLength bytes and hash to renderedSha256; retry, fallback and adapter framing never alter this row. Any semantic change creates a new rendering revision and invalidates prior approval.
  CommunicationReconciliationEvidenceV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      PROVIDER_LOOKUP_NOT_FOUND:
        additional_properties: false
        required: [kind, lookupReceiptId, providerAccountId, lookupRequestSha256, lookupResponseSha256, observedAt]
        constants: {kind: PROVIDER_LOOKUP_NOT_FOUND}
      PROVIDER_SIGNED_RECEIPT:
        additional_properties: false
        required: [kind, callbackRequestId, itemOrdinal, providerEventIdentityHmac, providerEvidenceDigest, signatureVerificationReceiptId, observedAt]
        constants: {kind: PROVIDER_SIGNED_RECEIPT}
      AUTHENTICATED_PROVIDER_POLL:
        additional_properties: false
        required: [kind, pollReceiptId, providerStatus, providerEvidenceDigest, observedAt]
        constants: {kind: AUTHENTICATED_PROVIDER_POLL}
      OFFICIAL_CHANNEL_RECEIPT:
        additional_properties: false
        required: [kind, receiptId, providerEventIdentityHmac, providerEvidenceDigest, verificationReceiptDigest, observedAt]
        constants: {kind: OFFICIAL_CHANNEL_RECEIPT}
      OPERATOR_EVIDENCE:
        additional_properties: false
        required: [kind, evidenceReceiptIds, evidenceDigest, observedAt]
        constants: {kind: OPERATOR_EVIDENCE}
    redaction: Provider-native account, request, message and event identities are purpose-separated HMAC values only. Raw values and unsalted digests are forbidden in this JSON, responses, audit, outbox, logs, traces, metrics and URLs.
    resolution_rules:
      - OPERATOR_EVIDENCE cannot support DELIVERED, READ, definite NOT_TRANSMITTED or safe retry by itself.
      - DELIVERED requires PROVIDER_SIGNED_RECEIPT, AUTHENTICATED_PROVIDER_POLL or OFFICIAL_CHANNEL_RECEIPT plus the exact activated adapter capability.
      - PROVIDER_LOOKUP_NOT_FOUND supports retry only when the lookup is authoritative for the same provider account, delivery key and stable provider idempotency key and is accompanied by CommunicationSafeRetryProofV1.
  CommunicationSafeRetryProofV1:
    kind: discriminated_union
    discriminator: kind
    variants:
      NO_PROVIDER_ATTEMPT:
        additional_properties: false
        required: [kind, preEgressReceiptId, preEgressReceiptSequence, preEgressReceiptDigest, providerIdempotencyKeySha256, requestSha256]
        constants: {kind: NO_PROVIDER_ATTEMPT}
      PROVIDER_LOOKUP_NOT_FOUND:
        additional_properties: false
        required: [kind, lookupReceiptId, lookupReceiptDigest, lookupRequestSha256, lookupResponseSha256, providerIdempotencyKeySha256, requestSha256, observedAt]
        constants: {kind: PROVIDER_LOOKUP_NOT_FOUND}
      PROVIDER_IDEMPOTENT_REPLAY_SAFE:
        additional_properties: false
        required: [kind, providerPreflightReceiptId, providerConfigId, providerConfigVersion, providerConfigurationDigest, providerPreflightReceiptDigest, lookupReceiptId, lookupReceiptDigest, providerIdempotencyKeySha256, requestSha256, observedAt]
        constants: {kind: PROVIDER_IDEMPOTENT_REPLAY_SAFE}
    rules:
      - Every UUID, version and digest is copied from the exact locked relation or immutable authenticated lookup receipt; the caller cannot submit a digest-only proof.
      - NO_PROVIDER_ATTEMPT requires an applied PRE_DISPATCH_FENCE receipt for this delivery and no committed provider request evidence.
      - PROVIDER_LOOKUP_NOT_FOUND requires an authenticated lookup over the same provider account, delivery key, provider idempotency key and request digest and a definitive not-found response.
      - PROVIDER_IDEMPOTENT_REPLAY_SAFE additionally requires the exact currently activated preflight receipt to declare idempotent replay for the same key and request bytes; capability name alone is insufficient.
  SignedWebhookAcknowledgementV1:
    additional_properties: false
    required: [contractVersion, providerConfigId, providerConfigVersion, providerConfigurationDigest, deliveryKeyDigest, providerIdempotencyKeySha256, requestSha256, renderedSha256, receiverRequestIdentityHmac, status, observedAt, nonceHmac, signatureKeyVersion, signedInputSha256]
    constants: {contractVersion: signed-webhook-acknowledgement-v1}
    closed_values:
      status: [ACKNOWLEDGED, CONSUMED, REJECTED]
    rules:
      - ACKNOWLEDGED proves at most PROVIDER_ACCEPTED, CONSUMED may prove DELIVERED, and REJECTED proves only the provider's definite rejection.
      - Signature verification covers the exact canonical response bytes and every required binding under the active immutable receiver key version. Raw nonce/request/provider identity and signature bytes are absent from the normalized value and all outward evidence.
  CommunicationProviderRevisionSnapshotV1:
    additional_properties: false
    required: [contractVersion, integrationId, providerConfigId, providerConfigVersion, deploymentId, environment, channel, adapterId, providerAccountHmac, senderIdentityHmac, credentialSecretReference, webhookSecretReference, callbackPath, callbackAllowlistDigest, jurisdictionSetDigest, dpaEvidenceDigest, approvedTemplateCatalogDigest, rateLimitPolicyDigest, costPolicyDigest, providerCapabilitiesDigest, killSwitchCode, configurationDigest]
    constants: {contractVersion: communication-provider-revision-v1}
    nullable: [webhookSecretReference, callbackPath, callbackAllowlistDigest]
    secret_reference_rule: credentialSecretReference and webhookSecretReference are immutable version-qualified resolver identifiers, never mutable latest aliases and never credential/secret bytes; snapshots, logs and receipts reject values matching secret material.
    callback_rule: SIGNED_WEBHOOK has all three callback fields null because its signed acknowledgement is synchronous. Every other adapter requires webhookSecretReference, the exact registry callback path and callbackAllowlistDigest; SMTP uses the version-pinned X-Gurine-Mta-Assertion verification key reference.
  CommunicationCallbackAuthenticationEvidenceV1:
    additional_properties: false
    discriminator: method
    variants:
      GURINE_MTA_ASSERTION: [method, assertionIssuer, assertionKeyVersion, assertionJtiHmac, issuedAt, expiresAt, signedMethodSha256, signedTargetSha256, signedContentTypeSha256, signedBodySha256, signedInputSha256]
      TELEGRAM_SECRET_TOKEN: [method, secretTokenKeyVersion, secretTokenComparisonDigest, signedInputSha256]
      META_HMAC_SHA256: [method, appSecretKeyVersion, xHubSignature256Digest, signedBodySha256, signedInputSha256]
      LINE_HMAC_SHA256: [method, channelSecretKeyVersion, xLineSignatureDigest, signedBodySha256, signedInputSha256]
      SOLAPI_SIGNATURE: [method, apiSecretKeyVersion, signedDate, saltHash, signatureDigest, signedInputSha256, freshnessPolicyVersion]
      TWILIO_SIGNATURE: [method, authTokenKeyVersion, xTwilioSignatureDigest, externalUrlDigest, parameterCanonicalizationRevision, signedInputSha256]
    variant_rule: only the selected variant's exact fields are present; lowercase SHA-256/HMAC fields are checked and provider-supplied timestamp/nonce optionality is never normalized into another variant.
    smtp_assertion_rule: X-Gurine-Mta-Assertion is verified against the immutable issuer/key revision and binds exact POST method, percent-encoded target, multipart/report; report-type=delivery-status media type and raw body SHA-256. expiresAt is after issuedAt and no later than issuedAt plus 300 seconds; assertionJtiHmac is the replay identity. TLS client authentication may be defense in depth but is not the canonical callback credential or persisted evidence discriminator.
  CommunicationCallbackNormalizedItemSetV1:
    additional_properties: false
    required: [contractVersion, items]
    constants: {contractVersion: communication-callback-items-v1}
    items:
      kind: array
      minimum: 0
      maximum: 1000
      discriminator: effectKind
      variants:
        DELIVERY_OBSERVATION:
          additional_properties: false
          required: [ordinal, effectKind, providerEventIdentityHmac, evidenceKind, assertedState, evidenceRank, normalizedEvidence, normalizedEvidenceDigest, processingDisposition, itemDigest]
          optional: [providerMessageIdentityHmac, deliveryKeySha256, providerSequence, providerOccurredAt, matchedDeliveryId, matchedAttemptId]
          closed_values:
            effectKind: [DELIVERY_OBSERVATION]
            assertedState: [PROVIDER_ACCEPTED, DELIVERED, READ, FAILED_PERMANENT]
            processingDisposition: [APPLIED, STALE_STORED, UNMATCHED_RECONCILIATION_REQUIRED]
        OPT_OUT_REQUEST:
          additional_properties: false
          required: [ordinal, effectKind, providerEventIdentityHmac, endpointIdentityHmac, purpose, topicScopeDigest, mechanism, normalizedEvidence, normalizedEvidenceDigest, processingDisposition, itemDigest]
          optional: [providerSequence, providerOccurredAt, matchedSubjectId, matchedEndpointId]
          closed_values:
            effectKind: [OPT_OUT_REQUEST]
            mechanism: [SMS_STOP, CHAT_SIGNED_COMMAND, CHAT_SIGNED_BUTTON, VOICE_EXPLICIT]
            processingDisposition: [APPLIED, STALE_STORED, UNMATCHED_RECONCILIATION_REQUIRED]
        ENDPOINT_INTERACTION:
          additional_properties: false
          required: [ordinal, effectKind, providerEventIdentityHmac, endpointIdentityHmac, interactionKind, interactionBindingDigest, normalizedEvidence, normalizedEvidenceDigest, processingDisposition, itemDigest]
          optional: [providerSequence, providerOccurredAt, matchedSubjectId, matchedEndpointId]
          closed_values:
            effectKind: [ENDPOINT_INTERACTION]
            interactionKind: [ENDPOINT_VERIFICATION_BINDING, NONAUTHORITATIVE_ACTION_REQUEST]
            processingDisposition: [APPLIED, STALE_STORED, UNMATCHED_RECONCILIATION_REQUIRED]
      rules:
        - ordinal is zero-based contiguous and providerEventIdentityHmac is unique across all variants; raw provider identities and unsalted hashes are forbidden.
        - normalizedEvidence is the exact adapter/effect-specific additionalProperties=false variant and normalizedEvidenceDigest plus itemDigest bind every field.
        - A DELIVERY_OBSERVATION may create zero or one outbound delivery receipt. An OPT_OUT_REQUEST may atomically create zero or one authorization-revocation event, suppression and opt-out receipt. ENDPOINT_INTERACTION never performs an approval or authoritative action; it creates only a verified endpoint binding or a nonauthoritative action request.
        - STALE_STORED never regresses delivery, reopens authorization or reverses opt-out. UNMATCHED_RECONCILIATION_REQUIRED stores redacted evidence and opens bounded reconciliation without guessing identity.
    adapter_cardinality:
      acceptSmtpDsn: {minimum: 1, maximum: 1}
      receiveTelegramWebhook: {minimum: 1, maximum: 1}
      receiveWhatsAppWebhook: {minimum: 1, maximum: 1000}
      receiveLineWebhook: {minimum: 1, maximum: 1000}
      receiveSolapiSmsCallback: {minimum: 1, maximum: 1}
      receiveSolapiKakaoCallback: {minimum: 1, maximum: 1}
      receiveTwilioVoiceCallback: {minimum: 1, maximum: 1}
  CommunicationCallbackAcknowledgementHeadersV1:
    additional_properties: false
    allowed_lowercase_names: [content-type, cache-control]
    forbidden_names: [set-cookie, authorization, location, x-gurine-submission-session]
    rule: values are CR/LF-free bounded ASCII and content-type equals acknowledgement_content_type

idempotency_response_non_leak_contract:
  classifications:
    session_token_hash: SECRET_VERIFIER
    key_hash: SECRET_VERIFIER
    request_hash: CONFIDENTIAL_BINDING
    response_header_bytes: CONFIDENTIAL_REPLAY_PAYLOAD
    response_body_bytes: CONFIDENTIAL_REPLAY_PAYLOAD
    response_body: CONFIDENTIAL_COMPATIBILITY_MIRROR
    storage_format: INTERNAL_LIFECYCLE
    terminal_disposition: INTERNAL_LIFECYCLE
    tombstone_digest: CONFIDENTIAL_BINDING
    receipt_and_audit_ids: INTERNAL_CORRELATION
  relation_projection:
    direct_runtime_table_or_column_acl: none
    views: no view, materialized view or foreign table may project any sensitive column
    logical_replication: ops.idempotency_keys and every sensitive column are absent from runtime/analytics publications; encrypted disaster-recovery WAL/backup is the only replication path
    generated_or_safe_query_types: must not contain scope, key_hash, request_hash, bff_issuer, session_token_hash, response_body or stored byte columns
  derived_session_response_schema:
    allowed_operation_schemas: [IssueCommunicationProfileSessionReceiptV1, IssueResponseAppealCreateSessionReceiptV1, RotateResponseAppealStatusSessionReceiptV1, ResponseAppealReceiptV1, CommunicationEndpointLinkRequestedReceiptV1, CommunicationEndpointVerifiedReceiptV1, CommunicationEndpointUnlinkedReceiptV1]
    recursively_forbidden_json_fields: [opaqueSessionToken, nextOpaqueSessionToken, sessionToken, tokenHash, sessionTokenHash, idempotencyKey, idempotencyKeyHash, csrfToken, cookie, setCookie, authorization, endpointCiphertext, responseHeaderBytes, responseBodyBytes]
    header_encoding: canonical length-prefixed lowercase header-name/value bytes
    allowed_headers: [content-type, cache-control, etag, idempotency-replayed]
    forbidden_headers: [set-cookie, authorization, location, x-gurine-submission-session, x-gurine-next-submission-session]
    cookie_rule: The BFF already owns the fresh token and seals/rotates its browser cookie after the safe receipt; neither PostgreSQL response bytes nor replay output transports a token or Set-Cookie value.
  replay_projection:
    only_function: ops.replay_idempotency_response_v1
    exact_binding_required: [session_user exact scope registry, scope, operation_id, key_hash, request_hash, bff_issuer when declared, session_token_hash when declared, claim_generation]
    output_allowlist: [disposition, response_status, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, completed_at]
    forbidden_output: [scope, operation_id, key_hash, request_hash, bff_issuer, session_token_hash, storage_format, terminal_disposition, tombstone_digest, response_body, resource_type, resource_id, audit_event_id, outbox_id]
  observability:
    sql_parameters: bind parameters only; values never interpolated into SQL or database error text
    logs_traces_metrics_audit_outbox: no verifier hash or response/header bytes; only operation ID, safe disposition, duration and opaque request ID
    pgaudit: object/function invocation metadata only for these functions; parameter logging disabled and verified
    error_shape: missing, wrong-role, wrong-scope, wrong-session and wrong-request replay do not disclose row existence, digest, resource ID or completion time
  retention: claim expiry permits only generation-fenced reclaim of an incomplete BOUND_V1 row. Finalized and tombstoned rows are never reclaimed; legal-hold-aware owner cleanup replaces retained final bytes with a terminal tombstone rather than deleting the key identity. No runtime DELETE grant exists and cleanup emits counts only.

global_rules:
  digests:
    sql_type: char(64)
    check: value ~ '^[0-9a-f]{64}$'
    canonicalization: declared typed value encoded by its schema and hashed as lowercase SHA-256; JSON textual order is never authority.
  timestamps: UTC timestamptz with microsecond application round-trip; database clock_timestamp() is used for authoritative receipt time.
  jsonb:
    rule: Every jsonb column names one closed Rust/JSON schema; serde_json::Value, unknown keys and string dispatch are forbidden.
    roundtrip: decode -> validate -> canonical encode -> digest compare -> domain constructor; failure is typed corruption and never a synthesized default.
  privileges:
    owner: gurine_migrator
    runtime_roles_never_own_objects: true
    public:
      tables: NONE
      sequences: NONE
      functions: NONE
    default_privileges:
      - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA intake REVOKE ALL ON TABLES FROM PUBLIC
      - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA editorial REVOKE ALL ON TABLES FROM PUBLIC
      - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON TABLES FROM PUBLIC
      - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA intake,editorial,ops REVOKE ALL ON SEQUENCES FROM PUBLIC
      - ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA intake,editorial,ops REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC
    rule: No ALL TABLES grant is introduced; each relation and every SECURITY DEFINER function is explicitly revoked then explicitly granted.
  mutation:
    append_only: BEFORE UPDATE OR DELETE uses ops.reject_mutation().
    optimistic: expected version is checked after SELECT FOR UPDATE; zero rows are separated into NOT_FOUND or VERSION_CONFLICT.
    command_atomicity: idempotency claim, domain mutation, audit, all declared outbox events and immutable command receipt commit or roll back together.
  legal_hold:
    rule: Retention, deletion, crypto-erasure, disclosure, export and model egress resolve active legal-hold coverage before effect; a hold grants no read access.
    scope_atoms: [RETENTION, DELETION, DISCLOSURE]
  repository:
    select_star: forbidden
    required_column_deletion_test: required for every row mapper
    cardinality: typed 0, 1 and more-than-1 outcomes; more-than-1 is corruption, not first-row-wins
    ordering: Every multi-row repository query has a complete deterministic order ending in a unique key.

tables:
  intake.communication_subjects:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationSubjectRow
      rust_domain: gurine_domain::communication::CommunicationSubject
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_kind: {type: text, nullable: false}
      subscription_id: {type: uuid, nullable: true}
      origin_object_type: {type: text, nullable: false}
      origin_object_id: {type: uuid, nullable: false}
      origin_object_version: {type: bigint, nullable: false}
      origin_binding_digest: {type: char(64), nullable: false}
      subject_pseudonym_hmac: {type: char(64), nullable: false}
      hmac_key_version: {type: text, nullable: false}
      jurisdiction: {type: text, nullable: false}
      locale: {type: text, nullable: false, default: "'ko-KR'"}
      status: {type: text, nullable: false, default: "'ACTIVE'"}
      profile_version: {type: bigint, nullable: false, default: 1}
      profile_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      updated_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      revoked_at: {type: timestamptz, nullable: true}
    primary_key: [id]
    foreign_keys:
      - {columns: [subscription_id], references: intake.subscriptions(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [id, origin_binding_digest], name: communication_subject_identity_binding_uq}
      - {columns: [subject_kind, origin_object_type, origin_object_id], name: communication_subject_origin_uq}
      - {columns: [subject_pseudonym_hmac, hmac_key_version, origin_binding_digest], name: communication_subject_pseudonym_scope_uq}
      - {columns: [subscription_id], name: communication_subject_subscription_uq, where: "subscription_id IS NOT NULL"}
    checks:
      - subject_kind IN ('ACCOUNTLESS_SUBSCRIBER','RESPONSE_PARTY','CORRECTION_REQUESTER','PRIVACY_REQUESTER','INTERNAL_USER','ORGANIZATION_CONTACT')
      - "subject_kind = 'ACCOUNTLESS_SUBSCRIBER' AND subscription_id IS NOT NULL AND origin_object_type = 'SUBSCRIPTION' AND origin_object_id = subscription_id OR subject_kind <> 'ACCOUNTLESS_SUBSCRIBER' AND subscription_id IS NULL"
      - origin_object_type IN ('SUBSCRIPTION','RESPONSE_REQUEST','CORRECTION_REQUEST','PRIVACY_REQUEST','INTERNAL_USER','ORGANIZATION_CONTACT')
      - origin_object_version > 0
      - status IN ('ACTIVE','REVOKED')
      - profile_version > 0
      - length(jurisdiction) BETWEEN 2 AND 64
      - length(locale) BETWEEN 2 AND 35
      - length(hmac_key_version) BETWEEN 1 AND 100
      - (status = 'ACTIVE' AND revoked_at IS NULL) OR (status = 'REVOKED' AND revoked_at IS NOT NULL)
      - ops.is_lower_sha256(origin_binding_digest) AND ops.is_lower_sha256(subject_pseudonym_hmac) AND ops.is_lower_sha256(profile_digest)
    indexes:
      - {name: communication_subject_origin_lookup_idx, columns: [origin_object_type, origin_object_id, profile_version]}
      - {name: communication_subject_active_idx, columns: [status, updated_at, id], where: "status = 'ACTIVE'"}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: []
      mutation_functions:
        - {name: intake.issue_communication_profile_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.resolve_communication_profile_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.request_communication_endpoint_link, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.verify_communication_endpoint_link, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.unlink_communication_endpoint, execute: [gurine_submission_api], security_definer: true}
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_subject_profile_scope, roles: [gurine_submission_api], using: "id::text = current_setting('gurine.communication_subject_id', true)", with_check: "id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_subject_control_read, roles: [gurine_control_api], using: "id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_subject_gateway_read, roles: [gurine_notification_worker], using: "id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: OPTIMISTIC_MUTABLE_PROFILE
      immutable_columns: [id, subject_kind, subscription_id, origin_object_type, origin_object_id, origin_object_version, origin_binding_digest, subject_pseudonym_hmac, hmac_key_version, jurisdiction, created_at]
      update_rule: profile_version increments by exactly one and profile_digest must equal the resulting endpoint/preference/authorization profile binding; terminal REVOKED never reopens.
    retention:
      record_class: COMMUNICATION_SUBJECT_IDENTITY
      schedule_binding: retention_defaults.schedule_binding
      trigger: origin purpose closure or explicit privacy decision
      rule: Response contact is retained at most one year after case closure while a documented purpose remains; subscription identity follows active authorization then the versioned schedule.
      terminal_action: CRYPTO_ERASE_PSEUDONYM_LINKAGE
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [origin_object_type, origin_object_id, id]
    repository:
      roundtrip: all columns exact; unknown subject kind/status is corruption
      detail_order: [id]
      profile_lock_order: [intake.submission_sessions, intake.communication_subjects]

  intake.communication_endpoints:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationEndpointRow
      rust_domain: gurine_domain::communication::CommunicationEndpoint
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_id: {type: uuid, nullable: false}
      channel: {type: text, nullable: false}
      endpoint_hmac: {type: char(64), nullable: false}
      hmac_key_version: {type: text, nullable: false}
      endpoint_ciphertext: {type: bytea, nullable: false}
      encryption_key_id: {type: text, nullable: false}
      destination_hint_ciphertext: {type: bytea, nullable: true}
      state: {type: text, nullable: false, default: "'PENDING_VERIFICATION'"}
      version: {type: bigint, nullable: false, default: 1}
      endpoint_digest: {type: char(64), nullable: false}
      verified_at: {type: timestamptz, nullable: true}
      bounced_at: {type: timestamptz, nullable: true}
      suppressed_at: {type: timestamptz, nullable: true}
      revoked_at: {type: timestamptz, nullable: true}
      last_provider_evidence_digest: {type: char(64), nullable: true}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      updated_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [subject_id], references: intake.communication_subjects(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [id, subject_id], name: communication_endpoint_subject_identity_uq}
      - {columns: [subject_id, channel, endpoint_hmac, hmac_key_version], name: communication_endpoint_subject_channel_uq}
      - {columns: [id, version, endpoint_digest], name: communication_endpoint_version_digest_uq}
      - {columns: [id, version, endpoint_hmac], name: communication_endpoint_version_hmac_uq}
      - {columns: [id, subject_id, version, endpoint_hmac, endpoint_digest], name: communication_endpoint_subject_revision_uq}
    checks:
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - state IN ('PENDING_VERIFICATION','ACTIVE','BOUNCED','SUPPRESSED','REVOKED')
      - version > 0
      - octet_length(endpoint_ciphertext) BETWEEN 1 AND 16384
      - length(hmac_key_version) BETWEEN 1 AND 100
      - length(encryption_key_id) BETWEEN 1 AND 200
      - "state = 'PENDING_VERIFICATION' AND verified_at IS NULL AND revoked_at IS NULL OR state = 'ACTIVE' AND verified_at IS NOT NULL AND revoked_at IS NULL OR state = 'BOUNCED' AND verified_at IS NOT NULL AND bounced_at IS NOT NULL AND revoked_at IS NULL OR state = 'SUPPRESSED' AND verified_at IS NOT NULL AND suppressed_at IS NOT NULL AND revoked_at IS NULL OR state = 'REVOKED' AND revoked_at IS NOT NULL"
      - ops.is_lower_sha256(endpoint_hmac) AND ops.is_lower_sha256(endpoint_digest) AND (last_provider_evidence_digest IS NULL OR ops.is_lower_sha256(last_provider_evidence_digest))
    indexes:
      - {name: communication_endpoint_subject_state_idx, columns: [subject_id, state, channel, id]}
      - {name: communication_endpoint_hmac_lookup_idx, columns: [channel, endpoint_hmac, hmac_key_version]}
      - {name: communication_endpoint_active_idx, columns: [subject_id, channel, id], where: "state = 'ACTIVE'"}
    privileges:
      gurine_submission_api: []
      gurine_control_api: ["SELECT(id, subject_id, channel, endpoint_hmac, hmac_key_version, state, version, endpoint_digest, verified_at, bounced_at, suppressed_at, revoked_at, last_provider_evidence_digest, created_at, updated_at)"]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: ["SELECT(id, subject_id, channel, state, version, endpoint_digest, verified_at, revoked_at)"]
      gurine_auditor: []
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_endpoint_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)", with_check: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_endpoint_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_endpoint_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: OPTIMISTIC_STATE_MACHINE
      immutable_columns: [id, subject_id, channel, endpoint_hmac, hmac_key_version, endpoint_ciphertext, encryption_key_id, created_at]
      update_rule: expected version, allowed communication_endpoint edge, new endpoint_digest and exactly one link event commit together; REVOKED is terminal and re-enrollment creates a new endpoint row.
    retention:
      record_class: COMMUNICATION_ENDPOINT_SECRET
      schedule_binding: retention_defaults.schedule_binding
      trigger: endpoint revocation plus configured dispute window
      terminal_action: CRYPTO_ERASE
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [subject_id, id]
      disclosure: raw endpoint and destination hint are never returned in receipts, events, audit details, logs, URLs or analytics.
    repository:
      roundtrip: ciphertext remains opaque bytes; decryption happens only at the gateway/submission boundary and plaintext is never a row field
      list_order: [channel, created_at, id]
      lock_order: [intake.communication_subjects, intake.communication_endpoints]

  intake.communication_endpoint_verifications:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationEndpointVerificationRow
      rust_domain: gurine_domain::communication::EndpointVerification
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_id: {type: uuid, nullable: false}
      subject_origin_binding_digest: {type: char(64), nullable: false}
      endpoint_id: {type: uuid, nullable: false}
      endpoint_version: {type: bigint, nullable: false}
      endpoint_snapshot_digest: {type: char(64), nullable: false}
      profile_session_id: {type: uuid, nullable: false}
      challenge_kind: {type: text, nullable: false}
      challenge_hash: {type: char(64), nullable: false}
      nonce_hash: {type: char(64), nullable: false}
      verification_binding_digest: {type: char(64), nullable: false}
      pending_authorization_binding: {type: jsonb, schema: PendingCommunicationAuthorizationBindingV1, nullable: true}
      pending_authorization_digest: {type: char(64), nullable: true}
      state: {type: text, nullable: false, default: "'PENDING'"}
      attempt_count: {type: integer, nullable: false, default: 0}
      max_attempts: {type: integer, nullable: false}
      version: {type: bigint, nullable: false, default: 1}
      proof_digest: {type: char(64), nullable: true}
      receipt_digest: {type: char(64), nullable: true}
      issued_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      expires_at: {type: timestamptz, nullable: false}
      verified_at: {type: timestamptz, nullable: true}
      consumed_at: {type: timestamptz, nullable: true}
      failed_at: {type: timestamptz, nullable: true}
    primary_key: [id]
    foreign_keys:
      - {columns: [subject_id, subject_origin_binding_digest], references: 'intake.communication_subjects(id,origin_binding_digest)', on_delete: RESTRICT}
      - {columns: [endpoint_id, subject_id], references: 'intake.communication_endpoints(id,subject_id)', on_delete: RESTRICT}
      - {columns: [subject_id, endpoint_id, endpoint_version, endpoint_snapshot_digest], references: 'intake.communication_endpoint_link_events(subject_id,endpoint_id,endpoint_version,endpoint_snapshot_digest)', deferred: true, initially: DEFERRED, add_after_both_tables_exist: true, on_delete: RESTRICT}
      - {columns: [profile_session_id], references: intake.submission_sessions(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [challenge_hash], name: communication_endpoint_challenge_hash_uq}
      - {columns: [nonce_hash], name: communication_endpoint_challenge_nonce_uq}
    checks:
      - endpoint_version > 0 AND version > 0
      - challenge_kind IN ('EMAIL_LINK','SMS_OTP','TELEGRAM_SIGNED_BINDING','WHATSAPP_SIGNED_BINDING','LINE_SIGNED_BINDING','KAKAO_SIGNED_BINDING','VOICE_PHONE_OTP','SIGNED_WEBHOOK_CHALLENGE')
      - state IN ('PENDING','VERIFIED','FAILED','EXPIRED','CANCELLED')
      - max_attempts BETWEEN 1 AND 10 AND attempt_count BETWEEN 0 AND max_attempts
      - expires_at > issued_at
      - (pending_authorization_binding IS NULL) = (pending_authorization_digest IS NULL)
      - pending_authorization_binding IS NULL OR pending_authorization_binding->>'authorizationKind' IN ('SUBSCRIPTION_CONSENT','ENDPOINT_LINKING_CONSENT')
      - "state = 'PENDING' AND verified_at IS NULL AND consumed_at IS NULL AND failed_at IS NULL OR state = 'VERIFIED' AND verified_at IS NOT NULL AND consumed_at IS NOT NULL AND proof_digest IS NOT NULL AND receipt_digest IS NOT NULL OR state IN ('FAILED','EXPIRED','CANCELLED') AND verified_at IS NULL AND failed_at IS NOT NULL"
      - ops.is_lower_sha256(subject_origin_binding_digest) AND ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(challenge_hash) AND ops.is_lower_sha256(nonce_hash) AND ops.is_lower_sha256(verification_binding_digest) AND (pending_authorization_digest IS NULL OR ops.is_lower_sha256(pending_authorization_digest)) AND (proof_digest IS NULL OR ops.is_lower_sha256(proof_digest)) AND (receipt_digest IS NULL OR ops.is_lower_sha256(receipt_digest))
    indexes:
      - {name: communication_endpoint_verification_lookup_idx, columns: [subject_id, endpoint_id, state, expires_at, id]}
      - {name: communication_endpoint_one_pending_challenge_idx, columns: [endpoint_id], unique: true, where: "state = 'PENDING'"}
      - {name: communication_endpoint_verification_expiry_idx, columns: [expires_at, id], where: "state = 'PENDING'"}
    privileges:
      gurine_submission_api: []
      gurine_control_api: ["SELECT(id, subject_id, endpoint_id, endpoint_version, challenge_kind, verification_binding_digest, state, attempt_count, max_attempts, version, proof_digest, receipt_digest, issued_at, expires_at, verified_at, consumed_at, failed_at)"]
      gurine_notification_worker: ["SELECT(id, subject_id, endpoint_id, endpoint_version, challenge_kind, challenge_hash, nonce_hash, verification_binding_digest, state, attempt_count, max_attempts, version, issued_at, expires_at)"]
      gurine_auditor: []
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_verification_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)", with_check: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_verification_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_verification_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: SINGLE_USE_OPTIMISTIC_CHALLENGE
      immutable_columns: [id, subject_id, subject_origin_binding_digest, endpoint_id, endpoint_version, endpoint_snapshot_digest, profile_session_id, challenge_kind, challenge_hash, nonce_hash, verification_binding_digest, pending_authorization_binding, pending_authorization_digest, max_attempts, issued_at, expires_at]
      update_rule: PENDING may increment attempt_count or make exactly one terminal transition; VERIFIED consumes the challenge in the same transaction and can append only the exact pre-captured authorization binding.
    retention:
      record_class: COMMUNICATION_VERIFICATION_SECRET
      schedule_binding: retention_defaults.schedule_binding
      trigger: terminal state or expiry
      terminal_action: DELETE_HASH_AND_CRYPTO_ERASE_PROOF
      backup_behavior: retention_defaults.backup_behavior
      rule: Token/challenge material follows the shortest configured schedule; link and authorization receipts preserve payload-free proof digests.
      legal_hold_key: [subject_id, endpoint_id, id]
    repository:
      roundtrip: PendingCommunicationAuthorizationBindingV1 validates with additionalProperties=false and digest equality
      claim_order: [expires_at, issued_at, id]
      lock_order: [intake.submission_sessions, intake.communication_subjects, intake.communication_endpoints, intake.communication_endpoint_verifications]

  intake.communication_endpoint_link_events:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationEndpointLinkEventRow
      rust_domain: gurine_domain::communication::EndpointLinkEvent
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_id: {type: uuid, nullable: false}
      subject_origin_binding_digest: {type: char(64), nullable: false}
      endpoint_id: {type: uuid, nullable: false}
      endpoint_sequence: {type: bigint, nullable: false}
      profile_version: {type: bigint, nullable: false}
      prior_endpoint_version: {type: bigint, nullable: true}
      endpoint_version: {type: bigint, nullable: false}
      endpoint_hmac: {type: char(64), nullable: false}
      endpoint_digest: {type: char(64), nullable: false}
      channel: {type: text, nullable: false}
      prior_state: {type: text, nullable: true}
      state: {type: text, nullable: false}
      change_kind: {type: text, nullable: false}
      profile_session_id: {type: uuid, nullable: true}
      verification_id: {type: uuid, nullable: true}
      consent_digest: {type: char(64), nullable: true}
      proof_digest: {type: char(64), nullable: false}
      reason_code: {type: text, nullable: false}
      endpoint_snapshot_digest: {type: char(64), nullable: false}
      event_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      occurred_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [subject_id, subject_origin_binding_digest], references: 'intake.communication_subjects(id,origin_binding_digest)', on_delete: RESTRICT}
      - {columns: [endpoint_id, subject_id], references: 'intake.communication_endpoints(id,subject_id)', on_delete: RESTRICT}
      - {columns: [profile_session_id], references: intake.submission_sessions(id), on_delete: RESTRICT}
      - {columns: [verification_id], references: intake.communication_endpoint_verifications(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [endpoint_id, endpoint_sequence], name: communication_endpoint_link_sequence_uq}
      - {columns: [subject_id, profile_version], name: communication_profile_link_version_uq}
      - {columns: [endpoint_id, endpoint_version, endpoint_snapshot_digest], name: communication_endpoint_revision_snapshot_uq}
      - {columns: [subject_id, endpoint_id, endpoint_version, endpoint_snapshot_digest], name: communication_endpoint_subject_revision_snapshot_uq}
      - {columns: [subject_id, endpoint_id, endpoint_version, endpoint_snapshot_digest, channel], name: communication_endpoint_subject_revision_channel_uq}
      - {columns: [endpoint_id, endpoint_version, endpoint_snapshot_digest, channel], name: communication_endpoint_revision_channel_uq}
      - {columns: [event_digest], name: communication_endpoint_link_event_digest_uq}
      - {columns: [receipt_digest], name: communication_endpoint_link_receipt_digest_uq}
    checks:
      - endpoint_sequence > 0 AND profile_version > 0 AND endpoint_version > 0
      - prior_endpoint_version IS NULL OR prior_endpoint_version > 0
      - prior_state IS NULL OR prior_state IN ('PENDING_VERIFICATION','ACTIVE','BOUNCED','SUPPRESSED','REVOKED')
      - state IN ('PENDING_VERIFICATION','ACTIVE','BOUNCED','SUPPRESSED','REVOKED')
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - change_kind IN ('LINK_REQUESTED','VERIFIED','UNLINKED','BOUNCED','SUPPRESSED','REENROLLMENT_REQUESTED','SUPPRESSION_RELEASED','CHALLENGE_EXPIRED','CHALLENGE_CANCELLED')
      - "endpoint_sequence = 1 AND prior_endpoint_version IS NULL AND prior_state IS NULL OR endpoint_sequence > 1 AND prior_endpoint_version IS NOT NULL AND prior_state IS NOT NULL"
      - ops.is_lower_sha256(subject_origin_binding_digest) AND ops.is_lower_sha256(endpoint_hmac) AND ops.is_lower_sha256(endpoint_digest) AND (consent_digest IS NULL OR ops.is_lower_sha256(consent_digest)) AND ops.is_lower_sha256(proof_digest) AND ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(event_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: communication_endpoint_link_history_idx, columns: [endpoint_id, endpoint_sequence]}
      - {name: communication_subject_link_history_idx, columns: [subject_id, profile_version]}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_auditor: []
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_link_event_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_link_event_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_link_event_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: APPEND_ONLY_ENDPOINT_REVISION_LEDGER
      trigger: ops.reject_mutation
      revision_rule: Every successful endpoint-head insert or lifecycle transition appends exactly one row whose endpoint_version equals the resulting head version and whose endpoint_snapshot_digest binds subject origin, endpoint HMAC/digest, channel, state, proof and profile version. Durable renderings, authorizations and deliveries reference this immutable revision instead of the mutable endpoint head.
    retention:
      record_class: COMMUNICATION_AUTHORIZATION_LEDGER
      schedule_binding: retention_defaults.schedule_binding
      trigger: subject purpose closure plus policy schedule
      terminal_action: PRESERVE_DIGESTED_RECEIPT_AND_ERASE_LINKABLE_SECRET
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [subject_id, endpoint_id, id]
    repository:
      roundtrip: exact event sequence and nullable prior values; no synthesized initial state
      history_order: [endpoint_sequence, id]

  intake.communication_authorization_events:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api|control-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationAuthorizationEventRow
      rust_domain: gurine_domain::communication::CommunicationAuthorizationDecision
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_id: {type: uuid, nullable: false}
      subject_origin_binding_digest: {type: char(64), nullable: false}
      endpoint_id: {type: uuid, nullable: false}
      endpoint_version: {type: bigint, nullable: false}
      endpoint_snapshot_digest: {type: char(64), nullable: false}
      authorization_sequence: {type: bigint, nullable: false}
      authorization_kind: {type: text, nullable: false}
      change_kind: {type: text, nullable: false}
      channel: {type: text, nullable: false}
      purpose: {type: text, nullable: false}
      topic_scope: {type: jsonb, schema: CommunicationTopicScopeV1, nullable: false}
      topic_scope_digest: {type: char(64), nullable: false}
      basis: {type: text, nullable: false}
      basis_reference: {type: text, nullable: false}
      policy_version: {type: text, nullable: false}
      policy_digest: {type: char(64), nullable: false}
      jurisdiction: {type: text, nullable: false}
      locale: {type: text, nullable: false}
      source_kind: {type: text, nullable: false}
      source_id: {type: uuid, nullable: false}
      source_version: {type: bigint, nullable: false}
      source_decision_digest: {type: char(64), nullable: false}
      proof_receipt_id: {type: uuid, nullable: false}
      proof_digest: {type: char(64), nullable: false}
      actor_type: {type: text, nullable: false}
      actor_id: {type: uuid, nullable: true}
      effective_at: {type: timestamptz, nullable: false}
      expires_at: {type: timestamptz, nullable: true}
      event_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [subject_id, subject_origin_binding_digest], references: 'intake.communication_subjects(id,origin_binding_digest)', on_delete: RESTRICT}
      - {columns: [subject_id, endpoint_id, endpoint_version, endpoint_snapshot_digest, channel], references: 'intake.communication_endpoint_link_events(subject_id,endpoint_id,endpoint_version,endpoint_snapshot_digest,channel)', on_delete: RESTRICT}
      - {columns: [actor_id], references: ops.users(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [subject_id, endpoint_id, purpose, topic_scope_digest, authorization_sequence], name: communication_authorization_sequence_uq}
      - {columns: [event_digest], name: communication_authorization_event_digest_uq}
      - {columns: [receipt_digest], name: communication_authorization_receipt_digest_uq}
      - {columns: [source_kind, source_id, source_version, source_decision_digest], name: communication_authorization_source_decision_uq}
    checks:
      - endpoint_version > 0 AND authorization_sequence > 0 AND source_version > 0
      - authorization_kind IN ('ENDPOINT_LINKING_CONSENT','LAWFUL_PURPOSE_AUTHORIZATION','SUBSCRIPTION_CONSENT','MARKETING_CONSENT','FALLBACK_CONSENT','VOICE_CONSENT')
      - change_kind IN ('GRANTED','VERIFIED','REVOKED','EXPIRED','SUSPENDED','RESTORED')
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE','SIGNED_WEBHOOK')
      - purpose IN ('ENDPOINT_VERIFICATION','RIGHT_OF_REPLY_REQUEST','RIGHT_OF_REPLY_REMINDER','RESPONSE_RECEIPT','CORRECTION_STATUS','CORRECTION_RETRACTION_NOTICE','PRIVACY_TRANSACTIONAL_NOTICE','SECURITY_TRANSACTIONAL_NOTICE','SUBSCRIPTION_UPDATE','PRODUCT_MARKETING','INCIDENT_RECOVERY','INTERNAL_ACTION_REQUEST','DISCRETIONARY_OUTREACH')
      - basis IN ('CONSENT','CONTRACTUAL_TRANSACTIONAL','LEGAL_OBLIGATION_REVIEWED','LEGITIMATE_INTEREST_REVIEWED','PUBLIC_TASK_REVIEWED','VITAL_INTEREST_REVIEWED')
      - length(basis_reference) BETWEEN 1 AND 1000
      - length(policy_version) BETWEEN 1 AND 100
      - length(jurisdiction) BETWEEN 2 AND 64 AND length(locale) BETWEEN 2 AND 35
      - source_kind IN ('ENDPOINT_VERIFICATION','SUBSCRIPTION','ACTION_DECISION','RESPONSE_REQUEST','CORRECTION_REQUEST','PRIVACY_REQUEST','OPT_OUT_RECEIPT','AUTHORIZED_POLICY_JOB')
      - actor_type IN ('SUBJECT_SESSION','HUMAN_USER','AUTHORIZED_SERVICE')
      - "actor_type = 'HUMAN_USER' AND actor_id IS NOT NULL OR actor_type <> 'HUMAN_USER' AND actor_id IS NULL"
      - expires_at IS NULL OR expires_at > effective_at
      - topic_scope_digest = ops.communication_topic_scope_digest(topic_scope)
      - "authorization_kind = 'MARKETING_CONSENT' AND basis = 'CONSENT' OR authorization_kind <> 'MARKETING_CONSENT'"
      - "authorization_kind = 'VOICE_CONSENT' AND channel = 'TWILIO_VOICE' OR authorization_kind <> 'VOICE_CONSENT'"
      - change_kind <> 'VERIFIED' OR source_kind = 'ENDPOINT_VERIFICATION'
      - ops.is_lower_sha256(subject_origin_binding_digest) AND ops.is_lower_sha256(endpoint_snapshot_digest) AND ops.is_lower_sha256(topic_scope_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(source_decision_digest) AND ops.is_lower_sha256(proof_digest) AND ops.is_lower_sha256(event_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: communication_authorization_effective_lookup_idx, columns: [subject_id, endpoint_id, purpose, topic_scope_digest, effective_at, authorization_sequence]}
      - {name: communication_authorization_expiry_idx, columns: [expires_at, id], where: "expires_at IS NOT NULL"}
      - {name: communication_authorization_source_idx, columns: [source_kind, source_id, source_version]}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_auditor: []
      mutation_functions:
        - {name: ops.record_communication_authorization_decision, execute: [gurine_control_api], security_definer: true}
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_authorization_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_authorization_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_authorization_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: APPEND_ONLY_LEDGER
      trigger: ops.reject_mutation
      active_formula: For the exact subject origin binding and immutable endpoint revision, channel, purpose and topic digest, order effective rows by effective_at then authorization_sequence; an unexpired GRANTED/VERIFIED/RESTORED row authorizes only until a later REVOKED/EXPIRED/SUSPENDED row. The evaluator first proves that the current endpoint head has the same subject, endpoint version and snapshot digest. Endpoint verification alone never creates purpose consent except an exact pre-captured subscription binding.
    retention:
      record_class: COMMUNICATION_AUTHORIZATION_LEDGER
      schedule_binding: retention_defaults.schedule_binding
      trigger: purpose closure and configured dispute/audit schedule
      terminal_action: PRESERVE_DIGESTED_DECISION_AND_ERASE_LINKABLE_SECRET
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [subject_id, endpoint_id, source_kind, source_id]
    repository:
      roundtrip: CommunicationTopicScopeV1 is closed and its digest is checked; no broad/global default is synthesized
      history_order: [effective_at, authorization_sequence, id]
      active_order: [effective_at DESC, authorization_sequence DESC, id DESC]

  intake.communication_preferences:
    owner:
      domain: CommunicationAuthorizationDecision
      service: submission-api
      repository: crates/persistence-postgres::communication_authorization
      rust_row: CommunicationPreferenceRow
      rust_domain: gurine_domain::communication::CommunicationPreference
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      subject_id: {type: uuid, nullable: false}
      purpose: {type: text, nullable: false}
      topic_scope: {type: jsonb, schema: CommunicationTopicScopeV1, nullable: false}
      topic_scope_digest: {type: char(64), nullable: false}
      timezone: {type: text, nullable: false}
      frequency: {type: text, nullable: false}
      quiet_hours_start: {type: time, nullable: true}
      quiet_hours_end: {type: time, nullable: true}
      quiet_days: {type: 'smallint[]', nullable: false, default: "'{}'::smallint[]"}
      channel_order: {type: 'text[]', nullable: false}
      fallback_allowed: {type: boolean, nullable: false, default: false}
      per_message_cost_ceiling: {type: 'numeric(24,6)', nullable: false}
      currency: {type: char(3), nullable: false}
      locale: {type: text, nullable: false}
      version: {type: bigint, nullable: false, default: 1}
      preference_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
      updated_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [subject_id], references: intake.communication_subjects(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [subject_id, purpose, topic_scope_digest], name: communication_preference_scope_uq}
    checks:
      - version > 0
      - purpose IN ('ENDPOINT_VERIFICATION','RIGHT_OF_REPLY_REQUEST','RIGHT_OF_REPLY_REMINDER','RESPONSE_RECEIPT','CORRECTION_STATUS','CORRECTION_RETRACTION_NOTICE','PRIVACY_TRANSACTIONAL_NOTICE','SECURITY_TRANSACTIONAL_NOTICE','SUBSCRIPTION_UPDATE','PRODUCT_MARKETING','INCIDENT_RECOVERY','INTERNAL_ACTION_REQUEST','DISCRETIONARY_OUTREACH')
      - frequency IN ('IMMEDIATE','DAILY','WEEKLY')
      - (quiet_hours_start IS NULL) = (quiet_hours_end IS NULL)
      - quiet_hours_start IS NULL OR quiet_hours_start <> quiet_hours_end
      - cardinality(quiet_days) BETWEEN 0 AND 7 AND ops.smallint_array_is_unique(quiet_days) AND quiet_days <@ ARRAY[0,1,2,3,4,5,6]::smallint[]
      - cardinality(channel_order) BETWEEN 1 AND 8 AND intake.communication_channel_array_is_unique(channel_order)
      - intake.communication_channel_array_is_closed(channel_order)
      - fallback_allowed = false OR cardinality(channel_order) >= 2
      - per_message_cost_ceiling >= 0
      - currency ~ '^[A-Z]{3}$'
      - length(timezone) BETWEEN 1 AND 64 AND timezone !~ '\\s'
      - length(locale) BETWEEN 2 AND 35
      - ops.is_lower_sha256(topic_scope_digest) AND ops.is_lower_sha256(preference_digest)
    indexes:
      - {name: communication_preference_subject_idx, columns: [subject_id, purpose, updated_at, id]}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: [SELECT]
      gurine_auditor: []
      mutation_functions:
        - {name: intake.update_communication_preferences, execute: [gurine_submission_api], security_definer: true}
    rls:
      enabled: true
      forced: false
      policies:
        - {name: communication_preference_profile_scope, roles: [gurine_submission_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)", with_check: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_preference_control_read, roles: [gurine_control_api], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
        - {name: communication_preference_gateway_read, roles: [gurine_notification_worker], using: "subject_id::text = current_setting('gurine.communication_subject_id', true)"}
    mutability:
      mode: OPTIMISTIC_MUTABLE_PROFILE
      immutable_columns: [id, subject_id, purpose, topic_scope, topic_scope_digest, created_at]
      update_rule: expected version increments exactly once and preference_digest binds every preference field; changing scope creates a new row.
    retention:
      record_class: COMMUNICATION_SUBJECT_PREFERENCE
      schedule_binding: retention_defaults.schedule_binding
      trigger: subject purpose closure
      terminal_action: DELETE
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [subject_id, id]
    repository:
      roundtrip: channel order and quiet days retain declared order; duplicates are corruption
      list_order: [purpose, topic_scope_digest, id]

