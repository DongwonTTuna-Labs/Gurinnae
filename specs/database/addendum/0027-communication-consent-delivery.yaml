        runtime_roles: [gurine_public_api, gurine_submission_api, gurine_control_api, gurine_ingest_worker, gurine_analysis_worker, gurine_public_projector, gurine_notification_worker, gurine_workflow_worker, gurine_document_extractor, gurine_scheduler, gurine_auditor, gurine_identity_api]
        all_columns: [scope, key_hash, request_hash, response_status, response_body, resource_type, resource_id, created_at, expires_at, operation_id, bff_issuer, session_token_hash, claim_generation, claim_transaction_xid8, storage_format, terminal_disposition, terminalized_at, tombstone_digest, response_schema, response_media_type, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, audit_event_id, outbox_id, completed_at]
        sensitive_columns: [key_hash, request_hash, response_body, operation_id, bff_issuer, session_token_hash, claim_transaction_xid8, storage_format, terminal_disposition, tombstone_digest, response_header_bytes, response_body_bytes, response_digest, receipt_id, receipt_digest, audit_event_id, outbox_id]
