      gurine_submission_api: []
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: editorial.decide_response_extension, execute: [gurine_control_api], security_definer: true}
