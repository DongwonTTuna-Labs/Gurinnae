      processed_at: {type: timestamptz, nullable: false}
    primary_key: [id]
    foreign_keys:
      - {columns: [provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest], references: 'ops.communication_provider_preflight_receipts(id,provider_config_id,provider_config_version,configuration_digest,receipt_digest)', on_delete: RESTRICT}
    unique_constraints:
      - {columns: [provider_config_id, replay_key_digest], name: communication_callback_replay_uq}
      - {columns: [provider_config_id, callback_request_digest], name: communication_callback_request_uq}
      - {columns: [provider_config_id, provider_request_identity_hmac], name: communication_callback_provider_request_uq, where: "provider_request_identity_hmac IS NOT NULL"}
      - {columns: [callback_digest], name: communication_callback_digest_uq}
      - {columns: [verification_receipt_digest], name: communication_callback_verification_receipt_uq}
    checks:
      - provider_config_version > 0
      - channel IN ('SMTP_EMAIL','TELEGRAM_BOT_API','META_WHATSAPP_BUSINESS_CLOUD','LINE_MESSAGING_API','SOLAPI_SMS','SOLAPI_KAKAO_BIZMESSAGE','TWILIO_VOICE')
      - callback_operation_id IN ('acceptSmtpDsn','receiveTelegramWebhook','receiveWhatsAppWebhook','receiveLineWebhook','receiveSolapiSmsCallback','receiveSolapiKakaoCallback','receiveTwilioVoiceCallback')
      - authentication_method IN ('GURINE_MTA_ASSERTION','TELEGRAM_SECRET_TOKEN','META_HMAC_SHA256','LINE_HMAC_SHA256','SOLAPI_SIGNATURE','TWILIO_SIGNATURE')
      - "channel = 'SMTP_EMAIL' AND callback_operation_id = 'acceptSmtpDsn' AND authentication_method = 'GURINE_MTA_ASSERTION' OR channel = 'TELEGRAM_BOT_API' AND callback_operation_id = 'receiveTelegramWebhook' AND authentication_method = 'TELEGRAM_SECRET_TOKEN' OR channel = 'META_WHATSAPP_BUSINESS_CLOUD' AND callback_operation_id = 'receiveWhatsAppWebhook' AND authentication_method = 'META_HMAC_SHA256' OR channel = 'LINE_MESSAGING_API' AND callback_operation_id = 'receiveLineWebhook' AND authentication_method = 'LINE_HMAC_SHA256' OR channel = 'SOLAPI_SMS' AND callback_operation_id = 'receiveSolapiSmsCallback' AND authentication_method = 'SOLAPI_SIGNATURE' OR channel = 'SOLAPI_KAKAO_BIZMESSAGE' AND callback_operation_id = 'receiveSolapiKakaoCallback' AND authentication_method = 'SOLAPI_SIGNATURE' OR channel = 'TWILIO_VOICE' AND callback_operation_id = 'receiveTwilioVoiceCallback' AND authentication_method = 'TWILIO_SIGNATURE'"
      - http_method = 'POST'
      - "callback_operation_id = 'acceptSmtpDsn' AND request_content_type = 'multipart/report; report-type=delivery-status' OR callback_operation_id IN ('receiveTelegramWebhook','receiveWhatsAppWebhook','receiveLineWebhook','receiveSolapiSmsCallback','receiveSolapiKakaoCallback') AND request_content_type = 'application/json' OR callback_operation_id = 'receiveTwilioVoiceCallback' AND request_content_type = 'application/x-www-form-urlencoded'"
      - processing_disposition IN ('AUTHENTICATED_APPLIED','AUTHENTICATED_PARTIAL','AUTHENTICATED_STALE','AUTHENTICATED_UNMATCHED','AUTHENTICATED_PARSE_FAILED')
      - "callback_operation_id = 'acceptSmtpDsn' AND request_body_length BETWEEN 1 AND 10485760 OR callback_operation_id IN ('receiveTelegramWebhook','receiveWhatsAppWebhook','receiveLineWebhook','receiveSolapiSmsCallback','receiveSolapiKakaoCallback') AND request_body_length BETWEEN 2 AND 2097152 OR callback_operation_id = 'receiveTwilioVoiceCallback' AND request_body_length BETWEEN 1 AND 262144"
      - octet_length(request_body_ciphertext) >= request_body_length AND octet_length(request_body_ciphertext) <= request_body_length + 65536
      - length(request_encryption_key_id) BETWEEN 1 AND 200 AND length(acknowledgement_encryption_key_id) BETWEEN 1 AND 200
      - item_count BETWEEN 0 AND 1000 AND applied_item_count BETWEEN 0 AND item_count AND stale_item_count BETWEEN 0 AND item_count AND unmatched_item_count BETWEEN 0 AND item_count
      - applied_item_count + stale_item_count + unmatched_item_count = item_count
      - "processing_disposition = 'AUTHENTICATED_PARSE_FAILED' AND item_count = 0 OR processing_disposition <> 'AUTHENTICATED_PARSE_FAILED' AND item_count > 0"
      - "processing_disposition = 'AUTHENTICATED_PARSE_FAILED' OR callback_operation_id IN ('acceptSmtpDsn','receiveTelegramWebhook','receiveSolapiSmsCallback','receiveSolapiKakaoCallback','receiveTwilioVoiceCallback') AND item_count = 1 OR callback_operation_id IN ('receiveWhatsAppWebhook','receiveLineWebhook') AND item_count BETWEEN 1 AND 1000"
      - "processing_disposition = 'AUTHENTICATED_APPLIED' AND applied_item_count = item_count OR processing_disposition = 'AUTHENTICATED_PARTIAL' AND applied_item_count > 0 AND applied_item_count < item_count OR processing_disposition = 'AUTHENTICATED_STALE' AND stale_item_count = item_count OR processing_disposition = 'AUTHENTICATED_UNMATCHED' AND unmatched_item_count = item_count OR processing_disposition = 'AUTHENTICATED_PARSE_FAILED'"
      - acknowledgement_http_status BETWEEN 200 AND 599 AND acknowledgement_body_length BETWEEN 0 AND 1048576 AND octet_length(acknowledgement_body_ciphertext) >= acknowledgement_body_length
      - length(acknowledgement_content_type) BETWEEN 1 AND 200
      - ops.communication_callback_auth_evidence_is_valid(authentication_evidence, authentication_method, authentication_evidence_digest)
      - ops.communication_callback_items_are_valid(normalized_items, item_count, normalized_item_set_digest)
      - processed_at >= received_at
      - ops.is_lower_sha256(provider_configuration_digest) AND ops.is_lower_sha256(provider_preflight_receipt_digest) AND ops.is_lower_sha256(callback_request_digest) AND ops.is_lower_sha256(request_target_digest) AND ops.is_lower_sha256(request_header_digest) AND ops.is_lower_sha256(request_body_sha256) AND ops.is_lower_sha256(authentication_evidence_digest) AND (provider_request_identity_hmac IS NULL OR ops.is_lower_sha256(provider_request_identity_hmac)) AND ops.is_lower_sha256(replay_key_digest) AND ops.is_lower_sha256(normalized_item_set_digest) AND ops.is_lower_sha256(acknowledgement_body_sha256) AND ops.is_lower_sha256(acknowledgement_digest) AND ops.is_lower_sha256(verification_receipt_digest) AND ops.is_lower_sha256(callback_digest)
    indexes:
      - {name: communication_callback_request_idx, columns: [provider_config_id, callback_request_digest, received_at, id]}
      - {name: communication_callback_provider_request_idx, columns: [provider_config_id, provider_request_identity_hmac, received_at, id], where: "provider_request_identity_hmac IS NOT NULL"}
      - {name: communication_callback_unmatched_idx, columns: [received_at, id], where: "processing_disposition IN ('AUTHENTICATED_PARTIAL','AUTHENTICATED_UNMATCHED')"}
    privileges:
      gurine_control_api: ["SELECT(id, provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest, integration_id, channel, callback_operation_id, callback_request_digest, http_method, request_content_type, request_target_digest, request_header_digest, request_body_sha256, request_body_length, authentication_method, authentication_evidence_digest, provider_request_identity_hmac, replay_key_digest, normalized_items, normalized_item_set_digest, item_count, applied_item_count, stale_item_count, unmatched_item_count, processing_disposition, acknowledgement_http_status, acknowledgement_content_type, acknowledgement_headers, acknowledgement_body_sha256, acknowledgement_body_length, acknowledgement_digest, verification_receipt_digest, callback_digest, received_at, processed_at)"]
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: ["SELECT(id, provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest, integration_id, channel, callback_operation_id, callback_request_digest, request_content_type, request_body_sha256, request_body_length, normalized_items, normalized_item_set_digest, item_count, applied_item_count, stale_item_count, unmatched_item_count, processing_disposition, acknowledgement_digest, verification_receipt_digest, callback_digest, received_at, processed_at)"]
      gurine_auditor: ["SELECT(id, provider_preflight_receipt_id, provider_config_id, provider_config_version, provider_configuration_digest, provider_preflight_receipt_digest, integration_id, channel, callback_operation_id, callback_request_digest, http_method, request_content_type, request_target_digest, request_header_digest, request_body_sha256, request_body_length, authentication_method, authentication_evidence_digest, provider_request_identity_hmac, replay_key_digest, normalized_item_set_digest, item_count, applied_item_count, stale_item_count, unmatched_item_count, processing_disposition, acknowledgement_http_status, acknowledgement_content_type, acknowledgement_body_sha256, acknowledgement_body_length, acknowledgement_digest, verification_receipt_digest, callback_digest, received_at, processed_at)"]
      mutation_functions:
        - {name: ops.record_communication_callback_request, execute: [gurine_notification_worker], security_definer: true}
    rls: {enabled: false, reason: private gateway relation with ciphertext excluded from non-gateway column grants}
    mutability:
      mode: APPEND_ONLY_AUTHENTICATED_REQUEST_LEDGER
      trigger: ops.reject_mutation
      insertion_rule: Resolve the exact immutable provider preflight/config revision, bound size/content type, verify the adapter-specific authentication profile against exact raw method/target/headers/body, and parse the complete bounded request before opening the mutation transaction. Invalid authentication inserts zero callback rows. One authenticated request inserts exactly one row containing an ordinal-complete closed item set; all matched item receipts, audits, outbox rows and the exact acknowledgement bytes finalize atomically.
      replay_rule: Authentication and request identity are checked before domain mutation. Lock the request-level replay identity first; the same provider revision, replay key and callback request digest returns the stored HTTP status, headers and body bytes before parsing or locking any delivery. The same replay or provider-request identity with changed target/header/body digest returns CALLBACK_REPLAY_CONFLICT and creates zero row, receipt, audit or event.
      multi_item_rule: Item ordinals are zero-based, contiguous and unique inside CommunicationCallbackNormalizedItemSetV1 and the operation-specific cardinality is enforced before mutation. One request may create zero or one outbound_delivery_receipt or communication_opt_out_receipt per item as allowed by its effectKind; each effect stores callback request ID, item ordinal and item digest. A failure before acknowledgement finalization rolls back the entire request, so replay never observes a partially applied item set.
      out_of_order_rule: Every authenticated parsed item is retained in the request snapshot. A transition not allowed from current delivery state or lower/incomparable to applied proof creates an applied=false STALE_STORED receipt and never regresses state.
    retention:
      record_class: COMMUNICATION_PROVIDER_CALLBACK
      schedule_binding: retention_defaults.schedule_binding
      trigger: callback terminal and delivery reconciliation completion
      terminal_action: CRYPTO_ERASE_BODY_PRESERVE_DIGESTED_EVIDENCE
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [provider_config_id, id]
      disclosure: raw callback body, provider event identifier, endpoint and signature material are absent from events, audit details, logs, traces, metrics, URLs and receipts.
    repository:
      roundtrip: request and acknowledgement ciphertext remain opaque; authentication evidence and the ordinal-complete normalized item set are closed and digest-checked; optional provider timestamp, nonce, event identity and sequence live only in their adapter-specific typed variants
      replay_order: [provider_config_id, replay_key_digest, id]
      evidence_order: [item.providerSequence ASC NULLS LAST, item.providerOccurredAt ASC NULLS LAST, received_at, id, item.ordinal]

