    mutability:
      mode: APPEND_ONLY
      trigger: ops.reject_mutation
      transaction: SERIALIZABLE; lock response request, base clock, extension request and prior decisions by sequence. Require expected versions and exact request_digest, no terminal response, current nonexpired calendar and no concurrent expiry. Insert APPROVE or REJECT decision, update extension request status/version/updated_at and response_requests.effective_due_at only for APPROVE, then audit/outbox/receipt atomically.
      expiry_race: Expiry locks the same rows in the same order and refuses to expire while a SUBMITTED extension request exists. One serializable winner decides or expires; no response is never inferred as admission.
    retention:
      record_class: RESPONSE_CLOCK_DECISION
      schedule_binding: retention_defaults.schedule_binding
      trigger: response/case record schedule
      terminal_action: PRESERVE_DECISION
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [response_request_id, extension_request_id, id]
    repository:
      roundtrip: null new_due_at is meaningful and never synthesized; prior and new due values retain exact UTC microseconds
      history_order: [decision_sequence, id]

  intake.appeals:
    owner:
      domain: ResponseAppeal
      service: submission-api
      repository: crates/persistence-postgres::response_appeals
      rust_row: ResponseAppealRow
      rust_domain: gurine_domain::response::ResponseAppeal
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      response_request_id: {type: uuid, nullable: false}
      response_submission_id: {type: uuid, nullable: false}
      expected_receipt_version: {type: bigint, nullable: false}
      prior_decision_kind: {type: text, nullable: false}
      prior_decision_id: {type: uuid, nullable: false}
      prior_receipt_digest: {type: char(64), nullable: false}
      reason_code: {type: text, nullable: false}
      requested_outcome: {type: text, nullable: false}
      statement_ciphertext: {type: bytea, nullable: false}
      statement_sha256: {type: char(64), nullable: false}
      encryption_key_id: {type: text, nullable: false}
      supporting_attachment_ids: {type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      supporting_attachment_set_digest: {type: char(64), nullable: false}
      attestation: {type: boolean, nullable: false}
      privacy_consent: {type: boolean, nullable: false}
      initial_state: {type: text, nullable: false, default: "'RECEIVED'"}
      appeal_digest: {type: char(64), nullable: false}
      review_due_at: {type: timestamptz, nullable: false}
      appeal_window_expires_at: {type: timestamptz, nullable: false}
      idempotency_key_hash: {type: char(64), nullable: false}
      request_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      outbox_event_id: {type: uuid, nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [response_request_id], references: editorial.response_requests(id), on_delete: RESTRICT}
      - {columns: [response_submission_id, response_request_id, expected_receipt_version, prior_receipt_digest], references: 'intake.response_submissions(id,response_request_id,receipt_version,receipt_digest)', on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [idempotency_key_hash], name: response_appeal_idempotency_uq}
      - {columns: [appeal_digest], name: response_appeal_digest_uq}
      - {columns: [receipt_digest], name: response_appeal_receipt_digest_uq}
      - {columns: [id, response_submission_id, response_request_id, receipt_digest], name: response_appeal_scope_receipt_uq}
      - {columns: [outbox_event_id], name: response_appeal_outbox_uq}
    checks:
      - expected_receipt_version > 0
      - prior_decision_kind IN ('DELIVERY_STATUS','DELIVERY_CLOCK','EXTENSION','PUBLICATION_EXCERPT','CONSENT')
      - reason_code IN ('DELIVERY_DISPUTE','SCOPE_DISPUTE','CONSENT_DISPUTE','PUBLICATION_EXCERPT_DISPUTE','DEADLINE_DISPUTE','OTHER')
      - requested_outcome IN ('REOPEN_RESPONSE','REVIEW_EXCERPT','CORRECT_STATUS','EXTEND_DEADLINE','HUMAN_REVIEW')
      - octet_length(statement_ciphertext) BETWEEN 1 AND 65536
      - length(encryption_key_id) BETWEEN 1 AND 200
      - cardinality(supporting_attachment_ids) BETWEEN 0 AND 20 AND ops.uuid_array_is_unique(supporting_attachment_ids)
      - attestation AND privacy_consent
      - initial_state = 'RECEIVED'
      - review_due_at > created_at AND appeal_window_expires_at > created_at
      - ops.is_lower_sha256(prior_receipt_digest) AND ops.is_lower_sha256(statement_sha256) AND ops.is_lower_sha256(supporting_attachment_set_digest) AND ops.is_lower_sha256(appeal_digest) AND ops.is_lower_sha256(idempotency_key_hash) AND ops.is_lower_sha256(request_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: response_appeal_submission_idx, columns: [response_submission_id, created_at DESC, id DESC]}
      - {name: response_appeal_request_idx, columns: [response_request_id, review_due_at, created_at, id]}
      - {name: response_appeal_queue_idx, columns: [review_due_at, created_at, id]}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: ["SELECT(id, response_request_id, response_submission_id, reason_code, requested_outcome, review_due_at, receipt_digest, created_at)"]
      gurine_auditor: []
      mutation_functions:
        - {name: intake.issue_response_appeal_create_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.create_response_appeal_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.get_response_appeal_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.rotate_response_appeal_status_session, execute: [gurine_submission_api], security_definer: true}
        - {name: intake.list_response_appeals_internal, execute: [gurine_control_api], security_definer: true}
        - {name: intake.get_response_appeal_workspace_internal, execute: [gurine_control_api], security_definer: true}
    rls:
      enabled: true
      forced: false
      policies:
        - {name: response_appeal_receipt_scope, roles: [gurine_submission_api], using: "response_submission_id::text = current_setting('gurine.response_submission_id', true)", with_check: "response_submission_id::text = current_setting('gurine.response_submission_id', true)"}
        - {name: response_appeal_control_read, roles: [gurine_control_api], using: "response_submission_id::text = current_setting('gurine.response_submission_id', true)"}
        - {name: response_appeal_notification_read, roles: [gurine_notification_worker], using: "response_submission_id::text = current_setting('gurine.response_submission_id', true)"}
    mutability:
      mode: APPEND_ONLY_INTAKE
      trigger: ops.reject_mutation
      transaction: Authenticate the BFF and lock the session-bound idempotency identity before requiring ACTIVE state, so a byte-identical replay of a previously successful one-shot command returns its stored response bytes. On a new claim, resolve active APPEAL_CREATE by token hash, issuer, exact response-submission scope, expiry, status and session version; lock the exact response_submission plus response_request plus receipt-version/digest composite; derive the authoritative prior decision and receipt; validate window and attachment ownership; insert appeal/audit/outbox/receipt, consume APPEAL_CREATE, issue APPEAL_STATUS and finalize stored response bytes atomically. A changed request digest is IDEMPOTENCY_CONFLICT; invalid, consumed without a matching finalized replay, and cross-submission scope return the same unavailable error.
      current_state: RECEIVED until appeal_decisions sequence 1; thereafter the highest decision sequence is authority. Appeal intake never mutates a prior request, decision or receipt.
    retention:
      record_class: RESPONSE_APPEAL_CONTENT
      schedule_binding: retention_defaults.schedule_binding
      trigger: response/case closure
      terminal_action: CRYPTO_ERASE_STATEMENT_PRESERVE_DIGESTED_RECEIPT
      backup_behavior: retention_defaults.backup_behavior
      rule: contact/linkable content is retained at most one year after case closure while documented purpose remains.
      legal_hold_key: [response_request_id, response_submission_id, id]
    repository:
      roundtrip: ciphertext and attachment order are exact; session-safe public projection contains no statement plaintext, internal reason, actor or hidden evidence
      queue_order: [review_due_at, created_at, id]
      requester_order: [created_at DESC, id DESC]

  intake.appeal_decisions:
    owner:
      domain: ResponseAppeal
      service: control-api
      repository: crates/persistence-postgres::response_appeals
      rust_row: ResponseAppealDecisionRow
      rust_domain: gurine_domain::response::ResponseAppealDecision
    columns:
      id: {type: uuid, nullable: false, default: gen_random_uuid()}
      appeal_id: {type: uuid, nullable: false}
      decision_sequence: {type: bigint, nullable: false}
      expected_prior_sequence: {type: bigint, nullable: false}
      prior_state: {type: text, nullable: false}
      state: {type: text, nullable: false}
      decision_kind: {type: text, nullable: false}
      reason_code: {type: text, nullable: false}
      reason_ciphertext: {type: bytea, nullable: false}
      reason_sha256: {type: char(64), nullable: false}
      encryption_key_id: {type: text, nullable: false}
      evidence_receipt_ids: {type: 'uuid[]', nullable: false, default: "'{}'::uuid[]"}
      evidence_set_digest: {type: char(64), nullable: false}
      information_task_id: {type: uuid, nullable: true}
      information_task_digest: {type: char(64), nullable: true}
      actor_id: {type: uuid, nullable: false}
      capability: {type: text, nullable: false}
      assurance: {type: text, nullable: false}
      idempotency_key_hash: {type: char(64), nullable: false}
      request_digest: {type: char(64), nullable: false}
      decision_digest: {type: char(64), nullable: false}
      audit_event_id: {type: uuid, nullable: false}
      outbox_event_id: {type: uuid, nullable: false}
      receipt_digest: {type: char(64), nullable: false}
      decided_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [appeal_id], references: intake.appeals(id), on_delete: RESTRICT}
      - {columns: [information_task_id], references: ops.tasks(id), on_delete: RESTRICT}
      - {columns: [actor_id], references: ops.users(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [appeal_id, decision_sequence], name: response_appeal_decision_sequence_uq}
      - {columns: [idempotency_key_hash], name: response_appeal_decision_idempotency_uq}
      - {columns: [decision_digest], name: response_appeal_decision_digest_uq}
      - {columns: [receipt_digest], name: response_appeal_decision_receipt_uq}
      - {columns: [outbox_event_id], name: response_appeal_decision_outbox_uq}
    checks:
      - decision_sequence > 0 AND expected_prior_sequence >= 0 AND decision_sequence = expected_prior_sequence + 1
      - prior_state IN ('RECEIVED','REVIEW')
      - state IN ('REVIEW','RESOLVED','REJECTED','DUPLICATE','WITHDRAWN')
      - decision_kind IN ('START_REVIEW','RESOLVE','REJECT','MARK_DUPLICATE','WITHDRAW')
      - "prior_state = 'RECEIVED' AND decision_kind IN ('START_REVIEW','REJECT','MARK_DUPLICATE','WITHDRAW') OR prior_state = 'REVIEW' AND decision_kind IN ('RESOLVE','REJECT','MARK_DUPLICATE','WITHDRAW')"
      - "decision_kind = 'START_REVIEW' AND state = 'REVIEW' OR decision_kind = 'RESOLVE' AND state = 'RESOLVED' OR decision_kind = 'REJECT' AND state = 'REJECTED' OR decision_kind = 'MARK_DUPLICATE' AND state = 'DUPLICATE' OR decision_kind = 'WITHDRAW' AND state = 'WITHDRAWN'"
      - length(reason_code) BETWEEN 1 AND 100 AND octet_length(reason_ciphertext) BETWEEN 1 AND 65536 AND length(encryption_key_id) BETWEEN 1 AND 200
      - cardinality(evidence_receipt_ids) BETWEEN 0 AND 100 AND ops.uuid_array_is_unique(evidence_receipt_ids)
      - (information_task_id IS NULL) = (information_task_digest IS NULL)
      - state <> 'RESOLVED' OR cardinality(evidence_receipt_ids) > 0
      - capability = 'responses.review' AND assurance = 'STEP_UP'
      - ops.is_lower_sha256(reason_sha256) AND ops.is_lower_sha256(evidence_set_digest) AND (information_task_digest IS NULL OR ops.is_lower_sha256(information_task_digest)) AND ops.is_lower_sha256(idempotency_key_hash) AND ops.is_lower_sha256(request_digest) AND ops.is_lower_sha256(decision_digest) AND ops.is_lower_sha256(receipt_digest)
    indexes:
      - {name: response_appeal_decision_history_idx, columns: [appeal_id, decision_sequence]}
      - {name: response_appeal_decision_actor_idx, columns: [actor_id, decided_at DESC, id DESC]}
    privileges:
      gurine_submission_api: []
      gurine_control_api: [SELECT]
      gurine_notification_worker: ["SELECT(id, appeal_id, decision_sequence, prior_state, state, decision_kind, evidence_set_digest, information_task_id, decision_digest, receipt_digest, decided_at)"]
      gurine_auditor: []
      mutation_functions:
        - {name: intake.transition_response_appeal, execute: [gurine_control_api], security_definer: true}
    rls:
      enabled: true
      forced: false
      policies:
        - {name: response_appeal_decision_receipt_scope, roles: [gurine_submission_api], using: "EXISTS (SELECT 1 FROM intake.appeals a WHERE a.id = appeal_id AND a.response_submission_id::text = current_setting('gurine.response_submission_id', true))"}
        - {name: response_appeal_decision_control_read, roles: [gurine_control_api], using: "EXISTS (SELECT 1 FROM intake.appeals a WHERE a.id = appeal_id AND a.response_submission_id::text = current_setting('gurine.response_submission_id', true))"}
        - {name: response_appeal_decision_notification_read, roles: [gurine_notification_worker], using: "EXISTS (SELECT 1 FROM intake.appeals a WHERE a.id = appeal_id AND a.response_submission_id::text = current_setting('gurine.response_submission_id', true))"}
    mutability:
      mode: APPEND_ONLY
      trigger: ops.reject_mutation
      transaction: SERIALIZABLE; lock appeal then decisions in sequence, derive current state, require expected prior sequence and legal edge, create any bounded information task, then append decision/audit/outbox/receipt atomically. First terminal commit wins and later attempts return APPEAL_STATE_INVALID without mutation.
    retention:
      record_class: RESPONSE_APPEAL_DECISION
      schedule_binding: retention_defaults.schedule_binding
      trigger: response/case record schedule
      terminal_action: PRESERVE_DECISION_AND_CRYPTO_ERASE_REASON_AFTER_SCHEDULE
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [appeal_id, id]
    repository:
      roundtrip: current state is highest stored sequence; missing sequence or unknown state is corruption and never RECEIVED fallback
      history_order: [decision_sequence, id]

