      audit_event_id: {type: uuid, nullable: false}
      outbox_event_id: {type: uuid, nullable: false}
      created_at: {type: timestamptz, nullable: false, default: clock_timestamp()}
    primary_key: [id]
    foreign_keys:
      - {columns: [response_request_id, response_request_binding_digest], references: 'editorial.response_requests(id,request_binding_digest)', on_delete: RESTRICT}
      - {columns: [communication_intent_id, delivery_source_object_type, response_request_id, intent_source_decision_digest], references: 'ops.communication_intents(id,source_object_type,source_object_id,source_decision_digest)', on_delete: RESTRICT}
      - {columns: [outbound_delivery_id, communication_intent_id, delivery_source_object_type, response_request_id], references: 'ops.outbound_deliveries(id,intent_id,object_type,object_id)', on_delete: RESTRICT}
      - {columns: [delivery_receipt_id, outbound_delivery_id, delivery_receipt_sequence, delivery_receipt_digest, delivery_resulting_state, delivery_receipt_applied], references: 'ops.outbound_delivery_receipts(id,delivery_id,receipt_sequence,receipt_digest,resulting_state,applied)', on_delete: RESTRICT}
      - {columns: [calendar_version_id], references: ops.business_calendar_versions(id), on_delete: RESTRICT}
      - {columns: [audit_event_id], references: ops.audit_events(id), on_delete: RESTRICT}
      - {columns: [outbox_event_id], references: ops.outbox(id), on_delete: RESTRICT}
    unique_constraints:
      - {columns: [response_request_id], name: response_delivery_single_clock_uq}
      - {columns: [outbound_delivery_id, delivery_receipt_id], name: response_delivery_receipt_clock_uq}
      - {columns: [decision_digest], name: response_delivery_clock_decision_digest_uq}
      - {columns: [outbox_event_id], name: response_delivery_clock_outbox_uq}
    checks:
      - response_request_version > 0 AND clock_revision = 1 AND delivery_receipt_sequence > 0
      - delivery_source_object_type = 'RESPONSE_REQUEST'
      - delivery_receipt_applied AND delivery_resulting_state IN ('DELIVERED','READ')
      - evidence_kind IN ('SIGNED_PROVIDER_DELIVERY_CALLBACK','AUTHENTICATED_PROVIDER_POLL','OFFICIAL_CHANNEL_RECEIPT')
      - window_business_days = 5
      - length(timezone) BETWEEN 1 AND 64
      - due_at > verified_delivery_at
      - ops.is_lower_sha256(response_request_binding_digest) AND ops.is_lower_sha256(intent_source_decision_digest) AND ops.is_lower_sha256(delivery_receipt_digest) AND ops.is_lower_sha256(rendering_digest) AND ops.is_lower_sha256(endpoint_identity_hash) AND ops.is_lower_sha256(provider_identity_hash) AND ops.is_lower_sha256(evidence_digest) AND ops.is_lower_sha256(calendar_digest) AND ops.is_lower_sha256(policy_digest) AND ops.is_lower_sha256(decision_digest)
    indexes:
      - {name: response_delivery_clock_due_idx, columns: [due_at, response_request_id]}
      - {name: response_delivery_clock_calendar_idx, columns: [calendar_version_id, verified_delivery_at, id]}
    privileges:
      gurine_control_api: [SELECT]
      gurine_submission_api: []
      gurine_notification_worker: [SELECT]
      gurine_workflow_worker: [SELECT]
      gurine_scheduler: [SELECT]
      gurine_auditor: [SELECT]
      mutation_functions:
        - {name: editorial.start_response_delivery_clock, execute: [gurine_workflow_worker], security_definer: true}
    rls: {enabled: false, reason: internal immutable decision with safe submission projection through fixed function only}
    mutability:
      mode: APPEND_ONLY_SINGLE_DECISION
      trigger: ops.reject_mutation
      transaction: Lock response request, immutable communication intent, outbound delivery, exact receipt revision, existing clock row and calendar version in that order. Require the composite chain to bind this response request identity to a RESPONSE_REQUEST intent, that exact delivery and an applied DELIVERED or READ receipt with allowed evidence; select calendar effective at verified_delivery_at; compute exactly five business days; insert decision, update response_requests.clock_decision_id/effective_due_at, audit and both delivery-evidence/clock-start outbox events atomically.
      no_clock: PROVIDER_ACCEPTED, FAILED_PERMANENT, SUPPRESSED, CANCELLED, RECONCILIATION_REQUIRED, ambiguous/operator-only evidence and email-open pixels create no row.
    retention:
      record_class: RESPONSE_CLOCK_DECISION
      schedule_binding: retention_defaults.schedule_binding
      trigger: response/case record schedule
      terminal_action: PRESERVE_DECISION
      backup_behavior: retention_defaults.backup_behavior
      legal_hold_key: [response_request_id, outbound_delivery_id, id]
    repository:
      roundtrip: evidence kind and all bound digests are stored authority; reader never recalculates a different calendar version
      detail_order: [response_request_id]

