natural_person_guard_authority:
  policy_version: r6d-named-person-publication-v2
  detector_kinds:
  - REGISTERED_PERSON_EXACT
  - TITLE_ADJACENT_KOREAN_NAME
  ambiguous_disposition: BLOCK_HUMAN_REVIEW
  sql_lower_bound: TITLE_ADJACENT_KOREAN_NAME_ONLY
  registered_exact_completeness: APPLICATION_KEY_REQUIRED_OUTSIDE_SQL_LOWER_BOUND
  bounded_lower_bound_statement: SQL provides an independent mandatory lower bound over title-adjacent candidate span
    coverage only; it appends a TITLE_ADJACENT_KOREAN_NAME finding when no application finding occupies that span, does not
    require the persisted detector kind when another finding covers the span, and is not a complete application-scanner
    replacement
  registered_person_exact_statement: REGISTERED_PERSON_EXACT completeness is explicitly not claimed by 0041 SQL because
    decrypting registered names requires application-held key authority; SQL checks the supplied span digest and digest-only
    person binding independently, but cannot prove that the span text equals the bound registered person's name
  identity_merge_rule: identity-merge use remains FORBIDDEN
  finding_outcome_rule: zero persisted findings produces PASS; one or more persisted findings produces BLOCKED and marks legal
    review required, while PREVIEW may retain that blocked assessment without a legal override
known_fail_closed_boundaries:
  registered_person_exact_completeness: NOT_CLAIMED; absence of a SQL-generated REGISTERED_PERSON_EXACT finding is not evidence
    that the application-key-backed scan is complete or that no registered name occurs
  lower_bound_limits: more than 10000 public-text leaves, a leaf over 1048576 UTF-8 bytes, or more than 10000 findings is
    rejected rather than truncated or accepted
  active_policy_selection: zero or multiple active v2 policy rows fail as missing or ambiguous authority
  legacy_slug_validation: the NOT VALID constraint deliberately does not prove all pre-0041 slugs valid; operators can use the
    explicitly granted inventory routine to enumerate invalid legacy values
  event_emission: 0041 registers and emits no new event type; existing audit and publication receipt authority remains owned by
    prior migrations
verification_obligations:
- pglast parses exactly 60 statements with one BEGIN first and one terminal COMMIT last
- CREATE TABLE, CREATE VIEW, explicit index, and event-registry upsert inventories are all empty and relation_delta is zero
- all 16 routine signatures, one trigger statement, and two altered-relation targets reproduce the current pglast inventory
- migration_sha256, every canonical DDL hash, and object_inventory_sha256 reproduce from the current SQL bytes
- PUBLIC EXECUTE is revoked from every listed routine and only the three exact runtime/audit entry points receive explicit
  EXECUTE grants
- the SQL title-adjacent candidate-span coverage is enforced as a bounded lower bound without claiming detector-kind
  preservation or REGISTERED_PERSON_EXACT semantic-match completeness
