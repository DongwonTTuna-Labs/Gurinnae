authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0040 remain byte-preserved; all physical changes are forward-only in
    0041
  transaction_rule: one outer BEGIN is the first pglast statement and terminal COMMIT is the last statement
  seed_rule: 0041 inserts exactly one immutable active r6d-named-person-publication-v2 policy row; it seeds no assessment,
    finding, legal override, publication receipt, audit event, outbox event, or event-registry row
  legacy_rule: the immutable v1 policy row remains valid historical authority; new assessment and publication paths select
    the exact active v2 policy and do not rewrite historical receipts
  slug_rule: editorial.cases receives a NOT VALID lowercase-hyphen slug shape constraint so existing rows can be listed and
    repaired while new affected writes remain fenced; the replacement case trigger independently rejects an invalid changed
    public slug
  public_text_rule: the canonical public-text tree and digest include the public slug and the current-schema evidence
    sourceUrl field, while rejecting malformed or unsupported structured text and invalid JSON pointers
  sql_lower_bound_rule: SQL deterministically derives TITLE_ADJACENT_KOREAN_NAME candidate spans across canonical public-text
    leaves and appends a title finding only when no supplied finding already occupies the same JSON pointer and UTF-16 span;
    this is span-coverage lower-bound enforcement, not proof that every persisted candidate retains that detector kind
  registered_person_exact_rule: SQL independently validates a supplied REGISTERED_PERSON_EXACT span digest and current
    digest-only registered-person binding against the exact registered-set digest; it neither decrypts registered names nor
    proves the public-text span equals the bound person's name, and it claims no detector completeness
  assessment_rule: the SECURITY DEFINER assessment owner binds the request, actor context, current case and review snapshot,
    v2 policy and ruleset, public payload and public-text digests, registered-name-set digest, ordered findings, idempotency,
    audit receipt, and any legal override in one transaction
  publication_guard_rule: preview, publish, and correction require a current exact assessment; publish additionally requires
    an exact unexpired preview assessment, while publish and correction require independent editorial review and, for nonzero
    findings, the exact legal-override authority chain
  fail_closed_rule: malformed or oversized lower-bound input, stale scope or registered set, digest or finding mismatch, or
    missing or ambiguous policy, assessment, review, preview, override, or owner receipt produces no unguarded protected
    publication transition
