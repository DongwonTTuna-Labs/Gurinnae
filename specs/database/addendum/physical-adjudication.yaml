    - Downstream approval consumers bind proposal/version/approval digest, decision actor/kind/receipt/conflict, execution generation/digest, and terminal receipt digest with composite keys.
    - VACANT review assignments terminalize the old generation and insert generation+1; immutable NULL/non-NULL shapes are never inverted in place.
    - Route communication.delivery_receipt_recorded.v1 to logical consumer response-request-materializer on workflow-worker and include consumerId in the job payload and dedupe key.
    - Add private.RecordOutboundDeliveryObservation as the normal authenticated synchronous-response producer, return the exact outbound receipt ID/sequence/digest, and make the event payload bind that receipt while attemptId remains nullable for non-attempt evidence.
