    - Add sent_receipt_id and sent_binding_digest to editorial.response_requests with an initially deferred composite FK to editorial.response_request_sent_receipts; the first DRAFT to SENT transition is the only writer.
    - Generate one response access artifact during intent/rendering materialization and reuse the same token generation, rendering bytes, OTP derivation, provider idempotency key, and delivery identity across safe retries.
    - Keep materializeResponseRequestSent read/write independent from editorial.response_delivery_clock_decisions; a delivery-observation worker owns verified DELIVERED or READ clock start.
    - Emit token-free response.submitted.v2, notification.response_submitted.v2 and workflow.response_submitted.v2 in the submission transaction and enforce unique reciprocal owned-intake bindings on response_submission_id, response_request_id and editorial_response_id.
