  - candidate: editorial.response_request_sent_receipts
    disposition: NEW
    migration: 0027_communication_consent_delivery.sql
    canonical_identity: [id, response_request_id, receipt_digest]
    unique_effect_keys: [source_event_id, response_request_id, delivery_receipt_id, outbox_event_id, receipt_digest]
    rule: One immutable receipt binds the request version and scope digest to the exact intent, rendering, access artifact, endpoint revision, provider preflight snapshot, delivery, definitive applied acceptance receipt, audit, and response.request_sent.v1 outbox event. A mutable delivery head or caller timestamp is not proof.
  - candidate: core.procurement_comparable_candidate_revisions
    disposition: MAP
    targets:
      - relation: ops.action_approval_comparable_details
        variant: COMPARABLE_CANDIDATE
      - relation: ops.execution_receipts
        variant: COMPARABLE_SELECTION_EFFECT
    mapping_rule: A comparable candidate is a typed, digest-bound proposal detail and becomes authority only through the independently authorized definitive execution receipt. Query-snapshot membership proves the searched cohort but never authorizes the candidate choice.
  - candidate: intake.privacy_request_receipt_tokens
    disposition: MAP
    target: intake.submission_sessions
    target_variant: PRIVACY_REQUEST_RECEIPT
    mapping_rule: One-shot HMAC token exchange consumes exactly one scoped session parent and creates one PRIVACY_REQUEST_STATUS child. Plaintext tokens are never persisted.
  - candidate: intake.communication_endpoint_versions
