foreign_key_closure:
  construction_rule: create parent before child inside each migration; cross-migration references only point backward
  candidate_key_rule: every target column tuple set-equals a nonpartial primary-key or unique constraint in identical order and every constraint is convalidated=true before migration commit
  source_index_rule: every source FK column tuple is the leftmost identical-order prefix of a declared valid btree index, primary key or unique constraint; an index is nonpartial or, for a nullable MATCH SIMPLE FK only, has exactly the conjunction that every source FK column IS NOT NULL and no other filter; DEFERRABLE and low-cardinality FKs receive no exemption
  extraction_rule: derive FKs from column-level fk declarations, table foreign_keys, constraints.foreign_keys and deferred_foreign_keys across every fragment plus altered-base relation contracts; derive indexes from primary keys, unique constraints, indexes and additive_indexes rather than a numeric count
  forward_edges:
    - source: ops.communication_provider_configs.activation_decision_id
      target: ops.capability_activation_decisions.id
      created_column_in: 0027
      add_validated_fk_in: 0028
  cycles:
    rule: no pair of mutable root aggregates may carry mutually required FKs
    break_strategy: child owns root FK; root stores current child identity only as nullable digest-bound pointer added after child creation or derives latest child by indexed query
    delete_rule: RESTRICT across aggregate roots; cascade only within immutable membership rows
  polymorphic_identity:
    allowed_only_when: the closed target_type CHECK and target_id are paired with target_version and target_digest and application repository validates existence under the same transaction
    preferred: concrete nullable FK columns plus exactly-one-target CHECK
  final_oracle: every pg_constraint contype=f is validated, target table/columns and exact candidate key exist, the source leading index resolves with indisvalid and indisready true and an allowed predicate, delete action is declared, and the recursive graph has no required-FK cycle

source_derived_global_gates:
  source_model:
    base: [specs/database/schema-catalog.yaml, specs/database/privilege-matrix.yaml, immutable migrations 0001 through 0024]
    additive: relation_inventory.derivation_sources.physical_fragments
    extraction: normalize table_contracts list rows and tables map rows into one relation-keyed model; normalize columns maps/lists, primary and unique keys, FKs, indexes, privileges, routines, custom types, JSON contracts and retention contracts without fallback counts
    drift_rule: any stable input hash, declared relation, ordinal, owner, type, privilege or validator change invalidates all derived snapshots and requires complete regeneration
  retention:
    relation_set: relation_inventory.flatten plus every changed base relation named by the fragments
    required_table_fields: [record_class or explicit outcome-to-record-class map, trigger, schedule_binding, legal_hold_key, backup_behavior, terminal_action]
    child_inheritance: an immutable child may reference an exact parent retention contract only when its FK is mandatory and RESTRICT, its lifecycle cannot outlive the parent, and the child declares its own legal-hold traversal and backup behavior; prose-only inheritance fails
    schedule_oracle: every emitted record class resolves to one latest-effective nonexpired ops.record_class_schedules revision or the destructive/disclosure operation preserves the row and opens review; DDL never invents a duration
    hold_oracle: each relation has a deterministic resolver to case hold cells or ops.legal_hold_target_anchors, and terminal retention and disclosure lock the same anchor before the target row
    restore_oracle: restoration suppression, active hold union, tombstone and current schedule are evaluated before restored bytes become readable, processable, searchable or externally disclosable
  jsonb:
    discovery: inspect type or sql_type values jsonb and jsonb:<Contract> plus schema, rust_type, logical_type and json_type annotations on every additive and altered-base column and routine composite field
    reference_rule: every JSONB occurrence names exactly one closed logical contract that resolves once across closed_type_contracts, closed_json_contracts, closed_json_types or the fragment's explicitly classified closed_types registry; a bare unannotated jsonb fails
    schema_rule: object contracts reject additional properties, declare all required keys, closed discriminators/enums, bounds and ordered/unique array rules; every variant is exhaustive and unknown schemaVersion fails
    database_rule: a named immutable validator or equivalent named CHECK rejects malformed stored JSONB, and canonical byte/digest mirrors are equality-checked where replay, evidence or accounting identity depends on bytes
    rust_rule: every column maps to sqlx::types::Json<ClosedRustType>; serde_json::Value, map-of-unknown, string dispatch and unchecked deserialization are forbidden
    catalog_oracle: PostgreSQL format_type, column nullability/default, validator CHECK and Rust mapping set-equal the normalized contract model
  indexes:
    declaration_rule: every primary, unique, FK-support, query-order, lock-predicate and partial index has a unique declared name, method, ordered key expressions, include list, collation/opclass when nondefault and predicate
    fk_rule_ref: foreign_key_closure.source_index_rule
    query_rule: each repository list cursor, optimistic lock, retention/hold selector, outbox/inbox consumer, lease claim and uniqueness probe names its supporting index and the query predicate implies any partial-index predicate
    catalog_oracle: pg_index, pg_class, pg_am, pg_attribute and pg_get_expr set-equal the declaration; indisvalid=false, indisready=false, an unexpected duplicate or an undeclared product index fails
  schema_usage:
    contract_ref: privilege_closure.schema_usage
    equality: derived object privilege schemas equal effective schema USAGE for every runtime role after recursive membership expansion; required USAGE missing and unrelated USAGE present are both failures
  type_registry:
    discovery: normalize every column, routine argument/result, standalone composite field, CHECK cast and index expression type after removing typmods and array dimensions
    builtins: resolve only against the PostgreSQL 18.4 pg_catalog type registry; an unknown unqualified type is never treated as text
    application_types: every non-pg_catalog named type resolves exactly once in the base ownership manifest or a fragment physical_type_registry with kind, schema, ordered enum labels or composite attributes, creation phase, owner and ACL
    dependency_order: topologically create enums/domains/ranges before standalone composites and routines, then relations; cycles or implicit creation fail
    implicit_types: table row types and PostgreSQL-generated array types are derived catalog dependents and excluded from standalone declared-type counts, but their owner and ACL inheritance are still checked
    acl_rule: PUBLIC has zero USAGE; runtime type USAGE is derived from permitted table columns and exact routine signatures and implies schema USAGE; gurine_migrator owns every non-extension application type
    catalog_oracle: pg_type, pg_enum, pg_attribute, pg_range, pg_depend and aclexplode set-equal the normalized registry including enum order, composite ordinal/type/typmod, owner and effective grants

repository_round_trip_contract:
  required_per_relation:
    - insert every required field with non-default boundary values
    - read through typed SQLx row and map to closed Rust domain type
    - assert byte-identical encrypted/digest fields and numeric precision
    - assert optional null versus absent semantics
    - execute every allowed lifecycle transition with expected version/generation
    - assert stale version, duplicate identity, invalid CHECK, missing FK and forbidden mutation fail with exact typed error
    - assert role-positive and role-negative access in PostgreSQL 18.4
    - assert retention/hold selection includes the row and a legal hold blocks terminal action
  no_synthesis: repository may not invent identifier, timestamp, state, digest, receipt, provider proof or default for a missing stored field
  test_identity: AC-OA-TABLE-<SCHEMA>-<TABLE>-CONTRACT

runtime_oracles:
  catalog:
    - The successful migration ledger set-equals inventory_lock.migration_sequence in exact ordinal order, has thirty-one rows, has no failed or unknown row, and preserves every pinned checksum.
    - The relation delta grouped by owning migration set-equals inventory_lock.relation_delta_by_migration; its flattened set equals relation_inventory and the final application relkind-r set equals the base-plus-derived-additive formula without a numeric fallback.
    - Every source-derived additive table and every manifest-listed base or changed application object is owned by gurine_migrator; every application schema is owned by gurine_schema_owner.
    - extensions and extension-owned objects remain owned by the cluster extension owner; no extension dependency was transferred or rewritten.
    - Compatibility views for ops.email_deliveries and ops.source_incidents have relkind v, their renamed physical targets have relkind r, and no compatibility view or public._sqlx_migrations row is counted as a product table.
    - Migration 0030 exists after 0029, adds zero relation, and the final schema-ready receipt binds the thirty migration checksums, derived final-relation digest, privilege digest and authority-v13-frozen Git tag digest.
  constraints:
    - every primary, foreign, unique and check constraint named in table contracts resolves and is validated
    - every named index resolves to exact access method, key order, include list and predicate
    - every digest CHECK rejects uppercase, nonhex and non-64-byte values
  privileges:
    - PUBLIC has zero CONNECT, CREATE and TEMPORARY on database gurine and zero effective privilege on every application schema, relation, sequence, standalone type and routine; a public projection is granted to gurine_public_api, never to the PostgreSQL PUBLIC pseudo-role.
    - gurine_schema_owner is NOLOGIN and owns only the six application schemas; gurine_migrator is NOLOGIN, has permanent USAGE but no CREATE on those schemas, and owns all non-extension application objects.
    - gurine_migration_executor is NOLOGIN, owns zero objects, has zero application or ledger privilege, has no database CREATE or TEMPORARY, and has no membership edge to gurine_migrator, gurine_schema_owner, a runtime role or pg_database_owner.
    - has_schema_privilege(role, schema, 'CREATE') is false for gurine_migrator, gurine_migration_executor, PUBLIC and every runtime role on all six schemas; owner-implied authority exists only on the inert gurine_schema_owner.
    - Every runtime role owns zero objects, has no control-plane membership, and its effective privileges after recursive role expansion set-equal the exact relation, sequence, type and routine allowlist.
    - every forbidden UPDATE/DELETE and direct intake mutation is denied at runtime
    - pg_default_acl for gurine_migrator exposes no PUBLIC table, sequence, type or routine privilege; global routine/type revokes and table/sequence canaries in every application schema prove new objects are inaccessible until explicitly granted.
    - PUBLIC ACL checks use aclexplode grantee OID 0 plus a fresh zero-membership role, never has_*_privilege('PUBLIC', ...), because PUBLIC is not a pg_roles row.
    - A negative executor rehearsal proves CREATE and ALTER fail before SET ROLE, succeed only as current_user gurine_migrator while the lease is open, and fail again after membership removal, NOLOGIN and schema CREATE revocation.
  routines:
    - Every application routine owner is gurine_migrator and every SECURITY DEFINER routine has prosecdef true, a signature-specific EXECUTE allowlist and zero PUBLIC EXECUTE.
    - Every SECURITY DEFINER proconfig contains one fixed search_path with pg_catalog first, only declared trusted schemas in the middle and pg_temp last; role, session_authorization, row_security=off, public, "$user" and caller-selected settings are absent.
    - A malicious same-name object in a caller-owned temporary schema cannot change routine resolution, and no function body executes dynamic identifier SQL or SET ROLE.
  execution_provenance:
    - Every post-base migration receipt and PostgreSQL audit record identifies session_user gurine_migration_executor, current_user gurine_migrator, the exact application_name, migration ordinal and checksum; postgres or a runtime role is never the additive statement executor.
    - Ownership-adoption and lease-control records are separately typed, checksummed and bounded; they contain no product DDL and cannot be mistaken for a successful migration receipt.
    - Runtime startup requires both ledger row 31 and the stable no-lease catalog predicate, so a committed prefix or leaked temporary grant cannot become serving state.
  rls:
    - all additive intake tables have relrowsecurity=true
    - cross-session, cross-subject and expired-session access is denied without object-existence leakage
  concurrency:
    - optimistic updates return one winner and 63 VERSION_CONFLICT results in a 64-client race
    - decision/quorum, delivery dispatch, reservation settlement, legal-hold release and retention completion each have one durable terminal winner
    - replay produces zero duplicate business effects, receipts, decisions or facts
  retention:
    - active hold coverage blocks destructive action and disclosure as declared
    - partial nonoverlapping release changes only released cells
    - restore applies suppression before any row becomes readable or processable
  source_derived_gates:
    - every additive and changed-base table passes the retention contract and hold resolver gate
    - every JSONB occurrence resolves one closed validator-backed type and one non-Value Rust mapping
    - every FK has an exact target candidate key and source-leading valid index
    - effective schema USAGE and custom-type USAGE set-equal source-derived object privilege dependencies
    - declared indexes and named custom types set-equal PostgreSQL 18.4 catalog objects, order, owners and ACLs

cross_file_requirements:
  - Generate migrations 0025 through 0029 byte-identically under specs/database/migrations and db/migrations, mirror reviewed migration 0030 under specs/database/migrations, add runtime migration 0031, and make all seven files obey the executor preamble, one-transaction and zero-gap contracts.
  - Replace the current 0030 self-contained BEGIN or COMMIT and 24-only assumption with the outer executor transaction, 0025-through-0029 checksum preflight, zero relation delta and final global oracle defined here.
  - Implement the checksummed post-0024 ownership manifest with the exact postgres versus pg_database_owner source-owner split, ownership-adoption, network-fenced lease-open, unconditional multi-phase lease-close and watchdog artifacts; update compose, deployment preflight and secret catalog so MIGRATOR_DATABASE_URL authenticates only gurine_migration_executor and never falls back to postgres, the database owner or a development bootstrap role.
  - Update services/migrator to require the exact thirty-one-file sequence, reject gaps before applying any post-base migration, issue SET LOCAL ROLE per transaction, preserve session_user or current_user provenance, emit the schema-ready receipt only for 0030 and execute cleanup on every exit.
  - Keep the business-model-required ops.commercial_qualification_receipts as the sole qualification-episode authority in 0029; its physical contract, owner, persistence, hold, privilege and validator registries must remain set-equal and it must never be folded into a generic stage ledger.
  - Regenerate schema catalog, privilege matrix, runtime-security tests and PostgreSQL 18.4 evidence from relation_inventory and inventory_lock; numeric 29-migration or stale relation-count fallbacks are forbidden.
  - Extend scripts/validation/design_database.py to derive and set-compare all seven post-base migration relation lists, the additive and final sets, the complete economics order, stable fragment hashes, retention/JSONB/FK-index/schema-usage/type registries, role attributes, ownership classes, global default ACLs, SECURITY DEFINER proconfig and final lease closure without numeric fallbacks.
  - Replace every schema-scoped default routine EXECUTE or type USAGE revoke with the global gurine_migrator default ACL statements, then retain per-schema table/sequence and fresh-role canaries; PostgreSQL 18.4 proves an IN SCHEMA revoke does not subtract the built-in PUBLIC routine/type default.
  - Expand every table retention contract to the normalized six-field model, with special attention to the 0026 period/start/hold/delete shorthand and 0028 schedule bindings, and add every missing source-leading FK index or exact nullable null-excluding index before migration generation.
  - Replace every test helper that applies post-base SQL with psql -U postgres by the adoption plus bounded executor rehearsal; retain a negative assertion that postgres execution of migrations 0025 through 0031 is rejected by their preamble.
  - Regenerate SQLx offline metadata and one repository round-trip test for every source-derived additive relation from the same PostgreSQL 18.4 catalog, then run make verify-specs and make verify-codegen against the authority-v13-frozen Git tag only after the source, spec mirror and runtime migration bytes are equal.
  - Operation persistence rows must reference exact repositories, lock predicates and receipt tables; this ownership contract does not waive remaining product, command, event or repository closure gates.
