known_fail_closed_boundaries:
  staged_legacy_rows: pre-0039 rows without immutable authority receipts remain readable but cannot enter a new protected
    success path
  operating_policy_population: 0039 creates no operating schedule, calendar, assertion, identity proof, or privacy request
  document_identity_proof: the producer-less document challenge remains rejected for new or changed privacy rows until an
    immutable same-subject exact-scope producer exists
  verified_endpoint_identity_proof: the privacy consumer shape remains closed, but no canonical endpoint verifier/runtime
    producer can create its source receipt; this proof kind remains OPEN_FAIL_CLOSED with no synthetic ACTIVE endpoint
  backup_physical_disposal: only the bounded due inventory is implemented; automatic deletion and a database disposal writer
    are forbidden; the receipt producer remains OPERATOR_OWNED_DEFERRED and the system cannot claim completion while
    BACKUP_PHYSICAL_DISPOSAL_RECEIPT_AUTHORITY is unset
  privacy_correction_effect: at the historical 0039 boundary immutable typed plan creation mutates zero target rows and
    APPROVE/COMPLETE are fail-closed; 0040 forward-supersedes that boundary for exact RESPONSE /partyName only
  privacy_legal_hold_scope: at the historical 0039 boundary RESPONSE, PUBLICATION, and EVIDENCE are implemented while the four
    added target kinds are fail-closed; 0040 forward-supersedes CORRECTION, SUBSCRIPTION and COMMUNICATION_ENDPOINT and keeps
    AUDIT_SUBJECT_RECORD explicitly unsupported
