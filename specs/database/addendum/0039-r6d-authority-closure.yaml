authority_and_compatibility:
  historical_migration_rule: migrations 0001 through 0038 remain byte-preserved; every physical change is forward-only in
    0039
  transaction_rule: one outer BEGIN is the first pglast statement and terminal COMMIT is the last statement
  seed_rule: 0039 seeds no operating retention schedule, response calendar, organization assertion, identity proof, or privacy
    request
  legacy_rule: legacy rows without the immutable 0039 authority receipts remain readable but cannot enter a new classification,
    attestation, retention, or privacy execution path
  fail_closed_rule: missing or stale receipts, schedules, proofs, scope inventories, legal-hold authority, actor assertions,
    step-up authority, or digests produce no protected transition
  entity_authority_rule: entity classification, closure, legal-hold fencing, anonymization, and backup-disposal inventory
    are database-owned and receipt-bound
  official_channel_rule: official-channel attestation and revocation require exact immutable source and authority receipts;
    staged 0038 rows do not acquire inferred 0039 authority
  response_materializer_rule: the SECURITY DEFINER materializer forwards the event-bound response_request_id into the existing
    transaction-local response-submission RLS context before invoking its private owner, and explicitly defers both reciprocal
    constraints
  privacy_rule: privacy create, RESPONSE_RECEIPT identity verification, correction planning, receipt exchange, and the
    RESPONSE_RECEIPT-backed VERIFY_IDENTITY transition use exact producer, scope, step-up, and receipt authority;
    VERIFIED_ENDPOINT remains unavailable without its separate canonical verifier/runtime producer
