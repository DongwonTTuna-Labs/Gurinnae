owner_procedure_contracts:
  common:
    language: plpgsql
    security: SECURITY_DEFINER
    owner: gurine_migrator
    search_path: "pg_catalog,ops,editorial,core,raw,intake"
    public_execute: REVOKED
    runtime_direct_dml: REVOKED
    same_digest_replay: return exact stored status, headers and response bytes with zero new rows
    changed_digest_replay: IDEMPOTENCY_CONFLICT with zero committed rows
  routines:
    - {signature: "ops.create_action_proposal_v1(ops.create_action_proposal_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: READ_COMMITTED, effect_owner: control-api.createActionProposal, atomic_transition_group: gurine.command.createActionProposal.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.audit_events, ops.outbox]}
    - {signature: "ops.update_action_draft_v1(ops.update_action_draft_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.updateActionDraft, atomic_transition_group: gurine.command.updateActionDraft.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.audit_events, ops.outbox]}
    - {signature: "ops.preview_action_draft_v1(ops.preview_action_draft_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: READ_COMMITTED, effect_owner: control-api.previewActionDraft, atomic_transition_group: gurine.command.previewActionDraft.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.audit_events, ops.outbox]}
    - {signature: "ops.submit_action_for_review_v1(ops.submit_action_review_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.submitActionForReview, atomic_transition_group: gurine.command.submitActionForReview.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.action_review_assignments, ops.audit_events, ops.outbox]}
    - {signature: "ops.claim_action_review_v1(ops.claim_action_review_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.claimActionReview, atomic_transition_group: gurine.command.claimActionReview.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_review_assignments, ops.audit_events, ops.outbox]}
    - {signature: "ops.submit_action_decision_v1(ops.submit_action_decision_input_v1) RETURNS ops.action_decision_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.submitActionDecision.final-approve, atomic_transition_group: gurine.command.submitActionDecision.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.action_review_assignments, ops.action_decisions, ops.in_flight_effects, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.execution_authorizations, ops.execution_attempts, ops.execution_receipts, ops.audit_events, ops.outbox]}
    - {signature: "ops.withdraw_action_proposal_v1(ops.withdraw_action_proposal_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.withdrawActionProposal, atomic_transition_group: gurine.command.withdrawActionProposal.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.action_review_assignments, ops.audit_events, ops.outbox]}
    - {signature: "ops.withdraw_action_decision_v1(ops.withdraw_action_decision_input_v1) RETURNS ops.action_decision_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.withdrawActionDecision, atomic_transition_group: gurine.command.withdrawActionDecision.v1, writes: [ops.idempotency_keys, ops.action_proposals, ops.action_review_assignments, ops.action_decisions, ops.audit_events, ops.outbox]}
    - {signature: "ops.fill_action_review_vacancy_v1(ops.fill_action_review_vacancy_input_v1) RETURNS ops.action_proposal_receipt_v1", execute_roles: [gurine_workflow_worker, gurine_scheduler], isolation: SERIALIZABLE, effect_owner: action-review-assignment-coordinator, atomic_transition_group: action-review-vacancy-fill, writes: [ops.action_proposals, ops.action_review_assignments, ops.audit_events, ops.outbox]}
    - {signature: "ops.cancel_action_execution_v1(ops.cancel_action_execution_input_v1) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.cancelActionExecution, atomic_transition_group: gurine.command.cancelActionExecution.v1, writes: [ops.idempotency_keys, ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.audit_events, ops.outbox]}
    - {signature: "ops.retry_action_execution_v1(ops.retry_action_execution_input_v1) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_control_api], isolation: SERIALIZABLE, effect_owner: control-api.retryActionExecution, atomic_transition_group: gurine.command.retryActionExecution.v1, writes: [ops.idempotency_keys, ops.in_flight_effects, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.execution_authorizations, ops.execution_attempts, ops.execution_receipts, ops.audit_events, ops.outbox]}
    - {signature: "ops.claim_action_execution_v1(text,interval,timestamptz) RETURNS ops.action_execution_claim_receipt_v1", execute_roles: [gurine_workflow_worker], isolation: READ_COMMITTED, effect_owner: execution-worker.claim-existing-attempt, atomic_transition_group: action-execution-claim, writes: [ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.audit_events]}
    - {signature: "ops.begin_action_dispatch_v1(uuid,bigint,uuid,uuid,bigint,timestamptz) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_workflow_worker], isolation: READ_COMMITTED, effect_owner: execution-worker.begin-dispatch, atomic_transition_group: action-execution-dispatch-start, writes: [ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.audit_events]}
    - {signature: "ops.record_action_execution_observation_v1(ops.execution_observation_input_v1) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_workflow_worker], isolation: SERIALIZABLE, effect_owner: execution-worker.record-observation, atomic_transition_group: action-execution-observation, writes: [ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.audit_events, ops.outbox]}
    - {signature: "ops.reconcile_action_execution_v1(ops.execution_observation_input_v1) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_workflow_worker], isolation: SERIALIZABLE, effect_owner: reconciliation-worker, atomic_transition_group: action-execution-reconciliation, writes: [ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.audit_events, ops.outbox]}
    - {signature: "ops.expire_action_execution_v1(uuid,bigint,bigint,timestamptz) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_workflow_worker, gurine_scheduler], isolation: SERIALIZABLE, effect_owner: action-execution-worker.expire, atomic_transition_group: action-execution-expiry, writes: [ops.in_flight_effects, ops.execution_attempts, ops.execution_receipts, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.audit_events, ops.outbox]}
    - {signature: "ops.record_budget_transition_v1(ops.budget_transition_input_v1) RETURNS ops.action_execution_mutation_receipt_v1", execute_roles: [gurine_workflow_worker, gurine_analysis_worker], isolation: SERIALIZABLE, effect_owner: budget-transition-owner, atomic_transition_group: budget-reservation-transition, writes: [ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.audit_events, ops.outbox]}
  final_approve_function_rule: "submit_action_decision_v1 is the only routine allowed to insert an INITIAL_APPROVAL authorization or generation-one ACTION_EXECUTION effect; a trigger rejects any other current_setting('gurine.atomic_transition_group',true)."
  dispatch_race_rule: "begin_action_dispatch_v1 locks effect, authorization and attempt; it rejects a stale lease/fence or committed cancel, assigns the next dispatch ordinal and increments dispatch_attempt_count before commit, then egress occurs only after commit."
  third_failure_rule: "record/reconcile functions map definitive NOT_ACCEPTED at dispatch_attempt_count=3 directly to PERMANENT_FAILED in the same receipt transaction; RETRYABLE_FAILED at count 3 is rejected at commit."
  provider_handoff_rule: "The worker passes the committed DISPATCH_STARTED receipt digest, execution digest, generation, attempt ID/state version, dispatch ordinal, lease/fence, cancellation generation, target-request digest, provider-configuration digest and stable provider idempotency identity to the exact executor adapter. Any mismatch or stale field causes zero egress."

acl_contract:
  table_write_privileges: none for every runtime role
  table_read_policy: only columns explicitly listed in each table grants block; SELECT ALL for a runtime role is forbidden except gurine_auditor
  function_execute_policy: set-equals owner_procedure_contracts.routines[].execute_roles by exact regprocedure identity
  type_usage_policy: runtime roles receive USAGE only on the input/output composites needed by an executable routine
  forbidden_privileges: [CREATE, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER, support-function-EXECUTE, default-function-EXECUTE]
  owner_bypass_canary: temporary direct owner UPDATE/DELETE against an immutable row fails through the guard trigger; routine-local transaction context is required for guarded heads
  role_membership_canary: recursive role expansion cannot add an undeclared table, sequence, type or routine privilege

migration_plan:
  - {step: 1, action: "REVOKE schema defaults from PUBLIC and assert prerequisite migrations 0001..0025"}
  - {step: 10, action: "create ops.action_proposals without its two forward FKs"}
  - {step: 20, action: "create ops.action_proposal_versions and add both sides of the deferred current-version cycle"}
  - {step: 30, action: "create ops.action_review_assignments"}
  - {step: 40, action: "create ops.action_decisions without execution_id forward FK"}
  - {step: 50, action: "create ops.in_flight_effects; add proposal compensation and decision execution forward FKs"}
  - {step: 60, action: "create ops.budget_reservations"}
  - {step: 70, action: "create ops.budget_reservation_ledger_entries"}
  - {step: 80, action: "create ops.execution_authorizations"}
  - {step: 90, action: "create ops.execution_attempts"}
  - {step: 100, action: "create ops.execution_receipts and its deferred self-chain FK"}
  - {step: 110, action: "create guard and deferred constraint triggers, revoke all runtime access, then apply exact grants"}
  - {step: 120, action: "run catalog, privilege, immutability, transition, concurrency, receipt-chain, budget and repository canaries"}

tables:
  - relation: ops.action_proposals
    owner_role: gurine_migrator
    owning_component: crates/persistence-postgres::action_approval
    owning_domain: gurine_domain::action::ActionProposal
    columns:
      - {name: id, sql_type: uuid, nullable: false, default: "gen_random_uuid()"}
      - {name: action_kind, sql_type: text, nullable: false, default: null}
      - {name: origin_kind, sql_type: text, nullable: false, default: null}
      - {name: origin_id, sql_type: uuid, nullable: false, default: null}
      - {name: origin_version, sql_type: bigint, nullable: false, default: null}
      - {name: origin_digest, sql_type: "character(64)", nullable: false, default: null}
      - {name: compensates_execution_id, sql_type: uuid, nullable: true, default: null}
      - {name: compensates_execution_state, sql_type: text, nullable: true, default: null}
      - {name: compensates_effect_digest, sql_type: "character(64)", nullable: true, default: null}
      - {name: compensates_execution_receipt_digest, sql_type: "character(64)", nullable: true, default: null}
      - {name: target_type, sql_type: text, nullable: false, default: null}
      - {name: target_id, sql_type: text, nullable: false, default: null}
      - {name: target_version, sql_type: bigint, nullable: false, default: null}
      - {name: target_digest, sql_type: "character(64)", nullable: false, default: null}
      - {name: object_scope_digest, sql_type: "character(64)", nullable: false, default: null}
      - {name: current_version, sql_type: bigint, nullable: false, default: 1}
      - {name: aggregate_version, sql_type: bigint, nullable: false, default: 1}
      - {name: created_by, sql_type: uuid, nullable: false, default: null}
      - {name: owner_user_id, sql_type: uuid, nullable: false, default: null}
      - {name: last_receipt_digest, sql_type: "character(64)", nullable: false, default: null}
      - {name: last_audit_event_id, sql_type: uuid, nullable: false, default: null}
      - {name: created_at, sql_type: timestamptz, nullable: false, default: "clock_timestamp()"}
      - {name: updated_at, sql_type: timestamptz, nullable: false, default: "clock_timestamp()"}
    primary_key: [id]
    foreign_keys:
      - {name: action_proposals_creator_fk, columns: [created_by], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: action_proposals_owner_fk, columns: [owner_user_id], references: "ops.users(id)", on_delete: RESTRICT, deferrable: false}
      - {name: action_proposals_last_audit_fk, columns: [last_audit_event_id], references: "ops.audit_events(id)", on_delete: RESTRICT, deferrable: true}
      - {name: action_proposals_current_version_fk, columns: [id, current_version], references: "ops.action_proposal_versions(proposal_id, version)", on_delete: RESTRICT, deferrable: "INITIALLY DEFERRED"}
      - {name: action_proposals_compensation_fk, columns: [compensates_execution_id, compensates_execution_state, compensates_effect_digest, compensates_execution_receipt_digest], references: "ops.in_flight_effects(id,state,effect_key_digest,last_receipt_digest)", on_delete: RESTRICT, deferrable: "INITIALLY DEFERRED"}
    uniques:
      - {name: action_proposals_id_current_version_key, columns: [id, current_version]}
    checks:
      - {name: action_proposals_action_kind_check, expression: "action_kind IN ('HYPOTHESIS','CLAIM','TASK','COMPARABLE','COMMUNICATION','PUBLICATION','RETRACTION','RULE_ACTIVATION','ROLE_GRANT','KILL_SWITCH','COMMUNICATION_AUTHORIZATION','ASSET_RIGHTS_DECISION','RETENTION_SCHEDULE','FUNDING_DISCLOSURE','CAPABILITY_ACTIVATION','RESPONSE_POLICY_CALENDAR','COMMERCIAL_CONTROL')"}
      - {name: action_proposals_origin_kind_check, expression: "origin_kind IN ('HUMAN','AGENT_PROPOSAL','SYSTEM_EVENT','COMPENSATION')"}
      - {name: action_proposals_compensation_check, expression: "(origin_kind = 'COMPENSATION' AND compensates_execution_id IS NOT NULL AND compensates_execution_state = 'SUCCEEDED' AND compensates_effect_digest ~ '^[0-9a-f]{64}$' AND compensates_execution_receipt_digest ~ '^[0-9a-f]{64}$') OR (origin_kind <> 'COMPENSATION' AND compensates_execution_id IS NULL AND compensates_execution_state IS NULL AND compensates_effect_digest IS NULL AND compensates_execution_receipt_digest IS NULL)"}
      - {name: action_proposals_target_type_check, expression: "target_type IN ('CASE','CLAIM','TASK','LINE_ITEM','COMMUNICATION_INTENT','PUBLICATION','RULE_VERSION','USER','KILL_SWITCH','COMMUNICATION_SUBJECT','ASSET','RECORD_CLASS','FUNDING_DISCLOSURE','CAPABILITY','BUSINESS_CALENDAR')"}
      - {name: action_proposals_nonempty_target_check, expression: "length(btrim(target_id)) BETWEEN 1 AND 500"}
      - {name: action_proposals_versions_check, expression: "origin_version > 0 AND target_version > 0 AND current_version > 0 AND aggregate_version > 0"}
      - {name: action_proposals_digests_check, expression: "origin_digest ~ '^[0-9a-f]{64}$' AND target_digest ~ '^[0-9a-f]{64}$' AND object_scope_digest ~ '^[0-9a-f]{64}$' AND last_receipt_digest ~ '^[0-9a-f]{64}$'"}
      - {name: action_proposals_time_check, expression: "updated_at >= created_at"}
    indexes:
      - {name: action_proposals_owner_updated_idx, method: btree, columns_or_expression: "owner_user_id, updated_at DESC, id DESC", predicate: null, unique: false}
      - {name: action_proposals_kind_updated_idx, method: btree, columns_or_expression: "action_kind, updated_at DESC, id DESC", predicate: null, unique: false}
      - {name: action_proposals_target_idx, method: btree, columns_or_expression: "target_type, target_id, target_version, id", predicate: null, unique: false}
    grants:
      - {role: gurine_control_api, privileges: [SELECT], columns: [id, action_kind, origin_kind, origin_id, origin_version, origin_digest, compensates_execution_id, compensates_execution_state, compensates_effect_digest, compensates_execution_receipt_digest, target_type, target_id, target_version, target_digest, object_scope_digest, current_version, aggregate_version, created_by, owner_user_id, last_receipt_digest, last_audit_event_id, created_at, updated_at]}
      - {role: gurine_workflow_worker, privileges: [SELECT], columns: [id, action_kind, target_type, target_id, target_version, target_digest, object_scope_digest, current_version, aggregate_version, owner_user_id, last_receipt_digest, updated_at]}
