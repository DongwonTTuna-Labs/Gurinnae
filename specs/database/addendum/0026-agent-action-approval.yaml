      - {name: action_review_assignments_roles_check, expression: "cardinality(allowed_role_codes) BETWEEN 1 AND 9 AND ops.text_array_is_sorted_unique_nonempty(allowed_role_codes)"}
      - {name: action_review_assignments_nonempty_slot_check, expression: "length(btrim(slot_id)) BETWEEN 1 AND 100"}
      - {name: action_review_assignments_conflict_check, expression: "conflict_target_type = 'ACTION_PROPOSAL' AND conflict_target_id = proposal_id AND conflict_target_version = proposal_version AND ((state = 'VACANT' AND reviewer_id IS NULL AND conflict_snapshot_id IS NULL AND reviewer_role_snapshot_digest = 'a987005ba2dc00498702eea9d50ed59c6732bb825059d52b491be1a37a2fddd6' AND conflict_snapshot_digest = 'e78bfc84252d3d52a9005d38ed5e102e334240826621d6e5570ff3ce42b94b21' AND conflict_evaluation_state = 'UNAVAILABLE' AND blocking_reason_code = 'ACTION_QUORUM_UNAVAILABLE' AND next_assignment_scan_at IS NOT NULL) OR (state <> 'VACANT' AND reviewer_id IS NOT NULL AND conflict_snapshot_id IS NOT NULL AND conflict_evaluation_state IN ('CLEAR','DISCLOSURE_REQUIRED') AND conflict_valid_until >= due_at AND NOT (reviewer_id = ANY(excluded_actor_ids)) AND blocking_reason_code IS NULL AND next_assignment_scan_at IS NULL))"}
      - {name: action_review_assignments_exclusion_check, expression: "cardinality(excluded_actor_ids) BETWEEN 1 AND 64 AND ops.uuid_array_is_sorted_unique(excluded_actor_ids)"}
      - {name: action_review_assignments_digests_check, expression: "approval_digest ~ '^[0-9a-f]{64}$' AND reviewer_role_snapshot_digest ~ '^[0-9a-f]{64}$' AND eligibility_snapshot_digest ~ '^[0-9a-f]{64}$' AND conflict_snapshot_digest ~ '^[0-9a-f]{64}$' AND conflict_target_digest ~ '^[0-9a-f]{64}$' AND exclusion_set_digest ~ '^[0-9a-f]{64}$' AND quorum_plan_digest ~ '^[0-9a-f]{64}$' AND assignment_digest ~ '^[0-9a-f]{64}$' AND last_receipt_digest ~ '^[0-9a-f]{64}$'"}
      - {name: action_review_assignments_claim_check, expression: "(state IN ('VACANT','ASSIGNED') AND claimed_at IS NULL) OR (state IN ('IN_PROGRESS','COMPLETED') AND claimed_at IS NOT NULL) OR state IN ('RECUSED','CANCELLED')"}
      - {name: action_review_assignments_terminal_check, expression: "(state IN ('COMPLETED','RECUSED','CANCELLED')) = (terminal_at IS NOT NULL)"}
      - {name: action_review_assignments_terminal_reason_check, expression: "(state IN ('COMPLETED','RECUSED','CANCELLED')) = (terminal_reason_code IS NOT NULL)"}
      - {name: action_review_assignments_time_check, expression: "due_at > created_at AND updated_at >= created_at AND (next_assignment_scan_at IS NULL OR next_assignment_scan_at >= created_at) AND (claimed_at IS NULL OR claimed_at >= created_at) AND (terminal_at IS NULL OR terminal_at >= created_at)"}
    indexes:
      - {name: action_review_assignments_one_live_slot_idx, method: btree, columns_or_expression: "proposal_id, proposal_version, slot_id", predicate: "state IN ('VACANT','ASSIGNED','IN_PROGRESS')", unique: true}
      - {name: action_review_assignments_reviewer_queue_idx, method: btree, columns_or_expression: "reviewer_id, state, due_at, id", predicate: "state IN ('ASSIGNED','IN_PROGRESS')", unique: false}
      - {name: action_review_assignments_vacancy_idx, method: btree, columns_or_expression: "next_assignment_scan_at, due_at, proposal_id, proposal_version, slot_ordinal, id", predicate: "state = 'VACANT'", unique: false}
      - {name: action_review_assignments_proposal_order_idx, method: btree, columns_or_expression: "proposal_id, proposal_version, slot_ordinal, assignment_generation, id", predicate: null, unique: false}
