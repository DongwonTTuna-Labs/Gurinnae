  function_body_rules:
    - Every identifier is static; dynamic SQL, SET ROLE, caller-controlled relation names and unqualified names are forbidden.
    - Canonical byte equality is checked before digest equality; a JSONB value that parses to the same semantic object but has different canonical bytes is rejected.
    - Validator functions reject unknown keys, missing keys, wrong JSON scalar types, duplicate-set semantics, noncanonical array order and out-of-range values.
    - PUBLIC and every runtime role have no EXECUTE on support or trigger functions.

