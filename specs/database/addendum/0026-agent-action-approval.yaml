resolved_design_decisions:
  - id: D0026-001
    decision: "The approval and execution HTTP surface has thirteen operations: the existing eleven operations, withdrawActionProposal, and withdrawActionDecision. DESIGN.md ten-operation wording and owner-addendum omission of claimActionReview are retired. There is no bulk-decision operation."
  - id: D0026-002
    decision: READY_FOR_REVIEW is not persisted. previewActionDraft records one immutable preview on the DRAFT version; submitActionForReview moves DRAFT directly to PENDING_QUORUM. The stale READY_FOR_REVIEW prose is retired.
  - id: D0026-003
    decision: approval_digest is the sole common ApprovalBindingV1 subject digest. The ambiguous decision_digest alias is removed. Decision kind, reason, actor, assignment, assurance, request and reauthentication are bound only by the separate immutable decision_receipt_digest.
  - id: D0026-004
    decision: action execution aggregate state is stored in ops.in_flight_effects; the detailed QUEUED through provider-observation lifecycle is stored in ops.execution_attempts.
  - id: D0026-005
    decision: SUCCEEDED is immutable. Compensation is a new ActionProposal with origin_kind COMPENSATION and compensates_execution_id pointing to the prior effect.
  - id: D0026-006
    decision: One execution authorization row exists per authorized generation. A POLICY_BLOCKED result has an effect and receipt but no authorization or attempt and is terminal for those bound bytes. A changed policy, budget, consent, suppression, rights, activation, provider or recipient fact requires a new proposal version; retryActionExecution cannot reopen POLICY_BLOCKED.
  - id: D0026-007
    decision: One execution attempt row exists per authorized generation. Lease reclamation updates its fence and appends a claim receipt; an actual dispatch receives a unique dispatch_ordinal from one through three.
  - id: D0026-008
    decision: "Budget accounting is an append-only delta ledger. Every paid reservation has exactly three applicable limit rows and six ledger cells: environment, provider and case crossed with day and month."
  - id: D0026-009
    decision: "The approval cycle identity is exactly (proposal_id, proposal_version). An intermediate APPROVE appends an immutable decision and action.decision_recorded event while the version remains PENDING_QUORUM; it is a same-state fact append, not a second approval cycle."
  - id: D0026-010
    decision: "RECUSE always commits its immutable decision and terminalizes the conflicted assignment. The same SERIALIZABLE transaction inserts generation+1 as ASSIGNED when exactly one eligible replacement exists, otherwise as a durable reviewer-null VACANT slot with ACTION_QUORUM_UNAVAILABLE. A later deterministic vacancy-fill transaction terminalizes VACANT and inserts the next generation; recusal never rolls back merely because staffing is unavailable."
  - id: D0026-011
    decision: "POLICY_BLOCKED is already terminal and never expires into another state. An unclaimed QUEUED effect whose authorization expires transitions to EXPIRED with zero dispatch and an immutable expiry receipt; no terminal effect is reopened."
  - id: D0026-012
    decision: "ApprovalBindingV1 is stored as exact canonical bytes plus closed JSONB and generated digest. Its physical columns include attachment, suppression and not-before bindings; parent proposal fields are commit-time equalities, not caller-trusted duplicates."
  - id: D0026-013
    decision: "ActionDecisionReceiptBindingV1 is an immutable canonical byte record. Assignment generation, slot kind, reason digest, optional conflict declaration, actor, assurance and decided-at are decision facts and never enter the common approval digest."
  - id: D0026-014
    decision: "The physical counted-decision bound is 1..16 because 0029 funding disclosure adds conditional oversight and board slots. The exact quorum cardinality remains policy-derived for each action; unused capacity never counts as quorum."
  - id: D0026-015
    decision: "All runtime writes use exact SECURITY DEFINER owner routines with fixed search_path and typed composite inputs. Runtime roles have no direct INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES or TRIGGER privilege on the ten relations."
  - id: D0026-016
    decision: "CORRECTION is not an ActionKind. COMMERCIAL_CONTROL is the seventeenth closed ActionKind; correction remains governed through the correction and publication-gate machines."
  - id: D0026-017
    decision: "withdrawActionProposal terminalizes DRAFT or PENDING_QUORUM as WITHDRAWN and cancels or vacancies every live assignment in one SERIALIZABLE transaction. withdrawActionDecision appends an APPROVAL_WITHDRAWAL record only for an unwithdrawn APPROVE while the version remains PENDING_QUORUM, removes it from the counted predicate, and opens the same slot as a new ASSIGNED or VACANT generation. Final authorization, terminal proposal state, rejection, requested changes, recusal and non-APPROVE decisions are not withdrawable."
  - id: D0026-018
    decision: "ActionApprovalSubjectViewV1 is the only approval preview subject. It is closed, encrypted at rest, canonical-digest bound to ApprovalBindingV1, and presents plain-language reason, facts, uncertainty, contrary evidence, provenance and investigation history, before/after effect, exact recipients/content/attachments, risk, maximum cost, expiry, reversibility, quorum, conflict, assurance and next action. Raw payload JSON, UUIDs and digests are secondary technical detail only."
  - id: D0026-019
    decision: "A known mixed provider outcome is PARTIALLY_SUCCEEDED and terminal with an exact child-effect/receipt membership set; an unknown or possibly accepted outcome is RECONCILIATION_REQUIRED and nonterminal. Neither is flattened to SUCCEEDED, FAILED or generic success, and neither is blindly retried."
  - id: D0026-020
    decision: "Every decision receipt binds exact request, actor assertion, action digest, idempotency identity, assignment version/generation, common approval digest, conflict/quorum snapshots, assurance and bounded step-up receipt. The executor receives only a persisted ExecutionAuthorization and never browser credentials or raw step-up material."

operation_surface_contract:
  exact_http_operation_count: 13
  exact_operations:
    - {operation_id: listActionApprovalQueue, method: GET, path: /v1/internal/action-proposals, kind: QUERY}
    - {operation_id: createActionProposal, method: POST, path: /v1/internal/action-proposals, kind: COMMAND}
    - {operation_id: getActionProposal, method: GET, path: "/v1/internal/action-proposals/{proposalId}", kind: QUERY}
    - {operation_id: updateActionDraft, method: PATCH, path: "/v1/internal/action-proposals/{proposalId}/draft", kind: COMMAND}
    - {operation_id: previewActionDraft, method: POST, path: "/v1/internal/action-proposals/{proposalId}:preview", kind: COMMAND}
    - {operation_id: submitActionForReview, method: POST, path: "/v1/internal/action-proposals/{proposalId}:submit-review", kind: COMMAND}
    - {operation_id: claimActionReview, method: POST, path: "/v1/internal/action-proposals/{proposalId}:claim-review", kind: COMMAND}
    - {operation_id: submitActionDecision, method: POST, path: "/v1/internal/action-proposals/{proposalId}:decide", kind: COMMAND}
    - {operation_id: withdrawActionProposal, method: POST, path: "/v1/internal/action-proposals/{proposalId}:withdraw", kind: COMMAND}
    - {operation_id: withdrawActionDecision, method: POST, path: "/v1/internal/action-proposals/{proposalId}/decisions/{decisionId}:withdraw", kind: COMMAND}
    - {operation_id: getActionExecutionReceipt, method: GET, path: "/v1/internal/action-executions/{executionId}/receipt", kind: QUERY}
    - {operation_id: cancelActionExecution, method: POST, path: "/v1/internal/action-executions/{executionId}:cancel", kind: COMMAND}
    - {operation_id: retryActionExecution, method: POST, path: "/v1/internal/action-executions/{executionId}:retry", kind: COMMAND}
  no_bulk_or_side_door:
    - "No batch, queue-level, wildcard, filter-selected, select-all or implicit decision endpoint exists. Each command binds one proposal ID, one proposal version, one assignment/decision where applicable, and one Idempotency-Key."
    - "Governed base commands and every private executor require a current persisted execution authorization. No event consumer, worker, UI route, direct legacy command or generic materializer may reinterpret quorum or create the effect."
    - "submitActionDecision has exactly APPROVE, REJECT, CHANGES_REQUIRED and RECUSE request variants. APPROVAL_WITHDRAWAL is accepted only by withdrawActionDecision and never appears as a fifth decision control."
  authoritative_form_fields:
    server_selected: [proposalId, actionKind, assignmentId, expectedProposalVersion, expectedAssignmentVersion, expectedApprovalDigest, approvalSubjectDigest]
    human_entered: [decisionKind, reasonCode, reason, changeTasks, conflictDeclarationId]
    rule: "Server-selected fields are rendered read-only from one loaded immutable subject and are rejected if supplied from a free-form or stale browser field."

withdrawal_contract:
  proposal:
    operation: withdrawActionProposal
    actor: proposal creator or current proposal owner with actions.propose and exact object scope
    assurance: ACTIVE_SESSION
    from_states: [DRAFT, PENDING_QUORUM]
    to_state: WITHDRAWN
    atomic_writes: [idempotency receipt, proposal-version terminal transition, every live assignment cancellation, proposal head receipt, audit, action.proposal_withdrawn.v1 outbox]
    race: "Locks the complete proposal/version/assignment/decision graph. If a final decision, rejection, changes-required, expiry, supersession or execution effect committed first, return ACTION_DECISION_CLOSED with zero writes."
  counted_approval:
    operation: withdrawActionDecision
    actor: exact original human APPROVE actor
    assurance: "the same or stronger assurance required for the original APPROVE; STEP_UP is re-performed for a STEP_UP-bound approval"
    preconditions: [proposal remains PENDING_QUORUM, target recordKind is DECISION, target decisionKind is APPROVE, target receipt has no withdrawal record, no execution effect exists]
    atomic_writes: [idempotency receipt, one APPROVAL_WITHDRAWAL decision record, same-slot ASSIGNED-or-VACANT next generation, proposal aggregate-version increment, audit, action.decision_withdrawn.v1 outbox]
    counted_predicate_effect: "An APPROVE counts only when no APPROVAL_WITHDRAWAL row references its decision ID. The original decision and receipt remain immutable and visible."
    race: "Uses the final-decision lock set. Whichever of final quorum or withdrawal commits first wins; the loser returns ACTION_DECISION_CLOSED and writes zero rows."
  after_authorization: "Withdrawal is forbidden after execution authorization or POLICY_BLOCKED receipt creation. Only cancellation, reconciliation, a new compensation proposal, or a new superseding proposal version is allowed."

approval_subject_contract:
  schema: ActionApprovalSubjectViewV1
  storage: "Exact GURINE_CANONICAL_JSON_V1 bytes are encrypted as FieldEncryptionEnvelope<ActionApprovalSubjectViewV1>; only its SHA-256 and non-sensitive routing facts are plaintext."
  additional_properties: false
  required_semantic_sections:
    - {id: summary, facts: [plainLanguageTitle, proposedAction, whyNow, expectedOutcome]}
    - {id: evidence, facts: [supportingEvidenceWithProvenanceAndLocator, contraryEvidenceWithProvenanceAndLocator, materialUnknowns, confidenceAndLimitations, investigationHistory]}
    - {id: effect, facts: [targetIdentity, currentState, proposedState, likelyEffect, reversibility, rollbackOrCompensationPath]}
    - {id: destination, facts: [recipientDisplayName, maskedDestination, recipientRole, channel, locale, senderIdentity, providerAccount, consentScope, suppressionState]}
    - {id: exact_content, facts: [renderedSubject, renderedBody, orderedAttachmentNameMediaTypeSizeDigestAndSafeView, exactRenderedBytesDigest]}
    - {id: governance, facts: [riskClassAndReasons, maximumCostAndCurrency, notBefore, expiry, policyBlockers, conflictAndRecusal, requiredAssurance, quorumSlotsAndCurrentStatus]}
    - {id: decision_help, facts: [effectOfApprove, effectOfReject, effectOfChangesRequired, effectOfRecuse, nextOwnerAndNextAction]}
  action_kind_closure: "Every one of the seventeen ActionKind variants has a closed typed subject branch; a generic map, opaque payload, raw JSON dump or schema-field-name UI is invalid."
  digest_binding: "preview_digest = approvalSubjectDigest = SHA256(exact canonical plaintext bytes before encryption); ApprovalBindingV1 binds previewId and approvalSubjectDigest."
  privacy: "Names and destinations are disclosed only to an authorized assigned reviewer. Destinations are masked in the default view, exact values require an audited reveal, and no raw destination enters logs, events, analytics or receipt payloads."
  cognitive_and_dark_pattern_rules:
    - "The default view leads with plain-language consequence, uncertainty and recipient/effect facts; UUIDs, enum tokens and digests are collapsed technical evidence."
    - "There is no selected/default/recommended decision, no countdown urgency copy, no approve-colored dominance, no misleading success promise and no approve-on-enter shortcut."
    - "APPROVE, REJECT, CHANGES_REQUIRED and RECUSE are distinct labelled controls. The only dominant action after a decision is chosen is Submit this decision; it never changes the selected variant."
    - "No decision is accepted until the exact subject is fully loaded, current, digest-verified and keyboard/screen-reader reachable. Partial, stale, error or reauth-required views submit zero mutation."

quorum_and_independence_contract:
  policy_version: action-quorum.v2
  physical_max_slots: 16
  counted_predicate: "record_kind = 'DECISION' AND decision_kind = 'APPROVE' AND no APPROVAL_WITHDRAWAL references the decision AND assignment generation is the current non-vacant generation AND every final-transaction reauthorization predicate passes"
  one_actor_rule: "One human actor may author at most one substantive decision for one proposal version and may satisfy at most one slot. Service, system and agent identities satisfy zero human slots."
  mandatory_exclusions: [proposal_creator, every_version_editor, previewer, target_subject, communication_recipients, endpoint_verifier, role_grant_subject, executor_human_if_any, every_declared_or_derived_conflicted_actor, every_recused_or_withdrawn_approval_actor, every_actor_used_by_another_slot]
  final_transaction_reauthorization: [account_active, role_current, actions.review, slot_capability, object_scope, assurance_current, actor_assertion_exact, conflict_snapshot_current_and_clear_or_disclosed, exclusion_set_equal, approval_digest_equal, proposal_and_target_version_current, no_withdrawal, no_vacant_required_slot]
  assurance_order: [ACTIVE_SESSION, RECENT_SESSION, STEP_UP]
  required_assurance: "max(decision-variant policy, action-kind policy, target policy, slot policy); client risk labels cannot lower it"
  classifiers:
    communication_classification:
      trusted_inputs: [purpose, recipientCount, contentClassification, targetType, targetVersion, consentDigest, suppressionDigest, recipientSetDigest]
      direct_discretionary_limit: 50
      rules:
        - {when: "purpose IN ('SYSTEM_TRANSACTIONAL','SUBSCRIPTION_UPDATE') AND contentClassification <> 'RESTRICTED'", purpose_class: PUBLIC_SERVICE_OR_TRANSACTIONAL}
        - {when: "purpose IN ('DISCRETIONARY_EXTERNAL','INTERNAL_ACTION_REQUEST') OR contentClassification = 'RESTRICTED'", purpose_class: DISCRETIONARY_OR_RESTRICTED}
        - {when: "recipientCount = 1", audience_class: SINGLE}
        - {when: "recipientCount BETWEEN 2 AND 50", audience_class: MULTI_RECIPIENT}
        - {when: "recipientCount > 50", result: INVALID_FOR_ACTION_PROPOSAL, error: ACTION_REVIEW_SCOPE_TOO_LARGE}
      slots: "Always content_approval; add authorization_approval for DISCRETIONARY_OR_RESTRICTED; add target_domain_approval for MULTI_RECIPIENT. The resulting slot union is sorted, unique and maximum three."
      bulk_rule: "System transactional and subscription fanout above 50 is executed only from a separately approved template/publication plus per-recipient current authorization and suppression fences. It is not a blanket COMMUNICATION ActionProposal."
    kill_switch_breadth:
      trusted_input_schema: KillSwitchScopeV1
      narrow: "exactly one CASE, SOURCE, QUEUE or PROVIDER_CONFIG ID, no wildcard, one environment and affectedObjectCount = 1"
      broad: "ENVIRONMENT, SERVICE, CHANNEL, ALL_EGRESS, ALL_INGEST, wildcard or affectedObjectCount > 1"
      invalid: "unknown scope kind, free-form target, mixed environment or unbounded count"
      slots: {NARROW: [operator], BROAD: [operator_a, operator_b]}
    retraction_risk:
      trusted_inputs: [currentPublicationRevision, classification, activeLegalHold, openCorrectionOrAppeal, rightsState, officialResponsePresent, publicReachClass]
      high: "classification IN ('RESTRICTED','HIGH_RISK') OR activeLegalHold OR openCorrectionOrAppeal OR rightsState <> 'ALLOW' OR officialResponsePresent OR publicReachClass = 'MATERIAL'"
      slots: "editor plus publisher; add legal_review exactly when high = true"
    funding_disclosure:
      trusted_source: specs/database/addendum/0029-funding-disclosure.yaml
      base_slots: [funding_preparer, funding_publisher]
      conditional_slots: [oversight_reviewer when requires_oversight_review, board_approver when requires_board_approval]
      exact_binding: [requires_oversight_review, requires_board_approval, requires_enhanced_public_disclosure, has_related_party_gate, conditional_gate_set_digest, independent_case_review_set_digest]
      rule: "Spurious nonrequired conditional slots fail; required related-case reviews are distinct prerequisite receipts and do not consume same-proposal slots."
  recusal_and_vacancy:
    recusal_commit: "RECUSE never counts and always commits its receipt before staffing outcome is returned."
    exactly_one_replacement: "If one deterministic eligible candidate exists, insert ASSIGNED at prior generation + 1. Zero candidates inserts VACANT at prior generation + 1. More than one unresolved winner is an internal invariant error with rollback before the recusal record is attempted; candidate ordering must resolve deterministically."
    vacant_slot: "reviewer_id is NULL, conflict snapshot uses the no-reviewer sentinel, blocking_reason_code is ACTION_QUORUM_UNAVAILABLE, and the proposal stays PENDING_QUORUM with no execution."
    fill: "fill_action_review_vacancy_v1 terminalizes VACANT as CANCELLED/REPLACEMENT_ASSIGNED and inserts exactly one ASSIGNED next generation; it cannot change content, approval digest, slot, exclusion set or prior receipts."

global_contract:
  owner_role: gurine_migrator
  schema: ops
  transaction_time_source: clock_timestamp()
  uuid_source: gen_random_uuid()
  digest_sql_type: "character(64)"
  digest_check: "VALUE ~ '^[0-9a-f]{64}$'"
  money_sql_type: "numeric(18,6)"
  currency_check: "VALUE ~ '^[A-Z]{3}$'"
  json_rule: JSONB is permitted only for the declared closed logical type and maps through sqlx::types::Json<T>; serde_json::Value is forbidden.
  canonical_json_rule: "Every digest-bearing JSONB value is stored beside exact GURINE_CANONICAL_JSON_V1 UTF-8 bytea; convert_from(bytes,'UTF8')::jsonb equals the JSONB, the closed validator passes, and the digest is GENERATED from extensions.digest(bytes,'sha256')."
  encrypted_rule: Sensitive canonical ActionPayloadV1, ActionRationaleV1 and execution request bytes use the v13 FieldEncryptionEnvelope in bytea; plaintext is never persisted.
  no_provider_idempotency_digest: "36e6cda205ff7692fef24261d22e17e282ecc3bba7f5d04f41310839d90e3e74 = SHA256(UTF8('GURINE:NO_PROVIDER:V1'))"
  no_provider_configuration_digest: "8682eb9449f61b9d8c9e36d481638e3ffafcd9e66b490d42afde6fc847560fde = SHA256(UTF8('GURINE:NO_PROVIDER_CONFIG:V1'))"
  no_budget_reservation_digest: "cd12c434cfd58a9f3a3e0222f236dcc3ea4f1f24f78ea74224dd110bebf61bde = SHA256(UTF8('GURINE:NO_BUDGET_RESERVATION:V1'))"
  no_reviewer_role_snapshot_digest: "a987005ba2dc00498702eea9d50ed59c6732bb825059d52b491be1a37a2fddd6 = SHA256(UTF8('GURINE:NO_REVIEWER_ROLE_SNAPSHOT:V1'))"
  no_reviewer_conflict_snapshot_digest: "e78bfc84252d3d52a9005d38ed5e102e334240826621d6e5570ff3ce42b94b21 = SHA256(UTF8('GURINE:NO_REVIEWER_CONFLICT_SNAPSHOT:V1'))"
  direct_network_in_transaction: forbidden
  aggregate_outbox_version:
    action_proposal: ops.action_proposals.aggregate_version
    action_review_assignment: ops.action_review_assignments.version
    action_execution: ops.in_flight_effects.state_version
    budget_reservation: ops.budget_reservations.version
  default_privileges:
    - "ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator IN SCHEMA ops REVOKE ALL ON TABLES FROM PUBLIC"
    - "ALTER DEFAULT PRIVILEGES FOR ROLE gurine_migrator REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC"
    - Runtime roles receive only exact read-column grants and exact regprocedure EXECUTE grants below; no GRANT ON ALL TABLES or GRANT ON ALL FUNCTIONS is permitted.
    - "Every runtime role is denied direct INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES and TRIGGER on all ten relations; owner routines are the only mutation path."
  denied_runtime_roles:
    - gurine_public_api
    - gurine_submission_api
    - gurine_identity_api
    - gurine_ingest_worker
    - gurine_public_projector
    - gurine_document_extractor
  global_lock_order:
    - ops.action_proposals by id
    - ops.action_proposal_versions by proposal_id and version
    - ops.action_review_assignments by proposal_id, proposal_version, slot_ordinal, assignment_generation, id
    - ops.action_decisions by proposal_id, proposal_version, created_at, id
    - ops.in_flight_effects by id
    - ops.execution_authorizations by execution_id and generation
    - ops.budget_limits by scope and id
    - ops.budget_reservations by id
    - ops.budget_reservation_ledger_entries by ledger_scope_kind, ledger_scope_id, window_kind, window_start, id
    - ops.execution_attempts by execution_id and generation
    - ops.execution_receipts by execution_id and receipt_sequence
  sole_final_approval_effect_owner:
    operation: submitActionDecision
    owner: control-api.submitActionDecision.final-approve
    atomic_transition_group: gurine.command.submitActionDecision.v1
    serializable_lock_set: [ops.idempotency_keys, ops.action_proposals, ops.action_proposal_versions, ops.action_review_assignments, ops.action_decisions, ops.in_flight_effects, ops.execution_authorizations, ops.budget_limits, ops.budget_reservations, ops.budget_reservation_ledger_entries, ops.execution_attempts, ops.execution_receipts, ops.audit_events, ops.outbox]
    policy_pass_exact_writes: "one terminal APPROVE decision, one completed assignment, one APPROVED proposal version, one ACTION_EXECUTION effect, optional one reservation plus exactly six ledger cells, one generation-one authorization, one generation-one QUEUED attempt, one initial receipt, one audit, and declared outbox rows"
    policy_block_exact_writes: "one terminal APPROVE decision, one completed assignment, one APPROVED proposal version, one POLICY_BLOCKED effect, no authorization, no attempt, one POLICY_BLOCKED receipt, one audit, and declared outbox rows"
    rollback: any missing, duplicate, stale, ineligible, conflicted, unauthorized, malformed or fence-inconsistent row rolls back the whole group
  cycle_closure:
    - action_proposals.current_version to action_proposal_versions is DEFERRABLE INITIALLY DEFERRED while versions reference their proposal normally.
    - A final APPROVE decision, in-flight effect, authorization and first attempt use preallocated UUIDs and deferred FKs in one SERIALIZABLE transaction.
    - BudgetReservation references its effect; ExecutionAuthorization may reference that reservation. Neither reservation nor authorization is referenced back by a mandatory immediate FK.
    - Receipt chains use a deferred self-FK plus a deferred constraint trigger that requires sequence n to reference sequence n-1.
  exactly_once:
    - effect_key_digest is globally unique and identifies the business effect independently of HTTP retries and worker leases.
    - provider idempotency identity is unique on provider_config_id plus provider_idempotency_key_sha256 at the effect row and is unchanged across generations.
    - one authorization and one attempt exist per execution generation; one dispatch ordinal exists per actual side-effect dispatch and is limited to 1..3.
    - every state mutation appends exactly one audit event and immutable receipt; declared events are enqueued in the same transaction.
    - ambiguous possible acceptance always becomes RECONCILIATION_REQUIRED and cannot generate a retry authorization.
    - a known mixed child outcome becomes PARTIALLY_SUCCEEDED with one exact sorted child-effect/receipt membership digest; it is never represented as generic success or failure.
    - terminal effect, decision, authorization, receipt and budget ledger history is never rewritten.
  state_projection:
    POLICY_BLOCKED: "terminal policy result; no execution_authorization or execution_attempt row exists"
    QUEUED: "current generation attempt_state = QUEUED"
    RUNNING: "current generation attempt_state IN (CLAIMED, DISPATCHING, PROVIDER_ACCEPTED)"
    RETRYABLE_FAILED: "current generation attempt_state = RETRYABLE_FAILED"
    CANCEL_REQUESTED: "current generation attempt_state = CANCEL_REQUESTED"
    RECONCILIATION_REQUIRED: "current generation attempt_state = RECONCILIATION_REQUIRED"
    SUCCEEDED: "current generation attempt_state = SUCCEEDED"
    PARTIALLY_SUCCEEDED: "current generation attempt_state = PARTIALLY_SUCCEEDED and exact downstream membership proves at least one succeeded and at least one non-succeeded terminal child"
    PERMANENT_FAILED: "current generation attempt_state = PERMANENT_FAILED"
    CANCELLED: "current generation attempt_state = CANCELLED"
    EXPIRED: "no attempt, or an unclaimed QUEUED attempt terminalized as CANCELLED by the same expiry receipt"
  budget_scope_and_window_policy:
    scope_encoding:
      ENVIRONMENT: "ops.budget_limits.scope = 'ENVIRONMENT:' || deployment_environment"
      PROVIDER: "ops.budget_limits.scope = 'PROVIDER:' || provider_config_id::text"
      CASE: "ops.budget_limits.scope = 'CASE:' || case_id::text"
    required_scope_rows: "exactly one current row for each of ENVIRONMENT, PROVIDER and CASE; missing, duplicate, currency-mismatched or unreadable scope blocks reservation"
    timezone: UTC
    DAY: "[date_trunc('day', occurred_at AT TIME ZONE 'UTC') AT TIME ZONE 'UTC', plus interval '1 day')"
    MONTH: "[date_trunc('month', occurred_at AT TIME ZONE 'UTC') AT TIME ZONE 'UTC', plus interval '1 month')"
    limit_column: "DAY uses daily_limit; MONTH uses monthly_limit from the same locked ops.budget_limits row"
  required_support_objects:
    - ops.reject_mutation() for fully immutable rows
    - ops.guard_action_proposal_update() for current-version and aggregate-version increments
    - ops.guard_action_proposal_version_update() for preview-once and closed lifecycle transitions
    - ops.validate_action_origin_target_at_commit() DEFERRABLE CONSTRAINT TRIGGER for the closed polymorphic origin and target catalog
    - ops.validate_action_approval_detail_at_commit() DEFERRABLE CONSTRAINT TRIGGER for exact one-of-seventeen typed child, wrapper bytes and static source bindings
    - ops.guard_action_assignment_update() for assignment CAS and terminal immutability
    - ops.validate_action_quorum_at_commit() DEFERRABLE CONSTRAINT TRIGGER including sorted-unique roles, change-task IDs and counted decision arrays
    - ops.guard_in_flight_effect_update() for generation, fence, attempt count and terminal immutability
    - ops.guard_execution_attempt_update() for lease/fence and aggregate-to-attempt state mapping
    - ops.validate_execution_receipt_chain_at_commit() DEFERRABLE CONSTRAINT TRIGGER including cost_event_ids existence and ordering
    - ops.validate_execution_generation_at_commit() DEFERRABLE CONSTRAINT TRIGGER
    - ops.guard_budget_reservation_update() for closed lifecycle and terminal immutability
    - ops.validate_budget_transition_at_commit() DEFERRABLE CONSTRAINT TRIGGER
    - ops.validate_polymorphic_effect_source_at_commit() DEFERRABLE CONSTRAINT TRIGGER

