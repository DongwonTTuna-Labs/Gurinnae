      - {role: gurine_analysis_worker, privileges: [SELECT], columns: [id, reservation_key_digest, reservation_digest, reservation_source_kind, effect_id, effect_generation, job_id, attempt, deployment_environment, case_id, provider_candidate_id, provider_config_id, provider_config_version, provider_configuration_digest, pricing_version, reserved_amount, currency, ledger_scope_digest, ledger_cell_count, state, version, settled_amount, exposure_amount, provider_usage_digest, billed_cost_digest, no_bill_proof_digest, reconciliation_reason_code, reconciliation_evidence_digest, incident_id, cost_event_id, last_transition_sequence, last_transition_id, last_transition_digest, expires_at, terminal_at, created_at, updated_at]}
      - {role: gurine_notification_worker, privileges: [SELECT], columns: [id, reservation_digest, effect_id, effect_generation, provider_candidate_id, reserved_amount, currency, state, version, expires_at, terminal_at]}
