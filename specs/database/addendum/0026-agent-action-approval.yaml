      - {name: action_decisions_quorum_execution_check, expression: "(quorum_satisfied_after AND decision_kind = 'APPROVE' AND resulting_proposal_state = 'APPROVED') = (execution_id IS NOT NULL)"}
      - {name: action_decisions_quorum_result_check, expression: "quorum_satisfied_after = (decision_kind = 'APPROVE' AND resulting_proposal_state = 'APPROVED')"}
