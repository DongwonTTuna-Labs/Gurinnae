      - {role: gurine_workflow_worker, privileges: [SELECT], columns: [id, proposal_id, proposal_version, approval_digest, assignment_generation, slot_id, slot_ordinal, required_capability, approve_assurance, reviewer_id, conflict_snapshot_digest, quorum_plan_digest, assignment_digest, state, version, due_at, terminal_at, updated_at]}
      - {role: gurine_notification_worker, privileges: [SELECT], columns: [id, proposal_id, proposal_version, slot_id, slot_ordinal, required_capability, reviewer_id, state, due_at, updated_at]}
      - {role: gurine_scheduler, privileges: [SELECT], columns: [id, proposal_id, proposal_version, reviewer_id, state, version, due_at]}
      - {role: gurine_auditor, privileges: [SELECT], columns: ALL}
    rls: {enabled: false, forced: false, policies: [], rationale: "queue reads are filtered by persisted reviewer/owner/audit scope in the typed query; runtime roles do not expose direct SQL"}
    mutability:
      mode: GUARDED_ASSIGNMENT_LIFECYCLE
      allowed_updates: [state, version, claimed_at, terminal_at, terminal_reason_code, last_receipt_digest, last_audit_event_id, updated_at]
      delete: FORBIDDEN_UNTIL_RETENTION_GRAPH_DELETE
      immutable_trigger: ops.guard_action_assignment_update()
      immutable_columns: [id, proposal_id, proposal_version, approval_digest, assignment_generation, slot_id, slot_ordinal, required_capability, approve_assurance, allowed_role_codes, reviewer_id, reviewer_role_snapshot_digest, eligibility_snapshot_digest, conflict_snapshot_id, conflict_snapshot_digest, conflict_target_type, conflict_target_id, conflict_target_version, conflict_target_digest, conflict_evaluation_state, conflict_valid_until, excluded_actor_ids, exclusion_set_digest, quorum_plan_digest, assignment_digest, blocking_reason_code, next_assignment_scan_at, replacement_of_assignment_id, assigned_by, due_at]
    concurrency:
      version: expectedAssignmentVersion must equal version and every edge increments version exactly once
      digest: approval_digest must equal the immutable proposal-version approval_digest
      lock_order: "proposal/version, then assignments ordered by slot_ordinal, assignment_generation, id"
      independence: "unique non-null proposal/version/reviewer across all states means a recused or withdrawn-approval actor can never occupy another slot; reviewer-null VACANT rows cannot count"
    retention:
      record_class: ACTION_APPROVAL_RECORD
      period: "same as owning proposal version"
      start: "owning proposal version terminal_at"
      hold_behavior: "inherits every hold that pauses the proposal graph"
      delete_mode: "reverse-FK hard delete after decisions and execution graph are eligible"
    repository_roundtrip:
      rows: [ActionReviewAssignmentRow]
      typed_rust_identity: "gurine_domain::action::ActionReviewAssignmentId(id,version)"
      idempotent_readback: "claim replay returns the stored ActionReviewClaimedReceiptV1; a different actor/version/digest is a conflict"
    ordering:
      reviewer_queue: "due_at ASC, id ASC"
      proposal_slots: "slot_ordinal ASC, assignment_generation ASC, id ASC"
    creation_order: 3
    migration_step: 30

