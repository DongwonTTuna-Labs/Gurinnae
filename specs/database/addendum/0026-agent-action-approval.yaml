self_checks:
  - id: table-set
    assertion: "table_count == 27 and set(tables[].relation) == set(exact_relations)"
  - id: table-shape
    assertion: "every table has the required owner, component, domain, columns, PK, FKs, uniques, checks, indexes, grants, RLS, mutability, concurrency, retention, repository roundtrip, ordering and migration step"
  - id: column-shape
    assertion: "every column has name, sql_type, nullable and default; names are unique per table"
  - id: digest-shape
    assertion: "every character(64) digest column has a lowercase-hex CHECK or is covered by a named all-digest CHECK"
  - id: action-state-set
    assertion: "proposal and aggregate execution state CHECK sets equal the latest addendum-state-machines sets; attempt state is the explicit detailed split"
  - id: approval-cycle
    assertion: "approval_cycle_id is exactly (proposal_id,proposal_version); no implicit second cycle exists on one version"
  - id: preview-one
    assertion: "each proposal version has zero or one all-or-none immutable preview and submit-review requires it"
  - id: quorum
    assertion: "one actor appears once per proposal version, one active/completed assignment fills a slot, APPROVE alone counts, and final quorum creates at most one execution effect"
  - id: outbox-version
    assertion: "every proposal mutation increments action_proposals.aggregate_version, so multiple action.decision_recorded events on one content version do not collide with the v13 outbox unique key"
  - id: dispatch-max-three
    assertion: "count(execution_attempts where execution_id=X and dispatch_ordinal is not null) <= 3 and ordinals are unique 1..3"
  - id: retry-stability
    assertion: "every SAFE_RETRY generation preserves proposal version, approval digest, target request digest, rendered digest, executor, provider and provider idempotency key"
  - id: receipt-chain
    assertion: "execution receipt sequences are gapless, prior digest references n-1, exactly one receipt exists per state version mutation, and terminal receipt state equals effect state"
  - id: budget-six-cells
    assertion: "each budget transition has exactly ENVIRONMENT, PROVIDER and CASE crossed with DAY and MONTH, ordinals 1..6, one currency and one transition digest"
  - id: budget-formula
    assertion: "available_after equals limit minus settled balance minus active reservation balance; unknown usage/price never creates zero settlement"
  - id: immutable-denial
    assertion: "UPDATE and DELETE fail for decisions, authorizations, receipts and ledger entries under every runtime role and via owner mutation triggers"
  - id: privilege-negative
    assertion: "PUBLIC and every denied_runtime_role have zero table privilege on all ten relations"
  - id: repository-roundtrip
    assertion: "insert then typed read preserves UUID, enum, decimal, UTC timestamp, digest, nullable and encrypted closed payload fields exactly; missing/duplicate rows are typed failures"
  - id: ordering
    assertion: "every page/history/claim query uses its full declared tie tuple and cursor binds filters, sort and as-of time"
  - id: no-cascade
    assertion: "no decision, authorization, attempt, receipt, reservation, ledger or effect FK uses ON DELETE CASCADE"

