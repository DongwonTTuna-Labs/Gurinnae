      - {name: action_decisions_assignment_version_check, expression: "proposal_version > 0 AND assignment_version > 0 AND assignment_generation > 0 AND length(btrim(slot_kind)) BETWEEN 1 AND 100"}
      - {name: action_decisions_time_check, expression: "created_at = decided_at"}
