      trigger:
        path: request_context.review_console_session.action_authorization_state
        op: eq
        value: REQUIRED
      visible: true
      enabled: false
      safe_action: AUTHORIZE_EXACT_HANDLER_DIGEST
    - state: submitting
      trigger:
        path: runtime_handlers.handle__int_002__decide_journey_handoff__handoff.phase
        op: in
        value:
        - CLAIMED
        - DISPATCHING
      visible: true
      enabled: false
      safe_action: KEEP_IDEMPOTENCY_KEY_AND_WAIT
    - state: receipt
      trigger:
        path: action_result.decide_journey_handoff__handoff.validated_receipt
        op: validated
      visible: true
      enabled: false
      safe_action: FOCUS_OWNED_RECEIPT_DESTINATION
    - state: partial-failure
      trigger:
        path: runtime_handlers.handle__int_002__decide_journey_handoff__handoff.effect_certainty
        op: eq
        value: MAY_EXIST
      visible: true
      enabled: false
      safe_action: RECONCILE_BEFORE_ANY_RETRY
    - state: terminal
      trigger:
        path: runtime_handlers.handle__int_002__decide_journey_handoff__handoff.phase
        op: in
        value:
        - CANCELLED
        - REJECTED
        - EXPIRED
      visible: false
      enabled: false
      safe_action: SHOW_TERMINAL_REASON_AND_RECEIPT
    receipt_source: action_result.decide_journey_handoff__handoff.validated_receipt
    handler_id: handle__int_002__decide_journey_handoff__handoff
    success_destination:
      screen_id: INT-002
      section_id: handoff
      route: /internal/my-work
      required_route_bindings: {}
      section_heading_test_id: int_002__section__handoff
      receipt_focus_test_id: int_002__receipt__handle__int_002__decide_journey_handoff__handoff__heading
      receipt_anchor: action-receipt-handle__int_002__decide_journey_handoff__handoff
      history: REPLACE_STATE_AFTER_RECEIPT
    failure_focus_test_id: int_002__command_error__decide_journey_handoff__handoff
    implementation_status: OPEN_IMPLEMENTATION
  receipt_render_order:
  - decisionReceipt
  - replacement
  - finalParent
  success_receipt_rule: render the immutable terminal old-handoff decision first, the optional replacement request next, and
    finalParent as the authoritative post-command state; a replacement WAITING_ACK view shows receiver function and hard expiry
    but never receiver identity bytes
  success_focus_source: finalParent heading
