      type: const<decide-journey-handoff.request.v1>
      required: true
      source: view_model.sections.handoff.forms.decide_journey_handoff__handoff.schemaVersion
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__schemaVersion
    - field: handoffId
      type: uuid
      required: true
      source: view_model.sections.handoff.selected_target.handoffId
      binding_class: IMMUTABLE_SELECTED_TARGET
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__handoffId
    - field: expectedHandoffVersion
      type: int64>=1
      required: true
      source: view_model.sections.handoff.selected_target.expectedHandoffVersion
      binding_class: IMMUTABLE_SELECTED_TARGET
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__expectedHandoffVersion
    - field: expectedBindingDigest
      type: sha256
      required: true
      source: view_model.sections.handoff.selected_target.expectedBindingDigest
      binding_class: IMMUTABLE_SELECTED_TARGET
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__expectedBindingDigest
    - field: decision
      type: enum<ACKNOWLEDGE|DECLINE>
      required: true
      source: view_model.sections.handoff.forms.decide_journey_handoff__handoff.decision
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__decision
    - field: reasonCode
      type: nullable<enum<CAPABILITY_UNAVAILABLE|OBJECT_SCOPE_MISMATCH|CONFLICT_OF_INTEREST|WORKLOAD_CAPACITY|DEPENDENCY_BLOCKED|SUBJECT_INVALID|OWNER_UNAVAILABLE|POLICY_BLOCKED|RECEIVER_DECLINED>>
      required: true
      source: view_model.sections.handoff.forms.decide_journey_handoff__handoff.reasonCode
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__reasonCode
    - field: reason
      type: nullable<string[1..4000]>
      required: true
      source: view_model.sections.handoff.forms.decide_journey_handoff__handoff.reason
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: int_002__field_error__decide_journey_handoff__handoff__reason
    idempotency_binding: request_context.idempotency_keys.handle__int_002__decide_journey_handoff__handoff
    enabled_when:
      all:
      - path: view_model.sections.handoff.selected_target.load_state
        op: eq
        value: READY
      - path: view_model.sections.handoff.selected_target.digest_current
        op: eq
        value: true
      - path: view_model.sections.handoff.selected_target.blocking_reasons
        op: count_eq
        value: 0
      - path: runtime_handlers.handle__int_002__decide_journey_handoff__handoff.phase
        op: eq
        value: IDLE
    placement_state_contract:
    - state: loading
      trigger:
        path: view_model.sections.handoff.selected_target.load_state
        op: eq
        value: LOADING
      visible: true
      enabled: false
      safe_action: WAIT_FOR_SELECTED_TARGET
    - state: blocked
      trigger:
        path: view_model.sections.handoff.selected_target.blocking_reasons
        op: count_gt
        value: 0
      visible: true
      enabled: false
      safe_action: FOCUS_FIRST_OWNED_BLOCKER
    - state: stale
      trigger:
        path: view_model.sections.handoff.selected_target.digest_current
        op: eq
        value: false
      visible: true
      enabled: false
      safe_action: REFRESH_AND_COMPARE_SELECTED_TARGET
    - state: conflict
      trigger:
        path: view_model.sections.handoff.forms.decide_journey_handoff__handoff.server_conflict_diff
        op: present
      visible: true
      enabled: false
      safe_action: PRESERVE_FORM_AND_SHOW_READABLE_DIFF
