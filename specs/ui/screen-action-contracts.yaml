- operation_id: promoteResearchArtifactToEvidence
  label: 조사 자료를 근거로 승격하기
  consequence: 고정된 자료 bytes·권리·locator·선택 구간을 다시 검증해 권위 있는 근거 revision과 영수증을 원자적으로 만든다.
  api: control-api
  method: POST
  path: /v1/internal/commands/promote-research-artifact-to-evidence
  authorization: cases.evidence.manage
  step_up:
    mode: NOT_REQUIRED
    assurance: ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: schemaVersion
    type: const promote-research-artifact.request.v1
    required: true
  - name: caseId
    type: uuid
    required: true
  - name: expectedCaseVersion
    type: int64>=1
    required: true
  - name: agentRunId
    type: uuid
    required: true
  - name: researchArtifact
    type: PromoteResearchArtifactRefV1
    required: true
  - name: rightsDecision
    type: PromotionRightsDecisionRefV1
    required: true
  - name: evidence
    type: PromotionEvidenceDraftV1
    required: true
  - name: selectedSegments
    type: array<PromotionSegmentSelectionV1>[1..100]
    required: true
  - name: reason
    type: string[1..2000]
    required: true
  receipt_schema: PromoteResearchArtifactReceiptV1
  receipt_field_set:
  - name: schemaVersion
    type: const<promote-research-artifact.receipt.v1>
    required: true
  - name: promotionId
    type: uuid
    required: true
  - name: caseId
    type: uuid
    required: true
  - name: caseVersion
    type: int64[1..max]
    required: true
  - name: agentRunId
    type: uuid
    required: true
  - name: researchArtifactId
    type: uuid
    required: true
  - name: researchArtifactSha256
    type: sha256
    required: true
  - name: sourceDocumentId
    type: uuid
    required: true
  - name: sourceAssetId
    type: uuid
    required: true
  - name: sourceAssetRevision
    type: int64[1..max]
    required: true
  - name: sourceContentSha256
    type: sha256
    required: true
  - name: evidenceSegmentBindings
    type: array<PromotionEvidenceSegmentBindingV1>[1..100]
    required: true
  - name: selectedSegmentCount
    type: int32[1..100]
    required: true
  - name: selectedSegmentSetSha256
    type: sha256
    required: true
  - name: evidenceId
    type: uuid
    required: true
  - name: evidenceVersion
    type: int64[1..max]
    required: true
  - name: evidenceDigest
    type: sha256
    required: true
  - name: rightsDecisionId
    type: uuid
    required: true
  - name: rightsDecisionDigest
    type: sha256
    required: true
  - name: reviewerUserId
    type: uuid
    required: true
  - name: auditEventId
    type: uuid
    required: true
  - name: outboxEventId
    type: uuid
    required: true
  - name: idempotencyKeySha256
    type: sha256
    required: true
  - name: promotedAt
    type: datetime
    required: true
  - name: receiptSha256
    type: sha256
    required: true
  - name: links
    type: array<Link>[4..4]
    required: true
