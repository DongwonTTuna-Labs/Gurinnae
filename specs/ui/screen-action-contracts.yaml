    placement_state_contract:
    - state: loading
      trigger:
        path: view_model.sections.conflicts.selected_target.load_state
        op: eq
        value: LOADING
      visible: true
      enabled: false
      safe_action: WAIT_FOR_SELECTED_TARGET
    - state: blocked
      trigger:
        path: view_model.sections.conflicts.selected_target.blocking_reasons
        op: count_gt
        value: 0
      visible: true
      enabled: false
      safe_action: FOCUS_FIRST_OWNED_BLOCKER
    - state: stale
      trigger:
        path: view_model.sections.conflicts.selected_target.digest_current
        op: eq
        value: false
      visible: true
      enabled: false
      safe_action: REFRESH_AND_COMPARE_SELECTED_TARGET
    - state: conflict
      trigger:
        path: view_model.sections.conflicts.forms.withdraw_conflict__conflicts.server_conflict_diff
        op: present
      visible: true
      enabled: false
      safe_action: PRESERVE_FORM_AND_SHOW_READABLE_DIFF
    - state: reauth-required
      trigger:
        path: request_context.review_console_session.action_authorization_state
        op: eq
        value: REQUIRED
      visible: true
      enabled: false
      safe_action: AUTHORIZE_EXACT_HANDLER_DIGEST
    - state: submitting
      trigger:
        path: runtime_handlers.handle__adm_002__withdraw_conflict__conflicts.phase
        op: in
        value:
        - CLAIMED
        - DISPATCHING
      visible: true
      enabled: false
      safe_action: KEEP_IDEMPOTENCY_KEY_AND_WAIT
    - state: receipt
      trigger:
        path: action_result.withdraw_conflict__conflicts.validated_receipt
        op: validated
      visible: true
      enabled: false
      safe_action: FOCUS_OWNED_RECEIPT_DESTINATION
    - state: partial-failure
      trigger:
        path: runtime_handlers.handle__adm_002__withdraw_conflict__conflicts.effect_certainty
        op: eq
        value: MAY_EXIST
      visible: true
      enabled: false
      safe_action: RECONCILE_BEFORE_ANY_RETRY
    - state: terminal
      trigger:
        path: runtime_handlers.handle__adm_002__withdraw_conflict__conflicts.phase
        op: in
        value:
        - CANCELLED
        - REJECTED
        - EXPIRED
      visible: false
      enabled: false
      safe_action: SHOW_TERMINAL_REASON_AND_RECEIPT
    receipt_source: action_result.withdraw_conflict__conflicts.validated_receipt
    handler_id: handle__adm_002__withdraw_conflict__conflicts
    success_destination:
      screen_id: ADM-002
      section_id: conflicts
      route: /internal/admin/users/{userId}
      required_route_bindings:
        userId: action_result.withdraw_conflict__conflicts.validated_receipt.destination_bindings.userId
      section_heading_test_id: adm_002__section__conflicts
      receipt_focus_test_id: adm_002__receipt__handle__adm_002__withdraw_conflict__conflicts__heading
      receipt_anchor: action-receipt-handle__adm_002__withdraw_conflict__conflicts
      history: REPLACE_STATE_AFTER_RECEIPT
    failure_focus_test_id: adm_002__command_error__withdraw_conflict__conflicts
    implementation_status: OPEN_IMPLEMENTATION
