      receipt_focus_test_id: ops_003__receipt__handle__ops_003__cancel_action_execution__recovery__heading
      receipt_anchor: action-receipt-handle__ops_003__cancel_action_execution__recovery
      history: REPLACE_STATE_AFTER_RECEIPT
