schema_version: 1
specification_version: 13.0.0+owner-ui-actions.2
status: OPEN_IMPLEMENTATION
authority_mode: ADDITIVE_OVERLAY
sources:
- specs/product/addendum-operation-contracts.yaml
- specs/product/addendum-resource-error-contracts.yaml
- specs/ui/screen-catalog.yaml
- specs/ui/screen-build-manifest.yaml
rules:
- The command set is exactly equal to the current additive external command source set.
- Every command has at least one visible section placement, explicit state availability, consequence, assurance, receipt and
  focus destination.
- A command is never enabled by primary state alone and never reports success before its closed receipt validates.
- The exact proposal content, recipient, reason, effect, risk and cost precede any human approval.
- Every placement owns a command-qualified action ID, selected target, form, session authority, handler, receipt and route
  destination.
counts:
  commands: 35
  visible_placements: 82
  journey_visible_actions: 17
  legacy_side_door_fences: 30
  base_actions: 259
  effective_actions: 358
action_registry_set_equality:
  base_source: specs/ui/screen-catalog.yaml#screens[].actions[]
  base_keys: 259
  additive_source: command placement registry
  additive_keys: 82
  journey_source: explicit canonical journey visible-action registry
  journey_keys: 17
  overlap: 0
  effective_rule: effective actions = disjoint union(base actions, additive command actions, journey visible actions)
  runtime_status: OPEN_IMPLEMENTATION
browser_secret_binding_oracle:
  request_bindings: 494
  server_only_consumed_before_render: 9
  browser_visible_secret_bindings: 0
  failure_rule: Any raw token, proof, credential, assertion or session value in a view-model/form/action/DOM binding fails
    generation.
commands:
- operation_id: cancelActionExecution
  label: 외부 실행 취소 요청하기
  consequence: 아직 외부 효과가 시작되지 않은 실행만 취소하고 이미 시작됐으면 결과 대조로 전환한다.
  api: control-api
  method: POST
  path: /v1/internal/action-executions/{executionId}:cancel
  authorization: actions.operate
  step_up:
    mode: NOT_REQUIRED
    assurance: ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: executionId
    type: uuid
    required: true
  - name: expectedGeneration
    type: int64>=1
    required: true
  - name: expectedStateVersion
    type: int64>=1
    required: true
  - name: reasonCode
    type: USER_REQUEST|POLICY_CHANGE|CONSENT_REVOKED|SUPPRESSION|RIGHTS_REVOKED|INCIDENT|KILL_SWITCH|BUDGET|OTHER
    required: true
  - name: reasonNote
    type: string[1..2000]
    required: true
  receipt_schema: ActionExecutionMutationReceiptV1
  receipt_field_set:
  - name: command
    type: CommandReceiptV1
    required: true
  - name: authorization
    type: ExecutionAuthorizationSummaryV1
    required: true
  - name: latestReceipt
    type: ExecutionReceiptV1
    required: true
  concurrency: null
  transition: null
  placements:
  - placement_key: cancelActionExecution@OPS-003.recovery
    screen_id: OPS-003
    section_id: recovery
    section_test_id: ops_003__section__recovery
    action_id: cancel-action-execution--recovery
    action_test_id: ops_003__action__cancel_action_execution__recovery
    selected_target_source: view_model.sections.recovery.selected_target
    form_source: view_model.sections.recovery.forms.cancel_action_execution__recovery
    session_authority_source: request_context.review_console_session
    request_bindings:
    - field: executionId
      type: uuid
      required: true
      source: view_model.sections.recovery.selected_target.executionId
      binding_class: IMMUTABLE_SELECTED_TARGET
      browser_visible: true
      error_test_id: ops_003__field_error__cancel_action_execution__recovery__executionId
    - field: expectedGeneration
      type: int64>=1
      required: true
      source: view_model.sections.recovery.selected_target.expectedGeneration
