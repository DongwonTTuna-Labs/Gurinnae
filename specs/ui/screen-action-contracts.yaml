- operation_id: decideJourneyHandoff
  label: 업무 인계 응답하기
  consequence: 현재 인계의 대상·담당 범위·기한·후속 결과를 확인하고 맡기 또는 사유가 있는 거절을 저장된 인계 영수증으로 남긴다.
  api: control-api
  method: POST
  path: /v1/internal/journey-handoffs/{handoffId}:decide
  authorization: journeys.handoff.decide
  step_up:
    mode: CONDITIONAL
    assurance: conditional-by-persisted-handoff-binding-with-minimum-ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: schemaVersion
    type: const<decide-journey-handoff.request.v1>
    required: true
  - name: handoffId
    type: uuid
    required: true
  - name: expectedHandoffVersion
    type: int64>=1
    required: true
  - name: expectedBindingDigest
    type: sha256
    required: true
  - name: decision
    type: enum<ACKNOWLEDGE|DECLINE>
    required: true
  - name: reasonCode
    type: nullable<enum<CAPABILITY_UNAVAILABLE|OBJECT_SCOPE_MISMATCH|CONFLICT_OF_INTEREST|WORKLOAD_CAPACITY|DEPENDENCY_BLOCKED|SUBJECT_INVALID|OWNER_UNAVAILABLE|POLICY_BLOCKED|RECEIVER_DECLINED>>
    required: true
  - name: reason
    type: nullable<string[1..4000]>
    required: true
  receipt_schema: JourneyHandoffDecisionReceiptV1
  receipt_field_set:
  - name: schemaVersion
    type: const<journey-handoff-decision-receipt.v1>
    required: true
  - name: command
    type: CommandReceiptV1
    required: true
  - name: decisionReceipt
    type: JourneyHandoffTerminalReceiptV1
    required: true
  - name: replacement
    type: nullable<JourneyHandoffReplacementReceiptV1>
    required: true
  - name: finalParent
    type: JourneyInstanceHeadReceiptV1
    required: true
  - name: effectDigest
    type: sha256
    required: true
  - name: decidedAt
    type: datetime
    required: true
  concurrency: expected handoff version plus binding digest under SERIALIZABLE locks and one logical request-bound idempotency
    key; ACTOR derives its digest from the HTTP Idempotency-Key header and SERVICE supplies the already-derived idempotencyKeySha256
    in the authenticated workload envelope
  transition: PENDING_ACK->ACKNOWLEDGED|DECLINED is the terminal old-handoff step; a compiled DECLINE replacement atomically
    follows with generation+1 NONE->PENDING_ACK and the final parent state WAITING_ACK
  placements:
  - placement_key: decideJourneyHandoff@INT-002.handoff
    screen_id: INT-002
    section_id: handoff
    section_test_id: int_002__section__handoff
    action_id: decide-journey-handoff--handoff
    action_test_id: int_002__action__decide_journey_handoff__handoff
    selected_target_source: view_model.sections.handoff.selected_target
    form_source: view_model.sections.handoff.forms.decide_journey_handoff__handoff
    session_authority_source: request_context.review_console_session
    request_bindings:
