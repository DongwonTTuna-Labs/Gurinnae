      required: true
      source: view_model.sections.recovery.selected_target.expectedStateVersion
      binding_class: IMMUTABLE_SELECTED_TARGET
      browser_visible: true
      error_test_id: ops_003__field_error__cancel_action_execution__recovery__expectedStateVersion
    - field: reasonCode
      type: USER_REQUEST|POLICY_CHANGE|CONSENT_REVOKED|SUPPRESSION|RIGHTS_REVOKED|INCIDENT|KILL_SWITCH|BUDGET|OTHER
      required: true
      source: view_model.sections.recovery.forms.cancel_action_execution__recovery.reasonCode
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: ops_003__field_error__cancel_action_execution__recovery__reasonCode
    - field: reasonNote
      type: string[1..2000]
      required: true
      source: view_model.sections.recovery.forms.cancel_action_execution__recovery.reasonNote
      binding_class: USER_EDITABLE_FORM_FIELD
      browser_visible: true
      error_test_id: ops_003__field_error__cancel_action_execution__recovery__reasonNote
    idempotency_binding: request_context.idempotency_keys.handle__ops_003__cancel_action_execution__recovery
    enabled_when:
      all:
      - path: view_model.sections.recovery.selected_target.load_state
        op: eq
        value: READY
      - path: view_model.sections.recovery.selected_target.digest_current
        op: eq
        value: true
      - path: view_model.sections.recovery.selected_target.blocking_reasons
        op: count_eq
        value: 0
      - path: runtime_handlers.handle__ops_003__cancel_action_execution__recovery.phase
        op: eq
        value: IDLE
    placement_state_contract:
    - state: loading
      trigger:
        path: view_model.sections.recovery.selected_target.load_state
        op: eq
        value: LOADING
      visible: true
      enabled: false
      safe_action: WAIT_FOR_SELECTED_TARGET
    - state: blocked
      trigger:
        path: view_model.sections.recovery.selected_target.blocking_reasons
        op: count_gt
        value: 0
      visible: true
      enabled: false
      safe_action: FOCUS_FIRST_OWNED_BLOCKER
    - state: stale
      trigger:
        path: view_model.sections.recovery.selected_target.digest_current
        op: eq
        value: false
      visible: true
      enabled: false
      safe_action: REFRESH_AND_COMPARE_SELECTED_TARGET
    - state: conflict
      trigger:
        path: view_model.sections.recovery.forms.cancel_action_execution__recovery.server_conflict_diff
        op: present
      visible: true
      enabled: false
      safe_action: PRESERVE_FORM_AND_SHOW_READABLE_DIFF
    - state: reauth-required
      trigger:
        path: request_context.review_console_session.action_authorization_state
        op: eq
        value: REQUIRED
      visible: true
      enabled: false
      safe_action: AUTHORIZE_EXACT_HANDLER_DIGEST
    - state: submitting
      trigger:
        path: runtime_handlers.handle__ops_003__cancel_action_execution__recovery.phase
        op: in
        value:
        - CLAIMED
        - DISPATCHING
      visible: true
      enabled: false
      safe_action: KEEP_IDEMPOTENCY_KEY_AND_WAIT
    - state: receipt
      trigger:
        path: action_result.cancel_action_execution__recovery.validated_receipt
        op: validated
      visible: true
      enabled: false
      safe_action: FOCUS_OWNED_RECEIPT_DESTINATION
    - state: partial-failure
      trigger:
        path: runtime_handlers.handle__ops_003__cancel_action_execution__recovery.effect_certainty
        op: eq
        value: MAY_EXIST
      visible: true
      enabled: false
      safe_action: RECONCILE_BEFORE_ANY_RETRY
    - state: terminal
      trigger:
        path: runtime_handlers.handle__ops_003__cancel_action_execution__recovery.phase
        op: in
        value:
        - CANCELLED
        - REJECTED
        - EXPIRED
      visible: false
      enabled: false
      safe_action: SHOW_TERMINAL_REASON_AND_RECEIPT
    receipt_source: action_result.cancel_action_execution__recovery.validated_receipt
    handler_id: handle__ops_003__cancel_action_execution__recovery
    success_destination:
      screen_id: OPS-003
      section_id: recovery
      route: /internal/operations/jobs/{jobId}
      required_route_bindings:
        jobId: action_result.cancel_action_execution__recovery.validated_receipt.destination_bindings.jobId
