- operation_id: decideSupplierRelationshipAssertion
  label: 공급자 관계 주장 결정하기
  consequence: 고정된 주장 revision·근거 digest를 재확인해 검증·거절·충돌·대체 중 하나의 독립 결정을 영수증으로 남긴다.
  api: identity-api
  method: POST
  path: /v1/internal/supplier-relationships/assertions/{assertionId}:decide
  authorization: cases.evidence.manage
  step_up:
    mode: NOT_REQUIRED
    assurance: ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: assertionId
    type: uuid
    required: true
  - name: expectedAssertionRevision
    type: int64>=1
    required: true
  - name: expectedAssertionDigest
    type: sha256
    required: true
  - name: expectedEvidenceLocatorSetDigest
    type: sha256
    required: true
  - name: decision
    type: enum<VERIFY|REJECT|MARK_CONFLICT|SUPERSEDE>
    required: true
  - name: counterAssertionIds
    type: unique-array<uuid>[0..1000]
    required: true
  - name: reasonCode
    type: enum<EVIDENCE_CONFIRMED|EVIDENCE_INSUFFICIENT|EVIDENCE_CONTRADICTED|SOURCE_CORRECTED|ASSERTION_SUPERSEDED>
    required: true
  - name: reason
    type: string[1..10000]
    required: true
  receipt_schema: SupplierRelationshipAssertionReceiptV1
  receipt_field_set:
  - name: assertionId
    type: uuid
    required: true
  - name: assertionRevision
    type: int64[1..max]
    required: true
  - name: assertionDigest
    type: sha256
    required: true
  - name: verificationStatus
    type: enum<PENDING|VERIFIED|REJECTED|CONFLICTED|SUPERSEDED>
    required: true
  - name: evidenceLocatorSetDigest
    type: sha256
    required: true
  - name: verifiedBy
    type: nullable<uuid>
    required: true
  - name: verifiedAt
    type: nullable<datetime>
    required: true
  - name: auditEventId
    type: uuid
    required: true
  - name: emittedEventIds
    type: array<uuid>[1..10]
    required: true
  - name: acceptedAt
    type: datetime
    required: true
  concurrency: expected assertion revision, assertion digest and evidence locator digest under SERIALIZABLE locks
  transition: PENDING->VERIFIED|REJECTED|CONFLICTED|SUPERSEDED
  placements:
  - placement_key: decideSupplierRelationshipAssertion@INT-002.handoff
    screen_id: INT-002
    section_id: handoff
