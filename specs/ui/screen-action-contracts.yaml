      - getReviewSnapshot.caseVersion
      - getReviewSnapshot.snapshotHash
      - getReviewSnapshot.createdAt
      - getReviewSnapshot.createdBy
      preview:
      - getReviewSnapshot.claims
      - getReviewSnapshot.responses
      matrix:
      - getReviewSnapshot.claims
      - getReviewSnapshot.evidence
      - getReviewSnapshot.responses
      diff:
      - getReviewSnapshot.diffFromCurrent
      risks:
      - getReviewSnapshot.automatedGates
      - getReviewSnapshot.independence
      - getReviewSnapshot.unresolvedBlockers
      decision:
      - submitReview.expectedSnapshotHash
      - submitReview.expectedCaseVersion
      - submitReview.decision
      - submitReview.reason
    component_overrides:
      matrix:
        component: EvidenceLedger
        variant: review
      risks:
        component: GateChecklist
        variant: publication
      decision:
        component: DecisionReviewPanel
        variant: review
  REV-003:
    primary_action_id: publish
    primary_consequence: 최신 검증 조건을 서버에서 다시 계산한 뒤 정확한 검토본만 새 공개 버전으로 게시하고 공개 화면 반영·알림·공개 확인 영수증을 남긴다.
    post_success:
      operation_id: publishCase
      destination_screen_id: PUB-004
      destination_section_id: status
      focus_test_id: pub_004__section__status
    publication_receipt_requirements:
    - publicationId
    - publicationRevision
    - snapshotHash
    - projectionState
    - notificationState
    - publicSmokeReceiptId
    - auditEventId
    api_schema_dependencies:
    - getPublishConfirmation and getPublicationReceipt generic data envelopes must become closed typed schemas with current
      gate and public-smoke fields.
  OPS-006:
    primary_action_id: activate
    primary_consequence: 선택한 기능 범위·사용자 영향·안전 대체 경로·만료·복구 기준을 고정하고 필요한 직무분리 승인 뒤 중지한다.
    required_preview_fields:
    - switchKind
    - scope
    - affectedUsers
    - affectedJobs
    - safeFallback
    - expiresAt
    - recoveryCriteria
    - approvals
    legacy_direct_effect_fence: activateKillSwitch, deactivateKillSwitch and extendKillSwitch may create only a proposal until
      quorum produces an execution authorization receipt.
    receipt_requirements:
    - proposalDigest
    - authorizationReceiptId
    - switchRevision
    - scope
    - effectiveAt
    - expiresAt
    - safeFallback
    - verificationTaskId
    component_overrides:
      active:
        component: OperationsStatusPanel
        variant: service-health
      impact:
        component: OperationsStatusPanel
        variant: internal-incident
      approval:
        component: DecisionReviewPanel
        variant: review
