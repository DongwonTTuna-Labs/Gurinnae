- operation_id: verifyCommunicationEndpointLink
  label: 메시지 수신처 확인하기
  consequence: 일회용 증명과 challenge를 검증해 해당 수신처만 활성화한다.
  api: submission-api
  method: POST
  path: /v1/submission-session/communication-endpoint-link:verify
  authorization: derived-session:COMMUNICATION_PROFILE+one-time-endpoint-proof
  step_up:
    mode: NOT_REQUIRED
    assurance: SCOPED_TOKEN
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: challengeId
    type: uuid
    required: true
  - name: proof
    type: EndpointVerificationProofV1
    required: true
  - name: expectedProfileVersion
