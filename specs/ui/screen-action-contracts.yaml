- operation_id: declareConflict
  label: 이해상충 사실 기록하기
  consequence: 정확한 사람·대상·관계·중요도·기간·근거를 현재 정책에 결속해 기존 기록을 덮지 않는 새 사실로 남긴다.
  api: control-api
  method: POST
  path: /v1/internal/conflict-declarations
  authorization: conflicts.declare
  step_up:
    mode: NOT_REQUIRED
    assurance: ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: subjectActorId
    type: uuid
    required: true
  - name: target
    type: ConflictTargetV1
    required: true
  - name: conflictType
    type: AUTHORSHIP|EDITING|CASE_PARTY|RECIPIENT|ROLE|PERSONAL|FAMILY|EMPLOYMENT|ADVISORY|FINANCIAL|POLITICAL|FUNDING|CUSTOMER
    required: true
  - name: relationState
    type: PRESENT|UNKNOWN
    required: true
  - name: materiality
    type: MATERIAL|NON_MATERIAL|UNKNOWN
    required: true
  - name: temporalState
    type: CURRENT|PAST|UNKNOWN
    required: true
  - name: sourceClass
    type: SELF_DECLARED|INTERNAL_AUTHORITATIVE|EXTERNAL_AUTHORITATIVE
    required: true
  - name: evidenceRefs
    type: unique-array<ConflictEvidenceRefV1>[0..100]
    required: true
  - name: expectedPriorSequence
    type: int64>=0
    required: true
  - name: policyDigest
    type: sha256
    required: true
  - name: reason
    type: string[1..4000]
    required: true
  - name: effectiveAt
    type: datetime
    required: true
  - name: expiresAt
    type: datetime
    required: true
  receipt_schema: ConflictDeclarationReceiptV1
  receipt_field_set:
  - name: command
    type: CommandReceiptV1
    required: true
  - name: declaration
    type: ConflictDeclarationSummaryV1
    required: true
  - name: priorDeclarationDigest
    type: nullable<sha256>
    required: true
  - name: receiptDigest
    type: sha256
    required: true
  concurrency: subject+target+conflictType semantic lock and expectedPriorSequence
  transition: NONE|ACTIVE->ACTIVE_NEW_APPEND_ONLY_FACT
