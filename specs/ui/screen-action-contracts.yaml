    type: sha256
    required: true
  - name: actorKind
    type: enum<CONTROL_API|ANALYSIS_WORKER|RECONCILIATION_WORKER|SCHEDULER>
    required: true
  - name: actorId
    type: nullable<uuid>
    required: true
  - name: reasonCode
    type: enum<RUN_STARTED|TURN_ADVANCED|FINAL_OUTPUT_VALIDATED|DEFINITIVE_FAILURE|BUDGET_DENIED|POLICY_DENIED|PRE_DISPATCH_CANCELLED|CANCEL_REQUESTED|OUTCOME_AMBIGUOUS|SAFE_RETRY_AUTHORIZED|RECONCILED_SUCCEEDED|RECONCILED_FAILED|RECONCILED_CANCELLED|NO_STATE_CHANGE>
    required: true
