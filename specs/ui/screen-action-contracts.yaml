- operation_id: updateActionDraft
  label: 승인 요청 초안 저장
  consequence: 기존 초안을 덮어쓰지 않고 새 revision으로 저장해 검토 전 변경 이력을 남긴다.
  api: control-api
  method: PATCH
  path: /v1/internal/action-proposals/{proposalId}/draft
  authorization: actions.propose
  step_up:
    mode: NOT_REQUIRED
    assurance: ACTIVE_SESSION
    binding: exact proposal/action/decision digest + expected versions + bounded authorization receipt
    rule: Confirmation UI never substitutes for a required or conditional step-up authorization.
  request_field_set:
  - name: proposalId
