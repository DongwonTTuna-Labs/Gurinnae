version: 1

# Section ids are presentation roles, not operation response keys. These
# allowlists bind roles to the exact response fields declared by the operation
# contracts so generated browser projections never invent synthetic keys.
section_field_hints:
  progress: [requestId, version, savedAt, expiresAt, status]
  questions: [answers, questionId, questionLabel, text]
  statement: [answers, attachments, status]
  consent: [publicationConsent, bodyConsent, redactionAcknowledged]
  receipt: [receiptId, receiptStatus, submittedAt, submissionDigest]
  download: [receiptId, submissionDigest, status]
  authority: [authority, authorityStatus, status]

screen_section_field_overrides:
  PUB-001:
    corrections: [items]
    coverage: [totalApproximate]
  PUB-002:
    query: [appliedFilters]
    results: [items, nextCursor, totalApproximate, asOf]
  PUB-003:
    scope: [totalApproximate, asOf]
    filters: [appliedFilters]
    results: [items, totalApproximate, asOf]
    pagination: [nextCursor]
  PUB-004:
    status: [slug, title, publicState, revision, publishedAt, updatedAt, freshness]
    known: [summary, confirmedFacts]
    unknown: [criticalUnknowns, limitations]
    response: [partyResponses]
    comparison: [comparison, signals]
    counter: [counterEvidence]
    evidence: [claims, evidence]
    timeline: [timeline]
    revision: [revision, corrections]
  PUB-007:
    search: [appliedFilters]
    results: [items, totalApproximate]
    coverage: [asOf]
  PUB-009:
    search: [appliedFilters]
    results: [items, totalApproximate]
    identity-note: [asOf]
  PUB-011:
    scope: [totalApproximate, asOf]
    filters: [appliedFilters]
    results: [items, totalApproximate]
    limitations: [asOf]
  PUB-012:
    identity: [id, contractNumber, title, agency, supplier, status]
    terms: [contractMethod, signedAt, startAt, endAt, currency, originalAmount, currentAmount, lineItems]
    changes: [changes]
    provenance: [sourceDocuments]
    related: [relatedCases]
    limitations: [normalizationWarnings]
  PUB-018:
    principle: [asOf]
    filters: [appliedFilters]
    records: [items, totalApproximate]
    feed: [nextCursor]
  PUB-020:
    datasets: [items]
    snapshots: [asOf]
    schemas: []
    license: []
    corrections: []
    limits: []
  OPS-005:
    model-catalog: [items, currentProviders, syncStatus, asOf]

screen_section_operation_overrides:
  PUB-001:
    corrections: listCorrections
    coverage: listSourceStatus
  OPS-005:
    model-catalog: listRelayModels

surface_personas:
  public: 공개 독자·연구자
  response: 소명 대상자
  internal: 조사 담당자
  auth: 내부 사용자
default_persona: 조사 담당자
