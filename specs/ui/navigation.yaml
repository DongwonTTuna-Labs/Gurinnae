schema_version: 1
specification_version: 13.0.0
principles:
- Navigation follows user jobs, not database tables.
- Public, internal and response surfaces have independent headers, sessions and origins.
- Current route, breadcrumb and page title must agree.
- Navigation visibility is not authorization; server policy is authoritative.
- Mobile preserves search and the primary task.
