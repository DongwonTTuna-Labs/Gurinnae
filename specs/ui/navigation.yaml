  compact_rules:
  - Global navigation collapses but incident and account remain discoverable.
  - Case task group becomes a labelled selector/drawer; current task remains visible.
  - Unsupported complex operations show safe read-only context and desktop-required guidance.
response:
  origin_role: token_scoped
  header:
    brand_target: RSP-001
    utilities:
    - security-help
    - contact-request-owner
  steps:
  - order: 1
    screen: RSP-002
    label: 요청 확인
  - order: 2
    screen: RSP-003
    label: 답변 작성
  - order: 3
    screen: RSP-004
    label: 첨부자료
  - order: 4
    screen: RSP-005
    label: 제출 전 확인
  - order: 5
    screen: RSP-006
    label: 접수
  secondary:
  - RSP-007
  rules:
  - No navigation to other requests, cases or internal screens.
  - External links must not receive the response token through referrer.
  - Step status distinguishes not-started, in-progress, complete and error.
