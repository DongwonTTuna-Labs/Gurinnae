schema_version: 1
specification_version: 13.0.0
authority: Machine-readable persona and audience registry for screen primary_users; access authority remains roles-and-permissions.yaml.
principles:
- Persona is a product-behavior lens, not an authorization grant.
- A screen may name a broader audience than the role performing commands.
- Demographic stereotypes are not used to infer needs or permissions.
