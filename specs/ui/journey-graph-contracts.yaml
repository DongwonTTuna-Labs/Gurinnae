    callee_entry: J-11::ORIGIN[REV-003]
    success_return: REV-003::publication-receipt
    nonvalue_return: J-07::PUBLICATION_NONVALUE
    recovery_return: J-07::PUBLICATION_RECOVERY_REQUIRED
    required_handoff: HS-07
  - caller_edge: J-08-E04
    mode: AFTER_TERMINAL
