cross_journey_arc_contracts:
  arcs:
  - caller_edge: J-03-E01
    mode: REPLACES_EDGE_DESTINATION
    caller_selector: ALL
    callee: J-11
    callee_entry: J-11::ORIGIN[CAS-009]
    success_return: RSP-001
    nonvalue_return: J-03::DELIVERY_NONVALUE
    recovery_return: J-03::DELIVERY_RECOVERY_REQUIRED
    required_handoff: HS-01
  - caller_edge: J-06-E03
    mode: BRANCH_SELECTOR
    caller_selector: START_AI_RESEARCH
    callee: J-10
    callee_entry: CAS-010
    success_return: CAS-004
    nonvalue_return: J-06::AI_RESEARCH_BLOCKED
    recovery_return: J-06::AI_RESEARCH_RECOVERY_REQUIRED
    required_handoff: HS-11
  - caller_edge: J-06-E07
