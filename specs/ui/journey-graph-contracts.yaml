  J-05-E03:
    selector_source: triageSignalReceipt.result
    exact:
      DISMISS:
        to: J-05::DISMISSED
        to_kind: TERMINAL
        destination_screen: SIG-002
        terminal_class: NONVALUE_TERMINAL
        owned: false
      NEEDS_DATA:
        to: INT-002::signal-enrichment-pending
