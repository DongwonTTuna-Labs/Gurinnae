rules:
- Every edge is an authored row. No enumerate(step-list), regex-derived resolver, fallback handler, or dynamic workflow DSL
  may create an edge.
- Branch selectors and convergence inputs are closed maps in branch_contracts; an unlisted selector is a contract error and
  writes no journey receipt.
- Resolver edge IDs and edge-registry IDs are set-equal. One edge has exactly one compiled resolver entry even when that resolver
  owns a closed selector map.
- Every reachable nonterminal node has at least one outgoing edge, and every reachable node has a finite path to SUCCESS_TERMINAL,
  NONVALUE_TERMINAL, or RECOVERY_TERMINAL.
- RECONCILIATION_REQUIRED is a nonterminal node in J-10 and J-11. It cannot be relabelled as success, failure, cancellation,
  paid value, or a completed journey.
- Cross-journey entry and return preserve root object ID, version, digest, current owner, due/SLO, last receipt, origin screen,
  safe return route, and journey-instance linkage.
- J-12 begins with a visible OPS-004 current-health answer, then an INT-002 owned remediation acknowledgement, then signed
  qualification, CONFIGURED and DATA_READY evidence, before paid work starts.
- J-12 stages other than QUALIFIED are read projections. No commercial stage row or stage event is created.
- J-11 communication edges E19 through E23 remain five separate physical milestones: intent, delivery claim, provider observation,
    reconciliation, and origin receipt return.
- The 94 route set is byte-for-byte unchanged. New work is a section/action/view-model refinement on an existing route.
