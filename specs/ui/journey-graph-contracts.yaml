    caller_selector: ALL
    callee: J-10
    callee_entry: CAS-010
    success_return: CAS-004::promoted-evidence-visible
    nonvalue_return: J-12::AI_PATH_NONVALUE
    recovery_return: J-12::AI_PATH_RECOVERY_REQUIRED
    required_handoff: HS-11
  - caller_edge: J-12-E18A
    mode: BRANCH_SELECTOR
