compiled_registry_decisions:
  J11_ACTION_EXECUTOR_CATALOG_V1:
    source: specs/product/addendum-approval-policy.yaml#executor_catalog
    exact:
      HYPOTHESIS:
        executor_id: createHypothesis
        transport: BASE_APPLICATION_COMMAND
      CLAIM:
        executor_id: addClaim
        transport: BASE_APPLICATION_COMMAND
      TASK:
        executor_id: private.CreateTaskFromApprovedAction
        transport: PRIVATE_APPLICATION_COMMAND
      COMPARABLE:
        executor_id: private.MaterializeComparableCandidate
        transport: PRIVATE_APPLICATION_COMMAND
      COMMUNICATION:
        executor_id: J11_COMMUNICATION_EXECUTOR_REGISTRY_V1
        transport: COMPILED_SPECIALIZATION
      PUBLICATION:
        executor_id: publishCase
        transport: BASE_APPLICATION_COMMAND
      RETRACTION:
        executor_id: private.PublishRetraction
        transport: PRIVATE_APPLICATION_COMMAND
      RULE_ACTIVATION:
        executor_id: activateRuleVersion
        transport: BASE_APPLICATION_COMMAND
      ROLE_GRANT:
        executor_id: grantRole
        transport: BASE_APPLICATION_COMMAND
      KILL_SWITCH:
        executor_id: private.ApplyKillSwitchCommand
        transport: PRIVATE_APPLICATION_COMMAND
      COMMUNICATION_AUTHORIZATION:
        executor_id: private.RecordCommunicationAuthorizationDecision
        transport: PRIVATE_APPLICATION_COMMAND
      ASSET_RIGHTS_DECISION:
        executor_id: private.ReviseAssetRightsDecision
        transport: PRIVATE_APPLICATION_COMMAND
      RETENTION_SCHEDULE:
        executor_id: private.CreateRecordClassScheduleRevision
        transport: PRIVATE_APPLICATION_COMMAND
      FUNDING_DISCLOSURE:
        executor_id: private.PublishFundingDisclosureRevision
        transport: PRIVATE_APPLICATION_COMMAND
      CAPABILITY_ACTIVATION:
        executor_id: private.DecideCapabilityActivation
        transport: PRIVATE_APPLICATION_COMMAND
      RESPONSE_POLICY_CALENDAR:
        executor_id: private.CreateBusinessCalendarVersion
        transport: PRIVATE_APPLICATION_COMMAND
      COMMERCIAL_CONTROL:
        executor_id: private.ApplyCommercialControl
        transport: PRIVATE_APPLICATION_COMMAND
    invariant: The worker invokes the typed application routine under the immutable ExecutionAuthorization; a BASE_APPLICATION_COMMAND
      is never re-exposed as a browser side door or called with a browser assertion.
  J11_COMMUNICATION_EXECUTOR_REGISTRY_V1:
    exact:
      RESPONSE_REQUEST_DELIVERY:
        selector: operationId=createResponseRequest
        executor_id: createResponseRequest
        transport: BASE_APPLICATION_COMMAND
        completion_event: notification.response_request_delivery_requested.v1
        sent_materializer: materializeResponseRequestSent
      DISCRETIONARY_OR_OTHER_COMMUNICATION:
        selector: operationId!=createResponseRequest
        executor_id: private.DispatchCommunicationIntent
        transport: PRIVATE_APPLICATION_COMMAND
        completion_event: communication.intent_created.v1
    invariant: Both branches use the same approved COMMUNICATION binding and exact rendered/recipient/channel digest. Request
      creation is not delivery, and neither branch reaches J-11 success before E20 through E23.
  J11_ACTION_ORIGIN_PLACEMENT_SET_V1:
    origin_screens:
    - CAS-006
    - CAS-007
    - CAS-009
    - CAS-011
    - CAS-015
    - RULE-004
    - REV-003
    - OPS-005
    - OPS-006
    - ADM-002
    create_existing:
      CAS-006: createActionProposal@CAS-006.editor
      CAS-007: createActionProposal@CAS-007.board
      CAS-009: createActionProposal@CAS-009.preview
      CAS-011: createActionProposal@CAS-011.decisions
      CAS-015: createActionProposal@CAS-015.proposal
      RULE-004: createActionProposal@RULE-004.approval
      REV-003: createActionProposal@REV-003.gates
      OPS-005: createActionProposal@OPS-005.status
      OPS-006: createActionProposal@OPS-006.approval
      ADM-002: createActionProposal@ADM-002.requests
    missing_placements_to_add_exactly:
    - operation_id: updateActionDraft
      placement_key: updateActionDraft@REV-003.gates
      action_key: REV-003.update-action-draft--gates
      handler_id: handle__rev_003__update_action_draft__gates
    - operation_id: previewActionDraft
      placement_key: previewActionDraft@CAS-006.editor
      action_key: CAS-006.preview-action-draft--editor
      handler_id: handle__cas_006__preview_action_draft__editor
    - operation_id: previewActionDraft
      placement_key: previewActionDraft@CAS-007.board
      action_key: CAS-007.preview-action-draft--board
      handler_id: handle__cas_007__preview_action_draft__board
    - operation_id: previewActionDraft
