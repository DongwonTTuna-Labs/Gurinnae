    callee: J-11
    callee_entry: J-11::ENTRY[E09]
    success_return: J-11::DURABLE_EFFECT_RECEIPT|J-11::DELIVERED_OR_READ_RECEIPT
    nonvalue_return: J-12::TERMINAL_NONVALUE
    recovery_return: J-11::RECONCILIATION_REQUIRED|J-11::DELIVERY_RECONCILIATION_REQUIRED
    required_handoff: HS-09
  - caller_edge: J-12-E20
