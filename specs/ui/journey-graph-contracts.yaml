        destination_screen: INT-002
        terminal_class: NONTERMINAL
        owned: true
        handoff_kind: HS-04
      MARK_DUPLICATE:
        to: J-05::DUPLICATE
        to_kind: TERMINAL
        destination_screen: SIG-002
        terminal_class: NONVALUE_TERMINAL
        owned: false
      PROMOTE_TO_CASE:
        to: CAS-002::case-ownership-pending
        to_kind: MILESTONE
        destination_screen: CAS-002
        terminal_class: NONTERMINAL
        owned: true
        handoff_kind: HS-03
      LINK_TO_CASE:
        to: CAS-002::case-ownership-pending
        to_kind: MILESTONE
        destination_screen: CAS-002
        terminal_class: NONTERMINAL
        owned: true
        handoff_kind: HS-03
  J-06-E03:
    selector_source: authorized visible action
    exact:
      OPEN_EVIDENCE:
        to: CAS-005
        to_kind: SCREEN
        destination_screen: CAS-005
        terminal_class: NONTERMINAL
      START_AI_RESEARCH:
        to: J-10::ENTRY[CAS-010]
        to_kind: CROSS_JOURNEY
        destination_screen: CAS-010
        terminal_class: NONTERMINAL
        return: J-10-E17 -> CAS-004
  J-06-E07:
    selector_source: authorized visible action
    exact:
      OPEN_REVIEW_READINESS:
        to: CAS-013
        to_kind: SCREEN
        destination_screen: CAS-013
        terminal_class: NONTERMINAL
      NEW_RESPONSE_REQUEST:
        to: J-03::ENTRY[CAS-009]
        to_kind: CROSS_JOURNEY
        destination_screen: CAS-009
        terminal_class: NONTERMINAL
        return: J-03-E07 -> CAS-008
  J-07-E02:
    selector_source: submitReviewReceipt.decision
    exact:
      APPROVE:
        to: REV-003
        to_kind: SCREEN
        destination_screen: REV-003
        terminal_class: NONTERMINAL
