    recovery_return: J-11::RECONCILIATION_REQUIRED
    required_handoff: HS-10
  - caller_edge: J-12-E20
    mode: BRANCH_SELECTOR
    caller_selector: DELIVERY_RETRY_AUTHORIZED
    callee: J-11
    callee_entry: J-11::ENTRY[E20]
    success_return: J-11::DELIVERED_OR_READ_RECEIPT
    nonvalue_return: J-12::TERMINAL_NONVALUE
    recovery_return: J-11::DELIVERY_RECONCILIATION_REQUIRED
    required_handoff: HS-18
  - caller_edge: J-12-E25
