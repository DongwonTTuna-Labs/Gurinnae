    nonvalue_return: J-06::RESPONSE_REQUEST_BLOCKED
    recovery_return: J-06::RESPONSE_DELIVERY_RECOVERY_REQUIRED
    required_handoff: HS-01
  - caller_edge: J-06-E09
    mode: AFTER_TERMINAL
    caller_selector: SUCCESS
    callee: J-07
    callee_entry: REV-001
    success_return: PUB-004::public-smoke-receipt
    nonvalue_return: J-06::EDITORIAL_REVIEW_NONVALUE
    recovery_return: J-06::REVIEW_CHANGES_REQUIRED
    required_handoff: HS-05
  - caller_edge: J-07-E03
    mode: REPLACES_EDGE_DESTINATION
