schema_version: 1
specification_version: 13.0.0
status: FINAL
rules:
- Section order is normative.
- Layout may reflow but semantic order and actions remain.
- Every data operation is READY and must be implemented.
- Every screen requires visual, interaction, accessibility and E2E coverage.
screens:
- id: PUB-001
  surface: public
  route: /
  title: 홈
  archetype: EVIDENCE_LANDING
  access: anonymous
  layout:
    wide: 12-column public grid; status/title 12; known-unknown-response 12; main evidence 8 + sticky context 4
    medium: 8-column grid; all primary regions span 8; context follows comparison
    compact: single column preserving status → known → unknown → response → comparison → evidence → history
    container: public_main
  above_fold_order:
  - mission
  - search
  - recent
  - corrections
  section_order:
  - order: 1
    id: mission
    title: 서비스 정의와 한계
    component: StructuredContentSection
    purpose: 이상 징후와 비리 확정을 분리한다.
    test_id: pub_001__section__mission
  - order: 2
    id: search
    title: 통합 검색
    component: UnifiedSearch
    purpose: 기관·업체·계약·사건 검색 진입점이다.
    test_id: pub_001__section__search
  - order: 3
    id: recent
    title: 최근 공개 기록
    component: StatusAndRevisionHeader
    purpose: 상태가 균형 잡힌 최신 기록을 보여준다.
    test_id: pub_001__section__recent
  - order: 4
    id: corrections
    title: 최근 설명·정정·철회
    component: RevisionAndCorrectionPanel
    purpose: 제품이 오류와 해소 사례를 숨기지 않음을 보여준다.
    test_id: pub_001__section__corrections
  - order: 5
    id: coverage
    title: 데이터 범위와 최신성
    component: CoverageStatement
    purpose: 포함 source와 지연을 요약한다.
    test_id: pub_001__section__coverage
  - order: 6
    id: method
    title: 방법론
    component: LongFormArticle
    purpose: 탐지 방식과 한계를 설명한다.
    test_id: pub_001__section__method
  actions:
  - id: search
    label: 검색
    capability: none
    interaction_kind: NAVIGATION
    assurance_level: NONE
    step_up_required: false
    confirmation_required: false
    local_only: true
  - id: browse-cases
    label: 사례 보기
    capability: none
    interaction_kind: NAVIGATION
    assurance_level: NONE
    step_up_required: false
    confirmation_required: false
    local_only: true
  - id: subscribe
    label: 업데이트 구독
    capability: none
    operation_id: createSubscription
    preset:
      scope_type: CORRECTIONS
    interaction_kind: NAVIGATION
    assurance_level: ANONYMOUS_PROOF
    step_up_required: false
    confirmation_required: false
  data_operations:
  - operation_id: listPublicCases
    api: public-api
    method: GET
    path: /v1/cases
    blocking: true
    response_schema: PublicCasesPage
  - operation_id: listCorrections
    api: public-api
    method: GET
    path: /v1/corrections
    blocking: true
    response_schema: CorrectionsPage
  - operation_id: listSourceStatus
    api: public-api
    method: GET
    path: /v1/sources/status
    blocking: true
    response_schema: SourceStatusPage
  - operation_id: searchPublicRecords
    api: public-api
    method: GET
    path: /v1/search
    blocking: true
    response_schema: PublicRecordsSearchResultPage
  states:
  - loading
  - success
  - empty
  - partial
  - stale
  - error
  responsive:
    wide: 12-column public grid; status/title 12; known-unknown-response 12; main evidence 8 + sticky context 4
    medium: 8-column grid; all primary regions span 8; context follows comparison
    compact: single column preserving status → known → unknown → response → comparison → evidence → history
    container: public_main
  accessibility:
    landmarks:
    - header
    - navigation
    - main
    - footer
    heading_rule: exactly one h1; section headings descend without skipping
    focus_rule: primary action and error summary are reachable; dialogs restore focus
    live_regions: save status, submission receipt, background refresh and command completion
  analytics_events:
  - public.home.viewed
  - public.search.started
  - public.home.record_opened
  forbidden:
  - 기관·업체 순위
  - 가격 배수 top list
  - click 기반 trending
  acceptance:
  - Route `/` renders under its declared access mode.
  - The section order exactly matches this manifest.
  - All blocking operations resolve before the success state.
  - Loading, empty, partial, stale and error states preserve the same information hierarchy.
  - Compact layout preserves semantic order and all critical actions.
  - No forbidden UI pattern appears.
  implementation_files:
    page: apps/public-web/src/routes/+page.svelte
    server_load_or_actions: apps/public-web/src/routes/+page.server.ts
    layout: apps/public-web/src/routes/+layout.server.ts
    error_boundary: apps/public-web/src/routes/+error.svelte
    view_model: apps/public-web/src/lib/view-models/pub-001.ts
    e2e: tests/e2e/screens/pub-001.spec.ts
    visual: tests/visual/pub-001.spec.ts
