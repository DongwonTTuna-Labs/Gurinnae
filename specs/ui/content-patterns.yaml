schema_version: 1
specification_version: 13.0.0
voice:
- 차분하고 직접적
- 출처와 시점을 명시
- 사실·계산·해석·당사자 주장을 구분
- 불확실성을 구체적으로 표현
- 조롱·선정성·AI 권위화 금지
public_status_labels:
  PUBLISHED_AS_ANOMALY:
    label: 이상 징후 공개
    description: 공개자료 비교에서 설명이 필요한 차이가 확인됨
  EXPLAINED:
    label: 설명 확인
    description: 추가 자료로 주요 차이에 합리적 설명이 확인됨
  REFERRED:
    label: 외부 기관 전달
    description: 감사·수사·언론 등 외부 기관에 자료를 전달함
  OFFICIALLY_CONFIRMED:
    label: 공식 확인
    description: 공식 감사·수사·판결 등에서 문제가 확인됨
  CORRECTED:
    label: 정정
    description: 공개 내용 일부가 수정됨
  RETRACTED:
    label: 철회
    description: 중대한 근거 오류 등으로 기존 공개를 철회함
claim_patterns:
- type: FACT
  template: '{source_owner}의 {source_date} 자료에는 {fact}로 기재되어 있습니다.'
  requires:
  - source_owner
  - source_date
  - evidence_id
- type: CALCULATION
  template: 공개자료의 {inputs}을 기준으로 계산한 {metric}은 {value}입니다.
  requires:
  - inputs
  - formula
  - rule_version
  - evidence_id
- type: COMPARISON
  template: 비교 조건을 충족한 {n}건의 {benchmark}보다 {ratio} 높습니다.
  requires:
  - n
  - cohort
  - benchmark
  - ratio
  - exclusions
- type: LIMITATION
  template: 공개된 자료만으로는 {unknown}을 확인할 수 없습니다.
  requires:
  - unknown
  - impact
- type: PARTY_STATEMENT
  template: '{party}는 {submitted_at} 제출한 답변에서 {statement}라고 밝혔습니다.'
  requires:
  - party
  - submitted_at
  - response_id
  - verification_scope
- type: OFFICIAL_FINDING
  template: '{authority}는 {published_at} 공개한 {record_type}에서 {finding}을 확인했습니다.'
  requires:
  - authority
  - published_at
  - official_record_id
title_rules:
  pattern: 기관 또는 사업 + 관찰된 현상 + 필요한 경우 상태
  good_examples:
  - 가상새빛시청 안전모 계약에서 비교군보다 높은 단가가 관찰됨
  - 가상한강공단 서버 유지보수 계약의 묶음 비용 설명 확인
  - 가상동부청 차량 임차 비교에서 단위 오류를 정정함
  forbidden:
  - 물음표로 범죄 암시
  - 충격·폭로·잡았다
  - 범인·비리 확정
  - AI 확률
button_rules:
  use_specific_verbs:
  - 근거 원문 보기
  - 답변 임시 저장
  - 답변 제출
  - 최신 snapshot 게시
  - 정정 요청 제출
  avoid:
  - 확인
  - 예
  - 처리
  - 실행
  - AI 분석
  save_submit_distinction: 임시 저장과 최종 제출은 색상뿐 아니라 label, consequence and receipt로 구분한다.
error_pattern:
  required_parts:
  - 실패한 작업
  - 입력 보존 여부
  - 해결 행동
  - 지원 reference
  forbidden:
  - 알 수 없는 오류가 발생했습니다만 단독 표시
empty_patterns:
  true_empty: 이 조건에 해당하는 기록이 없습니다.
  filtered_empty: 선택한 필터에 맞는 결과가 없습니다. 기간 또는 상태 필터를 줄여 보세요.
  coverage_gap: 이 기간의 자료는 아직 수집 범위에 포함되지 않습니다. 데이터 범위를 확인해 주세요.
  permission_empty: 현재 역할로 볼 수 있는 작업이 없습니다.
freshness_pattern: '{source_name} 자료는 {last_success_absolute} 이후 갱신되지 않았습니다. {affected_metrics}은 최신이 아닐 수 있습니다.'
no_response_pattern: '{requested_at} 소명을 요청했으며 {as_of} 현재 답변을 받지 못했습니다.'
correction_pattern: '{effective_at}, {reason}을 확인해 {field_or_claim}을 수정했습니다. 이전 내용은 {before}, 수정된 내용은 {after}입니다.'
ai_pattern:
  allowed: 조사 보조 모델이 추가 확인 항목을 제안했습니다. 사람이 검토하기 전에는 사건 사실에 반영되지 않습니다.
  forbidden: AI가 비리 가능성을 {percent}%로 판단했습니다.
number_date_rules:
- 금액에 통화·VAT·단위 표시
- missing은 0이 아니라 확인되지 않음
- 공개 시각에 absolute date/timezone
- ratio rounding policy 명시
- relative time은 보조
response_consent_labels:
  FULL: 제출 원문과 지정 첨부의 공개를 허용합니다.
  REDACTED: 개인정보·영업비밀을 가린 뒤 공개할 수 있습니다.
  SUMMARY_ONLY: 구린네가 검토한 요약만 공개할 수 있습니다.
  NO_CONSENT_REVIEW_LEGAL_BASIS: 공개에 동의하지 않습니다. 구린네는 별도 법적 근거를 검토합니다.
prohibited_phrases:
- 비리를 저질렀다
- 세금을 해먹었다
- 업체와 유착했다
- 뇌물을 받았다
- 사기 계약이다
- 부패 확률
- 범죄 가능성
- 또 걸렸다
- 잡았다
