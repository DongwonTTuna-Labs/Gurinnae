schema_version: 1
status: REVIEW_REQUIRED
scope: all 109 authority navigation actions with owner-resolved destinations
sources:
- specs/ui/screen-catalog.yaml
- specs/product/owner-addendum-2026-07-14.yaml#route_contract
rules:
- resolved means this proposal closes an unambiguous semantic edge; it does not mean the permitted source files already contain an action-to-screen
  binding.
- Canonical routes are token-free screen routes; token exchange endpoints are never navigation destinations.
- A route parameter marked exact_destination_request_type binds to the exact same-name typed destination request field.
- agencySlug and supplierSlug are the only public slug aliases explicitly typed by the owner addendum.
- CAS-011 runId maps to agentRunId UUID; SRC-004 runId maps to sourceRunId UUID.
- source_screen safe return means the source screen, its already-validated route params, and only an explicit query allowlist.
- A missing destination discriminator, binding, safe query key or return context is a validation failure and never an implementation
  default.
- A missing destination discriminator, binding, safe query key or return context is a validation failure and never an implementation
  default.
invalid_behavior_profiles:
  fixed_target_error: keep source screen and announce navigation unavailable; never synthesize another route
  row_target_fail_closed: omit or disable the row action when its typed identity is absent or invalid; never build an empty or coerced
    path
  current_context_fail_closed: keep source screen and surface a route-context error; never discard or substitute a current object ID
  response_session_fail_closed: redirect to RSP-008 without object-existence detail when the scoped response session is absent, invalid,
    expired, revoked, or consumed
  internal_target_fail_closed: keep source screen; show authorized generic unavailable state; do not disclose object existence or guess
    a destination
  same_screen_selection_fail_closed: retain current screen and focus the collection error/status; do not open a different record
  missing_contract_fail_closed: action cannot ship until the destination discriminator or selector contract is authority-defined
