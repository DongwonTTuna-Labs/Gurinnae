schema_version: 1
specification_version: 13.1.0-owner-addendum
status: REVIEW_REQUIRED
counts:
  profiles: 9
  unique_state_semantics: 36
  profile_state_templates: 72
runtime_signal_contract:
  type: ScreenRuntimeSignalsV1
  additional_properties: false
  rule: Every signal is bound by a screen contract to an operation result, persisted receipt, trusted session fact, or browser
    connectivity fact; a renderer cannot invent it.
selection_rules:
- A screen's explicit state_profile is authoritative.
- Background refresh and orthogonal overlays cannot replace the primary task state without declared precedence.
- A state is selected only when its typed trigger is true; trigger ties without coexistence or precedence fail closed.
- Saved and receipt require server or database acknowledgement; timer, toast and HTTP status alone are insufficient.
templates:
- profile_state_id: public-data::initial-loading
  profile: public-data
  state: initial-loading
  family: initial-read
  trigger: &id001
    all:
    - path: signals.blocking_pending
      op: eq
      value: true
    - path: signals.has_display_data
      op: eq
      value: false
  preserve: none
  action_policy: none
  focus: main-heading
  live: polite-once
  copy_frame:
    heading: '{screen_title} — initial-loading'
    summary: '{object_label}의 현재 범위와 영향을 설명한다.'
    preservation: '보존 범위: none'
    next_step: '허용 행동 정책: none'
  retry_safety: STATE_SPECIFIC
- profile_state_id: public-data::refreshing
