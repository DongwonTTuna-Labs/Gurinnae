schema_version: 2
specification_version: 13.0.0
status: FINAL
brand:
  product_name_ko: 구린네
  product_name_en: Gurine
  visual_thesis: 공공 기록 보관소와 탐사 데이터룸의 신뢰감을 결합한 증거 우선 인터페이스
  personality:
  - 차분함
  - 정확함
  - 검증 가능함
  - 비선정적
  - 공익적
  - 단호함
  forbidden_styles:
  - tabloid red-black scandal aesthetic
  - neon cyberpunk
  - gamified corruption ranking
  - AI chat-first interface
  - glassmorphism that lowers legibility
  - large decorative gradients behind evidence
color:
  primitive:
    paper:
      '0': '#FFFFFF'
      '25': '#FCFBF7'
      '50': '#F7F5EF'
      '100': '#EFECE3'
      '200': '#DDD8CC'
    ink:
      '300': '#A9A398'
      '500': '#726D64'
      '700': '#45413B'
      '900': '#20252B'
      '950': '#12171C'
    evidence_blue:
      '50': '#EEF6FB'
      '100': '#D8EAF6'
      '300': '#88B9D7'
      '500': '#3279A8'
      '700': '#1E557C'
      '900': '#143B57'
    verified_green:
      '50': '#EEF8F1'
      '100': '#D8EEDC'
      '500': '#2F7D50'
      '700': '#205A39'
      '900': '#153C27'
    caution_amber:
      '50': '#FFF8E8'
      '100': '#FCECC5'
      '500': '#A66A00'
      '700': '#744A00'
      '900': '#4B3100'
    correction_red:
      '50': '#FFF1F1'
      '100': '#F8DADA'
      '500': '#B54141'
      '700': '#7D2D2D'
      '900': '#511D1D'
    assist_violet:
      '50': '#F6F1FA'
      '100': '#E8DCF1'
      '500': '#71528D'
      '700': '#503A65'
      '900': '#352642'
  semantic:
    surface:
      canvas: '{paper.25}'
      primary: '{paper.0}'
      secondary: '{paper.50}'
      tertiary: '{paper.100}'
      raised: '{paper.0}'
      inverse: '{ink.950}'
      selected: '{evidence_blue.50}'
      scrim: rgba(18,23,28,0.56)
    text:
      primary: '{ink.950}'
      secondary: '{ink.700}'
      muted: '{ink.500}'
      disabled: '{ink.300}'
      inverse: '{paper.0}'
      link: '{evidence_blue.700}'
      link_hover: '{evidence_blue.900}'
    border:
      subtle: '{paper.200}'
      default: '#CEC8BB'
      strong: '{ink.300}'
      focus: '{evidence_blue.500}'
      inverse: '{ink.700}'
    action:
      primary_bg: '{evidence_blue.700}'
      primary_hover: '{evidence_blue.900}'
      primary_text: '{paper.0}'
      secondary_bg: '{paper.0}'
      secondary_hover: '{paper.50}'
      secondary_text: '{ink.900}'
      danger_bg: '{correction_red.700}'
      danger_hover: '{correction_red.900}'
    status:
      neutral:
        surface: '{paper.100}'
        text: '{ink.900}'
        border: '{ink.300}'
      information:
        surface: '{evidence_blue.50}'
        text: '{evidence_blue.900}'
        border: '{evidence_blue.500}'
      verified:
        surface: '{verified_green.50}'
        text: '{verified_green.900}'
        border: '{verified_green.500}'
      caution:
        surface: '{caution_amber.50}'
        text: '{caution_amber.900}'
        border: '{caution_amber.500}'
      correction:
        surface: '{correction_red.50}'
        text: '{correction_red.900}'
        border: '{correction_red.500}'
      ai_assist:
        surface: '{assist_violet.50}'
        text: '{assist_violet.900}'
        border: '{assist_violet.500}'
  contrast_policy:
    normal_text_min: 4.5:1
    large_text_min: '3:1'
    ui_boundary_min: '3:1'
    focus_ring_min: 3:1 against adjacent colors
typography:
  font_policy: No external font CDN. Production image installs Noto Sans CJK KR; system fallbacks remain.
  font_family:
    sans:
    - Noto Sans KR
    - Pretendard
    - Apple SD Gothic Neo
    - Malgun Gothic
    - system-ui
    - sans-serif
    serif_editorial:
    - Noto Serif KR
    - Batang
    - serif
    mono:
    - ui-monospace
    - SFMono-Regular
    - Consolas
    - monospace
  scale:
    display:
      size: clamp(2.5rem, 5vw, 4.75rem)
      line_height: 1.08
      weight: 650
      letter_spacing: -0.035em
    h1:
      size: clamp(2rem, 3.4vw, 3.5rem)
      line_height: 1.12
      weight: 650
      letter_spacing: -0.03em
    h2:
      size: clamp(1.5rem, 2vw, 2.25rem)
      line_height: 1.22
      weight: 650
      letter_spacing: -0.02em
    h3:
      size: 1.375rem
      line_height: 1.3
      weight: 650
      letter_spacing: -0.015em
    h4:
      size: 1.125rem
      line_height: 1.4
      weight: 650
      letter_spacing: -0.01em
    body_lg:
      size: 1.125rem
      line_height: 1.7
      weight: 400
    body:
      size: 1rem
      line_height: 1.62
      weight: 400
    body_sm:
      size: 0.875rem
      line_height: 1.55
      weight: 400
    label:
      size: 0.875rem
      line_height: 1.4
      weight: 600
    caption:
      size: 0.75rem
      line_height: 1.5
      weight: 500
    data_lg:
      size: 1.75rem
      line_height: 1.2
      weight: 650
      tabular: true
    data:
      size: 1rem
      line_height: 1.4
      weight: 600
      tabular: true
    code:
      size: 0.875rem
      line_height: 1.55
      weight: 400
  rules:
  - Korean body text uses line length 52–72 characters.
  - Long-form policy text may use serif only for quotations, never data labels.
  - All numeric tables use tabular figures.
  - All-caps is prohibited for Korean labels.
spacing:
  '0': 0rem
  '1': 0.25rem
  '2': 0.5rem
  '3': 0.75rem
  '4': 1rem
  '5': 1.25rem
  '6': 1.5rem
  '7': 1.75rem
  '8': 2rem
  '10': 2.5rem
  '12': 3rem
  '14': 3.5rem
  '16': 4rem
  '20': 5rem
  '24': 6rem
  '28': 7rem
  '32': 8rem
radius:
  none: '0'
  xs: 0.1875rem
  sm: 0.375rem
  md: 0.625rem
  lg: 0.875rem
  xl: 1.25rem
  pill: 9999px
border_width:
  hairline: 1px
  strong: 2px
  focus: 3px
shadow:
  none: none
  sm: 0 1px 2px rgba(18,23,28,0.08)
  md: 0 10px 28px rgba(18,23,28,0.12)
  lg: 0 22px 60px rgba(18,23,28,0.16)
  focus: 0 0 0 3px rgba(50,121,168,0.30)
layout:
  public:
    max_width: 1280px
    grid_columns: 12
    gutter:
      compact: 16px
      medium: 24px
      wide: 32px
    case_detail:
      main_columns: 8
      aside_columns: 4
      aside_sticky_top: 96px
    longform_max: 72ch
  internal:
    min_width_supported: 1024px
    sidebar: 248px
    task_rail: 232px
    context_panel: 360px
    content_min: 640px
    dense_table_row: 44px
  response:
    max_width: 760px
    step_content: 680px
  header:
    public: 68px
    internal: 56px
    response: 64px
  touch_target_min: 44px
breakpoints:
  compact:
    min: 0
    max: 639
  medium:
    min: 640
    max: 1023
  wide:
    min: 1024
    max: 1439
  extra_wide:
    min: 1440
    max: null
motion:
  durations:
    instant: 0ms
    fast: 120ms
    normal: 180ms
    slow: 280ms
  easing:
    standard: cubic-bezier(.2,.8,.2,1)
    enter: cubic-bezier(0,0,.2,1)
    exit: cubic-bezier(.4,0,1,1)
  rules:
  - No animation delays access to evidence.
  - State changes longer than 300ms are prohibited.
  - Reduced motion removes transforms and nonessential fades.
iconography:
  style: 2px rounded stroke, 20px default
  labels_required_for:
  - status
  - high-impact actions
  - navigation on first use
  forbidden:
  - emoji as product icon
  - police siren icon for anomaly
  - skull or criminal imagery
data_visualization:
  palette:
  - '#3279A8'
  - '#2F7D50'
  - '#A66A00'
  - '#71528D'
  - '#726D64'
  target: '#B54141'
  median: '#143B57'
  excluded: '#A9A398'
  rules:
  - Every chart has a table or text equivalent.
  - Axes begin at an honest baseline or explicitly show truncation.
  - Price comparison displays unit, VAT basis, date, bundle and inclusion reason.
  - Red is reserved for correction, destructive action or target marker, not generic suspicion.
density:
  public: comfortable
  response: comfortable
  internal_default: compact
  internal_user_choice:
  - compact
  - comfortable
