schema_version: 1
specification_version: 13.0.0
status: FINAL
algorithm: HMAC-SHA-256
token_format:
  service: gurine-sa-v1.<kid>.<payloadBase64UrlNoPadding>.<signatureBase64UrlNoPadding>
  actor: gurine-aa-v1.<kid>.<payloadBase64UrlNoPadding>.<signatureBase64UrlNoPadding>
  kid_derivation: first 16 lowercase hexadecimal characters of SHA-256(raw key bytes)
canonical_payload:
  name: Gurine Canonical JSON v1
  encoding: UTF-8
  object_key_order: ascending Unicode code point; assertion schemas restrict keys and values to ASCII
  whitespace: none
  separators: ''','' and '':'''
  numbers: base-10 integers only; no floats, exponent, NaN or Infinity
  strings: ASCII only; paths and query values use normalized percent-encoding
  arrays: preserve declared order; capabilities are sorted ascending and unique before serialization
  signature_input: <prefix>.<kid>.<payloadBase64UrlNoPadding> encoded as ASCII
request_binding:
  canonical_request_digest: >-
    sha256(upper(method) + "\n" + normalizedPath + "\n" + querySha256 + "\n" + bodySha256 + "\n" + lower(contentType)
    + "\n" + (idempotencyKeySha256 or "") + (nextSubmissionSessionSha256 is present ? "\n" + nextSubmissionSessionSha256 : ""))
  query: RFC3986 percent encoding; keys and values bytewise sorted; duplicate keys preserved; empty query hashes empty bytes
  body: SHA-256 of exact bytes forwarded to Control API; empty body hashes empty bytes
  path: absolute path only; dot-segments rejected before normalization; no scheme, authority, fragment or percent-decoded slash
  content_type: empty for bodyless requests; otherwise exactly application/json after parameter stripping and lowercasing
  idempotency: all non-GET Control commands bind SHA-256 of the exact Idempotency-Key; queries use null
  next_submission_session: When X-Gurine-Next-Submission-Session is present, append one seventh line containing the lowercase SHA-256
    of its exact bytes. Absence appends no line and preserves the historical six-line digest. A supplied header requires an exact
    matching nextSubmissionSessionSha256 claim; a signed claim without the header is rejected.
service_assertion:
  prefix: gurine-sa-v1
  issuer: review-console
  audience: identity-api
  max_ttl_seconds: 30
  clock_skew_seconds: 5
  single_use: true
  schema: service-assertion.schema.json
  required_header: X-Gurine-Service-Assertion
actor_assertion:
  prefix: gurine-aa-v1
  issuer: identity-api
  audience: control-api
  max_ttl_seconds: 20
  clock_skew_seconds: 5
  single_use: true
  schema: actor-assertion.schema.json
  required_header: X-Gurine-Actor-Assertion
  capability_hash: SHA-256 lowercase hex of capabilities joined with newline after sort/deduplication
  step_up: Identity API consumes the action-bound proof before issuing the assertion; actionDigest is null for ordinary calls and
    exact lowercase SHA-256 only for calls whose assurance level is STEP_UP.
  issuer_operation: issueActorAssertion only
  session_resolution_operation: resolveInternalSession does not issue an assertion
  required_payload_fields:
  - operationId
  - requiredCapability
  - assuranceLevel
  - idempotencyKeySha256
  - stepUpAuthorizationId
  assurance: Identity API derives required assurance from specs/auth/assurance-policy.yaml; BFF echo must match. Control API verifies
    the signed assuranceLevel against the same compiled policy.
operation_capability_resolution:
  submitReview:
    selector: criteria.namedIndividualOverride
    schema_precondition: the downstream submitReviewRequest is closed and namedIndividualOverride, when present, is a non-null closed object
    absent_capability: review.editorial
    present_capability: review.legal
    resolution: exactly one capability; accepting either capability or requiring both is forbidden
    review_console_bff: derive the exact capability from the same downstream body bytes used for bodySha256 and send that single value as issueActorAssertion.requiredCapability
    identity_api: require the session to hold that exact requested capability, then sign it as requiredCapability in the actor assertion already bound to downstream bodySha256; Identity API receives no duplicate downstream body
    control_api: parse the asserted downstream body, recompute the selector branch, and require signed requiredCapability equality before capability authorization, audit, or command dispatch
    database_owner: editorial.submit_review_decision recomputes the selector branch from the typed command and requires equality with the actor assertion and audit capability before every write
    mismatch_error: CAPABILITY_DENIED
    grant_rule: this policy does not add review.legal to any role or permit a LEGAL_REVIEWER to satisfy review.editorial
    assurance_composition: capability and assurance are independent; namedIndividualOverride selects only requiredCapability, while the existing decision policy keeps APPROVE at STEP_UP and REJECT or CHANGES_REQUIRED at ACTIVE_SESSION
replay_protection:
  relation: ops.assertion_replay_guard
  consume_function: ops.consume_assertion_jti(text,uuid,text,text,timestamptz,char(64))
  atomicity: JTI consumption occurs before protected work; command retry obtains a new assertion and reuses the same Idempotency-Key.
  retention: delete rows only after expires_at + 5 minutes; cleanup is a bounded scheduler job
key_rotation:
  issuer_signs_with: current key only
  verifier_accepts: current and previous keys only; kid must match derived key fingerprint
  previous_key_window: previous key may verify only assertions whose exp is within the assertion maximum TTL and while the previous
    key remains configured
  unknown_kid: reject without attempting every key
  comparison: constant-time signature comparison after exact length check
error_codes:
  service:
  - SERVICE_ASSERTION_REQUIRED
  - SERVICE_ASSERTION_INVALID
  - SERVICE_ASSERTION_EXPIRED
  - SERVICE_ASSERTION_AUDIENCE_MISMATCH
  - SERVICE_ASSERTION_REQUEST_MISMATCH
  - SERVICE_ASSERTION_REPLAYED
  actor:
  - ACTOR_ASSERTION_REQUIRED
  - ACTOR_ASSERTION_INVALID
  - ACTOR_ASSERTION_EXPIRED
  - ACTOR_ASSERTION_AUDIENCE_MISMATCH
  - ACTOR_ASSERTION_REQUEST_MISMATCH
  - ACTOR_ASSERTION_REPLAYED
implementation_rules:
- First-party Rust uses the hmac and sha2 safe APIs; no unsafe or direct FFI.
- Decode and validate schema before evaluating authorization claims.
- Reject duplicate keys, noncanonical payload bytes, unknown fields and padding in base64url segments.
- Do not log assertion tokens, signatures, session IDs, subjects or capabilities.
- Control API never receives or evaluates the browser session cookie or browser CSRF token.
- Control API never receives or consumes a raw step-up proof/authorization token.
- Identity API is the only service granted step-up authorization claim/close functions.
action_authorization:
  canonical_json_fields_in_order_after_key_sort:
  - aggregateId
  - aggregateType
  - businessPayloadSha256
  - expectedVersion
  - idempotencyKeySha256
  - operationId
  action_digest: SHA-256 of UTF-8 key-sorted compact JSON ActionAuthorizationContext
  high_impact_requirement: Actor Assertion must carry matching non-null actionDigest, stepUpAuthorizationId and idempotencyKeySha256
  ordinary_requirement: actionDigest and stepUpAuthorizationId are null; idempotency key still binds non-GET commands
  step_up_requirement: Only operations whose assurance level is STEP_UP require non-null actionDigest, stepUpAuthorizationId and
    idempotencyKeySha256.
  recent_session_requirement: RECENT_SESSION requires now-authTime <= 1800 seconds and null stepUpAuthorizationId/actionDigest.
  active_session_requirement: ACTIVE_SESSION requires a valid session and null stepUpAuthorizationId/actionDigest.
step_up_retry:
  authorization_ttl_seconds: 300
  maximum_actor_assertion_issues: 3
  binding:
  - sessionId
  - actionDigest
  - idempotencyKeySha256
  retry_rule: BFF must reuse the same Idempotency-Key and exact request bytes, request a fresh Actor Assertion JTI from Identity
    API, and never reuse an Actor Assertion token.
  close_rule: BFF closes the authorization after it receives a terminal Control API receipt; an unclosed grant expires automatically.
  network_failure: Up to three Actor Assertion issues are permitted for the same authorization; a fourth issue is rejected and
    requires a new step-up ceremony.
public_error_mapping:
  SERVICE:
    ASSERTION_FORMAT_INVALID: SERVICE_ASSERTION_INVALID
    ASSERTION_UNKNOWN_KEY: SERVICE_ASSERTION_INVALID
    ASSERTION_NONCANONICAL_PAYLOAD: SERVICE_ASSERTION_INVALID
    ASSERTION_SIGNATURE_INVALID: SERVICE_ASSERTION_INVALID
    ASSERTION_SCHEMA_INVALID: SERVICE_ASSERTION_INVALID
    ASSERTION_ISSUED_IN_FUTURE: SERVICE_ASSERTION_INVALID
    ASSERTION_EXPIRED: SERVICE_ASSERTION_EXPIRED
    ASSERTION_AUDIENCE_MISMATCH: SERVICE_ASSERTION_AUDIENCE_MISMATCH
    ASSERTION_REQUEST_MISMATCH: SERVICE_ASSERTION_REQUEST_MISMATCH
    ASSERTION_REPLAYED: SERVICE_ASSERTION_REPLAYED
  ACTOR:
    ASSERTION_FORMAT_INVALID: ACTOR_ASSERTION_INVALID
    ASSERTION_UNKNOWN_KEY: ACTOR_ASSERTION_INVALID
    ASSERTION_NONCANONICAL_PAYLOAD: ACTOR_ASSERTION_INVALID
    ASSERTION_SIGNATURE_INVALID: ACTOR_ASSERTION_INVALID
    ASSERTION_SCHEMA_INVALID: ACTOR_ASSERTION_INVALID
    ASSERTION_ISSUED_IN_FUTURE: ACTOR_ASSERTION_INVALID
    ASSERTION_EXPIRED: ACTOR_ASSERTION_EXPIRED
    ASSERTION_AUDIENCE_MISMATCH: ACTOR_ASSERTION_AUDIENCE_MISMATCH
    ASSERTION_REQUEST_MISMATCH: ACTOR_ASSERTION_REQUEST_MISMATCH
    ASSERTION_REPLAYED: ACTOR_ASSERTION_REPLAYED
submission_bff_service_assertion:
  prefix: gurine-sa-v1
  issuers:
    public-web:
      audience: submission-api
      currentKeyEnv: PUBLIC_WEB_SUBMISSION_HMAC_KEY_CURRENT
      previousKeyEnv: PUBLIC_WEB_SUBMISSION_HMAC_KEY_PREVIOUS
    response-portal:
      audience: submission-api
      currentKeyEnv: RESPONSE_PORTAL_SUBMISSION_HMAC_KEY_CURRENT
      previousKeyEnv: RESPONSE_PORTAL_SUBMISSION_HMAC_KEY_PREVIOUS
  max_ttl_seconds: 30
  clock_skew_seconds: 5
  single_use: true
  request_binding: same canonical request digest as service_assertion, including the conditional seventh digest line for
    X-Gurine-Next-Submission-Session
  next_submission_session_binding:
    header: X-Gurine-Next-Submission-Session
    claim: nextSubmissionSessionSha256
    digest: lowercase SHA-256 of the exact 43-byte base64url-no-padding header value
    requirement: The header and claim are either both absent or both present and equal after digesting; raw session bytes never enter
      the assertion payload, persistence, receipts, events, audit, logs, traces or errors.
  replay_guard: ops.assertion_replay_guard
  header: X-Gurine-Service-Assertion
