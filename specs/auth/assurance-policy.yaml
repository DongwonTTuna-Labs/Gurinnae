schema_version: 2
specification_version: 13.0.0
status: FINAL
authority: Security assurance is independent from visual interaction severity.
levels:
  ANONYMOUS_PROOF:
    rank: 0
    definition: Anonymous anti-abuse or email proof; no internal session.
  SCOPED_TOKEN:
    rank: 1
    definition: Opaque token scoped to one external response, correction, subscription or receipt workflow.
  ACTIVE_SESSION:
    rank: 2
    definition: Active OIDC-backed internal session and request-bound Actor Assertion.
  RECENT_SESSION:
    rank: 3
    definition: Active internal session whose authTime or successful stepUpAt is no older than recent_session_max_age_seconds.
  STEP_UP:
    rank: 4
    definition: Bounded Identity-API step-up authorization and request-bound Actor Assertion.
recent_session_max_age_seconds: 900
rules:
- interaction_kind never implies an assurance level
- public and response surfaces never request internal OIDC STEP_UP
- conditional policies are resolved from a declared fixed request or the validated request body
- STEP_UP_REQUIRED is exposed exactly when a valid request branch may require STEP_UP
