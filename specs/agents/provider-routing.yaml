schema_version: 1
specification_version: 13.0.0
status: FINAL
development: deterministic provider double; no external key required
production:
  provider_order_env: AI_PROVIDER_ORDER
  required_capabilities:
  - structured_output
  - approved_data_retention
  - approved_dpa
  budget_reservation: reserve max cost before dispatch; settle after validated output
  fallback: next approved provider only on provider failure; never on policy or schema
    failure
  abstention: all providers unavailable or budget unavailable => ABSTAINED/BUDGET_BLOCKED
prompt_injection:
  tool_results_are_untrusted: true
  no_dynamic_tool_creation: true
  no_instruction_following_from_evidence: true
  citation_ids_must_belong_to_snapshot: true
