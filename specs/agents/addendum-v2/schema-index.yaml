schema_version: 1
specification_version: 13.0.0+agent-multimodal.1
status: REVIEW_REQUIRED

canonical_json:
  algorithm: RFC8785_JCS_UTF8
  digest: SHA-256 lowercase hexadecimal over the exact canonical bytes
  integer_rule: Monetary values use integer micro-KRW; floating point is forbidden in identity, budget, cost, or receipt fields.
  array_rule: Arrays that participate in a digest declare their order; set-like arrays are sorted by the keys named in the owning contract and reject duplicates.
  timestamp_rule: RFC 3339 UTC with Z and microsecond precision; database values round-trip without synthesis.

runtime_schemas:
  - {type: AgentRunV2, path: schemas/agent-run.schema.json}
  - {type: ProviderTurnV2, path: schemas/provider-turn.schema.json}
  - {type: ToolCallV2, path: schemas/tool-call.schema.json}
  - {type: AgentRunControlReceiptV2, path: schemas/agent-run-control-receipt.schema.json}
  - {type: AgentReconciliationEvidenceV1, path: schemas/agent-reconciliation-evidence.schema.json}
  - {type: OutputValidationV2, path: schemas/output-validation.schema.json}
  - {type: MarketResearchOutputV2, path: schemas/market-research-output.schema.json}
  - {type: InvestigatorOutputV2, path: schemas/investigator-output.schema.json}
  - {type: SkepticOutputV2, path: schemas/skeptic-output.schema.json}
  - {type: ClaimDraftOutputV2, path: schemas/claim-draft-output.schema.json}
  - {type: CitationVerificationOutputV2, path: schemas/citation-verification-output.schema.json}
  - {type: CommunicationProposalPayloadV1, path: schemas/communication-proposal-payload.schema.json}
  - {type: AgentProposalV2, path: schemas/agent-proposal.schema.json}
  - {type: SourceUseV2, path: schemas/source-use.schema.json}
