schema_rules:
  - Every listed JSON document uses JSON Schema draft 2020-12, has a stable $id, and closes every object with additionalProperties false.
  - Tool schemas are not aliases, copies with only a title change, or generic key/value envelopes.
  - Each tool request and response has a tool-specific schemaVersion const and its declared unique field.
  - Local $ref paths must resolve inside addendum-v2; references to the base v1 generic tool schemas are forbidden.
  - Runtime DTO validation is performed before persistence, after persistence round-trip, before provider/tool dispatch, and before CAS rendering.

identity_digest_projections:
  algorithm: RFC8785_JCS_UTF8_SHA256
  rule: Each identity digest is calculated from the exact root object after removing only the named root identity field. Nested digests remain. Canonical bytea stores this projection, never a payload containing its own digest.
  projections:
    ProviderReceiptV2: receiptSha256
    ResearchArtifactV2: artifactSha256
    SourceUseV2: sourceUseSha256
    CitationV2: citationSha256
    OutputValidationV2: validationSha256
    PromoteResearchArtifactReceiptV1: receiptSha256
    AgentRunControlReceiptV2: receiptSha256
    AgentReconciliationEvidenceV1: evidenceSha256
    ProvenanceGraphV2: graphSha256
  cross_runtime_oracle: Rust, PostgreSQL 18.4, and TypeScript must produce byte-identical canonical projections and SHA-256 for the shared golden corpus; including the identity field or mutating one projected byte is a hard failure.
