schema_version: 2
specification_version: 13.0.0
status: FINAL
rules:
- Every external object schema is closed.
- HTTP field names use lowerCamelCase.
- Applied filter echoes use operation-specific closed schemas.
- Case counts use canonical typed state count objects.
resources:
  AboutContent:
    schema:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ContentSection'
        sourceLinks:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
      - version
      - title
      - updatedAt
      - sections
      - sourceLinks
    apis:
    - public-api
  AboutContentResponse:
    schema:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/uuid-or-string'
        version:
          type: integer
          format: int64
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
        summary:
          type: string
        data:
          $ref: '#/components/schemas/AboutContent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
      - id
      - status
      - data
      - links
    apis:
    - public-api
  AccessibilityStatement:
    schema:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
