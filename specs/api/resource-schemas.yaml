        version:
          type: integer
          format: int64
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
        summary:
          type: string
        data:
          $ref: '#/components/schemas/AccessibilityStatement'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
      - id
      - status
      - data
      - links
    apis:
    - public-api
  ActionAuthorizationContext:
    schema:
      type: object
      additionalProperties: false
      properties:
        operationId:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9]{1,127}$
        aggregateType:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,127}$
        aggregateId:
          type: string
          minLength: 1
          maxLength: 200
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        businessPayloadSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        idempotencyKeySha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - operationId
      - aggregateType
      - aggregateId
      - expectedVersion
      - businessPayloadSha256
      - idempotencyKeySha256
    apis:
    - identity-service-internal
  ActorAssertionToken:
    schema:
      type: string
      pattern: ^gurine-aa-v1\.[a-f0-9]{16}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$
      description: Compact actor assertion defined by specs/auth/assertion-contract.yaml.
    apis:
    - identity-service-internal
  ActorIdentity:
    schema:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName: &id001
          type: string
        roleCodes:
          type: array
          items: *id001
        capabilities:
          type: array
          items: *id001
      required:
