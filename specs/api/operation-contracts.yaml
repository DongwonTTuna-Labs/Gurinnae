- operation_id: placeLegalHold
  status: READY
  api: control-api
  method: POST
  path: /v1/internal/commands/place-legal-hold
  purpose:
  - place a retention, disclosure or deletion legal hold on one exact typed target anchor
  consumers:
  - REV-002
  auth: actor-assertion-and-capability
  capability: review.legal
  request_fields:
  - name: target
    type: LegalHoldTargetBindingV1
    required: true
    in: body
  - name: scopeAtoms
    type: array:enum:RETENTION,DELETION,DISCLOSURE
    required: true
    in: body
  - name: affectedIds
    type: array:uuid
    required: true
    in: body
  - name: authorityReference
    type: string
    required: true
    in: body
  - name: reasonCode
    type: string
    required: true
    in: body
  - name: reason
    type: string
    required: true
    in: body
  - name: expiresAt
    type: nullable:date-time
    required: false
    in: body
  request_schema: placeLegalHoldRequest
  response_schema: placeLegalHoldReceipt
  legal_hold_target_contract:
    discriminator: target.targetKind
    target_kinds:
    - CASE
    - PUBLICATION
    - EVIDENCE
    - RESPONSE
    - SOURCE_ASSET
    - RESEARCH_ARTIFACT
    - PRIVACY_REQUEST
    - COMMUNICATION_SUBJECT
    - SUPPLIER_RETENTION_SNAPSHOT
    - AGENCY_RETENTION_SNAPSHOT
    - CORRECTION
    - SUBSCRIPTION
    - COMMUNICATION_ENDPOINT
    exact_common_binding:
    - targetId
    - targetVersion
    - targetDigest
    entity_retention_rule: supplier and agency targets bind an immutable ops.entity_retention_snapshots_v1 identity and digest; mutable entity UUIDs are not legal-hold anchors
    correction_rule: targetId equals correctionSnapshotId, targetVersion and targetDigest bind ops.privacy_correction_snapshots_v1(snapshot_id,correction_id,snapshot_version,snapshot_digest) exactly, and correctionId binds the snapshotted object
    subscription_rule: targetId equals subscriptionSnapshotId, targetVersion and targetDigest bind ops.privacy_subscription_snapshots_v1(snapshot_id,subscription_id,snapshot_version,snapshot_digest) exactly, and subscriptionId binds the snapshotted object
    communication_endpoint_rule: targetId equals communicationEndpointId and the common target tuple binds intake.communication_endpoints(id, version, endpoint_digest) exactly; endpointSnapshotDigest is not accepted
    explicitly_unsupported:
      target_kind: AUDIT_SUBJECT_RECORD
      error: LEGAL_HOLD_TARGET_UNSUPPORTED
      http_status: 422
      reason: no authoritative source relation exists from which to derive and lock a target version and canonical digest
      unlock_condition: a versioned immutable audit-subject source relation, canonical digest preimage, owner lock and exact anchor foreign key are authorized
    owner: ops.place_legal_hold_v2
    direct_table_write: forbidden
  idempotency: required
  optimistic_concurrency: target-binding-procedure-owned
