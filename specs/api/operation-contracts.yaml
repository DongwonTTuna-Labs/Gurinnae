- operation_id: submitReview
  status: READY
  api: control-api
  method: POST
  path: /v1/internal/commands/submit-review
  purpose:
  - review decision
  consumers:
  - REV-002
  auth: actor-assertion-and-capability
  capability: review.editorial
  capability_policy:
    mode: CONDITIONAL
    default: review.editorial
    conditions:
    - when:
        field: criteria.namedIndividualOverride
        operator: ABSENT
      required_capability: review.editorial
    - when:
        field: criteria.namedIndividualOverride
        operator: PRESENT
      required_capability: review.legal
    resolution: EXACTLY_ONE
    any_of_forbidden: true
    mismatch_error: CAPABILITY_DENIED
    assurance_composition: independent; capability is selected only by namedIndividualOverride presence, while assurance remains selected only by decision under the existing assurance_policy
  request_fields:
  - name: reviewSnapshotId
    type: uuid
    required: true
    in: body
  - name: decision
    type: enum:approve,reject,changes_required
    required: true
    in: body
  - name: reason
    type: string
    required: true
    in: body
  - name: criteria
    type: ReviewCriteria
    required: true
    in: body
  request_schema: submitReviewRequest
  response_schema: submitReviewReceipt
  named_individual_review_guard:
    applies_when: decision is approve and the exact snapshot contains a NAMED_INDIVIDUAL finding
    criteria_path: criteria.namedIndividualOverride
    closed_override_fields:
    - publicTextSha256
    - reasonCode
    - officialSourceLocator
    - officialSourceSha256
    - editorialReviewDecisionId
    allowed_reason_code_values:
    - PUBLIC_FIGURE
    - OFFICIAL_DISPOSITION_QUOTE
    exact_binding: publicTextSha256 must equal the reviewed snapshot public-text digest, officialSourceSha256 must bind the cited official source, and editorialReviewDecisionId must reference an immutable APPROVE decision for that snapshot
    first_editorial_stage:
      actor_role: EDITOR
      decision: approve
      override_field: forbidden
      result: immutable independent editorial APPROVE only; set or preserve legalReviewRequired and grant no publish authority
    second_legal_stage:
      actor_role: LEGAL_REVIEWER
      required_assurance: STEP_UP
      decision: approve
      override_field: required
      referenced_decision: editorialReviewDecisionId must identify the first-stage APPROVE for the exact snapshot
      result: immutable legal APPROVE plus exact override receipt
    actor_rule: the current submitReview actor is the legal reviewer exactly when namedIndividualOverride is present
    capability_rule: a schema-valid request without namedIndividualOverride requires only review.editorial; a schema-valid request with namedIndividualOverride requires only review.legal; accepting either capability or requiring both is forbidden
    capability_assurance_cross_rule: namedIndividualOverride presence never lowers or selects assurance; decision approve remains STEP_UP and reject or changes_required remains ACTIVE_SESSION under the existing assurance policy
    reviewer_rule: the reviewer on the referenced APPROVE decision must differ from both the snapshot author and the current legal actor
    publish_authority: neither decision alone authorizes publication; named-individual publication requires both decisions plus the exact override receipt
    legal_reviewed_source: receipt-derived only; caller-supplied legalReviewed is forbidden
    failure_error: PUBLICATION_GATE_BLOCKED
