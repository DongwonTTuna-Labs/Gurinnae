components:
  securitySchemes:
    BffServiceAssertion:
      type: apiKey
      in: header
      name: X-Gurine-Service-Assertion
      description: Single-use request-bound Gurine Service Assertion issued by public-web
        or response-portal for audience submission-api.
    ScopedSubmissionSession:
      type: apiKey
      in: header
      name: X-Gurine-Submission-Session
      description: Opaque scoped session token forwarded only by an authenticated
        SvelteKit BFF; browsers store it only inside an authenticated-encrypted host-only
        cookie.
  schemas:
    AbuseProof:
      type: object
      additionalProperties: false
      required:
      - provider
      - token
      - action
      properties:
        provider:
          type: string
          enum:
          - TURNSTILE
          - HCAPTCHA
          - SYNTHETIC_TEST
        token:
          type: string
          minLength: 1
          maxLength: 4096
        action:
          type: string
          minLength: 1
          maxLength: 80
        issuedAt:
          type:
          - integer
          - 'null'
          minimum: 0
    AttachmentConsent:
      type: object
      additionalProperties: false
      properties:
        attachmentId:
          type: string
          format: uuid
        mayPublish:
          type: boolean
        redactionAllowed:
          type: boolean
      required:
      - attachmentId
      - mayPublish
      - redactionAllowed
    AttachmentPolicy:
      type: object
      additionalProperties: false
      properties:
        maxBytes:
          type: integer
          format: int64
        allowedMediaTypes:
          type: array
          items:
            type: string
        maxCount:
          type: integer
          format: int64
        scanRequired:
          type: boolean
        retentionDays:
          type: integer
          format: int64
      required:
      - maxBytes
      - allowedMediaTypes
      - maxCount
      - scanRequired
      - retentionDays
    AttachmentStatus:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        uploadStatus:
          type: string
        scanStatus:
          type: string
        publicationConsent:
          type: boolean
      required:
      - id
      - filename
      - mediaType
      - sizeBytes
      - sha256
      - uploadStatus
      - scanStatus
      - publicationConsent
    BinaryDownload:
      type: object
      additionalProperties: false
      properties:
        binary:
          type: string
          format: binary
      required:
      - binary
    ContactChannel:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
        officeHours:
          type: string
        expectedResponseDays:
          type: integer
          format: int64
      required:
      - email
      - officeHours
      - expectedResponseDays
    CorrectionDraftPreview:
      type: object
      additionalProperties: false
      required:
      - draft
      - attachments
      - warnings
      - submissionDigest
