  /v1/cases/download:
    get:
      operationId: downloadPublicCases
      tags:
      - operations
      summary: 현재 사건 필터 결과 내려받기
      description: 'Final v13 contract. Kind: QUERY. Capability: public.read.

        최대 5,000행을 CSV 또는 JSONL로 반환한다. CSV의 첫 논리 레코드는 한 셀짜리 고지이고

        다음 레코드부터 헤더와 데이터가 이어진다. JSONL의 첫 레코드는

        {"notice":"이상 징후 기록이며 위법·부패의 확정이 아님"}이고 이후 레코드가 데이터다.

        rowCount는 고지 레코드를 제외한다. 응답 envelope의 nonConclusionNotices는 데이터 행의

        비어 있지 않은 nonConclusion을 행 순서대로 중복 제거한 배열이며, interpretationNotice는

        사건 상태 고지와 의미를 섞지 않도록 null이다.'
      parameters:
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - CSV
          - JSONL
      - name: publicationState
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: agencyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sidoCode
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{2}$
      - name: sigunguCode
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{5}$
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: query
        required: false
        schema:
          type: string
      - name: publishedFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: publishedTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hasResponse
        in: query
        required: false
        schema:
          type: boolean
      - name: hasCorrection
        in: query
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - updated_desc
          - published_desc
          - title_asc
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCasesDownload'
        '400':
          description: 'Problem response: INVALID_PARAMETER'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - INVALID_PARAMETER
        '422':
          description: 'Problem response: PRECONDITION_FAILED. 현재 조건의 결과가 5,000건을
            초과합니다. 전체 자료는 데이터 내려받기에서 요청하세요.'
          content:
            application/problem+json:
              schema:
