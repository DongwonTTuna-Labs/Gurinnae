    CaseReproducibilityDownload:
      type: object
      additionalProperties: false
      description: '한 사건의 재현 정보를 내려받는 공개 재배포 산출물. JSON 본문은 notice와 상태별

        nonConclusion을 최상위에 포함하고, CSV 본문은 notice 한 셀 행 뒤에 헤더와

        nonConclusion을 포함한 정확히 한 데이터 행을 둔다.'
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          const: READY
        version:
          type: integer
          format: int64
          minimum: 1
        notice:
          type: string
          const: 이상 징후 기록이며 위법·부패의 확정이 아님
        filename:
          type: string
          minLength: 1
        mediaType:
          type: string
          minLength: 1
        byteLength:
          type: integer
          format: int64
          minimum: 1
        contentSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        contentBase64:
          type: string
          minLength: 1
        format:
          type: string
          enum:
          - JSON
          - CSV
        rowCount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1
        appliedFilters:
          $ref: '#/components/schemas/CaseReproducibilityDownloadAppliedFilters'
        generatedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - version
      - notice
      - filename
      - mediaType
      - byteLength
      - contentSha256
      - contentBase64
      - format
      - rowCount
      - appliedFilters
      - generatedAt
