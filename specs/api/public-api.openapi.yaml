      tags:
      - operations
      summary: 현재 검색 필터 결과 내려받기
      description: 'Final v13 contract. Kind: QUERY. Capability: public.read.

        최대 5,000행을 CSV 또는 JSONL로 반환한다. CSV의 첫 논리 레코드는 한 셀짜리 고지이고

        다음 레코드부터 헤더와 데이터가 이어진다. JSONL의 첫 레코드는

        {"notice":"이상 징후 기록이며 위법·부패의 확정이 아님"}이고 이후 레코드가 데이터다.

        rowCount는 고지 레코드를 제외한다. 응답 envelope의 nonConclusionNotices는 검색 데이터

        행의 비어 있지 않은 nonConclusion을 행 순서대로 중복 제거하며, interpretationNotice는

        검색 데이터 행에 운영 상태 고지가 하나라도 있을 때 그 정확한 고지를, 없으면 null을 가진다.'
      parameters:
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - CSV
          - JSONL
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: publicationState
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: agencyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sidoCode
