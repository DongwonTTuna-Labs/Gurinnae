    PublicCasesDownload:
      type: object
      additionalProperties: false
      description: '최대 5,000개 사건 레코드의 동기 내려받기 결과. CSV는

        `이상 징후 기록이며 위법·부패의 확정이 아님` 한 셀 레코드 뒤에 헤더와 데이터가

        이어지고, JSONL은 같은 문구를 notice 값으로 가진 첫 객체 뒤에 데이터가 이어진다.

        rowCount는 고지 레코드를 제외한다. nonConclusionNotices는 데이터 행의 비어 있지 않은

        nonConclusion을 행 순서대로 중복 제거하고 interpretationNotice는 null이다.'
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - READY
        version:
          type: integer
          format: int64
          minimum: 1
        notice:
          type: string
          const: 이상 징후 기록이며 위법·부패의 확정이 아님
        nonConclusionNotices:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        interpretationNotice:
          type: 'null'
        filename:
          type: string
          minLength: 1
        mediaType:
          type: string
        byteLength:
          type: integer
          format: int64
          minimum: 0
        contentSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        contentBase64:
          type: string
        format:
          type: string
          enum:
          - CSV
          - JSONL
        rowCount:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000
        appliedFilters:
          $ref: '#/components/schemas/PublicCasesAppliedFilters'
        generatedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - version
      - notice
      - nonConclusionNotices
      - interpretationNotice
      - filename
      - mediaType
      - byteLength
      - contentSha256
