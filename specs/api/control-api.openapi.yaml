    createAuditExportRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        format:
          type: string
          enum:
          - CSV
          - JSONL
        scope:
          type: string
          enum:
          - CASE
          - OBJECT
          - GLOBAL
        objectType:
          type:
          - string
          - 'null'
          enum:
          - CASE
          - SIGNAL
          - SOURCE
          - USER
          - ROLE
          - JOB
          - PROVIDER
          - null
        objectId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 10
          maxLength: 2000
        watermarkPolicy:
          type: string
          enum:
          - ACTOR_AND_TIME
          - CLASSIFICATION_BANNER
        expiresInSeconds:
          type: integer
          minimum: 300
          maximum: 86400
      required:
      - from
      - to
      - format
      - scope
      - objectType
      - objectId
      - reason
      - watermarkPolicy
      - expiresInSeconds
      allOf:
      - if:
          properties:
            scope:
              const: GLOBAL
        then:
          properties:
            objectType:
              type: 'null'
            objectId:
              type: 'null'
      - if:
          properties:
            scope:
              const: CASE
        then:
          properties:
            objectType:
              const: CASE
            objectId:
              type: string
              minLength: 1
      - if:
          properties:
            scope:
              const: OBJECT
        then:
          properties:
            objectType:
              type: string
              enum:
              - SIGNAL
              - SOURCE
              - USER
              - ROLE
              - JOB
              - PROVIDER
            objectId:
              type: string
              minLength: 1
