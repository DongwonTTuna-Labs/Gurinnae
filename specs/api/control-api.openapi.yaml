openapi: 3.1.0
info:
  title: Gurine Control API
  version: 13.0.0
  description: Internal investigation, editorial and operations API. It is private to the Review Console BFF and accepts only
    request-bound actor assertions issued by the Identity API.
servers:
- url: https://control-api.internal.invalid
tags:
- name: agent
- name: audit
- name: budget
- name: case
- name: correction
- name: evidence
- name: job
- name: notification
- name: operations
- name: provider
- name: publication
- name: response
- name: review
- name: role
- name: rule
- name: saved-view
- name: signal
- name: source
- name: user
paths:
  /v1/internal/commands/accept-agent-suggestion:
    post:
      operationId: acceptAgentSuggestion
      tags:
      - operations
      summary: 제안 채택 기록
      description: 'Final v13 contract. Kind: COMMAND. Capability: cases.investigate. Review Console BFF supplies a request-bound
        actor assertion.'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acceptAgentSuggestionReceipt'
        '400':
          description: 'Problem response: INVALID_PARAMETER, INVALID_REQUEST'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - INVALID_PARAMETER
          - INVALID_REQUEST
        '401':
          description: 'Problem response: ACTOR_ASSERTION_REQUIRED, ACTOR_ASSERTION_INVALID, ACTOR_ASSERTION_EXPIRED, ACTOR_ASSERTION_AUDIENCE_MISMATCH,
            ACTOR_ASSERTION_REQUEST_MISMATCH'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - ACTOR_ASSERTION_REQUIRED
          - ACTOR_ASSERTION_INVALID
          - ACTOR_ASSERTION_EXPIRED
          - ACTOR_ASSERTION_AUDIENCE_MISMATCH
          - ACTOR_ASSERTION_REQUEST_MISMATCH
        '403':
          description: 'Problem response: CAPABILITY_DENIED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - CAPABILITY_DENIED
        '404':
          description: 'Problem response: RESOURCE_NOT_FOUND'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - RESOURCE_NOT_FOUND
        '409':
          description: 'Problem response: ACTOR_ASSERTION_REPLAYED, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - ACTOR_ASSERTION_REPLAYED
          - IDEMPOTENCY_CONFLICT
          - VERSION_CONFLICT
        '413':
          description: 'Problem response: PAYLOAD_TOO_LARGE'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - PAYLOAD_TOO_LARGE
        '415':
          description: 'Problem response: UNSUPPORTED_MEDIA_TYPE'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - UNSUPPORTED_MEDIA_TYPE
        '422':
          description: 'Problem response: PRECONDITION_FAILED, VALIDATION_FAILED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - PRECONDITION_FAILED
          - VALIDATION_FAILED
        '500':
          description: 'Problem response: INTERNAL_ERROR'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - INTERNAL_ERROR
        '503':
          description: 'Problem response: DEPENDENCY_UNAVAILABLE, DEPENDENCY_RATE_LIMITED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          x-error-codes:
          - DEPENDENCY_UNAVAILABLE
          - DEPENDENCY_RATE_LIMITED
      x-operation-kind: COMMAND
      x-capability: cases.investigate
      x-error-codes:
      - INVALID_PARAMETER
      - INVALID_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - PAYLOAD_TOO_LARGE
      - ACTOR_ASSERTION_REQUIRED
      - ACTOR_ASSERTION_INVALID
      - ACTOR_ASSERTION_EXPIRED
      - ACTOR_ASSERTION_AUDIENCE_MISMATCH
      - ACTOR_ASSERTION_REQUEST_MISMATCH
      - ACTOR_ASSERTION_REPLAYED
      - CAPABILITY_DENIED
      - IDEMPOTENCY_CONFLICT
      - VERSION_CONFLICT
      - RESOURCE_NOT_FOUND
      - PRECONDITION_FAILED
      - VALIDATION_FAILED
      - DEPENDENCY_UNAVAILABLE
      - DEPENDENCY_RATE_LIMITED
      - INTERNAL_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/acceptAgentSuggestionRequest'
      security:
      - ActorAssertion: []
      x-assurance-policy:
        mode: STATIC
        default: ACTIVE_SESSION
        conditions: []
        step_up_possible: false
      x-assurance-level: ACTIVE_SESSION
      x-step-up-required: false
