components:
  securitySchemes:
    ActorAssertion:
      type: apiKey
      in: header
      name: X-Gurine-Actor-Assertion
      description: Single-use Gurine actor assertion v1, bound to method, normalized path, canonical query and exact request-body
        SHA-256.
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      properties:
        actorType:
          type: string
        actorId:
          anyOf:
          - type: string
          - type: 'null'
        displayName:
          anyOf:
          - type: string
          - type: 'null'
        role:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - actorType
    AgentRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        agentType:
          type: string
        objective:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - BUDGET_BLOCKED
          - POLICY_BLOCKED
        evidenceScopeIds:
          type: array
          items:
            type: string
            format: uuid
        provider:
          anyOf:
          - type: string
          - type: 'null'
        model:
          anyOf:
          - type: string
          - type: 'null'
        output:
          anyOf:
          - type: string
          - type: 'null'
        citations:
          type: array
          items:
            type: string
            format: uuid
        unknowns:
          type: array
          items:
            type: string
        cost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - caseId
      - agentType
      - objective
      - status
      - evidenceScopeIds
      - citations
      - unknowns
    AgentRunResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
        summary:
          type: string
        data:
          $ref: '#/components/schemas/AgentRun'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
      - id
      - status
      - data
      - links
    Assignment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        objectType:
          type: string
        objectId:
          type: string
          format: uuid
        assignee:
          $ref: '#/components/schemas/ActorRef'
        assignedBy:
          $ref: '#/components/schemas/ActorRef'
        reason:
          anyOf:
          - type: string
          - type: 'null'
        assignedAt:
          type: string
          format: date-time
        dueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - objectType
      - objectId
      - assignee
      - assignedBy
      - assignedAt
    AuditEventsSearchResultAppliedFilters:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
        action:
          type: array
          items:
            type: string
        actorId:
          type: string
          format: uuid
        objectType:
          type: array
          items:
            type: string
        outcome:
          type: array
          items:
            type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditEventsSearchResultItem:
      $ref: '#/components/schemas/AuditSummary'
    AuditEventsSearchResultPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventsSearchResultItem'
        nextCursor:
          type: string
        totalApproximate:
          type: integer
          format: int64
        appliedFilters:
          $ref: '#/components/schemas/AuditEventsSearchResultAppliedFilters'
        asOf:
          type: string
          format: date-time
      required:
