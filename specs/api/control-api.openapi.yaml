          enum:
          - QUEUED
          - RUNNING
          - READY
          - FAILED
          - EXPIRED
        format:
          type: string
          enum:
          - CSV
          - JSONL
        scope:
          type: string
          enum:
          - CASE
          - OBJECT
          - GLOBAL
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        objectType:
          type:
          - string
          - 'null'
        objectId:
          type:
          - string
          - 'null'
        watermarkPolicy:
          type: string
          enum:
          - ACTOR_AND_TIME
          - CLASSIFICATION_BANNER
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type: string
          format: date-time
        rowCount:
          type:
          - integer
          - 'null'
          minimum: 0
        contentSha256:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        downloadUrl:
          type:
          - string
          - 'null'
          format: uri
        failureCode:
          type:
          - string
          - 'null'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
      - id
      - status
      - format
      - scope
      - from
      - to
      - objectType
      - objectId
      - watermarkPolicy
      - createdAt
      - startedAt
      - completedAt
      - expiresAt
      - rowCount
      - contentSha256
      - downloadUrl
      - failureCode
      - links
    AuditSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
