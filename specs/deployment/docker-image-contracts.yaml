schema_version: 1
specification_version: 13.0.0
status: FINAL
images:
- id: dev-toolchain
  dockerfile: infra/docker/dev/Dockerfile
  base:
  - rust:1.97.0-bookworm
  - oven/bun:1.3.14
  user: gurine
  required_tools:
  - cargo-nextest
  - cargo-watch
  - sqlx-cli 0.9.0
  - postgresql-client
  - git
  - ca-certificates
  release: false
- id: rust-services
  dockerfile: infra/docker/rust-service/Dockerfile
  targets:
  - public-api
  - control-api
  - submission-api
  - identity-api
  - ingest-worker
  - analysis-worker
  - projection-worker
  - notification-worker
  - workflow-worker
  - document-extractor
  - scheduler
  - migrator
  - egress-gateway
  - oidc-test-provider
  runtime_base: debian:bookworm-slim
  user: 65532:65532
  read_only: true
  healthcheck_binary: true
- id: svelte-bun
  dockerfile: infra/docker/svelte-bun/Dockerfile
  targets:
  - public-web
  - review-console
  - response-portal
  runtime_base: oven/bun:1.3.14-slim
  user: bun
  read_only: true
  start: bun /app/build/index.js
- id: postgres
  image: postgres:18.4-bookworm
  digest_source: infra/images.lock
  volume: /var/lib/postgresql
  pgdata: /var/lib/postgresql/18/docker
rules:
- All external base images are digest-pinned in the implementation release.
- BuildKit cache mounts may be used but never copied to runtime.
- No source credential or production .env is copied into an image.
- Runtime images contain only the required binary/build output, CA certificates and timezone data.
- Containers run non-root unless the upstream PostgreSQL image requires its documented user.
- Every first-party Compose service runs with `init: true`, `no-new-privileges`, all Linux capabilities dropped, and a `pids_limit` of 256. Upstream PostgreSQL, ClamAV, and telemetry images retain their documented entrypoint privileges.
- Runtime network access is limited to the explicitly declared Compose networks; `internal` and `data` networks remain externally unroutable.
- SBOM and vulnerability scan are attached to release evidence.
