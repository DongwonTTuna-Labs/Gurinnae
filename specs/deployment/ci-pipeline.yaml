schema_version: 1
specification_version: 13.0.0
status: FINAL
pipelines:
- name: static
  steps:
  - Biome check
  - OpenAPI lint
  - cargo clippy -D warnings
  - cargo fmt
  - duplicate-key contract parser canaries
  - first-party unsafe/panic/size gate
  - license policy
  - manifest/spec validation
  - secret scan
  - svelte-check
- name: contract
  steps:
  - PostgreSQL 18.4 migrations
  - cargo sqlx prepare --check
  - Rust OpenAPI generation
  - OpenAPI compatibility
  - four client generation diff
  - operation/route completeness
- name: test
  steps:
  - 300-case rule oracle comparison
  - Playwright 94-screen crawl
  - Rust integration
  - Rust unit/property
  - accessibility
  - agent deterministic provider-double evaluation
  - critical journey E2E
  - frontend unit/component
  - recorded connector contract fixtures
  - billing fixture-provider authentication and nonobservability
  - security/IDOR/CSRF
- name: container
  steps:
  - ClamAV quarantine flow
  - Compose startup
  - billing-gateway internal/data-only DISABLED and TEST_ONLY startup boundaries
  - OIDC egress flow
  - SBOM
  - egress channel isolation
  - graceful shutdown
  - multi-arch build
  - non-root/read-only test
  - restart persistence
  - vulnerability scan
- name: recovery
  steps:
  - backup
  - clean restore
  - audit/object hash verify
  - RPO/RTO receipt
- name: release
  steps:
  - all previous pipeline receipts
  - image digest lock
  - archive manifest
  - production preflight with test secrets
  - production rejection of billing TEST_ONLY mode, fixture keys and fixture payment token
  - signed provenance
merge_policy:
  required:
  - static
  - contract
  - test
  - container
  release_required:
  - static
  - contract
  - test
  - container
  - recovery
  - release
  skipped_required_test: failure
