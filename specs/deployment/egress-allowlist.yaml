schema_version: 1
specification_version: 13.0.0
status: FINAL
global_deny:
- private IPv4/IPv6
- loopback
- link-local
- multicast
- cloud metadata endpoints
- numeric IP literals
- DNS rebinding
- redirect outside channel allowlist
future_live_payment_provider:
  status: UNCONFIGURED
  runtime_channel_present: false
  fail_closed: All payment-provider network calls remain disabled in R6e.
  prerequisites:
  - separately approved live-provider contract
  - strong request-bound billing-gateway caller assertion verified by egress-gateway
  - dedicated egress-gateway channel with an environment-sourced host allowlist
  - merchant and webhook credentials owned only by egress-gateway
channels:
  source:
    callers:
    - ingest-worker
    schemes:
    - https
    hosts:
    - apis.data.go.kr
    - nopenapi.g2b.go.kr
    - opendart.fss.or.kr
    - ${ALIO_HOST}
    - ${LOCAL_FINANCE_HOST}
    - ${AUDIT_RESULTS_HOST}
    methods:
    - GET
    max_response_bytes: 52428800
  ai:
    callers:
    - analysis-worker
    schemes:
    - https
    hosts_from_env:
    - AI_PROVIDER_HOSTS
    methods:
    - POST
    conditional_methods:
    - method: GET
      provider: relay
      path: /v1/models
    max_response_bytes: 10485760
  smtp:
    callers:
    - notification-worker
    protocols:
    - smtp
    - smtps
    hosts_from_env:
    - SMTP_HOST
  object-store:
    callers:
    - workflow-worker
    - document-extractor
    schemes:
    - https
    hosts_from_env:
    - OBJECT_STORE_HOST
    methods:
    - GET
    - PUT
    - HEAD
    - DELETE
  oidc:
    callers:
    - identity-api
    schemes:
    - https
    hosts_from_env:
    - OIDC_ISSUER_HOST
    methods:
    - GET
    - POST
    development_schemes:
    - http
    development_hosts:
    - oidc-test-provider
