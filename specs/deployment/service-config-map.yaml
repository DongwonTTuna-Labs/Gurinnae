schema_version: 2
specification_version: 13.0.0
status: FINAL
rules:
- Every cataloged variable scoped to a first-party service is explicitly forwarded by Compose.
- Required-versus-conditional behavior is enforced again by service startup validation.
- Secrets are injected at runtime and never copied into images.
- Filesystem object and file-email adapters use named volumes.
