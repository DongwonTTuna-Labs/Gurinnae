  - OTEL_EXPORTER_OTLP_ENDPOINT
  - OTEL_EXPORTER_OTLP_HEADERS
  - SENTRY_DSN
  - TOKEN_HMAC_KEY
  - WORKFLOW_DATABASE_URL
  volumes:
  - gurine-objects:/var/lib/gurine-objects
internal_derived_variables:
- name: DATABASE_URL
  source: service-scoped external database variable
  scope: Rust services with PostgreSQL access
  rule: Compose maps exactly one service-specific *_DATABASE_URL into the process-local DATABASE_URL; it is not an operator-supplied
    additional setting.
- name: EGRESS_ALLOWLIST_PATH
  source: immutable container image configuration
  scope: egress-gateway
  rule: Fixed to /app/config/egress-allowlist.yaml and must not be overridden from .env or a secret manager.
