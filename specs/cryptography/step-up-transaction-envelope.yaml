schema_version: 1
specification_version: 13.0.0
status: FINAL
algorithm: ChaCha20-Poly1305 IETF (RFC 8439)
key_bytes: 32
nonce_bytes: 12
tag_bytes: 16
nonce_source: getrandom 0.4.3 OS CSPRNG; nonce reuse under one key is forbidden
key_id: first 16 lowercase hex characters of SHA-256(raw key)
base64url: RFC 4648 URL-safe without padding
maximum_encryptions_per_key: 16777216
current_previous_rotation: current encrypts; current and previous decrypt; unknown kid fails closed
decrypt_failure: AUTHENTICATED_DECRYPTION_FAILED without oracle detail
constant_time: crate AEAD verification; subtle 2.6.0 for explicit secret comparisons
wire_format: gurine-st-v1.<kid>.<nonceBase64Url>.<ciphertextAndTagBase64Url>
aad_ascii_nul_separated:
- gurine-st-v1
- cookie name
- exact lowercase origin without trailing slash
- /auth/step-up/callback
- Lax
cookie:
  name: gurine_step_up_transaction
  path: /auth/step-up/callback
  domain: absent/host-only
  httpOnly: true
  secure: true
  sameSite: Lax
  ttl_seconds: 600
payload_schema: step-up-transaction-payload.schema.json
test_vector: test-vectors/step-up-transaction-cookie.json
