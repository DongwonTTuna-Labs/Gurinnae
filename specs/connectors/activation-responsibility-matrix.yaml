schema_version: 1
specification_version: 13.0.0
status: FINAL
rules:
- API key alone is sufficient only for connectors marked KEY_ONLY_REST.
- Operator-managed manifests contain official URLs and checksums; they do not invent unofficial APIs.
- Synthetic structural fixtures can never satisfy production activation.
connectors:
- connector_id: koneps-contracts
  activation_mode: KEY_ONLY_REST
  credential_or_manifest_inputs:
  - official base URL
  - credential/API key
  - live preflight receipt
  synthetic_fixture_evidence: STRUCTURAL_ONLY
  production_activation_owner: operations
  failure_behavior: disable-only-this-connector
