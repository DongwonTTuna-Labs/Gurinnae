schema_version: 2
specification_version: 13.0.0
connector_id: audit-results
errors:
  schema_invalid: disable this manifest revision and retain last known good checkpoint
  host_not_allowlisted: deny fetch and open security incident
  hash_mismatch: quarantine bytes and open integrity incident
  content_type_mismatch: quarantine bytes
  '404': record incident; tombstone only when manifest explicitly marks deleted
  5xx: bounded retry
network: HTTPS only; redirects must remain on approved host or be denied
