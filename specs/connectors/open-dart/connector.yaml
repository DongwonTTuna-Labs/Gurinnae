schema_version: 2
specification_version: 13.0.0
id: open-dart
display_name: Open DART
status: FINAL
source_kind: OFFICIAL_REST_AND_ZIP_XML_API
official_reference: https://opendart.fss.or.kr/guide/main.do
base_url: https://opendart.fss.or.kr/api
credential_env: OPEN_DART_API_KEY
formats:
- json
- zip+xml
network: egress-gateway-only
schedule: ops.source_registry
