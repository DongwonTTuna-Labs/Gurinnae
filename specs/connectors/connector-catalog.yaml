activation_rule: Every connector ships an exact parser contract and structural fixtures. Production activation additionally writes a credentialed
  preflight receipt and live response fingerprint; failure disables only that connector.
activation_modes:
  KEY_ONLY_REST: official endpoint plus credential; code contains exact request/response mapping
  OFFICIAL_FIXED_LINK_OR_KEY: official fixed link or credentialed API selected by connector configuration
  OPERATOR_MANAGED_OFFICIAL_MANIFEST: operator supplies a manifest containing only official URLs, checksums, dates and source authority metadata
