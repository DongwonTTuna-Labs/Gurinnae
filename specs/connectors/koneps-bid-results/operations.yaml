- id: award-goods-search
  remote_operation: getScsbidListSttusThngPPSSrch
  path: /getScsbidListSttusThngPPSSrch
  business_type: goods
  kind: award-metadata
  method: GET
  request_parameters: *common_params
  pagination: *page_number
  remote_identity: &award_identity
    strategy: composite
    primary_fields: [bidNtceNo, bidNtceOrd, bidClsfcNo, rbidNo]
    composite_separator: '#'
  remote_revision: &award_revision
    strategy: first-non-empty-or-content-hash
    fields: [rgstDt, fnlSucsfDate, rlOpengDt]
  response_envelope: *response_envelope
  checkpoint: {partition: 'goods:award', watermark: inqryEndDt, overlap_minutes: 10}
  deletion_semantics: immutable award observations; absence from a page is never deletion
  contract_source: official-data-go-kr-15129397-operation-documentation
  normalization_boundary: &award_boundary
    admitted_metadata:
    - bidNtceNo
    - bidNtceOrd
    - bidClsfcNo
    - rbidNo
    - bidNtceNm
    - ntceDivCd
    - prtcptCnum
    - bidwinnrNm
    - bidwinnrBizno
    - sucsfbidAmt
    - sucsfbidRate
    - rlOpengDt
    - fnlSucsfDate
    - rgstDt
    - dminsttCd
    - dminsttNm
    - linkInsttNm
    identifier_storage: bidwinnrBizno is HMAC-SHA256; raw value remains only in immutable source bytes
    forbidden_normalized_fields: [fnlSucsfCorpOfcl, bidwinnrCeoNm, bidwinnrAdrs, bidwinnrTelNo]
    output_limit: immutable raw/parsed award metadata only until mapping activation; winner is not treated as the complete bidder set
  retry: *retry
