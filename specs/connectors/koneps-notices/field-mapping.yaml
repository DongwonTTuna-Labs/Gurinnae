schema_version: 2
specification_version: 13.0.0
connector_id: koneps-notices
mapping_mode: alias-list-validated-by-preflight
canonical_fields:
- canonical: source.external_id
  paths:
  - bidNtceNo
  - bidNtceOrd
  composition: bidNtceNo#bidNtceOrd
  required: true
- canonical: source.revision
  paths:
  - bidNtceChgOrd
  - chgDt
  - rgstDt
  fallback: canonical-content-sha256
  required: true
- canonical: notice.title
  paths:
  - bidNtceNm
  required: true
- canonical: notice.notice_number
  paths:
  - bidNtceNo
  required: true
- canonical: notice.notice_order
  paths:
  - bidNtceOrd
  required: true
- canonical: notice.published_at
  paths:
  - bidNtceDt
  required: false
- canonical: notice.close_at
  paths:
  - bidClseDt
  required: false
- canonical: notice.estimated_amount
  paths:
  - asignBdgtAmt
  - presmptPrce
  required: false
- canonical: agency.name
  paths:
  - ntceInsttNm
  - dminsttNm
  required: true
- canonical: agency.identifier
  paths:
  - ntceInsttCd
  - dminsttCd
  required: false
- canonical: notice.business_type
  constant_from_operation: business_type
  required: true
unknown_field_policy: preserve raw payload and provenance
missing_required_policy: quarantine record and open data-quality incident
preflight: A live recorded sample must resolve every required canonical field for every enabled operation.
