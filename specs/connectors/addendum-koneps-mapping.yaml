      - contract-goods-list
      - contract-construction-list
      - contract-service-list
      - contract-foreign-list
    selection: first valid non-empty in declared order
    paths: [rgstDt]
    business_dates_not_revision_time: [cntrctCnclsDate, cntrctDt, cntrctDate]
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  contract-goods-detail:
    operations: [contract-goods-detail]
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  contract-construction-detail:
    operations: [contract-construction-detail]
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  contract-service-detail:
    operations: [contract-service-detail]
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
