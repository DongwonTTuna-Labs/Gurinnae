    paths: [chgDt, rgstDt]
    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  contract-change:
    operations:
      - contract-goods-change
      - contract-construction-change
      - contract-service-change
      - contract-foreign-change
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  contract-delete:
    operations:
      - contract-goods-delete
      - contract-construction-delete
      - contract-service-delete
      - contract-foreign-delete
    selection: first valid non-empty in declared order
    paths: [dltDt, chgDt, rgstDt]
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  award-contract-conclusion:
    operations:
      - contract-goods-list
      - contract-goods-change
      - contract-construction-list
      - contract-construction-change
      - contract-service-list
      - contract-service-change
      - contract-foreign-list
      - contract-foreign-change
    selection: first valid non-empty in declared order
    paths: [cntrctCnclsDate, cntrctDt, cntrctDate]
    precision: DATE
    no_value: {emit: false, blocker: AWARD_EFFECTIVE_DATE_UNKNOWN}
  rules:
    - retrievedAt is observation time only and is never a fallback business effective time.
    - Checkpoint watermark is fetch orchestration state and is never a record effective time.
    - A later mapping activation does not rewrite a source event time.
    - As-of selection chooses the greatest known effective time not after asOf, then the declared external revision order, then recordDigest only to resolve a source tie.

field_mappings:
  ProcurementNoticeRevisionV1:
    operation_scope: notice_primary
    required:
      externalNoticeId:
        source_paths: [bidNtceNo, bidNtceOrd]
        transform: escaped composition with hash separator
      noticeNumber:
        source_paths: [bidNtceNo]
        transform: common string normalization
      noticeOrder:
        source_paths: [bidNtceOrd]
        transform: common string normalization preserving leading zeroes
      title:
        source_paths: [bidNtceNm]
        transform: common string normalization
      businessType:
        source: operation.business_type
        map: {goods: GOODS, construction: CONSTRUCTION, service: SERVICE, foreign: FOREIGN}
      agency.canonicalName:
        selection: first non-empty in declared order
        source_paths: [ntceInsttNm, dminsttNm]
        transform: agency candidate normalization; canonical agency binding requires verified identifier or human decision
    optional:
      agency.identifier:
        selection: first non-empty in declared order
        source_paths: [ntceInsttCd, dminsttCd]
      publishedAt: {source_paths: [bidNtceDt]}
      closesAt: {source_paths: [bidClseDt]}
      estimatedAmount:
        selection: first non-empty in declared order
        source_paths: [asignBdgtAmt, presmptPrce]
        money_rule: domestic business types use KRW; foreign requires an exact currency path or remains null
      procurementMethod:
        source_paths: []
        value: null
        limitation: PROCUREMENT_METHOD_NOT_MAPPED_BY_BASE_NOTICE_CONTRACT
      cancellationReason:
        source_paths: []
        value: null
    state_rules:
      - No notice delete operation exists in the base connector; absence from a page or reconciliation never creates DELETED.
      - A change record appends a new revision. It never updates the prior notice row.
      - Supplemental records can contribute provenance only after exact notice external identity and revision/as-of resolution.

  SupplierIdentityCandidateV1:
    operation_scope:
      - contract-goods-list
      - contract-goods-change
      - contract-construction-list
      - contract-construction-change
      - contract-service-list
      - contract-service-change
      - contract-foreign-list
      - contract-foreign-change
    name:
      selection: first structurally singular non-empty in declared order
      source_paths: [corpNm, cntrctCorpNm]
      required_for_candidate: true
    identifiers:
      business_number:
        selection: first non-empty in declared order
        source_paths: [bizno, corpBizno]
        storage: HMAC-SHA256 with the configured supplier-identifier key; raw value is never stored in domain/audit/log/analytics
        scheme: KOREAN_BUSINESS_NUMBER
        verification_status: UNVERIFIED until exact source and checksum/authority checks pass
    opaque_party_list:
      source_path: corpList
      behavior: preserve raw bytes and locator only
      forbidden: [delimiter_guess, regex_split, one-name-assumption, winner-count-inference, bidder-count-inference]
      blocker: KONEPS_CORP_LIST_PARSER_NOT_PINNED
    candidate_identity:
      formula: SHA256(GURINE_CANONICAL_JSON_V1 of connectorId, sourceDocumentId, recordIndex, name locator digest, sorted identifier HMACs)
      initial_status: CANDIDATE when a name exists; UNVERIFIED when only an opaque list exists and no candidate row is emitted

  AwardRevisionV1:
    operation_scope: domain_output_allowlist.AwardRevisionV1.operations
    required:
      externalAwardId:
        selection: first non-empty in declared order
        source_paths: [dcsnCntrctNo, untyCntrctNo, cntrctNo]
      noticeRevision:
        notice_number:
          selection: first non-empty in declared order
          source_paths: [bidNtceNo, ntceNo]
        notice_order:
          source_paths: [bidNtceOrd]
          required: true
        external_notice_id:
          formula: escaped(notice_number) + '#' + escaped(bidNtceOrd)
        resolution: >-
          Resolve exactly one notice root by the complete external notice identity
          (notice number plus bidNtceOrd), then select the greatest known revision
          effective not after the contract-conclusion date. Missing bidNtceOrd,
          number-only matches, multiple roots, unknown effective time, or digest
          conflict suppresses Award output with zero Award rows.
      noticeIdentity:
        noticeNumber: selected noticeRevision.notice_number
        noticeOrder: exact bidNtceOrd
        externalNoticeId: selected noticeRevision.external_notice_id
        noticeRevision: byte-equal to AwardRevisionV1.noticeRevision
      awardBasis:
        constant: CONTRACT_CONCLUSION
      awardedAt:
        selection: first valid non-empty in declared order
        source_paths: [cntrctCnclsDate, cntrctDt, cntrctDate]
      winners:
        source: structurally mapped SupplierIdentityCandidateV1 rows from the same record
        minimum: 1
    optional:
      awardedAmount:
        selection: first non-empty in declared order
        source_paths: [thtmCntrctAmt, totCntrctAmt, cntrctAmt]
        money_rule: common money normalization
    coverage:
      status: PARTIAL
      mandatory_limitations:
        - CONTRACT_CONCLUSION_IS_NOT_COMPLETE_AWARD_EVALUATION
        - LOSING_BIDDERS_AND_RANKS_NOT_AVAILABLE

  BidderParticipationRevisionV1:
    operation_scope: []
    exact_mapping_status: NOT_AVAILABLE
    output_rows: 0
    blocker: BIDDER_PARTICIPATION_COVERAGE_UNAVAILABLE
    prohibited_inferences:
      - Treating a notice as one bidder.
      - Treating every contract party as an independent bidder.
      - Treating the award winner as the complete bidder set.
      - Deriving valid bidder count from supplier count, contract count, or missing rows.
      - Treating no mapped records as zero bidders or no competition.
    future_change_rule: >-
      A future authority revision must name an official operation, exact request and
      response schema, effective dates, participant identity, status/rank semantics,
      credential/rights activation, fixtures, counts, and hard gates together. This
      addendum does not pre-authorize that feature.

  ProcurementContractRevisionV1:
    operation_scope: contract_primary
    required_non_delete:
      externalContractId:
        selection: first non-empty in declared order
        source_paths: [untyCntrctNo, cntrctNo]
      title:
        source_paths: [cntrctNm]
      businessType:
        source: operation.business_type
        map: {goods: GOODS, construction: CONSTRUCTION, service: SERVICE, foreign: FOREIGN}
      agency.canonicalName:
        selection: first non-empty in declared order
        source_paths: [cntrctInsttNm, dminsttNm]
    optional:
      contractNumber:
        selection: first non-empty in declared order
        source_paths: [dcsnCntrctNo, untyCntrctNo, cntrctNo]
      agency.identifier:
        selection: first non-empty in declared order
        source_paths: [cntrctInsttCd, dminsttCd]
      suppliers:
        source: SupplierIdentityCandidateV1 rows from the same record
        empty_behavior: allowed with coverage PARTIAL and SUPPLIER_IDENTITY_NOT_STRUCTURED
      noticeRevision:
        notice_number:
          selection: first non-empty in declared order
          source_paths: [bidNtceNo, ntceNo]
        notice_order:
          source_paths: [bidNtceOrd]
        external_notice_id:
          formula: escaped(notice_number) + '#' + escaped(bidNtceOrd)
        resolution: >-
          exact unique root by number plus bidNtceOrd and exact revision as-of the
          contract revision effective time; missing order, number-only ambiguity,
          or unknown as-of selection remains null with a limitation
      awardRevision:
        source: AwardRevisionV1 emitted from the same source record
        null_behavior: allowed with AWARD_NOT_STRUCTURED
      procurementMethod:
        source_paths: [cntrctCnclsMthdNm]
      signedAt:
        selection: first valid non-empty in declared order
        source_paths: [cntrctCnclsDate, cntrctDt, cntrctDate]
      startsAt:
        source_paths: [cbgnDate, wbgnDate]
      endsAt:
        selection: first valid non-empty in declared order
        source_paths: [ttalCcmpltDate, ttalScmpltDate, thtmCcmpltDate, thtmScmpltDate]
      currentAmount:
        selection: first non-empty in declared order
        source_paths: [thtmCntrctAmt, totCntrctAmt, cntrctAmt]
        money_rule: common money normalization
      originalAmount:
        source: earliest proven complete revision currentAmount
        null_behavior: null unless revision one and complete history are proven
      currency:
        source: selected MoneyV1 currency; XXX only when every amount is null and currency is unknown
    delete_mapping:
      operations:
        - contract-goods-delete
        - contract-construction-delete
        - contract-service-delete
        - contract-foreign-delete
      state: DELETED
      required_fields: [externalContractId, effectiveTime]
      preserved_fields: exact prior revision values plus deletion source provenance
      forbidden: creating an empty contract, deleting prior bytes, or treating list absence as deletion
    revision_rules:
      - List, change, and delete records append revisions under one root selected only by connectorId plus externalContractId.
      - Same title, party, amount, or date cannot join roots.
      - A change with no exact predecessor is preserved as an orphan source record but emits no amendment and blocks complete-history rules.

  ContractAmendmentRevisionV1:
    operation_scope:
      - contract-goods-change
      - contract-construction-change
      - contract-service-change
      - contract-foreign-change
    required:
      externalAmendmentId:
        formula: SHA256(GURINE_CANONICAL_JSON_V1 of connectorId, externalContractId, externalRevision, recordDigest)
      contractBefore:
        source: exact predecessor ProcurementContractRevisionV1
      contractAfter:
        source: ProcurementContractRevisionV1 emitted from the same change record
      amendmentSequence:
        source: contractAfter.revision minus one
      changedAt:
        selection: first valid non-empty in declared order
        source_paths: [chgDt, rgstDt]
    derived_from_exact_adjacent_revisions:
      previousAmount: contractBefore.currentAmount
      newAmount: contractAfter.currentAmount
      previousEndAt: contractBefore.endsAt
      newEndAt: contractAfter.endsAt
    optional:
      reason:
        source_paths: [baseDtls]
      amendmentKind:
        derivation: compare closed material fields between before and after; multiple changed families yields MULTIPLE; no provable family yields UNKNOWN
    completeness:
      COMPLETE_requires:
        - revision one is present
        - every source change between revision one and current is present exactly once
        - every revision has known effective time or a provider revision order that proves adjacency
        - each adjacent digest and source locator validates
      otherwise: PARTIAL with REVISION_CHAIN_INCOMPLETE

detail_field_mappings:
  contract-goods-detail:
    target: exact ProcurementContractRevisionV1 plus line item
    fields:
      classification: [prdctClsfcNo, prdctIdntNo, prdctClsfcNoNm]
      description: [krnPrdctNm]
      unitPrice: [qtyUprcAmt]
      quantity: [prdctQty]
      totalPrice: [prdctAmt]
      deliveryCondition: [dlvryCndtnCd, dlvryCndtnNm]
      deliveryDays: [dlvrDaynum]
      deliveryDeadline: [dlvrTmlmt]
  contract-foreign-detail:
    target: exact ProcurementContractRevisionV1 plus line item
    fields:
      classification: [adiPrdctClsfcNo, prdctClsfcNo, prdctIdntNo, prdctClsfcNoNm]
      description: [krnPrdctNm]
      unitPrice: [qtyUprcAmt]
      quantity: [prdctQty]
      totalPrice: [prdctAmt]
      currency: [prdctAmtCrncy]
      deliveryCondition: [dlvryCndtnCd, dlvryCndtnNm]
      deliveryDays: [dlvrDaynum]
      deliveryDeadline: [dlvrTmlmt]
  contract-construction-detail:
    target: exact ProcurementContractRevisionV1 plus typed construction detail
    rule: Only fields explicitly present in the approved live preflight schema are mapped; no goods-field alias is reused by name similarity.
  contract-service-detail:
    target: exact ProcurementContractRevisionV1 plus typed service detail
    rule: Only fields explicitly present in the approved live preflight schema are mapped; no goods-field alias is reused by name similarity.
  common_rules:
    - A detail record resolves contract root only by exact contract external identity.
    - If multiple contract revisions are eligible, source detail chgDt/rgstDt selects exact as-of revision; unknown or ambiguous selection quarantines the detail.
    - Quantity, unit price, total, VAT, currency, delivery, and classification remain separate fields with separate locators.

identity_and_assertion_boundaries:
  koneps_supplier_candidates:
    - KONEPS party data creates candidates, not verified canonical suppliers.
    - A verified business-number HMAC can support a human merge decision only when the raw source and authority checks are themselves verified.
    - Opaque corpList, shared representative text, or same normalized name cannot support automatic merge, relationship, ownership, or management assertions.
  assertions:
    - The two KONEPS connectors do not directly map ownership, beneficial ownership, control, management role, or legal representative assertions in this version.
    - Such assertions may be created only through the domain assertion operation with exact verified evidence locators and human decision receipts.
    - No KONEPS field name or contracted-party relationship is re-labelled as ownership or control.

rule_input_fences:
  PRICE_OUTLIER:
    requires: exact contract/line-item revisions, unit, VAT, bundle and comparable coverage
  CONTRACT_SPLITTING_PATTERN:
    requires: complete contract window and verified supplier identity history
  REPEATED_SINGLE_SOURCE:
    requires: complete method/date/amount window and verified supplier identity history
  SUPPLIER_CONCENTRATION:
    requires: complete denominator and merge/split history
  LOW_BID_COMPETITION:
    outcome_without_other_authorized_source: BLOCKED
    blocker: BIDDER_PARTICIPATION_COVERAGE_UNAVAILABLE
  RESTRICTIVE_SPECIFICATION:
    outcome_without_complete specification and bidder source: BLOCKED
    blocker: BIDDER_PARTICIPATION_COVERAGE_UNAVAILABLE
  CONTRACT_AMENDMENT_ESCALATION:
    requires: complete adjacent contract/amendment chain and known currency
  YEAR_END_SPENDING_SPIKE:
    requires: complete twelve-month contract/correction coverage in Asia/Seoul
  NEW_SUPPLIER_DEPENDENCE:
    requires: verified supplier identity, verified incorporation date from an authorized source, and complete denominator
  SHARED_SUPPLIER_IDENTITY:
    requires: two distinct verified candidates, strong identifier provenance, and complete contract context
  universal_rule: A missing fence produces BLOCKED with a typed reason; it never produces NO_SIGNAL or a zero metric.

deletion_and_reconciliation:
  notice:
    explicit_delete_operation: false
    absence_behavior: no state change
  contract:
    explicit_delete_operations:
      - contract-goods-delete
      - contract-construction-delete
      - contract-service-delete
      - contract-foreign-delete
    effect: append DELETED tombstone revision linked to the exact prior digest
  reconciliation:
    - Pagination must complete with one stable source-run identity before absence is evaluated.
    - An interrupted, quota-limited, schema-drifted, or partially paginated run has UNKNOWN coverage and cannot produce tombstones.
    - A tombstone never deletes raw bytes, prior normalized revisions, evidence, snapshots, signals, cases, responses, or publications.
    - A deletion affecting a public revision creates correction-impact work; it does not silently update public projection.

receipts:
  normalization_receipt:
    required_fields:
      - connectorId
      - operationId
      - sourceDocumentId
      - sourceAssetId
      - sourceAssetRevision
      - sourceContentSha256
      - parsedRecordId
      - recordIndex
      - externalId
      - externalRevision
      - recordDigest
      - mappingVersion
      - mappingEffectiveFrom
      - outputObjectType
      - outputRevisionId
      - outputRevision
      - outputRecordDigest
      - fieldProvenanceSetDigest
      - coverageStatus
      - blockers
      - terminalAuditEventId
      - receiptDigest
    exact_replay: returns the first stored receipt byte-for-byte
    changed_bytes: SOURCE_REVISION_CONFLICT with zero output rows
  blocked_receipt:
    required_fields:
      - all input/source identities from normalization_receipt
      - requestedOutputObjectType
      - blockers
      - zeroOutputRows
      - terminalAuditEventId
      - receiptDigest
    invariant: zeroOutputRows is the literal integer zero and no output ID/revision is synthesized.

