schema_version: 1
specification_version: 13.0.0-procurement-addendum
status: REVIEW_REQUIRED
implementation_state: OPEN_IMPLEMENTATION
purpose: >-
  Make the existing v13 KONEPS notice and contract connectors produce exact,
  revision-linked procurement facts without inventing award, bidder, supplier,
  amount, time, or deletion semantics that the upstream record does not provide.

authority:
  sole_pack_sha256: 960687b445edee3b8fbf7186152cc9a53d835ca8ba55eb49dd957424142802e5
  domain_contract: specs/domain/addendum-procurement-domain.yaml
  base_connectors:
    koneps-notices:
      connector: specs/connectors/koneps-notices/connector.yaml
      operations: specs/connectors/koneps-notices/operations.yaml
      field_mapping: specs/connectors/koneps-notices/field-mapping.yaml
      official_reference: https://www.data.go.kr/data/15129394/openapi.do
    koneps-contracts:
      connector: specs/connectors/koneps-contracts/connector.yaml
      operations: specs/connectors/koneps-contracts/operations.yaml
      field_mapping: specs/connectors/koneps-contracts/field-mapping.yaml
      official_reference: https://www.data.go.kr/data/15129427/openapi.do
  rule: >-
    The URLs identify the already-declared upstream contracts. This addendum does
    not authorize scraping, a seventh connector, a new credential, or an
    undeclared remote operation.

mapping_version:
  id: koneps-procurement-revision-v1
  state: PENDING_APPROVAL
  implementation_state: OPEN_IMPLEMENTATION
  contract_digest: __MAPPING_CONTRACT_DIGEST_PENDING__
  contract_digest_algorithm: >-
    lowercase SHA-256 of GURINE_CANONICAL_JSON_V1 over this complete YAML
    document after removing only mapping_version.contract_digest
  activation_receipt_schema: specs/domain/addendum-procurement-domain.yaml#/schemas/KonepsMappingActivationReceiptV1
  activation_receipt_state: MISSING
  effective_from_source: exact approved schema-mapping activation receipt
  activation_requirements:
    - Every enabled base operation passes credentialed preflight with a recorded response fingerprint.
    - Every required path below is observed with its declared type or the operation remains disabled.
    - JSON and XML representations of the same synthetic/live-authorized sample normalize to the same record digest.
    - Mapping version, mapping contract digest, activation receipt ID/digest, effectiveFrom, and superseded mapping digest are persisted.
    - Replaying historical raw bytes uses the mapping version selected explicitly by the replay request; it never uses a mutable current mapping implicitly.
  forbidden_activation_claims:
    - A structural synthetic fixture does not prove a production field path.
    - Connector health does not prove notice, award, bidder, contract, amendment, or identity coverage.
    - A source timestamp is not the mapping effectiveFrom and a mapping effectiveFrom is not a procurement event time.
  activation_binding:
    - The receipt mappingVersion equals id and mappingContractDigest equals contract_digest byte-for-byte.
    - The receipt has exactly one successful credentialed preflight run for every one of the 33 base operations.
    - fixtureManifestDigest equals the frozen deterministic fixture manifest digest and every required fixture entry is FROZEN.
    - effectiveFrom is supplied by the approval receipt; source event, retrieval, file mtime, commit, or fixture time cannot substitute.
    - State remains PENDING_APPROVAL and normalization emits zero domain rows while activation_receipt_state is MISSING or invalid.

record_envelopes:
  json:
    header_result_code: /response/header/resultCode
    header_result_message: /response/header/resultMsg
    item_shapes:
      - /response/body/items/{index}
      - /response/body/items/item/{index}
    locator_kind: JSON_POINTER
  xml:
    header_result_code: /response/header/resultCode
    header_result_message: /response/header/resultMsg
    item_shape: /response/body/items/item[{one_based_index}]
    locator_kind: XML_XPATH
  invariants:
    - Exactly one declared item shape is selected for a response and recorded in parser metadata.
    - Record index is zero-based in ParsedRecord and converts to one-based XML predicates only in the locator.
    - resultCode other than the base connector's success code produces zero normalized facts and follows the existing error policy.
    - Unknown fields remain in immutable raw bytes; no unknown field enters a typed fact until a later approved mapping version names it.

operation_sets:
  notice_primary:
    - notice-goods-list
    - notice-goods-search
    - notice-goods-change
    - notice-construction-list
    - notice-construction-search
    - notice-construction-change
    - notice-service-list
    - notice-service-search
    - notice-service-change
    - notice-foreign-list
    - notice-foreign-search
    - notice-foreign-change
  notice_supplemental:
    - notice-goods-base-amount
    - notice-construction-base-amount
    - notice-service-base-amount
    - notice-license-restriction
    - notice-region-eligibility
  contract_primary:
    - contract-goods-list
    - contract-goods-change
    - contract-goods-delete
    - contract-construction-list
    - contract-construction-change
    - contract-construction-delete
    - contract-service-list
    - contract-service-change
    - contract-service-delete
    - contract-foreign-list
    - contract-foreign-change
    - contract-foreign-delete
  contract_detail:
    - contract-goods-detail
    - contract-construction-detail
    - contract-service-detail
    - contract-foreign-detail
  all_notice_operations:
    - notice-goods-list
    - notice-goods-search
    - notice-goods-change
    - notice-construction-list
    - notice-construction-search
    - notice-construction-change
    - notice-service-list
    - notice-service-search
    - notice-service-change
    - notice-foreign-list
    - notice-foreign-search
    - notice-foreign-change
    - notice-goods-base-amount
    - notice-construction-base-amount
    - notice-service-base-amount
    - notice-license-restriction
    - notice-region-eligibility
  all_contract_operations:
    - contract-goods-list
    - contract-goods-detail
    - contract-goods-change
    - contract-goods-delete
    - contract-construction-list
    - contract-construction-detail
    - contract-construction-change
    - contract-construction-delete
    - contract-service-list
    - contract-service-detail
    - contract-service-change
    - contract-service-delete
    - contract-foreign-list
    - contract-foreign-detail
    - contract-foreign-change
    - contract-foreign-delete
  set_equality:
    - all_notice_operations equals the 17 IDs in specs/connectors/koneps-notices/operations.yaml.
    - all_contract_operations equals the 16 IDs in specs/connectors/koneps-contracts/operations.yaml.
    - notice_primary and notice_supplemental are a disjoint exact partition of all_notice_operations.
    - contract_primary and contract_detail are a disjoint exact partition of all_contract_operations.

domain_output_allowlist:
  ProcurementNoticeRevisionV1:
    operations: notice_primary
    emit_when: all identity and required business fields validate
  AwardRevisionV1:
    operations:
      - contract-goods-list
      - contract-goods-change
      - contract-construction-list
      - contract-construction-change
      - contract-service-list
      - contract-service-change
      - contract-foreign-list
      - contract-foreign-change
    emit_when: >-
      an exact notice revision is resolved, an exact contract conclusion number
      or contract identity exists, at least one supplier party is structurally
      mapped without parsing an opaque corpList, and the conclusion date is known
    award_basis: CONTRACT_CONCLUSION
    mandatory_limitation: >-
      This fact proves only a contracted party and contract-conclusion record; it
      does not prove the complete award evaluation, losing bidders, bid rank, or
      participant count.
  BidderParticipationRevisionV1:
    operations: []
    emit_when: never under the two base connectors
    coverage_status: NOT_AVAILABLE
    blocker: BIDDER_PARTICIPATION_COVERAGE_UNAVAILABLE
    reason: >-
      Notice records and contracted-party fields do not enumerate every bidder,
      submission, validation, withdrawal, rank, or losing outcome. Inferring a
      participant from an award winner or contract party is prohibited.
  ProcurementContractRevisionV1:
    operations: contract_primary
    emit_when: external contract identity, title for non-delete records, and agency identity validate
  ContractAmendmentRevisionV1:
    operations:
      - contract-goods-change
      - contract-construction-change
      - contract-service-change
      - contract-foreign-change
    emit_when: exact predecessor and resulting contract revisions are both present and the change order is reproducible
  detail_operation_rule: >-
    contract_detail operations produce typed line-item/field-provenance members
    bound to an exact ProcurementContractRevisionV1. They never create an
    independent contract, award, amendment, or bidder record.
  supplemental_notice_rule: >-
    notice_supplemental operations produce typed source observations bound to an
    exact notice revision. They never overwrite a notice revision or create a new
    notice solely because a base amount, license restriction, or region record
    arrived.

common_normalization:
  strings:
    trim: Unicode whitespace at both ends only
    empty: null before required-field validation
    unicode: NFC
    forbidden: [NUL, unpaired-surrogate]
  identifiers:
    preserve_leading_zeroes: true
    case_normalization: none unless the source field contract declares it
    composition_separator: '#'
    escaping: each component uses UTF-8 percent encoding for literal percent and hash before composition
  booleans:
    accepted_true: [Y]
    accepted_false: [N]
    any_other_value: INVALID_SOURCE_VALUE
  numbers:
    accepted_lexeme: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    separators: prohibited
    exponent: prohibited
    negative_money: prohibited
  dates:
    timezone_for_naive_values: Asia/Seoul
    formats_by_declared_precision:
      DATE: [yyyyMMdd, yyyy-MM-dd]
      MINUTE: [yyyyMMddHHmm, yyyy-MM-dd HH:mm]
      SECOND: [yyyyMMddHHmmss, yyyy-MM-dd HH:mm:ss]
    invalid_or_ambiguous: EFFECTIVE_TIME_UNKNOWN
    rule: Date-only values remain dates; a midnight instant is never synthesized.
  money:
    domestic_operations: [goods, construction, service]
    domestic_default_currency: KRW
    foreign_currency_paths: [thtmCntrctAmtCrncy, totCntrctAmtCrncy, cntrctAmtCrncy]
    unknown_currency_rule: >-
      For foreign operations an amount without an exact currency field is not
      normalized as MoneyV1. The raw amount remains provenance and coverage is
      PARTIAL with CURRENCY_UNKNOWN.
    vat_basis: UNKNOWN unless an exact mapped source field states otherwise
  provenance:
    every_material_field: required
    locator_digest: >-
      SHA256(GURINE_CANONICAL_JSON_V1 of sourceAssetId,
      sourceAssetRevision, sourceContentSha256, media type, item shape, record
      index, source field, and rawValueSha256)
    transformation_version: koneps-procurement-revision-v1

source_revision_identity:
  koneps-notices:
    external_id:
      required_paths: [bidNtceNo, bidNtceOrd]
      value: escaped(bidNtceNo) + '#' + escaped(bidNtceOrd)
    external_revision:
      selection: first non-empty in declared order
      paths: [bidNtceChgOrd, chgDt, rgstDt]
      fallback: lowercase record content SHA-256
    duplicate_key: [connectorId, externalId, externalRevision, recordDigest]
    conflict_key: [connectorId, externalId, externalRevision]
  koneps-contracts:
    external_id:
      selection: first non-empty in declared order
      paths: [untyCntrctNo, cntrctNo]
      required: true
    external_revision:
      selection: first non-empty in the operation-kind-specific declared order
      paths_by_operation_kind:
        list: [cntrctChgOrd, chgDt, rgstDt]
        detail: [cntrctChgOrd, chgDt, rgstDt]
        change: [cntrctChgOrd, chgDt, rgstDt]
        delete: [dltDt, chgDt, rgstDt]
      fallback: lowercase record content SHA-256
    duplicate_key: [connectorId, externalId, externalRevision, recordDigest]
    conflict_key: [connectorId, externalId, externalRevision]
  rules:
    - Exact duplicate keys are idempotent and return the first normalization receipt.
    - A conflict key with a different recordDigest is quarantined as SOURCE_REVISION_CONFLICT.
    - A content-hash fallback is an observed source-revision token, not a business effective date.
    - RecordDigest covers the complete closed parsed record plus source document/content identity and mapping version.

effective_time_mappings:
  notice-list-or-search:
    operations:
      - notice-goods-list
      - notice-goods-search
      - notice-construction-list
      - notice-construction-search
      - notice-service-list
      - notice-service-search
      - notice-foreign-list
      - notice-foreign-search
    selection: first valid non-empty in declared order
    paths: [bidNtceDt, rgstDt]
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  notice-change:
    operations:
      - notice-goods-change
      - notice-construction-change
      - notice-service-change
      - notice-foreign-change
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  notice-goods-base-amount:
    operations: [notice-goods-base-amount]
    selection: first valid non-empty in declared order
    paths: [chgDt, rgstDt]
    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  notice-construction-base-amount:
    operations: [notice-construction-base-amount]
