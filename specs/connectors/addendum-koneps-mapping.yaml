acceptance_binding_invariants:
  expected_feature: tests/acceptance/procurement-domain-addendum.feature
  exact_count: 20
  exact_order: AC-PROCUREMENT-DOMAIN-001 through AC-PROCUREMENT-DOMAIN-020 ascending
  stability_rule: Existing IDs, scenario titles, order and semantic ownership are immutable; strengthening steps does not allocate or renumber an ID.
  set_equality:
    - acceptance_bindings equals the domain addendum scenario_ids.
    - acceptance_bindings equals every scenario-id marker in expected_feature exactly once.
    - Every binding has one executable Rust acceptance test with the same zero-padded suffix before status can become FINAL.

verification_requirements:
  - Parse this file and both base operation catalogs with duplicate-key rejection.
  - Prove operation set equality and disjoint partitions.
  - Prove effective_time_mappings partitions all 17 notice and all 16 contract operations exactly once, including each of the five supplemental notice and four contract detail operations.
  - Prove every domain output points to a schema in specs/domain/addendum-procurement-domain.yaml.
  - Run JSON and XML golden fixtures for every operation class, including missing field, malformed date, duplicate replay, changed-byte conflict, partial page, quota, opaque corpList, delete, and orphan change.
  - Recompute mapping_version.contract_digest after removing only that field, validate the exact activation receipt binding, then recompute the frozen fixture manifest digest.
  - Prove BidderParticipation output count is zero for every base KONEPS fixture and both dependent rules are BLOCKED, never NO_SIGNAL.
  - Prove no raw supplier identifier, corpList, provider key, URL token, or contact value appears in domain rows, receipts, logs, metrics, traces, audit detail, or public projection.
