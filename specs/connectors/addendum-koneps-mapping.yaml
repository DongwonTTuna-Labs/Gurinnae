    precision_by_accepted_lexeme: {yyyyMMddHHmm: MINUTE, yyyyMMddHHmmss: SECOND}
    no_value: {status: UNKNOWN, blocker: EFFECTIVE_TIME_UNKNOWN}
  notice-license-restriction:
    operations: [notice-license-restriction]
