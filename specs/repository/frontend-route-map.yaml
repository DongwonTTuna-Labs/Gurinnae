schema_version: 1
specification_version: 13.0.0
status: FINAL
rules:
- Every screen has a concrete SvelteKit page file, server load/action file, view model and tests.
- Catch-all system error rendering uses [...systemPath] and may not intercept a more specific route.
- Control and submission clients are imported only from server-side files.
- Route files may share components but may not collapse different screen contracts into a generic placeholder.
routes:
- screen_id: PUB-001
  surface: public
  route: /
  app: apps/public-web
  page: apps/public-web/src/routes/+page.svelte
  server_load_or_actions: apps/public-web/src/routes/+page.server.ts
  layout: apps/public-web/src/routes/+layout.server.ts
  error_boundary: apps/public-web/src/routes/+error.svelte
  view_model: apps/public-web/src/lib/view-models/pub-001.ts
  e2e: tests/e2e/screens/pub-001.spec.ts
  visual: tests/visual/pub-001.spec.ts
