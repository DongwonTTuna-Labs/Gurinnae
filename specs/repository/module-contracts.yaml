schema_version: 3
specification_version: 13.0.0
status: FINAL
dependency_direction:
- domain <- application/publication-policy
- application ports <- persistence/connectors/email/object-store/auth/egress adapters
- services compose crates; business rules do not live in handlers
- SvelteKit apps consume generated clients only through handwritten server-only wrappers
