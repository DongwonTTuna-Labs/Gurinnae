- operation_id: acceptAgentSuggestion
  api: control-api
  method: POST
  path: /v1/internal/commands/accept-agent-suggestion
  kind: COMMAND
  capability: cases.investigate
  request_schema: acceptAgentSuggestionRequest
  response_schema: acceptAgentSuggestionReceipt
  success_status: 200
  consuming_screens:
  - CAS-011
  handler: services/control-api/src/service/domains/agents/mod.rs
  application: crates/application/src/commands/accept_agent_suggestion.rs
  integration_test: tests/integration/api/control-api/accept_agent_suggestion.rs
  generated_client: packages/api-client-control/src/generated/
  contract_test: tests/contract/control-api/accept_agent_suggestion.spec.ts
  repository_methods:
  - AgentSuggestionRepository::accept
  statements:
  - verb: SELECT_FOR_UPDATE
    relation: ops.agent_suggestions
    purpose: lock pending suggestion
    expected_rows: exactly-one
    identity_predicate: id = :suggestionId
    version_predicate: version = :expectedVersion
  - verb: UPDATE
    relation: ops.agent_suggestions
    purpose: mark accepted with decision reason
    expected_rows: exactly-one
    version_predicate: version = :expectedVersion
    identity_predicate: id = :suggestionId
    version_mutation: version = version + 1
  domain_events:
  - agent.suggestion_accepted.v1
  integration_events: []
  audit_action: command.acceptAgentSuggestion
  concurrency:
    mode: OPTIMISTIC
    version_field: expectedVersion
    guard_relation: ops.agent_suggestions
    guard_identity_predicate: id = :suggestionId
    guard_version_predicate: version = :expectedVersion
    mutation_relation: ops.agent_suggestions
    mutation_identity_predicate: id = :suggestionId
    success_effect: increment version by exactly one; DELETE commands delete exactly one current version
    zero_rows_resolution:
      probe: read identity without version predicate
      missing_error: RESOURCE_NOT_FOUND
      existing_error: VERSION_CONFLICT
    version_mutation: version = version + 1
    request_placeholders:
    - expectedVersion
    - suggestionId
    context_placeholders: []
    guard_columns:
    - id
    - version
    mutation_columns:
    - id
    - version
  auth: actor-assertion-and-capability
  assurance_policy:
    mode: STATIC
    default: ACTIVE_SESSION
    conditions: []
    step_up_possible: false
  assurance_level: ACTIVE_SESSION
  step_up_required: false
