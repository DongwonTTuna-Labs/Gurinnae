schema_version: 1
specification_version: 13.0.0
status: FINAL
authority: This contract is the sole authority for browser-to-BFF and BFF-to-Submission-API credentials.
boundary:
  browser_direct_submission_api_access: false
  submission_api_public_ingress: false
  bff_callers:
  - public-web
  - response-portal
  bff_authentication:
    scheme: Gurine Service Assertion v1
    header: X-Gurine-Service-Assertion
    audience: submission-api
    issuers:
    - public-web
    - response-portal
    ttlSeconds: 30
    singleUse: true
    requestBound: true
    replayGuard: ops.assertion_replay_guard
  scoped_session_header: X-Gurine-Submission-Session
  raw_one_time_token_transport: request body of a BFF-only exchange operation; never a Submission API URL path/query
opaque_session_token:
  randomBytes: 32
  encoding: base64url-no-padding
  databaseStorage: SHA-256 lowercase hex only
  rawStorage: authenticated-encrypted BFF cookie only
  rotation: rotate on assurance promotion and final receipt transition
  logging: forbidden
session_kinds:
  RESPONSE_PENDING:
    ttlSeconds: 900
    scope: one response request
    allowedOperations:
    - getResponseAccessStatus
    - verifyResponseAccess
  RESPONSE_ACTIVE:
    ttlSeconds: 43200
    scope: one response request
    allowedOperations:
    - getResponseAccessStatus
    - getResponseRequest
    - downloadResponseRequest
    - getResponseDraft
    - saveResponseDraft
    - createResponseAttachmentUpload
    - finalizeResponseAttachment
    - deleteResponseAttachment
    - getResponseSubmissionPreview
    - requestResponseExtension
    - submitResponse
  CORRECTION_DRAFT:
    ttlSeconds: 86400
    scope: one correction draft
    allowedOperations:
    - getCorrectionRequestDraft
    - saveCorrectionRequestDraft
    - deleteCorrectionRequestDraft
    - createCorrectionAttachment
    - finalizeCorrectionAttachment
    - deleteCorrectionAttachment
    - getCorrectionRequestDraftPreview
    - createCorrectionRequest
  SUBSCRIPTION_PENDING:
    ttlSeconds: 1800
    scope: one pending subscription
    allowedOperations: []
  SUBSCRIPTION_MANAGEMENT:
    ttlSeconds: 1800
    scope: one subscription
    allowedOperations:
    - getSubscription
    - updateSubscription
    - unsubscribe
  RESPONSE_RECEIPT:
    ttlSeconds: 1800
    scope: one response submission receipt
    allowedOperations:
    - getResponseReceipt
  CORRECTION_RECEIPT:
    ttlSeconds: 1800
    scope: one correction request receipt
    allowedOperations:
    - getCorrectionReceipt
cookies:
  response:
    name: gurine_response_session
    path: /respond
    sessionKinds:
    - RESPONSE_PENDING
    - RESPONSE_ACTIVE
  correction:
    name: gurine_correction_session
    path: /correction-request
    sessionKinds:
    - CORRECTION_DRAFT
  subscription:
    name: gurine_subscription_session
    path: /subscription
    sessionKinds:
    - SUBSCRIPTION_PENDING
    - SUBSCRIPTION_MANAGEMENT
  responseReceipt:
    name: gurine_response_receipt_session
    path: /respond/receipt
    sessionKinds:
    - RESPONSE_RECEIPT
  correctionReceipt:
    name: gurine_correction_receipt_session
    path: /correction-request/receipt
    sessionKinds:
    - CORRECTION_RECEIPT
cookie_defaults:
  domain: absent-host-only
  httpOnly: true
  secureInProduction: true
  sameSite: Lax
  cryptographyContract: specs/cryptography/submission-session-cookie-envelope.yaml
  payloadSchema: specs/cryptography/submission-session-cookie-payload.schema.json
browser_csrf:
  mechanism: synchronizer-token
  rawTokenLocation: sealed BFF cookie only
  formTransport: hidden field or X-CSRF-Token to same-origin BFF
  rotation:
  - session creation
  - session kind promotion
  - successful state-changing submission
  submissionApiConcern: false
magic_link_exchange:
  bffRouteRules:
  - query token is accepted only on a dedicated exchange route
  - 'Cache-Control: no-store'
  - 'Referrer-Policy: no-referrer'
  - query value is redacted from access logs and traces
  - BFF posts token in the body to a service-asserted exchange operation
  - BFF sets a sealed scoped cookie and returns 303 to a token-free canonical URL
  - raw token is atomically consumed and cannot be replayed
flows:
  response:
  - /respond/access?token=<one-time>
  - exchangeResponseAccessToken -> RESPONSE_PENDING
  - 303 /respond/access
  - verifyResponseAccess(emailOtp) -> rotate RESPONSE_ACTIVE
  - token-free response workflow
  - submitResponse -> revoke active session and issue RESPONSE_RECEIPT
  correction:
  - createCorrectionRequestDraft(abuseProof) -> CORRECTION_DRAFT
  - save/upload/finalize/preview under scoped session
  - createCorrectionRequest(expectedVersion) atomically finalizes draft, moves clean attachments, revokes draft session and issues
    CORRECTION_RECEIPT
  - receipt email link uses /correction-request/receipt/exchange?token=<one-time>, then 303 /correction-request/receipt
  subscription:
  - createSubscription(abuseProof) -> PENDING + verification email
  - verifySubscription(verificationToken) -> consume token and issue SUBSCRIPTION_MANAGEMENT
  - management link uses /subscription/manage/exchange?token=<one-time>, exchangeSubscriptionManagementToken, then 303 /subscription/manage
  receipts:
  - email receipt links use one-time BFF exchange operations
  - receipt sessions are read-only and expire after 30 minutes
anonymous_abuse_control:
  requiredOperations:
  - createContactRequest
  - createCorrectionRequestDraft
  - createDatasetExport
  - createSubscription
  requestField: abuseProof
  BFFChecks:
  - same-origin CSRF
  - origin allowlist
  - per-IP and per-destination rate limits
  SubmissionApiChecks:
  - service assertion
  - challenge token verification through configured adapter
  - idempotency
forbidden:
- browser sends service assertion
- browser calls Submission API origin
- raw bearer token in Submission API path/query/cookie
- Submission API sets browser cookies
- BFF logs raw token or scoped session token
- session crosses scopeId/sessionKind/bffIssuer
- final submit leaves draft session active
