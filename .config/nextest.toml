[test-groups]
r6e-postgresql = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(gurine-acceptance-tests) & test(/^ac_business_model_04[2-8]$/)'
test-group = 'r6e-postgresql'

[profile.acceptance]
retries = 0
fail-fast = true
status-level = "all"
final-status-level = "all"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.acceptance.junit]
path = "target/nextest/acceptance/junit.xml"
store-success-output = true
store-failure-output = true
